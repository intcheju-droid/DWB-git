     (단위：원)\n                                  재원별\n    구 분       사업비 합계                                 비고\n                            국비    지방비         자부담\n   예산액(A)\n   집행액(B)\n                                                    이자 발생액\n 집행잔액(A-B)\n                                                    (   원)\n* 이자 발생액 처리：시･도 계좌에서 계류 중 발생한 이자만 기재(보건복지부 반납분)"}]}, {"title": "Ⅴ. 장애인 체육시설 운영", "start": 351, "end": 355, "subs": [], "pages": [{"p": 351, "t": "                                  Ⅴ. 장애인 체육시설 운영\n\n\n    Ⅴ    장애인 체육시설 운영\n\n\n1   목적\n\n장애인이 체육활동을 통하여 체력증진 또는 신체적인 기능회복과 재활을 지원\n하고 사회통합을 목적으로 설치된 장애인체육시설의 관리 운영에 관하여 필요한\n사항을 정함.\n2 법적근거\n｢장애인복지법｣ 제28조 및 제29조, 제58조, ｢장애인 건강권 및 의료접근성\n보장에 관한 법률｣ 제15조\n\n3 시설 설치 시 유의사항\n\n○ 장애인체육관의 설치 계획시에는 건축물의 연면적은 장애인복지법시행규칙\n    제41조 및 제42조 관련 별표 5에 의거 최소 900㎡ 이상으로 하되, 체육프로그램\n    및 공간상의 특수성과 지역장애인의 이용도 등을 고려하여 설치함으로써 건립\n    예산의 과도한 부담이 되지 않도록 하여야 함.\n\n\n4 이용대상\n\n○ 장애인체육시설의 이용자는 장애인복지법 제2조의 규정에 의한 장애인이어야\n    함. 다만, 장애인의 사회통합과 해당 지역사회와의 유대강화를 위해 지역 주민이\n    함께 이용토록 하여 사회통합에 기여하게 할 수 있음. 또한 장애인복지법\n    제2조의 규정에 의한 장애인은 아니지만 전문의 소견이 있거나 체육시설 평가\n    결과 서비스지원이 필요한 경우도 이용가능 함."}, {"p": 352, "t": "  - 장애인의 이용률 또는 장애인을 위한 프로그램 비율을 50% 이상 높일 수\n       있도록 노력\n  - 통합이 가능한 장애인은 사회통합과 평생체육을 위하여 통합프로그램(장애인\n       및 비장애인)으로 적극 권유하거나 지역공공체육시설로 연계 노력\n\n ○ 장애인체육관 설립 목적의 범위 내에서 장애인체육관련 각종 국제대회 파견\n      및 국내 주요 대회 참가선수 훈련 시 적극 개방\n\n\n 5 주요 사업\n\n 장애인체육시설은 다음 표와 같은 사업을 수행하여야 하며 시설의 특성에 따라\n 사업 분야를 탄력적으로 운영할 수 있음\n※ 장애인체육시설의 주요사업\n 구 분      사 업 분 야                   사 업 내 용\n                    기획･홍보, 조직･인사, 총무･회계, 장애인권익지원, 윤리경영,\n  1       운영지원사업\n                    고객지원(안내), 고객복리후생(구내식당, 매점, 휴게실 등) 등\n                    전기설비･영선 등 기관실관리, 상하수 및 수질관리, 소방안전,\n  2       시설관리사업    장애인편의증진시설관리, 셔틀차량운행, 시설환경관리(탈의실, 미화,\n                    주차관리) 등\n                    운동상담, 신체측정평가 및 재활체육계획수립 등\n                    - 재활운동(특수체육, 맞춤형 개별운동 등)\n  3       재활체육사업\n                    - 수중재활(뇌병변, 척수손상, 관절질환 등)\n                    - 수중운동(심리수중운동, 아쿠아로빅 등)\n                    기초체력증진(헬스장), 종목별 장애인생활체육 프로그램 운영,\n  4       생활체육사업    어울림생활체육 프로그램 운영, 각종생활체육대회 개최 및\n                    참가지원 등\n                    여행지원, 계절스포츠캠프, 각종문화여가 및 행사지원,\n  5       문화여가사업\n                    체험행사지원 등\n                    시설대관, 체육동호회지원, 찾아가는 체육서비스,\n  6      지역연계체육사업\n                    자원개발(후원, 자원봉사자, 재능기부) 등\n                    발달재활서비스, 장애인 건강권법(재활운동 및 체육),\n  7      사회서비스사업\n                    스포츠강좌이용권 등"}, {"p": 353, "t": "                                                        Ⅴ. 장애인 체육시설 운영\n\n\n6 조직 및 직제\n\n ○ 장애인체육시설은 지역의 여건 및 이용자의 특성을 감안하여 서비스를 효과적\n      으로 제공할 수 있도록 아래와 같이 ‘장애인체육시설의 조직 및 직제기준’을\n      준용하여 편제\n\n ○ 장애인체육시설의 직제는 관장, 사무국장, 일반직(1~5급), 기능직 및 고용직\n     으로 구성\n ○ 각 팀은 사업의 특수성에 따라 4~6개 범위 내에서 구성(필요에 따라 부(部)를\n      둘 수 있음)\n ○ 부서 명칭 등은 해당 지방자치단체장과 협의하여 사업특성에 맞게 정할 수\n      있음.\n※ 장애인체육시설의 조직 및 직제기준\n     가형 체육시설) 5,000㎡ 이상(1국 6팀)\n\n                                          관장\n\n                                        사무국장\n\n\n팀명     운영지원팀       시설관리팀        생활체육팀          재활체육팀      건강지원팀       지역연계체육팀\n\n주요                                                       5. 문화여가사업\n      1. 운영지원사업   2. 시설관리사업   4. 생활체육사업    3. 재활체육사업                 6. 지역연계체육사업\n기능                                                      7. 사회서비스사업\n\n\n     나형 체육시설) 3,000㎡ 이상(1국 5팀)\n                                          관장\n\n                                          사무국장\n\n\n팀명       운영지원팀          시설관리팀           생활체육팀           재활체육팀          건강지원팀\n\n                                                                       5. 문화여가사업\n주요\n       1. 운영지원사업      2. 시설관리사업      4. 생활체육사업         3. 재활체육사업     6. 지역연계체육사업\n기능\n                                                                      7. 사회서비스사업"}, {"p": 354, "t": "     다형 체육시설) 2,000㎡ 이상(1국 4팀)\n                                  관장\n\n                                  사무국장\n\n\n 팀명       운영지원팀        생활체육팀              재활체육팀       건강지원팀\n\n                                                      5. 문화여가사업\n 주요      1. 운영지원사업\n                      4. 생활체육사업          3.재활체육사업   6. 지역연계체육사업\n 기능      2. 시설관리사업\n                                                     7. 사회서비스사업\n\n\n 7    운영비\n\n ○ 운영비는 교부세, 지방비 및 자체수입(이용료, 후원금, 법인전입금 등) 20%를\n      원칙으로 함.\n\n ○ 장애인 이용증대와 효율적인 시설운영을 위해 자체수입으로 정원 외 직원\n      인건비 및 운영비를 충당할 수 있음.\n\n ○ 체육관련인력과 같이 사회복지시설 관리안내에서 정한 기준을 적용할 수 없는\n      경우에는 개별시설 또는 지방자치단체가 보수기준을 따로 정하여 예산의 범위\n      안에서 지급할 수 있음.\n\n\n 8 이용료 징수\n\n ○ 이용료는 지방자치단체 위탁 운영시설의 경우 해당 자치단체장이 정하고, 법인\n      운영시설의 경우 자체 관련 규정에 의함.\n\n ○ 이용료의 사용\n\n     - 장애인체육시설의 이용료 수입금은 반드시 법인회계와 별도로 장애인체육\n      시설수입과 지출예산에 편성하고 그에 따라 집행하여야 하며, 운영비를\n      충당하고 수익이 발생한 시설에서는 수익금의 전부를 체육시설 운영개선 및\n      장애인이용률 제고를 위한 부분에 지출하여야 함"}, {"p": 355, "t": "                            Ⅴ. 장애인 체육시설 운영\n\n\n9 행정 및 안전사항\n\n○ 장애인복지･체육관련 행정기관 및 시설･단체 등과 긴밀한 협력체계를 구축\n 하여 사업수행의 효과성 극대화\n\n○ 장애인복지시설에 해당하는 장애인체육시설은 ｢체육시설설치･운영에 관한\n 법률｣에서 정한 시설 및 안전, 위생 규정 등을 준용하여 운영하되, 수영장의\n 경우 수상안전요원을 감시탑에 배치하여야 하나 시설의 특성상 이용객의\n 안전을 최우선 고려하여 안전요원을 입수 또는 근접 배치할 수 있음."}]}, {"title": "Ⅵ. 시각장애인(플러스) 지원센터 운영", "start": 356, "end": 359, "subs": [], "pages": [{"p": 356, "t": "     Ⅵ     시각장애인+(플러스) 지원센터 운영\n\n\n 1    목적\n\n 시각장애인 등에게 이동지원서비스를 지원하고, 지역사회 거주 시각장애인 등을\n 적시에 발굴하여 재활상담, 보행･점자･정보화 등 교육, 일상생활기술 훈련 등\n 개인별 맞춤 복지서비스를 제공함으로써 시각장애인 등의 사회활동 기회를 확\n 대하기 위한 시각장애인+(플러스) 지원센터(이하 “센터”라 한다) 운영에 필요한\n 사항을 정함.\n\n\n 2 운영주체\n\n 사단법인 한국시각장애인연합회(이하 “연합회”라 한다) 및 시･도지부, 시･군･구\n 지회(동 단체가 사업을 수행할 수 없는 불가피한 사유가 있는 경우에는 자치단\n 체장이 따로 정할 수 있음)\n\n\n 3 기본방침\n\n ○ 센터는 장애인복지법 제58조제2항에 따른 장애인 지역사회재활시설이므로,\n     센터 운영주체인 연합회 및 시･도지부(시･군･구 지회)의 법인 운영 체계와는\n     엄격하게 분리하고, 재무회계도 법인 운영과 구분된 독립채산제에 의하여 운영\n     - 또한, 재무회계관리에 있어서는 공통지침상의 장부를 비치하고 차량운행 및\n      유지관리에 관한 차량운행일지 및 이용예약 관계일지 등은 상시 기록 비치\n      ※ 센터의 차량은 해당 센터 업무외 사용금지\n\n ○ 센터는 사업의 특성상 차량관리규정 등 자체운영 규정을 마련하여 운용하고,\n     운전원은 안전운행 및 이용승객의 안전보호에 각별히 유의"}, {"p": 357, "t": "                        Ⅵ. 시각장애인+(플러스) 지원센터 운영\n\n\n○ 기타 사항은 ｢해당 지자체 장애인지역사회시설 설치･운영(공통)｣ 지침을 마련\n 하여 동 지침에 의함.\n\n\n4 이용대상\n\n이용대상은 센터가 소재한 지역의 장애인복지법 제32조에 의한 등록장애인을\n우선으로 하되, 인근 지역 장애인의 요청이 있는 경우 센터 업무의 특별한 사정이\n없는 한 이용할 수 있도록 지원 (※ 다만, 지자체의 실정에 따라 이용 장애인의             제3장\n\n유형과 등급을 제한할 수 있음)\n5 사업내용\n○ 시각장애인 등에게 이동서비스를 지원하고, 지역사회 거주 시각장애인 등을\n 적시에 발굴하여 재활상담, 보행･점자･정보화 등 교육, 일상생활기술 훈련\n 등 개인별 맞춤 복지서비스를 제공\n\n\n6 센터의 조직 및 인력\n\n○ 센터는 연합회 중앙회에 ‘중앙센터’와 실제 센터의 업무를 수행 중인 연합회\n 각 시･도지부(시･군･구 지회)에 ‘지방센터’를 두고 다음과 같은 업무를 수행\n\n- 중앙센터(연합회 중앙회의 통상적인 지원조직이며, 장애인복지시설이 아님)\n\n  ∙ 사업의 기획 및 평가, 지방센터에 대한 자체 관리･감독\n\n  ∙ 센터의 운영규정, 차량관리규정 등 각종 내부 규정 제정 및 개폐\n\n  ∙ 사업실적 관리\n\n  ∙ 기타 센터 업무의 중요한 사항"}, {"p": 358, "t": "  - 지방센터(지역별로 운영 중인 센터, 장애인복지시설임)\n\n    ∙ 센터사업의 수행\n\n    ∙ 사업실적 및 보고(자치단체장과 중앙센터) 등\n\n ○ 센터 인력 지원 기준\n\n  - 6명[센터장 1인, 사무원 1인, 상담원 1인, 운전원 또는 보행지도사 3인]\n    * 장애인복지법 시행규칙 [별표 5] 종사자 배치기준(운전원 또는 보행지도사를 포함한 3명 이상)은\n        반드시 준수\n\n  - 인원증원이 필요한 경우 지방비 및 자체수입으로 증원할 수 있음.\n\n  - 다만, 특별시, 광역시 센터의 경우 지자체 실정에 맞게 정원 및 세부 직책별\n    배정 인원을 결정할 수 있음.\n\n ○ 센터(지방센터) 및 분소 설치\n\n  - 해당 연합회 시･도지부장은 지역장애인의 분포율, 차량지원이 필요한 시간\n    등을 고려하여 당해 시･도지사 및 시･군･구청장과 협의하여 분소 설치의\n    수, 인력 배치, 운행시간 및 운영방식 등에 관하여 센터정원의 범위내에서\n    센터와 분소간의 사업수행인력을 탄력적으로 조정이 가능함.\n\n    ∙ 다만, 서울특별시 및 6대 광역시의 경우에는 분소 없이 통합하여 1개소로\n        운영\n\n  - 이에 따른 신규 센터 및 분소의 소재지 지정과 인력 조정 등에 관한 구체적인\n    결과를 해당 시･도지사가 보건복지부장관에게 보고\n\n ○ 센터의 인력별 주요 업무\n\n  ① 센터장：센터를 대표하고 사무를 총괄\n\n  ② 사무원：센터의 조직, 인사, 재무회계 등 사무 전반에 관한 사항\n\n  ③ 상담원：이용장애인의 차량이용 관련 상담 및 복지서비스 상담, 연계,\n    지원전반에 관한 사항"}, {"p": 359, "t": "                          Ⅵ. 시각장애인+(플러스) 지원센터 운영\n\n\n    ④ 운전원(보행지도사)：차량운행을 통한 이동서비스 제공, 일상생활지원 등에\n     관한 사항\n\n    ⑤ 분소장：분소의 인원이 6명 미만인 경우에 센터장 및 상담원의 역할을\n     담당하되, 보수는 센터장에 준함\n\n○ 센터 인력 중 센터장을 제외한 사무원, 상담원 및 운전원은 운영주체인 연합회\n    및 시･도지부(시･군･구지회 포함) 임직원이 겸직할 수 없음.\n\n7    운영비 등\n○ 운영비는 지방비로 하되, 자체수입(이용료, 후원금, 법인 전입금 등)을 추가할\n    수 있음.\n○ 보수는 당해연도 ’사회복지시설 종사자 인건비 가이드라인’에서 정한 사회복지\n    이용시설(장애인) 종사자 보수체계에 의하여 지급하며, 센터장 및 직원의 보수와             시\n    수당에 대하여는 해당 지자체와 협의 후 별도 기준을 정할 수 있음."}]}, {"title": "Ⅶ. 중앙수어통역센터 운영", "start": 360, "end": 363, "subs": [], "pages": [{"p": 360, "t": "     Ⅶ    중앙수어통역센터 운영\n\n\n 1   목적\n\n ○ 수어통역에 관한 정책･제도의 조사 및 관련 시설의 운영지침 수립 및 관련\n     전문인력 양성 등의 업무를 수행하는 중앙수어통역센터(이하 ʻʻ중앙센터ʼʼ라\n     한다) 운영에 필요한 사항을 정함\n\n\n 2 법적근거\n\n ○ 장애인복지법 제62조의2\n\n\n 3 사업주체\n\n ○ 중앙센터의 업무에 필요한 전문인력과 시설을 갖춘 공공기관 또는 비영리법인\n     (이하‘수탁기관’)을 공모･선정하여 위탁\n\n\n 4 기본방침\n\n ○ 중앙센터는 전국 수어통역센터(이하 ʻʻ센터ʼʼ라 한다)의 중앙 역할을 하며 센터\n     운영지침을 마련하고 센터의 운영과 발전을 통하여 수어통역 서비스 이용자인\n     청각･언어장애인의 복지증진에 기여한다.\n\n ○ 중앙센터는 수어통역에 관한 전문인력 양성을 위한 교육의 체계적이고 지속적인\n     시스템 구축을 위해 노력해야 한다."}, {"p": 361, "t": "                            Ⅶ. 중앙수어통역센터 운영\n\n\n5 인력기준\n\n○ 5명(중앙수어통역센터장 1인, 종사자 4인(청각장애인통역사 1인 포함)\n\n- 인력 증원이 필요한 경우 복지부와 협의하여 증원할 수 있다.\n\n○ 중앙수어통역센터 운영을 위탁받은 수탁기관에서 중앙수어통역센터의 업무를\n 전담하는 인력은 상근해야 하며, 중앙수어통역센터 업무 외 수탁기관의 다른\n 업무를 겸직할 수 없음\n○ 인력별 주요업무\n\n① 중앙수어통역센터장: 중앙센터를 대표하고 사무를 총괄한다.\n② 종사자: 수어통역에 관한 정책･제도의 조사 및 연구, 지역 수어통역센터             지\n  센터의 표준 업무 매뉴얼 개발 및 보급, 지역 수어통역센터 사업 실적 관리           사\n  및 평가, 지역 수어통역센터 종사자 직무 교육 등\n\n6 종사자 채용\n\n○ 센터장 및 직원은 인사위원회를 구성하여 공개 채용하여 배치하는 것을 원칙\n 으로 함\n\n- 인사위원회의 구성 및 운영에 관한 사항은 중앙수어통역센터 운영 규정에\n  포함하여야 함\n\n- 장애인 대상 학대 및 성범죄 사건이 발생하여 수사 기관에 수사 등으로 사회적\n  으로 문제가 된 자의 경우 채용 불가\n\n○ 채용 관련 보고\n\n- 센터장 및 직원을 채용을 하는 경우 채용 계획 수립 전 보건복지부장관과\n  협의하고, 채용 결과는 즉시 보건복지부장관에 보고하여야 함\n\n- 센터장 및 직원 면직 시 즉시 보건복지부장관에게 보고하여야 함"}, {"p": 362, "t": " 7    운영위원회 운영\n\n ○ 운영위원회는 위원장 1인을 포함하여 5인으로 구성하여야 하며, 위촉 전 보건\n     복지부장관과 협의하여야 함\n\n     - 위원회의 위원은 법인 임직원 1인, 지역수어통역센터장 1인, 보건복지부\n      공무원 1인, 외부 전문가 2인으로 구성함(교수, 장애인복지시설 종사자 등\n      으로 구성하되, 수어통역센터 종사자 제외)\n\n ○ 중앙수어통역센터는 운영위원회를 통해 별도의 운영 규정을 마련하여 복지부\n     장관의 승인을 받아야 함(개정 시에도 동일)\n\n\n 8 사업내용\n\n     - 수어통역에 관한 정책･제도의 조사 및 연구\n\n     - 센터의 표준 업무 매뉴얼 개발 및 보급\n\n     - 센터의 사업 실적 관리 및 평가\n\n     - 센터 종사자 직무 교육\n\n     - 기타 보건복지부장관이 수어통역서비스의 공공성 제고를 위해 필요하다고\n      인정하는 사업\n\n\n 9 사업의 보고\n\n ○ 중앙수어통역센터는 매년 사업계획서를 수립하여, 전년도 12월 31일까지\n     보건복지부장관에 보고 후 승인을 받아야 한다. 사업계획서에는 다음의 내용을\n     포함하여야 한다.\n\n     - 인사･조직관리에 관한 사항\n\n     - 사업 내용 및 성과 목표 등 세부사업계획서"}, {"p": 363, "t": "                             Ⅶ. 중앙수어통역센터 운영\n\n\n - 중앙수어통역센터 운영위원회 및 인사위원회 구성 등 운영에 관한 사항\n  (지역수어통역센터 제외)\n\n - 수입･지출예산서\n\n - 중앙수어통역센터 종사자 필수교육 이행 계획\n\n - 그 밖에 보건복지부장관이 필요하다고 인정하는 내용\n\n○ 중앙수어통역센터는 매년 상반기 추진실적을 7월 15일까지 보건복지부 장관\n  에게 보고하여야 하며, 회계연도 종료 후 2개월 내에 전년도 사업실적보고서           제3장\n  및 감사보고서 등을 제출하여야 한다.\n10 운영비 등\n○ 운영비는 국고보조금으로 하되, 자체수입을 추가할 수 있다.\n○ 보수는 당해연도 ʻ사회복지시설 종사자 인건비 가이드라인ʼ에서 정한 사회복지            시\n  이용시설(장애인) 종사자 보수체계에 의하여 지급하며, 기타 인건비 지급 관련\n  내규는 복지부의 승인을 받아야 한다.\n\n\n11 위탁 해지\n\n○ 위탁계약기간 중이라도 다음 어느 하나에 해당하는 경우 위탁을 해지하거나\n  수탁기관을 변경할 수 있음\n - 보조금을 지정 외 다른 용도로 사용한 경우\n - 허위 신청이나 기타 부정한 방법으로 보조금을 교부받은 경우\n - 법령(규정), 지침, 보조금 교부결정의 내용 또는 법령에 의한 보건복지부\n  장관의 처분을 위반한 경우\n - 그 밖에 보건복지부 장관이 위탁을 해지하거나 수탁기관을 변경해야 할\n  중대하고 불가피한 사유가 있다고 판단한 경우"}]}, {"title": "Ⅷ. 수어통역센터 운영(지역)", "start": 364, "end": 369, "subs": [], "pages": [{"p": 364, "t": "     Ⅷ     수어통역센터 운영(지역)\n\n\n 1    목적\n\n 의사소통에 지장이 있는 청각･언어장애인에 대한 수어통역 및 상담서비스를\n 제공함으로써 원활한 일상생활 및 사회생활을 도모하기 위한 수어통역센터(이하\n “센터”라 한다)운영에 필요한 사항을 정함.\n\n\n 2 설치･운영 주체\n\n ○ 지방자치단체\n\n     - 지방자치단체가 설치한 센터는 사회복지법인 또는 비영리법인에 위･수탁\n      가능하며, 위탁시 공개모집에 의해 수탁자 선정 운영\n\n ○ 사회복지법인 및 비영리법인 등\n     ※ 광역(시･도) 또는 시･군･구 단위로 설치 가능하나 센터 간 업무 범위는 자치단체장과 협의하여\n       조정\n     ※ 신규 센터 개소 또는 폐지 시 운영주체는 그 결과를 중앙 수어통역센터(이하“중앙센터”라 한다)에\n       즉시 통보\n\n\n 3 명칭 사용\n\n ○ 센터는 아래의 명칭을 사용하여야 하며, 설치･운영 법인의 명칭은 혼용 금지\n\n     - 광역 : ○○○○(시･도명) 수어통역센터\n     ※ 센터의 기능 등을 고려하여 ‘○○○○(시･도명) 수어통역지원센터’ 명칭 사용 가능(지자체와 협의)\n\n     - 기초 : ○○○(시･군･구명) 수어통역센터"}, {"p": 365, "t": "                                 Ⅷ. 수어통역센터 운영(지역)\n\n\n4 기본방침\n\n○ 센터는 장애인복지법 제58조제2항에 따른 장애인 지역사회재활시설이므로\n 소유와 경영 분리의 원칙에 따라 운영주체인 법인 등의 운영 체계와는 엄격\n 하게 분리하고, 재무회계도 독립채산제에 의하여 운용\n\n- 또한, 재무회계 관리에 있어서는 공통지침상의 장부를 비치하고 차량운행\n  및 유지관리에 관한 차량운행일지 및 수어통역 관계일지 등은 상시 기록 비치\n○ 센터는 시설 운영위원회를 통해 운영 규정 및 수어통역업무처리규정 등 자체\n 운영 규정을 마련하여 자치단체장(시･도지사 또는 시･군･구청장)에게 보고\n 하여야 함(개정 시에도 동일)\n- 자치단체장은 운영 규정에 개선할 사항이 있다고 판단되는 경우 개선 요구를\n  할 수 있으며, 개선 요구사항에 대해 수어통역센터는 개선 조치를 하고 그\n  결과를 보고하여야 함.\n\n  * 운영 규정에는 외부 기관에서 의뢰하는 수어통역서비스 제공으로 발생하는 수입금 관리 사항\n    및 인사위원회 구성에 관한 내용을 반드시 포함하여야 함\n\n○ 수어통역사는 청각･언어장애인의 원활한 의사소통을 위하여 각별히 노력\n\n○ 기타 사항은 ｢해당 지자체 장애인지역사회시설 설치･운영(공통)｣ 지침을 마련\n 하여 동 지침에 의함\n\n\n5 이용 대상\n\n○ 이용대상은 장애인복지법 제32조에 따라 센터가 소재한 지역의 등록청각･\n 언어장애인을 우선으로 하되, 다음 각호의 1에 해당하는 자의 요청이 있는\n 경우 특별한 사정이 없는 한 이용할 수 있도록 지원\n\n  1. 센터 소재지 외의 인근 지역 등록청각･언어장애인"}, {"p": 366, "t": "      2. 청각･언어장애민원인과 업무적으로 의사소통을 할 필요가 있는 관내 주요\n        관공서\n      3. 기타 청각･언어장애인과 의사소통이 필요한 일반 개인 등\n\n\n 6 사업내용\n\n ○ 청각･언어장애인 상담지도：개별상담(접수, 의료, 직업, 일반상담) 및 사후관리\n\n ○ 출장 수어통역서비스 제공：각종 민원해결(법률･취업･관공서 이용), 가족문제\n     상담, 심리적 부적응에 대한 출장 서비스\n\n ○ 기타 예산의 범위 내에서 수어교육 및 보급사업 및 청각･언어장애인의 복지\n     증진을 위한 사업\n\n\n 7    센터의 인력\n\n가. 종사자의 자격 기준\n\n     ※ ’26.4.15.부터 채용하는 인력에 대해 적용한다.\n\n ○ 자격 기준\n\n     구분                            자격 기준\n              다음 어느 하나에 해당하는 사람\n              가) 「사회복지사업법」 제11조에 따른 사회복지사 자격증을 취득한 이후 장애인 관련\n     센터장         사회복지사업에 5년 이상 종사한 경력이 있는 사람\n              나) 한국수어통역사 자격증 또는 청각장애인통역사 자격증을 취득한 이후 5년 이상\n                 수어통역 실무를 담당한 경력이 있는 사람\n  수어통역사       한국수어통역사 자격증을 취득한 사람\n  청각장애인\n              청각장애인통역사 자격증을 취득한 사람\n   통역사\n* 센터장을 제외한 종사자 채용 시 자격증(한국수어통역사 및 청각장애인통역사) 미취득자는 수어통역 업무 경력 및\n  교육 과정 이수 여부 등을 종합적으로 고려하여 적합하다고 인정되는 경우, 자격증 취득 유예기간을 부여하는 조건\n  으로 인사위원회의 의결을 거쳐 채용할 수 있다."}, {"p": 367, "t": "                                    Ⅷ. 수어통역센터 운영(지역)\n\n\n나. 종사자 채용\n\n○ 채용 원칙\n\n - 센터의 모든 종사자(센터장 포함)의 채용은 공개모집에 따른 공개경쟁이 원칙\n\n○ 센터장 인사위원회 구성 주체\n\n - 지자체 직영운영 시 : 자치단체가 ‘인사위원회’를 구성\n\n - 위탁 운영 또는 법인 등이 설치한 경우 : 운영기관에서 ‘인사위원회’를 구성\n  하되, 운영기관이 사단법인인 경우 시･도 센터는 관할 시･도협회에서, 시･                    제3장\n\n  군･구 센터는 관할 시･도협회 또는 시･군･구지회에서 구성\n   * 인사위원회 구성 주체에 관한 사항은 지자체(시･도 및 시･군･구)와 협의하여 결정              인\n - 센터장 인사위원회는 5인 이상으로 구성하며, 시설 소재지 지자체 공무원,\n  운영법인 임직원*, 외부 전문가 등 다양하게 구성하되, 외부 위원이 전체\n  위원의 과반수 이상이 되도록 하여야 함\n   * 사단법인의 경우 시설 소재지 시･도 협회 또는 시･군･구 지회 임직원으로 위원을 구성하고\n     중앙회의 임직원은 위원으로 위촉 불가\n\n○ 종사자(센터장 제외) 인사위원회 구성 주체 : 센터에서 구성\n\n - 시･도 센터 종사자(센터장 제외) 인사위원회 : 시･도 센터\n\n - 시･군･구 센터 종사자(센터장 제외) 인사위원회 : 시･군･구 센터\n   * 시･도 센터장이 시･군･구 센터 소속 종사자 임면 및 전보 등의 인사 조치 불가\n\n\n다. 인력 지원 기준\n\n○ 지원 기준\n\n - 5명 이상[센터장 1인, 수어통역사 4인 이상(청각장애인통역사 1인을 포함)]\n   * 장애인복지법 시행규칙 [별표 5] 종사자 배치기준(3명 이상)은 반드시 준수\n\n - 인원증원이 필요한 경우 지방비 및 자체수입으로 증원할 수 있음."}, {"p": 368, "t": "라. 인력별 주요 업무\n\n ① 센터장：센터를 대표하고 사무를 총괄\n\n ② 수어통역사：수어통역 서비스 제공 및 사무 전반에 관한 사항\n\n ③ 청각장애인통역사: 중계통역, 상담, 복지서비스 제공 및 사무 전반에 관한 사항\n\n  - 근무 경력에 따라 선임수어통역사 및 일반수어통역사로 둘 수 있음.\n\n\n마. 보수 기준\n\n ○ 보수는 당해연도 ‘사회복지시설 종사자 인건비 가이드라인’에서 정한 사회\n   복지이용시설(장애인) 종사자 보수체계에 의하여 지급하며, 상근 센터장 및\n   직원의 보수와 수당에 대하여는 해당 지자체와 협의 후 별도 기준을 정할 수\n   있음.\n\n ○ 센터는 소속 직원에게 예산의 범위 내에 당해연도 ‘사회복지시설 종사자\n   인건비 가이드라인’에서 정한 사회복지이용시설(장애인) 종사자 보수체계에\n   의한 수당 외에 별도로 매월 ‘수어통역수당’을 지급할 수 있음\n\n\n바. 기타 사항\n\n ○ 비영리법인 등에서 운영하는 센터 인력 중 센터장을 제외한 인력은 운영주체인\n   비영리법인의 임직원이 겸직할 수 없음.\n\n  - 센터를 운영하는 법인은 센터 종사자에게 법인 소관 업무･행사지원 등의\n   업무를 부여하지 않아야 하며, 이에 대해 지자체에서는 관리･감독하고, 위반\n   시에는 보조금 감액 등의 조치를 할 수 있음\n    ※ 1차 위반 : 개선명령, 2차 위반 : 개선명령, 3차 위반 : 보조금(인건비) 감액"}, {"p": 369, "t": "                                       Ⅷ. 수어통역센터 운영(지역)\n\n\n8 운영비 및 수입금 관리\n\n○ 운영비는 지방비로 하되, 자체수입을 추가할 수 있음.\n\n- 종사자의 수어통역서비스 제공으로 발생하는 수입금에 대한 관리 규정을\n  지자체에 보고하여야 함\n * 관할 지자체의 요청에 따라 외부기관 의뢰 수어통역서비스 수입금을 징수하지 않을 수 있음\n\n\n                  <수어통역서비스 수입금 관련 사항>                             제3장\n\n ① 【시설회계 세입예산과목】관(08.잡수입)-항(81.잡수입)-목(813.기타잡수입)으로 세입 조치\n   * 반드시 수어통역센터 시설 계좌로 입금\n ② 【종사자 복무 등】근무상황(출장) 조치 및 출장비 외 추가 수당 지급 불가\n ③ 【수입금 지출 가능 항목】센터의 추가 인력(보조금 인력 외) 증원 시 소요되는 인건비,\n   운영비(출장비, 종사자 교육･연수비 등)\n   * 운영 법인 회계로 전출 불가\n\n\n9 센터 지도･감독\n\n○ 시･도지사 또는 시･군･구청장은 센터에 대해 감사 및 지도감독을 실시하며,\n 회계감사시 수입금에 관한 사항을 반드시 점검\n\n- 감사 및 지도감독\n\n      종 류                         주         기\n\n ∙ 정기지도감독\n  ‑ 조직운영 전반                       연 1회 이상\n  ‑ 회계감사\n\n ∙ 수시 지도점검                            필요시\n\n                   진정, 투서, 언론보도, 비리발생, 인권침해, 행정처분이나 지적사항\n ∙ 특별지도감독\n                    미이행 등 주무관청이 지도감독 필요성이 있다고 판단한 경우"}]}, {"title": "Ⅸ. 점자도서관 운영", "start": 370, "end": 372, "subs": [], "pages": [{"p": 370, "t": "     Ⅸ    점자도서관 운영\n\n\n 1   목적\n\n ○ 점자도서･녹음도서･큰글자도서･전자점자도서･기타 대체자료의 제작･보급,\n     독서문화진흥 사업 등을 통해 시각장애인 등 독서소외계층의 정보접근성 및\n     삶의 질 향상과 자립을 지원하는 점자도서관(이하 “도서관”이라 한다) 운영에\n     필요한 사항을 정함\n\n\n 2 운영주체\n\n ○ 지방자치단체, 사단법인 한국시각장애인연합회 중앙회 및 시･도지부, 시･군･구\n     지회, 장애인의 독서문화향유를 주된 목적으로 하여 설립된 비영리법인 등\n\n\n 3 기본 운영 방침\n\n ○ 도서관은 점자도서관 서비스 제공에 있어 시각장애인 등 독서소외계층과 그\n     가족의 인간적 존엄성과 기본적 권리를 보장하고, 시각장애인 등 독서소외\n     계층의 자율성과 자기선택권이 존중될 수 있도록 노력\n\n ○ 도서관은 지역사회 내 시각장애인 등 독서소외계층의 생애주기와 장애정도\n     등을 고려하여 체계적이고 지속적인 서비스 제공"}, {"p": 371, "t": "                                       Ⅸ. 점자도서관 운영\n\n\n4 이용대상\n\n○ 장애인복지법 제32조에 의한 등록장애인\n\n○ 독서문화진흥법 제2조제3호에 의한 독서소외인\n\n○ 점자문화향유에 관심있는 비장애인\n\n\n5 사업내용                                                       제3장\n\n\n○ 점자도서･녹음도서･큰글자도서･기타 대체자료 제작･보급사업\n○ 복지정책자료･각종 소식지 등 출판사업\n○ 점자도서･녹음도서･큰글자도서･기타 대체자료 열람･대출사업\n○ 점자도서･녹음도서･큰글자도서･기타 대체자료 제작 자원활동인력 교육･\n  훈련･양성사업\n\n\n○ 시각장애인 등 독서소외인의 독서문화진흥을 위한 각종 사업\n\n○ 지식정보문화접근권 향상을 위한 사업\n\n○ 홍보사업\n\n\n6 설치 및 인력 배치 기준\n\n○ 도서관은 ｢점자법｣ 제12조제2항 및 동법 시행령 제4조제1항, ｢도서관법｣\n 시행령 ‘별표 2’ 공공도서관의 요건을 갖추어야 함\n * 단, 도서관 면적이 264제곱미터 미만일 경우, 작은도서관 기준에 따름\n\n○ 관장, 사서, 점자지도원, 대출열람원, 교정원 각 1명 이상(단, 교정원은 점자\n 지도원이 겸할 수 있음)을 배치하여야 함\n * 장애인복지법 시행규칙 [별표 5]의 종사자 배치기준"}, {"p": 372, "t": "     - 인력 증원이 필요한 경우 지방비(지방자치단체 협의 필요) 및 자체수입으로\n      증원할 수 있음\n      ※ 일반도서관 근무경력이 있는 사서가 점자도서관에 채용되는 경우, 일반도서관 근무 경력을\n        인정할 수 있음\n\n\n 7    운영비 지원\n\n ○ 운영비(인건비 및 관리운영비)는 지방비로 지원하되, 자체수입(이용료, 후원금,\n     법인 전입금 등)을 운영비로 사용할 수 있음\n\n ○ 인건비는 당해연도 ‘사회복지시설 종사자 인건비 가이드라인’에서 정한 사회\n     복지이용시설(장애인) 종사자 보수체계에 의하여 지급하며, 관장 및 직원의\n     보수와 수당에 대하여는 해당 지자체와 협의 후 별도 기준으로 정할 수 있음"}]}]}, {"no": 4, "title": "장애인 직업재활시설 운영", "start": 373, "end": 500, "sections": [{"title": "Ⅰ. 장애인직업재활시설 운영(공통)", "start": 375, "end": 421, "subs": [], "pages": [{"p": 375, "t": "                          Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n    Ⅰ    장애인직업재활시설 운영(공통)\n\n\n1   목적\n\n이 지침의 목적은 장애인이 자신의 능력과 적성에 맞는 직업생활을 통하여 인간\n다운 생활을 할 수 있도록 장애인 직업재활과 관련된 제반 서비스(보호고용,\n직업상담, 직업능력평가, 직업적응훈련, 직업훈련, 작업활동, 취업 알선, 취업 후\n지도, 장애인생산품 판매 및 판로 확대 등)를 제공하고 취업 기회를 제공하는\n장애인 직업재활시설의 설치･운영에 필요한 사항을 정하여 직업을 통한 장애인의\n자활･자립을 도모함에 있다.\n\n2 근거법령\n장애인 직업재활시설 운영사업은 ｢장애인복지법령｣, ｢사회복지사업법령｣ 및\n｢보조금 관리에 관한 법령｣에 의하되, 세부사항은 이 지침에 따라 수행한다.\n다만, 지침에 정하지 않은 사항은 사회복지사업에 관한 다른 지침을 준용할 수 있다.           영\n\n가. 시설의 종류와 기능：｢장애인복지법｣ 제58조제1항 및 같은 법 시행규칙\n    제41조 [별표 4]\n\n나. 시설의 설치신고 및 운영개시, 감독：｢장애인복지법｣ 제59조 내지 제60조\n\n다. 시설의 설치신고 등 세부사항：｢장애인복지법 시행규칙｣ 제42조에 따른\n    [별표 5] 및 제43조\n\n라. 시설의 재무회계 관리：｢사회복지법인 및 사회복지시설 재무･회계규칙｣ 중\n    시설회계\n\n마. 기타 일반사항：｢사회복지사업법령｣ 등 관계 규정"}, {"p": 376, "t": " 3 장애인 직업재활시설의 종류와 기능\n\n 「장애인복지법 시행규칙」 제41조 [별표 4]의 규정에 의한 장애인 직업재활시설의\n 종류와 기능\n\n 가. 장애인 보호작업장：직업능력이 낮은 장애인에게 직업적응능력 및 직무기능\n    향상훈련 등 직업재활훈련 프로그램을 제공하고, 보호가 가능한 조건에서\n    근로의 기회를 제공하며, 이에 상응하는 노동의 대가로 임금을 지급하며,\n    장애인 근로사업장이나 그 밖의 경쟁적인 고용시장으로 옮겨갈 수 있도록\n    돕는 역할을 하는 시설\n\n 나. 장애인 근로사업장：직업능력은 있으나 이동 및 접근성이나 사회적 제약 등\n    으로 취업이 어려운 장애인에게 근로의 기회를 제공하고, 최저임금 이상의\n    임금을 지급하며, 경쟁적인 고용시장으로 옮겨갈 수 있도록 돕는 역할을 하는\n    시설\n\n 다. 장애인 직업적응훈련시설：작업능력이 극히 낮은 장애인에게 작업활동,\n    일상생활훈련 등을 제공하여 기초작업능력을 습득시키고, 작업평가 및 사회\n    적응훈련 등을 실시하여 장애인 보호작업장 또는 장애인 근로사업장이나\n    그 밖의 경쟁적인 고용시장으로 옮겨갈 수 있도록 돕는 역할을 하는 시설\n    ※ 15.12.31. 「장애인복지법 시행규칙」 개정으로 유형 신설"}, {"p": 377, "t": "                                 Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n4 장애인 직업재활시설의 설치\n\n가. 시설의 설치 기준 (「장애인복지법」 시행규칙 제41조 및 제42조 관련 [별표 5]\n  Ⅵ. 장애인 직업재활시설의 설치･운영기준 참조)\n\n1) 입지조건\n\n  지역별 적정한 분포와 장애인 수, 보건･위생･급수･안전･환경 및 교통 편의 등을\n  충분히 고려하여 장애인이 쉽게 접근하고 편리하게 이용할 수 있는 쾌적한\n  환경의 부지나 건물을 선정\n\n2) 설치 가능한 건축물의 용도\n\n  ｢건축법｣ 제2조제2항 및 제19조, ｢건축법 시행령｣ 제3조의5 및 제14조에 따른\n  노유자시설\n  * 단, 장애인 직업재활시설은 ｢장애인복지법｣ 제58조제1항제3호, 같은 법 시행규칙 제41조제1항       직\n    개정으로, 직업훈련 및 직업생활을 위하여 필요한 부속용도의 시설로서 ①제조･가공 시설 ②공장         재\n    ③영업장 및 판매시설은 노유자시설인 아닌 별도의 장소에 설치하더라도 ‘장애인 직업재활시설’에         시\n    포함 가능한 것을 의미(노유자시설이 아닌 용도의 건물 또는 부지에 부속용도 시설 단독으로 장애인       설\n    직업재활시설을 설치하는 것은 불가능)\n   예) 직업상담, 훈련프로그램 등을 진행하는 주시설은 노유자시설에 설치, 제조를 위한 공장은 다른\n      용도의 건물에 별도 설치 → 하나의 직업재활시설로 인정\n  ** 부속시설에는 영업장 또는 판매시설을 목적으로 하는 분점(시･군･구 승인 필요)도 포함\n  *** 또한, 부속시설은 「장애인･노인･임산부 등의 편의증진 보장에 관한 법률」, 「소방시설 설치 및\n      관리에 관한 법률」 등 다른 법령에서 규정하고 있는 편의시설 및 소방시설을 갖추어야 함"}, {"p": 378, "t": " 3) 시설을 이용하는 장애인\n\n 가) 시설 이용장애인(이하 이용장애인)\n\n  (1) 근로장애인：임금을 목적으로 근로를 하는 장애인(「근로기준법」에 따른\n        근로계약 체결)\n\n  (2) 훈련장애인：장애인 직업재활시설이 운영하는 작업활동 프로그램 또는\n        장애인 직업적응훈련시설을 이용하는 장애인(근로장애인은 제외)\n     ※ 특수학교(고등학교) 졸업예정자 및 전공과 학생의 경우, 현장실습의 형태로 시설을 이용하고자\n         할 때에는 훈련장애인으로 선발할 수 있음\n\n        ※ 작업활동 프로그램：작업능력이 매우 부족한 장애인들이 일정기간 일상생활 및 가사생활훈련,\n          사회적응훈련, 직업적응훈련, 여가활동 교육 등을 통해 보호작업장이나 근로사업장으로 전이\n          되어 유상적 임금을 받을 수 있도록 보호작업장 또는 근로사업장 내에서 실시하는 프로그램\n\n\n 나) 시설별 이용 장애인 최소 인원\n\n          구 분         보호작업장          근로사업장        직업적응훈련시설\n         최소 인원       근로장애인 10명     근로장애인 30명      훈련장애인 20명\n   ※ 이용장애인 중 휴직자, 장기휴가자 등에 대해서는 현원 외로 관리하되, 시설 최소인원 기준 및 종사자 배치\n     기준 등에는 포함하여 관리(단, 시설운영비 지원의 인당 지원 인원에는 미포함)\n\n 다) 시설 이용 적격 대상\n   ｢장애인복지법｣ 제2조에 따른 장애인으로 세부 기준은 아래와 같음\n\n  (1) 장애인 보호작업장：의료, 직업능력, 심리, 교육 평가 등의 결과와 초기\n        면접의 정보를 토대로 전문가가 참여한 위원회(이하 ‘위원회’)에서 적격\n        여부를 평가한 결과, 당장 경쟁적인 고용시장이나 장애인 근로사업장에서\n        생산능력을 발휘하기 어려운 장애인을 대상으로 하되, 근로장애인의 80\n        퍼센트 이상은 「장애인복지법 시행규칙」 [별표1]에 따른 장애의 정도가\n        심한 장애인으로 유지"}, {"p": 379, "t": "                               Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n(2) 장애인 근로사업장：위원회에서 적격 여부를 평가한 결과, 교통, 건축 환경의\n  접근성이나 적응의 문제로 경쟁적인 고용시장에서의 취업이 어려운 장애인을\n  대상으로 하되, 근로장애인의 60퍼센트 이상은 「장애인복지법 시행규칙」\n  [별표1]에 따른 장애의 정도가 심한 장애인으로 유지\n\n(3) 장애인 직업적응훈련시설：위원회에서 적격 여부를 평가한 결과 당장\n  장애인 보호작업장이나 장애인 근로사업장에서 생산능력을 발휘하기 어려운\n  「장애인복지법 시행규칙」 [별표 1]에 따른 장애의 정도가 심한 장애인을\n  대상으로 하되, ｢발달장애인의 권리보장 및 지원에 관한 법률｣ 제2조\n  제1호에 따른 발달장애인을 80퍼센트 이상 유지\n\n(4) 장애인 거주시설과 동일한 법인이 운영하는 장애인 직업재활시설은 장애인\n  거주시설에서 생활하는 장애인 외의 장애인을 50퍼센트 이상 유지\n\n(5) 법인이 장애인 직업재활시설만 운영할 시 특별한 사유가 없는 경우, 특정\n  장애인거주시설의 장애인이 50퍼센트 이상을 넘지 않도록 한다.\n(6) 작업이나 서비스 과정상 장애인이 아닌 사람을 고용하여야 할 필요가 있는\n  경우 그 인원은 현재 근로인원 수의 30퍼센트를 넘을 수 없음\n※ 근로인원 수(종사자 제외)：임금을 목적으로 근로하는 자 중 작업이나 서비스 과정에 직접 참여         운\n  하는 자의 수 = 근로장애인 수 + 비장애인근로자 수(종사자 제외)\n\n※ 종사자와 비장애인근로자의 정의\n\n <종사자> 「장애인복지법 시행규칙」상 ‘직원’\n ○ 인건비의 부담주체(정부보조 혹은 시설 자부담)와 상관없이 시행규칙 [별표 5]에서 정한 ‘직원\n   배치기준’ 상의 직종에 관련된 업무를 주로 수행하는 사람\n   ※ 급여를 자부담한다고 해서 모두 비장애인근로자는 아님\n\n <비장애인근로자>\n ○ 위 종사자 직무에 종사하는 사람 외에, 당해 시설의 제품생산 및 서비스 제공 또는 유통 및\n   판매과정에 직접 참여하여 근로하는 것이 주 업무인 근로자로서 장애인이 아닌 사람\n\n\n(7) 작업활동 프로그램의 이용 자격은 ʻ11. 작업활동 프로그램 운영ʼ 참조"}, {"p": 380, "t": " 4) 시설의 구조와 설비\n\n 가) 공통사항\n\n  (1) 시설의 구조와 설비는 그 시설을 이용하는 장애인의 장애 유형, 장애 정도,\n        성별, 연령과 작업･서비스 특성에 맞도록 하여야 함\n\n  (2) 시설은 ｢장애인･노인･임산부 등의 편의증진 보장에 관한 법률｣에 따른\n        편의시설과 작업의 종류에 따라 ｢산업안전보건법｣, ｢식품위생법｣ 등 관련\n        법령에서 정한 산업안전보건 및 식품위생 관련 시설을 갖추어야 함\n\n 나) 설비기준\n\n  (1) 최소 면적기준(부대시설 포함)\n\n       구 분           보호작업장          근로사업장          직업적응훈련시설\n    최소 면적            90제곱미터         430제곱미터          90제곱미터\n\n\n  (2) 세부 기준\n                              기 준\n  구분                                                       비 고\n               보호             근로          직업적응훈련\n          작업실이나 작업활동 프로그램실             훈련실\n  작업실                                                       필수\n          장애인 1명당 2제곱미터 이상(기계설비 제외)\n  사무실     사무를 위한 적당한 집기･설비                                  필수\n재활상담실     거실과 가까운 곳, 비밀 보장을 위한 방음설비와 칸막이 포함 설치              필수\n집단활동실     여가･체력단련･재활 프로그램 등을 실시할 수 있는 시설과 설비\n                                                            필수\n          자원봉사자･후원자 등이 지역사회 자원 활용 프로그램을 실시할 수 있는\n자원봉사자실                                                    (겸용 가능)\n          시설과 설비\n  화장실     남녀 구분 설치                                          필수\n\n          (가) 급수시설：상수도 사용. 다만, 상수도를 사용할 수 없는 경우에는\n             ｢먹는물관리법｣ 제5조에 따른 먹는물의 수질기준에 적합한 지하수 등을\n  급수･        공급할 수 있는 시설을 갖출 것\n                                                            필수\n 배수시설     (나) 지하수 등을 사용하는 경우 취수원은 화장실, 폐기물 처리시설, 동물사육장,\n             그 밖에 지하수가 오염될 우려가 있는 장소부터 20미터 이상 떨어진\n             곳에 위치"}, {"p": 381, "t": "                                    Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n                             기 준\n  구분                                                     비 고\n            보호               근로        직업적응훈련\n\n비상재해   ｢소방시설 설치 및 관리에 관한 법률｣ 제12조의 화재안전기준에 따라 소화용\n                                                             필수\n대비시설   기구와 비상구 설치\n\n       (가) 겨울에도 상당 시간의 일조량 확보\n       (나) 출입구는 비상재해 발생 시 대피하기 쉽도록 복도 또는 넓은 공간과\n                                                             선택\n          직접 연결되게 설계\n       (다) 이용장애인의 건강과 위생을 유지할 수 있는 적절한 난방장치 및 통풍장치\n                                                       ※ 장애인이 기숙\n  거실   (라) 장애인 30명 이상 기숙하는 시설을 운영하는 경우 기숙시설은 장애인\n                                                        하는 설비를\n          1명당 21.78제곱미터 이상\n                                                        운영하는 시설은\n       (마) 복도･다락 등을 제외한 바닥의 면적은 기숙하는 장애인 1명당 3.3제곱미터\n                                                        필수\n          이상, 1실의 정원은 4명 이하                                          제4장\n       (바) 기숙시설은 남녀별로 거실 구분 설치\n의무실 또는\n       진찰, 건강 상담 및 치료를 위한 적당한 설비 및 기계･기구\n의료재활실\n       (가) 채광과 환기가 잘 되도록 하고, 창문에는 방충망 설치\n 조리실\n       (나) 식기 소독 및 위생적으로 취사와 조리를 할 수 있는 설비\n       남녀 구분 설치. 욕탕, 샤워 설비 및 세면 설비와 깨끗한 물을 사용할 수\n 목욕실\n       있는 설비\n\n세탁장, 건조장 세탁에 필요한 기계･기구, 세탁물을 건조할 수 있는 설비"}, {"p": 382, "t": " 5) 직원 배치기준\n\n 「장애인복지법 시행규칙」 <제386호, 2015.12.31.> 부칙 제2조에 따라 ’15.\n 12. 31. 이후 신고시설부터 우선 적용하되 ’15. 12. 30. 이전 신고 시설의 경우\n 에도 현행 시행규칙 적용 가능\n\n  직종명     배치기준                 비            고\n  시설장      1명    시설당 1명\n\n  사무국장     1명    이용장애인 30명 이상인 경우 1명\n\n                 - 이용장애인 8명당 1명(8명 초과 시 초과인원을 반올림하여 지원)\n 직업훈련교사    1명\n                 * 예시: 이용장애인 11명 → 1명, 이용장애인 12명 → 2명\n\n                 - 이용장애인이 50명 이상인 시설에 배치\n  간호사      1명    - 다만, 이용장애인의 건강상태 및 근로환경 등을 고려하여 간호사의 배치\n                  필요성이 낮다고 판단될 경우에는 배치하지 않음\n\n  영양사      1명    이용장애인이 30명 이상이고, 집단급식 제공기능이 있는 경우 배치\n\n  사무원      1명    시설당 1명\n\n                 - 장애인 근로사업장：근로장애인 10명당 1명(10명 초과시 초과인원을\n  생산 및            반올림하여 지원)\n           1명\n 판매관리기사          - 장애인 보호작업장：근로장애인 20명당 1명(훈련장애인은 미포함,\n                  20명 초과시 초과인원을 반올림하여 지원)\n\n                 자체시설이나 기숙시설을 운영하거나, 제조업을 주 업종으로 하고 있으면서\n                 이용장애인(근로장애인과 훈련장애인)과 시설 종사자(시설장 포함)를 합산하여\n 시설관리기사    1명\n                 50명 이상인 경우 시설당 1명\n                 ※ 자체시설, 기숙시설, 제조업이 주업종인 시설 중 1개만 해당되어도 지원\n\n                 훈련장애인을 포함한 장애인이 30명 이상이고, 집단급식 제공기능이 있는\n  조리원      1명\n                 경우 배치\n\n  위생원      1명    급식시설 및 기숙시설이 있는 경우 배치\n※ 보호작업장의 생산 및 판매관리기사 인원 산정시 장애의 정도가 심한 장애인이면서 1개월 동안의 소정근로시간이\n  60시간 이상인 근로장애인의 고용은 그 인원의 2배에 해당하는 고용으로 본다.\n※ 위 배치기준에도 불구하고 2016.1.1. 이전에 채용한 직원은 계속 고용할 수 있다."}, {"p": 383, "t": "                                 Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n가) 직원 자격기준은 ‘7. 직업재활시설 종사자 관련사항’ 참조\n\n나) 다른 장애인복지시설을 함께 설치하는 경우에는 주된 시설의 설비 및 직원의\n   일부로 하여금 장애인 직업재활시설의 설비 및 직원을 겸하게 할 수 있음.\n   다만, 시설장, 사무국장, 직업훈련교사는 겸할 수 없음\n   ※ 이 외에 규정되지 않은 사항은 「사회복지사업법」 시행규칙 [별표2]를 준용\n\n\n나. 시설의 설치･운영 신고 (「장애인복지법 시행규칙」 제43조)\n\n1) 국가 또는 지방자치단체 외의 자가 장애인 직업재활시설을 설치･운영하려는 경우에는\n  「장애인복지법 시행규칙」에서 정하는 기준에 적합한 시설 및 설비를 갖추고 같은\n  법 시행규칙 제43조 제1항 별지 제20호 서식의 ‘장애인복지시설 설치･운영 신고서’에\n  다음 서류를 첨부하여 관할 시장･군수･구청장에게 제출하여야 한다.\n\n가) 정관 1부(법인인 경우에만 해당)\n나) 단체의 회칙 또는 규약 1부(‘법인이 아닌 단체’인 경우만 해당)\n다) 시설 운영에 필요한 재산목록 1부\n라) 사업계획서 및 예산서 각 1부\n마) 시설의 운영에 관한 규정 각 1부\n\n바) 시설의 평면도(시설의 층별 및 구조별 면적 표시)와 설비구조 내역서 각 1부\n\n2) 신고서를 받은 시장･군수･구청장은 동 신고서를 검토, 해당 시설과 설비 등을 적정하게\n  갖추고 있는지 확인한 후 같은 법 시행규칙 제43조 별지 제23호 서식의 ‘장애인복지시설\n  신고증’을 교부\n\n  ※ 시장･군수･구청장은 행정정보공동이용을 통해 법인 등기사항증명서, 건물등기부 등본, 토지등기부\n    등본 서류 조회 및 시설의 평면도를 검토하여 「장애인복지법」 등 관계 법령에서 정한 기준에 부합\n    하는지 확인\n\n  ※ 건축물의 복수용도 인정 기준：「건축법」 제19조의2 및 같은 법 시행규칙 제12조의3 참조"}, {"p": 384, "t": "             건축법                          건축법 시행규칙\n 제19조의2(복수 용도의 인정) ① 건축주는 건축물의   제12조의3(복수 용도의 인정) ① 법 제19조의2\n  용도를 복수로 하여 제11조에 따른 건축허가,       제2항에 따른 복수 용도는 영 제14조제5항 각\n  제14조에 따른 건축신고 및 제19조에 따른 용도     호의 같은 시설군 내에서 허용할 수 있다.\n  변경 허가･신고 또는 건축물대장 기재내용의 변경      ② 제1항에도 불구하고 허가권자는 지방건축위원회의\n  신청을 할 수 있다.                     심의를 거쳐 다른 시설군의 용도간의 복수 용도를\n  ② 허가권자는 제1항에 따라 신청한 복수의 용도가     허용할 수 있다. 다만, 영 제14조제5항제4호\n  이 법 및 관계 법령에 정한 건축기준과 입지기준      나목에 따른 종교시설 및 같은 항 제6호다목에\n  등에 모두 적합한 경우에 한정하여 국토교통부령       따른 노유자시설(老幼者施設) 간의 복수 용도를\n  으로 정하는 바에 따라 복수 용도를 허용할 수       허용하려는 경우에는 지방건축위원회의 심의를\n  있다.                             생략할 수 있다.\n\n\n 3) 신규로 설치되는 장애인 직업재활시설은 장애인 거주시설 또는 장애인복지관 등의\n   직업재활 프로그램과 분리하여 독립된 시설로 설치 운영되도록 하여야 한다.\n\n   ※ 여타 시설 등과 동일 건물에 입주할 수는 있으나 시설의 지위 및 운영은 독립적으로 함\n\n\n 5 장애인 직업재활시설의 운영\n\n가. 사업계획 및 예산수립\n\n ○ 장애인 직업재활시설의 장은 [별지 제1호] 서식에 의해 사업계획 및 예산을\n    수립하여 사업계획은 운영위원회 심의를 거치고 예산은 운영위원회에 보고한 후\n    법인 이사회의 의결을 거쳐 시장･군수･구청장에게 제출한 후 시행\n   ※ 단, 개인 시설의 경우 운영위원회의 심의(사업계획) 및 운영위원회에 보고(예산)하여 확정한 후\n     운영위원회 회의록을 첨부하여 시･군･구청장에게 제출하여야 함\n\n ○ 시장･군수･구청장은 사업계획 및 예산에 대하여 다음 사항을 반드시 확인\n  - 사업계획서상의 사업의 타당성(이용장애인의 욕구에 부합 여부 및 목표량\n    산정의 적정성 등)\n  - 사업예산서상의 세부 세입 항목과 인건비(수당 포함) 및 사업비 등 세부 지출\n    항목의 적정 편성 여부 등"}, {"p": 385, "t": "                                Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n나. 운영지원\n\n1) 시･도지사와 시장･군수･구청장은 장애인 직업재활시설 운영에 필요한 비용을 ｢장애인\n 복지법｣ 제81조 및 같은 법 시행령 제44조에 따라 예산의 범위에서 보조할 수 있다.\n\n- 시･도지사와 시장･군수･구청장은 사회복지시설 평가결과, 운영법인의 장애인\n 고용장려금 시설 전입 실적, 보조금 지원에 따른 이용장애인 처우개선 정도\n 등을 지원기준에 반영할 수 있다.\n  ※ 장애인 직업적응훈련시설의 경우, 훈련프로그램의 품질 및 운영실적, 이용자 고용전이 노력 등을\n    반영할 수 있음\n\n\n2) 시･도지사와 시장･군수･구청장은 장애인 직업재활시설의 특성을 고려하여 적합한\n  직종 개발 및 운영지원에 필요한 행정･재정적 지원을 위해 적극 노력하여야 한다.                제4장\n\n\n3) 지방자치단체는 보건복지부 지침 등의 기준에 따라 지원되는 사항 외에 자체 시책에\n 따라 시설 운영, 종사자 및 이용장애인 처우 개선 등과 관련하여 지방자치단체 예산\n 또는 기금 등을 활용하여 추가지원 할 수 있다.\n  ※ 추가지원 예) 근로장애인 근로수당, 훈련장애인 훈련수당, 기능보강비, 종사자 특별수당 등\n4) 시･도지사와 시장･군수･구청장은 장애인 직업재활시설 시설종사자가 마케팅, 컨설팅\n 등 직업재활시설의 경영능력 향상을 위한 교육을 받도록 노력하여야 하며, 예산의\n 범위 내에서 교육비를 지원할 수 있다.\n\n\n5) 시･도지사와 시장･군수･구청장은 「중증장애인생산품 우선구매 특별법」에 따라 중증장애인\n 생산품 생산시설로 지정받은 장애인 직업재활시설의 생산품 매출액 등을 관리하여야 한다.\n\n\n6) 장애인 직업재활시설의 설치･운영 주체인 법인 등은 시설의 효율적 운영에 필요한\n  행정･재정적 지원을 위해 적극 노력하여야 한다."}, {"p": 386, "t": "다. 운영수익금의 사용\n\n ○ 장애인 직업재활시설의 운영으로 발생한 수익금(중증장애인생산품 생산시설\n   지정 생산품의 경우 판매수익금 포함)은 근로장애인에게 보다 많은 임금을\n   지급하거나 이용장애인의 복리후생을 개선하는 데 우선적으로 사용하여야 한다.\n  - 다만 시설 운영을 위해 불가피한 경우에 한하여, 운영법인 이사회의 의결을\n    거쳐 지방자치단체장의 승인을 받은 후 수익금의 일부를 관리운영비, 종사자\n    인건비, 기능보강비로 사용할 수 있다.\n    ※ 위 사항은 근로기준법에 따라 작성된 근로계약서 준수 여부 등 근로장애인 임금 지급 요건을\n      충족하는 시설에 한하여 적용 가능\n    ※ 수익금은 전년도 결산서 상의 수익금을 기준으로 함\n    ※ 복리후생비(기본급 및 제수당 이외의 후생비용을 말함)는 인건비에 포함된 것으로 보아 전체\n      운영수익금의 1%를 초과하지 않는 범위 내에서 제한적으로 사용할 수 있으나, 지급 시에는\n      시설 소속 모든 근로자(종사자, 근로장애인)에게 공히 적용하여야 한다.\n    ※ 원부자재 구입비 및 생산장비에 대한 시설장비 유지비용은 생산활동에 필요한 상시적 필수\n      경비이므로 승인 대상 수익금으로 보지 않음\n\n  - 운영 수익금(정부보조금 제외)은 “총판매액에서 원자재 구입비와 생산･판매\n    과정의 제 경비를 제외한 금액”을 말한다.\n  - 위 용도 범위 내에서 연례･반복적으로 사용될 것으로 사전 예측되는 운영\n    수익금 항목에 대해서는 사업계획 및 예산 승인(본예산, 추경예산) 또는\n    정기적인 수익금 사용계획 승인 등 관할 시･군･구가 정하는 방법(승인 주기\n    포함)으로 일괄 승인요청 할 수 있다.\n  - 기능보강비 등 비 상시적으로 발생하는 수익금 사용승인에 대해서는 개별\n    건별로 승인을 요청하여야 한다.\n    ※ 토지･건물구입, 시설 신･증축 등 대규모 자금이 필요한 기능보강비로 수익금을 사용하고자 하는\n      경우에는, 관할 지방자치단체가 해당 시설의 이용자 처우개선 추진 노력 및 실태 등을 검토하여\n      승인 여부를 결정(예 ; 최저임금에 크게 못 미치는 근로자가 다수 있음에도 불구하고 큰 규모의\n      수익금을 시설 건물 등 투자에 사용하고자 하는 경우 등은 승인 지양)"}, {"p": 387, "t": "                               Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n - 일괄 사용승인, 개별 사용승인 모두 수익금의 승인 신청 시에는 전체 수익금\n  (전년도 결산서 상의 수익금 기준) 규모를 제시한 후, 각 사용 항목별로 수익금의\n  사용 이유, 사용항목 및 산출내역 등을 구체적으로 적시하여 요청하여야 한다.\n - 상시적인 사용에 대해서는 시설에서 사회서비스정보시스템(희망이음)에\n  상신하여 지방자치단체가 행복이음에서 예산, 사업계획을 승인한 경우도\n  수익금 사용 승인을 일괄 득한 것으로 본다.\n - 운영 수익금에 대한 사용승인 신청을 접수한 지방자치단체장은 특별한 사유가\n  없는 한 신청 접수 후 14일 이내*에 승인여부를 회신하여야 한다.\n  * ｢민원처리에 관한 법률｣ 제18조 및 시행령 제15조의 ‘건의민원’ 처리기간 준용\n\n○ 장애인 직업재활시설의 운영으로 발생한 수익금은 장애인 직업재활시설의\n  운영과 관련 없이 법인의 운영을 위한 비용으로 사용되어서는 아니된다.                     제4장\n\n\n라. 장애인 고용장려금 등의 사용\n○ 운영법인 및 시설 등은 근로장애인의 고용으로 발생한 장애인 고용장려금 등\n  외부지원금을 근로장애인의 임금 수준 향상과 이용장애인의 복리후생 증진에\n  우선 사용하도록 적극 노력하여야 하며, 시･도지사와 시장･군수･구청장은 해당\n  지원금이 그 취지에 맞게 활용될 수 있도록 운영법인 및 시설 등을 지도할\n  수 있다.\n\n○ 장애인 직업재활시설 근로장애인에 대해 정부 일자리안정자금을 지원받은\n  경우, 동 지원금은 원칙적으로 근로장애인의 최저임금 지급 및 처우개선에\n  재투자하여야 한다.\n ※ 정부지원 시설, 근로자 30인 이상 사업장(법인 전체 기준) 등은 원칙적으로 일자리안정자금\n   미지원 대상이나 장애인 직업재활시설의 경우, 근로장애인 최저임금 지급 부담 경감을 위해 예외\n   적용을 인정한 것이므로 예외 지원의 취지 존중 필요"}, {"p": 388, "t": "마. 근로장애인의 임금 관리\n\n ○ 근로장애인의 임금은 객관적인 기준에 근거하여 지급되어야 하며, 최저임금\n   이상의 임금을 지급하기 위하여 노력하여야 한다.\n\n ○ 장애인 보호작업장, 장애인 근로사업장에서 작업활동 프로그램을 운영하는\n   경우 훈련장애인에게는 소정의 훈련수당을 지급할 수 있다.\n\n ○ 그 밖에 임금 지급 방법 및 관리 등에 관하여는 ｢근로기준법｣에서 정하는 바에\n   따른다.\n\n\n바. 근로기준 및 이용자의 권리\n\n ○ 장애인 직업재활시설은 이용장애인에게 차별적 대우를 하여서는 아니 된다.\n\n ○ 시설 내 근로장애인과 훈련장애인의 충원･배치 기준 등에 관한 사항은 시설\n   운영위원회의 심의를 거쳐 정한다.\n\n ○ 장애인 직업재활시설은 이용장애인(근로장애인 및 훈련장애인)에게 시설\n   이용에 필요한 정보를, 그들이 이해할 수 있는 방법으로 제공하여야 하며,\n   이용장애인의 개인정보에 대하여는 ｢개인정보 보호법｣에 근거하여 비밀을\n   유지하여야 한다.\n\n ○ 장애인 직업재활시설은 근로장애인으로 충원 또는 배치하는 이용자와 근로\n   계약을 체결하여야 하며, 근로계약에는 ｢근로기준법｣ 제17조에 따른 근로\n   조건을 명시하여야 한다.\n\n  - 근로장애인에 대해 훈련프로그램을 운영하는 경우, 근로시간에 포함하지 않는\n    훈련프로그램 시간(훈련프로그램 시간은 임금지급 대상으로 보지 않음)을\n    계약서에 명확히 구분하여 기재하여야 하며, 별도의 훈련프로그램 계획을\n    수립･운영하여야 한다."}, {"p": 389, "t": "                                Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n- 근로능력이 현저히 낮아 장시간 근무가 어렵거나 근로장애인이 희망하는\n  경우 단시간(주 소정근로 15시간 미만) 근로 계약을 체결할 수 있다. 다만,\n  단시간 근로계약은 불가피한 경우에 한하여 개별적으로 적용하고 시설 내\n  다수 근로장애인에 대해 일반적으로 적용하지 않도록 하여야 한다.\n  ※ 매년 단시간 근로계약을 반복적으로 체결하여 근로자성 유지가 어려운 근로장애인에 대해서는\n    훈련장애인 전환 등 검토 가능\n  ※ 단시간 근로계약 시 주휴･연차수당, 국민연금, 건강보험, 퇴직금적립 등 예외\n\n- 근로시간과 휴게시간 등 근로장애인의 근로관계에 관하여 필요한 사항은\n  ｢근로기준법｣에 따른다.\n  ※ 시설은 근로장애인의 근로계약 시간이 종료된 경우라도 일과시간(통상 09시~18시) 중에\n    훈련, 여가, 돌봄, 상담, 체험 등 이용자 프로그램이 제공될 수 있도록 노력하여야 함(이용\n    장애인의 출퇴근 이동시간은 프로그램 시간으로 볼 수 있음)\n\n- 근로장애인 중 육아휴직 조건이 되는 이용자에 대해서는 필요한 경우 육아\n  휴직 등을 이용할 수 있도록 안내(육아휴직 대상, 육아휴직 급여 등)\n  ※ 「남녀고용평등법」 제19조에 따라 만 8세 이하 또는 초등학교 2학년 이하 자녀를 가진 근로자는      업\n    육아휴직 이용 가능(30일 이상 사용시 휴직급여 최저 월 70만원)\n○ 재정지원 장애인일자리로 전환된 근로장애인은 장애인일자리 사업수행기관의\n 장과 근로계약을 체결하며, 해당 근로장애인은 현원에 포함하여 관리하여야\n\n 한다.\n\n- 당해연도에 선정된 장애인일자리 전환 근로장애인의 일자리사업 참여기간은\n  원칙적으로 당해연도 한 해로 한함(최대 연속 2년)\n ※ 단, 직업재활시설 근로장애인 대상 전환배치 사업은 일반고용 전이촉진 및 이용장애인 간 형평성\n   등을 위해 참여기간을 따로 정하여 운영할 수 있음\n\n- 일자리 사업 참여가 종료된 근로장애인은 시설과 근로계약을 다시 체결\n ※ 본인이 희망하는 경우 일반고용시장 또는 준경쟁고용시장 전환 등 적극 지원"}, {"p": 390, "t": " ○ 고용노동부가 시행하는 ‘직업재활시설 근로장애인 전환지원 프로그램’에\n   참여한 이용장애인이 고용전환에 성공하여 퇴소한 경우, 후임 신규 이용장애인\n   충원은 퇴소일로부터 3개월 이내에 하여야 한다.\n  - 단, 입소 희망자가 없거나 입소 적격자가 없는 등 위 기간 내에 충원이 어려운\n    불가피한 사정이 있는 경우는 3개월 추가 연장 가능\n\n ○ 고용전환 프로그램 등에 따라 시설 외부의 일터(직장)로 고용전환 했던 이용\n   장애인이 부적응 등을 이유로 전환(전이) 직장을 퇴사하여 시설 재입소를\n   희망하는 경우 시설은 이를 수용하기 위해 노력하여야 한다.\n  - 시설 복귀(재입소) 신청은 종전 직장의 퇴사일로부터 6개월 이내에 하도록\n    하되, 6개월이 경과 된 후 재입소를 희망하는 경우는 신규 입소절차에 따름\n    ※ 관할 지방자치단체는 복귀 이용장애인을 현원에 포함하여 지원하여야 함\n\n ○ 장애인 직업재활시설은 훈련장애인으로 충원 또는 배치하는 이용장애인에 대해\n   직업재활 또는 훈련프로그램 제공 계약을 체결하여 근로감독 시 혼선이 없도록\n   운영하여야 한다.(관련 별도의 훈련 프로그램 계획을 수립･운영)\n   ※ 직업재활프로그램 제공 계약 내용은 시설별로 자율적으로 정하되, 프로그램 운영시간, 장소,\n     내용 등이 구체적으로 드러날 수 있도록 작성\n\n\n사. 보건 및 안전관리\n\n ○ 장애인 직업재활시설은 생산품목과 서비스 유형에 따라 ｢산업안전보건법｣,\n   ｢식품위생법｣ 등 관계 법령에서 정하는 기준을 지켜야 한다.\n\n ○ 장애인 직업재활시설은 재해대책을 수립하고 이에 따른 직원 및 이용장애인\n   대상 교육을 실시하여야 한다.\n  - 시설장을 ‘안전관리책임관’으로, 소방안전관리자 교육 이수자 등을 ‘안전\n    관리담당자’로 지정하는 등 안전 전문인력을 확보하여야 한다."}, {"p": 391, "t": "                               Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n - 시설별로 특성에 맞는 자체 응급 피난 매뉴얼(장애인복지시설 재난안전관리\n  매뉴얼 참고)과 산업재해 예방 매뉴얼을 작성･비치하여야 한다.(지방자치\n  단체 점검 및 시설 평가시 결과 반영)\n   ※ 보건복지부 홈페이지 > 정보 > 연구/조사/발간자료에 게재\n\n - 해당 매뉴얼을 중심으로 안전교육은 분기별 1회, 산업안전 보건교육 연 1회*,\n  실제 상황을 고려한 모의 대피훈련을 연 2회 이상 실시하여야 한다.\n   ※ 「산업안전보건법」 제29조에 따른 대상시설과 장애인 직업재활시설에서 생산품목을 생산하는\n     경우 모두 해당\n\n○ 장애인 직업재활시설은 지역의 응급의료기관과 연계망을 구축하고 긴급연락망을\n  유지하여야 한다.\n○ 장애인 직업재활시설은 시설 종사자･이용장애인 및 장비･설비 등 재난 등에\n  대비하여 대인･대물 손해보험에 가입하여야 한다.\n  ※ 생산품목과 서비스 유형별로 요구되는 보험이 있는 경우 추가 가입\n○ 장애인 보호구역 지정\n - ｢어린이･노인 및 장애인 보호구역의 지정 및 관리에 관한 규칙｣에 따라,\n  장애인복지시설을 설립･운영하는 자는 특별시장･광역시장･특별자치도지사\n  또는 시장･군수(광역시의 군수는 제외)에게 장애인복지시설의 주변 도로를\n  장애인 보호구역으로 지정하도록 신청할 수 있다.\n\n\n아. 생산 및 품질관리\n\n○ 장애인 직업재활시설은 장애인이 직무능력이나 생산성을 발휘할 수 있도록\n  보조기술을 이용한 장비 또는 도구의 활용과 직무과정 변경 등을 적절히\n  배려하기 위하여 필요한 조치를 하여야 한다.\n\n○ 장애인 직업재활시설은 장애인의 생산품이나 서비스 업종이 장기간 유지될\n  수 있도록 노력하여야 한다."}, {"p": 392, "t": " ○ 장애인 직업재활시설은 생산품이나 서비스에 대하여 매년 원가나 단가에\n   관한 관련 자료를 토대로 분석을 하여야 하며, 그 분석결과에 따라 가격이\n   결정되도록 하여야 한다.\n\n ○ 장애인 직업재활시설은 생산품이나 서비스의 품질향상을 위하여 필요한 품질\n   인증 획득 등의 노력을 하여야 한다.\n\n\n자. 운영규정\n\n 장애인 직업재활시설은 다음 각 목의 사항이 포함된 운영규정을 제정･시행하여야\n 한다.\n  - 시설의 설립 이념과 방침\n  - 장애인 직업재활시설 운영을 위한 근로장애인과 훈련장애인의 직업재활욕구\n   수렴을 위한 사항\n  - 시설 운영위원회의 구성과 역할\n  - 임직원의 업무 분장\n  - 기숙사 운영에 관한 규칙(기숙시설이 있는 경우에 한함)\n  - 적격 대상 판정기준과 개별 서비스계획\n  - 윤리규정 및 정보보호\n  - 프로그램의 내용 및 성과 평가\n  - 그 밖에 시설의 관리에 관한 중요사항\n\n\n차. 인권교육 (「사회복지사업법」 제10조, 사회복지시설 평가 지침)\n\n ○ 장애인직업재활시설 인권교육은 종사자(시설장 포함)와 이용장애인, 비장애인\n   근로자를 대상으로 연 1회(4시간) 이상 실시하여야 한다.\n\n  - 이용장애인 대상 교육은 장애인 특성에 맞추어 내용을 구성하고 다양한 방법\n   (개별, 소집단 그림카드, 애니메이션 등 다양한 자료 활용)을 고려하여야 한다."}, {"p": 393, "t": "                                    Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n - 종사자와 비장애인 근로자는 인권 관련 기관에서 실시하는 교육 참석을\n   우선으로 하되, 외부 전문강사 초빙 및 자체 인력 중 인권교육 강사양성과정\n   수료자를 통한 내부 교육도 참여할 수 있다.\n   ※ 교육의 중요성 및 교육 효과를 위해 소집단교육, 대면교육 등의 오프라인 형태의 교육으로 우선\n     진행하되, 시설 여건 상 오프라인 교육이 어려운 경우 인권교육기관(국가인권위원회, 보건복지\n     인재원)에서 시행하는 온라인 교육으로 대체 가능\n\n○ 장애인직업재활시설은 성폭력 예방과 상담･신고 지원을 위한 직업훈련교사\n  등을 성희롱･성폭력 고충상담원으로 1명 이상 지정하여야 하고, 지역 내 민간\n  성폭력･성희롱 전문기관과 비상연락망 및 협력체계를 구축하여야 한다.\n\n\n카. 장애인학대 신고의무 (장애인복지법 제59조의4)                                     제4장\n\n\n○ 장애인학대 신고의무자인 시설장과 종사자는 그 직무상 장애인학대를 알게 된\n  경우 지체없이 장애인권익옹호기관 또는 수사기관에 신고하여야 한다.\n - 신고의무자는 자격 취득과정이나 보수교육 과정을 통해 장애인학대 예방 및\n   신고의무에 관한 교육을 이수할 수 있으며, 자격취득과정이나 보수교육\n   과정이 없는 자의 경우에는 이와 관련된 집합교육 자료 또는 인터넷 강의\n   등을 활용할 수 있다.\n\n   ※ 교육자료：보건복지부 홈페이지 > 정책 > 장애인 > 알림마당 > 교육/홍보자료에 게재\n\n\n타. 급식관리\n\n1) 집단급식소의 설치･운영 신고\n\n○ 식품위생법에 따라 1회 급식인원(종사자 포함)이 50명 이상인 장애인 직업\n  재활시설은 집단급식소 시설 기준을 갖추고 설치･운영 신고를 하여야 한다.\n  ※ 집단급식소 설치 신고 대상임에도 미신고할 경우 1,000만원 이하의 과태료 부과(「식품위생법」 제101조)"}, {"p": 394, "t": " 2) 사회복지급식관리지원센터\n\n ○ (목적) 노인･장애인 등 취약계층 사회복지시설의 위생･영양관리 지원 및 식생활\n   교육 등을 통한 급식 안전관리 도모\n\n ○ (지원시설) 영양사가 없는 소규모 노인･장애인 복지시설(50인 미만)\n\n ○ (지원대상) 사회복지시설을 이용하는 노인･장애인, 시설장･조리원･요양보호사\n   등 종사자\n\n ○ (지원내용) ① 전문 영양사의 급식 위생･영양 관리 방문지도 ② 맞춤형 식단\n   조리안내서 제공 ③ 대상별 식생활 교육 ④ 교육자료 및 물품지원\n   * 해당 시･군･구에 사회복지급식센터가 없는 경우에는 지원내용 중 일부만 지원받을 수 있음\n\n ○ (운영현황) 238개소 (’25.12월 기준)\n   * 어린이･사회복지급식관리지원센터 홈페이지(https://dietary4u.mfds.go.kr) > 기관소개 > 전국\n    센터현황 참조\n\n ○ (신청절차) (센터 운영 시･군･구) 홈페이지, 우편, 팩스 신청 (해당 시･군･구\n   미설치) 인근 사회복지급식센터\n   * 기타 정보는 어린이･사회복지급식관리지원센터 홈페이지(https://dietary4u.mfds.go.kr) 참조\n\n\n 6 장애인직업재활시설의 민간위탁\n    (「사회복지사업법」 제34조 및 같은 법 시행규칙 제21조, 제21조의2)\n\n가. 근거 : 「사회복지사업법」 제34조 및 같은 법 시행규칙 제21조, 제21조의2\n\n나. 위탁대상시설 : ｢사회복지사업법｣ 제34조제5항에 따라 국가 또는 지방자치\n   단체가 설치한 장애인 직업재활시설\n\n   * 국가･지자체 외의 자(법인･개인 등)가 설치한 시설은 위･수탁 불가"}, {"p": 395, "t": "                                  Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n다. 수탁자의 자격 : 사회복지법인 또는 비영리법인\n  * 사회적협동조합도 ｢협동조합 기본법｣ 제4조제2항에서 비영리법인임을 명시하고 있는바 수탁대상\n  에서 제외하지 않도록 유의(2017 사회적경제 활성화 방안 관련 기획재정부 요청사항)\n\n\n라. 위탁기준\n\n1) 법령상 특별한 규정이 있는 경우를 제외하고는 반드시 공개모집 *에 의해\n  수탁자를 모집하고 수탁자선정심의위원회(위원회 구성은 시행규칙 제21조\n  제4항 참조)를 통해 수탁자를 선정**하되, 수탁자의 전문성, 수행능력, 재정\n  능력 등을 종합적으로 고려하여 선정하여야 한다.\n  ** 공개모집 결과 신청법인이 없거나 수탁자 선정심의위원회 심의결과에 따라 수탁자를 선정하지\n     않을 경우, 다시 공개모집 절차를 진행하되, 이에 대한 세부기준은 반드시 지방자치단체의 조례로       제4장\n     규정할 것(필요 시 공개모집 관련 일반 사항은 ｢지방자치단체의 계약에 관한 법률｣ 준용 가능)\n     (2021 국민권익위원회 사회복지시설 위탁운영 제도개선 권고 반영)\n  ** 수탁자 선정 심의 및 배점 기준은 조례 또는 공고문을 통해 선정전에 공개하여야 함\n   (2021 국민권익위원회 사회복지시설 위탁운영 제도개선 권고 반영)\n2) 지방자치단체는 관계 법령의 규정을 벗어나지 않는 범위 내에서 장애인 직업\n  재활시설 위탁심사 세부기준을 조례 등 자치법규에 규정(국민권익위원회 권고\n  사항, ’10.4.)하여야 하며, 위탁계약 체결 시 「사회복지사업법 시행규칙」\n  제21조의2(시설의 위탁)에서 정하는 내용을 포함하여야 한다.\n  ※ 국민권익위원회 등의 권고사항(ʼ10.4.)은 보건복지부 사회서비스자원과-2700(’10.10.4)호\n    문서로 안내함\n\n3) 다만, 수탁신청법인으로 하여금 과도한 재정부담을 요구하는 경우에는 여타\n  수탁에 필요한 역량(전문성 등)을 갖추고 있을 경우에도 불구하고 그 요구되는\n  재정을 부담할 수 없어 수탁자로 선정되지 못하는 사례가 발생할 수 있으므로,\n  재정부담 능력과 타 심사기준을 합리적으로 형량하여 위탁자를 선정하여야 한다.\n  ※ 기본적으로 비영리법인(사회복지법인 포함)은 영리를 목적으로 하지 아니하므로 과도한 재정을\n    부담하기 어려운 현실 고려"}, {"p": 396, "t": " 4) 지방자치단체가 설치한 시설을 민간 법인 등에 운영 위탁할 경우, 해당 지방\n     자치단체는 운영법인과의 위탁계약 체결 시 이용장애인의 처우개선을 위해\n     동 시설에 고용된 근로장애인으로 인해 발생한 고용장려금을 시설에 재투자\n     또는 장애인 처우개선 등의 내용을 위탁계약 조건에 반영할 수 있다.\n\n 5) 기타 자세한 사항은 당해연도 「사회복지시설 관리안내」 참조\n\n\n 7    장애인 직업재활시설 종사자 관련사항\n\n가. 공통사항\n\n 1) 교육\n\n ○ 신규채용자 및 교육을 받지 아니한 직원은 한국장애인직업재활시설협회 등\n      에서 실시하는 소정의 장애인 직업재활시설 교육을 수료하여야 한다.\n\n ○ 시설장은 ｢긴급복지지원법｣ 제7조에 따라 소속 종사자에게 긴급복지 신고 의무\n      교육을 매년 1시간 이상 실시하고, 그 결과를 보건복지부에 제출하여야 한다.\n\n ○ 장애인재활상담사, 사회복지사 등 「장애인복지법」 및 「사회복지사업법」에\n      따른 법정 자격증을 소지한 시설 종사자는 관계 법령에서 정한 필수 보수교육을\n      수료하여야 한다.\n\n 2) 종사자(‘시설장’ 포함) 인건비 보조금 지급 연령 상한기준(시행일：2002년 1월 1일)\n\n ○ 시･도와 시･군･구에서 시설장 및 종사자의 인건비를 지원하는 시설에 대해서는\n      아래의 연령까지 인건비를 지원하여야 한다.\n\n     - 지급상한：시설장 만 65세, 그 외 종사자 만 60세\n     ※ 최종 임금 지급 사항 기준일 (지급상한일자는 해당 종사자(시설장 포함)의 출생일을 기준으로 함)\n     ※ 60세 초과 종사자에 대한 인건비 보조금 지원 특례 등 기타사항은 당해연도 「사회복지시설 관리\n       안내」 참조"}, {"p": 397, "t": "                                Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n3) 장애인 직업재활시설 종사자의 채용은 공개모집을 원칙으로 하며 기타 자세한 사항은\n 당해연도 「사회복지시설 관리안내」 참조\n\n\n나. 자격기준\n\n1) 시설장\n\n- 시설장 자격은 아래와 같으며, 전임으로 상근하여야 한다.\n  ※ 단, 지방자치단체 직영 시설로 지방자치단체장이 시설의 장인 경우는 예외\n\n가) ｢고등교육법｣에 따른 대학에서 직업재활이나 특수교육을 전공하고 졸업한\n   자로서 직업재활 관련 업무에 3년 이상 종사한 경력이 있는 사람\n\n나) 특수학교의 교장 또는 교감이었던 자 또는 ｢초･중등교육법｣에 따른 특수학교                  제4장\n   교사(교사자격증 소지자)로서 해당 시설 입소 대상 장애인의 교육에 3년 이상\n   종사한 경력이 있는 사람\n  ※ 해당 시설이란 「장애인복지법」상 장애인 직업재활시설을 말함\n다) ｢사회복지사업법｣에 따른 사회복지사 자격증을 가진 사람으로서 사회복지\n   사업에 3년 이상 종사한 경력이 있는 사람\n  ※ 사회복지사 자격증을 취득한 이후에 그 자격을 계속 유지하며 사회복지사업에 3년 이상 종사한         운\n    경우를 의미\n\n라) 장애인재활상담사 자격증을 취득한 후 장애인재활 분야에 3년 이상 종사한\n  경력이 있는 사람\n\n마) 직원이 50명 이상인 기업 또는 공공기관에서 부장급 이상으로 5년 이상\n   근무한 경험이 있는 전문경영인\n  ※ ‘공공기관’은 ｢공공기관의 운영에 관한 법률｣ 제4조에 의한 공공기관을 의미(국가, 지자체 등\n    행정기관 제외)하고 ‘부장급’은 중간관리자 이상을 의미함\n\n바) 장애인 직업재활 또는 장애인 직업재활시설 운영 직종(생산･서비스)과 관련된\n   자격증 소지자로서 장애인복지사업에 5년 이상 종사한 경력이 있는 사람"}, {"p": 398, "t": " 사) 위 가)부터 바)까지에 준하는 학력과 경력이 있다고 인정되는 사람\n   ※ 보조금을 지원받는 시설에서 위 규정을 적용하여 시설장을 임명하려고 하는 경우, 인정자격 적격\n     여부를 보조금을 지원하는 관할 시･군･구청과 협의할 것\n\n 2) 사무국장\n\n 가) ｢고등교육법｣에 따른 대학에서 직업재활이나 특수교육을 전공하고 졸업한\n    자로서 직업재활 관련 업무에 1년 이상 종사한 경력이 있는 사람\n\n 나) ｢사회복지사업법｣에 따른 사회복지사 자격증을 가진 사람으로서 1년 이상\n    종사한 경력이 있는 사람\n   ※ 사회복지사 자격증을 취득한 이후에 그 자격을 계속 유지하며 사회복지사업에 1년 이상 종사한\n     경우를 의미\n\n 다) 장애인재활상담사 자격증을 취득한 후 장애인재활 분야에 1년 이상 종사한\n    경력이 있는 사람\n\n 라) 직원이 50명 이상인 기업 또는 공공기관에서 부장급 이상으로 3년 이상\n    관련 업무에 근무한 경험이 있는 사람\n\n 마) 위 가)부터 라)까지에 준하는 자격이 있다고 인정되는 사람\n\n 3) 직업훈련교사\n\n 가) ｢고등교육법｣에 따른 대학에서 직업재활이나 특수교육을 전공하고 졸업한\n    사람(졸업예정증명서 제출 가능한 자도 포함)\n\n 나) ｢사회복지사업법｣에 따른 사회복지사\n\n 다) 장애인재활상담사\n\n 라) 장애인 직업재활시설 운영 직종과 관련된 자격증을 취득한 사람\n   ※ 장애인 보호작업장 및 장애인 근로사업장에 직업훈련교사가 2명 이상 배치되는 경우, 그 중\n     1명이 가)~다)에 해당하는 직업훈련교사 자격기준을 갖춘다면 나머지 인원은 마케팅 및 생산품\n     관련 전문가 등으로 채용 가능\n   ※ 3-1) 선임직업훈련교사：법정종사자 명칭은 ‘직업훈련교사’로서 사기진작을 위한 지침상 직위\n     로서 아래 요건 중 하나에 해당하는 직업훈련교사 중 시설별 1명 인정이 원칙이나 예산범위 내\n     1명 이상 인정 가능(2020.1.1. 이후 승급 또는 채용한 선임직업훈련교사부터 적용)"}, {"p": 399, "t": "                                Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n   가) 직업훈련교사 자격기준을 갖춘 사람으로서 직업훈련교사로 5년 이상 종사한 경력이 있는\n      사람(단, 해당 시설 경력 12개월 이상인 자에 한함)\n   나) 해당 시설에서 직업훈련교사로 5년 이상 종사한 경력이 있는 사람\n      * 직업훈련교사는 장애인복지법에 다른 장애인직업재활시설의 ‘직업훈련교사’에 한함\n\n\n4) 간호사：간호사 또는 간호조무사 자격증을 소지한 사람\n\n5) 영양사：영양사 자격증을 소지한 사람\n\n6) 사무원：전산 또는 회계 등 관련 자격증 소지자 우대\n\n7) 생산 및 판매관리기사：운영 직종 관련 자격증 또는 운영 직종 관련 경력이 있는 사람\n\n8) 시설관리기사：전기, 소방설비, 건축설비, 산업안전, 배관설비, 열관리 등 시설관리와             제4장\n 관련된 분야의 면허 또는 자격증을 소지한 사람\n  ※ 시설관리기사를 채용하지 아니하고 시설관리 전문업체에 관리를 의뢰할 수 있음. 이 경우 해당         애\n    시설은 계약서 등 증빙서류를 관할 시･군･구에 통보하여야 하며, 시설관리기사의 인건비를 전문        인\n    업체에 지급하는 용역경비로 사용할 수 있음\n9) 조리원：조리사 자격증 소지자, 조리원 또는 조리사 교육과정 이수자, 조리 관련\n 경력자 또는 이와 동등한 자격이 있는 사람\n  ※ 단, 개별 법령 등에 조리사 및 조리원 배치 기준 및 자격기준을 별도로 정하고 있는 경우 해당       영\n    법령을 준수하여야 함 (예: 식품위생법 등)\n\n\n다. 인력배치 시 고려사항\n\n○ 장애인 직업재활시설을 설치･운영하는 자는 법에 따른 종사자(직원)을 배치하고\n  시･도지사와 시･군･구청장은 법정 기준에 따라 배치된 인력에 대한 지원을\n  위해 노력하여야 한다.\n\n○ 시･도지사와 시･군･구청장은 장애인 직업재활시설에 공공근로, 사회복무요원\n  등을 최우선적으로 배치하도록 노력하여야 한다."}, {"p": 400, "t": "라. 종사자 채용 등 장애인･아동･노인학대 범죄 전력자 취업제한 점검･확인\n\n   장애인복지법, 아동복지법, 노인복지법 등 관련 규정에 따라 관할 지자체 및\n   시설 운영자는 운영･취업 전에는 범죄 전력조회를, 운영･취업 후에는 범죄\n   전력자 취업 점검･확인을 할 것\n   * 시･군･구는 연 1회 이상 확인 점검 후 복지부로 제출(별도 공문 통보)\n\n ① 장애인복지법 제59조의3(장애인관련기관에의 취업제한 등)\n  ○ 법원으로부터 장애인학대관련범죄나 성범죄로 형 또는 치료감호를 선고\n    받으면서 동시에 그 형 또는 치료감호의 전부 또는 일부의 집행을 종료\n    하거나 집행이 유예･면제된 날로부터 일정기간(이하 취업제한기간) 동안\n    장애인관련기관 등을 운영하거나 장애인관련기관에 취업 또는 사실상\n    노무를 제공할 수 없도록 하는 명령(취업제한명령)을 받은 자는 취업제한\n    기간 동안 장애인관련기관(장애인복지시설 포함)에 취업 또는 사실상 노무를\n    제공할 수 없음\n\n ② 아동복지법 제29조의3(아동관련기관의 취업제한 등)\n  ○ 법원으로부터 아동학대관련범죄나 성범죄로 형 또는 치료감호를 선고받으\n    면서 동시에 그 형 또는 치료감호의 전부 또는 일부의 집행을 종료하거나\n    집행이 유예･면제된 날로부터 일정기간(이하 취업제한기간) 동안 아동관련\n    기관 등을 운영하거나 아동관련기관에 취업 또는 사실상 노무를 제공할 수\n    없도록 하는 명령(취업제한명령)을 받은 자는 취업제한기간 동안 아동관련\n    기관(장애인복지시설 포함)에 취업 또는 사실상 노무를 제공할 수 없음\n\n ③ 노인복지법 제39조의17(노인관련기관의 취업제한 등)\n  ○ 법원으로부터 노인학대관련범죄나 성범죄로 형 또는 치료감호를 선고받으\n    면서 동시에 그 형 또는 치료감호의 전부 또는 일부의 집행을 종료하거나\n    집행이 유예･면제된 날로부터 일정기간(이하 취업제한기간) 동안 노인관련\n    기관 등을 운영하거나 노인관련기관에 취업 또는 사실상 노무를 제공할 수\n    없도록 하는 명령(취업제한명령)을 받은 자는 취업제한기간 동안 노인관련\n    기관(장애인복지시설 포함)에 취업 또는 사실상 노무를 제공할 수 없음"}, {"p": 401, "t": "                               Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n8 시설운영위원회의 설치･운영\n   (「사회복지사업법」 제36조 및 같은 법 시행규칙 제24조, 「사회복지시설 관리안내)\n\n가. 구성\n\n○ ｢사회복지사업법｣에 따라 장애인 직업재활시설은 다음과 같이 시설운영위원회를\n  설치하고 운영하여야 한다.\n\n○ 시설운영위원회의 조직 및 운영\n - 운영위원회의 위원은 위원장을 포함하여 5명 이상 15명 이하의 위원으로\n  구성한다.(다만, 아래 각 호에 해당하는 위원이 2명을 초과해서는 안 됨)\n - 위원회의 위원은 아래 해당하는 사람 중에서 시설의 장의 추천을 받아 관할                  제4장\n  시장･군수･구청장이 임명 또는 위촉한다.\n  ① 시설의 장\n  ② 시설 이용장애인 대표\n  ③ 시설 이용장애인의 보호자 대표\n  ④ 시설 종사자의 대표\n  ⑤ 해당 시･군･구(읍･면･동 및 소속기관을 포함)의 사회복지업무 담당 공무원\n  ⑥ 후원자 대표 또는 지역주민\n  ⑦ 공익단체*에서 추천한 사람\n   * 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체\n\n  ⑧ 그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이\n     풍부한 사람 (※ ①~⑤는 반드시 포함하고, ⑥~⑧은 선택하여 위촉)\n   ※ 시설장의 친인척, 법인의 임원 등 특수관계가 명확한 자(시설의 장은 제외)가 위원으로\n        임명･위촉되지 않도록 주의\n\n - 위원장은 위원 중에서 호선하며, 위원의 임기는 3년으로 하되 연임할 수 있고\n  보궐위원의 임기는 전임자의 잔여 임기로 함"}, {"p": 402, "t": "나. 운영\n\n ○ 분기별 1회 이상 정기회의 개최, 운영위원회 운영규칙에 규정한 회의 개최\n   요건에 해당할 경우(재적의원 1/3의 요청이 있을 경우 등) 수시회의 개최\n ○ 회의록을 작성하고, 회의는 시설 이용장애인, 시설 종사자 등에게 공개하는\n   것을 원칙으로 하되, 개인정보보호 등 불가피한 사유 발생 시 위원장은 비공개\n   결정을 할 수 있음(단, 비공개 사유는 공개해야 함)\n ○ 서면심의나 서면에 의한 회의는 불가\n\n\n다. 심의사항 (｢사회복지사업법｣ 제36조제1항)\n\n  - 시설운영계획의 수립･평가에 관한 사항\n  - 사회복지프로그램의 개발･평가에 관한 사항\n  - 시설 종사자의 근무환경 개선에 관한 사항\n  - 시설 이용자의 생활환경 개선 및 고충처리 등에 관한 사항\n  - 시설 종사자와 이용자의 인권보호 및 권익증진에 관한 사항\n  - 시설과 지역사회의 협력에 관한 사항\n  - 시설 이용자(근로장애인･훈련장애인)의 충원･배치 기준에 관한 사항\n  - 이용자로부터 수납하는 비용이 있는 경우, 그 내역 및 산정기준에 관한 사항\n  - 그 밖에 시설의 장이 운영위원회의 회의에 부치는 사항\n\n\n라. 보고사항 (｢사회복지사업법｣ 제36조제3항)\n\n  - 시설의 회계 및 예산･결산에 관한 사항\n  - 후원금 조성 및 집행에 관한 사항\n  - 시설 이용자(근로장애인･훈련장애인)의 충원 및 배치 계획과 현황에 관한 사항\n  - 그 밖에 시설운영과 관련된 사건･사고에 관한 사항\n   ☞ 국가감염병 확산 등 특수한 상황이 있을 경우, 서면보고로 갈음 가능\n\n\n마. 기타 자세한 사항은 당해연도 「사회복지시설 관리안내」 참조"}, {"p": 403, "t": "                          Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n9 장애인직업재활시설의 재무회계 관리 및 장부비치\n\n가. 대상 : 장애인직업재활시설\n\n나. 재무회계관리\n\n○ 장애인 직업재활시설의 재무회계는 법인회계와는 별도로 구분하여 독립채산제로\n  운영하며, 법인의 회계는 법인회계, 해당 법인이 설치･운영하는 시설의 시설\n  회계 및 수익사업회계로 구분하여야 하며, 시설의 회계는 해당 시설의 시설\n  회계로 함\n\n○ 장애인 직업재활시설의 모든 회계는 예산 사용의 투명성을 확보하기 위해\n  「사회복지법인 및 사회복지시설 재무･회계규칙」의 시설회계를 준용하여\n  처리하며 회계사무소에 의뢰하여 처리할 수 있다.\n - 장애인 직업재활시설의 회계는 「사회복지시설 재무･회계규칙」(제23조)에 따라\n  단식부기 방식으로 처리할 수 있으나, 복식부기 방식을 도입할 수 있도록\n  노력해야 한다. 다만 중증장애인생산품 생산시설로 지정된 시설에서는 복식\n  부기를 사용하여야 한다.\n - 시설은 연간 세입･세출예산서 및 세입･세출결산서를 운영법인 및 시설의\n  게시판과 인터넷 홈페이지에 20일 이상 공고하여야 한다.(「사회복지시설\n  재무･회계규칙」 제10조, 제19조)\n\n - 동 규칙에서 정하지 아니한 사항은 ｢국가재정법｣, ｢지방재정법｣ 및 ｢물품\n  관리법｣ 등 정부 재무회계 관련법령을 준용한다.\n\n○ 장애인 직업재활시설의 사무원 등 회계를 담당하는 종사자는 재무회계 관련\n  규정 및 복식부기 등을 통한 회계처리 방법을 숙지하도록 노력해야 한다."}, {"p": 404, "t": "다. 각종 장부의 비치\n\n ○ 장애인 직업재활시설은 「장애인복지법 시행규칙」 제42조 [별표 5]에 규정된\n   장부를 비치하여야 한다.(별지 제2호 서식)\n\n                  [ 장애인 직업재활시설 장부 비치 목록 ]\n\n    구      분                     내         용\n\n        관리관련 장부 - 직원관계철, 회의록철, 사업일지, 문서철, 문서 접수･발송대장, 차량운행일지\n\n\n                - 근로장애인 관계서류(근로계약서, 명부, 건강기록부, 입･퇴소자의 명단, 보호의\n                  경과, 지도, 개별 상담 등 관계철)\n                - 훈련장애인 관계서류\n        사업관련 장부\n                - 재활프로그램 관리대장\n                - 교육･훈련관계서류(훈련일지 및 평가관계서류)\n 기본             - 급식관계대장(해당 시설에 한함)\n 비치\n 서류              - 총계정원장 및 수입･지출보조부\n                   ※ 매출채권, 매입채무, 제품매출, 원자료구매 계정에 대한 보조부 포함\n                 - 금전출납부 및 그 증명서류\n         재무･회계   - 예산서･결산서, 비품수불대장, 비품관리대장, 장비관리대장\n         관련 장부   - 재산대장･재산목록과 그 소유권에 관한 증명서류\n                 - 사회복지법인 및 사회복지시설 재무･회계규칙 제20조제1항제4호부터 제13호\n                   까지의 서류\n                 - 각종 증명서류 및 그 밖에 필요한 서류\n\n                 - 근로장애인 임금대장 및 임금산정 기준(입금증빙자료 포함)\n                 - 훈련장애인 훈련수당 대장 및 수당산정 기준(입금증빙자료 포함)\n      추가 장부      - 자재(원료) 구매대장, 제품매출대장\n                 - 수입장부, 지출장부\n                 - 자재(원료)수불부, 제품수불부\n\n※ 직업적응훈련시설은 위 장부 비치 목록 중 근로장애인 관련 서류 제외"}, {"p": 405, "t": "                                Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n10 지도･감독 및 행정처분 등\n   (「장애인복지법」 제61조, 「사회복지사업법」 제51조, 및 같은 법 시행규칙 제26조의2)\n\n\n가. 목적\n\n시･도지사와 시장･군수･구청장은 인권보호, 직업재활, 직업훈련, 회계 등에서 각종\n불법행위나 부당한 문제가 발생하지 않도록 지도･감독하여 시설 운영 수준의\n향상을 위해 필요한 조치를 하는 것을 목적으로 한다.\n\n\n나. 기본방향\n\n○ 「장애인복지법」 제61조(감독)에 의거 해당 시설의 관할 시･도지사 또는 시장･                제4장\n\n  군수･구청장은 연초 관할 장애인 직업재활시설에 대한 지도･점검계획을 수립\n  하고, 반기별 1회 이상(권고) 정기적이고 내실 있는 점검이 이뤄질 수 있도록\n  노력하여야 하며, 특이사항 발생 시에는 수시점검을 실시하여야 한다.\n○ 시･도지사와 시장･군수･구청장은 장애인 직업재활시설을 설치･운영하는 자의\n  소관 업무 및 시설 이용장애인의 인권실태 등을 지도･감독하며, 필요한 경우\n  그 시설에 관한 보고 또는 관련 서류의 제출을 명하거나, 소속 공무원에게\n  시설의 운영상황, 장부, 그 밖의 서류를 조사･검사하거나 질문하게 할 수 있다.\n\n○ 시･도지사와 시장･군수･구청장은 장애인 직업재활시설의 지도･감독에 있어 사업의\n  특수성과 전문성을 충분히 이해하고, 이에 대한 지도･감독체계를 확립하여 장애인\n  직업재활시설 운영의 전문성과 자율성을 해치지 않도록 조치하여야 한다.\n\n○ 시･도지사와 시장･군수･구청장은 장애인 직업재활시설 운영지원에 적정을 기하기\n  위하여 근로장애인 수 등 운영현황을 확인한 결과, 6개월 동안 지속적으로\n  최소인원을 충족하지 못하는 경우, ｢사회복지사업법｣ 제40조, ｢장애인복지법｣\n  제62조, ｢장애인복지법 시행규칙｣ 별표 5의5에 따라 조치할 수 있다.\n - 필요한 경우 지방자치단체의 장은 장애인 근로사업장은 장애인 보호작업장\n  으로 변경하도록 지도할 수 있다."}, {"p": 406, "t": "다. 행정처분\n\n 1) 행정처분\n\n ○ 시･도지사와 시장･군수･구청장은 장애인 직업재활시설이 행정처분 요건에\n   해당하는 경우 그 시설의 개선, 사업의 정지, 시설의 장의 교체를 명하거나\n   해당 시설의 폐쇄를 명할 수 있다.\n\n 2) 행정처분의 절차\n\n ○ 행정처분을 하고자 할 때에는 ｢행정절차법｣에 따른 행정절차를 준수하여야 한다.\n\n 3) 행정처분 이력관리\n\n ○ 행정처분 결과는 처분 부과 주체가 차세대 사회보장정보시스템(행복이음) 내\n   [기관관리감독]-[행정처분관리]탭에 반드시 입력하여 관리하여야 한다.\n\n 4) ｢장애인복지법｣에 따른 행정처분\n\n ○ (근거) ｢장애인복지법｣ 제62조 및 같은 법 시행규칙 제44조의8, 별표 5의5\n   ※ 상세 행정처분 기준은 ｢장애인복지법 시행규칙｣ 제44조의8[별표 5의5] 참조\n\n\n 5) ｢사회복지사업법｣에 따른 행정처분\n\n ○ (근거) ｢사회복지사업법｣ 제40조 및 같은 법 시행규칙 제26조의2, 별표 4\n\n ○ (적용) ｢사회복지사업법｣ 제3조 제1항에 따라 사회복지사업의 내용 및 절차\n   등에 관하여 제2조 제1호 각 목(｢장애인복지법｣은 ｢라｣목)의 법률에 특별한\n   규정이 있는 경우를 제외하고는 ｢사회복지사업법｣에서 정하는 바에 따른다.\n   ※ 상세 행정처분 기준은 ｢사회복지사업법 시행규칙｣ 제26조의2[별표 4] 참조"}, {"p": 407, "t": "                                 Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n라. 법인이 사회적협동조합인 경우 지도･감독\n\n○ 사회적협동조합이 “장애인 직업재활시설”을 설치･운영 중인 경우에는 장애인\n  직업재활시설의 설치･운영 기준 위반 여부 등을 확인하여 신고수리하거나\n  사후 지도･감독을 하여야 하며 그에 따른 행정처분 등을 하여야 한다.\n - (주요확인사항) 직업재활시설 종사자(사회적협동조합의 이사장, 이사)의\n  겸직 유무 및 영리활동 여부, 장애인 직업재활시설 공간 내 사회적협동조합\n  (법인) 입주 여부 등\n - (협동조합 현황 확인방법) 협동조합 홈페이지(https://www.coop.go.kr)에서\n  검색 확인(협동조합명, 주소, 이사장, 출자금, 주요사업, 임원현황 등)\n  * 협동조합 홈페이지→협동조합 현황→협동조합설립현황\n  ** 협동조합 홈페이지 → 협동조합 현황 → 경영공시 → 경영공시 자료→ 협동조합명 검색\n\n11 작업활동 프로그램 운영\n가. 대상자(훈련장애인)\n○ 최소 10인 이상으로 구성하되, 근로장애인보다 생산능력이 떨어져 당장 유상적\n  임금을 제공할 수 없는 장애인을 대상으로 한다.\n  ※ 이용자 입퇴소 등으로 인해 일시적으로 훈련장애인을 10인 이상 구성하기 어려운 경우에도 운영 가능\n\n○ 「장애인복지법」 시행규칙 [별표 1]의 규정에 의한 장애의 정도가 심한 장애인이\n  프로그램 대상 현원의 80% 이상 되도록 유지해야 한다.\n\n○ 훈련장애인은 일정기간 훈련을 통해 능력과 기능이 향상될 수 있도록 하여\n  3년 후에는 장애인 보호작업장 또는 장애인 근로사업장, 그 밖의 경쟁적인\n  고용시장으로 옮겨갈 수 있도록 노력하여야 한다.\n  - 3년 후 전이되지 못한 훈련장애인은 3년을 더 연장하여 훈련할 수 있다.\n  - 시설은 이를 위해 정기적으로 평가를 실시하여야 한다."}, {"p": 408, "t": " 1) 직원 배치\n\n ○ 직업훈련교사\n\n  - 장애인 보호작업장 및 장애인 근로사업장의 이용장애인이 8명당 1명을\n    배치하며, 추가 배치인원은 종사자 배치기준을 적용한다.\n\n  - 직업훈련교사 자격기준에 해당하는 자로서, 프로그램 운영을 전담하여야\n    한다.(시설의 운영 직종 업무 겸임불가)\n\n 2) 프로그램 운영\n\n ○ 작업활동 프로그램을 운영하고자 하는 시설의 장은 프로그램에 대한 계획,\n   예산을 수립하여 시장･군수･구청장에게 제출하여야 한다.\n\n ○ 장애유형, 정도, 연령별 특성을 고려하여 프로그램을 지속적으로 개발하여\n   실시하여야 한다.\n\n ○ 보호고용 및 경쟁고용으로 전이될 수 있도록 주당 20시간 이상 아래의 내용\n   으로 훈련을 실시하여야 한다.(직업적응훈련시설은 별도)\n\n  - 일상생활 및 가사생활훈련：가정생활 및 독립생활을 수행하는 데 필요한\n    기술을 습득하기 위한 훈련\n\n  - 사회적응훈련：지역사회의 한 일원으로 통합하여 살아가는데 필요한 대인\n    관계기술, 각종 시설을 이용하는 기술 등을 습득하도록 지도\n\n  - 작업훈련：작업기능의 향상을 위한 작업활동을 제공하고 장애인보호고용\n    으로의 전환을 위한 작업기술을 습득하도록 지도\n\n  - 직업평가：적절한 평가도구를 통한 직업평가를 실시\n\n  - 통근훈련：지역사회의 대중교통 수단을 이용하여 통근할 수 있도록 지도\n\n  - 취미 및 여가활동：건전한 여가활동을 통하여 사회성과 대인관계기술을\n    습득하고 긍정적인 생활인의 자세를 기를 수 있도록 지도"}, {"p": 409, "t": "                        Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n○ 이 밖의 생산활동과 연계된 직업적응훈련을 통해 작업기능을 향상시킬 수\n  있도록 하여야 한다.\n\n○ 작업활동 프로그램에 참여하는 훈련장애인에게는 소정의 훈련수당을 지급할\n  수 있다.\n\n\n나. 프로그램운영 실태조사\n\n○ 보건복지부장관, 시･도지사 및 시장･군수･구청장은 작업활동 프로그램의\n  운영실태 파악을 위해 실태조사를 실시할 수 있다."}, {"p": 410, "t": "[별지 제1호 서식]\n\n          ○○○○년도 ○○시설 사업계획 및 예산서(예시)\n\n\n1. 사업개요\n\n\n 가. 목적(개조식)\n\n\n 나. 주요사업내용(개조식)\n\n\n 다. 시설현황\n  ○ 시설일반현황\n  ○ 종사자의 직급별 직종별 현황(직급별 평균호봉 표기)\n\n\n 라. 사업의 필요성\n\n\n2. ○○○○년도 세부사업계획\n                                                                (단위：천원)\n                                      (4)계 획\n                                                     (5)사업 내용\n(1)사업분류   (2)세부사업명     (3)사업대상    목표(연인원,                       (6)기대효과\n                                               예 산      (요약)\n                                 실인원, 건(회)수)\n\n\n※ 작성요령\n (1) 항은 사업을 대분류하여 기재\n (2) 항은 세부적인 단위사업명을 기재\n (3) 항은 사업대상자 기재\n (4) 항중 목표는 수혜연인원을 기준으로 하되, 연인원･실인원･건(회)수로 기재\n (5) 항은 세부사업내용(목적, 주요내용, 수행방법 등)을 개조식으로 기재\n (6) 항은 세부사업의 수행으로 기대되는 효과를 개조식으로 기재"}, {"p": 411, "t": "                                                 Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n3. ○○○○년도 세입･세출예산\n                                                                    (단위：천원)\n              세     입                                    세    출\n                             증감(B-A)                                증감(B-A)\n         0000년도   0000년도                            0000년도 0000년도\n관 항 목                               비율     관 항 목                         비율\n          예산(A)    예산(B)    금액                       예산(A)  예산(B)   금액\n                                    (%)                                  (%)\n\n\n 가. 세입내역\n                                                                    (단위：천원)\n              0000년도       0000년도              증감(B-A)\n 관   항    목                                                       산출내역\n               예산(A)        예산(B)         금액       비율(%)\n                                                             ※ 구체적으로 기재         업\n 나. 세출내역\n                                                                    (단위：천원)\n              0000년도       0000년도              증감(B-A)\n관    항    목                                                       산출내역\n               예산(A)        예산(B)         금액       비율(%)\n\n\n                                                             ※ 구체적으로 기재"}, {"p": 412, "t": "[별지 제2호 서식]\n\n                   장애인직업재활시설 추가 비치 장부\n\n\n<근로장애인 임금대장>\n     구분         주민등록    고용     근로\n           성명                        기본급   제수당       총액   공제액     영수액        영수인\n월별              번  호    연월일    일수\n\n\n※ 제수당：가족수당, 연장근로수당, 휴일근로수당, 야간근로수당, 수익금으로 지급되는 수당 등\n\n\n<훈련장애인 훈련수당대장>\n     구분\n            성명      주민등록번호      훈련시작일      훈련일수           훈련수당           영수인\n월별\n\n\n<원료구매대장>\n                제 품 명\n     월 일                 규 격         수 량       단 가        금      액       비 고\n                (원료명)\n\n\n<제품매출대장>\n                                                      공       급          처\n 월 일       제 품 명    규격    수량        단가   금 액\n                                                 사업자등록번호             성        명"}, {"p": 413, "t": "                                          Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n<수입장부>(지출장부 양식 동일)\n  월     일         적    요      금     액        누    계       비     고\n\n\n<비품관리대장>\n                                                          비 고\n  품 명        규 격        수 량       구입단가      금 액\n                                                      (구입일자 및 재원)\n\n\n※ 비고(구입일자 및 재원)의 재원은 정부보조금, 지방비 또는 자체구입 등으로 기록\n\n<장비관리대장>\n                                                          비 고            애\n  품 명       규 격       수 량   구입단가    금 액     설치장소\n                                                      (구입일자 및 재원)\n※ 비고(구입일자 및 재원)의 재원은 정부보조금, 지방비 또는 자체구입 등으로 기록"}, {"p": 414, "t": "[참고자료 1]\n\n           장애인 직업재활시설 종사자 인건비 지원 기준\n\n\n 1) 보수：당해연도 장애인 직업재활시설 종사자 인건비 가이드라인 참조\n\n ○ 급여 인상 관련\n\n  - 장애인 직업재활시설의 종사자 보수는 매우 열악하여 질 높은 복지서비스\n    제공에 걸림돌로 작용하고 있으므로, 각 시･도는 이를 감안하여 종사자\n    처우개선을 우선 과제로 추진 요망\n\n ○ 법정근로수당 등 보조 관련\n\n  - 시･도지사와 시장･군수･구청장은 시간외근무수당 등 제수당, 퇴직금, 기타\n    4대 보험 등의 경우 근로기준법 및 개별법령을 준수하도록 시설에 지도\n     ※ 단, 법인대표 겸 시설장은 사업주의 지위에 있으므로 시간외근무수당 및 퇴직적립금의 지급\n        대상 아님\n\n  - 시･도지사와 시장･군수･구청장은 시간외근무수당 지급을 위한 예산확보를\n    위해 노력하여야 하며, 시간외근무수당의 인정은 객관적으로 확인 가능한\n    시스템에 의해 관리 되어야 함\n     ※ 휴일 근무의 경우 평일 대체휴무 권장\n\n ○ 경력인정\n\n  - 종사자의 경력인정은 당해연도 「사회복지시설 관리안내」 기준을 따름\n\n  - 다만, 시설의 생산품 또는 업종과 관련한 분야 및 장애인 고용 관련 분야에\n    근무한 경력에 대해서는 아래 기준에 따라 유사 경력 일부 인정 가능"}, {"p": 415, "t": "                                   Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n① 생산품 또는 업종과 관련한 분야에 근무한 경력\n인정범위          유사경력 인정 대상                      인정 인원\n       현재 소속된 직업재활시설의 생산품 또는 업종과\n       관련하여 개별 법령에서 의무적으로 채용하도록    제한 없음(종전 근무경력은 인정하되,\n80%\n       되어있는 자격･면허를 소지한 종사자로서 동 직   경력합산은 2016.1.1.부터 적용*)\n       원이 해당 분야에서 근무했던 경력\n\n                                   시설당 1명(종전 근무경력은 인정하되, 경\n       법령에서 채용이 의무화된 자격･면허는 아니나\n                                   력합산은 2018.1.1.부터 적용*)\n       현재 소속된 직업재활시설의 생산품 또는 업종과\n50%                                단, ‘생산 및 판매기사’로 채용된 직원에\n       관련한 자격･면허를 소지하고 해당 분야에서 근\n                                   대해서는 예산범위 내 1명 이상 인정 가능\n       무했던 경력\n                                   (경력합산은 2020.1.1.부터)\n\n\n② 한국장애인고용공단에서 근무한 경력                                               제4장\n인정범위          유사경력 인정 대상                      인정 인원\n                                   제한 없음\n       ｢한국장애인고용공단｣에서 직원의 자격으로 채용\n80%                                (종전 근무경력은 인정하되, 경력합산은            인\n       되어 근무한 경력\n                                   2021.1.1.부터 적용*)\n - 그 외 경력인정에 대하여는 지방자치단체 예산사정에 따라 별도의 지침을\n  마련하여 정할 수 있음\n○ 기타 행정사항\n\n - 그 외 지급대상, 호봉 획정 및 승급･승진 등에 관한 인건비 지원 세부기준은\n  당해연도 「사회복지시설 종사자 인건비 가이드라인」, 「당해연도 사회복지시설\n  관리안내」 등을 참고할 것\n\n - 시설장, 사무국장에 대한 직책보조비를 지원할 수 있음\n\n - 직원(종사자)의 출산, 휴직 등의 사유로 인력의 공백이 발생할 경우 해당\n  직원(종사자)의 인건비 범위 내에서 대체인력을 활용할 수 있음"}, {"p": 416, "t": " 2) 사용자부담금\n\n ○ 사용자부담금은 사용자인 법인 등이 관계 법령에 따라 부담하여야 하는 법정\n      경비로서 국민건강보험료부담금, 국민연금보험료부담금, 산재보험료부담금,\n      고용보험료부담금 및 퇴직금적립금부담금 등으로 나누어 지원\n\n  - 시･도지사와 시장･군수･구청장은 시설이 4대 보험 관련 관계기관에 직접\n      확인하도록 하여 과오납 사례가 없도록 지도하여야 함\n      ※ 시설에서는 각 부담금 관리기관에서 보내온 납부고지서 명세가 상기 관련 법률에 규정된\n        부과기준과 부합하는지 여부를 반드시 확인 후에 납부\n\n            [ 장애인 직업재활시설 사용자부담금 지원 및 집행기준 ]\n\n  구     분                지 원 기 준                     근거규정\n\n 건강보험료                                            「국민건강보험법」\n                       보수월액×7.19%×1/2\n  부담금                                             (시행령 제44조)\n\n 노인장기요양      건강보험료×(장기요양보험료율(0.9448%)/건강보험료율      「노인장기요양보험\n 보험료 부담금               (7.19%)×1/2                법」(시행령 제4조)\n\n                                                    「국민연금법」\n  국민연금                                           (법 제88조 및 부칙\n                 기준소득월액×9.5%×1/2 (18~60세 미만)\n   부담금                                            (법률 제20903호,\n                                                 2025.4.2.)제4조 참조\n 퇴직금적립금                                           「근로자퇴직급여\n                         임금총액×1/12\n  부담금                                             보장법」 제20조\n\n                                                     「고용보험 및\n 고용보험료                (실업급여) 월급여총액×1.8%*×1/2        산업재해보상보험의\n  부담금       * ’22.7월 이후(고용안정/직업능력개발) 상시근로자 수에 따라 차등 보험료징수 등에\n                                                    관한 법률」\n 산재보험료       시설별 생산품에 따른 산업재해보장보험의 보험료 징수에        (시행령 제12조 ,\n  부담금                   따른 요율 적용                     제13조)\n\n※ 고용보험료는 사업장 근로자 수에 따라 차등 적용되므로 관련기관 확인필요"}, {"p": 417, "t": "                                   Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n             [1년 미만 근속 근로자*의 퇴직급여･퇴직적립금의 관리]\n\n＊ 근로계약 기간이 1년 이상이면서 근속기간이 1년 미만인 근로자\n\n○ (인건비 국고보조 대상 근로자) 근속기간이 1년 미만인 자가 퇴직한 경우 해당 근로자의 퇴직급여･퇴직\n  적립금 중 국고 및 지방자치단체 보조금은 회계연도 종료 후 3월 이내에 반환해야 함\n○ (인건비 국고보조 대상이 아닌 근로자) 근속기간이 1년 미만인 자가 퇴직한 경우 해당 근로자의 퇴직급여･\n  퇴직적립금을 반환하지 않고 퇴직 후 3월 이내에 퇴직급여･퇴직적립금 목으로 여입 후 타 목으로 재편성\n  해야 함\n ※ 2021년 정부합동감사 제도개선 과제\n\n\n3) 유급병가                                                          제4장\n\n○ 지방자치단체의 장 또는 운영법인･시설의 장은 다음 각 호의 어느 하나에 해당\n   하는 경우, 장애인 직업재활시설 종사자에게 자율적으로 정하는 범위에서 유급\n   병가를 허가할 수 있음. 단, ‘자율적으로 정하는 범위’는 최소 연 30일 이상이\n   될 것을 권고\n  가. 질병이나 부상으로 인하여 직무를 수행할 수 없을 때\n  나. 감염병에 걸려 그 종사자의 출근이 다른 종사자 또는 이용장애인의 건강에\n     영향을 미칠 우려가 있을 경우\n\n○ 병가 일수가 연간 6일을 초과하는 경우, 의사의 진단서를 첨부하여야 함\n\n○ 2025년 12월을 기준으로 지자체 또는 시설별로 자체 운영중인 유급병가\n  제도가 있는 경우, 본 내용을 근거로 종전에 비해 유급병가의 기간･조건 등이\n  종사자에게 불리하게 변경되지 않도록 주의.\n  ※ 유급병가 제도의 세부적인 운영에 대해서는 지자체･시설별 개별 지침 등을 마련하여 운영할 수\n    있음"}, {"p": 418, "t": "           2026년 장애인 직업재활시설 종사자 인건비 가이드라인\n\n1. 2026년 장애인 직업재활시설 종사자 기본급 가이드라인\n                                                                                                 (단위： 원 / 월)\n     직위                             직업훈련교사              생산･판매        간호사        시설관리                     조리원\n           시설장        사무국장                                                                   사무원\n호봉                                선임          일반        관리기사         영양사         기사                      위생원\n 1호봉      2,980,600   2,683,200 2,580,100   2,477,200   2,477,200   2,477,200   2,477,200   2,281,800   2,197,000\n 2호봉      3,082,400   2,769,600 2,654,000   2,538,600   2,538,600   2,538,600   2,538,600   2,324,300   2,222,100\n 3호봉      3,186,800   2,870,500 2,738,200   2,606,200   2,606,200   2,606,200   2,606,200   2,366,500   2,261,100\n 4호봉      3,305,300   2,973,900 2,843,000   2,712,200   2,712,200   2,712,200   2,712,200   2,411,500   2,302,700\n 5호봉      3,440,900   3,095,900 2,960,100   2,824,500   2,824,500   2,824,500   2,824,500   2,475,400   2,343,500\n 6호봉      3,582,800   3,221,100 3,080,600   2,940,500   2,940,500   2,940,500   2,940,
