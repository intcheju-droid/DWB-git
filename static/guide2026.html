  000     1       20.00.00   21.01.01~25.12.31\n 2   00    000    000      000    2-a      21.00.00   22.01.01~24.12.31\n 3   00    000    000      000    2-b      21.00.00   22.01.01~25.12.31\n 4   00    000    000      000     3       22.06.31   22.06.31~25.12.31\n 5   00    000    000      000     4       23.00.00   24.01.01~26.12.31\n 6   00    000    000      000    5-a      21.07.28   21.07.28~25.12.31\n 7   00    000    000      000    5-b      22.01.28   22.01.28~26.12.31\n 8   00    000    000      000     6       21.06.28   21.06.28~25.12.31"}]}, {"title": "Ⅶ. 장애인실비입소이용료 지원 사업", "start": 265, "end": 266, "subs": [], "pages": [{"p": 265, "t": "                                  Ⅶ. 장애인실비입소이용료 지원 사업\n\n\n    Ⅶ     장애인실비입소이용료 지원 사업\n\n\n1                                                               제2장\n     실비입소 제도\n○ 개 념\n    - 이용 장애인이 실비를 지급하고 시설서비스 이용권을 보장하는 제도\n    * 개인별 장애종류와 중증도에 따라 시설 입소욕구가 크고 반드시 충족되어야 할 것으로 개별 상담에       설\n      의해 적합성이 판정된 경우 입소에 따른 비용을 실비로 부담토록 하고 시설 서비스 이용 조치\n\n○ 실비입소 대상\n\n    - 등록 장애인으로서 시설서비스 이용 욕구가 있고 거주시설 서비스가 필요\n     하다고 인정되는 자\n\n○ 대상시설\n\n    - 장애인거주시설 중 지방자치단체에 실비장애인거주시설로 신고하여 보조금을\n     100%로 지원받고 있는 시설\n    * 서비스 제공 및 이용절차는 장애인거주시설 공통사항에 따름\n    * 실비 장애인거주시설 입소료 지원사업 대상인 해당 시도는 관할 실비시설에 대해 “실비 장애인\n      거주시설 입소이용료 지원사업 예산”을 보장시설에 준하여 “장애인거주시설 인건비 및 관리\n      운영비”로 지원하도록 함\n\n\n2 실비입소 비용\n\n○ 1인당 490,700원 범위 내에서 비용을 수납할 수 있다.\n    * 지적장애인 및 자폐성장애인에 대하여는 월 34,000원 이하, 영유아 및 중증 장애인에 대하여는\n      월 51,000원 이하의 비용을 추가하여 수납 할 수 있음"}]}]}, {"no": 3, "title": "장애인 지역사회재활시설", "start": 267, "end": 372, "sections": [{"title": "Ⅰ. 장애인 지역사회재활시설 공통", "start": 269, "end": 284, "subs": [], "pages": [{"p": 269, "t": "                                 Ⅰ. 장애인 지역사회재활시설 공통\n\n\n    Ⅰ      장애인 지역사회재활시설 공통\n\n\n1    목적\n\n○ 장애인복지법 제58조제2항의 규정에 따른 장애인지역사회재활시설(이하 “지역\n    사회재활시설”이라 한다)의 설치 및 운영전반에 관하여 기본적으로 필요한\n    공통적 사항을 정함으로써 지역사회재활시설의 운영상 일관성 유지 및 사업의\n    효율성 제고를 도모\n    ※ 개별시설 운영지침에서 별도로 명시된 사항이 없을 경우 본 공통지침 또는 「사회복지시설 관리       인\n      안내」를 따름\n2 근거법령\n○ 시설의 종류와 기능：장애인복지법 제58조제2항 및 동법시행규칙 제41조\n    별표 4\n\n○ 시설의 설치신고 및 운영개시, 감독：장애인복지법 제59조 내지 제61조\n\n○ 시설의 설치신고 등 세부사항：장애인복지법시행규칙 제42조 내지 제44조\n\n○ 시설의 재무회계 관리：사회복지법인 및 사회복지시설 재무･회계규칙 중\n    복지관 등 시설회계\n\n○ 집단급식소의 설치：식품위생법 등 관계 규정\n\n○ 기타 이용료 징수 등 일반사항：사회복지사업법 등 관계규정"}, {"p": 270, "t": " 3 지역사회재활시설의 종류와 기능\n\n ｢장애인복지법시행규칙｣ 제41조 별표 4의 규정에 의한 지역사회재활시설의\n 종류와 기능\n\n ○ 장애인 복지관：장애인에 대한 각종 상담 및 사회심리･교육･직업･의료재활\n   등 장애인의 지역사회생활에 필요한 종합적인 재활서비스를 제공하고 장애에\n   대한 사회적 인식개선 사업을 수행하는 시설\n\n ○ 장애인 주간이용시설：일상생활 및 지역사회생활을 영위하는 데 지원이 필요한\n   장애인에게 낮 시간 동안 활동 위주의 프로그램 및 교육 지원 등을 제공하는\n   시설\n\n ○ 장애인 체육시설：장애인의 체력증진 또는 신체기능회복 활동을 지원하고 이와\n   관련된 편의를 제공하는 시설\n\n ○ 장애인 수련시설：장애인의 문화･취미･오락활동 등을 통한 심신수련을 조장･\n   지원하고 이와 관련된 편의를 제공하는 시설\n\n ○ 시각장애인 등 생활지원센터(시각장애인+(플러스) 지원센터)：시각장애인 등\n   에게 이동서비스를 지원하고, 지역사회 거주 시각장애인 등을 적시에 발굴하여\n   재활상담, 보행･점자･정보화 등 교육, 일상생활기술 훈련 등 개인별 맞춤 복지\n   서비스를 제공하는 시설\n\n ○ 수어통역센터：의사소통에 지장이 있는 청각･언어장애인에 대한 수어통역\n   및 상담서비스를 제공하는 시설\n\n ○ 점자도서관：시각장애인에게 점자간행물 및 녹음서를 열람하게 하는 시설\n\n ○ 점서 및 녹음서 출판시설：시각장애인을 위한 점자간행물 및 녹음서를 출판\n   하는 시설\n\n ○ 장애인 재활치료시설：장애아동을 포함한 장애인에게 언어･미술･음악 등\n   재활치료에 필요한 치료, 상담, 훈련 등의 서비스를 제공하고 서비스를 이용한\n   자로부터 비용을 수납하여 운영하는 시설"}, {"p": 271, "t": "                               Ⅰ. 장애인 지역사회재활시설 공통\n\n\n4 지역사회재활시설의 설치･운영신고 등\n\n가. 시설의 설치･운영(변경 포함) 신고\n\n○ 국가 또는 지방자치단체 외의 자가 지역사회재활시설을 설치･운영하고자 하는\n  때에는 장애인복지법 에서 정한 시설과 설비를 갖추고 필요한 서류를 첨부하여\n  관할 시장･군수･구청장에게 동법 시행규칙 제43조 관련 별지 제20호 서식에\n  의거 ‘장애인복지시설 설치･운영신고서’를 제출                                 제3장\n\n○ 시장･군수･구청장은 동 신고서를 면밀히 검토, 관계공무원으로 하여금 해당\n  시설과 설비를 적정하게 갖추고 있는지의 여부를 확인한 후 동법시행규칙\n  제43조 관련 별지 제23호 서식에 의거 ‘장애인복지시설 신고증’을 교부\n나. 설치･운영 신고시 제출서류(장애인복지법시행규칙 제43조)\n○ 정관 1부(법인에 한한다)\n\n○ 시설운영에 필요한 재산목록 1부(부동산등기부등본을 포함한다)\n\n○ 법인등기부등본 1부(법인에 한한다)\n\n○ 사업계획서 및 예산서 각 1부\n\n○ 시설의 운영에 관한 규정 각 1부\n\n○ 시설의 평면도(시설의 층별 및 구조별 면적을 표시하여야 한다)와 설비구조\n  내역서 각 1부\n  ※ 시장･군수･구청장은 시설의 평면도를 통해 시설이 장애인복지법령에서 정한 기준에 부합하는지의\n    여부를 검토･확인\n\n○ 시설의 장의 주민등록표초본 1부(시설의 장이 직접 시설의 설치･운영을 신고\n  하는 경우에는 본인의 주민등록증을 확인함으로써 이에 갈음한다)"}, {"p": 272, "t": "다. 시설 설치 시 유의사항\n\n ○ 지역사회재활시설을 설치하는 경우에는 시설의 설계 단계부터 장애인복지\n   관련 전문가, 지역장애인 등의 의견을 충분히 수렴함으로써 재가장애인의 특성\n   및 복지 욕구에 부합하는 수요자 중심의 시설이 될 수 있도록 하여야 함.\n\n  - 특히, 장애인 복지관 및 장애인 체육관 등 건축 규모가 큰 지역사회재활시설의\n   경우 장애인의 이용상 편의성과 접근성 등 주변 환경과 입지가 유리한 지점에\n   건립 부지를 확보하여야 함.\n\n\n 5 지역사회재활시설의 위탁\n    (사회복지사업법 제34조제5항 및 동법 시행규칙 제21조2)\n\n ○ 국가 또는 지방자치단체가 설치한 시설은 필요한 경우 사회복지법인 또는\n   장애인복지단체 등 비영리법인에게 위탁하여 운영\n   ※ 국가･지자체 외의 자(법인･개인 등)가 설치한 시설은 위･수탁 불가\n\n ○ 국가 또는 지방자치단체가 시설을 위탁하여 운영하고자 하는 때에는 다음 각\n   호의 내용이 포함된 계약을 체결\n\n  - 수탁자의 명칭, 주소 및 대표자의 이름\n  - 위탁계약기간\n  - 위탁대상시설 및 업무내용\n  - 수탁자의 의무 및 준수사항\n  - 시설의 안전관리에 관한 사항\n  - 시설종사자의 고용승계에 관한 사항\n  - 계약의 해지에 관한 사항\n  - 기타 이용료 징수 등 시설의 운영에 필요하다고 인정되는 사항\n   ※ 임원의 자격(결격사유 등) 확인 필요, 시설 위･수탁시 종사자 고용승계가 원칙임"}, {"p": 273, "t": "                               Ⅰ. 장애인 지역사회재활시설 공통\n\n\n○ 위탁계약기간은 5년으로 한다. 다만, 위탁자가 필요하다고 인정할 때에는 그\n  계약 기간을 갱신할 수 있음.\n\n\n6 지역사회재활시설 운영 기준\n\n가. 이용자 요건\n○ 지역사회재활시설의 이용자는 장애인복지법 제2조의 규정에 의한 장애인\n   이어야 한다. 다만, 지역 사회와의 유대 강화 및 사회통합 분위기 조성을\n   위하여 해당 지역 주민도 사회통합 프로그램을 일부 이용할 수 있음. 또한\n   장애인복지법 제2조의 규정에 의한 장애인은 아니지만 전문의 소견이 있거나\n   이용시설 진단판정 결과 서비스지원이 필요한 경우 이용 가능함.\n나. 관리 규정(장애인복지법시행규칙 제41조 및 제42조 별표 5)\n\n\n각 지역사회재활시설은 다음 사항에 대한 규정을 제정･시행하여 시설의 적정한\n운영을 도모\n\n○ 직제･정원 및 직원의 업무분장, 인사관리\n\n○ 시설이용자의 처우요령(이용자 권익옹호 및 정보보호)\n\n○ 시설이용자의 재활서비스 이용지침\n\n○ 재활프로그램의 내용\n\n○ 기타 시설의 관리에 관한 중요한 사항\n\n다. 각종 장부의 비치(장애인복지법시행규칙 제41조 및 제42조 별표 5)\n\n○ 관리에 관한 장부\n\n - 직원관계철"}, {"p": 274, "t": "  - 회의록철\n\n  - 사업일지\n\n  - 문서철\n\n  - 문서접수･발송대장\n\n  - 차량운행일지\n\n ○ 사업에 관한 장부\n\n  - 시설이용자 관계서류(이용자명부, 개별상담기록부 등)\n\n  - 재활프로그램 관리대장\n\n  - 교육･훈련 관계서류(훈련일지 및 평가관계서류)\n\n ○ 재무･회계에 관한 장부\n\n  - 총계정원장 및 수입･지출보조부\n\n  - 금전출납부 및 그 증빙서류\n\n  - 예산서 및 결산서\n\n  - 비품수불대장\n\n  - 비품(장비)대장\n\n  - 재산대장･재산목록과 그 소유권에 관한 증빙서류\n\n  - 이용료 비용부담 관계서류\n\n  - 각종 증빙서류 및 기타 필요한 서류\n\n라. 시설의 개방운영\n\n 각 지역사회재활시설은 당해 시설운영위원회를 통해 지역주민의 참여를 유도하고,\n 시설의 기자재와 설비 등을 지역사회에 최대한 개방함으로써 지역사회와의 연계를\n 활성화하여 지역 주민이 시설의 기능과 사업에 대하여 동참할 수 있도록 조치"}, {"p": 275, "t": "                                  Ⅰ. 장애인 지역사회재활시설 공통\n\n\n7    시설 운영위원회 설치･운영\n     (사회복지사업법 제36조 및 동법 시행규칙 제24조, 사회복지시설 관리안내)\n\n「사회복지사업법」에 따라 장애인 지역사회재활시설은 다음과 같이 시설운영\n위원회를 설치하고 운영하여야 함.\n    ※ 시장･군수･구청장이 공동으로 운영위원회를 두는 것이 필요하다고 인정하는 경우에는 예외적으로\n      3개 이내의 시설에 1개 공동위원회 가능\n\n가. 구성\n○ 위원회는 위원장 1인을 포함하여 5인 이상 15인 이하의 위원으로 구성하고,\n    법 제36조 제2항 각 호 중 같은 호에 해당하는 위원이 2명을 초과해서는 아니 됨              지\n○ 위원회의 위원은 아래에 해당하는 자 중에서 관할 시장･군수･구청장이 임명\n     또는 위촉\n    - 시설의 장\n\n    - 시설 이용 장애인 대표\n    - 시설 이용 장애인의 보호자 대표\n    - 시설 종사자의 대표\n    - 해당 시･군･구 소속의 사회복지업무를 담당하는 공무원\n    - 후원자 대표 또는 지역주민\n    - 공익단체에서 추천한 사람\n    * 공익단체는 ｢비영리민간단체 지원법｣ 제2조에 따른 비영리민간단체를 말함\n\n    - 그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이 풍부한 자\n    ※ ① 시설장의 친인척, ② 설치･운영자인 법인의 임원 등 특수관계가 명확한 자(시설장 제외)는\n      위원으로 임명･위촉하지 않도록 할 것\n    ※ ｢지방자치법｣ 제43조제5항에 따라 지방의회의원은 지방자치단체로부터 운영비 등을 보조받는\n      사회복지사업을 하는 자가 설치･운영하는 사회복지시설의 운영위원회 위원이 될 수 없음에 유의할\n      것(법제처 해석, 17-0433)"}, {"p": 276, "t": " ○ 위원장은 호선, 위원의 임기는 3년으로 하되 연임할 수 있고 보궐위원의\n   임기는 전임자의 잔임 기간으로 함\n\n\n나. 심의사항\n\n ○ 시설운영계획의 수립･평가에 관한 사항\n\n ○ 사회복지프로그램의 개발･평가에 관한 사항\n\n ○ 시설종사자의 근무환경 개선에 관한 사항\n\n ○ 시설이용자의 생활환경 개선 및 고충처리 등에 관한 사항\n\n ○ 시설 종사자와 이용자의 인권보호 및 권익증진에 관한 사항\n\n ○ 시설과 지역사회와의 협력에 관한 사항\n\n ○ 그 밖에 시설의 장이 운영위원회의 회의에 부치는 사항\n\n\n다. 보고사항\n\n ○ 시설의 회계 및 예산･결산에 관한 사항\n\n ○ 후원금 조성 및 집행에 관한 사항\n\n ○ 그 밖에 시설운영과 관련된 사건･사고에 관한 사항\n\n   ☞ 국가감염병 확산 등 특수한 상황이 있을 경우, 서면보고로 갈음 가능\n\n\n라. 운영\n\n ○ 분기별 1회 이상 정기회의 개최, 운영위원회 운영규칙에 규정한 회의개최\n   요건에 해당할 경우(재적위원 1/3의 요청이 있을 경우 등) 수시회의 개최"}, {"p": 277, "t": "                         Ⅰ. 장애인 지역사회재활시설 공통\n\n\n○ 회의록을 작성하고, 회의는 시설이용자, 시설종사자 등에게 공개를 원칙으로\n  하되, 개인정보보호 등 불가피한 사유시 위원장이 비공개 결정을 할 수 있음\n  (비공개사류는 공개해야 함)\n\n○ 회의는 대면심의가 원칙이며 참여자 확인할 수 있는 원격영상회의는 허용\n\n\n마. 기타 자세한 사항은 당해연도 「사회복지시설 관리안내」 참조\n\n\n8 지역사회재활시설의 재무회계 관리\n○ 각 지역사회재활시설의 재무회계는 법인회계와는 별도로 구분하여 독립채산\n  제로 운영\n○ 각 지역사회재활시설의 재무회계 관리는 ‘사회복지법인 및 사회복지시설재무･             활\n  회계규칙’의 시설회계를 준용하여야 하며, 동 규칙에서 정하지 아니한 사항은\n  국가재정법, 지방재정법 및 물품관리법 등 정부 재무회계 관련법령을 준용\n\n○ 각 지역사회재활시설의 모든 수입과 지출은 수입결의서와 지출결의서에 의하여\n  입금 또는 지출하여야 하며, 모든 재무회계 행위는 관계장부에 기재\n\n○ 각 지역사회재활시설은 시설 운영의 투명성을 확보하기 위하여 운영비는 신용\n  카드로 지출을 원칙으로 하되 농어촌 지역이나 카드 미가맹점에 대해서는\n  On-line입금을 적극 활용"}, {"p": 278, "t": " 9 조달품목 구입\n\n ○ 필요성：지역사회재활시설이 조달수요기관으로 지정받아 각종 시설 내 기능\n   보강 시 해당 정부조달품목을 구입･사용함으로써 품질의 보증 및 공신력\n   제고와 구입비용의 절감 등을 도모\n\n ○ 관계법령：조달사업에관한법률 제2조제4호 다목 및 동법시행령 제4조\n\n ○ 대상기관 범위\n\n  - 사회복지사업법의 규정에 의하여 허가받은 사회복지법인\n\n  - 민법 제32조에 의하여 주무부장관의 허가를 받아 설립된 법인 중 ｢공익법인\n   설립･운영에 관한법률｣이 규정하고 있는 공익법인\n\n  - 기타의 기관으로서 필요에 의하여 조달청장이 추가로 인정하는 개별기관\n\n ○ 조달 수요기관 지정요청 절차\n\n  - 수요기관 지정신청 및 승인\n\n   ∙ 대상기관이 해당지역 지방조달청(업무과)에 수요기관으로 지정 요청\n\n   ∙ 구비서류\n\n    (1) 법인설립허가증 사본 1부\n\n    (2) 사업자등록증 사본 1부\n\n    (3) 법인정관 사본 1부\n\n    (4) 시설허가증 사본 1부(시설신고증)\n\n    (5) 정부예산지원근거 1부(국고보조금 지급내역 공문 등 관계증빙자료)\n     ※ 기타 문의는 해당지역 지방조달청(업무과)\n\n ○ 지역사회재활시설의 장애인생산품 구입 장려\n\n  - 지역사회재활시설에서 행정봉투, 복사용지, 재생화장지, 칫솔 및 면장갑 등을\n    구입할 경우에는 장애인생산품을 우선 구매하도록 노력"}, {"p": 279, "t": "                           Ⅰ. 장애인 지역사회재활시설 공통\n\n\n10 이용료 징수\n\n가. 이용료 징수 근거\n\n○ 각 지역사회재활시설에서는 사회복지사업법령의 규정에 의거 복지조치에\n  필요한 비용을 부담한 지방자치단체의 장 기타 시설을 운영하는 자는 그\n  혜택을 받은 본인 또는 그 부양의무자(국민기초생활보장법상의 부양 의무자를\n  말한다)로부터 그가 부담한 비용의 전부 또는 일부를 징수할 수 있음.                제3장\n\n○ 또한, 그 혜택을 받은 본인이 국민기초생활보장법에 의한 국민기초생활보장\n  수급자인 경우에는 그 비용을 징수하지 아니하되, 중식비 및 행사 참가비 등에             애\n  한해 실비를 징수할 수 있음.\n나. 이용료 산정 및 징수 절차\n○ 이용료는 지방자치단체 위탁 운영시설의 경우 해당 자치단체장이 정하고, 법인\n  운영시설의 경우 자체 관련 규정에 의함.\n\n○ 이용료 산정 시 이용자의 경제적 부담을 고려하여 최소 부담의 원칙으로 함\n\n○ 이용료의 징수 시 그 산출근거를 명시하여 서면으로 본인 또는 그 부양 의무자\n  에게 통지하고, 시설 게시판 및 홈페이지 등 시설 공고란에 상시 게시하여\n  이용자가 이용료에 대하여 쉽게 알 수 있도록 하고, 시각장애인에게 이용료를\n  통지할 경우, 점자를 병기하고 시설 게시판 및 홈페이지 등에도 점자병기 또는\n  음성정보로 공지될 수 있도록 조치"}, {"p": 280, "t": " 11 종사자 채용\n\n가. 공개모집\n\n ○ 시설장 및 종사자 신규 채용은 직위와 관계없이 공개모집을 원칙으로 하며,\n   기타 자세한 사항은 당해연도 사회복지시설 관리안내 참조\n\n나. 장애인 고용\n\n ○ 장애인 고용증대 차원에서 일정 자격을 갖춘 장애인이 우선 채용되도록 적극\n   노력\n\n ○ 장애인 지역사회재활시설 위탁･운영 법인이 운영 중인 시설 종사자의 장애인\n   고용으로 발생한 장애인 고용장려금 등 외부지원금은 장애인 종사자 임금 등\n   처우개선, 시설의 운영 개선을 위해 사용하도록 노력\n\n다. 종사자 채용시 유의사항\n\n ○ 장애인복지법, 사회복지사업법, 아동복지법, 노인복지법 등 관련 규정에 따라\n   관할 지자체 및 시설 운영자는 다음 사항을 고려하여 종사자 채용에 각별한\n   주의를 기할 것\n\n  ① 장애인복지법 제59조의3(장애인관련기관에의 취업제한 등)\n\n    - 장애인학대관련범죄나 성범죄로 형 또는 치료감호를 선고하는 경우에는\n        판결(약식명령을 포함한다)로 그 형 또는 치료감호의 전부 또는 일부의 집행을\n        종료하거나 집행이 유예･면제된 날(벌금형을 선고받은 경우에는 그 형이\n        확정된 날을 말한다)부터 일정기간동안 장애인복지시설을 운영하거나 장애인\n        복지시설에 취업 또는 사실상 노무를 제공할 수 없음\n\n        ∙ 장애인 지역사회재활시설의 설치 신고･허가 등을 관할하는 지방자치\n         단체의 장은 장애인학대관련범죄나 성범죄로 취업제한명령을 선고받은"}, {"p": 281, "t": "                          Ⅰ. 장애인 지역사회재활시설 공통\n\n\n   사람이 장애인지역사회재활시설을 운영하거나 장애인복지시설에 취업\n   또는 사실상 노무를 제공하고 있는지를 직접 또는 관계기관 조회 등의\n   방법으로 연 1회 이상 확인 점검해야 함\n\n  ∙ 장애인 지역사회재활시설의 장은 그 시설에 취업 중이거나 사실상 노무를\n   제공 중인 사람 또는 취업하려 하거나 사실상 노무를 제공하려는 사람\n   (이하 “취업자등”이라 한다)에 대하여 장애인학대관련범죄등의 경력을\n   확인하여야 하며, 이 경우 본인의 동의를 받아 관계 기관의 장에게 장애인\n   학대관련범죄등의 경력 조회를 요청하여야 한다. (다만, 취업자등이 장애인            제3장\n\n   학대관련범죄등 경력 조회 회신서를 장애인관련기관 운영자에게 직접\n   제출한 경우에는 장애인학대관련범죄등의 경력 조회를 한 것으로 봄)\n② 아동복지법 제29조의3(아동관련기관의 취업제한 등)\n - 아동학대관련범죄로 형 또는 치료감호를 선고하는 경우에는 판결(약식\n  명령을 포함한다)로 그 형 또는 치료감호의 전부 또는 일부의 집행을 종료              활\n  하거나 집행이 유예･면제된 날(벌금형을 선고받은 경우에는 그 형이 확정된              설\n\n  날을 말한다)부터 일정기간 동안 장애인복지시설을 운영하거나 아동관련\n  기관에 취업 또는 사실상 노무를 제공할 수 없음\n\n③ 노인복지법 제39조의17(노인관련기관의 취업제한 등)\n\n - 노인학대관련범죄로 형 또는 치료감호를 선고하는 경우에는 판결(약식\n  명령을 포함한다)로 그 형 또는 치료감호의 전부 또는 일부의 집행을 종료\n  하거나 집행이 유예･면제된 날(벌금형을 선고받은 경우에는 그 형이 확정된\n  날을 말한다)부터 일정기간 동안 장애인복지시설을 운영하거나 노인관련\n  기관에 취업 또는 사실상 노무를 제공할 수 없음\n\n④ 사회복지사업법 제35조(시설장의 장) 및 제35조의2(종사자)에 해당하는 사람\n\n - 관할행정기관장은 취업제한명령을 위반하여 장애인관련기관을 운영 중인\n  장애인관련기관 운영자에게 운영 중인 장애인관련기관의 폐쇄를 요구\n  하여야 함(장애인복지법 제59조의3제9항)"}, {"p": 282, "t": "    - 장애인관련기관의 운영자가 제59조의3제5항을 위반하여 취업자 등에\n        대하여 장애인학대관련범죄등 경력을 확인하지 아니한 경우에는 500만원\n        이하의 과태료를 부과함(장애인복지법 제90조)\n\n ○ 장애인 지역사회재활시설의 장과 그 종사자(장애인 지역사회재활시설에서 복무\n   하는 ｢병역법｣ 제2조제1항제10호에 따른 사회복무요원을 포함)는 그 직무상\n   장애인학대 및 장애인 대상 성범죄를 알게 된 경우에는 지체 없이 장애인권익\n   옹호기관 또는 수사기관에 신고하여야 함(장애인복지법 제59조의4제2항)\n\n라. 기타 사항\n\n ○ 신규로 설립･운영되는 시설의 경우 직원 임용시 지역사회재활시설 직원 보수\n   표의 직급별 상･하한 범위 내에서 연봉제로 할 수 있다. 다만, 기존 시설 중\n   연봉제 도입을 실시코자 하는 경우는 전직원의 과반수이상 동의를 얻어야 한다.\n\n ○ 기능직･고용직을 신규 채용하는 경우에는 계약직이나 임시직으로 채용 가능\n\n ○ 직원의 채용시에는 다음의 서류를 확인･제출 받아야 하고, 경력 등 확인이\n   필요한 경우에는 해당기관에 조회\n\n  - 이력서\n\n  - 주민등록초본(채용 후 가족수당 등 수당신청 필요시 등본 추가 제출)\n\n  - 경력증명 관계서류(경력자에 한함, 초임 또는 경력 호봉획정시 근거자료)\n\n  - 자격 또는 면허증 사본(소지자에 한함)\n\n  - 기타 법인의 대표이사나 시설장이 필요하다고 인정하는 서류\n\n ○ 시･군･구청장은 장애인복지시설 직원 임면보고 및 지도･점검시 종사자 경력\n   사항 및 증빙서류 등을 철저히 확인･관리"}, {"p": 283, "t": "                                  Ⅰ. 장애인 지역사회재활시설 공통\n\n\n12 시설 종사자 보수교육\n\n○ 사회복지사, 장애인재활상담사 등 장애인복지법 및 사회복지사업법에 따른\n  법정 자격증을 소지한 장애인 지역사회재활시설 종사자는 관계 법령에서 정한\n  필수 보수교육을 받도록 노력해야 한다.\n * 장애인복지법 제75조 및 동법 시행규칙 제61조\n\n - 법률에 따른 보수교육 등 의무교육을 이수하는 경우 공가처리, 사회복지시설\n  종사자 대체인력 지원 사업 등 활용                                          제3장\n\n\n ◈ ｢사회복지시설 종사자 대체인력지원｣이란?\n 시설종사자가 휴가 사용이나 교육 참여 등으로 결원시 대체인력을 지원함으로써 재충전의 기회를 통해          지\n 자기계발 등 자질을 향상하고 시설종사자 부재 시 업무공백을 최소화함으로써 시설의 원활한 운영을           사\n 목적으로 함\n ○ 지원대상 : 사회복지사업법 제2조제4호에 따른 사회복지시설\n ○ 지원사유 : ① 휴가(결혼 우선), ② 교육, ③ 기타 시설종사자 결원 발생\n ○ 우선순위 : 현 사회복지시설에서 1년 이상 근무한 종사자 및 소규모 시설(5인 이하) 우선지원\n  ※ 5인 이하 소규모 시설의 돌봄서비스를 겸하고 있는 시설장 포함\n ○ 신청방법 : 대체인력지원 관리시스템으로 대체인력지원 신청서 제출\n ○ 문 의 : 시･도 대체인력지원센터\n\n\n13 안전관리\n\n○ 장애인 보호구역 지정\n\n - ｢어린이･노인 및 장애인 보호구역의 지정 및 관리에 관한 규칙｣에 따라,\n  장애인복지시설을 설립･운영하는 자는 특별시장･광역시장･특별자치도지사\n  또는 시장･군수에게 장애인복지시설의 주변도로를 장애인 보호구역으로\n  지정하도록 신청할 수 있다."}, {"p": 284, "t": " 14 지도･감독 및 행정처분 이력 관리\n\n ○ 지방자치단체장은 지역사회재활시설을 설치･운영하는 자의 소관업무에 관하여\n   지도･감독을 하며, 필요한 경우 당해 시설에 관하여 보고 또는 관련서류의\n   제출을 명하거나, 소속 공무원으로 하여금 당해 시설의 운영 상황, 장부 기타\n   서류를 조사･검사하거나 질문하게 할 수 있으며 관계공무원이 그 직무를 행할\n   때에는 권한을 표시하는 증표를 해당 시설에 제시\n\n ○ 지방자치단체장은 장애인지역사회재활시설이 장애인복지법 시행규칙 및 사회\n   복지사업법 시행규칙의 행정처분 요건에 해당할 경우 시설의 개선, 사업의\n   정지, 시설장의 교체를 명하거나, 시설의 폐쇄를 명할 수 있음\n\n ○ 행정처분 결과는 처분 부과 주체가 차세대 사회보장정보시스템(행복e음) 내\n   [기관관리감독]-[행정처분관리]탭에 반드시 입력하여 관리해야 함\n\n ○ 지방자치단체장은 지역사회재활시설의 지도･감독에 있어 사업의 특수성과\n   전문성을 충분히 이해하고, 이에 대한 지도･감독체계를 확립하여 지역사회\n   재활시설 운영의 전문성과 자율성을 해치지 않도록 조치\n\n\n 15 보조금 지원 중단\n\n ○ 지방자치단체장은 장애인 대상 범죄 발생･학대, 성폭력･성희롱 사건이 발생\n   하여 장애인권익옹호기관으로부터 학대판정, 수사기관의 수사 등으로 사회적\n   으로 문제가 된 시설 또는 이를 은폐한 시설은 보조금 지원 중단 및 차년도\n   지원 선정 대상 배제 등의 조치를 할 수 있다.\n  - 지방자치단체장은 시설 보조금 지원 중단 등의 처분을 할 경우 「행정절차법」\n   제21조 및 제22조에 따라 그 처분을 사전통지하고 당사자의 의견을 청취\n   하여야 함\n  - 보조금 지원 중단 결정을 한 경우, 이용 장애인의 전원조사 및 서비스 지원\n   계획 조치를 선 시행하여야 함"}]}, {"title": "Ⅱ. 장애인 복지관 운영", "start": 285, "end": 304, "subs": [], "pages": [{"p": 285, "t": "                                 Ⅱ. 장애인 복지관 운영\n\n\n    Ⅱ    장애인 복지관 운영\n\n\n1   목적\n\n장애인 복지관(이하 “복지관”이라 함)의 운영에 필요한 사항을 정하여 장애인\n권리에 기반한 서비스 제공과 지역의 통합환경 조성을 통해 장애당사자의 지역\n사회 참여와 자립을 촉진함\n2 기본방침\n○ 복지관은 운영 및 사업수행에 있어 장애인의 의사와 선택을 존중하고, 인도\n    주의적 원칙 하에 이용자의 인간적 존엄성과 기본적 권리가 유지되도록 하고,             활\n    어떠한 경우에도 정치활동, 영리활동 및 특정 종교활동 등의 목적에 이용 금지            설\n\n○ 복지관의 종사자는 사회복지사업법 제5조에 의하여 그 복지업무를 행함에\n    있어서 장애인복지를 필요로 하는 사람을 위하여 차별 없이 최대로 수행\n\n○ 복지관은 이용 장애인에 대한 서비스는 물론 장애발생 예방과 지역 장애인\n    문제의 조사, 연구 등 장애인복지가 종합적으로 향상되도록 하여야 하며, 이를\n    위해 각 복지관에서는 장애인의 날(매년 4월 20일) 전･후 1주간을 ‘장애발생\n    예방주간 및 인식개선 주간’으로 정하여 지역주민, 학생, 직장인 등을 대상으로\n    장애발생예방 및 인식개선 프로그램을 실시\n\n○ 복지관은 지역장애인 등의 다양한 복지욕구를 해소하기 위하여 자원봉사자\n    활용, 지역 내 복지자원의 연결 등 당해 지역사회의 자원을 개발, 활용\n\n○ 복지관은 지역 장애인복지의 증진효과와 투입재원 및 수행사업의 적정성,\n    효율성, 지역기반 실천 등을 지속적으로 평가하고 이를 활용, 발전적 운영\n    개선방안을 강구"}, {"p": 286, "t": " ○ 복지관은 장애유형에 따른 다양한 교육적 욕구를 해소하고 장애인이 국민\n   으로서 평생에 걸쳐 능력과 적성에 따라 교육받을 권리를 가질 수 있도록\n   체계적이고 지속적인 평생교육을 지원\n\n ○ 복지관은 장애인복지 관련분야의 전문적인 지식과 기술을 가지고 있는 전문\n   인력에 의해 수행되도록 노력하고 종사자 역량강화를 위한 교육 실시\n\n ○ 복지관은 이용자의 인권침해를 예방하고 인권침해 발생 시 필요한 조치를 통해\n   이용자의 인권이 보장될 수 있도록 이용자와 직원에 대하여 정기적인 인권\n   교육을실시(단, 자연재해 감염병 등 불가피한 상황 발생 시 온라인을 통한 교육\n   실시)하고 직원의 안전과 권리를 보장하기 위해 노력\n\n ○ 복지관은 주말에 시설을 개방 또는 관련 프로그램을 운용하여 취업장애인 등\n   주말이용자의 편의를 도모\n\n\n 3 시설 설치 시 유의사항\n\n ○ 장애인복지관의 설치 계획시에는 건축물의 연면적은 장애인복지법시행규칙\n   제41조 및 제42조 관련 별표 5에 따라 최소 1,000㎡ 이상으로 하고 운영에\n   필요한 최소한의 주차공간을 확보해야 하며, 지역의 장애인 복지관 배치율,\n   등록장애인 수 및 재정자립도 등을 고려하여 가능한 한 건립 예산의 과도한\n   부담이 되지 않도록 하여야 함.\n\n ○ ｢식품위생법｣에 따라 1회 급식인원(종사자 포함)이 50명 이상인 장애인 복지관은\n   집단급식소 시설기준을 갖추고 설치･운영 신고를 하여야 함\n   * 집단급식소 설치 신고 대상임에도 미신고할 경우 500만원 이하의 과태료 부과(｢식품위생법｣\n     제101조)\n   * 관할지자체는 집단급식소 설치 및 운영을 위하여 예산을 지원하도록 노력하여야 하며, 상시 근로\n     (주 40시간) 법정필수인력에 대한 인건비를 지원할 수 있다."}, {"p": 287, "t": "                               Ⅱ. 장애인 복지관 운영\n\n\n4 운영\n\n○ 복지관은 개인별 지원, 사회환경 중심, 지역사회 관계망 기반 실천을 지향하며,\n 사회통합 환경 조성을 위하여 지역주민의 참여를 촉진하는 역할을 수행함\n\n○ 복지관은 중증장애인에 대한 서비스를 우선적으로 제공하여야 하며, 정당한\n 사유 없이 타 유형의 장애인 또는 중증장애인에 대한 서비스를 거부할 수 없음\n\n○ 복지관은 장애 정도에 관계없이 개인별 맞춤형 서비스를 지향하며, 종별(단종)\n 복지관의 경우 타 유형의 장애인에 대해서는 해당 장애유형의 복지관으로\n 연계할 수 있음\n○ 복지관은 정서, 심리적 어려움이 있는 이용자 등을 지원하기 위한 프로그램을\n 개발하고 정신건강전문가를 배치할 수 있음\n○ 관할 지역내 장애인의 복지증진을 위해 종합적인 서비스와 이를 통한 장애인의             재\n 사회참여를 지원하는 장애인복지센터로서의 기능과 역할을 충실히 수행할\n 수 있도록 아래 장애인 복지관의 주요기능을 참고하여 필요한 사업을 선택하여\n 유연하게 수행함\n\n- 관내 등록장애인 중 연령별 대비, 장애유형별 인원, 생활정도, 직업종사 유형,\n  관내 지역 경제기반, 관내 장애인복지에 대한 지역사회의 인식도, 장애인가족\n  및 자원 봉사자의 참여도 등을 적극 참고하여 이용자 욕구 중심의 사업계획을\n  수립･추진하여야 함\n\n○ 장애인 복지와 관련된 행정기관 및 유관기관, 지역사회단체 등과 긴밀한 협력\n 체계를 구축하여 사업수행의 효과성을 극대화하고 장애인 지원의 중심역할을\n 수행함\n\n○ 재가복지사업 예산(종전 재가복지봉사센터 예산)을 지원받은 시설은 반드시\n 동 사업을 수행하여야 함"}, {"p": 288, "t": " ○ 복지관은 서비스의 접근성을 높이기 위해 디지털 기반의 서비스를 활용하며,\n      이를 위하여 행정기관과 협의하여 진행하도록 함\n\n ○ 복지관은 이용자와 직원이 시설을 이용하기에 안전하고 편리한 시설환경을\n      갖추어야 함\n\n ○ 장애인 복지관의 주요 기능\n\n       서비스\n 구성           장애인복지관 역할              구성요소                 주요사업 예시\n       영역\n\n                              A. 공식서비스 중심형\n                                                    - 접수 및 상담\n                              - 이용자 욕구를 중심으로 다학제\n                                                    - 진단 및 사정\n                               전문가 협력을 통한 서비스 구성\n                                                    - 서비스 이용계획 수립 및 의뢰,\n                              - 기관 내 직접 서비스와 기관 외\n                                                     연계\n                               공식적 서비스 간 연계 주력\n\n              - 이용자 욕구에 따른\n       개인별                    B. 자연지원망 구축 중심형\n               서비스 이용 계획\n        지원                    - 당사자가 중요하게 생각하는\n 1            - 지역 장애인의 개별적\n        계획                     것과 당사자를 위해 중요한\n               욕구에 부합하는\n        수립                     것들의 균형을 찾고 지원\n               유연한 지원\n                              - 당사자가 계획의 전 과정에 참여 - 사람중심계획(PCP)\n                               하고 지원이 전문가가 아닌       - 자산기반접근 등\n                               당사자의 위치에서 실행되도록\n                               지원\n                              - 당사자 주변의 자연지원망을\n                               적극 활용한 지원\n\n              - 기능향상을 통해                            - 운동･지각향상\n               발달을 촉진시키는                            ∙ 운동발달(물리치료)\n               환경조성                                 ∙ 작업활동(작업치료)\n        중재    - 치료 효과를 향상                           ∙ 다감각촉진활동(심리안정치료,\n                              A. 기관 내 중재(치료)\n 2    (치료)와    시키기 위한 부모                             심리이완치료, 심리안정 반응\n                              - 다영역 전문적 치료 및 상담\n       컨설팅     대응방법 컨설팅                              촉진치료 등)\n              - 컨설팅 과정을 통해                          ∙ 수중운동\n               부모와 치료사가                             ∙ 감각통합활동\n               창의적인 방법 개발                           - 의사소통향상"}, {"p": 289, "t": "                                                     Ⅱ. 장애인 복지관 운영\n\n\n     서비스\n구성          장애인복지관 역할                 구성요소                      주요사업 예시\n     영역\n                                                         ∙ 언어활동(언어치료)\n                                                         - 학습능력 향상\n                                                         ∙ 특수교육\n                                                         - 사회적응력향상\n                                                         ∙ 심리운동\n                                                         ∙ 특수체육\n                                                         ∙ 음악활동(음악치료)\n                                                         ∙ 미술활동(미술치료)           제3장\n                                                         ∙ 놀이활동(놀이치료)\n                                                         - 기타\n                                                         - 어린이집 순회 치료 및 교육       인\n                             B. 지역사회지향 중재(치료)\n                                                         - 방문치료 및 교육             지\n                             - 생활현장(가정, 학교, 어린이집 등)\n                                                         - 지역사회공간을 활용한 치료\n                               방문: 찾아가는 적극적 컨설팅\n                                                          및 교육 등\n                             C. 타 기관의 중재(치료)를 통합\n                               하는 컨설팅\n                                                         - 관련기관(학교, 병원, 센터 등)\n                             - 여러 치료를 통합하여 치료 간\n                                                          다영역 컨설팅\n                              시너지 극대화, 치료효과를 위한\n                              관련자 간 협력과 다학제 지원\n\n                                                         - 문화예술 및 인문교육\n                             A. 기관 내 역동적 낮 활동\n                                                         ∙ 여가스포츠 프로그램\n                             - 개별 욕구와 관심, 일상생활에\n                                                         ∙ 문화예술향유･숙련 프로그램\n                              기반한 다양한 활동 중심형\n                                                         ∙ 생활소양 및 인문학적 교양\n            - 장애인 낮 시간을 위한    서비스 구성\n                                                           프로그램 등\n             재미있고 의미 있는\n     낮활동\n             활동 개발\n3     및                      B. 지역사회 허브(community hub)\n            - 관심행동 중증장애인\n     행동지원                      개발\n             대상 서비스 제공 및\n                             - 특화되고 다양한 활동중심지            - 장애인참여 평생교육기관 발굴\n             긍정적 변화 지원\n                              개발로 지역사회 활동 참여 촉진 - 마을지향 (지역사회)평생교육\n                             - 지역사회 일반주민 이용서비스를 - 기관연계 평생교육\n                              함께 이용할 수 있도록 발굴하고\n                              지원"}, {"p": 290, "t": "      서비스\n 구성          장애인복지관 역할               구성요소                    주요사업 예시\n      영역\n\n                            C. 중증장애인 행동지원\n                            - 이용자의 생애주기에 대한 장기적\n                             관점을 가지고 도전적 행동의\n                             소거를 넘어 사회적 포함(Social - 최중증 장애인 낮활동 지원 사업\n                             inclusion)을 통한 통합지향       - 융합돌봄사업\n                            - 사람중심 권리에 기반한 개인별\n                             지원, 다학제적 기초에 근거한\n                             통합적 접근\n\n\n                            A. 직업(적응)훈련\n                            - 이용자별 다양한 형태의 작업          - 직업적응훈련\n                             활동 지원                     - 현장훈련\n                            - 직업적 중증(최중증, 중장년, 고령 - 작업활동\n                             등) 작업활동 지원\n\n\n                            B. 적극적 지원고용                - 사람중심의 직업상담 및 평가\n                               (Active supported employment) - 맞춤형 사업체 개발\n                            - 이용자 중심의 배치 및 지원고용 - 배치 및 지원\n             - 지역사회 고용 중심    서비스                       - 취업 후 적응지도\n              네트워크 거점기관\n 4    직업지원\n             - 직업적 중증장애인\n                            C. 지역사회중심 직업지원\n              고용지원 중점기관\n                            - 지역사회 고용중심 네트워크구축\n                                                       - 장애인 고용관련 기관 네트워크\n                             및 파트너십 실천\n                                                       - 전환교육\n                            - 다양한 형태의 직업지원서비스\n                             연계\n\n\n                            D. 일자리 창출\n                            - 지역특성을 고려한 일자리 창출 - 공공 일자리 지원\n                             및 연계                      - 지역특화 일자리 개발\n                            - 거주지 중심 공공&민간 일자리 - 창업지원\n                             창출 및 연계"}, {"p": 291, "t": "                                                   Ⅱ. 장애인 복지관 운영\n\n\n     서비스\n구성           장애인복지관 역할                 구성요소              주요사업 예시\n     영역\n\n                              A. 가족(지원자) 역량강화 지원\n                                                     - 가족지원 전문상담\n                              - 생애주기별 정보제공･상담･부모\n             - 가족대상 개별 지원 및                          - 중도장애인 가족지원\n                               교육\n              옹호                                     - 부모역할, 부부관계 지원\n                              - 형제자매 지원서비스\n      가족     - 가족 역량 강화 집중                           - 비장애형제 지원\n                              - 동료상담, 자조집단 및 네트워크\n5    (지원자)    지원                                     - 부모자조모임 지원 등\n                               활성화 지원\n      지원     - 지역사회 내 돌봄\n              지원체계 구축을 위한\n                              B. 가족(지원자) 휴식 지원       - 가족문화 프로그램           제3장\n              전문적 개입\n                              - 가족휴식지원               - 긴급돌봄\n                              - 긴급돌봄지원 연계            - 돌봄가족휴가\n                                                     - 사례발굴 및 동행상담\n                              A. 사례관리\n                                                     - 사정 및 계획              역\n                              - 복합적이고 다양한 욕구를 가진\n                                                     - 지원 및 모니터링            회\n                               당사자에게 적절한 지원이\n                                                     - 종결 및 사후관리\n                               이루어질 수 있도록 지원\n                                                     - 지역사회 통합 사례회의         시\n\n                              B. 일상적 권익옹호\n                                                     - 동료상담\n                              - 전직원이 옹호서비스의 주체가\n             - 장애인이 지역사회에서                           - 자조모임\n                               되어 모든 서비스를 옹호의 관점\n              자신의 의사에 따라                             - 장애감수성 및 인권교육(직원\n                               에서 접근\n              본인이 원하는 바를                              및 이용자)\n     사례관리                     - 동료상담, 자조모임 등 장애인의\n              말하고 권리를 확보                             - 이용자의 정보접근 및 편의증진\n6     및                        의사결정, 권리확보 등을 위한 지원\n              하고 필요한 서비스를                             사업 등\n     권익옹호                     - 일상적 권익옹호를 위한 직원교육,\n              얻을 수 있도록 지원                            - 보조기구 관리, 수리, 임대\n                               쉬운 글 버전의 책자 제작, 인사\n             - 장애인들과 협력관계를                           - 인권옹호\n                               위원회 이용자 참여 등\n              형성하여 실천\n\n                              C. 독립적 권익옹호\n                              - 권익옹호 직무에 배치되어\n                               당사자와 의사소통하며 옹호의\n                               전과정 진행                - 권리침해 구제 및 사후지원\n                              - 권리침해 구제 후 남게 되는 여러\n                               가지 불편 사항을 지원하는 사후\n                               지원"}, {"p": 292, "t": "      서비스\n 구성            장애인복지관 역할             구성요소                  주요사업 예시\n      영역\n                                                     - 인권관련 조례 제정\n                             D. 구조적 권익옹호\n                                                     - 지역 내 권익옹호 네트워크 구성\n                             - 지역사회 연대를 통해 법률, 정책,\n                                                     - 지역사회 장애인복지 서비스\n                               실천과 관련된 구조적 변화도모\n                                                      개발 및 지원\n\n                             A. 지역사회 생활지원(재가서비스) - 일상생활지원\n                             - 경제적 어려움, 건강, 생활, 주거 - 주거환경개선\n                               환경 개선 등 일상생활에 필요한 - 여성장애인지원\n                               다양한 서비스 지원            - 장애인 무료급식 및 식사배달\n\n                             B. 주민조직화\n                             - 지역사회 문제해결을 위한 사람 - 주민활동가 교육\n      지역사회 - 장애인이 지역사회         들을 조직하고 동원, 자치조직 결성 - 주민조직체 형성\n       중심    내에서 성공적으로         등                     - 시민옹호사업\n 7      지원      자립할 수 있는 기반 - 장애인 개인의 의지, 희망, 꿈 등에 - 장애인 지원 소모임(스몰스파크)\n      서비스       조성 및 완전한 사회 따른 서비스, 2~3명의 협력인이 사업\n      (CBSS)    참여 도모          역량에 맞게 지원(스몰스파크 등)\n\n                                                     - 후원자 개발 및 관리\n                                                     - 자원봉사자 발굴･교육･활동･\n                             C. 지역사회 통합환경조성\n                                                      관리\n                             - 자원개발 및 관리\n                                                     - 장애인의 날 주간 행사\n                             - 통합 환경조성, 네트워크 활동 등\n                                                     - 장애인식개선사업\n                               포용적 지역사회 조성을 위한 활동\n                                                     - 시민참여교육 및 활동\n                                                     - 민관협력 네트워크 구축\n                                                     - 사업계획 수립 및 평가\n                             A. 기획\n                                                     - 조사연구사업\n                             - 서비스 효과성을 위하여 복지관\n                                                     - 직원개발사업\n        기획                     내･외부 시스템을 점검･조정･\n               - 지역사회기반 적극적                     - 실습지도\n        홍보       역할수행 실천을 위한 통합･개선              - 고객만족 윤리경영\n 8      및        기획･홍보･총무 등\n        운영       복지관 운영을 위한 B. 홍보               - 홍보물제작\n                 다양한 지원업무   - 장애관련 정보와 복지관의 소식을\n        지원                                      - 지역홍보\n                              읽기 쉽게 정리하여 지역사회와\n                                                - 온라인 홍보 및 홈페이지 운영\n                              공유하고 다양한 방식의 홍보방\n                                                - 견학안내\n                              법을 통해 장애인의 알권리 지원"}, {"p": 293, "t": "                                          Ⅱ. 장애인 복지관 운영\n\n\n     서비스\n구성         장애인복지관 역할          구성요소               주요사업 예시\n     영역\n\n                                             - 인사 및 조직관리\n                        C. 운영지원\n                                             - 각종위원회 운영\n                        - 효율적이고 안전한 운영을 위한\n                                             - 회계 및 문서관리\n                         인력관리 및 시설운영 등 다양한\n                                             - 시설 및 차량관리\n                         지원업무를 통해 가치경영 실천\n                                             - 식당운영\n\n\n                          A. 실천현장중심형 정책조사연구\n           - 지역 내 장애인                                              제3장\n                          B. 프로그램 개발 및 보급\n             복지관, 유관\n                       공통 C. 장애인복지시설 경영지원\n             기관, 소규모\n                       영역 D. 징애인복지 전문인력 역량강화\n             시설, 단체 등을\n                          E. 장애인복지 네트워크\n      도      대상으로 영역별\n             네트워크 구성      F. 서비스 소외지역 해소\n9    기반\n             및 운영\n     서비스   - 공통과 선택으로\n                          A. 권익옹호 등 인권허브기관 역할수행\n             나누어 도립       B. 여성장애인 역량강화와 권리확보\n             복지관 특성에 선택 C. 정신장애인(지적, 자폐성, 정신장애인) 자립지원 종합상담센터        활\n             맞게 유연하게 영역      운영\n             운영\n                          D. 중증장애인 직업지원 네트워크 구축과 고용활성화"}, {"p": 294, "t": " ○ 지역 및 유형에 따른 유연한 서비스 구성과 조합\n\n 아래 제시한 7개 서비스영역과 핵심구성요소에 따른 다양한 조합은 전국 장애인복지관에 동일하게 적용되는\n 기준이 아니며, 복지관의 목표와 이용자의 욕구, 복지관의 규모와 환경, 복지관의 자원 등 개별 복지관에\n 맞게 유연하고 다양하게 조합하고 응용할 수 있음.\n\n\n                              핵심구성요소\n    서비스영역                                                 다양한 조합(예)\n                    A        B         C        D\n\n                 공식서비스     자연지원망\n1. 개인별 지원 계획수립                          -       -     A      B     A+B\n                  중심형      구축 중심형\n\n                                      타 기관의\n                  기관 내     지역사회지향    중재(치료)를                 A+B\n2. 중재(치료)와 컨설팅                                  -     A            A+B+C\n                 중재(치료)     중재(치료)    통합하는                   A+C\n                                       컨설팅\n\n                   기관 내\n                            지역사회     중증장애인                   A+B\n3. 낮활동 및 행동지원     역동적 낮                         -     A            A+B+C\n                            허브개발      행동지원                   A+C\n                    활동\n\n                 직업(적응)     적극적      지역사회중심                  A+B   A+B+C\n4. 직업지원                                     일자리 창출    A\n                  훈련        지원고용      직업지원                   A+C    +D\n\n                 가족(지원자) 가족(지원자)\n5. 가족(지원자) 지원                           -       -     A      B     A+B\n                 역량강화 지원 휴식지원\n\n                            일상적       독립적       구조적          A+B   A+B+C\n6. 사례관리 및 권익옹호    사례관리                                A\n                            권익옹호      권익옹호     권익옹호          A+C    +D\n\n                   지역사회\n7. 지역사회중심지원서비스                        지역사회\n                   생활지원    주민조직화                -     A      A+B   A+B+C\n   (CBSS)                            통합환경조성\n                 (재가서비스)\n\n※ 위 표는 서비스 위주의 조합이며, 기획홍보 및 운영지원은 적절하게 조합하여 운영\n＊시･도에서 특별한 기능을 수행하는 시･도립장애인종합복지관은 그 기능에 맞게 적절하게 조합하여 운영"}, {"p": 295, "t": "                                    Ⅱ. 장애인 복지관 운영\n\n\n○ 인건비 및 관리운영비\n\n- 시간외근로수당, 퇴직급여, 사회보험 등의 경우 근로기준법 등 관련법령을\n  준수할 수 있도록 보조금으로 지급 허용 및 시설지도\n\n- 직원(종사자)의 출산, 병가, 휴직 등의 사유로 인력의 공백이 발생할 경우 해당\n  직원(종사자)의 인건비 범위 내에서 대체인력을 활용할 수 있으며, 대체인력\n  인건비는 해당 직원(종사자)의 인건비 범위 내에서 기본급 및 수당 등 급여로\n  지급할 수 있음\n- 장애인복지관 일반사업에 대한 운영비는 지방비보조금 외에 자체수입(이용료,\n  후원금, 법인 전입금 등)을 추가\n  ※ 예산 집행 시에는 재가복지사업 운영비를 장애인복지관 운영비에 포함함\n- 운영비로 장애인복지관 사업수행에 필요한 장애인복지시설 관련단체의\n  가입비, 회비, 종사자 교육비 등을 지출할 수 있음\n○ 이용료 산정\n\n\n- 사단법인 한국장애인복지관협회와 보건복지부가 협의하여 정한 ‘이용료\n  징수액 산정 기준’ 대비 매년 물가상승분을 고려하여 산정할 수 있음.\n * 한국장애인복지관협회는 5년마다 이용료 징수액 산정 기준을 협회 홈페이지 등에 게시하여야 함\n\n○ 장애인 복지관은 재무･회계 및 후원금 관리 등에 있어 사회복지법인 및 사회\n 복지시설 재무･회계 규칙을 준용하여 합리적인 운영을 도모함\n\n○ 장애인 복지관 분관 운영\n\n- 복지관이 소재한 곳과 거리가 먼 산간벽지 등 농어촌 지역 등에 분관을 둘\n  수 있으며, 그 운영은 해당 시･도지사의 책임하에 복지관에서 운영함\n\n- 종사인력은 개소당 전문직을 포함한 4명 이상의 인원을 배치할 수 있도록\n  노력해야 함\n\n- 운영비는 지방비보조금으로 하되, 자체수입을 추가할 수 있음"}, {"p": 296, "t": " ○ 장애인 복지관 인권교육\n\n  - 종사자(시설장 포함)와 이용장애인을 대상으로 연 1회(4시간) 이상 인권교육을\n    실시함\n\n  - 이용장애인 대상 인권교육은 장애인 특성에 맞추어 내용을 구성하고 다양한\n    형식과 방법(개별, 그림카드, 애니메이션 등)을 고려하여 실시함\n\n  - 종사자 인권교육은 외부기관에서 실시하는 교육 참여를 우선하되, 인권교육\n    외부강사(국가인권위원회 주관 인권교육 관계자 및 양성과정 수료자 포함)\n    초빙을 통한 내부교육으로 진행할 수 있음\n\n    ※ 인권교육 강사자격\n        ∙ 국가인권위원회 주관 인권교육 관계자 및 양성과정 수료자\n        ∙ 인권단체 소속으로 3년 이상 활동한 자\n        ∙ 인권교육기관의 인권교육 강사양성 과정 수료자\n        * 인권교육기관\n         1. ｢국가인권위원회법｣에 따른 국가인권위원회\n         2. ｢한국보건복지인력개발원법｣에 따른 한국보건복지인력개발원\n         3. 그 밖에 인권교육을 실시할 수 있는 전문인력과 시설을 갖추었다고 보건복지부장관이\n            인정하는 기관･법인 또는 단체\n\n        ∙ ｢고등교육법｣ 제2조에 따른 대학에서 심리학･간호학･사회복지학･사회\n         사업학･재활학 또는 보건학을 가르치는 전임강사 이상의 직에 있는 사람\n\n        ∙ 기타 각호에 준하는 인권 관련 자격 및 경력이 있다고 인정되는 자"}, {"p": 297, "t": "                                   Ⅱ. 장애인 복지관 운영\n\n\n5 관 리\n\n○ 조직 및 직제\n\n - 각 복지관은 지역의 여건 및 이용자의 특성을 감안하여 서비스를 가장 효과적\n  으로 제공할 수 있도록 위의 운영원칙에 맞게 다음과 같이 장애인 복지관의\n  조직 및 직제기준을 준용하여 편제\n\n - 인력관리의 효율성을 확보하고 간부와 직원간 적정한 업무의 분담이 이루어\n  지도록 팀제 운영을 원칙으로 하되, 기획홍보 및 운영지원 등 지원영역과\n  그 외 사업영역으로 구분 운용\n - 종전 장애인 복지관 부설로 운영되던 재가복지봉사센터는 장애인 복지관의\n  기능 속에 통합 운영(인사를 장애인복지관과 분리하지 않음)\n< 장애인 복지관의 조직 및 직제기준：[별표 1] 참조 >\n (1) 복지관의 직제는 관장, 사무국장, 일반직(1~5급), 기능직 및 고용직으로 구성\n (2) 복지관은 관장 아래 사무국장을 두고, 사무국장 아래 종사자 정원 규모 및\n   사업의 특수성에 따라 6~8개 범위 내에서 각 팀을 운영하고, 복지관 부대\n   프로그램 및 독립시설을 복지관 조직과 통합하여 운영하는 것이 효과적일\n   경우에는 통합하여 운영\n (3) 복지관의 팀은 지원부서로 기획･운영지원팀을 두고, 사업부서로 아동성장\n   지원팀, 청소년전환지원팀, 가족지원팀, 성인능력개발지원팀, 성인사회\n   참여지원팀, 장노년서비스지원팀, 지역사회개발팀 등을 두며 팀장 1인 및\n   팀원 약간명을 두되 필요시 당해 시설장이 자치단체장과 협의하여 직제를\n   증감할 수 있음 (단, 정원의 범위 내에서 팀 명칭 등은 자치단체장과 협의\n   하여 사업특성에 맞게 정할 수 있음)\n (4) 복지관의 인력은 지원 부서에는 최소의 인력을 배치하는 것을 원칙으로 하고,\n   서비스를 제공하는 사업부서에 최대한 배치토록 노력"}, {"p": 298, "t": "  (5) 복지관의 각 팀별 주요 업무\n\n 구분        팀명                        주요업무\n\n                    아동기 개인별계획수립, 중재(치료)와 컨설팅, 아동기 일상적 권익옹호\n 1       아동성장지원팀\n                    및 지역사회중심지원서비스 등\n\n                    청소년기 개인별계획수립, 중재(치료)와 컨설팅, 직업지원, 청소년기\n 2      청소년전환지원팀\n                    일상적권익옹호 및 지역사회중심지원서비스 등\n\n 3       가족지원팀      가족(지원자)역량강화지원, 가족(지원자) 휴식지원 등\n\n                    성인기(직업중심) 개인별계획수립, 직업(적응)훈련, 적극적 지원고용,\n 4      성인능력개발지원팀   지역사회중심 직업지원, 일자리 창출, 성인기(직업중심)일상적 권익옹호\n                    및 지역사회중심지원서비스 등\n\n                    성인기 개인별계획수립, 기관내 역동적 낮활동, 중증장애인 행동지원,\n 5      성인사회참여지원팀\n                    평생교육, 성인기 일상적권익옹호 및 지역사회중심지원서비스 등\n\n                    장노년기 개인별계획수립, 건강지원, 문화여가, 장노년기 권익옹호 및\n 6      장노년서비스지원팀\n                    지역사회중심지원서비스 등\n\n                    사례관리, 권익옹호, 지역사회 생활지원(재가서비스), 주민조직화,\n 7       지역사회개발팀\n                    지역사회 통합환경조성 등\n\n 8      기획･운영지원팀    총무, 기획, 홍보, 고객만족, 윤리경영, 기타 등\n\n＊정원규모 및 사업의 특수성에 따라 당해 시설장이 자치단체장과 협의하여 직제를 증감할 수 있음\n\n\n  (6) 복지관의 팀장은 1~3급 중에서 정하며, 동일직급이 없을 경우에는 차하위\n      직급에서 그 직무를 대리토록 조치\n\n  (7) 종사자의 경력인정은 당해연도 ‘사회복지시설 관리안내’ 기준을 따름\n      * 기능직의 경우 법령에 의해 채용이 의무화된 사업장 등에서 관련 자격(면허) 소지 후 자격증\n        동종업종에 근무한 경력은 유사경력으로 80% 인정가능\n\n      * 장애인 복지관에서 ｢장애인활동 지원에 관한 법률｣ 제20조에 따른 활동지원기관으로 지정받아\n        채용한 전담인력은 복지관 직원으로 인정"}, {"p": 299, "t": "                               Ⅱ. 장애인 복지관 운영\n\n\n○ 직원 배치기준(지방비보조금 지원기준)\n\n- 복지관 직원은 종사자 정원내에서 운용하되 복지관의 특성이나 수행하는\n  사업에 따라 자치단체장의 승인을 받아 증감 가능. 단, 20명 미만인 복지관은\n  장애인복지법 시행규칙 별표 5에 규정된 장애인 복지관 관리 및 운영요원\n  배치기준인 20명 이상을 준용하여 조직이 운영되도록 지원해야 함\n\n- 직원 배치기준(지방비보조금 지원기준)의 총정원을 변경하고자 하는 때에는\n  자치단체장을 경유, 시장 또는 도지사와 사전 협의를 하여야 함. 다만, 인건비를\n  지방비보조금으로 지급하지 아니하는 직원에 대하여는 그러하지 아니할 수\n  있음\n- 직원 채용 시 장애인이 우선 채용되도록 적극 노력하되 법정 종사자 정원의              인\n  최소 10% 이상 채용되도록 노력\n○ 직원 인사관리\n- 복지관은 직원 인사관리의 공정을 기하기 위하여 자체인사위원회를 반드시\n\n  구성 운영\n\n ∙ 위원장은 관장이 되고 위원은 ①운영위원회 위원, ②복지관의 3급 이상 간부,\n  ③관련 공무원･대학교수 등 외부전문가 중에서 위원장이 위촉하고 위원장을\n  포함하여 5명 이상 9명 이하의 위원으로 구성\n\n ∙ 위원회는 소속직원 임면에 관한 사항, 소속직원 근무평정에 관한 사항,\n  소속직원 승진 및 상벌에 관한 사항, 기타 관장이 필요하다고 인정하는 사항\n  등을 심의\n- 복지관은 본 지침을 기준으로 한 자체 인사위원회운영규정과 인사관리규정을\n  제정하여 직원 인사관리에 공정성과 효율성을 확보\n\n○ 승진임용\n\n- 복지관 직원의 승진임용은 동일 직종별로 차하위직급에 재직하는 자 중 승진\n  소요년수를 근무한 자에 대하여 근무실적, 직무수행능력, 직무수행태도 등을"}, {"p": 300, "t": "    종합 평점한 후 그 서열에 따라 승진임용하되, 장애인복지사업에 기여한\n    공로가 현저한 자의 경우 승진 소요년수의 규정에도 불구하고 특별 승진임용\n    가능\n   ※ 승진 소요 근무연수\n\n        1급 승진       2급 승진        3급 승진                4급 승진\n                                                    5급으로 5년 이상\n    2급으로 5년 이상    3급으로 4년 이상   4급으로 3년 이상\n                                               (다만, 전문학사의 경우 3년 이상)\n\n   ※ 4급 임면자격이 있는 직원을 기관의 사정으로 5급으로 발령한 경우, 위의 4급 승진을 위한 소요\n     근무연수를 적용하지 않는다.\n\n  - 단, 기능직의 경우 승진소요 근무연수는 다음과 같음.\n   ∙ 1종(일반직 4급상당)：2종으로 3년 이상\n   ∙ 2종(일반직 5급상당)：3종으로 4년 이상\n   ※ 평점 기준(예시)\n\n          계           근무실적          직무수행능력             직무수행태도\n         100점          40점               40점              20점\n\n   ∙ 근무실적평정요소：담당업무의 질과 양, 목표달성도, 창의성, 노력도, 조직･사회\n     기여도(상기 각 평정요소별로 최고 8점에서 최하 1점까지 평점부여)\n   ∙ 직무수행능력평정요소：전문지식, 이해･판단력, 기획력, 업무추진력, 종합\n     실무능력(상기 각 평정요소별로 최고 8점에서 최하 1점까지 평점부여)\n\n   ∙ 직무수행태도평정요소：책임성, 대민친절성, 협조성, 청렴도\n     (각 평정요소별로 최고 5점에서 최하 1점까지 평점부여)\n\n  - 승진제한：전항의 승진소요년수에는 징계처분 기간, 휴직 기간(병역, 공상에 의한\n    휴직 및 강임전 재직기간 제외), 직위해제기간은 산입하지 아니하며, 징계,\n    직위해제 또는 휴직중에 있거나 징계처분이 종료된 때로부터 다음 기간이\n    경과하지 아니한 자는 승진될 수 없음.\n\n   ∙ 정직 1년 6월, 감봉 1년, 견책 6월"}, {"p": 301, "t": "                                  Ⅱ. 장애인 복지관 운영\n\n\n6 시설공간의 배치 및 활용\n\n가. 복지관의 모든 시설은 장애인복지법 시행규칙 제41조 관련 별표 5의 규정에 따라\n  이용자를 위한 서비스 공간이 최대한 확보되도록 적정하게 배치\n\n나. 복지관의 시설 공간 중 이용자를 위한 서비스 공간으로 활용하지 아니하고 복지관의\n  목적사업에 부합하지 않는 복지관 내 다음과 같은 특정 용도의 시설공간은\n  모두 복지관의 서비스 공간으로 변경                                     제3장\n\n1) 복지관 운영법인 사무실(예：운영법인사무실, 대표이사장실, 운영위원장실 등)\n2) 종교활동을 위한 숙소 및 종교사무실\n3) 장애인복지단체 사무실\n4) 외부 시설 대여에 따른 임대공간 시설(외부 사무실)\n5) 복지관 직원 사무실 중 관장실을 제외한 관장 부속실(또는 비서실), 사무국장 및            설\n  팀장급 부서장의 별도 집무실\n\n6) 기타 복지관의 목적사업 용도에 부합하지 아니한 시설 공간\n\n다. 복지관의 사무실은 통합 사무실로 활용하는 것을 원칙으로 하되, 관장실의 경우\n  에만 회의공간을 포함하여 전용면적 24제곱미터(약 7평)범위 내에서 별도의\n  집무실을 둘 수 있음"}, {"p": 302, "t": " 7   행정지원사항\n\n가. 각 지방자치단체는 해당 지방자치단체 관리조례 및 관련 법률에 따라 보조금의\n     교부신청 및 지급, 정산 및 결산보고를 하여야 하며, 매 회계연도 이전에\n     각 지역 내 장애인 복지관에 다음 년도 보조금 및 인건비를 확정하여 통보하여야\n     한다.\n\n나. 각 지방자치단체는 장애인이 지역사회를 중심으로 생활을 영위하고 사회활동에\n     참여할 수 있도록 개인의 능력과 적성에 따른 사례관리, 기능향상지원, 장애인\n     가족지원, 역량강화 및 권익옹호지원, 직업지원, 지역사회네트워크, 평생교육\n     지원, 사회서비스지원 등의 종합적인 지역사회재활 및 자립지원 서비스의\n     제공에 필요한 정책을 강구하여야 하며, 그에 따른 경비를 지원하여야 한다.\n\n다. 각 지방자치단체는 장애인복지관의 업무처리 효율성 제고를 위해 한국장애인\n     복지관협회에서 개발 보급한 전자문서 결재시스템 및 사회복지정보시스템을\n     지역 내 장애인복지관이 적극 활용할 수 있도록 노력하여야 한다.\n\n라. 각 지방자치단체는 지역사회 최중증 장애인 돌봄 사각지대가 없도록 장애인복지관과\n     함께 「최중증 발달장애인 통합돌봄서비스 사업 안내」 등을 활용하여 최중증\n     장애인 돌봄서비스를 적극 운영할 수 있도록 노력하여야 한다."}, {"p": 303, "t": "                                                   Ⅱ. 장애인 복지관 운영\n\n\n[별표 1]\n                  장애인 복지관의 조직 및 직제기준\n\n1. 장애인 복지관 기본조직\n\n 장애인 복지관의 주요기능을 효과적으로 달성하기 위한 기본조직은 다음과 같으며, 자치단체는 복지관으로부터\n 기본조직을 포함하여 지역별, 장애유형별, 생애주기별, 복합시설, 지역특성화 등에 따른 기본조직의\n 변화 필요 요청이 있을 경우 적극적으로 협의에 응하여 유연한 조직이 되도록 지원해야 함\n ＊ 아래 조직형태는 서비스의 전영역을 포함하는 조직도로 복지관 규모 및 특성에 맞게 다양하게 구성하여\n   운영 가능함\n\n\n                                     관 장\n                                  사무국장\n                                                 장노년\n      아동성장    청소년              성인능력     성인사회              지역사회    기획･운영\n팀명\n       지원팀   전환지원팀\n                      가족지원팀\n                              개발지원팀    참여지원팀\n                                                 서비스\n                                                          개발팀      지원팀\n                                                 지원팀\n\n\n주                     가족 역량            낮활동 및              사례관리,\n             중고등 발달\n요     유아초등             강화 및            중증장애인    문화, 여가,   권익옹호,   기획, 홍보,\n             및 성인기            직업지원\n기     발달지원            가족 휴식            행동 지원,   건강 지원     지역사회      운영\n             전환 지원\n능                       지원              평생교육              중심지원\n\n\n* 사회서비스 지원은 각 복지관의 특성에 따라 사회서비스팀을 별도로 두고 운영하거나 기존팀에 팀에 병합하여 운영할\n  수 있음\n* 장애인 복지관 기본조직 모형에서 기획과 총무를 통합하여 기획･운영지원팀으로 제시하였으나 복지관의 규모, 특성에\n  따라 분리하여 운영할 수 있음\n* 현재 서비스를 제공하고 있는 발달장애인과 장애인가족 역량강화 및 원스톱서비스 지원, 평생교육지원의 강화가\n  필요할 경우 기본조직에 부설로 별도의 센터를 설치･운영할 수 있음\n\n\n 가. 정원에 따른 건축물 연면적 권고사항\n     1) 정원 40명 이상 복지관(1국 8팀, 2,000㎡ 이상)\n     2) 정원 30~39명 복지관(1국 7팀, 1,500㎡ 이상)\n     3) 정원 20~29명 복지관(1국 6팀, 1,000㎡ 이상)"}, {"p": 304, "t": " 나. 공통사항\n    체육관, 사회서비스센터 등 부대 프로그램을 설치･운영 중인 복지관의 경우 사무국장\n    소속 하에 기존 팀에 통합 또는 별도의 팀으로 편제\n\n    * 단독 시설로 신고･운영 중인 주간이용시설 등의 경우 복지관 조직체계와 별도로 운영되어야 함\n\n\n2. 직 제\n\n 구 분                   일 반 직                        기능직\n                                                               고용직\n 직 급     관 장   사무국장   1급   2급   3급   4급   5급   1종   2종    3종\n 직 위     관 장   사무국장              팀장(1~3급 중에서 정함) 및 팀원\n\n※ 기능직(위생원, 운전원, 안전관리자, 조리사 등), 고용직(미화원 등)\n※ 일반직(영양사 포함) 단, 집단급식소 설치신고증이 있는 시설에 한함."}]}, {"title": "Ⅲ. 장애인 주간이용시설 운영", "start": 305, "end": 314, "subs": [], "pages": [{"p": 305, "t": "                            Ⅲ. 장애인 주간이용시설 운영\n\n\n    Ⅲ    장애인 주간이용시설 운영\n\n\n1   목적\n\n일상생활 및 지역사회생활을 영위하는 데 지원이 필요한 장애인에게 낮 시간 동안\n활동위주의 프로그램 및 교육 지원 등을 제공하는 시설의 운영에 필요한 사항을\n정함.\n2 근거법령\n장애인 주간이용시설 운영사업은 ｢장애인복지법령｣, ｢사회복지사업법령｣ 및\n｢보조금관리에관한법률｣에 의하되, 세부사항은 이 지침에 따라 수행한다.\n다만, 지침에 정하지 않은 사항은 사회복지사업에 관한 다른 지침을 준용할 수\n있음\n\n가. 시설의 종류와 기능：장애인복지법 제58조제1항 및 동법시행규칙 제41조\n\n나. 시설의 설치신고 및 운영개시, 감독：장애인복지법 제59조 및 제60조\n\n다. 시설의 설치신고 등 세부사항：장애인복지법시행규칙 제42조 및 제43조\n\n라. 시설의 재무회계 관리：사회복지법인 및 사회복지시설 재무･회계규칙 중\n    복지관 등 시설회계\n\n마. 기타 일반사항：사회복지사업법 등 관계규정"}, {"p": 306, "t": " 3 사업추진 지침\n\n가. 기본원칙\n\n ○ 장애인 주간이용시설은 장애인 생활시설, 장애인 복지관 등과는 분리하여\n   단독시설로서 운영되어야 한다.\n\n  - 지방자치단체에서는 신규로 설치되는 장애인 주간이용시설이 장애인거주시설,\n    장애인 복지관 등과 분리하여 단독시설로 운영되도록 해야 한다. 또한 이미\n    설치된 주간이용시설은 기능보강(임차료 지원) 지원 등을 통하여 단독시설로\n    운영될 수 있도록 하여야 한다.\n    * 다만, 부득이한 경우 관할 주무관청의 승인을 거쳐 복합 설치･운영 가능\n\n  - 장애인 주간이용시설이 법인 또는 타 복지시설과 복합으로 설치되어 있는\n    경우에도 인사･회계는 별도 시설로 유지되어야 한다.\n  - 장애인 주간이용시설은 장애인의 인간적 존엄성과 기본적 권리를 보장하고\n    지역장애인의 의사와 선택권이 존중될 수 있는 시설운영이 되도록 노력한다.\n  - 장애인 주간이용시설은 지역사회 내 장애인의 생애주기와 장애유형에 따른\n    다양한 활동 욕구에 맞게 체계적이고 지속적인 서비스를 제공하기 위해 노력\n    해야 한다.\n\n ○ 장애인 주간이용시설은 부록 Ⅲ의 서비스 최저기준을 준수하기 위해 노력해야\n   한다.\n\n\n나. 인건비 지원기준\n\n ○ 시설장 및 사업수행인력의 인건비 보조기준은 당해연도 ‘사회복지시설 종사자\n   인건비 가이드라인’에서 정한 사회복지시설 (장애인)이용시설 종사자 보수체계\n   지급기준에 따르고, 시설장은 관장, 사회재활교사는 3급, 기능직은 4급에 준하여\n   지급한다.(인건비를 지원받는 다른 시설의 장 또는 직원의 겸임 경우 제외)\n   * 사회재활교사 중 팀장과 팀원이 각각 있는 경우 팀장은 2급에 준하여 지급할 수 있음"}, {"p": 307, "t": "                                    Ⅲ. 장애인 주간이용시설 운영\n\n\n○ 원장에 대한 직책보조비를 지원할 수 있다.\n\n○ 직원의 출산, 병가, 휴직 등의 사유로 인력의 공백이 발생할 경우 해당 직원의\n  인건비 범위 내에서 대체인력을 활용할 수 있다.\n\n - 대체 인력 인건비는 해당 직원의 인건비 범위 내에서 기본급 및 수당 등\n  급여로 지급할 수 있다.\n\n○ 시설 종사자의 교육 또는 연수를 공무로 인정하여 봉급을 지급한다.\n\n○ 인건비의 보조 및 지급은 근로기준법 기준에 위배되지 않도록 시간외근무수당,                    제3장\n\n  연차유급휴가수당, 퇴직금, 기타 4대 보험료 등을 반영할 수 있도록 한다.\n ※ 시간외근무수당 예산편성 기준：(시설장을 포함한 전체 종사자)월 20시간, 연 240시간             애\n다. 관리운영비\n1) 관리운영비 지원 및 집행기준\n○ 지원 기준\n                                                   (단위：천원)\n       지원구분             지원액                 비 고\n     시설당 기본지원           17,153/년\n     인원 가중지원             1,715/년    15인 초과 인원 1인당 지원 기준\n\n  ※ ’25년 대비 2.1% 증액(’25년 소비자물가지수 전년대비 상승률 적용)\n\n○ 집행 기준\n\n - 성질별 관리운영비는 [별표 1] 장애인 주간이용시설 관리운영비 세출예산과목을\n  참고하여 집행한다.\n\n2) 운영비 지원 시 고려사항\n\n○ 시･군･구의 관리 운영비 보조는 인건비와 관리운영비를 분리하여 보조하여야 한다.\n\n○ 시설 접근성 보장 및 이용 장애인의 지역사회 활동 이동편의 제공을 위하여\n  관할 지자체장은 기능보강사업을 통해 차량 및 차량운영비를 지원할 수 있다."}, {"p": 308, "t": " ○ 시설의 이용료 감면자(국민기초생활보장대상수급자 또는 차상위대상자) 수 등\n   시설 운영의 특성을 고려하여 관할 지자체는 관리운영비를 추가 지원할 수 있다.\n\n ○ 장애인의 재활 프로그램 및 교육에 필요한 교육재활사업비를 지원할 수 있다.\n\n\n라. 주간이용시설 종사자 관련사항\n\n 1) 인력지원 및 자격기준\n\n ○ 주간이용시설의 종사자 배치기준은 아래와 같이 한다.\n         직종별                          비 고\n                  * 시설장은 상근을 원칙으로 한다.\n         시설장\n                    (단, 시설운영 현황에 따라 타시설과 겸임할 수 있다.)\n        사회재활교사    * 이용장애인 3인당 1인 배치\n         사무원      * 시설당 1인(지자체 협의)\n                  * 시설운영에 필요한 기능직 1인\n         기능직\n                    (단, 다른 직종이 겸직하는 경우 사회재활교사로 대체 배치 가능)\n\n  - 재활치료를 위한 사회재활교사를 치료사(물리치료사, 작업치료사, 언어\n    치료사, 재활상담사 등) 및 특수교사로 채용할 수 있다.\n    ※ 장애인복지시설에 복합 설치되어 운영하는 주간이용시설의 시설장은 관할 시･군･구 승인하에\n      해당 장애인복지시설장 또는 해당 시설의 직원이 겸임가능.\n    ※ 단독시설로 운영하는 주간이용시설의 시설장(타 시설의 장을 겸직하지 않음)이 상근하면서\n      업무를 수행하는 경우 인건비를 지원하여야 한다.\n\n 2) 인력배치시 고려사항\n\n ○ 지방자치단체의 장은 이용 장애인에게 원활한 사업 제공을 위하여 본 인력\n   배치를 준수해야 하며, 주간이용시설 이용 장애인의 욕구 및 장애 특성을 고려하여\n   추가인력을 배치하도록 노력하여야 한다.\n   ※ 공공근로, 사회복무요원 등 주간이용시설의 추가인력을 최우선적으로 배치하도록 적극\n     노력하여야 한다.\n\n ○ 직원의 교육 연수 출장 및 출산 등의 사유로 인력의 공백이 발생할 경우 업무\n   지원에 필요한 대체인력 또는 대체 인건비를 지원할 수 있다."}, {"p": 309, "t": "                             Ⅲ. 장애인 주간이용시설 운영\n\n\n마. 이용료\n\n○ 이용료 수납대상은 모든 이용자(국민기초생활보장대상수급자 포함)를 대상\n  으로 하되, 국민기초생활보장대상수급자 또는 차상위 대상자 등의 경우에는\n  시설 자체 운영규정에 따라 일부 징수 또는 징수하지 않을 수 있다.\n\n○ 이용료는 시설운영의 제반비용(인건비, 관리운영비 등)으로 사용할 수 있다.\n\n○ 이용료는 시설운영위원회 심의를 거쳐 책정한다.\n\n\n4 수행사업(중증장애인 주간 활동 지원)\n○ 일상생활 지원\n - 식사 및 간식지원, 건강관리 및 위생관리 및 일상생활훈련 등을 통해 자립              활\n  생활능력을 배양\n\n○ 여가활동 지원\n\n - 의미 있는 낮 시간 활동을 위한 문화･예술, 스포츠, 여가･취미 활동 등 체험\n  위주의 여가활동을 제공\n\n○ 교육･훈련 지원\n\n - 일상생활에 필요한 안전, 교양 및 언어･인지 등의 교육과 직업훈련, 사회\n  구성원으로써의 권리의 이해를 위한 성교육, 인권교육 등의 교육･훈련 지원\n\n○ 지역사회적응활동 지원\n\n - 사회구성원으로서의 능력배양을 위하여 공공기관 및 대중교통 이용 등 활동\n  서비스 지원"}, {"p": 310, "t": " ○ 특별활동 지원\n\n  - 여행, 캠프 및 기념일 활동 등 새로운 환경과 정보를 접하고 정서함양을\n    통한 자기발전을 도모할 수 있도록 활동 서비스 지원\n\n ○ 자원봉사자 개발 및 실습생교육지도\n\n  - 이용 장애인의 욕구와 시설에서 활용할 수 있는 자원봉사자를 개발하고,\n    장애인에 대한 이해 및 사회복지 현장의 이해를 위한 사회복지 현장실습생\n    지도\n\n ○ 기타\n\n  - 차량, 인력 등 허용범위 내에서 장애인 주간이용시설 이용을 위한 교통\n    편의를 제공\n\n  - 이용 장애인과 그 가족과의 상담 등을 통해 욕구를 파악하여 그에 맞는\n    서비스를 개발하고, 가족들의 부양부담 경감을 위한 다양한 가족 지원\n    서비스 제공 등\n\n  - 시설장은 시설 운영 여건과 이용 장애인의 욕구 및 특성에 따라 의미 있는\n    낮 시간 활동이 되도록 다양한 수행사업을 개발하여 제공할 수 있도록 노력\n    해야 한다.\n\n\n 5 이용자 선정 및 계약\n\n ○ 시설 홍보\n\n  - 지역신문, 홈페이지, 블로그 등 대중매체를 적극 활용하여 시설 운영에\n    대하여 홍보한다.\n\n  - 지역행정기관의 의뢰 및 협조를 통해서 이용자를 발굴한다."}, {"p": 311, "t": "                                  Ⅲ. 장애인 주간이용시설 운영\n\n\n○ 이용자 선정\n\n- 이용 장애인의 신청을 원칙으로 하고 이용 신청이 많을 경우에는 자체 심의를\n  거치되, 국민기초생활보장법에 의한 국민기초생활보장대상수급자, 중증 장애\n  (중복 장애 등)를 우선 배려한다.\n\n○ 이용자 계약\n\n- 이용 신청 후 이용 절차에 따라 선정 결과를 이용 장애인에게 통보하고, 이용\n  확정 시 시설장과 이용 장애인, 보호자 간 이용 계약을 체결한다.\n- 이용 계약서에는 계약기간, 이용료 등의 비용 부담액, 이용자(보호자) 등의\n  권리･의무, 시설의 책임 및 역할, 계약 해지조건, 기타 필요한 사항 등에\n  관하여 명시한다.\n○ 1개 시설 당 이용 장애인 실인원은 최소 10인으로 운영한다.\n6 종사자 및 이용자 인권교육\n\n\n○ 장애인 주간이용시설은 이용 장애인의 장애정도를 고려하여 사전에 인권\n 침해를 예방하고, 인권침해 발생 시 필요한 조치를 통해 이용자의 인권이\n 보장될 수 있도록 정기적인 인권교육을 실시한다.\n * 주간이용시설 종사자를 대상으로 연간 8시간 이상 인권교육을 실시한다. 외부기관에서 실시하는\n   교육 참여를 우선하되, 인권교육 외부강사(인권교육 강사 양성과정 수료자 등) 초빙을 통한 내부\n   교육으로 진행할 수 있다. (단, 하반기 채용자는 익년부터 적용)\n * 주간이용시설 이용 장애인을 대상으로 연간 4시간 이상 인권교육을 실시한다. 외부 강사를 초빙\n   하여 진행함을 원칙으로 하되, 종사자 중 아래의 “인권교육 강사자격”에 해당하는 사람이 있는\n   경우에 한하여 내부교육으로 진행할 수 있다.\n * 이용 장애인 인권교육은 전체를 대상으로 실시함을 원칙으로 한다.\n * 이용 장애인 대상 인권교육은 장애인 특성에 맞추어 내용을 구성하고 다양한 형식과 방법(개별,\n   그림카드, 애니메이션 등 다양한 자료 활용)을 고려하여 실시한다.\n * 인권교육은 대면을 원칙으로 하되 대면교육이 불가능한 상황인 경우 지자체 승인 하에 비대면으로\n  실시할 수 있다."}, {"p": 312, "t": " ○ 인권교육 강사자격\n\n     ∙ 국가인권위원회 주관 인권교육 관계자 및 양성과정 수료자\n     ∙ 인권단체 소속으로 3년 이상 활동한 자\n     ∙ 한국장애인주간이용시설협회 주관 인권교육 강사양성과정 수료하고 인권\n        강사로 위촉된 자\n     ∙ 사회복지 관련 학과 교수\n     ∙ 기타 각호에 준하는 인권 관련 자격 및 경력이 있다고 인정되는 자\n\n\n 7   시설의 설치･운영\n\n ○ 장애인 주간이용시설은 최대한 지역 내 시설 분포와 교통, 보건, 안전 등을\n     고려하여 설치하여야 한다.\n\n ○ 각 지방자치단체는 지역사회 최중증 장애인 돌봄 사각지대가 없도록 장애인\n     주간이용시설과 함께 [별표 2]의 현재 시행되고 있는 예시를 활용하여 최중증\n     장애인 돌봄서비스를 마련하도록 노력하여야 한다.\n\n\n 8 시설공간의 배치 및 활용\n\n ○ 주간이용시설은 장애인복지법 시행규칙 별표 5의 규정에 따라 이용자를 위한\n     서비스 공간(프로그램실, 휴게공간 등)이 최대한 확보되도록 적정하게 배치하여\n     활용하도록 한다.\n\n ○ 이용 장애인의 도전적 행동 등에 대해 개별 지원이 가능하도록 별도의 공간을\n     확보한다.\n\n ○ 이용 장애인의 건강을 위하여 실내 소독과 환기를 정기적으로 실시한다."}, {"p": 313, "t": "                                                Ⅲ. 장애인 주간이용시설 운영\n\n\n[별표 1]\n                장애인주간이용시설 관리운영비 세출예산과목\n◦ 다음의 내용은 장애인주간이용시설 전체 재원(보조금, 후원금, 전입금, 사업수입 등 모든 재원)에 대한 세출예산과목\n  내용임.\n◦ 아래의 항목을 참고하여「사회복지법인 및 사회복지시설 재무회계 규칙」등에 따라야 함.\n      지원항목명                          지      원      내     용\n가. 이용 장애인 지원비        ※ 시설내 장애인의 영양, 건강, 위생 등의 직접보호에 소요되는 비용\n 1) 영양급식비            ◦ 장애인의 영양급식 및 간식비\n 2) 의약품비             ◦ 장애인 건강관리에 소요되는 보건위생 및 의약품 등 구입비\n 3) 위생재료비            ◦ 장애인의 위생관리를 위한 용품 구입비 등\n나. 시설관리비             ※ 시설을 유지, 보수, 안전 및 관리에 소요되는 비용\n 1) 시설장비 유지비         ◦ 건물 및 건축설비 등 시설물 유지 관리비\n 2) 일상용품비            ◦ 일상용품 구입비\n 3) 냉･난방연료비          ◦ 시설의 냉방 및 난방용 연료비 및 이에 소요되는 전기료\n 4) 차량유지비            ◦ 실제 운행중인 시설 업무용 소형 승합자동차와 특수차량의 연료비, 보험료 등\n 5) 공공요금             ◦ 시설 운영에 직접 소요되는 수도료, 전기료, 우편료, 전화료, 운송료 등\n 6) 오폐수정화시설운영비       ◦ 오폐수정화시설을 설치･운영 비용\n 7) 환경개선부담금          ◦ 환경개선부담금 납부금\n                     ◦ 법령에 따라 지급하는 제세(자동차세 등), 협회가입비 및 협회회비(보건복지부장관 허가 장애인     역\n 8) 제세공과금\n                       복지시설 관련 협회에 한함), 화재/자동차보험료, 상해보험료, 기타 보험료\n                     ◦ 사무용품비, 인쇄비, 집기구입비(물건의 성질상 장기간 사용 또는 고정자산으로 취급되는         재\n                       집기류는 비품(자산취득비)으로 계상), 도서구입비, 공고료, 수수료, 등기료, 운송비, 통행료    활\n 9) 수용비 및 수수료\n                       및 주차료, 소규모수선비, 포장비 등\n                     ◦ 퇴직연금 수수료, 이체수수료 등 각종 수수료 등\n10) 임차료              ◦ 시설 임차료\n                     ※ 건강보험 및 의료급여에서 비급여되는 진찰, 처치, 투약, 수술 등 지역사회 관련 시설을\n다. 의료재활사업비\n                       이용하는데 소요되는 비용\n 1) 재활치료비            ◦ 장애정도를 호전시키는데 필요한 재활치료비용\n 2) 물리치료비            ◦ 장애인에게 필요한 물리치료 비용 등\n 3) 작업치료비            ◦ 작업치료비용\n 4) 언어치료비            ◦ 청각, 언어장애인 및 지적장애인, 자폐성장애인 등의 언어치료비용\n 5) 청능치료비            ◦ 청각, 언어기능 장애인의 청능훈련 치료비용\n 6) 청능검사비            ◦ 청각, 언어기능 장애인의 청능훈련치료를 위한 청능검사비용\n 7) 보장구제작 및 수리비      ◦ 장애인 보장구 제작 및 수리비용\n라. 직업재활사업비           ※ 직업재활활동에 소용되는 재료비 등\n마. 교육재활사업비           ※ 교육을 통한 재활사업에 소요되는 비용\n 1) 학용품비             ◦ 이용장애인의 자립 및 교육활동에 소요되는 재료 등 구입비\n 2) 부교재 및 교양도서비      ◦ 이용장애인의 자립교육 및 교양함양을 위한 교재･도서 구입비\n 3) 프로그램 진행비         ◦ 이용장애인의 자립 및 교육재활을 위한 외부 강시비 등\n바. 사회･심리재활사업비        ※ 시설 및 지역사회를 이해하고 이에 적응하는데 소요되는 비용\n 1) 일상생활 및 여가활동 경비   ◦ 일상생활훈련 및 문화예술, 스포츠, 취미/여가 활동 등에 소요되는 비용\n 2) 지역사회적응활동 경비      ◦ 지역사회 활동에 소요되는 비용\n 3) 특별활동 경비          ◦ 여행, 캠프 및 기념일 활동 등 이용 장애인 활동에 소요되는 비용\n사. 직원 교육훈련 여비        ※ 시설 직원의 교육훈련 및 출장에 소요되는 여비 등 경비\n아. 시설운영위원회 운영비       ◦ 시설운영위원회 운영에 소요되는 비용\n※ 위 예시에 명시된 내용이 아닌 경우라도 위 지원항목 범주 내에서 이용 장애인 및 시설운영에 필요한 항목은 지출\n  가능(지자체 협의)"}, {"p": 314, "t": "[별표 2]\n\n              장애인주간이용시설의 최중증 장애인 돌봄서비스\n\n                  서울시                  경기도                    울산시\n  구분\n             (중증장애인 다수이용시설)       (중증장애인 주간보호시설)        (최중증장애인 주간보호시설)\n         ▪ 10개소(2022년 선정)\n  개소                          ▪ ’23년 20개소(전담반)         ▪ 5개소\n         ＊ 총 선정: 108개소\n\n         ▪ 상시 이용자가 10인 이상이고, ▪ 상시 이용자가 10인 이상이고,\n  지원                                             ▪ 시설규모, 132㎡ 이상, 종사자\n           중증장애인 이용 비율이 80%    중증장애인 이용 비율이 80%\n  대상                                               6명 이상인 시설\n           이상인 시설              이상인 시설\n         ▪ 중증장애인                ▪ 중증장애인             ▪ 최중증장애인\n           ｢장애인복지법｣ 및 같은법 시행      19세 이상 행동장애 강도 판정   4개 영역(도전적 행동, 신변\n           규칙에 따른 정도가 심한 장애인      점수가 45점 이상인 발달      처리능력, 사회적 돌봄, 시설\n  입소       또는 법규 개정 전(’19.7.1.)   장애인                 퇴소 경험) 사정\n  대상       장애등급 1~3급 등록 장애인                         * 입소 절차: 시설 결원시 사정\n                                                      의뢰 → 장애인복지관 대상자\n                                                      사정 → 위원회 선정 의결 거쳐\n                                                      입소\n\n         ▪ 개소당                                         ▪ 개소당\n 사업비                          -\n           연 4,000천원 추가 지원                               연 13,200천원 추가 지원\n\n  인력                                                   ▪ 시설당 2~3명 추가\n         ▪ 종사자 1인 추가          ▪ (기존) 3:1 → (전담반) 2:1\n  지원                                                     4:1→3:1\n\n                              ▪ 종사자 1인 인건비             ▪ 기존 인력 3급 지원,\n 인건비     ▪ 종사자 1인 인건비\n                                45,000천원 추가 지원         ▪ 신규직원 4급 지원\n\n  환경                          ▪ 환경개선비 10,000천원 지원\n         -                                        -\n  개선                            (초기 1회만 지급)"}]}, {"title": "Ⅳ. 장애인 주간이용시설 기능보강 사업", "start": 315, "end": 350, "subs": [], "pages": [{"p": 315, "t": "                                 Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n    Ⅳ     장애인 주간이용시설 기능보강 사업\n\n\n1    목적\n\n○ 장애인 주간이용시설(이하 “주간이용시설”이라고 한다) 이용장애인의 안전과\n    편의를 보장하고, 일상생활 및 사회생활을 지원하는 프로그램 운영을 원활히                     제3장\n    할 수 있도록 시설 개선 지원\n2 근거법령\n○ 장애인복지법 제57조(장애인복지시설의 이용 등), 제79조(비용부담), 제81조\n    (비용 보조) 및 같은 법 시행령 제44조(비용 보조)\n\n\n3 지원대상 및 지원조건\n\n○ 지원대상：시설 건물 신축 및 증개축, 개보수, 장비보강이 필요한 장애인\n    주간이용시설\n    * 지방자치단체, 법인･단체, 개인이 설치･운영하는 시설(최중증 장애인 전담시설 및 시설의 지속가능성\n      담보 측면에서 법인, 단체의 시설 우선 지원)\n\n○ 지원조건：국비 50%, 지방비 50%(필요시 지방비 추가 지원 가능)\n    * 전체 사업규모가 보조금 지원 범위를 초과하는 경우 자부담 필요"}, {"p": 316, "t": " 4 지원방향\n\n ○ 산발성, 임시방편을 지양하고 사업의 시급성과 효과성을 고려하여 지원\n\n ○ 시설 안전을 가장 우선적으로 고려하고, 주간이용시설이 없는 지역(기초자치\n   단체)에서 신규로 설치･운영하는 경우와 뇌병변장애인, 중증장애인 등에 대한\n   전담 주간이용시설에 대해 우선적으로 지원\n\n\n 5 지원내용\n\n가. 사업의 종류\n\n ○ 신축：건축물이 없는 대지에 시설을 건축하는 것\n   * 기존 시설이 인근 대지에 추가로 건물을 건축하는 것은 증축에 해당\n\n ○ 증개축 : 기존 시설이 있는 대지에 건축물의 면적, 층수 또는 높이를 늘리는\n   것(증축), 기존 건축물의 전부 또는 일부(내력벽･기둥･보･지붕틀 중 셋 이상이\n   포함되는 경우를 말함)를 철거하고 그 대지에 종전과 같은 규모의 범위에서\n   건축물을 다시 축조하는 것(개축)\n\n ○ 개보수：노후화･파손･기능저하 등을 개선하기 위해 건물을 수리 또는 변경하는 것\n\n ○ 장비보강：시설안전 및 환경 개선, 이용 장애인의 재활훈련･편의증진 등에\n   필요한 장비를 구입하는 것(교체 또는 신규 구비)"}, {"p": 317, "t": "                                  Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n나. 국비 지원\n\n 구분     지원단가(개소당, 국비)                      비고\n\n                          ∙ 지방자치단체가 직접 설치하거나, 지방자치단체 외 사회복지\n                           법인 및 사회복지사업을 목적사업으로 하는 비영리법인이\n 신축     1,790천원/㎡×50%      신축비용을 일부 자부담하는 경우 지원(원칙)\n                          ∙ 토지구입비는 지원하지 않음\n                          ∙ 설계비･감리비 등 제반수수료는 자부담 원칙\n\n                          ∙ 자가 또는 지자체 소유 건물에 한하여 지원(임차건물은 지원      제3장\n                           대상 아님, 단, 지방자치단체 소유 건물을 임차 또는 무상\n                           제공 받아 운영하는 시설은 지원)\n                          ∙ 증축시 토지구입비는 지원하지 않음\n 증개축     1,790천원/㎡×50%    ∙ 설계비･감리비 등 제반수수료는 자부담 원칙(단, 안전진단        지\n                           전문기관의 시설안전평가에서 긴급을 요하는 판정을 받아           사\n                           안전사고의 우려가 있음에도 재정여건상 자부담 능력이            회\n                           현저히 떨어진다고 판단되는 경우에는 증빙서류 등을 확인          활\n                           하여 설계비 지원 가능)\n\n                          ∙ 자가 또는 지자체 소유 건물에 한하여 지원(임차건물은 지원\n                           대상 아님, 단, 지방자치단체 소유 건물을 임차 또는 무상\n                           제공 받아 운영하는 시설은 지원)\n       897천원(최대)/㎡×50%    ∙ 설계비･감리비 등 제반수수료는 자부담 원칙(단, 안전진단\n 개보수\n       * 실제 필요 면적 적용       전문기관의 시설안전평가에서 긴급을 요하는 판정을 받아\n                           안전사고의 우려가 있음에도 재정여건상 자부담 능력이\n                           현저히 떨어진다고 판단되는 경우에는 증빙서류 등을 확인\n                           하여 설계비 지원 가능)\n\n                          ∙ 사무용품(소모품･비품･집기류(PC포함)), 사용 가능한 내용\n 장비\n       10,000천원/개소당×50%    연수 미도래 장비 교체･구입 제외\n 보강\n                          ∙ 차량 지원 제외\n\n※ 차량 지원은 필요시 보조금 관리에 관한 법률 시행령 별표 2(79.장애인 지역사회재활시설 차량 지원)에\n  따라 지방자치단체의 사업으로 지원하여야 함"}, {"p": 318, "t": " 6 지원대상 선정 방법 및 절차\n\n ○ 시･도에서는 시･군･구에 기능보강사업 수요조사를 실시하고, 수요가 있는\n   시･군･구에서는 사업계획서를 시･도에 제출\n\n ○ 시･도는 시･군･구 사업계획서를 검토･조정하고, 자체심사위원회를 통해 지원\n   사업(시설) 우선순위를 심사하여 보건복지부에 제출(다만 추가신청 시 시･도\n   자체 내부기준을 수립하고 그 기준에 따라 우선순위를 정하여 제출하는 것이\n   가능함)\n  - 시･도 및 시･군･구는 사업수행기관이 동일 사업에 대해 보건복지부 외\n    타 기관(사회복지공동모금회 등)을 통해 중복 지원을 받는지 여부를 면밀히 확인･\n    검토하여야 함\n   * 중복 신청이 발견될 경우 해당 사업(중복 부분)의 취소를 보건복지부에 보고하여야 함\n\n  - 시･도 및 시･군･구는 보건복지부에 제출하여야 할 서류의 누락이 없는지\n   반드시 확인하여, 필요한 서류를 갖추어 보건복지부에 제출하여야 함\n   * 제출서류 : 예산계상 신청서(별지 제1호 서식), 검토의견서(별지 제2호 서식), 사업 수행계획서\n     (별지 제3~4호 서식), 건축관련 의견서(별지 제5호 서식), 연도별 이행계획서(별지 제7호 서식),\n     증빙서류 등\n\n ○ 보건복지부는 관련 전문가 등 내･외부 심사위원으로 구성한 심사위원회를\n   통해 지원사업(시설)을 선정하여 시･도에 사업계획 승인 통보\n   * 승인 받은 사업계획은 변경할 수 없음이 원칙이며, 천재지변 등 불가피한 경우에 사업계획을 변경\n     하여야 하는 경우 당초의 보조사업자 선정 결과에 영향을 미치지 않는 범위 내(시･도에서 소명)에서\n     보건복지부에 사업계획 변경 승인을 신청할 수 있음(단, 회계연도 종료 전 3개월 이내에는 신청\n     불가)\n\n  - 심사 시 반복적으로 이월이 발생하는 지자체에 대한 평가항목(감점)을 구성\n   하여 집행관리 체계 강화\n\n   ※ 2027년 국고보조사업 예산계상신청\n    (신청시기 및 방법) 별도 안내"}, {"p": 319, "t": "                                 Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n     (신청사업) 신축, 증･개축, 개보수, 장비보강\n     (신청절차) 보조사업자 → 시･군･구 → 시･도 → 보건복지부\n       : 시･군･구에서는 2027년 예산계상 신청할 사업계획서를 시･도에 제출, 시･도는 시･군･구\n         사업계획서를 검토하고 우선순위를 심사하여 보건복지부에 제출\n\n     (예산계상 통보) 보건복지부 → 시･도\n       : 보건복지부는 심사위원회를 통해 지원사업(시설)을 선정하고, 이를 토대로 장애인 주간이용\n         시설 기능보강사업 2027년 정부 예산안 수립･제출\n       : 정부 예산안 확정시 국고보조금 예산을 통보(예비통지)하고, 국회에서 예산이 심의･확정된\n         후에는 즉시 확정 금액을 통지, 지자체는 확정통보내역과 금액을 사업수행기관에게 즉시 알려\n         사업에 착수하도록 함\n     (국고보조율) 50%\n7    지원대상 선정 기준\n1) 기본 고려사항\n○ 보조금 지원 필요성, 사업 시급성, 사업계획의 타당성･충실성, 사업 효과성,\n\n    보조사업자의 사업수행능력 및 추진의지\n\n○ 장애인 주간이용시설 지속 운영 계획 및 가능성\n\n\n2) 우선 고려사항(가점)\n\n○ 시설 노후화* 등으로 인한 홍수･지진 등 자연재해, 화재･붕괴 등 사고의 예방\n    및 피해복구 사업, 건물 안전･소방설비 지원 사업을 최우선 고려\n    * 전기･소방점검 및 시설안전진단 결과 등을 활용하여 판단\n\n○ 장애인 주간이용시설이 없는 지역(기초자치단체)에서 신규로 장애인 주간이용\n    시설을 설치･운영하려는 경우\n    * 시･군･구 수요조사 종료 이전에 장애인주간이용시설 신고를 완료하고 사업수행체계를 갖추어\n      사업계획서를 제출하여야 함(단, 신축의 경우 시설 신고 대신 장애인복지법 시행규칙 제43조제1항의\n      1~5호 서류를 첨부하여 제출하여야 함)"}, {"p": 320, "t": " ○ 시설 안전･환경 개선이 필요한 최중증장애인(도전적행동, 와상 뇌병변 장애인 등)\n   전담 주간이용시설\n   * 경사로 설치, 휠체어 이동 공간 확보, 장애인 이동보조 레일 설치 등\n\n ○ 반복적으로 이월이 발생하는 지자체에 대한 평가항목(감점) 구성을 통하여 집행\n   관리 체계 강화\n\n\n 8 지원 배제 대상\n\n ○ 관련 법규의 위반 또는 위반 우려가 있는 시설(미신고시설, 불법 건축물 등)\n\n ○ 보조금을 지원받고자 하는 법인 등 당사자(사업수행기관) 외 제3자로부터\n   부정 청탁이 있는 경우\n\n ○ 학대 및 성희롱･성폭력 등 사건이 발생하여 행정처분 등 조치를 받은 시설\n\n ○ ｢보조금 관리에 관한 법률｣ 및 관계 법령･규정 위반 시설(최근 5년 이내)\n\n ○ 그 밖에 국고지원 목적에 반하는 중대한 사유가 있는 경우\n   ※ 지원 배제 대상인 경우에도 시설 안전 측면에서 시급성이 있는 경우에는 심사하여 지원할 수 있음\n\n\n 9 국고보조금 신청 등\n\n가. 국고보조금의 신청 및 교부\n\n 1) 사업수행기관은 보건복지부에서 통보한 보조금 예산의 확정통지에 근거하여\n   예산교부 신청서와 첨부서류를 시･군･구에 제출함\n\n 2) 시･군･구는 사업수행기관이 제출한 자료를 검토 후 시･도로 제출하고, 시･도는\n   제출된 자료를 검토하여 보건복지부에 국고보조금 교부를 신청함\n\n 3) 보건복지부는 제출 자료 검토･확인 후 보조금 교부"}, {"p": 321, "t": "                            Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n나. 국고보조사업 선정 취소 및 국고보조금의 반환\n\n 보건복지부장관은 다음의 경우 국고보조금 지원 대상 선정을 취소하고 보조금의\n 반환을 명할 수 있음\n\n1) 보조금을 지급 목적과 다른 용도로 사용한 경우\n\n2) 법령의 규정, 보조금 교부결정의 내용 또는 법령에 의한 보건복지부장관의\n 처분을 위반한 경우\n\n3) 허위신청이나 그 밖에 부정한 방법으로 보조금의 교부를 받은 경우                      제3장\n\n4) 계획된 기일을 경과하고도 정당한 이유 없이 사업수행에 착수하지 않거나 사업\n  기한 내에 완료하지 못할 것이 명백하다고 인정되는 등 중대한 사유로 인해\n  사업을 수행할 수 없는 경우\n5) 보고된 사업비 등 사업집행 실적보고가 허위인 경우\n6) 심의 승인되지 않은 사업을 임의로 추진한 경우\n7) 타 기관 또는 후원 등을 통하여 기 승인된 사업을 완료한 경우\n\n8) 사업계획 전면 변경 등 당초 승인된 사업을 수행하지 못할 경우\n ※ 단, 천재지변 등 불가피한 사정 및 안전관련 긴급 소요 발생시는 예외로 함\n\n9) 그 밖에 국고지원 목적에 반하는 중대한 사유가 있는 경우\n\n\n다. 국고보조금의 관리 및 집행\n\n<e나라도움(국고보조금통합관리시스템) 사용안내>\n\n1) 정부의 국고보조금 부정수급 종합대책(’14.12.4.)에 따라 모든 민간보조\n  사업자까지 e나라도움 사용 의무화\n - 다만, 사회복지시설정보시스템을 사용하는 복지시설은 e나라도움을 직접 사용\n  하지 않고 시설정보시스템을 통해 국고보조금 교부, 집행 등을 처리할 수 있음\n  ※ 단, e나라도움을 사용하는 시설은 반드시 시설정보시스템을 동시에 사용해야 함(보건복지부\n    사회서비스자원과-24(’18.1.2.)호)"}, {"p": 322, "t": " 2) 보조사업의 예탁방법 (보조금법 시행령 제10조의8)\n  - 지자체가 직접사업을 수행할 경우는 비예치형, 지자체가 민간보조사업자에게\n   재교부 할 경우 예치형*으로 관리할 것\n   * (예치형) 보조금교부, 보조사업자의 증빙등록 및 집행요청 등 보조금 전달체계 및 금융거래 전\n     과정을 e나라도움 시스템과 예탁계좌를 통해 수행(예탁계좌(한국재정정보원)로 교부받아 e나라\n     도움을 통해 집행･이체 진행(집행등록→이체))\n   ※ e-나라도움(http://www.gosims.go.kr) – e나라도움소개- 매뉴얼 - 사용자매뉴얼 참조\n\n\n <일반사항>\n\n 1) 사업수행기관은 교부 받은 국고 및 지방자치단체 보조금, 예산계상시 제출한\n   자부담분을 별도 계정으로 분리하여 관리함(연도별, 지원분야별 분리 관리)\n\n 2) 사업비는 사업계획서의 집행계획에 따라 사업기간 내에 예산을 집행하여야 함\n   ※ 사업의 조속한 시행을 위해 설계비 등을 자부담으로 우선 집행할 수 있음. 단, 사업계획서에\n     자부담 예산이 반영된 경우로써 지원대상으로 선정되어 보조금 확정내시가 된 경우에 한함.\n\n 3) 예산 신청시 부담하기로 한 자부담은 보조금보다 우선 집행하여야 함\n\n 4) 보조금의 이월은 허용되지 않으나 부득이한 사유로 이월할 경우에 2회계연도를\n   초과하여 이월할 수 없으며, 2회계연도 종료일 이후 집행잔액은 전액 반납해야 함\n   ※ 장비보강 지원사업은 이월 불가하며, 당해연도 불용액은 전액 반납해야 함\n <집행잔액 및 이자액 관리>\n\n 1) 사업수행기관은 보조사업이 완료된 때에는 집행된 보조금을 정산하여 집행\n   잔액, 보조금으로 발생한 이자를 함께 반납해야 함\n\n   - 단, 아래 사유로 발생한 이자는 국고반납대상이 아님\n\n    가) 보조금 관리에 관한 법률(시행령 제13조)의 “불가피한 사유로 발생한 이자”\n\n    나) 사업수행기관 및 시･군･구에서 발생한 이자\n        ※ 사업수행기관 발생이자는 시･군･구, 시･군･구 발생이자는 시･도의 세입으로 처리하되,\n          사업수행기관이 시･도인 경우는 국고반납대상임"}, {"p": 323, "t": "                         Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n2) 사업목적을 달성하고 사업이 완료된 경우(모든 승인사업의 지출이 최종 완료된\n  경우)에는 사업계획변경 등을 통해 집행잔액을 사용할 수 없음\n\n\n<증빙서류>\n\n1) 사업비 집행 증빙서류는 세금계산서 등 청구서에 따라 보조금 별도 계정에서\n  직접 집행된 온라인 지급증빙서, 보조사업비 카드 영수증 처리만을 인정\n - 계약에 의한 사업비 집행의 경우는 계약서 사본 첨부\n2) 다음의 지출증빙서류는 5년간 보관하도록 함\n - 사업비 사업명세서, 별도 계정의 입출금 내역, 사업비 예금이자 발생 및 집행             애\n   내역서, 관련 증빙자료(세금계산서, 영수증) 등\n<기타>\n동 지침에서 규정하지 않은 사항은 ʻ보조금 관리에 관한 법률ʼ 등 예산 회계 관계법,           설\n\n국고보조금 운영관리 지침(기획재정부), 국고보조금 통합관리지침(기획재정부) 및\n‘보건복지부소관 국고보조금 관리규정’에 따름\n\n\n10 사업 수행 관리\n\n가. 기능보강지원 사업 관리\n\n1) 신축, 증개축 및 개보수\n\n - 시･도지사 및 시･군･구청장은 공사 설계 및 시공에 대한 감리를 철저히 하여\n   부실공사가 되지 않도록 사전 예방 조치를 강구\n\n - 사업의 정상 추진 및 연내 완료를 위해 개별 사업의 진도를 매월 정기적으로\n  파악 관리하여야 함"}, {"p": 324, "t": "    보조금 교부 이전이라도 사업수행기관이 자부담 사업비를 활용해 설계 등을\n    우선 추진하여 공사 조기 착공 필요\n\n    사업수행기관이 선급금 등을 지급할 수 있도록 보조금 조기 교부\n    * 선급금 외 사업 실적별 기성급 등도 적기 교부될 수 있도록 보조금 관리\n\n  - ｢장애인･노인･임산부 등의 편의증진 보장에 관한 법률｣ 및 ｢화재예방, 소방\n    시설 설치･유지 및 안전관리에 관한 법률｣에 따라 장애인편의시설 및 소방\n    시설 설치기준 등을 준수\n\n 2) 장비보강\n\n  - 시설이 구매한 장비는 국고지원 장비임을 표시하는 라벨을 부착하고 시설의\n    자산대장 등에 기재하여 관리\n\n  - 신규 구입하는 장비는 반드시 A/S에 관한 계획을 수립하여야 하며, 장비 구매\n    계약 시 계약서에 관련 내용을 분명히 포함시켜야 함(예: 하자보증보험증권,\n    이행보증증권, 제조자의 사후관리각서 요구 등)\n\n\n나. 사업계획의 변경\n\n ○ 승인받은 사업계획은 변경하지 않는 것을 원칙으로 하되, 천재지변 등 불가피한\n   사정 발생 시 사업계획 변경승인 신청서를 작성하여 보건복지부장관의 승인을\n   받아야 함\n\n  - 당초 승인된 사업계획과 직접 연관 없는 내용으로의 변경 신청은 불승인\n\n   ※ 사업계획 변경신청은 9.30. 보건복지부 접수 분까지 인정\n\n ○ 보건복지부의 승인을 받아야 하는 경우\n\n  - 당초 사업선정과 다른 사업내용으로 변경\n\n  - 물가상승으로 인한 단가 변경 등 사업비 증액이 필요한 경우"}, {"p": 325, "t": "                             Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n○ 시･도 승인을 받아야 하는 경우(시･도지사 승인 후 보건복지부에 결과보고)\n\n- 당초 보조금의 변경 없이 자부담 조정에 따른 총사업비 및 사업량의 변경\n\n- 보조사업의 목적에 위배되지 않고 당초 보조금을 초과하지 않는 범위 내에서의\n  설계 변경\n ※ 천재지변 등 불가피한 상황 없이 사업목적 전면 변경은 승인 불가 및 사업 취소 사유가 됨\n\n\n11 사업 수행 실적 보고\n○ 시･도지사는 기능보강사업의 연간 추진실적을 다음해 1월 말까지 보건복지부로\n 제출해야 함\n○ 사업수행기관은 사업이 완료된 후 사업완료 실적보고서(별지 제10호 서식)와\n 관련 서류를 시･군･구에 제출하여야 하고, 시･도는 사업완료 실적보고서\n (별지 제11호 서식)를 사업이 완료된 회계연도 종료 후 다음해 1월 말까지\n 보건복지부에 제출해야 함\n\n○ 보건복지부는 사업 완료에 따른 실제 사용 및 제반 사항 준수 여부 확인 등을\n 위해 현지 조사를 실시할 수 있으며, 필요시 별도로 개별 사업에 대한 실적\n (정산) 보고를 요청할 수 있음\n ※ 장비보강사업 중 노후장비 교체 지원의 경우 사업수행기관에서는 사업완료시까지 교체대상\n   장비를 처분하고 그 결과를 첨부하여 제출해야 함\n\n○ 국고보조금이 1억원 이상인 보조사업에 대한 실적보고서를 제출하는 경우\n 검증기관으로부터 정산보고서를 검증받아 정산보고서와 함께 제출하여야 함\n (보조금법 제27조)\n * 검증기관의 정산보고서 검증방법에 대하여는 ‘보조사업 정산보고서 검증지침’(기획재정부 공고\n   제2017-186호)를 적용하며, 기타 자세한 사항은 관련 법령 및 규정 참고"}, {"p": 326, "t": " 12 중요재산 관리\n\n가. 중요재산\n\n 1) 부동산과 그 종물\n\n  ○ 국고보조금으로 신축하여 새로 취득한 경우\n\n  ○ 국고보조금으로 증축･개축하여 기존건물의 규모가 확대되고 효용이 증가한 경우\n\n  ○ 국고보조금으로 건물을 개보수하여 그 효용이 증가한 경우 (건물의 내･외부\n    도색, 방수공사, 창호교체 등 단순 개보수 공사와 100㎡ 이하의 소규모\n    개보수 공사는 제외)\n\n 2) 그 밖의 국고보조금으로 구입한 단가 5백만원 이상인 장비, 물품\n\n나. 중요재산의 취득가액 등 기준\n\n 1) 기능보강사업의 국고보조금과 지방비를 포함한 총액기준으로 하되, 완료\n   정산된 금액\n\n 2) 기능보강사업이 완료되어 이미 등록된 중요재산은 감정평가액이 있을 경우\n   그 감정평가액의 증감액\n\n다. 중요재산 부기등기\n\n 1) 사업수행기관은 중요재산 중 부동산에 관한 소유권 등기를 할 때에는 해당\n   부동산이 보조금을 지원받아 취득하였다는 사항 등을 표기하는 부기등기\n   (附記登記)를 아래와 같이 해야 하며, 보조금이 지원된 부동산 증명서를\n   관할 등기소에 제출하여야 함(보조금법 제35조의2, 보건복지부소관 국고\n   보조금 관리규정 제31조)\n  - 해당 부동산은 보조금을 지원받아 취득하였거나 그 효용가치가 증가한\n    재산이라는 사항"}, {"p": 327, "t": "                                 Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n - 보조금 교부 목적과 해당 부동산의 내용연수를 고려하여 중앙관서의 장이\n  정한 기간이 지나지 아니하였음에도 그 부동산을 보조금의 교부 목적에 위배\n  되는 용도에 사용, 양도(매각 포함), 교환, 대여 및 담보로 제공하려는 경우에는\n  보건복지부장관의 승인을 받아야 한다는 사항\n\n2) 위의 의무를 위반한 경우 보조금 교부결정 취소 등의 시정조치를 할 수 있음\n\n라. 중요재산 처분의 제한(보조금 관리에 관한 법률 제35조)\n\n1) 사업수행기관은 중요재산에 대하여 보조금 교부 목적과 해당 부동산의 내용                       제3장\n\n  연수를 고려하여 중앙관서의 장이 정한 기간이 지나지 아니하였음에도\n  보조금의 교부 목적에 위배되는 용도에 사용, 양도, 교환, 대여 및 담보로\n  제공하려는 경우 보건복지부장관의 승인을 받아야 함\n - 단, 사업수행기관이 법인인 경우 보조금의 교부 목적에 위배되는 용도에\n  사용은 보건복지부장관의 승인을 받고, 양도(매각 포함), 교환, 대여 및\n  담보로 제공하려는 경우는 지방비를 부담한 시･도지사의 승인을 받아야 함(승인\n  후 보건복지부 결과보고)\n\n2) 처분시 승인을 받아야 하는 감가상각 내용연수는 법인세법 시행령 제28조, 같은\n  법 시행규칙 제15조의 상한 기준 및 당해연도 예산 및 기금운용계획 집행지침을 따름\n\n                   구 분\n                                                내용연수\n        분 류                대 상\n                     철근콘크리트조 건축물\n                                                 50년\n        부동산           또는 강구조건축물\n                         그 외의 건축물                35년\n                          선박, 항공기                30년\n       고가 동산\n                            차량                   20년\n     (5천만원 이상)\n                         그 외 기계류 등               15년\n       기타 동산       위 대상에 포함되지 않는 동산         조달청 내용연수 + 5년\n\n  ※ 내용연수가 경과한 중요재산은 관할 시･군･구에 보고하여 매각 등 적절한 조치를 취하고 대금이\n    발생한 경우에는 해당시설의 세입으로 처리 한 후 그 결과를 관할 시･군･구에 보고"}, {"p": 328, "t": " 3) 시･도지사는 장애인주간이용시설을 운영하는 법인에 대한 기본재산 처분 허가\n   시, 해당 재산이 중요재산인지와 보건복지부장관의 처분 승인을 받았는지를\n   확인하고(양도, 교환, 대여 및 담보로 제공하려는 경우는 지방비를 부담한\n   시･도지사의 승인으로 대체) 기본재산처분 허가를 해야 함\n\n 4) 중앙관서의 장은 보조사업자 또는 간접보조사업자가 해당 보조사업을 완료한\n   후에도 중앙관서의 장의 승인 없이 중요재산에 대하여 보조금법 제35조제3항\n   각 호의 행위를 한 경우에는 다음 각 호의 전부 또는 일부에 해당하는 금액의\n   범위에서 반환을 명할 수 있다.\n\n   1. 중요재산을 취득하기 위하여 사용된 보조금 또는 간접보조금에 해당하는 금액\n\n   2. 중요재산의 효용가치 증가액에 해당하는 금액\n\n   3. 중요재산의 양도, 교환, 대여 또는 담보 제공을 통하여 얻은 재산상의 이익에\n        해당하는 금액\n\n\n마. 중요재산 공시\n\n 1) 중요재산 보고\n\n  ○ (취득보고) 중요재산 취득 후 15일 이내에 해당 중앙관서의 장 또는 지방자치\n    단체의 장에게 보고해야함\n\n  ○ (변동보고) 중요재산 처분제한기간 이전까지 매년 6월과 12월에 변동현황을\n    보고해야함\n   * 다만, 변동 사항이 없거나 미미한 경우에는 보고를 생략 가능\n\n 2) 보고대상 : 보조사업자 또는 간접보조사업자(지자체 또는 시설)\n\n 3) 공시방법 : 국고보조금통합관리시스템"}, {"p": 329, "t": "                                   Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n                     < 보조사업자 등의 정보공시 >\n\n 1) 관련법령 : 보조금법(제26조의10, 제27조, 제27조의2), 보조금법 시행령(제11조의2, 제12조의2,\n    제12조의3), 보조사업자 정보공시 세부기준\n\n 2) 공시대상 : 동일 회계연도 중 보조사업 또는 간접보조사업 총액이 1천만원 이상인 보조사업 또는\n    간접보조사업을 수행하는 보조사업자 또는 간접보조사업자(지방자치단체 제외)\n   * 여러부처의 보조사업 또는 간접보조사업을 수행하는 보조사업자 또는 간접보조사업자의 경우 모든\n     부처에서 교부받은 보조금 또는 간접보조금을 합산한 금액이 1천만원 이상\n\n 3) 공시 사항\n   ① 보조금 교부신청서 및 사업계획서\n   ② 보조사업 또는 간접보조사업의 수입･지출내역\n   ③ 정산보고서\n   ④ 정산보고서에 대한 검증보고서(총액 3억원 이상인 경우)\n   ⑤ 보조사업 또는 간접보조사업 관련 감사 지적사항\n   ⑥ 보조사업자 또는 간접보조사업자에 대한 감사보고서 또는 감사 관련 보고서(총액 10억원 이상인 경우)        역\n   ⑦ 보조사업자 또는 간접보조사업자의 재무제표 또는 결산서\n   ⑧ 보조사업자 또는 간접보조사업자가 당해 연도 보조금 또는 간접보조금으로 취득한 중요재산 현황             재\n 4) 정보공시 기한･방법 : 회계연도 종료일부터 4개월 이내에 국고보조금통합관리시스템에 공시\n 5) 제재조치 : 위반사실에 대해 서면으로 시정명령을 할 수 있고, 보조사업자 또는 간접보조사업자가\n    시정명령 불응 시 횟수에 따라 해당 회계연도의 보조금을 삭감할 수 있다(50/100 이내)\n\n\n13 성과평가\n\n○ 보건복지부는 사업의 효과성 평가･관리를 위해 성과지표를 수립하여 관리할\n  수 있음\n\n○ 성과평가 결과는 차기연도 시･도별 예산 수립에 반영할 수 있음"}, {"p": 330, "t": " 14 행정사항\n\n ○ 지방자치단체는 사업 계획의 조정･검토, 집행, 사후관리 등 사업 전반에 대하여\n   담당 국･과장의 지도･감독 및 책임 하에 사업 수행에 만전을 기하여야 함\n\n ○ 시･도지사 및 시･군･구청장은 신축사업을 수행할 사업수행자에 대한 사업의\n   타당성을 충분히 검토하여 준공과 동시에 시설 설치허가를 받도록 함\n\n ○ 시･도지사는 시설 신축부지 확보 등 제반 사정으로 인하여 국고보조금 교부\n   신청이 기일 내에 제출되지 못하여 사업이 지연되거나 이월되는 사례가\n   없도록 지도･감독을 철저히 하여야 함\n\n ○ 신축, 증개축의 경우 “건축법”, “건축물의 구조기준 등에 관한 규칙”에 따른\n   내진등급기준이 반드시 반영되도록 설계\n\n ○ 지방자치단체는 사업이 지연되지 않도록 예산 집행 및 진도관리를 철저히\n   하여야 함\n\n ○ 사업수행기관은 보조사업으로 취득한 건물과 장비를 활용하여 시설의 기능이\n   원활하게 이루어질 수 있도록 시설 및 장비 운영계획을 수립하여 시행하여야 함\n\n ○ 시･도지사는 보조사업을 완료한 때에는 보조사업이 당초 목적에 부합되고\n   효과적으로 수행되었는지를 검토 후 보조사업 실적 보고서를 제출"}, {"p": 331, "t": "                                                       Ⅳ. 장애인 주간이용시설 기능보강 사업\n\n\n[별지 제1호 서식] 예산계상 신청서\n\n           2027년 장애인주간이용시설 기능보강 예산계상 신청서\n                    (신축, 증개축, 개보수, 장비보강) 해당사업종류 기재\n 1. 일반 현황 (2025.3월 현재)\n\n\n             시설 전경 사진 (1)                                         시설 전경 사진 (2)\n\n\n                       사회복지법인 ㅇㅇㅇ                                                ㅇㅇㅇ센터\n  운영법인･단체                                               시설명\n                        (대표자 : ㅇㅇㅇ)                                            (시설장 : ㅇㅇㅇ)\n   최초 신고일                  2000.00.00.                관할지자체                  ㅇㅇ시･도 ㅇㅇ시･군          장\n   현위치 이전일       (시설이전에 해당하는 경우 기재)                    건물소유                    자가(✔), 임차( )       인\n  시설부지 면적                    000㎡                    건축규모(시설)                 지상 2층, 지하 0층        역\n    건축연도           .      . 월(경과연수 00년)              건물연면적(시설)                 000㎡(시설 00㎡)       사\n    이용자 수              현원 00명 (정원 00명)                 종사자수                 현원 00명 (정원 00명)       재\n2. 지원내역(지방자치단체, 사회복지공동모금회 등을 통한 기능보강사업)\n      연도                  지 원 내 용                                  지 원 금 액\n     2022                     없음                                 천원(도비    , 시군비     )\n     2023                     없음                                 천원(도비    , 시군비     )\n     2024                 ㅇㅇㅇ(개보수)                      000,000천원(도비 00,000, 시군비 00,000)\n     2025                     없음                                 천원(도비    , 시군비     )\n     2026                 ㅇㅇㅇ(개보수)                      000,000천원(도비 00,000, 시군비 00,000)\n 3. 신청 사업 개요\n
