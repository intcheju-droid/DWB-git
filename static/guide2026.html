                     미만\n 보호작업장                                                            기준：\n                                                                 전년도 말\n                     근로                         근로\n                              916                        936      현원기준\n           이용자 수에    장애인              이용자 수에    장애인\n           따른 지원                      따른 지원\n            (1인당)    훈련                (1인당)    훈련\n                              559                        571\n                     장애인                        장애인\n\n               기본지원                      기본지원\n                             27,340                     27,915\n               (개소당)                     (개소당)\n  장애인\n 직업적응훈련\n              이용자 수에                     이용자 수에\n   시설\n              따른 지원           559         따른 지원          571\n               (1인당)                       (1인당)\n\n※ 전체적으로 ’25년 대비 2.1% 증액(’25년 소비자물가상승률 반영)\n※ 보호작업장 중 근로장애인이 30명 이상인 시설은 ‘근로사업장’ 기본지원 단가로 지원 가능\n※ 기존에 보건복지부 지침기준 보다 높게 지원하고 있던 지자체는 동 기준 신설로 인해 지원을 축소하지 않도록 노력"}, {"p": 421, "t": "                                        Ⅰ. 장애인직업재활시설 운영(공통)\n\n\n[참고자료 3]\n\n              장애인 직업재활시설 관리운영비 세출예산과목\n○ 다음의 내용은 장애인 직업재활시설(판매시설 포함) 전체 재원(보조금, 후원금, 전입금, 사업수입 등 모든 재원)에 대한\n  세출예산과목 내용임.\n○ 따라서, 아래의 세출예산과목을 보조금으로 집행 할 경우 ｢예산 및 기금운용계획 집행지침｣ 또는 ｢사회복지법인 및\n  사회복지시설 재무회계 규칙｣ 등에 따라야 함\n\n     지원항목명                         지 원 내 용                      비 고\n                   ※ 시설 이용장애인의 영양, 건강, 위생, 주･부식비 등의 직접보호에 소요\n가. 이용장애인 보호비\n                     되는 비용\n나. 시설관리비           ※ 시설을 유지, 보수, 안전 및 관리에 소요되는 비용\n 1) 건물유지비          ◦ 건물 유지･관리비\n 2) 냉･난방연료비        ◦ 시설의 냉방 및 난방용 연료비\n 3) 차량유지비          ◦ 실제 운행중인 시설 업무용 차량의 연료비, 보험료 등\n 4) 공공요금           ◦ 시설 운영에 직접 소요되는 수도료, 전기료, 우편료, 전화료, 운송료 등\n 5) 오폐수정화시설 운영비    ◦ 오폐수정화시설을 설치･운영 중인 시설                               제4장\n 6) 환경개선부담금        ◦ 환경개선비용부담법 대상시설\n 7) 화재보험료(대인대물)    ◦ 소멸성 화재보험료\n 8) 상해보험료          ◦ 상해보험료\n 9) 수용비 및 수수료      ◦ 사무용품비, 인쇄비, 수수료, 퇴직연금수수료, 복식부기회계위탁처리비 등             인\n다. 직업적응훈련비         ※ 일상생활훈련, 직업적응훈련 등에 소요되는 비용\n 1) 일상생활훈련비        ◦ 직업생활 이외의 일상생활훈련을 위하여 소요되는 비용\n                   ◦ 대인관계기술, 직장예절 등 직업생활에 적응하기 위한 사회성 훈련 등에              활\n 2) 직업적응훈련비\n                     소요되는 비용\n라. 직업훈련비 등         ※ 이용장애인에 대한 직업훈련비 및 취업알선에 소요되는 비용\n 1) 직업훈련비          ◦ 직종별, 개인별 직업훈련에 소요되는 비용\n 2) 취업알선비          ◦ 근로장애인의 일반사업장에의 취업을 유도하기 위하여 소요되는 비용\n마. 생산활동지원비         ※ 제품생산 및 판로개척을 위한 지원비\n 1) 제품개발비          ◦ 생산품목 확대･전환을 위한 투자비, 경영컨설팅비\n                   ◦ 시설 및 제품을 홍보･광고하는데 소요되는 비용\n 2) 홍보･광고비･물류비\n                   ◦ 물류에 소요되는 비용\n 3) 영업활동비          ◦ 영업활동에 소요되는 비용(직업적응훈련시설 제외)\n 4) 기타             ◦ 직업재활시설 관련 협의체 회비(한국장애인직업재활시설협회비 등)\n바. 직원 교육훈련 여비      ◦ 시설 종사자의 안전교육, 훈련 및 출장에 소요되는 여비 등 경비\n사. 자산취득비           ◦ 시설 운영에 필요한 비품구입비(토지･건물 외의 자산의 취득비)\n※ 관리운영비는 예산의 범위 내에서 전액 통합 집행함\n※ 화재보험료를 적립식 보험에 가입하고 있는 시설은 보험기간이 종료되면 시설운영비에 편입 사용\n※ ｢사회복지법인 및 사회복지시설 재무회계 규칙 재무･회계 규칙｣ 상 세입과목은 모두[04-41], 세출과목은 각각\n  ‘( )’안에 표기\n※ 위 예시에 명시된 내용이 아닌 경우라도 위 지원항목 범주 내에서 이용장애인 및 시설운영에 필요한 항목은 지출 가능\n※ 본 별표를 참고하여 ｢사회복지법인 및 사회복지시설 재무회계 규칙｣에 의하여 집행"}]}, {"title": "Ⅱ. 장애인근로사업장 운영", "start": 422, "end": 432, "subs": [], "pages": [{"p": 422, "t": "     Ⅱ     장애인근로사업장 운영\n\n\n 1    목적\n\n 직업능력은 있으나 이동 및 접근성이나 사회적 제약 등으로 취업이 어려운 장애인\n 에게 근로의 기회를 제공하고, 최저임금 이상의 임금을 지급하며, 경쟁적인 고용\n 시장으로 옮겨갈 수 있도록 돕는 역할을 하는 데 있다.\n\n\n 2 기본방침\n\n ○ 장애인 근로사업장은 구직단계에서 일반사업장에의 취업이 어려운 장애인에게\n     일정한 기간 직업훈련과 고용기회를 제공하여 장애인의 직업능력을 향상시키고\n     안정적인 직업생활을 영위할 수 있도록 조력하는 역할을 담당하여야 한다.\n\n ○ 체계적인 직업재활 서비스를 도모하며, 근로장애인의 고용 및 근로에 대해서는\n     ｢근로기준법｣등 근로관계 법령을 준수하도록 노력하여야 한다.\n     - 장애인 근로사업장은 장애인의 고용 확대와 처우개선을 위해 매출 및 수익이\n      확대될 수 있도록 경영 및 마케팅 역량을 배양하여야 한다.\n\n\n 3 시설 및 운영 기준\n\n가. 시설 기준\n\n 1) 설비기준(「장애인복지법 시행규칙」 제42조)\n\n 가) 최소설비기준은 부대시설을 포함하여 430제곱미터 이상이어야 한다.\n\n 나) 작업실이나 작업활동 프로그램실의 면적은 기계설비를 제외하고 1인당 2제곱\n      미터 이상이어야 한다."}, {"p": 423, "t": "                                  Ⅱ. 장애인근로사업장 운영\n\n\n다) 부대시설은 운영업종 및 시설의 용도를 고려하여 적합한 곳에 설치하여야 한다.\n\n2) 구성 기준\n\n가) 근로장애인의 최소인원은 30명으로 한다.\n  ※ 재정지원 장애인일자리 참여자로 전환된 근로장애인은 근로장애인 현원에 포함하여 관리한다.\n\n나) 근로장애인 선정\n 의료, 직업능력, 심리, 교육평가 등의 결과와 초기면접의 정보들을 토대로\n 전문가들이 참여한 위원회에서 적격여부를 평가한 결과 교통, 건축 환경 접근성\n 이나 적응의 문제로 경쟁고용이 어려운 장애인을 선정한다.\n  ※ 특수학교 재학생 등 시설의 목적사업에 전적으로 종사할 수 없는 장애인은 선정하지 않는다.\n   다만, 특수학교 또는 전공과 졸업을 앞둔 예정자가 조기 취업 형태로 시설에 상근할 수 있는      제4장\n   경우는 선정할 수 있음\n다) 근로장애인 비율\n (1) 작업공정 등을 고려하여 심한 장애인 및 심하지 않은 장애인을 적재적소에\n   배치하되 근로장애인 중 60% 이상을 「장애인복지법 시행규칙」 [별표 1]의\n   규정에 의한 장애의 정도가 심한 장애인으로 고용하여야 한다.\n (2) 작업이나 서비스 과정상 장애인이 아닌 자를 고용하여야 할 필요가 있는\n   경우 그 인원은 현재 근로인원 수의 30%를 초과할 수 없다.(단, 법정 배치\n   직원은 별도로 함)\n\n라) 장애인 거주시설과 동일한 법인이 운영하는 장애인 근로사업장\n (1) 장애인 거주시설에서 생활하는 장애인 외의 이용장애인이 50% 이상 유지\n   되도록 한다.\n (2) 법인이 장애인 직업재활시설만 운영할 시 특별한 사유가 없는 경우, 특정\n    장애인거주시설의 장애인이 50퍼센트 이상을 넘지 않도록 한다.\n (3) 공동생활가정 등을 통해 출퇴근하는 장애인은 재가 장애인으로 본다."}, {"p": 424, "t": "나. 운영 기준\n 1) 중증장애인의 고용기회 확대 및 직무참여 강화\n\n 가) 장애인 근로사업장은 더 많은 중증장애인에게 직업생활의 기회와 적정 수준의\n    처우를 제공할 수 있도록 시설의 수익성 개선을 위해 노력하여야 한다.\n\n 나) 장애인 근로사업장은 장애인이 생산·서비스 과정에서 소외되지 않도록 적합한\n    직종 및 생산 품목을 선정 운영하여야 한다.\n  (1) 지역 특성 등 주변 여건과의 적합성, 생산품 판로 개척의 용이성, 직업재활의\n     효과성 및 일반고용과의 연계 가능성 등을 고려하여 선정해야 한다.\n  (2) 장애 유형이 다양화됨에 따라 장애 특성에 맞는 업종을 개발하도록 노력\n     하여야 한다.\n  (3) 장애인이 종사할 수 있는 업종은 생산 및 가공 등 2차 산업 외에도 축산,\n        원예 등 1차 산업 및 IT산업, 서비스산업 등 3차 산업을 포괄한다.\n\n 2) 재활사업\n\n 가) 재활프로그램(「장애인복지법 시행규칙」 제42조)\n  (1) 장애인 근로사업장의 재활사업은 장애인의 유형, 장애 정도, 연령별 특성과\n     현재 수행 중인 업종의 특성에 따라 필요하다면 재활프로그램을 계획하여야\n     하며, 그 계획에는 일반고용으로의 전이를 위한 내용을 포함하여야 한다.\n    - 재활사업을 실시하기 위해서는 사업계획과 예산을 수립한 후 지방자치\n        단체장의 승인을 받아 시행하여야 한다.\n  (2) 프로그램 내용\n    - 사회적응훈련：대인적응기술, 사회성훈련 등\n    - 직무기능 향상훈련：직무분석에 따른 직무변경, 개조, 보조공학 개입에\n        따른 훈련\n    - 작업태도 및 기술훈련\n    - 직무개발 및 경쟁적인 고용시장으로의 전이를 위한 조치：지역사회 노동\n        시장 분석 및 정보제공, 직무분석 및 개입, 전이계획과 실행, 사후 지도"}, {"p": 425, "t": "                              Ⅱ. 장애인근로사업장 운영\n\n\n (3) 근로장애인의 독립적인 사회경제활동 및 직업적인 잠재능력을 파악하기\n   위한 사회적응훈련, 직업평가를 실시하여야 한다.\n (4) 시설 종사자는 시설 내 장애인이 장애인 근로사업장에서 근로하는 동안\n   장애의 특성과 정도, 장애인의 욕구, 적성, 직업능력, 직업경험 등을 종합적\n   으로 고려하여 적합한 직무에 종사하게 하고 일반고용이 가능한 장애인은\n   일정 기간 후 일반사업장에 취업할 수 있도록 최선의 노력을 다하여야 한다.\n\n나) 통근 지원\n (1) 근로장애인의 출퇴근을 돕기 위한 통근 차량의 운영 등 방법을 마련하여야\n   한다.\n (2) 근로장애인은 지역적인 접근성, 장애 특성 등의 특별한 경우 외에는 기숙\n   하지 아니하고 통근할 수 있도록 유도하여야 한다.                         제4장\n\n\n3) 개인별 직업재활계획 수립\n가) 근로장애인의 욕구와 능력을 이해하고 이들에게 필요한 서비스와 프로그램을              직\n  효과적으로 전달하기 위해 다음 사항을 고려한 개인별 직업재활 계획을\n  수립하여 실시하여야 한다.\n (1) 초기면접, 직업 사정 및 평가 결과를 반영한 개인별 고용계획서\n (2) 장애 특성에 맞는 적절한 배려나 보조공학\n (3) 장애인의 건강이나 안전을 위협할 수 있는 요인\n (4) 직무기능향상이나 재활서비스를 위한 관리계획\n\n나) 개인별 직업재활계획은 장애인이 충분히 이해할 수 있는 내용과 방법으로\n  제공되어야 하고 확인되어야 한다.\n\n다) 근로장애인의 고용상황이나 서비스 과정에 대한 기록은 유지되고 자체적으로\n  관리되어야 한다."}, {"p": 426, "t": " 4) 생계급여비 신청\n\n   장애인 근로사업장에서 근로하는 재가 근로장애인이 국민기초생활보장제도\n   생계급여대상에 해당하는 경우 생계급여를 받아야 한다.\n\n 5) 인력배치 및 조직\n\n   장애인 근로사업장 종사자 배치기준에 따라 인력을 배치하고 개별 시설의\n   특성을 고려하여 장애인 직업재활의 효과를 극대화할 수 있도록 조직체계\n   구성(안)을 참고하여 인력을 융통성 있게 운용할 수 있다. 다만, 장애인의 적정\n   보호를 위해 아래의 사항은 반드시 준수하여야 한다.\n  가) 생산 및 판매관리기사와 직업훈련교사는 장애인이 최적의 상태에서 직업\n        재활서비스를 받을 수 있도록 배치되어야 하며, 특히 직업훈련교사는 반드시\n        배치하여야 한다.\n\n  나) 시·도지사 및 시장·군수·구청장은 장애인 근로사업장의 특수성을 감안하여\n        운전기사, 상품 디자이너 등의 소요인력을 배치하도록 노력하여야 한다.\n\n                 [ 장애인근로사업장 조직체계 구성(안) ]\n\n                           시 설 장\n\n\n                           사무국장\n\n\n        총 무 부             직업재활부              생산·판매관리부\n\n  - 인사･재무･회계처리       - 사회적응훈련              - 하청수주 개발\n  - 시설관리             - 직업능력평가              - 생산일정관리\n  - 기숙장애인 지원         - 취업 및 사후지도           - 생산품 품질관리\n  - 기타 행정지원          - 전환고용 및 지원고용 등       - 생산품판로개척 등"}, {"p": 427, "t": "                                   Ⅱ. 장애인근로사업장 운영\n\n\n6) 급여체계\n\n가) 근로장애인의 근로활동 유지를 위해 직업능력에 따른 적정 임금을 제공하기\n  위한 노력을 하여야 한다.\n - 근로장애인의 임금은 객관적인 기준에 근거하여 지급되어야 한다.\n\n나) 근로계약을 체결한 근로장애인에 대해서는 「최저임금법」에 따라 원칙적으로\n  최저임금 이상을 지급하여야 한다.\n - 다만, 근로능력이 현저히 떨어지는 근로장애인에 대해서는 「최저임금법」 제7조에\n  따라 고용노동부 장관의 인가를 받아 최저임금 미만의 급여를 지급할 수 있다.\n  ※ 단, 이 경우라도 임금수준은 「최저임금법」 제6조에 의거, 종전보다 낮은 수준의 임금을 지급\n    하여서는 아니됨.(원칙적으로 월 임금을 기준으로 함)\n\n - 재활프로그램을 운영할 경우, 근로계약서상 근로시간과 재활프로그램 훈련                   제4장\n\n  시간을 구분 기재하여 혼선이 없도록 한다(훈련시간은 임금지급 대상으로\n  보지 않음)\n다) 근로장애인의 급여는 근로장애인의 개인별 통장으로 지급되어야 하고, 본인의\n  동의 없이 타인이 임의로 인출할 수 없다.\n라) 근로장애인에 대해서는 관계 법령에 따라 사회보험(건강보험, 국민연금,\n  고용보험, 산재보험)가입과 퇴직금 및 제반수당을 지급하여야 한다.\n\n  ※ 단, 개별법 등에 따라 사회보험 가입대상이 아닌 경우는 예외\n\n마) 기타 근로장애인의 임금관리와 관련하여서는 ｢근로기준법｣을 준수하여야 한다.\n\n7) 보호작업장으로의 변경\n\n가) 당해 연도 근로장애인의 개인별 평균임금을 확인한 결과, 시설 설치·운영\n  1년이 경과한 이후에도 근로장애인의 급여기준을 충족시키지 못하는 장애인\n  근로사업장에 대하여는 다음년도부터 장애인 보호작업장으로 변경 신고\n  하도록 지도하고 관리운영비도 장애인보호작업장 기준으로 지원할 수 있다.\n  ※ 동 조사를 위하여 장애인 근로사업장은 근로장애인의 계좌에 입금한 증빙자료를 보관하고\n    있어야 한다."}, {"p": 428, "t": " 나) 근로장애인 수 등 운영현황을 확인하여 6개월간 지속적으로 최소인원(30인\n    이상)을 충족하지 못하는 경우, 「장애인복지법」 제59조의 규정에 의하여\n    장애인 보호작업장으로 변경신고 하도록 지도할 수 있다.\n\n 8) 훈련수당\n\n 장애인 직업재활시설은 소속 훈련장애인에게 훈련수당을 지급할 수 있고, 지방\n 자치단체는 예산의 범위 내에서 이를 지원할 수 있다\n\n\n다. 운영실적 보고\n\n 1) 장애인 근로사업장 운영책임자는 [별지 제1호 서식]에 의거, 운영실적을\n   시장·군수·구청장에게 매 반기말 익월 10일까지 보고하여야 한다.\n\n   - 작업활동 프로그램을 운영할 경우 [별지 제2호 서식]에 의거 함께 보고\n\n 2) 시장·군수·구청장은 보고실적을 종합하여 매 반기말 익월 20일까지 시·도지\n   사에게 보고하여야 한다.\n\n 3) 시·도지사는 장애인 근로사업장 운영실적보고서를 [별지 제1호 서식]에 따라\n   작성하여 상반기 실적은 반기말 익월 30일까지, 당해 연도 실적은 상반기\n   실적에 하반기 실적을 합산하여 다음 연도 1월말 까지 보건복지부장관에게\n   제출하여야 한다.\n\n 4) 「사회복지사업법」 제6조의2 규정 및 관련 시스템 개선에 따라 ’17년 운영\n   실적(’18년 보고)부터는 사회서비스정보시스템(희망이음)을 통해 온라인으로\n   보고하여야 한다."}, {"p": 429, "t": "                                                      Ⅱ. 장애인근로사업장 운영\n\n\n[별지 제1호 서식]\n\n                    장애인 근로사업장 운영실적 보고서\n 시설명：                                     시설신고번호：\n 시설장：\n                               ○○반기(또는 연도)\n1. 생산실적\n                                                                       (단위：천원)\n                생산품 현황                                     매출현황\n                              중증장애인             매출액                운영수익금\n            주생산품    주생산품외\n 주생산품                         생산품시설\n            생산방식    모든생산품                  반기         누계          반기    누계\n                              지정 여부\n\n\n* 운영수익금은 “총판매액에서 원자재값과 생산판매 과정의 제 경비(정부보조금 제외)를 제외한 금액”을 기재\n\n2. 임금지급실적                                                                        제4장\n                                                      월평균임금 분포(명)\n                  1인당   1인당   1인당   최저\n   이익금 임 금                                     10만원 30만원 50만원 70만원\n                   평균   평균    월평균   임금                                     100    장\n구분 총 액 총 액                                10만원 ~ 30 ~ 50 ~ 70 ~ 100\n                   임금   시급     근로   이상                                     만원\n   (천원) (천원)                               미만   만원   만원   만원   만원\n                 (천원/월) (원)    시간   (명)                                    이상\n                                                미만   미만   미만   미만\n 계\n※ 근로장애인 중 최저임금 이상인 자의 수는 2026년 최저임금 시급 10,320원을 적용하여 산출\n3. 근로장애인 장애종별･등급별 현황\n                                                                        (단위：명)    운\n        계            지적장애인     지체장애인      정신장애인 자폐성장애인 시각장애인           기 타\n            장애정도가 기   장애정도가 기   장애정도가 기   장애정도가   장애정도가 기   장애정도가   장애정도가 기\n  기준    계           계         계         계       계         계       계\n            심한장애인 타   심한장애인 타   심한장애인 타   심한장애인   심한장애인 타   심한장애인   심한장애인 타\n 등급별\n 총합\n 재가\n 장애인\n 기숙사\n 이용\n수 급 자\n최저임금\n 이상\n 남 자\n 여 자\n※ 기준항의 ‘계’ 안에는 해당 열의 합계를 기재, 장애명 및 등급은 복지카드에 의하여 기재\n※ 재가장애인은 출퇴근 장애인을, 기숙사 이용 장애인은 시설 내에서 주거서비스를 받는 장애인을 의미"}, {"p": 430, "t": "4. 직업재활 실적보고\n\n 1) 직업상담 및 평가(실/연인원)\n\n                     직업상담                                                    직업평가\n\n                       /                                                      /\n\n\n 2) 직무개발 및 일반고용 전이(실/연인원)\n\n                                                                                  직무분석    업체개발\n서비스의뢰           취업알선       지원고용           취업        시설전이         취업후지도\n                                                                                   (건)     (건)\n\n   /             /              /         /          /               /\n\n\n 3) 재활프로그램 등 세부 내용\n\n    총 계                             사회적응훈련                                   직무기능향상훈련\n  (실/연 인원)             실/연인원                   회/건               실/연인원                   회/건\n\n        /                   /                                            /\n\n\n                                                         직무개발 및 경쟁적인 고용시장으로의\n                작업태도 및 기술훈련\n                                                              전이를 위한 조치\n       실/연 인원                       회/건                  실/연인원                       회/건\n\n            /                                                /\n\n\n 4) 부모상담 및 교육\n\n       계                   상        담                    교       육                   회       의\n   (실/연 인원)            실인원          연인원         회        실인원             연인원             회\n\n        /\n\n※ 운영실적 보고서 양식은 변경될 수 있으며, 변경 시 별도 시달할 수 있습니다."}, {"p": 431, "t": "                                                Ⅱ. 장애인근로사업장 운영\n\n\n[별지 제2호 서식]\n\n\n                  작업활동 프로그램 운영실적 보고서\n 시설명：\n 시설신고번호 :\n 시설장：\n                            ○○반기(또는 연도)\n1. 훈련수당 지급실적\n                                          월평균 수당 분포(명)\n         수당        1인당\n 구분      총액       평균수당     3만원   3만원~   5만원~   10만원~ 15만원~          30만원\n                                                           20만원~\n        (천원)      (천원/월)         5만원    10만원   15만원 20만원\n                            미만                             30만원      이상\n                                  미만     미만     미만    미만\n\n 계                                                                          제4장\n\n\n2. 훈련대상자 장애종별･등급별 현황\n                                                                   (단위：명)    직\n        계         지적장애인    지체장애인    정신장애인 자폐성장애인 시각장애인             기 타       업\n             장애      장애     장애       장애    장애     장애    장애\n            정도가 기   정도가 기   정도가 기   정도가   정도가 기   정도가   정도가 기\n 기 준    계         계       계       계     계       계     계\n             심한 타    심한 타   심한 타     심한    심한 타   심한    심한 타\n            장애인     장애인     장애인     장애인   장애인     장애인   장애인\n등급별총합\n\n\n재가장애인\n\n 기숙사\n  이용\n\n 수급자\n\n\n 남 자\n\n\n 여 자\n\n※ 기준항의 ‘계’ 안에는 해당 열의 합계를 기재, 장애명 및 등급은 복지카드에 의하여 기재\n※ 재가장애인은 출퇴근 장애인을, 기숙사 이용 장애인은 시설 내에서 주거서비스를 받는 장애인을 의미"}, {"p": 432, "t": "3. 작업활동 프로그램\n\n\n 1) 프로그램 세부 내용\n\n 총      계     일상생활 및 가사생활 훈련              사회적응훈련                  작 업 훈 련\n (실 / 연인원)    실 / 연인원      회 / 건    실 / 연인원       회 / 건       실 / 연인원       회 / 건\n\n\n        직 업 평 가                    통 근 훈 련                 취미 및 여가활동\n 실 / 연인원       회 / 건        실 / 연인원       회 / 건         실 / 연인원        회 / 건\n\n\n 2) 부모상담 및 교육\n\n      계                상    담             교         육              회        의\n  (실 / 연인원)       실인원       연인원       회       실인원       연인원             회\n\n\n 3) 훈련장애인 프로그램 종료 현황\n\n     중도탈락                  전환고용               취업                  시설 전이\n\n\n※ 운영실적 보고서 양식은 변경될 수 있으며, 변경 시 별도 시달할 수 있습니다."}]}, {"title": "Ⅲ. 장애인보호작업장 운영", "start": 433, "end": 441, "subs": [], "pages": [{"p": 433, "t": "                              Ⅲ. 장애인보호작업장 운영\n\n\n    Ⅲ     장애인보호작업장 운영\n\n\n1   목적\n\n 직업능력이 낮은 장애인에게 직업적응능력향상, 직무기능향상훈련 등 훈련기회를\n 제공하고, 보호고용환경에서 근로의 기회를 제공하여 이에 상응하는 유상 임금을\n 지급하며, 장애인근로사업장이나 그 밖의 경쟁적인 고용시장으로 옮겨갈 수\n 있도록 돕는 역할을 하는데 있다.\n\n2 기본방침\n 장애인 보호작업장은 장애인거주시설, 장애인복지관 등과 분리하여 하나의\n 단독시설로서 기능하도록 하며, 「장애인복지법 시행규칙」에서 정한 역할과\n 기능을 수행한다.\n3 시설 및 운영 기준\n\n\n가. 시설 기준\n\n1) 설비기준(「장애인복지법 시행규칙」 제42조)\n\n가) 최소설비 기준은 부대시설을 포함하여 90제곱미터 이상이어야 한다.\n\n나) 작업실이나 작업활동 프로그램실의 면적은 기계설비를 제외하고 1인당\n    2제곱미터 이상이어야 한다.\n\n다) 부대시설은 운영업종 및 시설의 용도를 고려하여 적합한 곳에 설치하여야\n    한다."}, {"p": 434, "t": " 2) 구성기준\n\n 가) 근로장애인의 최소인원은 10명으로 한다.\n   ※ 재정지원 장애인일자리 참여자로 전환된 근로장애인은 근로장애인 현원에 포함하여 관리한다.\n\n 나) 근로장애인 선정\n\n  의료, 직업능력, 심리, 교육평가 등의 결과와 초기면접의 정보들을 토대로\n  전문가들이 참여한 위원회에서 적격 여부를 평가한 결과 당장 경쟁적인 고용\n  시장이나 장애인 근로사업장에서 생산능력을 발휘하기 어려운 장애인을 선정한다.\n   ※ 특수학교 재학생 등 시설의 목적사업에 전적으로 종사할 수 없는 장애인은 선정하지 않는다.\n     다만, 특수학교 또는 전공과 졸업을 앞둔 예정자가 조기 취업 형태로 시설에 상근할 수 있는 경우는\n     선정할 수 있음\n\n 다) 근로장애인 비율\n\n  (1) 작업공정 등을 고려하여 심한 장애인과 심하지 않은 장애인을 적재적소에\n        배치하되 근로장애인 중 80% 이상을 장애인복지법 시행규칙 [별표 1]의\n        규정에 의한 장애의 정도가 심한 장애인으로 고용하여야 한다.\n\n  (2) 작업이나 서비스 과정상 장애인이 아닌 자를 고용하여야 할 필요가 있는\n        경우 그 인원은 현재 근로인원 수의 30%를 초과할 수 없다.(단, 법정 배치\n        직원은 별도로 함)\n\n 라) 장애인 거주시설과 동일한 법인이 운영하는 장애인 보호작업장\n\n  (1) 장애인 거주시설에서 생활하는 장애인 외의 이용장애인이 50% 이상 유지\n        되도록 한다.\n\n  (2) 법인이 장애인 직업재활시설만 운영할 시 특별한 사유가 없는 경우, 특정\n        장애인거주시설의 장애인이 50퍼센트 이상을 넘지 않도록 한다.\n\n  (3) 공동생활가정 등을 통해 출퇴근하는 장애인은 재가 장애인으로 본다."}, {"p": 435, "t": "                               Ⅲ. 장애인보호작업장 운영\n\n\n나. 운영 기준\n\n1) 중증장애인의 고용기회 확대 및 직무참여 강화\n\n가) 장애인 보호작업장은 더 많은 중증장애인에게 직업생활의 기회와 적정 수준의\n  처우를 제공할 수 있도록 시설의 수익성 개선을 위해 노력하여야 한다.\n\n나) 장애인 보호작업장은 장애인이 생산·서비스 과정에서 소외되지 않도록 적합한\n  품목 및 직종을 선정 운영하여야 한다.\n  (1) 지역 특성 등 주변 여건과의 적합성, 생산품 판로개척의 용이성, 직업재활의\n    효과성 및 일반고용과의 연계 가능성 등을 고려하여 선정해야 한다.\n  (2) 장애 유형이 다양화됨에 따라 장애 특성에 맞는 업종을 개발하도록 노력\n    하여야 한다.                                             제4장\n  (3) 장애인이 종사할 수 있는 업종은 생산 및 가공 등 2차 산업 외에도 축산,\n    원예 등 1차 산업 및 IT산업, 서비스산업 등 3차 산업을 포괄한다.              애\n2) 보호고용\n 시설은 근로장애인이 보호된 작업환경에서 근로할 수 있도록 지원하여야 하며,\n 근로계약 체결 내용에 따라 근로에 상응하는 유상임금을 지급한다.\n3) 개인별 직업재활계획 수립\n\n가) 근로장애인의 욕구와 능력을 이해하고 이들에게 필요한 서비스와 프로그램을\n  효과적으로 전달하기 위해 다음 사항을 고려한 개인별 직업재활 계획을\n  수립하여 실시하여야 한다.\n (1) 초기 면접, 직업사정 및 평가결과를 반영한 개인별 고용계획서\n (2) 장애특성에 맞는 적절한 배려나 보조공학\n (3) 장애인의 건강이나 안전을 위협할 수 있는 요인\n (4) 직무기능향상이나 재활서비스를 위한 관리계획"}, {"p": 436, "t": " 나) 개인별 직업재활계획은 장애인이 충분히 이해할 수 있는 내용과 방법으로\n    제공되어야 하고 확인되어야 한다.\n\n 다) 근로장애인의 고용상황이나 서비스과정에 대한 기록은 유지되고 자체적으로\n    관리되어야 한다.\n\n 라) 근로장애인의 개인별 자활계획을 수립하여 직업 전 훈련, 직업적응훈련,\n    고용상담 및 직업평가를 실시하여야 한다.\n\n 마) 근로장애인이 작업공정을 잘 이해하고 작업기술을 익힐 수 있도록 작업에\n    대한 직무분석을 실시하여야 한다.\n\n\n 4) 재활프로그램(「장애인복지법 시행규칙」 제42조, 별표 5 Ⅵ. 장애인 직업재활시설\n   설치·운영기준 13.사업)\n\n  재활사업을 실시하기 위해서는 사업계획과 예산을 수립한 후 지방자치단체장의\n  승인을 받아 시행하여야 한다.\n\n <근로장애인>\n\n 가) 장애인 보호작업장의 재활프로그램은 장애인의 유형, 장애 정도, 연령별\n    특성과 현재 수행 중인 업종의 특성을 반영하여 계획을 수립하여야 하며,\n    그 계획에는 근로사업장과 같은 상위 단계 직업재활시설 또는 일반고용으로의\n    전환을 위한 내용이 포함되어야 한다.\n\n 나) 근로장애인의 재활프로그램은 아래의 내용으로 주 8시간 이상 실시하여야\n    한다.\n\n 다) 프로그램 내용\n  (1) 직업적응훈련：일상생활훈련, 사회적응훈련, 작업 태도 및 기술훈련\n  (2) 문제해결훈련：의사소통 기술훈련, 문제해결훈련, 대인관계능력 향상\n        훈련, 위급 혹은 응급상황 대비훈련, 자기옹호 및 주장훈련\n  (3) 직업평가：작업표본평가 및 현장평가"}, {"p": 437, "t": "                                  Ⅲ. 장애인보호작업장 운영\n\n\n (4) 직무기능 향상훈련：직무분석에 따른 직무변경, 개조, 보조공학 개입에\n   따른 훈련\n (5) 지역사회 자원활용훈련：지역사회 적응훈련\n\n\n<훈련장애인>\n\n 장애인 보호작업장은 훈련장애인이 일정 기간 훈련을 통하여 향후 근로장애인\n 으로 전환될 수 있도록 작업활동 프로그램을 실시하여야 한다.\n  ※ 장애인직업재활시설 운영(공통)의 11. 작업활동 프로그램 운영 참조\n\n\n5) 생계급여비 신청\n\n장애인 보호사업장에서 근로하는 재가 근로장애인이 기초생활보장제도 생계                     제4장\n\n급여대상에 해당하는 경우 생계급여를 받아야 한다.\n6) 작업환경 개선 노력\n시설장은 이용장애인이 훈련을 받거나 작업을 함에 있어서 재해를 입지 않도록\n작업환경을 개선하고 안전조치를 강구하는데 최선을 다해야 한다.\n7) 신규 시설설치에 따른 고려사항\n\n지방자치단체장은 신규 장애인 보호작업장의 설치신고 수리 시 직업적응훈련\n및 생산활동(제조･서비스 등), 직업알선 등을 수행하기 위한 공간과 장비･설비,\n프로그램 등이 사업계획서에 반영되었는지 확인하여야 한다.\n\n\n8) 급여지급\n\n가) 근로장애인의 근로활동 유지를 위해 직업능력에 따른 적정 임금을 제공하기\n  위한 노력을 하여야 한다.\n\n - 근로장애인의 임금은 객관적인 기준에 근거하여 지급되어야 한다."}, {"p": 438, "t": " 나) 근로계약을 체결한 근로장애인에 대해서는 「최저임금법」에 따라 원칙적으로\n    최저임금 이상을 지급하여야 한다.\n  - 다만, 근로능력이 현저히 떨어지는 근로장애인에 대해서는 「최저임금법」 제7조에\n    따라 고용노동부 장관의 인가를 받아 최저임금 미만의 급여를 지급할 수 있다.\n   ※ 단, 이 경우라도 임금수준은 「최저임금법」 제6조에 의거 종전보다 낮은 수준의 임금을 지급\n     하여서는 아니됨(원칙적으로 월 급여를 기준으로 함)\n\n  - 재활프로그램을 운영할 경우, 근로계약서상 근로시간과 재활프로그램 훈련\n    시간을 구분 기재하여 혼선이 없도록 한다(훈련시간은 임금지급 대상으로\n    보지 않음)\n\n 다) 근로장애인의 임금은 직무수행능력에 따라 차등 지급할 수 있으며, 객관적인\n    기준에 근거하여 지급하여야 한다.\n\n 라) 근로장애인의 급여 지급은 근로장애인 개인별 통장으로 지급되어야 하고,\n    본인의 동의 없이 타인이 임의로 인출할 수 없다.\n\n 마) 근로장애인에 대해서는 관계 법령에 따라 사회보험(건강보험, 국민연금,\n    고용보험, 산재보험) 가입과 퇴직금 및 제반 수당을 지급하여야 한다.\n   ※ 단, 개별법 등에 따라 사회보험 가입대상이 아닌 경우 예외\n\n 바) 기타 근로장애인의 임금 관리와 관련하여서는｢근로기준법｣을 준수하여야 한다.\n\n\n 9) 보호작업장 운영 지도·관리\n\n 가) 장애인 보호작업장이 운영 실태 확인 결과, 독립시설로서의 설치·운영기준을\n    충족시키지 못하거나, 6개월 동안 지속적으로 근로장애인 최소인원(10인\n    이상)을 충족하지 못하는 경우, ｢장애인복지법｣ 제62조의 규정에 의하여\n    시설개선 명령, 사업의 정지, 시설 폐쇄 등의 조치를 취할 수 있다.\n    ※ 동 조사를 위하여 장애인보호작업장은 근로장애인의 계좌에 입금한 증빙자료를 보관하고\n        있어야 한다."}, {"p": 439, "t": "                                    Ⅲ. 장애인보호작업장 운영\n\n\n나) 근로 인원, 임금 수준, 경영상태 등이 양호하여 근로사업장 수준의 직업재활\n  서비스를 제공하고 있는 보호작업장에 대해서는 중장기적으로 근로사업장\n  으로 전환할 수 있도록 적극 지원하여야 한다.\n  ※ 근로사업장에도 훈련장애인을 둘 수 있음\n\n다) 장기적인 사업성 악화, 현저히 낮은 생산성 등으로 근로장애인 고용유지 및\n  임금 지급 등에 어려움이 지속 발생하는 시설로서 개선 가능성이 낮은 보호\n  작업장에 대해서는 중장기적으로 직업적응 훈련시설로 옮겨갈 수 있도록\n  지원할 수 있다.\n  ※ (예) 1인당 연 매출액 및 월평균 임금 등이 보호작업장 평균의 30%에도 미치지 못하여 근로\n   장애인을 유지하기 어려운 상황이 수년간 지속되고 개선의 가능성 또한 희박한 시설 등\n\n10) 훈련수당\n 장애인 직업재활시설은 소속 훈련장애인에게 훈련수당을 지급할 수 있고,\n 지방자치단체는 예산의 범위 내에서 이를 지원할 수 있다.\n다. 운영실적 보고\n1) 장애인보호작업장 운영책임자는 [별지 제3호 서식]에 의거, 운영실적을 시장･\n  군수･구청장에게 매 반기말 익월 10일까지 보고하여야 한다.\n  - 작업활동 프로그램을 운영할 경우 [별지 제2호 서식]에 의거 함께 보고\n2) 시장･군수･구청장은 보고실적을 종합하여 매 반기말 익월 20일까지 시･도지사\n  에게 보고하여야 한다.\n3) 시·도지사는 장애인 보호작업장 운영실적보고서를 [별지 제3호 서식]에 따라\n  작성하여 상반기 실적은 반기말 익월 30일까지, 당해 연도 실적은 상반기\n  실적에 하반기 실적을 합산하여 다음 연도 1월말 까지 보건복지부장관에게\n  제출하여야 한다.\n4) 「사회복지사업법」 제6조의2 규정 및 관련 시스템 개선에 따라 ’17년 운영실적\n  (’18년 보고)부터는 사회서비스정보시스템(희망이음)을 통해 온라인으로 보고\n  하여야 한다."}, {"p": 440, "t": "[별지 제3호 서식]\n\n                    장애인 보호작업장 운영실적 보고서\n 시설명：                                       시설신고번호：\n 시설장：\n                                ○○반기(또는 연도)\n1. 생산실적\n                                                                         (단위：천원)\n               생산품 현황                                       매출현황\n                                중증장애인            매출액                운영수익금\n             주생산품     주생산품외\n 주생산품                           생산품시설\n             생산방식     모든생산품                 반기         누계          반기       누계\n                                지정 여부\n\n* 운영수익금은 “총판매액에서 원자재값과 생산판매 과정의 제 경비(정부보조금 제외)를 제외한 금액”을 기재\n\n2. 임금지급실적\n                    1인당 1인당     1인당   최저               월평균임금 분포(명)\n       이익금 임 금\n                     평균   평균    월평균   임금          10만원 30만원 50만원 70만원           100\n구분     총 액 총 액                              10만원\n                     임금   시급     근로   이상         ~ 30만원 ~ 50만원 ~ 70만원 ~ 100만원   만원\n       (천원) (천원)                             미만\n                   (천원/월) (원)    시간   (명)          미만     미만     미만      미만     이상\n 계\n※ 근로장애인 중 최저임금 이상인 자의 수는 2026년 최저임금 시급 10,320원을 적용하여 산출\n\n3. 근로장애인 장애종별･등급별 현황\n                                                                            (단위：명)\n         계       지적장애인   지체장애인 정신장애인 자폐성장애인 시각장애인     기 타\n           장애      장애     장애       장애    장애      장애    장애\n          정도가 기   정도가 기   정도가 기   정도가   정도가 기   정도가   정도가 기\n 기 준    계       계       계       계     계       계     계\n           심한 타    심한 타   심한 타     심한    심한 타    심한    심한 타\n          장애인     장애인     장애인     장애인   장애인     장애인   장애인\n 등급별\n  총합\n  재가\n 장애인\n 기숙사\n  이용\n수 급 자\n최저임금\n  이상\n 남 자\n 여 자\n※ 기준항의 ‘계’ 안에는 해당 열의 합계를 기재, 장애명 및 등급은 복지카드에 의하여 기재\n※ 재가장애인은 출퇴근 장애인을, 기숙사 이용 장애인은 시설 내에서 주거서비스를 받는 장애인을 의미"}, {"p": 441, "t": "                                                           Ⅲ. 장애인보호작업장 운영\n\n\n4. 직업재활 실적보고\n\n 1) 직업상담 및 평가(실/연인원)\n\n                  직업상담                                         직업평가\n\n                   /                                             /\n\n\n 2) 직무개발 및 일반고용 전이(실/연인원)\n\n                                                                     직무분석    업체개발\n서비스의뢰       취업알선       지원고용       취업          시설전이     취업후지도\n                                                                      (건)     (건)\n\n   /          /          /          /          /           /\n\n\n 3) 재활프로그램 등 세부 내용\n    총 계                      직업적응훈련                             문제해결훈련\n  (실/연 인원)         실/연인원                회/건              실/연인원              회/건          직\n       /\n           직업평가                   직무기능 향상훈련                     지역사회 자원활용훈련              영\n 실/연 인원           회/건         실/연 인원           회/건             실/연인원         회/건\n\n\n 4) 부모상담 및 교육\n\n       계                상     담                    교   육                회       의\n   (실/연 인원)        실인원        연인원        회         실인원         연인원          회\n\n\n※ 운영실적 보고서 양식은 변경될 수 있으며, 변경 시 별도 시달할 수 있습니다."}]}, {"title": "Ⅳ. 장애인직업적응훈련시설 운영", "start": 442, "end": 451, "subs": [], "pages": [{"p": 442, "t": "     Ⅳ    장애인직업적응훈련시설 운영\n\n\n 1   목적\n\n 작업능력이 극히 낮은 장애인에게 작업활동, 일상생활훈련 등을 제공하여 기초\n 작업능력을 습득시키고, 작업평가 및 사회적응훈련 등을 실시하여 장애인 보호\n 작업장 또는 장애인 근로사업장이나 그 밖의 경쟁적인 고용시장으로 옮겨갈 수\n 있도록 돕는 역할을 하는데 있다.\n\n\n 2 기본방침\n\n ○ 장애인 직업적응훈련시설은 장애의 정도가 심한장애인, 특히 발달장애인에게\n     일상생활훈련, 사회적응 및 직업적응훈련 등 재활프로그램 및 훈련 중심의\n     역할을 담당하여야 한다.\n\n ○ 장애인 직업적응훈련시설은 장애인거주시설, 장애인복지관 등과 분리하여\n     하나의 단독시설로서 기능하도록 하며, 「장애인복지법 시행규칙」에서 정한\n     장애인 직업적응훈련시설로서의 기능과 역할을 정립하도록 지원한다.\n\n\n 3 시설 및 운영 기준\n\n가. 시설 기준\n\n 1) 설비기준(「장애인복지법 시행규칙」 제42조)\n\n 가) 최소설비 기준은 부대시설을 포함하여 90제곱미터 이상이어야 한다."}, {"p": 443, "t": "                           Ⅳ. 장애인직업적응훈련시설 운영\n\n\n나) 훈련실의 면적은 기계설비를 제외하고 1인당 2제곱미터 이상이어야 한다.\n\n다) 부대시설은 직업적응훈련의 내용, 재활프로그램 및 장애 유형을 고려하여\n  적합한 곳에 설치하여야 한다.\n\n\n2) 구성 기준\n\n가) 훈련장애인의 최소인원은 20명 이상으로 한다.\n\n나) 훈련장애인은 「장애인복지법 시행규칙」 [별표 1]의 규정에 의한 장애의 정도가\n  심한 장애인을 대상으로 하되, 그 중 「발달장애인의 권리보장 및 지원에 관한\n  법률」 제2조제1호에 따른 발달장애인이 80% 이상 유지되도록 하여야 한다.\n다) 재가장애인 비율 및 제외 대상\n (1) 장애인 거주시설과 동일한 법인이 운영하는 장애인 직업적응훈련시설은\n   장애인 거주시설에서 생활하는 장애인 외의 훈련장애인이 50% 이상 유지              직\n   되도록 하고, 장애인 거주시설 내 입소장애인의 경우 공동생활가정 등을\n   통해 사회에 복귀하도록 하여 장애인 직업적응훈련시설이 사회통합적 차원\n   으로 장애인 고용이 이루어질 수 있도록 하여야 한다.\n\n (2) 법인이 장애인 직업재활시설만 운영할 시 특별한 사유가 없는 경우, 특정\n   장애인거주시설의 장애인이 50퍼센트 이상을 넘지 않도록 한다.\n\n라) 시설 이용 적격 대상\n  의료, 직업, 심리, 교육 평가 등의 결과와 초기면접의 정보들을 토대로 전문가\n  들이 참여한 위원회에서 적격 여부를 평가한 결과 당장 장애인 보호작업장이나\n  장애인 근로사업장에서 생산능력을 발휘하기 어려운 장애인을 선정한다."}, {"p": 444, "t": "나. 운영 기준\n\n 1) 개인별 직업재활계획 수립\n\n 가) 장애인의 욕구와 능력을 이해하고 이들에게 필요한 서비스와 프로그램을\n    효과적으로 전달하기 위해 다음 사항을 고려한 개인별 직업재활계획을 수립\n    하여 실시하여야 한다.\n\n  (1) 초기 면접, 직업사정 및 평가결과를 반영한 개인별 직업재활계획\n\n  (2) 장애특성에 맞는 적절한 배려나 보조공학\n\n  (3) 장애인의 건강이나 안전을 위협할 수 있는 요인\n\n  (4) 직무기능향상이나 재활서비스를 위한 관리계획\n\n 나) 개인별 직업재활계획은 장애인이 충분히 이해할 수 있는 내용과 방법으로\n    제공되어야 하고 확인되어야 한다.\n\n 2) 훈련 프로그램 운영\n\n 가) 사업계획·예산 수립\n   시설장이 재활사업을 실시하기 위해서는 사업계획과 예산을 수립한 후 지방\n   자치단체장의 승인을 받아 시행하여야 한다.\n\n 나) 교육·훈련\n   시설은 훈련장애인의 사회통합을 위하여 장애인의 유형별·연령별 특성 등을\n   고려한 재활사업을 지속적으로 개발 실시하여야 하며 이들이 사회에 적응할 수\n   있도록 지도하여야 한다.\n\n 다) 운영 목적\n   프로그램 운영 목적은 훈련장애인 개인의 유지 및 발달, 일상생활훈련, 대인\n   관계훈련, 이동기술, 여가 등 사회적 수행에 필요한 기능을 훈련하는데 있다."}, {"p": 445, "t": "                           Ⅳ. 장애인직업적응훈련시설 운영\n\n\n라) 운영 내용\n 시설은 훈련장애인이 장애인 보호작업장 또는 장애인 근로사업장이나 그 밖의\n 경쟁적인 고용시장으로 옮겨갈 수 있도록 주당 30시간 이상 아래의 내용으로\n 훈련을 실시하여야 한다.\n\n(1) 재활기능 기초훈련(「장애인복지법 시행규칙」 제42조)\n  훈련장애인의 자립과 독립생활에 필요한 기초기능을 개인 상태에 맞추어 습득\n  시키기 위하여 아래와 같은 내용으로 개별훈련계획에 따라 실시하여야 한다.\n\n  - 기초적 생활 기능：식사, 화장실 이용, 위생관리, 옷입기 등\n\n  - 건강관리 기능：기초 영양 섭취, 일상의약품 사용, 자기 투약 관리, 응급 시\n   처치, 치아보철관리, 보조기구 관리 및 사용 등\n  - 의사소통기능：언어개발 및 용어 사용, 상황에 따른 의사표시 방법, 전화기\n   사용 등\n  - 대인 및 사회기능：상호협조, 책임, 동성 및 이성관계에 따른 행동, 연령과\n   사회규범에 따른 행동 등\n  - 고용 및 작업준비 기능：직업전 평가, 직업의 목적과 가치, 필요성 교육 등           시\n  - 이동기능：교통수단 이용, 지리적 위치 및 방향 알기 등\n\n  - 시간 관리 기능：시간 계획 짜기, 계획에 따른 시간 관리, 공동체 내에서\n   개인적 시간 관리, 여가시간 관리 등\n\n  - 개인별 재정관리 기능：개인 비용의 효율적 사용, 비상금의 용도 및 사용,\n   개인적 필요경비 등\n\n  - 생활학습 기능：필요한 대화 및 사람에 대한 주의력 습득, 수/시간/장소\n   등과 관련된 기억 능력 훈련, 일상 활동 구분, 변별 및 연합훈련 등\n\n  - 운동 및 지각 기능：균형잡기 훈련, 대·소근육 기능훈련 등"}, {"p": 446, "t": "  (2) 직업기초기능훈련(「장애인복지법 시행규칙」 제42조)\n   훈련장애인이 사회적·경제적으로 자립할 수 있도록 장애인의 직업적응과\n   준비, 직업적응 지도를 위하여 다음과 같은 훈련을 실시하여야 한다.\n    - 노동관련 프로그램：개인의 욕구에 대해 전반적인 접근(사회적, 심리적,\n        신체적, 학문적 접근)\n    - 직무수행：자립기능(의복착탈, 용의 단정), 개인 및 대인관계 행동(정서,\n        타인지향 행동, 동기유발), 정보처리(시각, 청각, 촉각, 언어이해), 학습 및\n        대안 전략(단어기억, 교수기법, 반응의 일반화와 대안행동), 직업적 기능\n        (시간, 운동 협응, 변별과 분류, 수 기능, 조립 기능) 등\n    - 보상기능훈련：대리감각의 개발로써, 감각운동, 학습준비, 언어 및 행동\n        적응훈련 등\n    - 직업훈련：구체적인 직업기술 개발\n  (3) 직업생활을 가능하게 하기 위한 기초훈련, 즉 직업태도, 직업 및 안전수칙에\n     대한 이해, 대인관계, 일상생활 습관과 작업 습관을 몸에 익히기 위한 훈련을\n     실시하여야 한다.\n    - 직업에 대해 인식·탐색하기\n    - 직업의 기초적인 이론과 실기를 훈련하기\n    - 직장에서의 적절한 대인관계를 형성하기\n    - 적절한 작업태도를 몸에 익히기\n    - 직업인으로서 체력을 단련하기\n    - 기본적인 작업수행 능력을 몸에 익히기\n    - 직업세계와 사회생활에서 직업·사회인으로서 갖추어야 할 인성 및 사회성을\n        형성하기\n    - 취업을 위한 직장의 규칙을 이해·습득하기\n  (4) 이 외에도 직업생활과 연계된 직업적응훈련을 통해 훈련장애인의 작업\n        기능을 향상시킬 수 있다."}, {"p": 447, "t": "                            Ⅳ. 장애인직업적응훈련시설 운영\n\n\n마) 운영 과정\n 훈련 프로그램을 효과적으로 실시하기 위해 아래의 과정을 거쳐야 한다.\n\n (1) 개인별 적응훈련계획 수립：직업상담 및 직업평가를 통해 설정된 개별\n   재활계획서를 토대로 직업적응훈련계획을 수립. 당사자와 가족과의 상담,\n   관찰평가 등을 토대로 목표를 구체화하고 실시방법을 모색\n\n (2) 훈련 과정 설치 및 실시：훈련 과정은 ‘라) 프로그램 운영 내용’에 따라 시설\n   훈련장애인의 장애유형 및 기관의 특성을 고려하여 자율적으로 설정하되\n   1일 기준 4시간 이상, 단위시간은 45분 이내로 실시\n\n (3) 훈련 결과 평가：훈련 중에는 중간평가를 실시하고 훈련 종결 시에는 종결\n   평가를 실시하며, 훈련장애인에 대한 평가와 훈련 프로그램에 대한 평가를\n   구분하여 실시\n\n (4) 서비스 전이：훈련 이후 평가에 따라 보호 고용, 지원고용, 경쟁 고용 등            장\n   다양한 형태의 고용서비스와 적응 지도를 실시하여야 하며, 고용으로 연결\n   되지 않을 경우 지속적인 훈련서비스를 제공\n3) 생계급여비 신청\n장애인 직업적응훈련시설의 재가 훈련장애인이 국민기초생활보장제도 생계급여\n대상에 해당하는 경우 생계급여를 받아야 한다.\n\n\n4) 훈련수당 지급\n\n장애인 직업적응훈련시설은 소속 훈련장애인에게 훈련수당을 지급할 수 있고,\n지방자치단체는 예산의 범위 내에서 이를 지원할 수 있다."}, {"p": 448, "t": " 5) 직업적응훈련시설 운영 지도·관리\n\n 가) 직업적응훈련시설 운영지원에 적정을 기하기 위하여 훈련장애인 수 등 운영\n    현황을 확인한 결과, 독립시설로서의 설치·운영기준을 충족시키지 못하거나,\n    6개월 동안 지속적으로 훈련장애인 최소인원(20인 이상)을 충족하지 못하는\n    경우, ｢장애인복지법｣ 제62조의 규정에 의하여 시설개선 명령, 사업의 정지,\n    시설 폐쇄 등의 조치를 취할 수 있다.\n  - 동 조사를 위하여 장애인 직업적응훈련시설은 관련 장부를 보관하여야 한다.\n   ※ 장애인 직업재활시설 운영(공통)의 9. 장애인 직업재활시설의 재무회계 관리 및 장부비치 참조\n\n 나) 신고 수리권자인 시장·군수·구청장은 시설 설치 운영자가 「장애인복지법」\n   제59조에 의거 기존 장애인 보호작업장을 장애인 직업적응훈련시설로 변\n   경하려는 경우, 당해 시설 근로장애인에게 미치는 영향(근로장애인에서 훈\n   련장애인으로의 지위 변화 등)에 대한 대책, 해당 지역 내 장애인 직업재활시\n   설 분포 등을 종합적으로 검토하여 수리 여부를 결정하여야 한다.\n\n\n다. 운영실적 보고\n\n 1) 장애인 직업적응훈련시설 운영책임자는 [별지 제4호 서식]에 의거, 운영실적을\n   시장･군수･구청장에게 매반기말 익월 10일까지 보고하여야 한다.\n\n 2) 시장･군수･구청장은 보고실적을 종합하여 매 반기말 익월 20일까지 시･도지사에\n   게 보고하여야 한다.\n\n 3) 시·도지사는 장애인 직업적응훈련시설 운영실적보고서를 [별지 제4호 서식]에\n   따라 작성하여 상반기 실적은 반기말 익월 30일까지, 당해 연도 실적은 상반기\n   실적에 하반기 실적을 합산하여 다음 연도 1월말 까지 보건복지부장관에게\n   제출하여야 한다.\n\n 4) 「사회복지사업법」 제6조의2 규정 및 관련 시스템 개선에 따라 ’17년 운영실적\n   (’18년 보고)부터는 사회서비스정보시스템(희망이음)을 통해 온라인으로 보고\n   하여야 한다."}, {"p": 449, "t": "                                          Ⅳ. 장애인직업적응훈련시설 운영\n\n\n[별지 제4호 서식]\n\n\n               장애인 직업적응훈련시설 운영실적 보고서\n 시설명：                             시설신고번호：\n 시설장：\n                          ○○반기(또는 연도)\n\n1. 훈련수당 지급실적\n\n                                      월평균임금 분포(명)\n         수당      1인당\n 구분      총액     평균수당           3만원~ 5만원~ 10만원~ 15만원~\n                         3만원                         20만원~ 30만원\n        (천원)    (천원/월)         5만원 10만원 15만원 20만원\n                         미만                          30만원   이상\n                                미만   미만   미만    미만\n\n 계\n\n\n2. 훈련대상자 장애종별·등급별 현황\n                                                              (단위：명)\n       계         지적장애인   지체장애인    정신장애인    자폐성장애인   시각장애인   기 타         직\n         장애       장애     장애       장애    장애      장애    장애\n         정도가 기   정도가 기   정도가 기   정도가   정도가 기   정도가   정도가 기              활\n 기 준   계       계       계       계     계       계     계\n         심한 타     심한 타   심한 타     심한    심한 타    심한    심한 타\n         장애인     장애인     장애인     장애인   장애인     장애인   장애인\n 등급별\n  총합\n\n  재가\n 장애인\n\n 기숙사\n  이용\n\n 수급자\n\n 남 자\n\n 여 자\n\n※ 기준항의 ‘계’ 안에는 해당 열의 합계를 기재, 장애명 및 등급은 복지카드에 의하여 기재\n※ 재가장애인은 출퇴근 장애인을, 기숙사 이용 장애인은 시설 내에서 주거서비스를 받는 장애인을 의미"}, {"p": 450, "t": "3. 직업재활실적보고\n\n\n 1) 직업상담 및 평가(실/연인원)\n\n                  직업상담                                    직업평가\n\n                    /                                       /\n\n\n※ 동 기관에서 제공할 수 없는 상담 및 직업평가를 제공하기 위해 타 장애인복지관이나 장애인직업재활시설에\n  의뢰한 경우\n\n\n 2) 직무개발 및 일반고용 전이(실/연인원)\n\n                                                                직무분석    업체개발\n서비스의뢰        취업알선       지원고용      취업    시설전이     취업후지도\n                                                                 (건)     (건)\n\n   /          /           /        /      /           /\n\n\n 3) 재활기능 기초훈련\n\n     총 계                 기초적 생활기능         건강관리 기능                 의사소통기능\n   (실/연 인원)             실/연인원     회/건   실/연인원     회/건           실/연인원    회/건\n\n         /\n\n\n  대인 및 사회기능             고용 및 작업준비 기능          이동 기능               시간관리 기능\n 실/연인원       회/건        실/연인원     회/건   실/연인원     회/건           실/연인원    회/건\n\n\n   개인별 재정관리 기능                     생활학습 기능                  운동 및 지각 기능\n  실/연인원            회/건          실/연인원     회/건             실/연인원         회/건"}, {"p": 451, "t": "                                               Ⅳ. 장애인직업적응훈련시설 운영\n\n\n 4) 직업기초기능훈련\n\n    총 계                  노동관련 프로그램                        직무수행\n  (실/연 인원)       실/연인원           회/건              실/연인원              회/건\n\n     /\n\n\n              보상기능 훈련                                직업훈련\n    실/연 인원                회/건              실/연인원                 회/건\n\n\n 5) 기타 훈련실시 상황\n\n   훈련영역              훈련내용                 훈련기간              훈련대상자                제4장\n\n\n※ 훈련과정이 다른 경우 훈련과정별 기재\n 6) 부모상담 및 교육\n       계             상     담               교     육               회       의        운\n   (실/연 인원)      실인원       연인원       회      실인원      연인원             회            영\n\n\n 7) 취업자 현황\n\n   구분         일반고용        장애인 보호작업장      장애인 근로사업장    재정지원일자리            기타\n 알선/연계\n   확정\n 시설로 복귀\n\n※ 알선/연계 인원은 ‘확정’ 인원과 ‘시설로 복귀’의 총합과 동일해야 함.\n※ 운영실적 보고서 양식은 변경될 수 있으며, 변경 시 별도 시달할 수 있습니다."}]}, {"title": "Ⅴ. 장애인직업재활시설 기능보강", "start": 452, "end": 500, "subs": [], "pages": [{"p": 452, "t": "     Ⅴ    장애인직업재활시설 기능보강\n\n\n 1   목적\n\n ○ 장애인 직업재활시설 이용장애인의 안전과 편의를 보장하고 직업생활 및\n     직업훈련에 필요한 인프라를 지원함.\n\n\n 2 근거법령\n\n ○ 「장애인복지법」 제21조(직업), 제57조(장애인복지시설의 이용 등), 제79조\n     (비용부담), 제81조(비용 보조) 및 같은 법 시행령 제44조(비용 보조)\n\n ○ 「보조금 관리에 관한 법령」, 「지방자치단체 보조금 관리에 관한 법령」, 「국고\n     보조금 통합관리지침」, 「보건복지부소관 국고보조금 관리규정」, 「보조사업\n     정산보고서 작성지침」, 「보조사업 정산보고서 검증지침」, 「보조사업자 정보\n     공시 세부기준」, 「보조사업자 회계감사 세부기준」 등\n\n\n 3 지원대상 및 지원조건\n\n ○ 지원대상：장애인 직업재활시설(장애인생산품 판매시설 포함) 및 시설 신축\n     등을 계획 중인 사업자(지방자치단체 포함)\n\n ○ 지원조건：국비 50%, 지방비 50%(필요시 지방비 추가 지원 가능)\n\n\n 4 지원방향\n\n ○ 장애인 고용 확대, 임금 향상 및 시설 소방 등 안전에 기여하는 사업 우선 고려\n\n ○ 산발성, 임시방편을 지양하고 사업의 효과성과 시급성을 고려하여 지원\n\n ○ 지원받은 기능보강사업의 집행실적이 저조한 시설은 지원 대상에서 배제"}, {"p": 453, "t": "                               Ⅴ. 장애인직업재활시설 기능보강\n\n\n5 지원분야 및 예산\n\n                지원분야                   2026년 예산(국비)\n\n                        신축\n 장애인 직업재활시설 및           증축\n 장애인생산품 판매시설                             7,997백만원\n    기능보강사업              개보수\n\n                       장비보강\n\n\n6 사업내용\n\n가. 정의                                                       제4장\n\n\n○ 신축：건축물이 없는 대지(기존 건축물이 해체되거나 멸실된 대지를 포함)에\n  시설을 새로이 축조하거나, 장애인 직업재활시설이 아닌 기존 건축물을 증축\n  또는 개보수하여 신규 시설을 설치하는 것\n  ※ 기존 건축물 증개축시 지원단가는 당초 신축사업 지원기준보다 감액될 수 있음\n  ※ 기존 시설이 인근 대지에 별도 건물을 확충하여 짓는 것은 증축으로 봄\n○ 증개축：기존 시설이 있는 대지에 건축물의 면적, 층수 또는 높이를 늘리거나,\n  기존 건축물의 일부를 철거하고 그 대지에 종전과 같은 규모의 범위에서\n  건축물을 다시 축조하는 것\n\n○ 개보수：건축물의 노후화 억제 및 기능향상 등을 위해 시설 건물의 내･외부를\n  수선 또는 변경하는 것\n\n○ 장비보강：직업재활을 위한 생산활동 등에 필요한 장비를 확충하는 것"}, {"p": 454, "t": "나. 국비 지원단가 (천원 미만 절사)\n\n                           보호작업장·직업적응\n 구분        근로사업장                                        비고\n                              훈련시설\n         1,164.9㎡(최대) ×      518.1㎡(최대) ×    ∙ 시설의 전부 신축은 시설당 1회만 지원\n 신축\n        1,790,000원 × 50%   1,790,000원× 50%   ∙ 토지구입비는 지원하지 않음\n           363㎡(최대) ×         297㎡(최대) ×\n 증축                                          ∙ 토지구입비는 지원하지 않음\n        1,790,000원× 50%    1,790,000원× 50%\n                                             ∙ 시설안전 등 긴급성 및 생산품 관련 특수성이\n          231㎡(최대) ×         130㎡(최대) ×        인정될 경우 실 소요단가 적용 가능\n개보수\n        897,000원 × 50%     897,000원 × 50%    ∙ 자가건물에 한하여 지원\n                                               (임차건물은 지원대상 아님)\n 장비               35,000,000원 ×              ∙ 시설안전 등 긴급성 및 생산품 관련 특수성이\n 보강                  50% 내외                    인정될 경우 실 소요단가 적용 가능\n※ 잔여예산 등에 대해 실시하는 추가지원 사업의 경우 지원 대상 및 범위, 단가 등을 달리 적용할 수 있음.\n\n\n다. 지원기간 ： 단년도 사업\n\n라. 지원대상 시설 선정시 고려사항\n\n 1) 공통사항\n\n 가) 건축물 준공연도, 기능보강 지원 추진계획을 고려하여 우선순위 선정\n\n  - 시설별 형평성을 고려하고 시설관리에 따른 도덕적 해이 방지\n\n  - 최근 3년간 기능보강사업비 지원내용·규모 및 향후 추진계획\n\n 나) 시설 여건 및 환경변화에 따른 사업의 시급성 고려\n\n  - 시설 노후 정도(전기·소방 안전점검 및 안전진단서 확인 등), 이용장애인 증\n      가 여부, 시설기능변화 및 용도변경 등\n\n 다) 사업금액의 적절성：도면 및 내역서 확인, 시장 조사(표준품셈), 타 직업재활\n      시설과의 사업 중복성 등 고려\n\n 라) 이용장애인의 직무분석을 통한 업무 배치 계획서(직무분석과 무관한 기능\n      보강사업은 제외)"}, {"p": 455, "t": "                                     Ⅴ. 장애인직업재활시설 기능보강\n\n\n마) 동일 시설에서 여러 분야(신축, 증축, 개보수, 장비보강)에 신청하였을 경우,\n     최종 선정 시 타 시설과의 형평성 등을 고려하여 우선순위 조정 가능\n\n바) 시설 신·증축 및 개보수 등을 위한 보조사업 장소가 법인 및 보조사업자의\n     소유임을 증명할 수 있는 부동산등기분등본 등 관계 증빙서류 확인\n  * 임차 등 소유권을 증명할 수 없는 사항은 불가\n  * 신축, 증개축, 옥외시설 개보수: 토지 및 건축물 소유권 필요\n  * 건축물 단순 개보수 및 건축물 내부에 설치하는 장비보강: 건축물 소유권\n\n2) 우선고려\n\n가) 지진･태풍･집중호우 등 자연재해 및 화재와 같은 재난 대비 예방(안전) 및\n     피해복구사업\n나) 시설유지를 위해 관련 제법규(「건축법」, 「소방시설법」, 「장애인등편의법」,\n     「사회복지사업법」 등 사회복지시설 관련 법령) 요건을 확보하기 위한 사업\n3) 지원분야별 고려사항\n구분                           검 토 사 항\n      ∙ 시설 신축의 필요성(지역 사회 내 장애인 수 및 유형, 기존 장애인 직업재활시설 분포 현황,       활\n        인원 및 시설 규모의 적절성, 장애인 출·퇴근 등 접근의 용이성 등)\n      ∙ 사업추진의 현실성(신축 부지의 용도 및 건축 가능 여부, 사업 기간 내 사업완료 가능 여부,       운\n        지자체 건축 부서 등 관련 인허가 부서의 의견 및 담당자 현장점검 실시 여부, 법인･시설의        영\n        자부담 및 사업 계획의 구체성(외부컨설팅 수행 여부 및 내용 포함 등))\n      ∙ 근로장애인 배치 기준 이행계획(최소인원, 근로장애인 비율, 재가장애인 비율 준수 등)\n신축    ∙ 부지가 보조사업자(법인 또는 시설)의 소유임을 확인할 수 있는 등기부등본, 토지대장\n      ∙ 최소 설비기준, BF인증 및 장애인편의시설 설치 등 관련 기준 충족 확인을 위한 도면\n      ∙ 설치지역 민원 발생 가능성 조사 여부 및 조치계획\n      ∙ 법령상 근로장애인 배치기준, 직종의 근로장애인과의 부합 여부 및 임금 지급계획 수립 여부\n      ∙ 생산품목에 대한 사전 시장조사, 판로 확보 실태(공공기관, 민간기업 등)\n      ∙ 시설 종사자 등 적정 운영 인력 규모 산정 여부 및 생산품 전문가 활용 계획\n      ∙ 신축 이후 생산품 관련 필요 장비 및 설비 계획\n      ∙ 시설 증개축의 필요성(현재 시설의 규모, 생산 품목 및 사업량, 이용장애인･직원현황, 근로장애인의\n        증가 및 공간 부족 실태 등 검토)\n증개축\n      ∙ 부지가 보조사업자(법인 또는 시설)의 소유임을 확인할 수 있는 등기부등본, 토지대장\n      ∙ 향후 증개축을 통해 달성하게 될 사업 효과성 및 구체성 검토"}, {"p": 456, "t": " 구분                           검 토 사 항\n        ∙ 사업 확장이나 추가 설비 도입 및 업종 변경 등을 위한 증축 기능보강 신청 시 국고보조사업\n          수행계획서에 동 사업으로 기대되는 장애인 고용확대, 임금수준 향상, 매출 증대 효과 등을\n          수치와 통계 등으로 구체적 명시 여부\n        ∙ BF인증 및 장애인편의시설 설치 등 관련 기준 충족 확인을 위한 도면\n        ∙ HACCP, LOHAS, KC 등 생산품 관련 인증을 위한 추가 공간확보 필요성\n        ∙ 노후시설 개선, 소방･안전 등 안전 확보 등의 목적에 부합하는지 여부\n        ∙ 시설안전진단 결과 보수대상 시설(전기, 승강기, 소방, 구조 등)\n 개보수    ∙ HACCP, LOHAS, KC 등 생산품 관련 인증을 위한 보수\n        ∙ 장애인 편의시설 설치 및 보완\n        ∙ 기존 시설이 보조사업자의 소유임을 확인할 수 있는 등기부등본\n        ∙ 차량교체의 경우 내용연수 경과 후 아래 요건 충족시 우선지원\n          - 주행거리 120,000km이상 노후차량\n          - 예상 수리비가 현재 차량가격의 50%를 초과하는 차량\n        ∙ 그 외 장비의 경우 장비명, 소요량, 사업비 및 사용용도, 배치공간 확보여부, 장비운용 전문가\n 장비       확보계획, 매출 수익 및 근로장애인 임금 증대 등 향후 효과성 검토\n 보강     ∙ 사업 확장, 추가 설비 도입 및 업종 변경 등을 위한 기능보강 신청시 국고보조사업 수행계획서에\n          동 사업으로 기대되는 장애인 고용확대, 임금수준 향상, 매출 증대 효과 등을 수치와 통계\n          등으로 구체적 명시 여부\n        ∙ 장비 노후 등 교체를 목적으로 지원된 사업은 사업 신청서 제출시 기존 장비의 처분 계획을\n          포함하여 신청\n\n\n마. 사업계획서 작성 시 유의사항\n\n 1) 시 기준면적은 건물 뿐 아니라 비닐하우스, 축사 등 생산품목에 따른 소요\n   공간 면적도 포함하여 산정한다.\n\n 2) 장비보강사업의 경우 해당 장비 시운전 목적의 원부자재비에 한해 사업비에\n   포함할 수 있다.\n\n 3) 사업수행기관은 신청한 보조금 외에도 최대한 재원을 확보하여 사업비를\n   분담하려는 노력을 기울여야 한다.\n\n 4) 새로운 사업을 수행하는 기관은 전문기관이 발생한 분석보고서 또는 시장\n   조사서, 해당 사업 관련 유관 기관 등의 평가서나 분석보고서 등을 포함하도록\n   노력해야 한다."}, {"p": 457, "t": "                                       Ⅴ. 장애인직업재활시설 기능보강\n\n\n7    지원 대상 선정기준 및 지원배제 항목\n\n가. 지원 대상 선정기준\n1) 지원대상 선정 시 지원순위 하향 대상\n\n가) 기능보강 사업 확정된 후 천재지변 등과 같은 특별한 사유 없이 사업을\n     중도에 포기한 경우 사업을 포기한 다음 해를 포함하여 4년간 기능보강 국비\n     지원순위 하향(단, 장비보강 사업연도를 포함하여 3년간 생산 또는 판매실적\n     없는 경우 사업을 포기한 것으로 간주)\n    * (예시1) ’27년 사업선정 전 ’26년 사업포기 → ’27~’30년 제외\n\n    * (예시2) ’27년 사업선정 후 ’26년 사업포기 → ’27년 사업선정 취소(후순위사업 대체 선정),\n     ’27~ ’30년 제외                                                  제4장\n\n나) 기능보강 사업이 천재지변 등과 같은 특별한 사유 없이 이월이 될 경우\n     이월된 사업 다음해를 포함하여 3년(일부이월) 또는 4년(전액이월)간 기능\n     보강 국비 지원순위 하향\n    * (예시1) ’25년 사업을 ’26년으로 일부 이월, ’26년도 사업 종료 이후 → ’27~’29년 제외     활\n    * (예시2) ’25년 사업을 ’26년으로 전액 이월, ’26년도 사업 종료 이후 → ’27~’30년 제외     설\n다) 기능보강사업 사업 종료 후 천재지변·화재 등과 같은 특별한 사유 없이 품목별\n\n    내용연수 도과 전 매각한 경우, 시설이 그 재산을 무단으로 매각한 사실을\n    행정청이 인지한 날의 다음해부터 3년간 기능보강 국비 지원 순위 하향(단,\n    사업선정 된 경우에는 사업 취소 후 후순위사업으로 선정)\n    * 단, 「행정기본법」 제23조에 따라 위반행위가 종료된 날로부터 5년이 지나면 제재처분 불가\n     (예시1) ’25년 무단 매각, ‘26년 행정청이 해당 사실을 인지 → ’27~’29년 제외 가능\n     (예시2) ’22년 무단 매각, ’26년 행정청이 해당 사실을 인지 → ‘27년 제외 가능\n\n라) 장애인 직업재활･훈련 또는 적응훈련 등을 위한 생산 품목･서비스 유형별\n    안전 수칙이 없을 경우(단, 신규･교체 등 완료 후 1개월 이내로 작성 후 지자체로\n    보고한 경우는 제외) 기능보강 국비 지원 순위 하향"}, {"p": 458, "t": " 마) 장애인 직업재활시설 기능보강 사업 추진과정에서 다음과 같은 사유가 있는\n   경우 다음연도부터 3년간 기능보강 국비 지원 순위 하향(단, 사업 선정된\n   경우에는 사업 취소 후 후순위사업으로 선정)\n\n  (1) 「보조금 관리에 관한 법률」 (이하 「보조금법」) 등 관계 법령의 규정, 보조금\n        교부 조건 또는 법령에 의한 보건복지부장관의 처분을 위반한 경우\n\n  (2) 거짓이나 그 밖에 부정한 방법으로 보조금의 교부를 받은 경우\n\n  (3) 보조금을 지급목적과 다른 용도로 사용한 사실이 확인되거나 「보조금법」\n        제33조에 따라 보조금의 전부 또는 일부의 반환명령을 받은 경우(반환금을\n        분납하는 경우 분납 시작시를 기준으로 함)\n\n  (4) 보조금을 지급받기 위한 요건을 갖추지 못하고 보조금을 지급받아 「보조금법」\n        제33조에 따라 보조금의 전부 또는 일부의 반환명령을 받은 경우\n\n  (5) 보고된 사업비 등 사업집행 실적보고가 허위인 경우\n\n  (6) 보조금 교부 결정 이후 불가항력적인 사유 없이 사업 수행에 착수하지\n        않거나, 사업기한 내에 완료하지 못할 것이 명백하다고 인정되는 등의\n        사유로 인해 사업을 수행할 수 없는 경우\n\n  (7) 기능보강사업 추진과정에서 사업계획 변경 신청 등 승인 절차 등을 미준수 할\n    경우(단, 사업선정 된 경우에는 사업 취소 후 후순위사업으로 선정)\n\n  (8) 사업수행기관 또는 보조금을 지원받고자 하는 법인, 시설 등 당사자 외\n        제3자로부터 부정청탁이 있는 경우\n\n  (9) 「중증장애인생산품 우선구매 특별법」에 따라 생산시설로 지정받은 직업\n        재활시설이 우선구매 법령과 규정을 위반했거나 생산시설로서 사회적으로\n        물의를 빚은 경우(행정처분 포함)\n\n  (10) 그 밖에 기능보강사업의 추진과정에서 부적절한 보조금의 집행이 있다고\n        판단되거나 국고지원 목적에 반하는 중대한 사유가 있는 경우"}, {"p": 459, "t": "                                    Ⅴ. 장애인직업재활시설 기능보강\n\n\n바) 최근 3년간 장애인 대상 범죄 발생·학대, 성폭력·성희롱 사건이 발생하여\n  장애인권익옹호기관으로부터 학대판정, 수사기관의 수사 등으로 사회적으로\n  문제가 된 시설 또는 이를 은폐한 시설, 행정처분 받은 시설은 기능보강 국비\n  지원 순위 하향\n\n사) 기능보강사업 지원순위 하향 시설에 해당되는 경우에도 ʻʻ국가·지자체 안전\n  대진단(보수보강) 또는 국토안전관리원에서 실시하는 소규모 취약시설(미흡\n  또는 불량) 안전 점검 결과ʼʼ 또는 ｢시설물의 안전 및 유지관리에 관한 특별법｣\n  상의 정기안전점검, 정밀안전점검, 정밀안전진단 등의 보고서를 첨부한\n  시설에 대해서는 심사를 통해 지원 할 수 있음\n\n\n나. 지원 배제 항목\n\n1) 직업재활시설 본래 목적 외 부가적 기능 수행을 위한 예산\n가) 지역주민 대상 체육시설, 문화시설 등 기능보강\n나) 일반 소모성 비품, 일반 사무용 PC, 사무용 집기\n2) 중요재산 표준 내용연수(당해연도 예산 및 기금운용계획 집행지침)가 경과되지 않은\n\n 설비･장비의 교체\n\n                  구 분\n                                                내용연수\n     분 류                  대 상\n               철근콘크리트조 건축물 또는 강구조건축물             50년\n     부동산\n                        그 외의 건축물                 35년\n                         선박, 항공기                 30년\n     고가 동산\n                           차량                    20년\n   (5천만원 이상)\n                        그 외 기계류 등                15년\n    기타 동산         위 대상에 포함되지 않는 동산          조달청 내용연수 + 5년\n\n  * 부동산 중 토지는 내용연수 적용을 받지 아니한다."}, {"p": 460, "t": "   ** 내용연수 미도래 장비라도 화재 등의 특별한 사유를 소명하는 경우 반영 가능\n  *** 기능보강사업을 통해 신규 장비(차량 등)를 지원받더라도, 내용 연수내 기존 장비(노후차량 등)를\n     시설 임의로 매각･처분 불가\n  **** 차량의 경우, 주행거리 20만km를 초과하여 운행한 차량의 경우 1년, 30만km를 초과하여\n     운행한 차량의 경우 2년을 단축하여 내용연수 기간을 산정할 수 있음\n\n\n 3) 신규 설치 시설의 임차료\n\n 4) 관련 제법규의 위반 우려가 있는 사업(불법 건축물 등)\n\n 5) 부지매입비, 설계비, 감리비 등 제반수수료\n\n 6) 장비(차량 등)의 취·등록세, 보험료, 탁송료 등의 제반수수료\n\n\n다. 지원대상 평가 시 가점\n\n 1) 중증장애인생산품 우선구매 법정 비율 준수(시·군·구)\n\n 2) 장애인 직업재활시설(판매시설 포함) 각종 요구자료 제출 및 기한 준수(시·도, 시·군·구)\n\n   * 상･하반기 운영실적, 하·동절기 안전점검, 장애인·노인·아동학대 범죄경력, 지자체 정산자료 제출\n\n 3) 기능보강 사업의 실집행율 현황(시·도, 시·군·구)\n\n 4) 기능보강 사업 신청시 지자체별 우선순위 부여에 따른 상위순위\n\n 5) 장애인 직업재활시설 근로장애인의 임금수준(최저임금 지급 여부 등)\n\n 6) 기능보강 사업을 통해 추진하고자 하는 사업에 대한 전문기관 분석보고서, 시장조사서,\n  평가서나 분석보고서 등 제출 시\n\n   ※ 1)~6)에 따른 가점을 부여하되, 선정계획 수립에 따라 항목에 따른 가점 비율 등을 별도로 정함"}, {"p": 461, "t": "                                   Ⅴ. 장애인직업재활시설 기능보강\n\n\n8 국고보조금 신청 등\n\n가. 국고보조금의 신청 및 교부\n\n  ※ <별지 제1호 서식> 국고보조금 교부신청서\n\n  ※ <별지 제2호(신축 등), 제5호(장비), 제7호(임차료) 서식> 국고보조사업 수행계획서\n\n1) 사업수행기관은 보건복지부에서 통보한 보조금 예산의 확정 통지에 근거하여 예산교부\n 신청서와 첨부서류를 시·군·구에 제출함\n\n  ※ 단, 신·증축 등 연차적 사업이 예상되는 경우는 매년 실집행 가능 범위에서 교부하여 계속 사업\n\n2) 시·군·구는 사업수행기관이 제출한 자료를 검토 후 시·도로 제출하고, 시·도는 제출된\n 자료를 조정하여 보건복지부에 국고보조금 교부를 신청함                                  제4장\n\n가) 사업수행기관이 동일 사업에 대해 보건복지부 외 타 기관(사회복지공동모금회\n   등) 또는 민간 지원사업 등을 통해 중복 지원받는지 여부를 면밀히 검토\n - 중복 신청이 발견될 경우 해당 사업(중복 부분)의 취소를 보건복지부에 보고\n나) 교부신청서 점검표의 수행자에 맞게 점검하고 누락사항이 없는지 확인(점검\n   일은 시·도에서 최종 점검한 날짜로 기재)\n다) 교부신청서, 의견서, 수행계획서의 제출자나 수령자 명의는 사업수행기관에서\n   시·군·구, 시·도, 보건복지부로 제출하는 과정마다 각각의 관계자로 수정 제출\n\n라) 첨부 사업계획서는 보건복지부에서 최종 승인한 수정사업계획이어야 함\n - 시·도 승인사항의 경우는 보건복지부에 최종 결과보고한 수정사업계획이어야 함\n\n마) 보건복지부에서 사업계획에 대한 수정·보완 요구가 없는 경우는 기 신청\n   사업계획서를 첨부함\n\n바) 시설사업 교부신청시 지방자치단체 기본설계 검토의견서를 첨부하여야 함\n   (배치도, 평면도 포함)\n\n3) 보건복지부는 제출 자료 검토 후 보조금 교부"}, {"p": 462, "t": "나. 국고보조금의 반환 및 선정 취소\n\n 보건복지부장관은 다음의 경우 선정을 취소하고 보조금의 반환을 명할 수 있음\n\n 1) 보조금을 지급 목적과 다른 용도로 사용한 경우\n\n 2) 법령의 규정, 보조금 교부결정의 내용 또는 법령에 의한 보건복지부장관의\n   처분을 위반한 경우\n\n 3) 허위신청이나 그 밖에 부정한 방법으로 보조금의 교부를 받은 경우\n\n 4) 계획된 기일을 경과하고도 정당한 이유 없이 사업수행에 착수하지 않거나 사업\n   기한 내에 완료하지 못할 것이 명백하다고 인정되는 등 중대한 사유로 인해\n   사업을 수행할 수 없는 경우\n\n 5) 보고된 사업비 등 사업집행 실적보고가 허위인 경우\n\n 6) 심의 승인되지 않은 사업을 임의로 추진한 경우\n\n 7) 타 기관 또는 후원 등을 통하여 기 승인된 사업을 완료한 경우\n\n 8) 사업계획 전면 변경 등 당초 승인된 사업을 수행하지 못할 경우\n   ※ 단, 천재지변 등 불가피한 사정 및 안전관련 긴급 소요 발생시는 예외로 함\n\n 9) 그 밖에 국고지원 목적에 반하는 중대한 사유가 있는 경우\n\n\n다. 국고보조금의 관리 및 집행\n <e나라도움(국고보조금통합관리시스템) 사용안내>\n\n 1) 정부의 국고보조금 부정수급 종합대책(’14.12.4.)에 의거 모든 민간보조사업자\n   까지 e나라도움 사용 의무화\n  - 다만, 차세대사회보장정보시스템(희망이음)을 사용하는 복지시설은 e나라\n    도움을 직접 사용하지 않고 차세대사회보장정보시스템(희망이음)을 통해 국고\n    보조금 교부, 집행 등을 처리할 수 있음\n   ※ 단, e나라도움을 사용하는 시설은 반드시 차세대사회보장정보시스템(희망이음)을 동시에 사용\n        해야 함(보건복지부 사회서비스자원과-24(’18.1.2.)호)"}, {"p": 463, "t": "                                     Ⅴ. 장애인직업재활시설 기능보강\n\n\n2) 보조사업의 예탁방법 (「보조금법」 시행령 제10조의8)\n가) 지자체가 직접사업을 수행할 경우는 비예치형, 지자체가 민간보조사업자\n   에게 재교부할 경우 예치형*으로 관리할 것\n * (예치형) 보조금교부, 보조사업자의 증빙등록 및 집행요청 등 보조금 전달체계 및 금융거래 전 과정을\n  e나라도움 시스템과 예탁계좌를 통해 수행(예탁계좌(한국재정정보원)로 교부받아 e나라도움을\n  통해 집행·이체 진행(집행등록→이체))\n\n ** e-나라도움(http://www.gosims.go.kr) – e나라도움소개- 매뉴얼 - 사용자매뉴얼 참조\n\n\n<일반사항>\n\n1) 사업수행기관은 교부 받은 국고 및 지방자치단체 보조금, 예산계상시 제출한\n 자부담분을 별도 계정으로 분리하여 관리함(연도별, 지원분야별 분리 관리)\n2) 사업비는 사업계획서의 집행계획에 따라 사업기간 내에 예산을 집행하여야 함\n ※ 신축 또는 증축사업의 경우 사업의 조속한 시행을 위해 설계비 등을 자부담으로 우선 집행할 수            장\n   있음. 단, 사업계획서에 자부담 예산이 반영된 경우로써 지원대상으로 선정되어 보조금 확정              인\n   내시가 된 경우에 한하며, 자부담액 집행 전 관할 시·군·구 또는 시·도와 사전 협의하여야함            직\n3) 예산 신청 시 부담하기로 한 자부담은 보조금보다 우선 집행하여야 함\n4) 보조금의 이월은 허용되지 않으나 부득이한 사유로 이월할 경우에도 2회계\n 연도를 초과하여 이월할 수 없음\n\n\n<집행잔액 및 이자액 관리>\n\n1) 사업수행기관은 보조사업이 완료된 때에는 집행된 보조금을 정산하여 집행\n 잔액, 보조금으로 발생한 이자를 함께 반납해야 함\n\n2) 단, 「보조금 관리에 관한 법률 시행령」 제13조제1항에서 정하는 ‘불가피한\n 사유로 발생한 이자’는 반납대상에서 제외\n\n3) 사업목적을 달성하고 사업이 완료된 경우(모든 승인사업의 지출이 최종 완료된\n  경우)에는 사업계획변경 등을 통해 집행잔액을 사용할 수 없음"}, {"p": 464, "t": " <증빙서류>\n\n 1) 사업비 집행 증빙서류는 세금계산서 등 청구서에 따라 보조금 별도 계정에서\n   직접 집행된 온라인 지급증빙서, 보조사업비 카드 영수증 처리만을 인정\n  - 계약에 의한 사업비 집행의 경우는 계약서 사본 첨부\n\n 2) 다음의 지출증빙서류는 5년간 보관하도록 함. 사업비 사업명세서, 별도 계정의\n   입출금 내역, 사업비 예금이자 발생 및 집행내역서, 관련 증빙자료(세금계산서,\n   영수증) 등\n\n <기타>\n\n 동 지침에서 규정하지 않은 사항은 「보조금 관리에 관한 법률」 등 예산 회계\n 관계법, 「국고보조금 운영관리 지침」, 「국고보조금 통합관리지침」 (이상 재정\n 경제부 소관) 및 「보건복지부소관 국고보조금 관리규정」에 따름\n\n\n 9 사업시행 및 관리절차\n\n가. 사업계획의 변경\n\n 1) 사업계획 변경 승인 대상\n\n 가) 승인받은 사업계획은 변경하지 않는 것을 원칙으로 하되, 불가피한 경우 사업\n    계획 변경승인 신청서를 작성하여 보건복지부장관의 승인을 받아야 함\n\n  - 당초 승인된 사업계획과 직접 연관 없는 내용으로의 변경 승인신청은 접수\n    불가(제출 시 불승인 처리)\n\n  - 아울러, 불가피한 사유를 제외하고 사업기간연장(이월)에 대한 변경 신청도 불가\n   ※ 사업계획 변경 신청은 당해연도 9.30. 보건복지부 접수 분까지 인정\n\n 나) 보건복지부의 승인을 받아야 하는 경우\n\n  (1) 신･증축 사업의 부지 변경"}, {"p": 465, "t": "                                   Ⅴ. 장애인직업재활시설 기능보강\n\n\n (2) 당초 선정사업과 다른 사업내용으로의 변경\n\n   (예시)\n\n   ㅇ 신·증축, 개보수 등：(당초) 지붕방수공사 → (변경) 외벽공사\n     * 동일 사업의 사업량이나 규모 등이 변경되는 경우는 제외\n\n   ㅇ 장비：(당초) 1톤트럭 → (변경) 승합차\n     * 동일 품목 장비의 모델, 사양, 수량 등이 변경되는 경우는 제외\n\n\n다) 시·도 승인을 받아야 하는 경우(시･도지사 승인 후 보건복지부에 결과 보고)\n\n - 위 보건복지부 승인사항 이외의 변경사항\n\n - 변경의 필요성, 타당성 등을 객관적으로 검토하여 승인 여부 결정\n   (예시)\n   ㅇ 자부담 증가에 따른 총사업비 및 사업량의 변경 사업\n   ㅇ 당초 선정사업에서 발생한 낙찰차액 또는 집행잔액 활용 사업 등\n     ※ 낙찰차액 및 집행잔액이 총 사업비의 13%이상이고 국비보조금 차액(잔액)의 총계가\n          20백만원 이상인 경우 반드시 복지부와 협의 후 사용할 것\n     ※ 입찰결과에 따라 차액이 발생한 경우 시설의 소방·안전 및 이용장애인의 안전을 위한 장비         활\n          보강 등에 사용 가능\n  ※ 공통사항：천재지변 등 불가피한 상황 없이 사업목적 전면 변경은 승인 불가 및 사업 취소 사유가 됨      영\n    (8. 국고보조금 신청 등-나. 국고보조금의 반환 및 선정취소 참조)\n\n\n2) 사업계획 변경 절차\n\n ※ <별지 제8호 서식> 사업계획 변경 신청서(신축, 증축, 개보수, 임차료)\n ※ <별지 제9호 서식> 사업계획 변경 신청서(장비보강)\n\n\n가) 보건복지부 장관의 승인이 필요한 경우\n\n (1) 사업계획변경이 있는 사업수행기관은 사업계획 변경 신청서와 관련 첨부\n   서류를 시·군·구에 제출함"}, {"p": 466, "t": "  (2) 시･군･구 및 시･도는 사업수행기관이 제출한 자료를 검토, 조정 후 검토\n        의견을 첨부하여 시･도에서 보건복지부로 사업계획 변경 승인을 신청\n\n  (3) 보건복지부는 검토 후 승인 여부를 시･도에 알림\n\n\n 나) 시･도지사의 승인이 필요한 경우\n\n  (1) 사업계획변경이 있는 사업수행기관은 사업계획 변경 신청서와 관련 첨부\n     서류를 시･군･구에 제출함\n\n  (2) 시･군･구 는 사업수행기관이 제출한 자료를 검토, 조정 후 검토의견을 첨부\n     하여 시･도에 사업계획 변경 승인을 신청\n\n  (3) 시･도는 검토 후 승인 여부를 결정하고 그 결과를 보건복지부에 알림\n   ※ (주의) 시장･군수･구청장은 기능보강 사업 계획변경 승인의 주체가 될 수 없음\n\n\n나. 기능보강지원 사업 관리\n\n 1) 신·증축 및 개보수 관리\n\n - 설계, 착공, 설계의 변경, 준공 등 건축과 관련한 인허가 절차 등이 관련 법령에\n   따라 적시에 이루어질 수 있도록 사업추진 과정 관리\n\n - ｢장애인･노인･임산부 등의 편의증진 보장에 관한 법률｣ 및 ｢소방시설 설치에\n   관한 법률｣에 따라 장애인편의시설 및 소방시설 설치기준 등 준수 관리\n\n - 시공 및 구매계약과 관련하여 ｢사회복지법인 및 사회복지시설 재무회계규칙｣\n   등에 따른 계약의 절차･방법 등을 적용하여 처리할 수 있도록 지도･감독\n\n\n 2) 장비보강 관리\n\n - 시설이 구매한 장비는 시설의 자산대장 등에 등재하여 관리\n  ※ 국고지원사업 장비는 국고지원으로 구매한 장비인지를 확인할 수 있도록 장비별로 관리 라벨 등을\n    붙여 표식토록 함. [별지 제10호 서식] 국고지원 장비 관리 라벨(예시) 참고"}, {"p": 467, "t": "                                Ⅴ. 장애인직업재활시설 기능보강\n\n\n- 신규 구입하는 장비는 반드시 A/S에 관한 계획을 수립하여야 하며, 장비 구매\n  계약 시 계약서에 관련 내용을 분명히 포함시켜야 함(예: 하자보증보험증권,\n  이행보증증권, 제조자의 사후관리각서 요구 등)\n\n\n다. 임차료 지원 부문 관리(’23년 이전 지원사업)\n\n1) 근저당 및 전세권 설정비용, 공인중개사 수수료(임차인 부담분) 등 임차료\n  지원에 소요되는 직접비용은 사업수행기관이 부담함\n\n2) 임대 계약 체결시 보증금에 사업수행기관의 자부담이 포함된 경우에는 임대\n  계약서에 보조금과 자부담 분을 함께 표시하여 공증하며, 자부담은 사업\n  종료시 사업수행기관에게 반환함\n3) 시장･군수･구청장은 임대계약 체결 전에 임차 건물에 대한 근저당권 및 압류\n  등 임차기간 종료 시 보증금 반환 저해요소 여부를 확인하고, 시장･군수･\n  구청장 명의의 근저당 혹은 전세권 설정, 보증보험 등을 통하여 임차료 회수\n  장치를 마련하여야 함\n  ※ 기존 국고보조금으로 임차한 시설에서 계약기간 만료로 계약서를 갱신하는 경우도 해당            시\n  ※ 임대계약 체결 시 사업수행기관에서 사용 중 발생하는 월세 및 원상복구비용 등은 실사용자인        운\n    사업수행기관이 부담하도록 계약에 포함하여 계약 종료시(갱신시 제외) 임차보증금 중 보조금분\n    전액을 시･군･구에 반납하도록 명시\n\n4) 해당 시･군･구는 시･도로, 시･도는 복지부로 임차료 집행현황(별지 제4호)이\n  변동될 때마다 제출할 것\n\n5) 운영주체가 부동산을 매수하는 등의 이유로 임대차 계약이 종료되어, 당초\n  임차료 지원 목적이 달성된 경우, 임차료는 보조비율에 따라 반납"}, {"p": 468, "t": " 10 사업실적 관리절차\n\n가. 사업 모니터링\n\n   ※ 양식 별도 공문 송부\n\n 1) 시･도지사 및 시장･군수･구청장은 기능보강 사업의 연내 완료 및 사업비 집행률\n   제고를 위해 개별 사업의 진도를 매월 정기적으로 파악 관리하여야 한다.\n\n  - 신･증축, 개보수 사업의 경우, 보조금 교부 이전이라도 자부담 사업비를\n    활용해 설계 등을 우선 추진할 수 있도록 관리\n\n  - 사업시행자가 착공 후 선급금 등을 지급할 수 있도록 보조금 조기 교부\n   * 선급금 외 사업 실적별 기성급 등도 적기 교부될 수 있도록 보조금 관리\n\n 2) 시･도지사는 기능보강사업의 분기별 추진실적을 보건복지부로 제출(매 분기\n   다음달 10일까지, 양식 별도공문 송부)\n\n\n나. 실적보고(정산보고)\n\n 시·도지사는 보조사업을 완료한 때에는 보조사업이 당초 목적에 부합되고 효\n 과적으로 수행되었는지를 검토한 후 보조사업 실적보고서를 제출하여야 한다.\n   ※ 실적보고서는 회계연도 종료, 사업완료, 사업폐지 승인시 각각 작성·제출\n\n\n 1) 공통사항(ʼ17년 사업부터 적용)\n\n 가) 지방자치단체를 제외한 사업수행기관에서 보조금 또는 간접보조금 총액이\n    1억원 이상인 보조사업에 대한 실적보고서를 제출하는 경우 검증기관으로\n    부터 정산보고서를 검증받아 정산보고서와 함께 제출하여야 함(「보조금 관리에\n    관한 법률」 제27조, 같은 법 시행령 제12조의 2, 「보조사업 실적보고서 및\n    정산보고서 작성지침」 제9조, 「보건복지부소관 국고보조금 관리규정」 제24조)"}, {"p": 469, "t": "                                 Ⅴ. 장애인직업재활시설 기능보강\n\n\n나) 지방자치단체를 제외한 사업수행기관에서 보조금 총액이 10억원 이상인 보조\n  사업자는 ｢주식회사 등의 외부감사에 관한 법률｣ 제2조제7호 및 제9조에\n  따른 감사인이 해당 회계연도를 기준으로 작성한 감사보고서를 제출하여야 함.\n\n다) 검증기관의 정산보고서 검증방법에 대하여는 ‘보조사업 정산보고서 검증\n   지침’을 적용하며, 기타 자세한 사항은 관련 법령 및 규정을 참고\n\n\n2) 회계연도 종료 시\n\n  ※ 양식 별도 공문 송부\n\n가) 사업수행기관은 회계연도 종료 시 실적보고서를 시･군･구에 제출하여야 하며,\n   시･도는 산하 사업수행기관의 실적보고서를 취합, 검토 후 보건복지부에 제출함\n나) 사업 실적보고서는 매년 회계연도 종료 후 다음해 1월 말까지 보건복지부에\n  제출해야 함\n다) 보건복지부장관은 필요한 경우 별도로 사업실적(정산) 보고를 요청할 수 있음\n3) 사업완료 시\n  ※ <별지 제11호, 제12호 서식> 국고보조사업 완료 실적보고서\n\n가) 사업수행기관은 시설 또는 장비보강사업이 완료된 후 사업완료 실적보고서\n   (별지 제11호 서식)와 관련 서류를 시･군･구에 제출하고, 시･군･구는 사업\n   수행기관이 제출한 자료를 검토 후 시･도로 제출하고, 시･도는 자료 검토 후\n   보건복지부에 사업완료 실적보고서(별지 제12호 서식)를 제출함\n\n나) 사업 완료는 지원 목적을 달성하고 별도 계좌에서 해당 사업비가 마지막으로\n   지출된 시점을 기준으로 함\n\n다) 사업수행기관은 시설물 설치사항 등의 사진을 첨부하고 이를 증명할 수 있는\n  준공 및 기성고 확인필증 등 증빙서류와 시설물에 대한 법인 및 사업수행자의"}, {"p": 470, "t": "    소유 등기부등본 및 임대차계약서 사본을 첨부하여 제출하여야 함. 단,\n    동 목적사업 수행을 위하여 시･도 또는 시･군･구 소유 토지 사용을 허가받아\n    부지를 확보한 경우에는 동 사실 확인서로 이를 갈음할 수 있음(이 경우 해당\n    토지의 사용권이 영구 또는 반영구적일 것)\n   ※ 특히, 장비보강사업 중 노후장비 교체 지원의 경우 사업수행기관에서는 사업 완료 시까지 교체\n     대상 장비를 처분하고 그 결과를 첨부하여 제출해야 함\n\n 라) 잔여사업비는 총 사업비를 기준으로 국비와 지방비 지원 비율에 따라 정산함\n\n 마) 사업 완료 실적보고서는 사업이 완료된 회계연도 종료 후 다음 해 1월 말까지\n    보건복지부에 제출해야 함\n\n 바) 보건복지부는 사업 완료에 따른 실제 사용 및 제반 사항 준수 여부 확인 등을\n    위해 현지조사 및 사후점검을 직접 또는 수행기관을 지정하여 실시할 수 있음\n   ※ ’26년 수행기관: 한국장애인개발원(장애인복지법 제29조의2제3항제7호)\n\n\n 4) 사업폐지 시\n\n - 회계연도 종료 시 실적보고서식 및 절차 준용\n\n\n다. 성과평가\n\n 가) 보건복지부는 국고지원사업의 효율적 관리와 지원에 의한 성과를 관리하기 위해\n    성과지표 등을 수립하여 이전년도 사업수행기관의 성과를 평가·관리할 수 있음\n        ※ 참고(2026년 회계연도 성과지표) : 기능보강지원 직업재활시설 근로장애인 총임금 증가율\n          ([(A-B)/B]×100)\n         * A: 전년도 기능보강대상시설의 당해연도 근로장애인 총임금,\n          B: 전년도 기능보강대상시설의 당해연도 근로장애인 총임금\n\n 나) 보건복지부는 관련 전문성을 가진 기관 또는 단체로 하여금 성과평가지침\n    수립 및 성과평가를 위한 실태조사를 요청할 수 있음\n\n 다) 성과평가 결과는 차기연도 국고지원사업 평가에 반영할 수 있음"}, {"p": 471, "t": "                           Ⅴ. 장애인직업재활시설 기능보강\n\n\n라. 중요재산 관리\n\n1) 중요재산\n\n가) 부동산과 그 종물\n\n (1) 국고보조금으로 신축하여 새로 취득한 경우\n\n (2) 국고보조금으로 증축하여 기존건물의 규모가 확대되고 효용이 증가한 경우\n\n (3) 국고보조금으로 건물을 개보수하여 그 효용이 증가한 경우 (건물의 내･\n   외부 도색, 방수공사, 창호교체 등 단순 개보수 공사와 100㎡ 이하의 소규모\n   개보수 공사는 등록 제외)\n\n나) 그 밖의 국고보조금으로 구입한 단가 5백만원 이상인 장비, 물품\n\n2) 중요재산의 취득가액 등 기준\n가) 기능보강사업의 국고보조금과 지방보조금을 포함한 총액 기준으로 하되,\n  정산 완료된 금액\n나) 기능보강사업이 완료되어 이미 등록된 중요재산은 감정평가액이 있을 경우\n  그 감정평가액의 증감액\n\n3) 중요재산 부기등기\n\n가) 사업수행기관(법인 포함)은 중요재산 중 부동산에 관한 소유권 등기를 할 때에는\n  해당 부동산이 보조금을 지원받아 취득하였다는 사항 등을 표기하는 부기등기\n  (附記登記)를 아래와 같이 해야 하며, 보조금이 지원된 부동산 증명서를 관할\n  등기소에 제출하여야 함(「보조금 관리에 관한 법률」 제35조의2, 「보건복지부\n  소관 국고보조금 관리규정」 제31조)\n\n (1) 해당 부동산은 보조금을 지원받아 취득하였거나 그 효용가치가 증가한\n   재산이라는 사항"}, {"p": 472, "t": "  (2) 보조금 교부 목적과 해당 부동산의 내용연수를 고려하여 중앙관서의 장이\n        정한 기간이 지나지 아니하였음에도 그 부동산을 보조금의 교부 목적에\n        위배되는 용도에 사용, 양도, 교환, 대여 및 담보로 제공하려는 경우에는\n        보건복지부장관의 승인을 받아야 한다는 사항\n     ※ 매각은 양도의 의미에 포함됨\n\n 나) 위의 의무를 위반한 경우, 보조금 교부결정 취소 등의 시정조치를 할 수 있음\n\n 4) 중요재산 처분의 제한(「보조금 관리에 관한 법률」 제35조)\n\n 가) 사업수행기관은 중요재산에 대하여 보조금 교부 목적과 해당 부동산의 내용\n    연수를 고려하여 중앙관서의 장이 정한 기간이 지나지 아니하였음에도 보조금의\n    교부 목적에 위배되는 용도에 사용, 양도(매각 포함), 교환, 대여 및 담보로\n    제공하려는 경우 보건복지부장관의 승인을 받아야 함\n\n  - 단, 사업수행기관이 법인인 경우 보조금의 교부 목적에 위배되는 용도에\n    사용은 보건복지부장관의 승인을 받고, 양도, 교환, 대여 및 담보로 제공\n    하려는 경우는 지방비를 부담한 시･도지사의 승인*을 받아야 함(승인 후\n    보건복지부에 결과 보고)\n   * ｢행정권한의 위임 및 위탁에 관한 규정｣ 제36조제1항제5호\n   ※ 법인이 중요재산을 처분함에 있어서 그 중요재산이 기본재산에 해당하는 경우에는 ｢사회복지\n    사업법｣ 제23조제3항에 규정된 기본재산 처분 승인뿐 아니라 ｢보조금 관리에 관한 법률｣ 제35조의\n    중요재산 처분 승인도 모두 받아야 함(대판 2015다223350)\n\n 나) 처분 시 승인을 받아야 하는 감가상각 내용연수 이내의 자산은 「법인세법」\n    시행령 제28조, 같은 법 시행규칙 제15조의 상한 기준 및 당해연도 「예산\n    및 기금운용계획 집행지침」에 따른다."}, {"p": 473, "t": "                                    Ⅴ. 장애인직업재활시설 기능보강\n\n\n                    구 분\n                                                내용연수\n      분 류                  대 상\n                철근콘크리트조 건축물 또는 강구조건축물            50년\n      부동산\n                       그 외의 건축물                  35년\n                          선박, 항공기                30년\n      고가 동산\n                            차량                   20년\n    (5천만원 이상)\n                      그 외 기계류 등                  15년\n     기타 동산        위 대상에 포함되지 않는 동산          조달청 내용연수 + 5년\n\n  ※ 내용연수가 경과한 중요재산은 관할 시･군･구에 보고하여 매각 등 적절한 조치를 취하고 대금이\n    발생한 경우에는 해당시설의 세입으로 처리 한 후 그 결과를 관할 시･군･구에 보고(예시:\n    기능보강사업으로 ’26년에 노후·신규 차량을 지원받더라도, ’07년에 기능보강으로 지원받은\n    차량을 시설 임의로 매각 또는 처분 불가)\n  * 부동산 중 토지는 내용연수 적용을 받지 아니한다.                                 제4장\n  ** 차량의 경우, 주행거리 20만km를 초과하여 운행한 차량의 경우 1년, 30만km를 초과하여\n     운행한 차량의 경우 2년을 단축하여 내용연수 기간을 산정할 수 있음\n다) 시·도지사는 장애인 직업재활시설을 운영하는 법인에 대한 기본재산 처분\n  허가 시, 해당 재산이 중요재산인지와 보건복지부장관의 처분 승인을 받았\n  는지를 확인하고(양도, 교환, 대여 및 담보로 제공하려는 경우는 지방비를\n  부담한 시·도지사의 승인으로 대체) 기본재산처분 허가를 해야 함\n라) 중앙관서의 장은 보조사업자 또는 간접보조사업자가 해당 보조사업을 완료한\n  후에도 중앙관서의 장의 승인 없이 중요재산에 대하여 「보조금 관리에 관한\n  법률」 제35조 제3항 각 호의 행위를 한 경우에는 다음 각 호의 전부 또는\n  일부에 해당하는 금액의 범위에서 반환을 명할 수 있다.\n\n  1. 중요재산을 취득하기 위하여 사용된 보조금 또는 간접보조금에 해당하는 금액\n\n  2. 중요재산의 효용가치 증가액에 해당하는 금액\n\n  3. 중요재산의 양도, 교환, 대여 또는 담보 제공을 통하여 얻은 재산상의 이익에\n   해당하는 금액"}, {"p": 474, "t": " 5) 중요재산 공시\n\n 가) 중요재산 보고\n\n   ○ (취득보고) 중요재산 취득 후 15일 이내에 해당 중앙관서의 장 또는 지방\n        자치단체의 장에게 보고해야 함\n\n   ○ (변동보고) 중요재산 처분제한기간 이전까지 매년 6월과 12월에 변동현황을\n        보고해야 함\n    * 다만, 변동 사항이 없거나 미미한 경우에는 보고 생략 가능\n\n 나) 보고대상 : 보조사업자 또는 간접보조사업자(지자체 또는 시설)\n\n 다) 공시방법 : 국고보조금통합관리시스템\n\n\n마. 보조사업자 등의 정보공시 (보조금법 제26조의10)\n\n 1) 관련 법령\n\n  「보조금 관리에 관한 법률」 제26조의10, 제27조, 제27조의2, 및 같은 법 시행령\n  제11조의2, 제12조의2, 제12조의3, 보조사업자 정보공시 세부기준\n\n\n 2) 공시대상\n\n 동일 회계연도 중 보조사업 또는 간접보조사업 총액이 1천만원 이상인 보조사업\n 또는 간접보조사업을 수행하는 보조사업자 또는 간접보조사업자(지방자치단체 제외)\n * 여러 부처의 보조사업 또는 간접보조사업을 수행하는 보조사업자 또는 간접보조사업자의 경우 모든\n   부처에서 교부받은 보조금 또는 간접보조금을 합산한 금액이 1천만원 이상\n\n\n 3) 공시 사항\n\n ① 보조금 교부신청서 및 사업계획서\n\n ② 보조사업 또는 간접보조사업의 수입･지출내역"}, {"p": 475, "t": "                          Ⅴ. 장애인직업재활시설 기능보강\n\n\n③ 정산보고서\n\n④ 정산보고서에 대한 검증보고서(총액 1억원 이상인 경우)\n\n⑤ 보조사업 또는 간접보조사업 관련 감사 지적사항\n\n⑥ 보조사업자 또는 간접보조사업자에 대한 감사보고서 또는 감사 관련 보고서\n  (총액 10억원 이상인 경우)\n\n⑦ 보조사업자 또는 간접보조사업자의 재무제표 또는 결산서\n\n⑧ 보조사업자 또는 간접보조사업자가 당해 연도 보조금 또는 간접보조금으로\n  취득한 중요재산 현황\n\n\n4) 정보공시 기한·방법                                         제4장\n\n\n회계연도 종료일부터 4개월 이내에 국고보조금통합관리시스템에 공시\n5) 제재조치\n위반사실에 대해 서면으로 시정명령을 할 수 있고, 보조사업자 또는 간접보조              시\n사업자가 시정명령에 불응할 시 횟수에 따라 해당 회계연도의 보조금을 50/100           운\n이내에서 삭감할 수 있다.\n\n\n11 행정사항\n\n○ 지방자치단체는 동 보조사업을 효율적으로 수행하기 위하여 관내 장애인직업\n  재활시설에 대한 사업계획의 조정·검토, 공사 집행, 사후관리 등 사업 전반에\n  대하여 관계국·과장의 실무 지도감독 책임 하에 업무를 수행하도록 하여\n  장애인 직업재활시설의 기능보강에 만전을 기하도록 하여야 한다."}, {"p": 476, "t": " ○ 지방자치단체는 장애인 직업재활시설의 신축사업을 수행할 사업수행자에 대한\n   사업의 타당성을 충분히 검토하여 준공과 동시에 시설 신고수리를 받도록\n   하여야 한다.\n\n ○ 사업수행기관은 사업 완료 전에 사업운영계획을 검토·수립함으로써 보조사업\n   으로 취득한 건물과 장비를 활용하여 시설의 기능이 원활하게 이루어질 수\n   있도록 하여야 한다.\n\n ○ 지방자치단체는 시설의 제반 사정(부지 확보 문제 등)으로 인하여 국고보조금\n   교부신청서를 지정된 기일 내에 제출하지 못하는 등 사업이 지연되거나 이월\n   되는 사례가 없도록 지도·감독을 철저히 하여야 한다.\n\n ○ 사업수행기관은 보조금으로 집행한 경비에 대하여는 부가가치세, 관세 등의\n   사후 환급이나 공제를 받지 않아야 한다.\n\n  - 지방자치단체는 이를 지도·감독하고, 불가피하게 환급 등이 발생한 경우 이를\n    반납하도록 해야 함"}, {"p": 477, "t": "                                      Ⅴ. 장애인직업재활시설 기능보강\n\n\n          장애인 직업재활시설 기능보강 서식 및 붙임               목차\n\n\n 번 호                       서 식 및 붙 임 제 목                  페이지\n\n별지 제1호     장애인 직업재활시설(판매시설 포함) 기능보강사업 국고보조금 교부신청서         478\n\n           장애인 직업재활시설(판매시설 포함) 기능보강 국고보조사업 수행계획서\n별지 제2호 명칭：\n  ○ 사업자 대표：\n\n\n 2. 시설에 관한 사항\n  ○ 시 설 명：\n  ○ 시설신고번호：\n  ○ 시 설 장：\n  ○ 소 재 지：                                   (☏    -    -   )\n\n\n 3. 사업에 관한 사항\n  <사업개요>\n  ○ 사업종류：᷺ 신축           ᷺ 증축   ᷺ 개보수         ᷺ 장비구입     ᷺ 임차료   ᷺ 운영비\n  ○ 사 업 명：\n  ○ 사 업 량：\n  ○ 사업장소：\n  ○ 사업기간：       .   .    .∼    .   .   . (   년    개월)"}, {"p": 499, "t": "                                             Ⅴ. 장애인직업재활시설 기능보강\n\n\n  ○ 사업비(계속사업인 경우 총 기간 사업비)\n                                                                 (단위: 천원)\n\n                                            지방비\n   계(a+b+c+d)        국비(a)                                    자부담(d)\n                                  시·도비(b)         시·군·구비(c)\n\n\n  ○ 세부 사업내용\n   - 화장실 양변기교체, 소변기교체, 화장실부스교체\n   - 세면기교체, 비데설치 등\n\n\n4. 예산 집행실적\n                                                                 (단위：원)     제4장\n                                        재원별\n  구 분           사업비 합계                                          비고\n                             국비         지방비            자부담\n 예산액(A)\n 집행액(B)\n                                                              이자 발생액         재\n집행잔액(A-B)\n                                                              (   원)         시\n - 이자 발생액 처리：시·도 계좌에서 계류 중 발생한 이자만 기재(보건복지부 반납분)"}]}]}, {"no": 5, "title": "장애인생산품 판매시설 운영", "start": 501, "end": 536, "sections": [{"title": "Ⅰ. 장애인생산품 판매시설 운영", "start": 503, "end": 523, "subs": [], "pages": [{"p": 503, "t": "                              Ⅰ. 장애인생산품 판매시설 운영\n\n\n    Ⅰ    장애인생산품 판매시설 운영\n\n\n1   목적\n\n장애인 직업재활시설 등이 생산하는 장애인 생산품과 서비스·용역의 판매를 촉진\n하기 위하여 생산시설 등의 판매활동과 유통 대행, 생산품과 서비스·용역 관련\n상담·관리, 홍보, 판로 개척 및 관련 정보를 제공하는 등 마케팅을 지원하는데\n있다.\n\n\n2 근거법령\n\n○ 「장애인복지법」 제58조(장애인복지시설), 제79조(비용부담), 제81조(비용\n    보조) 및 같은 법 시행령 제36조(장애인복지시설), 제44조(비용 보조)\n○ 「보조금 관리에 관한 법령」, 「지방자치단체 보조금 관리에 관한 법령」, 「국고             애\n    보조금 통합관리지침」, 「보건복지부소관 국고보조금 관리규정」, 「보조사업\n    정산보고서 작성지침」, 「보조사업 정산보고서 검증지침」, 「보조사업자 정보              품\n    공시 세부기준」, 「보조사업자 회계감사 세부기준」\n3 기본방침\n\n○ 장애인생산품판매시설은 ｢장애인복지법｣과 ｢중증장애인생산품 우선구매\n    특별법｣에 따라 국가·지방자치단체·공공기관 등으로 장애인 직업재활시설\n    등이 생산하는 장애인 생산품과 서비스·용역의 마케팅 및 판매를 활성화하기\n    위한 업무를 수행한다."}, {"p": 504, "t": " ○ 보건복지부장관 및 시·도지사는 중증장애인생산품 우선구매제도의 조기 정착과\n   활성화를 위하여 장애인생산품 판매시설이 적극적으로 활동할 수 있도록 지원\n   하며, 특히 인터넷 등 정보매체를 활용한 판매 활동을 적극 지원한다.\n\n  - 시·도지사는 신규 판매시설에 대한 설치 신고 수리 시, 다수의 판매시설 운영\n   필요성 및 보조금 지원방안에 대하여 보건복지부와 사전에 협의해야 한다.\n\n ○ 장애인생산품 판매시설은 ｢중증장애인생산품 우선구매 특별법｣에 따른 중증\n   장애인생산품 생산시설에서 생산되는 모든 제품에 대한 홍보와 판매 촉진을\n   위하여 노력해야 하며, 그 밖에 장애인복지시설 및 단체, 재가 장애인이 생산\n   하는 물품의 판매에도 노력하여야 한다.\n\n\n 4 수행사업\n\n가. 「장애인복지법 시행규칙」 제41조 및 [별표4]\n\n 1) 상담사업：재가 장애인 및 생산시설에 대한 상담 및 관리\n\n 2) 판촉사업：생산품의 전시·판매, 특별판매행사 등\n\n 3) 홍보사업：생산품 조달 촉진을 위한 홍보물의 제작·배포\n\n 4) 개발사업：개인·단체별 판로 개척(협의, 계약 등)\n\n 5) 조달사업：장애인생산품의 구매, 물류관리, 공급 및 그에 따른 사업\n\n\n나. 「중증장애인생산품 우선구매 특별법」 제7조\n\n ○ 수의계약 대행：공공기관은 중증장애인생산품을 수의계약으로 구매할 수\n   있으며, 장애인생산품 판매시설은 중증장애인생산품 우선구매 특별법 제7조\n   제5항 및 같은 법 시행령 제10조제5항에 따라 동 계약을 대행"}, {"p": 505, "t": "                                  Ⅰ. 장애인생산품 판매시설 운영\n\n\n5 시설 및 운영 기준\n\n가. 시설 기준 (「장애인복지법 시행규칙」 제42조)\n\n1) 생산품 판매장의 면적은 50제곱미터 이상이어야 한다.\n\n2) 부대시설은 상담 및 판매 내용에 따라 적합한 곳에 설치하여야 한다.\n\n3) 시설에는 「장애인·노인·임산부 등의 편의증진 보장에 관한 법령」에 따른 편의\n   시설을 갖추어야 한다.\n\n\n나. 운영 기준\n\n1) 시·도지사는 「중증장애인생산품 우선구매특별법」에 따른 중증장애인생산품\n   업무수행기관 등을 운영법인으로 하여 장애인생산품 판매시설의 운영을 위탁할\n   수 있으며, 운영법인은 장애인생산품의 판매 활성화를 위해 적극 노력하여야 한다.\n\n2) 동일한 운영 주체가 동일 시·도 내에서 여러 개의 판매시설을 설치·운영하고자                 제5장\n\n  하는 경우 운영상 발생할 수 있는 문제점을 최소화 할 수 있도록 노력할 것\n  (예: 새로 설치하려는 시설을 기존 시설의 분점·지점으로 등록)\n3) 「장애인복지법」 제59조제1항에 따라 설치된 장애인생산품 판매시설은 지자체가\n  장애인생산품 판매시설을 설치하여 운영 중임을 확인할 수 있는 서류(예: 관련\n  공문 등), 「장애인복지법」 제59조제2항에 따라 설치된 시설은 ‘장애인복지\n  시설 신고증’으로 장애인생산품 판매 및 중증장애인 수의계약 대행(「중증장애\n  인생산품 우선구매 특별법」 제7조)을 할 수 있다.\n  * 2019년 이전 판매시설의 판매 신뢰도를 보증하기 위해 활용했던 보건복지부장관 명의의 ‘장애인\n   생산품 판매시설 지정서’는 발급을 중단함\n\n4) 장애인생산품 판매시설의 제품 판매를 촉진시키기 위해 ｢장애인복지법｣\n   제42조제1항 내지 제3항에서 정한 자동판매기, 담배소매, 우표판매 등과\n   종량제 봉투 판매를 병행할 수 있다."}, {"p": 506, "t": "다. 생산품 선정 및 관리\n\n 1) 판매시설은 원칙적으로 장애인이 생산하는 물품만을 판매하여야 한다.\n\n  - 다만, 아래 사례와 같이 불가피한 경우에는 예외로 함.\n\n\n        비장애인 생산품 인정사례\n\n 예 1) 종이컵이 주된 판매 물품으로 종이컵 사용을 위한 컵홀더를 함께 필요로 하나 장애인생산품 중\n      컵홀더가 없는 경우 해당 물품을 비장애인생산품으로 함께 판매 가능\n 예2) 화장실 화장지가 주된 판매물품으로 화장실 내 화장지 비치를 위한 화장지 케이스를 함께 필요로\n     하나 장애인생산품 중 케이스가 없는 경우 해당 물품을 비장애인생산품으로 함께 판매 가능\n\n\n 2) 판매제품은 시장성과 소비자의 이용 편익, 장애인의 생산수준과 지역시장의\n   여건 등을 고려하여 판매하여야 한다.\n\n\n라. 판매기술의 확보\n\n 1) 판매시설은 장애인생산품의 판매를 위한 상담, 판촉, 홍보 등의 기술을 습득\n   하기 위하여 노력하여야 한다.\n\n 2) 소비계층별 취향과 장애인 생산수준의 적정성 등을 고려한 마케팅 전략을\n   수립하여 장애인생산품의 판로개척에 노력하여야 한다.\n\n\n마. 판매수입금 처리 및 범위\n\n 1) 판매수입금은 시설회계 세출예산과목과 수행사업비, 장애인생산품의 구입비,\n   관리운영비, 자원봉사관리비 등 장애인생산품 판매를 촉진하기 위한 사업 외\n   에는 사용할 수 없다.\n   ※ 시설회계 세입·세출예산과목：「사회복지시설 재무회계규칙」 별표 5, 6을 참조\n   ※ 그 외 경비 및 인건비 등으로 사용하려는 경우에는 시설을 운영하는 법인 이사회의 의결을 거쳐\n     시·도지사의 승인을 받아 제한적으로 사용할 수 있음."}, {"p": 507, "t": "                                Ⅰ. 장애인생산품 판매시설 운영\n\n\n2) 판매수수료는 제품의 가격 및 특성에 따라 탄력적으로 정하되 품목별로 10%\n  이내로 정한다.\n\n - 부득이한 사유로 판매수수료를 10% 초과하여 정하는 제품에 대해서는 시·도지\n  사에게 소명자료를 제출해야 하며, 시·도지사는 보건복지부로 제출하여야 한다.\n\n - 판매시설은 판매시설에서 직접 배송하지 않는 생산품에 대한 판매수수료를\n  직접 배송하는 생산품의 판매수수료보다 낮게 정하여야 한다.\n  ※ 시･도지사 및 시장･군수･구청장은 지도점검을 통해 직접 배송하지 않는 생산품에 대한 판매\n    수수료를 직접 배송하는 생산품의 판매수수료보다 낮게 책정하지 않은 판매시설에 대하여 시정\n    조치를 명령할 수 있다.\n\n\n6 시설운영위원회의 설치·운영\n   (사회복지사업법 제36조 및 같은 법 시행규칙 제24조), 사회복지시설 관리안내\n\n가. 구성\n○ ｢사회복지사업법｣에 따라 장애인생산품 판매시설은 다음과 같이 시설운영\n  위원회를 설치하고 운영하여야 한다.\n○ 시설운영위원회의 구성\n - 운영위원회의 위원은 위원장을 포함하여 5명 이상 15명 이하의 위원으로\n  구성한다.(다만, 아래 각 호에 해당하는 위원이 2명을 초과해서는 안 됨)\n - 위원회의 위원은 아래 해당하는 사람 중에서 시설의 장의 추천을 받아 관할\n  시장·군수·구청장이 임명 또는 위촉한다.\n\n  ① 시설의 장\n\n  ② 장애인생산품 생산자(장애인직업재활시설 등)의 대표\n\n  ③ 장애인생산품 구매자(중증장애인생산품 우선구매 관련 공공기관 등)의 대표"}, {"p": 508, "t": "   ④ 시설 종사자의 대표\n   ⑤ 해당 시·도 또는 시·군·구(읍·면·동 및 소속기관 포함)의 사회복지업무를\n        담당하는 공무원\n   ⑥ 후원자 대표 또는 지역주민\n   ⑦ 공익단체*에서 추천한 사람\n    * 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체\n\n   ⑧ 그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이\n        풍부한 사람 (※ ①~⑤는 반드시 포함하고, ⑥~⑧은 선택하여 위촉)\n    * 시설장의 친인척, 법인의 임원 등 특수관계가 명확한 자(시설의 장은 제외)가 위원으로 임명･\n      위촉되지 않도록 주의\n\n  - 위원장은 위원 중에서 호선하며, 위원의 임기는 3년으로 하되 연임할 수 있고\n   보궐위원의 임기는 전임자의 잔여 임기로 함.\n\n\n나. 운영\n\n ○ 분기별 1회 이상 정기회의 개최, 운영위원회 운영규칙에 규정한 회의 개최\n   요건에 해당할 경우(재적의원 1/3의 요청이 있을 경우 등) 수시회의 개최\n\n ○ 회의록을 작성하고, 회의는 공개를 원칙으로 하되, 개인정보보호 등 불가피한\n   사유가 있을 경우, 위원장이 비공개 결정을 할 수 있음(비공개 사유는 공개)\n\n ○ 서면심의나 서면에 의한 회의는 불가\n\n\n다. 심의사항 (｢사회복지사업법｣ 제36조제1항)\n\n - 시설운영계획의 수립·평가에 관한 사항\n\n - 시설 종사자의 근무환경 개선에 관한 사항\n\n - 판매수수료 책정 및 사용 등에 관한 사항\n\n - 시설 이용자(장애인생산품 생산자 및 구매자)의 이용여건 개선 및 고충처리\n   등에 관한 사항"}, {"p": 509, "t": "                                   Ⅰ. 장애인생산품 판매시설 운영\n\n\n- 시설과 지역사회의 협력에 관한 사항\n\n- 그 밖에 시설의 장이 운영위원회의 회의에 부치는 사항\n\n\n라. 보고사항 (｢사회복지사업법｣ 제36조제3항)\n\n- 시설의 회계 및 예산·결산에 관한 사항\n\n- 판매수수료 수입금 처리에 관한 사항\n\n- 후원금 조성 및 집행에 관한 사항\n\n- 그 밖에 시설운영과 관련된 사건·사고에 관한 사항\n    ☞ 국가감염병 확산 등 특수한 상황이 있을 경우, 서면보고로 갈음 가능\n\n\n마. 기타 자세한 사항은 당해연도 ‘사회복지시설 관리안내’ 참조\n\n\n7    재무회계 관리 및 장부 비치\n가. 재무회계관리\n○ 장애인생산품 판매시설의 재무회계는 법인회계와는 별도로 구분하여 독립\n    채산제로 운영한다.\n○ 장애인생산품 판매시설의 모든 회계는 예산 사용의 투명성을 확보하기 위해\n    「사회복지법인 및 사회복지시설 재무·회계규칙」의 시설회계를 준용하여 단식\n    및 복식부기로 병행하여 처리하되, 회계사무소에 의뢰하여 처리할 수 있다.\n\n    - 동 규칙에서 정하지 아니한 사항은 ｢국가재정법｣, ｢지방재정법｣ 및 ｢물품\n     관리법｣ 등 정부 재무회계 관련 법령을 준용한다."}, {"p": 510, "t": "나. 각종 장부의 비치\n\n ○ 장애인생산품 판매시설은 다음의 장부를 비치하여야 한다.\n\n   구     분                       내        용\n\n        관리관련\n                - 직원관계철, 회의록철, 사업일지, 문서철, 문서 접수·발송대장, 차량운행일지\n         장부\n\n\n                - 상담관계서류(재가장애인 및 생산시설)\n                - 판촉사업 관리대장\n        사업관련\n                - 홍보사업 관리대장\n         장부\n                - 개발 및 조달 관련대장\n                - 제품매입대장, 제품매출대장\n  기본\n  비치\n  서류            - 총계정원장 및 수입·지출보조부\n                 ※ 매출채권, 매입채무, 제품매출, 수입장부, 지출장부\n                - 금전출납부 및 그 증빙서류\n\n        재무·회계   - 예산서·결산서, 비품수불대장, 비품관리대장, 장비관리대장\n        관련 장부   - 재산대장·재산목록과 그 소유권에 관한 증빙서류\n                - 사회복지법인 및 사회복지시설 재무·회계규칙 제20조제1항제4호 부터 제13호\n                 까지의 서류\n                - 각종 증빙서류 및 기타 필요한 서류"}, {"p": 511, "t": "                                Ⅰ. 장애인생산품 판매시설 운영\n\n\n8 운영 지원(국고보조금) 및 보조금 관리\n\n가. 운영비 지원\n\n1) 지원내용\n\n직원 인건비 등 장애인생산품 판매시설의 운영에 필요한 제반 비용\n\n2) 지원기준：국비 40%, 지방비 60%\n\n○ 시설장과 사무국장, 선임사무원, 사무원 등에 대하여 장애인생산품 판매시설\n  종사자 인건비 가이드라인의 기준 적용\n\n○ 기타 직원(영업직원 등)에 대한 인건비 지급기준은 본 사업지침의 ‘장애인\n  생산품 판매시설 종사자 인건비 가이드라인’을 참고하여 시·도지사가 정하는\n  규정에 따른다.\n  ※ 장애인생산품 판매시설의 모든 직원은 재정보증보험에 가입하여야 한다                    제5장\n\n○ 단독시설로서 신고된 장애인생산품 판매시설에 한해 분기별로 지원한다.\n○ 지방자치단체는 필요하다고 판단하는 경우에 지방비를 추가로 지원할 수 있다.\n○ 당해 연도 장애인생산품 판매시설의 지도·점검 결과에 따라 시설에 대한\n  관리운영비를 차등 지원할 수 있다.\n3) 신청과 교부\n\n  ※ <별지 제3호 서식> 장애인생산품판매시설 지원 국고보조금 교부신청서 참조\n\n○ 장애인생산품 판매시설은 보건복지부에서 통보한 보조금 예산의 확정 통지에\n  근거하여 매 분기(1, 4, 7, 10월) 시작 전월 10일까지 예산교부 신청서를 관할\n  시·군·구에 제출한다."}, {"p": 512, "t": " ○ 시·군·구는 매 분기 시작 전월 20일까지 판매시설이 제출한 자료를 검토 후\n   시·도로 제출하고, 시·도는 제출된 자료를 조정하여 전월 말일까지 보건복지부에\n   국고보조금 교부를 신청한다.\n   ※ 교부신청서의 제출자나 수령자 명의는 판매시설에서 시·군·구, 시·도, 보건복지부로 제출하는\n     과정마다 각각의 관계자로 수정 제출\n\n ○ 보건복지부는 매 분기 신청액을 분기 첫 달의 10일까지 교부한다.\n\n    매칭되는 지방비를 시･도가 전액 부담하는 경우, 위의 내용에도 불구하고 보조금 관리의\n    효율성을 위해 보조금 교부 및 집행관리를 시･도에서 직접 수행 가능\n\n\n나. 국고보조금의 관리 및 집행\n\n< e나라도움(국고보조금통합관리시스템) 사용안내 >\n\n 1) 정부의 국고보조금 부정수급 종합대책(’14.12.4.)에 의거 모든 민간보조사업자\n   까지 e나라도움 사용 의무화\n\n  - 다만, 차세대사회보장정보시스템(희망이음)을 사용하는 복지시설은 e나라\n    도움을 직접 사용하지 않고 차세대사회보장정보시스템(희망이음)을 통해\n    국고보조금 교부, 집행 등을 처리할 수 있음\n   ※ 단, e나라도움을 사용하는 시설은 반드시 차세대사회보장정보시스템(희망이음)을 동시에 사용\n     해야 함(보건복지부 사회서비스자원과-24(’18.1.2.)호)\n\n 2) 보조사업의 예탁방법(「보조금법」 시행령 제10조의8)\n\n  - 지자체가 직접 사업을 수행할 경우는 비예치형, 지자체가 민간보조사업자에게\n    재교부 할 경우 예치형*으로 관리할 것\n   * (예치형) 보조금교부, 보조사업자의 증빙등록 및 집행요청 등 보조금 전달체계 및 금융거래\n     전 과정을 e나라도움 시스템과 예탁계좌를 통해 수행(예탁계좌(한국재정정보원)로 교부받아\n     e나라도움을 통해 집행·이체 진행(집행등록→이체))\n  ** e-나라도움(http://www.gosims.go.kr) – e나라도움소개- 매뉴얼 - 사용자매뉴얼 참조"}, {"p": 513, "t": "                                   Ⅰ. 장애인생산품 판매시설 운영\n\n\n다. 실적보고(정산보고)\n\n  ※ <별지 제11호, 제12호> 보조사업 완료 실적보고서(추가 양식 별도 공문 송부)\n\n시･도지사는 보조사업을 완료한 때에는 보조사업이 당초 목적에 부합되고 효과적\n으로 수행되었는지를 검토한 후 보조사업 실적보고서를 제출하여야 한다.\n\n1) 장애인생산품 판매시설은 회계연도 종료 시 실적보고서를 시·군·구에 제출하여야\n  하며, 시·도는 산하 판매시설의 실적보고서를 취합, 검토 후 보건복지부에 제출함\n\n2) 사업 완료는 지원 목적을 달성하고 별도 계좌에서 해당 사업비가 마지막으로\n  지출된 시점을 기준으로 함\n\n3) 사업 실적보고서는 매년 회계연도 종료 후 다음해 1월 말까지 보건복지부에\n  제출하여야 함\n\n4) 보건복지부장관은 필요한 경우 별도로 사업실적(정산) 보고를 요청할 수 있음\n\n9 종사자 관련 사항\n가. 공통사항\n1) 교육\n○ 신규채용자 및 교육을 받지 아니한 직원은 자활연수원, 한국장애인직업재활시설\n  협회 등에서 실시하는 소정의 장애인 직업재활시설 교육을 수료하여야 한다.\n○ 시설장은 ｢긴급복지지원법｣ 제7조에 따라 소속 종사자에게 긴급복지 신고의무\n  교육을 매년 1시간 이상 실시하고, 그 결과를 보건복지부에 제출하여야 한다.\n\n○ 장애인재활상담사, 사회복지사 등 「장애인복지법」 및 「사회복지사업법」에 따른\n  법정 자격증을 소지한 시설 종사자는 관계 법령에서 정한 필수 보수교육을\n  수료하여야 한다."}, {"p": 514, "t": " 2) 종사자(이하 ‘시설장’ 포함) 인건비 보조금 지급 연령 상한기준\n   (시행일：2002년 1월 1일)\n\n ○ 지급상한 : 시설장 만 65세, 그 외 종사자 만 60세\n   * 최종 임금 지급 사항 기준일 (지급상한일자는 해당 종사자(시설장 포함)의 출생일을 기준으로 함)\n   ※ 기타사항은 당해연도 「사회복지시설 관리안내」 참조\n\n\n 3) 장애인생산품 판매시설 종사자의 채용은 공개모집을 원칙으로 하며 기타 자세한\n  사항은 당해연도 사회복지시설 관리안내 참조\n\n\n 4) 시·도지사와 시·군·구청장은 판매시설의 원활한 운영을 지원하기 위하여 공공근로\n  등을 우선적으로 배치하도록 노력하여야 한다.\n\n\n나. 자격기준\n\n 1) 시설장\n\n 시설장 자격은 아래와 같으며, 전임으로 상근하여야 한다.\n   ※ 단, 지방자치단체 직영 시설로 지방자치단체장이 시설의 장인 경우는 예외\n\n 가) ｢사회복지사업법｣에 의한 사회복지사 3급 이상 자격증을 취득한 후 사회\n    복지사업에 3년 이상 종사한 경력이 있는 사람\n\n 나) 경영 관련 전공자로 실무경력 3년 이상인 사람\n\n 다) 판매·영업분야에 5년 이상 종사한 경력이 있는 사람\n\n 라) 50인 이상의 기업 및 공공기관에서 부장급 이상으로 5년 이상 종사한 경력이\n    있는 사람\n\n 마) 위 각 호에 준하는 학식과 경력이 있다고 인정되는 사람"}, {"p": 515, "t": "                                 Ⅰ. 장애인생산품 판매시설 운영\n\n\n2) 사무국장\n\n가) ｢사회복지사업법｣에 의한 사회복지사 3급 이상의 자격증을 가진 자로서\n   사회복지사업에 1년 이상 종사한 경력이 있는 사람\n\n나) 경영관련 전공자로 실무경력이 2년 이상인 사람\n\n다) 판매·영업·회계 분야에 3년 이상 종사한 경력이 있는 사람\n\n라) 위의 기준에 준하는 자격이 있다고 인정되는 사람\n\n\n3) 선임사무원\n\n가) 해당 시설에서 사무원으로 5년 이상 종사한 경력이 있는 사람\n\n나) 사무국장의 자격에 준하는 자로서 시설 운영위원회에서 그 자격이 있다고\n   인정되는 사람\n\n\n4) 사무원：전산 또는 회계 등 관련 자격증 소지자 우대                              제5장\n\n\n5) 기타 직원：시·도지사가 정하는 규정에 따름\n  ※ 판매시설에서 별도 운영하는 사업장(카페 등)에서 근로하는 장애인은 직원(종사자)로 보지 않음       산\n다. 종사자 채용 등 장애인·아동·노인학대 범죄 전력자 취업제한 점검·확인\n  ☞ 4.1 장애인직업재활시설 운영(공통) 참조"}, {"p": 516, "t": " 10 지도·감독 및 평가\n\n ○ 시장·군수·구청장은 관할 지역 내 판매시설 운영 전반에 대하여 연 1회 정기적\n   으로 지도·감독 하여야 하며, 필요한 경우 수시로 지도·감독을 할 수 있다.\n  - 시장·군수·구청장이 판매시설에 대해 지도·감독을 할 때에는 시·도지사와\n    사전 협의하여 실시하거나 시·도와 합동으로 실시할 수 있다.\n\n ○ 시장·군수·구청장은 지도·감독 결과, 판매시설이 운영이 부실하거나 장애인\n   생산품 이외의 제품을 판매하는 등 운영사업의 목적에 위배되는 행위를 한\n   경우에는 문서로 시정조치를 행하고 그에 대한 조치 결과를 판매시설로부터\n   문서로 보고받아야 한다.\n\n ○ 시장·군수·구청장은 판매시설에 대한 지도·감독 결과를 관할 시·도지사에게\n   보고하고 시·도지사는 이를 보건복지부에 보고하여야 한다.\n\n ○ 판매시설의 운영법인은 산하 판매시설이 적정하게 운영될 수 있도록 상시\n   지도하여야 하며, 산하 판매시설은 이에 협력하여야 한다.\n\n ○ 보건복지부장관은 장애인생산품 판매시설 운영 전반에 대한 평가를 실시할\n   수 있으며, 이를 전문기관에 위탁할 수 있다.\n\n\n 11 운영실적 등 보고\n\n가. 사업계획 및 예산수립\n\n ○ 장애인생산품판매시설의 장은 사업계획 및 예산을 수립하여 사업계획은 운영\n   위원회 심의를 거치고 예산은 운영위원회에 보고한 후, 법인 이사회의 의결을\n   거쳐 사업계획(예산)은 매 회계년도 개시 5일전까지, 전년도 추진실적 및\n   정산서는 1월 말까지, 결산서는 3월 말까지 시장·군수·구청장에게 보고하여야\n   한다.\n\n ○ 시장·군수·구청장은 판매시설의 보고자료를 시·도지사에게 보고하여야 한다."}, {"p": 517, "t": "                             Ⅰ. 장애인생산품 판매시설 운영\n\n\n나. 운영실적 보고\n\n○ 장애인생산품판매시설의 장은 [별지 제1호 서식]에 의거, 시·군·구청장에게\n  매 반기말 익월 10일까지 보고하여야 한다.\n\n○ 시장·군수·구청장은 보고실적을 종합하여 매 반기말 익월 20일까지 시·도지사\n  에게 보고하여야 한다.\n\n○ 시·도지사는 장애인생산품 판매시설 운영 실적보고서를 [별지 제1호 서식]에\n  따라 작성하여 상반기 실적은 반기말 익월 30일까지, 당해 연도 실적은 상반기\n  실적에 하반기 실적을 합산하여 다음 연도 1월말 까지 보건복지부장관에게\n  제출하여야 한다.\n\n\n다. 판매실적 보고 및 통보\n\n○ 장애인생산품 판매시설의 장은 [별지 제2호 서식]에 의거 판매실적을 시장·              제5장\n  군수·구청장 및 한국장애인직업재활시설협회장에게 매 반기 종료 다음 달(1월.\n  7월) 10일까지 보고 및 통보하여야 한다.\n○ 시장·군수·구청장은 보고실적을 종합하여 매 반기 종료 다음 달(1월, 7월) 20일          생\n  까지 시·도지사에게 보고하여야 한다.\n○ 시·도지사는 [별지 제2호 서식]에 의거, 매 반기별로 장애인생산품 판매시설의             시\n  판매실적을 취합하여 매 반기 종료 다음 달(1월, 7월) 30일까지 보건복지부             운\n  장관에게 보고하여야 한다."}, {"p": 518, "t": "[별지 제1호 서식]\n\n                  장애인생산품 판매시설 운영실적 보고서\n 시설명：\n 시설장：\n                                 ○○반기(또는 연도)\n1. 판매실적\n     구    분                               매 입 액   매 출 액         재 고 액   이 익 금\n          생산            생산품명\n 품목구분     시설                              반기 누계 반기 누계     (%)   반기 누계 반기 누계\n          구분\n                총계(g=e+f)\n                   계(e=c+d)\n                     계(c=a+b)\n                          소계(a)\n                ① 시설설비                  󰄫\n\n\n 1. 보조사업자에 관한 사항\n   ○ 사업자 종류：지방자치단체 ᷺ 사회복지법인 ᷺ 사단법인 ᷺ 기타 법인 ᷺ 기타 ᷺\n   ○ 사업자 명칭：\n   ○ 사업자 대표：\n\n 2. 시설에 관한 사항\n   ○ 시설종류：장애인생산품판매시설\n   ○ 시 설 명：                       (☏   -     -   )\n   ○ 소 재 지：\n   ○ 시 설 장：                       (☏   -     -   )\n 3. 사업에 관한 사항\n   ○ 사 업 명：장애인복지시설 기능보강(장애인생산품판매시설 지원)\n   ○ 예산과목：080-082-1500-1536-300\n   ○ 국고보조금 교부 신청금액\n                                                           (단위：천원)\n   구 분        ’25예산액   기교부액       금회요청액          교부잔액      비고\n   시설명\n\n* 예산액은 국고보조금 예산임"}]}, {"title": "Ⅱ. 장애인생산품 판매시설 종사자 인건비 보조기준", "start": 524, "end": 530, "subs": [], "pages": [{"p": 524, "t": "     Ⅱ      장애인생산품 판매시설 종사자 인건비 보조기준\n\n\n 1   목적\n\n 장애인생산품 판매시설에 근무하는 종사자에 대한 인건비 지원에 있어 필요한\n 기준을 정함으로써 국고보조금 집행의 형평성과 효율성을 기하기 위함\n\n\n 2 보조기준\n\n가. 용어의 정의\n\n ○ 보수：봉급과 기타 각종 수당을 합산한 금액\n\n ○ 봉급：직무의 난이도 및 책임의 정도와 재직기간 등에 따라 직위별·호봉별로\n     지급되는 기본급여\n\n ○ 수당：직무 특성 및 생활 여건 등에 따라 지급되는 부가급여\n\n ○ 승급：일정한 재직기간의 경과에 의하여 현재의 호봉보다 높은 호봉을 부여\n     하는 것\n\n ○ 보수의 일할 계산：그 달의 보수를 그 달의 일수로 나누어 계산하는 것\n\n\n나. 적용범위\n\n ○ 이 기준은 장애인생산품 판매시설에 근무하는 종사자(시설장 포함, 이하 같음)에\n     대한 인건비의 국고보조 기준임"}, {"p": 525, "t": "                    Ⅱ. 장애인생산품 판매시설 종사자 인건비 보조기준\n\n\n○ 지방자치단체의 장 또는 시설을 설치·운영하는 자는 이 기준에 불구하고 재정\n  형편에 따라 기준을 초과하여 보수를 보조 또는 지급할 수 있음\n\n - 시설을 설치·운영하는 자는 이 기준에 정한 사항 이외에 근로기준법 등 다른\n  법령에 의한 사항을 준수하여야 함\n\n\n다. 시행일\n\n○ 이 기준은 2026년 1월 1일부터 적용·시행함\n\n\n3 호봉의 획정\n\n당해연도 「사회복지시설 관리안내」 참조\n\n\n4 보수의 보조기준                                                제5장\n\n\n가. 보수 지급기준\n ○ 보수는 [표 1]의 기본급과 [표 2]의 수당을 지급함\n ○ 봉급 및 수당의 지급 비율을 상향하거나 별도의 수당을 추가로 지급하는\n   경우에는 해당 지방자치단체 및 법인이 기준보조금(국고 및 지방비로서\n   매년 초 확정내시된 보조금) 외에 별도의 예산을 확보하여 지급하여야 함\n ○ 보수는 다른 특별한 규정이 있는 경우를 제외하고는 매월 1일부터 그 달\n   말일까지 계산하며, 신규 채용·승진 등의 경우에 있어서 발령일을 기준으로\n   그 월액을 일할 계산하여 지급함"}, {"p": 526, "t": "         [표 1] 2026년 장애인생산품판매시설 종사자 기본급 가이드라인\n                                                      (단위：원 / 월)\n             직위    시설장        사무국장        선임사무원        사무원\n 호봉\n
