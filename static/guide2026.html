7\n\n          2        ○○○요양원        000-0000-000   ○○면 ○○○로 ○○○     25\n\n          3       ○○실버하우스        000-0000-000   ○○면 ○○○로 ○○○      8\n\n  ○○군\n          4       ○○소규모요양원       000-0000-000   ○○면 ○○○로 ○○○     17\n  (8개소)   5          ○○○마을       000-0000-000   ○○면 ○○○로 ○○○     68\n\n          6          ○○○○집       000-0000-000   ○○면 ○○○로 ○○○     10\n\n          7          ○○○○집       000-0000-000   ○○면 ○○○로 ○○○     21\n\n          8        ○○○○마을        000-0000-000   ○○면 ○○○로 ○○○     77"}, {"p": 645, "t": "                                              Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n 참고2            최근 산불의 특성\n\n○ 산불은 대규모 사회재난으로서 다음과 같은 특성을 가진다.\n\n1. 급속 확산성: 바람, 건조, 지형 조건에 따라 매우 빠른 속도로 확산함\n   (2025년 경상북도 산불 최대 확산 속도 약 8.2km/h)\n\n ※ 산불은 기온이 높고 습도가 낮은 주간에 주로 확산하는 경향을 보이나, 이번 경상북도\n   산불의 경우 야간에 빠르게 확산\n\n2. 장거리 비화: 불씨가 바람에 실려 수백 미터 이상 날아가며 2차 화재를\n   유발할 수 있음 (2025년 경상북도 산불 비화거리 최대 2km)\n3. 예측 곤란성: 풍향, 풍속 변화에 따라 확산 방향이 수시로 변경되어 대피로\n   단절 등의 위험 발생\n4. 야간·연무 확산: 어둠이나 연기 등으로 시야가 제한되며 대피 지연 위험\n   증가\n5. 건물 비접촉 발화: 고온, 복사열에 의해 건물 외벽이나 내부 자동 점화\n   가능성 존재\n\n○ 최대순간풍속이 20m/s 이상 지속될 것으로 예상되면 초고속 산불로의\n  확산 가능성이 높다 (2025년 경상북도 산불 확산 속도 약 8.2km/h 이상)\n\n○ 주요 산불 피해사례\n               미국                일본                  대한민국                대한민국\n 구분\n              (L.A.)           (이와테현)               (경북 울진)           (경북·경남·울산)\n 산불\n           ’25.1.7~1.31.      ’25.2.26~3.9.         ’22.3.4~3.13.      ’25.3.21~3.30.\n진화 기간\n산림 피해       23,300ha            2,900ha              16,302ha           103,876ha\n        - 고온･건조한 강풍        - 평년보다 적은 강수량        - 유례없는 건조한 날씨       - 이상 고온, 건조한 날씨\n주요 원인   - 숲과 인접한 주택        - 건조하고 강한 바람으로       - 겨울 가뭄, 건조하고 강한    - 강한 바람으로 장거리 비화\n        - 건조한 기상             산불 확산 가속화            바람으로 산불 확산        - 풍향, 풍속의 예측 불가능성\n\n\n피해 현장"}, {"p": 646, "t": "  참고3        초고속 산불 주민대피 체계\n\n□ 일반 및 초고속 산불 시 대피\n\n ○ 산림청의 산불예측시스템을 기반으로, 지역의 특성 등을 종합적으로\n   고려하여 대피를 준비한다.(①구역 → ②지역 → ③권역까지 고려)\n\n         과거 일반 산불 시 대피                   초고속 산불 시 대피\n\n\n 1. (화선 정보 확보 시) 산불의 발화점, 화선 정보와 최대순간풍속, 풍향 등을\n    기반으로 화선 도달거리(위험구역: 5시간, 잠재적 위험구역: 8시간) 설정\n    ※ 주요 인자 : 기온, 풍향, 상대습도, 지형(경사, 사면), 연료량\n        구분               AS IS                  TO BE\n\n                                      5시간, 8시간 기준 산불 확산구역 안내,\n  산불예측시스템 활용      미활용, 또는 부분 활용\n                                               전면 활용\n                   (기상청 제공)               (기상청 제공)\n 예측시스템 주요 인자                  평균 풍속                  최대순간풍속\n\n\n 2. (화선 정보 미확보 시) 역대급 산불 확산 속도(2025년 경상북도 산불)를 고려\n    하여 시간당 8.2km 수준으로 설정, 광범위한 풍향각 설정\n\n        구분                    AS IS                  TO BE*\n\n  화선 정보 미확보 시      산불 피해확산 예측 불가,      5시간, 8시간 기준 산불 확산구역 안내\n  산불예측시스템 활용          정보제공 곤란                (확산 속도 8.2km/h)\n* 화선 정보 미확보로 정확도 저하 감안, 인명피해 최소화를 위해 보수적으로 설정"}, {"p": 647, "t": "                              Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n (예시) 화선 정보 확보 시(최대순간풍속 적용)   (예시) 화선 정보 미확보 시(확산 속도 8.2km/h 적용)\n\n\n\n 산림청 : 산불확산 예측을 통한 위험구역 안내\n  ※ 5시간 : 위험구역, 8시간 : 잠재적 위험구역\n\n  지방정부 : 대피범위 설정‧대피명령(5시간 : 즉시 실행, 8시간 : 실행 대기)\n  ※ 야간에 위험구역으로 포함된 경우, 일몰 전 사전대피 실시\n  ※ 5시간, 8시간 이내 확산선을 참고하되, 인근에 취약시설(요양원, 장애인시설 등)이 있는\n    경우 포함하여 위험구역 설정\n\n\n□ 대피경보 발령\n\n○ (대피단계) 산림청 산불확산예측시스템의 시간 단위별 위험구역 권고에 따라\n  “준비(Ready)➝ 실행대기(Set) ➝ 즉시실행(Go)” 단계로 설정한다.\n  ※ 실행대기 단계는 고령자 등 취약계층 구분, 즉시실행 단계는 대피소로 대피 안내가 가능한\n    단계와 현 지점에서 안전 확보가 필요한 단계로 세분화\n\n - (준비: ①Ready) ✔산불 발생 인근지역 즉시 대피, 산불확산예측시스템의 화선\n  도달범위(위험구역) 8시간 이후 지역은 대피 지시 가능성을 인지하고, 산불\n  상황에 예의주시"}, {"p": 648, "t": "  - (실행대기: ②Set) 5~8시간 도달 범위 지역은 대피소 및 경로 확인, 비상용품\n    확보 등 대피 준비, ✔취약계층 및 재난취약시설은 사전대피 실시(Ⅰ영역 ⇒\n    고립 우려 영역 ⇒ Ⅱ영역)\n\n  - (즉시실행: ③Go) 5시간 범위 내 도달 지역은 ✔전 주민 즉시 대피\n\n                             < 대피단계 및 기준 >\n\n             준비               실행 대기                  즉시 실행\n 대피단계\n           (Ready)             (Set)                  (Go)\n  위험기준     인근지역            8시간 기준                 5시간 기준\n (상황정보)    예의주시         산불예측확산선 포함 지역          산불예측확산선 포함 지역\n\n             1           2             3         4            5\n\n                       대피 준비         사전대피      즉시 대피       긴급안전확보\n           마음 준비\n                     (행동요령 확인)      (취약계층)   (위험지역 대피)   (현 지점 안전확보)\n 단계구분\n                                   고령자 등\n                       재난 정보,\n          대피지시 발생                 ✔안전취약계층     ✔대피지시        함께 이동,\n                      위험지역 및\n           가능성 인지                  (취약시설)    발령 지역 대피     안전확보 주력\n                     대피소･경로 확인\n                                    사전대피\n\n① “Ready” : 인근 시도에서 산불이 발생하였으니 이동에 참고하시기 바랍니다.\n② “Set” : 산불확산에 따라 대피명령이 내려질 수 있으니 사전 준비하시기 바랍니다.\n③ “Go” : 산불확산으로 즉시 ○○으로 대피하시기 바랍니다.\n\n\n□ 상황전파\n\n ○ 라이프라인이 동시에 단절되는 경우를 대비하여 재난문자 외에 기술･지역･\n    주민 특성을 고려, 다양한 재난 정보 전달 매체를 복합 활용한다.\n   ※ 유무선 통신망 작동 시에는 마을방송(집 안), 자동음성통보, 스마트마을방송(휴대전화), 전화 등\n     음성을 통한 상황전파 수단을 동시 활용, 미작동 시에는 재난방송(TV 자막, 라디오)을 활용\n\n  - 전기와 통신망이 동시에 단절된 경우, 민방공 경보 단말을 활용하여 대피 정보\n    전달, 가두방송 차량을 통해 주민 대피 안내"}, {"p": 649, "t": "                            Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n - 상황이 긴급한 경우, 기술적 수단과 「마을순찰대」 등 인적 수단을 활용하여\n  주민 대피 안내 및 이동 지원\n\n  구분          AS IS                         TO BE\n\n                          (통신망 작동 시)\n                                       마을방송, 자동음성통보, 스마트마을방송\n                          (전기･통신망 단절)\n                                        민방공 경보 단발*\n수단 및 방법   재난문자, 마을방송 위주\n                          (기타)\n                                 가두방송, 마을순찰대 등 활용\n                           * 위성망 및 배터리 사용, 전기･통신 단절 시에도 작동 가능\n\n\n□ 대피 실시\n\n○ (즉시대피) 산불 발화 지점 인근지역의 경우 즉시 대피한다.\n\n○ (대피준비) 대피단계 및 기준에 따라 피난약자와 안전취약계층에 대한 사전\n  대피를 시행(Ⅰ 영역, 고립 우려 영역, Ⅱ 영역) 하고, 일반시민 대피 권고\n  및 대피준비 정보를 발송한다.\n\n - (재난취약시설) 대피계획에 따라 계획된 이동수단을 통해 사전 지정(협약)\n  대피시설로 이동\n\n - (고령자, 재가장애인) 버스 등 교통편과 대피 지원 인력 제공\n\n - (일반시민) 산불 발생에 따른 대피소 개소 사실 홍보, 대피명령 가능성 및\n  대피준비 안내\n\n - (사전준비) 지역 특성을 고려하여 사전에 주민대피 관리카드 배포\n\n○ (대피명령) 화선 도달거리(위험구역: 5시간, 잠재적 위험구역: 8시간) 자료와\n  지역 상황을 고려하여 대피명령*을 발령한다.\n  * 화선 정보 미확보에 따른 정확도 저하 감안, 인명피해 최소화를 위해 보수적으로 설정\n\n - 광범위한 지역이 포함되더라도 인명피해 최소화에 중점을 두고 보수적으로\n  판단, 즉시대피 가능하도록 경찰 협조 통해 명령 이행"}, {"p": 650, "t": "  - 대형산불로 행정력이 미치지 못하는 극한 상황 발생*시 마을 자치 조직(마을\n   순찰대, 자율방재단 등)을 활용하여 대피할 수 있도록 안내\n   * 평소 교육･훈련을 토대로 자력 대피할 수 있도록 사전 준비(자력대피 가능 여부 파악, 비상연락망\n     구축, 대피로·대피소 지정, 예상 대피시간 산출 등) 선행 필요\n\n  - (일반시민) 산불 발생에 따른 대피소 개소 사실 홍보, 대피명령 가능성 및\n    대피준비 안내"}, {"p": 651, "t": "                                         Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n 참고4          주민대피 단계별 부서의 임무\n                                    ※ 아래 표는 참고용으로 지역 특성에 맞게 적용 바람\n                     ▸산불재난 대비 주민대피 계획 수립\n 사  전      주민대피 계획\n                     ▸시･도 ↔ 시･군･구 ↔ 읍･면･동 비상연락체계 구축\n 대피계획      특수보호시설    ▸특수보호시설 입소자·환자 대피계획 수립 / 산불 규모별 관내·관외 대피계획 반영\n   ⇩\n                     ▸(지방정부) 상황접수 및 상황전파(경찰, 소방, 산림청 소속기관 등), 현장출동\n 상황 발생      산불 대응\n                     ▸(산림청) 산불확산예측도 제공\n   ⇩\n                     ▸산림청 산불확산예측시스템 시간대별 수시 모니터링\n            산불 대응    ▸긴급재난문자(CBS) 발송 요청(→재난부서)\n   준비                ▸산불예방 홍보 강화 및 신속 대피를 위한 행동요령 홍보\n (Ready)             ▸상황전파 수단 상시 점검 및 긴급재난문자(CBS) 발송\n            주민대피     ▸인근 시･군･구 간 대피소 공유 및 협력체계 구축\n                     ▸마을 이장단, 마을순찰대 등을 중심으로 마을단위 대피 네트워크 구축\n8시간 이전               ▸산불 발생상황 지역 특수보호시설 전파 및 대피 가능성 입소자에게 안내\n           안전취약계층·\n                     ▸특수보호시설↔ 1~2차 대피 지정(협력)병원 간 비상연락망 확인 및 대피 가능성 사전 안내\n           특수보호시설    ▸고령자, 장애인 등 대피 시 대피 수단 사전확보\n   ⇩\n                   ▸산림청 산불확산예측시스템 시간대별 수시 모니터링\n            산불 대응  ▸긴급재난문자(CBS) 발송 요청(→재난부서)\n                   ▸유관기관 상황판단회의 및 상황전파(→재난․복지부서)\n                   ▸긴급재난문자(CBS) 발송 및 상황전파(마을방송, 민방공 경보단발, 마을순찰대 등)\n 실행 대기             ▸주민대피 시･군-읍･면･동-마을이장 등 비상연락망 확인\n  (Set)     주민대피\n                   ▸주민 대피소* 및 비상 집결지, 이동 수단 확보(개인차량, 버스 등)\n                    - 1차(관내 : 마을 단위) → 2차(관내 : 읍･면･동 단위) → 3차 대피소(인접 시･군)\n5~8시간 이내           ▸고령자, 거동불편자 등 안전취약계층 해당 시 사전대피\n           안전취약계층･ - (고령자, 재가장애인) 버스 등 교통편과 대피지원 인력 제공\n                   - (시설장애인, 병원) 사전 지정(협약) 시설로 이동\n           특수보호시설 ▸취약계층 이동차량 다수 확보\n                   ▸대피소 입소 안전취약계층은 의료반(의사, 간호사 등) 상주 현장 의료서비스 제공\n   ⇩\n                   ▸산림청 산불확산예측시스템 시간대별 수시 모니터링\n            산불 대응  ▸긴급재난문자(CBS) 발송 요청(→재난부서)\n                   ▸유관기관 상황판단회의 및 상황전파(→재난･복지부서)\n 즉시 실행             ▸긴급재난문자(CBS) 발송 및 상황전파(마을방송, 민방공 경보단발, 마을순찰대 등)\n  (Go)      주민대피   ▸대피 실시(특수보호시설 중심 우선 대피, 거부자는 경찰 동행하여 신속 대피)\n                   ▸시･군･구-읍･면･동 담당 공무원, 마을이장, 자율방재단, 의용소방대 등 동원 대피\n                   ▸사전대피를 못한 고령자 등 대상 안전취약계층 신속히 대피 실시\n5시간 이내\n           안전취약계층･ - (고령자, 재가장애인) 버스 등 교통편과 대피지원 인력 제공\n                   - (시설장애인, 병원) 사전 지정(협약) 시설로 이동\n           특수보호시설 ▸취약계층 이동차량 다수 확보                                                  제8장\n                   ▸대피소 입소 안전취약계층은 의료반(의사, 간호사 등) 상주 현장 의료서비스 제공\n   ⇩\n            산불 대응  ▸상황판단 회의 및 언론브리핑, 긴급재난문자(CBS) 발송 요청(→재난부서)\n 상황 종료\n            주민대피   ▸긴급재난문자(CBS) 발송, 대피주민 귀가토록 조치\n 진화 완료\n           취약계층･시설 ▸취약계층 특수보호시설별 복귀"}, {"p": 652, "t": "  참고5             경북 산불 산지 이격거리별 주택피해 분석결과\n\n□ 경북 산불 지역 거리별 주택피해 현황(산림피해지 외)\n\n ○ 경북 산불 피해 주택(3,081호) 중 산불피해지(산지) 외 피해 주택* (1,669호)\n   대상 공간정보 분석\n   ※ 산불피해지 분석은 연구원 재난정보연구실 위성영상 분석결과 활용\n   ※ 주택피해 현황은 재난구호과 주택피해 현황 자료 활용\n    * 피해 주택 중복 주소, 오기입 주소, 500m 이상 지역 현장점검 결과 1,412호 제외\n\n ○ 피해 주택의 산불피해지(산림)에서 떨어진 거리 분석결과\n\n  - 피해 주택 1,669호의 이격거리 분석결과 평균 99.6m이며, 빈도 중앙값은\n   67.3m, 표준편차 92.9m로 나타남.\n\n                             < 피해 주택 이격거리 요약 >\n\n    구분                평균값            중앙값             최대/최소          빈도 높은 값\n\n   거리(m)              99.6           67.3          497.3 / 0.03           127.3\n\n                             < 피해 주택 이격거리 요약 >\n 거리 구간               50 -    100 -   150 -   200 -     250 -      300 -      400 -\n           0 - 50\n  (m)                100      150     200     250       300        400        500\n 건수(호)      615      471      231     124     82         62        56         28\n 누적 비율\n           36.8%    65.1%    78.9%   86.3%   91.3%     95.0%      98.3%     100.0%\n  (%)\n\n\n                    < 피해 산림 인접 지역 주택피해(거리별) 현황 >"}, {"p": 653, "t": "               Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n참고6   산불 대비 국민 행동요령"}, {"p": 654, "t": "  참고7      관련 법령\n\n                   < 재난 및 안전관리 기본법 >\n\n제3조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n  9의3. “안전취약계층”이란 어린이, 노인, 장애인, 저소득층 등 신체적･사회적･경제적 요인으로 인\n   하여 재난에 취약한 사람을 말한다.\n\n제25조의4(재난관리책임기관의 장의 재난예방조치 등) ① 재난관리책임기관의 장은 소관 관리 대상\n 업무의 분야에서 재난 발생을 사전에 방지하기 위하여 다음 각 호의 조치를 하여야 한다.\n  1. 재난에 대응할 조직의 구성 및 정비\n  2. 재난의 예측 및 예측정보 등의 제공･이용에 관한 체계의 구축\n  3. 재난 발생에 대비한 교육･훈련과 재난관리예방에 관한 홍보\n  4. 재난이 발생할 위험이 높은 분야에 대한 안전관리체계의 구축 및 안전관리규정의 제정\n  5. 제26조에 따라 지정된 국가핵심기반의 관리\n  6. 제27조제2항에 따른 특정관리대상지역에 관한 조치\n  7. 제29조에 따른 재난방지시설의 점검･관리\n  7의2. 제34조에 따른 재난관리자원의 관리\n  8. 그 밖에 재난을 예방하기 위하여 필요하다고 인정되는 사항\n\n제36조(재난사태 선포) ① 행정안전부장관은 대통령령으로 정하는 재난이 발생하거나 발생할 우려가\n  있는 경우 사람의 생명･신체 및 재산에 미치는 중대한 영향이나 피해를 줄이기 위하여 긴급한 조\n  치가 필요하다고 인정하면 중앙위원회의 심의를 거쳐 재난사태를 선포할 수 있다. 다만, 행정안전\n  부장관은 재난상황이 긴급하여 중앙위원회의 심의를 거칠 시간적 여유가 없다고 인정하는 경우에\n  는 중앙위원회의 심의를 거치지 아니하고 재난사태를 선포할 수 있다.\n\n  ② 행정안전부장관은 제1항 단서에 따라 재난사태를 선포한 경우에는 지체 없이 중앙위원회의 승\n  인을 받아야 하고, 승인을 받지 못하면 선포된 재난사태를 즉시 해제하여야 한다.\n\n  ③ 제1항에도 불구하고 시･도지사는 관할 구역에서 재난이 발생하거나 발생할 우려가 있는 등\n  대통령령으로 정하는 경우 사람의 생명･신체 및 재산에 미치는 중대한 영향이나 피해를 줄이기\n  위하여 긴급한 조치가 필요하다고 인정하면 시･도위원회의 심의를 거쳐 재난사태를 선포할 수 있\n  다. 이 경우 시･도지사는 지체 없이 그 사실을 행정안전부장관에게 통보하여야 한다."}, {"p": 655, "t": "                              Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n ④ 제3항에 따른 재난사태 선포에 대한 시･도위원회 심의의 생략 및 승인 등에 관하여는 제1항\n 단서 및 제2항을 준용한다. 이 경우 “행정안전부장관”은 “시･도지사”로, “중앙위원회”는 “시･도위\n 원회”로 본다.\n ⑤ 행정안전부장관 및 지방자치단체의 장은 제1항 또는 제3항에 따라 재난사태가 선포된 지역에\n 대하여 다음 각 호의 조치를 할 수 있다.\n\n 1. 재난경보의 발령, 재난관리자원의 동원, 위험구역 설정, 대피명령, 응급지원 등 이 법에 따른\n   응급조치\n 2. 해당 지역에 소재하는 행정기관 소속 공무원의 비상소집\n 3. 해당 지역에 대한 여행 등 이동 자제 권고\n 4. 「유아교육법」 제31조, 「초･중등교육법」 제64조 및 「고등교육법」 제61조에 따른 휴업명령 및\n   휴원･휴교 처분의 요청\n 5. 그 밖에 재난예방에 필요한 조치\n ⑥ 행정안전부장관 또는 시･도지사는 재난으로 인한 위험이 해소되었다고 인정하는 경우 또는 재\n 난이 추가적으로 발생할 우려가 없어진 경우에는 선포된 재난사태를 즉시 해제하여야 한다.\n\n제40조(대피명령) ① 시장･군수･구청장과 지역통제단장(대통령령으로 정하는 권한을 행사하는 경우\n 에만 해당한다. 이하 이 조에서 같다)은 재난이 발생하거나 발생할 우려가 있는 경우에 사람의 생\n 명 또는 신체나 재산에 대한 위해를 방지하기 위하여 필요하면 해당 지역 주민이나 그 지역 안에\n 있는 사람에게 대피하도록 명하거나 선박･자동차 등을 그 소유자･관리자 또는 점유자에게 대피시\n 킬 것을 명할 수 있다. 이 경우 미리 대피장소를 지정할 수 있다.\n\n ② 제1항에 따른 대피명령을 받은 경우에는 즉시 명령에 따라야 한다.\n\n제41조(위험구역의 설정) ① 시장･군수･구청장과 지역통제단장(대통령령으로 정하는 권한을 행사하\n 는 경우에만 해당한다. 이하 이 조에서 같다)은 재난이 발생하거나 발생할 우려가 있는 경우에 사\n 람의 생명 또는 신체에 대한 위해 방지나 질서의 유지를 위하여 필요하면 위험구역을 설정하고,\n 응급조치에 종사하지 아니하는 사람에게 다음 각 호의 조치를 명할 수 있다.\n 1. 위험구역에 출입하는 행위나 그 밖의 행위의 금지 또는 제한\n 2. 위험구역에서의 퇴거 또는 대피\n ② 시장･군수･구청장과 지역통제단장은 제1항에 따라 위험구역을 설정할 때에는 그 구역의 범위\n 와 제1항제1호에 따라 금지되거나 제한되는 행위의 내용, 그 밖에 필요한 사항을 보기 쉬운 곳에\n 게시하여야 한다. ③ 관계 중앙행정기관의 장은 재난이 발생하거나 발생할 우려가 있는 경우로서\n 사람의 생명 또는 신체에 대한 위해 방지나 질서의 유지를 위하여 필요하다고 인정되는 경우에는\n 시장･군수･구청장과 지역통제단장에게 위험구역의 설정을 요청할 수 있다."}, {"p": 656, "t": "제42조(강제대피조치) ①시장･군수･구청장과 지역통제단장(대통령령으로 정하는 권한을 행사하는\n 경우에만 해당한다. 이하 이 조에서 같다)은 제40조제1항에 따른 대피명령을 받은 사람 또는 제\n 41조제1항제2호에 따른 위험구역에서의 퇴거나 대피명령을 받은 사람이 그 명령을 이행하지 아니\n 하여 위급하다고 판단되면 그 지역 또는 위험구역 안의 주민이나 그 안에 있는 사람을 강제로 대피\n 또는 퇴거시키거나 선박･자동차 등을 견인시킬 수 있다.\n  ② 시장･군수･구청장 및 지역통제단장은 제1항에 따라 주민 등을 강제로 대피 또는 퇴거시키기\n  위하여 필요하다고 인정하면 관할 경찰관서의 장에게 필요한 인력 및 장비의 지원을 요청할 수\n  있다.\n  ③ 제2항에 따른 요청을 받은 경찰관서의 장은 특별한 사유가 없는 한 이에 응하여야 한다.\n\n제44조(응원) ① 시장･군수･구청장은 응급조치를 하기 위하여 필요하면 다른 시･군･구나 관할 구역\n 에 있는 군부대 및 관계 행정기관의 장, 그 밖의 민간기관･단체의 장에게 재난관리자원의 지원\n 등 필요한 응원(應援)을 요청할 수 있다. 이 경우 응원을 요청받은 군부대의 장과 관계 행정기관의\n 장은 특별한 사유가 없으면 요청에 따라야 한다.\n  ② 제1항에 따라 응원에 종사하는 사람은 그 응원을 요청한 시장･군수･구청장의 지휘에 따라 응\n  급조치에 종사하여야 한다.\n\n\n                       < 산림보호법 >\n\n제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n\n  1. “산림보호구역”이란 산림에서 생활환경ㆍ경관의 보호와 수원(水源) 함양, 재해 방지 및 산림유\n    전자원의 보전ㆍ증진이 특별히 필요하여 지정ㆍ고시한 구역을 말한다.\n  2. “생태숲”이란 산림생태계가 안정되어 있거나 산림생물 다양성이 높아 특별히 현지내 보전ㆍ관\n    리가 필요한 숲을 말한다.\n  3. “산림병해충”이란 산림에 있는 식물과 산림이 아닌 지역에 있는 수목(「농어업재해대책법」 제2\n    조제4호에 따른 농작물은 제외한다)에 해를 끼치는 병과 해충을 말한다.\n\n  4. “예찰”이란 산림병해충이 발생할 우려가 있거나 발생한 지역에 대하여 발생 여부, 발생정도,\n    피해 상황 등을 조사하거나 진단하는 것을 말한다.\n  5. “방제”란 산림병해충이 발생하지 아니하도록 예방하거나, 이미 발생한 산림병해충을 약화시키\n    거나 제거하는 모든 활동을 말한다."}, {"p": 657, "t": "                           Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n6. “예찰･방제기관”이란 산림병해충의 예찰ㆍ방제를 하는 지방자치단체나 산림청 소속 기관을 말\n  한다.\n6의2. “수목진료”란 수목의 피해를 진단ㆍ처방하고, 그 피해를 예방하거나 치료하기 위한 모든\n 활동을 말한다.\n\n6의3. “나무의사”란 수목진료를 담당하는 사람으로서 제21조의6제1항에 따라 나무의사 자격증을\n 발급받은 사람을 말한다.\n6의4. “수목치료기술자”란 나무의사의 진단ㆍ처방에 따라 예방과 치료를 담당하는 사람으로서 제\n 21조의6제2항에 따라 수목치료기술자 자격증을 발급받은 사람을 말한다.\n6의5. “나무병원”이란 수목진료 사업을 하려는 자로서 제21조의9제2항에 따라 등록증을 발급받\n 은 자를 말한다.\n7. “산불”이란 산림이나 산림에 잇닿은 지역의 나무ㆍ풀ㆍ낙엽 등이 인위적으로나 자연적으로 발\n  생한 불에 타는 것을 말한다.\n8. “산불방지”란 산불을 예방하고 진화하는 모든 활동을 말한다.\n9. “산불유관기관”이란 산불방지 업무와 관련되는 중앙행정기관과 그 소속 기관 등 대통령령으로\n  정하는 기관을 말한다.\n10. “산사태”란 「사방사업법」 제2조제5호에 따른 산사태를 말한다.\n11. “산사태예방”이란 산사태의 발생이 우려되는 지역에 대하여 미리 대처하여 막는 모든 활동을\n   말한다.\n12. “산사태유관기관”이란 산사태예방 업무와 관련되는 중앙행정기관과 그 소속 기관 등 대통령\n   령으로 정하는 기관을 말한다.\n\n13. “산사태취약지역”이란 산사태로 인하여 인명 및 재산 피해가 우려되는 지역으로 제45조의8에\n   따라 지정ㆍ고시한 지역을 말한다. 다만, 「급경사지 재해예방에 관한 법률」 제2조제1호의 급\n   경사지 및 제2호의 붕괴위험지역, 「도로법」 제10조의 도로, 「시설물의 안전 및 유지관리에\n   관한 특별법」 제2조제1호의 시설물에 관하여는 적용하지 아니한다.\n14. “산사태정보체계”란 산사태 위험등급을 구분하여 제공하고, 산사태의 발생 위험 정도를 분석\n   하여 알려주는 일련의 체계를 말한다."}, {"p": 658, "t": "                         < 의료법 >\n\n 제3조(의료기관) ①이 법에서 “의료기관”이란 의료인이 공중(公衆) 또는 특정 다수인을 위하여 의료ㆍ\n   조산의 업(이하 “의료업”이라 한다)을 하는 곳을 말한다.\n  ② 의료기관은 다음 각 호와 같이 구분한다.\n  1. 의원급 의료기관: 의사, 치과의사 또는 한의사가 주로 외래환자를 대상으로 각각 그 의료행위를\n    하는 의료기관으로서 그 종류는 다음 각 목과 같다.\n   가. 의원\n   나. 치과의원\n   다. 한의원\n\n  2. 조산원: 조산사가 조산과 임산부 및 신생아를 대상으로 보건활동과 교육ㆍ상담을 하는 의료기관\n    을 말한다.\n  3. 병원급 의료기관: 의사, 치과의사 또는 한의사가 주로 입원환자를 대상으로 의료행위를 하는 의료\n    기관으로서 그 종류는 다음 각 목과 같다.\n   가. 병원\n\n   나. 치과병원\n   다. 한방병원\n   라. 요양병원(「장애인복지법」 제58조제1항제4호에 따른 의료재활시설로서 제3조의2의 요건을 갖춘\n     의료기관을 포함한다. 이하 같다)\n\n   마. 정신병원\n   바. 종합병원\n     ③ 보건복지부장관은 보건의료정책에 필요하다고 인정하는 경우에는 제2항제1호부터 제3호까\n     지의 규정에 따른 의료기관의 종류별 표준업무를 정하여 고시할 수 있다."}, {"p": 659, "t": "                             Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n                      < 사회복지사업법 >\n\n제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n 1. “사회복지사업”이란 다음 각 목의 법률에 따른 보호ㆍ선도(善導) 또는 복지에 관한 사업과 사회\n   복지상담, 직업지원, 무료 숙박, 지역사회복지, 의료복지, 재가복지(在家福祉), 사회복지관 운영,\n   정신질환자 및 한센병력자의 사회복귀에 관한 사업 등 각종 복지사업과 이와 관련된 자원봉사활동\n   및 복지시설의 운영 또는 지원을 목적으로 하는 사업을 말한다.\n  가. 「국민기초생활 보장법」\n  나. 「아동복지법」\n  다. 「노인복지법」\n\n  라. 「장애인복지법」\n  마. 「한부모가족지원법」\n  바. 「영유아보육법」\n\n  사. 「성매매방지 및 피해자보호 등에 관한 법률」\n  아. 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」\n  자. 「성폭력방지 및 피해자보호 등에 관한 법률」\n\n  차. 「입양특례법」\n  카. 「일제하 일본군위안부 피해자에 대한 생활안정지원 및 기념사업 등에 관한 법률」\n  타. 「사회복지공동모금회법」\n\n  파. 「장애인ㆍ노인ㆍ임산부 등의 편의증진 보장에 관한 법률」\n  하. 「가정폭력방지 및 피해자보호 등에 관한 법률」\n  거. 「농어촌주민의 보건복지증진을 위한 특별법」\n\n  너. 「식품등 기부 활성화에 관한 법률」\n  더. 「의료급여법」\n  러. 「기초연금법」\n  머. 「긴급복지지원법」                                                       제8장\n\n  버. 「다문화가족지원법」\n  서. 「장애인연금법」"}, {"p": 660, "t": "   어. 「장애인활동 지원에 관한 법률」\n   저. 「노숙인 등의 복지 및 자립지원에 관한 법률」\n   처. 「보호관찰 등에 관한 법률」\n   커. 「장애아동 복지지원법」\n   터. 「발달장애인 권리보장 및 지원에 관한 법률」\n   퍼. 「청소년복지 지원법」\n   허. 그 밖에 대통령령으로 정하는 법률\n  2. “지역사회복지”란 주민의 복지증진과 삶의 질 향상을 위하여 지역사회 차원에서 전개하는 사회복\n    지를 말한다.\n  3. “사회복지법인”이란 사회복지사업을 할 목적으로 설립된 법인을 말한다.\n  4. “사회복지시설”이란 사회복지사업을 할 목적으로 설치된 시설을 말한다.\n  5. “사회복지관”이란 지역사회를 기반으로 일정한 시설과 전문인력을 갖추고 지역주민의 참여와 협력\n    을 통하여 지역사회의 복지문제를 예방하고 해결하기 위하여 종합적인 복지서비스를 제공하는 시\n    설을 말한다.\n  6. “사회복지서비스”란 국가ㆍ지방자치단체 및 민간부문의 도움을 필요로 하는 모든 국민에게 「사\n    회보장기본법」 제3조제4호에 따른 사회서비스 중 사회복지사업을 통한 서비스를 제공하여 삶의\n    질이 향상되도록 제도적으로 지원하는 것을 말한다.\n  7. “보건의료서비스”란 국민의 건강을 보호ㆍ증진하기 위하여 보건의료인이 하는 모든 활동을 말한다.\n\n\n                          < 노인복지법 >\n\n 제31조(노인복지시설의 종류) 노인복지시설의 종류는 다음 각호와 같다.\n  1. 노인주거복지시설\n  2. 노인의료복지시설 (노인요양시설, 노인요양공동생활가정)\n  3. 노인여가복지시설\n  4. 재가노인복지시설 (中 주야간보호시설, 단기보호시설)\n  5. 노인보호전문기관\n  6. 「노인 일자리 및 사회활동 지원에 관한 법률」 제9조제1항제2호에 따른 노인일자리지원기관\n  7. 제39조의19에 따른 학대피해노인 전용쉼터"}, {"p": 661, "t": "                            Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n                      < 장애인복지법 >\n\n제58조(장애인복지시설) ① 장애인복지시설의 종류는 다음 각 호와 같다.\n 1. 장애인 거주시설: 거주공간을 활용하여 일반가정에서 생활하기 어려운 장애인에게 일정 기간\n   동안 거주･요양･지원 등의 서비스를 제공하는 동시에 지역사회생활을 지원하는 시설\n\n 2. 장애인 지역사회재활시설 : 장애인을 전문적으로 상담ㆍ치료ㆍ훈련하거나 장애인의 일상생활,\n   여가활동 및 사회참여활동 등을 지원하는 시설\n 3. 장애인 직업재활시설 : 일반 작업환경에서는 일하기 어려운 장애인이 특별히 준비된 작업환경에\n   서 직업훈련을 받거나 직업 생활을 할 수 있도록 하는 시설(직업훈련 및 직업 생활을 위하여 필요\n   한 제조ㆍ가공 시설, 공장 및 영업장 등 부속용도의 시설로서 보건복지부령으로 정하는 시설을\n   포함한다)\n 4. 장애인 의료재활시설: 장애인을 입원 또는 통원하게 하여 상담, 진단･판정, 치료 등 의료재활\n   서비스를 제공하는 시설\n\n 5. 그 밖에 대통령령으로 정하는 시설\n ② 제1항 각 호에 따른 장애인복지시설의 구체적인 종류와 사업 등에 관한 사항은 보건복지부령으로\n 정한다."}, {"p": 662, "t": "   < 정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률(정신건강복지법) >\n\n 제3조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다.\n  1. “정신질환자”란 망상, 환각, 사고(思考)나 기분의 장애 등으로 인하여 독립적으로 일상생활을 영\n    위하는 데 중대한 제약이 있는 사람을 말한다.\n  2. “정신건강증진사업”이란 정신건강 관련 교육ㆍ상담, 정신질환의 예방ㆍ치료, 정신질환자의 재활,\n    정신건강에 영향을 미치는 사회복지ㆍ교육ㆍ주거ㆍ근로 환경의 개선 등을 통하여 국민의 정신건\n    강을 증진시키는 사업을 말한다.\n  3. “정신건강복지센터”란 정신건강증진시설, 「사회복지사업법」에 따른 사회복지시설(이하 “사회복\n    지시설”이라 한다), 학교 및 사업장과 연계체계를 구축하여 지역사회에서의 정신건강증진사업 및\n    제33조부터 제38조까지의 규정에 따른 정신질환자 복지서비스 지원사업(이하 “정신건강증진사업\n    등”이라 한다)을 하는 다음 각 목의 기관 또는 단체를 말한다.\n\n   가. 제15조제1항부터 제3항까지의 규정에 따라 국가 또는 지방자치단체가 설치ㆍ운영하는 기관\n   나. 제15조제6항에 따라 국가 또는 지방자치단체로부터 위탁받아 정신건강증진사업등을 수행하\n     는 기관 또는 단체\n  4. “정신건강증진시설”이란 정신의료기관, 정신요양시설 및 정신재활시설을 말한다.\n  5. “정신의료기관”이란 다음 각 목의 어느 하나에 해당하는 기관을 말한다.\n   가. 「의료법」에 따른 정신병원\n   나. 「의료법」에 따른 의료기관 중 제19조제1항 후단에 따른 기준에 적합하게 설치된 의원\n   다. 「의료법」에 따른 병원급 의료기관에 설치된 정신건강의학과로서 제19조제1항 후단에 따른\n     기준에 적합한 기관\n  6. “정신요양시설”이란 제22조에 따라 설치된 시설로서 정신질환자를 입소시켜 요양 서비스를 제공\n    하는 시설을 말한다.\n  7. “정신재활시설”이란 제26조에 따라 설치된 시설로서 정신질환자 또는 정신건강상 문제가 있는\n    사람 중 대통령령으로 정하는 사람(이하 “정신질환자등”이라 한다)의 사회적응을 위한 각종 훈련\n    과 생활지도를 하는 시설을 말한다.\n\n  8. “동료지원인”이란 정신질환자등에 대한 상담 및 교육 등의 역할을 수행할 수 있도록 정신질환자\n    이거나 정신질환자이었던 사람 중 보건복지부령으로 정하는 동료지원인 양성과정을 수료한 사람\n    을 말한다."}, {"p": 663, "t": "                            Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n                   < 응급의료에 관한 법률 >\n\n제16조(재정지원) ① 국가 및 지방자치단체는 예산의 범위에서 응급의료기관등 및 응급의료시설에 대\n 하여 필요한 재정 지원을 할 수 있다.\n ② 국가 및 지방자치단체는 제47조의2에 따른 자동심장충격기 등 심폐소생을 위한 응급장비를 갖추\n 어야 하는 시설 등에 대하여 필요한 재정 지원을 할 수 있다.\n\n ③ 국가 및 지방자치단체는 「재난 및 안전관리 기본법」 제3조제1호에 따른 재난이 발생한 상황에서\n 환자의 이송, 전원, 치료 등을 지원한 응급의료기관등에 대하여 필요한 재정 지원을 할 수 있다.\n [시행일: 2026. 5. 12.]"}]}]}]}</script>
<script>
const CFG  = JSON.parse(document.getElementById('guide-cfg').textContent);
const DATA = JSON.parse(document.getElementById('guide-data').textContent);
const CHANGES    = CFG.changes    || [];
const HIGHLIGHTS = CFG.highlights || [];
const UNIT = CFG.unitLabel || '장';   // 대분류 호칭(장/부/편)

/* ── state ── */
let S = {view:'home', ch:DATA.chapters[0].no, sec:0, sub:-1, terms:[], fs:1, hc:false};
const LSKEY='dash-pref-'+(CFG.slug||'doc');
try{ const sv=localStorage.getItem(LSKEY); if(sv){const o=JSON.parse(sv); S.fs=o.fs??1; S.hc=!!o.hc;} }catch(e){}

const FS=[[15,12],[17,13.5],[19,15.5],[22,18]];
function applyPref(){
  const f=FS[S.fs]||FS[1];
  document.documentElement.style.setProperty('--fs',f[0]+'px');
  document.documentElement.style.setProperty('--fs-pre',f[1]+'px');
  document.body.classList.toggle('hc',S.hc);
  document.getElementById('hcBtn').setAttribute('aria-pressed',String(S.hc));
  try{localStorage.setItem(LSKEY,JSON.stringify({fs:S.fs,hc:S.hc}));}catch(e){}
}
document.getElementById('fPlus').onclick=()=>{S.fs=Math.min(3,S.fs+1);applyPref();};
document.getElementById('fMinus').onclick=()=>{S.fs=Math.max(0,S.fs-1);applyPref();};
document.getElementById('hcBtn').onclick=()=>{S.hc=!S.hc;applyPref();};

/* ── helpers ── */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rxesc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hilite(t,terms){
  let h=esc(t);
  if(terms.length){
    const rx=new RegExp('('+terms.map(rxesc).join('|')+')','gi');
    h=h.replace(rx,'<mark>$1</mark>');
  }
  return h;
}
function chapter(no){return DATA.chapters.find(c=>c.no===no);}
function pagesOf(sec,subIdx){
  if(sec.subs&&sec.subs.length){
    if(subIdx>=0) return sec.subs[subIdx].pages;
    return sec.subs.flatMap(s=>s.pages);
  }
  return sec.pages||[];
}
function findLoc(p){
  for(const c of DATA.chapters) for(let i=0;i<c.sections.length;i++){
    const s=c.sections[i];
    if(p>=s.start&&p<=s.end){
      if(s.subs&&s.subs.length){
        for(let j=0;j<s.subs.length;j++) if(p>=s.subs[j].start&&p<=s.subs[j].end) return {ch:c.no,sec:i,sub:j};
      }
      return {ch:c.no,sec:i,sub:-1};
    }
  }
  return null;
}

/* ── search index ── */
const INDEX=[];
for(const c of DATA.chapters) for(let i=0;i<c.sections.length;i++){
  const s=c.sections[i];
  const push=(pg,subIdx,subT)=>INDEX.push({ch:c.no,chT:c.title,sec:i,secT:s.title,sub:subIdx,subT,p:pg.p,t:pg.t,low:pg.t.toLowerCase()});
  if(s.subs&&s.subs.length) s.subs.forEach((sb,j)=>sb.pages.forEach(pg=>push(pg,j,sb.title)));
  else (s.pages||[]).forEach(pg=>push(pg,-1,null));
}

/* ── tabs ── */
const TABS=[['home','홈']];
if(CHANGES.length) TABS.push(['changes',CFG.changesTab||'개정사항']);
TABS.push(['browse',CFG.browseTab||'목차별 열람']);
(CFG.quickTabs||[]).forEach((qt,i)=>TABS.push(['quick'+i,qt.label]));

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
    `<button class="tab ${S.view===k||(S.view==='reader'&&k==='browse')||(S.view==='search'&&k==='home')?'on':''}" data-v="${k}">${l}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(v==='browse'){go({view:'reader',ch:S.view==='reader'?S.ch:DATA.chapters[0].no,sec:S.view==='reader'?S.sec:0,sub:-1});}
    else if(v.startsWith('quick')){const qt=CFG.quickTabs[+v.slice(5)];go({view:'reader',ch:qt.ch,sec:qt.sec||0,sub:-1});}
    else go({view:v});
  });
}

function go(patch){
  S={...S,...patch};
  if(!('terms' in patch)) S.terms=[];
  render();
  window.scrollTo({top:0});
}

/* ── views ── */
function vHome(){
  const totSec=DATA.chapters.reduce((a,c)=>a+c.sections.length,0);
  const tiles=[
    `<div class="stat" role="listitem"><div class="n">${DATA.chapters.length}개 ${UNIT}</div><div class="l">${CFG.chapterTileLabel||'대분류'}</div></div>`,
    `<div class="stat" role="listitem"><div class="n">${totSec}개 절</div><div class="l">${CFG.sectionTileLabel||'세부 항목'}</div></div>`,
    `<div class="stat" role="listitem"><div class="n">${DATA.totalPages}쪽</div><div class="l">원문 전체 수록</div></div>`,
  ];
  if(CHANGES.length) tiles.push(`<div class="stat" role="listitem"><div class="n">${CHANGES.length}개</div><div class="l">${CFG.changesTileLabel||'개정 항목'}</div></div>`);
  return `
  <div class="stats" role="list">${tiles.join('')}</div>
  ${HIGHLIGHTS.length?`
  <div class="h2">${CFG.highlightsTitle||'주요 내용 하이라이트'} <span class="cnt">— 카드를 누르면 원문으로 이동</span></div>
  <div class="hl-grid">
    ${HIGHLIGHTS.map(h=>`<div class="hl" data-p="${h.p}" tabindex="0" role="button">
      <div class="t">${h.t}</div><div class="d">${h.d}</div><div class="p">원문 ${h.p}쪽 →</div></div>`).join('')}
  </div>`:''}
  <div class="h2">${CFG.browseTitle||'목차별 열람'} <span class="cnt">— ${UNIT}을 누르면 절 단위 원문 열람</span></div>
  <div class="ch-grid">
    ${DATA.chapters.map(c=>`<div class="chcard" data-ch="${c.no}" tabindex="0" role="button">
      <span class="no">제${c.no}${UNIT}</span>
      <h3>${c.title}</h3>
      <div class="pg">원문 ${c.start}~${c.end}쪽 · ${c.sections.length}개 절</div>
      <ul>${c.sections.slice(0,4).map(s=>`<li>${s.title}</li>`).join('')}${c.sections.length>4?`<li>… 외 ${c.sections.length-4}개 절</li>`:''}</ul>
    </div>`).join('')}
  </div>`;
}

function vChanges(){
  const src=CFG.changesSource||{};
  const srcPages=src.ch?pagesOf(chapter(src.ch).sections[src.sec||0],-1):[];
  return `
  <div class="h2">${CFG.changesTitle||'개정사항 색인'} <span class="cnt">— ${CHANGES.length}개 항목</span></div>
  ${CFG.changesNote?`<div class="notice">${CFG.changesNote}</div>`:''}
  <div style="overflow-x:auto"><table class="chgtable">
    <thead><tr><th>구분</th><th>항목</th><th>주요 내용</th><th style="white-space:nowrap">바로가기</th></tr></thead>
    <tbody>${CHANGES.map(c=>`<tr>
      <td class="code">${c.code||''}</td>
      <td class="nm">${c.name}</td>
      <td style="font-size:.92em">${c.note||''}</td>
      <td style="white-space:nowrap">
        ${c.p1?`<button class="gobtn" data-goto-p="${c.p1}">원문 ${c.p1}${c.p2>c.p1?'~'+c.p2:''}쪽</button><br>`:''}
        ${c.ch?`<button class="gobtn" data-goto-sec="${c.ch}:${c.sec||0}">본문 제${c.ch}${UNIT}</button>`:''}
      </td></tr>`).join('')}
    </tbody></table></div>
  ${srcPages.length?`<div class="h2">${CFG.changesSourceTitle||'개정 대조표 원문 전체'}</div>${readerPages(srcPages,[])}`:''}`;
}

function sideTree(){
  return `<div class="side" aria-label="목차">${DATA.chapters.map(c=>{
    const open=c.no===S.ch;
    return `<button class="chh" data-ch="${c.no}"><span>제${c.no}${UNIT} ${c.title}</span><span class="ar">${open?'▾':'▸'}</span></button>
    ${open?`<div class="secs">${c.sections.map((s,i)=>{
      const on=i===S.sec;
      let html=`<button class="sec ${on&&S.sub<0?'on':''}" data-sec="${c.no}:${i}">${s.title} <span style="opacity:.65;font-size:.85em">p.${s.start}</span></button>`;
      if(on&&s.subs&&s.subs.length){
        html+=s.subs.map((sb,j)=>`<button class="sec sub ${S.sub===j?'on':''}" data-sub="${c.no}:${i}:${j}">${sb.title}</button>`).join('');
      }
      return html;
    }).join('')}</div>`:''}`;
  }).join('')}</div>`;
}

function pdfLink(p){
  if(!CFG.pdfUrl) return '';
  const n=p+(CFG.pdfOffset||0);
  return ` <a class="pdflink" href="${CFG.pdfUrl}#page=${n}" target="_blank" rel="noopener" `+
    `title="원문 PDF를 새 탭에서 엽니다. PC 브라우저에서는 해당 쪽으로 바로 이동합니다(휴대폰은 1쪽부터 열릴 수 있음).">원문 PDF ↗</a>`;
}
function readerPages(pages,terms){
  return pages.map(pg=>`<div class="pageblock" id="p${pg.p}">
    <div class="pagehead"><span>원문 ${pg.p}쪽${pdfLink(pg.p)}</span><span>${DATA.title}</span></div>
    <pre>${hilite(pg.t,terms)}</pre></div>`).join('');
}

function vReader(){
  const c=chapter(S.ch), s=c.sections[S.sec];
  const pages=pagesOf(s,S.sub);
  const subT=(S.sub>=0&&s.subs)?s.subs[S.sub].title:null;
  const flat=[]; DATA.chapters.forEach(cc=>cc.sections.forEach((ss,i)=>flat.push([cc.no,i,`제${cc.no}${UNIT} · ${ss.title}`])));
  const cur=flat.findIndex(f=>f[0]===S.ch&&f[1]===S.sec);
  const prev=flat[cur-1],next=flat[cur+1];
  return `<div class="reader">
    ${sideTree()}
    <div class="content">
      <div class="crumb">제${c.no}${UNIT} ${c.title} ${subT?'· '+s.title:''}</div>
      <h2 class="title">${subT||s.title}</h2>
      <div class="range">원문 ${pages.length?pages[0].p+'~'+pages[pages.length-1].p:'-'}쪽 · ${pages.length}쪽 분량 ${s.subs&&s.subs.length&&S.sub<0?'· 세부항목 '+s.subs.length+'개(왼쪽 목차에서 선택)':''}</div>
      ${readerPages(pages,S.terms)}
      <div class="secnav">
        <button ${prev?'':'disabled style="visibility:hidden"'} data-nav="${prev?prev[0]+':'+prev[1]:''}">← ${prev?prev[2]:''}</button>
        <button ${next?'':'disabled style="visibility:hidden"'} data-nav="${next?next[0]+':'+next[1]:''}">${next?next[2]:''} →</button>
      </div>
    </div></div>`;
}

function vSearch(){
  const terms=S.terms;
  if(!terms.length) return '<p>검색어를 입력하세요.</p>';
  const hits=[];
  for(const e of INDEX){
    if(terms.every(t=>e.low.includes(t.toLowerCase()))) hits.push(e);
    if(hits.length>=300) break;
  }
  const shown=hits.slice(0,200);
  return `
  <div class="h2">검색 결과</div>
  <div class="rescount">"<b>${esc(terms.join(' '))}</b>" — ${hits.length>=300?'300건 이상':hits.length+'건'} (쪽 단위${hits.length>200?', 상위 200건 표시':''})</div>
  ${shown.length? shown.map(e=>{
    const pos=e.low.indexOf(terms[0].toLowerCase());
    const a=Math.max(0,pos-70), b=Math.min(e.t.length,pos+130);
    const snip=(a>0?'… ':'')+e.t.slice(a,b).replace(/\s+/g,' ')+(b<e.t.length?' …':'');
    return `<div class="sr" data-jump="${e.p}" tabindex="0" role="button">
      <div class="loc">제${e.ch}${UNIT} ${e.chT} › ${e.secT}${e.subT?' › '+e.subT:''} · 원문 ${e.p}쪽</div>
      <div class="snip">${hilite(snip,terms)}</div></div>`;
  }).join('') : '<p>일치하는 내용이 없습니다. 단어를 줄이거나 다른 표현으로 검색해 보세요.</p>'}`;
}

/* ── render & events ── */
function render(){
  renderTabs();
  const m=document.getElementById('main');
  if(S.view==='home')m.innerHTML=vHome();
  else if(S.view==='changes')m.innerHTML=vChanges();
  else if(S.view==='reader')m.innerHTML=vReader();
  else if(S.view==='search')m.innerHTML=vSearch();
  bind(m);
}
function jumpToPage(p,terms){
  const loc=findLoc(p);
  if(!loc)return;
  S={...S,view:'reader',ch:loc.ch,sec:loc.sec,sub:loc.sub,terms:terms||[]};
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById('p'+p);
    if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-70);}
  });
}
function bind(m){
  m.querySelectorAll('[data-ch]').forEach(el=>{
    el.onclick=()=>go({view:'reader',ch:+el.dataset.ch,sec:0,sub:-1});
  });
  m.querySelectorAll('.chcard').forEach(el=>{
    el.onkeydown=e=>{if(e.key==='Enter')el.click();};
  });
  m.querySelectorAll('[data-sec]').forEach(el=>el.onclick=()=>{const[a,b]=el.dataset.sec.split(':');go({view:'reader',ch:+a,sec:+b,sub:-1});});
  m.querySelectorAll('[data-sub]').forEach(el=>el.onclick=()=>{const[a,b,c]=el.dataset.sub.split(':');go({view:'reader',ch:+a,sec:+b,sub:+c});});
  m.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{const[a,b]=el.dataset.nav.split(':');go({view:'reader',ch:+a,sec:+b,sub:-1});});
  m.querySelectorAll('[data-p],[data-jump]').forEach(el=>{
    const p=+(el.dataset.p||el.dataset.jump);
    el.onclick=()=>jumpToPage(p, el.dataset.jump?S.terms:[]);
    el.onkeydown=e=>{if(e.key==='Enter')el.click();};
  });
  m.querySelectorAll('[data-goto-p]').forEach(el=>el.onclick=()=>jumpToPage(+el.dataset.gotoP,[]));
  m.querySelectorAll('[data-goto-sec]').forEach(el=>el.onclick=()=>{const[a,b]=el.dataset.gotoSec.split(':');go({view:'reader',ch:+a,sec:+b,sub:-1});});
}
function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q)return;
  S.terms=q.split(/\s+/).filter(Boolean).slice(0,5);
  S.view='search';
  render();window.scrollTo({top:0});
}
document.getElementById('qbtn').onclick=doSearch;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

applyPref();
render();
</script>
</body>
</html>
