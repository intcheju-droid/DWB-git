  4,057,900\n* ’26년 사회복지시설 종사자 인건비 가이드라인 반영"}, {"p": 527, "t": "                               Ⅱ. 장애인생산품 판매시설 종사자 인건비 보조기준\n\n\n          [표 2] 2026년 장애인생산품판매시설 종사자 수당 [지원기준]\n                                                                 (단위：천원)\n 수당의 종류       지급대상                지급액                 지급회수 및 지급일\n            재직 중인 종사자                             기본급의 60%씩 연 2회, 설과 추석이\n  명절휴가비    (육아휴직, 병가휴직 등       기본급의 120%          속한 달의 보수지급일(또는 설과 추석\n             장기휴직 제외)                             전 15일 이내에 시설의 장이 정한 날)\n\n                           - 배우자 : 월 40,000원\n                           - 배우자 및 자녀를 제외한\n                             부양가족(직계존속·비속 등)         매월 급여 지급일에 지급\n             부양가족이 있는\n  가족수당                       : 1명당 월 20,000원      (이외 세부기준은 공무원 보수 등의\n               종사자\n                           - 자녀 : 첫째 월 50,000원,         업무지침 준용)\n                            둘째 월 80,000원, 셋째\n                            이후 자녀 월 120,000원\n\n                           - (연장근로) 통상임금의\n                            50% 이상 가산\n                           - (야간근로) 통상임금의\n                            50% 이상 가산\n            규정된 근무시간 외     - (8시간 이내 휴일근로) 통상                              제5장\n   시간외                                            시간외근무를 한 다음달 보수 지급일\n           연장･야간･휴일 근로를     임금의 50% 이상 가산\n  근무수당                                               (단, 12월은 당월에 지급)\n              한 종사자        - (8시간 초과 휴일근로) 통상\n                            임금의 100% 이상 가산\n                           * 연장·휴일 및 야간근로\n                            시간당 월 통상임금의\n                            1/209 기준으로 산정\n※ 2009년부터 공무원의 ‘정근수당’, ‘정액급식비’, ‘직급보조비’를 포함하여 사회복지시설 종사자의 각 호봉에             시\n  기본급화 함\n※ 위 권고 수당 중 명절휴가비가 통상임금에 포함됨. 이외 별도 지급 수당이 있는 경우 수당의 성격에\n  따라 통상임금 산정범위 별도 판단 필요"}, {"p": 528, "t": " ○ 법정근로수당 등 보조 관련\n\n  - 시·도지사 및 시장·군수·구청장은 시간외근무수당 등 제수당, 퇴직금, 4대\n    보험 등의 경우 근로기준법 및 개별법령을 준수할 수 있도록 시설에 지도\n\n  - 시간외근무 수당의 인정은 객관적으로 확인 가능한 시스템에 의해 관리되어야 함\n    ※ 단, 법인대표 겸 시설장은 사업주의 지위에 있으므로 시간외근무수당 및 퇴직적립금의 지급\n      대상 아님\n    ※ 휴일 근무의 경우 평일 대체휴무 권장\n\n ○ 기타 행정사항\n\n  - 그 외 지급대상, 호봉 획정 및 승급·승진 등에 관한 인건비 지원 세부기준은\n    당해연도 「사회복지시설 종사자 인건비 가이드라인」, 「당해연도 사회복지\n    시설 관리안내」 등을 참고하고, 시설이 근로기준법 등 관계법령을 준수할 수\n    있도록 지도요망\n\n  - 시설장, 사무국장에 대한 직책보조비를 지원할 수 있음\n\n\n나. 휴직시 각종 수당 등 지급여부\n\n ○ 공무상 질병휴직：제수당 등을 지급\n\n ○ 기타 사유에 의한 휴직：명절휴가비는 지급기준일(설날, 추석) 현재 휴직중인\n   경우 지급하지 아니함\n\n\n 5 퇴직금의 지급 및 관리\n\n    ｢근로기준법｣ 및 ｢근로자퇴직급여보장법｣ 참조"}, {"p": 529, "t": "                             Ⅱ. 장애인생산품 판매시설 종사자 인건비 보조기준\n\n\n 6 사용자부담금 보조기준\n\n 사용자부담금은 사용자인 법인 등이 관계 법령에 따라 부담하여야 하는 법정\n 경비로서 시·도지사는 시설이 4대보험 관련 관계기관에 직접 확인하도록 하여\n 과오납 사례가 없도록 지도하여야 함\n\n\n           [ 장애인생산품판매시설 사용자부담금 지원 및 집행기준 ]\n\n  구    분                  지 원 기 준                        근거규정\n\n  건강보험료                                                국민건강보험법\n                        보수월액×7.19%×1/2\n   부담금                                                (시행령 제44조)\n\n 노인장기요양           건강보험료×(장기요양보험료율(0.9448%)/          노인장기요양보험법\n 보험료 부담금             건강보험료율(7.19%))×1/2               (시행령 제4조)\n\n                                                         국민연금법\n  국민연금                                               (법 제88조 및 부칙\n                 기준소득월액×9.5%×1/2 (18~60세 미만)\n  부담금                                                 (법률 제20903호,      제5장\n                                                     2025.4.2.)제4조 참조\n 퇴직금적립금                                                근로자퇴직급여           장\n                          임금총액×1/12\n  부담금                                                  보장법 제20조\n                                                      고용보험 및             산\n  고용보험료               (실업급여) 월급여총액×1.8%*×1/2       산업재해보상보험의             품\n   부담금     * ’22.7월 이후(고용안정/직업능력개발) 상시근로자 수에 따라 차등 보험료징수 등에              판\n                                                       관한 법률             시\n  산재보험료       시설별 생산품에 따른 산업재해보장보험의 보험료 징수에         (시행령 제12조 ,\n   부담금                      따른 요율 적용                   제13조)             영\n\n※ 고용보험료는 사업장 근로자 수에 따라 차등 적용되므로 관련기관 확인필요\n☞ “[참고자료 1] 장애인 직업재활시설 종사자 인건비 지원기준”의 2) 사용자부담금 참조"}, {"p": 530, "t": " 7   육아휴직 대체인력에 대한 국고지원\n\n ○ 시설종사자 중 육아휴직 대체인력에 대해 해당 직원(종사자)의 인건비 범위\n     내에서 인건비 지원 실시\n\n ○ 지급대상：자녀를 양육하기 위하여 30일 이상 휴직한 남·녀 시설종사자를\n     대체하는 인력\n\n ○ 지급기간：휴직일로부터 최초 1년 이내\n\n\n 8 유급병가 제도\n\n ○ 지방자치단체의 장 또는 운영법인·시설의 장은 다음 각 호의 어느 하나에\n     해당하는 경우, 장애인생산품 판매시설 종사자에게 자율적으로 정하는 범위\n     에서 유급병가를 허가할 수 있음. 단, ‘자율적으로 정하는 범위’는 최소 연\n     30일 이상이 될 것을 권고\n\n     가. 질병이나 부상으로 인하여 직무를 수행할 수 없을 때\n\n     나. 감염병에 걸려 그 종사자의 출근이 다른 종사자의 건강에 영향을 미칠\n        우려가 있을 경우\n\n ○ 병가 일수가 연간 6일을 초과하는 경우, 의사의 진단서를 첨부하여야 함\n\n ○ ’25년 12월을 기준으로 지자체 또는 시설별로 자체 운영중인 유급병가 제도가\n     있는 경우, 본 내용을 근거로 종전에 비해 유급병가의 기간·조건 등이 종사자\n     에게 불리하게 변경되지 않도록 주의할 것\n     ※ 유급병가 제도의 세부적인 운영에 대해서는 지자체·시설별 개별 지침을 등을 마련하여 운영할 수 있음"}]}, {"title": "Ⅲ. 장애인생산품 판매시설 기능보강", "start": 531, "end": 536, "subs": [], "pages": [{"p": 531, "t": "                            Ⅲ. 장애인생산품 판매시설 기능보강\n\n\n    Ⅲ    장애인생산품 판매시설 기능보강\n\n\n1   목적\n\n○ 장애인생산품 판매 촉진을 위해 필요한 장애인생산품 판매시설의 설비 및\n    인프라를 지원함.\n\n\n2 근거법령\n\n○ 「장애인복지법」 제21조(직업), 제57조(장애인복지시설의 이용 등), 제79조\n    (비용부담), 제81조(비용 보조) 및 같은 법 시행령 제44조(비용 보조)\n\n○ 「보조금 관리에 관한 법령」, 「지방자치단체 보조금 관리에 관한 법령」, 「국고\n    보조금 통합관리지침」, 「보건복지부소관 국고보조금 관리규정」, 「보조사업              제5장\n    정산보고서 작성지침」, 「보조사업 정산보고서 검증지침」, 「보조사업자 정보\n    공시 세부기준」, 「보조사업자 회계감사 세부기준」 등\n3 지원대상 및 지원조건\n○ 지원대상：장애인생산품판매시설\n○ 지원조건：국비 50%, 지방비 50%(필요시 지방비 추가 지원 가능)\n\n\n4 지원방향\n\n○ 장애인생산품과 서비스·용역의 판매 촉진에 기여하는 사업 우선 고려\n\n○ 산발성, 임시방편을 지양하고 사업의 효과성과 시급성을 고려하여 지원\n\n○ 기 지원 기능보강사업의 집행실적이 저조한 시설은 지원대상에서 배제"}, {"p": 532, "t": " 5 지원분야 및 예산\n\n                 지원분야                  2026년 예산(국비)\n\n                         신축\n   장애인직업재활시설 및           증축\n   장애인생산품판매시설                            7,997백만원\n     기능보강사업             개보수\n                        장비보강\n\n\n 6 사업내용\n\n가. 정의\n\n ○ 신축：건축물이 없는 대지(기존 건축물이 철거되거나 멸실된 대지를 포함)에\n   시설을 새로이 건축하거나, 기존 건축물을 증축 또는 개보수하여 신규 시설을\n   설치하는 것\n   ※ 기존 건축물 증개축시 지원단가는 당초 신축사업 지원기준보다 감액될 수 있음\n\n ○ 증개축：기존 시설이 있는 대지에 건축물의 면적, 층수 또는 높이를 늘리거나,\n   기존 건축물의 일부를 철거하고 그 대지에 종전과 같은 규모의 범위에서\n   건축물을 다시 축조\n\n ○ 개보수：건축물의 노후화 억제 및 기능향상 등을 위해 시설 건물의 내·외부를\n   수선 또는 변경하는 것\n\n ○ 장비보강：장애인생산품 판매 등 관련 장비를 확충하는 것"}, {"p": 533, "t": "                                        Ⅲ. 장애인생산품 판매시설 기능보강\n\n\n나. 국비 지원단가(천원 미만 절사)\n\n  구분            판매시설                           비고\n                                  ∙ 시설의 전부 신축은 시설당 1회만 지원\n  신축    980㎡(최대)×1,790,000원×50%\n                                  ∙ 토지구입비는 지원하지 않음\n\n  증축     434㎡(최대)×895,000원×50%    ∙ 토지구입비는 지원하지 않음\n\n                                  ∙ 시설안전 등 긴급성 및 생산품 관련 특수성이 인정될\n 개보수     245㎡(최대)×897,000원×50%      경우 실 소요단가 적용 가능\n                                  ∙ 자가건물에 한하여 지원(임자건물은 지원대상 아님)\n                                  ∙ 시설안전 등 긴급성 및 생산품 관련 특수성이 인정될\n장비보강      35,000,000원×50% 내외\n                                    경우 실 소요단가 적용 가능\n※ 잔여예산 등에 대해 실시하는 추가지원 사업의 경우 지원 대상 및 범위, 단가 등을 달리 적용 할 수 있음.\n\n\n다. 지원기간 ： 단년도 사업\n\n라. 지원대상 시설 선정시 고려사항\n\n 1) 공통사항\n\n 가) 건축물 준공연도, 기능보강 지원 추진계획을 고려하여 우선순위 선정\n  - 시설별 형평성을 고려하고 시설관리에 따른 도덕적 해이 방지\n  - 최근 3년간 기능보강사업비 지원내용·규모 및 향후 추진계획\n 나) 시설여건 및 환경변화에 따른 사업의 시급성 고려\n  - 시설노후도(전기·소방정기점검 및 안전진단서 확인 등), 매출액 증가 여부,\n    시설기능변화 및 용도변경 등\n 다) 사업금액의 적절성：도면 및 내역서 확인, 시장 조사(표준품셈)\n\n 2) 우선고려\n\n 가) 지진 등 자연재해 및 화재와 같은 재난 대비 예방(안전) 및 피해복구사업\n\n 나) 시설유지를 위해 관련 제법규(「건축법」, 「소방시설법」, 「장애인등편의법」,\n       「사회복지사업법」 등 사회복지시설 관련 법령) 요건을 확보하기 위한 사업"}, {"p": 534, "t": " 3) 지원분야별 고려사항\n\n  구분                            검 토 사 항\n        ∙ 신축 필요 타당성(인원 및 시설 규모의 적절성, 접근 용이성 등)\n        ∙ 설치지역 민원 발생 가능성 조사 여부 및 조치계획\n        ∙ 사업추진 의지(법인의 자부담･계획(외부 컨설팅 수행여부 및 내용 포함), 지방자치단체의 의견･\n  신축\n          현장점검 실시 등)\n        ∙ 부지가 보조사업자의 소유임을 확인할 수 있는 등기부등본, 토지대장\n        ∙ 최소 설비기준, 장애인편의시설 설치 기준 충족 확인을 위한 도면\n        ∙ 현재 시설의 규모, 사업량, 직원현황, 공간부족 실태 등 검토\n        ∙ 향후 증개축 부분에서 수행하게 될 사업의 구체성 및 효과성 검토\n 증개축    ∙ 사업 확장 등을 위한 기능보강 신청 시 국고보조사업 수행계획서에 동 사업으로 기대되는 매출\n          증대 효과 등을 수치와 통계 등으로 구체적 명시여부\n        ∙ 부지가 보조사업자의 소유임을 확인할 수 있는 등기부등본, 토지대장\n        ∙ 노후시설 및 비용절감을 위한 개보수 (에너지절감 및 안전확보 등)\n        ∙ 시설안전진단 결과 보수대상 시설 (전기, 승강기, 소방, 구조 등)\n 개보수\n        ∙ 장애인 편의시설 설치 및 보완\n        ∙ 기존 시설이 보조사업자의 소유임을 확인할 수 있는 등기부등본\n\n        ∙ 차량교체의 경우 내용연수 경과 후 아래 요건 충족시 우선지원\n          - 주행거리 120,000km이상 노후차량\n          - 예상 수리비가 현재 차량가격의 50%를 초과하는 차량\n        ∙ 그 외 장비의 경우 장비명, 소요량, 사업비 및 사용용도, 배치공간 확보여부, 매출 수익 및 근로장애인\n  장비      임금 증대 등 향후 효과성 검토\n  보강    ∙ 사업 확장, 추가 설비 도입 및 업종 변경 등을 위한 기능보강 신청시 국고보조 사업 수행계획서에\n          동 사업으로 기대되는 장애인 고용확대, 임금수준 향상, 매출 증대 효과 등을 수치와 통계 등으로\n          구체적 명시여부\n        ∙ 장비 노후 등 교체를 목적으로 지원된 사업은 향후 완료 실적보고서 제출시 기존 장비의 처분\n          내용을 포함하여 보고\n\n\n마. 사업계획서 작성 시 유의사항\n\n 1) 시설 기준면적은 건물 뿐 아니라 물류 창고 등 생산품목에 따른 소요 공간\n   면적도 포함하여 산정한다.\n\n 2) 사업수행기관은 신청한 보조금 외에도 최대한 재원을 확보하여 사업비를\n   분담하려는 노력을 기울여야 한다."}, {"p": 535, "t": "                          Ⅲ. 장애인생산품 판매시설 기능보강\n\n\n7   지원대상 선정기준 및 지원배제 항목\n\n4.5 ‘장애인직업재활시설 기능보강’ 참조\n\n\n8 국고보조금 신청 등\n\n4.5 ‘장애인직업재활시설 기능보강’ 참조\n\n\n9 사업시행 및 관리절차\n\n4.5 ‘장애인직업재활시설 기능보강’ 참조\n\n\n10 사업실적 관리절차\n\n4.5 ‘장애인직업재활시설 기능보강’ 참조\n11 행정사항\n4.5 ‘장애인직업재활시설 기능보강’ 참조"}]}]}, {"no": 6, "title": "장애인 의료재활시설 운영", "start": 537, "end": 546, "sections": [{"title": "Ⅰ. 장애인 의료재활시설 운영", "start": 539, "end": 546, "subs": [], "pages": [{"p": 539, "t": "                                           Ⅰ. 장애인 의료재활시설 운영\n\n\n     Ⅰ    장애인 의료재활시설 운영\n\n\n 1   목적\n\n 장애인을 위한 의료재활사업을 효율적으로 수행하기 위하여 사회복지법인 등\n 비영리법인 부설 의료재활시설(이하 “재활병･의원”3)이라 한다)의 운영에 필요한\n 사항을 정함.\n\n\n 2 기본방침\n\n 재활병･의원장은 당 시설을 운영함에 있어 의료관계 법령과 장애인 복지관련\n 법령이 정하는 바에 따라 장애인 의료재활을 위하여 최선의 서비스를 제공\n\n\n 3 주요사업\n\n ○ 입원 및 통원, 낮 병원을 통한 장애인 진료                                           제6장\n\n ○ 장애의 진단 및 포괄적이고 전문적인 재활치료\n ○ 장애인에 대한 의료재활상담\n ○ 장애인의 기타 질환에 대한 진단 및 치료\n ○ 장애인보조기구의 제작, 판매, 검수 및 수리\n ○ 장애인 재활 및 재발 방지에 관한 교육\n ○ 장애인 등록을 위한 진단\n\n\n3) 의원은 의료법 개정 이전(ʼ09.1.30) 개설･신고된 시설에 한함"}, {"p": 540, "t": " 4 진 료\n\n ○ 진료대상\n\n  - 장애인을 우선으로 하며 진료상 여유가 있을 경우에는 지역주민을 대상으로\n   일반인에 대한 진료를 행할 수 있음.\n\n  - 재활병･의원은 다음 각호의 1에 해당하는 자는 무료로 진료\n\n    ∙ 의료급여법 제3조 규정에 의한 수급권자\n\n    ∙ 시장･군수･구청장이 특별히 무료진료가 필요하다고 인정한 환자\n\n ○ 진료기간\n\n  - 재활병･의원 입원진료 기간은 6개월 미만으로 하되, 치료의 경과상 연장\n    진료가 필요한 경우에는 주치의의 소견서에 따라 진료기간을 연장할 수 있음.\n\n ○ 이용신청\n\n  - 재활병･의원에서 무료진료를 받고자 하는 장애인은 다음 각호에 해당하는\n   서류를 재활병･의원에게 제출하여 진료를 신청하여야 함. 다만, 유료 진료\n   대상자는 장애인등록증 사본과 건강보험증 제시만으로 구비서류를 갈음할\n   수 있음.\n\n    ∙ 장애인등록증 사본\n\n    ∙ 의료급여법 제8조에 의한 의료급여증(제시)\n\n    ∙ 시･군･구청장의 무료진료 추천서(해당자에 한함)"}, {"p": 541, "t": "                          Ⅰ. 장애인 의료재활시설 운영\n\n\n5 진료비의 징수 및 사용\n\n○ 진료비 징수\n\n- 유료진료 대상자에 대한 진료비 징수는 국민건강보험법 등 관계법령에 의한\n  요양급여 수가를 기준으로 적용\n\n○ 의료급여대상 장애인에 대하여는 재가환자에 한하여 의료급여수가를 기준하여\n 징수하고, 그 징수는 의료급여진료비 청구절차에 의하여 징수\n\n○ 진료비의 사용\n\n- 재활병･의원 진료비 수입금은 반드시 수입과 지출예산에 편성하고 그에\n  따라 집행하여야 하며, 이는 해당 재활병･의원의 운영비로만 사용\n\n○ 운영비\n\n- 운영비는 해당년도 예산 범위 내에서 지방비보조금 외에 자체수입으로\n  충당함\n\n\n6 인사위원회\n○ 직원 인사관리의 공정을 기하기 위하여 자체인사위원회를 반드시 구성 운영\n○ 위원회는 위원장을 포함하여 3명 이상 7명 이하의 위원으로 구성함.\n○ 위원장은 재활병･의원장이 되고 위원은 운영위원회 위원과 재활병･의원의              의\n 간부 중에서 위원장이 위촉한 자\n○ 위원회 심의 사항\n- 소속직원 임면에 관한 사항\n\n- 소속직원 근무평정에 관한 사항\n\n- 소속직원 승진 및 상벌에 관한 사항"}, {"p": 542, "t": "     - 기타 재활병･의원장이 필요하다고 인정하는 사항\n\n ○ 각 재활병･의원은 본 지침을 기준으로 한 자체인사위원회 운영규정과 인사\n     관리 규정을 제정하여 직원관리에 공정성과 효율성을 확보\n\n\n 7    직원 임면 등\n\n ○ 원내의 합리적인 인사 운영을 위하여 직무의 난이성, 해당직위가 필요로\n     하는 자격, 해당 직위의 책임의 정도 등을 기준으로 하여 재활병･의원의 운영\n     규정에 의한 직위와 직종을 분류할 수 있음.\n\n ○ 재활병･의원장은 당해 법인 대표이사가 임면하고, 기타 소속 직원은 재활병･\n     의원장이 임면\n\n ○ 직원의 채용은 공개경쟁 채용을 원칙으로 하나, 해당분야에 특수한 전문적\n     지식･능력 또는 자격이 필요하거나 직무의 특수성 등 특별한 사유로 공개\n     경쟁 채용이 부적당한 경우에는 인사위원회의 심의를 거쳐 특별채용 할 수\n     있으며 장애인 고용증대 차원에서 일정자격을 갖춘 장애인이 채용되도록\n     적극 노력\n\n ○ 의료기술직, 기능직, 고용직을 신규 채용하는 경우에는 계약직이나 임시직으로\n     채용할 수 있음.\n\n ○ 정원직원배치기준(지방비 지원기준)의 총 정원을 변경하고자 하는 때에는\n     자치단체장을 경유, 시장 또는 도지사와 사전 협의를 하여야 함. 다만,\n     인건비를 지방비보조금으로 지급하지 아니하는 직원에 대하여는 그러하지\n     아니할 수 있음."}, {"p": 543, "t": "                           Ⅰ. 장애인 의료재활시설 운영\n\n\n8 보수지급기준\n\n○ 봉 급\n\n- 임용된 직원의 보수는 해당년도 사회복지시설 관리안내에서 정한 기준\n  (사회복지종사자 보수체계 중 복지관 보수지급체계 준용)을 참고하여 예산의\n  범위 안에서 가감하여 지급\n\n- 전문의료인력과 같이 사회복지시설 관리안내에서 정한 기준을 적용할 수\n  없는 경우에는 개별시설 또는 지자체가 보수기준을 따로 정하여 예산의 범위\n  안에서 지급할 수 있음.\n\n○ 호봉획정 및 승급\n\n- 호봉획정 및 승급은 임용권자가 시행하고, 장애인의료재활시설을 관할하는\n  자치단체장이 직원의 재직관련 서류 등을 통해 이를 확인\n\n- 근무경력은 군복무경력(무관후보생경력은 제외), 사회복지시설 직원의\n  관련분야 근무경력, 관련법령에 의한 의료인･의료기사･약사･영양사･간호\n  조무사의 관련분야 근무경력, 공무원의 관련분야 근무경력으로 함.\n  다만, 지방자치단체 및 운영법인의 재정사정 등에 따라 군복무경력을 제외한\n  나머지 근무경력은 호봉합산을 일정기간 배제할 수 있음.\n\n- 사회복지 이용시설(복지관) 종사자 보수체계를 따르는 경우, 초임호봉은\n  1호봉을 원칙으로 하되, 치료사･간호사･임상병리사･방사선기사･영양사･\n  약사･의무기록사 및 의지･보조기기사의 경우 4년제 대학교 졸업자는 4급              료\n  2호봉, 전문대학 졸업자는 4급 1호봉을 적용하고, 근무경력이 있는 경우에는           시\n  경력 1년을 1호봉씩으로 하여 획정\n○ 기타 사항은 해당 지자체가 마련한 지침에 따름"}, {"p": 544, "t": " 9 기타 참고사항\n\n ○ 장애인 의료재활시설 기능보강 사업은 해당년도 장애인복지(거주)시설 기능보강\n   사업안내를 준용하여 추진 (단, 신축 지원은 불가하며, 국고보조비율 : 30%)\n   * 의료장비의 경우 시설의 필요성을 고려하여 [별표 1]의 목록의 장비를 우선 구매하여야 함\n   * 보조금 집행：국고보조금통합관리시스템 사용 관련 사항은 ｢장애인직업재활시설 기능보강｣ 국고\n     보조금의 관리 및 집행 참고\n\n ○ 장애인보조기구의 제작, 판매, 검수 및 수리 관련 사업 추진시 장애인복지법,\n   의료기기법, 국민건강보험법 등 관련 법령을 준수하여야 함.\n\n ○ 장애인복지법 제58조 개정(개정 ʼ11.3.30, 시행 ʼ12.3.31) 이후, 장애인의료\n   재활시설의 설치 등 운영 전반에 관한 기본적 사항은 지역사회재활시설 공통\n   운영 지침을 준용"}, {"p": 545, "t": "                                              Ⅰ. 장애인 의료재활시설 운영\n\n\n[별표 1] 의료재활시설에서 우선 보유하여야 할 의료장비 목록\n\n  ○ 전동기립 훈련기\n  ○ 스탠딩 테이블\n  ○ 치료용 계단\n  ○ 치료용 매트(보바스테이블 포함)\n  ○ 치료용볼(치료용 롤 포함)\n  ○ 평행봉(P-bar)\n  ○ 재활치료용 트레드밀\n  ○ 전기자극 치료기(FES)\n  ○ 삼킴재활용 전기자극치료기\n  ○ 기침 유발기(cough assist)\n  ○ 슬링을 이용한 재활치료기기(탈체중부하 보행훈련기 포함)\n  ○ 전산화 인지재활치료기기\n  ○ 편측 시각 무시 평가도구총점\n  ○ Hand Dynamometer\n  ○ Jebsen 손기능 평가도구\n  ○ Pinch gauge\n  ○ Pegboard\n  ○ Two point discriminator(또는 Semmens-Weinstein monofilament)\n  ○ 손가락 운동판 또는 Manuplation board (콘센트, 문, 자물쇠 등 모음판)\n  ○ 기타 일상생활 동작연습 기구(세면기, 좌변기 등)\n  ○ 식사연습기구\n  ○ 고빈도 흉벽진동기\n  ○ 소아용 자세유지기구\n  ○ 베일리 발달 평가도구\n  ○ 덴버 발달 평가도구\n  ○ MVPT(Motor free Visual Perception Test)\n  ○ LOTCA(Lowenstein Occupational Therapist’s Cognitive Assessment)"}, {"p": 546, "t": "  ○ 상지보조기 제작도구\n  ○ 등속성 근력 평가도구 또는 등속성 근력 훈련기구\n  ○ Finger goniometer\n  ○ Inclinometer\n  ○ 치료실 비치 석션기\n  ○ 치료실 비치 산소포화도 모니터 장비\n  ○ 균형 훈련판\n  ○ 통증치료장비(ICT, TENS, 레이저치료 등)\n  ○ 하지 에르고미터\n  ○ 작업치료테이블\n  ○ 감각프로파일(SP)"}]}]}, {"no": 7, "title": "장애인 자립생활지원시설 운영", "start": 547, "end": 560, "sections": [{"title": "Ⅰ. 장애인 자립생활지원시설 운영", "start": 549, "end": 560, "subs": [], "pages": [{"p": 549, "t": "                                 Ⅰ. 장애인 자립생활지원시설 운영\n\n\n    Ⅰ    장애인 자립생활지원시설 운영\n\n\n1    시설 개요\n\n가. 목 적\n\n○ 장애인의 자립생활 역량을 강화하기 위하여 동료상담, 지역사회의 물리적･\n    사회적 환경개선사업, 장애인의 권익 옹호･증진, 장애인 적합서비스 등을 제공\n\n나. 근거 법령\n\n○ 「장애인복지법」 제58조~제59조, 동법 시행규칙 제41조~제43조\n\n○ 「장애인복지법」에 별도로 규정이 있는 경우를 제외하고는 「사회복지사업법」을\n    따름\n\n다. 수행 업무\n\n○ 동료상담\n\n○ 장애인 권익옹호 지원\n\n○ 개인별 자립생활 지원\n\n○ 거주시설 장애인 지역사회 자립지원\n    ※ 향후 세부 수행업무 별도 마련 후 통보 예정\n\n2 시설 설치기준\n가. 설치･운영 주체 (「장애인복지법」 제59조)\n○ 국가 또는 지방자치단체, 비영리법인 또는 단체, 개인"}, {"p": 550, "t": "나. 시설 기준 (「장애인복지법 시행규칙」 제43조 및 별표5)\n\n ○ 사무실, 동료상담실, 화장실, 그 밖에 장애인의 자립생활 지원에 필요한 설비를\n   갖추어야 함\n\n다. 종사자 기준 (「장애인복지법 시행규칙」 제43조 및 별표5)\n\n ○ 직원의 배치기준\n\n  - 시설장 1명, 사무국장 1명, 사업수행인력 4명 이상, 행정지원인력 1명을 배치\n   해야 한다. 다만, 2025년 7월 3일 전에 법 제54조 및 이 규칙 제39조의2에\n   따라 설치･운영 중인 장애인자립생활지원센터*로서 장애인 자립생활지원\n   시설로 설치･운영하려는 경우의 직원 배치기준은 시설장 1명, 사무국장 1명\n   및 사업수행인력 1명을 포함한 인력 4명 이상으로 한다.\n   * ’25.7.2. 현재 국가 나 지방자치단체에서 장애인복지법 제54조에 따른 자립생활센터 운영 지원\n     예산을 지원받고 있는 센터가 해당됨\n\n ○ 직원의 자격기준\n\n  - 시설장과 장애동료 상담전문가는 등록장애인이어야 하고, 사업수행인력의 1명\n   이상은 장애동료 상담전문가이어야 한다.\n\n        직종별                      자격기준\n\n              1) 사회복지사 또는 장애인재활상담사 자격이 있는 사람으로서 사회복지 분야\n                에서 5년 이상 종사한 경력이 있는 사람\n              2) 보건복지부장관이 정하는 장애동료 상담전문가 자격 요건을 갖춘 사람으로서\n                장애인복지 분야에서 5년 이상 종사한 경력이 있는 사람\n        시설장   3) 「고등교육법」 제2조제1호부터 제6호까지의 규정에 따른 대학을 졸업했거나\n                법령에 따라 이와 같은 수준으로 인정되는 학력을 갖춘 사람으로서 장애인\n                복지 분야에서 5년 이상 종사한 경력이 있는 사람\n              4) 그 밖에 1)부터 3)까지와 동등 이상의 자격이 있다고 운영위원회에서 인정한\n                사람"}, {"p": 551, "t": "                                Ⅰ. 장애인 자립생활지원시설 운영\n\n\n    직종별                        자격기준\n\n            1) 사회복지사 또는 장애인재활상담사 자격이 있는 사람으로서 장애인복지 또는\n             사회복지 분야에서 3년 이상 종사한 경력이 있는 사람\n            2) 보건복지부장관이 정하는 장애동료 상담전문가 자격 요건을 갖춘 사람으로서\n             장애인복지 분야에서 3년 이상 종사한 경력이 있는 사람\n    사무국장    3) 「고등교육법」 제2조제1호부터 제6호까지의 규정에 따른 대학을 졸업했거나\n             법령에 따라 이와 같은 수준으로 인정되는 학력을 갖춘 사람으로서 장애인\n             복지 분야에서 3년 이상 종사한 경력이 있는 사람\n            4) 그 밖에 1)부터 3)까지와 동등 이상의 자격이 있다고 운영위원회에서 인정한\n             사람\n\n            1) 사회복지사, 장애인재활상담사 자격이 있는 사람\n            2) 보건복지부장관이 정하는 장애동료 상담전문가 자격 요건을 갖춘 사람\n   사업수행인력\n            3) 그 밖에 1) 또는 2)와 동등 이상의 자격이 있다고 운영위원회에서 인정한\n             사람\n\n            전산, 회계 등 시설 운영 지원 업무 수행이 가능하다고 운영위원회에서 인정한\n   행정지원인력\n            사람\n\n\n - 장애동료 상담 전문가는 아래의 요건 중 하나를 갖춘 경우에 자격요건을 갖춘\n  것으로 봄\n\n  ① 장애인 자립생활지원시설 또는 장애인 자립생활지원센터의 동료상담가\n    양성 기초･심화 과정 수료자\n\n  ② 자격기본법에 근거한 민간자격 발급기관에서 발급한 장애인 동료상담관련\n    자격증* 소지자                                                 제7장\n\n   * 장애인당사자간 동료상담을 내용으로 하는 자격증에 한함\n  ③ 기타 ① ~ ②에 준하는 동료상담 관련 교육과정 수료자\n라. 설치신고\n○ 설치신고 및 수리 절차\n - 신고서 제출 : 신고인 → 시설 소재지 관할 시장･군수･구청장"}, {"p": 552, "t": "  - 시장･군수･구청장은 설치기준, 종사자 수 및 자격기준 준수 여부 등을 확인\n   하여 신고수리 여부 결정\n\n  - 장애인복지시설 신고증 교부 : 시장･군수･구청장 → 신고인\n   ※ 장애인 자립생활지원시설 설치 신고수리 시 시장･군수･구청장은 시･도지사를 경유하여 보건\n     복지부장관에게 즉시 보고\n\n                           소재지      운영주체\n        시･도명     시설명                          신고일\n                          (연락처)    (시설장명)\n                                            0000.00.00.\n\n\n 3 종사자 관리\n\n ○ 종사자 채용\n\n  - 보조금(국가 및 지방자치단체)으로 인건비를 지원받는 시설(국가나 지자체로\n   부터 수탁받은 시설 포함)의 시설장 및 종사자 신규채용은 직위와 관계없이\n   공개모집을 원칙으로 함\n\n ○ 종사자 임면보고\n\n  - 설치･운영자는 종사자 임면한 경우에는 그 임면이 있는 달 말일까지 희망이음\n   (사회서비스정보시스템 포함) 또는 서면으로 해당 사실을 시･군･구청장에게\n   임면보고\n\n ○ 시설장 상근 의무(「사회복지사업법」 제35조제1항)\n\n  - 시설장은 상근의무를 준수해야 하므로 시･군･구청장은 수시로 확인해야 함\n\n  - 원칙적으로 상근의무란, 휴일 기타 근무를 요하지 않은 날을 제외하고 일정한\n    근무계획 하에 매일 소정의 근무시간 중 상시 그 직무에 종사하여야 하는\n    것을 말함"}, {"p": 553, "t": "                                Ⅰ. 장애인 자립생활지원시설 운영\n\n\n○ 종사자 복무관리\n\n - 종사자에 대한 노무관리를 함에 있어 ｢근로기준법｣, ｢최저임금법｣, ｢근로자\n  퇴직급여 보장법｣, ｢남녀고용평등과 일･가정 양립지원에 관한 법률｣, ｢국민\n  연금법｣, ｢국민건강 보험법｣, ｢고용보험법｣, ｢산업재해보상보험법｣ 등 노동\n  관계 법령을 준수\n\n\n4 예산 지원(인건비 및 운영비)\n\n가. 국고보조금 예산 지원 및 절차\n\n○ 국고보조금 지원 시설 선정\n\n - 지원요건 : 「장애인복지법」에 따라 설치･신고된 장애인 자립생활지원시설\n ※ 단, ’25.7.3.전에「장애인복지법」 제54조에 따라 운영 중인 장애인자립생활지원센터가 장애인\n   자립생활지원시설의 설치기준, 종사자의 자격기준을 준수한 경우에도 시설 신고를 전제로 국비\n   지원 대상 기관으로 선정 가능\n\n○ 국고보조금 지원 시설 선정 절차\n\n             추진내용                        수행 주체\n\n      국고보조금 지원기관 선정 계획 통보               보건복지부\n\n        신청서 및 사업계획서 제출                 지원 희망기관\n\n      자체심사위원회 개최(우선순위 심사)                 시･도\n     선정심사심의위원회 개최 및 결과 통보               보건복지부\n ※ 선정관련 일정은 시설 운영비 지원 예산 확정 후 별도 통보"}, {"p": 554, "t": "나. 예산 지원 기준\n\n ○ 인건비 지원 기준\n\n  - 보수는 [표 1]의 기본급과 [표 2]의 수당을 지급함\n\n  - 기본급 및 수당의 지급비율을 상향하거나 별도의 수당을 추가로 지급하는\n    경우에는 해당 지방자치단체 및 법인이 기준보조금(국고 및 지방비로서 확정\n    내시된 보조금)외에 별도의 예산을 확보하여 지급하여야 함\n\n  - 시설장 외 종사자는 겸직 불가, 타 보조사업 등을 수행하는 종사자에 대해\n    인건비 지원 불가\n\n    ※ 종사자 호봉 산정을 위한 경력인정 범위\n    ☞ 「사회복지시설 관리 안내」에 따른 사회복지시설 종사자 경력인정 범위를 준용(사회복지시설\n        경력 100%, 유사경력 80%). 단, 장애인복지법 제54조의 장애인자립생활지원센터* 근무 경력에\n        대해서는 100% 인정\n        * 장애인자립생활지원센터의 근무경력은 기본사업을 수행한 경력만 인정(장애인활동지원서비스\n         제공기관 등 선택사업 수행경력은 사회복지시설이 아니므로 80% 인정)"}, {"p": 555, "t": "                                     Ⅰ. 장애인 자립생활지원시설 운영\n\n\n         [표1] 2026년 장애인 자립생활지원시설 종사자 기본급 가이드라인\n                                                     (단위: 원/월)\n      직위       시설장       사무국장          사업수행인력      행정지원인력\n 호봉\n   1호봉       2,477,200   2,360,100     2,281,800   2,232,300\n   2호봉       2,538,600   2,416,400     2,324,300   2,296,400\n   3호봉       2,606,200   2,485,000     2,366,500   2,335,000\n   4호봉       2,712,200   2,553,200     2,411,500   2,380,400\n   5호봉       2,824,500   2,621,900     2,475,400   2,439,000\n   6호봉       2,940,500   2,717,800     2,538,700   2,509,400\n   7호봉       3,061,500   2
