<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 장애인복지시설 사업안내 대시보드</title>
<meta name="description" content="보건복지부 「2026년 장애인복지시설 사업안내」(제Ⅲ권) 원문 기반 · 전체 8개 장 663쪽">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#1c7a44; --accent-deep:#0f5c31; --accent-soft:#e7f4ec; --accent-line:#bfe0cc;
  --ink:#1d2823; --ink-2:#4c5a53; --ink-3:#7b897f;
  --bg:#f4f7f5; --card:#ffffff; --line:#dde5df;
  --chg:#b45309; --chg-soft:#fdf3e3;
  --mark:#ffe9a8;
  --fs:17px; --fs-pre:13.5px;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  font-size:var(--fs); line-height:1.65;
}
body.hc{
  --accent:#ffd400; --accent-deep:#ffd400; --accent-soft:#1a1a1a; --accent-line:#666;
  --ink:#ffffff; --ink-2:#f0f0f0; --ink-3:#cccccc;
  --bg:#000000; --card:#0d0d0d; --line:#555;
  --chg:#ffbf47; --chg-soft:#1f1503;
  --mark:#8a6d00;
}
body.hc a{color:#ffd400}
a{color:var(--accent-deep)}
button{font-family:inherit}

header{
  background:linear-gradient(135deg,var(--accent-deep),var(--accent));
  color:#fff; padding:26px 20px 20px;
}
body.hc header{background:#000;border-bottom:3px solid #ffd400;color:#fff}
.hwrap{max-width:1180px;margin:0 auto}
.htop{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.htitle h1{margin:0;font-size:1.5em;font-weight:900;letter-spacing:-.01em}
.htitle .sub{margin-top:4px;font-size:.82em;opacity:.92}
.hctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.55);color:#fff;
  border-radius:9px;padding:7px 13px;font-size:.85em;font-weight:700;cursor:pointer;
}
.hbtn:hover{background:rgba(255,255,255,.3)}
body.hc .hbtn{background:#000;border-color:#ffd400;color:#ffd400}
.searchrow{max-width:1180px;margin:18px auto 0;display:flex;gap:10px}
#q{
  flex:1;padding:13px 18px;border-radius:12px;border:none;font-size:1em;
  font-family:inherit;box-shadow:0 3px 14px rgba(0,0,0,.18);
}
body.hc #q{border:2px solid #ffd400;background:#111;color:#fff}
#qbtn{border:none;border-radius:12px;padding:0 26px;font-weight:900;font-size:1em;cursor:pointer;background:#fff;color:var(--accent-deep)}
body.hc #qbtn{background:#ffd400;color:#000}

nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px}
.tab{
  border:none;background:none;padding:14px 18px;font-size:.95em;font-weight:700;color:var(--ink-2);
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
}
.tab.on{color:var(--accent-deep);border-bottom-color:var(--accent)}
body.hc .tab.on{color:#ffd400;border-bottom-color:#ffd400}

main{max-width:1180px;margin:0 auto;padding:26px 16px 70px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .n{font-size:1.7em;font-weight:900;color:var(--accent-deep);line-height:1.2}
.stat .l{font-size:.8em;color:var(--ink-2);margin-top:2px}

.h2{font-size:1.15em;font-weight:900;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--accent)}
.h2 .cnt{font-size:.75em;font-weight:700;color:var(--ink-3)}

.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hl{
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chg);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s;
}
.hl:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.hl .t{font-weight:700;font-size:.95em}
.hl .d{font-size:.82em;color:var(--ink-2);margin-top:5px}
.hl .p{font-size:.75em;color:var(--chg);font-weight:700;margin-top:7px}

.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.chcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;cursor:pointer;transition:transform .12s,box-shadow .15s;position:relative;overflow:hidden;
}
.chcard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.14)}
.chcard .no{
  display:inline-block;background:var(--accent-soft);color:var(--accent-deep);
  font-weight:900;font-size:.75em;border-radius:7px;padding:3px 10px;
}
body.hc .chcard .no{background:#000;border:1px solid #ffd400;color:#ffd400}
.chcard h3{margin:10px 0 4px;font-size:1.06em;font-weight:900;letter-spacing:-.01em}
.chcard .pg{font-size:.76em;color:var(--ink-3);font-weight:600}
.chcard ul{margin:10px 0 0;padding:0;list-style:none;font-size:.8em;color:var(--ink-2)}
.chcard li{padding:2.5px 0;border-top:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chcard li:first-child{border-top:none}

.chgtable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:.9em}
.chgtable th{background:var(--accent-soft);color:var(--accent-deep);text-align:left;padding:11px 14px;font-size:.85em}
body.hc .chgtable th{background:#1a1a1a;color:#ffd400}
.chgtable td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.chgtable .code{font-weight:900;color:var(--chg);white-space:nowrap}
.chgtable .nm{font-weight:700}
.gobtn{
  display:inline-block;border:1.5px solid var(--accent-line);background:var(--accent-soft);
  color:var(--accent-deep);border-radius:8px;padding:3px 10px;font-size:.82em;font-weight:700;
  cursor:pointer;margin:2px 4px 2px 0;text-decoration:none;
}
body.hc .gobtn{background:#000;color:#ffd400;border-color:#ffd400}
.notice{
  background:var(--chg-soft);border:1px solid #ecd9b0;border-radius:12px;
  padding:13px 17px;font-size:.86em;color:var(--ink-2);margin:14px 0 22px;
}
body.hc .notice{border-color:#ffbf47}

.reader{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.side{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px;position:sticky;top:64px;max-height:calc(100vh - 90px);overflow-y:auto;
}
.side .chh{
  width:100%;text-align:left;border:none;background:none;padding:10px 10px;font-weight:900;
  font-size:.93em;color:var(--ink);cursor:pointer;border-radius:9px;display:flex;justify-content:space-between;gap:6px;
}
.side .chh:hover{background:var(--accent-soft)}
.side .chh .ar{color:var(--ink-3);font-weight:400}
.side .secs{padding-left:6px}
.side .sec{
  width:100%;text-align:left;border:none;background:none;padding:7px 10px;font-size:.84em;
  color:var(--ink-2);cursor:pointer;border-radius:8px;display:block;line-height:1.4;
}
.side .sec:hover{background:var(--accent-soft)}
.side .sec.on{background:var(--accent);color:#fff;font-weight:700}
body.hc .side .sec.on{background:#ffd400;color:#000}
.side .sub{padding-left:26px;font-size:.8em}
.content{min-width:0}
.crumb{font-size:.82em;color:var(--ink-3);margin-bottom:6px}
.content h2.title{margin:0 0 4px;font-size:1.3em;font-weight:900;letter-spacing:-.01em}
.content .range{font-size:.83em;color:var(--ink-2);margin-bottom:16px}
.pageblock{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.pagehead{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--accent-soft);padding:6px 14px;font-size:.78em;font-weight:900;color:var(--accent-deep);
}
body.hc .pagehead{background:#1a1a1a;color:#ffd400}
.pdflink{
  margin-left:10px;font-weight:700;font-size:.95em;color:var(--accent-deep);
  text-decoration:none;border-bottom:1.5px solid var(--accent-line);
}
.pdflink:hover{border-bottom-color:var(--accent-deep)}
body.hc .pdflink{color:#ffd400;border-bottom-color:#ffd400}
.pageblock pre{
  margin:0;padding:16px 18px;white-space:pre-wrap;word-break:break-all;overflow-x:auto;
  font-family:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  font-size:var(--fs-pre);line-height:1.62;color:var(--ink);
}
mark{background:var(--mark);border-radius:3px;padding:0 2px}
body.hc mark{color:#fff}
.secnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.secnav button{
  border:1.5px solid var(--accent-line);background:var(--card);color:var(--accent-deep);
  border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:.9em;max-width:48%;
}
.secnav button:hover{background:var(--accent-soft)}
body.hc .secnav button{color:#ffd400;border-color:#ffd400}

.sr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 17px;margin-bottom:11px;cursor:pointer}
.sr:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sr .loc{font-size:.78em;font-weight:900;color:var(--accent-deep)}
.sr .snip{font-size:.87em;color:var(--ink-2);margin-top:5px;line-height:1.6}
.rescount{font-size:.9em;color:var(--ink-2);margin:4px 0 16px}

footer{border-top:1px solid var(--line);background:var(--card);padding:22px 16px 34px;margin-top:30px}
.fwrap{max-width:1180px;margin:0 auto;font-size:.8em;color:var(--ink-3);line-height:1.8}

@media(max-width:840px){
  .reader{grid-template-columns:1fr}
  .side{position:static;max-height:260px}
  .htitle h1{font-size:1.2em}
}
@media print{header,nav,.side,.secnav,footer{display:none}}
</style>
</head>

               (장애인복지관)\n지역사회     ○ ｢식품위생법｣에 따라 1회 급식인원(종사자 (삭제)                           지침에 명시     2\n재활시설       포함)이 50명 이상인 장애인 복지관은\n  공통\n(272쪽)     집단급식소 시설기준을 갖추고 설치･운영\n           신고를 하여야 함\n          * 집단급식소 설치 신고 대상임에도 미신고할\n           경우 500만원 이하의 과태료 부과(｢식품\n           위생법｣ 제101조)\n          * 관할지자체는 집단급식소 설치 및 운영을\n           위하여 예산을 지원하도록 노력하여야 하며,\n           상시 근로(주 40시간) 법정필수인력에 대한\n           인건비를 지원할 수 있다.\n\n         ○ 장애인 복지관 등 지역사회재활시설을 ○ 지역사회재활시설을 설치하는 경우에는\n           설치하는 경우에는 시설의 설계 단계부터    시설의 설계 단계부터 장애인복지 관련\n           장애인복지 관련 전문가, 지역장애인 등의   전문가, 지역장애인 등의 의견을 충분히\n           의견을 충분히 수렴함으로써 재가장애인의    수렴함으로써 재가장애인의 특성 및 복지\n           특성 및 복지 욕구에 부합하는 수요자 중심의 욕구에 부합하는 수요자 중심의 시설이\n           시설이 될 수 있도록 하여야 함.       될 수 있도록 하여야 함.\n\n         ○ 특히, 장애인 복지관 및 장애인 체육관 - 특히, 장애인 복지관 및 장애인 체육관\n           등 건축 규모가 큰 지역사회재활시설의    등 건축 규모가 큰 지역사회재활시설의\n           경우 장애인의 이용상 편의성과 접근성    경우 장애인의 이용상 편의성과 접근성\n           등 주변 환경과 입지가 유리한 지점에 건립 등 주변 환경과 입지가 유리한 지점에 건립\n           부지를 확보하여야 함.            부지를 확보하여야 함.\n\n  3-1    5. 지역사회재활시설의 위탁              5. 지역사회재활시설의 위탁    사회복지사업\n 장애인                                                     법령 현행화\n지역사회        (사회복지사업법 제34조제5항 및    (사회복지사업법 제34조제5항 및 동법     및\n재활시설           동법시행규칙 제23조)             시행규칙 제21조2)      사회복지시설\n  공통                                                     관리안내 내용\n(272쪽)   ○ 국가 또는 지방자치단체가 설치한 시설은 ○ 국가 또는 지방자치단체가 설치한 시설은   반영\n          필요한 경우 사회복지법인 또는 장애인복지       필요한 경우 사회복지법인 또는 장애인복지\n          단체 등 비영리법인에게 위탁하여 운영         단체 등 비영리법인에게 위탁하여 운영\n          ※ (신설)                       ※ 국가･지자체 외의 자(법인･개인 등)가\n                                        설치한 시설은 위･수탁 불가"}, {"p": 18, "t": " 사업명              2025년                    2026년 개정              개정사유\n\n       ○ 국가 또는 지방자치단체가 시설을 위탁하여 ○ 국가 또는 지방자치단체가 시설을 위탁하여\n         운영하고자 하는 때에는 다음 각호의 내용이  운영하고자 하는 때에는 다음 각호의 내용이\n         포함된 계약을 체결               포함된 계약을 체결\n       - 수탁자의 성명 및 주소               - 수탁자의 명칭, 주소 및 대표자의 이름\n       - 위탁계약기간                     - 위탁계약기간\n       - 위탁대상시설 및 업무내용              - 위탁대상시설 및 업무내용\n       - 수탁자의 의무 및 준수사항             - 수탁자의 의무 및 준수사항\n       - 시설의 안전관리에 관한 사항            - 시설의 안전관리에 관한 사항\n       - 시설종사자의 고용승계에 관한 사항         - 시설종사자의 고용승계에 관한 사항\n       - 계약의 해지에 관한 사항              - 계약의 해지에 관한 사항\n       - 기타 이용료 징수 등 시설의 운영에 필요 - 기타 이용료 징수 등 시설의 운영에 필요\n         하다고 인정되는 사항              하다고 인정되는 사항\n        ※ (신설)                      ※ 임원의 자격(결격사유 등) 확인 필요, 시설\n                                      위･수탁시 종사자 고용승계가 원칙임\n\n       6. 지역사회재활시설 직원의 임면           (삭제)                         11. 종사자\n                                                                 채용 목차로\n       ○ 지방자치단체에서 직영하는 시설의 직원은                                   이동 및 개별\n         자치단체장이 임면하고, 법인에 위탁운영                                   시설 지침에\n                                                                    규정\n         하거나 법인이 직접 운영하는 시설장은\n         당해 법인 대표이사가 임면하고, 기타 직원은\n         법인의 대표이사 또는 시설장이 임면\n       ○ 직원의 채용은 공개경쟁 채용을 원칙으로\n         한다. 법인 또는 시설에서 독자적이거나\n         공동으로 채용시에는 해당 법인 및 시설\n         홈페이지, 소식지, 지자체 홈페이지 등에\n         채용 관련 사항을 공고한 후 법인 및 시설\n         내규 등에 의해 채용.\n       ○ 또한, 장애인 고용증대 차원에서 일정자격을\n         갖춘 장애인이 우선 채용되도록 적극 노력\n         하되 장애인 복지관의 경우 법정 종사자\n         정원의 최소 10% 이상 채용되도록 노력"}, {"p": 19, "t": "                                             Ⅰ. 2026년 주요 변경 사항\n\n\n 사업명            2025년                      2026년 개정          개정사유       제1장\n       ○ 신규로 설립･운영되는 시설의 경우 직원\n        임용시 지역사회재활시설 직원 보수표의\n        직급별 상･하한 범위 내에서 연봉제로 할\n        수 있다. 다만, 기존 시설 중 연봉제 도입을\n        실시코자 하는 경우는 전직원의 과반수이상\n        동의를 얻어야 한다.\n       ○ 기능직･고용직을 신규 채용하는 경우에는\n        계약직이나 임시직으로 채용 가능\n       ○ 직원의 채용시에는 다음의 서류를 확인･\n        제출 받아야 하고, 경력 등 확인이 필요한\n        경우에는 해당기관에 조회\n\n       - 이력서\n\n       - 주민등록초본(채용 후 가족수당 등 수당\n         신청 필요시 등본 추가 제출)\n\n       - 경력증명 관계서류(경력자에 한함, 초임\n         또는 경력 호봉획정시 근거자료)\n\n       - 자격 또는 면허증 사본(소지자에 한함)\n\n       - 기타 법인의 대표이사나 시설장이 필요\n         하다고 인정하는 서류\n\n       ○ 장애인복지관 직원의 경우, 임용자격 기준은\n        장애인복지법시행규칙 제41조 및 제42조\n        관련 별표 5와 같으며 자격기준 적용은\n        객관적이고 엄정하게 처리\n\n       ○ 시･군･구청장은 장애인복지시설 직원\n        임면보고 및 지도･점검시 종사자 경력\n        사항 및 증빙서류 등을 철저히 확인･관리\n\n3-1 장애인 7. 지역사회재활시설 이용자 요건          6. 지역사회재활시설 운영 기준\n 지역사회\n 재활시설\n   공통\n (273쪽)"}, {"p": 20, "t": " 사업명             2025년           2026년 개정              개정사유\n\n   3-1    (신설)           7. 시설 운영위원회 설치･운영           시설\n  장애인                                               운영위원회\n                            (사회복지사업법 제36조 및 동법 시행규칙\n 지역사회                                               설치･운영\n 재활시설                       제24조, 사회복지시설 관리안내)       명시\n   공통                                                   ※\n  (275~                   「사회복지사업법」에 따라 장애인 지역 「사회복지시설\n 277쪽)                    사회재활시설은 다음과 같이 시설운영 관리안내」\n                                                  준용\n                          위원회를 설치하고 운영하여야 함.\n                          ※ 시장･군수･구청장이 공동으로 운영위원회를\n                            두는 것이 필요하다고 인정하는 경우에는\n                            예외적으로 3개 이내의 시설에 1개 공동\n                            위원회 가능\n\n                         가. 구성\n                         ○ 위원회는 위원장 1인을 포함하여 5인 이상\n                           15인 이하의 위원으로 구성하고, 법 제36조\n                           제2항 각 호 중 같은 호에 해당하는 위원이\n                           2명을 초과해서는 아니 됨\n\n                         ○ 위원회의 위원은 아래에 해당하는 자 중에서\n                           관할 시장･군수･구청장이 임명 또는 위촉\n                         - 시설의 장\n                         - 시설 이용 장애인 대표\n\n                         - 시설 이용 장애인의 보호자 대표\n                         - 시설 종사자의 대표\n                         - 해당 시･군･구 소속의 사회복지업무를\n                           담당하는 공무원\n                         - 후원자 대표 또는 지역주민\n                         - 공익단체에서 추천한 사람\n                          * 공익단체는 ｢비영리민간단체 지원법｣\n                            제2조에 따른 비영리민간단체를 말함\n\n                         - 그 밖에 시설의 운영 또는 사회복지에\n                           관하여 전문적인 지식과 경험이 풍부한 자"}, {"p": 21, "t": "                          Ⅰ. 2026년 주요 변경 사항\n\n\n사업명   2025년             2026년 개정            개정사유     제1장\n               ※ ① 시설장의 친인척, ② 설치･운영자인\n                 법인의 임원 등 특수관계가 명확한 자(시설장             2\n                 제외)는 위원으로 임명･위촉하지 않도록\n                 할 것\n               ※ ｢지방자치법｣ 제43조제5항에 따라 지방\n                 의회의원은 지방자치단체로부터 운영비 등을\n                 보조받는 사회복지사업을 하는 자가 설치･\n                 운영하는 사회복지시설의 운영위원회 위원이\n                 될 수 없음에 유의할 것\n                 (법제처 해석, 17-0433)\n\n              ○ 위원장은 호선, 위원의 임기는 3년으로\n                하되 연임할 수 있고 보궐위원의 임기는\n                전임자의 잔임 기간으로 함\n              나. 심의사항\n              ○ 시설운영계획의 수립･평가에 관한 사항\n              ○ 사회복지프로그램의 개발･평가에 관한\n                사항\n              ○ 시설종사자의 근무환경 개선에 관한 사항\n              ○ 시설이용자의 생활환경 개선 및 고충처리\n                등에 관한 사항\n              ○ 시설 종사자와 이용자의 인권보호 및 권익\n                증진에 관한 사항\n              ○ 시설과 지역사회와의 협력에 관한 사항\n              ○ 그 밖에 시설의 장이 운영위원회의 회의에\n                부치는 사항\n\n              다. 보고사항\n              ○ 시설의 회계 및 예산･결산에 관한 사항\n              ○ 후원금 조성 및 집행에 관한 사항\n              ○ 그 밖에 시설운영과 관련된 사건･사고에\n                관한 사항"}, {"p": 22, "t": " 사업명                   2025년                   2026년 개정             개정사유\n\n                                        ☞ 국가감염병 확산 등 특수한 상황이 있을\n                                          경우, 서면보고로 갈음 가능\n\n                                       라. 운영\n                                       ○ 분기별 1회 이상 정기회의 개최, 운영위원회\n                                         운영규칙에 규정한 회의개최 요건에 해당할\n                                         경우(재적위원 1/3의 요청이 있을 경우\n                                         등) 수시회의 개최\n                                       ○ 회의록을 작성하고, 회의는 시설이용자,\n                                         시설종사자 등에게 공개를 원칙으로 하되,\n                                         개인정보보호 등 불가피한 사유시 위원장이\n                                         비공개 결정을 할 수 있음(비공개사류는\n                                         공개해야 함)\n                                       ○ 회의는 대면심의가 원칙이며 참여자 확인할\n                                         수 있는 원격영상회의는 허용\n\n                                       마. 기타 자세한 사항은 당해연도 「사회복지\n                                          시설 관리안내」 참조\n\n   3-1    12. 이용료 징수                   10. 이용료 징수                     개별\n  장애인                                                               시설(장애인복\n 지역사회     나. 이용료 산정 및 징수절차             나. 이용료 산정 및 징수절차             지관) 지침에\n 재활시설                                                                 명시\n   공통     ○ 이용료는 지방자치단체 위탁 운영시설의 ○ 이용료는 지방자치단체 위탁 운영시설의\n (279쪽)     경우 해당 자치단체장이 정하고, 법인 운영 경우 해당 자치단체장이 정하고, 법인 운영\n            시설의 경우 자체 관련 규정에 의함.    시설의 경우 자체 관련 규정에 의함.\n          ○ 이용료 산정 시 이용자의 경제적 부담을 ○ 이용료 산정 시 이용자의 경제적 부담을\n            고려하여 최소 부담의 원칙으로 하되,     고려하여 최소 부담의 원칙으로 함\n            장애인 복지관의 경우 사단법인 한국장애인\n            복지관협회와 보건복지부가 협의하여 정한\n            ‘이용료 징수액 산정 기준’ 대비 매년 물가\n            상승분을 고려하여 산정할 수 있음.\n           * 한국장애인복지관협회는 5년마다 이용료\n            징수액 산정 기준을 협회 홈페이지 등에 게시\n            하여야 함"}, {"p": 23, "t": "                                         Ⅰ. 2026년 주요 변경 사항\n\n\n사업명               2025년             2026년 개정             개정사유       제1장\n  3-1    14. 종사자 채용시 유의사항   11. 종사자 채용                 종사자\n 장애인                                                 채용관련 규정\n지역사회                        가. 공개모집                     및            2\n재활시설                                                 장애인고용장          2\n  공통                        ○ 시설장 및 종사자 신규 채용은 직위와 려금 사용             6\n(280쪽)                        관계없이 공개모집을 원칙으로 하며, 기타   권고            년\n                              자세한 사항은 당해연도 사회복지시설\n                              관리안내 참조\n                            나. 장애인 고용\n                            ○ 장애인 고용증대 차원에서 일정 자격을\n                              갖춘 장애인이 우선 채용되도록 적극 노력\n                            ○ 장애인 지역사회재활시설 위탁･운영 법인이\n                              운영 중인 시설 종사자의 장애인 고용으로\n                              발생한 장애인 고용장려금 등 외부지원금은\n                              장애인 종사자 임금 등 처우개선, 시설의\n                              운영 개선을 위해 사용하도록 노력\n                            다. 종사자 채용시 유의사항\n\n  3-1     (신설)              15. 보조금 지원 중단             장애인대상\n 장애인                                                 성범죄 등이\n지역사회                        ○ 지방자치단체장은 장애인 대상 범죄 발생한 시설에\n재활시설                          발생･학대, 성폭력･성희롱 사건이 발생 대한 운영\n  공통                                                 보조금 지원\n(284쪽)                        하여 장애인권익옹호기관으로부터 학대 제재 규정 및\n                              판정, 수사기관의 수사 등으로 사회적으로 관련 행정절차\n                                                       등 신설\n                              문제가 된 시설 또는 이를 은폐한 시설은\n                              보조금 지원 중단 및 차년도 지원 선정\n                              대상 배제 등의 조치를 할 수 있다.\n                            - 지방자치단체장은 시설 보조금 지원 중단\n                              등의 처분을 할 경우 「행정절차법」 제21조\n                              및 제22조에 따라 그 처분을 사전통지\n                              하고 당사자의 의견을 청취하여야 함\n                            - 보조금 지원 중단 결정을 한 경우, 이용\n                              장애인의 전원 조사 및 서비스 지원계획\n                              조치를 선 시행하여야 함"}, {"p": 24, "t": " 사업명               2025년             2026년 개정           개정사유\n\n   3-2     (신설)            3. 시설 설치 시 유의사항        지역사회재활\n  장애인                                              시설 공통\n복지관 운영                     ○ 장애인복지관의 설치 계획시에는 건축물의 지침 내\n (286쪽)                                           규정사항 내용\n                             연면적은 장애인복지법시행규칙 제41조\n                                                    이동\n                             및 제42조 관련 별표 5에 따라 최소\n                             1,000㎡ 이상으로 하고 운영에 필요한\n                             최소한의 주차공간을 확보해야 하며,\n                             지역의 장애인 복지관 배치율, 등록장애인\n                             수 및 재정자립도 등을 고려하여 가능한\n                             한 건립 예산의 과도한 부담이 되지 않도록\n                             하여야 함.\n\n                           ○ ｢식품위생법｣에 따라 1회 급식인원(종사자\n                             포함)이 50명 이상인 장애인 복지관은 집\n                             단급식소 시설기준을 갖추고 설치･운영\n                             신고를 하여야 함\n\n                            * 집단급식소 설치 신고 대상임에도 미신고할\n                             경우 500만원 이하의 과태료 부과(｢식품\n                             위생법｣ 제101조)\n\n                            * 관할지자체는 집단급식소 설치 및 운영을\n                             위하여 예산을 지원하도록 노력하여야 하며,\n                             상시 근로(주 40시간) 법정필수인력에 대한\n                             인건비를 지원할 수 있다.\n\n (287쪽)   3. 운영            4. 운영                  지역사회재활\n                                                   시설 공통\n (295쪽)   ○ (신설)           ○ 이용료 산정                 지침 내\n                                                   규정사항\n                            - 사단법인 한국장애인복지관협회와 보건 내용 이동\n                             복지부가 협의하여 정한 ‘이용료 징수액\n                             산정 기준’ 대비 매년 물가상승분을 고려\n                             하여 산정할 수 있음.\n                            * 한국장애인복지관협회는 5년마다 이용료\n                             징수액 산정 기준을 협회 홈페이지 등에 게시\n                             하여야 함"}, {"p": 25, "t": "                                                       Ⅰ. 2026년 주요 변경 사항\n\n\n 사업명                2025년                          2026년 개정                  개정사유    제1장\n   3-2  6. 행정지원사항                7. 행정지원사항                                   현행 제도\n  장애인                                                                        반영 수정\n복지관 운영 라. 각 지방자치단체는 지역사회 최중증 장애인 라. 각 지방자치단체는 지역사회 최중증 장애인\n (302쪽)    돌봄 사각지대가 없도록 장애인복지관과     돌봄 사각지대가 없도록 장애인복지관과\n           함께 [별표2]의 현재 시행되고 있는 예시를         함께 「최중증 발달장애인 통합돌봄서비스\n           활용하여 최중증 장애인 돌봄서비스를              사업 안내」 등을 활용하여 최중증 장애인\n           마련하도록 노력하여야 한다.                  돌봄서비스를 적극 운영할 수 있도록\n                                            노력하여야 한다.\n         [별표2] 장애인복지관의 최중증 장애인 돌봄 (삭제)                                       현행 제도    안\n   기관에서 중앙수어통역센터의 업무를     재정립\n (361쪽)\n                                   전담하는 인력은 상근해야 하며, 중앙수어\n                                   통역센터 업무 외 수탁기관의 다른 업무를\n                                   겸직할 수 없음\n          ○ 인력별 주요업무              ○ 인력별 주요업무\n          ② 종사자 : 수어통역에 관한 정책･제도의 ② 종사자 : 수어통역에 관한 정책･제도의\n            조사, 센터의 운영 지침 수립, 관련 전문 조사 및 연구, 지역 수어통역센터 센터의\n            인력 양성 등 사무 전반에 관한 사항    표준 업무 매뉴얼 개발 및 보급, 지역\n                                    수어통역센터 사업 실적 관리 및 평가,\n                                    지역 수어통역센터 종사자 직무 교육 등\n\n   3-7    6. (신설)                 6. 종사자 채용               중앙수어통역\n 중앙수어                                                      센터 운영\n 통역센터                             ○ 센터장 및 직원은 인사위원회를 구성하여   개선\n   운영                              공개 채용하여 배치하는 것을 원칙으로\n (361쪽)\n                                   함\n                                  - 인사위원회의 구성 및 운영에 관한 사항은\n                                    중앙수어통역센터 운영 규정에 포함하여\n                                    야 함\n                                  - 장애인 대상 학대 및 성범죄 사건이 발생\n                                    하여 수사 기관에 수사 등으로 사회적\n                                    으로 문제가 된 자의 경우 채용 불가"}, {"p": 29, "t": "                                              Ⅰ. 2026년 주요 변경 사항\n\n\n사업명                2025년                    2026년 개정           개정사유      제1장\n                                  ○ 채용 관련 보고\n                                  - 센터장 및 직원을 채용을 하는 경우 채용\n                                    계획 수립 전 보건복지부장관과 협의하고,\n                                    채용 결과는 즉시 보건복지부장관에 보고\n                                    하여야 함\n                                  - 센터장 및 직원 면직 시 즉시 보건복지부\n                                    장관에게 보고하여야 함\n  3-7    7. (신설)                  7. 운영위원회 운영              중앙수어통역\n중앙수어                                                        센터 운영\n통역센터                              ○ 운영위원회는 위원장 1인을 포함하여 5인   개선\n  운영                               으로 구성하여야 하며, 위촉 전 보건복지\n(362쪽)\n                                   부장관과 협의하여야 함\n                                  - 위원회의 위원은 법인 임직원 1인, 지역수어\n                                    통역센터장 1인, 보건복지부 공무원 1인,\n                                    외부 전문가 2인으로 구성함(교수, 장애인\n                                    복지시설 종사자 등으로 구성하되, 수어\n                                    통역센터 종사자 제외)\n                                  ○ 중앙수어통역센터는 운영위원회를 통해\n                                    별도의 운영 규정을 마련하여 복지부장관의\n                                    승인을 받아야 함(개정 시에도 동일)\n\n  3-7    5. 사업내용                  8. 사업내용                중앙수어통역\n중앙수어                                                      센터 업무\n통역센터     - 수어통역에 관한 정책･제도의 조사     - 수어통역에 관한 정책･제도의 조사 및   재정립\n  운영     - 센터의 운영규정, 차량관리규정 등 각종   연구\n(362쪽)\n           내부 규정 제정 및 개폐         - 센터의 표준 업무 매뉴얼 개발 및 보급\n         - 사업의 기획 및 평가, 센터에 대한 자체 - 센터의 사업 실적 관리 및 평가\n           관리･감독                  - 센터 종사자 직무 교육\n         - 센터의 사업실적 관리            - 기타 보건복지부장관이 수어통역서비스의\n         - 기타 센터 업무의 중요한 사항         공공성 제고를 위해 필요하다고 인정하는\n         - 수어통역 관련 전문인력 양성          사업\n\n         - 수어통역센터의 종사자 실무능력 강화를\n           위해 수어교육 실시"}, {"p": 30, "t": " 사업명                 2025년           2026년 개정            개정사유\n\n   3-7    9. (신설)            9. 사업의 보고             중앙수어통역\n 중앙수어                                               센터 운영\n 통역센터                        ○ 중앙수어통역센터는 매년 사업계획서를   개선\n   운영                          수립하여, 전년도 12월 31일까지 보건\n (362쪽)\n                               복지부장관에 보고 후 승인을 받아야 한다.\n                               사업계획서에는 다음의 내용을 포함하여야\n                               한다.\n                             - 인사･조직관리에 관한 사항\n                             - 사업 내용 및 성과 목표 등 세부사업\n                               계획서\n                             - 중앙수어통역센터 운영위원회 및 인사\n                               위원회 구성 등 운영에 관한 사항(지역\n                               수어통역센터 제외)\n                             - 수입･지출예산서\n                             - 중앙수어통역센터 종사자 필수교육 이행\n                               계획\n                             - 그 밖에 보건복지부장관이 필요하다고\n                               인정하는 내용\n                             ○ 중앙수어통역센터는 매년 상반기 추진\n                               실적을 7월 15일까지 보건복지부 장관\n                               에게 보고하여야 하며, 회계연도 종료 후\n                               2개월 내에 전년도 사업실적보고서 및\n                               감사보고서 등을 제출하여야 한다.\n\n   3-7    11. (신설)           11. 위탁 해지                   위탁 해지\n 중앙수어                                                    규정 신설\n 통역센터                        ○ 위탁계약기간 중이라도 다음 어느 하나에\n   운영                          해당하는 경우 위탁을 해지하거나 수탁\n (363쪽)\n                               기관을 변경할 수 있음\n                             - 보조금을 지정 외 다른 용도로 사용한\n                               경우\n                             - 허위 신청이나 기타 부정한 방법으로\n                               보조금을 교부받은 경우"}, {"p": 31, "t": "                                                 Ⅰ. 2026년 주요 변경 사항\n\n\n 사업명              2025년                        2026년 개정           개정사유      제1장\n                                    - 법령(규정), 지침, 보조금 교부결정의 내용\n                                      또는 법령에 의한 보건복지부장관의 처분을\n                                      위반한 경우\n                                    - 그 밖에 보건복지부 장관이 위탁을 해지\n                                      하거나 수탁기관을 변경해야 할 중대하고\n                                      불가피한 사유가 있다고 판단한 경우\n   3-8  2. 사업 주체                2. 설치･운영 주체                      사회복지사업법     내\n수어통역센터                                                           및 사회복지시설\n운영(지역) ○ 사단법인 한국농아인협회 시･도협회에 ○ 지방자치단체                            관리안내 준용\n (364쪽)    [수어통역센터 지역지원본부]를 두며,     - 지방자치단체가 설치한 센터는 사회복지\n           시･군･구지회에 [수어통역센터]를 둔다.     법인 또는 비영리법인에 위･수탁 가능하\n         - 동 단체가 사업을 수행할 수 없는 불가피한    며, 위탁시 공개모집에 의해 수탁자 선정\n           사유가 있는 경우에는 자치단체장이 따로      운영\n           정할 수 있음.\n                                   ○ 사회복지법인 및 비영리법인 등\n         - 단, 신규센터 개소에 따른 소재지 지정은 ※ 광역(시･도) 또는 시･군･구 단위로 설치 가능\n           해당 시･도지사가 협회 시･도협회와 협의      하나 센터 간 업무 범위는 자치단체장과\n           하여 지정하고, 그 결과를 중앙수어통역       협의하여 조정\n           센터(이하“중앙센터”라 한다)에 즉시 보고\n                                     ※ 신규 센터 개소 또는 폐지 시 운영주체는\n           하여야 한다.                     그 결과를 중앙 수어통역센터(이하 “중앙\n                                       센터”라 한다)에 즉시 통보\n\n\n   3-8  3. (신설)                     3. 명칭 사용                지역수어통역\n수어통역센터                                                       센터 명칭\n운영(지역)                              ○ 센터는 아래의 명칭을 사용하여야 하며, 사용 규정\n (364쪽)                               설치･운영 법인의 명칭은 혼용 금지     신설\n\n                                    - 광역 : ○○○○(시･도명) 수어통역센터\n                                     ※ 센터의 기능 등을 고려하여 ‘○○○○(시･\n                                       도명) 수어통역지원센터’ 명칭 사용 가능\n                                       (지자체와 협의)\n\n                                    - 기초 : ○○○(시･군･구명) 수어통역센터"}, {"p": 32, "t": " 사업명              2025년             2026년 개정              개정사유\n\n   3-8  4. 기본방침           4. 기본방침\n수어통역센터\n운영(지역) ○ (신설)             ○ 센터는 시설 운영위원회를 통해 운영 규정  센터\n (365쪽)                                            운영규정에\n                            및 수어통역업무처리규정 등 자체운영 관한 사항\n                            규정을 마련하여 자치단체장(시･도지사    규정\n                            또는 시･군･구청장)에게 보고하여야 함\n                            (개정 시에도 동일)\n                          - 자치단체장은 운영 규정에 개선할 사항이\n                            있다고 판단되는 경우 개선 요구를 할\n                            수 있으며, 개선 요구사항에 대해 수어\n                            통역센터는 개선 조치를 하고 그 결과를\n                            보고하여야 함\n                           * 운영 규정에는 외부 기관에서 의뢰하는 수어\n                            통역서비스 제공으로 발생하는 수입금 관리\n                            사항 및 인사위원회 구성에 관한 내용을 반드시\n                            포함하여야 함\n\n   3-8  6. 센터의 조직 및 인력    7. 센터의 인력\n수어통역센터\n운영(지역) 나. (신설)            나. 종사자의 자격 기준                   종사자 자격\n (366쪽)                                                   규정 신설\n                           ※ ’26.4.15.부터 채용하는 인력에 대해 적용\n                             한다.\n\n                          ○ 자격 기준\n\n                            구분          자격 기준\n                                 다음 어느 하나에 해당하는 사람\n                                 가) 「사회복지사업법」 제11조에 따른\n                                    사회복지사 자격증을 취득한 이후\n                                    장애인 관련 사회복지사업에 5년\n                           센터장      이상 종사한 경력이 있는 사람\n                                 나) 한국수어통역사 자격증 또는 청각\n                                    장애인통역사 자격증을 취득한 이후\n                                    5년 이상 수어통역 실무를 담당한\n                                    경력이 있는 사람\n                          수어통역사 한국수어통역사 자격증을 취득한 사람\n                          청각장애인 청각장애인통역사 자격증을 취득한\n                           통역사 사람"}, {"p": 33, "t": "                                      Ⅰ. 2026년 주요 변경 사항\n\n\n 사업명              2025년             2026년 개정            개정사유     제1장\n                           * 센터장을 제외한 종사자 채용 시 자격증(한국\n                             수어통역사 및 청각장애인통역사) 미취득자는              2\n                             수어통역 업무 경력 및 교육 과정 이수 여부             0\n                             등을 종합적으로 고려하여 적합하다고 인정\n                             되는 경우, 자격증 취득 유예기간을 부여하는             년\n                             조건으로 인사위원회의 의결을 거쳐 채용할\n                             수 있다.\n   3-8  나. (신설)           나. 종사자 채용                     지역센터장     항\n수어통역센터                                                  인사위원회     안\n운영(지역)                    ○ 채용 원칙                       규정 신설     내\n (367쪽)\n                          - 센터의 모든 종사자(센터장 포함)의 채용은\n                            공개모집에 따른 공개경쟁이 원칙\n                          ○ 센터장 인사위원회 구성 주체\n                          - 지자체 직영운영 시 : 자치단체가 ‘인사위\n                            원회’를 구성\n                          - 위탁 운영 또는 법인 등이 설치한 경우\n                            : 운영기관에서 ‘인사위원회’를 구성하되,\n                            운영기관이 사단법인인 경우 시･도 센터는\n                            관할 시･도협회에서, 시･군･구 센터는 관할\n                            시･군･구지회에서 구성, 시･군･구 센터\n                             명확한 자(시설의 장은 제외)가 위원으로 임명･\n                                    위촉되지 않도록 주의\n\n          - 위원회의 위원장은 위원중에서 호선한다 - 위원장은 위원 중에서 호선하며, 위원의\n                                   임기는 3년으로 하되 연임할 수 있고\n          - 위원의 임기는 3년으로 한다.\n                                   보궐위원의 임기는 전임자의 잔여 임기로\n                                   함"}, {"p": 46, "t": "   ❘제7장❘장애인 자립생활지원시설 운영\n\n 사업명         2025년         2026년 개정         개정사유\n\n   7-1        (신설)       <신규 사업(‘26.4월~>      장애인\n 장애인자립                                      자립생활지원\n  생활지원                                       시설 운영\n 시설 운영                                        신설\n\n\n   ❘제8장❘부록\n\n 사업명         2025년         2026년 개정         개정사유\n\n   8-6        (신설)   산불 취약 특수보호시설 대피계획 수립    시･군･구,\n 산불 취약                                       시･도별\n                           가이드라인(전문)\n  특수보호                                      산불방지대책\n   시설                                          및\n  대피계획                                      주민대피계획\n   수립                                         포함\n 가이드라인"}]}]}, {"no": 2, "title": "장애인거주시설", "start": 47, "end": 266, "sections": [{"title": "Ⅰ. 장애인거주시설 공통 사항", "start": 49, "end": 184, "subs": [{"title": "1. 장애인거주시설 서비스 제공 및 이용 절차", "start": 49, "end": 70, "pages": [{"p": 49, "t": "                                    Ⅰ. 장애인거주시설 공통 사항\n\n\n    Ⅰ      장애인거주시설 공통 사항\n\n\n1                                                             제2장\n     장애인 거주시설 서비스 제공 및 이용 절차\n가. 목 적\n○ ｢장애인복지법｣ 제34조(재활상담등의 조치), 제57조(장애인복지시설의 이용 등)\n     및 제60조의2(장애인 거주시설 이용절차)의 규정에 따라 장애인 거주시설에서\n     각종 서비스를 제공 받을 수 있는 대상자의 자격 기준과 이용절차를 마련하여\n     이용대상을 명확히 하고, 이용조치 과정에 대한 필요사항을 규정함으로써\n     시설 서비스 이용의 편의 도모\n\n나. 기본추진 방향\n○ 시설 설치 시 고려사항\n    - 장애인 거주시설을 설치할 때 시설 접근로가 지형이나 특별한 사정으로 이동\n     편의시설을 설치하기 곤란한 경우 도로관리청, 관련 단체 등과 협력하여 개선\n     되도록 하여야 한다.\n\n○ 시설 서비스 제공 의무\n    - 시･군･구청장과 시설장은 시설 이용 또는 통원이 필요한 장애인에 대하여\n     정당하지 않은 이유(다른 지역 장애인)로 이용의뢰 또는 이용을 거부하지 못\n     한다.\n\n○ 불필요한 시설 이용 방지\n    - 시･군･구청장은 당해 장애인이 시설 이용 자격기준에 적합하더라도 사회통합의\n     취지로 지역사회에서 재활서비스를 받도록 하여야 하며 시설이용의뢰 시에는\n     상담 및 가정실태 조사 등을 통해 불필요한 시설 이용을 지양하여야 한다.\n    ※ ‘장애인 지역사회 자립지원 시범사업’ 참여지역의 지자체 담당자는 당사자의 의사, 지자체 여건\n      등을 고려하여 필요한 경우 시범사업과 연계될 수 있도록 노력해야 함"}, {"p": 50, "t": " ○ 이용 인원 운용\n  - 시･군･구청장은 지역 내 긴급한 시설 서비스 수요 발생 등 특별한 사유가\n    있다고 인정한 때에는 개별시설의 입소정원을 초과 또는 미달하여 이용\n    장애인 인원을 한시적으로 운용할 수 있다. 단, 정원을 초과하여 운용할 때에는\n    초과인원에 대한 별도의 지원을 해야 한다.\n   ※ 시･군･구청장은 장애영유아 거주시설의 영유아가 만 6세를 초과하여 타 시설로 전원하여야 할\n     경우, 법령위반에 따라 시설폐쇄 처분을 받은 시설의 입소 장애인을 타 시설로 전원하여야 할\n     경우, 시설 소규모화 정책에 따라 시설에서 퇴소한 장애인이 자립 프로그램 참여 중 자립이\n     불가하고, 기존 시설 재입소가 어렵다고 판단되는 경우 자립지원 정책을 저해하지 않는 불가피한\n     경우 본인의 선택에 따라 타 시설로 우선 전원･재입소 조치를 할 수 있다.\n ○ 시설 전문화 및 특성화\n  - 시･군･구청장은 전문적인 시설 서비스 제공을 위하여 개별시설의 종류와\n    이용 장애인의 장애특성에 맞는 시설 선택이 가능하도록 시설의 전문화와\n    특성화를 이룰 수 있도록 지원하여야 한다.\n ○ 장애인거주시설 입소 대기자 관리 및 해소노력\n  - 시･군･구청장은 장애인 거주시설 입소 대기자 명단(서식 3)을 관리하고,\n    장애인 거주시설을 필요로 하는 장애인과 그 가족의 입소 대기 해소를 위하여\n    노력해야 한다.\n   ※ 시･군･구청장은 장애인 거주시설 입소를 희망하는 장애인에게 이용 가능한 지역사회 재활 및 자립\n     서비스(최중증발달장애인 지원사업, 장애인 지역사회 자립지원 시범사업 등) 등 관련 내용을 안내\n     (서식 4)하고, 본인(또는 보호자)의 동의가 있을 경우 재활상담 및 자립조사 등 관련 조치 등을\n     장애인과 그 가족을 대상으로 진행할 수 있음. 해당 안내와 상담 등에도 불구하고 장애인거주시설\n     입소 대기를 희망하는 장애인에 한하여 본인(또는 보호자)의 동의를 받아 장애인 거주시설 입소\n     대기자로 관리함\n\n다. 이용대상\n 1) 우선 입소대상：장애인 중 국민기초생활보장수급자 및 부양자가 없거나 부양을 받을\n    수 없는 자로서 아래에 해당하는 자\n         시설 종류           대상       서비스지원 종합조사 기능 제한(X1) 점수\n       중증장애인거주시설       성인/아동              240점/190점\n     장애유형별거주시설,\n                       성인/아동              120점/110점\n   독립형 주거서비스 제공기관\n  ※ 장애영유아거주시설, 장애인단기거주시설, 장애인공동생활가정은 서비스지원 종합조사 점수와 관계없이 입소 가능\n  ※ 서비스 지원 종합조사 결과는 시설 입소를 위한 최소한의 요건(필수조건)으로 지자체 상황 혹은 지방 장애인복\n    지위원회 등에서 적격성 여부를 심사하여 결정 가능"}, {"p": 51, "t": "                                        Ⅰ. 장애인거주시설 공통 사항\n\n\n2) 실비입소이용자：종합조사 결과를 충족하고 시설 소재지 관할 시･군･구 담당부서에서\n 입소 결정(적격성 심사 간소화(생략) 가능)\n\n ※ 실비입소비용 중 보장시설 1인당 월 생계급여액* 이상은 보장시설 생계 급여(주･부식비, 취사용\n   연료비, 피복류 등)에 준하여 사용하되, 시설 수급권자의 주부식 생계비 질 저하가 초래되지 않도록\n   그에 상응하는 비용을 반드시 식자재 구입비용으로 사용하여야 함. 집행잔액 발생 시 사업비(교육,           제2장\n   의료, 자립 등) 및 운영비로 사용가능(단, 시설 기능보강, 자산취득 등 용도로 사용은 불가)\n   * 2026년 보장시설 생계급여의 수급자 1인당 최저보장수준\n                                  보장시설의 규모\n     지급기준\n                             30인 이상∼    100인 이상∼\n                   30인 미만                             300인 이상\n                             100인 미만     300인 미만\n       금액\n                   426,741    372,206    350,882       350,841\n      (원/월)\n\n ※ 실비이용대상자는 시설 정원의 30%까지 허용(단. 정원 30인 초과시설은 현원 기준, ’14.12월\n   기준으로 실비이용자가 30%를 초과하는 시설은 강제퇴소가 아닌 자연감소로 30% 이내로 조정 함\n   (실비장애인거주시설의 경우 실비이용대상자는 시설 정원의 70%까지 허용)\n * 2025.1월기준 실비장애인거주시설은 현행 유지하되, 자연감소등으로 조정\n\n ※ 위 규정에도 불구 ｢장애인 등에 대한 특수교육법｣ 제6조에 따라 국가나 지방자치단체에서 설치\n   하거나 사립의 특수교육기관에 위탁 운영 중인 장애인특수교육기관이 인근에 위치하고 있는\n   장애인거주시설의 경우 특수교육대상자가 기숙사가 없어 장애인거주시설에 입소하여 생활하는\n   것이 불가피한 경우 관할 시･군･구청장의 승인을 받아 입소비율을 조정할 수 있다. (단, 특수\n   교육기관 이용이 종료된 후에는 시설에서 퇴소하여야 함) 다만, 이 경우에도 입소순위는 무료이용\n   대상자가 실비이용 대상자보다 우선하며 무료이용 대상자가 없을 경우에 한하여 정원(정원 30인\n   초과시설은 현원) 내에서 실비이용 대상자를 탄력적으로 입소시킬 수 있다.(단, 종합조사 결과를\n   충족하여야 함)\n\n3) 보장시설 여부에 따른 기초수급자 급여의 종류\n\n              구분             급여의 종류                시설 이용\n          보장시설                시설급여                 무료이용\n     보장시설이 아닌 시설              생계급여                 실비이용\n\n  ※ 보장시설：｢장애인복지법｣ 제58조에 따른 장애인 거주시설(장애인단기거주시설, 장애인공동생활가정 제외)\n  ※ 기초수급자가 생활하는 시설이더라도 동 시설의 운영주체가 개인이거나, 정부(지자체 포함)로부터 운영비와\n    인건비를 전액 지원받는 시설이 아닌 경우에는 일반수급자에 대한 급여를 지급 받음(｢2026년 국민기초생활\n    보장사업안내｣)"}, {"p": 52, "t": "라. 이용 절차\n 1) 공통사항\n\n ○ 장애인 거주시설 이용자는 자신의 주소지를 해당 시설로 이전해야 한다.\n   * ｢주민등록법｣ 제12조에 의거 해당 시설장은 시설입소자에 대하여 시설 소재지로 주민등록\n       이전신고를 (대행)처리하도록 할 것. 이 경우 시설 이용자는 개별 세대(원)로 구성한다.\n\n   * 독립형 주거서비스 제공기관의 경우 해당 시설장은 시설입소자에 대하여 시설입소자가 거주하는\n     개별 주거공간 소재지로 주민등록 이전 신고를 (대행)처리하도록 하고, 주소 이전으로 인해 공공\n     지원이 누락되거나 중복되지 않도록 관리해야 함\n\n   * 체험홈, 장애인단기거주시설, 장애인공동생활가정 이용자는 필요한 경우 관할 시･군･구청장의\n       승인을 받아 주민등록을 이전 할 수 있다. (단, 시설장은 주소이전으로 인해 공공지원(생계비,\n       주거비, 활동보조 등)이 누락되거나 중복되지 않도록 관리)\n\n ○ 기존 시설 입소자의 타 시설 전원시 종합조사 실시 여부\n\n  - 학대 피해, 시설 폐쇄(자진폐지 포함), 시설 소규모화, 장애영유아 거주시설\n    입소 영유아의 연령 등의 사유로 타 시설(관내･외 불문)로 전원시 서비스지원\n    종합조사 없이 기존 절차와 동일하게 입소 가능\n   * 다만, 시설 소규모화로 인한 전원시 입소자의 장애 정도나 입소자 본인의 자립 거부 등의 사정을\n    고려하여 부득이 전원이 필요하다는 등의 사정이 있어야 함.\n\n\n 2) 대상자 자격 결정\n\n\n  ① (시설 입소(이용) 가능 여부 확인) 읍･면･동에서는 시설 입소(이용) 신청서 접수 전\n    시･군･구에 시설 입소 가능 여부를 반드시 확인\n       * 시설 입소(이용) 의뢰권자인 시･군･구와 협의 필요\n\n   ※ 지자체는 타 지자체에서 입소 의뢰 시 행정처리 사항 등 입소에 필요한 절차에 적극 협조"}, {"p": 53, "t": "                                    Ⅰ. 장애인거주시설 공통 사항\n\n\n  - 시･군･구에서는 시설 입소(이용) 신청서를 접수하려는 장애인 또는 그 가족의 동의를 받아\n    해당 장애인을 장애인 거주시설 입소 대기자로 관리하고, 입소 가능 시설이 생기면 장애인\n    거주시설 입소 희망 장애인에게 해당 사실을 안내하는 등 장애인 거주시설 입소 대기 해소를\n    위하여 노력해야 함\n\n② (서비스 신청 및 접수) 장애인 본인 또는 그 친족, 그 밖의 관계인이 읍･면･동에\n  신청. 다만, 이의가 있을 경우에는 시･군･구에 신청\n③ (서비스 지원 종합조사 의뢰) 시･군･구 담당자는 장애인거주시설 신청 내용을\n  확인하고 국민연금공단에 서비스지원 종합조사를 의뢰\n ∙ 국민연금공단 의뢰 전 대상자의 서비스 지원 종합조사 이력을 확인하여 유효기간\n   (3년) 이내 종합조사 결과가 거주시설 선정기준에 적합한 경우 동 결과를\n   활용하여 장애인거주시설 이용 적격 여부 결정 가능하며,\n ∙ 서비스 지원 종합조사 결과가 없거나 신청하는 장애인 거주시설 기준에 미달하는\n   경우* 서비스 지원 종합조사 의뢰\n  * ① 장애유형별거주시설, 중증장애인 거주시설 모두 부적격 판정을 받은 경우, ② 장애유형별\n    거주시설은 적격이나 중증장애인 거주시설은 부적격판정을 받았는데 중증장애인거주시설\n    입소를 희망하는 경우\n\n④ (의뢰 접수 및 서비스 지원 종합조사 실시) 국민연금공단 담당자는 시･군･구청의\n  의뢰에 따라 현장방문을 통한 서비스 지원 종합조사 실시\n⑤ (서비스 지원 종합조사 결과 전송) 국민연금공단 담당자는 조사결과를 시･군･구로 전송\n⑥ (결과안내) 시･군･구는 서비스지원 종합조사 결과를 바탕으로 적격 여부를 확인하여\n  서비스 제공을 결정하고, 그 결과를 해당 시설장 및 대상자에게 안내\n ∙ 서비스 지원 종합조사 결과는 최소기준(필수조건)이나 해당 기준을 충족하지\n   못하는 경우에도 지자체 상황 혹은 지방 장애인복지위원회 심의를 통하여 서비스\n   제공 결정 가능\n\n                  [긴급이용자의 범위 및 유의사항]\n  ○ 긴급이용자의 범위\n   - 인권침해상황 발생 시 구제조치를 실시해야하는 이용자\n   - 갑작스런 사고 등으로 인해 무연고가 된 이용자 등\n  ○ 긴급이용자에 대한 시설 이용 적격성 심사는 입소 후 서비스 지원 종합조사 실시\n   - 장애인 거주시설 운영자는 시설서비스 신청과 이용 적격성 심사를 거치지 아니한 이유를\n     시･군･구청장에게 보고함와 동시에 시설 이용자, 그 친족 또는 그 밖의 관계인에게 장애인\n     거주시설 이용절차(장애인 거주시설 시설서비스 신청, 이용 적격성 심사)를 안내하여 긴급이용자가\n     장애인 거주시설 신청 절차를 이행하도록 함"}, {"p": 54, "t": " 3) 서비스 제공\n\n  ① 이용계약체결\n   - 시설 이용 여부가 확정되기 전 시설장은 해당 장애인과 그 가족, 복지실시기관\n       등 이용 대상자에게 시설에서 제공되는 서비스 및 이용에 대한 정보를 제공해야 함.\n   - “장애인복지시설이용(통원)의뢰서 또는 이용 신청서”를 받은 시설장은 이용\n       대상자 또는 보호자와 거주시설 이용 계약체결 여부에 대해 협의를 거쳐\n       확정해야 함.\n       * 이용자 결정시 특정 종교인을 우선 선정하거나 배제하는 사례가 없도록 해야 함\n\n   - 입소희망 장애인 또는 보호자*와 해당 시설의 운영자는 서비스 이용조건,\n       본인부담금 등의 사항을 포함하여 계약을 체결하고 관할 시･군･구청장에게\n       보고하여야 함. (｢장애인복지법｣ 제60조의2(장애인 거주시설 이용절차))\n       * 보호자의 범위：｢민법｣에 따른 장애인의 후견인, 장애인의 배우자 또는 부양의무자인 1촌의\n         직계혈족, 장애인의 주소지(주소지가 없거나 알 수 없는 경우에는 현재지)를 관할하는 특별자치\n         시장･특별자치도지사･시장･군수･구청장이 지명하는 사람(｢장애인복지법 시행령｣ 제36조의 15)\n       * 계약체결과정에서 시설운영자는 입소희망 장애인을 대상으로 부당한 조건을 요구해서는 아니됨.\n       * 계약서는 시장･군수･구청장이 관할 지역의 환경 및 시설의 특성을 고려하여 ｢장애인복지법\n         시행규칙｣ 제44조의2제6항에 따른 계약에 관한 계약서 견본을 마련하고, 시설 운영자에게\n         그 이용을 권장함.(｢장애인복지법 시행규칙｣ 제44조의2제7항)\n\n\n        ☞ 계약서 포함 사항(「장애인복지법 시행규칙」 제44조의2제6항)\n        1. 법 제60조의4제1항부터 제3항까지의 규정에 따른 시설 운영자의 의무에 관한 사항\n        2. 시설 이용자가 본인 또는 다른 사람의 신체에 위해(危害)를 가하거나 가할 우려가 있는\n          경우 시설 운영자가 할 수 있는 제한조치의 내용, 절차, 한계 및 이의제기에 관한 사항\n        3. 시설 이용자의 권리와 의무에 관한 사항\n        4. 법 제60조의2제6항에 따른 계약절차의 대행자의 권리와 의무에 관한 사항\n        5. 시설 이용 중단절차에 관한 사항\n        6. 시설이용에 따른 비용과 본인부담금에 관한 사항\n        7. 계약기간\n        8. 계약 위반에 따른 조치사항"}, {"p": 55, "t": "                                       Ⅰ. 장애인거주시설 공통 사항\n\n\n  ② 본인부담금 산정\n   - 본인부담금을 지급하고 입소하는 장애인에 대하여는 입소장애인 또는 그 보호자의\n     생활능력에 따라 1인당 월 490,700원 범위 내에서 비용을 수납할 수 있다.\n   - 지적장애인 및 자폐성장애인에 대하여는 월 34,000원 이하, 영유아 및 중증\n     장애인에 대하여는 월 51,000원 이하의 비용을 추가하여 수납 할 수 있다.\n   - 본인부담금 이외의 시설이용에 따른 비용은 지방자치단체에서 지원함\n     (｢장애인복지법｣ 제79조제2항)\n   ③ 보증금의 수납 및 반환\n   - 이용보증금은 월 이용료의 1년분 이내에서 설정하고, 보증금을 수납한 경우에는\n     입소자 퇴소시 수납한 보증금을 지체 없이 반환\n     * 보증금 수납한도액은 시장･군수･구청장의 승인을 받아 설정\n\n\n마. 시설 종류별 입소 대상 장애인 유형\n\n                                                    서비스지원 종합조사\n       대 상 시 설                 시설별 대상 장애인\n                                                    기능제한(X1) 점수\n○ 장애유형별 거주시설\n  - 지체장애인 및 뇌병변장애인을 위한 시설 - 지체･뇌병변장애인(중복장애 포함)\n  - 시각장애인을 위한 시설          - 시각장애인(중복장애 포함)            성인 120점\n  - 청각･언어장애인을 위한 시설       - 청각･언어장애인(중복장애 포함)         아동 110점\n  - 지적장애인･자폐성장애인을 위한 시설   - 지적･자폐성장애인(중복장애 포함)\n                                                      성인 120점\n○ 독립형 주거서비스 제공기관          - 장애유형별 거주시설 대상 장애인과 동일\n                                                      아동 110점\n                                                      성인 240점\n○ 중증장애인 거주시설              - 중증장애인\n                                                      아동 190점\n○ 장애영유아 거주시설              - 6세미만의 장애영유아\n                          - 보호자의 일시적 부재 등으로 단기간\n○ 장애인 단기거주시설                                           비해당\n                            도움이 필요한 장애인\n○ 장애인 공동생활가정              - 유형별 거주시설 입소대상자와 동일\n* 장애인단기거주시설, 장애인공동생활가정의 경우 별도의 장애유형을 고려하지 않으나 와상상태의 중증장애인 또는\n  6세 미만 장애영유아의 경우에 중증장애인거주시설 또는 장애인영유아거주시설로 이용(입소)권고"}, {"p": 56, "t": "바. 퇴소절차\n\n 1) 통지\n\n ○ 장애인의 요구･원가정복귀･지역사회 자립･시설폐쇄 등으로 장애인에 대한\n   시설서비스가 종료되는 경우, 해당 시설장은 복지실시기관 및 장애인 가정 등에\n   퇴소 사실을 통보하고, 사례관리 종결 기록지(별첨 서식) 등 장애인의 사례관리와\n   관련된 참고서류를 해당 시･군･구에 공문으로 제출*하여야 함\n   * 해당 시･군･구는 퇴소 후에도 사례관리가 연속적으로 이뤄질 수 있도록 사례관리 종결 기록 등을\n       활용하여 적절한 서비스 연계가 이뤄지도록 하여야 함\n\n\n 2) 정보제공\n\n ○ 장애인의 요구 등으로 시설서비스가 종료되는 경우, 해당 시･군･구청장 및\n   시설장은 전원 되는 시설에 대한 정보나 시설서비스 종료 후 지역사회에서\n   이용할 수 있는 서비스 및 지역사회 자립지원에 관한 정보를 장애인 본인 및\n   법적대리인(｢장애인복지법 시행령｣ 제36조의15)에게 충분히 제공하여야 함\n\n                < 참고：「장애인복지법 시행령」 제36조의15>\n\n  제36조의15(장애인거주시설 이용계약절차의 대행자) 법 제60조의2제6항에서 ʻʻ대통령령으로 정하는\n    자ʼʼ란 다음 각 호의 순서에 따른 자를 말한다.\n   1. ｢민법｣에 따른 장애인의 후견인\n   2. 장애인의 배우자 또는 부양의무자인 1촌의 직계혈족\n   3. 장애인의 주소지(주소지가 없거나 알 수 없는 경우에는 현재지)를 관할하는 특별자치시장･특별자치\n      도지사･시장･군수･구청장이 지명하는 사람\n\n\n 3) 동의서(별첨 서식) 제출\n ○ 장애인의 요구 등으로 서비스가 종료되기 위해서는 본인 또는 법적대리인의\n   동의서*를 받아야 함\n   * 단, 학대 피해로 인한 긴급분리 및 재난 발생 시 긴급대피를 위해 시설 전원이 필요한 경우에는\n     시･군･구 및 복지기관(지역장애인권익옹호기관 등)이 우선 조치 후 동의서를 받도록 할 수 있음\n\n  - 퇴소 시에는 장애인 본인의 의사를 가장 우선하여야 하며, 장애인 본인의\n       의사능력이 결여되거나 부족(미성년 등)한 경우 법적대리인이 대리할 수 있다."}, {"p": 57, "t": "                                     Ⅰ. 장애인거주시설 공통 사항\n\n\n  * 다만, 이외의 사유의 경우(법적대리인 부재 등으로 보호자에 의한 동의서 제출이 어렵고, 장애인\n    본인의 의사능력은 있으나 의사능력이 부족하여 의사가 불분명한 경우 등)에도 시･군･구 담당자가 자립\n    이나 전원이 필요하다고 판단 시 장애인복지법 제32조의7에 따라 장애인 전담민관협의체 안건으로\n    상정하여 신중한 판단하에 퇴소를 결정할 수 있으며, ‘장애인 지역사회 자립지원 시범사업’과 연계한\n    장애인의 경우에는 장애인 자립지원위원회 심의로 장애인 전담민관협의체 심의를 갈음할 수 있음\n\n - 시설장은 퇴소 희망 장애인 본인 또는 법적대리인의 동의서 등 관련 서류를                    제2장\n\n  이용자 퇴소 전 해당 시･군･구에 공문으로 제출하여야 한다.\n4) 모니터링\n○ 시･군･구청장 및 시설장은 이용 장애인의 자립 또는 전원을 결정하기 전 자립\n  환경 및 전원환경이 장애인의 상황을 고려하여 적정한지에 대한 사전 확인 절차를\n  거쳐야 함\n  ※ 시･군･구청장은 ‘장애인 지역사회 자립지원 시범사업’과 연계한 장애인의 경우 개인별 전환계획\n    수립, 자립지원위원회 심의 등의 절차를 통해 자립환경의 적정성을 사전 확인\n  ※ 시･군･구청장은 퇴소 후 지역사회 자립을 원하는 장애인에게 필요한 서비스가 제공될 수 있도록\n    노력해야 함\n\n○ 시설장은 장애인 자립 시 장애인의 상황 등 기존 시설 사례관리를 통해 파악된\n  상황을 자립지원 서비스 기관과 공유하고, 퇴소 후 1년간 반기별로 퇴소 장애인에\n  대한 상황을 점검하여 시･군･구에 공문으로 제출하여야 함\n\n○ 시･군･구 담당자는 관할 구역 내 시설에서 자립한 장애인의 자립상황을 퇴소 후\n  1년간 반기별로 확인하여 서비스가 적절히 제공되고 있는지 지속적으로 관리\n  하고, 관리현황을 및 시･도에 공문으로 제출하여야 함\n\n○ 자립지원팀 운영\n - 시설장은 시설 이용자의 퇴소 전, 자립계획을 수립･시행하는 등의 준비과정을\n   지원하기 위하여 자립지원팀을 구성하여 운영할 수 있으며(시설 내 조직에\n   유사 업무를 수행하고 있는 조직이 있을 경우 대체 가능), 자립지원팀에서는\n   시설 이용자가 퇴소한 후에도 일정기간 지속적인 모니터링을 실시하여야 함.\n   (당사자 동의 필요)"}, {"p": 58, "t": "  - 자립지원팀은 시설 이용자가 지역사회 자립으로 퇴소를 희망할 경우 자립계획을\n    수립･시행하는 등의 준비과정을 지원하고 퇴소 후에도 1년간 모니터링을 하여야\n    함.(당사자 동의 필요) 단, 시설장은 준비과정에서 장애인 지역사회 자립지원\n    시범사업 수행기관 및 자립 관련 서비스 제공기관(장애인복지관 등)과 연계할\n    수 있도록 노력해야 함.\n\n  - 시설장은 매년 시설 이용자의 개인별지원계획 수립 시 자립 의사를 확인하고,\n       자립을 희망할 경우 지원계획 내에 자립지원계획을 포함하여 서비스가 지원\n       되도록 노력해야 함."}, {"p": 59, "t": "                                                               Ⅰ. 장애인거주시설 공통 사항\n\n\n■ 장애인복지법 시행규칙 [별지 제1호의4서식] <개정 2025.12.31.>\n\n                            장애인 등록 및 서비스 신청서\n※ 색상이 어두운 난은 신청인이 작성하지 않고, [ ]에는 해당되는 곳에 √표를 합니다.                                     (4쪽 중 제1쪽)\n접수번호                            접수일자                               처리기간     별도안내\n\n          성명                                           여권상 영문성명\n          주민등록번호(외국인등록번호 또는 국내거소신고번호) 규칙 제6조･제7조에 따라 장애인의 장애상태를 판정하기 위해 이전 심사 시 공단에 제출한 자\n                 료, 「국민연금법」 제52조에 따른 부양가족연금액 심사자료, 같은 법 제67조에 따른 장애연금의 수급권자 심사자료, 같은 법 제70조에 따른 장애연금액의\n                 변경 등 심사자료를 열람(활용)하는 것에 동의합니다.\n                ※  동의하지 않을 경우 신청인이 직접 해당 자료를 제출해야 하며, 기한 내에 제출되지 않는 경우 장애인등록 신청이 반려될 수 있음\n① 장애인등록 신청                                                                              □동의함 □동의하지 않음       제2장\n              3. 국가유공자, 보훈보상ㆍ지원대상자로서 상이등급(1∼7급)을 받은 경우 국민연금공단 또는 관할 지방자치단체에서 국가보훈처를 통하여 장애인등록 등에\n                 필요한 자료를 수집 및 활용하는 것에 동의합니다.\n                ※ 동의하지 않을 경우 신청인이 직접 해당 자료를 제출해야 하며, 기한 내에 제출되지 않는 경우 장애인등록 신청이 반려될 수 있음\n                                                                                        □동의함 □동의하지 않음        장\n              4. 고속도로 할인가능이 있는 복지카드 중 신용(직불)기능이 없는 카드 발급 시 발급수수료 4,000원\n                 담당 공무원 확인사항      국내거소신고, 외국인등록 사실증명 또는 혼인신고 증빙서류(재외동포나 외국인의 경우에만 해당합니다)\n② 장애인등록증      1. 장애인등록증(장애인등록증을 잃어버린 경우는 제외합니다)\n  재발급 신청      2. 고속도로 할인기능이 있는 복지카드 중 신용(직불)기능이 없는 카드 발급 시 발급수수료 4,000원\n              1. 시설대여계약서 또는 임차계약서 사본 1부(자동차를 시설대여 받거나 임차한 경우만 해당합니다)\n③ 장애인사용자동차등표지 2. 사업자신고 또는 사업자등록증(장애인복지시설 등의 경우에만 해당합니다)\n  발급 신청          담당 공무원     1. 자동차등록증 사본\n                  확인사항      2. 국내거소신고, 외국인등록 사실증명 또는 혼인신고 증명서류(재외동포나 외국인의 경우만 해당합니다)\n④ 장애인사용자동차등 표 1. 장애인사용자동차등표지(잃어버린 경우에는 제외하며, 훼손되어 못 쓰게 된 경우 또는 기재사항을 변경하려는 경우에만 해당합니다)\n  지 재발급 신청    2. 변경 사실을 증명할 수 있는 서류 1부(기재사항을 변경하려는 경우에만 해당합니다)\n⑤ 저소득 장애인 진단서 1. 수급자의 복지계좌 통장사본 1부\n 발급비 및 검사비 신청 2. 진단서 발급비･검사비 영수증\n\n                                요금 감면 및 서비스 제공 관련 개인정보 제공ㆍ처리 동의서\n본인은 장애인 등록에 따른 요금 감면 및 서비스 제공과 관련하여 수급자격 확인에 필요한 개인정보를 해당 서비스 제공기관에 제공하는 것에 동의합니다.\n ※ 동의하지 않는 경우에는 본인(신청인)이 직접 관련 서류를 제출해야 합니다.\n ※ 개인정보의 보유 및 이용 기간: 관련 법령에 따라 해당 서비스 제공을 위해 필요한 기간\n                                                                                    □동의함 □동의하지 않음\n본인은 장애인대상 요금 감면 및 서비스 제공과 관련하여 해당 서비스 제공기관이 수급자격 확인을 위해 장애유형･장애 정도에 관한 정보 및 고유식별정보를 처리하는 것에 동의합니다.\n ※ 동의하지 않는 경우에는 본인(신청인)이 직접 관련 서류를 제출해야 합니다.\n ※ 개인정보의 보유 및 이용 기간: 관련 법령에 따라 해당 서비스 제공을 위해 필요한 기간\n                                                                                    □동의함 □동의하지 않음\n\n                                            행정정보 공동이용 동의서\n1. 본인은 이 건 업무처리와 관련하여 담당 공무원이「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 위의 사항을 확인하는 것에 동의합니다.\n2. 본인은 이 건 업무처리와 관련하여 국민연금공단이「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여「장애인복지법」 제32조의9제1항에 따른 자료를 확인하는 것에 동의합니다.\n  ※ 동의하지 않는 경우에는 본인(신청인)이 직접 관련 서류를 제출해야 합니다.\n                                                                                          □동의함 □동의하지 않음\n\n                                         서비스 수급희망 이력제 사전 신청\n본인은 「장애인복지법 시행규칙」 제39조제2항 및 「장애인연금법」 제10조의2에 따라 장애인 복지 서비스 수급 희망자로서 서비스 수급권자의 범위에 포함될 가능성을 확인 받기 위한 서비스\n이력관리를 사전 신청합니다.\n ※ 동의하지 않는 경우에는 현재 수급자격이 없는 서비스에 대해 추후 수급자격이 인정되더라도 다시 해당 서비스를 신청할 때까지 수급권자에 포함되지 않습니다.\n                                                                                         □동의함 □동의하지 않음\n\n                                      진료기록 열람 및 사본 교부 요청 동의서\n본인은 「장애인복지법」 제32조의9제2항에 따라 업무처리와 관련하여 담당 국민연금공단 직원이 장애 정도 확인 등을 위하여 심사자료 보완 등이 필요한 경우 「의료법」에 따른 의료기관에\n본인에 대한 진료기록 자료나 검사결과 자료 등 진료에 관한 기록을 열람하거나 사본 교부를 요청하는 것에 동의합니다.\n ※ 동의하지 않는 경우에는 본인(신청인)이 직접 관련 서류를 제출해야 합니다.\n                                                                                       □동의함 □동의하지 않음\n\n                                              안내 및 동의사항\n1. 처리기간은 신청한 서비스에 따라 다릅니다.\n2. 차량을 교체한 경우에는 재발급 사유 중 기재사항 변경란에 “√”표시하고 자동차란에 새로 취득한 차량의 정보를 적습니다.\n3. 장애인등록증 수령방법 관련\n   가. 신청기관 방문 또는 주민등록기관 방문을 선택한 경우에는 신청 후 2개월 이내에 해당 기관에서 장애인등록증을 받아 가시기 바랍니다.\n   나. 개인 등기우편을 선택한 경우에는 신청 시 등기우편료를 납부해야 하며, 반송 처리되는 경우에는 이에 대한 우편료도 추가로 납부해야 합니다.(지자체별 상이)\n   다. 개인 등기우편을 선택한 경우에는 등기우편 수령 주소란에 적은 주소로 장애인등록증이 발송되며, 해당 주소로 발송된 장애인등록증을 신청인이 아닌 다른 사람이 대리 수령해\n      발생한 사고에 대해서는 발급 기관이 책임을 지지 않음을 알려드립니다.\n4. 장애인등록증 재발급 신청 및 처리에 관하여 개인 등기우편을 선택한 경우에는 등기우편료를 납부하고 기존 장애인등록증을 반납(분실 재발급의 경우는 제외합니다)해야 등기우편 발송\n   이 가능하며, 등기우편 발송 시 반송지는 신청지 지방자치단체입니다.\n5. 장애인등록증 전국재발급 처리를 위해 재발급을 신청한 지방자치단체에서 본인의 장애인 등록정보 등 장애인등록증 발급에 필요한 정보를 처리하는 것에 동의합니다.\n                                                                                         □동의함 □동의하지 않음\n6. 본인은 특별자치시장ㆍ특별자치도지사･시장･군수･구청장이 이 건 업무처리와 관련하여 국가 및 지방자치단체나 그 밖에 관계기관이 복지대상자에게 제공하는 각종 감면서비스 등의 신\n   청을 접수(대행)하는 것에 동의합니다.\n                                                                                         □동의함 □동의하지 않음\n7. 본인은 장기이식을 받은 경우 담당 공무원이 「장애인복지법 시행규칙」 제6조 및 제7조에 따라 보건복지부를 통하여 장기이식 관련정보(이식장기, 이식일, 이식기관 등 장애 정도 조정에\n   필요한 정보를 말합니다)를 조회･제공･이용 및 장애 정도 조정절차를 진행하는 것에 동의합니다.\n                                                                                         □동의함 □동의하지 않음\n                                                                             신청인               (서명 또는 인)"}, {"p": 62, "t": "                                                      (4쪽 중 제4쪽)\n\n\n                             처리절차\n이 신청서는 아래와 같이 처리됩니다.\n                                          처 리 기 관\n         민 원 인          장애 진단 의료기관\n                                     특별자치시･특별자치도･시･군･구\n\n\n       장애인등록신청                            접       수\n\n                                              ▼\n                                        장애 정도 심사용\n                         접       수\n                                        진단 의뢰서 발급\n\n                             ▼\n\n                        장애 진단 실시\n\n\n                             ▼\n                       장애 정도 심사용\n                                          접       수\n                        진단서 통보\n\n                                              ▼\n\n                                        장애 정도 심사\n                                        (국민연금공단)\n\n                             ▼                ▼\n\n                       장애인등록증 제작          결       재\n\n\n                                              ▼\n\n\n    장애인등록증 교부                          장애인등록증 발급"}, {"p": 63, "t": "                                         Ⅰ. 장애인거주시설 공통 사항\n\n\n[서식1] 사례관리 종결 기록지 양식(예시)\n                                       백상지(80g/㎡) 또는 중질지(80g/㎡)"}, {"p": 65, "t": "                                 Ⅰ. 장애인거주시설 공통 사항\n\n\n[서식3] 장애인 거주시설 이용대기자 관리 대장(예시)"}, {"p": 66, "t": "[서식4] 장애인 지역사회 자립지원 서비스 이용(변경) 신청서\n※ 색상이 어두운 난은 신청인이 작성하지 않고, [ ]에는 해당되는 곳에 √표를 합니다.\n                                                                                              (2쪽 중 1쪽)\n                                                                                 처리기간(자립지원 신청일로부터\n               자립지원(변경) 시범사업 지원 신청서                                              자립조사 완료일까지) : 14일\n                                                                                 (공휴일 제외)\n\n접수번호              접수일자                     처리기간\n\n          성명                      생년월일               성별    [ ]남          전화번호\n                                                           [ ]여\n장애인\n(본인)     사회보장     [ ]수급자 [ ]차상위 [ ]일반                                    휴대전화\n\n          주소                                                             전자우편\n\n                                                                          연락처\n       장애인과의 관계      성명           생년월일     동거여부            주소                              신청사유\n                                                                         (핸드폰)\n\n                                                                                 [ ]자립희망\n    [ ]법정대리인                                                                     [ ]당사자, 보호자의 건강상의 이유\n신청인 [ ]보호자                                                                       [ ]경제적 어려움\n    [ ]기타                                                                        [ ]돌봄부담\n                                                                                 [ ]기타 :\n                  [ ]독립주거 [ ]건강 및 의료 [ ]일상생활 [ ]일자리\n       복지욕구\n                  [ ]자립체험 [ ]교육 [ ]문화 및 여가 [ ]안전 및 권익\n\n 접수처                                              서비스 내용\n\n                                             □ 지체      □ 뇌병변        □ 시각         □ 청각         □ 언어\n                                    장애유형     □ 지적      □ 자폐성        □ 정신         □ 신장         □ 심장\n                                             □ 호흡기     □간           □ 안면         □ 장루･요루      □ 뇌전증\n  □       장애인 지역사회        장애 유형\n 지자체     자립지원 시범사업        및 정도      장애정도     □ 심한장애        □ 심하지 않은 장애\n\n □\n                                    중복장애     □ 유(장애유형:               )            □무\n 수행\n 기관\n        ※ 신청 후 자립조사를 진행하기 위해 지자체에서 선정한 시범사업 수행기관에서 별도 안내 예정입니다.\n        ※ 자립조사 및 자립지원위원회 심의를 통해 지자체에서 서비스 대상자를 결정하여, 대상자 선정 및 본인이\n          희망하는서비스의 수급유형을 받지 못할 수 있습니다.\n\n         본인(대리신청인 포함)은 개인정보 활용 동의와 기타 유의사항에 대하여 담당공무원 및\n       수행기관으로부터 안내받았음을 확인하며, 위와 같이 장애인 지역사회 자립지원 시범사업 지원을\n                             신청합니다.\n                                                  년  월    일\n                   신청인(대리 신청인) 성명 :       (서명 또는 인)\n                      장애인(본인)과의 관계 :     (대리 신청의 경우)\n\n   ○○○지자체장 / 수행기관장 귀하\n                                                                210㎜×297㎜[백상지(80g/㎡) 또는 중질지(80g/㎡)]"}, {"p": 67, "t": "                                                         Ⅰ. 장애인거주시설 공통 사항\n\n\n                                                                            (2쪽 중 제2쪽)\n\n\n개인정보 수집 및 활용 동의                                                                          제2장\n본인은 장애인 자립지원 신청 및 제공과 관련하여 수급자격 확인에 필요한 개인정보를 해당 서비스 제공기관에 제공하는 것에 동의합니다.\n※ 동의하지 않는 경우에는 본인(신청인)이 직접 관련 서류를 제출해야 합니다.\n※ 개인정보의 보유 및 이용 기간: 관련 법령에 따라 해당 서비스 제공을 위해 필요한 기간         □동의함 □동의하지 않음\n본인은 장애인 자립지원 신청 및 제공과 관련하여 해당 서비스 제공기관이 수급자격 확인을 위해 장애유형･장애 정도에 관한 정보 및 민감\n정보를 처리하는 것에 동의합니다.\n※ 동의하지 않는 경우에는 본인(신청인)이 직접 관련 서류를 제출해야 합니다.\n※ 개인정보의 보유 및 이용 기간: 관련 법령에 따라 해당 서비스 제공을 위해 필요한 기간         □동의함 □동의하지 않음\n행정정보 공동이용 동의서\n\n본인은 이 건 업무처리와 관련하여 담당 공무원이｢전자정부법｣ 제36조제1항에 따른 행정정보의 공동이용을 통하여 위의 사항을 확인하는\n것에 동의합니다.\n※ 동의하지 않는 경우에는 본인(신청인)이 직접 관련 서류를 제출해야 합니다.\n                                                           □동의함 □동의하지 않음\n\n\n                                                                                확인\n유의사항\n                                                                               (√ 체크)\n\n1. 자립지원 신청 및 결정에 필요한 상담(조사)를 거부, 방해 또는 기피할 경우 서비스 이용이 제한될 수 있습니다.                [ ]\n2. 장애인 지역사회 자립지원 시범사업 신청을 위해 작성･제출하신 서류는 반환되지 않습니다.                              [ ]\n\n\n                                       구비서류\n1. 신분확인 서류(장애인등록증 사본)\n2. 보호자 신청 시 보호자 확인서류(가족관계증명서 등)\n3. 개인정보 수집안내 및 이용･제공에 대한 동의서\n4. 자립기초조사표\n\n\n                                       처리절차\n\n 자립지원 신청서,              대상자 선정을 위한                                       대상자 결정 및\n   기초조사표               자립조사(방문조사),            자립지원위원회 심의             개인별지원계획 승인\n  작성 및 신청               개인별지원계획 수립                                          안내\n\n\n                                                   해당지자체의\n                           수 행 기 관                                        해당지자체\n     신청인                                          자립지원위원회\n                            (지자체)                                          (지자체)\n                                                    (지자체)"}, {"p": 68, "t": "            [장애인 지역사회 자립지원 시범사업 안내]\n\n\n  2026년 사업개요\n   (사업명) 장애인 지역사회 자립지원 시범사업\n\n   (사업목적) 장애인 당사자의 의사에 따른 주거선택권을 보장하고 지역사회 자립을\n   지원하기 위한 장애특성별 지원모형 마련 및 통합서비스(주거+고용+복지) 연계\n   (’22~’26년 시범사업 후 ’27년 3월 본사업 전환 예정)\n\n   (사업기간) ’22년부터 법* 시행일 기준 본사업 전환 전까지\n   * 「장애인의 지역사회 자립 및 주거 전환 지원에 관한 법률」(’25.3월 공포, 공포 2년 후 시행)\n\n   (사업 운영 주체) 시범사업 선정 지자체\n  ▪ 44개 지자체 대상 시범사업 추진 중\n  - (광역) 서울특별시, 부산광역시, 인천광역시, 대구광역시, 대전광역시, 광주광역시,\n    울산광역시, 전북특별자치도, 충청남도, 충청북도\n  - (기초) 성남시, 의왕시, 안산시, 부천시, 시흥시, 이천시, 구리시, 안성시, 포천시,\n    광명시, 양평군, 화순군, 서산시, 경주시, 전주시, 제주시, 군산시, 익산시, 인제군,\n    거창군, 구미시, 안동시, 영천시, 강릉시, 양주시, 평택시, 당진시, 원주시, 정읍시,\n    여수시, 사천시, 거제시, 산청군, 합천군\n\n   (사업대상) 총 800명\n  - 거주시설 장애인, 학대피해쉼터, 단기거주시설 장애인, 재가장애인\n\n               < 시설 입소 가능성이 높은 재가장애인 예시 >\n\n  • 보호자의 장기 부재(사망, 입원, 요양시설 입소 등) 질병, 장애, 고령 등으로 돌봄을 받기 어려워\n    지역사회 거주가 어려운 장애인\n  • 지역사회 지원체계가 부재하거나 위기가구에 해당되는 장애인 중 장애정도와 생활환경 등에 의한\n    지역사회의 일상생활 등이 어려운 자\n  • 학대피해로 원가정(시설)에서 분리 조치 및 지원이 필요한 자"}, {"p": 69, "t": "                                     Ⅰ. 장애인거주시설 공통 사항\n\n\n▪ (의뢰) 지자체 담당자는 거주시설 장애인, 시설 입소 가능성이 높은 재가장애인\n  중 사례관리 및 자립지원 서비스 연계가 필요하다고 판단할 경우, 장애인 자립지원\n  시범사업 지자체(수행기관)에 의뢰\n▪ (방법) 장애인 또는 보호자 동의하에 ‘장애인 지역사회 자립지원 서비스 이용\n  신청서’를 작성하여 읍․면․동에 신청                                          제2장\n\n  ☞ [서식 4] 장애인 지역사회 자립지원 서비스 이용(변경) 신청서 참조\n▪ (접수 및 자립조사) 장애인 자립지원 시범사업 지자체(수행기관)는 의뢰받은 장애인\n  대상으로 방문 자립조사를 실시하여 조사결과보고서 작성, 개인별지원계획 수립\n  등 자립지원위원회 심의 자료 준비\n▪ (자립지원위원회 심의 및 대상자 선정) 장애인 자립지원 시범사업 지자체(수행\n  기관)는 지역별 자립지원위원회의 심의 결과를 토대로 대상자 선정 여부 결정\n▪ (자립대상자 지원) 장애인 자립지원 시범사업 지자체(수행기관)는 자립대상자로\n  선정된 장애인에게 ‘장애인 지역사회 자립지원 시범사업 지침’에 따라 자립 지원\n\n\n              < 장애인 지역사회 자립지원 시범사업 문의 >\n󰠛 전화 문의\n - 한국장애인개발원 중앙장애인지역사회통합지원센터 02-3433-4565, 02-3433-4532"}, {"p": 70, "t": "       장애인 지역사회 자립지원 대상자 서비스 지원 내용\n\n ○ (서비스 주요내용) 자립지원 전담인력을 배치하여 대상자 발굴 및 장애 특성을 고려한 개인별 자립지원 계획 수립 및\n  주거, 공적서비스 통합 연계하여 장애인 지역사회 자립을 안정적으로 지원\n\n                          < 지원유형별 서비스 연계 내용 >\n        구분            자립유지형                자립지원형              집중지원형\n\n                                     ∙ 일자리, 낮활동 연계 등  ∙ 주거전환의 초기정착, 의료적\n                 ∙ 금전관리 및 자기옹호 지원이\n   지원유형별 대상                            지역사회 활동 지원이 필요한 지원 등의 집중 지원이 필요한\n                   필요한 장애인\n                                       장애인              장애인\n\n                 ∙ 한국토지주택공사(LH) 등 공공임대주택 연계\n         주거관련\n  자립             ∙ 주거환경조성(신규 자립대상자 중 필요 시 600만원 범위 내 지원)\n  준비             ∙ (지자체별 자체) 자립정착금 지원\n        자립정착금\n                  * 전국 광역시도별 5백~20백만원 규모로 자체 지원 중\n\n                 ∙ 장애인연금, 장애수당\n       소득 보장\n                 ∙ 기초생활보장 생계, 주거급여 등\n\n       권익지원      ∙ 공공후견인, 공공신탁제도 등\n\n                 ∙ 지원유형별 배치(자립유지형 6인~8인, 자립지원형 3인~5인, 집중지원형 2인)\n       자립지원 인력\n                 ∙ 사례관리 및 주거생활서비스 지원, 야간 및 긴급상황 대응 등\n\n                 ∙ 활동지원서비스(서비스 지원 종합조사를 거쳐 월별 60~480시간 지원)\n                 ∙ 발달장애인 주간활동서비스(기본형 132시간, 확장형 176시간)\n         활동지원    ∙ 지자체별 추가 지원(지자체별 월 10~100시간 내외)\n\n                                     ∙ 시범사업 추가 지원       ∙ 시범사업 추가지원\n                     추가지원 없음\n                                       (+월 20~40시간이하)     (+월 200시간 이하)\n  주간\n  활동     일자리     ∙ 지역 맞춤형 취업지원 및 직업재활시설, 장애인 일자리사업 참여(가점 10점 적용)\n   및             ∙ 중증장애인 동료상담가 사업 참여(선발 우대)\n          참여\n                 ∙ (본인희망시)직업적응 훈련시설 훈련 연계\n  지역\n  사회             ∙ 장애인 건강주치의 등 연계 ∙ 방문건강 관리사업 연계\n  참여      보건     ∙ 지역장애인 보건의료센터 협력 ∙ 기초생활보장 의료급여\n          의료     ∙ 건강관리비 1명당 매년 40만원\n                 ∙ 신규 자립대상자 중 필요 시 보조기기 구매 지원 1명당 300만원\n\n         재산관리    ∙ 발달장애인 재산관리지원서비스(국민연금공단) 연계\n\n          문화     ∙ 여성장애인 교육지원\n                 ∙ 장애인 생활체육 프로그램 참여\n        및 여가활동\n                 ∙ 장애인복지관 및 IL센터 프로그램, 지역주민활동 등 민간사업 등\n\n       야간 및      ∙ 응급안전안심서비스(119안심콜 등)\n                 ∙ 지역 내 소방서 안전점검, 경찰서 등 안전체계 구축 및 지역자원 연계\n       긴급대응\n                 ∙ 기타 실종, 이탈 예방 관련 자체사업 연계\n\n ※ 음영 : 장애인 자립지원 시범사업 별도 예산 지원사항(그 외는 기존 복지서비스 연계)"}]}, {"title": "2. 장애인거주시설 운영 지도·감독", "start": 71, "end": 90, "pages": [{"p": 71, "t": "                                Ⅰ. 장애인거주시설 공통 사항\n\n\n2 장애인 거주시설 운영 지도･감독\n\n가. 목 적\n\n○ 장애인 거주시설 서비스는 시･군･구청장의 보장결정(조치주의)으로 제공되며 시설             제2장\n  서비스 제공은 시설운영자에게 대행(위임)토록 하고 있으므로 장애인 거주시설을\n  설치･운영하는 자의 소관업무 및 시설이용자에 대한 서비스 제공 실태(인권보호)              애\n  등을 지도･감독함으로써 시설 운영의 적정화 및 시설 서비스 제공 과정에서\n  인권침해사례를 예방하고 불법사례 발견 시 주무관청의 신속한 행정조치 도모\n\n\n나. 기본방향\n\n○ ｢장애인복지법｣ 제61조(감독)에 의거 해당시설의 관할 시･군･구청장은 연초 관할\n  장애인 거주시설에 대한 지도･점검계획을 수립하고,\n\n - 반기별 1회 이상 정기적이고 내실 있는 점검이 이뤄질 수 있도록 하고 특이\n   사항 발생 시에는 수시점검을 실시하여야 한다.\n\n○ 시설이용 장애인에 대한 인권침해･사생활보호･선택권 보장 등 시설서비스\n  제공과 시설운영비 지원 등 시설운영에 대한 점검을 주기적으로 실시한다.\n\n - 특히, 인권침해 사례, 일상생활에서 사생활 보호, 서비스 과정에서 자기결\n   정권 보호, 야간 서비스 제공 실태 등을 집중 점검\n  * 시설이용 장애인의 권익증진 등 시설서비스 질 관리를 위해 시설운영자 단체(한국장애인복지\n    시설협회)가 자체적으로 시설운영 실태조사 등을 할 경우 지자체는 적극 지원할 것\n\n○ 시설 내 인권침해 조사의 경우, 불가피한 경우를 제외하고는 장애인권익옹호기관,\n  인권조사 전문가(인권활동가 등)를 포함하여 민･관 합동조사를 추진하도록 한다.\n\n○ 시･도지사 또는 시･군･구청장은 성폭력･장애인학대범죄 등 인권침해로 행정\n  처분 받은 운영법인 및 장애인거주시설에 대해 「사회복지사업법」등 관계법령에\n  따라 위반사실 명단을 공표할 수 있다."}, {"p": 72, "t": "  - 다만, 위반사실 공표 후 법원 판결 등으로 행정처분이 변경된 경우 정정 또는\n    재공표 필요\n\n ○ 시･도지사 또는 시･군･구청장은 장애인거주시설 인권예방활동 및 인권침해\n   의심사례 신고 등 인권업무를 전담하는 인권담당자를 지정･운영할 수 있다.\n\n ○ 시･도지사 또는 시･군･구청장은 관할 사회복지법인 소재지와 시설 소재지가\n   같지 않은 경우 「사회복지사업법」등 관계법령에 따라 시설 소재 시･도지사\n   또는 시･군･구청장이 지도･감독 및 회계감사 등을 수행할 수 있도록 장애인\n   거주시설 관리주체 정비를 적극 추진해야 한다.\n\n ○ 시설 운영에 대한 지도･감독\n\n  - 시･도지사와 시･군･구청장은 시설에 대한 현장 확인 등 정기적인 지도･\n    감독을 철저히 하되,\n  - 특히 시설이용 장애인에 대한 서비스 권장 기준 준수, 인권침해･사생활보호･\n    선택권 보장 등 시설서비스 본질적인 사항에 대한 점검을 지속적으로 실시\n\n  - 시설 운영이 우수한 시설에 대하여는 상여제의 실시, 다른 시설로의 확산,\n    제도화 등 시설서비스의 질적 향상을 위한 시책을 실시\n\n  - 시･도지사 및 시･군･구청장은 관할 거주시설 내 학대행위자에 대한 인사\n    조치(징계 등) 결과 확인 의무화\n       * 다만 학대행위자는 객관적 사실에 따라 증거가 확인되는 경우, 법원 등에서 최종 확정된 경우\n         등으로 판단 가능\n   ** 확인절차 : (지자체) 행위자에 대한 인사조치 결과 제출요청 → (시설) 인사조치 결과 제출(징계\n      여부 및 그 사유 등) → (지자체) 인사조치 결과를 지도ㆍ감독 참고자료로 활용\n\n  - 시･도지사 또는 시･군･구청장은 「사회복지법인 및 사회복지시설 재무･회계\n   규칙」 등 관련규정에 따라 장애인거주시설의 예산･결산･회계･물품･후원금\n   관리 등 지도･감독을 실시한다.\n   * 특히, 장애인거주시설에서 관행적인 부적정 계약 및 후원금 접수 사례가 발생하지 않도록 지도･\n     감독 철저 필요"}, {"p": 73, "t": "                                  Ⅰ. 장애인거주시설 공통 사항\n\n\n○ 장애인복지실시기관은 ｢사회복지사업법｣ 제43조의2(시설의 평가) 및 시행규칙\n  제27조의2(시설의 평가)규정에 따라 사회복지시설(장애인 거주시설) 평가결과\n  우수 시설로 선정된 시설에 대하여 포상금 등 인센티브를 지원할 수 있다.\n\n다. 미신고 시설 관리\n○ 법률 근거\n - ｢사회복지사업법 시행규칙｣ [별표 4] 1차 개선명령, 2차 시설폐쇄\n○ 미신고시설：사회복지시설로서 신고를 하지 않고 요보호대상자에게 거주\n  서비스를 제공하는 불법시설로 행정처분 및 형사처벌 대상\n\n○ 미신고시설 폐쇄조치 등 정비 추진\n\n - 사회복지(시설)서비스는 공공성에 기초하여 국가･지자체 책임주의에 의해\n  제공되어야 하므로 시설 운영(설치)자의 임의적인 장애인보호 및 시설운영은\n  불법임\n\n - 법률적 근거(장애인 거주시설 입소대상 및 절차 지침 참조)\n\n◈ 장애인복지시설 서비스의 신청, 욕구조사 및 보호결정\n ① 시설서비스의 신청(장애인 본인 또는 그 가족이 관할 시장･군수･구청장에게 신청)\n ② 복지욕구의 조사(시장･군수･구청장은 복지담당 공무원으로 하여금 시설서비스의 필요성,\n   대상자 여부, 시설보호의 적합성 등을 조사하게 함)\n ③ 보호의 결정(시장･군수･구청장은 보호의 실시여부와 그 유형을 결정)\n\n\n - 미신고시설 설치 운영자가 시설이용(입소)희망 장애인을 모집(유인)하거나\n  자체적인 입소결정 조치는 법적근거 없는 불법행위이므로 시설폐쇄 및\n  근절 조치\n\n - 신고하지 않고 장애인복지시설을 설치 운영할 경우, 운영자에게는 1년 이하\n  징역 또는 1,000만원 이하 벌금에 처하는 조항을 엄격하게 적용하고 해당"}, {"p": 74, "t": "    시설은 폐쇄조치하여 미신고 장애인복지시설이 발생하지 않도록 주기적인\n    순찰 활동 등 관리 강화\n\n  - 장애인 미신고시설에 대해 인권침해, 기초수급비･장애수당(장애인 개인금전)등\n    사용에 관한 불시 조사 실시\n   * 시설조사는 불가피한 경우를 제외하고는 장애인권익옹호기관, 장애인인권 관련 단체 등과 민･관\n     합동으로 실시\n   * 조사과정에서 성추행 등 진술 확인시 전문상담을 위해 거주장애인을 타 시설 등에 분리 조치(긴급보호)\n   * 필요에 따라 관할 장애인권익옹호기관, 수사기관의 지원 협조하에 실시\n\n  - 시설별 조사 결과에 따라 시설폐쇄, 고발 등 단계적 조치\n\n  - 미신고시설 입구 등에 설치한 불법, 허위간판 완전제거(광고물관리부서)\n   * 지역사회에 신고시설 혼란 및 미신고 시설 후원, 봉사 등 예방 효과\n\n  - 미신고시설에서 발생하는 인권문제 등을 반상회보 등 지역 언론 매체에 보도\n    요청, 기고 등 활동 강화\n   * 미신고시설의 낮은 서비스 질 문제를 지역사회에서 알 수 있도록 하여 시설이용 차단\n\n  - 시설이용 장애인 지원조치\n   * 시설 이용 장애인은 장애인의 의사를 고려하여 타 시설로 전원조치 하거나, 지역사회에서 이용 가능한\n     서비스 안내 및 연계, 지역사회 자립지원 제도 연계 등 필요한 지원 조치 시행\n   * 전원조치(긴급보호)에 필요한 시･군･구내의 시설 자릿수가 부족할 경우 시･군･구 및 시･도간\n     전원조치(대상 시･군･구 및 시･도는 이에 적극 협조)\n\n  - 지자체별로 미신고시설 파악, 폐쇄조치 등을 위한 상시 관리체계 마련\n   * 지역 내 읍･면･동의 수급자 담당 공무원 등 주기적 순찰 요원이 미신고 시설 발견 시 시･군･구에\n     보고토록 하고 즉시 조치하는 체계 구축"}, {"p": 75, "t": "                                    Ⅰ. 장애인거주시설 공통 사항\n\n\n    참고：사회복지사업법상 신고제도\n\n○ ｢행정절차법｣ 제40조의 신고\n - 행정절차법 제40조에서 규정하고 있는 신고는 “개별법령에서 규정한 형식상의 신고요건을 갖추어\n  행정청에 일정한 사항을 통지”함으로써 의무가 끝나는 강학상 의미의 신고임                    제2장\n - 판례에 의하면 행정절차법상 신고의 경우, 민원인이 신고서를 행정청에 접수함으로써 법적효과가\n  발생하며 행정청은 신고수리를 거부할 수 없음\n○ ｢사회복지사업법｣ 제34조의 신고\n ▷ ’97년 개정을 통해(법률 제5358호) 허가제에서 신고제로 전환\n ▷ ｢사회복지사업법｣ 제6조(시설 설치의 방해 금지)\n  ⇒ 시･군･구청장은 “정당한 이유”없이 사회복지시설의 설치를 지연시키거나 제한하는 조치를 하여\n    서는 아니된다.\n  - 사회복지사업법상 신고제도는 자족적 공법행위인 행정절차법 제40조의 신고보다는 정당한 이유가 있을\n    경우 사회복지시설의 설치를 지연 또는 제한할 수 있는 완화된 허가제에 가깝다고 할 수 있음\n  - 단, 정당한 이유 없이 신고접수를 거부할 경우 사회복지사업법 제6조에 위배되며, 신고거부\n    자체가 행정소송의 대상이 되므로 신중을 기할 것\n    * 장애인 거주시설의 경우 시설설치 신고 수리와 신고된 시설에 시설이용 장애인의 입소의뢰는\n     각각 개별사안으로 판단 결정\n\n○ 사회복지시설 신고접수 절차 예시\n ① 해당 시설의 신고요건 안내\n  → 면담을 통해 운영하고자 하는 시설의 종류, 규모, 운영주체 등에 대해 상담한 후 관련법령의\n   신고요건을 안내하고 신고서 양식 배부\n ② 사회복지사업법 및 시설 개별법령 충족여부 검토\n  → 신고서 제출시 사회복지사업법 및 개별법령에서 요구하는 신고요건에 적합한지를 검토하고 보완요구\n   또는 수리여부 결정(필요시 현장방문)\n ③ 타 법령 충족여부 검토\n  → 사회복지사업법 및 시설 개별법령을 충족하였다면, 건축법, 그린벨트 관련법 등 타 법령 위반여부를\n   검토하여 최종적으로 신고수리여부 결정\n ④ 사회복지시설신고증 발급\n  → 해당 민원인에게 신고증을 발급하고 사회복지사업법 및 개별법령상 시설운영에 따른 권리･의무 안내"}, {"p": 76, "t": "라. 인권침해 발생 시 조치 및 처리 절차\n\n 1) 시설에 대한 조치\n\n ○ (피해자 보호･분리 조치) 정확한 진상 파악을 위해 성폭행, 폭행 등 사건의\n   경우 피해 장애인을 우선 보호･분리(쉼터 입소 등) 조치\n\n  - 시설이용에 관한 절차 규정\n   * ｢사회복지사업법｣ 제33조의2(서비스신청), 제33조의3(복지요구조사), 제33조의4(보호의 결정)\n   * ｢장애인복지법｣ 제34조 제1항제3호(재활상담조치), 제57조(장애인복지시설이용), 제60조의2\n      (거주시설이용절차)：이용신청, 적격성심사, 이용결정\n   * ｢장애인복지법 시행규칙｣ 제19조：시설에 장애인복지시설 이용의뢰서 송부\n\n ○ (전문기관조사) 시･군･구 주무관청의 진상 조사, 장애인권익옹호기관･수사기관에\n   신고, 인권전문기관이나 국가인권위원회에 조사 의뢰\n   * 형사적 처리가 필요할 경우 수사기관에 고발 조치\n\n ○ (시설폐쇄 등 처분) 시･군･구 주무관청의 지도･감독 조사로 객관적 사실이\n   확인될 경우 ｢장애인복지법 시행규칙｣ 제44조의7[별표 5의5] 및 ｢사회복지사업법｣\n   시행규칙 제26조의2[별표 4]에 따른 행정처분\n   * 사안의 정도에 따라 개선명령, 시설장교체, 시설폐쇄\n\n\n 2) 법인에 대한 조치\n\n ○ ｢사회복지사업법｣ 제22조(임원의 해임명령) 처분 가능\n\n  - 회계부정이나 인권침해 등 현저한 불법행위 또는 그 밖의 부당행위 등이\n    발견되었을 때\n\n ○ ｢사회복지사업법｣ 제22조의2(임원의 직무집행정지)\n\n  - 시･도지사는 제22조에 따른 해임명령을 하기 위하여 같은 조 제1항 각 호의\n    사실 여부에 대한 조사나 감사가 진행 중인 경우 및 해임명령 기간 중인 경우\n    에는 해당 임원의 직무 집행을 정지시킬 수 있음"}, {"p": 77, "t": "                                 Ⅰ. 장애인거주시설 공통 사항\n\n\n○ ｢사회복지사업법｣ 제22조의3(임시이사의 선임)\n - 법인이 제20조에 따른 기간 내에 결원된 이사를 보충하지 아니하여 법인의\n  정상적인 운영이 어렵다고 판단되는 경우 시･도지사는 지체 없이 이해관계인의\n  청구 또는 직권으로 임시이사를 선임 할 수 있음\n○ ｢사회복지사업법｣ 제26조(설립허가 취소 등)\n - 시･도지사는 법인이 다음 각 호의 어느 하나에 해당할 때에는 기간을 정하여\n  시정명령을 하거나 설립허가를 취소할 수 있다. 다만, 제1호 또는 제7호에\n  해당할 때에는 설립허가를 취소하여야 한다.\n * 6. 법인이 운영하는 시설에서 반복적 또는 집단적 성폭력범죄 및 학대관련범죄가 발생한 때\n\n\n3) 시설폐쇄 시 임시시설장 선임 및 입소자 전원 기준\n\n가) 임시 시설장 선임 및 임무\n\n○ 시･군･구는 임시 시설장이 선임되어 시설이 정상운영되도록 조치\n - (시설폐쇄 전) 법인에서 특별한 사유없이 시설장을 선임하지 않는 경우\n ∙ 시･군･구는 ｢장애인복지법｣ 제61조제1항에 따라 기한을 정하여 선임 보고\n   하도록 조치\n ∙ 보고 기한내 선임하지 않을 경우 법 제87조제9호에 의거 행정벌 부과\n   대상임을 통지하고 미이행 시 행정벌 부과\n ∙ 시･군･구는 종사자 인건비 지급 등 최소한의 운영을 위한 운영비 지급 및 운영\n   실태 등 관리감독 실시\n - (시설폐쇄 후) 시･군･구는 시설운영위원회, 지역 장애인 관련 단체 등 외부\n  추천을 받아 임시 시설장 역할을 행할 관리자를 선임\n ※ 시설폐쇄일 : 시설폐쇄 유예기간이 있을 경우 유예기간이 끝난 다음날\n\n○ 임시 시설장은 시설장으로서 권한과 책임을 가지고 시설 운영\n - 종사자 및 입소자 관리, 회계 및 시설 관리, 입소자 전원 지원\n - 특히, 폭행･학대 예방 등 입소자 인권보호를 위해 상담･교육 등 철저"}, {"p": 78, "t": " 나) 시･군･구 조치사항\n\n ○ 시설폐쇄 행정처분 시에 전원 및 자립지원 계획, 시설 운영 지원 계획 등을\n   함께 수립하여 시행\n\n  - 입소자 전원 및 자립지원 계획 수립 시에는 개별상담을 통해 본인 의사가\n    최대한 반영되도록 노력\n   ※ 입소자가 자립을 원할 경우 지자체 담당자는 입소자 자립지원에 필요한 지역사회 서비스 안내 및 연계\n\n  - 시설 운영지원 계획 수립 시에는 임시 시설장 선임, 시설 운영실태 점검,\n    운영비 지원 등이 포함된 계획 수립 및 시행\n\n 다) 입소자 전원에 따른 세부기준\n\n ○ 시설폐쇄 행정처분을 받은 시설의 입소 장애인을 타 시설로 전원할 경우\n\n  - 우선적으로 정원 대비 현원에 여유가 있는 시설로 전원 조치하되, 불가피한\n   경우 시군구청장 판단 하에 타 시설로 정원을 초과하여 전원 조치 가능\n   (한시적인 조치이며, 정원을 초과하여 운용할 때에는 초과인원에 대한 별도\n   지원을 하여야 하고, 기존 입소 장애인에 대한 지원은 동일하게 유지되어야 함)\n\n  - 시설 서비스 신청과 이용 적격성 여부 심사 생략 가능\n\n  - 실비이용대상자는 시설 정원의 50%까지 허용(전원된 장애인이 퇴소 등으로\n    실비이용자가 감소할 경우 30%를 유지할 수 있도록 추가 실비이용자 입소\n    제한)\n\n ○ 전원 요청을 받은 자치단체 및 시설은 특별한 이유 없이 입소자 전원을 거부할\n   수 없으며, 추후 조사 등을 통해 비협조가 확인된 경우 운영비 예산(국비)을 차\n   등 지원할 수 있음\n\n  - 법인 및 시설은 운영비가 삭감되더라도 시설이 정상 운영되도록 자부담 또는\n    후원금 등 확보를 위해 노력"}, {"p": 79, "t": "                              Ⅰ. 장애인거주시설 공통 사항\n\n\n마. 종사자 채용시 유의사항\n\n○ ｢장애인복지법｣, ｢사회복지사업법｣, ｢아동복지법｣, ｢노인복지법｣ 등 관련 규정에\n  따라 관할 지자체 및 시설 운영자는 다음 사항을 고려하여 종사자 채용에\n  각별한 주의를 기할 것                                          제2장\n - ｢노인복지법｣ 제39조의17(노인관련기관의 취업제한 등) : 노인학대관련범\n  죄로 형 또는 치료감호를 선고받은 경우 판결(약식명령 포함)로 그 형 또는              애\n  치료감호의 전부 또는 일부의 집행을 종료하거나 집행이 유예･면제된 날\n  (벌금형을 선고받은 경우에는 그 형이 확정된 날을 말함)부터 일정기간\n  (취업제한기간)동안 ｢장애인복지법｣ 제58조에 따른 장애인복지시설을\n  운영하거나 장애인복지시설에 취업 또는 사실상 노무를 제공할 수 없음\n\n - ｢장애인복지법｣ 제59조의3(장애인관련기관에의 취업제한 등)제1항：장애인\n  학대관련범죄나 성범죄로 그 형 또는 치료감호를 선고하는 경우에는 판결\n  (약식명령 포함)로 그 형 또는 치료감호의 전부 또는 일부의 집행을 종료\n  하거나 집행이 유예･면제된 날(벌금형을 선고받은 경우에는 그 형이 확정된\n  날을 말함)부터 일정기간(취업제한기간)동안 장애인복지시설을 운영하거나\n  장애인복지시설에 취업 또는 사실상 노무를 제공할 수 없음\n\n  ∙ 시･군･구청장은 장애인학대관련범죄나 성범죄로 취업제한명령을 선고받은\n   사람이 장애인복지시설을 운영하거나 장애인복지시설에 취업 또는 사실상\n   노무를 제공하고 있는지를 직접 또는 관계기관 조회 등의 방법으로 연 1회\n   이상 확인 점검해야 함\n\n - ｢아동복지법｣ 제29조의3(아동관련기관의 취업제한 등)：아동학대관련범죄로 형\n  또는 치료감호를 선고하는 경우에는 판결(약식명령 포함)로 그 형 또는 치료\n  감호의 전부 또는 일부의 집행을 종료하거나 집행이 유예･면제된 날(벌금형을\n  선고받은 경우에는 그 형이 확정된 날을 말함)부터 일정기간(취업제한기간)\n  동안 장애인복지법 제58조에 따른 장애인복지시설을 운영하거나 아동관련\n  기관에 취업 또는 사실상 노무를 제공할 수 없음"}, {"p": 80, "t": "  - ｢사회복지사업법｣ 제35조(시설장의 장) 및 제35조의2(종사자)에 해당하는 사람\n\n  - 관할행정기관장은 취업제한명령을 위반하여 장애인관련기관을 운영 중인\n   장애인관련기관 운영자에게 운영 중인 장애인관련기관의 폐쇄를 요구하여야\n   한다.(｢장애인복지법｣ 제59조의3제9항)\n\n  - 장애인관련기관의 운영자가 제59조의3제5항을 위반하여 취업자 등에 대하여\n   장애인학대관련범죄등 경력을 확인하지 아니한 경우에는 500만원 이하의\n   과태료를 부과한다.(｢장애인복지법｣ 제90조)\n\n\n바. 무연고 입소 장애인(지적･자폐성･정신, 아동) 신상카드 제출\n\n 1) 추진 근거 및 목적\n\n ○ ｢실종아동법｣ 제6조 제3항~제6항(신고의무 등), 제7조(미신고 보호행위의 금지)\n\n ○ 보호시설에 무연고 아동･장애인(지적･자폐성･정신)이 입소하는 경우 신상\n   카드를 작성, 지자체･경찰･실종아동전문기관(아동권리보장원) 등에 제출하여\n   신고의무를 이행\n\n 2) 신상카드 작성대상 아동･장애인\n\n ○ 보호자가 확인되지 않은 무연고 장애아동(발견당시 연령 기준, 장애유형 무\n   관)과 지적･자폐성･정신장애인(연령무관)\n\n  - 사회서비스정보시스템(대상자 기본정보)에 ʻʻ연고자 없음ʼʼ으로 표시한 입소자 중\n    다음의 “참고 : 보호자가 확인되지 않은 무연고 아동･장애인의 기준”에 해당\n    하는 경우"}, {"p": 81, "t": "                                      Ⅰ. 장애인거주시설 공통 사항\n\n\n    참고：보호자가 확인되지 않은 무연고 아동･장애인의 기준\n\n○ 가족관계등록부(구 호적)가 없는 아동 및 장애인\n○ 연고자를 알 수 없어 새로 성과 본을 창설(호적취득)한 아동\n - 단독으로 새로 성과 본을 창설한 아동 및 장애인\n - 시설장 등을 보호자로 새로 성과 본을 창설한 아동 및 장애인                            제2장\n○ 가족관계등록부(호적)는 있지만 시설입소후 가족관계등록부(호적상)의 보호자가 시설종사자 등과\n  직접면담 등 단 한번의 방문도 없는 아동 및 장애인\n - 다만, 가족 연락두절 및 기피, 부양회피의 경우는 가족이 있다는 것이 확인된 것이므로 연고자로 관리       인\n  ※ 가족관계등록부(호적상)의 보호자 : 부모, (외)조부모, (외)삼촌, 이모, 고모\n○ 일시아동보호시설 등 타 시설에서 전원시 구체적인 보호자 정보가 없는 아동 및 장애인\n\n\n3) 신상카드 작성제출 방법\n\n○ (작성자) ʻʻ보호자가 확인되지 않은(무연고)ʼʼ, ʻʻ발견당시 18세 미만의 장애아동ʼʼ\n  또는 ｢장애인복지법｣ 제2조의 장애인 중 ʻʻ지적･자폐성･정신장애인ʼʼ을 보호하는\n  보호시설의 장\n\n○ (작성 대상 장애인 시설) 장애유형별 거주시설, 중증장애인 거주시설, 장애영\n  유아 거주시설, 장애인 단기거주시설, 장애인 공동생활가정, 독립형 주거서비스\n  제공기관\n\n○ (작성･제출방법) ʻʻ사회서비스정보시스템ʼʼ을 통해 신상카드 정보 입력･제출\n\n① 대상자 인적사항 입력\n\n  - (시스템 경로) 대상자 관리 > 대상자 기본정보 관리 > 대상자 기본정보\n\n  - (작성) 대상자 기본인적사항 입력 후 저장\n   ☞ 가족(연고) 유무에서 ʻʻ무ʼʼ로 체크 한 대상자 중 보호자가 확인되지 않는 경우 사진파일을 필수\n     첨부하며 신상카드 정보를 반드시 입력(대상자 기본정보관리 > 실종정보)\n\n② 신상카드 정보 입력\n\n  - (시스템 경로) 대상자 관리 > 대상자 기본정보 관리 > 실종정보"}, {"p": 82, "t": "   - (작성) 아동 발견 시 확인한 정보는 모두 입력하여야 하며, 특히 아동 신상\n       확인에 중요한 필수정보*가 누락되지 않도록 꼼꼼히 확인\n       * 이름, 성별, 생년월일, 신장, 체중, 발견장소, 입소 동기, 보호 장소, DNA 채취 여부, 사진 첨부\n         여부\n\n  ③ (신상카드 제출) 시스템을 통한 정보공유(경찰청, 시･군･구, 전문기관 간 시스템\n    연계 중)\n\n\n 4) 시･군･구 점검 방법\n\n ○ 사회보장정보시스템(행복e음)* 정보 조회･점검\n  - (조회 권한 부여) 시도･시군구 일반시설법인담당/ 시도･시군구 입소시설\n    법인담당/ 시군구 보건소 담당 중 선택\n\n  - (시스템 경로) 시설법인 > 실종아동 등 신상카드 조회"}, {"p": 83, "t": "                                        Ⅰ. 장애인거주시설 공통 사항\n\n\n○ (점검사항) ❶보호시설이 작성한 무연고 아동･장애인(지적･자폐성･정신)의\n  신상카드 정보 ❷행려자로 입소한 아동 등의 신상 카드 정보\n\n - 무연고 아동 등의 신상카드 제출여부 및 정보 입력여부 확인\n\n - 신상카드는 생성되어있지만 기본정보에서 넘어 온 정보 외의 다른 정보가\n   모두 ʻnullʼ로 표시된 카드 정보 확인\n  ※ 정보 입력상태 미흡 시 해당 기관에 정보 보완 요청 및 보완내용 확인\n - 무연고 아동･장애인 발견 시 확인한 정보는 모두 등록, 특히 대상자 신상\n   확인에 중요한 필수정보*의 누락 여부 반드시 확인\n  * 이름, 성별, 생년월일, 신장, 체중, 발견장소, 입소 동기, 보호 장소, DNA 채취 여부, 사진 첨부 여부\n\n○ 과태료･벌칙\n - (신상카드 미제출) 200만원 이하의 과태료(｢실종아동법｣ 제19조제2항)\n\n - (미신고 보호행위) 5년 이하의 징역 또는 5천만원 이하의 벌금(｢실종아동법｣\n  제17조)\n\n\n사. 장애인 거주시설 통계 관리 및 행정처분 이력 관리\n\n1) 배경 및 목적\n\n○ 매년도 장애인 거주시설 통계자료에 대한 지자체 역할의 중요성 제고\n\n2) 활용범위\n\n○ 기본 시설 현황을 통한 공식 통계자료 발간(매년도 보건복지통계연보 등)\n○ 국정감사, 의원 요구자료 등 각종 외부기관 요청자료\n○ 시설 현황의 추계 및 관련 정책 수립의 기초자료\n○ 국민 대상 시설 현황 정보 안내 등"}, {"p": 84, "t": " 3) 통계자료 작성요령\n\n ○ 일 정\n  - 보건복지부로부터 전국 시･도로 시설 통계자료 요청(’25. 1월)\n  - 시･도 → 시･군･구로 즉시 통계자료 요청 및 작성 제출(’25. 1월말)\n  - 요청 통계자료 취합완료 후 확인 요청(’25. 2월 중)\n  - 통계자료 공식 통보(’25. 3월)\n\n ○ 요청정보\n  - 장애인 거주시설 관련 각종 현황자료(시설유형, 소재지, 연락처, 법인유무,\n    이용 장애인 정･현원, 장애유형, 연령, 성별, 입･퇴소 현황, 종사자 정･현원,\n    직위, 직급, 자격증 현황 등)\n\n\n 4) 행정사항\n\n ○ 보건복지부 요청에 따라 전국 지자체는 전년도 말 기준 관내 시설 현황을 신속히\n   조사･작성하고,\n  - 특히, 시･도는 해당 시･군･구의 자료를 면밀히 검토하여 정리 후 보건복지부로\n    보고할 것\n\n ○ 시･군･구청은 차세대 사회보장정보시스템(행복e음)에 입력된 정보와 설문조사\n   기능을 적극 참조\n\n ○ 자료작성의 기본주체인 시･군･구는 관내 시설의 현황을 전년도 말 기준으로\n   엄격히 조사･파악하여 당해 통계자료를 작성하고,\n  - 당해 자료는 보건복지부 취합 후 국･내외 기관에 공식적으로 안내되는 만큼,\n    자료작성에 만전을 기할 것\n\n ○ 행정처분은 ｢장애인복지법｣, ｢사회복지사업법｣ 등에 따라 처리하며, 행정처분\n   결과는 처분 부과 주체가 차세대 사회보장정보시스템(행복e음) 내 [기관관리\n   감독]-[행정처분관리]탭에 반드시 처분 후 한 달 이내에 입력하여 관리해야 함"}, {"p": 85, "t": "                                      Ⅰ. 장애인거주시설 공통 사항\n\n\n   장애인복지법의 행정처분 기준(시행규칙 제44조의8[별표 5의 5])\n\n\n※ 장애인복지시설 사업안내 개정 시 최신 행정처분 기준을 반영하였으나, 그 후 개정된 내용이 있을\n 수도 있으니 행정처분 기준은 www.law.go.kr에서 확인\n\n\n1. 일반기준\n  가. 위반행위가 둘 이상인 경우로서 그에 해당하는 각각의 처분기준이 다른\n     경우에는 그 중 가장 무거운 처분기준에 따른다.\n\n  나. 위반행위가 넷 이상인 경우 또는 제2호바목･사목에 따른 위반행위로 인하여\n    시설을 정상적으로 운영하는 것이 불가능하다고 인정되는 때에는 제2호에\n    따른 처분기준에도 불구하고 시설의 폐쇄를 명할 수 있다.\n\n  다. 위반행위가 고의나 중대한 과실이 아닌 사소한 부주의나 오류로 인한 것\n     으로 인정되는 경우, 위반의 내용･정도가 경미한 경우, 그 밖에 상당한\n     사유가 있다고 인정되는 경우에는 제2호에 따른 처분기준에도 불구하고\n     각각 1회에 한정하여 시설장교체를 갈음하여 개선명령을, 시설폐쇄를\n     갈음하여 시설장교체를 명할 수 있다. 이 경우 해당 처분은 차수의 산정에\n     산입하지 않는다.\n\n  라. 위반행위의 횟수에 따른 행정처분의 가중된 부과기준은 최근 3년간 같은\n     위반행위로 행정처분을 받은 경우에 적용한다. 이 경우 기간의 계산은\n     위반행위에 대하여 행정처분을 받은 날과 그 처분 후 다시 같은 위반행위를\n     하여 적발된 날을 기준으로 한다.\n\n  마. 라목에 따라 가중된 부과처분을 하는 경우 가중처분의 적용 차수는 그\n     위반행위 전 부과처분 차수(라목에 따른 기간 내에 행정처분이 둘 이상\n     있었던 경우에는 높은 차수를 말한다)의 다음 차수로 한다."}, {"p": 86, "t": " 2. 개별기준\n\n                                                 행정처분기준\n         위반행위                 근거법조문\n                                         1차 위반   2차 위반    3차 위반\n가. 장애인복지시설이 법 제59조제6항에       법 제62조제1항   개선명령    시설장교체    시설폐쇄\n   따른 시설기준에 미치지 못한 때\n나. 장애인복지시설이 정당한 사유 없이 법                  개선명령    시설장교체    시설장교체\n   제61조에 따른 보고를 하지 않거나 거짓\n   으로 보고한 때 또는 조사･검사 및 질문을\n   거부･방해하거나 기피한 때\n다. 장애인복지시설이 사회복지법인이나 비                   시설폐쇄      -        -\n   영리법인이 설치･운영하는 시설인 경우\n   그 사회복지법인이나 비영리법인의 설립\n   허가가 취소된 때\n라. 장애인복지시설의 회계 부정이나 시설\n   이용자에 대한 인권침해 등 불법행위,\n   그 밖의 부당행위 등이 발견된 때\n 1) 국가나 지방자치단체의 보조금 또는                   개선명령    시설장교체    시설장교체\n    후원금을 사용용도 외의 용도로 사용\n    한 때\n 2) 회계장부를 기재하지 않거나 허위로                   개선명령    시설장교체    시설장교체\n    기재한 때\n 3) 시설 이용자에 대한 부당한 체벌, 폭행,               개선명령    시설장교체    시설폐쇄\n    학대 등 인권침해가 발생한 경우(바목\n    및 사목에 해당하는 경우 제외한다)\n 4) 그 밖의 회계 및 시설운영과 관련한                  개선명령     개선명령    시설장교체\n    부당행위가 발생된 때\n마. 장애인복지시설이 설치 목적을 이루었                   시설폐쇄\n   거나 그 밖의 사유로 계속하여 운영할\n   필요가 없다고 인정되는 때\n바. 장애인복지시설에서 성폭력범죄가 발생한\n   경우\n 1) 시설의 장 또는 종사자가 시설이용자를                 시설폐쇄\n    대상으로 「성폭력범죄의 처벌 등에 관한\n    특례법」 제2조제1항제3호부터 제5호\n    까지의 규정에 따른 성폭력범죄[「형법」\n    제300조, 「성폭력범죄의 처벌등에 관한"}, {"p": 87, "t": "                                               Ⅰ. 장애인거주시설 공통 사항\n\n\n   특례법」 제11조부터 제14조까지,\n   제14조의2, 제14조의3 및 제15조\n   (같은 법 제14조, 제14조의2 및 제14조의\n   3의 미수범만 해당한다)의 범죄는\n   제외한다] 또는 「아동･청소년의 성\n   보호에 관한 법률」 제2조제3호의\n   아동･청소년대상 성폭력범죄를 저지른\n   경우\n 2) 시설의 장이 시설이용자를 대상으로                       시설장교체   시설폐쇄\n    「형법」 제300조, 「성폭력범죄의 처벌\n    등에 관한 특례법」 제11조부터 제14조\n    까지, 제14조의2, 제14조의3 및 제15조\n    (같은 법 제14조, 제14조의2 및 제14조의\n    3의 미수범만 해당한다)의 성폭력범죄를\n    저지른 경우\n 3) 시설의 종사자가 시설이용자를 대상으로                     개선명령    시설장교체    시설폐쇄\n    「형법」 제300조, 「성폭력범죄의 처벌\n    등에 관한 특례법」 제11조부터 제14조\n    까지, 제14조의2, 제14조의3 및 제15조\n    (같은 법 제14조, 제14조의2 및 제14조의\n    3의 미수범만 해당한다)의 성폭력범죄를\n    저지른 경우\n 4) 시설이용자 간 「성폭력범죄의 처벌 등에                    개선명령    시설장교체    시설폐쇄\n    관한 특례법」 제2조제1항제3호부터\n    제5호까지의 규정에 따른 성폭력범죄\n    또는 「아동ㆍ청소년의 성보호에 관한\n    법률」 제2조제3호의 아동･청소년대상\n    성폭력범죄가 발생한 경우\n사. 장애인복지시설에서 「아동복지법」 제3조                     개선명령    시설장교체    시설폐쇄\n   제7호의2의 아동학대관련범죄, 「노인\n   복지법」 제1조의2제5호의 노인학대\n   관련범죄 또는 법 제2조제4항의 장애인\n   학대관련범죄가 발생한 경우\n아. 장애인복지시설이 이 법 또는 이 법에                      개선명령    시설장교체    시설폐쇄\n   따른 명령이나 처분을 위반한 경우\n자. 장애인 거주시설이 법 제60조의3에 따른        법 제62조제2항   개선명령    시설장교체    시설폐쇄\n   서비스 최저기준을 유지하지 못할 때"}, {"p": 88, "t": "       사회복지사업법의 행정처분 기준(시행규칙 제26조의2[별표 4])\n\n\n※ 장애인복지시설 사업안내 개정 시 최신 행정처분 기준을 반영하였으나, 그 후 개정된 내용이 있을 수도\n 있으니 행정처분 기준은 www.law.go.kr에서 확인\n\n\n 1. 일반기준\n\n   가. 위반행위의 횟수에 따른 행정처분의 기준은 최근 3년간(2. 개별기준 제9호의\n       위반행위의 경우에는 5년간) 같은 위반행위로 행정처분을 받은 경우에\n       적용한다. 이 경우 기간의 계산은 위반행위에 대하여 행정처분을 받은 날과\n       그 처분 후 다시 같은 위반행위를 하여 적발된 날을 기준으로 한다.\n\n   나. 가목에 따라 가중된 행정처분을 하는 경우 가중처분의 적용 차수는 그\n       위반행위 전 행정처분 차수(가목에 따른 기간 내에 행정처분이 둘 이상\n       있었던 경우
