, 실신 등을 감지하는 경우 위 낙상\n   사례에 준하여 조치\n\n마. IoT기기의 관리\n1) 유지･보수\n○ IoT기기의 유지･보수는 한국장애인개발원이 사업자와 협의하여 진행하며,\n  장애인거주시설은 IoT기기 고장 발생 시, 한국장애인개발원으로 연락하여\n  A/S를 접수하여야 함.\n\n\n2) IoT기기 관리\n\n○ 유튜브 홈페이지 내 ʻ디지털 통합돌봄ʼ 검색 후 한국장애인개발원 채널에\n  게시된 영상을 참조하여 IoT기기 상시 관리\n\n - IoT활용 디지털 통합돌봄 사업 1차년도 장비 매뉴얼 교육 영상\n\n - IoT활용 디지털 통합돌봄 사업 2~3차년도 장비 매뉴얼 교육 영상\n\n - IoT활용 디지털 통합돌봄 사업 디지털돌봄시스템 교육 영상\n\n○ 한국장애인개발원 홈페이지 내 ʻ자료실_교육_교육자료_정책연구ʼ에 게시된\n  매뉴얼을 참조하여 IoT기기 상시 관리\n\n - IoT활용 디지털 통합돌봄 사업 1차년도 IoT기기 장비 사용 매뉴얼\n\n - IoT활용 디지털 통합돌봄 사업 2~3차년도 IoT기기 장비 사용 매뉴얼\n\n - IoT활용 디지털 통합돌봄 사업 디지털돌봄시스템 사용자 매뉴얼"}, {"p": 180, "t": "바. 행정사항\n\n 1) 보안서약\n\n ○ 한국장애인개발원, 사업자, 시설의 장 등 종사자는 장애인거주시설 IoT･AI\n   활용 돌봄사업을 통해 취득하거나 알게 된 입소자의 개인정보, 사업 관련 자료\n   등 일체의 자료를 외부에 누설하거나 타 목적으로 사용할 수 없으며, 보안서약서\n   (서식 1)를 작성하여 보건복지부(장애인권익지원과)로 제출하여야 함\n   ※ 한국장애인개발원이 시설에 장비 설치 전 일괄 징구하여 보건복지부로 제출\n\n\n 2) 개인정보 수집 이용 제공 동의\n\n ○ 한국장애인개발원은 IoT장비 설치 시 장애인 거주시설 등에 입소자의 정보\n   수집 및 목적 등을 사전 고지하고, 시설의 장은 개인정보수집이용제공동의서\n   (서식 2)를 작성하여 한국장애인개발원으로 제출하여야 함\n\n ○ 시설의 장은 입소 장애인의 서명을 받아 개인정보수집이용제공동의서(서식 3)를\n   작성･보관하여야 함.\n   ※ 시설에서 사용하는 기존 양식에 해당 내용을 포함하여 서명을 받을 경우, 갈음이 가능함.\n\n\n 3) 디지털돌봄시스템 사용자 권한 신청서\n\n ○ 한국장애인개발원, 시설의 장 등 종사자는 디지털돌봄시스템 사용자 등록신청 시\n   사용자 권한 신청서(서식 4), 상기 보안서약서(서식 1)를 작성하여 서명한\n   스캔본을 디지털돌봄시스템에 등록하고 승인을 요청하여야 함\n   ※ 디지털돌봄시스템 사용자 권한 승인은 한국장애인개발원에서 수행함.\n\n\n 4) 만족도 조사\n\n ○ 한국장애인개발원은 매 사업연도 종료 후 장애인 거주시설 담당자를 대상으로\n   IoT돌봄사업 만족도를 조사하여 그 결과를 보건복지부로 제출"}, {"p": 181, "t": "                                            Ⅰ. 장애인거주시설 공통 사항\n\n\n<서식 1> 보안서약서\n\n                     장애인 거주시설 IoT, AI활용 돌봄사업\n                         보 안 서 약 서\n\n\n  본인은 20   년   월   일부로 장애인 거주시설 IoT, AI활용 돌봄사업, 디지털돌봄시스템 업무를            인\n  수행함에 있어 다음 사항을 준수할 것을 엄숙히 서약합니다.\n\n   1. 본인은 개인정보보호법 및 관계 법령을 준수한다.\n\n\n   2. 본인은 장애인 거주시설 IoT, AI활용 돌봄사업, 디지털돌봄시스템 업무 중 알게 될 일체의 내용이 직무상\n     기밀 사항임을 인정한다.\n\n\n   3. 본인은 이 기밀을 누설함이 서비스 대상자 등 당해 사업의 관계자 및 국가의 이익에 위해가 될 수\n     있음을 인식하여 업무 수행 중 지득한 제반 기밀 사항을 일체 누설하거나 공개하지 아니한다.\n\n\n   4. 본인이 이 기밀을 누설하거나 관계 규정을 위반한 때에는 관련 법령 및 계약에 따라 어떠한 처벌\n     및 불이익도 감수한다.\n\n\n                            년   월     일\n\n\n                      서약자                 소속:\n                                          직위:\n                                          성명:                  (서명)\n\n\n 보건복지부장관 귀하"}, {"p": 182, "t": "<서식 2> 개인정보 수집 이용 제공 동의서(기관용)\n\n                          장애인거주시설 IoT, AI활용 돌봄사업\n                     개인정보 수집 이용 제공 동의서\n\n       장애인거주시설 IoT, AI활용 돌봄사업 서비스는 대상자의 개인정보를 아래와 같이\n 개인    수집하여 이용함을 알려드립니다.\n 정보     1. 수집 및 이용목적 : 장애인복지법 제24조(안전대책 강구) 관련 안전생활 지원을 위한 IoT 활용\n            돌봄 서비스 제공                                                  동 의 □\n 수집\n        2. 수집항목 : 대상자(성명, 생년월일, 성별, 시설전화번호, 핸드폰번호, 시설주소), 건물형태, 와상상태\n  ･        (거동가능, 거동불가) 활동량, 맥박, 호흡                                    비동의 □\n 이용     3. 보유 및 이용기간 : 퇴소 시까지 보유하고, 퇴소 후에는 지체 없이 파기됩니다.\n 동의    귀 기관은 개인정보 수집/이용에 동의하지 않으실 수 있습니다.\n       동의를 거부할 경우에는 서비스 이용이 제한될 수 있습니다.\n       장애인거주시설 IoT, AI활용 돌봄사업 서비스는 제공서비스 특성상 대상자의 민감 정보를\n 민감    아래와 같이 처리함을 알려드립니다.\n 정보     1. 목적 : 장애인복지법 제24조(안전대책 강구)관련 안전생활 지원을 위한 IIoT 활용 돌봄 서비스      동 의 □\n 수집        제공\n  ･     2. 항목 : 와상상태(거동가능, 거동불가) 활동량, 맥박, 호흡\n        3. 보유 및 이용기간 : 퇴소 시까지 보유하고, 퇴소 후에는 지체 없이 파기됩니다.                비동의 □\n 이용\n 동의    귀 기관은 민감정보 수집/이용에 동의하지 않으실 수 있습니다.\n       동의를 거부할 경우에는 서비스 이용이 제한될 수 있습니다.\n       장애인거주시설 IoT, AI활용 돌봄사업 서비스는 응급상황대응과 사업수행을 위해 서비스\n       대상자의 개인정보를 해당사업을 위해 아래와 같이 제공함을 알려드립니다.\n        1. 제공받는 자 : U-119서비스(소방청, 소방본부, 지역소방서), 보건복지부, 한국장애인개발원, 한국\n 개인        사회보장정보원, 장애인거주시설 IoT, AI활용 돌봄사업(센서구매설치, 유지보수, 시스템 구축) 위탁\n 정보        수행기관                                                        동 의 □\n        2. 이용목적 : 응급상황 발생 시 신속/정확한 응급 서비스 제공, 장애인거주시설 IoT, AI활용 돌봄사업\n 제3자\n           (센서구매설치, 유지보수, 시스템 구축)을 위한 서비스 연계\n 제공     3. 제공하는 항목 : 대상자(성명, 생년월일, 성별, 시설전화번호, 핸드폰번호, 시설주소), 건물형태,     비동의 □\n 동의        와상상태(거동가능, 거동불가) 활동량, 맥박, 호흡\n        4. 개인정보 보유 및 이용 기간 : 퇴소 시까지 보유하고, 퇴소 후에는 지체 없이 파기됩니다.\n       귀하는 개인정보 제공에 동의하지 않으실 수 있습니다.\n       동의를 거부할 경우에는 서비스 이용이 제한될 수 있습니다.\n\n상기와 같은 내용을 설명 받았으며, 장애인거주시설 IoT, AI활용 돌봄사업 서비스를 신청합니다.\n\n\n                               20   년   월    일\n\n\n                                            신청기관명:                        (직인)\n\n\n보건복지부장관 귀하"}, {"p": 183, "t": "                                                 Ⅰ. 장애인거주시설 공통 사항\n\n\n<서식 3> 개인정보 수집 이용 제공 동의서(개인용)\n\n                         장애인거주시설 IoT, AI활용 돌봄사업\n                    개인정보 수집 이용 제공 동의서\n\n      장애인거주시설 IoT, AI활용 돌봄사업 서비스는 대상자의 개인정보를 아래와 같이 수집\n 개인   하여 이용함을 알려드립니다.\n 정보    1. 수집 및 이용목적 : 장애인복지법 제24조(안전대책 강구) 관련 안전생활 지원을 위한 IoT 활용\n          돌봄 서비스 제공                                                   동 의 □\n 수집\n       2. 수집항목 : 대상자(성명, 생년월일, 성별, 시설전화번호, 핸드폰번호, 시설주소), 건물형태, 와상상태             애\n  ･       (거동가능, 거동불가) 활동량, 맥박, 호흡                                    비동의 □     인\n 이용    3. 보유 및 이용기간 : 퇴소 시까지 보유하고, 퇴소 후에는 지체 없이 파기됩니다.\n 동의   귀 기관은 개인정보 수집/이용에 동의하지 않으실 수 있습니다.\n      동의를 거부할 경우에는 서비스 이용이 제한될 수 있습니다.\n      장애인거주시설 IoT, AI활용 돌봄사업 서비스는 제공서비스 특성상 대상자의 민감 정보를\n 민감   아래와 같이 처리함을 알려드립니다.\n 정보    1. 목적 : 장애인복지법 제24조(안전대책 강구)관련 안전생활 지원을 위한 IIoT 활용 돌봄 서비스      동 의 □\n 수집       제공\n  ･    2. 항목 : 신체불편사항(시력, 청력, 거동 상태 및 보유 질병 정보), 활동량, 호흡, 맥박\n       3. 보유 및 이용기간 : 퇴소 시까지 보유하고, 퇴소 후에는 지체 없이 파기됩니다.                비동의 □\n 이용\n 동의   귀 기관은 민감정보 수집/이용에 동의하지 않으실 수 있습니다.\n      동의를 거부할 경우에는 서비스 이용이 제한될 수 있습니다.\n\n      장애인거주시설 IoT, AI활용 돌봄사업 서비스는 응급상황대응과 사업수행을 위해 서비스\n      대상자의 개인정보를 해당사업을 위해 아래와 같이 제공함을 알려드립니다.\n       1. 제공받는 자 : U-119서비스(소방청, 소방본부, 지역소방서), 보건복지부, 한국보건산업진흥원,\n개인        한국장애인개발원, 한국사회보장정보원, 장애인거주시설 IoT, AI활용 돌봄사업(센서구매설치,\n정보        유지보수, 시스템 구축) 위탁 수행기관                                       동 의 □\n       2. 이용목적 : 응급상황 발생 시 신속/정확한 응급 서비스 제공, 장애인거주시설 IoT, AI활용 돌봄사업\n제3자\n          (센서구매설치, 유지보수, 시스템 구축)을 위한 서비스 연계\n제공     3. 제공하는 항목 : 대상자(성명, 생년월일, 성별, 시설전화번호, 핸드폰번호, 시설주소), 건물형태,     비동의 □\n동의         와상상태(거동가능, 거동불가) 활동량, 맥박, 호흡\n       4. 개인정보 보유 및 이용 기간 : 퇴소 시까지 보유하고, 퇴소 후에는 지체 없이 파기됩니다.\n      귀하는 개인정보 제공에 동의하지 않으실 수 있습니다.\n      동의를 거부할 경우에는 서비스 이용이 제한될 수 있습니다.\n\n\n상기와 같은 내용을 설명 받았으며, 장애인거주시설 IoT, AI활용 돌봄사업 서비스를 신청합니다.\n\n\n                              20   년   월    일\n\n\n                    신청자명:           (서명)    대상자와의 관계:\n\n\n보건복지부장관 귀하"}, {"p": 184, "t": "<서식 4> 사용자 권한 신청서\n\n                                                        □ 신청\n          디지털돌봄시스템 사용자 권한 신청서\n                                                        □ 반납\n\n\n    신청자 성명                              신청ID\n\n\n    생 년 월 일                              성 별\n\n\n    소 속 기 관                              부 서\n\n\n    사무실연락처          -     -             휴대폰         -    -\n\n\n         업무담당   □ 한국장애인개발원\n\n  사용자\n  구분\n         사업수행   □ 시설관리자\n          담당자   □ 시설종사자\n\n\n 위와 같이 디지털돌봄시스템 사용자 권한을 신청/반납합니다.\n\n\n                            년   월   일\n\n              신 청 인     소속          직위         성명       (인)\n\n\n              확 인 자     소속          직위         성명       (인)\n\n\n 보건복지부장관 귀하\n\n\n※ 구비서류\n 1. 사용자 권한 신청서 1부\n 2. 보안서약서 1부(신규발급 신청에 한함)"}]}]}, {"title": "Ⅱ. 장애인 단기거주시설 운영", "start": 185, "end": 190, "subs": [], "pages": [{"p": 185, "t": "                                 Ⅱ. 장애인 단기거주시설 운영\n\n\n    Ⅱ     장애인 단기거주시설 운영\n\n\n1                                                           제2장\n     목적\n○ 장애인에게 일정기간 주거･일상생활･지역사회생활 등을 제공하고 아울러\n     장애인을 돌보는 보호자의 단기간 휴식을 제공하여 가족기능의 회복･유지를\n     지원하는 장애인 단기거주시설의 운영에 필요한 사항을 정함\n\n\n2 기본방침\n\n○ 관할 지자체는 단기거주시설의 기능과 역할에 적합한 사업을 수립하고 운영\n    하여야 한다.\n\n○ 시설 운영자는 가정적인 분위기에서 이용 장애인을 보호하여야 한다.\n\n○ 긴급한 일시보호(쉼터)를 요하는 이용자를 우선 배려하여야 하며 장애인의\n     인간적 존엄성과 기본적 권리가 유지 될 수 있도록 노력하여야 한다.\n\n\n3 근거법령\n\n○ 장애인 단기거주시설 운영사업은 ｢장애인복지법령｣, ｢사회복지사업법령｣ 및\n     ｢보조금관리에관한법령｣에 의하되, 세부사항은 이 지침에 따라 수행한다.\n     다만, 동 지침에 정하지 않은 사항은 상기법령과 관련한 지침을 준용할 수 있다.\n    - 시설의 종류와 기능：｢장애인복지법｣ 제58조제1항 및 같은법 시행규칙 제41조\n     [별표 4]\n    - 시설의 설치신고 및 운영개시, 감독：｢장애인복지법｣ 제59조 및 제60조\n    - 시설의 설치신고 등 세부사항：｢장애인복지법 시행규칙｣ 제42조 내지 제43조"}, {"p": 186, "t": "  - 시설의 재무회계 관리：사회복지법인재무･회계규칙 중 시설회계\n\n  - 기타 일반사항：사회복지사업법 등 관련규정\n\n\n 4 설치 기준\n\n ○ 장애인 단기거주시설은 일반주택, 연립주택 등과 같은 일반 주거형태로 하되,\n   신규시설은 지역사회 내에 설치하는 것을 원칙으로 한다.\n\n ○ 지역사회 공간을 임대하여 장애인 단기거주시설을 설치한 경우, 장애인단기\n   거주시설은 이용장애인의 주거 안정을 보장하기 위한 조치를 취하여야 한다.\n\n ○ 또한 장애인복지관 등 지역사회재활시설과 인근에 위치토록 하여 이용\n   장애인의 편의를 도모한다.\n\n\n 5 사업추진 방향\n\n가. 시설운영비(인건비+관리운영비)\n\n 1) 인건비 지원기준\n\n ○ 시설 종사자에 대한 봉급 및 수당 등 인건비 지원은 ｢장애인복지시설 사업\n   안내｣의 인건비 지원기준을 참조하되, 수당 등이 ｢근로기준법｣을 준수할 수\n   있도록 지원한다.\n\n  - 휴일수당 및 직원의 병가 등은 ‘장애인거주시설 운영지원 사업’기준에 준용할\n    수 있다.\n\n ○ 시설장 및 사업수행 인력의 인건비 보조기준은 “2026년 장애인거주시설\n   인건비 지원기준”을 따른다.(인건비를 지원받는 다른 시설의 장 혹은 직원의\n   겸임 경우 제외)"}, {"p": 187, "t": "                                      Ⅱ. 장애인 단기거주시설 운영\n\n\n○ 시간외 수당 지급을 위하여 ‘장애인거주시설 운영지원 사업’의 시간외 수당\n  규정을 준수하도록 노력하여야 한다.(교대근무자 40시간, 일반종사자 20시간)\n\n○ 시설장에 대한 직책보조비를 지원할 수 있다.\n○ 직원의 출산, 병가, 휴직 등의 사유로 인력의 공백이 발생할 경우 해당자의\n  인건비 범위 내에서 대체인력을 활용할 수 있다.\n\n - 대체 인력 인건비는 해당 직원의 인건비 범위 내에서 기본급 및 수당 등\n  급여로 지급할 수 있다.\n2) 관리운영비\n\n○ 장애인 거주시설 운영지원 사업 지원기준에 준하되, 시설운영을 고려하여\n  관할 지자체가 추가 지원할 수 있다.\n\n○ 시설의 환경개선에 필요한 개･보수비는 별도로 지원한다.\n\n○ 지방자치단체의 운영비 보조는 인건비와 관리운영비를 분리하여 지원하여야 한다.\n\n\n나. 인력지원기준\n\n○ 단기거주시설의 종사자 배치기준은 아래와 같이 한다.\n\n - 상시 24시간 운영 시설에 한함\n\n        직종별        배치기준                      비 고\n                             - 시설장은 상근을 원칙으로 한다.\n        시설장          1명        (단, 시설운영 현황에 따라 관할 시･군･구청장의\n                               승인하에 타시설과 겸임할 수 있다)\n                             - 생활지도원은 사회복지사 채용을 원칙으로 하며,\n      사회재활직 및      이용장애인\n                               보육교사, 장애인재활상담사 등을 채용시에는 지자체\n       생활지도원      2.5명당 2명\n                               담당자와 협의\n        조리직          2명      - 1일 3식 조리 인력\n\n   ※ 시･군･구청장은 장애인 단기거주시설의 원활한 운영을 위하여 직급별 종사자 배치기준 외에 추가적인\n     인력(사무원, 운전원 등)에 대해 지방비로 지원할 수 있다."}, {"p": 188, "t": "  - ’21.7월부터 종사자 5인 이상 사회복지시설에 개정된 ｢근로기준법｣이 적용\n   시행됨에 따라 추가 교대인력 배치 필요\n\n\n다. 이용료\n\n ○ 이용료 수납대상은 모든 이용자(기초생활보장 수급권자 포함)를 대상으로 한다.\n\n ○ 이용료는 시설운영의 제반비용(인건비, 관리운영비 등)으로 사용할 수 있다.\n\n ○ 이용료 산정은 시설운영위원회에서 1년 단위로 책정하되, 물가변동에 따라\n   회계연도 중에 조정할 수 있으며, 이 경우에도 시설운영위원회의 심의를\n   거쳐야 한다.\n\n\n라. 이용료 산정기준\n\n ○ 이용료는 월 653,300원 범위 내에서 수납할 수 있다.\n\n ○ 본인 부담금 이외의 시설이용에 따른 비용은 지방자치단체에서 지원할 수 있다.\n\n\n마. 이용대상과 정원\n\n ○ 이용자는 소득조건에 관계없이 등록장애인으로 한다.\n\n ○ 정원은 상시 이용자와 수시 이용자를 포함한 최소 10인 이상으로 하고 30인을\n   초과할 수 없다.\n\n ○ 이용시간：24시간 운영\n   * 시설의 휴무일은 시･군･구와 협의하여 정하고, 시설운영규정에 명시하여야 함\n\n ○ 1회 이용기간：30일 이내\n\n  - 필요한 경우 연장은 가능하나, 6개월 이상 이용하고자 할 경우 시･군･구의\n    승인 필요"}, {"p": 189, "t": "                           Ⅱ. 장애인 단기거주시설 운영\n\n\n6 수행사업\n\n○ 개별서비스지원\n\n- 이용자 개인의 희망과 욕구를 최대한 보장 할 수 있도록 개별 서비스지원을\n  계획하여 개인의 욕구와 선택을 강화하고 이용자의 참여와 권리를 보장\n  하도록 한다.\n○ 자립생활 지원\n- 일상생활(식생활, 의생활, 개인위생관리, 건강관리 등)에 필요한 지식과              시\n  기술을 지원하여 장애로 인하여 발생하는 의존성을 최소화 하도록 한다.\n\n○ 사회적 인지기술 지원\n- 사회의 한 구성원으로 삶을 영위할 수 있도록 지역사회를 바르게 이해시키는\n  교육, 사회적응훈련을 통해 진정한 사회통합을 이루도록 한다.\n\n○ 정서안정･여가 지원\n\n- 단조로운 일과에 변화를 주고 새로운 환경과 정보를 접할 수 있도록 야외활동,\n  취미생활, 종교활동 및 정서안정 지원활동을 통한 사회적응력을 키우고 배운\n  기술이 일반화 되도록 한다.\n\n○ 이용자 권리사업\n\n- 사회의 한 구성원으로서 이용자가 자신의 권리를 올바르게 주장할 수 있도록\n  한다.\n\n○ 직업지원 사업\n\n- 이용자가 사회활동을 할 수 있도록 경제･서비스 활동 등의 지원을 통해 한\n  경제주체로서 생활할 수 있도록 한다."}, {"p": 190, "t": " ○ 가족지원사업\n\n  - 이용자의 가족에게 상담을 지원하고 각종 정보를 제공하며 가족에게 휴식을\n    지원하여 이용자에게 지속가능한 돌봄이 제공될 수 있도록 한다.\n\n ○ 이용 장애인과 그 가족과의 상담을 통해 욕구를 파악하여 지원한다.\n   * 시설입소자의 주간이용시설 이용금지(단 아래의 경우 이용 가능)\n\n    ○ 단기입소자 중 주간이용시설 이용이 가능한 경우\n        1. 단기거주시설의 휴무일\n        2. 보호자의 일시적 부재 등으로 인한 단기(연중 1개월 이내) 이용자로 단기 입소 전 주간이용시설\n         이용자인 경우\n        3. 지자체장이 중복 수급이 아닌 것으로 인정한 경우"}]}, {"title": "Ⅲ. 장애인 공동생활가정 운영", "start": 191, "end": 195, "subs": [], "pages": [{"p": 191, "t": "                              Ⅲ. 장애인 공동생활가정 운영\n\n\n    Ⅲ     장애인 공동생활가정 운영\n\n\n1                                                        제2장\n     목적\n○ 지역사회 내 일반주택을 이용하여 장애인들이 스스로 사회에 적응하도록\n    가정생활, 사회활동 등의 자립생활을 지원하는 장애인 공동생활가정(이하 ‘공동            거\n    생활가정’)의 운영에 대한 필요한 사항을 정함\n\n\n2 기본방침\n\n○ 공동생활가정은 이용 장애인들의 사회통합과 사회적 자립을 목표로 이용자\n    개개인의 존엄이 유지됨과 동시에 독립적 생활이 최대한 보장되는 방식으로 운영\n\n○ 관할 지자체는 공동생활가정 지원 및 체계적인 관리를 위해 별도의 지원기관을\n    둘 수 있음\n    - 별도의 지원기관은 관할 공동생활가정의 행정업무 지원과 대체인력 지원 등의\n     업무를 담당함\n\n\n3 추진방향\n\n가. 시설운영비(인건비+관리운영비)\n\n1) 인건비 지원기준\n\n○ 시설장 및 사업수행 인력의 인건비 보조기준은 “2026년 장애인 거주시설\n    인건비 지원기준”을 따른다.\n    (인건비를 지원받는 다른 시설의 장 또는 직원이 겸임하는 경우 제외)"}, {"p": 192, "t": " ○ 24시간 운영하는 공동생활가정의 2인 이내의 종사자, 일과 이후 운영 공동생활\n   가정의 1인 종사자의 시간외 수당은 거주시설의 교대근무자 기준을 적용\n   하도록 노력하여야 한다.\n\n ○ 인건비의 보조 및 지급은 근로기준법 기준에 위배되지 않도록 시간외 근무\n   수당, 퇴직금, 기타 4대 연금 등을 반영할 수 있도록 한다.\n\n ○ 직원의 출산, 병가, 휴직 등의 사유로 인력의 공백이 발생할 경우 해당 직원의\n   인건비 범위 내에서 대체인력을 활용할 수 있다.\n\n 2) 관리운영비\n\n ○ 운영비는 지방비보조금, 운영주체의 전입금, 이용료, 민간후원금 등으로 한다.\n\n ○ 장애인거주시설 운영지원 사업 지원기준에 준하되, 시설운영을 고려하여\n   관할 지자체가 추가 지원할 수 있다.\n\n ○ 지방자치단체의 운영비 보조는 인건비와 관리운영비를 분리하여 보조함을\n   원칙으로 한다.\n\n ○ 시설의 환경개선에 필요한 개･보수비는 별도로 지원한다.\n\n\n나. 인력지원기준\n\n ○ 장애인 공동생활가정의 종사자 인력기준은 아래와 같이 한다.\n\n          직종별        인력기준                 비고\n                            - 시설장은 상근을 원칙으로 한다. 단, 시설운영 현황에\n          시설장         1명\n                              따라 타 시설과 겸임할 수 있다.\n         사회재활교사       1명\n        사회재활교사 또는           - 상시 24시간 운영시설에 한한다.\n                      1명\n          생활지도원             - 시설장 타 시설과 겸임 시 1명 추가 지원 가능\n\n   ※ 직종별 인건비는 장애인거주시설 종사자 인건비 지원기준으로 동일한 직위를 준용할 수 있다.\n   ※ 지자체는 ｢근로기준법｣ 준수를 위해 필요한 경우(시설장이 타 시설 시설장을 겸임하는 경우 등)\n     추가적인 인력배치를 위해 노력하여야 한다."}, {"p": 193, "t": "                                     Ⅲ. 장애인 공동생활가정 운영\n\n\n ○ 관할 지자체는 서비스 개선과 직원의 처우 개선을 위해 직원의 휴일 및 업무지원에\n  필요한 대체인력을 지원하도록 노력하여야 한다.\n\n ○ 관할 지자체는 상기 “인력지원기준”에도 불구하고 이용 장애인의 욕구, 장애 특성을\n  고려하여 추가인력을 배치하도록 노력하여야 한다.\n다. 이용료\n ○ 이용료는 시설운영위원회의 심의를 거쳐 결정한다.\n ○ 이용료는 시설운영의 제반비용(인건비, 관리운영비 등)으로 사용할 수 있다.\n - 다만, 인건비 등 지원받는 시설의 경우 이용료는 생계급여에 준하여 사용하고,\n\n   집행잔액 발생 시 사업비 및 운영비로만 사용 가능(｢근로기준법｣ 준수 및\n   이용 장애인에 대한 서비스 강화를 위하여 필요한 경우에 한하여 지자체의\n   승인을 받아 인건비로도 사용 가능)\n\n라. 입주정원\n\n ○ 입주정원은 4인으로 한다.\n  * 관할 시･군･구청장은 공동생활가정의 장애인이 1년 이상 계속해서 2인 이하인 경우 등 시설의 운영이\n    원활하지 않은 경우에는 지도･감독을 통해 운영을 정상화 하도록 노력하여야 한다.\n\n마. 각종 장부의 비치\n\n ○ ｢사회복지사업법｣ 제37조 및 ｢사회복지법인 재무･회계규칙｣ 제24조 등에\n   따른다.\n\n바. 안전관리\n\n ○ 소방, 전기, 가스등 법령에 따른 안전관련 사항은 준수해야 한다.\n ○ 모의훈련을 연1회 이상 포함하여 이용자 및 종사자대상 소화요령, 인명대피,\n  유도요령 등에 대한 소방교육을 분기별 1회 이상 실시해야 한다.\n ○ 비상상황 발생을 고려하여 관계기관과의 비상연락망 유지 및 행정기관에 보고\n  조치, 시설 내 비상연락체계 등을 마련해야 한다."}, {"p": 194, "t": " 4 공동생활가정 설치 기준\n\n가. 공동생활가정의 설치 기준\n\n ○ 공동생활가정은 일반주택, 아파트, 연립주택 등과 같은 일반 주거형태로 하되,\n   신규시설을 설치하더라도 지역사회의 일반 주거지역 내에 설치하는 것을\n   원칙으로 한다.\n\n ○ 또한 장애인복지관 등 지역사회재활시설과 인근에 위치토록 하여 이용 장애인의\n   편의를 도모한다.\n\n ○ 간판이나 표찰을 붙이지 말고 다수의 공동생활가정이 일정 지역 내에 밀집되지\n   않도록 한다.\n\n ○ 동일 공동생활가정이 2개 이상의 주거(주택 등)를 활용하여 이용자를 분산\n   거주하게 할 수 있다.\n   * 돌봄의 공백이 없고 안전확보가 되는 경우에 한함\n\n\n나. 설치비(주택) 지원\n\n ○ 공동생활가정 설치를 위한 주택자금 및 집기 비품 구입비에 관한 예산은\n   별도의 지방자치단체 예산으로 지원할 수 있다.\n\n ○ 운영주체의 소유부동산, 지자체 지원 시설, 국･공유 토지 및 건축물 등에 설치할\n   수 있다.\n\n ○ 화재예방, 소방시설 설치･유지 및 안전관리에 관한 법률 제9조(이하 “소방법”)에\n   따라 1, 2층에 설치 가능하며, 3층 이상의 경우 피난구조설비를 갖추어야 한다.\n   ＊ 건축법과 소방법의 노유자 시설 개념이 상이함에 유의"}, {"p": 195, "t": "                                  Ⅲ. 장애인 공동생활가정 운영\n\n\n5 입주자 선정\n\n가. 입주기준\n\n○ 시설 및 재가장애인으로서 공동생활가정에서 생활하는 것이 재활 및 자립에                    제2장\n  더 효과적이라고 인정되는 자\n○ 낮시간 동안 근로, 고용훈련, 교육 및 재활훈련, 기타 사회활동 등에 참여하고\n  있는 자\n○ 전문인력의 지원을 받아 공동생활을 하는 데 큰 지장이 없는 자\n\n\n나. 이용자의 생활\n\n○ 이용자는 사회 구성원으로서 자신의 책임하에 개인생활과 공동생활의 구성원\n  으로서 의무를 지키면서 사회적 자립을 달성함을 목적으로 한다.\n\n○ 이용자는 사회재활교사와 협의하여 개인위생관리, 주택관리, 가사 등 역할\n  부담을 하고 필요시 규칙을 정할 수 있다.\n\n○ 이용자는 낮 시간에는 장애인복지관, 직장 및 교육 기관, 기타 지역사회 활동\n  기관 등을 이용하는 것을 원칙으로 하되, 필요한 경우 장애인 주간이용시설을\n  이용할 수 있다. 다만, 질병 등 특별한 사유가 있는 경우는 제외한다.\n\n○ 이용자는 공동생활가정에서 실제 주거 및 생활하여야 하며, 취업 등을 이유로\n  공동생활가정 외의 장소에서 장기간(15일 이상) 생활할 경우에는 사전에\n  시설장에게 알려야 한다.\n  * 시설장은 이용자가 장기간 시설 외의 장소에서 생활할 경우 즉시 시･군･구청장에게 그 사실을\n    알려야 함.\n\n○ 한 공동생활가정의 이용 장애인은 남성 또는 여성으로만 이루어져야 한다.\n  다만, 영유아, 남매 등 특수한 경우에는 예외로 할 수 있다."}]}, {"title": "Ⅳ. 독립형 주거서비스 제공기관 운영", "start": 196, "end": 201, "subs": [], "pages": [{"p": 196, "t": "     Ⅳ    독립형 주거서비스 제공기관 운영\n\n\n 1   목적\n\n ○ 장애인에게 가정과 같은 주거여건을 제공하는 여러 개의 개별 주거 공간을\n     설치하고, 지역사회 자원을 활용하여 주거지원･일상생활지원･지역사회생활\n     지원 등의 서비스를 제공하는 독립형 주거서비스 제공기관의 운영에 필요한\n     사항을 정함\n\n\n 2 기본방침\n\n ○ 독립형 주거서비스 제공기관은 이용 장애인이 사적 공간을 보장받으며, 지역\n     사회 자원을 활용하여 지역사회와 통합된 삶을 누릴 수 있도록 지원해야 함\n\n ○ 독립형 주거서비스 제공기관은 가정과 같은 환경에서 장애인 특성 및 욕구\n     충족 등에 적합한 개별화된 맞춤 서비스를 지원해야 함\n\n ○ 독립형 주거서비스 제공기관은 이용 장애인의 지역사회 자립을 위하여 필요한\n     지원을 해야 함.\n\n\n 3 근거법령\n\n ○ 독립형 주거서비스 제공기관 운영사업은 ｢장애인복지법령｣, ｢사회복지사업법령｣\n     및 ｢보조금관리에관한법령｣에 의하되, 공통사항은 Ⅰ. 장애인거주시설 공통\n     사항 및 Ⅴ. 장애인거주시설 운영지원사업을 준용하고, 세부사항은 이 지침에\n     따라 수행한다. 다만, 동 지침에 정하지 않은 사항은 상기 법령과 관련한\n     지침을 준용할 수 있음"}, {"p": 197, "t": "                         Ⅳ. 독립형 주거서비스 제공기관 운영\n\n\n- (시설의 종류와 기능) ｢장애인복지법｣ 제58조제2항 및 같은 법 시행규칙\n  제41조 [별표 4］\n\n- (시설의 설치신고 및 운영개시, 감독) ｢장애인복지법｣ 제59조 및 제60조\n\n- (시설의 설치신고 등 세부사항) ｢장애인복지법 시행규칙｣ 제42조 및 제43조\n- (시설의 재무회계 관리) ｢사회복지법인재무･회계규칙｣ 중 시설회계\n- (기타 일반사항) ｢사회복지사업법｣등 관련 규정\n4 설치기준\n\n\n○ 독립형 주거서비스 제공기관의 개별 주거 공간은 보건･위생･급수･안전･환경\n 및 교통편의 등을 충분히 고려하여 장애인이 쉽게 접근하고 편리하게 이용할\n 수 있으며, 지역사회 내 자원 등을 충분히 활용할 수 있는 곳에 마련해야 함\n\n○ 독립형 주거서비스 제공기관의 개별 주거 공간은 지역사회 내에 다음과 같은\n 건축물에 설치함\n\n- ｢건축법 시행령｣ 별표 1 제1호가목의 단독주택, 나목의 다중주택 또는\n  다목의 다가구 주택\n\n- ｢건축법 시행령｣ 별표 1 제2호가목의 아파트, 나목의 연립주택 또는 다목의\n  다세대주택\n\n- ｢건축법 시행령｣ 별표 1 제11호의 노유자시설\n\n○ 독립형 주거서비스 제공기관은 개별 주거 공간이 지나치게 밀집 또는 분산되지\n 않도록 노력해야 함\n\n- 독립형 주거서비스 제공기관은 지원의 효율성 등을 위하여 개별 주거 공간들이\n  같은 시･군･구에 위치하도록 하여야 하며, 개별 주거 공간의 1/3 이상이 같은\n  건물에 있지 않도록 노력해야 함"}, {"p": 198, "t": " ○ 독립형 주거서비스 제공기관은 상시 20명 이상 생활할 수 있도록 복수의 개별\n   주거 공간을 마련하되, 각 주거 공간의 정원은 4명 이하를 원칙으로 함\n\n  - 다만, 이용자의 동의를 받고, 운영위원회의 의결을 거친 후, 관할 시장･\n   군수･구청장의 승인을 받으면 개별 주거 공간의 정원을 최대 6명까지로 할\n   수 있음\n   ※ 관할 시장･군수･구청장은 승인 과정에서 개별 주거 공간의 크기 및 독립형 주거서비스 제공기관의\n     해당 개별 주거 공간에 대한 지원계획 등을 고려하여 승인 필요\n\n ○ 독립형 주거서비스 제공기관은 관련 법령에 의한 구조 및 설비를 갖추어야 함\n\n  - 이용 장애인의 욕구와 필요 등에 의해 원룸형으로 1인이 생활하는 개별 주거\n   공간을 설치･운영하는 경우에는 한 공간으로 침실과 거실을 겸할 수 있으며,\n   이때 그 공간의 크기는 10제곱미터 이상이어야 함\n\n ○ 독립형 주거서비스 제공기관은 ｢소방시설 설치 및 관리에 관한 법률｣ 제12조에\n   따른 화재안전기준을 충족하는 소화용 기구를 갖추어 두고, 비상구를 설치하여\n   비상재해에 대비한 시설을 갖추어야 한다. 다만, 개별 주거공간이 위치한 단독\n   및 공동주택에 ｢소방시설 설치 및 관리에 관한 법률｣에 따른 소방시설이\n   설치되어 있는 경우 해당 주거 공간은 비상재해 대비시설을 갖춘 것으로 봄\n\n\n 5 행정 사항\n\n ○ 시장･군수･구청장은 장애인 거주시설 입소 대기를 해소하고, 장애인의 자립\n   생활을 촉진하기 위해 독립형 주거서비스 제공기관의 설치를 지원하기 위해\n   노력해야 함\n\n ○ 독립형 주거서비스 제공기관 설치 신고 시 사무실을 주 소재지로 하고 시설\n   신고증 뒷면에 개별 주거 공간 전부를 부기함\n   * 개별 주거 공간이 여러 시･군･구에 위치하고 있는 독립형 주거서비스 제공기관은 주된 사무소가\n     있는 시･군･구의 관할으로 함"}, {"p": 199, "t": "                              Ⅳ. 독립형 주거서비스 제공기관 운영\n\n\n6 사업 추진\n\n가. 시설운영비(인건비+관리운영비)\n\n○ 종사자 인건비와 관리운영비는 Ⅴ. 장애인거주시설 운영지원 사업 기준을\n  준용하며, 관할 지자체는 독립형 주거서비스 제공기관의 특수성을 고려하여\n  기관의 안정적 운영을 위해 필요한 관리운영비를 추가 지원할 수 있음\n나. 인력지원기준\n○ 독립형 주거서비스 제공기관의 인력지원기준은 Ⅴ. 장애인거주시설 운영지원\n  사업 기준을 준용하되, 지역사회 자원 등을 활용할 수 있는 경우에는 해당\n  직종의 관리 및 운영 요원을 대신하여 그 수만큼 생활지도원 또는 사회재활\n  교사를 배치할 수 있음\n\n - 독립형 주거서비스 제공기관이 지역사회 자원 등을 활용할 수 있어 해당\n  직종의 관리 및 운영 요원을 대신하여 생활지도원 또는 사회재활교사*를\n  배치하기 위해서는 이용 장애인에 대한 지원에 공백이 없도록 해당 직종의\n  관리 및 운영 요원이 수행하는 역할에 대한 지역사회 자원 활용계획을 관할\n  지자체에 제출하여 승인을 받아야 함\n * 생활지도원이 아닌 사회재활교사를 채용하기 위해서는 지자체와 협의를 하여야 하며, 지역사회\n   자원 활용 가능 직종을 대신하여 채용할 수 있는 사회재활교사는 최대 1명임(지역사회 자원을\n   활용할 수 있는 직종을 대신하여 이용 장애인을 직접 지원하는 생활지도원을 추가 채용할 수\n   있도록 한 것이므로 가급적이면 생활지도원으로 채용해야 함)\n ※ (예시) 생활지도원 정원이 15명인 독립형 주거서비스 제공기관에서 지역사회 자원 활용이 가능한\n   A 직종을 대신하여 생활지도원을 배치하겠다는 관할 지자체의 승인을 받은 경우, 해당 독립형\n   서비스 제공기관은 생활지도원을 16명까지는 별도의 승인 없이 채용 가능함(A 직종을 다시\n   채용하기 위해서는 지자체에 승인 받은 내용의 철회를 요청하여야 하며, 이 경우에 다시 생활\n   지도원 정원은 15명이 됨)"}, {"p": 200, "t": "다. 안전 관리\n\n ○ 독립형 주거서비스 제공기관의 안전 관리는 Ⅰ. 장애인거주시설 공통사항 중\n   6. 장애인 거주시설 안전 관리에 따라 수행함을 원칙으로 함\n\n ○ 독립형 주거서비스 제공기관은 각 개별 주거 공간의 안전 관리 담당자를\n   지정하고, 각 개별 주거 공간에 적합한 피난 매뉴얼을 갖추어야 함\n\n  - 독립형 주거서비스 제공기관은 각 개별 주거 공간에서 안전사고와 화재가\n    발생하지 않도록 위험 요인을 사전에 제거하여야 하며, 화기 등과 같이 안전사고\n    또는 화재를 유발할 수 있는 물건(또는 물질)에 대한 관리를 철저히 해야 함\n\n ○ 독립형 주거서비스 제공기관의 각 개별 주거 공간별로 비상 상황 발생을\n   고려하여 관계기관과의 비상연락망 유지 및 행정기관에 보고 조치, 시설 내\n   비상연락체계 등을 마련해야 함\n\n ○ 독립형 주거서비스 제공기관은 이용 장애인의 감염병과 식중독을 예방하기\n   위해 위생관리 매뉴얼을 마련하고, 이를 이용 장애인 및 종사자를 대상으로\n   정기적으로 교육하고 기록해야 함\n\n\n라. 이용자의 생활\n\n ○ 독립형 주거서비스 제공기관은 이용 장애인의 특성과 능력, 욕구 등을 고려\n   하여 이용 장애인이 자유롭게 일상생활을 누릴 수 있도록 지원해야 함\n\n ○ 독립형 주거서비스 제공기관은 장애인의 인권을 보호하고 이용 장애인이\n   지역사회와의 원활한 관계를 정립･유지할 수 있도록 장애인들이 지역사회\n   활동에 자유롭게 참여할 수 있는 기회를 보장해야 함\n\n  - 독립형 주거서비스 제공기관은 각 개별 주거 공간이 위치한 지역사회의 주민\n   또는 단체와 네트워크를 형성하는 등의 방법을 통해 이용 장애인이 지역사회의\n   일원이 되어 안전하게 생활할 수 있도록 노력해야 함"}, {"p": 201, "t": "                              Ⅳ. 독립형 주거서비스 제공기관 운영\n\n\n○ 독립형 주거서비스 제공기관은 이용 장애인이 필요한 영양을 섭취할 수 있도록\n 영양사가 작성한 식단에 기반하여 식사를 할 수 있도록 지원해야 하며, 이용\n 장애인의 기호가 반영되도록 해야 함\n ※ 급식을 제공하는 경우에는 영양사가 작성한 식단에 따라 급식을 해야 하며, 영양사를 두지 않는\n   경우 사회복지급식관리지원센터 등에서 지원하는 식단에 따라 식사를 지원할 수 있음              제2장\n\n○ 독립형 주거서비스 제공기관은 각각의 개별 주거 공간에 대해 이용 장애인\n 생활 지원 담당자를 지정하여야 하며, 이용 장애인의 장애 정도와 특성 등을\n 고려하여 이용 장애인 지원에 지장이 없도록 개별 주거 공간 지원인력을\n 배치하여야 함"}]}, {"title": "Ⅴ. 장애인거주시설 운영지원 사업", "start": 202, "end": 219, "subs": [], "pages": [{"p": 202, "t": "     Ⅴ     장애인거주시설 운영지원 사업\n\n\n 1    목적\n\n ○ 거주공간을 활용하여 일반가정에서 생활하기 어려운 장애인에게 일정 기간\n     거주･요양･지원 등의 서비스를 제공하는 동시에 지역사회생활을 지원하는\n     장애인 거주시설의 종사자 인건비 및 관리운영비 등 지원\n\n\n 2 지원근거 : ｢장애인복지법｣ 제81조 및 같은 법 시행령 제44조\n\n\n 3 기본 원칙\n\n ○ 장애인 거주시설 운영지원 사업 예산은 ｢국가재정법｣, ｢보조금 관리에 관한\n     법률｣등 보조금 집행 관련 법령 및 동 기준에 따라 집행･관리함\n     - 국고 보조예산 집행과 관련하여 동 기준 외에 별도의 기준을 적용하고자\n      할 때에는 보건복지부의 사전 승인을 받아야 함\n\n ○ 동 기준은 국고보조금에 대한 전국 공통 기준으로, 지역적 특성에 따라 입소자\n     생활개선 및 종사자 처우개선 등을 위하여 지방비 전액으로 지원하였던 예산\n     (부식비, 간병비, 직책보조비, 연가보상비 등) 등이 축소되지 않도록 노력\n     하여야 함\n ○ 국고보조금 지원 대상에 포함되지 않은 장애인거주시설에 대해서는 지방비 지원\n     등을 통해 국고보조 지원 시설에 준하여 지원이 이루어지도록 노력하여야 함\n ○ 입소 인원 자연감소에 따라 정원을 초과하는 종사자가 발생한 경우에는 시설\n     내 신규 채용이나 초과 인원에 대한 대체인력에 대한 보조금 인건비 지원은\n     불가함"}, {"p": 203, "t": "                           Ⅴ. 장애인거주시설 운영지원 사업\n\n\n○ 국고보조금 지원 대상 장애인거주시설의 종사자 충원은 시･군･구와 반드시\n 사전 협의하여 채용 시기, 인원 등을 조정함\n\n○ 국고 보조예산 부족시 자치단체에서는 지방비 전액으로 추가 지원하는 등 예산\n 부족분 해소를 위해 노력하여야 함\n○ 동 기준은 국고보조금 지원을 위한 기준이며, 지자체는 소관 시설이 ｢근로기준법｣\n 등 관련 법령을 준수할 수 있도록 지도･점검 필요\n4 예산 지원 세부 기준\n\n\n○ 기존 국고 보조대상\n- ｢장애인복지법｣ 제59조(장애인복지시설 설치)에 따라 설치된 장애인 거주\n  시설 ｢’25년도 국고보조금 지원 대상｣으로 확정된 시설\n- 다만, 장애인거주시설 운영의 공익성, 공공성, 투명성, 책임성, 연속성, 형평성\n  등을 종합적으로 감안하여 현행 운영법인이 사단법인이거나 재단법인 경우\n  관할 지자체와 협의를 거쳐 사회복지법인으로 전환을 권고함(지자체장이\n  설립하고 위탁운영하는 경우에도 동일하게 적용함)\n- 시･도지사는 관내 비영리법인(사단, 재단)이 사회복지법인으로 변경을 희망하고\n  사회복지법인 설립허가 조건을 충족하는 경우 적극 협조하여야 하며 추후\n  시설 운영에 문제가 발생하지 않도록 조치하여야 함\n- 추후 장애인복지법 제61조 및 제81조 등에 따라 시설의 지도･감독 예정\n\n○ ’26년 신규지원 대상시설\n- 「사회복지사업법」 제42조제1항 및 같은 법 시행령 제20조제1호에 따른 사회\n  복지법인이거나 「사회서비스 지원 및 사회서비스원 설립 및 운영에 관한 법률」\n  제7조에 따른 시도 사회서비스원이 2023년 말 기준 입소자 현원29명 이하인\n  시설은 최대 현원을 29명으로 운영토록 하며 우리부와 예산 협의 없이 현원을\n  증원한 경우 추가 인건비는 광역･기초자치단체 및 시설에서 부담"}, {"p": 204, "t": " ○ 국고 보조율：서울 50%, 지방 70%\n\n ○ 보조금 지원 비율\n                                                       (단위：%)\n                               법 인\n         구 분                                        개인**\n                      일반시설           실비시설*\n        지원 비율            100           100        80% 이내\n\n  * 국고보조금 지원 대상 중 지원유형이 실비시설로 분류된 시설\n ** 개인시설의 경우 지자체 재정여건 등을 고려하여 지원 가능\n\n\n ○ 지원 세부 기준\n  - 기본급：2026년 장애인거주시설 종사자 기본급[별표 1]\n    ∙ 호봉산정은 ｢사회복지시설 관리안내｣ 호봉의 획정 준용\n\n  - 수당 등\n    ∙ 명절휴가비：기본급의 120%(기본급의 60%씩 연 2회)\n    ∙ 시간외 수당：교대근무자(생활지도원) 및 조리사 40시간, 일반 종사자 등\n                  20시간\n        * 생활지도원 중 직접 돌봄 서비스를 제공하지 않는 자는 일반종사자로 간주\n        * 의료집중형 장애인거주시설 시범사업 대상시설의 경우 교대근무자 지급대상에 간호인력 추가\n          (시간외수당 40시간 적용)\n\n    ∙ 인권업무수당 : 월 10만원 이내\n        * 시설장 및 사무국장을 제외한 종사자(최소 5년 이상 경력) 중에서 인권담당자 지정･운영\n          (시설별 1명)\n        * 법인의 대표이사 겸 시설장은 퇴직적립금 및 시간외수당 지급 불가(대법원 2015.4.23.\n          선고2013다215225판결, 장애인권익지원과-5035(2021.9.13.))\n        * 지방보조금 전액으로 추가 지원 가능\n        * 교대근무자：야간 및 휴일 등의 구분 없이 동일직종 종사자와 동일한 교대 조건으로 근무하는 자\n          (돌봄전담 종사자 포함)\n        * 교대근무자의 병가(감염병 확진 등) 및 결원 종사자 충원이 지연될 경우 등의 사유로 돌봄\n          인력의 공백 발생 시, 종사자가 이를 대체할 경우 관할 지자체의 승인을 받아 교대근무자의\n          시간외 수당 범위 내에서 추가 지원할 수 있음"}, {"p": 205, "t": "                                  Ⅴ. 장애인거주시설 운영지원 사업\n\n\n - 가족수당：배우자 및 자녀를 제외한 부양가족 1명당 20천원(배우자 40천원,\n  첫째자녀 50천원, 둘째자녀 80천원, 셋째 이후 자녀 1명당 120천원)\n  * 세부 기준은 ｢공무원수당 등에 관한 규정｣ 제10조(가족수당) 준용\n\n○ 관리운영비：2026년 장애인 거주시설 관리운영비 지원기준[별표 2]\n\n\n5 기타 행정 사항\n가. 사업 추진 절차\n○ 예산 확정 통보(’25. 12월, 보건복지부 → 시･도)\n\n - 확정내시 공문 발송 및 D-brain 및 e나라도움 시스템 통보\n\n○ 각 시･도 및 시･군･구 보조금 배분(’25. 12월)\n - D-brain 및 e나라도움 시스템(내시액)과 e호조 시스템(내시 배분액) 매칭 완료\n\n○ 보조금 교부 신청(시･도 → 보건복지부)\n - 월별로 구분하여 e나라도움 시스템을 통해 ’26년분 일괄 신청(1월 10일까지)\n\n○ 보조금 교부\n - 보건복지부 → 시･도：분기소요액을 분기시작 월에 교부\n - 시･도 → 시･군･구：광역단체 특성에 따라 분기 또는 월별로 교부\n - 시･군･구 → 시설：월별소요액을 매월 교부\n\n\n나. 사회서비스포탈(혹은 희망이음) 급여대장\n\n○ 국고 보조금을 지원받는 모든 시설의 직원의 급여는 2020년 1월부터 반드시\n  사회서비스포탈 내 급여 및 회계 기능을 사용토록 할 것(미사용시 운영비 차등\n  지원)\n  ※ 사회서비스포탈 내 ‘인사회계’ → ‘급여관리’ → ‘급여현황’ → ‘급여대장’ 기능을 활용하고 상세\n    매뉴얼은 시스템 홈페이지(www.w4c.go.kr) 참조"}, {"p": 206, "t": "다. 입소자 정원 감소로 인한 정원 초과 근무인력 조정\n\n ○ 현재 정원을 초과한 인력은 광역을 중심으로 시설인력의 유휴 인원을 파악하고\n   교대인력 채용으로 재배정하여 인건비 낭비 최소화할 것\n\n ○ 동일법인 내 장애인 거주시설 간 인력 배치 허용(아래의 조건 모두 충족시 가능)\n  - 단서조건：① 종전에 공개모집 절차에 따라 시설에 채용된 사람일 것\n          ② 동 시설을 운영하는 법인의 임원, 운영자 개인 또는 시설장\n             (이동하려는 시설의 시설장에 한함)과 특별한 관계가 없을 것\n          ③ 옮기고자 하는 직위와 관련하여 법령에 따른 자격기준을 충족\n            시킬 것\n  - 입소인원의 감소로 종사자를 감축해야 할 사유가 발생하더라도 시･도지사가\n    판단하여 예산의 범위에서 지원 가능\n\n라. 52시간 교대인력 채용\n\n ○ 교대인력 채용시 기존 타 시설에서 초과인력 확인서(시설장 추천 및 자치\n   단체장 확인)를 제출한 지원자가 있는 경우 초과인력 확인서 제출자 우선 채용\n  - 단서조건：기존 공개모집 절차에 따라 채용된 사람 및 같은 광역 단체 내에서\n          채용 가능\n\n ○ 장애인 거주시설의 안전사고 예방, 입소자 편의 증진 및 ｢근로기준법｣ 준수\n   등을 위해 인건비 지원기준에 추가하여 52시간 교대인력(주간 2교대 인력\n   기준 1교대 팀 인원의 60%를 야간 인력에 충원) 채용을 지원하는 것으로\n   장애인 거주시설은 교대인력 및 야간 근무조 편성 시에 입소 장애인 안전사고\n   예방 등에 소홀함이 없도록 할 것\n   ※ 지자체는 입소 장애인 안전사고 예방 등을 위해 야간 근무조가 적정하게 편성되어 운영되는지\n     점검해야 함\n\n  - 지자체는 ｢근로기준법｣을 준수할 수 있도록 인건비 지원 필요"}, {"p": 207, "t": "                           Ⅴ. 장애인거주시설 운영지원 사업\n\n\n마. 장애인 지역사회 자립지원 시범사업\n\n○ ʻ장애인 지역사회 자립지원 시범사업ʼ에 참여하는 이용 장애인의 자립을 지원한\n  경우(ʼ23. 이후 이용 장애인의 자립을 지원한 경우부터 해당)에는 해당 시범\n  사업 종료 시(∼ʼ26.)까지 자립 당시 현원을 기준으로 종사자 고용을 유지할\n  수 있음\n 예시) 현원 51명인 장애인 거주시설이 ’23년에 2명을 자립지원한 경우, 현원이           장\n    49명이 되어도 해당 시범사업 종료시인 ’26년까지는 현원 51명 기준              인\n    인건비 지원 가능\n - 다만, 장애인 거주시설이 입소 장애인을 전체적으로 자립 지원하고 장애인\n  이용시설 등으로 전환하려는 경우에는 보건복지부 및 지자체와 고용유지 등과\n  관련하여 사전에 협의를 하여야 하며, 기존 종사자의 고용 승계 등을 위하여\n  노력하여야 함\n○ 자립 당시 현원을 기준으로 종사자 고용을 유지하는 경우에는 해당 인력이\n  자립지원팀 관련 업무를 담당할 수 있도록 노력하여야 함\n\n\n바. 휴일수당\n\n○ 대상: 종사자 5인 이상 시설의 생활지도원, 조리원\n - ’26년 공휴일 : 「공휴일에 관한 법률」에 따름\n\n - (법률근거) 근로기준법 제55조(휴일) 제2항 : 사용자는 근로자에게 대통령령\n  으로 정하는 휴일을 유급으로 보장하여야 한다. 다만, 근로자 대표와 서면으로\n  합의한 경우 특정한 근로일로 대체할 수 있다.\n\n - 평일 근무 인원의 2/3 인원만 휴일수당 지원 (휴일수당 관련 국고보조금 지원\n  기준이며 이를 초과하여 휴일에 근무한 인원에 대해서는 지방비 전액 또는\n  자부담으로 휴일수당을 지급하거나 ｢근로기준법｣에 근거 근로자 대표와 서면\n  합의에 따라 휴일수당을 지급하는 것을 갈음하여 휴일대체 또는 보상휴가\n  부여 가능)"}, {"p": 208, "t": "  - 휴일수당 관련 국고 보조예산 부족시 지방자치단체와 시설에서는 지방비\n    전액 또는 자부담으로 추가 지원하는 등 부족분 해소를 위해 노력하여야 함\n\n\n사. 사업 추진 실적 보고 및 집행잔액 등의 반납\n\n ○ 예산 실집행 실적 보고(시･도 → 보건복지부)\n\n  - 연 2회(’26.7월, ’27.1월) 15일까지 공문으로 제출\n   ※ 상반기 실집행 실적 등을 참고하여 필요시 시･도별 예산 조정 예정임\n\n ○ 2026년에 교부받은 보조금의 집행잔액 및 발생이자는 반드시 다음 회계연도\n   내에 반납\n   ※ 보조금 정산에 관한 세부사항은 별도 공문으로 통보"}, {"p": 209, "t": "                              Ⅴ. 장애인거주시설 운영지원 사업\n\n\n[별지 제1호 서식]\n\n\n                    초과인력 확인서\n\n\n   □ 기관현황                                                  제2장\n\n       시설의 명칭：\n       시설 유형：\n       입소정원 및 현원：\n       생활지도원 정원 및 현원：\n\n       소재지 및 연락처：\n\n\n   □ 추천자 인적 사항\n       성명：\n       생년월일：\n       공개채용일：\n       직급 및 직종：\n       호봉(승급월)：\n\n\n    상기인은 동 시설의 입소자 감소로 인해 발생한 초과인력임을 확인합니다.\n\n\n                                   년      월        일\n\n\n                        확인자    시 군 구청장         (인)"}, {"p": 210, "t": "        보조금의 정산\n\n 1. 보조사업자는 보조사업을 완료하였을 때, 폐지의 승인을 받았을 때 또는 회계연도가 끝났을 때에는\n    그때로부터 2개월(지자체보조사업의 경우 3개월) 이내에 보조사업실적보고서(보조사업 정산보고서\n    포함)제출하여야 하며, 특히 해당 보조금이 1억원 이상인 경우에는 정산보고를 외부 검증기관에서\n    검증받아 제출해야 합니다.\n 2. 보조사업자의 정산보고서 제출이 일정기간 늦어질 경우 보조금중 일부가 감액되어 교부될 수 있습니다.\n 3. 보조사업자는 보조사업 완료 후 집행한 보조금을 정산･반납할 경우 사용잔액 및 이자를 함께 반납하여야\n    합니다.\n 4. 보조사업 수행에 따라 발생한 수익금은 보건복지부와 협의하여 국고 반환 또는 당해 보조사업 목적 범위에\n    맞도록 집행하고 정산보고서에 포함하여 심사를 받아야 합니다.\n 5. 다음의 정산잔액은 소정의 절차를 거쳐서 즉시 반납하여야 합니다.\n  가. 이미 교부된 보조금과 이로 인하여 발생한 이자를 더한 금액이 확정된 교부금액을 초과한 경우\n     그 초과액\n  나. 사업비 정산액이 교부 결정한 사업계획서 예산집행계획 보다 감소한 경우 그 감소 차액\n  다. 집행증빙서류가 집행내역과 일치하지 않을 경우에 그 차액\n 6. 보조사업자는 보조사업의 수행과 관련된 계산서, 증거서류, 첨부서류 등 사용내역을 증명하는데 필요한\n    서류를 자체규정에 따라 구비하여야 하고, 당해 보조사업 종료연도부터 5년간 이를 보존하여야 합니다.\n 7. 원칙적으로 보조금의 이월은 허용되지 않으나 부득이한 사유로 이월을 할 경우에도 2회계연도를\n    초과하여 이월할 수 없습니다.\n 8. 보조금으로 취득한 중요재산의 관리\n  가. 교부받은 보조금으로 취득한 중요재산은 사업이 완료된 후에도 재산처분의 제한을 받으며, 보조금\n     정산시 재산 목록을 제출하여야 합니다.\n  나. 교부받은 보조금으로 취득한 중요재산은 관리대장을 비치하고 목적에 맞게 관리하여야 하며,\n     변동현황을 주기적으로 보고해야 합니다.\n  다. 교부받은 보조금으로 취득한 중요재산중 부동산에 관한 소유권이전 등기를 할 때에는 아래 사항을\n     부기등기(附記登記)해야 합니다.\n    1) 해당 부동산은 보조금을 지원받아 취득하였거나 그 효용가치가 증가한 재산이라는 사항\n    2) 보조금 교부 목적과 해당 부동산의 내용연수를 고려하여 보건복지부장관이 정한 기간이 지나지\n       아니하였음에도 그 부동산을 보조금의 교부 목적에 위배되는 용도에 사용, 양도, 교환, 대여\n       및 담보로 제공하려는 경우에는 보건복지부장관*의 승인을 받아야 한다는 사항\n        * 단, 사업수행기관이 법인인 경우 보조금의 교부 목적에 위배되는 용도에 사용은 보건복지부\n          장관의 승인을 받고, 양도, 교환, 대여 및 담보로 제공하려는 경우는 지방비를 부담한 시･도지사의\n          승인을 받아야 함(승인 후 보건복지부 결과보고)"}, {"p": 211, "t": "                                 Ⅴ. 장애인거주시설 운영지원 사업\n\n\n6 종사자 관리\n\n○ 직원의 출산, 병가, 휴직 등의 사유로 인력의 공백이 발생할 경우 해당 직원에게\n 지급할 인건비(유급휴가 임금 및 퇴직적립금 등)를 제외한 범위 내에서 대체\n 인력을 활용할 수 있다.\n- 대체인력 인건비는 해당직원의 잔여 인건비 범위내에서 기본급 및 수당 등\n  급여로 지급할 수 있다.\n○ 아래에 해당되는 직원의 병가에 대해 연간 30일 범위에서 병가를 유급으로\n 할 수 있으며, 병가 일수가 6일을 초과하는 경우에는 의사의 진단서를 첨부\n 하여야 한다.\n- 질병 또는 부상으로 인하여 직무를 수행할 수 없을 때\n- 감염병에 걸려 그 종사자의 출근이 다른 종사자 또는 이용자의 건강에 영향을\n  미칠 우려가 있을 때\n * 지방자치단체 지침, 시설 취업규칙 또는 근로기준에 따라 이 기준 이상의 별도 기준 적용이 가능\n  하며, 이 기준 이상의 별도 기준 적용 시 추가비용은 지방비 또는 시설 자체예산으로 부담함\n\n ※ 시･군･구청장 및 시설장은 병가로 인한 입소 장애인 지원에 공백이 발생하지 않도록 대체인력\n   지원 등의 노력을 해야 함\n\n○ 시설의 노후화로 인한 재건축 등 불가피한 사유로 중증 장애인에 대해 기존\n 시설건물의 이용이 불가하여 일정기간 병원으로 입원 할 경우 종사자의 지원\n 중단을 유예 할 수 있다.(단, 지자체에서 확인 및 판단하되, 최대 2년 적용)\n ※ (예시) 시설의 노후화로 인한 재건축 등 불가피한 사유로 입원기간이 정해진 경우나, 매일 종사자가\n   병원에서 타병원 진료 지원, 돌봄서비스제공 등이 이루어진다면 종사자 지원 중단을 유예할\n   수 있다\n\n○ 생활지도원의 경우 종사자가 임신, 출산 등의 사유로 야간 및 시간외 근로를\n 하지 못하는 경우 시설은 시･군･구 허가를 받아 시간외 수당 범위 내에서 대체\n 인력을 채용할 수 있다."}, {"p": 212, "t": " ○ 사회복지사업법 시행령 제6조에서 규정한 사회복지사에 의한 시설거주자의\n   생활지도 업무 원칙을 고려하여 신규 채용하는 생활지도원은 사회복지사\n   (교과목 이수로 졸업 및 자격취득 예정 포함) 채용을 원칙으로 하며, 보육교사,\n   장애인재활상담사 등을 채용시에는 지자체 담당자와 협의하여야 한다.(단,\n   복지넷(www.bokji.net), 워크넷(www.work. go.kr), 사회복지시설정보시스템\n   (www.w4c.or.kr) 홈페이지 2곳 이상(단, 사회복지시설정보시스템에는 반드시\n   공고)에 15일 이상 공개모집하였으나 응시자가 없는 경우, 1회 이상 다시\n   공개모집 절차를 진행하여야 하며, 2회 이상 응시자가 없는 경우만 해당\n   ※ 협의 시 지자체 담당자는 시설거주자의 지원 등의 공백이 발생하지 않도록 노력 및 협조하여야 한다.\n   ※ 종사자 자격기준은 채용공고일 현재 대학졸업 예정자, 자격증 취득 예정자의 경우에도 채용시험에\n     응시할 수 있으나, 채용일까지 자격 요건을 갖추지 못한 경우(졸업불가로 자격증 취득이 안되는\n     경우에 한함)에는 채용이 취소됨\n\n  - 법률에 따른 보수교육 등 의무교육을 이수하는 경우 출장처리\n\n ○ 시설의 운영 여건에 따라 직종별 지원 인원이 타 직종의 역할을 수행해야 할 필요가\n   있을 경우, 관할 시･군･구청장의 승인을 받은 후 운영할 수 있다.\n  - 시설종사자로 하여금 법인업무를 수행하게 할 수 없으며,\n  - 타 직종 역할 수행 시, 시･군･구는 이용 장애인의 생활 및 안전 등에 문제가\n    발생하지 않는 범위 내에서 승인하여야 한다.(계약직 종사자의 경우 계약\n    만료 시 재승인 필요)\n   * ｢장애인복지법 시행규칙｣ [별표 5]의 종사자 배치기준(생활지도원 등)은 반드시 충족\n\n ○ 간호(조무)사의 경우 보유 면허 및 자격에 따라 시설 안내, 조직도 등에 간호사\n   또는 간호조무사를 구분하여 명시하여야 함\n  - 간호사를 신규 채용하는 경우 「간호법」 제17조제1항에 따른 면허신고확인증을\n   사전에 확인하고 채용하여야 하며,\n  - 간호조무사를 신규 채용하는 경우에는 ｢간호법｣ 제17조제4항에 따른 자격\n   신고확인증을 사전에 확인하고 채용해야 함\n\n ○ 지자체는 직급별 지원기준 이외의 추가적인 인력(간병인, 운전원, 관리인 등)에\n   대해 지방비로 지원할 수 있다."}, {"p": 213, "t": "                                  Ⅴ. 장애인거주시설 운영지원 사업\n\n\n    사회복지시설 종사자 대체인력 지원 사업 안내\n\n∙ 사업개요：사회복지시설 종사자의 연차휴가, 보수교육, 경･조사 등의 사유로 불가피하게 돌봄서비스\n       등을 제공하지 못하는 경우 사회복지시설에 대체인력 파견 지원하여 시설의 원활한 운영\n       도모\n∙ 지원대상：직접 돌봄서비스 제공인력 및 조리원                                         제2장\n - 현 사회복지시설에서 1년 이상 근무한 종사자 및 소규모 시설(5인 이하) 우선지원\n∙ 지원사유：휴가, 교육, 병가, 공가, 긴급사유 등으로 인한 시설종사자 결원\n∙ 지원기간：1회 연속 7일 이내 (지자체별 지침으로 최대 60일 이내 지원 가능)\n∙ 신청방법：사회복지시설정보시스템(www.w4c.go.kr)을 통한 신청\n∙ 문의：시･도 대체인력지원센터\n\n  시･도               기관명                        연락처\n   서울        서울특별시사회복지협의회                  02-2021-1724\n   부산          부산사회복지사협회                   070-8671-4858\n   대구      대구광역시행복진흥사회서비스원                 053-210-5636\n   인천         인천광역시사회서비스원                  032-721-6996\n   광주         광주광역시사회서비스원                  062-607-5284\n   대전         대전광역시사회서비스원                  042-331-8980\n   울산     울산광역시복지가족진흥사회서비스원                052-243-4900\n   세종        세종특별자치시사회서비스원                 044-850-8172\n   경기          경기도사회서비스원                   070-4880-3426\n   강원        강원특별자치도사회서비스원                 033-248-5719\n   충북          충청북도사회서비스원                  043-820-3638\n   충남     충청남도여성가족청소년사회서비스원                041-330-2477\n   전북        전북특별자치도사회서비스원                 063-906-4055\n   전남          전라남도사회서비스원                  061-287-7684\n   경북         경상북도사회복지협의회                  054-843-8550\n   경남          경상남도사회서비스원                  055-230-8226\n   제주          제주사회복지사협회                   070-4169-4627"}, {"p": 214, "t": "[별표 1] 2026년도 장애인 거주시설 종사자 인건비 지원 기준\n                                                                  (단위：천원/월)\n                                       간호조무사         생활지도원\n  직위\n          시설장      사무국장       과장    ( ’15년 3월 31일              관리인     기능직\n (호봉)                                               선임   직원\n                                        이전 채용)\n  1호봉     2,921    2,630     2,428   2,428   2,313 2,236  2,181  2,157\n  2호봉     3,021    2,714     2,488   2,488   2,368 2,278  2,219  2,178\n  3호봉     3,123    2,813     2,554   2,554   2,435 2,319  2,262  2,216\n  4호봉     3,239    2,914     2,658   2,658   2,502 2,363  2,304  2,257\n  5호봉     3,372    3,034     2,768   2,768   2,569 2,426  2,352  2,297\n  6호봉     3,511    3,157     2,882   2,882   2,663 2,488  2,391  2,348\n  7호봉     3,650    3,279     3,000   3,000   2,759 2,581  2,474  2,387\n  8호봉     3,794    3,419     3,119   3,119   2,860 2,683  2,563  2,450\n  9호봉     3,939    3,565     3,235   3,235   2,977 2,779  2,636  2,528\n 10호봉     4,076    3,703     3,358   3,358   3,075 2,863  2,728  2,614\n 11호봉     4,224    3,837     3,472   3,472   3,172 2,937  2,794  2,681\n 12호봉     4,349         Ⅴ. 장애인거주시설 운영지원 사업\n\n\n□ 종사자 수당\n                                                              (단위：천원)\n\n 수당의 종류         지급대상              지급액            지급횟수 및 지급일 등\n\n                                                 기본급의 60%씩 연 2회,\n             재직중인 종사자\n   명절                                           설과 추석이 속한 달의 보수지급일\n            (육아휴직, 병가휴직        기본급의 120%                                제2장\n   휴가비                                         (또는 설과 추석 전 15일 이내에\n             등 장기휴직 제외)\n                                                    시설장이 정한 날)\n            규정된 근무시간 외         시간외근로시간당           시간외근로를 한 다음달           인\n 시간외근무\n            (연장, 야간, 휴일)         [통상임금                 보수 지급일\n  수당 등\n            초과하여 근무한 자         ×1/209×1.5]       (단, 12월은 당월에 지급)        시\n                            배우자 및 자녀를 제외한\n                            부양가족 1명당 20천원\n                              (배우자 40천원,\n              부양가족이 있는\n  가족수당                        첫째자녀 50천원,        세부기준은 공무원기준 준용\n                종사자\n                              둘째자녀 80천원,\n                            셋째 이후 자녀 1명당\n                                120천원)\n\n* 시간외근무 수당의 인정은 지문인식 등 신체일부를 확인하는 시스템만 적용\n - 단, 불가피한 사유로 지문인식 등이 불가능한 종사자는 시간외근무 대장 등 증빙서류를 갖추는 것으로 대체할 수 있음\n - 지문인식기 등 신체 일부를 확인하는 시스템 사용 시 반드시 개인의 정보제공 동의를 받도록 할 것\n\n\n[별표 2] 2026년 장애인 거주시설 관리운영비 지원 기준\n\n\n                                             지원 단가\n 시설종류         지원 구분\n                                30인 이하 시설             30인 초과 시설\n\n            시설당 기본지원         입소자 수×2,641천원/년         30인×2,641천원/년\n 장애인\n 거주시설                                                (입소자 수 – 30인)×\n           입소자 수 가중지원                -\n                                                       1,500천원/년\n\n* 지원단가는 시설 이용 장애인 현원에 따른 지원 기준임\n* 매월 15일을 기준으로 하여 15일까지 입소한 경우에는 관리운영비 전액 지원, 15일 이후 입소한 경우에는 일할 계산하여\n  관리운영비 지원"}, {"p": 216, "t": "[별표 3]\n             2026년 장애인 거주시설 인건비 지원 기준\n  직 종 명                           지 원 기 준\n\n   시설장     시설당 1명(동일 부지 내 타 시설과 시설장을 겸하는 경우는 중복지급 불가)\n\n           시설당 1명, 다만 현원 30인 이상인 시설\n           * 다만, 사무국장, 사무원, 사회재활교사의 경우 기존 정원 30인으로 국고지원을 받은 경우 종사자\n             고용 안정 등을 고려하여 유예기간(1년간) 적용 후 현원 80%(24인)수준 까지는 유효한 것으로 인정\n  사무국장       - 현원 산정시 전년도 12월말 기준\n           * 24년말 기준 사무국장, 사무원, 사회재활교사 미지원시설은 국고보조금 추가 지원 제외\n           * 아울러 지자체는 필요시 관내 거주시설과 협의를 거쳐 합리적 수준의 정원 조정, 입소자 적극\n             배치 노력, 거주시설 유형 변경 등 다양한 조치 가능\n\n           시설당 1명, 다만 현원 30인 이상인 시설\n           * 다만, 사무국장, 사무원, 사회재활교사의 경우 기존 정원 30인으로 국고지원을 받은 경우 종사자\n             고용 안정 등을 고려하여 유예기간(1년간) 적용 후 현원 80%(24인)수준 까지는 유효한 것으로 인정\n  사 무 원      - 현원 산정시 전년도 12월말 기준\n           * 24년말 기준 사무국장, 사무원, 사회재활교사 미지원시설은 국고보조금 추가 지원 제외\n           * 아울러 지자체는 필요시 관내 거주시설과 협의를 거쳐 합리적 수준의 정원 조정, 입소자 적극\n             배치 노력, 거주시설 유형 변경 등 다양한 조치 가능\n\n 시설관리인     이용장애인 현원 200인 이상 시설당 1명\n\n           시설당 1명, 다만 현원 30인 이상인 시설\n           * 다만, 사무국장, 사무원, 사회재활교사의 경우 기존 정원 30인으로 국고지원을 받은 경우 종사자\n             고용 안정 등을 고려하여 유예기간(1년간) 적용 후 현원 80%(24인)수준 까지는 유효한 것으로 인정\n 사회재활교사      - 현원 산정시 전년도 12월말 기준\n           * 24년말 기준 사무국장, 사무원, 사회재활교사 미지원시설은 국고보조금 추가 지원 제외\n           * 아울러 지자체는 필요시 관내 거주시설과 협의를 거쳐 합리적 수준의 정원 조정, 입소자 적극\n             배치 노력, 거주시설 유형 변경 등 다양한 조치 가능\n\n           시설당 1명, 다만 1회 급식인원(종사자 포함) 50명 이상인 시설(집단급식소 설치 의무) 또는\n  영 양 사\n           정원 30명 이상인 시설\n  간 호 사\n           시설당 1명, 중증･아동장애인 현원 150인 이상 1명 추가\n (간호조무사)\n 물리치료사     중증･지적장애･지체･영유아 장애인 현원 30인 이상 시설당 1명 이상\n           중증･지적장애･지체･영유아 장애인 현원 30인 이상 시설당 1명 이상\n 작업치료사\n           * 다른 전문요원이 이를 겸하고 있을 때에는 그러하지 아니함\n\n   청능사     청각/언어 장애인 현원 30인 이상 시설당 1명\n 언어재활사     중증･청각/언어･지적･영유아 장애인 현원 30인 이상 시설당 1명\n 보행훈련사     시각장애인 현원 30인 이상 시설당 1명"}, {"p": 217, "t": "                                       Ⅴ. 장애인거주시설 운영지원 사업\n\n\n 직 종 명                          지 원 기 준\n          현원 30인 이상 시설당 1명\n상담평가요원\n          * 다른 전문요원이 이를 겸하고 있을 때에는 그러하지 아니함\n          중증, 영유아장애인 현원 4.7명당 2명\n          * “이용자 현원÷4.7×2”로 계산한 값을 반올림한 인원수로 지원\n 생활지도원                                                               제2장\n (생활재활교   아동장애인 현원 4명당 1명\n    사)    지적장애, 시각장애인 현원 5명당 1명\n          지체, 청각･언어장애인 현원 10명당 1명\n          시설당 2명\n  조리원     * 이용장애인 현원이 50명 이상인 시설의 경우 1명 추가하며, 이후에는 50명을 초과할 때마다       시\n            1명 추가(예시: 50명 미만 2명, 50~100명 3명, 101~150명 4명)             설\n\n          시설당 1명, 다만, 이용장애인 현원 30인이상 시설\n  위생원\n          * 이용장애인 현원이 100명 이상인 시설의 경우에는 100명을 초과할 때마다 1명 추가\n\n  촉탁의사    시설당 1명\n※ 인건비 지원기준 외 거주시설의 안전사고 예방, 입소자 편의 증진 및 ｢근로기준법｣ 준수 등을 위해 2020년\n  이후 추가 지원된 52시간 교대인력은 지원 당시 기준과 입소 장애인 현원을 고려하여 지속 지원 필요\n※ 지방자치단체는 위 기준 이상으로 지원되도록 최대한 노력 필요\n※ 중증장애인은 서비스 이용 종합조사에 따라 중증장애인거주시설 입소가 필요하다고 판단된 장애인을 기준으로 하고,\n  중증장애인거주시설뿐만 아니라 유형별 장애인거주시설 등에 입소되어 있는 중증장애인에 대해서도 동일하게 적용\n※ 등급제 적용 이후 입소자 중증판정 기준은 서비스지원 종합조사 기능제한(X1) 성인 240점 이상 아동 190점 이상"}, {"p": 218, "t": "[별표 4]\n         장애인 거주시설 관리운영비 지원 대상 항목(예시)\n    지 원 항 목 명                 지      원      내     용\n 가. 이용장애인보호비     ※ 시설내 장애인의 영양, 건강, 위생 등의 직접보호에 소요되는 비용\n  1) 영양급식비       ◦ 장애인의 영양급식 및 간식비\n  2) 의약품비        ◦ 장애인 건강관리에 소요되는 보건위생 및 의약품 등 구입비\n  3) 위생재료비       ◦ 장애인의 위생관리를 위한 용품 구입비 등\n                 ※ 시설을 유지, 보수, 안전 및 관리에 소요되는 비용\n                   1회 지원한도액: 최대 500백만원, 승강기 수리비 등은 실비적용 가능)\n 나. 시설관리비        ※ 소규모 유지 보수만 해당(내용연수를 현저히 증가시키는 대규모 수리, 기능을\n                   변화하거나 재산가치를 높이는 공사,경상보조의성격을 벗어난 큰 금액은 제외)\n  1) 건물유지비       ◦ 건물 유지･관리비\n  2) 일상생활 용품비    ◦ 일상 생활용품 구입비(가전용품, 생활실비품 등 포함)\n  3) 냉･난방연료비     ◦ 시설의 냉방 및 난방용 연료비 및 이에 소요되는 전기료\n  4) 차량유지비       ◦ 실제 운행중인 시설 업무용 차량의 연료비, 보험료 등\n  5) 공공요금        ◦ 시설 운영에 직접 소요되는 수도･전기･우편･전화･운송료 등\n  6) 오폐수정화시설운영비  ◦ 오폐수정화시설 설치･운영 비용\n  7) 환경개선부담금     ◦ 환경개선부담금 납부금\n                 ◦ 사무용품비, 인쇄비\n  8) 수용비 및 각종수수료 ◦ 퇴직연금수수료 등 각종수수료\n                 ◦ 공기청정기렌탈비\n                 ◦ 법령에 의하여 지급하는 제세(자동차세 등)\n                 ◦ 협회(가입)비(보건복지부장관 허가 장애인복지시설관련협회에 한함)\n  9) 제세공과금       ◦ 화재･자동차보험료, 기타보험료\n                 ◦ 소멸성 화재보험료(적립식 보험에 가입하고 있는 시설은 기간종료되면 시설운영\n                   비에 편입 활용)\n                 ※ 건강보험  및 의료급여에서 비급여되는 진찰, 처치, 투약, 수술 등 지역사회 관련\n 다. 의료재활사업비        시설을 이용하는데 소요되는 비용\n  1) 재활치료비       ◦ 장애정도를 호전시키는데 필요한 재활치료 비용\n  2) 물리치료비       ◦ 지체･지적･자폐성장애인 등 중증장애인에 대한 물리치료비용\n  3) 작업치료비       ◦ 작업치료비용\n  4) 언어치료비       ◦ 청각, 언어장애인 및 지적장애인, 자폐성장애인 등의 언어치료비용\n  5) 청능치료비       ◦ 청각, 언어기능 장애인의 청능훈련 치료비용\n  6) 청능검사비       ◦ 청각, 언어기능 장애인의 청능훈련치료를 위한 청능검사비용\n  7) 보장구제작 및 수리비 ◦ 장애인 보장구 제작 및 수리비용\n 라. 직업재활사업비      ※ 직업재활활동에 소요되는 재료비 등\n 마. 교육재활사업비      ※ 교육을 통한 재활사업에 소요되는 비용\n  1) 학용품비        ◦ 이용장애인의 교육활동에 소요되는 재료 등 구입비\n  2) 부교재 및 교양도서비 ◦ 이용장애인의 교육 및 교양함양을 위한 교재･도서 구입비\n 바. 사회･심리재활사업비   ※ 시설 및 지역사회를 이해하고 이에 적응하는데 소요되는 비용\n  1) 관람료         ◦ 영화, 연극, 운동경기 등의 관람료\n  2) 여행경비 등      ◦ 여행, 등산, 놀이 등에 소요되는 여비, 기구 구입비\n 사. 직원 교육훈련 여비   ※ 시설 직원의 교육훈련 및 출장에 소요되는 여비 등 경비\n 아. 인권지킴이단 운영비   ※ 인권지킴이단 운영(수당 등)에 소요되는 비용\n 자. 시설운영위원회 운영비  ※ 시설 운영위원회 운영(수당 등)에 소용되는 비용\n ※ 관리운영비 항목은 특정할 수 없으며, 이용장애인 및 시설운영에 필요한 항목은 지출 가능"}, {"p": 219, "t": "                                       Ⅴ. 장애인거주시설 운영지원 사업\n\n\n[별지 1] 제출 서식\n\n\n         장애인거주시설 운영지원 국고보조금 교부 신청서\n                      (20 년 ○분기, 시설명)\n 보건복지부장관 귀하\n 장애인복지법 제81조, 보조금 관리에 관한 법률 제16조의 규정에 의하여 다음과 같이 국고\n보조금의 교부를 신청합니다.\n                                                          20 . 00. 00.    주\n                                                        00000시장･도지사       설\n\n\n 1. 보조사업자에 관한 사항\n   ○ 사업자 종류：지방자치단체 □       사회복지법인 □ 기타 법인 □ 기타 □\n   ○ 사업자 명칭：\n   ○ 사업자 대표：\n\n\n 2. 시설에 관한 사항\n   ○ 시설종류：장애인거주시설(시설유형)\n   ○ 시 설 명：               (☏ 000 - 000 - 0000)\n   ○ 소 재 지：\n   ○ 시 설 장：               (☏ 000 - 000 - 0000)\n\n\n 3. 사업에 관한 사항\n   ○ 사 업 명：장애인거주시설 운영지원\n   ○ 예산과목：080-082-1500-1536-302\n   ○ 국고보조금 교부신청\n                                                             (단위：천원)\n   구 분     20   예산액     기교부액      금회요청액          교부잔액         비고\n   시설명\n* 예산액은 국고보조금 예산임"}]}, {"title": "Ⅵ. 장애인거주시설 기능보강 사업", "start": 220, "end": 264, "subs": [], "pages": [{"p": 220, "t": "     Ⅵ     장애인거주시설 기능보강 사업\n\n\n 1    사업 목적\n\n ○ 일반가정에서 생활하기 어려운 장애인의 시설 서비스 수요 충족을 위한 시설 확충\n     및 주거환경 개선비용 등을 국가 및 지방자치단체의 보조금으로 지원\n\n\n 2 사업의 종류\n\n ○ 장애인거주시설 기능보강사업은 시설 신축, 시설 증･개축, 시설 개보수,\n      장비보강 사업으로 구분\n     - 신축：건축물이 없는 대지(기존 건축물이 철거되거나 멸실된 대지를 포함)에\n          시설을 새로이 건축하는 것\n     * (예시) 장애인 거주시설 신규 설치 및 기존 시설이 부지를 이전하여 신규 설치, 공동생활가정의\n       경우 일반주택, 공동주택 등 매입, 기존 장애인 거주시설 대지 내 있는 모든 건축물 멸실(건축물\n       대장/등기) 후 새로이 행해지는 건축공사 등\n\n     - 증축：기존 시설이 있는 대지에 건축물의 건축면적, 연면적, 층수 또는 높\n          이를 늘리는 것\n     * (예시) 기존의 장애인 거주시설 동일 대지 내 추가로 별동 등 건물을 건축하는 것은 증축\n\n     - 개축：기존 건축물의 전부 또는 일부[내력벽･기둥･보･지붕틀 중 셋 이상이\n          포함되는 경우를 말한다]를 철거하고 그 대지에 종전과 같은 규모의\n          범위에서 건축물을 다시 축조하는 것\n     - 개보수：건축물의 노후화 억제 및 기능향상 등을 위해 시설 건물의 내･\n            외부를 수선 또는 변경하는 것\n     - 장비보강：시설안전 및 환경 개선, 이용 장애인의 재활훈련･편의증진 등에\n             필요한 장비 구입 지원\n ○ 단년도 사업(국고 보조율 50%) ※ 지자체 판단하에 지방비 추가 지원 가능"}, {"p": 221, "t": "                               Ⅵ. 장애인거주시설 기능보강 사업\n\n\n3 지원대상\n\n○ 지방자치단체가 설치한 시･군･구립 시설, 사회복지법인 또는 비영리법인\n  (사회적협동조합 포함)이 설치･운영하는 시설\n○ 지원근거\n - ｢장애인복지법｣ 제34조제1항제3호(재활상담등의조치), 제57조(장애인\n  복지시설의 이용 등), 제79조(비용부담), 제81조(비용보조)\n4 주요 업무처리 절차\n\n가. 국고보조금 교부신청\n\n○ 법적근거：보조금 관리에 관한 법률 제16조(보조금의 교부신청)\n\n○ 교부신청 세부 일정\n\n - ’26년도 확정사업 교부신청：3월말까지\n * 인허가 및 입찰로 인한 교부신청 지연 및 사업변경(감액)이 필요한 사업은 사유서 첨부하여\n   보건복지부에 사전 통보\n * 마감일 이후 교부 미신청 사업은 사업선정이 취소될 수 있음\n\n - 국가보조금의 변경이(감액) 발생하는 사업계획 변경 마감：5월 31일\n\n - 국가보조금의 변경(감액) 사업 교부신청 마감：5월 31일\n\n○ 사업 모니터링(관할 지자체)\n\n - 월 1회 이상 점검: 보조금의 세부 집행내역, 매월 집행실적 및 집행마감 결과\n\n - 분기별 점검: 사업 모니터링 후 분기 말일까지 점검 결과 통보\n * 상반기 내 미시행 및 연내 집행 완료가 어려운 사업은 취소될 수 있음"}, {"p": 222, "t": "나. 2026년도 국고보조금 집행 및 2025년도 사업비 정산\n\n ○ 2026년도 국고보조금 집행\n  - 연도 내 사업이 완료될 수 있도록 별도의 절차로 이행되는 건축허가 등을\n    적극 지원하되 필요할 경우 국고보조금 교부 전에 건축허가 등 선행 추진도 가능\n  - 입찰이 필요한 사업의 경우에는 모든 단계의 입찰은 특별한 사유를 제외하고\n    긴급입찰 추진(긴급입찰 사유：국가 또는 지방자치단체의 재정 정책상 예산의\n    조기집행)\n  - 건설공사의 경우 착수와 동시에 「지방회계법」 제35조(선금급과 개산급) 및\n    같은법 시행령 제44조(선금급)에 의거 계약금액의 100분의 70을 초과하지\n    아니하는 금액을 반드시 지급토록 할 것\n  - 부지매입비, 설계비 및 감리비 등의 제반수수료는 자부담\n  - 장비(차량 등)의 취･등록세, 보험료, 탁송료 등의 제반수수료는 자부담\n\n ○ 예산계상 신청시 사업비에 법인 자부담이 포함되어 있는 기능보강사업에 대한\n   사업비 정산은 국고보조금 통합관리지침 제23조 적용\n  - 정산대상：2024년 이전 이월사업 및 2025년 기능보강 사업\n  - 제출기한：2026. 2. 28.까지 정산결과 보고\n   * 1월 중 장애인 거주시설 국고보조사업 정산관련 안내 별도 시행\n\n\n다. 2027년도 사업신청(국고보조사업 예산계상신청)\n\n ○ 법적근거：｢보조금 관리에 관한 법률｣ 제4조(보조사업을 수행하려는 자의\n   예산계상 신청 등)\n\n ○ 신청기한：추후 별도 통보\n\n ○ 국고 보조율：50%\n\n ○ 사업신청 경로：보조사업자(법인 등) → 시･군･구 → 시･도 → 보건복지부\n   * 다음연도 장애인복지시설 국고보조사업 예산계상신청 안내 별도시행"}, {"p": 223, "t": "                                Ⅵ. 장애인거주시설 기능보강 사업\n\n\n○ 신축시설 사업비 신청 및 수요 산정\n - 지자체별로 시설 서비스 수요를 판단하여 공급(확충)시설 수 산정\n - 장애인의 자립생활 촉진할 수 있는 시설 및 중증장애인 등에 대한 전문적\n  서비스 제공기관 확충 등 거주시설 기능 개편 위주 지원\n○ 신축유형\n - 사회복지법인에 신축비 국고보조금 지원 설치, 법인시설로 운영\n - 시･군･구립 시설로 설치하고, 법인에 위탁 운영\n * 시･군･구청장은 자체 시설 확충계획에 따라 신축비 국고보조사업 예산계상 신청을 할 수 있음         주\n  (예산계상 신청 후에 신축 보조사업자 결정 가능)\n\n○ 시･도별 기능보강 사업계획에 기반하여 사업 신청\n - 시･도 전체 수요를 조사하여 전체적인 기능보강계획(장･단기 사업계획)을\n  수립하고, 이에 근거하여 사업 신청\n - 사업 신청 전, 관할 지자체에서는 지원 신청한 사업에 대하여 시･도 자체\n  심사위원회를 구성하여 사업의 필요성, 정부 보조금 지원의 타당성, 규모의\n  적정 여부, 사업 추진 가능성 등을 면밀히 검토･분석하여 사업 신청\n\n\n라. 사업대상자 선정 통보\n\n○ 법적 근거：｢보조금 관리에 관한 법률｣ 제12조(보조금 예산의 통지)\n\n○ 선정통보(보건복지부 → 지자체)\n\n - 매년 9월 15일 까지 보조금 예산을 통보(예비통지)하고, 국회에서 예산이\n  심의･확정된 후에는 그 확정된 금액과 내역을 즉시 통지(확정통지)\n\n - 신축(개축)사업의 연도내 완공을 위해 예비통지(가내시) 시 사업내역 및 사업\n  대상자를 선정 통보하고, 동시에 지자체는 건축허가 등 공사 선행절차를\n  추진토록 함(*조기착공으로 공사기간 연장 효과)\n\n○ 지자체는 확정통보 명세와 금액을 사업자에게 즉시 알려 사업을 착수할 수\n  있도록 함."}, {"p": 224, "t": " 5 추진 방침\n\n ○ 비용부담\n\n  - 국비와 지방비의 부담비율은 50:50을 원칙으로 한다.\n   ※ 필요한 경우 지자체 판단하에 지방비 추가 지원 가능\n\n ○ 국고보조금 확정통보 및 지방비 부담조서에 따른 시설기능보강사업은 ｢보조금\n   관리에 관한 법률｣, ｢국가재정법｣, ｢사회복지사업법｣, ｢장애인복지법｣ 및 해당\n   법률 시행령, 시행규칙과 관련 지침에 따라 수행하고, 그 밖의 세부적인 사항은\n   이 지침에 따름\n\n ○ 시･도지사는 필요할 경우 광역시･도 단위의 시설수요를 충족할 수 있도록\n   시설확충 사업계획을 면밀히 검토･조정하고 사업수행에 따른 지도･감독을\n   수행할 것\n\n ○ 시･도지사 및 시･군･구청장은 사업비를 신청하고자 할 때에는 지역별 시설확충\n   (서비스공급)의 필요성, 사업계획의 타당성, 사업추진의 효율성 및 보조사업자의\n   사업수행 능력 등을 판단하기 위해 반드시 자체심사위원회를 구성하고 이를\n   통해 지원사업에 대한 우선순위를 결정할 것\n\n ○ 장애인단기거주시설, 공동생활가정 및 독립형 주거서비스 제공기관의 경우\n   일반주택, 아파트 등 공동주택 등을 매입하여 당해 시설을 설치하는 것도\n   가능하나, 이 경우 보조금은 상기 지원액을 초과하지 않도록 할 것(단 건축법,\n   소방법 등 기타 관련 법령에 적합한 시설일 것)\n\n ○ 기존 대규모 시설의 경우 소규모화 과정에서 발생하는 유휴공간을 활용하여\n   1~2인실 등 개별 공간 마련을 위한 개･보수 우선 지원\n\n ○ 관할 지자체는 장애인 거주시설 입소 대기 해소와 기존 거주시설 장애인의\n   자립생활 촉진 및 시설 거주 여건 개선을 위해 공동생활가정을 설치하는 경우\n   우선 지원할 것"}, {"p": 225, "t": "                                Ⅵ. 장애인거주시설 기능보강 사업\n\n\n○ 장애인 거주시설 내 장애아동의 생활환경 개선을 위한 기능보강 지원\n\n○ 시･도지사는 사업계획을 변경 신청할 때에는 별첨서식에 의하되 사업계획의\n 타당성과 변경 사유 등을 충분히 검토 후 결정\n\n○ 소방 설비, 방염설비 및 전기･가스 안전, 시설 노후화 개･보수, 석면･우레탄･               제2장\n 드라이비트 제거, 자연재해(지진 등) 대비 내진보강 등 시설물 소방･안전 관련\n 예산 우선 지원\n- 특히, 화재 등 재난사고 대비 인명피해 최소화를 위한 직통계단* 및 배연창** 설치              주\n  예산 최우선 지원\n\n  * 직통계단：최상층에서 지상 또는 피난층까지 복도 등을 통하지 않고 계단과 계단참(폭이 넓게 된\n   부분)의 연속으로만 이동할 수 있게 된 계단이나 경사로\n\n ** 배연창：화재발생시 창문을 자동으로 강제 개방하여 연기 및 유독가스를 배출하는 창(질식사고로\n   인한 인명피해 최소화)\n\n○ 2026년 기능보강 사업의 경우 2026년 1/4분기 내 공사착공을 조건으로\n 국고보조금 교부\n\n\n6 사업 지원 기준\n\n○ 부지매입비, 설계비 및 감리비 등의 제반수수료는 자부담\n\n- 단 설계비의 경우 안전진단전문기관의 시설안전평가에서 긴급을 요하는 판정을\n  받아 안전사고 우려가 있음에도 법인의 재정여건상(영리사업 부재, 경영악화,\n  후원금 축소 등) 자부담 능력이 현저히 떨어진다고 판단되는 경우 자부담 면제\n  가능(시･군･구, 시･도에서 확인하고 증빙서류 첨부)\n\n○ 장애유형별･중증장애인 거주시설 신축은 장애인 지역사회 자립지원 (시범)\n 사업이 추진되고 있는 상황을 고려하여 이전신축 등 예외적인 경우에만 지원"}, {"p": 226, "t": " ○ 신축･증개축(개･보수 포함) 기능보강 사업 지원 대상 선정 시 소규모 시설 및\n   2층 이하 시설 우선 지원\n  - 특히, 신축 시설에 대하여는 2층 이하로 제한* 원칙(아파트 등 공공주택도 동일)\n   * 부지 확보의 어려움 등으로 불가피하게 3층 이상으로 신축할 경우에도 이용자의 거실(침실)은\n     2층 이하로 제한\n\n  - 생활공간을 증축할 경우 침실을 2층 이하로 배치\n\n ○ 신축, 증･개축 등의 사업 지원단가 초과분은 시설 자부담\n\n ○ 신축 사업\n  - 지원기준(2026년)\n\n                                            지원액\n          구 분         지원 단위           *\n                                  연면적 (a)         지원단가(b)\n\n     중증장애인･장애영유아･\n      장애유형별 거주시설      1개소/30인      900㎡\n    독립형 주거서비스 제공기관\n\n        단기거주시설        1개소/10인      300㎡           1,790천원\n\n        피해장애인 쉼터      1개소/8인       240㎡\n\n        공동생활가정        1개소/4인       120㎡\n\n   * 연면적은 최대지원면적을 정한 것이며, 실제면적을 기준으로 지원함\n\n  - 시설의 소규모화 및 장애인의 자립생활 촉진을 위해 독립형 주거서비스\n    제공기관, 공동생활가정, 학대피해장애인쉼터의 경우 지역사회 내의 아파트 등\n    기존 건물 매입비로 지원 가능\n\n  - 기존 시설의 부지(동일법인 시설부지 포함) 내 시설 신축사업은 지원대상 제외\n  - 동일법인 산하 장애인거주시설을 소규모화 명목으로 2개 이상의 시설로\n    분할하는 것은 신청 제외(단, 공동생활가정은 가능)"}, {"p": 227, "t": "                                Ⅵ. 장애인거주시설 기능보강 사업\n\n\n○ 증･개축 사업\n\n- 지원기준：개소당 지원 단가 1,790천원/㎡\n\n- 시설별･사업볍 특성에 따라 지원 수준을 결정하되, 정원 30인 초과 시설은\n  증축비 지원 대상에서 제외. 다만, 정원 30인 초과의 시설이 증개축 사업을\n  필요로 하는 경우, 반드시 시설의 구체적인 소규모화* 추진계획을 포함하여\n  제출하고, 해당 시･도는 전년도 이행상황을 기능보강 신청 시 첨부해야 함\n * 시설 소규모화는 정원의 20% 이상(정원을 20% 이상 감축하였을 때 30인 미만이 되는 경우는      거\n   30인 이내) 축소를 말함(현원 감축+정원 조정)\n- 개축은 안전진단 D등급, 시설물 안전관리대상(제3종 시설물 지정 등) 시설을 우선\n  신청\n ※ 신축, 증･개축 사업은 보건복지부 외부 선정심사위원회 심사를 통해 지원대상 결정\n\n○ 개보수 사업\n\n- 지원기준：시설별, 사업별 특성에 따라 지원수준을 결정하되, 신축사업 단가\n  (1,790천원/㎡)를 초과할 수 없음\n\n- 시설의 안전, 소방시설 등 사업을 우선 지원\n\n○ 장비보강 사업\n\n- 지원기준：시설별, 사업별 특성에 따라 지원수준을 결정\n\n- 시설 이용자의 재활에 필요한 장비 구입\n\n- 소방･안전에 대비한 필수 소방장비 등 구입 또는 추가 설치\n\n- 신축･증축･개축시설의 필수장비 구입 우선 지원(총액 2억원 이내)"}, {"p": 228, "t": " 7    지원 대상 선정기준 및 지원 배제 항목\n\n가. 지원 대상 선정기준\n\n 1) 지원 대상 선정 시 지원순위 하향 대상\n\n 1. 기능보강 사업이 확정된 후 천재지변 등과 같은 특별한 사유없이 사업을\n     중도에 포기한 경우 사업을 포기한 다음 해부터 4년간 기능보강 국비 지원\n     지원순위 하향\n     * (예시1) ’24년 사업선정 전 ’23년 사업포기 → ’24~’27년 제외\n     * (예시2) ’24년 사업선정 후 ’23년 사업포기 → ’24년 사업선정 취소(후순위사업 선정), ’24~’27년 제외\n\n 2. 기능보강 사업이 특별한 사유없이 이월이 될 경우 이월된 사업 다음 해부터\n     3년(일부:2-a) 또는 4년(전액:2-b)간 기능보강 국비 지원 지원순위 하향\n     * (예시1) ’22년 사업을 ’23년 일부 이월, ’23년 종료 → ’24~’26년 제외\n     * (예시2) ’22년 사업이 ’23년 전액 이월, ’24년 종료 → ’24~’27년 제외\n\n 3. 기능보강사업 사업 종료 후 천재지변, 화재 등과 같은 특별한 사유없이 품목별\n     내용연수 도래 전 중요재산을 매각하여 보조금 반납 또는 원상복구 등 행정\n     처분을 받은 경우, 행정처분일부터 당해연도 남은 기간 및 행정처분을 받은\n     다음 해부터 3년간 기능보강 국비 지원 지원순위 하향(단, 사업선정 된 경우\n     에는 사업 취소 후 후순위사업으로 선정)\n     * (예시) ’24년 매각하여 ’24년 4월 행정처분 → ’24. 4월~’27년 제외\n\n 4. 장애인거주시설 운영 과정에서 다음과 같은 사유가 있는 경우, 다음 해부터\n     3년간 기능보강 국비 지원 지원순위 하향(단, 사업선정된 경우에는 사업 취소\n     후 후순위 사업으로 선정)\n\n  a 기능보강사업 추진과정에서 (사전)승인절차 등을 미준수한 경우\n\n  b. 보조금 교부 결정 이후 불가항력적인 사유 없이 사업 수행에 착수하지 않거나,\n      사업기한 내에 완료하지 못할 것이 명백하다고 인정되는 등의 사유로 인해\n      사업을 수행할 수 없는 경우"}, {"p": 229, "t": "                              Ⅵ. 장애인거주시설 기능보강 사업\n\n\nc. 기존에 심의･승인된 기능보강사업의 내용을 임의로 수정하여 추진한 경우\n\nd. 사업수행기관 또는 보조금을 지원받고자 하는 법인, 시설 등 당사자 외\n  제3자로부터 부정청탁이 있는 경우\n\n5. 장애인거주시설 운영 과정에서 다음과 같은 사유가 있어 행정처분을 받은 경우               제2장\n 행정처분일부터 당해연도 남은 기간 및 행정처분을 받은 다음 해부터 4년간\n 기능보강 국비 지원 지원순위 하향(단, 사업선정 된 경우에는 사업 취소 후\n 후순위사업으로 선정)\na. 법령의 규정, 보조금 교부 결정의 내용 또는 법령에 의한 보건복지부장관의\n\n  처분을 위반한 경우\n\nb. 거짓이나 그 밖에 부정한 방법으로 보조금의 교부를 받은 경우\n\nc. 보조금을 지급 목적과 다른 용도로 사용한 사실이 확인되거나 보조금법\n  제33조에 따라 보조금의 전부 또는 일부의 반환명령을 받은 경우(반환금을\n  분납하는 경우 분납 시작 시를 기준으로 함)\n\nd. 보조금을 지급받기 위한 요건을 갖추지 못하고 보조금을 지급받아 보조금법\n  제33조에 따라 보조금의 전부 또는 일부의 반환명령을 받은 경우\n\ne. 보고된 사업비 등 사업집행 실적보고가 허위인 경우\n\nf. 그 밖에 기능보강사업의 추진과정에서 부적절한 보조금의 집행이 있다고\n  판단되거나 국고지원 목적에 반하는 중대한 사유가 있는 경우\n ※ 다만, 처분취소소송 중인 경우 지원 배제의 기산점은 처음 행정처분을 받은 때로 봄\n\n6. 장애인 대상 범죄 발생･학대, 성폭력･성희롱 사건이 발생하여 장애인권익\n 옹호기관으로부터 학대판정, 수사기관의 수사 등으로 행정처분을 받은 시설은\n 행정처분일부터 당해연도 남은 기간 및 행정처분을 받은 다음 해부터 4년간\n 기능보강 국비 지원 지원순위 하향(단, 사업 선정된 경우에는 사업 취소 후\n 후 순위사업으로 선정)"}, {"p": 230, "t": "   ※ 기능보강사업 지원순위 하향 대상 시설에 해당되더라도 “국가･지자체 안전대진단(보수보강)\n     또는 국토관리원에서 실시하는 소규모 취약시설(미흡 또는 불량) 안전 점검 결과” 또는 ｢시설물의\n     안전 및 유지관리에 관한 특별법｣상의 정기안전점검, 정밀안전점검, 정밀안전진단 등의 보고서를\n     첨부한 시설에 대해서는 심사를 통해 안전문제를 실질적으로 해결할 수 있는 사업(신축 또는\n     내진보강 등)에 한해서 지원 할 수 있으며, 정밀안전진단 보고서를 첨부하는 경우 관리주체 직접\n     발주 실시 여부, 진단의 목적, 구조 기준 등을 검토한 시･도 검토 확인서(별지 6-1호)를 첨부\n     하여야 한다.\n\n\n 2) 지원순위 하향 대상 사업자 관리(신설)\n\n ○ 지원순위 하향 대상 사업자 관리는 (별지 제11호 서식)을 작성하여 각 시･도에서\n   총괄 관리하고 해당 연도 사업 신청 시 제외 대상 여부를 검토하여야 한다.\n\n ○ 이월사업의 경우 전년도 예산계상 신청 및 당해연도 상반기 신청한 사업에\n   대하여는 최초 사업 신청 당시 사업 기간을 지나 이월하는 사업은 지원순위\n   하향 대상으로 간주하고, 당해연도 하반기 추가 선정 건에 대하여는 사업 공고\n   조건(이월 관련 지원순위 하향 미적용) 및 천재지변(우기 및 동절기 기상 여건 등)\n   등과 같은 특별한 사유를 고려하여 지원순위 하향 관련 내용을 반영\n\n\n 3) 지원대상 선정기준에 따른 기선정 사업의 지원순위 하향 적용\n\n ○ 지원순위 하향 대상 유형 1~5번이 발생한 경우, 관련 내용이 발생하였음을\n   서면으로 보고하고, 보조사업자의 차기 년도 사업이 있을 경우에는 지원순위\n   하향 적용을 요청하며, 지원순위 하향 적용 기준 연도는 행정처분일 기준으로 함\n   * (예시) 24년 예산계상 신청으로 25년 사업선정 후 지원순위 하향 대상 유형 1~5번과 관련하여\n     행정처분일이 ’24. 12. 31일 까지인 경우만 25년 선정사업 지원순위 하향\n\n ○ 지원순위 하향 대상 유형 6번의 경우 전년도 예산계상 신청으로 선정된 사업에\n   대하여 전년도 12. 31.까지 행정처분이 내려진 경우에만 지원순위 하향 적용\n   * (예시) 24년 예산계상 신청으로 25년 사업선정 후 지원순위 하향 대상 유형 6번과 관련하여 보고\n     및 행정처분일이 ’24. 12. 31일까지인 경우만 25년 선정 사업 지원순위 하향"}, {"p": 231, "t": "                              Ⅵ. 장애인거주시설 기능보강 사업\n\n\n4) 지원대상 평가 시 가･감점 고려 항목\n\n○ 장애인거주시설 각종 요구자료 제출 시설 여부(안전점검, 장애인･노인･아동\n  학대 범죄경력 등)\n\n○ 이외에 사업추진간 가･감점 항목이 필요하다고 판단될 경우                          제2장\n\n\n나. 지원 배제 항목\n1) 장애인 거주시설 본래 목적 외 부가적 기능 수행을 위한 예산\n○ 일반 소모성 비품, 일반 사무용 PC, 사무용 집기\n\n\n2) 중요재산 표준 내용연수(당해년도 예산 및 기금운용계획 집행지침)\n\n  ※ 내용연수 미도래 장비라도 평균 사용시간이 초과할 경우 소명자료 제출에 의해 반영가능\n\n\n3) 관련 제법규의 위반 우려가 있는 사업(불법 건축물 등)\n\n\n8 사업 추진 절차\n\n가. 국고보조금 교부신청서 작성 제출\n\n1) 시･도지사는 관내 장애인복지시설 기능보강 사업계획서에 따라 세부사업계획서를\n  작성하여야 함.\n\n2) 사업계획서 필수 내용\n\n (가) 시설 신･증축 및 개･보수 사업\n\n ○ 사업계획서에는 시설 설치장소(신규 시설과 이전 시설 및 전환 시설의 경우\n   시설 부지 확보방안), 시설의 배치도 및 평면도, 건물용도, 건물구조 및 규모"}, {"p": 232, "t": "        (사업량), 소요 비용 및 산출근거, 재원조달방법, 편의시설 설치, 사업별 추진\n        일정 등이 반드시 포함되어야 함\n    * 재원조달방법에 자부담이 있는 경우 자부담 계획서에 포함\n\n    - 사업계획서에 공사기간 동안 시설거주인 보호방안을 반드시 첨부할 것\n\n    - 장애인복지시설의 신축과 이전 시설 등의 부지는 주변환경이 쾌적하고\n        지역사회와의 접근성이 좋은 곳으로 선정할 것\n\n   ○ 건축에 관한 종합적인 설계도서 및 공사비 내역서 등 구체적인 사항은\n     시･도지사 또는 시･군･구청장이 검토(별지 제3호 서식)하되 기술공무원 또는\n     감리원의 설계 검토의견서(별지 제6호 서식)를 첨부 함.\n    * 신축 및 증개축 공사의 국고보조금 교부는 기본설계 완료 후 신청 가능하며, 기타 공사의 국고보조금\n      사업은 실시설계 완료 후 신청하고 보건복지부 제출은 생략할 것\n\n   ○ 시설 신축 등을 위한 보조사업 장소가 법인 및 보조사업자의 소유임을\n        증명할 수 있는 부동산등기부등본 등 관계 증빙서류를 첨부\n    * 임차 등 소유권을 증명할 수 없는 사항은 불가\n      - 신축, 증･개축, 옥외시설물 개보수: 토지 및 건축물 소유권\n      - 건축물 단순 개보수 및 건축물 내부에 설치하는 장비보강: 건축물 소유권\n\n  (나) 장비보강사업\n\n   ○ 장비보강사업계획서는 장비명, 소요량, 사업비 및 사용용도 등이 포함되어야 함.\n        (세부목록은 관할지자체에서 관리하고 보건복지부에 제출 불요)\n\n  (다) 국고보조금 교부신청은 세부사업계획서에 대한 타당성 및 사업수행능력,\n        자부담에 따른 법인의 재원확보방안 등을 검토한 시･도지사 또는 시･군･구청장\n        의견서를 첨부하여 제출\n\n   ○ 국고보조금 교부신청시 자부담이 있는 경우에는 자부담에 따른 재원확보\n        내용을 면밀히 검토･확인하고 국고보조금 교부를 신청\n\n   ○ 자부담은 예산신청 시 부담하기로 한 경우를 제외하고는 의무 사항이\n        아니므로 시설운영자의 자발적인 노력을 유도"}, {"p": 233, "t": "                                  Ⅵ. 장애인거주시설 기능보강 사업\n\n\n3) 국고보조금 교부신청시 제출서류\n\n○ 시･도지사는 장애인복지시설 기능보강사업 국고보조금 교부신청서 점검표(별지\n  제1호 서식)를 작성한 후 하자가 없다고 판단된 경우 국고보조금 교부를 신청\n  * 보건복지부 제출서류：장애인복지시설 기능보강사업 국고보조금 교부신청서(별지 제2호 서식,           제2장\n    별지 제3호 서식, 별지 제4호 서식, 별지 제5호 서식) 설계도면, 기부승락서, 기술직공무원 설계\n    검토의견서\n  * 건축물대장, 법인 및 건물등기부등본, 사업자의 자산･부채에 관한 사항, 자부담 확보에 관한 사항       애\n    등은 시･도지사(또는 시･군･구청장)가 검토하고 보건복지부 제출 생략\n나. 설계 및 공사 집행\n\n1) 시공업체 선정 및 설계 등\n\n (가) 입찰대상이 아닌 시설기능보강사업 조기집행 추진을 위해 사전에 시공업체는\n    공사경험이 많은 업체로 선정\n   * 건설산업기본법 제41조(건설공사 시공자의 제한) 등 참고\n\n\n (나) 시설 신축 및 기능보강사업의 경우 ʻʻ장애인･노인･임산부등의편의 증진보장에\n    관한법률ʼʼ에 따른 장애인편의시설 설치기준, ʻʻ소방시설설치유지및안전관리에\n    관한법률ʼʼ에 따른 소방시설 설치기준, ʻʻ건축법ʼʼ, ʻʻ건축물의 구조기준 등에 관한\n    규칙ʼʼ에 따른 내진등급기준 등이 반영될 수 있도록 설계\n\n (다) 공사 설계 및 시공에 대한 감리를 철저히 하여 부실공사가 되지 않도록 사전예방\n    조치를 강구할 것\n\n\n2) 장비보강사업\n\n○ 신청 장비는 품질 및 내구성 등을 면밀히 검토하여 장애인 복지서비스 제공에\n  적합한 장비를 구입"}, {"p": 234, "t": " 3) 예산 편성 및 집행 등\n\n (가) 단가 책정\n\n  ○ 시설 신축 및 확충분야의 사업규모는 정부지원 예산단가에 의한 사업량으로\n    산출하되 건물의 특성에 따라 책정된 공사비 단가를 적용하기 곤란한 경우\n    시･도지사의 책임하에 단가를 조정･시행\n    * 단, 단가조정은 확정통보된 총 사업비 한도내에서만 조정이 가능(자부담은 해당없음)\n\n (나) 예산 집행\n\n  ○ 총사업비가 2억 미만인 사업에 대하여는 상반기에 예산이 조기집행(100% 이상)\n    될 수 있게 사업계획을 수립하여 예산을 집행하도록 민간보조사업자에게 안내\n\n  ○ 시설기능보강사업에 소요되는 보조사업비는 해당 시･군･구청장이 관리하되\n    사업수행자가 소요비용 청구시 공사의 진척상황에 따라 선급금, 중도금 등을\n    회계관계법의 관련 규정에 따라 지급하여야 함.\n        ※ 사업비의 연도내 집행률 제고 방안\n\n  - 확정통보에 추가로 포함된 신축사업 등에 대한 지방비 추경예산을 1/4분기\n    내에 신속하게 확보\n  - 특히, 건설사업은 연도내 완공을 위해 예비통지시 통보 받은 사업대상자에\n    대해서는 즉시 건축허가(설계착수) 등 공사 선행절차를 적극 지원(연도내\n    집행률 제고)\n        * 사업비의 집행률 제고를 위해서는 건설사업에 대한 공사기간의 연장과 조기착공이 필수적임\n        * 국정감사, 국회 예산결산위원회에서 거주시설 국고보조금의 연도내 집행률이 저조함을 지적하고\n          개선을 요구\n\n  - 지방비 편성 전이라도 국고보조금을 교부 신청하고 설계･착공 등의 절차를\n    진행하여 연내에 집행을 완료할 것\n\n  ○ 시･도(시･군･구)에서는 기능보강사업 집행 시 국고보조금 집행 상황을\n    분기별로 점검(이상이 있을 시 즉각 시정조치) 하고, 분기별 점검내용을 보건\n    복지부에 보고(별지 제9호 서식)"}, {"p": 235, "t": "                                  Ⅵ. 장애인거주시설 기능보강 사업\n\n\n(다) 이월 승인\n\n ○ 기능보강사업은 조기에 착수하여 당해 연도에 완공하여야 하며, 원칙적으로\n   보조금 이월은 허용되지 않음. 다만, 부득이한 경우 보건복지부장관이 승인한\n   경우에만 이월할 수 있음\n    * 지자체의 자체이월 불가, 보건복지부의 이월 미승인 시 사업비 반납 조치\n\n    보조금의 정산\n1. 보조사업자는 보조사업을 완료하였을 때, 폐지의 승인을 받았을 때 또는 회계연도가 끝났을 때에는         시\n  그때로부터 2개월(지자체보조사업의 경우 3개월) 이내에 보조사업실적보고서(보조사업 정산보고서 포함)       설\n\n  제출하여야 하며, 특히 해당 보조금이 1억원 이상인 경우에는 정산보고를 외부 검증기관에서\n  검증받아 제출해야 합니다.\n - 민간에서 작성한 보고서는 기초자치단체에서 검토하며, 기초단체에서 작성한 보고서는 광역자치\n   단체가 검토\n2. 보조사업자의 정산보고서 제출이 일정기간 늦어질 경우 보조금중 일부가 감액되어 교부될 수 있습니다.\n3. 보조사업자는 보조사업 완료 후 집행한 보조금을 정산･반납할 경우 사용잔액 및 이자를 함께 반납\n  하여야 합니다.\n4. 보조사업 수행에 따라 발생한 수익금은 보건복지부와 협의하여 국고 반환 또는 당해 보조사업\n  목적 범위에 맞도록 집행하고 정산보고서에 포함하여 심사를 받아야 합니다.\n5. 다음의 정산잔액은 소정의 절차를 거쳐서 즉시 반납하여야 합니다.\n 가. 이미 교부된 보조금과 이로 인하여 발생한 이자를 더한 금액이 확정된 교부금액을 초과한 경우\n   그 초과액\n 나. 사업비 정산액이 교부 결정한 사업계획서 예산집행계획 보다 감소한 경우 그 감소 차액\n 다. 집행증빙서류가 집행내역과 일치하지 않을 경우에 그 차액\n6. 보조사업자는 보조사업의 수행과 관련된 계산서, 증거서류, 첨부서류 등 사용내역을 증명하는데\n  필요한 서류를 자체규정에 따라 구비하여야 하고, 당해 보조사업 종료연도부터 5년간 이를 보존하여야\n  합니다."}, {"p": 236, "t": "  7. 원칙적으로 보조금의 이월은 허용되지 않으나 부득이한 사유로 이월을 할 경우에도 2회계연도를\n   초과하여 이월할 수 없습니다.\n  8. 보조금으로 취득한 중요재산의 관리\n   가. 교부받은 보조금으로 취득한 중요재산은 사업이 완료된 후에도 재산처분의 제한을 받으며,\n        보조금 정산시 재산 목록을 제출하여야 합니다.\n   나. 교부받은 보조금으로 취득한 중요재산은 관리대장을 비치하고 목적에 맞게 관리하여야 하며,\n        변동현황을 주기적으로 보고해야 합니다.\n   다. 교부받은 보조금으로 취득한 중요재산중 부동산에 관한 소유권이전 등기를 할 때에는 아래\n        사항을 부기등기(附記登記)해야 합니다.\n    1) 해당 부동산은 보조금을 지원받아 취득하였거나 그 효용가치가 증가한 재산이라는 사항\n\n    2) 보조금 교부 목적과 해당 부동산의 내용연수를 고려하여 보건복지부장관이 정한 기간이 지나지\n       아니하였음에도 그 부동산을 보조금의 교부 목적에 위배되는 용도에 사용, 양도, 교환, 대여 및\n       담보로 제공하려는 경우에는 보건복지부장관*의 승인을 받아야 한다는 사항\n        * 보조사업자가 법인인 경우 보조금의 교부 목적에 위배되는 용도에 사용은 보건복지부장관의\n          승인을 받고, 양도, 교환, 대여 및 담보로 제공하려는 경우는 지방비를 부담한 시･도지사의\n          승인을 받아야 함(승인 후 보건복지부 결과보고, ｢행정권한의 위임 및 위탁에 관한 규정｣\n          제36조제1항제5호)\n\n  [별첨] 중요재산 표준 내용연수(근거：2026년 예산 및 기금운용계획 집행지침)\n\n                      구분\n                                                  내용연수\n          분류                    대상\n                   철근콘크리트조 건축물 또는 강구조건축물            50년\n         부동산\n                           그 외의 건축물                 35년\n       고가 동산                    차량                  20년\n     (5천만원 이상)             그 외 기계류 등                15년\n       기타 동산\n                      위 대상에 포함되지 않는 동산        조달청 내용연수 +5년\n     (5천만원 미만)\n\n  * 부동산 중 토지는 내용연수 적용을 받지 아니한다.\n ** 내용연수 기한 내 차량사고 및 화재 등으로 중요재산 소실 시 당해연도 중요재산 가액기준 금액으로 보조금을\n    반납해야 한다."}, {"p": 237, "t": "                                   Ⅵ. 장애인거주시설 기능보강 사업\n\n\n다. 국고보조사업계획 변경 승인\n○ 근거법령：｢보조금 관리에 관한 법률｣ 제23조(보조사업의 내용변경 등)\n\n○ 국고보조사업의 내용을 변경할 경우 사전에 보건복지부장관의 승인을 받아야 함.\n  (장애인복지시설 국고보조사업계획 변경 신청서：별지 제8호 서식)\n○ 시･도지사는 국고보조사업의 변경신청시 변경신청서(별지 제8호) 및 담당\n  공무원의 현장확인 결과(출장보고서 사본)를 첨부하여야 함\n○ 시･도지사는 아래의 사항에 대하여 보조사업자로부터 사업변경 승인신청서를\n  접수하여 설계도서, 공사비내역서 등의 타당성 여부를 면밀히 검토하여 보조\n  사업계획을 변경 승인하고 그 결과를 보고함.\n\n - 보조사업의 목적에 위배되지 않고 당초 보조금을 초과하지 않는 범위 내에\n  서의 설계변경\n - 자체부담 조정에 따른 사업비･사업량의 변경\n - 공기연장(시･군･구 승인 사항)\n - 낙찰차액 활용사업(낙찰차액 및 집행잔액이 총사업비의 13% 이상이고\n  국비보조금 차액(잔액)의 총계가 20백만원 이상인 경우에는 반드시 보건복지부와\n  협의후 사용 할 것)\n * 입찰결과에 따라 차액이 발생할 경우 같은 시설의 소방 및 안전보강 사업에 사용할 수 있음\n\n<보조금 교부결정 권한, 보조금 교부결정 취소 권한, 보조금의 반환 처분 권한>\n\n○ ｢보조금관리에관한법률｣ 제17조(보조금의 교부결정), 제21조(사정변경에의한교부결정의취소등),\n  제30조(법령위반등에의한교부결정의취소), 제31조(보조금의반환)에 의해 보조금의 교부결정, 보조금\n  교부결정의 취소, 보조금의 반환 명령은 중앙관서의장이 하도록 규정되어 있으며, 동 법 제38조(사무의\n  위임)에 의해 중앙관서의 장의 권한을 지방자치단체의장에게 위임할 수 있으나, 사회복지시설을\n  위한 보조금 교부 및 관리 등에 관한 사무에 대해 보건복지부가 지자체장에게 위임한 바는 없음.\n  * 지자체에서 ｢보조금관리에관한법률｣에 따라 보조금의 반환처분 등을 할 경우 개별 사안별로\n    중앙관서장의 승인을 받는 절차 필요\n○ ｢보조금관리에관한법률｣ 제3조(다른법률과의관계등)제1항 및 ｢사회복지사업법｣ 제42조(보조금등)에\n  따라 시･군･구청장은 보조사업자로서 간접보조사업자(법인;시설운영자)에 대해 이미 교부한 보조금의\n  반환 등을 명할 수 있으며, 또한 개별 지자체의 조례 등의 규정에 근거하여 보조금의 반환 명령\n  등을 할 수 있을 것임."}, {"p": 238, "t": "라. 보조금의 반환 및 선정 취소\n\n ○ 보건복지부장관은 다음의 경우 선정을 취소하고 보조금의 반환을 명할 수 있음\n\n  - 보조금을 지급 목적과 다른 용도로 사용한 경우\n\n  - 법령의 규정, 보조금 교부결정의 내용 또는 법령에 의한 보건복지부장관의\n   처분을 위반한 경우\n\n  - 허위신청이나 그 밖에 부정한 방법으로 보조금 교부를 받은 경우\n\n  - 계획된 기일을 경과하고도 정당한 이유없이 사업수행에 착수하지 않거나 사\n   업기한 내에 완료하지 못할 것이 명백하다고 인정되는 등 중대한 사유로 인\n   해 사업을 수행할 수 없는 경우\n\n  - 보고된 사업비 등 사업집행 실적보고가 허위인 경우\n\n  - 심의 승인되지 않은 사업을 임의로 추진한 경우\n\n  - 타 기관 또는 후원 등을 통하여 기 승인된 사업을 완료한 경우\n\n  - 사업계획 전면 변경 등 당초 승인된 사업을 수행하지 못할 경우\n   ※ 단, 천재지변 등 불가피한 사정 및 안전관련 긴급 소요 발생시는 예외로 함\n\n  - 그 밖에 국고지원 목적에 반하는 중대한 사유가 있는 경우\n\n\n마. 사업수행 실적보고\n\n ○ 시･도지사는 거주시설 기능보강사업 추진실적을 매 분기 말일까지 보건복지부\n   장관에게 제출하여야 함(별지 제9호 서식)\n\n ○ 사업수행기관은 회계연도 종료시 실적보고서를 시･군･구에 제출(별지\n   제10-1호 서식)해야 하며, 시･도는 시･군･구의 사업수행기관 실적보고서를 취합･\n   검토하여 매년 보조사업수행 정산 및 실적보고서(별지 제10-2호 서식)를 작성\n   하여 다음 년도 2월말까지 제출하여야 함."}, {"p": 239, "t": "                               Ⅵ. 장애인거주시설 기능보강 사업\n\n\n○ 국고보조금이 1억원 이상인 보조사업에 대한 실적보고서를 제출하는 경우\n  검증기관으로부터 정산보고서를 검증받아 정산보고서와 함께 제출하여야 함\n  (｢보조금 관리에 관한 법률｣ 제27조)\n  * 검증기관의 정산보고서 검증방법에 대하여는 ‘보조사업 정산보고서 검증지침’(기획재정부 공고\n    제2017-186호)를 적용하며, 기타 자세한 사항은 관련 법령 및 규정 참고             제2장\n\n\n9 중요재산 관리\n가. 중요재산\n\n\n1) 부동산과 그 종물\n\n○ 국고보조금으로 신축하여 새로 취득한 경우\n\n○ 국고보조금으로 증축하여 기존건물의 규모가 확대되고 효용이 증가한 경우\n\n○ 국고보조금으로 건물을 개보수하여 그 효용이 증가한 경우(단순 개보수 공사\n  (도배, 장판･마루)는 등록 제외)\n\n2) 그 밖의 국고보조금으로 구입한 단가 5백만원 이상인 장비, 물품\n  ※ 법인이 중요재산을 처분함에 있어서 그 중요재산이 기본재산에 해당하는 경우에는 ｢사회복지\n    사업법｣ 제23조 제3항에 규정된 기본재산 처분 승인뿐 아니라 ｢보조금 관리에 관한 법률｣\n    제35조의 중요재산 처분 승인도 모두 받아야 함(대판 2015다223350)\n\n\n나. 보고 및 공시(신설)\n\n1) 보조사업자 등의 중요재산 보고는 ｢보조금법｣ 제35조제1항과 ｢보조금법 시행령｣\n  제15조제1항 및 제2항에 따르며 별지 제3호서식 ‘중요재산 현황’을 작성\n\n2) 중요재산 취득 후 15일 이내에 해당 중앙관서의 장 또는 지방자치단체의 장에게 보고"}, {"p": 240, "t": "다. 중요재산의 취득가액 등 기준\n\n 1) 기능보강사업의 국고보조금과 지방비를 포함한 총액기준으로 하되, 완료 정산된 금액\n\n 2) 기능보강사업이 완료되어 이미 등록된 중요재산은 감정평가액이 있을 경우 그 감정평가\n   액의 증감액\n\n라. 중요재산 부기등기\n\n 1) 사업수행기관(법인 포함)은 중요재산 중 부동산에 관한 소유권 등기를 할 때에는\n   해당 부동산이 보조금을 지원받아 취득하였다는 사항 등을 표기하는 부기등기(附記登記)를\n   아래와 같이 해야 하며, 보조금이 지원된 부동산 증명서를 관할 등기소에 제출하여야\n   함(보조금법 제35조의2, 보건복지부소관 국고보조금 관리규정 제31조)\n\n ○ 해당 부동산은 보조금을 지원받아 취득하였거나 그 효용가치가 증가한 재산\n   이라는 사항\n\n ○ 보조금 교부 목적과 해당 부동산의 내용연수를 고려하여 중앙관서의 장이 정한\n   기간이 지나지 아니하였음에도 그 부동산을 보조금의 교부 목적에 위배되는\n   용도에 사용, 양도, 교환, 대여 및 담보로 제공하려는 경우에는 보건복지부\n   장관의 승인을 받아야 한다는 사항\n   ※ 매각은 양도의 의미에 포함됨\n   ※ 보조사업자가 법인인 경우 보조금의 교부 목적에 위배되는 용도에 사용은 보건복지부장관의\n     승인을 받고, 양도, 교환, 대여 및 담보로 제공하려는 경우는 지방비를 부담한 시･도지사의 승인을\n     받아야 함(승인 후 보건복지부에 결과 보고)\n\n 2) 위의 의무를 위반한 경우 보조금 교부결정 취소 등의 시정조치를 할 수 있음"}, {"p": 241, "t": "                          Ⅵ. 장애인거주시설 기능보강 사업\n\n\n10 행정사항\n\n○ 시･도지사는 관내 시설에 대한 사업 계획의 조정･검토, 공사 집행, 사후관리\n 등 사업전반에 대하여 관련 국･과장의 책임 하에 지도･관리 업무를 수행하도록\n 하고 장애인복지시설의 기능보강에 만전을 기하도록 함.                         제2장\n\n○ 시･도지사는 장애인복지시설의 신축사업을 수행할 사업수행자에 대한 사업의\n 타당성을 충분히 검토하여 준공과 동시에 시설 설치허가를 받도록 함.\n○ 보조사업이 완료된 경우(공사 준공, 장비 구입)에 건물이나 장비의 활용을 통한           거\n 장애인복지시설의 원활한 기능수행이 이루어질 수 있도록 사전에 사업운영계획을              시\n 검토･수립하여야 함.\n\n○ 시･도지사는 보조사업을 완료한 때에는 보조사업이 당초 목적에 부합되고\n 효과적으로 수행되었는지를 검토 후 보조사업 실적 보고서를 제출\n\n○ 시･도지사는 시설 신축부지 확보 등 제반 사정으로 인하여 국고보조금 교부\n 신청이 기일 내에 제출되지 못하여 사업이 지연되거나 이월되는 사례가 없도록\n 지도･감독을 철저히 하여야 함.\n\n○ 예산계상신청 시 또는 예비통지 전까지 관할 지자체는 신청법인이 동일사업에\n 대해 보건복지부 외 타 기관(사회복지공동모금회 등)등을 통해 중복지원\n 되는지를 면밀히 검토하고\n - 중복 신청건이 발견될 경우 즉시 당해사항을 보건복지부로 통보하고 해당\n  신청사업의 계상신청을 제외\n\n○ 지진 등 자연재해 등에 대한 예방이 강조됨에 따라 신축, 증개축의 경우\n “건축법”, “건축물의 구조기준 등에 관한 규칙”에 따른 내진등급기준이 반드시\n 반영되도록 설계할 것\n\n○ 개별시설의 소규모화는 지역내의 시설서비스 수요･공급 범위, 복지서비스 욕구\n 변화를 감안하여 연차별･장기적 계획을 수립하여 지원 함\n - 시설 소규모화를 자산대체 방식으로 추진할 경우 시･도지사는 법인 기본재산\n  처분허가를 적극적으로 지원 함."}, {"p": 242, "t": "[별지 제1호 서식] 기관 및 법인 공통\n\n     장애인 거주시설 기능보강사업 국고보조금 교부신청서 점검표\n 시설명：                 사업명：                   점검일：20 .        .    .\n 구   분     수 행 자           구 비 서 류              점 검 내 용           점 검 결 과\n 예   산     시･도지사      ◦국고보조금                ◦국비              적정   ᷺ 부적정     ᷺\n                                            ◦지방비             적정   ᷺ 부적정     ᷺\n                                            ◦자부담             적정   ᷺ 부적정     ᷺\n 공   통     시･도지사    ◦국고보조금교부신청서             ◦유무              유    ᷺   무     ᷺\n                                            ◦보조사업기간          적정   ᷺ 부적정     ᷺\n
