      기본급의 120%\n  휴가비                                         (또는 설과 추석 전 15일 이내에\n          병가휴직 등\n                                                 시설의 장이 정한 날)\n         장기휴직 제외)\n\n\n                    - 배우자 : 월 40,000원\n                    - 배우자 및 자녀를 제외한 부양\n                     가족(직계존속･비속 등) : 1명당 월      매월 급여 지급일에 지급\n         부양가족이 있는\n 가족수당                20,000원                  (이외 세부기준은 공무원 보수 등의\n           종사자\n                    - 자녀 : 첫째 월 50,000원,           업무지침 준용)\n                     둘째 월 80,000원, 셋째 이후 자녀\n                     월 120,000원\n\n\n                    - (연장근로) 통상임금의 50% 이상\n                     가산\n                    - (야간근로) 통상임금의 50%이상\n         규정된 근무시간   가산\n                                                시간외근무를 한 다음달\n  시간외    외 연장･야간･ - (8시간 이내 휴일근로) 통상임금의\n                                                    보수 지급일\n 근무수당    휴일 근로를 한   50% 이상 가산\n                                                (단, 12월은 당월에 지급)\n           종사자    - (8시간 초과 휴일근로) 통상임금의\n                     100% 이상 가산\n                    * 연장･휴일 및 야간근로 시간당 월\n                      통상임금의 1/209 기준으로 산정"}, {"p": 557, "t": "                               Ⅰ. 장애인 자립생활지원시설 운영\n\n\n○ 운영비 지원 기준\n\n - 23,600천원/연간\n\n○ 유의사항\n\n - 국고보조금 지원 대상으로 선정된 기관에서 장애인 대상 범죄 발생･학대,\n  성폭력･성희롱 사건이 발생하여 장애인권익옹호기관으로부터 학대판정, 수사\n  기관의 수사 등으로 사회적으로 문제가 된 시설 또는 이를 은폐한 시설에\n  대해 보조금 지원 중단 및 차년도 지원 선정 대상 배제 등의 조치를 할 수\n  있음\n\n - 보조금 지원 중단 처분을 받은 시설은 이용 장애인의 전원조사 및 서비스\n  지원계획 조치를 선 시행하여야 함\n\n\n5 그 밖에 운영에 관한 사항\n\n가. 운영규정 제정 및 장부의 비치 (「장애인복지법 시행규칙」 별표5)\n\n○ 시설장은 조직, 인사, 급여, 회계, 물품 및 그 밖에 운영에 필요한 규정을 두고\n  이에 따라 시설을 운영하여야 함\n\n○ 장부의 비치\n\n    구분     관리에 관한 장부            재무ㆍ회계에 관한 장부\n                         - 총계정원장 및 수입･지출보조부\n         - 직원 관계철        - 금전･물품의 출납부 및 그 증명 서류\n         - 회의록철          - 예산서 및 결산서\n    종류   - 사업일지          - 재산대장ㆍ재산목록과 그 소유권에 관한 증명 서류        인\n         - 문서 접수･발송 대장   - 비품관리대장\n         - 차량운행일지        - 후원금관리대장\n                         - 각종 증명서류와 그 밖에 필요한 서류              시"}, {"p": 558, "t": "나. 업무의 전자화 (「사회복지사업법」 제6조의2)\n\n ○ 사회서비스정보시스템(희망이음), 사회복지시설정보시스템을 활용하여 보조금\n   지급신청･지급･정산 등 회계업무, 종사자 인사업무, 후원금(품) 수입･사용보고\n   등을 수행하여야 함\n\n ○ 사회복지시설 종사자 대상 사회서비스정보시스템(희망이음) 관련 교육\n  - 시설이 사회서비스정보시스템(희망이음)의 사용 미숙으로 인해 업무상 과실을\n   범하지 않도록 시스템 사용자 교육에 적극 참여하여야 함\n   ※ 교육일정 등 상세정보는 한국사회보장정보원 교육홈페이지(http：//edu.ssis.or.kr) 참조\n\n\n다. 운영위원회 구성･운영 (「사회복지사업법」 제36조 및 「동법 시행규칙」 제24조)\n\n ○ 위원은 위원장 1인을 포함하여 5인 이상 15인 이하의 위원으로 구성\n  - 위원회의 위원은 다음에 해당하는 자 중에서 관할 시･군･구청장이 임명 또는\n   위촉(단, 각 부분별 인원은 2인을 초과할 수 없음)\n   ･ 시설의 장\n   ･ 시설 이용자의 대표\n   ･ 시설 이용자의 보호자 대표\n   ･ 시설 종사자의 대표\n   ･ 해당 시･군･구 소속의 사회복지업무를 담당하는 공무원\n   ･ 후원자 대표 또는 지역주민\n   ･ 공익단체에서 추천한 사람\n   ･ 그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이\n    풍부한 자\n    ※ ① 시설장의 친인척, ② 설치･운영자인 법인의 임원 등 특수관계가 명확한 자(시설장 제외)는\n      위원으로 임명･위촉하지 않도록 할 것\n    ※ ｢지방자치법｣ 제43조제5항에 따라 지방의회의원은 지방자치단체로부터 운영비 등을 보조받는\n      사회복지사업을 하는 자가 설치･운영하는 사회복지시설의 운영위원회 위원이 될 수 없음에 유의할\n      것(법제처 해석, 17-0433)"}, {"p": 559, "t": "                               Ⅰ. 장애인 자립생활지원시설 운영\n\n\n - 위원장은 호선, 위원의 임기는 3년으로 하되 연임할 수 있고 보궐위원의\n   임기는 전임자의 잔임 기간으로 함\n\n라. 시설 안전관리 (「사회복지사업법」 제34조3)\n\n○ 보험 가입\n\n - 화재 및 안전사고로 인한 손해배상책임의 이행을 위해 책임보험 또는 책임\n   공제에 가입하여야 함\n\n○ 시설 안전점검 실시\n\n - 정기 안전점검 : 시설장은 매 반기 시설에 대해 정기안전점검을 실시하고\n   그 결과를 시장･군수･구청장에게 제출하여야 함\n\n - 수시 안전점검 : 시설장은 정기안전점검 결과 해당시설의 구조･설비의 안전도가\n   취약하여 위해의 우려가 있는 때에는 안전점검기관에 수시안전점검을 의뢰\n   하여 그 결과를 시장･군수･구청장에 제출하여야 함\n\n - 시장･군수･구청장은 안전에 필요한 경우 시설의 운영자로 하여금 시설의 보완\n   또는 개보수를 요구할 수 있음(요구를 받은 시설운영자는 이에 응해야 함)\n\n○ 지자체 안전점검\n\n - 시･도 및 시･군･구에서는 하･동절기(5월 및 11월) 등 취약시기에 보건복지부\n   에서 통보하는 안전점검 계획에 따라 종사자 대상 교육훈련 및 안전점검표에\n   따른 현지점검 실시 후 그 결과를 보건복지부에 보고                             제7장\n\n - 시설안전점검 실시 후 결과보고는 시스템을 통해 온라인으로 보고\n  ･ 사회복지시설은 사회서비스정보시스템(희망이음)으로 지자체에 보고하며,\n    지자체는 행복이음 시스템 안전점검 메뉴를 통해 결과 보고 및 안전점검\n    이력관리 수행"}, {"p": 560, "t": " 6 기타 행정 사항\n\n가. 운영 실적 보고\n\n ○ 시설장은 운영 실적을 시･군･구청장에게 매반기말 익월 10일까지 보고하여야 함\n\n ○ 시･군･구청장은 보고실적을 종합하여 매반기말 익월 20일까지 시･도지사에게\n   보고하여야 함\n\n ○ 시･도지사는 운영실적보고서를 상반기 실적은 7월 31일까지, 상･하반기\n   실적은 차년도 1월 31일까지 보건복지부장관에게 제출하여야 함"}]}]}, {"no": 8, "title": "부록", "start": 561, "end": 663, "sections": [{"title": "Ⅰ. 장애인거주시설 서비스 최저기준", "start": 563, "end": 584, "subs": [], "pages": [{"p": 563, "t": "                                      Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n     Ⅰ     장애인거주시설 서비스 최저기준\n\n\n 1   추진배경\n\n 장애인복지법 제60조의3(장애인거주시설의 서비스 최저기준)규정이 신설됨에\n 따라 ｢장애인거주시설 서비스 최저 기준｣을 마련･시행함\n\n\n 2 개요 및 영역\n\n 1. 서비스 안내 및 상담                      6. 개별지원\n ￭ 기준 1：서비스 이용자 안내                   ￭ 기준 21：개별지원\n ￭ 기준 2：이용 상담                        ￭ 기준 22：건강관리\n ￭ 기준 3：욕구와 서비스의 적합성 검토              ￭ 기준 23：약물관리\n ￭ 기준 4：예비방문                         ￭ 기준 24：노화와 사망\n ￭ 기준 5：서비스 결정, 서비스 제공 조건 및 퇴소\n                                     7. 환경\n 2. 개인의 욕구와 선택\n                                     ￭ 기준 25：시설과 설비\n ￭ 기준 6：욕구사정                         ￭ 기준 26：개인침실; 공간요구\n ￭ 기준 7：개별 서비스 이용계획                  ￭ 기준 27：개인침실; 가구와 시설물\n                                     ￭ 기준 28：화장실과 욕실\n 3. 이용자의 참여와 권리                      ￭ 기준 29：공용 공간\n                                     ￭ 기준 30：보조기구와 설비\n ￭ 기준 8：의사결정                         ￭ 기준 31：위생과 감염 예방\n ￭ 기준 9：참여\n ￭ 기준 10：위험관리                        8. 직원관리\n ￭ 기준 11：비밀보장\n ￭ 기준 12：학대 등으로부터의 보호                ￭ 기준 32：역할\n ￭ 기준 13：이의제기                        ￭ 기준 33：자격과 자질\n                                     ￭ 기준 34：직원구성\n 4. 능력개발                             ￭ 기준 35：훈련과 개발\n                                     ￭ 기준 36：지도감독과지지\n ￭ 기준 14：개인적인 발전\n ￭ 기준 15：교육과 직업                      9. 시설운영\n ￭ 기준 16：지역사회연계와 네트워크\n                                     ￭ 기준 37：질 관리\n 5. 일상생활                             ￭ 기준 38：정책과 절차\n                                     ￭ 기준 39：기록유지\n ￭ 기준 17：여가                          ￭ 기준 40：안전의 실천                  제8장\n ￭ 기준 18：관계\n ￭ 기준 19：사생활\n ￭ 기준 20：식사\n* 핵심영역：개인의 욕구와 선택, 이용자의 참여와 권리, 환경\n* 기본영역：능력개발, 일상생활, 개별지원\n* 일반영역：서비스안내 및 상담, 직원관리, 시설운영"}, {"p": 564, "t": "  영역 1：서비스 안내 및 상담\n\n\n기준 1. 서비스 이용자 안내\n\n 원칙：(예비) 이용자는 시설의 선택과 관련된 필요한 정보를 적절한 방법으로 제공받는다.\n\n 1.1 시설은 다음의 내용을 포함한 서비스 이용자를 위한 시설 안내서를 제작･\n    배포하여야 한다.\n\n        - 시설운영의 목적\n\n        - 지원내용과 시설 설명\n\n        - 주거 공간과 공용 공간\n\n        - 입소 정원\n\n        - 서비스 제공 대상\n\n        - 시설장(시설책임자)과 직원의 자격증과 경력\n\n        - 입소, 거주기간, 서비스 제공 조건\n\n        - 입･퇴소 절차\n\n        - 이용자 권리에 관한 설명\n\n        - 개인부담 요금 및 서비스 범위와 추가서비스 비용\n\n        - 이용자조사를 통해 확보한 시설에 대한 이용자의 견해\n\n        - 이의제기 절차 및 불만이 있을 때 연락할 수 있는 관할 관청의 연락처와\n         연락방법\n\n 1.2 시설은 운영목적, 목표, 철학, 서비스와 시설, 서비스제공 조건 등에 대한\n    최신 정보에 근거하여 시설운영목적 문서를 작성하여야 한다."}, {"p": 565, "t": "                           Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n기준 2. 이용 상담\n\n원칙：시설은 예비 이용자와 상담을 진행함에 있어, 적절한 서비스 제공에 필요한 다양한\n   정보를 수집한다.\n\n2.1 시설은 이용 여부를 결정하기 전에 예비 이용자 및 가족을 통해 다음과 같은\n   내용을 포함한 기본 정보를 수집하여야 한다.\n\n    - 기본적인 인적 사항\n\n    - 의사소통방법\n\n    - 필요한 일상생활 지원내용과 숙소의 형태\n\n    - 필요한 교육, 훈련과 거주기간\n\n    - 가족을 포함한 사회적 관계망\n\n    - 위험요소\n\n    - 소득\n\n    - 장애관련 필요장비\n\n    - 신체적, 정신적 보건 케어\n\n    - 필요한 치료와 재활 프로그램 등\n\n\n기준 3. 욕구와 서비스의 적합성 검토\n\n원칙：시설은 제공하는 서비스가 예비 이용자의 욕구를 충족시킬 수 있는지를 제시할\n   수 있어야 하며, 정당한 이유 없이 서비스 제공을 거절할 수 없다.\n\n3.1 시설은 이용자의 사정된 욕구(특별한 욕구 포함)를 충족시키는데 적합한\n   서비스의 제공가능 여부(제공하는 전문적 서비스의 종류, 돌봄을 제공할 수\n   있는 기술과 경험, 이용자와의 의사소통 기술 등)를 제시할 수 있어야 한다.             부"}, {"p": 566, "t": " 3.2 시설이 서비스 제공을 거절할 때는 문서를 통하여 합당한 설명을 제공해야\n    한다. 단, 이 설명에는 당해 시설에서 서비스를 제공할 경우 예비 이용자와\n    기존 이용자에게 이익이 되지 않는다는 점이 포함되어야 한다.\n\n 3.3 시설은 예비 이용자의 입소를 검토할 때 다른 이용자와의 적합성 여부를\n    고려하여야 한다.\n\n 3.4 시설은 개인의 특별한 취향, 사회적･문화적･종교적 욕구를 고려해야 한다.\n\n\n기준 4. 예비 방문\n\n 원칙：예비 이용자는 본인이 거주를 희망하는 시설에서 제공하는 서비스가 본인의 욕구\n    충족에 적합한지를 확인하기 위해 예비 방문의 기회를 갖는다.\n\n 4.1 시설은 반나절(또는 하룻밤) 동안 예비방문 서비스를 제공하고, 예비이용자\n    에게 다음의 기회를 제공해야 한다.\n\n        - 현 이용자와의 만남\n\n        - 직원과의 만남\n\n        - 식사해 보기\n\n        - 이용자가 살게 될 방, 공용장소, 마당 등 둘러보기\n\n        - 시설이 개인의 요구사항을 어떻게 충족시킬 수 있는지에 대한 논의\n\n        - 이용자에 대한 여러 종류의 보관 기록 살펴보기"}, {"p": 567, "t": "                          Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n기준 5. 서비스 결정, 서비스 제공 조건 및 이용 중단\n\n원칙：시설은 서비스 제공 조건을 문서화 하여 이용자에게 제공해야 한다.\n\n5.1 문서에는 다음과 같은 내용이 포함되어야 한다.\n   - 전문적서비스를 포함한 개별지원, 공급되는 시설과 서비스, 개인의\n     자율을 제한하게 될 정책과 규칙들\n   - 이용자가 부담해야 할 청구비용, 이용료에 포함되어 있지 않은 시설\n     또는 서비스 비용\n   - 이용자의 권리와 책임\n   - 시설 외부에서 제공될 서비스\n\n5.2 본인 또는 보호자에게 서명이 포함된 계약서 1부를 제공하여야 한다.\n\n5.3 서비스 이용 중단은 체계적인 절차에 따라 실행되어야 한다.\n   - 이용 중단을 앞둔 이용자와의 이용중단 상담 실시\n   - 이용 중단 준비 지원\n\n\n 영역 2：개인의 욕구와 선택\n\n\n기준 6. 욕구사정\n\n원칙：이용자의 개인적인 희망과 욕구가 사정되고, 욕구는 정기적으로 점검해야 한다.\n\n6.1 개별 서비스 이용 계획 수립을 위한 욕구사정에서는 다음과 같은 정보들이\n   확인되어야 한다.                                            제8장\n\n   - 관련 병력\n   - 관련 심리적 정보"}, {"p": 568, "t": "        - 관련 사회적 정보\n\n        - 이전에 제공받은 직접서비스 및 보호 관련 정보\n\n        - 필요시 관련전문가에게 이용자에 관한 평가 요청\n\n 6.2 욕구사정의 내용은 다음과 같은 정보들을 토대로 주기적(12개월 이내)으로\n    점검되어야 한다.\n\n        - 강점, 능력, 욕구, 선호도 등의 변화\n\n        - 서비스 목표의 변화\n\n        - 관련 전문분야로부터 입수된 새로운 정보\n\n        - 기타 이용자로부터 확인된 정보\n\n 6.3 욕구의 사정과 점검은 시설장(시설책임자)의 책임하에 이루어져야 한다.\n\n\n기준 7. 개별 서비스 이용 계획\n\n 원칙：이용자의 사정된 욕구를 바탕으로 개별 서비스 이용 계획을 수립하고, 이 계획은\n     욕구의 변화에 따라 정기적으로 점검한다.\n\n 7.1 개별 서비스 이용 계획에는 시설에서 제공하게 될 치료와 재활, 서비스와\n    설비 등에 대한 다음의 설명들이 포함되어야 한다.\n\n        - 사정결과로부터 도출된 계획\n\n        - 필요한 경우 선택과 자유에 대한 제한에 대한 설명\n\n        - 공격적이거나 남을 해하거나 자해할 성향이 높은 이용자를 위한 개별화된\n         조치사항 및 절차 확립\n\n        - 지역사회참여와 관련된 내용 등\n\n 7.2 가족, 친구, 권익옹호자, 관련 시설, 관련 전문가 등과 함께 이용자의 참여를\n    통해 만든다."}, {"p": 569, "t": "                         Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n   - 이용자가 이해할 수 있는 언어와 형식으로 만듦\n\n7.3 개별 서비스 이용 계획은 다음과 같은 정보들을 토대로 주기적(12개월\n   이내)으로 점검되어야 한다.\n\n   - 강점, 능력, 욕구, 선호도 등의 변화\n\n   - 서비스 목표의 변화\n\n   - 관련 전문분야로부터 입수된 새로운 정보\n\n   - 기타 이용자로부터 확인된 정보\n\n7.4 개별 서비스 이용 계획 수립과 점검은 시설장(시설책임자)의 책임하에\n   이루어져야 한다.\n\n\n 영역 3：이용자의 참여와 권리\n\n\n기준 8. 의사결정\n\n원칙：이용자는 필요한 지원을 받으면서 의사결정과정에 참여하고, 자신의 삶에 대해\n   결정한다.\n\n8.1 시설과 직원은 다음과 같은 원칙에 입각하여 이용자의 자기결정 권리를\n   존중해야 한다.\n\n   - 이용자의 권리는 이용자가 참여한 사정에 근거한 개별 서비스 계획에\n     기록된 것에 한해서만 제한될 수 있음\n\n   - 이용자가 자신의 삶을 스스로 결정하는데 필요한 정보와 의사소통                제8장\n     지원 제공\n   - 이용자는 스스로 자신의 재정을 관리하며, 직원은 지원이 필요한 경우\n     그 이유와 방법에 대해 관찰･기록해야 함"}, {"p": 570, "t": "        - 스스로 결정하고 재정을 관리하기 어려운 장애인은 적정한 지원방법을\n         강구해야하며 이 경우에도 장애인이 스스로 할 수 있도록 최대한 기회를\n         보장해야 함\n\n 8.2 시설은 다음의 내용과 관련된 의사결정과정에 이용자나 그 가족 또는 법정\n    대리인의 참여를 보장해야 한다.\n\n        - 서비스의 목표\n\n        - 확인된 욕구를 충족시키기 위한 서비스 구조화 방법\n\n        - 서비스 전달방법\n\n        - 예상되는 서비스의 지속기간\n\n        - 결과에 대한 평가 방법\n\n        - 미래에 대한 계획\n\n\n기준 9. 참여\n\n 원칙：이용자는 자신의 삶과 관련된 사안에 대한 논의과정에 참여한다.\n\n 9.1 이용자는 시설생활에서 그들에게 영향을 미칠 수 있는 다음과 같은 주요\n    결정에 참여할 기회를 가져야 한다.\n\n        - 이용자 만족도 조사에 참여\n\n        - 시설 서비스와 관련된 개별 또는 집단 토론에 참여\n\n        - 서비스 이용 계획의 수립에 있어서 목표설정부터 종결까지의 서비스 전\n         과정에 참여"}, {"p": 571, "t": "                         Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n기준 10. 위험관리\n\n원칙：이용자는 자립생활 과정에서 경험할 수 있는 위험에 대한 훈련을 받고, 위험\n   가능성을 이유로 일상생활에 대한 부적절한 제한을 받지 않는다.\n\n10.1 시설은 인지된 위험을 최소화하는 조치를 취해야 하며, 이용자가 자신의\n    안전에 대해 훈련할 수 있는 기회를 제공해야 한다.\n\n10.2 시설은 이용자가 일상생활에서 경험할 수 있는 위험을 이유로 다음과 같은\n    요소들에 대한 접근을 무조건 금지해서는 안 된다.\n\n    - 칼, 가스레인지 등 각종 생활장비 사용\n\n    - 휠체어 사용으로 발생하는 위험\n\n    - 화기 등의 사용\n\n    - 이성과의 접촉\n\n    - 기타 일상생활과 밀접히 관련된 위험\n\n10.3 예상되는 위험은 이용상담 과정에서 확인되어야 하며, 위험관리 방안 및\n    제한은 이용자의 참여하에 개별계획에 기록되고 점검되어야 한다.\n\n\n기준 11. 비밀보장\n\n원칙：이용자와 관련된 정보는 적절하게 관리되고, 비밀이 보장되어야 한다.\n\n11.1 이용자 정보는 문서화된 시설 정책과 절차에 따라 관리되고, 비밀이 보장\n    되어야 한다.\n\n11.2 다른 시설과 이용자 정보를 주고받을 때는 비밀보장의 원칙을 문서로              제8장\n\n    공유하여야 한다."}, {"p": 572, "t": "기준 12. 학대 등으로부터의 보호\n\n 원칙：이용자는 학대와 방임 등 모든 형태의 비인간적인 대우를 받지 않는다.\n\n 12.1 시설은 의도적 혹은 무지로 인해 발생할 수 있는 이용자에 대한 신체적,\n        재정적, 물질적, 심리적, 성적 학대나 방임, 자해, 비인간적이고 비하하는\n        대우 등으로 부터 안전할 수 있도록 예방 및 보호를 보장해야 한다.\n 12.2 신체적 공격에 대한 개입(제지)은, 이용자의 권리와 관심사를 보호하면서\n        최후의 수단으로 사용되어야 한다.\n\n\n기준 13. 이의제기\n\n 원칙：이용자는 표준화된 절차에 의해 불만이나 이의를 제기할 수 있으며, 제기된 불만이나\n    이의에 대해서는 적절한 응답을 받는다.\n\n 13.1 시설은 단계별 절차와 일정 등이 포함된 명백하고 효과적인 이의제기\n        절차를 보장하고, 이용자가 어떻게, 누구에게 불만을 호소할 수 있는지 알\n        수 있게 해야 한다.\n\n 13.2 시설은 이용자가 제기한 모든 불만에 대해서 15일 이내에 응답해야 한다.\n\n 13.3 이용자에 의해 제기된 모든 이슈들, 조사, 취해진 조치는 자세히 기록\n        되어야 한다.\n\n 13.4 시설은 이용자가 효과적으로 이의제기를 할 수 있도록 지원 및 훈련을\n        제공해야 한다."}, {"p": 573, "t": "                          Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n 영역 4：능력개발\n\n\n기준 14. 개인적인 발전\n\n원칙：이용자는 개인적인 발전의 기회를 갖는다.\n\n14.1 시설은 이용자가 사회･정서적 의사소통기술을 유지･개발할 수 있도록\n    기회를 제공하여야 한다.\n\n14.2 시설은 개별서비스 이용 계획에 따라 이용자가 자립생활기술을 유지･\n    개발할 수 있도록 다음과 같은 내용의 기회를 제공해야 한다.\n    - 스스로 일상생활을 할 수 있는 프로그램 진행\n\n    - 시설 내에 예비 공동생활가정(pre-group home)이나 자립지원가정\n     모형과 같이 자립생활을 지원할 수 있는 환경 마련\n\n    - 지역사회 내에 전환형 가정 또는 자립 체험홈 등의 운영\n\n    - 적금 등 금융관련 자산관리 지도\n\n14.3 지역사회 내의 관련 서비스 자원을 활용해야 한다.\n\n\n기준 15. 교육과 직업\n\n원칙：이용자는 생애주기와 개별 서비스 이용 계획에 따라 적절한 교육 및 취업 기회를\n   제공받을 수 있다.\n\n15.1 시설은 이용자의 생애주기를 고려하여 평생교육, 원격교육, 직업훈련 등에\n    대한 기회를 제공하여야 하며, 필요시 문자훈련, 숫자계산훈련 등을 받을\n    수 있도록 해야 한다.\n\n15.2 시설은 이용자에게 다음과 같은 체계적인 진로지원서비스를 제공해야 한다.             부\n\n    - 이용자의 직업적 흥미와 진로에 대한 상담 및 평가"}, {"p": 574, "t": "        - 진로선택에 필요한 자료나 정보 제공\n\n        - 진로와 관련된 전문기관 및 시설과 연계한 진로지원\n\n\n기준 16. 지역사회연계와 네트워크\n\n 원칙：이용자는 지역사회 구성원으로 활동하는데 필요한 지원을 받는다.\n\n 16.1 시설은 이용자가 지역사회 삶에 통합될 수 있도록 다음과 같은 서비스를\n        제공해야 한다.\n\n        - 지역사회 서비스와 시설 이용, 지역사회 활동에 필요한 지식 제공\n        - 이용 가능한 지역 활동, 전문가 조직에서 제공되는 지원 자원에 대한\n         정보와 조언\n\n        - 투표활동에 대한 지원\n\n        - 지역의 대중교통, 장애인용 콜택시, 특별 장애인교통수단 등의 교통수단\n         이용에 대한 지원\n\n        - 이용자가 선택한 삶의 양식과 활동을 추구할 수 있도록 하는 지원\n\n        - 지역사회와의 친근한 관계 유지를 위한 지원\n\n\n  영역 5：일상생활\n\n\n기준 17. 여가\n\n 원칙：이용자는 자신이 원하는 적절한 여가활동을 한다.\n\n 17.1 시설은 이용자가 시설의 내･외부에서 적절한 여가활동에 접근하고 선택할\n        수 있도록 해야 한다."}, {"p": 575, "t": "                           Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n17.2 시설은 이용자가 자신의 관심과 취미를 추구하도록 지원, 장려하여야 한다.\n\n17.3 시설은 이용자가 시설 외부에서 여행의 기회를 가질 수 있도록 노력하여야 한다.\n\n\n기준 18. 관계\n\n원칙：이용자는 적절한 가족 및 사적 관계 등을 유지하기 위한 지원을 받는다.\n\n18.1 시설은 이용자가 가족 관계, 시설 내･외부에서의 친구 관계를 유지할 수\n    있도록 지원해야 한다.\n18.2 이용자는 전화 및 통신수단을 자유롭게 이용할 수 있다.\n\n18.3 이용자는 방문자와 이용자의 방 또는 사적 공간에서 만날 수 있어야 한다.\n\n18.4 시설과 직원은 이용자의 의사소통기술과 대인관계형성기술 향상을 위한\n    훈련을 실시해야 한다.\n\n\n기준 19. 사생활\n\n원칙：모든 일상생활에서 이용자는 권리를 존중받고, 책임을 다한다.\n\n19.1 일상생활과 시설의 규칙은 이용자의 자립, 개인적 선택과 자유를 증진\n    시키는 것을 목적으로 해야 한다. 사생활의 제한은 개별 계획과 계약에서\n    동의한 내용에 한한다.\n\n19.2 이용자는 침실 또는 욕실의 내부와 외부에서 잠글 수 있는 열쇠(또는 잠금\n    장치)를 제공 받을 수 있다.\n\n19.3 이용자는 다음과 같은 일상생활의 자유로운 선택을 할 수 있다.\n    - 신문･잡지의 구독이나 텔레비전의 자유로운 사용\n\n    - 기호품(술, 담배 등)에 대해서는 건강상의 영향 등에 유의하면서 기본적으로           부\n\n     개인의 자유 인정"}, {"p": 576, "t": " 19.4 이용자의 가사일 임무(요리, 방과 공동장소 청소, 세탁, 정원 유지 등)에\n        대한 책임은 이용자 안내와 개별 서비스 계획서에 상세히 기술해야 한다.\n\n\n기준 20. 식사\n\n 원칙：이용자는 건강한 식사를 제공받아야 한다.\n\n 20.1 시설은 쾌적한 세팅과 융통성 있는 시간에 영양가 있는 다양하고, 균형 잡힌\n        식사를 보장함으로써 이용자의 건강과 복지를 증진시킨다.\n 20.2 이용자는 식단 결정에 참여할 수 있고, 그들의 다이어트와 문화적 욕구,\n        개인적 선호를 존중받는다.\n\n 20.3 시설은 이용자에게 필요한 영양을 사정하고, 정기적인 저체중, 비만,\n        섭식장애 등의 위험요소를 검토해야 한다.\n\n\n  영역 6：개별지원\n\n\n기준 21. 개별지원\n 원칙：이용자는 자신이 원하는 방식으로 생활할 수 있고, 필요한 경우 전문적인 지원과\n    상담을 받는다.\n\n 21.1 기상, 취침, 목욕, 식사, 기타 활동 시간은 유연해야 하며 제약이 가해지는\n        경우 개별 서비스 계획에 포함되어 있어야 한다.\n\n 21.2 이용자는 자신의 취향을 반영하는 옷, 머리모양, 화장 등을 선택할 수\n        있어야 한다.\n\n 21.3 이용자는 시설의 내･외부에서 물리치료사, 작업치료사, 언어치료사 등\n        으로부터 필요한(추가적인) 전문적 지원과 상담을 받을 수 있어야 한다."}, {"p": 577, "t": "                           Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n21.4 시설은 의사소통이 어려운 이용자의 싫어하는 것과 좋아하는 것 등에\n   대한 기록을 남겨야 한다.\n\n\n기준 22. 건강관리\n원칙：이용자는 건강한 신체적･정신적 상태를 유지하는 데 필요한 지원을 받는다.\n\n22.1 이용자는 자신의 보건 케어를 관리 통제할 수 있도록 다음과 같은 내용의\n   지원을 받는다.\n    - 일반적인 건강 관련 최신정보를 얻을 수 있도록 지원\n\n    - 이용자 자신의 의료적 상태(당뇨병 등) 관리를 위한 지원\n\n    - 지역사회의 보건시설에 접근할 수 있도록 지원\n\n22.2 이용자는 매년 건강 검진을 받는다.\n\n\n기준 23. 약물관리\n\n원칙：이용자는 적절한 방식으로 약물을 보유･관리하며, 약물을 다루는 시설의 정책과\n   절차에 의해 보호받는다.\n\n23.1 시설은 약물의 영수증, 약물복용 기록, 약물의 보관 및 관리에 대한 시설\n   정책과 절차에 의해 이용자가 자신의 약물을 스스로 보유하고 관리, 통제할\n   수 있도록 지원해야 한다.\n\n23.2 약물을 관리하는 직원을 위한 훈련에는 다음과 같은 내용이 포함되어야\n   한다.\n\n    - 약물복용 방법에 대한 기본 지식, 약물사용에 따른 문제 인식 방법과              제8장\n\n     대처 방법\n    - 약물을 어떻게 다루고 기록하는지와 관련된 사항"}, {"p": 578, "t": " 23.3 직원에 의해 관리되는 약물은 시설의 지침에 따라 별도의 공간에 보관한다.\n\n 23.4 위험 약물은 직원에 의해 관리된다.\n\n\n기준 24. 노화와 사망\n\n 원칙：이용자의 노화, 질병, 사망 등은 개인이 원하는 방법으로 다루어진다.\n\n 24.1 이용자의 노화와 질병, 사망 등은 민감하게 다루어지고 존중되어야 한다.\n\n 24.2 임종케어와 죽음에 있어서의 이용자의 욕구는 종교적･문화적 관습을\n        고려하여 논의되고 수행되어야 한다.\n\n 24.3 이용자가 원할 경우 시설은 훈련된 전문시설을 통해 통증완화, 실질적인\n        원조와 조언, 임종상담 등을 제공해야 한다.\n\n\n  영역 7：환경\n\n\n기준 25. 시설과 설비\n\n 원칙：이용자는 가정과 유사한 설비를 통해서 개별 욕구를 충족하며, 편안하게 생활할\n     수 있도록 지원받는다.\n\n 25.1 시설과 설비는 안전하고, 편안하고, 밝고, 상쾌하고, 통풍이 잘 되고,\n        악취가 나지 않아야 하며, 적당한 밝기와 난방 및 냉방, 통풍이 유지\n        되어야 한다.\n\n 25.2 시설과 설비는 모든 이용자의 접근이 가능해야 한다."}, {"p": 579, "t": "                          Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n기준 26. 개인침실 ; 공간요구\n\n원칙：이용자의 욕구를 반영한 적절한 면적의 침실이 제공되도록 노력하여야 한다.\n\n26.1 침실 바닥 면적은 1인당 5제곱미터 이상이 되도록 노력 하여야 한다.\n   (침실에 부속된 화장실이 있는 경우 이를 침실면적에 산입하지 않음)\n\n26.2 시설은 이용자의 침실이 4인실 이하가 되도록 최대한 노력하여야 한다.\n\n\n기준 27. 개인침실 ; 가구와 시설물\n\n원칙：이용자는 개별 욕구와 생활양식을 충족할 수 있는 가구와 부속품이 있는 침실을\n   제공받는다.\n\n27.1 이용자는 자신의 기호에 맞게 침실을 꾸밀 수 있고 잠글 수 있다. 단,\n   필요시 서비스 이용 계획에 제한 상황을 명시할 수 있다.\n\n27.2 침실에는 옷장, 사물함, 잠금장치가 있는 개인물품 보관공간이 있어야 한다.\n\n27.3 침실에는 개인이 사용하는 침구와 베개가 있어야 한다.\n\n27.4 침실에는 바깥을 볼 수 있는 창문, 적절한 조명, 적절한 환기, 조절할 수\n   있는 난방시설이 있어야 한다.\n\n\n기준 28. 화장실과 욕실\n\n원칙：이용자의 사생활이 보장되는 수준의 화장실과 욕실이 제공될 수 있도록 노력하여야\n   한다.\n\n28.1 시설은 5명 이상이 화장실을 공동으로 사용하지 않도록 충분한 화장실을             제8장\n   제공하기 위해 노력하여야 한다.\n28.2 화장실과 욕실은 잠글 수 있어야 하며, 직원은 오직 이용자의 위험관리의\n   필요에 의해서만 제한할 수 있다."}, {"p": 580, "t": "기준 29. 공용 공간\n\n 원칙：이용자는 일반 가정집과 유사한 설비를 갖춘 공용 공간을 자유롭게 이용한다.\n\n 29.1 가정형 구조의 경우 부엌과 세탁실은 일반 가정집과 같이 설비되어야 한다.\n\n 29.2 공용 공간(식사, 사회적 활동 등을 하는 공간)은 이용자 일인당 최저 3제곱미터\n        이상이 되어야 한다.\n\n 29.3 방문객, 상담, 치료를 위해 사적 공간을 마련해야 한다.\n\n\n기준 30. 보조기구와 설비\n\n 원칙：이용자는 개별 욕구를 충족하고 자립능력을 최대화하는 데 필요한 보조기구와\n     설비를 제공받는다.\n\n 30.1 신체장애인 개별욕구에 맞게 다음과 같은 전문 설비를 갖추어야 한다.\n\n        - 승강기 및 경사로\n\n        - 비상호출 장치\n\n        - 낮은 전구스위치, 편리한 창문개폐장치\n\n        - 별도로 분리되어 있는 휠체어나 이동기구 보관소 및 기구충전 설비\n\n 30.2 감각장애인 개별욕구에 맞게 다음과 같은 전문 설비를 갖추어야 한다.\n\n        - 눈부시지 않는 조명\n\n        - 개인용 컴퓨터\n\n        - 유도시설 등\n\n        - 비디오 레코더 또는 여타의 편의장치가 있는 TV\n\n 30.3 안전시스템과 설비는 이동장애/감각장애가 있는 사람들에게 적합하게\n        설치해야 한다(불이 켜지는 화재경보장치 등)."}, {"p": 581, "t": "                           Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n기준 31. 위생과 감염 예방\n\n원칙：이용자는 깨끗하고 위생적인 시설에서 생활한다.\n31.1 시설은 청결함을 유지하고, 불쾌한 악취가 나지 않으며, 감염병의 확산을\n    통제할 수 있는 시스템(예방조치 포함)을 갖추고 있어야 한다.\n\n31.2 세탁물은 음식 보관 저장소, 요리하는 곳, 음식 먹는 곳과 떨어진 곳에\n    보관되어야 한다.\n\n\n 영역 8：직원관리\n\n\n기준 32. 역할\n\n원칙：직원은 시설의 주요 목적과 가치를 이해하며, 직원의 업무는 이용자의 욕구 충족을\n   최우선으로 고려하여 배정된다.\n32.1 직원은 시설의 주요 목적과 가치를 알고 지지하며, 시설의 정책과 절차를\n    이해하고 이행하며, 시설의 주요 목적을 증진시키기 위하여 다른 직원과\n    어떻게 함께 일할 것인지를 알아야 한다.\n\n32.2 직원 업무분장 기준은 이용자의 서비스 이용 계획을 최우선으로 해야 한다.\n\n\n기준 33. 자격과 자질\n\n원칙：직원은 이용자를 존중하는 자세를 가지며, 업무수행에 필요한 기술과 경험을 가진다.\n33.1 직원은 이용자를 존중하고, 다음과 같은 중요한 태도와 자질을 갖추어야 한다.\n    - 이용자가 접근하기 쉽고, 사귀기 쉽고, 편안하다.\n    - 잘 경청하고 의사소통할 수 있다.\n    - 신뢰할 수 있으면서 정직하다.\n\n    - 일에 흥미를 가지고 있으면서 동기부여가 되어 있다."}, {"p": 582, "t": " 33.2 직원은 그들에게 기대되는 임무를 수행하는 데 필요한 다음과 같은 기술과\n        경험을 가지고 있어야 한다.\n        - 이용자의 장애와 특수한 상태에 대한 지식\n        - 이용자의 개별 욕구를 충족시킬 수 있는 기술과 의사소통 기술, 예견되는\n         행동을 다룰 수 있는 기술\n        - 이용자의 신체적, 언어적 공격과 자해를 의사소통 욕구, 선호, 욕구\n         불만의 표현으로 해석할 수 있는 이해력\n\n 33.3 실습생은 자격을 갖춘 직원의 지도･입회하에서만 이용자에 대한 직접적인\n        서비스를 제공할 수 있다.\n\n\n기준 34. 직원구성\n\n 원칙：직원의 구성 및 회의는 이용자의 욕구 충족이 가능하도록 기획된다.\n\n 34.1 시설은 정기적인 직원회의를 개최하고(최저 1년 6회), 기록해야 한다.\n\n 34.2 직원을 구성함에 있어서는 이용자의 성별 비율을 고려하여야 한다.\n\n\n기준 35. 훈련과 개발\n\n 원칙：직원은 이용자 욕구 충족에 필요한 다양한 교육을 받는다.\n\n 35.1 직원은 정해진 계획에 따라 보수교육을 받아야 한다.\n\n 35.2 모든 직원은 공평한 훈련기회를 가지며, 훈련에는 장애인 인식 개선 교육이\n        포함된다.\n\n\n기준 36. 지도감독과 지지\n\n 원칙：직원은 이용자 욕구 충족에 필요한 슈퍼비전을 받으며, 이용자의 신체적 공격에\n     대해 대처할 수 있다.\n\n 36.1 직원은 업무를 수행하는데 필요한 지원과 슈퍼비전을 받는다."}, {"p": 583, "t": "                           Ⅰ. 장애인거주시설 서비스 최저기준\n\n\n 영역 9：시설운영\n\n\n기준 37. 질 관리\n\n원칙：시설은 서비스 질의 향상을 보장하는 점검체계를 마련하고 이용자를 적극 참여시킨다.\n\n37.1 시설의 목적과 목표는 서비스 질을 강조하는 내용과 방식으로 구체적으로\n    설정되며 그 내용은 직원과 이용자들에게 공유되어야 한다.\n\n37.2 객관적이고 일관성 있는 방법을 이용하여 연간 1회 이상 이용자가 참여하는\n    지속적인 자기점검이 이루어진다.\n\n37.3 서비스 관련 조사결과는 이용자와 그 대표자, 기타 관련 집단이 열람할 수\n    있다.\n\n37.4 시설장(시설책임자)과 직원은 각각의 이용자를 위한 개별 계획의 실행과\n    관련된 변화 내용을 설명할 수 있어야 한다.\n\n37.5 제공된 서비스에 대한 이용자의 기록과 생활계획 뿐 아니라 익명으로\n    이루어진 이용자 만족도 조사, 개별 또는 그룹 토의 등 이용자로부터 제공된\n    모든 정보들에 대하여 적극적인 피드백이 이루어져야 한다.\n\n\n기준 38. 정책과 절차\n\n원칙：이용자는 시설의 문서화된 정책과 규정된 절차에 의해 권리를 보장받는다.\n\n38.1 직원은 모든 정책 및 절차와 실천 규약을 이해하고 실천해야 한다.\n\n38.2 이용자는 적절한 형태의 관련 정책, 절차, 실천 규약에 접근할 수 있고,            제8장\n    직원은 이용자에게 필요한 설명을 해야 한다.\n38.3 정책, 절차, 실천 규약과 기록은 시설장(시설책임자)이 서명해야 하고,\n    날짜가 기록되고, 검토 수정된다."}, {"p": 584, "t": "기준 39. 기록유지\n\n 원칙：이용자는 시설의 기록유지 정책과 규정된 절차에 의해 권리를 보장받는다.\n\n 39.1 이용자에 대한 기록은 최근의 정보를 정확하게 반영해야 하며, 비밀이\n        보장되어야 한다.\n\n 39.2 이용자는 시설에서 이루어지고 있는 자신의 기록과 정보에 접근할 수 있고,\n        이의를 제기할 수 있는 기회를 가진다.\n\n\n기준 40. 안전의 실천\n\n 원칙：이용자는 일상생활에서의 안전을 보장받는다.\n\n 40.1 시설은 화재 예방 설비와 대피방법, 화재 경보가 울릴 때 취해야 할 절차에\n        대한 설명을 이용자에게 제공해야 한다.\n\n 40.2 직원은 사고와 응급환자 발생 시 대처 방법을 숙지하고 있어야 하며, 시설에는\n        응급처치를 위한 구급약이 준비되어 있어야 한다. 또한 모든 사례는 기록으로\n        남겨야 한다.\n\n 40.3 시설은 이용자에 대한 취약성과 위험사정에 기반하여 창문의 잠금장치\n        점검 및 정비를 실시해야 한다.\n\n 40.4 시설은 안전과 소방에 관한 관련법규에서 정하는 기준을 충족해야 한다."}]}, {"title": "Ⅱ. 장애인복지관 서비스 최저기준", "start": 585, "end": 601, "subs": [], "pages": [{"p": 585, "t": "                                     Ⅱ. 장애인복지관 서비스 최저기준\n\n\n    Ⅱ     장애인복지관 서비스 최저기준\n\n\n1   사례관리\n\n기준 1. 사례관리 체계\n\n○ 세부기준 1.1.1：사례관리 운영체계\n세부기준                            세부내용\n         ○ 장애인은 다양한 욕구와 문제 해결에 있어 통합적이고 체계적인 개별맞춤지원 체계에\n 1.1.1     기반을 둔 서비스를 제공 받는다.\n사례관리      - 복지관 내 사례관리 체계에 관한 문서화된 지침 마련\n운영체계      - 정기적인 복지관 내 통합된 사례관리 회의 운영\n          - 전문 인력 배치와 사례관리에 대한 적절한 슈퍼비전 제시\n\n\n○ 세부기준 1.1.2：사례관리 실행\n세부기준                            세부내용\n         ○ 장애인은 다양한 통로를 통해 개별맞춤지원 서비스에 접근할 수 있으며, 당사자의 동의하에\n           일련의 서비스를 제공 받는다.\n 1.1.2    - 사각지대에 놓여 있는 신규 사례 적극적 발굴\n사례관리      - 장애인 또는 가족(보호자)에게 사례관리 서비스에 대한 설명과 제반 활동에 참여하는\n 실행         내용의 사례관리 동의서 보관\n          - 시간 순서에 따라 신청접수 및 초기상담, 사정, 사정회의(재활계획회의), 통보 및 동의,\n            서비스 제공, 사례회의, 종결, 사후지원의 체계적 제공과 그에 따른 기록\n\n\n기준 2. 사례관리와 지역사회자원\n\n○ 세부기준 1.2.1：지역사회자원 활용\n세부기준                            세부내용\n         ○ 장애인은 다양한 지역사회자원을 통해 자신의 욕구와 문제를 해결하고, 나아가 완전한          제8장\n 1.2.1     사회참여와 지역사회통합을 이룬다.\n지역사회      - 사례관리 서비스와 관련된 지역사회자원의 개발과 관리\n자원 활용     - 지역사회 연계형 통합사례회의 참여 또는 운영\n          - 사례관리를 위한 지역사회자원 활용 및 연계"}, {"p": 586, "t": " 2 서비스\n\n기준 1. 서비스 안내 및 상담\n\n ○ 세부기준 2.1.1：서비스 이용자 안내\n\n 세부기준                           세부내용\n       ○ 장애인은 장애인복지관의 서비스를 선택하기 위하여 필요한 정보를 장애 특성에 알맞은\n         방법으로 적절하게 제공받는다.\n        - 서비스 이용자를 위한 다음의 내용이 포함된 장애인복지관 안내서의 제작 및 배포\n         ▪장애인복지관 운영의 목적\n         ▪서비스 내용, 대상, 기간, 비용\n 2.1.1   ▪법적 자격을 충족하는 관리자와 담당 직원의 자격증과 경력\n 서비스     ▪이용자 권리에 대한 설명\n이용자 안내   ▪이의제기 절차\n        - 장애인복지관은 운영목적, 목표, 철학, 서비스와 시설, 서비스제공 조건 등에 대한 최신\n          정보에 근거하여 장애인복지관 운영목적을 문서로 작성\n        - 장애인복지관에 관한 정보는 예비 이용자가 이해하기에 적절한 형식(적절한 언어, 그림,\n          비디오, 오디오 등으로 된 설명)으로 제공\n        - 서비스 상담에 필요한 기본자료, 자원목록 등의 구비\n\n\n ○ 세부기준 2.1.2：이용 상담\n\n 세부기준                           세부내용\n          ○ 장애인복지관은 예비 이용자와 상담을 진행함에 있어, 적절한 서비스 제공에 필요한 다양한\n            정보를 수집한다.\n           - 장애인복지관은 서비스 이용 여부를 결정하기 전에 예비 이용자 및 가족을 통해 다음과\n             같은 내용을 포함한 기본 정보를 수집\n            ▪기본적인 인적 사항\n            ▪의사소통 방법\n  2.1.2\n            ▪필요한 일상생활 지원내용과 형태\n 이용상담\n            ▪필요한 치료, 교육, 훈련과 재활프로그램 등\n            ▪가족을 포함한 사회적 관계망\n            ▪위험요소\n            ▪소득\n            ▪장애관련 필요 보조기구\n            ▪신체적, 정신적 보건 케어 등"}, {"p": 587, "t": "                                    Ⅱ. 장애인복지관 서비스 최저기준\n\n\n기준 2. 개인의 욕구와 선택\n\n○ 세부기준 2.2.1：욕구 사정\n세부기준                            세부내용\n         ○ 장애인의 개인적인 희망과 욕구가 사정되고, 욕구의 변화는 정기적으로 점검해야 한다.\n          - 개별 서비스 이용 계획 수립을 위한 욕구 사정은 다음과 같은 정보들이 확인되어야 함\n           ▪관련 병력, 심리적, 사회적 정보\n           ▪이전에 제공받은 직접서비스 및 보호 관련 정보\n           ▪필요시 관련 전문가에게 이용자에 관한 평가 요청\n          - 욕구 사정의 내용은 다음과 같은 정보들을 토대로 주기적으로 점검되어야 함\n           ▪강점, 능력, 욕구, 선호도 등의 변화\n 2.2.1     ▪서비스 목표의 변화\n욕구사정       ▪관련 전문 분야로부터 입수된 새로운 정보\n           ▪기타 이용자로부터 확인된 정보\n          - 이용자에 대한 정기적인 욕구 사정과 결과의 기록 및 보관\n          - 이용자가 원할 경우 다양한 분야 전문가에 의해 사회, 교육, 언어, 심리, 직업 영역\n            등의 사정 시행\n          - 이용자의 욕구와 서비스 기능(기능강화, 가족지원, 권익옹호, 직업, 문화여가, 사회\n            서비스)에 따라 필요로 하는 사정의 내용과 형태를 갖춤\n          - 사정 결과에 대해 설명하고 문서로 제공하며, 결과를 개별서비스 이용 계획에 반영\n\n\n○ 세부기준 2.2.2：개인별 서비스 이용 계획\n세부기준                           세부내용\n       ○ 장애인의 욕구사정 결과를 반영하여 개별 서비스 이용계획을 수립하고, 이 계획은 욕구의\n         변화에 따라 정기적으로 점검한다. 개별 서비스 이용 계획과 함께 서비스 제공기간, 서비스\n         시간, 이용료, 서비스 과정, 이용자 권리 등이 기록된 서비스 계약서를 작성한다.\n        - 장애 당사자와 가족의 참여를 적극 권장하고, 친구, 권익옹호자, 보조인, 관련 전문가\n          등의 참여를 보장함\n        - 개별 서비스 지원 계획에는 제공 될 서비스에 대한 다음의 설명들이 포함되어야 함\n 2.2.2   ▪사정결과로부터 도출된 계획\n 개인별     ▪필요한 경우 서비스 선택과 자유에 대한 제한에 대해 설명과 내용 합의\n서비스 이용   ▪공격적이거나 남을 해하거나 자해할 성향이 높은 이용자를 위한 개별화된 조치사항\n  계획       및 절차 확립\n        - 개별 서비스 지원 계획은 주기적인 점검, 평가결과에 의해 조정, 반영해야 함\n        - 개인별 서비스 지원 계획은 이용자 욕구와 지원되는 서비스 기능                     제8장\n          (기능강화, 가족지원, 권익옹호, 직업, 문화여가, 사회서비스 등)의 특성에 따라 필요로\n          하는 내용과 형태를 갖춤\n        - 개인별 서비스 지원 계획에는 서비스 목표, 서비스 과정과 방법, 제공기간, 서비스 시간,\n          이용료, 이용자 권리 등이 기록된 서비스 계약서를 함께 작성"}, {"p": 588, "t": "기준 3. 능력개발\n\n ○ 세부기준 2.3.1：기능강화, 교육과 직업, 역량강화 및 권익옹호 지원\n  세부기준                           세부내용\n    2.3.1   ○ 장애인의 능력개발을 도모하고, 지역사회 활동에 참여를 증진하기 위해 기능강화\n   기능강화,      및 교육과 직업, 역량강화 및 권익옹호 등의 지원을 받는다.\n 교육과 직업,     - 능력개발 증진을 위한 각종 기능강화 서비스 지원\n  역량강화 및     - 생애주기별 교육과 직업적인 기회를 위한 지원\n 권익옹호 지원     - 지역사회 참여를 증진하는 역량강화 및 권익옹호 지원\n\n\n기준 4. 지역생활지원\n\n ○ 세부기준 2.4.1：가족, 문화여가, 생활환경, 사회서비스 지원\n  세부기준                           세부내용\n            ○ 장애인은 지역사회 참여와 삶의 질 만족을 위한 각종 지원 서비스를 받는다.\n   2.4.1     - 가족기능강화와 양육지원, 가족 내 역할 증진을 위한 가족 지원\n가족, 문화여가,    - 삶의 질 만족과 사회활동 참여 증대를 위해 자신이 원하는 적절한 문화여가\n  생활환경,        활동을 선택하고, 이용할 수 있도록 지원\n사회서비스 지원     - 빈곤, 건강, 생활 및 주거환경 등 최저생활에 필요한 지역사회 자원연계에 의한 지원\n             - 발달지원 및 일상생활 증진과 사회참여 증대를 위한 각종 사회서비스 지원\n\n\n 3 이용자의 참여와 권리\n\n기준 1. 개인정보 보호\n\n ○ 세부기준 3.1.1：개인정보 보호\n 세부기준                           세부내용\n          ○ 장애인은 개인의 모든 정보에 대해 보호를 받을 수 있어야 하며, 서비스 이용에 따른\n  3.1.1     개인정보를 보호하는 절차와 장치를 마련해야 한다.\n 개인정보      - 이용자 정보에 대한 비밀보장 및 개인정보보호에 관해 문서화된 지침 또는 규정 구비\n  보호       - 지침에 의거 개인정보 관리\n           - 개인파일, 전산프로그램은 보안을 유지하기 위해 관리책임자를 지정하고, 잠금장치 설치"}, {"p": 589, "t": "                                  Ⅱ. 장애인복지관 서비스 최저기준\n\n\n기준 2. 정보제공\n\n○ 세부기준 3.2.1：서비스 정보 제공\n\n세부기준                          세부내용\n         ○ 장애인은 다양한 통로를 통해 장애인복지관의 이용 정보에 손쉽게 접근할 수 있어야\n           하며, 장애유형에 맞는 다양한 정보접근성을 높여야 한다.\n          - 장애인복지관 운영 현황 등을 이용 장애인에게 제공(서비스 목적, 내용, 자격요건,\n 3.2.1\n            이용방법, 연락처 등이 기재된 안내물의 비치 및 제공)\n 서비스\n          - 장애인복지관내에 안내데스크 또는 안내판 설치\n정보제공\n          - 홈페이지 운영 및 소식지를 통해 정보 제공\n          - 상담이나 복지관 안내를 담당하는 직원 지정\n          - 이용자의 특수성을 배려하는 정보 표기\n\n\n○ 세부기준 3.2.2：이용자 권리 및 의무에 관한 정보제공\n\n세부기준                          세부내용\n\n  3.2.2 ○ 장애인은 장애인복지관을 이용함에 있어 이용자의 권리에 대해 명백히 보장을 받아야\n 이용자의     하며, 또한 이용자의 책임에 대해서도 숙지하고 있어야 한다.\n 권리 및    - 장애인복지관 이용자의 권리 및 의무의 명문화\n의무에 관한   - 장애인복지관 이용자 또는 가족(혹은 보호자)에게 이용자의 권리와 의무에 관한 내용을\n 정보제공      문서로 제공 및 상시 게시\n\n\n기준 3. 참여증진\n\n○ 세부기준 3.3.1：이용자 참여증진\n\n세부기준                          세부내용\n\n       ○ 장애인은 장애인복지관을 이용함에 있어 개인의 요구와 의견을 자유롭게 제시할 수 있으며,\n 3.3.1   이용자를 대상으로 실시한 의견수렴 내용을 열람할 수 있다.\n이용자 참여  - 정기적인 이용자 간담회 혹은 이용자모니터위원회(혹은 이용자참여위원회)를 구성 및\n  증진      운영\n        - 위원회 혹은 간담회는 정기적으로 실시하며, 회의 내용의 공개"}, {"p": 590, "t": "기준 4. 고충처리\n\n ○ 세부기준 3.4.1：고충처리 방침 및 절차\n\n 세부기준                           세부내용\n        ○ 장애인은 장애인복지관을 이용함에 있어 발생하는 다양한 고충과 민원을 자유롭게 제시할\n          수 있으며, 다양한 창구를 통해 고충과 민원을 해소할 수 있다.\n  3.4.1  - 이용자의 고충처리 접수 및 과정, 처리기간 등의 문서화\n고충처리방침   - 고충처리를 담당하는 부서와 직원 지정\n 및 절차    - 고충처리를 위한 위원회가 구성되어 있으며, 고충처리에 대한 회의 개최 및 처리 내용의\n           문서화\n         - 홈페이지, 건의함 등 고충을 접수할 수 있는 통로 마련\n\n\n기준 5. 차별금지 및 인권옹호\n\n ○ 세부기준 3.5.1：차별금지 및 노력\n\n 세부기준                           세부내용\n       ○ 장애인은 어떠한 이유에서도 차별 받지 않으며, 다양한 방법과 절차를 통해 권리침해와\n 3.5.1   구제 등 장애인차별금지에 관한 내용을 알 수 있다.\n차별금지 및  - 이용자에 대한 장애인차별금지에 관한 규정 또는 지침 마련\n  노력    - 지역장애인에 대한 장애인차별 및 권리침해와 관한 다양한 활동 및 지원(무료법률상담,\n          지역 관련 위원회 참석, 관련 캠페인 및 협력관계 구축을 통한 활동 등)\n\n\n ○ 세부기준 3.5.2：인권옹호\n\n 세부기준                           세부내용\n\n          ○ 장애인은 개인의 인권을 보호하기 위해 다양한 교육 등에 참석하여 인권에 대한 정확한\n            이해를 넓히고, 인권보호와 권리보장을 받을 수 있다.\n  3.5.2    - 인권옹호, 학대 및 괴롭힘에 대한 규정 또는 지침을 마련하고 발생시 처리 과정 등의\n 인권옹호        문서화\n           - 이용자를 대상으로 인권에 관한 교육 실시\n           - 장애인복지관 이용자와 지역의 장애인들의 인권옹호를 위한 다양한 활동 실시"}, {"p": 591, "t": "                                     Ⅱ. 장애인복지관 서비스 최저기준\n\n\n4 지역사회 네트워크\n\n기준 1. 지역사회 장애인복지서비스 개발 및 지원\n\n○ 세부기준 4.1.1：지역장애인 정책 및 복지서비스 확대\n\n세부기준                            세부내용\n\n         ○ 장애인의 지역사회 내 삶의 질 향상을 위해 각종 정책 수립에 참여 및 활동하고 장애인복지\n           서비스 확대를 위한 서비스를 개발한다.\n          - 지역장애인복지정책 수립에 참여 및 활동\n 4.1.1\n           ▪장애인복지정책 수립과 관련된 각종 회의 참석 및 지원활동(조사, 연구, 현장의견 제시 등)\n지역장애인\n           ▪장애인복지관련 정책 제안(서면, 회의 참석 등)\n 정책 및\n           ▪장애인복지정책과 관련 지지활동 및 캠페인\n복지서비스\n          - 지역의 장애인복지서비스 확대를 위한 서비스 개발\n  확대\n           ▪개별 및 공동으로 프로그램 신설 및 확대 등\n           ▪장애인복지서비스 확대를 위한 개별 또는 공동 조사 및 연구\n           ▪서비스 확대를 위한 공공기관 및 민간기관과 연계 형성\n\n\n○ 세부기준 4.1.2：지역장애인관련 기관 지원\n\n세부기준                            세부내용\n\n         ○ 지역의 장애인시설 및 단체를 지원하기 위해 네트워크를 구축하고 정보와 시설을 개방하고\n           서비스를 연계한다.\n          - 지역 장애인시설 및 단체와 네트워크 구축\n           ▪네트워크 구축：정기적, 비정기적 네트워크 형성\n 4.1.2\n           ▪장애인복지시설：거주시설, 자립생활센터, 지역사회재활시설, 직업재활시설, 장애인\n지역장애인\n            관련 제반 교육기관 및 의료기관 등\n관련 기관\n           ▪장애인단체：장애인협회, 장애인부모회, 자조모임 등\n  지원\n          - 지역 장애인시설과 단체에 복지관을 개방하고 사업 및 서비스 연계\n           ▪장애인복지관 개방：정보공개(경영방침, 사업내용, 이용안내 등), 시설 및 기자재 개방\n            및 대여\n           ▪지역의 장애인시설(단체)과 사업 및 서비스 연계"}, {"p": 592, "t": "기준 2. 지역의 사회통합 환경 조성\n\n ○ 세부기준 4.2.1：지역의 사회통합 환경 조성\n\n 세부기준                           세부내용\n\n          ○ 장애인이 지역사회에서 완전한 참여와 평등을 누릴 수 있도록 사회통합 환경을 조성한다.\n           - 지역의 장애인복지에 대한 관심 증대와 지역사회 참여 확대를 위한 사회교육 또는 지역\n             사회조직화 사업 실시\n  4.2.1     ▪사회교육：장애인복지에 대한 이해와 참여를 위한 지역기관 및 주민을 대상으로 교육\n지역의 사회        실시\n  통합        ▪지역사회조직화：장애인복지를 위한 다양한 조직화 사업\n 환경조성      - 지역사회가 참여하는 통합프로그램 실시\n            ▪학생, 지역주민과 단체가 참여하는 통합 프로그램\n           - 지역사회 제반 행사에 장애인들의 참여 촉진\n            ▪지역 공공기관과 민간기관, 주민단체에서 진행하는 각종 행사에 장애인들의 참여 지원\n\n\n ○ 세부기준 4.2.2：장애인식개선\n\n 세부기준                           세부내용\n\n          ○ 장애인이 겪는 지역사회 내 물리적･심리적 장벽을 없애기 위해 지역사회 장애인식개선을\n            위한 사업계획을 수립하고 다양한 주민들에게 적절한 장애인식개선 사업을 실시한다.\n           - 지역사회 장애인식개선을 위한 사업계획 수립 및 실행\n  4.2.2     ▪매년 사업계획에 장애인식개선 사업 수립\n 장애인식       ▪매년 사업계획에 의거하여 실행\n  개선       - 교육 대상에 맞는 구체적인 프로그램으로 진행\n            ▪교육대상에 따라 장애인식개선 자료와 진행 방식의 차이를 둠\n           - 다양한 장애인식개선 자료 제작 및 배포\n            ▪장애인식개선 가이드북, 팜플렛, 벤허 등 각종 인쇄물과 물품 제작 및 배포"}, {"p": 593, "t": "                                      Ⅱ. 장애인복지관 서비스 최저기준\n\n\n기준 3. 지역사회 네트워크 구축\n\n○ 세부기준 4.3.1：지역사회 네트워크\n\n세부기준                             세부내용\n\n         ○ 장애인의 다양한 욕구와 필요성에 의해 지역장애인의 복지증진과 서비스 연계를 위해\n           지역사회내의 시민단체, 기업, 학교, 공공기관, 개인 등과 유기적인 관계망을 형성하고 지역연계\n           사업을 실시한다.\n          - 장애인복지관 운영방침(사업계획)에 지역사회연계사업 촉진 내용이 있고, 사업계획에\n            반영\n 4.3.1     ▪장애인복지관 경영이념과 운영방침에 지역사회연계의 내용이 있고, 그에 따라 매년 사업\n지역사회        계획에 지역사회연계를 위한 사업 수립\n네트워크      - 공공기관 또는 민관기관과의 네트워크 참여\n           ▪행정기관, 교육기관, 의료기관, 고용관련 기관 등과의 네트워크 참여\n          - 주민단체와의 네트워크 형성 및 참여\n           ▪부녀회, 청년회, 노인회, 풀뿌리 주민모임 등 각종 주민단체와 네트워크 형성 및 참여\n          - 지역사회 단체(개인)와 공식적인 연계(협약) 체계 구축\n           ▪공문 또는 협약서를 근거한 공식적인 연계\n\n\n기준 4. 지역자원 개발 및 관리\n\n○ 세부기준 4.4.1：후원사업\n\n세부기준                             세부내용\n         ○ 지역주민이 후원사업에 참여할 수 있도록 안내하며, 후원사업 관련 법령에 의거한 지침과\n           절차를 갖추고 장애인의 다양한 욕구에 대응하기 위해 외부자원개발과 후원사업을 실시한다.\n          - 후원금품 관리에 대한 지침 마련과 시행\n           ▪문서화된 지침 마련과 그에 따른 시행\n          - 다양한 후원사업 안내 및 실시\n 4.4.1\n           ▪지역사회에 결연, 물품 지원 등 다양한 후원사업 안내\n후원사업\n          - 외부자원개발을 통한 후원사업 활성화 노력\n           ▪장애인의 지원이나 서비스 확대를 위한 외부자원개발(공동모금회, 기업의 복지재단,\n            재단법인, 사단법인 등에 지원서를 제출하여 자원을 확보)\n          - 지역사회가 참여하는 후원사업 실시\n           ▪지역기관과 주민들이 함께 할 수 있는 후원행사 실시"}, {"p": 594, "t": " ○ 세부기준 4.4.2：자원봉사자 관리\n\n 세부기준                            세부내용\n\n          ○ 자원봉사자가 봉사활동을 통해 역량강화 될 수 있도록 교육과 관리에 대한 지침이 명문화\n            되고 자원봉사자 활동을 활성화하기 위한 지원과 사업을 실시한다.\n           - 자원봉사자 관리 지침의 문서화\n           - 자원봉사자 관리가 사업계획에 포함되어 있으며, 그에 따른 예산 책정\n  4.4.2\n           - 자원봉사회 구성 및 자원봉사자 의견 수렴\n 자원봉사자\n  관리       - 자원봉사자실 마련(겸용 공간 포함)\n           - 자원봉사자 교육 및 관리 프로그램 운영\n            ▪교육：기초교육, 전문교육, 보수교육 등 경력과 전문성을 개발할 수 있는 제반 교육과\n             훈련\n            ▪관리：지지, 격려, 슈퍼비전, 활동내용 전산관리 및 인증서발급, 간담회, 야유회 등\n\n\n ○ 세부기준 4.4.3：홍보활동\n\n 세부기준                            세부내용\n\n          ○ 장애인이 장애인복지관을 편리하게 이용할 수 있도록 홍보물을 통해 필요한 정보를 전달\n            하며, 장애인들이 필요로 하는 자원을 개발하기 위해 다양한 매체와 인터넷을 통한 홍보\n            활동을 한다.\n           - 장애인복지관 소개 및 자원개발(후원, 자원봉사, 지역연계등)의 내용을 충실히 갖춘\n             정기적 홍보물 제작 및 배포\n  4.4.3\n            ▪리플렛, 요람, 가이드북, 핸드북, 관보, 안내지 등\n 홍보활동\n           - 지역사회의 다양한 매체를 활용한 홍보\n            ▪TV, 신문, 라디오, 정기간행물, 인터넷 방송, 기타 등\n           - 장애인의 웹 접근성을 확보한 홈페이지 운영 및 인터넷 홍보 실시\n            ▪홈페이지 웹 접근성 확보\n            ▪포탈사이트 연계홍보, SNS, 블로그, 카페 등을 활용한 홍보"}, {"p": 595, "t": "                                      Ⅱ. 장애인복지관 서비스 최저기준\n\n\n 5 인 력\n\n기준 1. 인력의 확보\n\n ○ 세부기준 5.1.1：직원의 확보\n\n 세부기준                            세부내용\n  5.1.1\n          ○ 장애인이 원하는 서비스를 제공하기 위하여 정원 또는 지방자치단체가 승인한 인원에\n 종사자의\n            대비하여 직원을 충분하게 확보한다.\n  확보\n\n\n ○ 세부기준 5.1.2：법적 자격과 경력\n\n 세부기준                            세부내용\n\n 5.1.2\n       ○ 해당 직무와 관련한 자격증을 소지하고 법적 결격사항이 없어야 하며, 관련 경력의 유무를\n법적 자격과\n         확인하여 선발한다.\n  경력\n\n\n ○ 세부기준 5.1.3：직원의 선발4)\n\n 세부기준                            세부내용\n\n 5.1.3 ○ 상위법(규정 및 지침)이 반영된 인사규정에 의하여 공개적으로 공정한 절차에 따라 직원을\n직원의 선발   채용하며 관련 기록을 보관한다.\n\n\n4) 정부에서 인건비를 지원하는 시설의 직원 신규채용은 직위에 관계없이 공개모집을 원칙으로 한다. 공개          제8장\n   모집이란 자격을 갖춘 누구에게나 응모기회를 제공하여, 경쟁을 통해 능력 있는 자를 임용하는 제도로\n   특정인을 채용하기 위한 법인 및 시설 채용내규, 응모자격을 특정인으로 제한 등은 공개모집에 위배 된다. 법인\n   또는 시설에서 독자적 또는 공동으로 채용 시에는 해당 법인 및 시설 홈페이지, 소식지, 지자체 홈페이지\n   등에 채용관련사항을 15일 이상 공고한 후 법인 및 시설 내규 등에 의해 채용해야 한다(2016년도 보건복지부\n   사회복지시설관리안내)."}, {"p": 596, "t": "기준 2. 인력개발\n\n ○ 세부기준 5.2.1：신입직원교육\n 세부기준                            세부내용\n          ○ 장애인에게 질 높은 서비스를 제공하기 위하여 신입직원에 대한 체계적인 교육을 실시한다.\n  5.2.1    - 장애인복지관의 사명, 제규정 및 지침, 직무내용, 업무처리 절차, 장애인복지관의 최소기준\n 신입직원        등에 대한 체계적 교육 실시\n  교육       - 신입직원교육 교재는 자체 제작 또는 기존 자료 사용\n           - 교육기간은 수습기간 이내에 완료\n\n\n ○ 세부기준 5.2.2：훈련과 개발\n 세부기준                         세부내용\n       ○ 다양한 장애인의 욕구에 맞는 서비스 제공을 위하여 직원들에게 다양한 교육과 훈련을\n         실시한다.\n 5.2.1\n        - 직원의 새로운 지식, 기술, 태도, 가치, 흥미, 이해 등을 위한 교육 실시\n훈련과 개발\n        - 직원 개인별 자기개발 계획서를 작성하여 교육에 반영\n        - 경력이나 직위에 맞는 다양한 내･외부 교육 실시\n\n\n기준 3. 슈퍼비전\n\n ○ 세부기준 5.3.1：슈퍼비전\n 세부기준                            세부내용\n          ○ 장애인에게 양질의 서비스를 제공하기 위하여 자문 및 슈퍼비전을 받는다.\n  5.3.1    - 전문성 향상을 위해 정기적인 외부전문가 자문 실시\n 슈퍼비전      - 내부 슈퍼비전을 정기적으로 실시\n           - 자문 또는 슈퍼비전의 내용을 기록하고 사업에 반영\n\n\n기준 4. 근무평정 및 포상\n\n ○ 세부기준 5.4.1：근무평정 및 포상\n 세부기준                            세부내용\n          ○ 직원의 직무성과, 직무수행능력, 직무수행태도에 대하여 정기적으로 서면을 통하여 공정하게\n  5.4.1\n            평가하고, 내･외부 포상을 통하여 근로의욕을 고취한다.\n 근무평정\n           - 구조화된 근무평가지표를 통해 직무성과, 수행능력, 태도에 대한 정기 평가 실시\n 및 포상\n           - 평가와 연계된 포상 실시"}, {"p": 597, "t": "                                     Ⅱ. 장애인복지관 서비스 최저기준\n\n\n기준 5. 근무여건5)\n\n ○ 세부기준 5.5.1：고충처리\n\n 세부기준                           세부내용\n          ○ 직원의 욕구, 고충, 불만의 의견을 수렴하고 처리하는 공식적인 체계 구축 및 시행한다.\n  5.5.1    - 직원 고충처리 및 권익지원 규정 또는 지침 마련\n 고충처리      - 고충처리 위원에 의한 체계적인 고충처리 시행\n             * 단, 상시 30명 미만의 근로자를 사용하는 사업이나 사업장은 적용 예외임\n\n\n ○ 세부기준 5.5.2：자치조직 운영지원\n\n 세부기준                           세부내용\n  5.5.2   ○ 직원들의 활기차고 신나는 직장문화 조성을 위한 자치모임 활동을 지원한다.\n 자치조직      - 자치모임 지원을 사업계획서에 반영\n 운영지원      - 상조회, 친목회, 동아리 등 자치모임을 위한 환경 및 예산 지원\n\n\n ○ 세부기준 5.5.3：직원의 안전관리\n\n 세부기준                           세부내용\n\n  5.5.3   ○ 직원의 안전을 위한 제 법규 준수 및 안전보건 관리규정을 제정 준수한다.\n  직원의      - 직원 안전보건 관리규정을 제정하여 준수\n 안전 관리     - 정기적인 직원의 건강검진 실시\n\n\n5) 원칙적으로 사회복지시설에도 근로기준법 등 관계법령에 의한 근로기준을 적용하여 시설종사자의 기본적 생활을\n   보장 및 향상시키며 사회복지시설 관리의 효율성･민주성을 기해야 한다. 그리고 비정규직 차별 문제의\n   시정을 위해 관계법령 등을 준수해야 한다(2016년도 보건복지부 사회복지시설관리안내)"}, {"p": 598, "t": " 6 시설운영\n\n기준 1. 복지관의 접근성\n ○ 세부기준 6.1.1：복지관의 위치\n 세부기준                            세부내용\n          ○ 장애인들의 접근 편의성을 확보해야 한다.\n  6.1.1    - 대중교통수단이 정기적으로 운행되거나 대중교통수단이 미흡한 지역인 경우 장애인\n 복지관의        복지관 자체 이동수단으로 이용자의 이동편의 도모\n  위치       - 자가운전자 또는 도보 이용자들의 접근 편의를 위해 장애인복지관 안내 표지판을 국도\n             또는 지방도로 등에 설치 노력하거나 장애인복지관 홈페이지를 통해 설명\n\n\n기준 2. 복지관의 내･외부 환경\n ○ 세부기준 6.2.1：내･외부의 환경\n 세부기준                            세부내용\n          ○ 관련 법령 준수를 통한 복지관의 내･외부의 공간 및 안전성 확보하고, 위생 및 감염예방을\n            위한 안전관리체계를 구축한다.\n           - 장애인복지관 안전을 위해 시설물관리와 안전관리지침을 마련하고 정기 및 수시로 점검\n             실시\n           - 사회복지시설 화재안전관리 매뉴얼을 준수하고 정기적인 점검, 훈련, 교육 등을 실시하며\n 6.2.1       관련 사항 기록\n 내･외부      - 건물의 법적 안전기준을 충족(불법개조 등)\n  환경       - 장애인복지관 안전을 저해하는 문제 발생시 즉시 개선\n           - 장애인복지관은 편안하고, 밝고, 통풍이 잘 되고, 악취가 나지 않아야 하며, 적당한\n             밝기와 난방 및 냉방 등이 제공\n           - 장애인복지관 이용을 위해 각 층별 공간 배치도와 층별 안내 표지판을 제공\n           - 장애인복지관 규모를 고려하여 다양한 이용자 편의시설 제공\n           - 전염병의 확산을 통제하고 예방할 수 있는 체계 마련\n\n\n기준 3. 개방성\n ○ 세부기준 6.3.1：정보공개\n 세부기준                            세부내용\n          ○ 장애인복지관 운영과 관련된 정보를 공개한다.\n  6.3.1\n           - 조직의 사명, 사업내용, 재무자료, 각종 위원회 회의 결과 등 장애인복지관에 관한 정보를\n 정보공개\n             시설 홈페이지 또는 소식지에 공개"}, {"p": 599, "t": "                                    Ⅱ. 장애인복지관 서비스 최저기준\n\n\n ○ 세부기준 6.3.2：복지관 개방성\n\n 세부기준                           세부내용\n 6.3.2    ○ 시설물 개방 규정 또는 지침을 마련하고 지역사회와 지역주민들에게 시설물을 개방한다.\n 복지관       - 지역사회와 지역주민이 장애인복지관의 공간 또는 기자재와 설비 등을 최대한 이용할\n 개방성         수 있도록 장애인복지관 개방에 관한 규정 또는 지침을 마련하여 시행\n\n\n기준 4. 사명\n\n ○ 세부기준 6.4.1：사명진술\n\n 세부기준                           세부내용\n          ○ 장애인복지관 사명의 명문화와 사명실천을 위한 구체적인 계획, 점검, 수정, 공유 등을\n            실행한다.\n           - 설립이념, 조직의 목적, 미션, 비전 등의 명문화\n  6.4.1    - 설립이념, 조직의 목적, 미션, 비전 등을 직원 및 이용자들과 공유하기 위해 다양한\n 사명진술        방법을 마련하여 시행\n           - 설립이념, 조직의 목적, 미션, 비전 등을 달성하기 위한 목표들을 사업에 구체적으로\n             반영\n           - 목표 달성을 위한 중･장기계획의 수립 및 실행, 매년 점검, 수정\n\n\n기준 5. 운영계획 및 운영평가\n\n ○ 세부기준 6.5.1：운영계획의 수립 및 실행\n\n 세부기준                           세부내용\n        ○ 이용자 욕구와 만족도 및 기타 외부 환경적 요인을 반영한 운영계획을 수립하고 실행한다.\n         - 장애인복지관의 사명과 목표를 달성할 수 있으며, 다음의 내용이 포함된 운영계획 수립과\n           운영계획서 구비\n          ▪설립목적\n  6.5.1\n          ▪운영목표 및 운영방침\n 운영계획의\n          ▪사업계획 및 평가\n수립 및 실행                                                          제8장\n          ▪외부환경 변화 등\n         - 운영계획 수립 시 지역사회 또는 이용자들의 욕구와 만족도 조사결과를 반영\n         - 운영계획은 장애인복지관의 중장기 발전계획과 부합되게 수립\n         - 운영계획서를 다양한 방법으로 이용자에게 공개"}, {"p": 600, "t": " ○ 세부기준 6.5.2：운영평가\n\n 세부기준                           세부내용\n          ○ 평가체계를 구축하고 그 결과는 장애인복지관 운영에 반영하여야 하며, 이용자들에게\n            공개하여야 한다.\n  6.5.2    - 장애인복지관 운영 전반에 걸친 정기적 평가와 모니터링을 위한 자체 평가체계 마련\n 운영평가      - 평가결과를 운영계획에 반영\n           - 운영 평가 시 지역사회 또는 이용자들의 욕구와 만족도조사 결과를 참고하며, 평가결과는\n             다양한 방법으로 이용자에게 공개\n\n\n ○ 세부기준 6.5.3：이용자 욕구 및 만족도 조사\n\n 세부기준                           세부내용\n\n  6.5.3 ○ 이용자 욕구와 만족도 조사의 결과를 활용하고 공개한다.\n이용자 욕구   - 장애인복지관은 이용자의 폭넓은 의견을 수렴하기 위하여 다양한 방법을 이용하여 매년\n 및 만족도     이용자의 욕구와 만족도를 조사\n  조사     - 조사결과는 이용자 및 열람을 희망하는 사람들에게 다양한 방법으로 공개\n\n\n기준 6. 문서관리\n\n ○ 세부기준 6.6.1：문서관리\n\n 세부기준                           세부내용\n          ○ 문서관리 규정 또는 지침의 마련을 통한 서비스의 질적 향상을 도모한다.\n  6.6.1\n           - 장애인복지관내의 정보 및 행정기록의 목적, 양식, 내용 등이 명시된 문서관리 규정\n 문서관리\n             또는 지침 마련\n\n\n ○ 세부기준 6.6.2：정보화의 수준\n\n 세부기준                           세부내용\n          ○ 장애인복지관 운영 전반에 걸친 전산화 및 안전장치를 구축한다.\n  6.6.2\n           - 장애인복지관 운영(사업포함)에 걸친 사항의 전산화 구축과 운용(사회복지시설정보시스템\n 정보화의\n             사용 및 사회복지시설정보 시스템과 연동 가능한 전산프로그램 사용 등)\n  수준\n           - 관련 규정 및 지침에 의거한 전산화 안전장치 구축"}, {"p": 601, "t": "                                    Ⅱ. 장애인복지관 서비스 최저기준\n\n\n기준 7. 재무관리\n\n○ 세부기준 6.7.1：회계의 투명성\n\n세부기준                           세부내용\n         ○ 장애인복지관 회계의 투명성 확보를 위한 다양한 노력을 한다.\n 6.7.1\n          - 회계 담당자가 지정되어 있으며, 회계에 관여하는 모든 직원의 재정보증보험 가입\n 회계의\n          - 지출은 예금통장 또는 전자거래기본법에 의한 전자거래로 집행하며, 보조금의 경우 보조금\n 투명성\n            전용카드로 집행"}]}, {"title": "Ⅲ. 장애인 주간이용시설 서비스 최저기준", "start": 602, "end": 615, "subs": [], "pages": [{"p": 602, "t": "     Ⅲ    장애인 주간이용시설 서비스 최저기준\n\n\n 1   총칙\n\n ○ 이 기준은 사회복지사업법 제43조(시설의 서비스 최저기준) 및 같은 법 시행\n     규칙 제27조(시설의 서비스 최저기준)에 따라 장애인주간이용시설(이하\n     “시설”이라 한다)이 제공하는 서비스의 최저기준을 정함을 목적으로 한다.\n\n ○ 이 기준은 장애인주간이용시설이 제공하는 서비스에 대한 최저기준이므로 시설은\n     이 기준을 근거로 현재 제공하고 있는 서비스 수준을 낮출 수 없다.\n\n ○ 시설은 이 기준에서 정하고 있는 사항 외에도 사회복지사업 관련법, 장애인복지\n     및 장애인 관련법, 노동법 등 장애인주간이용시설이 제공하는 서비스와 관련이\n     있는 모든 관계 법령 및 지침을 준수하도록 노력해야 한다.\n\n ○ 이 기준은 중앙정부 및 지방자치단체의 적절한 인력과 시설환경 및 설비\n     제공을 전제로 이행된다.\n\n\n 2 이용인 인권\n\n기준 1. 인격 존중과 정당한 편의제공\n\n 1.1 시설은 서비스 전 과정에서 이용인을 인격체로서 존중해야 하며, 장애 유형\n     및 정도에 따른 정당한 편의를 제공해야 한다.\n\n기준 2. 차별금지\n\n 2.1 시설은 성별, 혈연, 종교, 출신학교, 출생지역, 소득수준, 장애 유형 및\n     정도, 기타 개인적인 선호･특징･조건･지위 등에 따른 차별없이 서비스를\n     제공해야 한다."}, {"p": 603, "t": "                       Ⅲ. 장애인 주간이용시설 서비스 최저기준\n\n\n기준 3. 정보제공\n\n3.1 시설은 이용인에게 서비스 이용에 필요한 정보를 충분히 제공해야 하며,\n   이용인 및 보호자가 개인정보와 기록에 접근할 수 있도록 규정을 마련하여\n   시행해야 한다.\n\n기준 4. 비밀보장\n\n4.1 시설은 개인정보보호 관련 법률과 문서로 작성된 시설의 정책과 규정에\n   따라 이용인 관련 정보를 다루어야 하며, 업무상 알게 된 정보에 대한 비밀을\n   보장해야 한다.\n\n기준 5. 자기결정권\n\n5.1 시설은 이용인이 충분한 정보를 갖고 자신의 삶을 스스로 결정할 수 있도록\n   지원해야 하며, 시설 서비스와 프로그램 전반에 대한 이용인의 자기결정권을\n   존중해야 한다.\n\n5.2 시설은 이용인의 자기결정권 보장을 위해 이용인의 의사소통방법에 맞는\n   방법으로 충분한 정보를 제공해야 한다.\n\n5.3 시설은 이용인의 성적 자기결정권을 존중하며, 이를 위해 충분한 정보를\n   제공해야 한다.\n\n\n3 서비스 상담 및 이용\n\n기준 6. 서비스 기본 원칙\n\n6.1 시설은 서비스 제공의 최우선 가치를 이용인의 의미있는 낮 시간 도모와 삶의           제8장\n   질 향상에 두고, 이용인이 일상생활 및 사회생활을 영위하는 데 필요한 활동\n   위주의 내/외부 프로그램, 취미 및 여가활동, 교육, 개인의 선호를 반영한\n   활동 등을 실시해야 한다."}, {"p": 604, "t": " 6.2 시설은 정당한 이유 없이 서비스 이용을 제한 또는 종료할 수 없으며, 이는\n    서비스 이용을 위한 초기상담 시 안내되어야 한다. 서비스 이용을 제한 또는\n    종료할 때에는 정당한 이유를 설명해야 한다. 정당한 이유에는 당해 시설\n    서비스와 이용인 간 욕구가 부합하지 않는 점, 다른 이용인들에게 심각한\n    피해가 발생하는 점 등이 구체적으로 포함되어야 한다.\n\n 6.3 시설은 중복장애인, 도전적 행동이 있는 장애인, 서비스 이용 거절의 경험이\n    있는 장애인에게 적절한 서비스를 제공하도록 노력해야 한다.\n\n 6.4 시설은 개인의 욕구를 반영한 서비스를 제공하며, 소집단 활동(6인 이하)을 지향\n    해야 한다. 시설의 환경과 조건에 따라 집단활동을 하더라도 이용인의 특성과\n    능력에 따라 개별 목표를 수립하고 지원함을 원칙으로 한다.\n\n 6.5 시설은 만족도 조사, 시설 서비스에 대한 토론, 소그룹 활동과 개별 활동 결정,\n    이용인 대표 선출 등 이용인의 삶과 관련된 사안 및 서비스 전체 과정에서\n    이용인의 참여를 보장해야 한다.\n\n 6.6 시설은 장애 유형과 장애 정도, 생애주기에 따른 이용인의 능력을 예단하지\n    않고, 이용인의 능력 향상과 발전을 위해 다양한 경험과 활동을 제공해야\n    한다.\n\n\n기준 7. 초기 이용 과정\n\n 7.1 시설은 최신 정보에 근거하여 시설의 운영목적, 목표, 철학, 서비스, 서비스\n    제공 조건, 이용인 접수, 사정 및 시설 이용 판정 절차, 시설 이용 종료\n    절차 등이 포함된 규정을 갖추고 운영해야 한다."}, {"p": 605, "t": "                              Ⅲ. 장애인 주간이용시설 서비스 최저기준\n\n\n7.2 시설은 시설 이용 문의를 받았을 때, 다음의 내용을 포함한 정보를 제공\n     해야 한다.\n\n   시설 운영의 목적                서비스 내용과 시설 공간에 대한 설명\n\n   이용 정원                    서비스 이용 대상\n\n   시설 이용 기간                 서비스 이용 개시와 종료 절차\n\n   예상 대기기간                  예비이용 또는 적응기간\n\n   등원, 하원 방법                이용인의 권리와 책임\n\n   시설 이용 요금과 추가 서비스 비용      이의제기 절차\n\n7.3 시설은 적절한 서비스 제공을 위해 필요한 다음의 정보를 수집할 수 있다.\n\n   기본적인 인적사항                 의사소통방법\n                              일상생활 수행능력과 수단적 일상생활\n   사회성 관련 정보\n                               수행능력\n   필요한 교육, 훈련 내용             보호자를 포함한 사회적 관계망\n\n   감각적 특이성                   신체/정신 건강 관련 정보\n\n   장애 관련 필요 장비               필요한 치료와 재활 프로그램\n\n   도전적 행동 유형과 빈도, 강도         도전적 행동 시 대처요령\n\n7.4 시설은 이용계약 전에 예비 이용인에게 예비이용 또는 적응의 기회를 주어야\n     한다. 예비이용 또는 적응 기간은 예비 이용인의 특성에 따라 1개월 이상,\n     3개월 이하의 기간 내에서 결정한다.\n\n\n기준 8. 개인별 지원계획\n8.1 시설은 개인별 지원계획을 수립할 때, 이용인, 이용인의 보호자, 시설종사자\n     등의 참여를 보장해야 한다."}, {"p": 606, "t": " 8.2 시설은 개인별 지원계획 수립에 필요한 다음과 같은 이용인의 개인적인\n      희망과 욕구를 사정하고, 욕구는 정기적(12개월 이내)으로 점검해야 한다.\n\n    일상생활 능력의 변화             신체적, 정신적, 심리적 건강의 변화\n\n    사회성의 변화                 강점, 능력, 욕구, 선호도 등의 변화\n\n    서비스 목표의 변화              이용인과 보호자 등으로부터 확인된 정보\n\n 8.3 시설은 개인별 지원계획 수립에 필요한 정보를 상세하게 수집해야 하며,\n      이용인과 이용인의 보호자, 관련 전문가의 의견과 욕구를 충분히 파악해야\n      한다.\n\n 8.4 시설은 시설에서 실행하는 개인별 지원계획이 가정과 지역사회시설 등에서도\n      연결하여 일관되게 실행될 수 있도록 구체적인 지원방법과 내용을 다음의\n      사람들과 공유하고, 협력체계를 구축하기 위해 노력해야 한다.\n\n    이용인의 보호자\n\n    활동지원사, 재활치료사, 사회복지 종사자, 자원봉사자 등 이용인 지원 관련인\n    지역사회 편의시설(편의점, 마트, 카페, 약국, 베이커리 등)\n\n 8.5 시설은 수립된 개인별 지원계획은 문서로 작성하고 정기적(12개월 이내)으로\n      점검해야 한다.\n\n 8.6 시설은 집단활동을 진행할 경우에도 이용인의 개별적 특성을 고려한 개별\n      목표를 수립하고, 실행, 평가해야 한다.\n\n\n기준 9. 식사 지원\n\n 9.1 시설은 식단 구성 시 이용인의 개인별 기호 및 특성을 파악하여 반영해야\n      하며, 다양한 식사를 제공해야 한다.\n\n 9.2 시설은 스스로 식사하기 어려운 이용인에게 식사 지원을 해야 한다."}, {"p": 607, "t": "                        Ⅲ. 장애인 주간이용시설 서비스 최저기준\n\n\n9.3 시설은 이용인에게 질 높은 음식을 제공하기 위해 식재료 구매주기를 짧게\n   하고, 위생적으로 관리해야 하며, 유통기한은 수시로 점검해야 한다. 직접\n   조리하지 않고 시설 외부에서 음식을 조달받을 때도 음식의 안전과 위생을\n   검검해야 한다.\n\n9.4 시설은 이용인에게 충분한 식사시간을 제공해야 한다.\n\n\n기준 10. 일상생활 지원\n\n10.1 시설은 일상생활지원 등 모든 서비스를 제공함에 있어 개인의 특성과\n    욕구를 고려해야 한다.\n\n10.2 시설은 이용인의 손 위생을 위해 손 씻기가 습관이 될 수 있도록 지원하고,\n    감염병 예방을 위해 시설 내에 관련 물품(손 소독제, 마스크 등)을 비치하고,\n    질병관리청의 감염병 유형별 대응지침을 준수해야 한다.\n\n10.3 시설은 스스로 양치하기 어려운 이용인의 경우 양치 지원을 해야 한다.\n\n10.4 시설은 배변 활동이 어려운 이용인에게 개별적 지원을 해야 하며, 지원이\n    필요한 경우 사생활 보호를 위해 노력해야 한다.\n\n10.5 시설은 시설 내･외부를 청결하게 유지해야 하며, 시설 설비 및 개인 물품은\n    위생적으로 관리해야 한다.\n\n\n기준 11. 건강관리\n\n11.1 시설은 연간 사업계획 수립 시 건강관리가 필요한 이용인에 대하여 건강\n    관리 계획을 수립하며, 결과는 이용인과 보호자에게 공유해야 한다.\n11.2 시설은 시설 운영 시간 중 이용인의 건강 관련 특이사항이 있는지 유심히\n    살펴보아야 하며, 특이사항 발생 시에는 즉시 지원 및 대응하고, 그 과정과\n    결과를 자세하게 기록하고, 이용인과 보호자에게 공유해야 한다."}, {"p": 608, "t": " 11.3 시설은 시설 내에서 발생하는 응급상황에 대처할 수 있도록 다음 내용을\n        포함한 계획을 수립하여 잘 보이는 곳에 게시하고, 이용인과 이용인의\n        보호자에게 안내해야 한다.\n\n    보건소 등 외부 의료기관과의 비상연락체계\n    관할 시･군･구와의 비상연락체계\n    응급상황에 따른 직원의 업무분장 내용\n\n 11.4 시설은 응급환자 발생 시 처치를 위한 구급약을 구비하고, 구급약과 시설\n        에서 관리하는 일반의약품의 유통기한을 정기적으로 확인해야 한다.\n\n 11.5 시설은 약물복용이 필요한 이용인의 경우, 사전에 투약 의뢰서를 받고\n        보호자의 동의하에 정해진 시간에 정량을 복용할 수 있도록 지원해야 한다.\n        단, 응급처치를 제외한 의료인이 해야 하는 처치나 의료적 행위를 해서는 안\n        된다.\n\n 11.6 시설은 뇌전증 등 만성적이고 반복적으로 발생하는 질환이 있는 이용인에\n        대해서는 관련 질환의 전조증상, 증상 발생 시 대처 방안 등을 문서로\n        작성하고, 보조인력을 포함한 모든 직원이 문서에 따라 대처할 수 있도록\n        주기적(분기별 1회 이상)으로 연습해야 한다.\n\n기준 12. 여가･취미 활동\n\n 12.1 시설은 이용인의 여가･취미 활동을 지원함에 있어 이용인의 생애주기,\n        장애유형과 정도를 고려해야 하며, 이용인이 즐겁게 참여할 수 있도록\n        이용인의 흥미와 취향에 맞게 활동을 구성해야 한다.\n 12.2 시설은 이용인이 활동을 통해 성취감을 느끼고 능력을 향상할 수 있도록 지원\n        해야 한다.\n\n 12.3 시설은 여가･취미 활동 계획과 실행 시 장애에 대한 이해정도가 높은 외부\n       전문 강사, 외부 서비스 제공기관, 외부 프로그램 등 지역사회 자원을 연계하여\n       활용하기 위해 노력해야 한다."}, {"p": 609, "t": "                        Ⅲ. 장애인 주간이용시설 서비스 최저기준\n\n\n기준 13. 교육\n\n13.1 시설은 이용인의 생애주기, 성별, 장애 유형 및 정도에 따라 다양한 교육･\n    훈련을 진행해야 한다.\n\n13.2 시설은 성교육, 인권교육 등의 교육 내용이 이용인에게 잘 전달되도록\n    필요한 지원을 해야 하며, 교육 종료 후 이용인의 의견을 청취해야 한다.\n\n13.3 시설은 이용인이 성인기에 경험할 수 있는 직업을 체험하거나 훈련하는\n    경우에는 이용인이 수행 가능한 활동이 되도록 지원해야 한다.\n\n13.4 시설은 교양교육 및 일상생활 관련 교육을 통해 이용인이 일상생활에서\n    적용할 수 있는 기술과 정보를 습득할 수 있도록 지원해야 한다.\n\n13.5 시설은 교육･훈련 활동 계획과 실행 시 장애에 대한 이해정도가 높은 외부\n    전문 강사, 외부 서비스 제공기관, 외부 프로그램 등 지역사회 자원을 연계하여\n    활용하기 위해 노력해야 한다.\n\n\n4 지역사회 연계\n\n기준 14. 지역사회 활동\n\n14.1 시설은 이용인이 자신감을 향상하고, 주체적으로 사회활동에 참여할 수\n    있도록 지역사회 중심의 다양한 체험활동을 제공해야 한다.\n\n14.2 시설은 지역사회 활동의 효과를 높이기 위해 소집단(6인 이하)으로 활동할 수\n    있도록 노력해야 한다.\n\n14.3 시설은 지역사회 활동이 단순 체험에 그치지 않고, 반복적인 활동을 통해\n    이용인이 실제로 지역사회에서 생활할 수 있는 능력을 향상할 수 있도록               제8장\n    주기적인 활동으로 계획하고 실행해야 한다.\n\n14.4 시설은 축제 등 지역사회에서 진행되는 행사에 이용인이 지역사회 일원으로\n    참여할 기회를 제공하기 위해 노력해야 한다."}, {"p": 610, "t": " 14.5 시설은 의사소통에 어려움이 있는 이용인의 지역사회 활동을 지원하기 위해\n        이용인이 이해하기 쉬운 형태의 도구를 적극 활용해야 한다.\n\n 14.6 시설은 이용인이 지역사회에서 활발하게 활동할 수 있도록 지역사회의\n        다양한 자원을 연계하기 위해 노력해야 한다.\n\n\n기준 15. 자원봉사\n\n 15.1 시설이 자원봉사자를 활용하는 경우에는 교육자료를 마련하여 사전에\n        교육･훈련하고, 자원봉사자의 활동과 실적을 기록 및 관리하는 절차를\n        갖추어야 한다.\n\n\n 5 시설 환경\n\n기준 16. 시설 접근성\n\n 16.1 시설은 모든 이용인 및 보호자 등이 접근하는 데 위험과 어려움이 없어야\n        한다.\n\n 16.2 시설은 이용인의 욕구가 있을 시, 이용인의 접근성 강화를 위해 송영지원\n        (차량지원)을 하거나, 외부자원(교통약자이동지원차량, 장애인활동지원사의\n        차량, 협약된 택시 등)을 이용할 수 있도록 연계하기 위해 노력해야 한다.\n\n\n기준 17. 공간 구성\n\n 17.1 시설은 이용인이 서비스를 쾌적한 분위기에서 편리하게 이용할 수 있도록\n        환경을 구성해야 하며, 건물 공간은 ｢장애인복지법 시행규칙｣등 법적\n        기준에 부합하도록 갖추어야 한다.\n\n 17.2 시설은 정원에 맞는 공간을 확보해야 한다. (1인당 9.9㎡ 권장)"}, {"p": 611, "t": "                        Ⅲ. 장애인 주간이용시설 서비스 최저기준\n\n\n17.3 시설은 이용인이 시설 이용에 불편함이 없도록 장애특성을 고려하여 공간을\n    구성해야 한다.\n\n17.4 시설은 이용인의 개인 물품을 보관할 수 있는 사물함을 마련해야 하며,\n    이용인이 휴식을 취할 수 있는 별도의 공간을 마련하기 위해 노력해야 한다.\n\n17.5 시설은 도전적 행동 등으로 개별지원이 필요한 이용인에게 맞는 공간을\n    마련하기 위해 노력해야 한다.\n\n\n기준 18. 편의시설\n\n18.1 시설은 이용인이 서비스를 이용하는 데 불편이 없도록 관련 법령에 따라\n    편의시설을 갖추거나 편의시설 설치를 위한 구체적 계획을 가지고 있어야\n    한다.\n\n18.2 시설은 ｢장애인･노인･임산부 등의 편의증진보장에 관한 법률｣에 따른\n   편의시설을 갖추어야 한다.\n\n\n기준 19. 쾌적한 환경 조성\n\n19.1 시설은 내･외부 환경을 항상 청결하게 유지해야 한다.\n\n19.2 시설은 이용인의 건강과 위생을 위해 정기적인 실내 소독을 해야 한다.\n\n19.3 시설은 이용인이 쾌적한 환경에서 활동에 참여할 수 있도록 자연 채광,\n    조명 등 적절한 조도, 난방과 냉방 등의 적절한 온도가 되도록 관리해야\n    한다.\n\n19.4 시설은 실내 공기 질 관리를 위해 통풍과 환기가 원활하도록 관리해야 한다."}, {"p": 612, "t": " 6 시설 운영\n\n기준 20. 핵심가치와 비전\n\n 20.1 시설은 시설의 사명을 성공적으로 수행하는 미래 모습을 담은 비전, 시설\n        운영 목적과 목표를 수립하고, 문서를 통해 명확히 기술해야 한다.\n\n\n기준 21. 운영위원회\n\n 21.1 시설은 다음의 사항을 심의하기 위해 이용인, 이용인 보호자 대표, 지역주민\n        또는 후원자 대표, 관계 공무원, 직원 대표 등으로 구성된 운영위원회를 구성\n        하여 운영해야 한다.\n\n    시설운영계획의 수립 및 평가          프로그램 개발 및 평가\n    이용인 생활환경 개선 및 고충처리       이용인과 직원의 인권보호 및 권익증진\n    시설과 지역사회와의 협력            직원의 근무환경 개선 등\n\n 21.2 시설은 운영위원회 개최 결과를 직원, 이용인 및 보호자, 운영위원 등이\n        알 수 있도록 공지해야 한다.\n\n\n기준 22. 사업계획 및 관리\n\n 22.1 시설은 이용인과 보호자의 의견을 반영하여 연간 사업계획을 수립하고,\n        문서화하여 이용인과 보호자에게 공유해야 한다.\n\n 22.2 시설은 시설 운영 및 서비스 제공과 관련된 행정정보를 기록하고, 법률과\n        시설 규정에 따라 관리해야 한다.\n\n 22.3 시설은 사례 및 행정기록의 목적, 양식, 내용 등이 명시된 문서 관리 규정을\n        마련하고, 그에 따라 서비스의 질을 관리해야 한다."}, {"p": 613, "t": "                       Ⅲ. 장애인 주간이용시설 서비스 최저기준\n\n\n기준 23. 재무관리\n\n23.1 시설은 재무와 회계를 투명하게 관리하고, 운영위원회 보고와 법인의\n    승인의 얻어 집행하고 관리해야 한다.\n\n23.2 시설은 모든 정보를 정당하고 투명하게 취득･관리해야 하며, 회계기록 등의\n    정보는 ｢사회복지법인 및 사회복지시설 재무회계규칙｣에 의해 정확하고\n    투명하게 기록･관리해야 한다.\n\n23.3 시설은 회계 담당자를 지정하고, 회계에 관여하는 모든 직원의 재정보증\n    보험에 가입해야 한다.\n\n23.4 시설은 예금통장 또는 전자거래기본법에 의한 전자거래를 통해 지출하며,\n    보조금은 보조금 전용카드로 집행해야 한다.\n\n23.5 시설은 투명한 운영을 위해 예산 및 결산, 후원금, 사업내용 등에 관한\n    정보를 소식지, 인터넷 홈페이지 등을 통해 매년 공개해야 한다.\n\n\n7   시설 안전관리\n\n기준 24. 안전관리의 기본 원칙\n\n24.1 시설은 이용인이 서비스를 이용하는 과정에서 직･간접적으로 발생할 수\n    있는 신체적･정신적 불편이나 위험･위해 등으로부터 이용인을 보호해야\n    하며, 이용인의 안전을 보장해야 한다.\n\n24.2 시설은 이용인의 안전 관련 위급상황 시 연락할 수 있는 비상연락망과\n    위급상황에 대처할 수 있는 직원의 업무분장 내용을 포함한 시설안전계획을\n    수립해야 한다.\n24.3 시설은 모든 이용인과 직원이 참여하는 화재 등 위급상황 대처 훈련을\n    정기적(분기별 1회 이상)으로 실시해야 하며, 모든 직원은 위급상황 대처\n    방법을 숙지하고 있어야 한다."}, {"p": 614, "t": " 24.4 시설은 시설 내에서 발생하는 화재 등 위급상황에 대처할 수 있도록 다음\n        내용을 포함한 시설안전계획을 수립하여 잘 보이는 곳에 게시해야 한다.\n\n    소방서와의 비상연락체계          관할 시･군･구와의 비상연락체계\n    비상대피도                 위급상황에 따른 직원의 업무분장 내용 등\n\n\n기준 25. 시설 안전점검\n\n 25.1 시설은 안전담당자를 지정하여 정기 또는 수시로 안전점검을 실시하고,\n        점검결과를 기록 관리해야 한다.\n\n 25.2 시설 건물은 안전기준에 부합되며, 최소 1년에 1회 이상 정기 안전점검을\n        실시하고, 안전사고에 대비하여 대인 및 대물에 대한 안전보험 및 화재보험\n        (종합보험)에 가입되어 있어야 한다.\n\n\n기준 26. 안전한 환경 조성\n\n 26.1 시설은 ｢소방법｣에 따른 소방설비를 설치 및 관리해야 한다.\n\n 26.2 시설은 피난 통로 및 소방시설 주위에 장애물을 적재하지 않도록 관리해야\n        한다.\n\n 26.3 시설은 비상대피로 안내 표지판을 이용인의 장애 유형과 의사소통방법에\n        적합한 방식으로 게시해야 한다.\n\n 26.4 시설은 시설 내･외부에 설치된 설비의 위험요소를 이용인의 장애 유형과\n        의사소통방법에 적합한 방식으로 공지해야 한다.\n\n 26.5 시설은 이용인 및 직원의 추락 등의 위험에 대비한 안전장치를 설치해야 한다."}, {"p": 615, "t": "                       Ⅲ. 장애인 주간이용시설 서비스 최저기준\n\n\n8 시설의 인력관리\n\n기준 27. 직원 채용 및 전문성\n\n27.1 시설은 적법한 절차와 시설의 공식적인 규정(직원에 대한 자격기준, 채용\n   절차 명문화, 공개채용, 인사위원회 구성 등)에 따라 업무수행능력을 갖춘\n   직원을 채용해야 한다.\n\n27.2 시설은 이용인의 욕구 충족과 서비스 질 향상을 최우선으로 고려하여\n   직원의 업무를 배정해야 한다.\n\n27.3 시설은 시설의 규정에 따라 업무분장표를 작성하여 보관해야 하며, 이에\n   따라 직원의 역할과 업무가 수행되어야 한다.\n\n\n기준 28. 훈련과 개발\n\n28.1 시설은 직원 개개인의 기술과 전문성 향상을 위한 직원교육 계획을 수립하고\n   시행해야 한다.\n\n28.2 시설은 직원이 적극적으로 교육에 참여할 수 있는 환경을 조성해야 하며,\n   교육 후에는 평가를 실시하고 평가결과를 다음 교육에 반영해야 한다.\n\n28.3 시설은 매년 직원의 직무 성과와 직무 수행능력을 반영하여 업무를 조정\n   해야 한다."}]}, {"title": "Ⅳ. 장애인 직업재활시설 서비스 최저기준", "start": 616, "end": 625, "subs": [], "pages": [{"p": 616, "t": "  Ⅳ       장애인 직업재활시설 서비스 최저기준\n\n\n                       Ⅰ. 총 칙\n\n총칙 1. 목적\n\n 이 기준은 사회복지사업법 제43조(시설의 서비스 최저기준) 및 같은 법 시행규칙\n제27조(시설의 서비스 최저기준)에 따라 장애인직업재활시설(이하“시설”이라 한다)이\n제공하는 서비스의 최저기준을 정함을 목적으로 한다.\n\n\n총칙 2. 최저기준의 준수\n\n 1. 이 기준은 장애인직업재활시설이 제공하는 서비스에 대한 최저기준이므로 시설은\n   이 기준을 이유로 서비스 수준을 낮출 수 없다.\n\n 2. 시설은 이 기준에서 정하고 있는 사항 외에도 사회복지사업법령, 장애인복지\n   법령 및 기타 장애인관련법령, 근로기준법령 등 장애인직업재활시설이 제공하는\n   서비스와 관련이 있는 모든 관계 법령 및 지침 등을 준수하여야 한다.\n\n\n                     Ⅱ. 이용자의 인권\n\n\n기준 1. 인격의 존중과 정당한 편의제공\n\n 2.1.1. 이용자 및 이용자의 가족 등은 서비스 제공과정에서 인격체로서 존중받아야\n        하며, 장애의 유형 및 정도에 따라 정당한 편의제공을 받아야 한다."}, {"p": 617, "t": "                         Ⅳ. 장애인 직업재활시설 서비스 최저기준\n\n\n기준 2. 차별금지\n\n2.2.1. 이용자 및 이용자의 가족 등이 서비스를 제공받음에 있어 성별, 혈연,\n    종교, 출신학교, 출신지역, 소득수준, 장애유형 및 정도, 기타 개인적인\n    선호･특징･조건･지위 등에 따라 차별대우를 받아서는 아니된다.\n\n\n기준 3. 정보제공\n\n2.3.1. 이용자 및 이용자의 가족 등에게 서비스 이용에 필요한 정보를 충분히\n    제공하여야 하며, 이용자 및 이용자의 가족 등은 개인정보와 기록에 대하여\n    자유롭게 접근할 수 있어야 한다.\n2.3.2. 이용자 및 이용자의 가족 등이 제공받는 정보에는 시설의 서비스 제공 목적,\n    서비스 이용방법(기한, 이용료, 내용 등), 이용자의 권리 및 준수사항 등이\n    포함되며, 정보제공을 위한 원칙과 기본계획이 수립되어야 한다.\n\n\n기준 4. 비밀보장\n\n2.4.1. 이용자와 관련된 정보는 문서화되어 기관의 원칙과 절차에 따라 관리되고\n    비밀이 보장되어야 한다.\n\n\n기준 5. 자기결정권\n\n2.5.1. 시설은 이용자가 충분한 정보를 갖고 자신의 삶을 스스로 결정할 수 있도록\n    지원하여야 하며, 이용자의 자기결정권을 존중해야 한다.\n2.5.2. 시설 이용자는 성적 자기결정권을 가지며, 시설 임직원은 이용자에게 성적 유혹\n    및 성적 수치심을 유발시키는 행위를 하여서는 아니 된다."}, {"p": 618, "t": "                      Ⅲ. 시설의 환경\n\n\n기준 1. 시설의 접근성\n\n 3.1.1. 시설은 모든 이용자, 이용자 가족 등이 접근하는데 용이하여야 한다.\n\n\n기준 2. 시설의 환경\n\n 3.2.1. 서비스가 제공되는 환경은 이용자가 쾌적한 분위기 속에서 편리하게\n        이용할 수 있어야 하며, 건물의 공간은 ｢장애인복지법 시행규칙｣ 등 법적\n        기준에 부합하도록 제공되어야 한다.\n 3.2.2. 시설은 법적 기준에 따라 사무실, 재활상담실, 집단활동실(자원봉사자실),\n        화장실, 급배수시설, 비상재해 대비시설, 작업실 등과 같은 설비가 확보\n        되어야 한다.\n 3.2.3. 시설의 최소설비 기준과 관련하여 보호작업장, 직업적응훈련시설은 부대\n        시설을 포함하여 최소 90제곱미터 이상, 근로사업장은 부대시설을 포함\n        하여 최소 430제곱미터 이상이어야 하며, 작업실이나 작업활동 프로\n        그램실(직업적응훈련시설의 경우 훈련실)의 면적은 기계설비를 제외하고\n        장애인 1명당 2.0제곱미터 이상이어야 한다.\n 3.2.4. 시설이 작업활동 프로그램을 운영하려는 경우에는 보호작업장의 작업실\n        규모를 충족하여야 한다.\n\n\n기준 3. 편의시설\n\n 3.3.1. 장애를 가진 이용자가 서비스를 이용하는데 불편이 없도록 관련 법령에\n        따라 편의시설이 갖추어져 있거나 편의시설 설치를 위한 구체적 계획을\n        가지고 있어야 한다."}, {"p": 619, "t": "                        Ⅳ. 장애인 직업재활시설 서비스 최저기준\n\n\n                 Ⅳ. 시설의 운영\n\n\n기준 1. 핵심가치와 비전\n\n4.1.1. 성공적으로 조직의 사명을 수행하는 조직 미래의 모습을 담은 조직의\n    비전과 시설 운영 목적, 목표가 수립되어 있고, 문서를 통해 명확히 기술\n    되어 있어야 한다.\n\n\n기준 2. 법인이사회\n\n4.2.1. 법인이사회는 조직의 장･단기계획을 세우는데 직･간접적으로 관여하여야\n    하며, 조직의 사명과 비전을 결정하고 이에 관련한 목적과 목표를 설정\n    하고 결정하여야 한다.\n4.2.2. 법인이사회의 구성원은 조직의 사명에 헌신해야 하며, 조직의 사명을\n    달성하는데 필요한 능력을 갖추어야 한다.\n\n\n기준 3. 운영위원회\n\n4.3.1. 시설운영계획의 수립 및 평가, 프로그램 개발 및 평가, 종사자 근무환경\n    개선, 이용자 생활환경 개선 및 고충처리, 이용자 인권보호 및 권익증진,\n    지역사회 협력 등에 대한 사항을 논의하기 위해 시설이용자 또는 시설\n    이용자 보호자 대표, 지역주민, 후원자 대표, 관계 공무원 등으로 운영\n    위원회를 구성하여야 한다.\n4.3.2. 운영위원회 개최 결과는 직원, 이용자 및 운영위원 등이 알 수 있도록\n    공지하여야 한다.                                            제8장"}, {"p": 620, "t": "기준 4. 사업계획 및 관리\n\n 4.4.1. 시설의 연중 사업계획이 수립되어 문서화되어 있어야 하며, 사업계획에\n        따라 서비스가 제공되어야 한다.\n 4.4.2. 시설 운영 및 서비스 제공과 관련된 행정 정보들을 기록하고, 원칙과 법에\n        따라서 관리하여야 한다.\n 4.4.3. 시설은 사례 및 행정기록의 목적, 양식, 내용 등이 명시된 정보(문서) 관리\n        지침을 문서화하여 이를 통해 서비스의 질을 관리하여야 한다.\n\n\n기준 5. 평가\n\n 4.5.1. 시설은 매3년에 한번씩 ｢사회복지사업법｣이 정하는 바에 따라 정기적으로\n        평가를 받아야 하고, 평가결과를 이듬해 사업계획에 반영하여 개선의\n        노력을 하여야 한다.\n\n\n기준 6. 재무관리\n\n 4.6.1. 시설은 국가나 지방자치단체로부터 지원받은 보조금을 운영위원회의\n        보고를 통해 집행하고 관리하여야 한다.\n\n\n기준 7. 시설 투명성\n\n 4.7.1. 시설은 모든 정보를 정당하고 투명하게 취득･관리하여야 하며, 회계기록\n        등의 정보는 ｢사회복지법인 및 사회복지시설 재무회계규칙｣에 의거하여\n        정확하고 투명하게 기록･관리하여야 한다.\n 4.7.2. 시설의 투명한 운영을 위해 예산 및 결산, 후원금, 사업내용 등에 관한\n        정보를 소식지 또는 인터넷 홈페이지 등을 통해 매년 공개하여야 한다."}, {"p": 621, "t": "                        Ⅳ. 장애인 직업재활시설 서비스 최저기준\n\n\n                 Ⅴ. 시설의 안전관리\n\n\n기준 1. 안전관리의 기본 원칙\n\n5.1.1. 이용자는 시설의 서비스 제공 과정에서 직･간접적으로 발생할 수 있는\n    신체적･정신적 불편이나 위험･위해 등으로부터 보호받아야 하며, 시설은\n    이용자의 안전을 보호하여야 한다.\n\n\n기준 2. 시설의 안전점검\n\n5.2.1. 시설 건물은 안전기준에 부합되며, 최소 1년에 1회 이상 정기 안전점검을\n    실시하여야 하고, 안전사고에 대비하여 대인 및 대물에 대한 안전보험\n    및 화재보험(종합보험)에 가입되어 있어야 한다.\n\n\n기준 3. 시설 및 설비 위험요소에 대한 고지\n\n5.3.1. 시설 내외부에 설치된 설비의 위험요소를 신체장애, 감각장애 등 장애\n    유형에 적합한 방식을 채택하여 모든 이용자에게 알려야 한다.\n\n\n                 Ⅵ. 시설의 인력관리\n\n\n기준 1. 직원 채용 및 전문성\n\n6.1.1. 시설은 관련 법령 및 지침에 따라 직원을 채용･배치하여 이용자들에게             제8장\n    충분한 서비스를 제공하여야 한다.\n6.1.2. 시설의 직원은 조직이 달성하고자 하는 목적에 부합하도록 ｢장애인복지법\n    시행규칙｣ 등 관련 법령에서 정하고 있는 자격기준을 충족하여야 한다."}, {"p": 622, "t": " 6.1.3. 시설은 적법한 절차와 시설의 공식적인 지침(직원에 대한 자격기준 명시,\n        채용절차 명문화, 공개채용, 인사위원회 구성 등)에 따라 수행능력을 갖춘\n        직원을 채용하여야 한다.\n\n\n기준 2. 훈련과 개발\n\n 6.2.1. 시설은 직원 개개인의 기술과 전문성을 향상시킬 수 있도록 직원 교육에\n        대한 계획을 수립하고 직원이 적극적으로 교육에 참여할 수 있는 환경을\n        조성하여야 하며, 교육실시 이후 매년 평가가 이루어져야 한다.\n 6.2.2. 시설의 규정에 따라 업무분장표가 작성되어 보관되어야 하며, 이에 따라\n        직원의 역할과 업무가 수행되어야 한다.\n 6.2.3. 시설은 매년 직원평가를 실시하여 평가결과를 반영하는 인사평가 체계를\n        갖추어야 한다.\n\n\n                     Ⅶ. 지역사회 연계\n\n\n기준 1. 자원봉사\n\n 7.1.1. 시설에서 자원봉사자를 활용하는 경우에는 매뉴얼화된 교육자료로 사전\n        교육･훈련을 실시하고, 자원봉사자의 활동과 실적이 기록 및 관리되는\n        절차를 갖추어야 한다.\n\n\n기준 2. 시설의 개방\n\n 7.2.1. 지역사회 및 지역주민이 시설을 방문하거나 시설의 기자재와 설비 등을\n        이용할 수 있도록 시설개방에 대한 지침이 마련되어야 한다."}, {"p": 623, "t": "                        Ⅳ. 장애인 직업재활시설 서비스 최저기준\n\n\n                   Ⅷ. 서비스\n\n\n기준 1. 서비스의 기본 원칙\n\n8.1.1. 시설의 서비스는 이용자의 자활･자립를 도모하고 고용기회를 제공하여\n    이용자의 삶의 질을 향상시키는 것에 최우선 가치를 두어야 한다.\n8.1.2. 시설의 서비스를 제공받을 수 있는 이용자가 한정되어 있을 경우 재가\n    장애인, 중증장애인 및 여성장애인이 우선적으로 서비스를 제공받을 수\n    있도록 해야 한다.\n\n\n기준 2. 서비스 과정\n\n8.2.1. 시설의 서비스를 제공받고자 하는 이용자의 접수, 진단 및 판정 절차에\n    대해 문서화된 규정이 있어야 한다.\n8.2.2. 이용자 및 이용자 가족은 서비스의 계획, 제공 내용, 평가과정 등에 자유\n    롭게 참여하여 의견을 충분히 제시할 수 있어야 하며, 시설은 개인별\n    직업재활계획서 수립에 필요한 사항을 반영할 수 있다.\n\n\n기준 3. 서비스의 제공\n\n8.3.1. 이용자의 서비스에 대한 욕구를 사정하기 위한 기준과 절차가 문서화\n    되어야 하며, 이를 근거로 개별화된 서비스 제공 계획을 수립하여야 한다.\n8.3.2. 개별화된 계획에 대한 평가가 이루어지고, 평가결과를 계획에 반영하도록\n    하며, 이러한 내용이 문서화되어야 한다.\n8.3.3. 이용자의 개별적 욕구와 문제에 따라 지역사회 내 다양한 서비스와 자원을\n    체계적으로 연계, 제공, 점검하는 종합적인 사례관리 시스템을 갖추기\n    위해 노력하여야 한다."}, {"p": 624, "t": "기준 4. 작업활동 프로그램\n\n 8.4.1. 시설이 작업활동 프로그램을 운영할 때는 기관 특성, 이용자의 욕구 및\n        특성을 반영한 프로그램에 대한 계획을 수립하고 운영위원회 심의 의결\n        및 지방자치단체에게 제출하여야 하며, 주 20시간 이상 훈련을 실시\n        하여야 한다.\n 8.4.2. 시설은 작업활동 프로그램을 운영함에 있어 일상생활훈련, 사회적응훈련,\n        작업훈련, 직업평가, 통근훈련, 취미 및 여가활동, 이외 작업기능을 향상\n        시킬 수 있는 프로그램 등을 실시하여 장애인보호작업장 또는 장애인\n        근로사업장이나 그 밖에 일반 고용시장으로 전이될 수 있도록 노력하여야\n        한다.\n\n\n기준 5. 재활프로그램\n\n 8.5.1. 재활프로그램을 운영하고자 하는 근로사업장은 시설의 특성, 이용인의\n        장애 정도, 유형, 특성 등을 반영하여 재활프로그램 운영계획을 수립하여\n        사회적응훈련, 직무기능 향상훈련, 작업태도 및 기술훈련, 직무개발 및\n        경쟁적인 고용시장으로의 전이를 위한 조치를 하여야 한다. (근로사업장에\n        한함)\n 8.5.2. 재활프로그램을 운영하고자 하는 보호작업장은 시설의 특성, 이용인의\n        장애 정도, 유형, 특성 등을 반영하여 직업적응훈련, 문제해결훈련, 직업\n        평가, 직무기능 향상훈련, 지역사회 자원활용 훈련 등을 주8시간 이상\n        실시하여야 한다.\n\n\n기준 6. 서비스 결과\n\n 8.6.1. 시설 이용자의 만족도 조사를 연 1회 이상 실시하고, 그 결과를 기록,\n        보관하며 시설운영 및 서비스 개발 등에 반영한다."}, {"p": 625, "t": "                        Ⅳ. 장애인 직업재활시설 서비스 최저기준\n\n\n                  Ⅸ. 근로장애인\n\n\n기준 1. 근로장애인의 권리\n\n9.1.1. 시설은 근로장애인에게 ｢근로기준법｣이 정하는 바에 따라 근로의 권리\n    및 근로조건을 보장하여야 한다.\n\n9.1.2. 시설은 ｢최저임금법｣에 따라 근로장애인에게 최저임금을 지급해야 하며,\n    부득이 최저임금을 지급할 수 없는 경우 같은 법에 따라 최저임금 적용\n    제외 인가를 받아야 한다.\n\n9.1.3. 시설은 근로장애인에 대한 임금지급 수준을 향상시키기 위해 외부 자원의\n    개발 및 시설 생산품의 판매 촉진에 노력하여야 한다.\n\n9.1.4. 근로장애인은 부당한 지시를 받아서는 아니되며, 근로장애인은 근로과정과\n    관련된 정당한 지시에 순응하되 부당한 지시는 거절할 수 있다.\n\n\n기준 2. 근로장애인의 선발\n\n9.2.1. 시설을 이용하고자 하는 이용자(근로장애인)를 선발할 때 객관적인 기준에\n    근거한 선발 체계가 갖추어져 있어야 하며, 이에 대한 내용이 문서화되어\n    보관되어야 한다.\n9.2.2. 시설은 ｢근로기준법｣이 정하는 바에 따라 근로장애인과 근로계약을 체결\n    해야 한다.\n\n\n기준 3. 고충처리\n9.3.1. 시설은 근로장애인의 고충처리 및 개선을 위한 지침을 마련하여야 하고,\n    고충처리를 위한 담당직원을 배치해야 하며, 고충과 관련한 개선 결과를\n    기록 및 관리하여야 한다."}]}, {"title": "Ⅴ. 지방계약법 및 보조금 관리 관련 규정", "start": 626, "end": 629, "subs": [], "pages": [{"p": 626, "t": "  Ⅴ      지방계약법 및 보조금 관리 관련 규정\n\n\n가. 입찰 및 계약 방법\n\n 1) 입찰공고는 지방자치단체를 당사자로 하는 계약에 관한 법률(이하 ʻ지방계약법ʼ)에\n   따라 지정정보처리장치를 이용하여 공고(해당 지방자치단체가 설치･운영하는 인터넷\n   홈페이지를 이용한 공고 병행 가능)\n   계약방법은 사회복지법인 및 사회복지시설 재무･회계규칙 제30조의 2 규정에 따라\n   지방계약법 규정 준용\n\n  (가) 지명경쟁의 경우\n  ○ 추정가격이 3억원 이하(종합공사) 또는 1억원 이하인 공사(전문공사)\n  ○ 추정가격이 5천만원 이하인 재산 매각 또는 매입 등\n\n  (나) 수의계약의 경우\n\n  ○ 추정가격이 2억원 이하(종합공사) 또는 1억원 이하인 공사(전문공사)\n\n  ○ 추정가격이 5천만원 이하인 물품의 구매･용역 기타 계약의 경우 등\n\n 2) 일반경쟁을 피하기 위한 불필요한 분할 수의계약 발주 금지\n\n 3) 시설공사는 각 개별법령에 따라 소방시설공사, 전기공사, 정보통신공사, 건축공사\n   등 분리 발주하여야 함\n\n 4) 장비 구입은 적정한 가격과 투명성 제고를 위해 나라장터를 통한 물품 계약을 권장하며,\n   수의계약이 불가피한 경우에는 비교 견적을 통해 단가 적정성을 확인하고, 반드시\n   관할 시･군･구의 장애인복지담당부서와 감사담당부서로 부터 계약적정성에 대한 사전\n   검토를 받도록 하고, 납품시에도 시･군･구 담당자 입회하에 납품을 검수토록 함.\n   * 장비구입비 부적정 집행 사례：후원 물품이나 사용 중인 물품을 실제 구입한 것처럼 허위 조작,\n     물품 거래 시 계약한 물품 목록과 실제 납품 목록을 다르게 허위로 작성"}, {"p": 627, "t": "                        Ⅴ. 지방계약법 및 보조금 관리 관련 규정\n\n\n나. 입찰의 참가 자격 및 낙찰자 결정\n\n1) 경쟁입찰에 있어 부당한 제한으로 인한 참여업체 제한 금지\n\n○ 지방계약법시행령 제13조의 규정에 의한 입찰의 참가자격외의 요건을 별도로\n  정하여 같은법 시행규칙 제17조의 규정에서 정하고 있는 입찰참가를 제한\n  하여서는 안됨\n\n○ 단, 장애인거주시설 기능보강 사업 계약에 있어 계약상대자가 정당한 이유없이\n  계약상 의무를 이행하지 아니한 경우(계약을 포기)에는 지방계약법 시행규칙\n  제76조 1항 1호에 따라 ʻ부정당업자ʼ로 보아 입찰참가자격 제한조치를 취할\n  수 있음\n\n2) 경쟁입찰에서의 낙찰자 결정방법 부적정 또는 적격심사 미실시\n\n○ 지방계약법시행령 제42조제1항에 따라 재정지출의 부담이 되는 입찰에\n  있어서는 예정가격이하로서 최저가격으로 입찰한 자의 순으로 해당 계약\n  이행능력을 심사하여 낙찰자를 결정하여야 함\n\n○ 또한 동조 제2항에 따라 계약이행능력심사는 당해 입찰자의 이행실적, 기술\n  능력, 재무 상태 및 과거 계약이행 성실도 등을 종합적으로 고려하여 행정\n  자치부장관이 정하는 심사기준에 따라 적격 여부 심사 후 낙찰자 결정\n\n\n다. 산출내역서 및 설계내역서와 다른 시공 금지\n\n1) 산출내역서와 다른 자재 사용으로 인한 공사금액 과다집행\n\n2) 설계내역서와 다른 시공(미시공 또는 공사 누락)                             제8장"}, {"p": 628, "t": "라. 시설공사의 경비 부담\n\n 1) 공사에 필요한 공공요금 성격의 부담금은 시공업체 부담\n\n ○ 지방계약법시행규칙 제6조에 따라 경비는 계약목적물의 제조･시공 또는\n   용역 등에 소요되는 비목으로서 준공검사를 완료하기 이전에 발생하는\n   전기료와 상하수도료는 계약금액에 포함된 비용(경비)으로서 시공업체가\n   납부하여야 함\n\n  (가) 하자검사 철저\n\n   ○ 지방계약법시행령 제70조에 따라 건물이 준공된 이후 하자담보 책임기간내\n        연 2회 이상 정기적으로 하자검사 실시\n\n    ‑ 동법시행규칙 제68조에 따라 하자담보 책임기간은 방수(3년) 등 공종별로\n        구분하여 하자담보책임기간을 정하여야 함\n\n  (나) 지연배상금 징수 및 대금지급의 부적정\n\n   ○ 준공지연에 대한 지연배상금 징수\n\n    ‑ 지방계약법 제30조에 따라 계약담당공무원은 정당한 이유 없이 계약의\n        이행을 지체한 계약상대자로 하여금 지연배상금을 납부하게 하여야 함\n\n   ○ 선급금 지급의 적정 및 사후관리\n\n    ‑ 행정자치부의 ｢지방자치단체 입찰 및 계약 집행기준｣ 선금 지급요령에 따라\n        계약금액의 100분의 70을 초과하지 않는 범위내의 선금지급이 가능하며,\n        총 공사비 지급은 선금 의무지급율에 따른 선금과 공정율에 따른 기성금을\n        지급하도록 되어 있음\n    ‑ 선금 의무지급률\n             공사 금액        선금 의무지급률\n            100억원 이상        30%\n           100억원 ~ 20억원     40%\n             20억원 미만        50%"}, {"p": 629, "t": "                          Ⅴ. 지방계약법 및 보조금 관리 관련 규정\n\n\n   ‑ 또한 선금을 지급할 경우에는 계약목적에 따라 노임지급, 자재확보 등을\n    위해서만 사용이 가능하도록 되어 있으므로 지급 후 사용처 확인 등 사후관리\n    필요\n\n\n마. 보조금에 의해 형성된 중요재산 관리 및 처분\n\n1) 보조금 관리에 관한 법률 제35조에 따라 보조사업자는 해당 보조사업을 완료한 후에도\n 보조금에 의해 형성된 중요재산(부동산과 그 종물 등)을 보조금의 교부 목적에 위배되는\n 용도에 사용할 경우 중앙관서의 장의 승인을 받아야 함\n\n ○ 국고보조금을 지원받은 장애인거주시설을 운영하는 사회복지법인 등에 대한\n  시･도지사의 기본재산처분 허가 시에는 반드시 보건복지부장관으로부터\n  중요재산 처분에 대한 사전 승인을 받은 후에 기본재산 처분 허가를 해야 함.\n\n  - 사회복지법인, 재단법인 등의 중요재산 처분 승인 신청 시에는 사회복지 사업법,\n   의료법, 민법 등에서 정한 기본재산처분 허가에 관한 사항을 면밀히 검토한\n   후 기본재산처분허가 신청서류와 시･도의 검토의견을 첨부하여 제출함. 특히\n   장기 차입금 (담보의 제공)에 대해서는 차입이후의 정상적인 시설 운영 전망,\n   차입금의 원활한 상환 가능성 여부를 엄격히 검토해야 함.\n\n ○ 다만, 보조금 관리에 관한 법률 시행령 제16조에 따라 보조사업자가 보조금의\n  전부에 해당하는 금액을 국가에 반환한 경우와 보조금의 교부 목적과 해당\n  재산의 내용연수(耐用年數)를 고려하여 중앙관서의 장이 정하는 기간이 지난\n  경우는 중앙관서의 장의 승인을 받지 않음\n\n ○ 교부받은 보조금으로 취득한 중요재산 중 부동산에 관한 소유권이전 등기를 할\n  때에는 보조금을 지원받아 취득하였거나 그 효용가치가 증가한 재산이라는 사항을                제8장\n\n  부기등기(附記登記)해야 함."}]}, {"title": "Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인", "start": 630, "end": 663, "subs": [], "pages": [{"p": 630, "t": "     Ⅵ      산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n     ※ 지방정부(시･군･구, 시･도)별 「산불방지대책 – 주민대피계획」에 포함되도록 추진\n\n\n 1    목적\n\n     ○ 산불 취약 특수보호시설*의 경우, 자력 대피의 어려움 등 취약점이 존재\n\n      ⇒ 산불 발생 시, 이용자･종사자가 신속하고 안전하게 대피하기 위해 시설\n        유형별로 시･도, 시･군･구의 업무 주관부서를 대피 전담 부서로 지정하여\n        관리하는 대피체계에 관한 가이드라인 제시\n         * ①산림과 인접한 지역에 위치하고 ②자력으로 대피하기 곤란한 환자 등이 집단 거주 하여\n           산불 발생시 대규모 인명피해 위험성이 있는 시설(요양원, 요양병원 등)\n\n       ※ 단, 본 가이드라인은 산불 발생 시 실무적 참고자료로 활용되며 관련 법령보다 우선하지 않는다.\n\n\n 2 용어 정의 및 적용 대상\n\n□ 용어 정의\n\n ○ 이 가이드라인에서 사용하는 용어의 정의는 다음과 같다.\n\n ○ 산불 취약 특수보호시설은 「재난 및 안전관리 기본법」을 근거로 인근 지역\n      산불 발생 시 인명피해 발생 가능성이 높은 시설 및 안전취약계층이 이용하는\n      시설을 말한다."}, {"p": 631, "t": "                                 Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n 용어                정의                            관련 법령\n\n 산불     산림 또는 인접 지역에서 발생한 화재               「산림보호법」 제2조(정의)\n\n        와상환자, 휠체어 사용자, 장애인 등 재난\n                                          「재난 및 안전관리 기본법」\n        상황에서 스스로 대피하기 어려운 이동 약자가\n                                         제3조(정의)의 ‘안전취약계층’이\n        생활하는 시설\n                                             이용하는 시설 등\n         ※ 지방정부의 장이 별도로 지정할 수 있음\n\n        ㅇ 사회복지시설\n         - 노인복지시설: 노인의료복지시설,\n산불 취약      재가노인복지시설*                     「사회복지사업법」 제2조(정의),\n특수보호       * 中 주야간보호시설, 단기보호시설       「노인복지법」 제31조(노인복지시설의 종류),\n 시설      - 장애인복지시설: 장애인 거주시설,         「장애인복지법」 제58조(장애인복지시설),\n           장애인 의료재활시설                   「정신건강복지법」 제3조(정의) 등\n         - 정신건강증진시설: 정신요양시설,\n           정신재활시설\n\n        ㅇ 의료기관 : 병원급 의료기관*\n          * 병원, 치과병원, 한방병원, 요양병원,         「의료법」 제3조(의료기관) 등\n            정신병원, 종합병원\n\n        산불 취약 특수보호시설의 설치･운영･관리       「의료법」 제36조(준수사항), 「사회복지사업법」\n시설운영\n        총괄 책임자                       제35조(시설의 장) 등 개별 시설 관련 법령에\n 책임자\n        (예: 병원장, ○○시설의 장 등)                  따른 책임자 규정\n\n                                     「재난안전법」 제36조(재난사태 선포), 제40조\n 대피     인명 보호를 위해 안전지역으로 이동하는 조치     (대피명령), 제41조(위험구역의 설정), 제42조\n                                             (강제 대피 조치) 등\n\n        지방정부(시･군･구 또는 시･도)의 해당 시설 업무 담당부서\n주관부서\n        (예: 요양시설→복지정책과, 장애인복지지설→사회복지과 등)\n\n\n□ 적용 대상\n\n○ (산림 인접 기준) 「산림보호법」 제2조에 따른 산림 및 그 인접 지역(100m),\n  강풍을 동반한 산불로 인해 피해를 입을 수 있는 지역*(300m), 산불 고립\n  우려 영역에 위치한 산불 취약 특수보호시설을 대상으로 한다.\n  * 2025년 경북 산불 피해 분석 결과, 전체 피해 주택의 95.0%가 산림으로부터 300m 이내"}, {"p": 632, "t": "     구분              적용 기준                        비고\n\n                                        「산림보호법」 제2조 기준에 근거한\n    Ⅰ영역         산림 경계로부터 100m 이내\n                                               적용 대상\n\n                                       2025년 경상북도 산불 피해사례 등을\n    Ⅱ영역         산림 경계로부터 300m 이내\n                                             반영하여 확대 적용\n\n              산림으로 둘러싸이거나 진출입로가\n 고립 우려 영역                              고립 시 신속한 대피 곤란 가능성 존재\n                1개(차량교행 불가)인 지역\n ※ 위의 기준을 원칙으로 하되, 지방정부의 상황을 고려하여 적용할 수 있음\n\n\n ○ (시설 취약성 기준) 실효성 있는 대피계획 수립을 위해 ‘위험성과 이동 능력’을\n   기준으로 저위험, 중위험, 고위험으로 분류할 수 있다.\n\n ○ (시설 유형 기준) 스스로 대피가 어려운 환자·입소자가 생활하는 시설로 대피 시\n    조력자의 도움, 대피 수단 및 장소에 대한 사전 계획 수립이 필요한 시설은\n    다음과 같다.\n\n     유형           법적 기준                      대상\n\n   사회복지시설      사회복지사업법 제2조\n\n                                          노인의료복지시설\n                                    (노인요양시설, 노인요양공동생활가정)\n   노인복지시설      노인복지법 제31조\n                                          재가노인복지시설\n                                     (中 주야간보호시설, 단기보호시설)\n\n      장애인\n               장애인복지법 제58조          장애인 거주시설, 장애인 의료재활시설\n     복지시설\n\n     정신건강     정신건강복지법 제22조,\n                                       정신요양시설, 정신재활시설\n     증진시설         제26조\n\n                                   병원급 의료기관(병원, 치과병원, 한방병원,\n   의료기관          의료법 제3조\n                                      요양병원, 정신병원, 종합병원)\n\n\n ○ (판단 요소) 시설별 산불 대응 위험도는 다음과 같은 요소를 기준으로 판단하며,\n   대피 우선순위 및 사전대피 권고 결정시 활용한다."}, {"p": 633, "t": "                               Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n    구분 기준                          주요 검토사항\n   자력대피 능력       거동 가능 여부, 인지기능 상태 등\n  필요 장비 여부       휠체어, 산소호흡기, 투석기 등 필수장비 동반 여부\n  인근 위험 요인       산림 인접성, 고립 위험, 주변 가연물 존재 등\n   대피소 접근성       도보 또는 차량 이동의 실효성\n  운영인력 가용성       야간 및 주간 인력배치 여부\n\n\n3 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n1) 대피 전담부서 지정 및 역할\n① 원칙: 시설 유형별 “업무 주관 부서”를 “대피 전담부서”로 지정한다.\n - “시‧군‧구 업무 주관부서” 및 “시‧도의 업무 주관부서”를 “산불 취약 특수보호\n  시설의 대피 전담부서”로 지정한다.\n\n② 대피 전담부서 지정 예시\n - 대피 전담부서는 산불 취약 특수보호시설의 업무 소관부서를 지정함을 원칙\n  으로 하되, 지역 특성에 따라 원활한 대피가 이루어 질 수 있도록 지정한다.\n\n                        < 전담부서 지정 예시 >\n\n 시설 유형            기초(시･군･구)                    광역(시･도)\n            00시 보건소\n            00군 보건정책과\n  요양병원      00군 의약관리팀                00도 보건의료정책과\n            ‧\n            ‧\n            ‧\n            00시 사회복지과\n            00군 어르신복지과                                                 제8장\n 노인복지시설     00군 고령사회과                00시 고령사회정책과\n            ‧\n            ‧\n            ‧"}, {"p": 634, "t": "  - 대피 전담부서는 해당 지방정부의 재난안전부서(산불주관부서) 또는 지방\n   정부의 장이 결정할 수 있도록 한다.\n\n ③ 대피 전담부서 역할\n\n  - (대피계획 수립) 대피 전담부서는 소관 산불 취약 특수보호시설 현황을 파악\n   하고, 대피계획을 수립하여 이를 해당 시･군･구, 시･도의 “산불 발생시 주민\n   대피계획”에 반영한다.\n\n  - (시･군･구 대피 전담부서) 관내 산불 취약 특수보호시설 현황을 조사하고 각\n   시설과 협력하여 시･군･구 단위 대피계획을 작성(별첨1 참조)한다. 작성된\n   대피계획은 시설 및 시･도와 공유한다.\n\n  - (시･도 대피 전담부서) 시･군･구에서 작성된 대피계획을 총괄, 산불 취약\n   특수보호시설 현황 등을 마련(예시 : 참고1)하여 시‧도의 대피체계가 조정될\n   수 있도록 지원한다.\n\n    ∙ 시･도 내 2개 이상 시･군･구에 산불 발생시 협력‧대응을 적극 지원하고,\n        관내 시･군･구간 대피를 위해 대피장소 선정을 조율한다.\n\n    ∙ 산불의 영향 범위가 시･도의 관할을 벗어나는 경우 해당 시･도간 협력이\n        원활하도록 사전에 협력체계를 구축한다.\n\n  - (기관 협력 및 대피 시행) 재난안전부서(산불주관부서), 소방서, 보건소 등\n   관계기관과 긴밀히 협력하여 산불취약특수보호시설의 이용자‧종사자가 신속\n   하게 대피*할 수 있도록 한다.\n    * 산림청 산불예측시스템 기반, 8시간 기준 확산선 내 포함 등의 이유로 지대본에서 주민대피\n      명령이 이루어진 경우 그 기준에 따라 대피명령을 실시\n\n ④ 재난안전부서(산불주관부서)와의 관계\n\n  - 재난안전부서(산불주관부서)는 산불 대응의 총괄‧조정 역할을 수행하며, 관내\n    산불 취약 특수보호시설의 현황 조사 및 대피 전담부서의 대피계획 수립을\n    지원한다."}, {"p": 635, "t": "                                  Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n             < 산불취약 특수 보호시설, 대피 대응 체계도(예시) >\n\n\n                        산불 지휘권자\n\n\n        산불진화                   주민대피\n       (산불 주관부서)           (주민대피 소관부서)\n\n\n                                    산불취약 특수 보호시설 대피 전담부서\n                                    노인복지시설    장애인복지시설       요양병원\n                군인,\n        산림               일반       00시 사회복지과 00시 장애인복지과 00시 보건정책과\n 진화대           의용소방대\n       공무원              마을 등   기초 00군 노인복지과 00군 사회복지과    00군 보건과\n                 등\n                                       ...       ...        ...\n                               광역 00도 노인장애인과 00도 노인장애인과 00시 의료자원과\n\n\n2) 대피계획 수립             ※대피계획서 양식 예시(별첨1)\n\n① 대피 전담부서의 대피계획 수립\n\n - 대피 전담부서는 특수보호시설 및 관내･외 대피장소(병원, 복지시설)등과 협력\n  하여 소관 시설에 대한 대피계획을 수립한다.\n\n② 대피계획 포함 내용\n\n - 대피계획에는 기관명, 시설현황, 산불 취약 특수보호시설 기준 적용 현황*\n  등 기본현황을 기록한다.\n  * 산림인접기준(Ⅰ영역, Ⅱ영역, 고립 우려 영역), 시설취약성 기준(저위험, 중위험, 고위험), 시설유형\n    기준(사회복지시설(노인복지시설 등), 의료기관)\n\n - 대피 전담부서는 관내 산불 취약 특수보호시설의 현황을 주기적으로 현행화\n  하고, 이를 재난안전부서(산불주관부서)와 공유한다.                                            제8장\n\n - 대피 대상자 명부(이름, 연령, 특이사항, 유형(자립형, 부분의존형, 완전의존형)),\n  대피장소, 대피수단(시설 자체 및 외부)을 적고, 인원별 대피장소와 대피수단,\n  대피시 휴대 물품 구성 등을 포함하여 대피계획을 작성한다."}, {"p": 636, "t": "  ③ 대피 장소\n\n  - 입소자･환자 유형에 따라 병원･복지시설･강당 등을 지정한다.\n\n  - 대피 전담부서는 대피 장소와의 사전 협약 등을 통해 대피상황 발생시 신속\n    하게 대피가 이루어 질 수 있도록 한다.\n\n  - 대피 전담부서 담당자는 필요에 따라, 대피소를 2개소 이상 사전 확보(거리,\n   방향 고려)할 수 있도록 한다.\n\n\n ④ 시설별 특성에 따른 대피계획 수립\n\n        시설 유형                     주요 검토사항\n\n                - 거동이 불편한 고령자가 다수 거주하는 특성을 고려하여 대피 우선순위를\n                  최상위로 설정한다.\n                - 대피 전담부서 담당자는 협약 등을 통해 대피소를 2개소 이상 사전 확보한다.\n                  (거리, 방향 고려)\n    노인의료복지시설    - 산소공급기, 휠체어, 구급차 등 이송 장비를 준비한다.\n     및 요양병원     - 혈액투석실 등 상시 운영시설 중단·이전은 사전에 신속히 판단한다.\n                - 요양병원의 경우, 대피 난이도를 고려해 병상 환자, 집중치료자 대상으로\n                  이동 가능 병동 등 계획을 우선 수립한다.\n                - 계획에는 장비 이송체계(산소공급, 투석기 등) 및 인근 병원과의 전원(이동)\n                  협력 사항을 포함한다.\n\n                - 장비(휠체어, 보행 보조 등) 이용자, 시각･청각장애인 등 다양한 장애 유형별\n                  특성을 고려한다.\n        장애인시설   - 대피 전담부서 담당자는 협약 등을 통해 대피소를 2개소 이상 사전 확보하고\n                  (거리, 방향 고려) 이송 계획을 마련한다.\n                - 보완장비(시각장애인용 유도벨, 진동알림장치 등) 활용 계획을 포함한다.\n\n                - 입소자들과의 의사소통이 제한적인 점을 고려하여 대피계획을 단순･명료\n                  하게 수립하고, 대피 보완장비(유도등, 피난 미끄럼틀 등)를 활용한다.\n    정신요양･재활시설\n                - 대피 전담부서 담당자는 협약을 통해 대피소를 2개소 이상 사전 확보하고\n                  (거리, 방향 고려) 이송 계획을 마련한다."}, {"p": 637, "t": "                           Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n⑤ 기타 고려사항\n\n - 야간·주말 등 피난 보조인력이 부족한 경우에 대비, 지방정부 재난주관부서\n  및 해당 부서의 직원들, 마을자치조직(마을순찰대, 자율방재단 등)과의 연락\n  체계도 구축한다.\n\n3) 입소자/환자 대피카드 게시 ※ 입소자/환자 대피카드 예시(별첨2)\n\n○ 시설별 입소자/환자 대피카드를 작성하여 시설 내 잘 보이는 곳에 게시할 수\n  있도록 한다.\n\n4) 대피훈련 시행\n\n① 실시주기 및 반복 시행 권고\n - 각 시설은 연 1회 이상(권장 2회 이상) 산불 상황을 가정한 모의 대피훈련을\n  실시한다.\n  ※ 「화재의 예방 및 안전관리에 관한 법률」에 따른 소방훈련과 연계하여 실시 권고\n\n - 피난 보조인력 및 업무 분담을 사전 지정하고, 입소자가 대피계획을 숙달할\n  수 있도록 교육･훈련을 반복 시행한다.\n   ∙ 다만, 이용자의 불편함이 발생하지 않도록 실제 상황을 가정하여 종사자의\n    임무 수행 절차를 연습, 토론하는 도상훈련 등을 적극 활용한다.\n\n② 기록･보관\n - 훈련은 실제 대피소 이동 또는 시나리오 기반 실내훈련으로 구분할 수 있으며,\n  훈련 시점, 참가인원, 훈련 결과를 기록·보관한다.\n\n③ 대피 전담부서의 점검 및 지도\n - 대피 전담부서는 개별 시설의 훈련 시행에 대해 점검 및 지도할 수 있으며,\n  우수사례는 관할 지역에 전파할 수 있다.                                           제8장\n\n - 훈련 미시행 또는 계획 미비 시설에는 컨설팅 또는 별도 교육프로그램을\n   제공할 수 있다."}, {"p": 638, "t": "5) 점검 및 이행관리\n\n ① 시설별 자체 점검 및 기록\n\n  - 각 시설은 연 1회 이상(권장 2회 이상) 자체 점검을 시행하고, 다음 항목에\n   대한 이행 여부를 기록한다.\n\n    가. 대피계획* 수립 여부 및 최신화 현황\n        * 대피소 위치, 대피경로, 예상 소요시간 등 포함\n\n    나. 훈련 시행 여부 및 결과\n\n  - 점검 결과는 자체 문서로 보관하며, 지방정부 요청 시 제출할 수 있도록\n   준비한다.\n\n ② 지방정부 점검 및 감독\n\n  - 산불 취약 특수보호시설 대피 전담부서는 매년 1회 이상 관내 시설을 대상\n   으로 대피계획 수립 및 훈련 시행에 관한 실태를 점검할 수 있다.\n\n  - 점검 결과에 따라 다음 조치를 취할 수 있다.\n\n    가. 보완 요구 및 개선 기한 부여\n\n    나. 모범사례 도출 및 공유\n\n    다. 특별훈련 지원 또는 교육 제공\n\n ③ 중앙부처 지원 및 모니터링\n\n  - 중앙부처는 지역 간 편차 해소를 위해 다음 조치를 취할 수 있다.\n\n    가. 우수 지방정부 또는 시설 사례의 전국 공유\n\n    나. 표준화된 매뉴얼의 보급 및 교육자료 제공\n\n    다. 필요시 공동 점검 또는 시범훈련 추진"}, {"p": 639, "t": "                                        Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n 별첨 1            대피계획서 예시 및 작성 요령\n\n\n                ○○○○ 시설 산불 발생시 대피계획서\n     ※ 대피 전담부서 및 담당자: ○○군청 ○○○주무관(연락처), ○○도청 ○○사무관(연락처)\n\n\n1. 기본 현황\n ① 기본정보\n\n     기관명         담당자명        연락처              주소           시설, 주요장비 현황\n\n ○○요양원          (직급)○○○   02-XXX-XXXX     ○○시 ○○동          3층, 산소호흡기 등\n\n\n ② 산불 취약 특수보호시설 기준 적용 현황\n\n       산림인접기준                   시설취약성 기준                   시설유형기준\n\n산림 경계로부터 위치에 따라           ‘위험성과 이동 능력’을 기준으로\n                                                    사회복지시설, 의료기관 등\nⅠ영역, Ⅱ영역, 고립 우려 영역        저위험, 중위험, 고위험\n\n예) Ⅰ영역                    예) 중위험                    예) 의료기관(요양병원)\n   (산림경계로부터 약 80m)                                     사회복지시설(노인복지시설)\n\n\n2. 대피 대상자 명부(총인원 00명: 완전의존형 00명, 부분의존형 00명, 자립형 00명)\n구분         이름     연령       분류       보행 여부          특이사항        가족 연락처\n\n 1     김○○       만 75세    자립형           가능         경증 질환      010-XXX-XXXX\n\n 2     이○○       만 80세    부분의존형         불가능      휠체어 사용       010-XXX-XXXX\n 3     최○○       만 70세    완전의존형         불가능        산소치료       010-XXX-XXXX\n\n ···                                                               ···"}, {"p": 640, "t": "3. 대피장소\n  장소명                  주소        시설로부터 방향        시설로부터 거리            시설로부터 시간\n  00병원               00.00.00      남동쪽                20km             차로 15분\n       ···\n\n\n4. 대피 수단\n                                               지원·동승                        예상\n 구분                수단(소유)          인원                          도착 지점\n                                              (야간･휴일)                      소요시간\n 1호차         휠체어 리프트 차량(시설)       휠체어 2명       3명(2명)         ○○시설 요양원      25분\n 2호차               승합차(시설)        자립형 5명       2명(1명)        ○○초등학교 체육관     30분\n 3호차               구급차(민간)       침대 환자 1명      2명(1명)         ○○ 종합병원       25분\n 4호차               승용차(직원)        자립형 4명       1명(1명)        ○○초등학교 체육관     30분\n\n※ 대피 전담부서는 대규모 대피에 대비하여 구급차 등 장애인 및 고령자 대상 이동수단을 반영한다.\n\n5. 인원별 대피계획\n 구분          이름      대피장소       대피수단             대피시 휴대물품 구성               담당자\n 1           김○○                                   개인위생 키트                  000\n 2           이○○                            휠체어 배터리, 개인위생 키트                000\n 3           최○○                           산소실린더, 산소마스크, 산소농도계              000\n ···\n\n\n6. 비상 연락 체계\n       역할                담당자               연락처                 대체자          비고\n       총괄              김○○ 원장          010-XXX-XXXX      박○○ 행정실장           주간\n  차량이송              이○○ 시설관리팀장         010-XXX-XXXX      장○○ 시설관리자          야간\n       연락           정○○ 사회복지팀장         010-XXX-XXXX      김○○ 사회복지사         주·야간\n  의료지원               송○○ 수간호사          010-XXX-XXXX          임○○ 간호사            ···\n  물품점검              정○○ 행정지원팀장         010-XXX-XXXX     박○○ 행정지원 실무자\n\n       ···\n 마을순찰대\n자율방재단 등"}, {"p": 641, "t": "                               Ⅵ. 산불 취약 특수보호시설 대피계획 수립 가이드라인\n\n\n                      < 대피계획서 작성 요령 >\nㅇ 원칙 : 해당 시설의 협조를 받아서 대피 전담부서가 총괄하여 작성하고 해당 시설과 함께 관리\n\n1-①. 기관명, 담당자명, 연락처, 주소, 시설‧주요장비 현황 등 기본현황은 해당 시설에서 작성\n1-②. 산불 취약 특수보호시설의 기준 적용은 대피 전담부서가 조사하여 작성\n2. 대피 대상자 명부는 해당 시설이 작성하고 대피 전담부서가 확인\n3. 대피장소는 해당 시설이 대피 장소가 정해져 있는 경우 그 장소를 활용할 수 있는지 전담부서가 확인\n 해서 적고, 대피 장소가 정해져 있지 않은 경우 대피 전담부서가 정하도록 함\n4. 대피수단은 해당 시설이 보유하고 있는 차량, 가동할 수 있는 차량 등을 확인하여 적고, 필요시 관용차를\n 활용하는 등 수단을 마련하여 대피 전담부서가 정하도록 함\n5. 인원별 대피계획은 해당 시설이 작성하고 대피 전담부서가 확인"}, {"p": 642, "t": " 별첨 2        입소자/환자 대피카드 예시(게시용)\n※ 대피계획서에 따라 작성하여 피난안내도와 함께 시설 내 잘 보이는 곳에 게시\n\n\n   특수보호시설\n   (관리 번호)        ○○ 요양병원 환자 대피카드\n\n\n   시설명       예) ㅇㅇ 병원, ㅇㅇ요양원 등\n   위치        예) 00도 00시 00면 00리 123-45 (36.01234, 127.56789)\n\n             예) 약 00명(완전의존형 00명,\n  대피인원                                    진입로      예) 0개소\n             부분의존형 00명, 자립형 00명)\n\n  위험 요소      예) 지형 경사, 능선부 인접, 소나무림, 산림 경계로부터 약 00m 등\n  산불 피해\n             예) 연월일, 피해 면적, 피해 내용\n  과거이력\n\n  대피장소①      예) 지정 장소 입력                 수용인원      예) 000명\n             예) 00도 00시 00면 00리 12-3               예) 000m\n  대피위치                                   대피거리\n             (36.01234, 127.56789)                 (도보 또는 차량 00분)\n  대피장소②      예) 지정 장소 입력                 수용인원      예) 000명\n             예) 00도 00시 00면 00리 12-3               예) 000m\n  대피위치                                   대피거리\n             (36.01234, 127.56789)                 (도보 또는 차량 00분)\n\n                                          시설       예) 000 주무관\n  관리기관       예) 00시 00과 00팀\n
