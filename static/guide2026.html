에는 높은 차수를 말한다)의 다음 차수로 한다.\n\n   다. 동시에 2종 이상의 위반행위가 있는 경우에는 가장 중한 위반행위에 대한\n       처분기준을 적용한다.\n\n   라. 위반행위가 4종 이상 또는 시설거주자에 대한 학대･성폭력 등 중대한\n       불법행위로 인하여 시설의 정상적인 운영이 불가능하다고 인정되는 때에는\n       제2호의 개별기준에 불구하고 1차 위반시에 시설의 폐쇄를 명할 수 있다.\n\n   마. 위반행위가 “2. 개별기준“에 의한 시설장 교체 또는 시설폐쇄 명령의\n       사유에 해당된다 하더라도 그 위반의 정도가 경미하거나 기타 상당한\n       사유가 있다고 인정되는 경우에는 각각 1회에 한하여 시설장 교체에 갈음\n       하여 개선명령을, 시설폐쇄에 갈음하여 시설장 교체명령을 발할 수 있다.\n       이 경우 당해 처분은 차수의 산정에 산입하지 아니한다."}, {"p": 89, "t": "                                               Ⅰ. 장애인거주시설 공통 사항\n\n\n2. 개별기준\n\n                                                        행정처분기준\n           위반행위                    근거법령                          3차 위반\n                                                1차 위반   2차 위반\n                                                                  이상\n1. 사회복지시설이 설치기준에 미달하게 된 때       법 제40조제1항제1호    개선명령    시설장 교체   시설폐쇄    제2장\n2. 사회복지법인 또는 비영리법인이 설치･운영       법 제40조제1항제2호    시설폐쇄      -        -\n   하는 시설의 경우 그 사회복지법인 또는 비영리\n   법인의 설립허가가 취소된 때\n3. 설치목적의 달성 기타의 사유로 계속하여 운영     법 제40조제1항제3호    시설폐쇄      -        -      거\n   될 필요가 없다고 인정할 때\n4. 회계부정이나 불법행위 또는 그 밖의 부당행위\n   등이 발견되었을 때\n 가. 국가나 지방자치단체의 보조금 또는 후원금을     법 제40조제1항제4호    개선명령     시설장      시설장\n    사용용도 외의 용도로 사용한 때                                    교체        교체\n 나. 회계장부를 기재하지 아니하거나 허위로        법 제40조제1항제4호    개선명령     시설장      시설장\n    기재한 때                                                교체        교체\n 다. 그 밖에 회계 및 시설운영과 관련한 부당      법 제40조제1항제4호    개선명령     개선명령     시설장\n    행위가 발생된 때                                                     교체\n 라. 시설 거주자에 대한 부당한 체벌, 폭행,      법 제40조제1항제4호    개선명령     시설장     시설폐쇄\n    학대 등 인권침해가 발생한 경우                                    교체\n 마. 사회복지법인의 대표자･임직원 또는 사회       법 제40조제1항제4호    개선명령     시설장      시설장\n    복지시설의 장･종사자가 법 제6조의2                                 교체        교체\n    제2항에 따른 정보시스템을 통하여 처리\n    되는 정보에 대하여 ｢사회보장급여의 이용･\n    제공 및 수급권자 발굴에 관한 법률｣ 제31조\n    또는 ｢개인정보 보호법｣ 제59조를 위반한\n    경우\n5. 법 제34조제2항에 따른 신고를 하지 아니하고    법 제40조제1항제5호    개선명령     시설폐쇄      -\n   시설을 설치･운영하였을 때\n6. 법 제36조제1항에 따른 운영위원회를 설치하지    법 제40조제1항제6호    개선명령     시설장      시설장\n   아니하거나 운영하지 아니하였을 때                                    교체        교체\n7. 정당한 이유 없이 법 제51조제1항에 따른 보고   법 제40조제1항제7호    개선명령     시설장      시설장\n   또는 자료 제출을 하지 아니하거나 거짓으로                               교체        교체\n   하였을 때"}, {"p": 90, "t": "                                                        행정처분기준\n           위반행위                    근거법령                          3차 위반\n                                               1차 위반    2차 위반\n                                                                  이상\n8. 정당한 이유 없이 법 제51조제1항 및 제2항에   법 제40조제1항제8호   개선명령      시설장     시설장\n   따른 검사･질문･회계감사를 거부･방해                                   교체      교체\n   하거나 기피했을 때\n9. 시설에서 ｢성폭력범죄의 처벌 등에 관한        법 제40조제1항제9호\n   특례법｣ 제2조제1항제3호부터 제5호까지의\n   성폭력범죄, ｢아동･청소년의 성보호에 관한\n   법률｣ 제2조제3호의 아동･청소년 대상 성\n   폭력범죄, ｢아동복지법｣ 제3조제7호의2의\n   아동학대관련범죄 및 ｢노인복지법｣ 제1조의2\n   제5호의 노인학대관련범죄 및 ｢장애인복지법｣\n   제2조제4항의 장애인학대관련범죄(이하\n   “범죄”라 한다)가 발생한 경우로서 다음 각\n   목의 어느 하나에 해당하는 경우\n\n  가. 시설의 장 또는 종사자에 의하여 시설                      시설폐쇄\n     거주자･이용자에 대한 범죄가 발생한\n     경우로서 이 호 나목 및 다목에 해당하는\n     경우를 제외한 경우\n  나. 시설의 장에 의하여 시설 거주자･이용자에                     시설장      시설폐쇄\n     대한 범죄가 발생한 경우로서 ｢형법｣                       교체\n     제300조 또는 ｢성폭력범죄의 처벌 등에\n     관한 특례법｣ 제11조부터 제15조까지\n     (제15조의 경우 같은 법 제14조에 관련된\n     부분만 해당한다)의 범죄가 발생한 경우\n  다. 종사자에 의하여 시설 거주자･이용자에                      개선명령      시설장     시설폐쇄\n     대한 범죄가 발생한 경우로서 ｢형법｣                                 교체\n     제300조 또는 ｢성폭력범죄의 처벌 등에\n     관한 특례법｣ 제11조부터 제15조까지\n     (제15조의 경우 같은 법 제14조에 관련된\n     부분만 해당한다)의 범죄가 발생한 경우\n  라. 시설 거주자･이용자 간의 범죄가 발생한                     개선명령      시설장     시설폐쇄\n     경우                                                   교체\n10. 1년 이상 시설이 휴지상태에 있어 시장･         법 제40조       개선명령     시설폐쇄\n    군수･구청장이 재개를 권고하였음에도           제1항제10호      (6개월 내\n    불구하고 재개하지 아니한 경우                             재개)"}]}, {"title": "3. 장애인거주시설 인권실태조사", "start": 91, "end": 92, "pages": [{"p": 91, "t": "                                  Ⅰ. 장애인거주시설 공통 사항\n\n\n3 장애인 거주시설 인권실태조사\n\n\n가. 목적\n\n○ 장애인 거주시설 이용자의 인권 보호를 위해 거주시설의 대표, 종사자, 전체                  제2장\n\n  거주인 면담을 통해 시설의 인권상황 및 인권침해 사례를 파악하여 대응하고자 함\n - 정기적인 인권실태 조사를 통해 시설운영자 및 종사자의 인권 감수성을\n  높이고 인권 문제에 대한 지속적 환기 장치로 활용\n\n나. 관련 법령\n\n○ ｢장애인복지법｣ 제57조(장애인복지시설의 이용 등) ② 국가와 지방자치단체는\n  제58조에 따른 장애인복지시설을 이용하는 장애인의 인권을 보호하기 위하여\n  필요한 정책을 마련하고 관련 프로그램을 실시할 수 있는 기반을 조성하여야 한다.\n\n\n다. 사업추진\n\n○ (사업추진) 민간기관에 실태조사를 위탁하여 전체 거주시설에 대해 3년 단위의\n  전수조사 실시\n\n                       <추진체계>\n\n        (보건복지부)        (위탁기관)         (시･도 및 시･군･구)\n\n      위탁기관선정           조사체계마련,           조사원 추천\n    지자체에 조사 실시          조사 실시,          시설 협조 요청\n    통보 및 협조 요청         결과분석 등         (필요시 조사 동행)\n\n\n - 조사 위탁기관은 조사표 및 조사매뉴얼 개발, 조사원 확보 및 교육, 실태조사\n  실시 및 분석, 결과 보도 등을 추진하며,\n  * 조사원은 조사대상 시설과 거주지가 겹치지 않는 대상으로 선정하는 등 조사의 공정성을 확보하기\n    위한 장치 마련"}, {"p": 92, "t": "  - 보건복지부는 조사의 연속성을 위하여 예산 상황 및 수행과정의 문제가 없을\n   경우 3년의 위탁기간 보장\n\n\n라. 지자체의 역할\n\n ○ (지자체의 역할) 시･도 및 시･군･구는 인권실태조사가 원활하게 추진될 수\n   있도록 협조하고 시설의 조사방해 행위 등 관리\n\n  - 조사기관이 요청할 경우 관할 장애인단체 및 인권 관련 기관 등으로부터\n    조사원을 추천받아 조사기관에 제공하고 교육 장소 등 편의 제공\n\n  - 시･군･구는 조사대상 기관에 조사 관련 사항을 7일 전에 서면으로 통보하고\n   필요한 경우 조사에 동행하여 정확한 조사가 이루어지도록 관리\n\n  - 보건복지부의 인권실태조사와 별도로 지자체가 자체적으로 계획을 수립하여\n   인권실태조사 등을 실시\n\n\n마. 거주시설의 역할\n\n ○ 시설장 및 종사자는 인권실태조사 행위를 방해하여서는 안되며 조사에 협조\n\n\n바. 조사 결과 환류\n\n ○ 인권실태조사 매뉴얼을 마련하여 교육을 통한 조사원 양성 및 조사 수칙,\n   점검 방법, 조사표 작성 등 관리 체계화\n\n ○ 인권실태 조사 결과 개선이 필요한 시설은 시･도에 통보하여 시정조치, 재조사,\n   수사 의뢰 등 개선 결과를 보고"}]}, {"title": "4. 장애인거주시설 인권지킴이단 운영", "start": 93, "end": 129, "pages": [{"p": 93, "t": "                               Ⅰ. 장애인거주시설 공통 사항\n\n\n4 장애인거주시설 인권지킴이단 운영\n\n\n가. 설치 목적\n○ 장애인거주시설 이용장애인(이하 “이용자”)의 인권침해를 예방하고 인권침해\n  발생 시 확인과 필요한 조치를 통해 이용자의 인권이 보장될 수 있도록 하기\n  위하여 거주시설 내에 인권지킴이단을 설치･운영하도록 한다.(｢장애인복지법｣\n  제60조의4제4항)\n나. 설치 대상\n\n○ ｢장애인복지법｣상 “장애인 거주시설”(공동생활가정은 제외)\n\n\n다. 구성\n\n1) 인권지킴이단의 구성\n\n○ 인권지킴이단의 단원은 5인 이상 11인 이하로 구성하고 단원의 임기는 2년\n  으로 하되 연임할 수 있다.(인권지킴이단원 중 시설종사자인 단원은 1회에\n  한하여 연임 가능)\n\n○ 관할 시･군･구는 변호사, 공공후견인 후보자(이하 공공후견인 포함), 인권전문가, 지역\n  주민, 이용장애인보호자(이하 “보호자”라 함) 등으로 시설별 외부단원을 50%\n  이상 지정하도록 하며, 시･군･구의 장애인 거주시설 담당 공무원이 외부단원\n  으로 참여할 수 있도록 노력하여야 한다.\n\n - 외부단원 제외대상：장애인 거주시설 및 동일 법인 종사자, 사회복지시설\n  종사자 중 사무국장 이상 종사자\n\n - 장애인 인권 관련 전문가라 함은 인권관련단체 활동가, 교수, 변호사, 공공\n  후견인(후보자), 사회복지사, 인권강사양성과정수료자 등을 말함."}, {"p": 94, "t": " ○ 시설 자체적으로 구성할 수 있는 입소자 및 종사자는 각 2명 이하로 제한하되,\n   시설 규모(이용자 현원 50명 이상) 및 단원의 구성인원에 따라 1명을 추가할\n   수 있다.(단, 전체 단원의 50%를 넘지 않아야 함)\n\n  - 시설 이용자(단, 영유아 및 중증 시설의 경우 이용자 참여가 어려울 시 제외 가능)\n\n  - 시설 직원(시설장 제외1))\n\n       장애인 거주시설 시설장 등은 직원과 이용자 등이 인권지킴이단 활동을 함에 있어 불합리한 처우를\n       받지 않도록 해야 하며, 인권지킴이단 담당 직원이 인권지킴이단 업무를 성실히 수행할 수\n       있도록 직원의 기존 업무를 조정하거나, 시설장 재량의 휴가 및 인센티브 등을 부여하는 지원\n       계획을 수립하여 관할 시･군･구에 보고해야 하며 관할 시･군･구는 이에 대한 검토 후 지원이\n       잘 이뤄질 수 있도록 관리･감독 필요\n\n\n 2) 인권지킴이단의 운영\n\n ○ 인권지킴이단은 관할 시장･군수･구청장이 추천하는 다음 각 호의 어느 하나에\n   해당하는 사람 중에서 시설 운영자가 성별을 고려하여 위촉한다.\n\n   1. 해당 시설을 이용하는 장애인 및 법정대리인 등\n\n   2. 해당 시설에서 종사하는 사람(시설 운영자 및 해당 시설이 속한 법인의 임\n       직원은 제외한다)\n\n   3. 해당 시설의 지역에 거주하는 주민\n\n   4. 해당 시설을 후원하는 기관의 대표자 또는 장애인복지 관련 공익단체에서\n       추천하는 사람\n\n   5. 장애인복지 업무 담당 공무원\n\n   6. 그 밖에 장애인 인권에 관한 학식과 경험이 풍부한 사람\n\n\n1) 인권지킴이단은 시설과는 독립적으로 자율적인 논의 구조를 가지고 있어야 한다.\n   시설장이 참여할 경우 자율적인 논의가 제한되고 의사결정 과정에서도 영향력을 미칠 가능성이 있기 때문에\n   제외한다. 또한 인권지킴이단에는 시설장, 이사장 및 이사, 법인 직원의 가족･친인척이 포함될 수 없다."}, {"p": 95, "t": "                            Ⅰ. 장애인거주시설 공통 사항\n\n\n- 시장･군수･구청장은 장애인권익옹호기관, 장애인 관련 단체 등에서 후보자를\n  추천받아 사전에 인권지킴이단 후보군을 마련하여 시설에서 추천을 요청할\n  시 후보군에서 단원을 추천하여야 한다. 다만, 후보군에 등재되어 있는\n  사람이 단원 위촉을 거부하는 등 특별한 사정이 있는 경우에는 후보군 외의\n  단원을 추천할 수 있다.\n\n- 단원은 사퇴 시 시･군･구에 통보하여야 하며, 시･군･구는 정기회의 개최 이전에         장\n  추천하여야 함\n○ 단장은 외부단원 중에서 호선하고, 간사는 단원 중에서 단장이 지명하는 자로            시\n 한다.\n\n○ 회의의 종류 및 개최 횟수\n- 정기회의：연 4회(분기별 1회) 이상 대면회의로 실시\n- 임시회의：인권지킴이단 혹은 종사자 및 이용자의 요청에 따라 필요시 실시\n\n○ 회의 내용\n- 정기회의：이용자 인권보장과 관련한 사례회의 및 인권지킴이단의 구성,\n  역할, 운영 등에 관한 사항\n- 임시회의：회의 요청사항에 대한 사항\n\n○ 회의는 전체단원 3분의 2 이상의 참석으로 개회하고 참석단원 3분의 2\n 이상의 찬성으로 의결한다.\n\n○ 회의내용의 기록 및 보고\n- 간사는 회의 시마다 회의록(*별지 4호 서식 참조)을 기록･관리해야 하며,\n  회의에 관한 기록은 회의 종료 후 2주일 이내에 전체 단원 및 관할 시･군･구에\n  회의록을 첨부하여 보고하여야 한다.(단, 인권침해 사안은 즉시 보고)\n- 회의 기록 및 보고 내용에 이견이 있는 단원은 즉시 간사에게 그 사실을\n  알려야 하며 이의제기를 접수한 간사는 단장에게 보고하고, 단장은 상황을\n  확인 후 이를 재조정하여야 한다."}, {"p": 96, "t": " ○ 인권지킴이단 운영과 관련하여 각 시설은 시설 현황을 반영한 운영 규정을\n   제정하여 시행하여야 한다.(*별지 10호 참조)\n\n\n라. 운영\n\n ○ 인권지킴이단은 아래와 같은 활동에 대해 정기회의를 통해 방향을 설정하고\n   시설과 외부기관 연계를 통해 활동이 원만히 진행될 수 있도록 기획, 실시,\n   조정한다.\n\n 1) 외부 감시체계 정례화\n\n ○ 인권지킴이단 외부단원 중 1명 이상을 선정하여 이용자가 최소 연 1회 이상\n   인권상황을 점검받을 수 있도록 한다.\n\n  - 월 1회 실시하며 인권지킴이단 정기회의가 있는 달에는 정기회의와 인권상황\n    점검 진행\n\n  - 대상 장애인 수는 시설 규모를 고려하여 인권지킴이단에서 결정\n\n ○ 분기별 실시하는 정기회의 개최 시 외부단원은 시설 내 인권상황 점검\n\n  - 대상 장애인 및 종사자의 수는 인권지킴이단에서 결정\n\n ○ 매월 및 정기회의 시 실시하는 인권상황 점검은 인권상황점검표(*별지 2, 3호\n   서식)를 사용하고, 점검 결과는 시･군･구에 보고\n\n  - 특이사항이 없는 경우 유선 등 약식으로 하고 향후 별도 제출 가능\n\n ○ 관할 시･군･구는 인권침해 의심 및 확인 사항이 보고된 경우 즉시 장애인권익\n   옹호기관이나 수사기관에 통보하여 추가 조치가 이루어지도록 함"}, {"p": 97, "t": "                                     Ⅰ. 장애인거주시설 공통 사항\n\n\n 2) 인권침해 의심 사례 진정･고발(*별지 1호 절차 참조)\n\n (1) 인권침해 의심 상황 인지\n\n ○ 이용자 및 시설관계자(직원 및 자원봉사자)가 자유롭게 인권침해 사실에 대한\n   정보를 알릴 수 있는 다양한 방법과 경로를 모색한다.(민주적인 의사소통 분위기\n   조성, 고충함 및 진정함(｢국가인권위원회법 시행령｣ 제7조) 설치, 내부고발\n   제도2) 운영 등)\n  - 인권침해 사실을 알릴 수 있는 방법과 경로는 이용자, 직원 및 자원봉사자들이\n\n    접근하기 쉬워야 하며 인권교육 시 이와 관련된 정보를 자세하게 제공해야\n    한다.\n\n ○ 인권침해 의심 상황을 인지한 자는 인권지킴이단을 거치지 않고 바로 장애인\n   권익옹호기관이나 수사기관에 즉시 신고하고, 관할 시･군･구와 센터에 보고한다.\n\n\n (2) 인권침해 의심 상황 사실 확인\n\n ○ 인권지킴이단은 침해접수 상황이 긴급을 요할 시 장애인권익옹호기관이나\n   수사기관에 즉시 신고해야 하며 사실확인이 필요한 사안에 대해서만 사실확인을\n   실시하고, 관할 시･군･구와 센터에 보고한다.(*별지 5~9 진술서 등 서식 참조)\n\n  - 인권침해의 소지가 있는 것으로 판단될 경우 즉시 분리, 보호 후 사실확인을\n    실시하여야 함.\n\n ○ 인권침해 사실 확정 시 경미한 침해 사안(말투, 태도, 사소한 다툼 등)에 대\n   해서는 내부 규정에 따라 인사 또는 징계조치 함.\n\n\n2) 인권지킴이단 위원장 및 간사에게 직접 연락할 수 있는 방법을 선택, 운영."}, {"p": 98, "t": " ○ 사실 확인 후 침해 사안의 경･중을 판단할 수 없을 경우 장애인권익옹호기관이나\n   수사기관에 즉시 신고하거나 국가인권위원회에 진정하고, 관할 시･군･구와\n   센터에 보고한다.\n\n (3) 신고･진정･고발\n\n ○ 인권침해의 소지가 있는 것으로 판단될 경우 즉시 분리, 보호 후 인권지킴이\n   단 명의로 장애인권익옹호기관이나 수사기관에 신고를 통해 조사를 요청하고,\n   관할 시･군･구와 센터에 보고한다. 사안에 따라서는 국가인권위원회에 진정을\n   통해 조사를 요청한다.\n\n       - 장애인권익옹호기관：조사 의뢰는 전화(1644-8295), 우편･방문, 팩스, 이메일 등 다양한 방법을\n         활용할 수 있음\n       - 국가인권위원회：진정은 국가인권위원회 홈페이지 상에서 진정서를 다운받아 작성하면 되고\n         전화상담, 우편･방문, 팩스, 홈페이지, 이메일, 모바일 웹 등 다양한 방법을 활용하여 진정할\n         수 있음\n       - 경찰청：관할 경찰서 민원실, 사이버경찰청(신고민원포털), 국민신문고 등에 민원으로 접수시키면\n         해당 경찰관서에 배정하여 필요한 절차를 밟게 됨\n\n\n (4) 사후 조치\n\n ○ 인권침해 사실 확정 시 즉시 법정 보호자에게 통보해야 한다. 통보는 서식\n   (*별지 8호 서식 참조)에 의한 것을 원칙으로 하되 신속한 통보를 위해 전화 등\n   통신수단을 이용한 후 기록을 남긴다.\n\n ○ 인권지킴이단은 인권침해를 당한 이용자가 침해한 자로부터 피해를 충분하게\n   배상받을 수 있도록 조력해 주어야 한다.\n\n ○ 인권침해에 따른 시설 내 행정조치 의뢰\n\n  - 시설장은 인권지킴이단으로부터 의뢰를 받은 사항에 대해 인권침해자에 대한\n    인사위원회 심의 결정에 따른 신분 조치, 피해자에 대한 지원조치, 사후 예방\n    계획 수립 등을 실시하여야 한다."}, {"p": 99, "t": "                                     Ⅰ. 장애인거주시설 공통 사항\n\n\n3) 인권침해 사례 신고자의 보호\n\n○ 시설장과 관할 시･군･구는 이용자의 인권침해 사례를 제보한 시설 이용자, 직원,\n  자원봉사자 등이 제보에 따른 불이익을 받지 않도록 조치할 의무가 있으며\n  의무 불이행으로 불이익이 발생할 시 관할 시･군･구는 이에 대한 시정 계획을\n  세워 조치해야 한다.\n\n○ 인권지킴이단은 운영상황을 분기별로 관할 시･군･구에 보고해야 하며 관할\n  시･군･구는 인권지킴이단 운영상황 전반에 대해 수시로 점검하여야 한다.\n○ 시･군･구청장 또는 시설장은 이용자의 인권침해 등 공익 침해행위를 인권\n 지킴이단에게 제보한 경우 시설 이용자, 종사자 등에 대해 「공익신고자 보호법」\n 등 관계법령에 따라 공익신고자등의 비밀보장, 신변보호, 불이익조치 금지 등\n 공익신고자등에 대해 보호 및 지원을 준수해야 한다.\n * 시･군･구청장 또는 시설장은 사전 「공익신고자 보호법」 등 관계법령에 따라 공익신고 방법 및 절차\n   등 안내 필요\n\n\n                < 공익신고자 보호법상 공익신고자 보호 >\n\n ○ (접수기관) 법령에 명시된 공익신고 기관에 신고(제2조 제2호)\n  - (법 제6조) ①공익침해행위를 하는 사람이나 기관 등의 대표자 또는 사용자, ②공익침해행위에\n    대한 지도･감독･조사권한을 가진 행정기관이나 감독기관, ③수사기관, ④국민권익위원회\n  - (시행령 제5조) ⑤국회의원, ⑥공익침해행위와 관련된 법률에 따라 설치된 공사･공단 등 공공단체\n ○ (내용･목적) 신고 내용이 거짓임을 알았거나 알 수 있었음에도 신고한 경우가 아닐 것, 금품･근로\n   관계상 특혜 등 부당한 목적으로 신고한 경우가 아닐 것\n ○ (비밀보장) 신고자 및 협조자의 동의없이 인적사항 또는 신고자･협조자임을 미루어 알 수 있는\n   사실을 공개･보도할 수 없음(제12조)\n ○ (불이익조치 금지) 신고를 방해하거나 취소를 강요할 수 없으며, 신고를 이유로 신분상･행정적･경제적\n   불이익 조치를 취할 수 없음(제15조)\n ○ (책임감면) 직무상 비밀준수 의무 면제, 신고와 관련한 신고자 및 협조자의 형벌･징계･행정처분\n   감경 또는 면제 가능(제14조)\n ○ (신변보호) 신고를 이유로 신고자 등이 중대한 위해를 입었거나 그 우려가 명백한 경우 국민권익위원회에\n   신변보호 요청 가능(제13조)"}, {"p": 100, "t": " 4) 운영 활성화\n\n 5) 기타사항\n\n ○ 인권지킴이단의 독립성 확보를 위해 인권지킴이단에서 생성된 문서는 독립적으로\n   관리되어야 하며 문서 송･수신 시 인권지킴이단장 명의로 팩스 및 이메일 등을\n   활용하여 별도로 진행되어야 한다.(보건복지부 사회복지시설정보시스템 상\n   시설장의 결재를 득하여 문서를 발송하는 방법 불가) (*별지 11호 서식 참조)\n\n ○ 인권지킴이단 운영에 필요한 예산은 시･군･구에서 지원하되, 필요한 경우 시설\n   운영비에서 지출할 수 있다.\n\n ○ 인권지킴이단은 내부 인권점검과 인권인식개선, 자원봉사자 및 보호자 인권\n   교육 등에 대해 자율적으로 결정하여 진행한다.\n  - 다만, “장애인학대 및 장애인대상 성범죄 신고의무(장애인학대 신고의무)”에\n   관한 교육을 받을 수 있도록 노력하여야 한다.\n   * (장애학대신고의무 교육) 중앙장애인권익옹호기관 홈페이지(www.naapd.or.kr.)\n\n\n마. ‘장애인 거주시설 인권지킴이지원센터’ 설치･운영\n\n 1) 설치 목적\n\n ○ 전국 장애인 거주시설의 인권지킴이단 구성과 운영을 지원하고 인권사업\n   체계화, 이용자 인권침해 예방 및 인권옹호 등에 대한 구체적 실행방법에 대한\n   안내와 교육 등을 총괄 지원하여 거주시설 이용 장애인에 대한 인권보장\n   지원체계를 강화하기 위함\n\n 2) 주관기관：공모"}, {"p": 101, "t": "                                Ⅰ. 장애인거주시설 공통 사항\n\n\n3) 인권지킴이지원센터 역할\n\n(1) 장애인 거주시설의 이용자 인권 관련 사례 상담 및 지원\n\n○ 개별 시설에서 생활하는 이용자의 인권 관련 개별 사례를 접수, 상담, 옹호\n  활동 등에 관한 제반 사항을 지원 및 모니터링 실시                             제2장\n\n○ 개별 시설의 실태조사를 통해 이용자 인권 상황 점검 및 시설의 자정 노력을 지원함.\n○ 이를 바탕으로 장애인 거주시설의 이용자 인권 보장 수준을 향상시킬 수\n  있는 구체적인 실행방안과 정책 대안을 제시함.\n○ 센터에서는 인권 관련 사례 상담 및 지원을 위해 상담실을 상시 운영하여야 하며,              설\n\n  접수된 상담내용에 따라 적절한 조치를 취하여야 함.\n\n(2) 장애인 거주시설 내 인권지킴이단의 구성 및 운영 지원\n\n○ 개별 시설 내 인권지킴이단이 거주시설 이용자의 인권상황을 개선하는 역할을\n  수행토록 구성 및 운영 전반을 지원함.\n\n○ 우수 인권지킴이단 사례를 발굴하여 전국 인권지킴이단에 공유 및 보급함.\n\n○ 전국 인권지킴이단을 조직화하여 시설 이용자의 인권보장을 위한 다양한 정보\n  및 방안을 공유할 수 있도록 함.\n\n○ 인권지킴이단 단원을 대상으로 인권 감수성 훈련, 인권지킴이단 활동 관련\n  교육 등 각종 교육을 진행함.\n\n(3) 장애인거주시설 종사자 및 이용자 인권교육 지원\n\n○ 장애인 거주시설 종사자 및 이용자 인권교육을 위한 강사 인력을 양성하는\n  등의 구체적인 방안을 실행함.\n○ 장애인 거주시설 종사자 및 이용자 인권교육을 위한 교재 개발 및 보급, 강사\n  파견 등의 사업을 함.\n○ 시설 인권지킴이단 담당 종사자를 대상으로 인권 감수성 훈련, 직무 관련\n  교육 등 각종 교육을 진행함."}, {"p": 102, "t": " (4) 시･군･구와의 역할 분담\n\n\n                          개별시설의 인권지킴이단\n                     1. 장애인 거주시설 이용자 인권보장 향상\n                     2. 인권지킴이단의 인권옹호, 기능 강화\n\n\n                                 ⇑\n                                               인권지킴이지원센터\n           시･군･구(지자체)\n                                      1. 전국 인권지킴이단 운영지원\n 1. 인권지킴이단 점검 및 평가               +    2. 장애인 거주시설 이용자 인권침해 예방 및\n 2. 이용자 인권침해 구제조치                        인권옹호 활용\n                                      3. 개별 시설의 인권지킴이단 지원\n\n\n 4) 인권지킴이지원센터 구성 및 조직도\n\n (1) 구성：인권지킴이지원센터는 센터장 1인을 중심으로 최소한 컨설팅 팀, 조사팀,\n   교육팀 이상 3개 팀제로 운영한다. 각 팀은 팀장 1인, 팀원 2인 총 3명으로\n   구성한다.\n\n     - 컨설팅 팀：이용자 인권 침해 사례 유권 해석 및 제도 개선 연구, 인권지킴이단 운영 지원\n        및 조직화 등을 수행함.\n     - 조사팀：이용자 인권침해 사례 접수 상담 및 조사, 이후 구제 조치 지원, 시설 실태조사 및\n        조사원 파견 등을 수행함.\n     - 교육팀：장애인거주시설 종사자 및 이용자 인권교육, 관련 전문 강사 파견, 관련 자료 개발\n        및 보급, 인권지킴이단 교육 등을 수행함.\n\n\n (2) 조직도\n\n                        센터장\n\n                                                 법률자문단\n\n\n        컨설팅 팀           조사 팀         교육 팀"}, {"p": 103, "t": "                                      Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 1호]\n               < 인권침해 의심 사례 진정･고발 절차 >\n\n\n      인권침해 의심 상황 인지 및 접수        ∙ 이용자 직접적인 의사표현, 인권지킴이단 외부\n                                 점검, 내부고발, 진정함, 고충함 등\n                                ∙ 장애인학대(신체적･정서적･성적 학대, 경제적\n     중대한 사안         경미한 사안       착취, 유기･방임)가 의심될 경우 모두 중대한 사안     애\n                                 으로 분류\n   신고･수사의뢰\n                                ∙ 의심 상황 공유\n  (장애인권익옹호         인권지킴이단 회의\n                                ∙ 사실 확인 방법 및 절차 결정, 사실확인 팀 구성\n  기관, 수사기관)\n\n      󰀻                󰀻        ∙ 선보호조치\n\n                                ∙ 피해자 면담(사실 확인)\n관할 시･군･구, 센터                    ∙ 피의자(행위자) 사실면담 및 확인조사\n                    침해사실 조사\n    보고                          ∙ 목격자(직원, 이용자 등)의 사실 확인\n                                ∙ 자료확보：영상, 사진, 상담기록, 관찰기록 등\n\n      󰀻                󰀻\n\n                                ∙ 사실 확인 결과 경미한 사안(말투, 태도, 사소한\n                                  다툼 등)의 경우 내부 규정에 따라 인사 또는\n                   침해사실 여부 확인     징계 조치\n    조사 진행\n                    및 보고･통보     ∙ 사실 확인 후 중대사안으로 판명될 경우나 경중\n                                  판단이 난해할 시 즉시 장애인권익옹호기관에\n                                  의뢰\n\n      󰀻                󰀻\n\n                                ∙ 피해자, 피의자, 보호자, 시설, 관할 시･군･구\n                                  등에 조사결과를 인권지킴이단장 명의의 문건\n    조사결과                          으로 보고(통보)\n               ➡     사후관리\n    보고･통보                       ∙ 인권침해자에 대한 행정조치(인사위원회 심의\n                                  결정에 따른 신분 조치) 등을 시설에 요구\n                                ∙ 피해자에 대한 지원조치 및 사후 예방 계획 수립"}, {"p": 104, "t": "[별지 2호]\n\n          이용자 인권상황 점검표 (인권지킴이단 외부단원용)\n\n 시 설 명                           점검일시\n\n\n 장애인성명                           장애유형\n\n\n 점검방법     ᷺ 면담   ᷺ 관찰   ᷺ 서류    점검자성명               (인)\n\n\n             점 검 질 문                    답변 및 관찰내용   비고\n1. 귀하는 자신의 나이에 맞는 대우를 받고 있나요?\n\n∙ 대우라 함은 이용자의 연령에 맞는 적절한 존중을 의미함.\n∙ 예시) 이용자가 나이에 따라 존댓말(반말 여부)을 듣는지,\n  이용자가 원하는 호칭을 듣는지, 이용자의 나이와 환경에\n  맞게 옷차림이 지원되는지 등의 추가 설명 가능함.\n\n2. 귀하는 개인 물품을 개인 수납공간에 보관할 수 있나요?\n∙ 이용자가 중요하게 여기는 사적 소유물 혹은 그렇게 추정\n  되는 물건을 배타적 사유 공간이 있어 보관하고 있는지를\n  확인하는 것을 의미함.\n∙ 예시) 다른 사람이 건드릴 수 없는 자신만의 물건을 두는\n  공간이 어디 있는지? 자신의 물건이 지금 어디에 있는지,\n  이를 당장 가져올 수 있는지에 대해 추가 질문 및 설명\n  가능함.\n3. 귀하는 외출이 자유로운가요?\n∙ 이용자가 납득하지 못한 상황에서 임의적으로 외출이\n  제한된 경우가 있는지를 확인하고자 하는 것임.\n∙ 예시) 외출을 원할 때 어떻게 해야 하는지를 알고 있는지\n  그리고 나가려고 했는데 나가지 못한 경우가 있는지에\n  대해 추가 질문 가능함.\n4. 귀하는 전화하고 싶을 때 마음대로 할 수 있나요?\n∙ 이용자가 외부에 있는 사람과 전화로 소통하고자 할 때\n  이에 대한 제약이 있는지를 확인하고자 하는 것임.\n∙ 예시) 밖에 있는 사람과 전화 통화를 하고 싶은데 하지\n  못한 경우가 있었는지 추가 질문 가능함."}, {"p": 105, "t": "                                       Ⅰ. 장애인거주시설 공통 사항\n\n\n             점 검 질 문                   답변 및 관찰내용           비고\n5. 귀하는 음식을 자유롭게 먹을 수 있나요?\n\n∙ 이용자가 원하는 음식을 바라는 만큼의 양과 충분한 시간을\n  통해 먹을 수 있는지를 의미함.\n  ※ 건강상의 이유로 음식의 종류나 양의 지원을 제한하고                                  제2장\n    있는 경우에 대한 확인 필요.\n∙ 예시) 밥을 더 먹고 싶을 때 더 먹지 못한 경우가 있었는지,\n  식사 시간이 넉넉한지, 먹고 싶은 간식이 있을 때 어떻게\n  하는지 등의 추가 질문 가능함.\n6. 귀하는 의복과 머리 모양 등을 선택할 수 있나요?\n∙ 이용자의 취향에 따라 의복 및 머리 모양 등을 제한하지\n  않으려는 시설의 노력을 확인하고자 하는 것임.\n∙ 예시) 입고 싶은 옷이 있을 때 어떻게 하는지, 내가 원한다\n  면 파마, 염색 등을 할 수 있는지 추가 질문 가능함.\n\n7. 귀하는 지역사회에서 생활할 수 있도록 지원을 받고\n   있나요?\n\n∙ 지역사회 생활지원이라 함은 퇴소 후 직면 할 수 있는\n  다양한 어려움과 지역사회 삶의 장점, 활용 가능한 서비스\n  정보(생계급여, 활동지원, 장애인연금 및 장애수당 등)에\n  대해 알려주고, 원가정으로의 복귀를 돕거나 관련 시설\n  (체험홈, 그룹홈 등)에 의뢰하는 노력을 포함함.\n∙ 예시) 시설 밖으로 나가서(체험홈, 그룹홈 등) 생활할\n  수 있도록 도와주는지, 자립생활교육을 받은 적이 있는지,\n  지역사회 자원정보와 자원을 활용할 수 있는 방법에 대해\n  설명을 들은 적이 있는지 등으로 추가 질문이 가능함.\n\n8. 귀하는 자신의 금전을 자유롭게 사용, 관리하고 있나요?\n\n∙ 이용자가 자유롭게 자신의 금전을 사용할 수 있는지,\n  그리고 자신의 금전을 스스로 관리하고 있는지 등을 확인\n  하고자 하는 것임.\n  ※ 이용자의 금전 사용 및 관리 능력 확인 필요.\n∙ 예시) 이용자 통장에 얼마가 있는지 아는지, 또는 설명을\n  들은 적이 있는지, 내 돈을 쓰고 싶을 때 자유롭게 쓸\n  수 있는지 등으로 추가 질문이 가능함."}, {"p": 106, "t": "             점 검 질 문                  답변 및 관찰내용   비고\n9. 귀하는 아플 때 적절한 치료를 받고 있나요?\n∙ 적절한 치료라 함은 이용자의 의료적 상태(감기, 당뇨병\n  등)를 관리하기 위해 시간적, 양적으로 적절한 지원을\n  받는지를 의미함.\n∙ 예시) 이용자가 아플 때 바로 치료를 받는지, 건강검진은\n  받는지 등의 추가 질문이 가능함.\n10. 귀하는 불만과 의견을 언제든지 말할 수 있나요?\n∙ 불만이라 함은 시설환경, 직원과의 관계, 이용자와의\n  관계 등 생활영역 전반에서 부정적 영향을 미치는 불편\n  사항을 의미함.\n∙ 예시) 이용자가 힘들고 어려운 일이 있으면 언제든지\n  말할 수 있는지, 자치회와 인권지킴이단 등에 자신의\n  의견을 언제든지 말할 수 있는지 등으로 추가 질문이\n  가능함.\n11. 귀하는 대가 없는 노동을 한 적이 있나요?\n∙ 정당한 대가 없이 지속적으로 노동력을 착취 당한 적이\n  있는지에 대한 확인 문항임.\n  ※ 이용자 역할 분담 및 공동의 작업활동 등과 구별 필요.\n∙ 예시) 이용자가 힘든 노동 후 대가를 요청해 본적이 있는지,\n  일하고 월급 등을 받지 못한 적이 있는지, 이용자가 노동\n  후 대가가 없었을 시 이에 대한 설명을 듣는지 등으로\n  추가 질문이 가능함.\n12. 귀하는 다른 이용자 혹은 직원 등 에게 체벌이나\n    폭력을 당한 적이 있나요?\n∙ 체벌은 고통이 몸에 직접 느껴지도록 벌을 주는 것, 폭력은\n  모든 신체적 폭력을 포괄하는 의미임.\n∙ 예시) 체벌, 또는 가벼운 폭력부터 신체적 학대에 이르기\n  까지 포괄하는 것임을 부연 가능함.\n13. 귀하는 성적 수치심을 받은 적이 있나요?\n∙ 성적 수치심은 이용자가 성적인 부끄러움 및 성적 학대\n  여부를 포괄하는 의미임.\n∙ 예시) 이용자 허락 없이 몸을 만지거나 이용자 신체에\n  대해 이야기 해 기분이 나쁜 적이 있는가? 창피해 본\n  적이 있는가? 불쾌감을 느낀적이 있는가? 등으로 추가\n  설명 가능함."}, {"p": 107, "t": "                                        Ⅰ. 장애인거주시설 공통 사항\n\n\n            점 검 질 문                     답변 및 관찰내용           비고\n14. 기타 시설에 대한 불편 및 불만 사항이 있나요?\n\n∙ 점검질문 외에 기타 불편 및 불만 사항에 대한 확인\n  문항임.\n∙ 예시) 오늘 말한 것 외에 힘들거나 바뀌었으면 하는 거\n  있나요, 하고 싶은 말 있나요 등의 추가 질문이 가능함.\n\n15. 기타 점검자에게 하고 싶은 말이 있나요?\n점검총괄의견\n  조치사항\n\n\n※ 점검 방법 및 점검표 작성법(주의사항)\n\n\n- 점검자는 점검대상 장애인을 선정하여 1：1 면담 방식을 통해 점검사항 질문에 대한 답변 및 답변 시 관찰된\n  내용을 기재.\n- 점검으로 인해 장애인의 인권을 침해하지 않도록 최대한 설명 후 동의를 얻어 점검 실시.(*장애인 미동의 시\n  점검 불가)\n- 점검사항 질문 시 질문에 대한 설명 자료를 숙지하고 질문 취지에 어긋나지 않는 범위 내에서 상황에 맞게\n  변형하여 질문.\n- 장애인의 특성과 환경을 고려하여 장애인이 최대한 이해하기 쉽도록 설명하여 답을 얻어야 하며 강압적이거나 특정\n  답을 유도해서는 안됨.\n- 면담 시 장애인이 최대한 편안한 상태에서 진행될 수 있도록 배려해야 하며 바른 용어사용과 예의를 지켜야 함.\n- 이용자 면담 및 관찰을 통한 점검이 불가할 시 답변 및 관찰내용에 점검 불가로 기재하고 이에 대한 사유\n  기재.\n- 장애인의 답이 불명확 시 시간차를 두어 재확인 절차를 거쳐야하며 최종 불명확할 경우 관련 내용과 상황을\n  기재. (자의적인 해석이나 판단으로 내용을 기재하지 않도록 주의)\n- 장애인의 인권보호를 위해 점검결과에 대해 비밀을 유지해야 하며 공식적인 제출처 외에 제3자에게 제공하거나\n  발설･누설할 경우 법적인 조치를 받을 수 있음.\n- 환경점검：장애인과 면담을 통한 개별 인권상황 점검 외에 시설 환경 등에 대한 점검 내용 기재.\n- 점검총괄의견：장애인 인권상황 점검 및 환경 점검에 대한 총괄적인 의견 기재.\n- 조치사항：총괄의견 및 인권침해 상황에 대해 시설에 조정 요청이나 인권지킴이단에 관련 사항 확인요청,\n  장애인권익옹호기관 신고 등의 점검자의 조치사항 기재."}, {"p": 108, "t": "    이용자 인권상황점검표 (인권지킴이단 외부단원용, 그림도구)\n\n 시 설 명                            점검일시\n\n\n 장애인성명                            장애유형\n\n\n 점검방법      ᷺ 면담    ᷺ 관찰   ᷺ 서류    점검자성명                       (인)\n\n\n         점 검 질 문                     답변 및 관찰내용                비고\n                          1. 귀하는 자신의 나이에 맞는 대우를 받고 있나요?\n\n\n                          2. 귀하는 개인 물품을 개인 수납공간에 보관할 수 있나요?\n\n\n                          3. 귀하는 외출이 자유로운가요?"}, {"p": 109, "t": "                          Ⅰ. 장애인거주시설 공통 사항\n\n\n점 검 질 문              답변 및 관찰내용                 비고\n          4. 귀하는 전화하고 싶을 때 마음대로 할 수 있나요?\n\n\n          5. 귀하는 음식을 자유롭게 먹을 수 있나요?\n\n\n          6. 귀하는 의복과 머리 모양 등을 선택할 수 있나요?\n\n\n          7. 귀하는 지역사회에서 생활할 수 있도록 지원을 받고 있나\n             요?"}, {"p": 110, "t": "        점 검 질 문                 답변 및 관찰내용                비고\n                     8. 귀하는 자신의 금전을 자유롭게 사용, 관리하고 있나요?\n\n\n                     9. 귀하는 아플 때 적절한 치료를 받고 있나요?\n\n\n                     10. 귀하는 불만과 의견을 언제든지 말할 수 있나요?\n\n\n                     11. 귀하는 대가 없는 노동을 한 적이 있나요?"}, {"p": 111, "t": "                                            Ⅰ. 장애인거주시설 공통 사항\n\n\n       점 검 질 문                        답변 및 관찰내용                  비고\n\n                           12. 귀하는 다른 이용자 혹은 직원 등 에게 체벌이나 폭력을\n                               당한 적이 있나요?\n\n\n                           13. 귀하는 성적 수치심을 받은 적이 있나요?\n\n\n                           14. 기타 시설에 대한 불편 및 불만 사항이 있나요?\n\n∙ 점검질문 외에 기타 불편 및 불만 사항에\n  대한 확인 문항임.\n\n\n15. 기타 점검자에게 하고 싶은 말이\n    있나요?\n\n\n 점검총괄의견\n\n  조치사항"}, {"p": 112, "t": " ※ 점검 방법 및 점검표 작성법(주의사항)\n\n - 점검자는 점검대상 장애인을 선정하여 1：1 면담 방식을 통해 점검사항 질문에 대한 답변 및 답변 시 관찰된\n   내용을 기재.\n - 점검으로 인해 장애인의 인권을 침해하지 않도록 최대한 설명 후 동의를 얻어 점검 실시.(*장애인 미동의 시\n   점검 불가)\n - 점검사항 질문 시 질문에 대한 설명 자료를 숙지하고 질문 취지에 어긋나지 않는 범위 내에서 상황에 맞게\n   변형하여 질문.\n - 장애인의 특성과 환경을 고려하여 장애인이 최대한 이해하기 쉽도록 설명하여 답을 얻어야 하며 강압적이거나\n   특정 답을 유도해서는 안됨.\n - 면담 시 장애인이 최대한 편안한 상태에서 진행될 수 있도록 배려해야 하며 바른 용어사용과 예의를 지켜야 함.\n - 이용자 면담 및 관찰을 통한 점검이 불가할 시 답변 및 관찰내용에 점검 불가로 기재하고 이에 대한 사유\n   기재.\n - 장애인의 답이 불명확 시 시간차를 두어 재확인 절차를 거쳐야하며 최종 불명확할 경우 관련 내용과 상황을 기재.\n   (자의적인 해석이나 판단으로 내용을 기재하지 않도록 주의)\n - 장애인의 인권보호를 위해 점검결과에 대해 비밀을 유지해야 하며 공식적인 제출처 외에 제3자에게 제공하거나\n   발설･누설할 경우 법적인 조치를 받을 수 있음."}, {"p": 113, "t": "                                            Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 3호]\n\n          종사자 인권지원상황점검표 (인권지킴이단 외부단원용)\n 시 설 명                              점검일시\n\n 종사자성명                               직책\n 점검방법      ᷺ 면담   ᷺ 서류   ᷺ 기타       점검자성명                       (인)\n\n            점 검 질 문                         답변 및 관찰내용           비고      애\n1. 귀 시설은 이용자를 나이에 맞게 대우하고 있나요?\n∙ 대우라 함은 이용자의 연령에 맞는 적절한 존중을\n  의미함.\n∙ 예시) 이용자 나이에 따라 존댓말(반말 여부)을 하는지,\n  이용자가 원하는 호칭을 사용하는지, 이용자의 나이와\n  환경에 맞게 옷차림이 지원하는지 등의 추가 설명\n  가능함.\n2. 귀 시설은 이용자 개인 물품을 개인 수납공간에 보관할\n   수 있게 지원하고 있나요?\n∙ 이용자가 중요하게 여기는 사적 소유물 혹은 그렇게\n  추정되는 물건을 배타적 사유 공간이 있어 보관할\n  수 있도록 지원하고 있는지를 확인하는 것을 의미함.\n∙ 예시) 개인 수납공간 현장 확인.\n3. 귀 시설은 이용자의 외출을 자유롭게 지원하고 있나요?\n\n∙ 이용자가 납득하지 못한 상황에서 임의적으로 외출을\n  제한 시키고 있는지를 확인하고자 하는 것임.\n∙ 예시) 이용자 외출은 어떻게 이뤄지고 있는지, 그리고\n  나가지 못한 경우는 어떤 상황들이 있는지에 대해\n  추가 질문 가능함.\n\n4. 귀 시설은 이용자가 전화하고 싶을 때 마음대로 할\n   수 있게 지원하나요?\n∙ 이용자가 외부에 있는 사람과 전화로 소통하고자 할\n  때 이에 대한 제약한 경우가 있는지를 확인하고자\n  하는 것임.\n∙ 예시) 이용자가 밖에 있는 사람과 전화 통화를 하고\n  싶은데 하지 못하게 하는 경우가 있었는지 추가 질문\n  가능함."}, {"p": 114, "t": "            점 검 질 문                  답변 및 관찰내용   비고\n5. 귀 시설은 이용자가 음식을 자유롭게 먹을 수 있게\n   지원하나요?\n∙ 이용자가 원하는 음식을 바라는 만큼의 양과 충분한\n  시간을 통해 먹을 수 있게 지원 하였는지를 확인하고자\n  하는 것임.\n  ※ 건강상의 이유로 음식의 종류나 양의 지원을 제한\n    하고 있는 경우에 대한 확인 필요.\n∙ 예시) 이용자가 밥을 더 먹고 싶을 때 더 먹지 못하게 한\n  경우가 있었는지, 식사 시간이 넉넉한지, 먹고 싶은\n  간식이 있을 때 어떻게 지원하는지 등의 추가 질문\n  가능함.\n6. 귀 시설은 이용자가 스스로 의복과 머리 모양 등을\n   선택할 수 있게 하나요?\n∙ 이용자의 취향에 따라 의복 및 머리 모양 등을 제한\n  하는지 확인하고자 하는 것임.\n∙ 예시) 이용자가 입고 싶은 옷이 있을 때 어떻게 하는지,\n  이용자가 원한다면 파마, 염색 등을 할 수 있는지\n  추가 질문 가능함.\n7. 귀 시설은 이용자가 지역사회에서 생활할 수 있도록\n   지원하고 있나요?\n∙ 지역사회 생활지원이라 함은 퇴소 후 직면 할 수 있는\n  다양한 어려움과 지역사회 삶의 장점, 활용 가능한\n  서비스정보(생계급여, 활동지원, 장애인연금 및 장애\n  수당 등)에 대해 알려주고, 원가정으로의 복귀를 돕거나\n  관련 시설(체험홈, 그룹홈 등)에 의뢰하는 노력을\n  포함함.\n∙ 예시) 이용자가 시설 밖으로 나가서(체험홈, 그룹홈 등)\n  생활할 수 있도록 도와주는지, 자립생활교육을 지원하는지,\n  지역사회 자원정보와 자원을 활용할 수 있는 방법에\n  대해 지원을 하는지 등으로 추가 질문이 가능함.\n8. 귀 시설은 이용자 스스로 금전을 자유롭게 사용,\n   관리할 수 있게 지원하고 있나요?\n∙ 이용자가 자유롭게 자신의 금전을 사용할 수 있도록\n  하고 있는지, 그리고 자신의 금전을 스스로 관리할\n  수 있도록 지원하는지 등을 확인하고자 하는 것임.\n  ※ 이용자의 금전 사용 및 관리 능력 확인 필요.\n∙ 예시) 이용자에게 통장에 얼마가 있는지 설명을 지원\n  하는지 이용자가 돈을 쓰고 싶을 때 자유롭게 쓸 수\n  있도록 지원하는지 등으로 추가 질문이 가능함."}, {"p": 115, "t": "                                   Ⅰ. 장애인거주시설 공통 사항\n\n\n            점 검 질 문                답변 및 관찰내용           비고\n9. 귀 시설은 이용자가 아플 때 적절한 치료를 받을\n   수 있도록 지원하고 있나요?\n\n∙ 적절한 치료라 함은 이용자의 의료적 상태(감기, 당뇨병\n  등)를 관리하기 위해 시간적, 양적으로 적절한 지원을\n  받는지를 의미함.                                                   제2장\n∙ 예시) 이용자가 아플 때 바로 치료를 받을 수 있도록\n  하는지, 건강검진은 받는지 등의 추가 질문이 가능함.\n10. 귀 시설은 이용자가 자신의 불만과 의견을 언제든지\n    말할 수 있게 지원하고 있나요?\n∙ 불만이라 함은 시설환경, 직원과의 관계, 이용자와의\n  관계 등 생활영역 전반에서 부정적 영향을 미치는\n  불편사항을 의미함.\n∙ 예시) 이용자가 힘들고 어려운 일이 있으면 언제든지\n  말할 수 있도록 하는지, 자치회와 인권지킴이단 등에\n  자신의 의견을 언제든지 말할 수 있도록 하는지 등으로\n  추가 질문이 가능함.\n\n11. 귀 시설은 이용자에게 대가 없는 노동을 시킨 적\n    있나요?\n∙ 정당한 대가 없이 지속적으로 노동력을 착취한 적이\n  있는지에 대한 확인 문항임.\n  ※ 이용자 역할 분담 및 공동의 작업활동 등과 구별\n    필요.\n∙ 예시) 이용자가 힘든 노동 후 대가를 지불하지 않은\n  적이 있는지, 이용자가 일하고 월급 등을 받지 못한\n  적이 있는지, 이용자가 노동 후 대가가 없었을 시\n  이에 대한 설명을 하였는지 등으로 추가 질문이\n  가능함.\n12. 귀 시설은 이용자에게 체벌이나 폭력을 가한 적이\n    있나요? 또는 다른 사람이 이용자에게 가한 것을\n    본 적이 있나요?\n\n∙ 체벌은 고통이 몸에 직접 느껴지도록 벌을 주는 것,\n  폭력은 모든 신체적 폭력을 포괄하는 의미임.\n∙ 예시) 체벌, 또는 가벼운 폭력부터 신체적 학대에\n  이르기까지 포괄하는 것임을 부연 가능함."}, {"p": 116, "t": "            점 검 질 문                    답변 및 관찰내용            비고\n13. 귀 시설은 이용자에게 성적 수치심을 받게 한 적이\n    있나요? 또는 다른 사람이 이용자에게 한 것을\n    본 적이 있나요?\n∙ 성적 수치심은 이용자가 성적인 부끄러움 및 성적\n  학대 여부를 포괄하는 의미임.\n∙ 예시) 이용자 허락 없이 몸을 만지거나 이용자 신체에\n  대해 이야기 하여 이용자의 기분을 나쁘게 한 적이\n  있는가? 이용자에게 불쾌감을 느끼게 한 적이 있는가?\n  등으로 추가 설명 가능함.\n14. 귀 시설에 대해 기타 불편 및 불만(건의) 사항이\n    있나요?\n∙ 점검질문 외에 기타 불편 및 불만 사항, 건의 및 이의\n  제기에 대한 확인 문항임.\n15. 기타 인권 관련하여 점검자에게 하고 싶은 말이\n    있나요?\n\n\n 점검총괄의견\n\n  조치사항\n\n\n ※ 점검 방법 및 점검표 작성법(주의사항)\n\n - 점검자는 점검대상 종사자를 선정하여 1：1 면담 방식을 통해 점검사항 질문에 대한 답변 및 답변 시 관찰된\n   내용을 기재.\n - 점검으로 인해 종사자의 인권을 침해하지 않도록 사전 점검에 대한 설명 후 동의를 얻어 점검 실시.\n - 점검사항 질문 시 질문에 대한 설명 자료를 숙지하고 질문 취지에 어긋나지 않는 범위 내에서 상황에 맞게\n   변형하여 질문.\n - 강압적이거나 특정 답을 유도해서는 안되며 바른 용어사용과 예의를 지켜야 함.\n - 종사자의 답변에 대해 자의적인 해석이나 판단으로 내용을 기재하지 않도록 주의\n - 종사자의 인권보호를 위해 점검결과에 대해 비밀을 유지해야 하며 공식적인 제출처 외에 제3자에게 제공하거나\n   발설･누설할 경우 법적인 조치를 받을 수 있음.\n - 점검총괄의견：종사자 인권지원 상황 점검에 대한 총괄적인 의견 기재.\n - 조치사항：총괄의견 및 인권침해 상황에 대해 시설에 조정 요청이나 인권지킴이단에 관련 사항 확인요청,\n   장애인권익옹호기관 신고 등의 점검자의 조치사항 기재."}, {"p": 117, "t": "                             Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 4호]\n                                     간사         단장\n                                결\n          인권지킴이단 회의록            재\n\n\n  일   시                장 소                              제2장\n\n\n  참 석 자\n  회의안건\n\n\n  회의내용\n\n\n  의결사항\n\n\n  비   고"}, {"p": 118, "t": "[별지 5호]\n                        사실조사 의뢰서\n\n  대상자                생년월일                      성 별    ᷺ 남 ᷺ 여\n\n 의뢰일자                 20    년    월     일   (    요일)\n\n          직책                               직책\n  의 뢰                            의 뢰\n  발신자                            수신자\n          성명               (인)             성명          (인)\n\n\n  의 뢰\n  내 용\n\n\n  비 고\n\n\n※ 침해사례접수시 피해당사자, 목격자 등이 사실조사의뢰서 직접 작성, 인권지킴이단에서 장애인권익옹호기관에 서면제출\n  (구두의뢰시 장애인권익옹호기관에서 신고접수서 작성)"}, {"p": 119, "t": "                                        Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 6호]\n                          진 술 서\n\n\n            성 명                       생년월일\n  진술인       소 속\n\n            주 소\n\n\n  사고경위\n\n\n                     상기 내용이 사실임을 진술합니다.\n                                                    20   .    .     .\n\n                                             자필서명                 (인)\n\n※ 필히, 진술인 본인은 6하 원칙에 의거하여(장소, 사건제시 및 종류 사용되어진 도구 등) 자필로 작성할 것.\n\n  진술서 작성\n- 사실조사 사안에 대한 피해자, 피의자, 목격자 동시 진술서 작성\n- 의사소통이 어려운 경우(장애인)：당사자의 의사내용을 가장 잘 파악한다고 추정되는(담당교사 등) 사람과 동석 후\n  진술에 따른 대리 기록\n- 피해자, 피의자, 목격자 용 진술서 양식은 동일함."}, {"p": 120, "t": "[별지 7호]\n                        침해사실 확인서\n\n\n            성 명                        조사자                   (인)\n\n 구 분        일 시                        장 소\n\n            내 용\n\n\n          1. 질의\n\n          1-1. 응답\n\n\n          2. 질의\n\n          2-1 응답\n\n\n 질의응답\n 내 용\n\n\n                     상기 내용이 사실임을 확인합니다.\n\n                                                    20   .   .     .\n                                             자필서명                (인)\n\n※ 필히, 진술인 본인은 6하원칙에 의거한(장소, 사건제시 및 종류 사용되어진 도구 등) 질의 및 응답 내용 기재"}, {"p": 121, "t": "                                      Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 8호]\n                   이용자 인권침해사실 통보서\n\n\n 제        목\n 수 신 자\n\n 보 고 자        소속         직명                   성명    (인)           애\n 보 고 일                   20   .   .   . ( )\n\n\n 침해 사실\n 내   용\n\n\n 비    고\n\n\n※ 6하원칙에 의하여 자유롭게 서술"}, {"p": 122, "t": "[별지 9호]\n                 이용자 인권침해사실 보고서\n\n\n  조 사 명   ｢○○○씨 인권침해 사실조사｣\n\n  조사목적\n\n  사건개요\n\n  조사기간\n\n  조사위원\n\n               구 분         날 짜   세부 내용   진행자\n             최초 사건 제보\n\n          사건 파악 및 조사팀 구성\n\n           사실조사 계획보고 및\n              진행통보\n\n            피의자 진술서 확보\n\n            피해자 진술서확보\n\n            목격자 진술서 확보\n  세부내용\n             조사자료 정리\n\n            인권침해사실 판단\n\n          결과보고서 작성 및 보고\n            (시설장, 보호자)\n\n           인사위원회 심의요청\n\n           인사위원회 회의 진행\n\n          인사위원회 심의결과 접수\n\n 위원회 측\n 심의결과"}, {"p": 123, "t": "                                 Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 10호]\n             거주시설 인권지킴이단 운영규정(안) 예시\n\n                                         제정 20   . 00. 00\n                                         시행 20   . 00. 00\n\n                제1장 인권지킴이단 운영 총칙\n 제1조(목적) 이 규정은 OOO시설의 인권지킴이단 운영과 관련하여 필요한 사항을 규정함에           주\n   목적이 있다.\n 제2조(명칭) 이 조직의 명칭은 “OOO인권지킴이단”이라 한다.\n 제3조(설치) 인권지킴이단은 역할의 중요성과 원활한 의사결정을 위하여 시설과는 별도의\n   조직으로 운영한다.\n\n\n                 제 2 장 인권지킴이단 구성\n\n\n 제4조(구성) ① 인권지킴이단은 단장 1인을 포함하여 5인 이상 11인 이하의 단원으로 구성\n   한다.\n   ② 외부 단원은 관할 시･군･구에서 지정한 자로 한다.\n   ③ 내부 단원은 입소자, 시설직원 중 인권지킴이단 활동에 동의하고 그 역할을 수행할 수\n   있다고 판단되는 자로 선임한다.\n 제5조(단원의 임면 및 임기) ① 단장과 간사는 외부 단원 중에서 호선으로 선출한다.\n   ② 단장과 단원의 임기는 2년으로 하되 연임할 수 있다.\n   ③ 단장 궐위시 잔여임기가 3개월 이상일 경우에는 신임 단장을 재선출하고, 3개월 미만의\n   경우에는 연장자가 잔여임기를 수행한다.\n 제6조(단원의 책무) ① 모든 단원은 사업을 추진함에 있어 장애인의 인권보장을 위해 최선을\n   다하여야 하며, 단원으로서의 도덕과 품위를 준수하여야 한다.\n   ② 단장은 인권지킴이단의 모든 업무와 그 구성원을 통할한다.\n   ③ 간사는 단장을 보좌하고 지킴이단 실무 책임을 담당하며 인권지킴이단에서 결정한\n   사항을 점검･관리하고 단장과 인권지킴이단에 보고하여야 한다."}, {"p": 124, "t": "  ④ 단장 또는 단원 개인이 직무를 수행하는 과정에서 개인의 과실로 시설에 재산상의\n  피해를 끼쳤을 경우에는 인권지킴이단의 심의에 따라 그 피해에 상응하는 배상을 하여야\n  한다.\n  ⑤ 단원의 책무 준수 및 피해 배상 등에 관한 세부적인 사항은 인권지킴이단에서 따로\n  정할 수 있다.\n 제7조(단원의 해촉) 시설 운영자는 단원이 다음 각 호의 어느 하나에 해당하는 경우에는 제8\n  조의 정기회의 또는 임시회의의 결의를 거쳐 관할 시장･군수･구청장의 동의를 받아 해당\n  단원을 해촉할 수 있다.\n  1. 심신장애로 인하여 직무를 수행할 수 없게 된 경우(다만, 단원 중 시설을 이용하는\n    장애인 제외)\n  2. 직무와 관련된 비위사실이 있는 경우\n  3. 직무태만, 품위손상이나 그 밖의 사유로 인하여 단원으로 적합하지 아니하다고 인정되는\n    경우\n\n\n                    제3장 인권지킴이단 운영\n\n\n 제8조(회의의 종류와 안건) ① 회의의 종류는 그 내용과 시기에 따라 정기회의, 임시회의로\n  구분한다.\n  ② 정기회의는 연4회 이상(분기별 1회 이상)대면회의로 실시하며 임시회의는 필요에 따라\n  수시로 실시할 수 있다.\n  ③ 정기회의의 주요 안건은 이용자 인권보장과 관련한 사례 논의 및 인권지킴이단 운영과\n  역할, 구성관련 사항과 기타사항 등이며 세부내용은 다음 각호와 같다.\n  1. 인권지킴이단 운영 계획 및 결과\n  2. 인권교육 기획 및 점검\n  3. 외부 감시체계 정례화\n  4. 인권침해 발생시 사실 확인 팀 구성 및 계획 수립\n  5. 이용자 인권침해 사례 지원 방안\n  6. 이용자 인권보장을 위한 사례에 대한 자문 및 개선사항\n  7. 이용자 인권보장 향상을 위한 서비스 내용과 조직 구조, 물리적 환경 개선 방안\n  8. 기타 인권상황점검 및 인식개선 사업 계획"}, {"p": 125, "t": "                                 Ⅰ. 장애인거주시설 공통 사항\n\n\n제9조(의사정족수) 회의의 의사정족수는 재적위원 3분의 2이상의 참석으로 한다.\n제10조(의결정족수) 회의의 의결정족수는 참석위원 3분의 2이상의 찬성으로 한다.\n제11조(회의의 고지) 간사는 회의시마다 안건을 회의개최 전 위원들에게 고지하여야 하며\n 고지방법은 전화･팩스･전자우편 등의 방법으로 할 수 있다.\n제12조(회의내용의 기록) 간사는 회의시마다 회의록을 기록･관리하여야 한다.                  제2장\n제13조(회의결과의 보고) 간사는 회의에 관한 기록을 회의 종료 후 2주일 이내에 전체 단원\n 및 관할 시･군･구에 보고하여야 한다.(단, 인권침해 사안은 즉시 보고)\n제14조(기록물의 문서보관) 인권지킴이단의 활동에 관한 모든 기록은 별도의 문서로 출력하여           인\n 간사가 보관하여야 한다.\n\n\n제15조(업무협조) ① 단장은 업무수행을 위하여 필요하다고 인정한 때에는 시설 내 각 부서에\n 대하여 필요한 자료･정보 또는 의견 등의 제출이나 업무협조를 요청할 수 있다.\n ② 협조요청을 받은 부서는 특별한 사유가 없는 한 이에 협조하여야 한다.\n ③ 협조 요청을 받은 부서가 특별한 사유가 있어 이에 응할 수 없는 경우에는 그 사유를\n 명시한 공문을 회신하여야 한다.\n제16조(업무계획) 단장과 간사는 체계적인 업무수행을 위하여 연간계획서를 작성하여 인권\n 지킴이단 회의에 보고･심의토록 하여야 한다.\n제17조(단원의 수당 등) 인권지킴이단의 활동에 참여한 단원에 대하여는 예산의 범위 안에서\n 여비 등 실비와 기타 필요한 경비를 지급할 수 있다.\n제18조(인권지킴이단 활동 내용) 인권지킴이단의 활동 내용은 다음 각호와 같다.\n 1. 인권교육 기획 및 점검\n 2. 외부 감시체계 정례화\n 3. 인권침해 확인 및 진정･고발\n 4. 기타 인권지킴이단에서 예방활동과 관련 필요하다고 판단한 사항\n제19조(인권교육 기획 및 점검) 인권지킴이단은 시설 이용자 연 1회 이상 4시간 이상, 직원\n 연 2회 이상 8시간 이상 실시되도록 기획하고 점검한다.\n제20조(외부 감시체계 정례화) ① 인권지킴이단 단원 중 외부단원 중 1명 이상이 매월 1회\n 이상 시설을 방문하여 시설 내 이용자에 대한 인권침해 여부를 점검하고 점검결과를 관할\n 시･군･구에 보고하고, 인권지킴이단 회의를 위해 자료를 간사에게 전달한다."}, {"p": 126, "t": "  ② 공공후견인후보자 외에 외부 단원은 정기회의 시기에 맞춰 시설을 방문하여 이용자 일부에\n  대해 인권상황 점검을 실시하고 점검 내용을 인권지킴이단 회의를 거쳐 사실 여부를 확인\n  하고 조치 사항 등을 기록한 후 회의록을 통해 관할 시･군･구에 보고한다.\n\n\n              제4장 인권침해 확인 및 진정･고발\n\n\n 제21조(인권침해 상황 인지) ① 이용자 및 시설관계자가 자유롭게 인권침해 사실에 대한\n  정보를 알릴 수 있는 다양한 방법과 경로를 모색한다.(민주적인 의사소통 분위기 조성,\n  고충함 및 진정함 설치, 내부고발제도 운영, 장애인학대신고스티커 부착 등)\n  ② 인권침해 의심 상황을 인지한 자는 인권지킴이단을 거치지 않고 바로 장애인권익옹호\n  기관이나 수사기관에 즉시 신고하고, 관할 시･군･구와 센터에 보고한다.\n 제22조(인권침해 의심 상황 사실 확인) ① 인권지킴이단은 침해접수 상황이 긴급을 요할 시\n  장애인권익옹호기관이나 수사기관에 즉시 신고해야 하며 사실확인이 필요한 사안에 대해서만\n  사실확인을 실시하고, 관할 시･군･구와 센터에 보고한다.\n  ② 인권침해 사실 확정 시 경미한 침해 사안(말투, 태도, 사소한 다툼 등)에 대해서는 내부\n  규정에 따리 인사 또는 징계조치 한다.\n  ③ 사실 확인 후 침해 사안의 경･중을 판단할 수 없을 경우 장애인권익옹호기관이나 수사\n  기관에 즉시 신고하거나 국가인권위원회에 진정하고, 관할 시･군･구와 센터에 보고한다.\n 제23조(신고･진정･고발) 인권침해의 소지가 있는 것으로 판단될 경우 즉시 분리, 보호 후\n  인권지킴이단 명의로 장애인권익옹호기관이나 수사기관에 신고를 통해 조사를 요청하고,\n  관할 시･군･구와 센터에 보고한다. 사안에 따라서는 국가인권위원회에 진정을 통해 조사를\n  요청한다.\n 제24조(사후조치) ① 인권침해 사실 확정 시 즉시 법정보호자에게 통보해야 한다.\n  ② 인권지킴이단은 인권침해를 당한 이용자가 침해한 자로부터 피해를 충분하게 보상받을\n  수 있도록 조력해 주어야 한다.\n  ③ 인권지킴이단은 시설에 인권침해에 따른 시설 내 행정조치를 의뢰하여 침해자에 대한\n  징계처리, 피해자에 대한 지원조치, 사후 예방 계획 수립 등을 실시하도록 한다."}, {"p": 127, "t": "                                Ⅰ. 장애인거주시설 공통 사항\n\n\n                 제5장 기타 운영 사항\n\n\n제25조(인권침해 사례 신고자의 보호) 시설장과 관할 시･군･구는 이용자의 인권침해 사례를\n 제보한 시설 이용자, 직원, 자원봉사자 등이 제보에 따른 불이익을 받지 않도록 조치할\n 의무가 있다.\n제26조(운영 활성화) 인권지킴이단은 운영상황을 분기별로 관할 시･군･구에 보고해야 한다.\n제27조(직원단원에 대한 보상) 장애인거주시설 시설장은 인권지킴이단 담당 직원이 인권             장\n 지킴이단 업무를 성실히 수행할 수 있도록 지원계획 수립 및 지원해야 한다.\n                      부 칙\n\n\n제1조(시행일) 본 규정은 2○○○년 ○월 ○일부터 시행한다."}, {"p": 128, "t": "[별지 11호]\n                         ○○○○ 인권지킴이단\n\n\n수신자：\n(경유)\n\n제 목：\n\n\n                             00000 인권지킴이단장\n수신처\n인권지킴이단        간사 000                      단장 000\n협조자\n시행 00인권 00-       호 (2000.   .   .)     접수 ( 20       .     .    .)\n우000-000 00시 00구 0000로\n전화 000-000-0000     / 전송 000-000-0000     /       000000@0000.or.kr"}, {"p": 129, "t": "                                            Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 12호]\n\n\n                      이용자 인권교육 미지원 사유서\n\n\n      시 설 명                           대 표 자                                제2장\n\n                                      전화번호\n      담 당 자\n                                      팩스번호\n      주    소\n\n\n no       이용자명             미지원 사유                이용자 동의           비고\n\n\n               00000에서는 상기 이용자에 대한 인권교육 미지원 사유서를 제출합니다.\n\n                             20 년 00월 00일\n\n                                            000000시설장：    0 0 0     (직인)"}]}, {"title": "5. 종사자 및 이용자 인권교육", "start": 130, "end": 131, "pages": [{"p": 130, "t": " 5 종사자 및 이용자 인권교육\n\n가. 이용자 인권교육\n\n ○ 이용자 인권교육은 이용자 전체를 대상으로 실시함을 원칙으로 하며, 연 1회\n   (4시간) 이상 실시한다.\n  - 교육내용：이용자 인권 권리주장 방법, 인권침해 시 대처요령, 이용자 간 인권\n    존중 및 직원 인권 존중, 이용자 성교육 등\n   * 관련 근거 : ｢사회복지사업법｣ 제4조제6항(복지와 인권증진의 책임)\n\n ○ 시설장은 이용자 인권교육 중 1시간 이상은 장애인 거주시설 이용자를 대상\n   으로 성교육을 실시해야 한다.\n  - 교육 내용 : 장애인의 건전한 성가치관 형성 및 성 관련 자기 옹호에 필요한\n    지식과 기술, 장애인에 대한 성범죄를 예방하기 위한 지식과 기술, 장애인을\n    위한 성범죄 관련 대처 방법, 성적 자기 결정권에 관한 사항, 그 밖에 장애인\n    거주시설 이용자 성교육에 필요한 사항\n  - 교육 방법 : 시설 운영자는 시설 이용자에 대한 성교육을 성교육프로그램\n    및 교육자료 등을 활용하여 시설 이용자의 특성을 고려하며 진행해야 함\n   ※ 장애인 거주시설 이용자에 대한 성교육은 장애인 성교육 전문기관(강사)에 의뢰하거나 성교육\n     프로그램 및 교육자료 등을 활용하여 시설 자체적으로 진행 가능\n\n ○ 내부교육 뿐 아니라 외부에서 실시하는 인권교육 참여도 인정한다.\n\n ○ 인권교육은 이용자의 특성에 맞추어 내용을 구성하고 다양한 형식과 방법(개별,\n   소집단으로 그림카드, 애니메이션 등 다양한 자료 활용)을 고려하여야 한다.\n\n ○ 이용자의 특성을 고려하여 교육 진행이 어려울 경우 이에 대한 사유 및 동의서를\n   첨부하여 반드시 관할 시･군･구에 통보하여야 한다.(단, 미실시 대상자에 대해\n   시설 자체적으로 인권교육의 실행 노력이 필요하며 실행에 대한 근거를 제시할\n   수 있어야 함)\n\n ○ 교육의 계획과 실행, 평가자료는 반드시 기록, 보관한다."}, {"p": 131, "t": "                                   Ⅰ. 장애인거주시설 공통 사항\n\n\n나. 직원 인권교육\n\n○ 시설장은 신입(3년 이내)･장기(10년 이상) 돌봄 종사자 중심으로 외부 전문가\n  활용한 인권교육, 대면교육 참여 독려 등 장애인 인식개선을 위해 노력한다.\n\n○ 시설장은 이용자 장애유형 및 정도에 따른 인권교육 프로그램 마련･적용을                     제2장\n\n  위해 노력한다.\n○ 직원 인권교육은 시설 직원 전체를 대상으로 실시함을 원칙으로 하며 반드시\n  연 2회(8시간) 이상 실시한다.(단, 하반기 채용자는 익년부터 적용)\n - 교육 내용：시설이용자 인권 딜레마 사례, 인권 감수성, 인권의 가치, 도전적\n           행동 지원, 장애아동 인권 관련 내용 등\n\n  ※ 장애아동이 생활하고 있는 장애인 거주시설에서 장애아동을 지원하는 직원은 인권교육 시간 중\n   1시간 이상은 장애아동 인권 관련 교육을 받아야 함\n\n - 교육의 중요성 및 교육의 효과를 위해 소집단교육, 대면교육 등의 형태로\n  실시함을 원칙으로 하되 불가피한 경우 온라인 교육도 가능(이 경우 지자체\n  에서 확인)\n\n○ 외부 인권 관련 기관에서 실시하는 인권교육 참여를 우선한다.\n\n○ 시설장과 사무국장은 매년 보건복지부 또는 시･도 주관 인권침해 예방 집합\n  교육을 이수하여야 한다.(의무교육 시간에 포함 가능)\n\n  ※ 교육 미이수시 전년도 장애인거주시설 인권실태조사 실시 여부와 상관없이 추가 인권실태조사 실시\n\n  ※ 공동생활가정 등 시설운영 상 부득이한 경우 인권위 등 국가기관이 주관하는 인권관련 온･오프라인\n   교육 수강 가능(수료증 이수 및 증명 필요)\n\n○ 교육의 계획과 실행, 평가자료는 반드시 기록, 보관한다."}]}, {"title": "6. 장애인거주시설 안전 관리", "start": 132, "end": 137, "pages": [{"p": 132, "t": "다. 인권교육 운영 및 강사 자격\n\n ○ 직원 및 이용자 인권교육은 외부 강사를 초빙하여 진행함을 원칙으로 하되\n   인권교육 강사양성과정 수료자에 한하여 내부 교육을 진행할 수 있다.\n   (단, 강사양성과정 수료자에 의한 내부 교육은 이용자 인권교육 2시간, 직원\n   인권교육은 4시간에 한해 인정)\n\n ○ 인권교육 외부강사\n\n  - 국가인권위원회 주관 인권교육 관계자 및 양성과정 수료자\n  - 인권단체 소속으로 3년 이상 활동한 자\n  - 지자체, 공공기관 및 인권지킴이지원센터에서 주관한 인권교육 강사양성과정\n    수료자\n  - 사회복지학과 교수\n  - 기타 위 각호에 준하는 인권 관련 자격 및 경력이 있다고 인정되는 자\n\n\n 6 장애인 거주시설 안전 관리\n\n가. 배경 및 목적\n\n ○ 수해, 폭설, 산사태 등의 자연재해 및 화재, 가스누출, 전기 누전 등 각종\n   안전사고에 대한 사전 예방 철저를 도모하고\n  - 긴급사항 발생 시 관련 조치사항 등을 안내함으로써 상시 시설 안전에 만전을\n    기하기 위함\n\n\n나. 기본사항\n\n ○ 적용 대상：｢장애인복지법 시행규칙｣ [별표 4]에 규정된 장애인 거주시설\n   (장애인 공동생활가정 제외)"}, {"p": 133, "t": "                                      Ⅰ. 장애인거주시설 공통 사항\n\n\n○ 동 지침에서 정한 사항 외에 소방, 전기, 가스 등 법령에 따른 안전 관련\n 사항은 모두 준수하여야 함\n\n○ 시설 내 안전관리 체계\n- 시설장을 안전관리책임관으로 지정하여 안전업무 실무자를 관리하고, 안전\n  관리 전반을 지휘･감독･지원\n * 안전관리 특성상 시설보강, 교육비 투입 등 예산 소요가 많고 훈련 시 다수의 인원을 효율적으로 동원해야      장\n   하므로 시설장 지휘･관심 필요\n- 소방안전관리 교육 이수자*를 중심으로 소방안전관리자를 지정하여 소방계획\n  수립, 소방훈련 및 소화기구 점검 등을 실시하고 미흡사항은 안전관리\n  책임관에게 보고하여 시정\n * ｢ 소방기본법｣ 제40조에 따라 한국소방안전협회(http:www.kfsa.or.kr)에서 실시하는 소방안전\n   관리자 교육\n\n- 보건복지부에서 발간한 장애유형별 피난매뉴얼을 참고하여 각 시설의 특성에\n  맞는 “자체 피난매뉴얼” 마련\n- 보건복지부에서 제공한 “야간근무 지침 표준(안)[별지1]”을 참고하여 시설별\n  “자체 야간근무 지침”을 마련\n\n○ 훈련 및 교육\n- 시설장 주관 하에 실제 상황을 고려한 모의훈련*을 연 2회 이상 실시(연 1회\n  이상은 관할 소방서 등 전문기관 합동으로 실시)\n * 주관/참여：시설장(안전관리책임관) / 종사자･이용 장애인(생활자에게 훈련 공개)\n * 필요시 보호자 참관\n * 이용 장애인 참여가 어려운 경우 대체물품(인형 등) 적극 활용, 대피 완료시간 체크 등 목표위주\n   훈련으로 실시\n * 도서벽지지역 등 소방서 등 전문기관 합동 모의훈련 실시가 사실상 어려운 경우 자체훈련 가능\n   (추후 지도점검시 지자체 확인)\n\n- 아울러 이용 장애인 및 종사자 대상 소화요령, 인명대피, 유도요령 등에 대한\n  소방교육을 분기별 1회 이상 실시할 것"}, {"p": 134, "t": " ○ 방염시설 설비\n  - 시설 내 층별, 용도별, 방화벽, 방화문, 경계벽 등에 대해 방화구획을 설정하고\n    내장재의 불연화 시설의 설비 및 커튼, 카펫, 종이류를 제외한 벽지, 방출입문 등\n    목재시설에 대해서는 방염처리 할 것\n\n ○ 안전점검 사항\n  - 소방시설：시설은 소화시설(소화기, 자동탐지기, 소화전, 스프링클러 등), 피난\n    시설(미끄럼대, 피난사다리, 유도등, 비상조명 등), 경보설비(비상벨, 비상방송\n    설비, 누전경보기 등)의 작동 여부 및 비상구(복도, 계단, 경사로 등) 등 소방시설에\n    대한 점검을 정기적으로 실시하고 점검일지를 기록\n\n  - 전기 및 가스시설：시설은 화기 사용시설(난방, 취사), 가연성 가스시설(LNG\n    시설, LPG시설, 도시가스시설 저장 및 취급), 전기시설(변전, 발전, 옥내외배선,\n    누전경보시설, 환기시설 등), 냉난방시설(보일러, 냉동기, 공조기, 각종 배관 등)에\n    대해 정기적으로 안전점검을 실시하고 점검일지를 기록\n\n  - 시설 노후화：시설 노후화에 따른 벽체 균열, 파손 및 옹벽, 지지대와 같은\n    시설안전과 직접 관련 있는 시설에 대해 정기적으로 점검을 실시하고 점검\n    일지를 기록\n\n ○ 장애인 보호구역 지정\n\n  - (관련 근거) ｢어린이･노인 및 장애인 보호구역의 지정 및 관리에 관한 규칙｣\n\n  - (신청 절차) 장애인복지시설을 설립･운영하는 자는 특별시장･광역시장･\n   특별자치도지사 또는 시장･군수에게 장애인복지시설의 주변도로를 장애인\n   보호구역*으로 지정하여 줄 것을 신청할 수 있다.\n   * 장애인 보호구역 지정을 신청할 수 있는 시설이 장애인 거주시설에서 장애인복지시설로 확대\n    (’22.4.20.)\n\n   ※ 특별시장･광역시장･특별자치도지사 또는 시장･군수(광역시의 군수는 제외한다. 이하 ‘시장등’\n    이라 함)는 장애인복지시설의 신청이 없어도 장애인을 보호해야 할 필요성이 특별히 인정되는\n    경우에는 직접 보호구역 지정대상 시설 또는 장소의 주변도로를 보호구역으로 지정할 수 있으며,"}, {"p": 135, "t": "                                     Ⅰ. 장애인거주시설 공통 사항\n\n\n   시장등은 매년 3월 31일까지 다음 연도의 보호구역(어린이, 노인, 장애인) 지정･관리 계획을\n   수립하고, 이를 매년 4월 30일까지 특별시･광역시･특별자치도의 경우에는 관할 시･도경찰청장을\n   거쳐, 시･군의 경우에는 관할 경찰서장을 거쳐 경찰청장에게 통보하여야 함\n\n○ 장애인거주시설은 성희롱･성폭력 고충상담원을 1명 이상 지정하여 성희롱･성폭력\n  예방(교육 등)과 상담･신고를 지원해야 한다.                                     제2장\n\n\n다. 화재 발생시 조치사항\n○ 초동대응 철저\n - 누구든지 화재의 발생사실을 최초로 목격하는 자는 119에 신고하고 구내전파\n  및 초기소화 등 신속한 초동대응을 취할 것\n\n        기타 대피 요령\n\n    ∙ 화재발생 시 종사자들은 질서있게 이용장애인의 대피를 유도하고, 대피 유도시 불안감을\n      조성하지 않도록 큰소리를 외치는 행동은 자제하고 침착하게 행동할 것\n    ∙ 유독가스와 연기로 인한 질식들 방지하기 위해 수건 등을 물에 적셔서 입과 코를 막고 숨을\n      짧게 쉬며 가능한 한 낮은 자세로 엎드려 대피토록 유도하되, 엘리베이터는 이용하지 않도록\n      할 것\n    ∙ 아래층으로의 대피가 불가능할 시, 옥상으로 대피시켜 구조를 기다리도록 하고 이 경우\n      이용 장애인들이 동요하지 않도록 주의를 기울이며 바람을 등지게 하는 등 적절한 조치를 취할 것\n\n\n라. 감염병 및 식중독 예방 등 위생관리 철저\n\n○ 감염관리자 지정\n\n - 장애인 거주시설은 감염관리자를 지정하여 감염병의 예방 및 확산 방지를\n  위해 노력해야 함\n\n○ 의료연계체계 구축\n\n - 지자체(보건소) 및 지역 의료기관과 협력하여 의료연계체계를 구축해야 함"}, {"p": 136, "t": " ○ 예방 및 대응 매뉴얼 마련\n  - 시설에서는 감염병 및 식중독 예방 및 만연 방지를 위한 위생관리 매뉴얼을\n    마련하고 이를 이용장애인 및 종사자를 대상으로 정기적으로 교육하고 이를\n    기록할 것\n\n ○ ｢식품위생법｣에 따라 1회 급식인원(종사자 포함)이 50명 이상인 장애인\n   거주시설은 집단급식소 시설기준을 갖추고 설치･운영 신고를 하여야 함\n   * 집단급식소 설치 신고 대상임에도 미신고할 경우 500만원 이하의 과태료 부과(｢식품위생법｣제101조)\n\n ○ 상시 연락체계유지\n\n  - 상황발생시를 고려하여 관계기관과의 비상연락망 유지 및 행정기관에의\n    보고조치, 시설 내 연락체제 등을 마련할 것\n\n ○ 사회복지급식관리지원센터\n\n  - (목적) 노인･장애인 등 취약계층 사회복지시설의 위생･영양관리 지원 및\n    식생활 교육 등을 통한 급식 안전관리 도모\n\n  - (지원시설) 영양사가 없는 소규모 노인･장애인 복지시설\n\n  - (지원대상) 사회복지시설을 이용하는 노인･장애인 등 이용자, 시설장･\n   조리원･요양보호사 등 종사자\n\n  - (지원내용) ① 전문 영양사의 급식 위생･영양 관리 방문지도 ② 맞춤형 식단\n   조리안내서 제공 ③ 대상별 식생활 교육 및 상담 ④ 교육자료 등\n   * 해당 시･군･구에 사회복지급식센터가 없는 경우에는 지원내용 중 일부만 지원 받을 수 있음\n\n  - (센터 현황) 급식관리지원센터 홈페이지(dietary4u.mfds.go.kr) 참조\n\n  - (신청 절차) (센터 운영 시･군･구) 홈페이지, 우편, 팩스 신청 (해당 시･군･구\n   미설치) 인근 사회복지급식센터"}, {"p": 137, "t": "                                   Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 1] 야간 근무지침(안)\n\n\n                    야간 근무지침 표준(안)\n  1. (목적) 본 지침은 야간근무자의 근무절차와 방법 등을 규정함으로써 야간 등 취약             제2장\n     시간대에 시설 입소자 및 종사자의 안전 및 인권을 지키는 것을 목적으로 한다.\n\n  2. (적용) 본 지침은 다음의 범위에 적용된다.\n    1) 인적범위：당직자에게 최우선 적용된다. 다만 당직자가 아니더라도 야간(22~06시)에          애\n       시설물의 안전 및 초동대처를 책임지는 종사자는 근무의 형태와 명칭, 인원수를 불문하고         거\n       이 지침의 적용을 받는다.(이하 당직자로 칭함)\n    2) 시설범위：장애인거주시설(공동생활가정 제외)\n    3) 시간범위：야간(22~06시). 단, 시설내 야간교대근무 시간이 있는 경우 그에 따른다.\n\n  3. (근무준비) 당직자는 18시에(교대근무자는 근무교대시) 당일을 기준으로 야간 안전\n     취약요인을 확인하고 비상시 대피방법 등을 준비하여야 한다. 준비사항은 다음과\n     같으며 기록으로써 유지한다.\n    1) 당일 입소현황, 당일 층별 최단 대피경로 확인\n       (와상환자, 거동불편자 등 취약환자 위주로 파악)\n    2) 초동조치를 위한 소화기 위치 및 대피경로상 방해요인 제거\n    3) 비상시 시설 내외 비상연락망(소방관서, 의료기관) 확인\n    4) 당직업무 수행을 위한 지참물：마스터키 등\n\n  4. (준비확인) 당직자의 안전 준비사항은 다음 방식으로 확인한다.\n    1) 확 인 자：시설장(부득이한 경우 최선임자 順)\n    2) 보 고 자：당직자\n    3) 확인방법：당직자는 준비상태를 기록한 문서와 함께 구두로써 이를 보고하고,\n       확인자는 질의응답의 형태로 준비상태를 반드시 확인한다(크로스체킹). 이때 미흡한\n       부분에 대해서는 지적을 하여 보완토록 한다.\n    4) 확인종결：확인자는 준비상태가 충분함을 확인하는 의미로 기록지에 서명하고,\n       관련서류는 2년간 보존한다.\n\n  5. (근무실시) 준비상태를 확인종결 받은 당직자는 규정된 시간에 근무를 하고 시설의\n     순찰을 최소 2시간에 1번씩 실시한다(단 시설에 3시간 이내의 빈도로 별도 순찰 등\n     규정이 있는 경우 그에 따른다). 순찰시 특이사항은 당직일지에 기록한다.\n\n  6. (초동대처) 순찰 또는 신고 등으로 비상상황을 인지한 경우 입소자 등을 최단경로로\n     대피시키고, 비상연락망의 가동 및 가능한 범위에서 초기진화 등을 실시하여야 한다.\n\n  7. (당직점검) 당직 준비확인을 한 확인자는 불시에 당직상태를 점검할 수 있다."}]}, {"title": "7. 응급환자 발생 및 안전사고 시 조치사항 등", "start": 138, "end": 147, "pages": [{"p": 138, "t": " 7   응급환자 발생 및 안전사고 시 조치사항 등\n\n가. 응급환자 관련 조치내용\n\n ○ 시설에서 위독, 사고 등으로 인해 갑작스러운 응급환자가 발생할 경우 간호사의\n     응급 처치를 실시하고 119 호출, 협약의료기관, 인근 병원과 연락, 자체\n     구급차량 이용 등 가장 신속한 방법으로 의료기관을 이용할 수 있도록 한다.\n\n ○ 시설의 물리치료사와 간호사는 응급대처 요령을 숙지하고 시설의 여건상\n     의사와 간호사가 현장에 즉시 투입할 수 없는 야간 등의 상황을 대비하여\n     생활지도원 등 모든 직원이 조치방법을 습득할 수 있도록 교육을 실시한다.\n\n ○ 시설 이용 장애인의 응급상황 및 안전사고에 대하여 긴급조치 후 보호자\n     연락을 신속하게 취하여야 하며, 사례보고, 의무기록지 등을 참고하여 최선의\n     방지 대책을 수립하도록 한다.\n\n ○ 응급환자 발생 시 의식상태, 통증 유무, 출혈 유무 등을 확인하고 필요한\n     조치를 취하도록 하여야 한다.\n\n\n나. 의료서비스 지원\n\n ○ 장애인거주시설 입소 장애인에 대한 적합한 의료서비스를 제공하기 위해 필요시\n     의사(한의사를 포함) 또는 촉탁의사(의료기관에 근무하거나 시간제 계약에\n     따른 의사를 포함)를 1명 이상 지정할 수 있으며, 시설장이 의사인 경우에는\n     의사를 따로 두지 않을 수 있음.\n\n ○ 촉탁의사 운영은 ‘장애인거주시설 촉탁의사 운영규정’(붙임)을 준수하여야\n     하며, 촉탁의사는 시설 종사자가 아니므로 4대 사회보험에 가입할 수 없음."}, {"p": 139, "t": "                                   Ⅰ. 장애인거주시설 공통 사항\n\n\n○ 의사 또는 촉탁의사를 탄력적으로 운영하며, 의사 또는 촉탁의사를 두지 않을\n  경우 간호사 또는 간호조무사 인력1명을 충원하여 입소 장애인에 대한 서비스를\n  지원 할 수 있음\n  * 간호사 또는 간호조무사를 채용하는 경우 시설에 간호사가 없으면 간호사를 우선 채용하도록\n    노력하여야 한다.                                                 제2장\n\n○ 의사 또는 촉탁의사를 두고 있는 경우, 의사 또는 촉탁의사는 월 4회 이상\n  시설을 방문하여 월 32시간 이상 진찰 등을 실시하도록 하되, 시설 유형, 장애\n  정도, 의료접근성, 신속성 등을 고려하여 시설에서 탄력적으로 운영하도록 함\n - (30인 미만 시설) 1회 방문시 입소 이용자 전원을 진찰하고 진료일지 작성 시\n  日 8시간 근무한 것으로 간주\n\n - (30인 이상 시설) 30인 이상 시설은 1회 방문시 현원 1/4 이상 진료하되\n   1/4이 30명이 되지 않을 경우 30명 이상 진료하고 진료일지 작성 시 日\n   8시간 근무한 것으로 간주\n  ※ 질병 등으로 진료가 필요한 인원은 반드시 진료하고 모든 입소자들은 한 달 1회 이상 진료하도록\n    노력할 것\n\n\n다. 의약품 관리\n\n1) 약품 관리담당자(간호사 또는 간호조무사)의 역할과 책임\n\n - 투약할 약과 관련된 최신의 지식을 갖추고 설명할 수 있어야 함\n\n - 투약을 정확하게 수행할 수 있는 기술을 갖추어야 함\n\n - 투약할 환자를 개별적으로 사정하여야 함\n\n - 투약기록 및 환자의 반응을 사회복지시설정보시스템 및 간호지원일지 등을\n  활용하여 기록함\n\n - 약품을 안전하게 취급하고 보관하여야 함"}, {"p": 140, "t": " 2) 약물 투여방법\n\n  - 정기투약：병원진료 후 처방받은 약을 가지고 와서 각 이용자별 투약함에\n    보관하고 구분된 투약 통에 요일별, 처방시간과 빈도에 따라 준비하여\n    투약을 실시함\n\n  - 수시투약：시설에서 간호사의 처방권이 보장되지 않기 때문에 일반 의약품\n    (가정에서 상비 가능한 의약품)만을 구비하고 필요시 투약함\n\n\n 3) 투약 시 유의사항\n\n  - 투약 전에 항시 손을 씻어서 감염을 극소화 함\n\n  - 약의 복용방법을 정확히 알고 투여함\n\n  - 약은 준비한 즉시 투여하고 경구 투약 시 투약이 끝날 때까지 환자 곁에\n    있어야 함\n\n  - 투약을 한 후에 환자의 반응을 관찰함(오심, 구토, 설사, 피부 발적 등)\n\n  - 투약 전에 이름을 확인하여 약이 바뀌지 않도록 주의함\n\n\n 4) 원내 투약 관리\n\n  - 이용자 개인별로 진료를 실시하여 처방약을 받아 개인으로 구분된 약통에\n    하루 투여 횟수대로 구분하여 약을 정리함\n\n  - 투약 시 약품 관리담당자 책임 하에 투약 유의사항을 준수하며 투약 실시할\n    수 있도록 함\n\n  - 투약변화 있을 시 생활지도원 등에게 알려 부작용 등을 관찰 의뢰함\n\n  - 처방이 바뀌어 폐기되는 약은 의료폐기물 수거함에 넣거나 약국에서 폐기처분\n\n  - 개인 약과 일반의약품을 안전하게 보관하기 위하여 잠금장치를 함\n\n  - 연 1회 이상 투약과 관련된 직원교육을 실시함"}, {"p": 141, "t": "                                  Ⅰ. 장애인거주시설 공통 사항\n\n\n[붙임]\n             장애인 거주시설 촉탁의사 운영규정\n\n 제1조(목적) 이 규정은 ｢장애인복지법 시행규칙｣ 별표 5. Ⅰ.공통기준 4호다목 규정에 따라\n   장애인거주시설 이용 장애인에 대한 적합한 의료서비스를 제공하기 위해 장애인 거주시설\n   (이하 “시설”이라 한다)이 의사 또는 촉탁의사를 두는 경우 해당 촉탁의사가 시설을 방문하는\n   횟수 등 운영에 관하여 필요한 사항을 정함을 목적으로 한다.\n 제2조(계약체결) 시설의 장은 촉탁의사와 촉탁계약을 체결하는 경우, 붙임 4의 서식을 참고           인\n   하여 의원 및 병원 등 의료기관에 근무하는 해당 의사와 계약을 체결하되, 협약 사항을            주\n   반드시 포함하여야 한다.\n\n   * 의료기관 소속 의사와의 계약체결은 신규 또는 재계약부터 적용\n\n 제3조(촉탁의사 추천) ① 시설의 장은 촉탁의사를 두는 경우, 붙임 1의 서식에 따라 시설\n   소재지를 관할하는 의사단체(대한의사협회･대한한의사협회 또는 시도의사회･시도한\n   의사회)에 촉탁의사 추천을 요청하여야 한다.\n   ② 제1항에 따른 요청을 받은 의사단체(대한의사협회･대한한의사협회 또는 시도의사회･\n   시도한의사회)에서는 전문성, 신뢰성, 봉사성, 이동거리 등을 고려하여 붙임 2의 서식에\n   따라 추천하여야 한다.\n\n 제4조(촉탁의사 지정) ① 시설의 장은 제3조에 따라 의사단체(대한의사협회･대한한의사협회\n   또는 시도의사회･시도한의사회)에서 추천한 자 중에서 촉탁의사를 지정하되, 복수 지정도\n   가능하다.\n   ② 시설의 장은 촉탁의사를 지정한 경우, 시장･군수･구청장에게 신고하여야 하며, 사회복지\n   시설정보시스템에 등록하고, 붙임 3의 서식에 따라 의사단체(대한의사협회･대한한의사협회\n   또는 시도의사회･시도한의사회)에도 통보하여야 한다.\n   ③ 지정된 촉탁의사의 임기는 1년으로 한다.\n\n 제5조(촉탁의사의 입소자 방문횟수) 촉탁의사는 월 4회 이상 시설을 방문하여 월 32시간 이상\n   이용 장애인 진찰 등을 실시하여야 한다.\n\n 제6조(촉탁의사 활동) ① 촉탁의사는 이용 장애인의 건강상태를 정기적으로 확인하고 건강\n   상태가 악화된 입소자에 대하여 적절한 조치를 하여야 한다."}, {"p": 142, "t": "  ② 촉탁의사는 필요한 경우 시설의 간호사 또는 간호조무사 (이하 ʻʻ간호인력ʼʼ)에게 간호지시\n  및 투약처방을 할 수 있으며, 그 이행여부를 확인할 수 있다.\n\n  ③ 촉탁의사는 이용자의 상태에 따라 의료기관으로의 입원치료가 필요한 경우 입원치료를\n  권유하며 시설장은 이에 협조하여야 한다.\n\n 제7조(이용 장애인에 대한 촉탁의사의 기록지 작성･보관) ① 원외처방한 이용 장애인에 대해서는\n  의료법 시행규칙 제14조제1항제1호에 따른 진료기록부에 기록하고 그 원본을 의료기관에\n  10년간 보관하여야 한다.\n\n 제8조(간호인력의 이용 장애인에 대한 건강관리기록) 시설의 장은 시설의 간호인력으로\n  하여금 이용 장애인의 건강 상태를 체크, 기록하게 하여야 하며, 촉탁의사가 시설을 방문\n  하였을때에 건강관리기록을 보고 적절한 조치나 지도를 할 수 있도록 하여야 한다.\n\n 제9조(활동비용) ① 촉탁의사 활동에 따른 비용은 ｢장애인복지시설 사업안내｣의 장애인거주\n  시설 종사자 인건비 지원기준에 따른다.\n  ② 촉탁의사와 시설 간의 부당한 경제적 이익 등의 취득을 위한 목적으로 제공되는 경제적\n  이익 등을 받거나 받게하여서는 안된다.\n\n 제10조(경과규정) 이 규정 시행일 당시 촉탁의사를 두고 있는 시설은 이 규정에 따른 추천\n  및 지정절차는 기존 계약이 끝나고 신규 계약을 체결하는 시기 또는 2020년 1월 1일부터\n  이행하여야 한다.\n\n 제11조(준용규정) 이 규정에서 포함하지 않는 내용에 대해서는 ｢장애인복지법｣, ｢장애인\n  복지시설 사업안내｣의 장애인 거주시설 촉탁의사 관련 사항을 준용한다.\n\n\n                     부 칙<2019.2.15.>\n  이 규정은 2019년 3월 1일부터 시행한다.\n\n\n                     부 칙<2020.3.10.>\n  이 규정은 2020년 4월 1일부터 시행한다."}, {"p": 143, "t": "                                Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 제1호 서식]\n\n\n                   촉탁의사 추천요청서\n\n  □ ○○○ 지역의사회장 귀하\n  □ 기관현황\n     시설의 명칭：\n     시설 유형：\n     입소정원 및 현원：\n     소재지 및 연락처：\n\n\n  □ 추천요청\n     당해 시설에 촉탁의사를 지정하기 위하여 추천을 의뢰하오니 추천하여\n     주시기 바랍니다.\n\n\n  ○ 참고\n      1) 추천을 요청하는 의사\n         (붙임서식에 따라 성명, 소속 의료기관 및 연락처를 기재)\n      2) 의사단체(대한의사협회 또는 지역의사회)를 통해 추천받은 후보자를 지\n         정하지 않거나 재추천을 요구하는 경우 그 사유 (100자 이내)\n\n\n                               년    월     일\n\n\n                        시설장(대표자)              (인)"}, {"p": 144, "t": "[별지 제2호 서식]\n\n\n                          촉탁의사 추천서\n\n\n  □ ○○○ 시설장       귀하\n\n\n  □ 추천 대상자\n              소속 의료기관명       성명                촉탁의사\n    순번                              전공과목               비고\n                 (기호)      (면허번호)              연락처\n\n\n     1. 위와 같이 추천합니다.\n     2. 귀 기관에서 위 추천 대상자 중 촉탁의사를 지정한 경우, 그 결과를\n         우리 회로 회신하여 주시기 바랍니다.\n\n\n                                           년      월     일\n\n\n                         ○○○ 지역의사회장                   (직인)"}, {"p": 145, "t": "                                  Ⅰ. 장애인거주시설 공통 사항\n\n\n[별지 제3호 서식]\n\n\n                    촉탁의사 지정통보서\n\n   □ ○○○ 지역의사회장     귀하\n   □ 기관현황\n      시설의 명칭：\n      시설 유형：\n      입소정원 및 현원：\n      소재지 및 연락처：\n\n\n   □ 촉탁의사 지정서\n\n                    성명(면허번\n     소속 의료기관명(기호)            위촉(활동)기간          비고\n                      호)\n\n                                  ~\n\n\n       위와 같이 촉탁의사를 지정하였기에 그 결과를 통보합니다.\n\n\n                                  년     월     일\n\n\n                       시설장(대표자)             (인)"}, {"p": 146, "t": "[별지 제4호 서식]\n\n                    장애인거주시설 촉탁의사 촉탁계약서\n\n            시   설    명\n  장애인\n            주        소\n 거주시설\n            시   설    장                       연 락 처\n            성        명                       연 락 처\n 촉탁의        주        소\n            의료기관명\n                                계 약 내 용\n제1조(목적) 이 협약은 상기 장애인거주시설(이하 “시설”이라 한다)과 상기 촉탁의사(이하 “촉탁의”라 한다)가\n 상호간의 협력과 적절한 의료적 접근을 통하여 시설 이용자의 건강증진과 적절한 의료적 지원을 목적으로\n 한다.\n제2조(계약기간) 이 협약은 협약체결일로부터 1년으로 한다.\n제3조(업무의 협조범위) “시설”과 “촉탁의”는 이용장애인의 건강관리를 위해 다음 각 호의 사항을 협조한다.\n                    시설                             촉탁의사\n\n  1. “촉탁의”의 촉탁의 활동을 협조한다.           1. “시설입소자”의 건강관리에 성심성의를 다하며 건강관리\n  2. 매일 입소 장애인의 건강상태를 파악하고 건강기록부를      내용을 충실히 기록한다.\n     작성 보관하여 이용장애인에 대한 촉탁의의 진찰에 도움을 2. 시설의 간호인력이 작성한 이용 장애인의 건강상태, 건강\n     준다.                               기록부 등을 점검하고 진료에 참고한다.\n  3. 촉탁의 인건비는 약정일에 촉탁의 계좌에 지급한다.    3. 사전 협의된 방문일(진찰일)에 방문한다.\n                                    4. 이용 장애인의 건강 상담 등 시설의 요청에 따라 적극 협조\n                                       한다.\n          (공통) 사정상 촉탁의의 방문 일정을 조정하여야 하는 경우에는 1일 이전에 상호 조율한다.\n\n제4조(진찰일) “촉탁의”는 매월    ,   ,  주   요일에          (시설명)을 방문하여 건강관리를\n  한다.\n제5조(비밀의 보장) “시설”과 “촉탁의”는 이용 장애인과 시설에 대한 일체의 정보에 대해서는 비밀을 보장하여야\n 한다.\n제6조(촉탁비 송금계좌) 은행명：          계좌번호：              예금주명：\n제7조(송금약정일) 촉탁비는 매월       일에 일괄하여 지급한다.\n제8조(협조사항) 필요시 관계기관(지자체)에 촉탁계약에 따른 활동에 관한 기록 등을 제출하는 것에 동의합니다.\n제9조(기타사항)이 계약은 “시설”과 “촉탁의” 중 어느 한 측의 요청이 있을 경우에는 협의하여 변경할 수 있으며,\n 이 계약에 명시되지 아니한 사항은 “시설”과 “촉탁의”가 상호 협의하여 정한다. 다만, 제4조, 제6조, 제7조에\n 대한 변경사항이 있는 경우, 뒷면에 변경내용을 작성한다.\n 상기내용의 계약을 증명하기 위하여 촉탁계약서를 2부 작성하여 서명 후 각각 1부씩 보관한다.\n\n                                                          년     월         일\n   시설장 성명                        (인)   촉탁의 성명                         (인)"}, {"p": 147, "t": "                        Ⅰ. 장애인거주시설 공통 사항\n\n\n(뒷면)\n\n              변 경 사 항\n\n\n  변경일   변경전                    변경후"}]}, {"title": "8. 체험홈 설치 및 운영", "start": 148, "end": 158, "pages": [{"p": 148, "t": " 8 체험홈 설치 및 운영\n\n가. 목 적\n\n ○ 장애인 거주시설 이용 장애인 가운데 지역사회로의 이주를 희망하고 지역사회\n   에서의 생활이 적절하다고 판단되는 자에 대하여,\n\n  - 일정한 주거공간을 지원함으로써 지역사회의 일상생활 및 다양한 사회활동\n    등에 대한 체험기회를 체계적으로 제공하고 향후 시설 퇴소 후 지역사회\n    에서의 생활에 어려움이 없도록 하기 위함\n\n\n나. 법적 근거\n\n ○ ｢장애인복지법｣ 제34조(재활상담 등의 조치)제1항제3호, 제57조(장애인복지\n   시설의 이용등), 제58조(장애인복지시설) 제1항제1호\n\n\n다. 운영 방향\n\n ○ 장애인 거주시설은 이용 장애인이 지역사회로의 복귀를 준비하는 기능을 더욱\n   강화하기 위한 제반 노력과 구체적인 실천 방안의 일환으로 체험홈을 운영할\n   수 있음\n\n  - 이를 위해 장애인복지실시기관(시장･군수･구청장)은 시설거주자의 지역\n    사회로의 복귀를 지원하는 다양한 대책을 강구하고 이를 집행하는데 필요한\n    제반 지원을 실시하여야 함"}, {"p": 149, "t": "                            Ⅰ. 장애인거주시설 공통 사항\n\n\n라. 체험홈의 설치\n\n1) 설치형태\n\n○ 체험홈은 국토교통부에서 실시하고 있는 각종 주거복지정책의 일환으로 추진\n  되고 있는 영구임대아파트, 국민임대아파트, 매입 및 임차 등을 통해 설치할            제2장\n  수 있으며,\n - 시･도, 시･군･구가 아파트, 일반주택 등 일정한 주거공간을 확보하거나 또는           애\n  주거공간 등 확보에 필요한 예산을 지원하여 설치할 수 있음\n - 이용자 또는 보호자의 의사결정에 의해 주거공간 확보에 필요한 비용을\n  이용자 또는 보호자가 전액부담할 경우 주택 매매, 임대차 계약의 주체는\n  이용자 또는 보호자가 되어야 함\n\n2) 설치기준\n\n○ 체험홈은 장애인 거주시설이 위치하고 있는 시･군･구 내에 설치하되, 지역사회\n  자립생활 지원을 위해 필요한 경우 동일 시･도 내 타 시･군･구에 설치할 수도\n  있다. 다만, 장애인 거주시설이 설치되어 있는 부지 내에는 설치할 수 없다.\n\n○ 설치에 따른 세부적인 기준은 아래와 같다.\n - 체험홈의 주택은 일반주택, 아파트, 연립주택 등과 같은 일반 주거지로써\n  지역사회의 각종 편의시설 및 문화시설을 쉽게 이용할 수 있는 지역에 위치\n  하여야 한다.\n - 체험홈의 주거 면적은 장애인 공동생활가정 설치 기준과 동일하게 적용\n\n○ 체험홈은 집단적인 장애인거주시설 구조를 벗어나 지역사회 내 일반적인\n  주거환경에서의 생활을 지향하는 것이므로 그 입지 조건 및 입주자의 장애\n  및 정도에 따라,\n - 필요한 편의시설을 제외하고는 일반적인 장애인복지시설 설치･운영기준\n  (｢장애인복지법 시행규칙｣ 제42조 별표 5) 등 부가적인 기준을 적용하지\n  않는다."}, {"p": 150, "t": " 3) 설치지원\n\n ○ 시･도 및 시･군･구는 체험홈의 설치에 따른 시설 개･보수, 체험홈 운영을 위한\n   생활가구 및 가전제품 등 생활용품 구입비를 지원할 수 있다.\n\n ○ 장애인복지실시기관은 체험홈의 설치에 따른 구입비 또는 임대보증금, 시설개･\n   보수, 체험홈 운영을 위한 생활가구 및 가전제품 등 생활용품구입비를 지원할\n   수 있다. 임대보증금을 지원할 경우 전세권 설정에 있어 시･군･구청장이\n   적극적으로 이에 조력하여야 하며, 물가인상으로 어려움이 발생하는 경우 이를\n   감안한 지원액 조정을 통하여 체험홈의 임차비 인상 등에 따른 원활한 운영을\n   도모하여야 한다.\n\n\n 4) 설치신청 절차\n\n ○ 장애인 거주시설 기능보강 사업으로 지원하는 체험홈을 설치하고자 하는 경우에는\n   해당 장애인 거주시설(운영자)이 시･군･구청장에게 관련 기능보강사업예산을\n   신청할 수 있다.\n\n ○ 시･군･구청장은 체험홈 설치에 대한 신청을 받거나 직접 수요를 조사･판단하여\n   시･도지사에게 신청하도록 하고, 시･도지사는 체험홈 설치에 대한 우선순위를\n   정하여 보건복지부장관에게 관련 예산 지원을 요청하여야 한다.\n   * 체험홈 설치계획서(예시) [별표 1] 참조\n\n ○ 보건복지부는 신청 시설 가운데, 사업계획의 타당성, 사업수행의 시급성, 유사\n   사업 수행경험, 최근 장애인복지시설 평가결과, 시･도의 우선순위 등을 고려하여\n   지원 대상 시설을 결정한다."}, {"p": 151, "t": "                                    Ⅰ. 장애인거주시설 공통 사항\n\n\n마. 체험홈 운영\n\n1) 체험홈 이용자 선발\n\n○ 장애인 거주시설 거주자(이용 장애인) 중에서 지역사회로의 이주를 희망하고\n  지역사회에서의 생활이 당사자에게 더욱 나은 여건을 제공할 수 있다고 판단되는                   제2장\n  자에게 체험홈에서의 생활기회를 부여한다.\n - 체험홈 운영자는 체험홈 이용 대상자를 선발하기 위해 체험홈 운영위원회를\n   구성하여 이를 심사한다.\n - 체험홈 운영자는 동 위원회의 심사기능을 내실화하기 위해 체험홈 이용\n\n   후보자에 대한 상세한 정보를 조사･보고하여야 한다.\n\n - 동 위원회는 시설운영위원회 또는 입･퇴소판정위원회로 갈음할 수 있다.\n  * 체험홈 이용대상자 기본정보 및 기초심사표(예시) [별표 2]\n\n○ 체험홈 이용자로 선발되면 시설장은 각 개별 입주자와 입주 계약서를 작성한다.\n  * 체험홈 이용계약서 (예시) [별표 3]\n\n○ 체험홈 이용자는 필요한 경우 관할 시･군･구청장의 승인을 받아 체험홈\n  주소지로 주민등록을 이전 할 수 있다. (단, 시설장은 주소이전으로 인해 공공\n  지원(생계비, 주거비, 활동보조 등)이 누락되거나 중복되지 않도록 관리)\n\n\n2) 이용정원\n\n○ 체험홈에 입주할 수 있는 정원은 4명을 초과하지 않도록 한다.\n\n\n3) 체험홈 담당 직원\n\n○ 장애인거주 시설장은 체험홈 운영에 필요한 직원을 확보하여 파견하여야 한다.\n\n○ 장애인복지실시기관은 신규 직원 인건비에 대해 필요에 따라 소요경비의 일부\n  또는 전부를 보조할 수 있다."}, {"p": 152, "t": " ○ 담당 직원은 체험홈의 성격, 체험홈 이용자의 장애 종류, 특성 및 정도를 감안하여\n   상주지원, 방문지원 등 다양한 형태로 근무할 수 있다.\n\n\n 4) 이용자의 생활 지원\n\n ○ 체험홈 거주자는 24개월(2년) 범위 내에서 체험홈에서 실시하는 다양한 지원을\n   받을 수 있다. 다만, 체험홈 거주자가 자립을 위해 체험홈 거주 기간 연장을\n   원하는 경우 운영위원회 회의를 통해 1년 단위로 이용 기간을 연장할 수 있다.\n   * 기존 체험홈 이용자는 입소 당시 규정(이용 기간)에 따름\n\n ○ 아래의 경우에 해당할 경우 장애인 거주시설 시설장은 체험홈 담당 직원의\n   소견을 들어 체험홈 거주자를 장애인 거주시설로 복귀시킬 수 있다.\n\n  - 1개월 이상 장기치료를 요하는 경우\n\n  - 체험홈 거주자가 장애인 거주시설로 복귀를 지속적으로 요구하는 경우\n\n  - 기타 체험홈 거주가 당사자에게 상당한 위해가 되는 등 (가칭) 체험홈 운영\n    위원회에서 결정한 경우\n\n ○ 체험홈 담당 직원은 체험홈 거주자가 일상생활을 영위할 수 있도록 다양한\n   기회를 제공해야 하며, 궁극적으로는 시설을 퇴소하여 지역사회에서 거주할\n   수 있는 여건을 마련하는데 적극적으로 기여해야 한다.\n\n  - 아울러 담당직원은 체험홈 거주자가 퇴소 후 지역사회 정착 시 필요한 자립\n    지원체계를 구축하고 사후관리를 체계적으로 마련･실시할 수 있는 계획을\n    수립하여야 한다.\n\n ○ 체험홈 거주자는 담당 직원과 상의하여 개인 위생관리, 주택관리, 가사활동\n   등에서 역할을 담당할 수 있으며 서로 협의 하에 제정한 자체 규정(규칙)을\n   준수하도록 노력하여야 한다."}, {"p": 153, "t": "                               Ⅰ. 장애인거주시설 공통 사항\n\n\n5) 운영비\n\n○ 운영인력 및 운영경비는 해당 거주시설의 자체 조정 계획에 의해 현재 지원\n  하는 생계비와 운영비 및 후원금 등을 사용함을 원칙으로 하되, 필요한 경우\n  시･도 및 시･군･구가 추가로 지원할 수 있다.\n - 시설은 사회복지법인 재무･회계 규칙의 시설회계 세입 및 세출 예산과목에\n  준하여 예산을 편성, 체험홈 운영과 관련된 경비를 지출하여야 한다.\n - 체험홈에서는 체험홈 입주 인원을 고려한 예산 총량 범위 내에서 체험홈\n  운영에 필요한 비용을 통합적으로 사용할 수 있으며, 체험홈을 1개 이상\n  운영하는 시설에서는 예산 총량 범위 내에서 각 체험홈 별 세부예산계획을\n  별도 수립하여 운용하여야 한다.\n\n - 기본적인 운영 경비 외, 입주자 공동생활 및 사회활동･참여와 관련된 비용은\n  필요할 경우 입주자간 협의를 통해 입주자가 그 비용을 부담(입주자간\n  각출)할 수 있다."}, {"p": 154, "t": "[별표 1]\n\n                     체험홈 설치 계획서(예시)\n\n 1. 시설현황\n   ○ 시설명：                            (대표자：            )\n   ○ 시설소재지：                          (전 화：            )\n   ○ 입소자 현황：정원       명, 현원   명 (20    .   .   . 현재)\n\n\n 2. 사업목적\n\n\n 3. 사업추진 필요성\n\n\n 4. 경험적 근거\n    (사례관리 결과, 장애인의 자립욕구 등)\n\n\n 5. 주택 및 집기비품 등 구입 계획\n   ○ 설치 개소수\n   ○ 구입 예산\n     - 구입 단가(1개소당)\n     - 구입 총예산\n     - 예산조달 계획(*예산 전액에 대한 지원을 신청할 경우, 생략)\n   ○ 구입주택 형태\n   ○ 설치지역 및 지역 선정 시 고려 사항\n     - 설치지역\n     - 지역선정 시 고려사항"}, {"p": 155, "t": "                        Ⅰ. 장애인거주시설 공통 사항\n\n\n6. 운영비 및 지원인력 조정 운영계획\n ○ 운영비 조정 운영 계획\n ○ 지원인력 조정 운영 계획\n\n\n7. 체험홈 이용자 선발계획\n ○ 체험홈 운영위원회 구성 계획\n ○ 선발 기준 및 절차\n  - 선발 기준(* 관련 서식 포함)\n  - 선발 절차\n\n\n8. 체험홈 운영 시 프로그램\n\n\n9. 추진 일정\n\n\n10. 기타 사항"}, {"p": 156, "t": "[별표 2]\n                체험홈 이용 대상자 기본정보 및 기초심사표 (예시)\n작 성 일：                   년     월     일      작 성 자：                        (관계：                     )\n1. 성        명    (한글)                                          (성별：   )\n                                                                           3. 연고\n2. 주        소    (주민등록상 주소)                                                             *연고/무연고\n                                                                              유무\n4. 장 애 명         지적장애 (      ) 급 (중복장애：          /    급)\n5. 연        령    만(     )세 (생년월일：     년      월       일)\n6. 현 근무처         소속：          (업무내용：                       )\n                 1) 월간수입(월평균)：\n                  - 장애수당：\n                                                                           8. 기초생활\n                  - 결연후원금：                             원(월평균)                              *수급자/\n7. 금전현황                                                                       보장\n                  - 원가정지원금：                            원(월평균)                               실비\n                                                                              수급여부\n                  - 기타：       원(                          )(월평균)\n                 2) 금전보유현황：               원 (20 .     . . 기준)\n                 1) 현 질환여부(질병명)：\n9. 건        강    2) 약복용여부(해당자만)：\n                 3) 기타 건강 관련 특이사항：\n   제      목                            세 부 내 용                                     2점     1점   0점\n                 1) 개인위생관리(세면, 면도, 샤워, 양치, 뒤처리 등)를 한다.\n10. 개인 생활\n                 2) 날씨와 상황에 맞는 의복을 고르고 착용한다.\n                 1) 자신에게 주어진 가사활동(청소, 식사, 빨래, 쓰레기 분출 등) 수행한다.\n11. 가정 생활\n                 2) 규칙과 그것의 필요성에 대하여 안다.\n                 1) 대중교통(버스, 택시, 지하철)을 이용한다.\n12. 지역사회\n                 2) 자기 집을 찾을 수 있다.\n    이용\n                 3) 편의시설(마트, 경찰서, 은행 등)을 이용할 수 있다.\n13. 학습 능력        1) 학습(읽고 쓰기, 대중교통 이용방법, 전기제품 사용방법, 금전관리 등) 능력이 있다.\n                 1) 자신의 의견을 표현하고 다른 사람의 의사를 존중한다.\n                 2) 가정 운영에 관한 의사결정에 관심을 가지며 참여한다.\n14. 의사 소통        3) 아픈 증상을 정확히 설명하고 도움을 요청한다.\n                 4) 기타 필요 시 도움 요청을 할 수 있다.(다른 사람에게 자신 알리기, 지원자의 이름･\n                    전화번호 알리기, 도움요청카드 사용 등)\n                 1) 직장 생활의 중요성을 안다.\n15. 직업 생활\n                 2) 주어진 업무를 꾸준히 할 수 있다.\n                 1) 생활 가운데 스스로 하고자 하는 의지를 보인다.\n16. 의 지\n                 2) 활동참여(직업생활, 여가활동 등)에 대한 의지가 있다.\n                 1) 다른 사람과 원만하게 지낸다.\n                 2) 낯선 사람들과 적절하게 행동한다.\n17. 대인 관계\n                 3) 상황에 맞는 적절한 사회적 행동을 할 수 있다.\n                 4) 다른 사람의 소유물을 소중히 여긴다.\n       종합                          총 점：      점 (만점：40점)\n\n※ 2점：도움 없이 할 수 있다 / 1점：도움이 있으면 할 수 있다 / 0점：할 수 없다."}, {"p": 157, "t": "                                   Ⅰ. 장애인거주시설 공통 사항\n\n\n[별표 3]\n                  체험홈 이용 계약서 (예시)\n\n ∙ 이용자 성명：\n ∙ 생 년 월 일：                                                   제2장\n\n\n 위 사람은 본 ○○○○○원(이하 ʻ본 시설ʼ이라 한다)에서 운영하는 체험홈에 입\n주하면서 ○○○○○원장을 ʻ갑ʼ, 입주자 및 보호자를 ʻ을ʼ이라 하여 다음과 같이 입\n주에 관련된 계약을 체결한다.\n\n                      - 다    음 -\n\n\n 1. ʻ갑ʼ은 생활하는 ʻ을ʼ의 자립과 안전생활을 위해 노력한다.\n 2. ʻ갑ʼ은 환경을 쾌적하게 하고 지역사회와의 교류를 통한 사회적응 및 사회\n    통합을 위해 노력한다.\n 3. ʻ을ʼ은 지켜야 할 제반규칙을 충실히 준수한다.\n 4. ʻ을ʼ의 과실 또는 부주의 등으로 발생하는 사고 및 문제에 대하여 ʻ갑ʼ에게 책\n    임을 추궁하거나 법적조치를 취하지 않는다. 다만 시설의 하자, ʻ갑ʼ의 관리의\n    무 소홀 등의 사유가 있는 경우에는 그러하지 아니하다.\n 5. 이용자의 수입금은 이용자 본인의 예금통장에 예치하고 금전관리 지원이 필\n    요할 경우, 체험홈 담당 직원이 지원한다.\n 6. 이용자는 아래의 사항이 발생했을 경우 계약기간 중이라도 시설로 복귀할 수 있다.\n   - 1개월 이상 장기치료를 요하는 경우\n   - 이용자 본인이 본 장애인거주시설로 복귀를 지속적으로 희망하는 경우\n   - 체험홈 거주가 당사자에게 유익하지 않거나 함께 생활하는 동료 입주자의\n         일상생활에 지장을 초래하는 경우\n   - 기타 (가칭)체험홈운영위원회의에서 체험홈 내 생활이 부적절하다고 인정되어\n         의결을 받아 시설로 복귀를 명하는 경우"}, {"p": 158, "t": " 7. 1) 본 계약은 계약일로부터 3년간 유효하다.\n   2) 본 계약에 대해서 양자간에 이의가 없을 때에는 1년 단위로 계속 유효하다.\n        단, ʻ갑ʼ, ʻ을ʼ 쌍방간에 이의가 있을 때는 계약만료 2개월 전에 계약변경의\n        필요성을 상대방에게 알려야 한다.\n\n\n (갑) 성 명：사회복지법인 ○○○            ○○○○○○시설장   ○○○ 󰄫\n    주 소：\n\n\n (을) 이용자 ① 성 명：                     󰄫\n            ② 생년월일：\n            ③ 주 소：\n    보호자 ① 성 명：                      󰄫\n            ② 생년월일：\n            ③ 주 소：\n            ④ 이용자와의 관계：\n\n\n                     20    년   월     일\n\n\n    재계약일           확 인 자           재계약일    확 인 자"}]}, {"title": "9. 이용장애인의 소유 금전에 대한 관리", "start": 159, "end": 163, "pages": [{"p": 159, "t": "                                  Ⅰ. 장애인거주시설 공통 사항\n\n\n9 이용장애인의 소유 금전에 대한 관리\n\n가. 금전관리 지원의 목적\n\n○ 이용 장애인의 개인소득(장애인연금, 결연후원금, 급여 등)이 늘어남에 따라                  제2장\n  장애인 개인의 금전에 대한 투명한 관리와 금전 활용을 통한 사회참여 기회의\n  확대, 소비생활 등에 대한 개인적 욕구 해소 등 개별 장애인의 서비스 지원에\n  활용되도록 하기 위함\n나. 금전관리 지원의 정의\n\n○ 금전이라 함은 장애인 개인 명의로 국가, 지역사회, 원가정 등으로부터 개인에게\n  지급되는 금전을 말함.\n\n○ 금전관리 지원이라 함은 이용 장애인이 시설장 및 관련 직원에게 위임한\n  금전에 대한 관리를 말함.\n ※ 금전의 수입과 지출 범위(예시)\n\n○ 수입의 범위 및 구분\n\n     구   분                    내       용\n\n    결연후원금                 개별, 기업, 단체 등의 후원금\n\n     급 여                  일반취업, 보호작업 등의 수입\n\n     위로금                    특별위로금, 위문비 등\n\n    사회보장비                    정부의 장애수당 등\n\n     기 타                   수입이자, 원가정지원금 등\n\n\n○ 지출의 범위 및 구분\n ※ 장애인 본인을 위한 지출의 경우 지출 범위의 제한은 없음. 단, 장애인의 생활 및 서비스제공에\n   직접 투입되지 않는 아래의 경비로는 사용 불가"}, {"p": 160, "t": " ○ 종사자 인건비, 시설 기능보강, 장비보강(시설 이용자 개인이 사용하기 위해\n   구입한 물품 제외), 프로그램 진행 시 직원의 경비, 시설 제반 운영비(전기세 등\n   제세공과금, 난방비, 4대보험료, 시설관리비 등)\n\n\n다. 금전관리 지원의 원칙\n\n ○ 이용 장애인의 재산은 본인이 관리하는 것을 원칙으로 하나, 스스로 자율적인\n   관리가 어려울 경우에는 부양의무자 또는 주무관청이 대리인을 지정하고 위\n   임장[별표 1]을 작성한 후 금전의 관리가 이루어지도록 함\n   ※ 이용장애인의 금전은 시설 회계, 시설 사업 등에 포함하지 않아야 한다.\n\n ○ 대리인에 의해 금전관리가 이루어지더라도, 금전의 지출 등은 장애인의\n   동의하에 이루어지도록 함\n\n ○ 금전관리는 해당 장애인의 명의로 하며 금융기관을 통해 이루어지도록 함\n\n ○ 시설장 및 시설직원이 대리인으로 장애인의 금전을 관리할 경우, 시설장은\n   직원을 대상으로 장애인금전관리 지원에 관한 교육을 실시하여야 하고,\n   관리책임자를 지정하여 관리할 수 있음\n\n ○ 시설장 및 시설직원이 대리인으로 장애인의 금전을 관리할 경우, 장애인\n   금전관리시 증빙서류가 첨부된 개인별 금전출납부[별표 2]를 작성･보관하고,\n   장애인의 금전지출 시에는 체크카드를 사용하거나, 현금 사용시 영수증 등\n   증빙서류를 첨부함\n   ※ 개인의 금전관리이므로 수입결의서, 지출결의서 등은 불필요\n\n ○ 시설장 및 시설직원이 대리인으로 장애인의 금전을 관리할 경우, 이용\n   장애인의 금전관리 시 장애인의 의사와는 상관없이 금전적 문제가 발생하여\n   장애인에게 피해가 발생하였을 때에는 시설장의 책임 하에 피해에 대한\n   보상이 신속히 이루어질 수 있도록 하여야 함"}, {"p": 161, "t": "                                       Ⅰ. 장애인거주시설 공통 사항\n\n\n○ 시설장은 이용장애인의 금전이 이용장애인 본인의 재활, 교육, 외부활동,\n  취미 및 지역사회 참여 등에 적절히 활용될 수 있도록 개인별 지원계획을\n  수립하여야 한다.\n\n○ 이용 장애인이 개인금전을 사용하는데 있어 자기결정과 선택에 따라 자유롭게\n  지출할 수 있도록 함\n\n라. 금전관리에 대한 사후관리\n○ 시설장은 시설운영위원회에 장애인의 금전관리 상황을 연 1회 보고하여야 함\n  (단, 본인에 의해 금전관리가 이루어지는 경우는 보고 면제)\n\n\n    참고\n\n디딤씨앗통장(아동발달지원계좌 안내)\n∙ 지원대상：만 18세 미만의 아동양육시설, 공동생활가정, 가정위탁 아동 및 장애인생활시설 거주아동 등\n∙ 지원내용：아동이 보호자･후원자 등의 도움을 받아 매월 일정금액을 저축할 경우(최대 50만원까지\n  가능) 국가에서 매월 적립금의 2배 금액을 매칭(최대 10만원까지 가능)하여 만 18세 이후 자립자금 마련\n  지원\n∙ 사용용도：만기(18세) 후, 학자금･취업훈련･주거마련･의료지원･결혼자금 등 자립용도로 사용\n  ※ 만 17세 아동 중 적립금 사용 용도 충족 시 지자체 판단에 의거 만기해지 가능\n  ※ 만 24세 도달 시 자립 용도의 제한 없이 사용 가능\n∙ 가입신청：담당 시･군･구로부터 시설 보호아동에 대해 디딤씨앗통장 지원대상 지정을 받아 디딤씨앗\n  통장 지원신청서(보건복지부 아동분야사업안내 참고)를 작성, 시･군･구로 제출\n∙ 기타문의：아동권리보장원(02-6454-8500, 1670-1834) www.ncrc.or.kr\n\n발달장애인 공공후견지원사업 안내\n∙ 지원대상：만 19세 이상 발달장애인(｢장애인복지법｣상 지적･자폐성 장애인)\n∙ 지원내용：공공후견 심판절차청구비용(1인 연간 최대 60만원), 공공후견인 활동비용(피후견인 1인\n  월 20만원, 2인 월 40만원, 3인 이상 월 최대 60만원)\n∙ 공공후견인 활동내용：계좌 및 급여관리 등 재산관리와 신상을 위한 의사결정 지원, 신체적･정신적･\n  금전적 피해구제 등을 위한 법률행위 등 지원\n∙ 가입신청：신청자 본인, 가족, 사회복지시설 종사자, 발달장애인지원센터, 읍･면･동주민센터에서 지원\n  대상자 주민등록상 주소지 관할 시･군･구(읍･면･동)에 신청서류 제출\n∙ 기타문의：중앙발달장애인지원센터(02-3433-0753~55),\n  한국장애인부모회 (02-2678-3131), 한국지적발달장애인복지협회 (02-592-5023)"}, {"p": 162, "t": "[별표 1]\n\n                      위         임       장\n\n\n                 본인은 아래의 사람을 대리인으로 정하여\n\n                 금전의 관리에 대해 그 권한을 위임함.\n\n\n           위 임 인                                수 임 인\n\n  ○ 성명(또는 직위)：            (인)       ○ 성명(또는 직위)：        (인)\n\n  ○ 입소자와의 관계：                       ○ 입소자와의 관계：\n\n  ○ 생 년 월 일：                        ○ 생 년 월 일：\n\n  ○ 주 소：                            ○ 주 소：\n\n\n  ○ 연락처：                            ○ 연락처：\n\n\n                     20    년        월       일\n\n           사회복지법인 ○○○○○시설 ○○○ 시설장 귀중"}, {"p": 163, "t": "                             Ⅰ. 장애인거주시설 공통 사항\n\n\n[별표 2]\n\n\n                 금 전 출 납 부\n\n                                      소 유 자：○ ○ ○\n                                      작 성 자：○ ○ ○\n\n   연월일   통장번호   명세   수입금액      지출금액       차인잔액           애"}]}, {"title": "10. 무연고자 사망시 유류물품 처리 방안", "start": 164, "end": 169, "pages": [{"p": 164, "t": " 10 무연고자 사망 시 유류물품 처리 방안\n\n가. 추진 배경 및 목적\n\n 1) 상속인 없는 재산의 처리(｢장애인복지법｣ 제60조의5)\n\n  ○ 장애인복지실시기관* 또는 장애인 거주시설**의 장은 장례를 행할 자가 없는\n    입소 장애인이 사망하여 장례를 행함에 있어서 사망자가 유류한 금전 또는\n    유가증권을 그 장례에 필요한 비용에 충당할 수 있으며, 부족이 있을 때에는\n    유류물품을 처분하여 그 대금을 이에 충당할 수 있다.\n\n   * 복지실시기관：보건복지부장관, 시･도지사 또는 시장･군수･구청장(｢장애인복지법｣ 제34조 참조)\n   ** 장애인거주시설：｢장애인복지법｣ 제58조제1항제1호에 따른 시설\n\n  ○ 직계 혈족 등 상속인의 존부가 분명하지 아니한 경우 그 잔여재산은 ｢민법｣에\n    따라 처리한다. 다만,         그 잔여재산이 ｢사회복지사업법｣ 제45조의2제1항\n    단서에 따른 금액(500만원) 이하인 경우에는 시장･군수･구청장에게 잔여\n    재산 목록을 작성하여 보고하는 것으로 그 재산의 처리를 갈음*할 수 있다.\n    (｢장애인복지법｣ 제60조의5, ’21. 6. 30. 이후 사망자부터 적용)\n   * 상속인 존부가 분명한 경우는 가족 등에게 유류금품 인계하여 처리\n\n\n   • 잔여재산 목록 작성 및 유류금품 평가\n   - 시설장은 사망자의 재산목록 작성 및 유품처리를 단독으로 처리 할 수 없으며, 시설운영위원회 위원\n     2명(내부1, 외부1 이상) 이상 동행 입회하에 재산적 가치가 있는 잔여재산목록을 작성하고 참여인이\n     기명날인 또는 서명하여야 한다.\n\n   - 의복, 신발, 가방, 침구, 가구, 가전류 등의 생필품과 10만원 이하 시계, 반지･귀걸이･장신구 등은\n     지자체와 협의 하에 재산목록작성 대상에서 제외하고 시설에서 자체 보관 및 처분할 수 있다.\n\n   - 잔여재산목록에는 작성일시, 장소와 사유, 청구인(시설장) 성명과 주소, 입회자, 동산 및 부동산의\n        종류와 금액, 채권과 채무의 표시, 장부, 증서, 기타의 서류 등에 대한 사항을 기재한다."}, {"p": 165, "t": "                                           Ⅰ. 장애인거주시설 공통 사항\n\n\n   - 유류금품의 평가\n\n                   구 분                          평 가 기 준\n         현금, 예･적금, 수표 등 현금성 자산                 사망 시점 금액\n                   귀금속류                 금은방, 전당포 등 거래소 감정가\n                                      당시 상황과 여건 등을 고려하여 합리적인\n              부동산･채권･주식 등             방법으로 평가금액을 산정하되, 그 평가시점         제2장\n                                           및 방법･기준 등을 명시\n\n ○ 각 시･도는 매년 12월말 기준 장애인 거주시설 내 무연고 사망자 및 유류금품\n   처리 실태조사를 실시하고 그 결과를 다음연도 1월 20일까지 보건복지부에\n   보고하여야 한다.\n\n\n나. 사업추진체계\n\n              < 무연고자 사망시 유류금품 등 처리 적용지침 >\n\n처리주체                              처리내용\n\n         □ 무연고자 사망\n\n         ◦ 복지실시기관*은 입소 조치된 자가 사망한 경우에 그 자에 대한 장례를 행할 자가 없을 때에는 그\n           장례를 행하거나, 당해 시설의 장으로 하여금 그 장례를 행하게 할 수 있음(｢장애인복지법｣ 제34조)\n          * 보건복지부장관, 시･도지사 또는 시장･군수･구청장\n         ◦ 복지실시기관 또는 장애인 거주시설의 장은 사망자가 유류한 금전 또는 유가증권을 장례에 필요한\n           비용으로 충당하거나, 부족 시 유류금품 등을 처분하여 그 대금을 비용에 충당*할 수 있음\n           (｢장애인복지법｣ 제34조)\n① 장애인\n거주시설\n 또는       • 장례비용\n           - 장례비용은 일반적이고 합리적인 금액의 범위 내에서 사용하고, 사망 진단서･이송･안치･\n② 복지실시\n  기관        수시비･접객실･영정사진･제단･제수･접객음식･상복･입관･염습･수의･장의차･화장장       사용료･\n            납골안치(매장, 묘지 등) 등의 비용 일체 (※ 영수증 처리를 통해 투명한 비용집행)\n           - 병원에서 사망할 경우 임종 전까지 해당 병원에서 발생한 비급여 진료비 등 본인부담금은\n            장례비용에 포함한다.\n           - 부의금, 공적지원금(국민기초생활보장 장제급여*, 지자체 지원금 등) 등을 장례비용으로 우선 충당\n             * 국민기초생활보장법에 의한 장제급여수급자는 ｢국민기초생활보장법 제14조｣에 따라 실제로\n              장제를 실시하는 사람은 필요한 비용을 시･군･구에 신청(1인당 80만원)이 가능"}, {"p": 166, "t": "                                     \n                      상속인 존부가 분명하지 않을 경우*\n                                                     \n    ⅰ) 잔여재산이 500만원 초과인 경우                   ⅱ) 잔여재산이 500만원 이하인 경우\n         (민법 처리 절차 적용)                      (민법 특례, 간소화 처리절차 적용**)\n         □ 상속재산관리인 선임 청구                 □ 잔여재산 보고 → (시･군･구) 6개월 공고\n                \n                                         ◦ 장애인거주시설 설치･운영자는 사망자의 잔여재산\n ◦ 친족, 기타이해관계인(장애인거주시설 등), 검사는             목록을 작성하여 시장･군수･구청장에게 보고\n   가정법원에 상속재산관리인 선임을 청구(민법 제1053조)                      \n                                         ◦ 시･군･구청장 상속인, 일반상속채권자, 유증받은 자,\n                                          기타 상속재산에 대하여 권리를 주장하는 자가 있으면\n                                           6개월 내에 권리를 주장할 것을 3개월 이상 공고\n           □ 상속재산관리인 선임 및 공고                            \n                                         ◦ (권리를 주장하는 자가 있는 경우) 민법 제1034조에\n           ◦ 가정법원은 상속재산관리인을 선임\n  가정법원                                     따라 변제\n             하고, 무연고자 인적사항 등을 공고         ◦ (권리를 주장하는 자가 없는 경우 또는 변제하고 남은\n             (3개월)                         재산) 지방자치단체로 귀속\n\n                                           \n           □ 공고일로부터 3월 이내 상속인의 존부를           □ 상속인의 존재가 분명하고 상속 승인한\n             알 수 없는 경우                         경우\n  상속재산\n   관리인     ◦ 일반상속채권자와 유증받은 자에 대하여            ◦ 상속인에게 지급(민법 제1055조) 및 종료\n             일정한 기간 내에 그 채권 또는 수증을 신고\n             할 것을 공고(2월 이상)\n           \n   (청구)  □ 상속인 수색의 공고(민법 제1057조)\n상속재산 관리인\n    ↓    ◦ 2개월이 경과하여도 상속인의 존부를 알 수 없는 때에는 가정법원은 상속재산 관리인의 청구에 의하여\n   (공고)    상속인이 있으면 일정한 기간 내에 그 권리를 주장할 것을 공고(1년 이상)\n  가정법원\n           \n\n    (청구)   □ 특별연고자에 대한 분여(민법 제1057조의2)\n 장애인복지시\n           ◦ 기간 내에 상속권을 주장하는 자가 없는 때에는 가정법원은 2개월 이내에 아래와 같은 자\n      설\n (특별연고자)     (특별연고자)의 청구에 의해, 상속재산의 전부 또는 일부를 분여할 수 있음\n     ↓     1. 피상속인과 생계를 같이 하고 있던 자\n  (재산분여)   2. 피상속인의 요양간호를 한 자\n   가정법원\n           3. 기타 피상속인과 특별한 연고가 있던 자\n           \n           □ 상속재산의 국가귀속(민법 제1058조)\n\n  가정법원     ◦ 특별연고자에 대한 분여 규정에 의하여도 분여(分與)되지 아니한 때에는 상속재산은 국가에 귀속\n           ※ (귀속상속재산법 제1조) 국가에 귀속하는 상속재산의 관리인은 피상속인의 주소지를 관할하는 세무\n              서장에게 지체 없이 그 상속재산의 관리를 이전하여야 한다."}, {"p": 167, "t": "                                                    Ⅰ. 장애인거주시설 공통 사항\n\n\n• 상속인 없는 재산의 청산 공고 작성 예시\n\n                             <상속인 없는 재산의 청산 공고>\n 개별법 제00조제0항에 따라 상속인 없는 재산을 청산하고자 다음과 같이 공고함, 아래 공고일로부터 6개월\n 내에 상속인, 일반상속채권자, 유증받은 자, 기타 상속재산에 대하여 권리를 주장하려는 자가 있으면 이를\n 신고하여야 하며, 신고하지 않으면 청산에서 제외됨.                                                  제2장\n ∙ 피상속인：000 (551212-1******), 2015.12.24.사망\n ∙ 등록기준지：경기도 용인시 처인구 000\n ∙ 최후주소지：경기도 용인시 처인구 000(장애인거주시설 00000)\n ∙ 청 구 인：장애인거주시설 0000 시설장 이순신\n ∙ 공고기간：2019.2.1. - 2019. 4.30.(3개월)\n ∙ 신고처：경기도 용인시청 0000과 홍길동(연락처)\n                                     - 2019.2.1.-\n\n(신문공고 보통 5㎝x3.5㎝)\n* 청구인의 성명과 주소, 피상속인의 성명･최후주소･출생･사망장소･사망일자, 신고처 등을 기재하여 공고일로부터 6개월 내에\n 그 권리를 주장할 것을 공시 최고 공고를 하여야 한다.\n\n\n1) 보고 및 퇴소 처리\n\n○ 시설은 입소 장애인 사망 후, 행정기관에 사망 1개월 이내에 제반 관련 서식에\n  의거, 사망사실을 보고하여 퇴소 처리를 하여야 한다."}, {"p": 168, "t": "[붙임]\n\n         민법 제5편 상속, 제1장 상속, 제6절 상속인의 부존재\n\n               제6절 상속인의 부존재<개정 1990.1.13>\n\n 제1053조(상속인 없는 재산의 관리인) ①상속인의 존부가 분명하지 아니한 때에는 법원은\n   제777조의 규정에 의한 피상속인의 친족 기타 이해관계인 또는 검사의 청구에 의하여 상속\n   재산관리인을 선임하고 지체 없이 이를 공고하여야 한다.<개정 1990.1.13>\n   ②제24조 내지 제26조의 규정은 전항의 재산관리인에 준용한다.\n\n 제1054조(재산목록제시와 상황보고) 관리인은 상속채권자나 유증 받은 자의 청구가 있는\n   때에는 언제든지 상속재산의 목록을 제시하고 그 상황을 보고하여야 한다.\n\n 제1055조(상속인의 존재가 분명하여진 경우) ①관리인의 임무는 그 상속인이 상속의 승인을\n   한 때에 종료한다.\n   ②전항의 경우에는 관리인은 지체 없이 그 상속인에 대하여 관리의 계산을 하여야 한다.\n\n 제1056조(상속인 없는 재산의 청산) ①제1053조제1항의 공고 있은 날로부터 3월내에 상속인의\n   존부를 알 수 없는 때에는 관리인은 지체 없이 일반상속채권자와 유증 받은 자에 대하여\n   일정한 기간 내에 그 채권 또는 수증을 신고할 것을 공고하여야 한다. 그 기간은 2월\n   이상이어야 한다.\n   ②제88조제2항, 제3항, 제89조, 제1033조 내지 제1039조의 규정은 전항의 경우에 준용\n   한다.\n\n 제1057조(상속인수색의 공고) 제1056조제1항의 기간이 경과하여도 상속인의 존부를 알 수\n   없는 때에는 법원은 관리인의 청구에 의하여 상속인이 있으면 일정한 기간 내에 그 권리를\n   주장할 것을 공고하여야 한다. 그 기간은 1년 이상이어야 한다. <개정 2005.3.31>\n\n 제1057조의2(특별연고자에 대한 분여) ①제1057조의 기간 내에 상속권을 주장하는 자가 없\n   는 때에는 가정법원은 피상속인과 생계를 같이 하고 있던 자, 피상속인의 요양간호를 한\n   자 기타 피상속인과 특별한 연고가 있던 자의 청구에 의하여 상속재산의 전부 또는 일부를 분\n   여할 수 있다. <개정 2005.3.31>"}, {"p": 169, "t": "                                     Ⅰ. 장애인거주시설 공통 사항\n\n\n ②제1항의 청구는 제1057조의 기간의 만료 후 2월 이내에 하여야 한다. <개정 2005.3.31.>\n [본조신설 1990.1.13]\n\n제1058조(상속재산의 국가귀속) ①제1057조의2의 규정에 의하여 분여(分與)되지 아니한 때\n 에는 상속재산은 국가에 귀속한다. <개정 2005.3.31>\n ②제1055조제2항의 규정은 제1항의 경우에 준용한다. <개정 2005.3.31.>                 제2장\n\n\n제1059조(국가귀속재산에 대한 변제청구의 금지) 전조 제1항의 경우에는 상속재산으로 변제를              장\n 받지 못한 상속채권자나 유증을 받은 자가 있는 때에도 국가에 대하여 그 변제를 청구하지\n 못한다."}]}, {"title": "11. 장애인 거주시설 내 아동 지원", "start": 170, "end": 171, "pages": [{"p": 170, "t": " 11 장애인 거주시설 내 아동 지원\n\n가. 배경 및 목적\n\n ○ 장애인 거주시설에서 생활하고 있는 장애아동의 인권증진 필요\n\n  - 장애아동은 ｢아동복지법｣, ｢장애아동 복지지원법｣ 등 관련 법령에 따라\n   부모에 의하여 양육되고, 안정된 가정환경에서 자라야 하며, 장애아동이\n   태어난 가정에서 성장할 수 없을 때에는 가정과 유사한 환경에서 성장할 수\n   있도록 조치하여야 하나, 불가피하게 장애인 거주시설에서 생활하는 경우가\n   있어 장애인 거주시설 내 아동 지원 관련 내용 규정\n\n ○ 장애인 거주시설에서 생활하고 있는 장애아동(이하 ʻʻ장애아동ʼʼ이라 함)이\n   행복한 삶을 누릴 수 있는 기본적인 여건을 조성하고 조화롭게 성장･발달할\n   수 있도록 지원\n\n\n나. 기본방향\n\n ○ 장애아동을 지원함에 있어서 장애아동의 이익이 최우선적으로 고려되어야 함\n\n ○ 장애아동은 자신에게 영향을 미치는 모든 활동에 대하여 자신의 견해를 자유로이\n   표현할 권리를 최대한 보장받아야 함\n\n ○ 장애아동에게 기본적으로 필요한 서비스가 누락 되는 일이 없도록 하여야 함\n\n\n다. 관련 지원\n\n ○ 장애인 거주시설은 장애아동이 최대한 가정과 유사한 환경에서 생활할 수\n   있도록 지원하기 위해 노력해야 함\n\n  - 장애아동의 친권자 또는 후견인이 있는 경우 장애인거주시설은 장애아동이\n    친권자 등과 주기적으로 연락하고 만날 수 있도록 지원해야 함"}, {"p": 171, "t": "                            Ⅰ. 장애인거주시설 공통 사항\n\n\n○ 장애인 거주시설은 장애아동이 인성 및 정신적･신체적 능력을 최대한 계발하기\n 위하여 적절한 교육을 제공받을 수 있도록 지원해야 함\n\n○ 장애인 거주시설은 장애아동이 가능한 최상의 건강상태를 유지하고 행복한\n 일상생활을 누릴 수 있도록 지원해야 함\n○ 장애인 거주시설은 장애아동이 휴식과 여가를 즐기고, 놀이와 문화예술활동에\n 참여할 수 있도록 지원해야 함\n○ 장애인 거주시설은 장애아동이 의사소통 능력, 자기결정 능력 및 자기권리\n 옹호 능력을 향상시키기 위한 교육 및 훈련 기회를 제공받을 수 있도록 지원              설\n\n 해야 함\n\n○ 지자체와 시설장은 장애아동의 법적 보호 강화를 위해 ｢보호시설에 있는\n 미성년자의 후견 직무에 관한 법률｣에 따라 장애아동의 후견인을 지정해야\n 하며, 후견인 지정 절차 등에 대하여 시설종사자 교육을 실시해야 함\n\n○ 시설장은 시설 내 장애아동을 위한 개별 지원계획을 수립해야 하며, 장애아동이\n 사회와 통합될 수 있도록 노력해야 함\n\n○ 시설장은 장애인 거주시설에 입소하여 15세 이상이 된 장애아동을 대상으로\n 매년 자립 의사를 확인하고, 자립을 원하는 경우 해당 장애아동에 대한 자립\n 지원계획을 수립･시행해야 하며, 그 계획을 수행하는 종사자를 대상으로\n 자립지원에 관한 교육을 실시해야 함\n\n- 자립지원계획에는 ①장애아동의 적성 및 욕구 파악, 사회성 발달 정도 및\n  자립 능력･수준 등 장애아동의 상태 평가, ②정기적 진로상담, 체험 및 교육\n  프로그램 실시, ③자립에 필요한 주거, 취업, 자산형성, 정서적 지원 등 공적\n  서비스 및 지역 내 후원 자원 연계 등이 포함되어야 하며, 시설장은 자립\n  지원계획을 수립할 때에 해당 장애아동의 의견을 존중해야 함"}]}, {"title": "12. 장애인거주시설 사물인터넷(IoT)·인공지능(AI) 활용 돌봄 시범사업 안내", "start": 172, "end": 184, "pages": [{"p": 172, "t": " 12 장애인 거주시설 사물인터넷(IoT)･인공지능(AI) 활용\n    돌봄 시범사업 안내\n\n가. 추진배경 및 목적\n\n 1) 추진배경\n\n ○ 코로나19 등 감염병 위험이 높은 상황이거나 야간 시간 등 인력이 부족하여\n   서비스 제공이 원활하지 않은 시간대에 장애인 거주시설 입소 장애인에 대한\n   돌봄 공백 발생 우려\n\n  - 장애인 거주시설 입소 장애인의 응급상황에 신속 대응할 수 있는 시스템\n    필요성 증가\n\n ○ 장애인은 재난에 대한 취약성이 높으며, 위험으로부터 벗어날 수 있는 위기\n   대처 능력은 비장애인 대비 2배 이상 취약\n\n  - 장애인의 특성을 고려한 안전 대책 마련 필요성 증가\n\n\n 2) 목적\n\n ○ 장애인 거주시설 내 침상, 방, 계단, 출입구 등에 화재, 낙상 등 응급상황을\n   감지할 수 있는 IoT기기를 설치하여 응급상황 발생 시 신속하게 대처, 입소\n   장애인을 위한 안전한 생활환경을 구축하여 입소 장애인 안전 및 생명 보호\n\n ○ 코로나19 등 감염병 위험이 높은 상황에서 입소 장애인에 대한 돌봄 공백 방지"}, {"p": 173, "t": "                              Ⅰ. 장애인거주시설 공통 사항\n\n\n나. 사업추진체계\n\n1) 사업추진체계 및 기관별 역할\n\n○ (보건복지부) 사업총괄, 기본계획 수립 및 사업자 관리\n○ (한국장애인개발원) IoT기기 구축･관리 지원, 장애인 거주시설 교육 및 모니터링 등\n  사업관리\n○ (한국사회보장정보원) 디지털돌봄시스템 운영\n○ (장애인거주시설) 입소장애인 응급상황 대처"}, {"p": 174, "t": " 2) 시범사업 관련 장애인 거주시설 내 담당 인력 및 주요 역할\n\n     구분                주요 업무                       주요 역할\n\n              - 장애인 거주시설 IoT･AI 활용 돌봄 시범   - 시범사업 협력체계 마련\n   시설의 장       사업(이하 ‘시범사업’) 협력\n\n              - 시범사업 관련 총괄 조정 및 관리         - 담당자별 업무 조정 및 배치\n\n              - 시범사업 관련 돌봄 서비스(‘이하 IoT     - IoT활용 돌봄서비스 상황 점검,\n    사무국장        활용 돌봄서비스’) 총괄               응급상활 대응 총괄\n              - IoT기기 관리 총괄                - IoT기기 정상작동 여부 점검\n                                           - IoT활용 돌봄서비스 제공\n  사회재활교사/\n              - IoT활용 돌봄서비스 제공              (디지털돌봄시스템 활용)\n   생활지도원\n                                           - 응급상황 대응\n    의료인력\n                                           - 응급상황 발생 시 적절한 의료조치,\n(의사, 간호사 또는   - 응급상황 대응\n                                            119 및 의료기관 연계\n   간호조무사)\n\n※ 시설 상황에 따라 업무 조정이 가능하나, IoT활용 돌봄서비스 제공(특히, 응급상황대응)에 공백이 없도록 하여야 함\n\n\n다. IoT활용 돌봄서비스\n\n 1) 서비스 대상자\n\n ○ 장애인 거주시설 입소 장애인은 누구든지 IoT활용 돌봄서비스 대상자임\n\n  - 시설의 장은 IoT돌봄사업의 취지, 목적, 내용 등을 입소자 및 보호자에게\n    충분히 설명 필요(브로슈어, 매뉴얼 등 사업설명자료 활용)"}, {"p": 175, "t": "                                     Ⅰ. 장애인거주시설 공통 사항\n\n\n2) 서비스 내용\n\n               < 장애인 거주시설 IoT돌봄사업 체계도 >\n\n\n  ※ 보건복지부의 IoT돌봄사업은 장애인거주시설 및 노인양로시설에서 함께 실시\n\n\n○ (안전생활 지원)\n\n - 시설 내 침상, 방, 계단, 출입구 등에 설치된 IoT기기가 입소자의 활동량,\n   심박･호흡, 방 출입 등을 모니터링하여 화재, 낙상, 감염병 등으로부터 안전한\n   생활을 지원\n  ※ (IoT기기) 호흡센서, 활동센서, 문열림센서, 응급호출기, AI 스피커, 가스차단기, 화재감지기 등\n\n - 특히, 코로나19와 같은 감염병이 유행하는 상황에서도 건강 취약계층인\n   장애인 등이 감염병으로부터 안전하게 시설 내 생활이 가능하도록 지원"}, {"p": 176, "t": " ○ (응급지원)\n\n  - 시설 입소 장애인에게 낙상, 무호흡, 심정지 등 응급상황이 발생한 경우 IoT\n    기기가 이를 감지하여 자동 또는 수동으로 시설(사무국) 종사자에게 응급\n    알림을 전송하여 신속한 대처를 지원\n\n ○ (정서지원)\n\n  - AI스피커 및 IoT기기를 통한 응급상황 관제 및 출동, 음원 제공, 인지･정서\n    발달 프로그램 지원 등"}, {"p": 177, "t": "                                  Ⅰ. 장애인거주시설 공통 사항\n\n\n라. 시설종사자 상황별 업무\n\n1) 원칙\n\n○ 아래 시설종사자의 IoT돌봄사업 상황별 업무는 표준적으로 제시하는 것으로서\n  시설별 특수성, 종사자 수, 업무량 등을 종합적으로 고려하여 시설의 장이 조                 제2장\n\n  정하여 적용 가능함\n - 다만, 시설의 장은 종사자 순환 배치, 당직자 근무 등을 통해 IoT활용 돌봄\n   서비스 중단 또는 차질이 발생하지 않도록 유의하여야 함\n  ※ 종사자들이 평소에 수행하던 대면돌봄을 코로나19와 같은 감염병이 발생하여 대면 돌봄에 제약이       설\n    생기거나 종사자가 부족한 야간시간대 등에 IoT기기를 통해 비대면으로 돌보자는 것이 사업의\n    취지이므로 IoT돌봄사업 전담 종사자를 별도로 지원하지는 않음\n\n○ (응급상황 전파체계)\n\n - 사무국장(책임자)을 응급상황 총괄책임자로 일괄 지정하여, 응급알림 문자\n   수신자에 등록\n  ※ 총괄책임자는 각 방, 동 담당자와 별도로 시설 전체에서 발생하는 응급알림 문자를 수신하여\n    대응\n\n - 시설 규모 및 운영 체계(교대 근무)를 고려하여 응급상황 총괄책임자 외 각 방,\n   동별 응급알림 문자 수신자 1인 이상 지정\n\n\n2) 상황별 업무 – 평시\n\n○ 사무국장(책임자)은 IoT활용 돌봄서비스 정상 제공 여부를 수시로 총괄 점검\n  하고, IoT기기의 고장, 오작동 등 문제가 발생하는 경우 한국장애인개발원에\n  A/S를 요청\n  ※ 한국장애인개발원은 참여시설과 IoT기기 설치사업자 간 허브 역할을 수행하며, IoT기기 설치\n    사업자는 IoT기기의 유지･보수 등 기술적 관리를 담당함"}, {"p": 178, "t": " ○ 사무국장(책임자), 사회재활교사 및 생활지도원은 디지털돌봄시스템을 통해\n   IoT돌봄사업 수행상황을 상시 확인\n\n  - 디지털돌봄시스템 URL: https://biz.dcare.go.kr/\n\n  - 디지털돌봄시스템 가입 절차\n\n    ① 디지털돌봄시스템 ʻ사용자 등록신청ʼ 선택\n\n    ② 사용자 권한 신청서, 보안서약서 등록 및 승인 신청\n\n    ③ 한국장애인개발원 담당자의 권한 승인\n\n    ④ 공인인증서 등록 후 로그인\n\n\n 3) 상황별 업무 – 응급상황 시\n\n ○ (원칙)\n\n  - 응급상황 문자 수신 시, 위급한 상황은 즉시 119에 신고함\n\n  - 사건의 경중에 따라 담당자가 시설 내 자체 조치 혹은 119에 신고하되, 자체\n    조치를 취할 경우, 반드시 총괄책임자와 논의하여 결정\n\n ○ (화재)\n\n  - 화재감지기에서 화재감지에 따른 알람이 발생하는 경우 사무국장(책임자)을\n    비롯한 종사자는 즉시 119 소방서에 화재 발생 사실 통보 및 진화를 요청\n   ※ 다만 담배연기, 음식조리 연기, 스프레이 등에 화재감지기가 민감하게 작동하는 경우도 있을 수\n     있으므로 119 연락과 동시에 알람이 발생한 시설 내 장소를 방문하여 실제 화재인지 여부에\n     대한 확인이 필요하며, 위와 같은 단순 민감작동에 따른 알람인 경우 소방서에 출동 취소를 요청\n\n ○ (낙상)\n\n  - 시설 내 침상에서 입소 장애인 낙상사고 발생 시, 호흡센서가 이를 감지하여\n    응급알림을 전송하면, 사무국장(책임자)을 비롯한 종사자는 즉시 해당 장소를\n    방문하여 상황을 확인하고 의료진의 응급조치, 의료기관 연계 등 조치"}, {"p": 179, "t": "                             Ⅰ. 장애인거주시설 공통 사항\n\n\n○ (무호흡, 실신 등)\n\n - 호흡센서가 시설 내 장애인의 무호흡
