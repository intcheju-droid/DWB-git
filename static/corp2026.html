 있는 서류 각 1부(행정정보의 공동이용을 통하여 소유권에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음합니다) 마.재산의 평가조서 1부(감정평가업자의 감정평가서를 첨부하되, 개별공시지가 확인서로 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음합니다) 바.재산의 수익조서 1부(수익용 기본재산을 갖춘 경우에만 첨부하며, 공인된 감정평가기관의 수익증명 또는 수익을 증명할 수 있는 기관의 증빙서류를 첨부하여야 합니다) 2. 합병에 의하여 새로이 설립되는 법인의 경우 가. 합병취지서･재산목록 및 재무상태표 각 1부 나. 합병 해당 연도 및 다음 연도의 사업계획서 및 예산서 각 1부 다. 「사회복지사업법 시행규칙」 제7조제2항제2호부터 제9호까지의 서류 각 1부 | 수수료 없음\n담당 공무원 확인사항 | 1. 건물등기부 등본 2. 토지등기부 등본 3. 개별공시지가 확인서\n\n처리 절차\n | \n이 신청서는 아래와 같이 처리됩니다.\n신청인 | 경유기관 | 처리기관\n시･군･구(10일) | 보건복지부(22일)･시･도(17일)\n |  | \n | 사회복지법인 합병허가 신청서 작성･제출 |  |  | ▶ | 접수 및 검토보고서 작성 |  |  | ▶ | 접수 | "}, {"p": 120, "t": "\n |  |  | \n |  |  |  |  | \n▼\n |  |  | 신청내용 확인 | \n |  | \n |  |  |  |  | \n▼\n | 합병 후 사회복지법인 설립허가증 교부 | ◀ |  |  | 합병 후 사회복지법인 설립허가증 수신 | ◀ |  |  | 합병 후 사회복지법인 설립허가(허가증 작성) | \n |  |  | \n |  | \n\n사회복지법인 및 사회복지시설 재무･회계규칙\n1. 총 칙\n2. 예 산\n3. 결 산\n4. 회 계\n5. 물 품\n6. 후원금의 관리\n7. 감사의 실시\n<붙임>「사회복지법인 및 사회복지시설 재무･회계규칙」(全文)\n제Ⅴ장"}]}]}, {"no": 7, "title": "사회복지법인 및 사회복지시설 재무·회계규칙", "start": 121, "end": 238, "sections": [{"title": "1. 총칙", "start": 123, "end": 125, "html": "<div class=\"pchip\" id=\"p123\"><span>원문 123쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=129\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">본 규칙은 「사회복지사업법」 제23조제4항, 제34조제3항 및 제45조제2항의 규정에 의하여 사회복지법인과 사회복지시설의 재무･회계 및 후원금관리에 관한 사항을 규정하여 명확성･공정성･투명성을 기함으로써 사회복지법인과 시설의 합리적인 운영에 기여함을 목적으로 함.<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">적용범위<\/div><div class=\"ln p\">「사회복지사업법」의 적용을 받는 사회복지법인 및 사회복지시설(소관부처 및 정부보조금 지급 여부와는 상관없이 모든 사회복지법인과 사회복지시설에 적용)<\/div><div class=\"ln note\">※종전까지는 사회복지법인 및 법인이 운영하는 시설에만 적용되었으나, 「사회복지사업법」 제34조제3항 등에 의해 동 규칙이 개정됨에 따라 모든 사회복지법인 및 사회복지시설로 적용대상 확대<\/div><div class=\"ln note\">※「사회복지사업법」 제34조(사회복지시설의 설치) ③ 시설을 설치･운영하는 자는 보건복지부령으로 정하는 재무･회계에 관한 기준에 따라 시설을 투명하게 운영하여야 한다. &lt;2011.8.4신설, 2012.8.5시행&gt;<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">다른 법령과의 관계<\/div><div class=\"ln p\">사회복지법인 및 사회복지시설의 재무･회계처리에 관하여 다른 법령에 특별한 규정이 있는 경우를 제외하고는 본 규칙에 따름.<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">사회복지법인 및 사회복지시설의 회계<\/div><div class=\"ln h4\">1) 사회복지법인의 회계는 다음과 같이 구분하여 관리할 것<\/div><div class=\"ln p\">법인회계：사회복지법인의 업무전반에 관한 회계<\/div><div class=\"ln p\">시설회계：사회복지법인이 설치･운영하는 사회복지시설에 관한 회계<\/div><div class=\"pchip\" id=\"p124\"><span>원문 124쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=130\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">수익사업회계：사회복지법인이 수행하는 수익사업에 관한 회계<\/div><div class=\"ln note\">※ 법인회계와 시설회계 구분 철저(’13.10월 감사원 지적 사항)<\/div><div class=\"ln h4\">2) 시설의 회계는 해당 시설의 시설회계로 함<\/div><div class=\"ln note\">※사회복지법인 이외의 자가 시설을 설치･운영하는 경우에도 시설회계를 반드시 두어야 하고, 시설이 여러 개소인 경우 시설의 회계는 각 시설별로 구분하여 관리할 것<\/div><div class=\"ln h4\">3) 회계연도 및 회계연도 소속구분<\/div><div class=\"ln p\">법인 및 시설의 회계연도는 정부의 회계연도(1. 1~12. 31)에 의함<\/div><div class=\"ln p\">-다만, 「영유아보육법」 제2조에 따른 어린이집의 회계연도는 매년 3월 1일에 시작하여 다음 연도 2월 말일에 종료한다.<\/div><div class=\"ln p\">수입 및 지출의 발생, 자산 및 부채의 증감에 관하여는 그 원인이 되는 사실이 발생한 날을 기준으로 하여 연도소속을 구분하되, 그 사실이 발생한 날을 정할 수 없는 경우에는 그 사실을 확인한 날을 기준으로 함<\/div><div class=\"ln h4\">4) 회계의 감독 등<\/div><div class=\"ln p\">회계부정 등 불법행위가 발견된 경우 해당 법인의 임원해임, 시설의 개선, 사업정지, 시설장교체, 시설페쇄 등 조치<\/div><div class=\"ln note\">※ 「사회복지사업법」 제22조 및 제40조<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">출납기한<\/div><div class=\"ln p\">1회계연도에 속하는 법인 및 시설의 세입･세출의 출납은 회계연도가 끝나는 날까지 완료해야 함<\/div><div class=\"pchip\" id=\"p125\"><span>원문 125쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=131\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">정보통신매체에 의한 재무･회계 처리<\/div><div class=\"ln p\">사회복지법인 및 사회복지시설의 재무･회계는 컴퓨터 프로그램으로 처리할 수 있음<\/div><div class=\"ln p\">국가나 지방자치단체로부터 보조금을 받는 사회복지법인과 사회복지시설의 경우, 사회복지시설정보시스템 또는 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템을 사용하여 재무･회계를 처리하여야 함 &lt;2012.8.7 개정, 2013.1.1시행&gt;<\/div><div class=\"ln p\">-사회복지법인 중 지원법인과 사회복지시설 중 국가나 지방자치단체로부터 보조금을 받지 않는 경우는 위 시스템을 사용하지 않을 수 있으나, 시･도지사, 시장･군수･구청장은 법인 및 시설에 대하여 시스템 사용을 권장할 수 있으며, 사회복지법인 대표이사와 시설의 장은 이에 협력하여야 함(「사회복지사업법」 제6조의2제5항).<\/div><div class=\"ln p\">-보조금을 받는 사회복지시설 중 어린이집, 경로당, 노인교실은 사용하지 않을 수 있음<\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>예 산<\/div>", "pages": [{"p": 123, "t": "본 규칙은 「사회복지사업법」 제23조제4항, 제34조제3항 및 제45조제2항의 규정에 의하여 사회복지법인과 사회복지시설의 재무･회계 및 후원금관리에 관한 사항을 규정하여 명확성･공정성･투명성을 기함으로써 사회복지법인과 시설의 합리적인 운영에 기여함을 목적으로 함.\n나\n적용범위\n「사회복지사업법」의 적용을 받는 사회복지법인 및 사회복지시설(소관부처 및 정부보조금 지급 여부와는 상관없이 모든 사회복지법인과 사회복지시설에 적용)\n※종전까지는 사회복지법인 및 법인이 운영하는 시설에만 적용되었으나, 「사회복지사업법」 제34조제3항 등에 의해 동 규칙이 개정됨에 따라 모든 사회복지법인 및 사회복지시설로 적용대상 확대\n※「사회복지사업법」 제34조(사회복지시설의 설치) ③ 시설을 설치･운영하는 자는 보건복지부령으로 정하는 재무･회계에 관한 기준에 따라 시설을 투명하게 운영하여야 한다. <2011.8.4신설, 2012.8.5시행>\n다\n다른 법령과의 관계\n사회복지법인 및 사회복지시설의 재무･회계처리에 관하여 다른 법령에 특별한 규정이 있는 경우를 제외하고는 본 규칙에 따름.\n라\n사회복지법인 및 사회복지시설의 회계\n1) 사회복지법인의 회계는 다음과 같이 구분하여 관리할 것\n법인회계：사회복지법인의 업무전반에 관한 회계\n시설회계：사회복지법인이 설치･운영하는 사회복지시설에 관한 회계"}, {"p": 124, "t": "수익사업회계：사회복지법인이 수행하는 수익사업에 관한 회계\n※ 법인회계와 시설회계 구분 철저(’13.10월 감사원 지적 사항)\n2) 시설의 회계는 해당 시설의 시설회계로 함\n※사회복지법인 이외의 자가 시설을 설치･운영하는 경우에도 시설회계를 반드시 두어야 하고, 시설이 여러 개소인 경우 시설의 회계는 각 시설별로 구분하여 관리할 것\n3) 회계연도 및 회계연도 소속구분\n법인 및 시설의 회계연도는 정부의 회계연도(1. 1~12. 31)에 의함\n-다만, 「영유아보육법」 제2조에 따른 어린이집의 회계연도는 매년 3월 1일에 시작하여 다음 연도 2월 말일에 종료한다.\n수입 및 지출의 발생, 자산 및 부채의 증감에 관하여는 그 원인이 되는 사실이 발생한 날을 기준으로 하여 연도소속을 구분하되, 그 사실이 발생한 날을 정할 수 없는 경우에는 그 사실을 확인한 날을 기준으로 함\n4) 회계의 감독 등\n회계부정 등 불법행위가 발견된 경우 해당 법인의 임원해임, 시설의 개선, 사업정지, 시설장교체, 시설페쇄 등 조치\n※ 「사회복지사업법」 제22조 및 제40조\n마\n출납기한\n1회계연도에 속하는 법인 및 시설의 세입･세출의 출납은 회계연도가 끝나는 날까지 완료해야 함"}, {"p": 125, "t": "바\n정보통신매체에 의한 재무･회계 처리\n사회복지법인 및 사회복지시설의 재무･회계는 컴퓨터 프로그램으로 처리할 수 있음\n국가나 지방자치단체로부터 보조금을 받는 사회복지법인과 사회복지시설의 경우, 사회복지시설정보시스템 또는 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템을 사용하여 재무･회계를 처리하여야 함 <2012.8.7 개정, 2013.1.1시행>\n-사회복지법인 중 지원법인과 사회복지시설 중 국가나 지방자치단체로부터 보조금을 받지 않는 경우는 위 시스템을 사용하지 않을 수 있으나, 시･도지사, 시장･군수･구청장은 법인 및 시설에 대하여 시스템 사용을 권장할 수 있으며, 사회복지법인 대표이사와 시설의 장은 이에 협력하여야 함(「사회복지사업법」 제6조의2제5항).\n-보조금을 받는 사회복지시설 중 어린이집, 경로당, 노인교실은 사용하지 않을 수 있음\n2\n예 산"}]}, {"title": "2. 예산", "start": 126, "end": 132, "html": "<div class=\"pchip\" id=\"p126\"><span>원문 126쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=132\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">예산의 편성<\/div><div class=\"ln h4\">1) 예산총계주의 원칙<\/div><div class=\"ln p\">1회계연도의 모든 수입은 세입으로 하고 모든 지출은 세출로 하되, 세입과 세출은 모두 예산에 계상하여야 함<\/div><div class=\"ln h4\">2) 예산편성절차<\/div><div class=\"ln note\">※ 일정에 따른 예산편성, 제출 및 공개 철저<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><table class=\"htbl\"><tr><td>주   요   내   용<\/td><td>주  체<\/td><td>일  정<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td>시･군･구에서 법인 또는 시설에 특히 필요하다고 인정하는 사항에 관해 예산편성지침 통보 가능<\/td><td>법인 또는 시설 소재지관할 시장･군수･구청장<\/td><td>회계연도 개시2개월 전까지<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>법인은 법인과 법인 산하 시설의 예산편성지침을 결정<\/td><td>법인 대표이사<\/td><td>회계연도 개시1개월 전까지<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>회계별 예산(법인회계, 시설회계, 수익사업회계) 편성<\/td><td>법인 대표이사 및시설의 장<\/td><td>회계연도 개시전까지<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>시설회계 예산안에 대한 시설 운영위원회 보고<br>※법인이 설치･운영하는 시설의 경우에도 시설회계는 법인이사회 의결 전 시설 운영위원회에 보고 필요<br>※ 법인회계 및 수익사업회계에 대해서는 불필요<\/td><td>시설의 장<\/td><td>예산안 편성완료시<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>법인의 회계별 예산(법인회계, 시설회계, 수익사업회계)안에 대한 이사회 의결, 예산안 확정<br>※ 법인이 설치･운영하는 시설의 시설회계도 포함<br>※ 법인이 아닌 경우에는 시설 운영위원회 보고로 예산안이 확정됨<\/td><td>법인 이사회<\/td><td>예산안 편성완료시<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>확정된 예산안을 시장･군수･구청장에 제출<br>※법인은 법인의 회계별 예산(법인회계, 시설회계, 수익사업회계)을 법인 소재지를 관할하는 시장･군수･구청장에 제출 하고, 시설의 장 (법인이 운영하는 시설도 포함)은 해당 시설의 시설회계를 시설 소재지 관할 시장･군수･구청장에 제출<\/td><td>법인 대표이사 및시설의 장<\/td><td>회계연도 개시5일 전까지<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>법인과 시설의 회계별 세입･세출 명세서를 시･군･구, 법인, 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고<br>※「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게재 하거나 「영유아보육법」 제49조의2제2항에 따른 공시로 갈음 가능<\/td><td>시장･군수･구청장,법인 대표이사,시설의 장<\/td><td>예산안 제출20일 이내<\/td><\/tr><\/table><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p127\"><span>원문 127쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=133\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) 예산의 편성 방법 및 제출 서류<\/div><div class=\"ln p\">별표1~별표10에 따른 세입･세출예산과목구분에 따라 편성<\/div><div class=\"ln p\">- 각 지자체는 세입 및 세출예산과목의 세부내역에 대하여 관련 규정 등에 위배되지 않게 별도의 지침으로 정하는 것을 원칙으로 함<\/div><div class=\"ln p\">- 시설회계 세출예산(별표4) 편성 시 법인회계로의 전출은 동일 법인에서 운영하는 타 시설 중 자연재해로 인한 개보수가 필요한 경우에 가능<\/div><div class=\"ln p\">&lt; 비목 편성･지출 관련 참고사항 &gt;<\/div><div class=\"ln note\">※ 법인･시설의 목적사업 운영에 필요한 비품구입비, 토지･건물･기타 자산의 취득을 위해 자산취득비 비목을 편성･지출할 수 있음<\/div><div class=\"ln p\">* 건물･토지, 차량, 대규모 기계･기구, 전산장비, 사무집기류, 물건의 성질 및 형상이 변하지 않고 비교적 장기간 사용할 수 있는 물품 구입(할부금 포함)<\/div><div class=\"ln note\">※ 국가, 시･도, 시･군･구, 그 밖에 사회 복지사업 기금 등에서 받은 공모사업 선정으로 받은 보조금의 반환을 위해 반환금 비목을 편성･지출할 수 있음<\/div><div class=\"pchip\" id=\"p128\"><span>원문 128쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=134\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">재무회계규칙 [별표 2, 4, 6] 세출예산과목구분표 상 “인건비 항-기타후생경비 목”은 ‘직원의 건강진단비 및 기타복리후생에 소요되는 비용’으로, 법인(시설) 직원의 업무수행과 직접 관련하여 지급된 현물･서비스(건강검진비, 치료비 등) 성격으로 봄<\/div><div class=\"ln p\">따라서 명절･생일선물 구입비, 격려 만찬 회식비, 경조사비 등은 소속 직원에게 보탬이 되도록 기관 명의로 집행하는 ‘경비’를 일반적으로 의미하므로, 그 내역에 따라 “업무추진비 항-기관운영비 목”으로 편성하는 것이 적절함<\/div><div class=\"ln p\">다만, 직원에게 지급하는 포상금, 격려금 등은 그 세부 내역에 따라 “업무추진비 항-기관운영비 목” 또는 “운영비 항-기타운영비 목”으로 편성할 수 있으므로, 구체적인 예산편성에 대해서는 각 지자체의 지침으로 정하는 것을 원칙으로 함<\/div><div class=\"ln note\">※비지정후원금은 간접비 중에서 업무추진비(기관운영비, 직책보조비, 회의비) 등으로의 사용을 금지하므로, 후원금의 부적정 사용에 주의할 것(「2024 사회복지법인･시설 현지조사 사례집」 p.144 참고)<\/div><div class=\"ln p\">주의<\/div><div class=\"ln p\">예산에 첨부할 서류는 ① 예산총칙 ② 세입･세출명세서 ③ 추정재무상태표 ④ 추정수지계산서 ⑤ 임직원 보수 일람표 ⑥ 예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록<\/div><div class=\"ln p\">-다만, 단식부기인 경우 ①, ②, ⑤, ⑥만 첨부할 수 있고, 소규모시설(국가･지자체･법인 이외의 자가 설치･운영하는 시설 중 거주자 정원이나 일평균 이용자가 20인 이하인 시설)인 경우 ②, ⑥만 첨부할 수 있음(소규모시설인 노인장기요양기관은 ②, ⑤, ⑥만 첨부할 수 있음(2020.1.7.시행))<\/div><div class=\"ln p\">-어린이집은 보육사업안내에서 정하는 바에 따름<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">준예산의 편성<\/div><div class=\"ln h4\">1) 사유：회계연도 개시 전까지 법인의 예산이 성립되지 아니한 때<\/div><div class=\"ln p\">2)방법：예산 성립 시까지 일부 경비에 대해 전년도 예산에 준하여 집행 가능<\/div><div class=\"ln p\">-임직원 보수, 법인 및 시설운영에 직접 사용되는 필수적인 경비, 법령상 지급의무가 있는 경비에 대해 집행<\/div><div class=\"ln note\">※ 법인의 대표이사 및 시설의 장은 준예산 편성 전에 시･군･구청장에게 사유를 보고할 것<\/div><div class=\"pchip\" id=\"p129\"><span>원문 129쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=135\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">추가경정 예산의 편성<\/div><div class=\"ln p\">1)사유：예산 성립 후에 생긴 사유로 인해 기 성립된 예산에 변경을 가할 필요가 있을 경우<\/div><div class=\"ln h4\">2) 방법：예산편성절차에 준하여 추가경정예산을 편성･확정<\/div><div class=\"ln p\">-이 경우 노인장기요양기관의 장은 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함<\/div><div class=\"ln note\">※법인의 대표이사 및 시설의 장은 추경이 확정된 날로부터 7일 이내에 이를 시･군･구청장에게 제출할 것<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">예비비의 계상<\/div><div class=\"ln p\">법인의 대표이사 및 시설의 장은 예측할 수 없는 예산외의 지출 또는 예산의 초과지출에 충당하기 위하여 예비비를 세출예산에 계상할 수 있음<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">예산의 목적 외 사용금지<\/div><div class=\"ln p\">법인회계 및 시설회계의 예산은 세출예산이 정한 목적 외에 사용금지<\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">예산의 전용<\/div><div class=\"ln p\">1)관간 전용 및 동일 관내 항간 전용：법인 이사회의 의결 또는 사회복지시설 운영위원회에 보고를 거쳐 전용(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 전용)<\/div><div class=\"ln h4\">2) 동일 항내 목간 전용：법인 대표이사 및 시설의 장이 전용 가능<\/div><div class=\"ln p\">3)전용의제한：예산총칙에서 전용을 제한하고 있거나, 예산 심의 과정에서 삭감한 관･항･목으로는 전용하지 못함<\/div><div class=\"ln p\">-노인장기요양기관의 장은 예산을 전용하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함<\/div><div class=\"pchip\" id=\"p130\"><span>원문 130쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=136\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">4)전용에 대한 보고：관･항 전용의 경우에는 관할 시장･군수･구청장에게 과목 전용조서 제출(결산 보고시에 첨부)<\/div><div class=\"ln note\">※보조금을 받는 법인･시설의 경우, 타 법령 또는 보조금 지원 기준 등에 따라 보조금 지원 주체가 예산 전용을 제한할 수 있으므로 해당 법인 및 시설은 이에 따라야 함 (전용을 하는 경우 사전에 보조금을 지원하는 지자체와 협의할 것)<\/div><div class=\"ln p\">사<\/div><div class=\"ln p\">세출예산의 이월<\/div><div class=\"ln p\">1)사유：세출예산 중 성질상 당해 회계연도 안에 지출을 마치지 못할 것으로 예측되는 경비 및 연도 내에 지출원인행위를 하고 불가피한 사유로 인하여 연도 내에 지출하지 못한 경비<\/div><div class=\"ln p\">2)방법：법인 이사회의 의결 또는 시설 운영위원회 보고를 거쳐 다음 연도에 이월 사용 가능(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 이월)<\/div><div class=\"ln p\">아<\/div><div class=\"ln p\">특정목적사업 예산<\/div><div class=\"ln p\">1)사유：완성에 수년을 요하는 공사나 제조 또는 특수한 사업을 위하여 2회계연도 이상에 걸쳐서 그 재원을 조달할 필요가 있는 경우<\/div><div class=\"ln p\">2)방법：회계연도마다 일정액을 예산에 계상하여 특정목적사업을 위한 적립금으로 적립 가능<\/div><div class=\"ln note\">※ 적립금은 별도의 통장으로 관리할 것<\/div><div class=\"ln h4\">3) 절차：적립금의 적립 및 사용계획 등을 시장･군수･구청장에 사전에 보고<\/div><div class=\"ln note\">※시･군･구에서 보고 시기, 보고 방법 등을 별도로 정하는 것을 원칙으로 하며, 별도로 규정하는 사항이 없다면 예산을 제출할 때 적립금의 적립 및 사용계획서를 제출함으로써 보고하고, 사용계획에 변동이 있을 경우에는 즉시 변동 보고를 할 것<\/div><div class=\"ln p\">장기요양기관 재무회계규칙 세부지침<\/div><div class=\"ln p\">1. 목적<\/div><div class=\"pchip\" id=\"p131\"><span>원문 131쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=137\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">장기요양기관이 재무회계규칙에 따른 세입처리를 함에 있어 국민건강보험공단으로부터 지급받은 급여비용의 성격에 따라 세목을 구분하도록 하고,<\/div><div class=\"ln p\">이를 통해 장기요양기관이 노인장기요양보험법 제38조제6항에 따른 인건비 지출비율 준수 현황을 정확하게 확인할 수 있도록 하기 위함임<\/div><div class=\"ln p\">2. 주요 내용<\/div><div class=\"ln p\">장기요양기관은 국민건강보험공단으로부터 제공받은 급여비용, 가산금 수입 상세정보를 바탕으로 장기요양급여수입(목 611), 가산금 수입(목 612)에 세목을 신설하여 처리하여야 한다.<\/div><div class=\"ln note\">※세목신설을 위한 구체적인 장기요양급여수입, 가산금 수입 정보는 「장기요양정보시스템 종사자 인건비 지출내역 신고」 화면을 참조<\/div><div class=\"ln p\">&lt;세목 신설 예시&gt;<\/div><table class=\"htbl\"><tr><td colspan=\"2\">관<\/td><td colspan=\"2\">항<\/td><td colspan=\"2\">목<\/td><td colspan=\"2\">세목<\/td><\/tr><tr><td rowspan=\"4\">06<\/td><td rowspan=\"4\">요양급여수입<\/td><td rowspan=\"4\">61<\/td><td rowspan=\"4\">요양급여수입<\/td><td rowspan=\"2\">611<\/td><td rowspan=\"2\">장기요양 급여수입<\/td><td>6111<\/td><td>A<\/td><\/tr><tr><td>6112<\/td><td>B<\/td><\/tr><tr><td rowspan=\"2\">612<\/td><td rowspan=\"2\">가산금 수입<\/td><td>6122<\/td><td>C<\/td><\/tr><tr><td>6123<\/td><td>D<\/td><\/tr><\/table><div class=\"ln p\">&lt;장기요양정보시스템 종사자 인건비 지출내역 신고 화면 구성 및 회계입력 값 예시&gt;<\/div><table class=\"htbl\"><tr><td colspan=\"2\">① 장기요양급여비용<br>(②+③+④)<\/td><td colspan=\"2\">② 공단부담금 중 인건비 비율 반영 금액<\/td><td colspan=\"2\">③ 공단부담금 중 인건비비율 미반영 금액<\/td><td colspan=\"2\">④ 본인부담금<\/td><\/tr><tr><td>급여<br>비용<\/td><td>가산금<\/td><td>급여<br>비용<\/td><td>가산금<\/td><td>급여<br>비용<\/td><td>가산금<\/td><td>급여<br>비용<\/td><td>가산금<\/td><\/tr><tr><td><\/td><td><\/td><td>A입력<\/td><td>C입력<\/td><td>B 입력<\/td><td>D입력<\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln p\">3. 주의 사항<\/div><div class=\"pchip\" id=\"p132\"><span>원문 132쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=138\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">&lt;장기요양정보시스템 종사자 인건비 지출내역 신고&gt; 화면에서 제공하는 급여비용(가산금 포함) 정보는 기관의 착오청구로 인한 급여비용(가산금 포함) 변동사항을 반영함<\/div><div class=\"ln p\">장기요양기관은 착오청구로 인해 급여비용 또는 가산금 수입에 변동이 있을 경우 이를 회계상에 반영하여야 하며, 회계연도 마감 후 결산보고 시 반드시 회계연도 기간 중에 발생한 급여비용 변동사항이 정확하게 반영되어 있는지 확인해야 함<\/div><div class=\"ln note\">※ 직전 회계연도 기간의 급여비용 변동사항은 익년 2월말을 기준으로 최종 확정<\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>결 산<\/div>", "pages": [{"p": 126, "t": "가\n예산의 편성\n1) 예산총계주의 원칙\n1회계연도의 모든 수입은 세입으로 하고 모든 지출은 세출로 하되, 세입과 세출은 모두 예산에 계상하여야 함\n2) 예산편성절차\n※ 일정에 따른 예산편성, 제출 및 공개 철저\n |  | \n | 주   요   내   용 | 주  체 | 일  정\n |  | \n시･군･구에서 법인 또는 시설에 특히 필요하다고 인정하는 사항에 관해 예산편성지침 통보 가능 | 법인 또는 시설 소재지관할 시장･군수･구청장 | 회계연도 개시2개월 전까지\n\n법인은 법인과 법인 산하 시설의 예산편성지침을 결정 | 법인 대표이사 | 회계연도 개시1개월 전까지\n\n회계별 예산(법인회계, 시설회계, 수익사업회계) 편성 | 법인 대표이사 및시설의 장 | 회계연도 개시전까지\n\n시설회계 예산안에 대한 시설 운영위원회 보고 ※법인이 설치･운영하는 시설의 경우에도 시설회계는 법인이사회 의결 전 시설 운영위원회에 보고 필요 ※ 법인회계 및 수익사업회계에 대해서는 불필요 | 시설의 장 | 예산안 편성완료시\n\n법인의 회계별 예산(법인회계, 시설회계, 수익사업회계)안에 대한 이사회 의결, 예산안 확정 ※ 법인이 설치･운영하는 시설의 시설회계도 포함 ※ 법인이 아닌 경우에는 시설 운영위원회 보고로 예산안이 확정됨 | 법인 이사회 | 예산안 편성완료시\n\n확정된 예산안을 시장･군수･구청장에 제출 ※법인은 법인의 회계별 예산(법인회계, 시설회계, 수익사업회계)을 법인 소재지를 관할하는 시장･군수･구청장에 제출 하고, 시설의 장 (법인이 운영하는 시설도 포함)은 해당 시설의 시설회계를 시설 소재지 관할 시장･군수･구청장에 제출 | 법인 대표이사 및시설의 장 | 회계연도 개시5일 전까지\n\n법인과 시설의 회계별 세입･세출 명세서를 시･군･구, 법인, 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고 ※「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게재 하거나 「영유아보육법」 제49조의2제2항에 따른 공시로 갈음 가능 | 시장･군수･구청장,법인 대표이사,시설의 장 | 예산안 제출20일 이내 | \n |  | "}, {"p": 127, "t": "3) 예산의 편성 방법 및 제출 서류\n별표1~별표10에 따른 세입･세출예산과목구분에 따라 편성\n- 각 지자체는 세입 및 세출예산과목의 세부내역에 대하여 관련 규정 등에 위배되지 않게 별도의 지침으로 정하는 것을 원칙으로 함\n- 시설회계 세출예산(별표4) 편성 시 법인회계로의 전출은 동일 법인에서 운영하는 타 시설 중 자연재해로 인한 개보수가 필요한 경우에 가능\n< 비목 편성･지출 관련 참고사항 >\n※ 법인･시설의 목적사업 운영에 필요한 비품구입비, 토지･건물･기타 자산의 취득을 위해 자산취득비 비목을 편성･지출할 수 있음\n* 건물･토지, 차량, 대규모 기계･기구, 전산장비, 사무집기류, 물건의 성질 및 형상이 변하지 않고 비교적 장기간 사용할 수 있는 물품 구입(할부금 포함)\n※ 국가, 시･도, 시･군･구, 그 밖에 사회 복지사업 기금 등에서 받은 공모사업 선정으로 받은 보조금의 반환을 위해 반환금 비목을 편성･지출할 수 있음"}, {"p": 128, "t": "재무회계규칙 [별표 2, 4, 6] 세출예산과목구분표 상 “인건비 항-기타후생경비 목”은 ‘직원의 건강진단비 및 기타복리후생에 소요되는 비용’으로, 법인(시설) 직원의 업무수행과 직접 관련하여 지급된 현물･서비스(건강검진비, 치료비 등) 성격으로 봄\n따라서 명절･생일선물 구입비, 격려 만찬 회식비, 경조사비 등은 소속 직원에게 보탬이 되도록 기관 명의로 집행하는 ‘경비’를 일반적으로 의미하므로, 그 내역에 따라 “업무추진비 항-기관운영비 목”으로 편성하는 것이 적절함\n다만, 직원에게 지급하는 포상금, 격려금 등은 그 세부 내역에 따라 “업무추진비 항-기관운영비 목” 또는 “운영비 항-기타운영비 목”으로 편성할 수 있으므로, 구체적인 예산편성에 대해서는 각 지자체의 지침으로 정하는 것을 원칙으로 함\n※비지정후원금은 간접비 중에서 업무추진비(기관운영비, 직책보조비, 회의비) 등으로의 사용을 금지하므로, 후원금의 부적정 사용에 주의할 것(「2024 사회복지법인･시설 현지조사 사례집」 p.144 참고)\n주의\n예산에 첨부할 서류는 ① 예산총칙 ② 세입･세출명세서 ③ 추정재무상태표 ④ 추정수지계산서 ⑤ 임직원 보수 일람표 ⑥ 예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록\n-다만, 단식부기인 경우 ①, ②, ⑤, ⑥만 첨부할 수 있고, 소규모시설(국가･지자체･법인 이외의 자가 설치･운영하는 시설 중 거주자 정원이나 일평균 이용자가 20인 이하인 시설)인 경우 ②, ⑥만 첨부할 수 있음(소규모시설인 노인장기요양기관은 ②, ⑤, ⑥만 첨부할 수 있음(2020.1.7.시행))\n-어린이집은 보육사업안내에서 정하는 바에 따름\n나\n준예산의 편성\n1) 사유：회계연도 개시 전까지 법인의 예산이 성립되지 아니한 때\n2)방법：예산 성립 시까지 일부 경비에 대해 전년도 예산에 준하여 집행 가능\n-임직원 보수, 법인 및 시설운영에 직접 사용되는 필수적인 경비, 법령상 지급의무가 있는 경비에 대해 집행\n※ 법인의 대표이사 및 시설의 장은 준예산 편성 전에 시･군･구청장에게 사유를 보고할 것"}, {"p": 129, "t": "다\n추가경정 예산의 편성\n1)사유：예산 성립 후에 생긴 사유로 인해 기 성립된 예산에 변경을 가할 필요가 있을 경우\n2) 방법：예산편성절차에 준하여 추가경정예산을 편성･확정\n-이 경우 노인장기요양기관의 장은 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함\n※법인의 대표이사 및 시설의 장은 추경이 확정된 날로부터 7일 이내에 이를 시･군･구청장에게 제출할 것\n라\n예비비의 계상\n법인의 대표이사 및 시설의 장은 예측할 수 없는 예산외의 지출 또는 예산의 초과지출에 충당하기 위하여 예비비를 세출예산에 계상할 수 있음\n마\n예산의 목적 외 사용금지\n법인회계 및 시설회계의 예산은 세출예산이 정한 목적 외에 사용금지\n바\n예산의 전용\n1)관간 전용 및 동일 관내 항간 전용：법인 이사회의 의결 또는 사회복지시설 운영위원회에 보고를 거쳐 전용(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 전용)\n2) 동일 항내 목간 전용：법인 대표이사 및 시설의 장이 전용 가능\n3)전용의제한：예산총칙에서 전용을 제한하고 있거나, 예산 심의 과정에서 삭감한 관･항･목으로는 전용하지 못함\n-노인장기요양기관의 장은 예산을 전용하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함"}, {"p": 130, "t": "4)전용에 대한 보고：관･항 전용의 경우에는 관할 시장･군수･구청장에게 과목 전용조서 제출(결산 보고시에 첨부)\n※보조금을 받는 법인･시설의 경우, 타 법령 또는 보조금 지원 기준 등에 따라 보조금 지원 주체가 예산 전용을 제한할 수 있으므로 해당 법인 및 시설은 이에 따라야 함 (전용을 하는 경우 사전에 보조금을 지원하는 지자체와 협의할 것)\n사\n세출예산의 이월\n1)사유：세출예산 중 성질상 당해 회계연도 안에 지출을 마치지 못할 것으로 예측되는 경비 및 연도 내에 지출원인행위를 하고 불가피한 사유로 인하여 연도 내에 지출하지 못한 경비\n2)방법：법인 이사회의 의결 또는 시설 운영위원회 보고를 거쳐 다음 연도에 이월 사용 가능(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 이월)\n아\n특정목적사업 예산\n1)사유：완성에 수년을 요하는 공사나 제조 또는 특수한 사업을 위하여 2회계연도 이상에 걸쳐서 그 재원을 조달할 필요가 있는 경우\n2)방법：회계연도마다 일정액을 예산에 계상하여 특정목적사업을 위한 적립금으로 적립 가능\n※ 적립금은 별도의 통장으로 관리할 것\n3) 절차：적립금의 적립 및 사용계획 등을 시장･군수･구청장에 사전에 보고\n※시･군･구에서 보고 시기, 보고 방법 등을 별도로 정하는 것을 원칙으로 하며, 별도로 규정하는 사항이 없다면 예산을 제출할 때 적립금의 적립 및 사용계획서를 제출함으로써 보고하고, 사용계획에 변동이 있을 경우에는 즉시 변동 보고를 할 것\n장기요양기관 재무회계규칙 세부지침\n1. 목적"}, {"p": 131, "t": "장기요양기관이 재무회계규칙에 따른 세입처리를 함에 있어 국민건강보험공단으로부터 지급받은 급여비용의 성격에 따라 세목을 구분하도록 하고,\n이를 통해 장기요양기관이 노인장기요양보험법 제38조제6항에 따른 인건비 지출비율 준수 현황을 정확하게 확인할 수 있도록 하기 위함임\n2. 주요 내용\n장기요양기관은 국민건강보험공단으로부터 제공받은 급여비용, 가산금 수입 상세정보를 바탕으로 장기요양급여수입(목 611), 가산금 수입(목 612)에 세목을 신설하여 처리하여야 한다.\n※세목신설을 위한 구체적인 장기요양급여수입, 가산금 수입 정보는 「장기요양정보시스템 종사자 인건비 지출내역 신고」 화면을 참조\n<세목 신설 예시>\n관 | 항 | 목 | 세목\n06 | 요양급여수입 | 61 | 요양급여수입 | 611 | 장기요양 급여수입 | 6111 | A\n6112 | B\n612 | 가산금 수입 | 6122 | C\n6123 | D\n<장기요양정보시스템 종사자 인건비 지출내역 신고 화면 구성 및 회계입력 값 예시>\n① 장기요양급여비용 (②+③+④) | ② 공단부담금 중 인건비 비율 반영 금액 | ③ 공단부담금 중 인건비비율 미반영 금액 | ④ 본인부담금\n급여 비용 | 가산금 | 급여 비용 | 가산금 | 급여 비용 | 가산금 | 급여 비용 | 가산금\n |  | A입력 | C입력 | B 입력 | D입력 |  | \n3. 주의 사항"}, {"p": 132, "t": "<장기요양정보시스템 종사자 인건비 지출내역 신고> 화면에서 제공하는 급여비용(가산금 포함) 정보는 기관의 착오청구로 인한 급여비용(가산금 포함) 변동사항을 반영함\n장기요양기관은 착오청구로 인해 급여비용 또는 가산금 수입에 변동이 있을 경우 이를 회계상에 반영하여야 하며, 회계연도 마감 후 결산보고 시 반드시 회계연도 기간 중에 발생한 급여비용 변동사항이 정확하게 반영되어 있는지 확인해야 함\n※ 직전 회계연도 기간의 급여비용 변동사항은 익년 2월말을 기준으로 최종 확정\n3\n결 산"}]}, {"title": "3. 결산", "start": 133, "end": 134, "html": "<div class=\"pchip\" id=\"p133\"><span>원문 133쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=139\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">결산보고절차<\/div><div class=\"ln note\">※ 일정에 따른 결산보고서 제출 및 공개업무 철저<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><table class=\"htbl\"><tr><td>주   요   내   용<\/td><td>주  체<\/td><td>일  정<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td>법인회계와 시설회계의 세입･세출 결산보고서 작성<\/td><td>법인 대표이사 및시설의 장<\/td><td>출납 완료시<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>결산 보고서의 시설 운영위원회 보고<br>※법인이 설치･운영하는 시설의 경우에도 시설회계는 법인 이사회 의결 전 시설 운영위원회에 보고 필요<br>※ 법인회계 및 수익사업회계에 대해서는 불필요<\/td><td>시설의 장<\/td><td>결산보고서작성 후<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>결산 보고서의 법인 이사회 의결<br>※ 법인이 설치･운영하는 시설의 시설회계도 포함<br>※법인이 아닌 경우에는 시설 운영위원회 보고로 결산 보고서 확정<\/td><td>법인 대표이사<\/td><td>결산보고서작성 후<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>확정된 결산 보고서를 시장･군수･구청장에 제출<br>※법인은 법인회계, 시설회계, 수익사업회계 결산을 법인 소재지를 관할하는 시장･군수･구청장에 제출하고, 시설의 장 (법인이 운영하는 시설도 포함)은 해당 시설의 시설회계 결산을 시설 소재지 관할 시장･군수･구청장에 제출<\/td><td>법인 대표이사 및시설의 장<\/td><td>다음연도3월 31일까지<\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><tr><td>법인과 시설의 세입･세출 결산서를 시･군･구, 법인, 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고<br>※「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게재 하거나 「영유아보육법」 제49조의2제2항에 따른 공시로 갈음 가능<\/td><td>시장･군수･구청장,법인 대표이사,시설의 장<\/td><td>결산보고서제출 20일이내<\/td><\/tr><\/table><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p134\"><span>원문 134쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=140\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">결산보고서에 첨부하여야 할 서류<\/div><div class=\"ln h4\">1) 세입･세출 결산서<\/div><div class=\"ln h4\">2) 과목전용조서<\/div><div class=\"ln h4\">3) 예비비사용조서<\/div><div class=\"ln h4\">4) 재무상태표<\/div><div class=\"ln h4\">5) 수지계산서<\/div><div class=\"ln h4\">6) 현금 및 예금명세서<\/div><div class=\"ln h4\">7) 유가증권명세서<\/div><div class=\"ln h4\">8) 미수금 명세서<\/div><div class=\"ln h4\">9) 재고자산명세서<\/div><div class=\"ln h4\">10) 그 밖의 유동자산명세서(6~9 유동자산외의 유동자산)<\/div><div class=\"ln h4\">11) 고정자산(토지 건물 차량운반구 비품 전화가입권)명세서<\/div><div class=\"ln h4\">12) 부채명세서(차입금, 미지급금 포함)<\/div><div class=\"ln h4\">13) 각종 충당금 명세서<\/div><div class=\"ln h4\">14) 기본재산수입명세서(법인만 해당)<\/div><div class=\"ln h4\">15) 사업수입명세서<\/div><div class=\"ln h4\">16) 정부보조금명세서<\/div><div class=\"ln h4\">17) 후원금 수입명세 및 사용결과보고서(전산파일을 포함한다)<\/div><div class=\"ln h4\">18) 후원금 전용계좌의 입출금내역<\/div><div class=\"ln h4\">19) 인건비명세서<\/div><div class=\"ln h4\">20) 사업비명세서<\/div><div class=\"ln h4\">21) 그 밖의 비용명세서(인건비 및 사업비를 제외한 비용)<\/div><div class=\"ln h4\">22) 감사보고서<\/div><div class=\"ln h4\">23) 법인세 신고서(수익사업이 있는 경우만 해당함)<\/div><div class=\"ln note\">※단식부기로 회계를 처리하는 경우 1∼3, 14∼23호 서류만을 첨부할 수 있고, 소규모시설의 경우 1, 17호 서류(노인장기요양기관의 경우에는 1∼3, 16∼21호 서류) 만을 첨부할 수 있으며, 어린이집은 보육사업안내에서 별도로 정함<\/div><div class=\"ln p\">→ 밑줄의 장기요양기관 관련 개정사항은 2020년 결산보고서를 제출하는 경우부터 적용(2020.1.7.개정)<\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>회 계<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">회계 총칙<\/div>", "pages": [{"p": 133, "t": "가\n결산보고절차\n※ 일정에 따른 결산보고서 제출 및 공개업무 철저\n |  | \n | 주   요   내   용 | 주  체 | 일  정\n |  | \n법인회계와 시설회계의 세입･세출 결산보고서 작성 | 법인 대표이사 및시설의 장 | 출납 완료시\n\n결산 보고서의 시설 운영위원회 보고 ※법인이 설치･운영하는 시설의 경우에도 시설회계는 법인 이사회 의결 전 시설 운영위원회에 보고 필요 ※ 법인회계 및 수익사업회계에 대해서는 불필요 | 시설의 장 | 결산보고서작성 후\n\n결산 보고서의 법인 이사회 의결 ※ 법인이 설치･운영하는 시설의 시설회계도 포함 ※법인이 아닌 경우에는 시설 운영위원회 보고로 결산 보고서 확정 | 법인 대표이사 | 결산보고서작성 후\n\n확정된 결산 보고서를 시장･군수･구청장에 제출 ※법인은 법인회계, 시설회계, 수익사업회계 결산을 법인 소재지를 관할하는 시장･군수･구청장에 제출하고, 시설의 장 (법인이 운영하는 시설도 포함)은 해당 시설의 시설회계 결산을 시설 소재지 관할 시장･군수･구청장에 제출 | 법인 대표이사 및시설의 장 | 다음연도3월 31일까지\n\n법인과 시설의 세입･세출 결산서를 시･군･구, 법인, 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고 ※「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게재 하거나 「영유아보육법」 제49조의2제2항에 따른 공시로 갈음 가능 | 시장･군수･구청장,법인 대표이사,시설의 장 | 결산보고서제출 20일이내 | \n |  | "}, {"p": 134, "t": "나\n결산보고서에 첨부하여야 할 서류\n1) 세입･세출 결산서\n2) 과목전용조서\n3) 예비비사용조서\n4) 재무상태표\n5) 수지계산서\n6) 현금 및 예금명세서\n7) 유가증권명세서\n8) 미수금 명세서\n9) 재고자산명세서\n10) 그 밖의 유동자산명세서(6~9 유동자산외의 유동자산)\n11) 고정자산(토지 건물 차량운반구 비품 전화가입권)명세서\n12) 부채명세서(차입금, 미지급금 포함)\n13) 각종 충당금 명세서\n14) 기본재산수입명세서(법인만 해당)\n15) 사업수입명세서\n16) 정부보조금명세서\n17) 후원금 수입명세 및 사용결과보고서(전산파일을 포함한다)\n18) 후원금 전용계좌의 입출금내역\n19) 인건비명세서\n20) 사업비명세서\n21) 그 밖의 비용명세서(인건비 및 사업비를 제외한 비용)\n22) 감사보고서\n23) 법인세 신고서(수익사업이 있는 경우만 해당함)\n※단식부기로 회계를 처리하는 경우 1∼3, 14∼23호 서류만을 첨부할 수 있고, 소규모시설의 경우 1, 17호 서류(노인장기요양기관의 경우에는 1∼3, 16∼21호 서류) 만을 첨부할 수 있으며, 어린이집은 보육사업안내에서 별도로 정함\n→ 밑줄의 장기요양기관 관련 개정사항은 2020년 결산보고서를 제출하는 경우부터 적용(2020.1.7.개정)\n4\n회 계\n가\n회계 총칙"}]}, {"title": "4. 회계", "start": 135, "end": 137, "html": "<div class=\"pchip\" id=\"p135\"><span>원문 135쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=141\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">1) 수입 및 지출사무 관리주체：법인의 대표이사 및 시설의 장<\/div><div class=\"ln note\">※ 법인 대표이사 및 시설장은 해당 사무를 소속직원에게 “각각” 위임가능<\/div><div class=\"ln h4\">2) 수입과 지출의 집행기관<\/div><div class=\"ln p\">법인과 시설에는 수입과 지출의 현금출납업무를 담당하기 위하여 “각각” 수입원과 지출원을 두되, 법인 또는 시설의 규모가 소규모인 경우에는 수입원과 지출원을 동일인으로 할 수 있음<\/div><div class=\"ln note\">※시･도별로 지역여건에 따라 자체적으로 수입원과 지출원을 동일인으로 할 수 있는 소규모 법인 및 시설에 대해 규정할 것<\/div><div class=\"ln p\">수입원과 지출원은 법인의 대표이사와 시설장이 임면함<\/div><div class=\"ln h4\">3) 회계의 방법：단식부기로 하되, 법인･수익사업회계는 복식부기 가능<\/div><div class=\"ln h4\">4) 법인 및 시설 비치 회계장부：① 현금출납부 ② 총계정원장 ③ 재산대장 ④ 비품관리대장<\/div><div class=\"ln note\">※컴퓨터 회계프로그램 또는 사회복지시설정보시스템 등에 따라 전자장부를 사용하는 경우에는 회계장부를 둔 것으로 봄. 다만, 회계감독 등을 위해 지방자치단체에서 요청하는 경우에는 출력물 보관 필요<\/div><div class=\"ln p\">노인장기요양기관의 장이 제10조에 따른 예산을 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도 1월부터 6월까지의 회계장부)을 해당 회계연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함<\/div><div class=\"ln p\">*&lt;예시&gt; 2020년도 예산보고서를 2019.12.26.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출<\/div><div class=\"ln p\">노인장기요양기관의 장이 제19조에 따른 결산보고서를 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도의 다음연도 1월부터 6월까지의 회계장부)을 해당 회계연도의 다음연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함<\/div><div class=\"ln p\">*&lt;예시&gt; 2019년도 결산보고서를 2020.3.31.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">수입<\/div><div class=\"pchip\" id=\"p136\"><span>원문 136쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=142\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">1) 수입금의 수납 관리<\/div><div class=\"ln p\">모든 수입금의 수납은 이를 금융기관에 취급시키는 경우를 제외하고는 수입원이 아니면 수납하지 못함<\/div><div class=\"ln p\">수입원이 수납한 수입금은 그 다음날까지 금융기관에 예입해야 함<\/div><div class=\"ln p\">수입금에 대한 금융기관의 거래통장은 회계별(법인회계, 시설회계, 수익사업회계)로 구분될 수 있도록 보관･관리<\/div><div class=\"ln h4\">2) 과년도 수입, 반납금, 과오납금 처리<\/div><div class=\"ln p\">출납 완결 연도에 속하는 수입 기타 예산외 수입은 모두 현년도 예산에 편입<\/div><div class=\"ln p\">지출된 세출의 반납금은 각각 지출한 세출의 당해 과목에 다시 넣을 수 있음<\/div><div class=\"ln p\">과오납된 수입금은 수입한 세입에서 직접 반환<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">지출<\/div><div class=\"ln h4\">1) 지출의 원칙<\/div><div class=\"ln p\">지출은 지출사무를 관리하는 자(대표이사, 시설장) 및 그 위임을 받아 지출명령(예산 범위 내에서)이 있는 것에 한하여 지출원이 행함<\/div><div class=\"ln p\">지출은 상용의 경비 또는 소액의 경비지출을 제외하고는 예금통장에 의하거나 전자거래로 행함<\/div><div class=\"ln note\">※상용 경비 또는 소액의 경비 지출은 현금으로 가능하며 이를 위해 지출원은 100만원 이하의 현금을 보관할 수 있으며, 상용경비 또는 소액의 경비 지출의 범위는 시･도지사가 자체적으로 정함<\/div><div class=\"ln note\">※ 상용경비 또는 소액의 경비 지출 시에도 영수증 등 증빙 서류 관리 철저<\/div><div class=\"ln h4\">2) 지출의 특례(선금지급, 추산지급)<\/div><div class=\"ln p\">선금지급을 할 수 있는 경비의 범위<\/div><div class=\"ln p\">가) 외국에서 직접 구입하는 기계, 도서, 표본 또는 실험용재료의 대가<\/div><div class=\"pchip\" id=\"p137\"><span>원문 137쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=143\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나) 정기간행물의 대가<\/div><div class=\"ln p\">다) 토지 또는 가옥의 임대료와 용선료<\/div><div class=\"ln p\">라) 운 임<\/div><div class=\"ln p\">마) 소속직원중 특별한 사정이 있는 자에 대하여 지급하는 급여의 일부<\/div><div class=\"ln p\">바)관공서(정부투자기관관리기본법에 의한 정부투자기관 및 특별법에 의하여 설립된 특수법인 포함)에 대하여 지급하는 경비<\/div><div class=\"ln p\">사) 외국에서 연구 또는 조사에 종사하는 자에 대하여 지급하는 경비<\/div><div class=\"ln p\">아) 보조금<\/div><div class=\"ln p\">자) 사례금<\/div><div class=\"ln p\">차)계약금액이 1천만원 이상인 공사나 제조 또는 물건의 매입을 하는 경우에 계약금액의 100분의 50을 초과하지 아니하는 금액<\/div><div class=\"ln p\">추산지급을 할 수 있는 경비의 범위<\/div><div class=\"ln note\">※추산지급이란 지출금액이 미확정인 채무에 대하여 지급의무가 확정되기 전에 추산(推算：짐작으로 미루어 셈함)으로 지급하는 것을 의미함<\/div><div class=\"ln p\">가) 여비 및 판공비<\/div><div class=\"ln p\">나) 관공서에 대하여 지급하는 경비<\/div><div class=\"ln p\">다) 보조금<\/div><div class=\"ln p\">라) 소송비용<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">계약<\/div><div class=\"ln p\">계약에 관한 사항은 「지방자치단체를 당사자로 하는 계약에 관한 법률」, 동법 시행령 및 동법 시행규칙을 준용하여 처리함<\/div><div class=\"ln note\">※다만, 국가･지방자치단체･사회복지법인 이외의 주체가 설치･운영하는 시설은 그러하지 아니함<\/div><div class=\"ln h2\"><span class=\"badge\">5<\/span>물 품<\/div>", "pages": [{"p": 135, "t": "1) 수입 및 지출사무 관리주체：법인의 대표이사 및 시설의 장\n※ 법인 대표이사 및 시설장은 해당 사무를 소속직원에게 “각각” 위임가능\n2) 수입과 지출의 집행기관\n법인과 시설에는 수입과 지출의 현금출납업무를 담당하기 위하여 “각각” 수입원과 지출원을 두되, 법인 또는 시설의 규모가 소규모인 경우에는 수입원과 지출원을 동일인으로 할 수 있음\n※시･도별로 지역여건에 따라 자체적으로 수입원과 지출원을 동일인으로 할 수 있는 소규모 법인 및 시설에 대해 규정할 것\n수입원과 지출원은 법인의 대표이사와 시설장이 임면함\n3) 회계의 방법：단식부기로 하되, 법인･수익사업회계는 복식부기 가능\n4) 법인 및 시설 비치 회계장부：① 현금출납부 ② 총계정원장 ③ 재산대장 ④ 비품관리대장\n※컴퓨터 회계프로그램 또는 사회복지시설정보시스템 등에 따라 전자장부를 사용하는 경우에는 회계장부를 둔 것으로 봄. 다만, 회계감독 등을 위해 지방자치단체에서 요청하는 경우에는 출력물 보관 필요\n노인장기요양기관의 장이 제10조에 따른 예산을 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도 1월부터 6월까지의 회계장부)을 해당 회계연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함\n*<예시> 2020년도 예산보고서를 2019.12.26.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출\n노인장기요양기관의 장이 제19조에 따른 결산보고서를 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도의 다음연도 1월부터 6월까지의 회계장부)을 해당 회계연도의 다음연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함\n*<예시> 2019년도 결산보고서를 2020.3.31.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출\n나\n수입"}, {"p": 136, "t": "1) 수입금의 수납 관리\n모든 수입금의 수납은 이를 금융기관에 취급시키는 경우를 제외하고는 수입원이 아니면 수납하지 못함\n수입원이 수납한 수입금은 그 다음날까지 금융기관에 예입해야 함\n수입금에 대한 금융기관의 거래통장은 회계별(법인회계, 시설회계, 수익사업회계)로 구분될 수 있도록 보관･관리\n2) 과년도 수입, 반납금, 과오납금 처리\n출납 완결 연도에 속하는 수입 기타 예산외 수입은 모두 현년도 예산에 편입\n지출된 세출의 반납금은 각각 지출한 세출의 당해 과목에 다시 넣을 수 있음\n과오납된 수입금은 수입한 세입에서 직접 반환\n다\n지출\n1) 지출의 원칙\n지출은 지출사무를 관리하는 자(대표이사, 시설장) 및 그 위임을 받아 지출명령(예산 범위 내에서)이 있는 것에 한하여 지출원이 행함\n지출은 상용의 경비 또는 소액의 경비지출을 제외하고는 예금통장에 의하거나 전자거래로 행함\n※상용 경비 또는 소액의 경비 지출은 현금으로 가능하며 이를 위해 지출원은 100만원 이하의 현금을 보관할 수 있으며, 상용경비 또는 소액의 경비 지출의 범위는 시･도지사가 자체적으로 정함\n※ 상용경비 또는 소액의 경비 지출 시에도 영수증 등 증빙 서류 관리 철저\n2) 지출의 특례(선금지급, 추산지급)\n선금지급을 할 수 있는 경비의 범위\n가) 외국에서 직접 구입하는 기계, 도서, 표본 또는 실험용재료의 대가"}, {"p": 137, "t": "나) 정기간행물의 대가\n다) 토지 또는 가옥의 임대료와 용선료\n라) 운 임\n마) 소속직원중 특별한 사정이 있는 자에 대하여 지급하는 급여의 일부\n바)관공서(정부투자기관관리기본법에 의한 정부투자기관 및 특별법에 의하여 설립된 특수법인 포함)에 대하여 지급하는 경비\n사) 외국에서 연구 또는 조사에 종사하는 자에 대하여 지급하는 경비\n아) 보조금\n자) 사례금\n차)계약금액이 1천만원 이상인 공사나 제조 또는 물건의 매입을 하는 경우에 계약금액의 100분의 50을 초과하지 아니하는 금액\n추산지급을 할 수 있는 경비의 범위\n※추산지급이란 지출금액이 미확정인 채무에 대하여 지급의무가 확정되기 전에 추산(推算：짐작으로 미루어 셈함)으로 지급하는 것을 의미함\n가) 여비 및 판공비\n나) 관공서에 대하여 지급하는 경비\n다) 보조금\n라) 소송비용\n라\n계약\n계약에 관한 사항은 「지방자치단체를 당사자로 하는 계약에 관한 법률」, 동법 시행령 및 동법 시행규칙을 준용하여 처리함\n※다만, 국가･지방자치단체･사회복지법인 이외의 주체가 설치･운영하는 시설은 그러하지 아니함\n5\n물 품"}]}, {"title": "5. 물품", "start": 138, "end": 138, "html": "<div class=\"pchip\" id=\"p138\"><span>원문 138쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=144\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">물품의 관리<\/div><div class=\"ln h4\">1) 물품：현금 및 유가증권을 제외한 동산<\/div><div class=\"ln h4\">2) 물품의 관리주체：법인의 대표이사, 시설의 장<\/div><div class=\"ln note\">※ 대표이사와 시설장은 물품관리에 관한 사항을 소속직원에게 위임가능<\/div><div class=\"ln p\">물품의 출납보관을 위해 소속직원 중 물품출납원 지정<\/div><div class=\"ln p\">물품관리자와 물품출납원은 선량한 관리자의 주의의무로 물품관리<\/div><div class=\"ln h4\">3) 물품의 관리<\/div><div class=\"ln p\">물품의 출납은 물품관리자의 출납명령에 의해 물품출납원의 출납행위를 통해서만 가능함<\/div><div class=\"ln note\">※ 물품출납원은 물품관리자의 출납명령 없이는 물품을 출납할 수 없음<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">물품의 조사 및 처리<\/div><div class=\"ln h4\">1) 재물조사 실시<\/div><div class=\"ln p\">연 1회 법인 및 시설에 대한 정기 재물조사 실시(의무사항)<\/div><div class=\"ln p\">필요시 수시재물조사 실시(대표이사 및 시설장 재량사항)<\/div><div class=\"ln h4\">2) 불용품의 처리<\/div><div class=\"ln p\">사용 불가능 또는 수리하여 재사용이 불가능한 물품은 불용 결정함<\/div><div class=\"ln p\">불용품 매각시 그 대금은 당해 법인 또는 시설의 세입예산에 편입함<\/div>", "pages": [{"p": 138, "t": "가\n물품의 관리\n1) 물품：현금 및 유가증권을 제외한 동산\n2) 물품의 관리주체：법인의 대표이사, 시설의 장\n※ 대표이사와 시설장은 물품관리에 관한 사항을 소속직원에게 위임가능\n물품의 출납보관을 위해 소속직원 중 물품출납원 지정\n물품관리자와 물품출납원은 선량한 관리자의 주의의무로 물품관리\n3) 물품의 관리\n물품의 출납은 물품관리자의 출납명령에 의해 물품출납원의 출납행위를 통해서만 가능함\n※ 물품출납원은 물품관리자의 출납명령 없이는 물품을 출납할 수 없음\n나\n물품의 조사 및 처리\n1) 재물조사 실시\n연 1회 법인 및 시설에 대한 정기 재물조사 실시(의무사항)\n필요시 수시재물조사 실시(대표이사 및 시설장 재량사항)\n2) 불용품의 처리\n사용 불가능 또는 수리하여 재사용이 불가능한 물품은 불용 결정함\n불용품 매각시 그 대금은 당해 법인 또는 시설의 세입예산에 편입함"}]}, {"title": "6. 후원금의 관리", "start": 139, "end": 148, "html": "<div class=\"pchip\" id=\"p139\"><span>원문 139쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=145\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">6<\/span>후원금의 관리<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">후원금의 접수<\/div><div class=\"ln h4\">1) 후원금의 범위 등<\/div><div class=\"ln p\">정의：아무런 대가없이 무상으로 받은 금품이나 그 밖의 자산<\/div><div class=\"ln note\">※ 「사회복지사업법」 제45조<\/div><div class=\"ln p\">법인의 대표이사와 시설의 장은 후원금의 수입･지출 내용을 공개하여야 하며 그 관리에 명확성이 확보되도록 하여야 하고,<\/div><div class=\"ln p\">후원금에 관한 영수증 발급, 수입 및 사용결과 보고 등을 하지 않은 경우 300만원 이하의 과태료를 부과함<\/div><div class=\"ln note\">※ 「사회복지사업법」 제45조, 제58조 및 「사회복지사업법 시행령」 제26조<\/div><div class=\"ln note\">※최근 사회복지법인 및 사회복지시설에서의 후원금 부정･부당 사용, 횡령 등 사례가 수사기관을 통해 반복적으로 적발되고 있음에도 불구하고, 지자체에서의 과태료 처분 사례는 거의 확인되지 않고 있는 바, 법인시설 관할 지자체에의 엄정한 법 집행 차원에서 후원금 사용과 관련한 위법사례가 확인될 경우 과태료 처분 등을 통해 법인･시설의 투명성을 제고할 것<\/div><div class=\"ln note\">※사회복지법인은 「법인세법 시행령」 제39조제1항제1호가목에 따른 ‘공익법인(구 지정기부금단체)’에 해당하며, 같은 조 제6항 및 「법인세법 시행규칙」 제19조제1항에 따라 의무이행 여부 등을 사업연도 종료일부터 4개월 이내에 국세청(관할세무서)에 보고하여야 함<\/div><div class=\"ln p\">*사회복지법인은 의무이행의 규정의 적용대상이 아니었으나, 법인세법령 개정에 따라 ’20년도부터(’19.1.1.이후 개시하는 사업연도 분에 대하여) 매년 4월 이내에 「사회복지사업법」상 주무관청인 시･도지사에게 보고 필요<\/div><div class=\"ln p\">(「법인세법 시행령」 제36조(현행 제39조) 개정(’18.2.13.) 및 「법인세법 시행규칙」 제18조의2(현행 제19조) 개정(’18.3.21.개정))<\/div><div class=\"ln p\">주의<\/div><div class=\"pchip\" id=\"p140\"><span>원문 140쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=146\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>「기부금품의 모집 및 사용에 관한 법률」 질의 회신&lt;행안부 민간협력과-1292(’23.11.17.)호&gt;<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">질의내용<br>- 사회복지사업법상 사회복지법인 및 사회복지시설의 운영자가 적극적 모금행위 없이 사회복지사업법에 따라 법인 또는 시설 운영을 위해 후원금을 수령할 경우 이에 대해 기부금품법상 모집자 등록, 모집계획 제출 등의 절차를 지켜야 하는지 여부<br>답변사항<br>-  「기부금품의 모집･사용 및 기부문화 활성화에 관한 법률」 제5조제2항에 따르면 “국가나 지방자치단체 및 그 소속 기관․공무원과 국가 또는 지방자치단체에서 출자․출연하여 설립된 법인․단체는 자발적으로 기탁하는 금품이라도 법령에 다른 규정이 있는 경우 외에는 이를 접수할 수 없다.”라고 규정되어 있습니다.<br>- 따라서, 사회복지사업법상 사회복지법인 및 사회복지시설이 국가 또는 지방자치단체에서 출자․출연하여 설립된 단체 등이 아닌 경우, 적극적인 모집행위* 없이 자발적으로 기탁된 금품을 접수하는 때에는 기부금품 모집등록 관련 절차를 이행하지 않아도 될 것으로 판단됩니다.<br>* 서신, 광고, 그 밖의 방법으로 기부금품의 출연을 타인에게 의뢰･권유 또는 요구하는 행위(「기부금품법」 제2조제3호)<br>- 다만, 기부금품법 제4조에 따라 기부금품을 모집하려는 경우 등록청에 모집등록하여야 합니다<\/td><\/tr><\/table><div class=\"ln h4\">2) 후원금 영수증 발급<\/div><div class=\"ln p\">법인의 대표이사와 시설장은 후원금을 받은 때에는 「소득세법 시행규칙」 제101조제20호의2 또는 「법인세법 시행규칙」 제82조제7항3호의3에서 정하는 기부금영수증 서식에 따라 후원금 영수증을 발급･후원자에게 교부<\/div><div class=\"ln p\">금융기관 또는 체신관서의 계좌입금을 통해 후원금을 받는 경우에는 법인 명의 또는 시설명칭이 부기된 시설장 명의의 후원금전용계좌를 사용해야 함<\/div><div class=\"ln note\">※ 이 경우 후원자가 원하는 경우를 제외하고는 영수증 발급 생략할 수 있음<\/div><div class=\"ln h4\">3) 후원금 전용계좌의 개설<\/div><div class=\"ln p\">법인 및 시설에서 후원금을 받을 때는 각각의 법인 및 시설별로 후원금 전용계좌를 구분하여 사용하고, 미리 후원자에게 후원금 전용계좌 등의 구분에 관한 사항을 반드시 안내(「사회복지법인 및 사회복지시설 재무･회계 규칙」 제41조의4)<\/div><div class=\"pchip\" id=\"p141\"><span>원문 141쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=147\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※후원금전용계좌에서 발생하는 이자도 후원금의 성격을 가지는 금액으로 후원금 관리 기준에 따라 사용하여야 함<\/div><div class=\"ln p\">➝ 시설･법인회계로 세입처리 시, 해당 세입과목 비고란에 후원금전용계좌에서 발생한 이자임을 표기하고 비지정후원금 사용기준에 부합하게 사용할 것<\/div><div class=\"ln note\">※ʼ13.11월 안전행정부에서 실시한 「취약 계층 복지 실태 기획 감찰」 결과에 따르면, 후원자가 법인과 시설을 동일체로 인식하여 시설입소자를 위한 목적으로 법인에 기탁하는 경향이 높은 것으로 조사됨<\/div><div class=\"ln note\">※지자체는 법인으로 하여금 후원금이 시설 입소자들의 복리증진을 위한 용도로 사용될 수 있도록 시설에의 「법인 전입금(후원금)」 비율을 확대하도록 하게끔 권고할 것<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">후원금의 관리<\/div><div class=\"ln h4\">1) 후원금 발급 목록 장부 비치<\/div><div class=\"ln p\">후원금을 받은 때에는 후원금 영수증 교부 후 발급목록을 별도 장부로 관리하여 비치<\/div><div class=\"ln p\">〔후원금 영수증 발급 대장〕<\/div><table class=\"htbl\"><tr><td rowspan=\"2\">연번<\/td><td rowspan=\"2\">일시<\/td><td rowspan=\"2\">후원자(법인)<\/td><td colspan=\"2\">후원금 유형 및 금액<\/td><td rowspan=\"2\">지정후원금 용도<\/td><td rowspan=\"2\">비고<\/td><\/tr><tr><td>지정<\/td><td>비지정<\/td><\/tr><tr><td>&lt;예시&gt;<br>1<\/td><td>&lt;예시&gt;<br>2013.1.25<\/td><td>&lt;예시&gt;<br>000법인<\/td><td>&lt;예시&gt;<br>500,000원<\/td><td><\/td><td>&lt;예시&gt;<br>아동급식지원<\/td><td><\/td><\/tr><tr><td>2<\/td><td>2013.1.30<\/td><td>000<\/td><td><\/td><td>100,000원<\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln h4\">2) 후원금의 수입 및 사용내용 통보<\/div><div class=\"ln p\">대표이사와 시설장은 연 1회 이상 해당 후원금의 수입 및 사용내용을 후원금을 낸 법인･단체 또는 개인에게 통보<\/div><div class=\"ln p\">법인이 발행하는 정기간행물 또는 홍보지 등을 이용하여 일괄통보 가능하며 후원자 각각에게 개별통보도 가능<\/div><div class=\"pchip\" id=\"p142\"><span>원문 142쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=148\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) 후원금의 수입 및 사용결과 보고･공개<\/div><div class=\"ln p\">대표이사와 시설장은 관할 시장･군수･구청장에게 결산보고서를 제출할 때 후원금수입 및 사용결과보고서를 함께 제출<\/div><div class=\"ln p\">-이 경우 반드시 전자파일로 제출하여야 하며 출력한 보고서도 추가 제출 가능<\/div><div class=\"ln note\">※ 변경된 후원금 수입 및 사용결과보고서(별지제19호) 양식은 2013년도 후원금부터 적용<\/div><div class=\"ln note\">※(주의) 후원금 수입 및 사용결과보고서(별지제19호, p.224)의 3. 후원금 사용명세서의 ‘사용내역’란에는 법인･시설별 세출예산과목구분표상의 목이나 내역 수준으로 구체적인 사항을 반드시 기재하고, 지원대상자의 실명 등 민감정보가 기입되지 않도록 개인정보보호에 유의하여야 함<\/div><div class=\"ln p\">시장･군수･구청장은 제출받은 후원금의 수입 및 사용결과 보고서를 제출받은 날부터 20일 이내에 인터넷(시･군･구 홈페이지) 등을 통하여 3개월간 공개<\/div><div class=\"ln p\">같은 기간 동안 법인의 대표이사 및 시설의 장도 후원금수입 및 사용결과 보고서를 법인 및 시설의 게시판과 인터넷 홈페이지에 공개<\/div><div class=\"ln note\">※ 단, 후원자 성명(법인의 경우 그 명칭)은 공개하지 말 것<\/div><div class=\"ln p\">각 시･군･구 및 시･도는 법인과 시설의 후원금 수입 및 사용결과 보고 및 공개 의무를 사전에 충분히 안내하고 사후에 철저히 지도･감독<\/div><div class=\"ln p\">후원금 수입 및 사용결과 보고･공개 의무 위반 시 300만원 이하의 과태료 부과<\/div><div class=\"ln note\">※후원금 보고･공개가 미흡하므로 후원금수입 및 사용결과 보고 및 공개 업무 철저 필요(’12.6 감사원, “사회복지시설 후원금 등 관리실태” 감사 지적사항)<\/div><div class=\"ln note\">※「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 통하여 후원금수입 및 사용결과보고서를 게시하는 경우, 시･군･구, 법인 및 시설 홈페이지에 공고한 것으로 갈음<\/div><div class=\"ln h4\">4) 후원금의 용도 외 사용 금지<\/div><div class=\"ln note\">※ 후원금을 다음에서 정하고 있는 용도에 위반하여 사용한 경우 법 제45조제2항에서 위임한 재무회계규칙을 위반한 것이 됨<\/div><div class=\"ln p\">➝ 이는 시행령 [별표 5] 과태료 2. 개별기준 중 파목에 해당되어 과태료 300만원 처분대상임<\/div><div class=\"ln note\">※사회복지시설이 후원금을 다음에서 정하고 있는 용도에 위반하여 사용한 경우 이는 법 제40조제1항제4호에도 해당함<\/div><div class=\"ln p\">➝ 이는 시행규칙 [별표4] 행정처분 2. 개별기준 중 4호 가목에 해당되어 1차 위반시 개선명령, 2차 위반시부터 시설장 교체 처분대상임<\/div><div class=\"ln note\">※후원금 용도 위반이 적발된 경우 보조금 지급 대상자 선정 시에 이를 반드시 감안토록 할 것(2017년 국무조정실 부패예방감시단 지적사항)<\/div><div class=\"pchip\" id=\"p143\"><span>원문 143쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=149\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">법인의 대표이사와 시설의 장은 후원금을 후원자가 지정한 용도 이외로 사용할 수 없음<\/div><div class=\"ln note\">※다만, 지정후원금의 15%는 후원금 모집, 관리, 운영, 사용, 결과보고 등에 필요한 비용으로 사용 가능. 단, 사회복지법인 어린이재단을 통한 지정후원금 및 생활자에 대한 결연후원금은 제외<\/div><div class=\"ln note\">※지정후원금은 기탁서에 다음과 같은 기준에 모두 부합되는 용도를 명시한 경우에 한해서 지정후원금으로 인정(2017년 국무조정실 부패예방감시단 지적사항)<\/div><div class=\"ln p\">①지정용도가 「사회복지법인 및 사회복지시설 재무･회계 규칙」 별표 2, 별표 4, 별표 6, 별표 8, 별표 10의 세출 ʻʻ목ʼʼ 수준으로 상세하게 명시하되, 가급적 내역수준으로 구체적인 용도가 지정되도록 할 것<\/div><div class=\"ln p\">‑ʻʻ법인･시설의 운영ʼʼ 등과 같이 용도를 포괄적으로 지정한 경우, 비지정후원금의 사용 기준에 따라 관리하여야 함<\/div><div class=\"ln p\">②사회복지법인에 후원하는 경우 그 지정용도가 해당 사회복지법인의 권리･행위능력의 범위 내일 것<\/div><div class=\"ln p\">‑예컨대, 사회복지법인이 수행할 수 없는 사업(의료기관 개설 등)을 수행하라는 취지의 용도는 「사회복지사업법」 상 후원금으로 볼 수 없음<\/div><div class=\"ln note\">※사회복지시설정보시스템에 기탁내용(후원약속사항)이 등록된 경우에만 회계 반영이 가능하도록 함(ʼ18년 하반기)<\/div><div class=\"ln note\">※&lt;참고&gt; 모금기관*에서 받은 배분금에 대한 회계처리 기준<\/div><div class=\"ln p\">‑지정후원금 인정은 원칙적으로 후원자로부터 받은 &lt;기탁서&gt;에 용도가 세출예산 “목” 수준으로 상세히 명시되어야 가능하나,<\/div><div class=\"ln p\">‑모금기관으로부터 배분금을 받는 경우에는 기탁서를 발부하지 않으므로, 기탁서 대신 구체적인 용도가 지정된 공문 및 사업계획서, 계약서 등(또는 공모 공고문, 수행기관 선정 공문)을 근거로 하여 &lt;지정후원금&gt;으로 회계처리<\/div><div class=\"ln p\">* 사회복지공동모금회, 한국사회복지협의회<\/div><div class=\"ln p\">후원자가 용도를 지정하지 않은 후원금에 대해서는 법인 운영비 및 시설 운영비로 사용하되, 다음 기준에 따라 사용할 것<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><table class=\"htbl\"><tr><td>〔비지정후원금의 사용 기준〕<br>후원자가 사용 용도를 지정하지 않은 비지정후원금은 법인 운영비 및 시설 운영비로 사용하되, 간접비로 사용하는 비율은 50%*를 초과하지 못함<br>※ 간접비 사용 비율 50%는 당해연도 후원금 수입금액이 아닌, 지출금액을 기준으로 함<br>다만, 간접비 중에서도 업무추진비(기관운영비, 직책보조비, 회의비), 법인회계전출금, 부채상환금, 잡지출, 예비비 등으로는 사용 금지(구체적인 내용은 후면 참고)<br>※ 업무추진비 중 후원금 모집 등을 위한 운영비, 회의비는 당해연도 비지정후원금 지출금액의 15%범위 내에서 사용 가능<br>자산취득비로 사용하는 것은 원칙적으로 금지하나, 토지･건물을 제외하고 시설 운영에 필요한 집기, 장비 등은 구입 가능<br>※ 다만, 주무관청이 승인하는 경우에 한해 비지정 후원금으로 법인 사옥 마련을 위한 토지･건물 취득은 가능<br>※ 토지･건물은 부동산으로서 기본재산에 해당하므로, 비지정후원금으로 사옥 마련을 위한토지･건물을 취득하고자 하는 경우 기본재산 처분허가 신청과 함께 비지정후원금 사용 승인여부도 주무관청에 문의하여야함<br>※ 주무관청은 토지･건물 구입 목적이 사옥 마련용인지, 회계 처리에 문제가 없는지 등을 확인하고, 승인 이후 정관상 기본재산으로 취득한 토지･건물을 등록하고 실제 사옥으로 사용하는지 등을 점검하여야함. 법인은 추후 감사 시 지적을 받지 않도록 관련 자료, 이사회 의결서 등 증빙 자료를 정리･보관할 것을 권고<br>시설비는 건물 노후화, 정원대비 협소한 공간 등 시설 입소･이용자의 불편을 해소하기 위하여 시설 신축, 증･개축이 필요하다고 인정되는 경우에는 관할 주무관청의 승인을 받아 사용 가능<br>인건비로 사용 가능하되, 후원금으로 직원 수당을 지급하는 경우에는 근로기준법 또는 ʻʻ사회복지시설 종사자 가이드라인ʼʼ에서 정하고 있는 수당(명절휴가비, 시간외근무수당, 가족수당), 사회복지업무수당(다만 사회복지공무원에게 지급되는 수당 이상을 초과할 수 없으며 전체 비지정후원금의 50% 한도 내에서만 수당 지급 가능)과 지방자치단체에서 별도로 정하고 있는 수당에 한하여 편성･지급해야 함을 원칙으로 함. 다만, 개별 사회복지법인 및 사회복지시설에서는 지방자치단체와 협의하여 수당 항목을 추가로 정할 수 있음<br>※사회복지업무수당이란 종사자 처우 개선을 위한 특수업무수당, 직무수당, 종사자 장려수당, 종사자 복지수당 등<br>※ 종사자 처우 관련 수당을 이미 지급하고 있는 시･도 또는 시･군･구의 경우 기존대로 지급<br>※분기별 정산 원칙으로, 전(前)분기에서 수령한 비지정 후원금의 50% 이내에서 현(現)분기에 사회복지업무수당 지급 가능하며 필요시 지자체와 협의 하에 조정 가능<\/td><\/tr><\/table><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p145\"><span>원문 145쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=151\" target
