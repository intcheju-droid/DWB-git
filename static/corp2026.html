<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 사회복지법인 관리안내 대시보드</title>
<meta name="description" content="보건복지부 「2026년 사회복지법인 관리안내」 원문 기반 · 전체 293쪽 · 본문·표는 한글(HWPX) 원본에서 추출">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6a4fa8; --accent-deep:#4f3680; --accent-soft:#f0ecf8; --accent-line:#d4c9ea;
  --ink:#1d2823; --ink-2:#4c5a53; --ink-3:#7b897f;
  --bg:#f4f7f5; --card:#ffffff; --line:#dde5df;
  --chg:#b45309; --chg-soft:#fdf3e3;
  --mark:#ffe9a8;
  --fs:17px; --fs-pre:13.5px;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  font-size:var(--fs); line-height:1.65;
}
body.hc{
  --accent:#ffd400; --accent-deep:#ffd400; --accent-soft:#1a1a1a; --accent-line:#666;
  --ink:#ffffff; --ink-2:#f0f0f0; --ink-3:#cccccc;
  --bg:#000000; --card:#0d0d0d; --line:#555;
  --chg:#ffbf47; --chg-soft:#1f1503;
  --mark:#8a6d00;
}
body.hc a{color:#ffd400}
a{color:var(--accent-deep)}
button{font-family:inherit}

header{
  background:linear-gradient(135deg,var(--accent-deep),var(--accent));
  color:#fff; padding:26px 20px 20px;
}
body.hc header{background:#000;border-bottom:3px solid #ffd400;color:#fff}
.hwrap{max-width:1180px;margin:0 auto}
.htop{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.htitle h1{margin:0;font-size:1.5em;font-weight:900;letter-spacing:-.01em}
.htitle .sub{margin-top:4px;font-size:.82em;opacity:.92}
.hctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.55);color:#fff;
  border-radius:9px;padding:7px 13px;font-size:.85em;font-weight:700;cursor:pointer;
}
.hbtn:hover{background:rgba(255,255,255,.3)}
body.hc .hbtn{background:#000;border-color:#ffd400;color:#ffd400}
.searchrow{max-width:1180px;margin:18px auto 0;display:flex;gap:10px}
#q{
  flex:1;padding:13px 18px;border-radius:12px;border:none;font-size:1em;
  font-family:inherit;box-shadow:0 3px 14px rgba(0,0,0,.18);
}
body.hc #q{border:2px solid #ffd400;background:#111;color:#fff}
#qbtn{border:none;border-radius:12px;padding:0 26px;font-weight:900;font-size:1em;cursor:pointer;background:#fff;color:var(--accent-deep)}
body.hc #qbtn{background:#ffd400;color:#000}

nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px}
.tab{
  border:none;background:none;padding:14px 18px;font-size:.95em;font-weight:700;color:var(--ink-2);
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
}
.tab.on{color:var(--accent-deep);border-bottom-color:var(--accent)}
body.hc .tab.on{color:#ffd400;border-bottom-color:#ffd400}

main{max-width:1180px;margin:0 auto;padding:26px 16px 70px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .n{font-size:1.7em;font-weight:900;color:var(--accent-deep);line-height:1.2}
.stat .l{font-size:.8em;color:var(--ink-2);margin-top:2px}

.h2{font-size:1.15em;font-weight:900;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--accent)}
.h2 .cnt{font-size:.75em;font-weight:700;color:var(--ink-3)}

.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hl{
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chg);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s;
}
.hl:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.hl .t{font-weight:700;font-size:.95em}
.hl .d{font-size:.82em;color:var(--ink-2);margin-top:5px}
.hl .p{font-size:.75em;color:var(--chg);font-weight:700;margin-top:7px}

.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.chcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;cursor:pointer;transition:transform .12s,box-shadow .15s;position:relative;overflow:hidden;
}
.chcard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.14)}
.chcard .no{
  display:inline-block;background:var(--accent-soft);color:var(--accent-deep);
  font-weight:900;font-size:.75em;border-radius:7px;padding:3px 10px;
}
body.hc .chcard .no{background:#000;border:1px solid #ffd400;color:#ffd400}
.chcard h3{margin:10px 0 4px;font-size:1.06em;font-weight:900;letter-spacing:-.01em}
.chcard .pg{font-size:.76em;color:var(--ink-3);font-weight:600}
.chcard ul{margin:10px 0 0;padding:0;list-style:none;font-size:.8em;color:var(--ink-2)}
.chcard li{padding:2.5px 0;border-top:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chcard li:first-child{border-top:none}

.chgtable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:.9em}
.chgtable th{background:var(--accent-soft);color:var(--accent-deep);text-align:left;padding:11px 14px;font-size:.85em}
body.hc .chgtable th{background:#1a1a1a;color:#ffd400}
.chgtable td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.chgtable .code{font-weight:900;color:var(--chg);white-space:nowrap}
.chgtable .nm{font-weight:700}
.gobtn{
  display:inline-block;border:1.5px solid var(--accent-line);background:var(--accent-soft);
  color:var(--accent-deep);border-radius:8px;padding:3px 10px;font-size:.82em;font-weight:700;
  cursor:pointer;margin:2px 4px 2px 0;text-decoration:none;
}
body.hc .gobtn{background:#000;color:#ffd400;border-color:#ffd400}
.notice{
  background:var(--chg-soft);border:1px solid #ecd9b0;border-radius:12px;
  padding:13px 17px;font-size:.86em;color:var(--ink-2);margin:14px 0 22px;
}
body.hc .notice{border-color:#ffbf47}

.reader{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.side{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px;position:sticky;top:64px;max-height:calc(100vh - 90px);overflow-y:auto;
}
.side .chh{
  width:100%;text-align:left;border:none;background:none;padding:10px 10px;font-weight:900;
  font-size:.93em;color:var(--ink);cursor:pointer;border-radius:9px;display:flex;justify-content:space-between;gap:6px;
}
.side .chh:hover{background:var(--accent-soft)}
.side .chh .ar{color:var(--ink-3);font-weight:400}
.side .secs{padding-left:6px}
.side .sec{
  width:100%;text-align:left;border:none;background:none;padding:7px 10px;font-size:.84em;
  color:var(--ink-2);cursor:pointer;border-radius:8px;display:block;line-height:1.4;
}
.side .sec:hover{background:var(--accent-soft)}
.side .sec.on{background:var(--accent);color:#fff;font-weight:700}
body.hc .side .sec.on{background:#ffd400;color:#000}
.side .sub{padding-left:26px;font-size:.8em}
.content{min-width:0}
.crumb{font-size:.82em;color:var(--ink-3);margin-bottom:6px}
.content h2.title{margin:0 0 4px;font-size:1.3em;font-weight:900;letter-spacing:-.01em}
.content .range{font-size:.83em;color:var(--ink-2);margin-bottom:16px}
.pageblock{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.pagehead{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--accent-soft);padding:6px 14px;font-size:.78em;font-weight:900;color:var(--accent-deep);
}
body.hc .pagehead{background:#1a1a1a;color:#ffd400}
.pdflink{
  margin-left:10px;font-weight:700;font-size:.95em;color:var(--accent-deep);
  text-decoration:none;border-bottom:1.5px solid var(--accent-line);
}
.pdflink:hover{border-bottom-color:var(--accent-deep)}
body.hc .pdflink{color:#ffd400;border-bottom-color:#ffd400}
.pageblock pre{
  margin:6px 0;padding:12px 14px;white-space:pre;overflow-x:auto;
  font-family:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  font-size:var(--fs-pre);line-height:1.62;color:var(--ink);
  background:color-mix(in srgb,var(--bg) 55%,var(--card));border-radius:8px;
}
.pagebody{padding:14px 18px}
.ln{line-height:1.72;margin:1px 0;padding-left:calc(var(--ind,0)*.52em);word-break:keep-all;overflow-wrap:break-word}
.ln.h1{
  font-size:1.16em;font-weight:900;color:var(--accent-deep);margin:16px 0 10px;
  background:var(--accent-soft);border-radius:10px;padding:9px 14px;
}
body.hc .ln.h1{background:#1a1a1a;color:#ffd400}
.ln.h2{font-size:1.07em;font-weight:900;margin:16px 0 6px;padding-left:0}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:1.55em;height:1.55em;border-radius:50%;background:var(--accent);
  color:#fff;font-size:.82em;font-weight:900;margin-right:.45em;vertical-align:.05em;
}
body.hc .badge{background:#ffd400;color:#000}
.ln.h3{font-weight:800;margin:11px 0 3px}
.ln.h4{font-weight:700;margin:7px 0 2px}
.ln.b1{margin-top:6px}
.ln.note{
  color:var(--ink-2);font-size:.88em;background:var(--chg-soft);
  border-radius:8px;padding:5px 10px;margin:5px 0;
}
.gap{height:.5em}

/* ── 하이브리드(HWPX) 모드: 진짜 표·쪽 칩 ── */
.htbl{border-collapse:collapse;margin:10px 0;font-size:.9em;width:100%;line-height:1.55}
.htbl td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;word-break:keep-all}
.htbl tr:first-child td{background:var(--accent-soft);font-weight:700;color:var(--accent-deep)}
body.hc .htbl tr:first-child td{background:#1a1a1a;color:#ffd400}
.tblwrap{overflow-x:auto}
.pchip{
  display:flex;align-items:center;gap:10px;margin:20px 0 10px;
  font-size:.76em;font-weight:900;color:var(--accent-deep);
}
.pchip::before,.pchip::after{content:"";height:1px;background:var(--line);flex:0 0 24px}
.pchip::after{flex:1}
.pchip .approx{font-weight:400;color:var(--ink-3)}
body.hc .pchip{color:#ffd400}
mark{background:var(--mark);border-radius:3px;padding:0 2px}
body.hc mark{color:#fff}
.secnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.secnav button{
  border:1.5px solid var(--accent-line);background:var(--card);color:var(--accent-deep);
  border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:.9em;max-width:48%;
}
.secnav button:hover{background:var(--accent-soft)}
body.hc .secnav button{color:#ffd400;border-color:#ffd400}

.sr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 17px;margin-bottom:11px;cursor:pointer}
.sr:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sr .loc{font-size:.78em;font-weight:900;color:var(--accent-deep)}
.sr .snip{font-size:.87em;color:var(--ink-2);margin-top:5px;line-height:1.6}
.rescount{font-size:.9em;color:var(--ink-2);margin:4px 0 16px}

footer{border-top:1px solid var(--line);background:var(--card);padding:22px 16px 34px;margin-top:30px}
.fwrap{max-width:1180px;margin:0 auto;font-size:.8em;color:var(--ink-3);line-height:1.8}

@media(max-width:840px){
  .reader{grid-template-columns:1fr}
  .side{position:static;max-height:260px}
  .htitle h1{font-size:1.2em}
}
@media print{header,nav,.side,.secnav,footer{display:none}}
</style>
</head>

. 사회복지법인 업무의 전자화<br>(변경) 사회복지시설정보시스템<\/td><td>Ⅳ. 사회복지법인 업무의 전자화<br>사회복지시설정보시스템 → 사회서비스정보시스템(희망이음)<\/td><td>p.79<\/td><\/tr><tr><td>Ⅴ. 사회복지법인 및 사회복지시설 재무 회계규칙<br>(추가･변경)<br><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>「기부금품의 모집 및 사용에 관한 법률」 질의 회신<br>&lt;행안부 민간협력과-1292(’23.11.17.)호&gt;<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">질의내용<br>- 사회복지사업법상 사회복지법인 및 사회복지시설의 운영자가 적극적 모금행위 없이 사회복지사업법에 따라 법인 또는 시설 운영을 위해 후원금을 수령할 경우 이에 대해 기부금품법상 모집자 등록, 모집계획 제출 등의 절차를 지켜야 하는지 여부<br>답변사항<br>-「기부금품의 모집 및 사용에 관한 법률」 제5조제2항에 따르면 “국가나 지방자치단체 및 그 소속 기관․공무원과 국가 또는 지방자치단체에서 출자․출연하여 설립된 법인․단체는 자발적으로 기탁하는 금품이라도 법령에 다른 규정이 있는 경우 외에는 이를 접수할 수 없다.”라고 규정되어 있습니다.<br>-따라서, 사회복지사업법상 사회복지법인 및 사회복지시설이 국가 또는 지방자치단체에서 출자․출연하여 설립된 단체 등이 아닌 경우, 적극적인 모집행위* 없이 자발적으로 기탁하는 금품을 접수할 시 「기부금품의 모집 및 사용에 관한 법률」 적용 대상이 아닐 것으로 판단됩니다.<br>*서신, 광고, 그 밖의 방법으로 기부금품의 출연을 타인에게 의뢰･권유 또는 요구하는 행위(「기부금품법」 제2조제3호)<\/td><\/tr><\/table><\/td><td>Ⅴ. 사회복지법인 및 사회복지시설 재무 회계규칙<br><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>「기부금품의 모집 및 사용에 관한 법률」 질의 회신<br>&lt;행안부 민간협력과-1292(’23.11.17.)호&gt;<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">질의내용<br>-사회복지사업법상 사회복지법인 및 사회복지시설의 운영자가 적극적 모금행위 없이 사회복지사업법에 따라 법인 또는 시설 운영을 위해 후원금을 수령할 경우 이에 대해 기부금품법상 모집자 등록, 모집계획 제출 등의 절차를 지켜야 하는지 여부<br>답변사항<br>-「기부금품의 모집 사용 및 기부문화 활성화에 관한 법률」 제5조제2항에 따르면 “국가나 지방자치단체 및 그 소속 기관․공무원과 국가 또는 지방자치단체에서 출자․출연하여 설립된 법인․단체는 자발적으로 기탁하는 금품이라도 법령에 다른 규정이 있는 경우 외에는 이를 접수할 수 없다.”라고 규정되어 있습니다.<br>-따라서, 사회복지사업법상 사회복지법인 및 사회복지시설이 국가 또는 지방자치단체에서 출자․출연하여 설립된 단체 등이 아닌 경우, 적극적인 모집행위* 없이 자발적으로 기탁된 금품을 접수하는 때에는 기부금품 모집･등록 관련 절차를 이행하지 않아도 될 것으로 판단됩니다.<br>*서신, 광고, 그 밖의 방법으로 기부금품의 출연을 타인에게 의뢰･권유 또는 요구하는 행위(「기부금품법」 제2조제3호)<br>-다만, 기부금품법 제4조에 따라 기부금품을 모집하려는 경우 등록청에 모집등록하여야 합니다<\/td><\/tr><\/table><\/td><td>p.140<\/td><\/tr><tr><td>6. 후원금의 관리<br>나. 후원금의 관리<br>4) 후원금의 용도 외 사용 금지<br>(추가･변경)<br><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>[비지정후원금의 사용 기준]<br>(생략)<br>자산취득비로 사용하는 것은 원칙적으로 금지하나, 토지･건물을 제외하고 시설 운영에 필요한 집기, 장비 등은 구입 가능<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/td><td>6. 후원금의 관리<br>나. 후원금의 관리<br>4) 후원금의 용도 외 사용 금지<br><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>[비지정후원금의 사용 기준]<br>(생략)<br>자산취득비로 사용하는 것은 원칙적으로 금지하나, 토지･건물을 제외하고 시설 운영에 필요한 집기, 장비 등은 구입 가능<br>※ 다만, 주무관청이 승인하는 경우에 한해 비지정 후원금으로 법인 사옥 마련을 위한 토지･건물 취득은 가능<br>※ 토지･건물은 부동산으로서 기본재산에 해당하므로, 비지정후원금으로 사옥 마련을 위한 토지･건물을 취득하고자 하는 경우 기본재산 처분허가 신청과 함께 비지정후원금 사용 승인여부도 주무관청에 문의하여야함<br>※ 주무관청은 토지･건물 구입 목적이 사옥 마련용인지, 회계 처리에 문제가 없는지 등을 확인하고, 승인 이후 정관상 기본재산으로 취득한 토지･건물을 등록하고 실제 사옥으로 사용하는지 등을 점검하여야 함. 법인은 추후 감사 시 지적을 받지 않도록 관련 자료, 이사회 의결서 등 증빙 자료를 정리･보관할 것을 권고<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/td><td>p.143<\/td><\/tr><tr><td rowspan=\"2\">[사회복지법인 Q&amp;A 모음]<br>(신설)<\/td><td rowspan=\"2\">[사회복지법인 Q&amp;A 모음]<br><table class=\"htbl\"><tr><td>Q&amp;A<\/td><td><\/td><td>법인 정관 변경시 원본 필수 제출 여부<\/td><\/tr><\/table><br>법인 정관 변경시 인장이 변경되지 않은 경우에도 반드시 정관의 원본을 제출해야 하나요?<br>인장 변경이 없이 다른 사유로 정관 개정을 할 경우 해당 페이지는 사본 첨부(제출) 가능합니다.<br><table class=\"htbl\"><tr><td>Q&amp;A<\/td><td><\/td><td>기본재산 처분 허가사유 해당 여부<\/td><\/tr><\/table><br>기본재산이 현금인 경우 금융상품 가입을 위해 주무관청의 허가를 받은 후 만기가 도래하여 원금 변경없이 재가입하는 경우에도 기본재산 처분 허가 사유에 해당하는지 여부<br>원금 변경없이 재가입하는 경우에는 기본재산 처분 허가 사유에 해당하지 않으며, 정관의 기본재산 목록 소재지에 정기예금 등으로 기재<\/td><td>p.52<\/td><\/tr><tr><td>p.57<\/td><\/tr><\/table><div class=\"ln p\">사회복지법인 일반<\/div><div class=\"ln p\">1. 사회복지법인의 법적 정의 및 종류<\/div><div class=\"ln p\">2. 사회복지법인 현황<\/div><div class=\"ln p\">제Ⅰ장<\/div>", "pages": [{"p": 1, "t": "2026년 사회복지법인 관리안내 주요 개정사항 _ 1\nⅠ\n사회복지법인 일반 _ 7\n1. 사회복지법인의 법적 정의 및 종류9\n2. 사회복지법인 현황11\nⅡ\n사회복지법인의 설립 _ 13\n1. 사회복지법인 설립절차의 개요15\n2. 사회복지법인 설립요건 16\n3. 사회복지법인의 기관26\nⅢ\n사회복지법인의 관리 _ 49\n1. 법인의 등기 관리51\n2. 정관변경의 인가53\n3. 기본재산 처분허가 등55\n4. 법인의 소멸(합병포함)64\n5. 법인의 관리･감독71\nⅣ\nⅤ\n｢사회복지법인 및 사회복지시설 재무･회계규칙｣ _ 125\n1. 총 칙125\n2. 예 산128\n3. 결 산135\n4. 회 계137\n5. 물 품140\n6. 후원금의 관리141\n7. 감사의 실시152\n〈붙임〉 「사회복지법인 및 사회복지시설 재무･회계규칙」(全文)154\n사회복지법인 Q&A 모음 _ 242\n관계법령 _ 261\n1. 「민법」263\n2. 「공익법인의 설립･운영에 관한 법률」273\n3. 「공익법인의 설립･운영에 관한 법률 시행령」280\n2026년 사회복지법인 관리안내 주요 개정사항"}, {"p": 5, "t": "2024년 | 2025년 | 비고\nⅠ. 사회복지법인 일반 가. 사회복지법인의 법적 정의 <참고> 사회복지사업의 범위(근거 :「사회복지사업법」 제2조) (추가･변경) <생략> * 「사회복지사업법 시행령」 제1조의2(사회복지사업 관련 법률) 「사회복지사업법」(이하 “법”이라 한다) 제2조제1호허목에서 “대통령령으로 정하는 법률”이란 「건강가정기본법」, 「북한이탈주민의 보호 및 정착지원에 관한 법률」, 「자살예방 및 생명존중문화 조성을 위한 법률」, 「장애인･노인 등을 위한 보조기기 지원 및 활용촉진에 관한 법률」을 말함 | Ⅰ. 사회복지법인 일반 가. 사회복지법인의 법적 정의 <참고> 사회복지사업의 범위(근거 :「사회복지사업법」 제2조) <생략> (28) 「스토킹방지 및 피해자보호 등에 관한 법률」, * 「사회복지사업법 시행령」 제1조의2(사회복지사업 관련 법률) 「사회복지사업법」(이하 “법”이라 한다) 제2조제1호허목에서 “대통령령으로 정하는 법률”이란 「건강가정기본법」, 「노인 일자리 및 사회활동 지원에 관한 법률」, 「북한이탈주민의 보호 및 정착지원에 관한 법률」, 「자살예방 및 생명존중문화 조성을 위한 법률」, 「장애인･노인 등을 위한 보조기기 지원 및 활용촉진에 관한 법률」, 「치매관리법」을 말함 | p.10\nⅡ. 사회복지법인의 설립 1. 사회복지법인 설립절차의 개요 (추가･변경) <표> * 발기인 전원이 인감 날인 | Ⅱ. 사회복지법인의 설립 1. 사회복지법인 설립절차의 개요 < 표 > * 발기인 전원이 인감 날인 ※ 본인서명사실확인서 또는 전자본인서명확인서 발급증을 제출하고 관련 서면에 서명을 한 경우 인감 날인한 것으로 봄(｢서명확인법｣ 제13조 제2항) | p.17\n1. 사회복지법인 설립절차의 개요 3. 사회복지법인의 기관 가. 이사회 4) 이사회의 소집 ◦ 이사회 소집이 가능한 경우 (추가･변경) ※ 이사회를 소집할 때에는 적어도 회의 7일전에 회의목적을 명시하여 각 이사에게 통지하여야함. | 1. 사회복지법인 설립절차의 개요 3. 사회복지법인의 기관 가. 이사회 4) 이사회의 소집 ◦ 이사회 소집이 가능한 경우 ※ 이사회를 소집할 때에는 적어도 회의 7일전에 회의목적을 명시하여 각 이사 및 감사에게 통지하여야함 | p.31\n나. 이사 1) 감사의 의의 및 자격 * 감사 선임당시법인(법인이 설치 운영하는 사회복지시설을 포함함)의 직적 3회계 연도의 세임금액(기본재산 및 출연금 제외) 평균이 30억원 이상인 법인은 감사 중 1명을 시도지사의 추천을 받아 「주신회사 등의외부감사에 관한 법률」에 따른 가사인에 속한사람(이하 ‘전문가 감사’)으로 선임해야함(법제18조제7항, 영제10조) (신설･추가) | 나. 이사 1) 감사의 의의 및 자격 * 감사 선임당시법인(법인이 설치 운영하는 사회복지시설을 포함함)의 직적 3회계 연도의 세임금액(기본재산 및 출연금 제외) 평균이 30억원 이상인 법인은 감사 중 1명을 시도지사의 추천을 받아 「주신회사 등의외부감사에 관한 법률」에 따른 가사인에 속한사람(이하 ‘전문가 감사’)으로 선임해야함(법제18조제7항, 영제10조) - 시도지사의 추천을 받아 선임한 외부감사의 임기가 만료된 외부감사를 연임하기 위해서는 반드시 최초 선임시와 동일한 추천절차를 거쳐야 함 | p.37\nⅣ. 사회복지법인 업무의 전자화 (변경) 사회복지시설정보시스템 | Ⅳ. 사회복지법인 업무의 전자화 사회복지시설정보시스템 → 사회서비스정보시스템(희망이음) | p.79\nⅤ. 사회복지법인 및 사회복지시설 재무 회계규칙 (추가･변경) 참고 | 「기부금품의 모집 및 사용에 관한 법률」 질의 회신 <행안부 민간협력과-1292(’23.11.17.)호>\n |  | \n |  | 질의내용 - 사회복지사업법상 사회복지법인 및 사회복지시설의 운영자가 적극적 모금행위 없이 사회복지사업법에 따라 법인 또는 시설 운영을 위해 후원금을 수령할 경우 이에 대해 기부금품법상 모집자 등록, 모집계획 제출 등의 절차를 지켜야 하는지 여부 답변사항 -「기부금품의 모집 및 사용에 관한 법률」 제5조제2항에 따르면 “국가나 지방자치단체 및 그 소속 기관․공무원과 국가 또는 지방자치단체에서 출자․출연하여 설립된 법인․단체는 자발적으로 기탁하는 금품이라도 법령에 다른 규정이 있는 경우 외에는 이를 접수할 수 없다.”라고 규정되어 있습니다. -따라서, 사회복지사업법상 사회복지법인 및 사회복지시설이 국가 또는 지방자치단체에서 출자․출연하여 설립된 단체 등이 아닌 경우, 적극적인 모집행위* 없이 자발적으로 기탁하는 금품을 접수할 시 「기부금품의 모집 및 사용에 관한 법률」 적용 대상이 아닐 것으로 판단됩니다. *서신, 광고, 그 밖의 방법으로 기부금품의 출연을 타인에게 의뢰･권유 또는 요구하는 행위(「기부금품법」 제2조제3호) | Ⅴ. 사회복지법인 및 사회복지시설 재무 회계규칙 참고 | 「기부금품의 모집 및 사용에 관한 법률」 질의 회신 <행안부 민간협력과-1292(’23.11.17.)호>\n |  | \n |  | 질의내용 -사회복지사업법상 사회복지법인 및 사회복지시설의 운영자가 적극적 모금행위 없이 사회복지사업법에 따라 법인 또는 시설 운영을 위해 후원금을 수령할 경우 이에 대해 기부금품법상 모집자 등록, 모집계획 제출 등의 절차를 지켜야 하는지 여부 답변사항 -「기부금품의 모집 사용 및 기부문화 활성화에 관한 법률」 제5조제2항에 따르면 “국가나 지방자치단체 및 그 소속 기관․공무원과 국가 또는 지방자치단체에서 출자․출연하여 설립된 법인․단체는 자발적으로 기탁하는 금품이라도 법령에 다른 규정이 있는 경우 외에는 이를 접수할 수 없다.”라고 규정되어 있습니다. -따라서, 사회복지사업법상 사회복지법인 및 사회복지시설이 국가 또는 지방자치단체에서 출자․출연하여 설립된 단체 등이 아닌 경우, 적극적인 모집행위* 없이 자발적으로 기탁된 금품을 접수하는 때에는 기부금품 모집･등록 관련 절차를 이행하지 않아도 될 것으로 판단됩니다. *서신, 광고, 그 밖의 방법으로 기부금품의 출연을 타인에게 의뢰･권유 또는 요구하는 행위(「기부금품법」 제2조제3호) -다만, 기부금품법 제4조에 따라 기부금품을 모집하려는 경우 등록청에 모집등록하여야 합니다 | p.140\n6. 후원금의 관리 나. 후원금의 관리 4) 후원금의 용도 외 사용 금지 (추가･변경)  |  | \n | [비지정후원금의 사용 기준] (생략) 자산취득비로 사용하는 것은 원칙적으로 금지하나, 토지･건물을 제외하고 시설 운영에 필요한 집기, 장비 등은 구입 가능 | \n |  |  | 6. 후원금의 관리 나. 후원금의 관리 4) 후원금의 용도 외 사용 금지  |  | \n | [비지정후원금의 사용 기준] (생략) 자산취득비로 사용하는 것은 원칙적으로 금지하나, 토지･건물을 제외하고 시설 운영에 필요한 집기, 장비 등은 구입 가능 ※ 다만, 주무관청이 승인하는 경우에 한해 비지정 후원금으로 법인 사옥 마련을 위한 토지･건물 취득은 가능 ※ 토지･건물은 부동산으로서 기본재산에 해당하므로, 비지정후원금으로 사옥 마련을 위한 토지･건물을 취득하고자 하는 경우 기본재산 처분허가 신청과 함께 비지정후원금 사용 승인여부도 주무관청에 문의하여야함 ※ 주무관청은 토지･건물 구입 목적이 사옥 마련용인지, 회계 처리에 문제가 없는지 등을 확인하고, 승인 이후 정관상 기본재산으로 취득한 토지･건물을 등록하고 실제 사옥으로 사용하는지 등을 점검하여야 함. 법인은 추후 감사 시 지적을 받지 않도록 관련 자료, 이사회 의결서 등 증빙 자료를 정리･보관할 것을 권고 | \n |  |  | p.143\n[사회복지법인 Q&A 모음] (신설) | [사회복지법인 Q&A 모음] Q&A |  | 법인 정관 변경시 원본 필수 제출 여부 법인 정관 변경시 인장이 변경되지 않은 경우에도 반드시 정관의 원본을 제출해야 하나요? 인장 변경이 없이 다른 사유로 정관 개정을 할 경우 해당 페이지는 사본 첨부(제출) 가능합니다. Q&A |  | 기본재산 처분 허가사유 해당 여부 기본재산이 현금인 경우 금융상품 가입을 위해 주무관청의 허가를 받은 후 만기가 도래하여 원금 변경없이 재가입하는 경우에도 기본재산 처분 허가 사유에 해당하는지 여부 원금 변경없이 재가입하는 경우에는 기본재산 처분 허가 사유에 해당하지 않으며, 정관의 기본재산 목록 소재지에 정기예금 등으로 기재 | p.52\np.57\n사회복지법인 일반\n1. 사회복지법인의 법적 정의 및 종류\n2. 사회복지법인 현황\n제Ⅰ장"}]}]}, {"no": 2, "title": "사회복지법인 일반", "start": 7, "end": 12, "sections": [{"title": "1. 사회복지법인의 법적 정의 및 종류", "start": 9, "end": 10, "html": "<div class=\"pchip\" id=\"p9\"><span>원문 9쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=15\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>사회복지법인의 법적 정의 및 종류<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회복지법인의 법적정의<\/div><div class=\"ln p\">사회복지법인이란 「사회복지사업법」 제2조의 “사회복지사업”을 행할 목적으로 설립된 법인을 의미함<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>사회복지법인이 수행할 수 있는 사업의 범위<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">법인은 법률의 규정에 의해서만 성립되므로(「민법」 제31조), 사회복지법인도 「사회복지사업법」에 따라서만 성립됨<br>「사회복지사업법」 제32조에 따라서 준용되는 「민법」 제34조에서는 “법인은 법률의 규정에 좇아 정관으로 정한 목적의 범위내에서 권리와 의무의 주체가 된다.”라고 규정하고 있음<br>-따라서 사회복지법인은 「사회복지사업법」 제2조제3호에 따르면 사회복지사업을 수행하기 위해 설립되는 법인이므로, 「사회복지사업법」 제2조제1호 각 목의 법률에 따른 사업과 이와 관련된 사업을 그 정관에 목적사업으로 명시한 경우에 한해, 해당 사업을 수행할 수 있는 권리능력이 있음<br>-다만, 「사회복지사업법」 제28조에 따른 수익사업과 「사회복지사업법」이 아닌 기타 법률에서 사회복지법인이 수행할 수 있다고 명시한 경우(예: 「건강가정기본법 시행규칙」 제6조에 따른 건강가정지원센터의 위탁운영 등)에는 「민법」 제34조에서 규정하고 있는 바와 같이 “법률에 규정을 좇아” 수행할 수 있는 사업이라고 할 수 있으므로, 해당 사업을 정관에 명시하여 주무관청의 인가를 받으면 그 사업을 수행할 수 있음<\/td><\/tr><\/table><div class=\"ln p\">-따라서 사회복지법인이 수행할 수 있는 목적사업은 “사회복지사업”에 한정되므로. 사회복지사업 이외의 사업을 목적사업으로 수행할 수 없음에 유의<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>사회복지사업의 범위 (근거 : 「사회복지사업법」 제2조)<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">「사회복지사업법」 제2조제1호에 규정된 개별법령*에 의한 “보호･선도 또는 복지에 관한 사업”과 “사회복지상담･직업지원･무료 숙박･지역사회복지･의료복지･재가복지･사회복지관 운영･정신질환자 및 한센병력자 사회복귀에 관한 사업” 등 각종 복지사업과 이와 관련된 “자원봉사활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업”을 말함<br>① 「국민기초생활보장법」 ② 「아동복지법」 ③ 「노인복지법」 ④ 「장애인복지법」 ⑤ 「한부모가족지원법」 ⑥ 「영유아보육법」 ⑦ 「성매매방지 및 피해자보호 등에 관한 법률」 ⑧ 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 ⑨ 「성폭력 방지 및 피해자 보호 등에 관한 법률」 ⑩ 「입양특례법」 ⑪ 「일제하 일본군위안부 피해자에 대한 생활안정지원 및 기념사업 등에 관한 법률」 ⑫ 「사회복지공동모금회법」 ⑬ 「장애인･노인･임산부 등의 편의증진보장에 관한 법률」 ⑭ 「가정폭력방지 및 피해자보호 등에 관한 법률」 ⑮ 「농어촌주민의 보건복지증진을 위한 특별법」 ⑯ 「식품등 기부 활성화에 관한 법률」 ⑰ 「의료급여법」  「기초연금법」  「긴급복지지원법」  「다문화가족지원법」 ㉑ 「장애인연금법」 ㉒ 「장애인활동 지원에 관한 법률」 ㉓ 「노숙인 등의 복지 및 자립지원에 관한 법률」 ㉔ 「보호관찰 등에 관한 법률」 ㉕ 「장애아동복지지원법」  「발달장애인 권리보장 및 지원에 관한 법률」  「청소년복지 지원법」  「스토킹방지 및 피해자보호 등에 관한 법률」, (29) 그 밖의 대통령령으로 정하는 법률*<br>*「사회복지사업법 시행령」 제1조의2((사회복지사업 관련 법률) 「사회복지사업법」(이하 “법”이라 한다) 제2조제1호허목에서 “대통령령으로 정하는 법률”이란 「건강가정기본법」, 「노인 일자리 및 사회활동 지원에 관한 법률」, 북한이탈주민의 보호 및 정착지원에 관한 법률」, 「자살예방 및 생명존중문화 조성을 위한 법률」, 「장애인･노인 등을 위한 보조기기 지원 및 활용촉진에 관한 법률」,「치매관리법」을 말함<\/td><\/tr><\/table><div class=\"pchip\" id=\"p10\"><span>원문 10쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=16\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">사회복지법인의 종류<\/div><div class=\"ln h4\">1) 사회복지시설을 설치･운영하는 법인(시설법인)<\/div><div class=\"ln p\">-「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치･운영할 목적으로 설립된 사회복지법인<\/div><div class=\"ln h4\">2) 사회복지사업을 지원하는 법인(지원법인)<\/div><div class=\"ln p\">-시설의 설치･운영을 목적으로 하지 않고 사회복지사업을 지원할 목적으로만 설립된 사회복지법인<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>시설법인 및 지원법인간 전환<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">시설법인이 지원법인이 되거나, 지원법인이 시설법인이 되는 것은 사업변경(추가)에 대한 정관변경 절차를 통해 가능<br>다만, 이 경우 출연자의 의도, 사업계획서, 재원확보 여부 등을 면밀히 검토해야 함(p.54 ‘정관변경의 인가’ 참고)<\/td><\/tr><\/table>", "pages": [{"p": 9, "t": "1\n사회복지법인의 법적 정의 및 종류\n가\n사회복지법인의 법적정의\n사회복지법인이란 「사회복지사업법」 제2조의 “사회복지사업”을 행할 목적으로 설립된 법인을 의미함\n참고 | 사회복지법인이 수행할 수 있는 사업의 범위\n |  | \n |  | 법인은 법률의 규정에 의해서만 성립되므로(「민법」 제31조), 사회복지법인도 「사회복지사업법」에 따라서만 성립됨 「사회복지사업법」 제32조에 따라서 준용되는 「민법」 제34조에서는 “법인은 법률의 규정에 좇아 정관으로 정한 목적의 범위내에서 권리와 의무의 주체가 된다.”라고 규정하고 있음 -따라서 사회복지법인은 「사회복지사업법」 제2조제3호에 따르면 사회복지사업을 수행하기 위해 설립되는 법인이므로, 「사회복지사업법」 제2조제1호 각 목의 법률에 따른 사업과 이와 관련된 사업을 그 정관에 목적사업으로 명시한 경우에 한해, 해당 사업을 수행할 수 있는 권리능력이 있음 -다만, 「사회복지사업법」 제28조에 따른 수익사업과 「사회복지사업법」이 아닌 기타 법률에서 사회복지법인이 수행할 수 있다고 명시한 경우(예: 「건강가정기본법 시행규칙」 제6조에 따른 건강가정지원센터의 위탁운영 등)에는 「민법」 제34조에서 규정하고 있는 바와 같이 “법률에 규정을 좇아” 수행할 수 있는 사업이라고 할 수 있으므로, 해당 사업을 정관에 명시하여 주무관청의 인가를 받으면 그 사업을 수행할 수 있음\n-따라서 사회복지법인이 수행할 수 있는 목적사업은 “사회복지사업”에 한정되므로. 사회복지사업 이외의 사업을 목적사업으로 수행할 수 없음에 유의\n참고 | 사회복지사업의 범위 (근거 : 「사회복지사업법」 제2조)\n |  | \n |  | 「사회복지사업법」 제2조제1호에 규정된 개별법령*에 의한 “보호･선도 또는 복지에 관한 사업”과 “사회복지상담･직업지원･무료 숙박･지역사회복지･의료복지･재가복지･사회복지관 운영･정신질환자 및 한센병력자 사회복귀에 관한 사업” 등 각종 복지사업과 이와 관련된 “자원봉사활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업”을 말함 ① 「국민기초생활보장법」 ② 「아동복지법」 ③ 「노인복지법」 ④ 「장애인복지법」 ⑤ 「한부모가족지원법」 ⑥ 「영유아보육법」 ⑦ 「성매매방지 및 피해자보호 등에 관한 법률」 ⑧ 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 ⑨ 「성폭력 방지 및 피해자 보호 등에 관한 법률」 ⑩ 「입양특례법」 ⑪ 「일제하 일본군위안부 피해자에 대한 생활안정지원 및 기념사업 등에 관한 법률」 ⑫ 「사회복지공동모금회법」 ⑬ 「장애인･노인･임산부 등의 편의증진보장에 관한 법률」 ⑭ 「가정폭력방지 및 피해자보호 등에 관한 법률」 ⑮ 「농어촌주민의 보건복지증진을 위한 특별법」 ⑯ 「식품등 기부 활성화에 관한 법률」 ⑰ 「의료급여법」  「기초연금법」  「긴급복지지원법」  「다문화가족지원법」 ㉑ 「장애인연금법」 ㉒ 「장애인활동 지원에 관한 법률」 ㉓ 「노숙인 등의 복지 및 자립지원에 관한 법률」 ㉔ 「보호관찰 등에 관한 법률」 ㉕ 「장애아동복지지원법」  「발달장애인 권리보장 및 지원에 관한 법률」  「청소년복지 지원법」  「스토킹방지 및 피해자보호 등에 관한 법률」, (29) 그 밖의 대통령령으로 정하는 법률* *「사회복지사업법 시행령」 제1조의2((사회복지사업 관련 법률) 「사회복지사업법」(이하 “법”이라 한다) 제2조제1호허목에서 “대통령령으로 정하는 법률”이란 「건강가정기본법」, 「노인 일자리 및 사회활동 지원에 관한 법률」, 북한이탈주민의 보호 및 정착지원에 관한 법률」, 「자살예방 및 생명존중문화 조성을 위한 법률」, 「장애인･노인 등을 위한 보조기기 지원 및 활용촉진에 관한 법률」,「치매관리법」을 말함"}, {"p": 10, "t": "나\n사회복지법인의 종류\n1) 사회복지시설을 설치･운영하는 법인(시설법인)\n-「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치･운영할 목적으로 설립된 사회복지법인\n2) 사회복지사업을 지원하는 법인(지원법인)\n-시설의 설치･운영을 목적으로 하지 않고 사회복지사업을 지원할 목적으로만 설립된 사회복지법인\n참고 | 시설법인 및 지원법인간 전환\n |  | \n |  | 시설법인이 지원법인이 되거나, 지원법인이 시설법인이 되는 것은 사업변경(추가)에 대한 정관변경 절차를 통해 가능 다만, 이 경우 출연자의 의도, 사업계획서, 재원확보 여부 등을 면밀히 검토해야 함(p.54 ‘정관변경의 인가’ 참고)"}]}, {"title": "2. 사회복지법인 현황", "start": 11, "end": 12, "html": "<div class=\"pchip\" id=\"p11\"><span>원문 11쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=17\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회복지법인 현황<\/div><div class=\"ln p\">(단위：개소)<\/div><table class=\"htbl\"><tr><td>구분<\/td><td>합계<\/td><td>시설법인<\/td><td>지원법인<\/td><\/tr><tr><td>전국<\/td><td>3,034<\/td><td>2,733<\/td><td>301<\/td><\/tr><tr><td>서울<\/td><td>311<\/td><td>217<\/td><td>94<\/td><\/tr><tr><td>부산<\/td><td>227<\/td><td>212<\/td><td>15<\/td><\/tr><tr><td>대구<\/td><td>187<\/td><td>180<\/td><td>7<\/td><\/tr><tr><td>인천<\/td><td>50<\/td><td>44<\/td><td>6<\/td><\/tr><tr><td>광주<\/td><td>146<\/td><td>142<\/td><td>4<\/td><\/tr><tr><td>대전<\/td><td>97<\/td><td>91<\/td><td>6<\/td><\/tr><tr><td>울산<\/td><td>51<\/td><td>48<\/td><td>3<\/td><\/tr><tr><td>세종<\/td><td>20<\/td><td>19<\/td><td>1<\/td><\/tr><tr><td>경기<\/td><td>282<\/td><td>236<\/td><td>46<\/td><\/tr><tr><td>강원<\/td><td>192<\/td><td>170<\/td><td>22<\/td><\/tr><tr><td>충북<\/td><td>164<\/td><td>146<\/td><td>18<\/td><\/tr><\/table><table class=\"htbl\"><tr><td>구분<\/td><td>합계<\/td><td>시설법인<\/td><td>지원법인<\/td><\/tr><tr><td>충남<\/td><td>235<\/td><td>217<\/td><td>18<\/td><\/tr><tr><td>전북<\/td><td>231<\/td><td>220<\/td><td>11<\/td><\/tr><tr><td>전남<\/td><td>241<\/td><td>227<\/td><td>14<\/td><\/tr><tr><td>경북<\/td><td>208<\/td><td>198<\/td><td>10<\/td><\/tr><tr><td>경남<\/td><td>281<\/td><td>256<\/td><td>25<\/td><\/tr><tr><td>제주<\/td><td>111<\/td><td>110<\/td><td>1<\/td><\/tr><\/table><div class=\"ln p\">1. 시설법인：사회복지시설을 설치･운영할 목적으로 설립된 사회복지법인<\/div><div class=\"ln p\">2. 지원법인：시설의 설치･운영을 목적으로 하지 않고 사회복지사업을 지원할 목적으로 설립된 법인<\/div><div class=\"ln p\">[출처] 각 시･도 제출자료 기준(’25년 6월 기준, ’25년 조사자료)<\/div><div class=\"ln p\">사회복지법인의 설립<\/div><div class=\"ln p\">1. 사회복지법인 설립절차의 개요<\/div><div class=\"ln p\">2. 사회복지법인 설립요건<\/div><div class=\"ln p\">3. 사회복지법인의 기관<\/div><div class=\"ln p\">제Ⅱ장<\/div>", "pages": [{"p": 11, "t": "2\n사회복지법인 현황\n(단위：개소)\n구분 | 합계 | 시설법인 | 지원법인\n전국 | 3,034 | 2,733 | 301\n서울 | 311 | 217 | 94\n부산 | 227 | 212 | 15\n대구 | 187 | 180 | 7\n인천 | 50 | 44 | 6\n광주 | 146 | 142 | 4\n대전 | 97 | 91 | 6\n울산 | 51 | 48 | 3\n세종 | 20 | 19 | 1\n경기 | 282 | 236 | 46\n강원 | 192 | 170 | 22\n충북 | 164 | 146 | 18\n구분 | 합계 | 시설법인 | 지원법인\n충남 | 235 | 217 | 18\n전북 | 231 | 220 | 11\n전남 | 241 | 227 | 14\n경북 | 208 | 198 | 10\n경남 | 281 | 256 | 25\n제주 | 111 | 110 | 1\n1. 시설법인：사회복지시설을 설치･운영할 목적으로 설립된 사회복지법인\n2. 지원법인：시설의 설치･운영을 목적으로 하지 않고 사회복지사업을 지원할 목적으로 설립된 법인\n[출처] 각 시･도 제출자료 기준(’25년 6월 기준, ’25년 조사자료)\n사회복지법인의 설립\n1. 사회복지법인 설립절차의 개요\n2. 사회복지법인 설립요건\n3. 사회복지법인의 기관\n제Ⅱ장"}]}]}, {"no": 3, "title": "사회복지법인의 설립", "start": 13, "end": 46, "sections": [{"title": "1. 사회복지법인 설립절차의 개요", "start": 15, "end": 15, "html": "<div class=\"pchip\" id=\"p15\"><span>원문 15쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=21\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>사회복지법인 설립절차의 개요<\/div><div class=\"ln p\">1 단계<\/div><div class=\"ln p\">신청인의 법인설립 신청 (신청인 ➝ 시･군･구)<\/div><div class=\"ln p\">◇ 조치사항<\/div><div class=\"ln p\">▶사회복지법인을 설립하고자 하는 자는 「사회복지사업법 시행규칙」 제7조에 규정되어 있는 사회복지법인 설립허가 신청서와 기타 구비서류를 완비하여 시･군･구에 제출<\/div><div class=\"ln p\">◇ 참고사항<\/div><div class=\"ln p\">시･도 및 시･군･구는 신청인이 신청서 제출전 법인 주사무소가 소재할 시･도 및 시･군･구와 법인설립 필요성 등에 대해 충분하게 협의하여 추후 절차가 원만하게 수행되도록 지도 시･도 및 시･군･구는 사회복지법인에 출연한 재산은 더 이상 출연자 개인의 재산이 아니고, 설립 후 해당 재산을 돌려받을 수 없음을 명확히 안내할 것(「사회복지사업법」 제27조에 따라 국가 또는 지자체 귀속)<\/div><div class=\"ln p\">2 단계<\/div><div class=\"ln p\">검토의견 등 첨부하여 시･도 제출(시･군･구 ➝ 시･도)<\/div><div class=\"ln p\">◇ 조치사항<\/div><div class=\"ln p\">▶시･군･구는 설립허가를 신청한 법인에 대한 기초자료(예) 자산에 관한 실지조사 결과, 법인설립 필요성에 관한 검토의견서 등)를 첨부하여 시･도에 신청서를 제출<\/div><div class=\"ln p\">◇ 참고사항<\/div><div class=\"ln p\">신청서를 접수한 시･군･구는 해당 법인이 소재할 사무소 및 기본재산 등을 직접 엄격하게 확인할 것(필요시 방문) 시･도에서 조례 및 규칙 등으로 법인업무와 관련한 시･군･구의 권한 및 위임사항을 정하였을 경우 그에 따르되 법인의 허가 등 법인관리 업무의 중요사항은 반드시 시･도지사가 행할 것<\/div><div class=\"ln p\">3 단계<\/div><div class=\"ln p\">시･도에서 최종 허가여부 결정<\/div><div class=\"ln p\">◇ 조치사항<\/div><div class=\"ln p\">▶시･도는 법인설립 신청서와 시･군･구의 기초자료, 시･도의 복지여건 등을 종합적으로 검토하여 법인설립허가 최종 결정 ※ 설립허가 시 사회복지법인은 의료기관을 운영할 수 없음을 설립허가조건으로 명확히 기재할 것(246쪽 참고) ▶설립허가 신청서 처리기한：17일 ※주무관청에서 신청서의 보완을 요청한 경우 보완기간은 처리기한에 산입하지 않으며, 신청서를 반려한 경우 처리기한은 종료되고 재접수 시점부터 다시 기산하는 것을 원칙으로 함 (「행정절차법 시행령」 제11조제1호)<\/div><div class=\"ln p\">◇ 참고사항<\/div><div class=\"ln p\">법인허가시 법인의 목적사업에 해당하는 기본재산을 갖추었는지 여부를 엄격하게 심사할 것 목적사업이 2 이상의 시･도에 걸쳐있는 법인에 대해서는 관련 시･도의 의견을 충분히 수렴한 후 결정<\/div>", "pages": [{"p": 15, "t": "1\n사회복지법인 설립절차의 개요\n1 단계\n신청인의 법인설립 신청 (신청인 ➝ 시･군･구)\n◇ 조치사항\n▶사회복지법인을 설립하고자 하는 자는 「사회복지사업법 시행규칙」 제7조에 규정되어 있는 사회복지법인 설립허가 신청서와 기타 구비서류를 완비하여 시･군･구에 제출\n◇ 참고사항\n시･도 및 시･군･구는 신청인이 신청서 제출전 법인 주사무소가 소재할 시･도 및 시･군･구와 법인설립 필요성 등에 대해 충분하게 협의하여 추후 절차가 원만하게 수행되도록 지도 시･도 및 시･군･구는 사회복지법인에 출연한 재산은 더 이상 출연자 개인의 재산이 아니고, 설립 후 해당 재산을 돌려받을 수 없음을 명확히 안내할 것(「사회복지사업법」 제27조에 따라 국가 또는 지자체 귀속)\n2 단계\n검토의견 등 첨부하여 시･도 제출(시･군･구 ➝ 시･도)\n◇ 조치사항\n▶시･군･구는 설립허가를 신청한 법인에 대한 기초자료(예) 자산에 관한 실지조사 결과, 법인설립 필요성에 관한 검토의견서 등)를 첨부하여 시･도에 신청서를 제출\n◇ 참고사항\n신청서를 접수한 시･군･구는 해당 법인이 소재할 사무소 및 기본재산 등을 직접 엄격하게 확인할 것(필요시 방문) 시･도에서 조례 및 규칙 등으로 법인업무와 관련한 시･군･구의 권한 및 위임사항을 정하였을 경우 그에 따르되 법인의 허가 등 법인관리 업무의 중요사항은 반드시 시･도지사가 행할 것\n3 단계\n시･도에서 최종 허가여부 결정\n◇ 조치사항\n▶시･도는 법인설립 신청서와 시･군･구의 기초자료, 시･도의 복지여건 등을 종합적으로 검토하여 법인설립허가 최종 결정 ※ 설립허가 시 사회복지법인은 의료기관을 운영할 수 없음을 설립허가조건으로 명확히 기재할 것(246쪽 참고) ▶설립허가 신청서 처리기한：17일 ※주무관청에서 신청서의 보완을 요청한 경우 보완기간은 처리기한에 산입하지 않으며, 신청서를 반려한 경우 처리기한은 종료되고 재접수 시점부터 다시 기산하는 것을 원칙으로 함 (「행정절차법 시행령」 제11조제1호)\n◇ 참고사항\n법인허가시 법인의 목적사업에 해당하는 기본재산을 갖추었는지 여부를 엄격하게 심사할 것 목적사업이 2 이상의 시･도에 걸쳐있는 법인에 대해서는 관련 시･도의 의견을 충분히 수렴한 후 결정"}]}, {"title": "2. 사회복지법인 설립요건", "start": 16, "end": 24, "html": "<div class=\"pchip\" id=\"p16\"><span>원문 16쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=22\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회복지법인 설립요건<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">설립자의 설립허가 신청(법 제16조, 영 제8조, 규칙 제7조)<\/div><div class=\"ln p\">사회복지법인을 설립하고자 하는 자는 사회복지법인 설립허가신청서 등 관련서류를 주된 사무소를 관할하는 시･군･구청장을 거쳐 시･도지사에게 제출하여야 함<\/div><div class=\"pchip\" id=\"p17\"><span>원문 17쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=23\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>양  식<\/td><td>내      용<\/td><td>비 고<\/td><\/tr><tr><td>설립허가 신청서<\/td><td><\/td><td>붙임 2<\/td><\/tr><tr><td>설립취지서<\/td><td>법인설립 취지를 6하원칙에 의해 기재<\/td><td>붙임 3<\/td><\/tr><tr><td>발기인 총회 회의록<\/td><td>회의록에는 재산출연사항, 임원선출, 정관의 심의의결, 사업 계획 및 수지예산 등에 관한 의결사항을 포함하며, 발기인 전원이 인감 날인<\/td><td>붙임 4<\/td><\/tr><tr><td>설립 발기인 명단<\/td><td>직위, 성명, 주민등록번호, 주소 및 약력 등을 간략하게 기재<\/td><td>붙임 5<\/td><\/tr><tr><td>정관<\/td><td>법 제17조 정관기재사항은 반드시 기재하고, 기타 관련법규에 어긋남이 없도록 하며, 발기인 전원이 기명 인감날인<\/td><td>붙임 6<\/td><\/tr><tr><td>기본재산목록<\/td><td><\/td><td>붙임 7<\/td><\/tr><tr><td>임원명단<\/td><td><\/td><td>붙임 8<\/td><\/tr><tr><td>법인이 사용할 인장<\/td><td><\/td><td>붙임 9<\/td><\/tr><tr><td>재산출연증서<\/td><td>출연재산의 구체적 내용과(소재지, 지목, 지적, 평가가액 등) 출연인의 인적사항, 출연일자 기재 후 인감날인<br>주식, 예금 등의 출연행위에 대하여는 공증인의 공증 필요<\/td><td>붙임 10<\/td><\/tr><tr><td>재산 소유 증명 서류<\/td><td>부동산 등기부등본, 주식의 주주명부사본, 현금의 경우 예금 잔고증명, 유가증권의 사본, 각종 무체재산권의 등록필증 사본 등 첨부<br>「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 소유권에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음<\/td><td><\/td><\/tr><tr><td>재산의 평가조서<\/td><td>기본재산과 보통재산으로 구분<br>기본재산은 목적사업용과 수익용으로 구분하여 평가 가액을 일목요연하게 파악할 수 있도록 작성<br>부동산은 「감정평가 및 감정평가사에 관한 법률」에 의한 감정평가법인의 감정평가서 또는 표준지의 공시지가를 기준으로 산정한 지가확인서 첨부<br>예금 등은 그 현재액을 증명할 수 있는 잔고증명서 기타 각종 재산을 평가할 수 있는 증빙서류 첨부<br>개별공시지가 확인서로 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음<\/td><td><\/td><\/tr><tr><td>재산의 수익조서<\/td><td>수익용 기본재산을 갖춘 경우에 한하며 수익을 파악할 수 있도록 작성하고 수익산출 근거를 명시<br>수익을 증명할 수 있는 기관이 발행하는 증빙서류(수익확인서, 배당이익증명서, 이자수익확인서, 납세필증 등) 첨부<\/td><td><\/td><\/tr><tr><td>임원의 취임승낙서 및 이력서<\/td><td>임원취임자의 취임승낙의사 표시와 인적사항(주소, 성명, 주민 등록번호, 주요경력 등) 기재<br>이사 및 감사 등의 직위와 취임기간을 명시하고 인감날인<br>이력서 첨부<\/td><td>붙임 11<br>붙임 12<\/td><\/tr><tr><td>이사추천서<\/td><td>법 제18조제2항 각 호의 어느 하나에 해당하는 기관으로부터 받은 이사추천서 1부<br>※위 기관이 법인이 성립되지 않았음을 사유로 추천을 하지 않을 경우 외부추천이사 추천요청공문으로 갈음 가능<br>※이 경우 지자체가 법인설립을 허가할 때 “법인설립허가 후 법인설립 등기 전 기간에 반드시 추천을 받아, 이사를 선임하고 그 결과를 지체없이 보고할 것” 이라는 취지의 부관을 붙일 것<\/td><td><\/td><\/tr><tr><td>특수관계 부존재 각서<\/td><td>법 제18조제2항의 규정(특별한 관계에 있는 자)에 저촉되지 않음을 입증하는 각서 1부<\/td><td>붙임 13<\/td><\/tr><tr><td>결격사유 부존재 각서<\/td><td>법 제19조제1항의 규정(임원의 결격사유)에 저촉되지 않음을 입증하는 각서 1부(’19.6.12.시행)<\/td><td>붙임 14<\/td><\/tr><tr><td>사업계획서 및 예산서<\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln p\">구비서류(양식은 p.90 이하 붙임자료 참고)<\/div><div class=\"ln p\">* (인감날인) 본인서명사실확인서 또는 전자본인서명확인서 발금증를 제출하고 관련 서면에 서명을 한 경우에는 인감증명서를 제출하고 관련 서면에 인감을 날인한 것으로 봄(「본인서명사실 확인 등에 관한 법률」 제13조제2항)<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">목적의 비영리성<\/div><div class=\"ln p\">사회복지법인은 반드시 「사회복지사업법」 제2조의 “사회복지사업”을 수행할 목적으로 설립되어야 하며<\/div><div class=\"ln p\">-사회복지사업을 수행함에 있어 이윤추구를 위한 영리목적이 아닌 사회복지라는 비영리목적을 위해 존재해야 함<\/div><div class=\"pchip\" id=\"p18\"><span>원문 18쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=24\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※비영리사업의 목적을 달성하기 위해 필요한 한도에서 비영리사업의 본질에 반하지 않을 정도의 수익사업을 하는 것은 가능하나, 수익사업으로 인한 수익은 언제나 목적사업의 수행에 충당되어야 함<\/div><div class=\"ln p\">예)유료시설에서 생활비를 받는 경우, 운영비 보조를 위해 일정 수익사업을 하는 경우 등은 가능하나 이로 인한 수익은 시설기능보강, 운영비보조, 생활자 복지수준 향상 등을 위해 사용해야 함<\/div><div class=\"ln note\">※「사회복지사업법」 제28조에서는 “법인은 목적사업의 경비에 충당하기 위하여 필요한 때에는 법인의 설립목적 수행에 지장이 없는 범위 안에서 수익사업을 할 수 있다”고 규정하고 있는바, 그 수익사업의 범위 및 종류에 대해서는 주무관청에서 개별사안별로 비영리법인 본질 위배 여부, 법인 설립목적 달성을 위한 법인 내 인적, 물적 상황 등 제반여건을 충분히 고려하여 판단하여야 함<\/div><div class=\"ln p\">사회복지법인을 설립하고자 하는 자는 수행하고자 하는 목적사업을 구체적으로 확정하여 신청해야 함<\/div><div class=\"ln p\">-“「사회복지사업법」 제2조의 사회복지사업 수행”과 같은 형태의 추상적인 목적사업은 불가능하므로 수행하고자 하는 목적사업을 세부적이고 구체적으로 규정할 것<\/div><div class=\"ln p\">예)「국민기초생활보장법」 제○○조의 ○○사업 「노인복지법」 제○○조의 노인의료복지시설 중 무료노인요양시설운영<\/div><div class=\"ln p\">허가심사시 설립자의 재정능력 및 의도, 목적사업의 비영리성, 수익사업의 성격 등을 엄격하게 심사하여, 조세회피 등 순수하지 않은 목적의 법인설립을 미연에 방지<\/div><div class=\"ln note\">※ 법인 해산시 그 잔여재산은 사회복지사업법 제27조에 따라 국가 또는 지자체에 귀속됨을 안내<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">설립행위(재산의 출연과 정관작성)<\/div><div class=\"ln p\">사회복지법인의 설립행위는 설립자가 기본재산 등을 출연하는 1)재산의 출연과 설립자의 법인 설립의도를 정관에 기재하는 2)정관의 작성으로 구분됨<\/div><div class=\"ln h4\">1) 재산의 출연<\/div><div class=\"ln p\">가) 출연재산의 종류<\/div><div class=\"ln p\">법인의 설립자는 목적사업에 필요한 재산을 출연하여야 하며, 재산의 종류는 동산, 부동산 등 다양한 형태가 가능하며 일정 신용평가등급 이상의 채권도 가능<\/div><div class=\"ln p\">예) ○○신용평가등급 A- 이상<\/div><div class=\"ln p\">-다만, 출연하고자 하는 재산에 제한물권(지상권, 근저당권, 가등기)이 설정되어 있거나, 가압류․가처분 등이 되어 있어 법인이 채무를 부담하거나 재산권 행사가 제한되어서는 안 됨<\/div><div class=\"ln p\">* 부동산인 경우는 p.24 ②참조<\/div><div class=\"pchip\" id=\"p19\"><span>원문 19쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=25\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">-기본재산이 현금일 경우, 「예금자보호법」에 의한 보호 등을 확인하여 기본재산 잠식 위험성이 있는 보관방법은 지양<\/div><div class=\"ln p\">나) 출연재산의 귀속<\/div><div class=\"ln p\">생전처분으로 법인을 설립하는 때에는 출연재산은 법인이 성립된 때로부터 법인의 재산이 됨(「민법」 제48조제1항)<\/div><div class=\"ln note\">※ 법인이 성립된 때는 설립등기가 완료된 때임(「민법」 제33조)<\/div><div class=\"ln p\">유언(遺言)으로 법인을 설립할 때, 출연재산은 유언의 효력이 발생한 때로부터 법인에 귀속한 것으로 봄(「민법」 제48조제2항)<\/div><div class=\"ln note\">※유언의 효력이 발생하는 시기는 유언자가 사망한 때(「민법」 제1073조)이므로 유언으로 법인을 설립하는 때에는 법인의 설립등기가 완료된 때가 아닌 유언자가 사망한 때에 소급하여 법인에게 귀속<\/div><div class=\"ln p\">다) 법인재산의 구분(법 제23조, 규칙 제12조)<\/div><div class=\"ln p\">법인의 재산은 기본재산과 보통재산으로 구분<\/div><div class=\"ln p\">(1)기본재산：목적사업 및 수익사업의 수행을 위해 기본적으로 필요한 재산으로 부동산, 정관에서 기본재산으로 정한 재산, 이사회의 결의에 의하여 기본재산으로 편입된 재산이 해당<\/div><div class=\"ln note\">※ 기본재산은 그 목록과 가액을 정관에 기재해야 함<\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>기본재산 가액 기준<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">공익법인의 모든 재산의 평가는 취득 당시의 시가에 의하며, 다만 재평가를 실시한 재산은 재평가액으로 한다고 규정하고 있음(공익법인법 시행령 제24조)<\/td><\/tr><\/table><div class=\"ln p\">① 목적사업용 기본재산：법인이 시설 등을 설치하는데 직접 사용하는 기본재산<\/div><div class=\"ln p\">②수익용 기본재산：법인이 그 수익으로 목적사업의 수행에 필요한 경비를 충당하기 위한 재산<\/div><div class=\"ln note\">※ 지원법인은 구분하지 않을 수 있음<\/div><div class=\"ln h4\">(2) 보통재산：기본재산 이외의 재산<\/div><div class=\"ln note\">※ 자동차, 컴퓨터, 집기, 비품 등 감가상각 하는 재산은 보통재산에 해당<\/div><div class=\"pchip\" id=\"p20\"><span>원문 20쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=26\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라) 기본재산의 기준(규칙 제13조)<\/div><div class=\"ln h4\">(1) 시설법인시설종류별 설치기준에 적합한 시설(건축물)과 부지를 갖추거나 갖출 수 있는 목적사업용 기본재산 및 시설 운영을 위한 보통재산을 갖춰야 하고 시설설치 부지는 시설설치가 가능한 지역이어야 함<\/div><div class=\"ln note\">※ 그린벨트, 군사구역, 환경규제구역, 절대농지 여부 등 파악<\/div><div class=\"ln note\">※ 목적사업용 기본재산의 규모(예시)<\/div><div class=\"ln p\">- 시설(건축물)：총소요면적×정부건축공사비 기준단가<\/div><div class=\"ln p\">- 부지：총소요면적×시가 등 매매적정가<\/div><div class=\"ln p\">- 이 외에도 개별공시지가, 감정평가서 등 사용 가능<\/div><div class=\"ln note\">※시설 운영을 위한 보통재산의 규모는 시설의 종류 및 규모, 기본재산의 과실금, 보조금 확보방안 등을 종합적으로 검토하여 판단<\/div><div class=\"ln p\">① 생활시설상시 10인 이상 시설거주자를 보호할 수 있는 목적사업용 기본재산을 갖추되, 개별법령에서 10인 미만의 소규모시설을 따로 정하고 있는 경우에는 당해 법령에 의한 시설의 설치기준에 해당하는 목적사업용 기본재산을 갖추어야 함<\/div><table class=\"htbl\"><tr><td>구 분<\/td><td>10인 미만 가능<\/td><td>상시 5인 이상<\/td><td>상시 10인 이상<\/td><\/tr><tr><td>시  설<\/td><td>아동복지시설<br>노숙인복지시설<\/td><td>노인복지시설<\/td><td>장애인복지시설<br>정신요양시설<\/td><\/tr><\/table><div class=\"ln note\">※ 여성가족부 소관시설은 개별법령 참조<\/div><div class=\"ln p\">-법 제2조제1호 각목의 법률에 따른 시설 및 법 제34조제4항의 규정에 의한 시설은 각 개별법령의 시설의 설치기준에 해당하는 목적사업용 기본재산을 갖추어야 함<\/div><div class=\"ln p\">-결핵 및 한센병 요양시설은 입소정원에 13.2㎡를 곱한 시설면적 이상에 해당하는 목적사업용 기본재산을 갖추어야 함(규칙 제13조제1항제1호나목)<\/div><div class=\"ln p\">② 이용시설당해 법인이 설치･운영하고자 하는 시설을 갖출 수 있는 목적사업용 기본재산을 갖추어야 함<\/div><div class=\"ln p\">(2)지원법인지원법인은 출연된 기본재산으로부터 발생하는 수익으로 인건비, 사업비 등 법인운영경비의 전액을 충당할 수 있는 기본재산을 갖추어야 함(이자율 등을 고려할 것)<\/div><div class=\"pchip\" id=\"p21\"><span>원문 21쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=27\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">2) 정관(定款)의 작성(법 제17조)<\/div><div class=\"ln p\">가)설립자는 법인의 기본규칙을 정하여 이를 서면에 기재하고 기명･인감날인(「민법」 제43조)<\/div><div class=\"ln p\">나) 정관 기재사항(필요적 기재사항)<\/div><div class=\"ln p\">① 목적<\/div><div class=\"ln p\">② 명칭<\/div><div class=\"ln p\">③ 주된 사무소의 소재지<\/div><div class=\"ln p\">④ 사업의 종류(목적사업을 구체적으로 기재)<\/div><div class=\"ln p\">⑤ 자산 및 회계에 관한 사항<\/div><div class=\"ln p\">⑥ 임원의 임면 등에 관한 사항<\/div><div class=\"ln p\">⑦ 회의에 관한 사항<\/div><div class=\"ln p\">⑧ 수익을 목적으로 하는 사업이 있는 경우 그에 관한 사항<\/div><div class=\"ln p\">⑨ 정관의 변경에 관한 사항<\/div><div class=\"ln p\">⑩존립시기와 해산사유를 정한 때에는 그 시기와 사유 및 잔여재산의 처리방법<\/div><div class=\"ln p\">⑪ 공고 및 그 방법에 관한 사항<\/div><div class=\"ln note\">※유언으로 설립행위를 하는 경우에는 유증(遺贈)에 관한 규정을 준용(「민법」 제47조제2항)<\/div><div class=\"ln p\">다) 정관 작성시 참고사항<\/div><div class=\"ln p\">-정관은 법 제17조 정한 사항을 모두 기재하고 있는 때에만 유효하며, 그 가운데 하나라도 빠지면 정관으로서의 효력이 생기지 않음<\/div><div class=\"ln p\">-설립자가 정관에서 가장 중요한 목적과 자산만을 정하고 그 명칭, 사무소 주소지, 이사임면의 방법과 같은 가벼운 사항을 정하지 않고서 사망한 경우에 이해관계인 또는 검사의 청구에 의하여 법원이 이들 사항을 정할 수 있음(「민법」 제44조)<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>유사･동일명칭 확인방법<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">사회복지법인의 명칭은 그 법인과 거래하는 제3자에게 혼란을 주지 않고, 향후 등기 시 발생할 수 있는 문제를 막기 위해 다른 법인과 유사하거나 동일한 명칭을 사용하는 것을 지양하여야 함<br>※ 동일명칭 확인방법：대법원 인터넷 등기소 ➝ 등기열람/발급 ➝ 법인 ➝ 상호찾기<\/td><\/tr><\/table><div class=\"pchip\" id=\"p22\"><span>원문 22쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=28\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">시･도지사의 설립허가(법 제16조)<\/div><div class=\"ln p\">법인을 설립하고자 하는 자는 시･도지사의 허가를 받아야 함<\/div><div class=\"ln h4\">1) 시･군･구 검토의견 작성(영 제8조)시･군･구가 법인설립허가신청서를 접수하면 다음의 “가) 자산에 관한 실지조사결과서”와 “나) 법인설립의 필요성에 관한 검토의견” 등을 작성한 후 이를 법인설립허가신청서와 함께 시･도지사에게 송부하여야 함<\/div><div class=\"pchip\" id=\"p23\"><span>원문 23쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=29\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가) 자산에 관한 실지조사결과서<\/div><div class=\"ln p\">- 출연재산의 소유권 및 사용권이 확실한지 여부<\/div><div class=\"ln p\">①출연하는 부동산의 용도지역구분, 그린벨트 여부, 기타 건축관련법, 군사, 환경관련법 등에 규제를 받고 있는지 여부<\/div><div class=\"ln note\">※시설법인의 경우 시설설치가 가능한지 여부, 시설이 지역사회와 너무 동떨어진 곳에 있어서 관리가 어려운지 여부 등도 검토<\/div><div class=\"ln p\">②출연재산에 제한물권(지상권, 근저당권 등)의 설정, 가압류, 가처분 등이 되어 있어 법인이 채무를 부담하게 되거나 공동 지분 소유 등 재산권행사가 제한되는 경우에는 타인(채권자)의 의사에 의하여 법인의 목적사업이 중단 또는 변경될 수 있으므로 기본재산으로 인정하지 않는 것을 원칙으로 함<\/div><div class=\"ln p\">-다만, 주무관청은 과도한 규제가 되지 않도록 법인의 부채현황, 채무이행능력 등을 종합적으로 검토하여 출연재산의 제한물권 범위*를 합리적으로 판단하여야 함<\/div><div class=\"ln note\">※(예시)신청법인의 17억 원 상당의 부동산 출연재산에 2.5억 원의 근저당권이 설정되어 있는 경우, 이 법인의 사업수행에 따른 재원확보방안이 확실하여 채무부담능력이 있다면 근저당권 설정만을 이유로 인정하지 않는 것은 과도한 규제가 될 수 있음<\/div><div class=\"ln note\">※(예외) 국가나 지자체의 보조금으로 신증축한 건물을 기본재산에 편입하려 할 때, 관계법령에 따라 주무관청에서 해당 건물에 설정한 근저당권은 채무부담이 필요한 제한물권의 설정이 아니므로 예외로 함<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>기본재산으로 인정하기 어려운 재산<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">후원금, 기부금 등은 설립되는 사회복지법인의 의지와는 직접적인 관련이 없는 불확실한 미래소득이므로 이를 기본재산으로 인정하기 어려움<\/td><\/tr><\/table><div class=\"ln p\">나) 법인설립의 필요성에 관한 검토의견<\/div><div class=\"ln p\">-사업계획서 및 예산서 등의 적정여부, 설립자의 자질 및 재정능력 등에 대한 객관적 의견, 법인 목적사업에 대한 실현가능성 등에 대한 검토의견 제출<\/div><div class=\"ln p\">다) 기타 특기(特記)사항 및 의견<\/div><div class=\"ln h4\">2) 시･도지사의 설립허가<\/div><div class=\"ln p\">가) 허가기준(공익법인법 제4조, 공익법인법 시행령 제5조)<\/div><div class=\"ln p\">시･도지사는 법인설립허가 신청내용이 다음의 기준에 적합한 경우에 한하여 허가<\/div><div class=\"ln p\">-목적사업이 구체적이며 실현가능하다고 인정되는 경우<\/div><div class=\"ln p\">-출연재산의 수입으로 목적사업을 원활히 달성할 수 있다고 인정되는 경우<\/div><div class=\"ln p\">-목적사업이 적극적으로 사회복지를 유지･증진하는 것이라고 인정되는 경우<\/div><div class=\"ln note\">※시･도지사는 상기내용에 적합하다고 해서 반드시 허가할 의무는 없으나(재량행위), 상기내용을 충족하지 못하였을 경우에는 허가하여서는 아니됨<\/div><div class=\"ln note\">※타 사업(의료, 교육, 수익목적의 사업 등)을 위한 법인 설립 등 사회복지사업의 범위를 벗어난 법인설립은 미연에 방지할 것<\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>법인 설립행위의 재량 정도 [대법원 1996. 9. 10 선고 95누18437판결]<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">비영리법인의 설립허가를 할 것인지 여부는 주무관청의 정책적 판단에 따른 재량에 맡겨져 있다. 따라서 주무관청의 법인설립 불허가처분에 사실의 기초를 결여하였다든지 또는 사회관념상 현저하게 타당성을 잃었다는 등의 사유가 있지 아니하고, 주무관청이 그와 같은 결론에 이르게 된 판단과정에 일응의 합리성이 있음을 부정할 수 없는 경우에는, 다른 특별한 사정이 없는 한 그 불허가처분에 재량권을 일탈･남용한 위법이 있다고 할 수 없다.<\/td><\/tr><\/table><div class=\"ln p\">나) 허가조건(공익법인법 제4조, 공익법인법 시행령 제6조)<\/div><div class=\"ln p\">시･도지사는 법인설립 허가시 다음의 조건을 붙일 수 있음<\/div><div class=\"ln p\">-수혜자의 출생지, 출신학교, 직업, 근무처 기타 사회적 지위나 당해 법인과 특수관계 등에 의해 수혜자의 범위를 제한할 수 없다는 뜻(반드시 붙여야 함)<\/div><div class=\"ln p\">-「사회복지사업법」, 「민법」 및 「공익법인의 설립･운영에 관한 법률」 등 관련 법령과 정관에서 정한 내용을 준수할 것<\/div><div class=\"ln note\">※시･도지사가 수혜자를 범위를 특히 한정할 필요가 있다고 인정되는 때에는 그 한정할 범위에 관하여 미리 법인의 주된 사무소의 소재지를 관할하는 세무서장과 합의하여야 함<\/div><div class=\"pchip\" id=\"p24\"><span>원문 24쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=30\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">-목적사업의 무상성 기타 목적사업의 운영에 관한 사항<\/div><div class=\"ln p\">-기타 목적사업 원활한 달성을 위하여 필요한 사항<\/div><div class=\"ln p\">다) 타 시･도와 협의(공익법인법 제4조, 공익법인법 시행령 제5조)<\/div><div class=\"ln p\">-목적사업이 2 이상의 시･도의 소관에 속하는 경우에는 법인의 주된 사무소가 위치하는 시･도에서 설립허가 여부를 결정하되, 관련 시･도간 협의하여야 함<\/div><div class=\"ln note\">※목적사업이 2 이상 시･도의 소관에 속할 경우 정관변경절차를 거쳐 정관상 분사무소조항을 두어야 할 것이며, 주무관청은 분사무소를 설치하고자 하는 시･도지사와 반드시 협의하여야 함.<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">법인설립등기<\/div><div class=\"ln p\">시･도지사의 허가를 받은 법인은 주된 사무소 소재지(등기소)에서 설립등기를 함으로써 성립(「민법」 제33조)<\/div><div class=\"ln p\">설립등기(「민법」 제49조, 공익법인법 시행령 9조)<\/div><div class=\"ln p\">-법인설립의 허가가 있는 때에는 3주내에 주된 사무소의 소재지(등기소)에서 설립등기를 한 후, 7일 이내 시･도지사에 보고<\/div><div class=\"ln p\">-등기사항：① 목적, ② 명칭, ③ 사무소, ④ 설립허가의 연월일, ⑤ 존립시기나 해산사유를 정한 때에는 그 시기 또는 사유, ⑥ 자산의 총액, ⑦ 출자의 방법을 정한 때에는 그 방법, ⑧ 이사의 성명, 주소, ⑨ 이사의 대표권을 제한한 때에는 그 제한<\/div><div class=\"ln note\">※ 사회복지법인의 수익사업은 법인의 설립목적을 수행하는데 지장이 없는 범위 내에서 하는 부수적･수단적 사업으로, 법인의 본래 목적을 달성하기 위한 사업이 아니므로 이를 등기사항 중 “목적” 란에 기록할 수 없음(상업등기선례 제2-139호)<\/div><div class=\"ln note\">※ 등기사항 중 “자산의 총액”은 법인이 보유하고 있는 정관상 기본재산은 물론 기타 부동산, 동산 및 채권 등을 포함하는 적극재산의 총액에서 채무 등의 소극재산을 공제한 순재산액을 의미함(등기선례 제5-859호)<\/div><div class=\"ln note\">※등기하지 않으면 제3자에 대항하지 못하며, 등기의무를 해태할 경우 과태료의 처벌을 받음(「민법」 제97조)<\/div><div class=\"ln note\">※법인은 설립허가 단계에서 출연하기로 약정한 기본재산에 대하여 설립등기 완료 후 법인 명의로 즉시 명의 이전을 이행하고, 주무관청은 설립허가 후 설립등기 및 기본재산출연여부 등을 반드시 확인(기본재산 미출연이 확인되면 법인설립허가를 취소하여야 함, 법개정 2012.8.5시행)<\/div>", "pages": [{"p": 16, "t": "2\n사회복지법인 설립요건\n가\n설립자의 설립허가 신청(법 제16조, 영 제8조, 규칙 제7조)\n사회복지법인을 설립하고자 하는 자는 사회복지법인 설립허가신청서 등 관련서류를 주된 사무소를 관할하는 시･군･구청장을 거쳐 시･도지사에게 제출하여야 함"}, {"p": 17, "t": "양  식 | 내      용 | 비 고\n설립허가 신청서 |  | 붙임 2\n설립취지서 | 법인설립 취지를 6하원칙에 의해 기재 | 붙임 3\n발기인 총회 회의록 | 회의록에는 재산출연사항, 임원선출, 정관의 심의의결, 사업 계획 및 수지예산 등에 관한 의결사항을 포함하며, 발기인 전원이 인감 날인 | 붙임 4\n설립 발기인 명단 | 직위, 성명, 주민등록번호, 주소 및 약력 등을 간략하게 기재 | 붙임 5\n정관 | 법 제17조 정관기재사항은 반드시 기재하고, 기타 관련법규에 어긋남이 없도록 하며, 발기인 전원이 기명 인감날인 | 붙임 6\n기본재산목록 |  | 붙임 7\n임원명단 |  | 붙임 8\n법인이 사용할 인장 |  | 붙임 9\n재산출연증서 | 출연재산의 구체적 내용과(소재지, 지목, 지적, 평가가액 등) 출연인의 인적사항, 출연일자 기재 후 인감날인 주식, 예금 등의 출연행위에 대하여는 공증인의 공증 필요 | 붙임 10\n재산 소유 증명 서류 | 부동산 등기부등본, 주식의 주주명부사본, 현금의 경우 예금 잔고증명, 유가증권의 사본, 각종 무체재산권의 등록필증 사본 등 첨부 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 소유권에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음 | \n재산의 평가조서 | 기본재산과 보통재산으로 구분 기본재산은 목적사업용과 수익용으로 구분하여 평가 가액을 일목요연하게 파악할 수 있도록 작성 부동산은 「감정평가 및 감정평가사에 관한 법률」에 의한 감정평가법인의 감정평가서 또는 표준지의 공시지가를 기준으로 산정한 지가확인서 첨부 예금 등은 그 현재액을 증명할 수 있는 잔고증명서 기타 각종 재산을 평가할 수 있는 증빙서류 첨부 개별공시지가 확인서로 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음 | \n재산의 수익조서 | 수익용 기본재산을 갖춘 경우에 한하며 수익을 파악할 수 있도록 작성하고 수익산출 근거를 명시 수익을 증명할 수 있는 기관이 발행하는 증빙서류(수익확인서, 배당이익증명서, 이자수익확인서, 납세필증 등) 첨부 | \n임원의 취임승낙서 및 이력서 | 임원취임자의 취임승낙의사 표시와 인적사항(주소, 성명, 주민 등록번호, 주요경력 등) 기재 이사 및 감사 등의 직위와 취임기간을 명시하고 인감날인 이력서 첨부 | 붙임 11 붙임 12\n이사추천서 | 법 제18조제2항 각 호의 어느 하나에 해당하는 기관으로부터 받은 이사추천서 1부 ※위 기관이 법인이 성립되지 않았음을 사유로 추천을 하지 않을 경우 외부추천이사 추천요청공문으로 갈음 가능 ※이 경우 지자체가 법인설립을 허가할 때 “법인설립허가 후 법인설립 등기 전 기간에 반드시 추천을 받아, 이사를 선임하고 그 결과를 지체없이 보고할 것” 이라는 취지의 부관을 붙일 것 | \n특수관계 부존재 각서 | 법 제18조제2항의 규정(특별한 관계에 있는 자)에 저촉되지 않음을 입증하는 각서 1부 | 붙임 13\n결격사유 부존재 각서 | 법 제19조제1항의 규정(임원의 결격사유)에 저촉되지 않음을 입증하는 각서 1부(’19.6.12.시행) | 붙임 14\n사업계획서 및 예산서 |  | \n구비서류(양식은 p.90 이하 붙임자료 참고)\n* (인감날인) 본인서명사실확인서 또는 전자본인서명확인서 발금증를 제출하고 관련 서면에 서명을 한 경우에는 인감증명서를 제출하고 관련 서면에 인감을 날인한 것으로 봄(「본인서명사실 확인 등에 관한 법률」 제13조제2항)\n나\n목적의 비영리성\n사회복지법인은 반드시 「사회복지사업법」 제2조의 “사회복지사업”을 수행할 목적으로 설립되어야 하며\n-사회복지사업을 수행함에 있어 이윤추구를 위한 영리목적이 아닌 사회복지라는 비영리목적을 위해 존재해야 함"}, {"p": 18, "t": "※비영리사업의 목적을 달성하기 위해 필요한 한도에서 비영리사업의 본질에 반하지 않을 정도의 수익사업을 하는 것은 가능하나, 수익사업으로 인한 수익은 언제나 목적사업의 수행에 충당되어야 함\n예)유료시설에서 생활비를 받는 경우, 운영비 보조를 위해 일정 수익사업을 하는 경우 등은 가능하나 이로 인한 수익은 시설기능보강, 운영비보조, 생활자 복지수준 향상 등을 위해 사용해야 함\n※「사회복지사업법」 제28조에서는 “법인은 목적사업의 경비에 충당하기 위하여 필요한 때에는 법인의 설립목적 수행에 지장이 없는 범위 안에서 수익사업을 할 수 있다”고 규정하고 있는바, 그 수익사업의 범위 및 종류에 대해서는 주무관청에서 개별사안별로 비영리법인 본질 위배 여부, 법인 설립목적 달성을 위한 법인 내 인적, 물적 상황 등 제반여건을 충분히 고려하여 판단하여야 함\n사회복지법인을 설립하고자 하는 자는 수행하고자 하는 목적사업을 구체적으로 확정하여 신청해야 함\n-“「사회복지사업법」 제2조의 사회복지사업 수행”과 같은 형태의 추상적인 목적사업은 불가능하므로 수행하고자 하는 목적사업을 세부적이고 구체적으로 규정할 것\n예)「국민기초생활보장법」 제○○조의 ○○사업 「노인복지법」 제○○조의 노인의료복지시설 중 무료노인요양시설운영\n허가심사시 설립자의 재정능력 및 의도, 목적사업의 비영리성, 수익사업의 성격 등을 엄격하게 심사하여, 조세회피 등 순수하지 않은 목적의 법인설립을 미연에 방지\n※ 법인 해산시 그 잔여재산은 사회복지사업법 제27조에 따라 국가 또는 지자체에 귀속됨을 안내\n다\n설립행위(재산의 출연과 정관작성)\n사회복지법인의 설립행위는 설립자가 기본재산 등을 출연하는 1)재산의 출연과 설립자의 법인 설립의도를 정관에 기재하는 2)정관의 작성으로 구분됨\n1) 재산의 출연\n가) 출연재산의 종류\n법인의 설립자는 목적사업에 필요한 재산을 출연하여야 하며, 재산의 종류는 동산, 부동산 등 다양한 형태가 가능하며 일정 신용평가등급 이상의 채권도 가능\n예) ○○신용평가등급 A- 이상\n-다만, 출연하고자 하는 재산에 제한물권(지상권, 근저당권, 가등기)이 설정되어 있거나, 가압류․가처분 등이 되어 있어 법인이 채무를 부담하거나 재산권 행사가 제한되어서는 안 됨\n* 부동산인 경우는 p.24 ②참조"}, {"p": 19, "t": "-기본재산이 현금일 경우, 「예금자보호법」에 의한 보호 등을 확인하여 기본재산 잠식 위험성이 있는 보관방법은 지양\n나) 출연재산의 귀속\n생전처분으로 법인을 설립하는 때에는 출연재산은 법인이 성립된 때로부터 법인의 재산이 됨(「민법」 제48조제1항)\n※ 법인이 성립된 때는 설립등기가 완료된 때임(「민법」 제33조)\n유언(遺言)으로 법인을 설립할 때, 출연재산은 유언의 효력이 발생한 때로부터 법인에 귀속한 것으로 봄(「민법」 제48조제2항)\n※유언의 효력이 발생하는 시기는 유언자가 사망한 때(「민법」 제1073조)이므로 유언으로 법인을 설립하는 때에는 법인의 설립등기가 완료된 때가 아닌 유언자가 사망한 때에 소급하여 법인에게 귀속\n다) 법인재산의 구분(법 제23조, 규칙 제12조)\n법인의 재산은 기본재산과 보통재산으로 구분\n(1)기본재산：목적사업 및 수익사업의 수행을 위해 기본적으로 필요한 재산으로 부동산, 정관에서 기본재산으로 정한 재산, 이사회의 결의에 의하여 기본재산으로 편입된 재산이 해당\n※ 기본재산은 그 목록과 가액을 정관에 기재해야 함\n판례 | 기본재산 가액 기준\n |  | \n |  | 공익법인의 모든 재산의 평가는 취득 당시의 시가에 의하며, 다만 재평가를 실시한 재산은 재평가액으로 한다고 규정하고 있음(공익법인법 시행령 제24조)\n① 목적사업용 기본재산：법인이 시설 등을 설치하는데 직접 사용하는 기본재산\n②수익용 기본재산：법인이 그 수익으로 목적사업의 수행에 필요한 경비를 충당하기 위한 재산\n※ 지원법인은 구분하지 않을 수 있음\n(2) 보통재산：기본재산 이외의 재산\n※ 자동차, 컴퓨터, 집기, 비품 등 감가상각 하는 재산은 보통재산에 해당"}, {"p": 20, "t": "라) 기본재산의 기준(규칙 제13조)\n(1) 시설법인시설종류별 설치기준에 적합한 시설(건축물)과 부지를 갖추거나 갖출 수 있는 목적사업용 기본재산 및 시설 운영을 위한 보통재산을 갖춰야 하고 시설설치 부지는 시설설치가 가능한 지역이어야 함\n※ 그린벨트, 군사구역, 환경규제구역, 절대농지 여부 등 파악\n※ 목적사업용 기본재산의 규모(예시)\n- 시설(건축물)：총소요면적×정부건축공사비 기준단가\n- 부지：총소요면적×시가 등 매매적정가\n- 이 외에도 개별공시지가, 감정평가서 등 사용 가능\n※시설 운영을 위한 보통재산의 규모는 시설의 종류 및 규모, 기본재산의 과실금, 보조금 확보방안 등을 종합적으로 검토하여 판단\n① 생활시설상시 10인 이상 시설거주자를 보호할 수 있는 목적사업용 기본재산을 갖추되, 개별법령에서 10인 미만의 소규모시설을 따로 정하고 있는 경우에는 당해 법령에 의한 시설의 설치기준에 해당하는 목적사업용 기본재산을 갖추어야 함\n구 분 | 10인 미만 가능 | 상시 5인 이상 | 상시 10인 이상\n시  설 | 아동복지시설 노숙인복지시설 | 노인복지시설 | 장애인복지시설 정신요양시설\n※ 여성가족부 소관시설은 개별법령 참조\n-법 제2조제1호 각목의 법률에 따른 시설 및 법 제34조제4항의 규정에 의한 시설은 각 개별법령의 시설의 설치기준에 해당하는 목적사업용 기본재산을 갖추어야 함\n-결핵 및 한센병 요양시설은 입소정원에 13.2㎡를 곱한 시설면적 이상에 해당하는 목적사업용 기본재산을 갖추어야 함(규칙 제13조제1항제1호나목)\n② 이용시설당해 법인이 설치･운영하고자 하는 시설을 갖출 수 있는 목적사업용 기본재산을 갖추어야 함\n(2)지원법인지원법인은 출연된 기본재산으로부터 발생하는 수익으로 인건비, 사업비 등 법인운영경비의 전액을 충당할 수 있는 기본재산을 갖추어야 함(이자율 등을 고려할 것)"}, {"p": 21, "t": "2) 정관(定款)의 작성(법 제17조)\n가)설립자는 법인의 기본규칙을 정하여 이를 서면에 기재하고 기명･인감날인(「민법」 제43조)\n나) 정관 기재사항(필요적 기재사항)\n① 목적\n② 명칭\n③ 주된 사무소의 소재지\n④ 사업의 종류(목적사업을 구체적으로 기재)\n⑤ 자산 및 회계에 관한 사항\n⑥ 임원의 임면 등에 관한 사항\n⑦ 회의에 관한 사항\n⑧ 수익을 목적으로 하는 사업이 있는 경우 그에 관한 사항\n⑨ 정관의 변경에 관한 사항\n⑩존립시기와 해산사유를 정한 때에는 그 시기와 사유 및 잔여재산의 처리방법\n⑪ 공고 및 그 방법에 관한 사항\n※유언으로 설립행위를 하는 경우에는 유증(遺贈)에 관한 규정을 준용(「민법」 제47조제2항)\n다) 정관 작성시 참고사항\n-정관은 법 제17조 정한 사항을 모두 기재하고 있는 때에만 유효하며, 그 가운데 하나라도 빠지면 정관으로서의 효력이 생기지 않음\n-설립자가 정관에서 가장 중요한 목적과 자산만을 정하고 그 명칭, 사무소 주소지, 이사임면의 방법과 같은 가벼운 사항을 정하지 않고서 사망한 경우에 이해관계인 또는 검사의 청구에 의하여 법원이 이들 사항을 정할 수 있음(「민법」 제44조)\n참고 | 유사･동일명칭 확인방법\n |  | \n |  | 사회복지법인의 명칭은 그 법인과 거래하는 제3자에게 혼란을 주지 않고, 향후 등기 시 발생할 수 있는 문제를 막기 위해 다른 법인과 유사하거나 동일한 명칭을 사용하는 것을 지양하여야 함 ※ 동일명칭 확인방법：대법원 인터넷 등기소 ➝ 등기열람/발급 ➝ 법인 ➝ 상호찾기"}, {"p": 22, "t": "라\n시･도지사의 설립허가(법 제16조)\n법인을 설립하고자 하는 자는 시･도지사의 허가를 받아야 함\n1) 시･군･구 검토의견 작성(영 제8조)시･군･구가 법인설립허가신청서를 접수하면 다음의 “가) 자산에 관한 실지조사결과서”와 “나) 법인설립의 필요성에 관한 검토의견” 등을 작성한 후 이를 법인설립허가신청서와 함께 시･도지사에게 송부하여야 함"}, {"p": 23, "t": "가) 자산에 관한 실지조사결과서\n- 출연재산의 소유권 및 사용권이 확실한지 여부\n①출연하는 부동산의 용도지역구분, 그린벨트 여부, 기타 건축관련법, 군사, 환경관련법 등에 규제를 받고 있는지 여부\n※시설법인의 경우 시설설치가 가능한지 여부, 시설이 지역사회와 너무 동떨어진 곳에 있어서 관리가 어려운지 여부 등도 검토\n②출연재산에 제한물권(지상권, 근저당권 등)의 설정, 가압류, 가처분 등이 되어 있어 법인이 채무를 부담하게 되거나 공동 지분 소유 등 재산권행사가 제한되는 경우에는 타인(채권자)의 의사에 의하여 법인의 목적사업이 중단 또는 변경될 수 있으므로 기본재산으로 인정하지 않는 것을 원칙으로 함\n-다만, 주무관청은 과도한 규제가 되지 않도록 법인의 부채현황, 채무이행능력 등을 종합적으로 검토하여 출연재산의 제한물권 범위*를 합리적으로 판단하여야 함\n※(예시)신청법인의 17억 원 상당의 부동산 출연재산에 2.5억 원의 근저당권이 설정되어 있는 경우, 이 법인의 사업수행에 따른 재원확보방안이 확실하여 채무부담능력이 있다면 근저당권 설정만을 이유로 인정하지 않는 것은 과도한 규제가 될 수 있음\n※(예외) 국가나 지자체의 보조금으로 신증축한 건물을 기본재산에 편입하려 할 때, 관계법령에 따라 주무관청에서 해당 건물에 설정한 근저당권은 채무부담이 필요한 제한물권의 설정이 아니므로 예외로 함\n참고 | 기본재산으로 인정하기 어려운 재산\n |  | \n |  | 후원금, 기부금 등은 설립되는 사회복지법인의 의지와는 직접적인 관련이 없는 불확실한 미래소득이므로 이를 기본재산으로 인정하기 어려움\n나) 법인설립의 필요성에 관한 검토의견\n-사업계획서 및 예산서 등의 적정여부, 설립자의 자질 및 재정능력 등에 대한 객관적 의견, 법인 목적사업에 대한 실현가능성 등에 대한 검토의견 제출\n다) 기타 특기(特記)사항 및 의견\n2) 시･도지사의 설립허가\n가) 허가기준(공익법인법 제4조, 공익법인법 시행령 제5조)\n시･도지사는 법인설립허가 신청내용이 다음의 기준에 적합한 경우에 한하여 허가\n-목적사업이 구체적이며 실현가능하다고 인정되는 경우\n-출연재산의 수입으로 목적사업을 원활히 달성할 수 있다고 인정되는 경우\n-목적사업이 적극적으로 사회복지를 유지･증진하는 것이라고 인정되는 경우\n※시･도지사는 상기내용에 적합하다고 해서 반드시 허가할 의무는 없으나(재량행위), 상기내용을 충족하지 못하였을 경우에는 허가하여서는 아니됨\n※타 사업(의료, 교육, 수익목적의 사업 등)을 위한 법인 설립 등 사회복지사업의 범위를 벗어난 법인설립은 미연에 방지할 것\n판례 | 법인 설립행위의 재량 정도 [대법원 1996. 9. 10 선고 95누18437판결]\n |  | \n |  | 비영리법인의 설립허가를 할 것인지 여부는 주무관청의 정책적 판단에 따른 재량에 맡겨져 있다. 따라서 주무관청의 법인설립 불허가처분에 사실의 기초를 결여하였다든지 또는 사회관념상 현저하게 타당성을 잃었다는 등의 사유가 있지 아니하고, 주무관청이 그와 같은 결론에 이르게 된 판단과정에 일응의 합리성이 있음을 부정할 수 없는 경우에는, 다른 특별한 사정이 없는 한 그 불허가처분에 재량권을 일탈･남용한 위법이 있다고 할 수 없다.\n나) 허가조건(공익법인법 제4조, 공익법인법 시행령 제6조)\n시･도지사는 법인설립 허가시 다음의 조건을 붙일 수 있음\n-수혜자의 출생지, 출신학교, 직업, 근무처 기타 사회적 지위나 당해 법인과 특수관계 등에 의해 수혜자의 범위를 제한할 수 없다는 뜻(반드시 붙여야 함)\n-「사회복지사업법」, 「민법」 및 「공익법인의 설립･운영에 관한 법률」 등 관련 법령과 정관에서 정한 내용을 준수할 것\n※시･도지사가 수혜자를 범위를 특히 한정할 필요가 있다고 인정되는 때에는 그 한정할 범위에 관하여 미리 법인의 주된 사무소의 소재지를 관할하는 세무서장과 합의하여야 함"}, {"p": 24, "t": "-목적사업의 무상성 기타 목적사업의 운영에 관한 사항\n-기타 목적사업 원활한 달성을 위하여 필요한 사항\n다) 타 시･도와 협의(공익법인법 제4조, 공익법인법 시행령 제5조)\n-목적사업이 2 이상의 시･도의 소관에 속하는 경우에는 법인의 주된 사무소가 위치하는 시･도에서 설립허가 여부를 결정하되, 관련 시･도간 협의하여야 함\n※목적사업이 2 이상 시･도의 소관에 속할 경우 정관변경절차를 거쳐 정관상 분사무소조항을 두어야 할 것이며, 주무관청은 분사무소를 설치하고자 하는 시･도지사와 반드시 협의하여야 함.\n마\n법인설립등기\n시･도지사의 허가를 받은 법인은 주된 사무소 소재지(등기소)에서 설립등기를 함으로써 성립(「민법」 제33조)\n설립등기(「민법」 제49조, 공익법인법 시행령 9조)\n-법인설립의 허가가 있는 때에는 3주내에 주된 사무소의 소재지(등기소)에서 설립등기를 한 후, 7일 이내 시･도지사에 보고\n-등기사항：① 목적, ② 명칭, ③ 사무소, ④ 설립허가의 연월일, ⑤ 존립시기나 해산사유를 정한 때에는 그 시기 또는 사유, ⑥ 자산의 총액, ⑦ 출자의 방법을 정한 때에는 그 방법, ⑧ 이사의 성명, 주소, ⑨ 이사의 대표권을 제한한 때에는 그 제한\n※ 사회복지법인의 수익사업은 법인의 설립목적을 수행하는데 지장이 없는 범위 내에서 하는 부수적･수단적 사업으로, 법인의 본래 목적을 달성하기 위한 사업이 아니므로 이를 등기사항 중 “목적” 란에 기록할 수 없음(상업등기선례 제2-139호)\n※ 등기사항 중 “자산의 총액”은 법인이 보유하고 있는 정관상 기본재산은 물론 기타 부동산, 동산 및 채권 등을 포함하는 적극재산의 총액에서 채무 등의 소극재산을 공제한 순재산액을 의미함(등기선례 제5-859호)\n※등기하지 않으면 제3자에 대항하지 못하며, 등기의무를 해태할 경우 과태료의 처벌을 받음(「민법」 제97조)\n※법인은 설립허가 단계에서 출연하기로 약정한 기본재산에 대하여 설립등기 완료 후 법인 명의로 즉시 명의 이전을 이행하고, 주무관청은 설립허가 후 설립등기 및 기본재산출연여부 등을 반드시 확인(기본재산 미출연이 확인되면 법인설립허가를 취소하여야 함, 법개정 2012.8.5시행)"}]}, {"title": "3. 사회복지법인의 기관", "start": 25, "end": 46, "html": "<div class=\"pchip\" id=\"p25\"><span>원문 25쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=31\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>사회복지법인의 기관<\/div><div class=\"ln p\">사회복지법인은 임원으로서 이사(理事)와 감사(監事)를 두고, 법인의 의사결정기관인 이사회(理事會)를 반드시 두어야 함<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">이사회(理事會)<\/div><div class=\"ln h4\">1) 이사회의 구성(법 제18조, 영 제8조의2 및 제9조, 공익법인법 제6조)<\/div><div class=\"ln p\">이사회는 이사로써 구성되며(감사는 제외) 이사장은 정관이 정하는 바에 따라 이사 중에서 호선(공익법인법 제6조)<\/div><div class=\"ln p\">이사는 7인 이상 두어야 하며(외국인 이사는 이사 현원의 1/2 미만이어야 함) 이사회의 구성에 있어 시행령 제9조에 의한 “특별한 관계에 있는 자”는 이사 현원의 1/5를 초과할 수 없음<\/div><div class=\"ln note\">※ 이사 정수는 법인의 정관에서 그 인원수를 확정하여 기재하도록 할 것(외부추천이사 비율 등의 판단 기준이 됨)예) 잘못된 예 7~15명, 잘된 예 7명<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>특별한 관계에 있는 자의 범위(「사회복지사업법 시행령」 제9조)<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">1. 출연자<br>2. 출연자 또는 이사와의 관계가 다음 각목의 어느 하나에 해당하는 사람<br>가. 6촌 이내의 혈족<br>나. 4촌 이내의 인척<br>다. 배우자(사실상 혼인관계에 있는 사람을 포함한다)<br>라.친생자(親生子)로서 다른 사람에게 친양자(親養子)로 입양된 사람 및 그 배우자와 직계비속<br>3.출연자 또는 이사의 사용인 그 밖에 고용관계에 있는 자(출연자 또는 이사가 ʻʻ출자에 의하여 사실상 지배하고 있는 법인ʼʼ의 사용인 그 밖에 고용관계에 있는 자를 포함)<br>4.출연자 또는 이사의 금전 그 밖의 재산에 의하여 생계를 유지하는 자 및 그와 생계를 함께 하는 자<br>5. 출연자 또는 이사가 재산을 출연한 다른 법인의 이사<br>▶3의 ʻʻ출자에 의하여 사실상 지배하고 있는 법인ʼʼ의 의미<br>가.법인의 발행주식 총액 또는 출자총액의 100분의 30 이상을 출자자 1인과 그와 상기 ʻʻ2ʼʼ, ʻʻ4ʼʼ 및 사용인 그 밖에 고용관계에 있는 자(이하 ʻʻ지배주주ʼʼ)가 소유하고 있는 경우<br>나.법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 ʻʻ가ʼʼ의 법인과 그의 지배주주가 소유하고 있는 경우<br>다.법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 ʻʻ가ʼʼ의 법인과 그의 지배주주 및 ʻʻ나ʼʼ의 법인이 소유하고 있는 경우<\/td><\/tr><\/table><div class=\"pchip\" id=\"p26\"><span>원문 26쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=32\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">이사 정수의 1/3(소수점 이하는 버림) 이상을 ‘시･도 사회보장위원회 또는 지역사회보장협의체’(근거법령 : 「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」)에서 3배수 추천한 사람 중에서 선임<\/div><div class=\"ln note\">※ 설립허가 후 법인등기 이전까지 외부추천이사의 선임을 완료해야 함<\/div><div class=\"ln note\">※각 지자체의 사회복지법인 관리 담당자는 사회복지법인 이사가 교체될 때 외부추천이사제의 적용 여부를 반드시 확인할 것<\/div><div class=\"ln h4\">2) 외부추천이사의 구성<\/div><div class=\"ln p\">추천기관의 후보군 구성(법 제18조제8항, ’18.4.25.시행)<\/div><div class=\"ln p\">- 추천기관인 시･도사회보장위원회 또는 지역사회보장협의체는 이사를 추천하기 위하여 매년 다음 중 어느 하나에 해당하는 사람으로 이사 후보군을 구성하여 공고하여야 함<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>① 사회복지 또는 보건의료에 관한 학식과 경험이 풍부한 사람<br>② 사회복지를 필요로 하는 사람의 이익 등을 대표하는 사람<br>③ 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체에서 추천한 사람<br>④ 「사회복지공동모금회법」 제14조에 따른 사회복지공동모금지회에서 추천한 사람<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln note\">※사회복지법인의 대표자, 사회복지사업을 하는 비영리법인 또는 단체의 대표자, 「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」 제41조에 따른 지역사회보장협의체의 대표자는 후보군에서 제외(최종추천자에도 포함될 수 없음) (근거：기존 「사회복지사업법」 제18조제2항, 개정 「사회복지사업법」 제18조제8항(’18.4.25.시행))<\/div><div class=\"ln p\">추천기관의 후보군 공고(법 제18조제8항, ’18.4.25.시행)<\/div><div class=\"ln p\">- 사회복지법인을 관리･감독하는 시･도 및 시･군･구에서는 사회복지법인 법령을 벗어나지 않는 범위 내에서 외부추천이사 후보군 공고방법에 대한 자체적인 세부 지침을 정할 것<\/div><div class=\"pchip\" id=\"p27\"><span>원문 27쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=33\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>추천기관의 업무처리지침 마련 시 고려사항<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">사회복지법인을 관리･감독하는 시･도 및 시･군･구에서는 사회복지법인 외부추천이사제가 원활하게 운영될 수 있도록 법령을 벗어나지 않는 범위 내에서 자체적인 세부 지침(후보군 구성 및 공고방법, 법인의 추천 요청 기준, 요청 방법, 추천기관의 추천업무 처리 지침, 추천 방법 등)을 정할 것<br>세부 지침을 정할 경우 관할 법인 및 시･도사회보장위원회 또는 지역사회보장협의체 등과 협의하되, 추천기관의 업무처리지침은 다음 사항 등을 참고<br>후보군 구성 및 공고：추천기관은 공개모집이나 타 기관 추천 등을 통해 후보군을 작성･관리･업데이트 하고, 특히, 후보군은 분야별(예：아동복지분야, 노인복지분야, 장애인복지분야, 시설운영분야, 지원사업분야, 기타분야 등)로 구분하여 매년 공고<br>※ 외부추천이사는 관할 시･도뿐만 아니라 다른 시･도 거주자도 가능하며, 타 법인의 일반이사 또는 외부추천이사도 추천될 수 있음(특수관계자 제외)<br>이사 추천 수요 예비조사：추천기관은 반기별 또는 분기별로 해당 지역에 있는 법인을 대상으로 추천 수요를 사전에 조사(법인명, 법인 사업의 종류･내용, 추천필요 인원, 추천요청 예상 시기 등)<br>정식 추천：수요조사 이후 법인이 공식적으로 추천 요청을 해올 경우, 후보군에서 적절한 사람을 선정하여 추천･통보<br>※지역사회보장협의체의 경우 대표협의체를 통한 이사추천후보자명단이 확정되었을 경우, 업무의 효율성을 고려하여 실무협의체가 중심이 되어 추천 가능(법인 이사추천위원회 등)<br>수요조사 이외에 추천 요청하는 경우(예측치 못한 선임사유 발생의 경우 또는 수요조사에 비해 추천 인원이 증가하는 경우 등)：추천 요청을 받은 후 가장 가까운 정기회의를 통해 추천자 결정･통보. 또는 정기회의가 요청 후 30일 이내에 없는 경우에는 서면 회의를 통해 추천을 진행하는 방안 검토<br>※ 실질적인 추천방법 및 절차는 위의 내용을 참고하여 지자체 여건에 맞게 업무처리지침으로 정함<\/td><\/tr><\/table><div class=\"ln p\">법인의 추천 요청<\/div><div class=\"ln p\">-법인은 추천 이사 선임 사유가 발생한 날부터 15일 이내에 법인의 주사무소가 소재하는 지역의 시･도사회보장위원회 또는 지역사회보장협의체 중 한 기관에 이사 추천을 요청하는 것이 원칙으로 함<\/div><div class=\"ln note\">※선임 사유란 전임 이사의 임기 만료, 전임 이사의 사임, 전임 이사의 해임, 이사 증원에 따른 신규 선임 등 법인이 외부추천이사를 선임해야 하는 모든 경우를 의미<\/div><div class=\"ln note\">※다만, 선임 사유가 사전에 예측할 수 있는 경우(전임 이사의 임기 만료)에는 원활한 추천을 위해 임기 만료 3개월 전부터 추천을 요청할 수 있도록 함(영 제8조의2제1항 단서)<\/div><div class=\"pchip\" id=\"p28\"><span>원문 28쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=34\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">-어느 기관에 추천을 요청할 것인지는 법인이 자체적으로 결정할 사항이나, 법인을 지도･감독하는 지자체에서는 행정업무 분담 차원에서 일정한 기준*을 정할 수 있음<\/div><div class=\"ln p\">*예시：법인의 주사무소에 소재하는 지역사회보장협의체에 우선 요청하는 것을 원칙으로 함<\/div><div class=\"ln p\">- 법인이 이사 추천을 요청할 때는 서면(공문)으로 하되 공문에는 법인명, 주요 사업, 선임 대상 이사 수 등을 반드시 명기하고 법인의 설립 취지, 목적 사업의 내용, 이사가 갖추어야 할 사항 등 추천에 참고할 수 있는 자료를 첨부하도록 함(영 제8조의2 제1항)<\/div><div class=\"ln note\">※이사가 갖추어야 할 사항으로는 사회복지사업 관련 경력자, 아동복지분야 전문가, 노인복지분야 전문가 등 법인 측에서 이사의 자질로 요구하는 사항을 상세히 설명<\/div><div class=\"ln note\">※추천 요청에 관한 별도의 서식은 없으며, 추천기관에서 업무처리 편의에 따라 별도의 양식을 정할 수 있음. 별도로 정하는 양식이 없는 경우 아래 예시 참조<\/div><div class=\"ln p\">-법인이 추천을 요청하는 단계에서 이사회 의결을 거쳐 요청할 것인지는 법인의 정관에서 자율적으로 정하도록 함<\/div><div class=\"ln note\">※ 다만, 추천받은 사람 중 이사를 선임할 때는 반드시 이사회 의결을 거쳐야 함<\/div><div class=\"ln p\">추천 이사의 선임<\/div><div class=\"ln p\">- 법인은 그 배수로 추천받은 자 중에서 법인의 이사로 선임<\/div><div class=\"ln p\">- 추천받은 이사가 「사회복지사업법」 제19조의 결격사유에 해당하거나, 취임 승낙을 하지 않는 경우 등 선임이 불가능한 경우에 한하여 추천 재요청을 허용하되, 이 경우에는 추천기관과 협의<\/div><div class=\"ln note\">※ 재요청 절차는 법령상 추천 요청 절차에 준하여 하도록 함<\/div><div class=\"ln note\">※ 추천기관은 재추천 요청에 대비하여 후순위자를 내정해 둘 수 있음<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>외부추천이사를 선임하지 않거나 교체하지 않는 경우 조치 방향(예시)<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">현원이 5명인 법인이 외부추천이사를 선임하지 않은 경우<br>-법인 이사회 정수(7명) 부족으로 이사회 개최 불가(제18조제1항), 의결사항 불승인, 임시이사선임(제22조의3제1항)<br>기존이사 임기만료시 외부추천이사로 교체하지 않은 경우<br>- 시정요구(제22조제2항), 기존이사 해임명령(제22조제1항제4호), 직무집행정지(제22조의2제1항)<\/td><\/tr><\/table><div class=\"ln p\">- 관련 분야의 전문가가 아니라는 사유 등 법인이 원하지 않은 후보라는 사유로 재추천을 요청할 수 없으며, 추천기관도 이를 허용해서는 안됨<\/div><div class=\"ln note\">※특히 노골적으로 후보자의 취임 미승낙을 유도하기 위해 과도한 선임절차 등을 두는 경우, 이는 사실상의 선임거부행위로 「사회복지사업법」 제18조제2항 위반으로 간주<\/div><div class=\"pchip\" id=\"p29\"><span>원문 29쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=35\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">- 추천 이사 선임 절차는 다른 이사 선임 절차와 동일(취임승낙서, 이력서, 특수관계부존재각서 등을 받고 이사회 의결을 통해 선임)<\/div><div class=\"ln p\">-법 제20조에 따라 결원 이사는 2개월 이내에 보충하여야 하므로, 기간 내 추천 이사를 선임할 수 있도록 조치<\/div><div class=\"ln p\">-추천 이사를 선임한 후에는 시･도지사에 법인 임원 임면보고를 해야 하고, 보고 시에는 다음의 서류를 반드시 첨부(규칙 제10조)<\/div><div class=\"ln p\">① 선임을 결의한 이사회 회의록 사본, ② 임원의 취임승낙서, ③ 이력서,④ 추천기관으로부터 받은 추천서 ⑤ 특수관계부존재각서, ⑥ 결격사유 부존재 각서(’19.6.12.시행)<\/div><div class=\"ln p\">추천 이사의 임기만료<\/div><div class=\"ln p\">-임기가 만료된 외부추천이사가 해당 법인의 선임이사로 추천절차 없이 연임하는 경우에는 더 이상 외부추천이사가 아니므로 새로운 외부추천이사를 선임하여야 함<\/div><div class=\"ln p\">-임기가 만료된 외부추천이사가 외부추천이사로 연임하기 위해서는 반드시 최초 선임 시와 동일한 추천절차를 거쳐야 함<\/div><div class=\"ln note\">※ 추천절차 없이 외부추천이사를 연임시키는 경우, 「사회복지사업법」 제18조제2항 위반<\/div><div class=\"pchip\" id=\"p30\"><span>원문 30쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=36\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">&lt;추천 요청 공문 양식(예시)&gt; ※ 다음 양식은 법령 사항이 아니며, 지자체별･법인별 특성에 맞게 변경하여 사용 가능 수신자 ○○○ 지역사회보장협의체 (또는 △△△ 사회보장위원회) 제목：사회복지법인 ○○○ 이사 추천 요청 ------------------------------------------------------------------- 「사회복지사업법」 제18조제2항 및 동법 시행령 제8조의2 등에 따라 다음과 같이 이사의 추천을 요청하오니, 적임자를 추천하여 주시기 바랍니다. 1. 법 인 명：사회복지법인 ○○○ 2. 주요사업：아동복지시설(○○○, △△, □□□) 운영 등 3. 선임하여야 하는 이사 수：2명 (3배수이므로 6명 추천 요청) ※ 정관상 정수： 4. 기타：○○○ 붙임：법인의 설립취지 설명서 1부법인의 목적사업 설명서 1부추천 요청 이사의 자격요건 설명서 1부.  끝. 사회복지법인 ○○○             (법인직인) 사회복지법인 ○○○ 대표이사 (직인) ------------------------------------------------------------------- 담당자：                              결재자 : 연락처：<\/div><div class=\"pchip\" id=\"p31\"><span>원문 31쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=37\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) 이사회의 기능(공익법인법 제7조)<\/div><div class=\"ln p\">법인의 예산, 결산, 차입금 및 재산의 취득･처분과 관리에 관한 사항<\/div><div class=\"ln p\">정관의 변경에 관한 사항<\/div><div class=\"ln p\">법인의 합병･해산에 관한 사항<\/div><div class=\"ln p\">임원의 임면에 관한 사항<\/div><div class=\"ln p\">수익사업에 관한 사항<\/div><div class=\"ln p\">기타 법령이나 정관에 의하여 그 권한에 속하는 사항<\/div><div class=\"ln h4\">4) 이사회의 소집(공익법인법 제8조)<\/div><div class=\"ln p\">이사회의 소집권자<\/div><div class=\"ln p\">-원칙：이사회는 이사장이 소집하고 그 의장이 됨<\/div><div class=\"ln p\">-예외：이사장이 궐위되거나 이를 기피함으로써 7일 이상 이사회의 소집이 불가능한 때에는 재적이사 과반수의 찬동으로 시･도지사의 승인을 받아 이를 소집할 수 있음<\/div><div class=\"ln p\">➝ 궐위 또는 기피시에는 정관이 정하는 이사가 이사회를 주재<\/div><div class=\"ln note\">※시･도지사의 승인을 얻고자 할 때에는 승인신청서에 ① 이사회의 소집이 불가능한 사유와 이를 증명하는 서류, ② 재적이사 과반수의 찬동을 증명하는 서류, ③ 이사회를 소집하지 못함으로 인해 예상되는 손해의 구체적인 사실을 증명하는 서류를 첨부하여 시･도지사에 제출<\/div><div class=\"ln note\">※이사회 소집에 대한 시･도지사의 승인은 이사장의 궐위나 기피가 명백하고 법인운영에 긴급한 이사회 의결이 필요한 안건이 있는 경우에 한함<\/div><div class=\"ln p\">이사회 소집이 가능한 경우<\/div><div class=\"ln p\">① 이사장이 필요하다고 인정한 때(직권소집)<\/div><div class=\"ln p\">② 재적이사 과반수 이상이 회의의 목적을 제시하여 소집을 요구할 때<\/div><div class=\"ln p\">③법인의 감사가 법인의 업무와 재산상황을 감사한 결과, 불법 또는 부당한 점이 있음을 발견하여 이를 이사회에 보고하기 위해 이사회의 소집을 요구할 때<\/div><div class=\"ln p\">➝ ②, ③의 경우 소집요구일로부터 20일 이내에 이사회를 소집<\/div><div class=\"ln note\">※이사회를 소집할 때에는 적어도 회의 7일전에 회의의 목적을 명시하여 각 이사 및 감사에게 통지하여야 함. 다만, 이사 전원이 집회하고 또 그 전원이 이사회의 소집을 요구할 때에는 그러하지 아니함<\/div><div class=\"pchip\" id=\"p32\"><span>원문 32쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=38\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">궐위, 사임, 해임 등으로 인해 이사의 정원이 7명 미만일 경우에는 법 제18조제1항을 위반하는 이사회가 되므로 이사회 개최나 의결의 효력이 없음<\/div><div class=\"ln p\">-임시이사를 통해 정관 상 정수를 충족시킨 후 개최<\/div><div class=\"ln p\">* 사임, 해임, 임기만료된 이사는 이사로서의 자격이 없음. 이러한 경우 정수에 결원이 발생됨<\/div><div class=\"ln h4\">5) 의결정족수(공익법인법 제9조)<\/div><div class=\"ln p\">이사회의 의사는 정관에 특별한 규정이 없는 한 재적이사 과반수의 찬성으로 의결<\/div><div class=\"ln p\">표결 및 발언권 등에 있어 각 이사는 평등한 의결권을 가지며, 이사회의 의사는 서면결의에 의할 수 없음<\/div><div class=\"ln note\">※법인의 의사는 이사회를 통하여 결정되며, 이사회의 의사는 이사회 소집 후 정관에 의한 의결에 의해 결정됨<\/div><div class=\"ln p\">이사회의 의결은 대한민국 국민인 이사가 출석이사의 과반수가 되어야 함<\/div><div class=\"ln p\">이사의 의결권은 대리하여 행사할 수 없음<\/div><div class=\"ln note\">※「사회복지사업법」에서는 이사회의 결의와 관하여 특별한 규정을 두고 있지 않아 「사회복지사업법」 제32조에 따라 「공익법인의 설립･운영에 관한 법률」이 준용됨<\/div><div class=\"ln p\">-「공익법인의 설립･운영에 관한 법률」 제9조제3항은 이사회의 의사는 서면결의에 의할 수 없다고 규정함. 따라서 이사 본인이 직접 서면결의를 하는 것도 금지하는 취지에 비추어 보면, 이사 대리인의 선임을 통하여 의사를 표시하는 방법으로 결의하는 것은 더욱 허용되기 어려울 것이므로 대리인을 선임하여 표결권을 행사하는 것은 허용되지 않음 (2022 실무자를 위한 비영리･공익 법인 관리･감독 업무 편람 p.329.)<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>사회복지법인 온라인 이사회 운영 관련<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">「공익법인법」 제9조제3항에 따라 법령상 서면결의를 금지하는 목적은 이사들의 충분한 토론과 의견교환을 보장하려는 것으로서,<br>-한 장소에 모이는 행위가 아니더라도 ① 이사회 출석을 요하는 자가 동시 참여, ② 참여자가 누구인지 확인 가능, ③참여자 상호 간 의견교환이 가능할 것의 요건을 모두 충족하는 경우,<br>- 개인식별이 가능한* 원격 통신 수단(영상회의 등)을 통해 온라인 이사회가 상시적으로 허용(법무부 유권해석, ’20.12월)<br>* (변경 전) 대면으로 이사회 개최 → (변경 후) 출석 및 결의가 이사의 동일성을 확인할 수 있는 경우 비대면으로 이사회 진행 가능<br>※이 경우, 법인은 주무관청의 지도･감독 및 분쟁소지 해소를 위해 영상회의를 녹화하여 보관할 것<\/td><\/tr><\/table><div class=\"pchip\" id=\"p33\"><span>원문 33쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=39\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>이사회 소집 관련 참조 판례<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">&lt;대법원 1994.9.23 선고 94다35084 판결&gt;<br>사회복지법인의 이사회가 특정 이사에게 적법한 소집통지를 하지 아니하여 그 이사가 출석하지 아니한 채 개최되었다면 그 이사회결의는 무효<br>&lt;대법원 2005.5.18 선고 2004마916 판결&gt;<br>사회복지법인의 정관에 이사회의 소집통지시 ʻ회의의 목적사항ʼ을 명시하도록 정하고 있음에도, 일부 이사가 참석하지 않은 상태에서 소집통지서에 회의의 목적사항으로 명시한 바 없는 안건에 관하여 이사회가 결의하였다면, 적어도 그 안건과 관련하여서는 불출석한 이사에 대하여는 정관에서 규정한 바대로의 적법한 소집통지가 없었던 것과 다를 바 없으므로 그 결의 역시 무효<br>&lt;대법원 2008.7.10. 선고 2007다78159 판결&gt;<br>사회복지법인 이사회 소집통지 당시에 명시되지 아니한 이사해임안건이 이사회에 상정된 경우, 당해 이사를 포함한 재적이사 전원이 출석하였다는 사정만으로 소집절차 위반의 하자가 치유될 수 없음<\/td><\/tr><\/table><div class=\"ln h4\">6) 이사회 회의록의 작성 및 공개(법 제25조, 영 제10조의4, 제10조의5)<\/div><div class=\"ln p\">이사회는 다음의 사항을 회의록에 기재함<\/div><div class=\"ln p\">-개의, 회의 중지 및 산회 일시, 안건, 의사, 출석한 임원의 성명, 표결수, 그 밖에 대표이사가 작성할 필요가 있다고 인정하는 사항<\/div><div class=\"ln p\">회의록 작성이 어려운 경우, 우선 안건별로 회의조서를 작성하고 조속한 시일 내에 회의록을 작성할 수 있다.<\/div><div class=\"ln p\">출석임원 전원이 회의록 및 회의조서 마지막 장에 날인함<\/div><div class=\"ln p\">-회의록 및 회의조서가 2매 이상인 경우에는 출석임원 전원이 간인(間印)함<\/div><div class=\"ln p\">-마지막 장의 날인 방법은 다음 방법 중 하나를 선택하여 날인<\/div><div class=\"ln p\">① 인감, ② 기명란에 자필 서명 후 일반 날인, ③ 기명란에 기명 후 날인 부분에 자필 서명<\/div><div class=\"ln note\">※ ②의 경우 간인은 자필서명 또는 일반날인으로 가능<\/div><div class=\"ln note\">※ 법인의 감사 전원은 이사회 참석여부와 무관하게 이사회 회의록에 기명날인하여야 함(「공익법인법」 제10조제1항제2호)<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>자필 서명의 진정성 확인 방법<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">자필 서명의 진정성 확인을 위해 「본인서명사실 확인 등에 관한 법률」 제2조제3호에 따른 확인서를 통해 자필 서명의 진정성 확인 가능<br>재산출연증서, 임원 취임승낙서, 특수관계 부존재 각서, 결격사유 부존재 각서, 모든 회의록 및 회의조서 등에 기재한 자필 서명 전부 해당<br>단, 재산출연 시 또는 임원 취임 시 확인서를 원본으로 제출했고 이후 확인서 내용이 변경되지 않은 경우 해당 원본 또는 사본으로 제출 및 확인 가능<\/td><\/tr><\/table><div class=\"pchip\" id=\"p34\"><span>원문 34쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=40\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">회의록의 공개<\/div><div class=\"ln p\">-공개기간：회의일부터 10일 이내에 게시하여 게시일로부터 3개월간 공개<\/div><div class=\"ln p\">-공개장소:사회복지법인의 인터넷 홈페이지(전부 공개되는 카페나 블로그도 가능)와 관할 시･도지사가 지정하는 인터넷 홈페이지(예:시･도 홈페이지 또는 관련 협의회, 단체 홈페이지 등)에 각각 공개<\/div><div class=\"ln p\">-공개기간 이후에도 회의록 공개를 청구할 수 있는 자(공개청구)：① 해당 사회복지법인의 종사자, ② 해당 사회복지법인이 설치･운영하는 시설의 종사자, ③ 해당 사회복지법인의 서비스 이용자 또는 법인이 설치･운영하는 시설의 이용자, ④ 해당 사회복지법인이 설치･운영하는 시설의 거주자 또는 거주자의 보호자<\/div><div class=\"ln note\">※보조금을 받는 사회복지법인은 「공공기관의 정보공개에 관한 법률」상 공공기관에 해당하므로, 위 규정과 관계없이 누구든 정보(회의록)공개를 청구할 수 있음 (「공공기관의 정보공개에 관한 법률」 제2조, 제5조, 같은 법 시행령 제2조제5호)<\/div><div class=\"ln note\">※공개청구를 받은 경우, 비공개 사항에 해당하지 않으면 10일 이내에 공개. 단, 공개청구의 내용이 공개 사항과 비공개 사항이 섞여 있는 경우에는 분리하여 공개가 가능한 사항만 공개<\/div><div class=\"ln p\">회의록의 비공개사항(「공공기관의 정보공개에 관한 법률」 제9조제1항제4호부터 제8호 준용)<\/div><div class=\"ln p\">①진행중인 재판에 관련된 정보와 범죄의 예방, 수사, 공소의 제기 및 유지, 형의 집행, 교정, 보안처분에 관한 사항으로서 공개될 경우 그 직무수행을 현저히 곤란하게 하거나 형사피고인의 공정한 재판을 받을 권리를 침해한다고 인정할 만한 상당한 이유가 있는 정보<\/div><div class=\"ln p\">②감사･감독･검사･시험･규제･입찰계약･기술개발･인사관리･의사결정과정 또는 내부검토과정에 있는 사항 등으로서 공개될 경우 업무의 공정한 수행이나 연구･개발에 현저한 지장을 초래한다고 인정할 만한 상당한 이유가 있는 정보<\/div><div class=\"ln p\">③당해 정보에 포함되어 있는 이름･주민등록번호 등 개인에 관한 사항으로서 공개될 경우 개인의 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 정보. 다만, 다음에 열거한 개인에 관한 정보는 제외한다.<\/div><div class=\"ln h3\">가. 법령이 정하는 바에 따라 열람할 수 있는 정보<\/div><div class=\"ln p\">나.사회복지법인이 공표를 목적으로 작성하거나 취득한 정보로서 개인의 사생활의 비밀과 자유를 부당하게 침해하지 않는 정보<\/div><div class=\"ln p\">다.사회복지법인이 작성하거나 취득한 정보로서 공개하는 것이 공익 또는 개인의 권리구제를 위하여 필요하다고 인정되는 정보<\/div><div class=\"pchip\" id=\"p35\"><span>원문 35쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=41\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h3\">라. 직무를 수행한 사회복지법인 임직원의 성명･직위<\/div><div class=\"ln p\">마.공개하는 것이 공익을 위하여 필요한 경우로써 법령에 의하여 국가 또는 지방자치단체가 업무의 일부를 위탁 또는 위촉한 개인의 성명･직업<\/div><div class=\"ln p\">④법인･단체 또는 개인(이하 “법인등”이라 한다)의 경영･영업상 비밀에 관한 사항으로서 공개될 경우 법인등의 정당한 이익을 현저히 해할 우려가 있다고 인정되는 정보. 다만, 다음에 열거한 정보를 제외한다.<\/div><div class=\"ln p\">가.사업활동에 의하여 발생하는 위해로부터 사람의 생명･신체 또는 건강을 보호하기 위하여 공개할 필요가 있는 정보<\/div><div class=\"ln p\">나.위법･부당한 사업활동으로부터 국민의 재산 또는 생활을 보호하기 위하여 공개할 필요가 있는 정보<\/div><div class=\"ln p\">⑤공개될 경우 부동산 투기･매점매석 등으로 특정인에게 이익 또는 불이익을 줄 우려가 있다고 인정되는 정보<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">이사(理事)<\/div><div class=\"pchip\" id=\"p36\"><span>원문 36쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=42\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">1) 이사의 의의<\/div><div class=\"ln p\">이사는 법인을 대표하고 법인의 업무를 집행하는 필수기관임(「민법」 제58･59조)<\/div><div class=\"ln p\">이사의 정수는 대표이사를 포함한 7인 이상이고, 임기는 3년(연임가능, 제18조)<\/div><div class=\"ln note\">※이사의 수는 정관으로 정하며, 상한은 없으나 의사결정의 효율성 등을 감안하여 15인 이하(공익법인법 제5조 참조)로 규정하도록 지도<\/div><div class=\"ln h4\">2) 이사의 직무<\/div><div class=\"ln p\">이사는 선량한 관리자의 주의로 충실하게 그 직무를 행해야하며, 이사가 그 임무를 게을리 한 때에는 법인에 대하여 연대하여 손해배상의 책임이 있음(「민법」 제61･65조)<\/div><div class=\"ln p\">가) 법인의 대표(대외적 권한)<\/div><div class=\"ln p\">-이사는 법인의 사무에 관하여 각자 법인을 대표하므로(「민법」 제59조) 이사의 행위는 대외적으로 법인의 행위로서 인정됨(대표하는 사무에는 제한이 없음)<\/div><div class=\"ln p\">➝이사의 대표권에 대한 제한 가능(「민법」 제59조) 제한은 반드시 정관에 기재하여야 하며 정관에 기재하지 않은 대표권의 제한은 무효임(「민법」 제41조)<\/div><div class=\"ln note\">※정관에 기재한 경우에도 이를 등기하여야만 제3자에 대항할 수 있으므로(「민법」 제60조) 제･개정된 정관은 최대한 빠른 시일 내에 반드시 등기하도록 지도<\/div><div class=\"ln p\">➝법인과 이사의 이익이 상반하는 사항에 관하여는 이사는 대표권이 없으며 이 경우 이해관계인 또는 검사의 청구에 의하여 법원이 선임하는 특별대리인이 법인을 대표(「민법」 제64조)<\/div><div class=\"ln note\">※일정 사항에 대해 일부 이사와 법인의 이익이 상반되는 경우에는 동 사항의 결정에 있어 해당 이사를 의사결정과정에서 배제한 후 나머지 이사들이 법인을 대표하도록 하고 특별대리인의 선임은 해당 이사를 배제하였을 경우 정족수 부족 등으로 이사회 성립이 불가능할 경우에만 예외적으로 실시할 것<\/div><div class=\"ln p\">나) 법인의 업무집행(대내적 권한)<\/div><div class=\"ln p\">➝이사는 법인의 모든 내부적 사무를 집행할 권한이 있으며, 정관에 다른 규정이 없으면 법인의 사무집행은 이사의 과반수로써 결정함(「민법」 제58조)<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">감사(監事)<\/div><div class=\"pchip\" id=\"p37\"><span>원문 37쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=43\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">1) 감사의 의의 및 자격<\/div><div class=\"ln p\">감사는 법인의 재산이나 업무집행상태의 적정 여부를 조사･감독하는 기관으로 필수기관임<\/div><div class=\"ln p\">감사의 정수는 2인 이상이어야 하며 그 임기는 2년으로 연임할 수 있음(법 제18조)<\/div><div class=\"ln p\">감사는 이사와 시행령 제9조의 “특별한 관계에 있는 자”가 아니어야 하며 감사 중 1명은 법률 또는 회계에 관한 지식이 있는 사람 중에서 선임하여야 함<\/div><div class=\"ln note\">※ 참고：특별한 관계에 있는 자의 범위(「사회복지사업법 시행령」 제9조) ➩ p.27 참고<\/div><div class=\"ln p\">감사 선임 당시 법인(법인이 설치･운영하는 사회복지시설을 포함함)의 직전 3회계연도의 세입 금액*(기본재산 및 출연금 제외) 평균이 30억 원 이상인 법인은 감사 중 1명을 시･도지사의 추천을 받아 「주식회사 등의 외부감사에 관한 법률」에 따른 감사인에 속한 사람(이하 ‘전문가 감사’)으로 선임해야 함(법 제18조제7항, 영 제10조)<\/div><div class=\"ln p\">* 사회복지법인의 회계에 속한 법인회계, 시설회계, 수익사업 회계 상 세입의 총합<\/div><div class=\"ln p\">-법인은 전문가 감사를 선임해야 하는 경우 법인의 주사무소가 소재하는 시･도지사에 추천을 요청하고, 요청을 받은 시･도지사는 감사를 추천하여야 함<\/div><div class=\"ln note\">※시･도지사는 법인에 적합한 감사를 추천할 수도 있고 법인에 감사 선임 후보자 명단을 제공하는 방법으로도 추천을 수행할 수 있음<\/div><div class=\"ln note\">※시･도지사는 감사 추천시 법인측과 충분히 논의하여 적임자를 추천할 수 있도록 유의하고, 필요시 한국공인회계사회 등에 협조 요청 (한국공인회계사회에서 비상임 감사 추천 또는 추천 대상자 명단 제공 가능)<\/div><div class=\"ln p\">- 시도지사의 추천을 받아 선임한 외부감사의 임기가 만료된 외부감사를 연임하기 위해서는 반드시 최초 선임시와 동일한 추천절차를 거쳐야 함<\/div><div class=\"ln p\">-「공인회계사법」 제23조에 따른 회계법인에 속한 공인회계사 또는 「공인회계사법」 제41조에 따라 설립된 한국공인회계사회에 총리령으로 정하는 바에 따라 등록을 한 감사반에 속한 공인회계사를 감사로 선임하여야 함<\/div><div class=\"ln p\">-직전 3회계연도는 전임 감사의 임기 만료 또는 사임･해임 등으로 감사를 선임해야 할 때, 그 시점을 기준으로 직전 3년을 의미<\/div><div class=\"pchip\" id=\"p38\"><span>원문 38쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=44\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>전문가 감사 선임과 관련한 세입 계산 방법<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">감사를 2월에 선임하는 등의 사유로 직전년도 결산 보고가 완료되지 않은 경우, 직전년도의 세입은 추정치로 계산할 것<br>(예) ʼ18년 2월에 감사선임 시, 최근 3개년도(ʼ15, ʼ16, ʼ17년)의 세입 금액 평균을 산출<\/td><\/tr><\/table><div class=\"ln p\">-세입 금액은 「사회복지법인 및 사회복지시설 재무･회계규칙」에 따른 세입 결산서상 세입 총액(기본재산 및 출연금 제외)을 기준으로 함<\/div><div class=\"ln h4\">2) 감사의 직무(공익법인법 제10조)<\/div><div class=\"ln p\">가) 대내적 직무<\/div><div class=\"ln p\">①법인의 업무와 재산상황을 감사하는 일 및 이사에 대하여 이에 필요한 자료의 제출 또는 의견을 요구하고 이사회에서 발언하는 일<\/div><div class=\"ln p\">② 이사회의 회의록에 기명 날인하는 일<\/div><div class=\"ln note\">※ 법인의 감사 전원은 이사회 참석여부와 무관하게 이사회 회의록에 기명날인하여야 함<\/div><div class=\"ln p\">③ 법인의 업무와 재산상황에 대하여 이사에게 의견을 진술하는 일<\/div><div class=\"ln p\">④법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때 이를 이사회에 보고하는 일<\/div><div class=\"ln p\">⑤ ④의 보고를 하기 위하여 필요한 때에는 이사회의 소집을 요구하는 일<\/div><div class=\"ln note\">※ ①, ④의 직무수행을 위해 이사회 소집 시 반드시 감사에게도 사전에 이사회 소집목적, 날짜, 시간, 장소를 통보해야 함<\/div><div class=\"ln p\">나) 대외적 직무<\/div><div class=\"ln p\">①법인의 직무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때에는 지체없이 시도지사에 이를 보고하여야 함<\/div><div class=\"ln p\">②이사가 법인의 목적범위외의 행위를 하거나 기타 이 법 또는 이 법에 의한 명령이나 정관에 위반하는 행위를 하여 법인에게 현저한 손해를 발생하게 할 우려가 있는 때에는 그 이사에 대하여 직무행위를 유지(留止)할 것을 법원에 청구할 수 있음<\/div><div class=\"pchip\" id=\"p39\"><span>원문 39쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=45\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">임원의 임면(任免)<\/div><div class=\"ln p\">이사의 임면방법은 정관의 필요적 기재사항이며(법 제17조) 따라서 정관에 의하여 정하여짐<\/div><div class=\"ln h4\">1) 임원의 임면보고(법 제18조, 규칙 제10조)<\/div><div class=\"ln p\">공익법인법 제5조는 임원 취임시 주무관청의 승인을 받도록 되어 있으나 「사회복지사업법」에서는 이를 보고로 갈음하고 있음<\/div><div class=\"ln p\">법인은 임원을 임면하는 경우 법인임원임면보고서(붙임 16)에 아래의 서류를 첨부하여 관할 시･도지사에게 제출하여야 함<\/div><div class=\"ln p\">-당해 임원의 선임(연임) 또는 해임을 결의한 이사회 회의록 사본 1부<\/div><div class=\"ln p\">-취임승낙서, 이력서 각 1부<\/div><div class=\"ln p\">-기관으로부터 받은 이사추천서 1부(외부추천이사에 한함)<\/div><div class=\"ln p\">-특수관계부존재 각서 1부<\/div><div class=\"ln p\">-결격사유부존재 각서 1부(’19.6.12.시행)<\/div><div class=\"ln p\">이사의 성명･주소는 등기사항이며(「민법」 제49조) 이를 등기하지 않으면 이사의 선임･해임･퇴임을 가지고 제3자에게 대항할 수 없음(「민법」 제54조)<\/div><div class=\"ln h4\">2) 임원선임 관련 금품 등 수수 금지(법 제18조의2, 법 제54조제1호의2, ʼ18.4.25.시행)<\/div><div class=\"ln p\">임원의 선임과 관련하여 금품, 향응 또는 그 밖의 재산상 이익을 주고받거나 주고받을 것을 약속하는 경우, 법 제54조제1호의4에 따라 1년 이하의 징역 또는 1천만원 이하의 벌금에 해당<\/div><div class=\"ln note\">※주무관청에서는 임원의 임면보고를 받을 시, 변경되는 임원이 「사회복지사업법」 제18조 등에서 규정하고 있는 바를 충족하는 자인지, 그 임원을 선임한 이사회가 정상적으로 개최된 이사회인지 여부 등에 대하여 면밀하게 검토<\/div><div class=\"ln p\">‑검토결과 문제의 소지가 있는 경우, 해당 사회복지법인에 소명을 요구하고, 필요한 경우 해당 임원에 대한 직무집행정지 또는 해임명령 등 검토<\/div><div class=\"ln note\">※시･도에서 법인의 임원 임면보고를 받거나, 임시이사를 선임하는 경우에는 본 지침 &lt;사회복지법인 Q&amp;A 모음&gt;의 ‘11. 법인 임원의 결격사유 조회 관련’을 참고하기 바람<\/div><div class=\"pchip\" id=\"p40\"><span>원문 40쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=46\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) 임원의 결격사유(법 제19조)<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>1. 미성년자<br>1의2. 피성년후견인 또는 피한정후견인<br>1의3. 파산선고를 받고 복권되지 아니한 사람<br>1의4. 법원의 판결에 따라 자격이 상실되거나 정지된 사람<br>1의5.금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 3년이 지나지 아니한 사람<br>1의6. 금고 이상의 형의 집행유예를 선고받고 그 유예기간 중에 있는 사람<br>1의7.제1호의5 및 제1호의6에도 불구하고 사회복지사업 또는 그 직무와 관련하여 「아동복지법」 제71조, 「보조금 관리에 관한 법률」 제40조부터 제42조까지, 「지방재정법」 제97조, 「영유아보육법」 제54조제2항제1호, 「장애아동 복지지원법」 제39조제1항제1호 또는 「형법」 제28장･제40장(제360조는 제외한다)의 죄를 범하거나 이 법을 위반하여 다음 각 목의 어느 하나에 해당하는 사람<br>가. 100만원 이상의 벌금형을 선고받고 그 형이 확정된 후 5년이 지나지 아니한 사람<br>나. 형의 집행유예를 선고받고 그 형이 확정된 후 7년이 지나지 아니한 사람<br>다.징역형을 선고받고 그
