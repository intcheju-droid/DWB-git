차에 따라 세입･세출예산에 편성하여 사용하고, 가급적 적립･이월하지 않고 회계연도 내에 집행할 수 있도록 노력<\/div><div class=\"ln p\">후원금을 이월하거나 타 회계로 전출할 경우, 그 세입이 후원금이라는 것을 반드시 명시해야 하며, 이에 따라 이월･전출된 후원금은 후원금 관리기준에 따라 사용하여야 함(별표 1~3 참고)<\/div><div class=\"pchip\" id=\"p148\"><span>원문 148쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=154\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※ [별표 1] 법인회계 세입예산과목구분 중<\/div><table class=\"htbl\"><tr><td colspan=\"6\">과  목<\/td><td rowspan=\"2\">내  역<\/td><\/tr><tr><td colspan=\"2\">관<\/td><td colspan=\"2\">항<\/td><td colspan=\"2\">목<\/td><\/tr><tr><td rowspan=\"2\">08<\/td><td rowspan=\"2\">이월금<\/td><td rowspan=\"2\">81<\/td><td rowspan=\"2\">이월금<\/td><td>811<\/td><td>전년도이월금<\/td><td>전년도 불용액으로서 이월된 금액<\/td><\/tr><tr><td>812<\/td><td>전년도이월금(후원금)<\/td><td>전년도 후원금에 대한 불용액으로서 이월된 금액<\/td><\/tr><\/table><div class=\"ln note\">※ [별표 2] 법인회계 세출예산과목구분 중<\/div><table class=\"htbl\"><tr><td colspan=\"6\">과  목<\/td><td rowspan=\"2\">내  역<\/td><\/tr><tr><td colspan=\"2\">관<\/td><td colspan=\"2\">항<\/td><td colspan=\"2\">목<\/td><\/tr><tr><td rowspan=\"2\">04<\/td><td rowspan=\"2\">전출금<\/td><td rowspan=\"2\">41<\/td><td rowspan=\"2\">전출금<\/td><td>411<\/td><td>○○시설전출금<\/td><td>법인이 유지･경영하는 시설에 대한 부담금을 시설별로 목을 설정함<\/td><\/tr><tr><td>412<\/td><td>○○시설전출금<br>(후원금)<\/td><td>법인이 유지･경영하는 시설에 대한 부담금(후원금)을 시설별로 목을 설정<\/td><\/tr><\/table><div class=\"ln note\">※ [별표 3] 시설회계 세입예산과목구분 중<\/div><table class=\"htbl\"><tr><td colspan=\"6\">과  목<\/td><td rowspan=\"2\">내  역<\/td><\/tr><tr><td colspan=\"2\">관<\/td><td colspan=\"2\">항<\/td><td colspan=\"2\">목<\/td><\/tr><tr><td rowspan=\"2\">08<\/td><td rowspan=\"2\">전입금<\/td><td rowspan=\"2\">81<\/td><td rowspan=\"2\">전입금<\/td><td>811<\/td><td>법인전입금<\/td><td>법인으로부터의 전입금(국가 및 지방자치단체의 보조금은 제외함)<\/td><\/tr><tr><td>812<\/td><td>법인전입금(후원금)<\/td><td>법인으로부터의 전입금(후원금)<\/td><\/tr><tr><td rowspan=\"2\">09<\/td><td rowspan=\"2\">이월금<\/td><td rowspan=\"2\">91<\/td><td rowspan=\"2\">이월금<\/td><td>911<\/td><td>전년도이월금<\/td><td>전년도 불용액으로서 이월된 금액<\/td><\/tr><tr><td>912<\/td><td>전년도이월금(후원금)<\/td><td>전년도 후원금에 대한 불용액으로서 이월된 금액<\/td><\/tr><\/table>", "pages": [{"p": 139, "t": "6\n후원금의 관리\n가\n후원금의 접수\n1) 후원금의 범위 등\n정의：아무런 대가없이 무상으로 받은 금품이나 그 밖의 자산\n※ 「사회복지사업법」 제45조\n법인의 대표이사와 시설의 장은 후원금의 수입･지출 내용을 공개하여야 하며 그 관리에 명확성이 확보되도록 하여야 하고,\n후원금에 관한 영수증 발급, 수입 및 사용결과 보고 등을 하지 않은 경우 300만원 이하의 과태료를 부과함\n※ 「사회복지사업법」 제45조, 제58조 및 「사회복지사업법 시행령」 제26조\n※최근 사회복지법인 및 사회복지시설에서의 후원금 부정･부당 사용, 횡령 등 사례가 수사기관을 통해 반복적으로 적발되고 있음에도 불구하고, 지자체에서의 과태료 처분 사례는 거의 확인되지 않고 있는 바, 법인시설 관할 지자체에의 엄정한 법 집행 차원에서 후원금 사용과 관련한 위법사례가 확인될 경우 과태료 처분 등을 통해 법인･시설의 투명성을 제고할 것\n※사회복지법인은 「법인세법 시행령」 제39조제1항제1호가목에 따른 ‘공익법인(구 지정기부금단체)’에 해당하며, 같은 조 제6항 및 「법인세법 시행규칙」 제19조제1항에 따라 의무이행 여부 등을 사업연도 종료일부터 4개월 이내에 국세청(관할세무서)에 보고하여야 함\n*사회복지법인은 의무이행의 규정의 적용대상이 아니었으나, 법인세법령 개정에 따라 ’20년도부터(’19.1.1.이후 개시하는 사업연도 분에 대하여) 매년 4월 이내에 「사회복지사업법」상 주무관청인 시･도지사에게 보고 필요\n(「법인세법 시행령」 제36조(현행 제39조) 개정(’18.2.13.) 및 「법인세법 시행규칙」 제18조의2(현행 제19조) 개정(’18.3.21.개정))\n주의"}, {"p": 140, "t": "참고 | 「기부금품의 모집 및 사용에 관한 법률」 질의 회신<행안부 민간협력과-1292(’23.11.17.)호>\n |  | \n |  | 질의내용 - 사회복지사업법상 사회복지법인 및 사회복지시설의 운영자가 적극적 모금행위 없이 사회복지사업법에 따라 법인 또는 시설 운영을 위해 후원금을 수령할 경우 이에 대해 기부금품법상 모집자 등록, 모집계획 제출 등의 절차를 지켜야 하는지 여부 답변사항 -  「기부금품의 모집･사용 및 기부문화 활성화에 관한 법률」 제5조제2항에 따르면 “국가나 지방자치단체 및 그 소속 기관․공무원과 국가 또는 지방자치단체에서 출자․출연하여 설립된 법인․단체는 자발적으로 기탁하는 금품이라도 법령에 다른 규정이 있는 경우 외에는 이를 접수할 수 없다.”라고 규정되어 있습니다. - 따라서, 사회복지사업법상 사회복지법인 및 사회복지시설이 국가 또는 지방자치단체에서 출자․출연하여 설립된 단체 등이 아닌 경우, 적극적인 모집행위* 없이 자발적으로 기탁된 금품을 접수하는 때에는 기부금품 모집등록 관련 절차를 이행하지 않아도 될 것으로 판단됩니다. * 서신, 광고, 그 밖의 방법으로 기부금품의 출연을 타인에게 의뢰･권유 또는 요구하는 행위(「기부금품법」 제2조제3호) - 다만, 기부금품법 제4조에 따라 기부금품을 모집하려는 경우 등록청에 모집등록하여야 합니다\n2) 후원금 영수증 발급\n법인의 대표이사와 시설장은 후원금을 받은 때에는 「소득세법 시행규칙」 제101조제20호의2 또는 「법인세법 시행규칙」 제82조제7항3호의3에서 정하는 기부금영수증 서식에 따라 후원금 영수증을 발급･후원자에게 교부\n금융기관 또는 체신관서의 계좌입금을 통해 후원금을 받는 경우에는 법인 명의 또는 시설명칭이 부기된 시설장 명의의 후원금전용계좌를 사용해야 함\n※ 이 경우 후원자가 원하는 경우를 제외하고는 영수증 발급 생략할 수 있음\n3) 후원금 전용계좌의 개설\n법인 및 시설에서 후원금을 받을 때는 각각의 법인 및 시설별로 후원금 전용계좌를 구분하여 사용하고, 미리 후원자에게 후원금 전용계좌 등의 구분에 관한 사항을 반드시 안내(「사회복지법인 및 사회복지시설 재무･회계 규칙」 제41조의4)"}, {"p": 141, "t": "※후원금전용계좌에서 발생하는 이자도 후원금의 성격을 가지는 금액으로 후원금 관리 기준에 따라 사용하여야 함\n➝ 시설･법인회계로 세입처리 시, 해당 세입과목 비고란에 후원금전용계좌에서 발생한 이자임을 표기하고 비지정후원금 사용기준에 부합하게 사용할 것\n※ʼ13.11월 안전행정부에서 실시한 「취약 계층 복지 실태 기획 감찰」 결과에 따르면, 후원자가 법인과 시설을 동일체로 인식하여 시설입소자를 위한 목적으로 법인에 기탁하는 경향이 높은 것으로 조사됨\n※지자체는 법인으로 하여금 후원금이 시설 입소자들의 복리증진을 위한 용도로 사용될 수 있도록 시설에의 「법인 전입금(후원금)」 비율을 확대하도록 하게끔 권고할 것\n나\n후원금의 관리\n1) 후원금 발급 목록 장부 비치\n후원금을 받은 때에는 후원금 영수증 교부 후 발급목록을 별도 장부로 관리하여 비치\n〔후원금 영수증 발급 대장〕\n연번 | 일시 | 후원자(법인) | 후원금 유형 및 금액 | 지정후원금 용도 | 비고\n지정 | 비지정\n<예시> 1 | <예시> 2013.1.25 | <예시> 000법인 | <예시> 500,000원 |  | <예시> 아동급식지원 | \n2 | 2013.1.30 | 000 |  | 100,000원 |  | \n |  |  |  |  |  | \n |  |  |  |  |  | \n2) 후원금의 수입 및 사용내용 통보\n대표이사와 시설장은 연 1회 이상 해당 후원금의 수입 및 사용내용을 후원금을 낸 법인･단체 또는 개인에게 통보\n법인이 발행하는 정기간행물 또는 홍보지 등을 이용하여 일괄통보 가능하며 후원자 각각에게 개별통보도 가능"}, {"p": 142, "t": "3) 후원금의 수입 및 사용결과 보고･공개\n대표이사와 시설장은 관할 시장･군수･구청장에게 결산보고서를 제출할 때 후원금수입 및 사용결과보고서를 함께 제출\n-이 경우 반드시 전자파일로 제출하여야 하며 출력한 보고서도 추가 제출 가능\n※ 변경된 후원금 수입 및 사용결과보고서(별지제19호) 양식은 2013년도 후원금부터 적용\n※(주의) 후원금 수입 및 사용결과보고서(별지제19호, p.224)의 3. 후원금 사용명세서의 ‘사용내역’란에는 법인･시설별 세출예산과목구분표상의 목이나 내역 수준으로 구체적인 사항을 반드시 기재하고, 지원대상자의 실명 등 민감정보가 기입되지 않도록 개인정보보호에 유의하여야 함\n시장･군수･구청장은 제출받은 후원금의 수입 및 사용결과 보고서를 제출받은 날부터 20일 이내에 인터넷(시･군･구 홈페이지) 등을 통하여 3개월간 공개\n같은 기간 동안 법인의 대표이사 및 시설의 장도 후원금수입 및 사용결과 보고서를 법인 및 시설의 게시판과 인터넷 홈페이지에 공개\n※ 단, 후원자 성명(법인의 경우 그 명칭)은 공개하지 말 것\n각 시･군･구 및 시･도는 법인과 시설의 후원금 수입 및 사용결과 보고 및 공개 의무를 사전에 충분히 안내하고 사후에 철저히 지도･감독\n후원금 수입 및 사용결과 보고･공개 의무 위반 시 300만원 이하의 과태료 부과\n※후원금 보고･공개가 미흡하므로 후원금수입 및 사용결과 보고 및 공개 업무 철저 필요(’12.6 감사원, “사회복지시설 후원금 등 관리실태” 감사 지적사항)\n※「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 통하여 후원금수입 및 사용결과보고서를 게시하는 경우, 시･군･구, 법인 및 시설 홈페이지에 공고한 것으로 갈음\n4) 후원금의 용도 외 사용 금지\n※ 후원금을 다음에서 정하고 있는 용도에 위반하여 사용한 경우 법 제45조제2항에서 위임한 재무회계규칙을 위반한 것이 됨\n➝ 이는 시행령 [별표 5] 과태료 2. 개별기준 중 파목에 해당되어 과태료 300만원 처분대상임\n※사회복지시설이 후원금을 다음에서 정하고 있는 용도에 위반하여 사용한 경우 이는 법 제40조제1항제4호에도 해당함\n➝ 이는 시행규칙 [별표4] 행정처분 2. 개별기준 중 4호 가목에 해당되어 1차 위반시 개선명령, 2차 위반시부터 시설장 교체 처분대상임\n※후원금 용도 위반이 적발된 경우 보조금 지급 대상자 선정 시에 이를 반드시 감안토록 할 것(2017년 국무조정실 부패예방감시단 지적사항)"}, {"p": 143, "t": "법인의 대표이사와 시설의 장은 후원금을 후원자가 지정한 용도 이외로 사용할 수 없음\n※다만, 지정후원금의 15%는 후원금 모집, 관리, 운영, 사용, 결과보고 등에 필요한 비용으로 사용 가능. 단, 사회복지법인 어린이재단을 통한 지정후원금 및 생활자에 대한 결연후원금은 제외\n※지정후원금은 기탁서에 다음과 같은 기준에 모두 부합되는 용도를 명시한 경우에 한해서 지정후원금으로 인정(2017년 국무조정실 부패예방감시단 지적사항)\n①지정용도가 「사회복지법인 및 사회복지시설 재무･회계 규칙」 별표 2, 별표 4, 별표 6, 별표 8, 별표 10의 세출 ʻʻ목ʼʼ 수준으로 상세하게 명시하되, 가급적 내역수준으로 구체적인 용도가 지정되도록 할 것\n‑ʻʻ법인･시설의 운영ʼʼ 등과 같이 용도를 포괄적으로 지정한 경우, 비지정후원금의 사용 기준에 따라 관리하여야 함\n②사회복지법인에 후원하는 경우 그 지정용도가 해당 사회복지법인의 권리･행위능력의 범위 내일 것\n‑예컨대, 사회복지법인이 수행할 수 없는 사업(의료기관 개설 등)을 수행하라는 취지의 용도는 「사회복지사업법」 상 후원금으로 볼 수 없음\n※사회복지시설정보시스템에 기탁내용(후원약속사항)이 등록된 경우에만 회계 반영이 가능하도록 함(ʼ18년 하반기)\n※<참고> 모금기관*에서 받은 배분금에 대한 회계처리 기준\n‑지정후원금 인정은 원칙적으로 후원자로부터 받은 <기탁서>에 용도가 세출예산 “목” 수준으로 상세히 명시되어야 가능하나,\n‑모금기관으로부터 배분금을 받는 경우에는 기탁서를 발부하지 않으므로, 기탁서 대신 구체적인 용도가 지정된 공문 및 사업계획서, 계약서 등(또는 공모 공고문, 수행기관 선정 공문)을 근거로 하여 <지정후원금>으로 회계처리\n* 사회복지공동모금회, 한국사회복지협의회\n후원자가 용도를 지정하지 않은 후원금에 대해서는 법인 운영비 및 시설 운영비로 사용하되, 다음 기준에 따라 사용할 것\n |  | \n | 〔비지정후원금의 사용 기준〕 후원자가 사용 용도를 지정하지 않은 비지정후원금은 법인 운영비 및 시설 운영비로 사용하되, 간접비로 사용하는 비율은 50%*를 초과하지 못함 ※ 간접비 사용 비율 50%는 당해연도 후원금 수입금액이 아닌, 지출금액을 기준으로 함 다만, 간접비 중에서도 업무추진비(기관운영비, 직책보조비, 회의비), 법인회계전출금, 부채상환금, 잡지출, 예비비 등으로는 사용 금지(구체적인 내용은 후면 참고) ※ 업무추진비 중 후원금 모집 등을 위한 운영비, 회의비는 당해연도 비지정후원금 지출금액의 15%범위 내에서 사용 가능 자산취득비로 사용하는 것은 원칙적으로 금지하나, 토지･건물을 제외하고 시설 운영에 필요한 집기, 장비 등은 구입 가능 ※ 다만, 주무관청이 승인하는 경우에 한해 비지정 후원금으로 법인 사옥 마련을 위한 토지･건물 취득은 가능 ※ 토지･건물은 부동산으로서 기본재산에 해당하므로, 비지정후원금으로 사옥 마련을 위한토지･건물을 취득하고자 하는 경우 기본재산 처분허가 신청과 함께 비지정후원금 사용 승인여부도 주무관청에 문의하여야함 ※ 주무관청은 토지･건물 구입 목적이 사옥 마련용인지, 회계 처리에 문제가 없는지 등을 확인하고, 승인 이후 정관상 기본재산으로 취득한 토지･건물을 등록하고 실제 사옥으로 사용하는지 등을 점검하여야함. 법인은 추후 감사 시 지적을 받지 않도록 관련 자료, 이사회 의결서 등 증빙 자료를 정리･보관할 것을 권고 시설비는 건물 노후화, 정원대비 협소한 공간 등 시설 입소･이용자의 불편을 해소하기 위하여 시설 신축, 증･개축이 필요하다고 인정되는 경우에는 관할 주무관청의 승인을 받아 사용 가능 인건비로 사용 가능하되, 후원금으로 직원 수당을 지급하는 경우에는 근로기준법 또는 ʻʻ사회복지시설 종사자 가이드라인ʼʼ에서 정하고 있는 수당(명절휴가비, 시간외근무수당, 가족수당), 사회복지업무수당(다만 사회복지공무원에게 지급되는 수당 이상을 초과할 수 없으며 전체 비지정후원금의 50% 한도 내에서만 수당 지급 가능)과 지방자치단체에서 별도로 정하고 있는 수당에 한하여 편성･지급해야 함을 원칙으로 함. 다만, 개별 사회복지법인 및 사회복지시설에서는 지방자치단체와 협의하여 수당 항목을 추가로 정할 수 있음 ※사회복지업무수당이란 종사자 처우 개선을 위한 특수업무수당, 직무수당, 종사자 장려수당, 종사자 복지수당 등 ※ 종사자 처우 관련 수당을 이미 지급하고 있는 시･도 또는 시･군･구의 경우 기존대로 지급 ※분기별 정산 원칙으로, 전(前)분기에서 수령한 비지정 후원금의 50% 이내에서 현(現)분기에 사회복지업무수당 지급 가능하며 필요시 지자체와 협의 하에 조정 가능 | \n |  | "}, {"p": 145, "t": "※ 비지정후원금 사용을 위한 법인 운영비 구분\n과  목 | 직접비 | 간접비 | 비  고\n관 | 항 | 목 | \n사무비 | 인건비 | ◦급여 ◦제수당 ◦일용잡급 ◦퇴직금 및 퇴직적립금 ◦사회보험부담금 ◦기타 후생경비 |  | 수당은 근로기준법 또는 이 지침에서 정하고 있는 수당, 사회복지업무수당 (다만 사회 복지공무원에게 지급되는 수당 이상을 초과 할 수 없으며 전체 비지정후원금의 50% 한도 내에서만 수당 지급 가능) 및 지방자치단체에서 별도로 정하고 있는 수당에 한함. 다만, 지방자치단체와 협의하여 수당 항목을 추가로 정할 수 있음\n업무추진비 |  | ◦기관운영비 ◦직책보조비 ◦회의비 | 사용불가(다만, 15%이내에서 후원금 모집을 위한 회의비, 운영비로 사용가능)\n운영비 | ◦공공요금 ◦차량비 ◦연료비 ◦여비 ◦수용비 및 수수료 ◦제세공과금 | ◦기타 운영비 | \n재산조성비 | 시설비 | ◦시설장비유지비 | ◦시설비 ◦자산취득비 | 시설비는 시설 신축, 증･개축이 필요 하다고 인정되는 경우에는 관할 주무관청의 승인을 받아 사용 가능 자산취득비는 토지, 건물을 제외한 시설 운영에 필요한 집기, 장비 등 구입 가능\n사업비 | 일반사업비 | ◦○○사업비 |  | 단, 수익사업 사업비로는 사용 불가\n전출금 | 전출금 | ◦○○시설 전출금 |  | \n과년도지출 | 과년도지출 |  | ◦과년도지출 | \n상환금 | 부채상환금 |  | ◦원금상환금 ◦이자지급금 | 사용불가\n잡지출 | 잡지출 |  | ◦잡지출 | 사용불가\n예비비 및 기타 | 예비비 및 기타 |  | ◦예비비 ◦반환금 | 사용불가"}, {"p": 146, "t": "※ 비지정후원금 사용을 위한 시설 운영비 구분\n‑세출예산과목은 시설유형에 따라 별표4 또는 별표6 적용"}, {"p": 147, "t": "과  목 | 직접비 | 간접비 | 비  고\n관 | 항 | 목 | \n사무비 | 인건비 | ◦급여 ◦제수당 ◦일용잡급 ◦퇴직금 및 퇴직적립금 ◦사회보험부담금 ◦기타 후생경비 |  | 수당은 근로기준법 또는 이 지침 에서 정하고 있는 수당, 사회 복지업무수당(다만 사회 복지 공무원에게 지급 되는 수당 이상을 초과 할 수 없으며 전체 비지정후원 금의 50% 한도 내에서만 수당 지급 가능) 및 지방 자치단체에서 별도로 정하고 있는 수당에 한함. 다만, 지방자치단체와 협의 하여 수당 항목을 추가로 정할 수 있음\n업무추진비 |  | ◦기관운영비 ◦직책보조비 ◦회의비 | 사용불가(다만, 15%이내 에서 후원금 모집을 위한 회의비, 운영비로 사용가능)\n운영비 | ◦공공요금 ◦차량비 ◦여비 ◦수용비 및 수수료 ◦제세공과금 | ◦기타 운영비 | \n재산조성비 | 시설비 | ◦시설장비 유지비 | ◦시설비 ◦자산취득비 | 시설비는 시설 신축, 증･개축이 필요 하다고 인정되는 경우에는 관할 주무관청의 승인을 받아 사용 가능 자산취득비는 토지, 건물을 제외한 시설 운영에 필요한 집기, 장비 등 구입 가능\n사업비 | 운영비 | ◦생계비 ◦수용기관경비 ◦피복비 ◦의료비 ◦장의비 ◦직업재활비 ◦자활사업비 ◦특별급식비 ◦연료비 |  | \n교육비 | ◦수업료 ◦학용품비 ◦도서구입비 ◦교통비 ◦급식비 ◦학습지원비 ◦수학여행비 ◦교복비 ◦이미용비 ◦기타 교육비 |  | \n○○사업비 | ◦○○사업비 |  | \n전출금 | 전출금 |  | ◦법인회계전출금 | 사용불가\n과년도지출 | 과년도지출 |  | ◦과년도지출 | \n상환금 | 부채상환금 |  | ◦원금상환금 ◦이자지불금 | 사용불가\n잡지출 | 잡지출 |  | ◦잡지출 | 사용불가\n예비비 및 기타 | 예비비 및 기타 |  | ◦예비비 ◦반환금 | 사용불가\n적립금 | 운영충당 적립금 |  | ◦운영충당적립금 | 사용불가\n준비금 | 환경개선 준비금 |  | ◦시설환경개선준비금 | 사용불가\n후원금은 예산의 편성 및 확정절차에 따라 세입･세출예산에 편성하여 사용하고, 가급적 적립･이월하지 않고 회계연도 내에 집행할 수 있도록 노력\n후원금을 이월하거나 타 회계로 전출할 경우, 그 세입이 후원금이라는 것을 반드시 명시해야 하며, 이에 따라 이월･전출된 후원금은 후원금 관리기준에 따라 사용하여야 함(별표 1~3 참고)"}, {"p": 148, "t": "※ [별표 1] 법인회계 세입예산과목구분 중\n과  목 | 내  역\n관 | 항 | 목\n08 | 이월금 | 81 | 이월금 | 811 | 전년도이월금 | 전년도 불용액으로서 이월된 금액\n812 | 전년도이월금(후원금) | 전년도 후원금에 대한 불용액으로서 이월된 금액\n※ [별표 2] 법인회계 세출예산과목구분 중\n과  목 | 내  역\n관 | 항 | 목\n04 | 전출금 | 41 | 전출금 | 411 | ○○시설전출금 | 법인이 유지･경영하는 시설에 대한 부담금을 시설별로 목을 설정함\n412 | ○○시설전출금 (후원금) | 법인이 유지･경영하는 시설에 대한 부담금(후원금)을 시설별로 목을 설정\n※ [별표 3] 시설회계 세입예산과목구분 중\n과  목 | 내  역\n관 | 항 | 목\n08 | 전입금 | 81 | 전입금 | 811 | 법인전입금 | 법인으로부터의 전입금(국가 및 지방자치단체의 보조금은 제외함)\n812 | 법인전입금(후원금) | 법인으로부터의 전입금(후원금)\n09 | 이월금 | 91 | 이월금 | 911 | 전년도이월금 | 전년도 불용액으로서 이월된 금액\n912 | 전년도이월금(후원금) | 전년도 후원금에 대한 불용액으로서 이월된 금액"}]}, {"title": "7. 감사의 실시", "start": 149, "end": 150, "html": "<div class=\"pchip\" id=\"p149\"><span>원문 149쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=155\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">7<\/span>감사의 실시<\/div><div class=\"ln p\">법인의 감사는 당해 법인과 시설에 대하여 매년 1회 이상 감사를 실시<\/div><div class=\"ln p\">시설장과 수입원 및 지출원이 사망하거나 경질된 때에는 그 관장에 속하는 수입, 지출, 재산, 물품 및 현금 등의 관리상황을 감사함<\/div><div class=\"ln note\">※감사를 실시할 때에는 전임자가 참관해야 하며, 전임자가 참관할 수 없으면 관계 직원 중에서 전임자의 전임자나 법인의 대표이사가 지정한 사람이 참관해야 함<\/div><div class=\"ln p\">감사 후 감사보고서를 작성하여 법인 이사회에 보고하며, 재산상황 또는 업무집행에 관하여 부정 또는 불비한 점이 발견된 때에는 시･군･구청장에게 보고<\/div>", "pages": [{"p": 149, "t": "7\n감사의 실시\n법인의 감사는 당해 법인과 시설에 대하여 매년 1회 이상 감사를 실시\n시설장과 수입원 및 지출원이 사망하거나 경질된 때에는 그 관장에 속하는 수입, 지출, 재산, 물품 및 현금 등의 관리상황을 감사함\n※감사를 실시할 때에는 전임자가 참관해야 하며, 전임자가 참관할 수 없으면 관계 직원 중에서 전임자의 전임자나 법인의 대표이사가 지정한 사람이 참관해야 함\n감사 후 감사보고서를 작성하여 법인 이사회에 보고하며, 재산상황 또는 업무집행에 관하여 부정 또는 불비한 점이 발견된 때에는 시･군･구청장에게 보고"}]}, {"title": "[붙임] 재무·회계규칙(全文)", "start": 151, "end": 238, "html": "<div class=\"pchip\" id=\"p151\"><span>원문 151쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=157\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2026년 사회복지법인 관리안내･Ministry of Health &amp; Welfare<\/div><div class=\"pchip\" id=\"p153\"><span>원문 153쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=159\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">「사회복지법인 및 사회복지시설 재무･회계규칙」(全文)<\/div><div class=\"ln p\">붙 임<\/div><div class=\"ln p\">「사회복지법인 및 사회복지시설 재무･회계 규칙」<\/div><div class=\"ln p\">제    정 1988. 2. 8. 보건사회부령     제813호<\/div><div class=\"ln p\">일부개정 1993.12.27. 보건사회부령     제922호<\/div><div class=\"ln p\">일부개정 1998. 1. 7. 보건복지부령     제 57호<\/div><div class=\"ln p\">일부개정 1999. 3.11. 보건복지부령     제 98호<\/div><div class=\"ln p\">일부개정 2005. 7.15. 보건복지부령     제323호<\/div><div class=\"ln p\">타법개정 2008. 3. 3. 보건복지가족부령 제  1호<\/div><div class=\"ln p\">일부개정 2009. 2. 5. 보건복지가족부령 제 91호<\/div><div class=\"ln p\">타법개정 2010. 3.19. 보건복지부령     제  1호<\/div><div class=\"ln p\">일부개정 2012. 8. 7. 보건복지부령     제152호<\/div><div class=\"ln p\">타법개정 2012. 8.31. 보건복지부령     제269호<\/div><div class=\"ln p\">타법개정 2015. 1. 5. 보건복지부령     제283호<\/div><div class=\"ln p\">일부개정 2015.12.24. 보건복지부령     제377호<\/div><div class=\"ln p\">일부개정 2017. 2.14. 보건복지부령     제480호<\/div><div class=\"ln p\">일부개정 2018. 3.30. 보건복지부령     제565호<\/div><div class=\"ln p\">타법개정 2018.12.28. 보건복지부령     제606호<\/div><div class=\"ln p\">일부개정 2019. 6.12. 보건복지부령     제642호<\/div><div class=\"ln p\">타법개정 2019. 9.27. 보건복지부령     제672호<\/div><div class=\"ln p\">일부개정 2020. 1. 7. 보건복지부령     제701호<\/div><div class=\"ln p\">일부개정 2020. 5. 6. 보건복지부령     제724호<\/div><div class=\"ln p\">일부개정 2021. 9.30. 보건복지부령     제831호<\/div><div class=\"ln p\">일부개정 2022.12.28. 보건복지부령     제928호<\/div><div class=\"ln p\">제1장 총칙<\/div><div class=\"ln p\">제1조(목적) 이 규칙은 「사회복지사업법」 제23조제4항, 제34조제4항, 제45조제2항 및 제51조제2항에 따라 사회복지법인 및 사회복지시설의 재무ㆍ회계, 후원금관리 및 회계감사에 관한 사항을 규정하여 재무ㆍ회계, 후원금관리 및 회계감사의 명확성ㆍ공정성ㆍ투명성을 기함으로써 사회복지법인 및 사회복지시설의 합리적인 운영에 기여함을 목적으로 한다. &lt;개정 2012. 8. 7., 2019. 6. 12.&gt;<\/div><div class=\"ln p\">[전문개정 2005. 7. 15.]<\/div><div class=\"ln p\">제2조(재무ㆍ회계운영의 기본원칙) 사회복지법인(이하 “법인”이라 한다) 및 사회복지시설(법인이 설치ㆍ운영하는 사회복지시설을 포함하며, 이하 “시설”이라 한다)의 재무ㆍ회계는 그 설립목적에 따라 건전하게 운영되어야 한다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"pchip\" id=\"p154\"><span>원문 154쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=160\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제2조의2(다른 법령과의 관계) 법인 및 시설의 재무 및 회계 처리에 관하여 다른 법령에 특별한 규정이 있는 경우를 제외하고는 이 규칙이 정하는 바에 따른다.<\/div><div class=\"ln p\">[본조신설 2012. 8. 7.]<\/div><div class=\"ln p\">제3조(회계연도) 법인 및 시설의 회계연도는 정부의 회계연도에 따른다. 다만, 「영유아보육법」 제2조에 따른 어린이집의 회계연도는 매년 3월 1일에 시작하여 다음 연도 2월 말일에 종료한다. &lt;개정 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">제4조(회계연도 소속구분) 법인 및 시설의 수입 및 지출의 발생과 자산 및 부채의 증감ㆍ변동에 관하여는 그 원인이 되는 사실이 발생한 날을 기준으로 하여 연도소속을 구분한다. 다만, 그 사실이 발생한 날을 정할 수 없는 경우에는 그 사실을 확인한 날을 기준으로 하여 연도소속을 구분한다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">제5조(출납기한) 1회계연도에 속하는 법인 및 시설의 세입ㆍ세출의 출납은 회계 연도가 끝나는 날까지 완결하여야 한다. &lt;개정 1993. 12. 27., 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">[제목개정 1998. 1. 7.]<\/div><div class=\"ln p\">제6조(회계의 구분) ① 이 규칙에서의 회계는 법인의 업무전반에 관한 회계(이하 “법인회계”라 한다), 시설의 운영에 관한 회계(이하 “시설회계”라 한다) 및 법인이 수행하는 수익사업에 관한 회계(이하 “수익사업회계”라 한다)로 구분한다.<\/div><div class=\"ln p\">② 법인의 회계는 법인회계, 해당 법인이 설치ㆍ운영하는 시설의 시설회계 및 수익사업회계로 구분하여야 하며, 시설의 회계는 해당 시설의 시설회계로 한다.<\/div><div class=\"ln p\">[전문개정 2012. 8. 7.]<\/div><div class=\"ln p\">제6조의2(정보통신매체에 의한 재무ㆍ회계처리) ① 법인 및 시설의 재무ㆍ회계는 컴퓨터 회계프로그램으로 처리할 수 있다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">② 보건복지부장관은 법인 및 시설의 재무ㆍ회계업무의 효율성 및 투명성을 높이기 위하여 「사회복지사업법」 제6조의2제2항에 따른 정보시스템으로서 법인 및 시설의 재무회계를 처리하기 위한 정보시스템을 구축ㆍ운영할 수 있다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">③ 보건복지부장관, 시ㆍ도지사, 시장(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」 제11조제2항에 따른 행정시장을 포함한다. 이하 같다)ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)은 법인 또는 시설에 대하여 제2항에 따른 시스템을 사용할 것을 권장할 수 있다. &lt;신설 2012. 8. 7., 2015. 12. 24., 2018. 3. 30.&gt;<\/div><div class=\"pchip\" id=\"p155\"><span>원문 155쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=161\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">④ 「사회복지사업법」 제42조에 따른 보조금을 받는 법인 및 시설과 보조금을 받지 아니하는 시설로서 「노인복지법」 제31조에 따른 노인복지시설 중 「노인장기요양보험법」 제31조에 따라 장기요양기관으로 지정받은 시설(이하 “노인장기요양기관”이라 한다)은 제1항에 따른 컴퓨터 회계프로그램 중 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템 또는 제2항에 따른 정보시스템을 사용하여 재무ㆍ회계를 처리하여야 한다. 다만, 보건복지부장관이 정하는 법인 및 시설은 그러하지 아니하다. &lt;신설 2012. 8. 7., 2018. 3. 30.&gt;<\/div><div class=\"ln p\">⑤ 제1항에 따른 컴퓨터 회계프로그램 또는 제2항에 따른 시스템에 의하여 전자장부를 사용하는 경우에는 제24조에 따른 회계장부를 둔 것으로 본다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">[본조신설 2005. 7. 15.]<\/div><div class=\"ln p\">[시행일] 제6조의2제4항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.<\/div><div class=\"ln p\">1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일<\/div><div class=\"ln p\">4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일<\/div><div class=\"ln p\">제2장 예산과 결산<\/div><div class=\"ln p\">제1절 예산<\/div><div class=\"ln p\">제7조(세입ㆍ세출의 정의) 1회계연도의 모든 수입을 세입으로 하고, 모든 지출을 세출로 한다.<\/div><div class=\"pchip\" id=\"p156\"><span>원문 156쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=162\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제8조(예산총계주의원칙) 세입과 세출은 모두 예산에 계상하여야 한다.<\/div><div class=\"ln p\">[전문개정 1998. 1. 7.]<\/div><div class=\"ln p\">제9조(예산편성지침) ① 법인의 대표이사는 제2조의 취지에 따라 매 회계연도 개시 1월전까지 그 법인과 해당 법인이 설치ㆍ운영하는 시설의 예산편성 지침을 정하여야 한다. &lt;개정 1998. 1. 7., 2012. 8. 7.&gt;<\/div><div class=\"ln p\">② 법인 또는 시설의 소재지를 관할하는 시장ㆍ군수ㆍ구청장은 특히 필요하다고 인정되는 사항에 관하여는 예산편성지침을 정하여 매 회계연도 개시 2월전까지 법인 및 시설에 통보할 수 있다. &lt;개정 1998. 1. 7., 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">[제목개정 2012. 8. 7.]<\/div><div class=\"ln p\">제10조(예산의 편성 및 결정절차) ① 법인의 대표이사 및 시설의 장은 예산을 편성하여 각각 법인 이사회의 의결 및 「사회복지사업법」 제36조에 따른 운영위원회 또는 「영유아보육법」 제25조에 따른 어린이집운영위원회(이하 “시설운영위원회”라 한다)에의 보고를 거쳐 확정한다. 다만, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐 확정한다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">② 법인의 대표이사 및 시설의 장은 제1항에 따라 확정한 예산을 매 회계연도 개시 5일전까지 관할 시장ㆍ군수ㆍ구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. &lt;개정 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">③ 제1항에 따라 예산을 편성할 경우 법인회계와 시설회계의 예산은 별표 1부터 별표 4까지에 따른 세입ㆍ세출예산과목 구분에 따라 편성해야 한다. 다만, 다음 각 호의 시설은 각 호에서 정하는 바에 따라 편성한다. &lt;개정 2009. 2. 5., 2010. 3. 19., 2012. 8. 7., 2018. 3. 30., 2022. 12. 28.&gt;<\/div><div class=\"ln p\">1. 다음 각 목의 시설: 별표 5 및 별표 6에 따른 세입ㆍ세출예산과목 구분에 따라 편성<\/div><div class=\"ln h3\">가. 「사회복지사업법」 제34조의5에 따른 사회복지관<\/div><div class=\"ln h3\">나. 「노인복지법」 제36조제1항제1호에 따른 노인복지관<\/div><div class=\"ln h3\">다. 「장애인복지법」 제58조제1항제2호에 따른 장애인 지역사회재활시설<\/div><div class=\"ln h3\">라. 「아동복지법」 제44조의2에 따른 다함께돌봄센터<\/div><div class=\"ln h3\">마. 「아동복지법」 제52조제1항제8호에 따른 지역아동센터<\/div><div class=\"ln h3\">바. 그 밖에 보건복지부장관이 정하여 고시하는 시설<\/div><div class=\"ln p\">2. 「영유아보육법」 제2조에 따른 어린이집: 별표 7 및 별표 8에 따른 세입ㆍ세출예산과목 구분에 따라 편성<\/div><div class=\"pchip\" id=\"p157\"><span>원문 157쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=163\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">3. 노인장기요양기관: 별표 9의 세입예산과목 구분 및 별표 10의 세출예산과목 구분에 따라 편성하되, 세출예산을 편성하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성<\/div><div class=\"ln p\">4. 삭제 &lt;2012. 8. 7.&gt;<\/div><div class=\"ln p\">④ 시장ㆍ군수ㆍ구청장은 제2항에 따라 예산을 제출받은 때에는 20일 이내에 법인과 시설의 회계별 세입ㆍ세출명세서를 시(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」 제10조제2항에 따른 행정시를 포함한다. 이하 같다)ㆍ군ㆍ구(자치구를 말한다. 이하 같다)의 게시판과 인터넷 홈페이지에 20일 이상 공고하고, 법인의 대표이사 및 시설의 장으로 하여금 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고하도록 하여야 한다. &lt;개정 2009. 2. 5., 2012. 8. 7., 2018. 3. 30.&gt;<\/div><div class=\"ln p\">⑤ 제4항에 따른 공고는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하거나 「영유아보육법」 제49조의2제1항에 따라 공시하는 것으로 갈음할 수 있다. &lt;개정 2015. 12. 24.&gt;<\/div><div class=\"ln p\">[전문개정 1998. 1. 7.]<\/div><div class=\"ln p\">제11조(예산에 첨부하여야 할 서류) ① 예산에는 다음 각 호의 서류가 첨부되어야 한다. 다만, 단식부기로 회계를 처리하는 경우에는 제1호ㆍ제2호ㆍ제5호 및 제6호의 서류만을 첨부할 수 있고, 국가ㆍ지방자치단체ㆍ법인 외의 자가 설치ㆍ운영하는 시설로서 거주자 정원 또는 일일평균 이용자가 20명 이하인 시설(이하 “소규모 시설”이라 한다)은 제2호, 제5호(노인장기요양기관의 경우만 해당한다) 및 제6호의 서류만을 첨부할 수 있으며, 「영유아보육법」 제2조에 따른 어린이집은 보건복지부장관이 정하는 바에 따른다. &lt;개정 1993. 12. 27., 2012. 8. 7., 2018. 3. 30., 2019. 9. 27., 2020. 1. 7.&gt;<\/div><div class=\"ln p\">1. 예산총칙<\/div><div class=\"ln p\">2. 세입ㆍ세출명세서<\/div><div class=\"ln p\">3. 추정재무상태표<\/div><div class=\"ln p\">4. 추정수지계산서<\/div><div class=\"ln p\">5. 임직원 보수 일람표<\/div><div class=\"ln p\">6. 예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록 사본<\/div><div class=\"ln p\">② 제1항제2호부터 제5호까지의 서류는 별지 제1호서식부터 별지 제4호서식까지에 따른다. 다만, 노인장기요양기관의 장이 첨부해야 하는 제1항제5호의 임직원 보수 일람표는 별지 제4호의2서식에 따른다. &lt;개정 2018. 3. 30., 2020. 1. 7.&gt;<\/div><div class=\"pchip\" id=\"p158\"><span>원문 158쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=164\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[시행일] 제11조제2항 단서의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.<\/div><div class=\"ln p\">1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일<\/div><div class=\"ln p\">4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일<\/div><div class=\"ln p\">제12조(준예산) 회계연도 개시전까지 법인 및 시설의 예산이 성립되지 아니한 때에는 법인의 대표이사 및 시설의 장은 시장ㆍ군수ㆍ구청장에게 그 사유를 보고하고 예산이 성립될 때까지 다음의 경비를 전년도 예산에 준하여 집행할 수 있다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">1. 임ㆍ직원의 보수<\/div><div class=\"ln p\">2. 법인 및 시설운영에 직접 사용되는 필수적인 경비<\/div><div class=\"ln p\">3. 법령상 지급의무가 있는 경비<\/div><div class=\"ln p\">제13조(추가경정예산) ① 법인의 대표이사 및 시설의 장은 예산성립후에 생긴 사유로 인하여 이미 성립된 예산에 변경을 가할 필요가 있을 때에는 제10조 및 제11조의 규정에 의한 절차에 준하여 추가경정예산을 편성ㆍ확정할 수 있다. 이 경우 노인장기요양기관의 장은 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 한다. &lt;개정 2012. 8. 7., 2018. 3. 30.&gt;<\/div><div class=\"ln p\">② 법인의 대표이사 및 시설의 장은 추가경정예산이 확정된 날로부터 7일이내에 이를 시장ㆍ군수ㆍ구청장에게 제출하여야 한다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"pchip\" id=\"p159\"><span>원문 159쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=165\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제14조(예비비) 법인의 대표이사 및 시설의 장은 예측할 수 없는 예산외의 지출 또는 예산의 초과지출에 충당하기 위하여 예비비를 세출예산에 계상할 수 있다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">[전문개정 1999. 3. 11.]<\/div><div class=\"ln p\">제15조(예산의 목적외 사용금지) 법인회계 및 시설회계의 예산은 세출예산이 정한 목적외에 이를 사용하지 못한다.<\/div><div class=\"ln p\">제16조(예산의 전용) ① 법인의 대표이사 및 시설의 장은 관ㆍ항ㆍ목간의 예산을 전용할 수 있다. 다만, 법인 및 시설(소규모 시설은 제외한다)의 관간 전용 또는 동일 관내의 항간 전용을 하려면 이사회의 의결 또는 시설운영위원회에의 보고를 거쳐야 하되, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐야 한다. &lt;개정 1998. 1. 7., 2012. 8. 7.&gt;<\/div><div class=\"ln p\">② 제1항에도 불구하고 예산총칙에서 전용을 제한하고 있거나 이사회 및 시설 예산심의과정에서 삭감한 관ㆍ항ㆍ목으로는 전용하여서는 아니 되며, 노인장기요양기관의 장은 예산을 전용하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 한다. &lt;신설 2012. 8. 7., 2018. 3. 30.&gt;<\/div><div class=\"ln p\">③ 법인의 대표이사 및 시설의 장은 제1항에 따라 관ㆍ항 간 예산을 전용한 경우에는 관할 시장ㆍ군수ㆍ구청장에게 제19조 및 제20조에 따른 결산보고서를 제출할 때에 과목 전용조서를 첨부하여야 한다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">제17조(세출예산의 이월) 법인의 대표이사 및 시설의 장은 법인회계와 시설회계의 세출예산중 경비의 성질상 당해회계연도안에 지출을 마치지 못할 것으로 예측되는 경비와 연도내에 지출원인행위를 하고 불가피한 사유로 인하여 연도내에 지출하지 못한 경비를 각각 이사회의 의결 및 시설운영위원회에의 보고를 거쳐 다음 연도에 이월하여 사용할 수 있다. 다만, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 사전 보고한 후 법인 이사회의 의결을 거쳐야 한다. &lt;개정 1998. 1. 7., 2012. 8. 7.&gt;<\/div><div class=\"ln p\">제18조(특정목적사업 예산) ① 법인의 대표이사 및 시설의 장은 완성에 수년을 요하는 공사나 제조 그밖의 특수한 사업을 위하여 2회계연도 이상에 걸쳐서 그 재원을 적립할 필요가 있는 때에는 회계연도마다 일정액을 예산에 계상하여 특정목적사업을 위한 적립금으로 적립할 수 있다. &lt;개정 2012. 8. 7., 2017. 2. 14.&gt;<\/div><div class=\"pchip\" id=\"p160\"><span>원문 160쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=166\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">② 적립금의 적립 및 사용 계획(변경된 계획을 포함한다)은 시장ㆍ군수ㆍ구청장에게 사전에 보고하여야 한다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">③ 적립금은 그 적립목적에만 사용해야 한다. 다만, 노인장기요양기관의 경우 「재난 및 안전관리 기본법」 제14조제1항에 따른 대규모 재난으로 인하여 인건비 지급이 어려운 경우로서 보건복지부장관이 정하는 기준에 해당하는 때에는 관할 시장ㆍ군수ㆍ구청장의 승인을 받아 한시적으로 인건비로 사용할 수 있다. &lt;개정 2021. 9. 30.&gt;<\/div><div class=\"ln p\">④ 시장ㆍ군수ㆍ구청장은 법인 및 시설의 재정 상태 등을 고려하여 적립금의 적립 여부, 규모 및 적립기간 등에 관하여 필요한 조치를 할 수 있다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">제2절 결산<\/div><div class=\"ln p\">제19조(결산서의 작성 제출) ① 법인의 대표이사 및 시설의 장은 법인회계와 시설회계의 세입ㆍ세출 결산보고서를 작성하여 각각 이사회의 의결 및 시설운영위원회에의 보고를 거친 후 다음 연도 3월 31일까지(「영유아보육법」 제2조에 따른 어린이집의 경우에는 5월 31일까지를 말한다) 시장ㆍ군수ㆍ구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. 다만, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐 제출하여야 한다. &lt;개정 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">② 시장ㆍ군수ㆍ구청장은 제1항에 따라 결산보고서를 제출받은 때에는 20일 이내에 법인 및 시설의 세입ㆍ세출결산서를 시ㆍ군ㆍ구의 게시판과 인터넷 홈페이지에 20일 이상 공고하고, 법인의 대표이사 및 시설의 장으로 하여금 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고하도록 하여야 한다. &lt;신설 1998. 1. 7., 2009. 2. 5., 2012. 8. 7.&gt;<\/div><div class=\"ln p\">1. 삭제 &lt;2012. 8. 7.&gt;<\/div><div class=\"ln p\">2. 삭제 &lt;2012. 8. 7.&gt;<\/div><div class=\"ln p\">③ 제2항에 따른 공고는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하거나 「영유아보육법」 제49조의2제1항에 따라 공시하는 것으로 갈음할 수 있다. &lt;개정 2015. 12. 24.&gt;<\/div><div class=\"ln p\">제20조(결산보고서에 첨부해야 할 서류) ① 결산보고서에는 다음 각 호의 서류가 첨부되어야 한다. 다만, 단식부기로 회계를 처리하는 경우에는 제1호부터 제3호까지 및 제14호부터 제23호까지의 서류만을 첨부할 수 있고, 소규모 시설의 경우에는 제1호 및 제17호의 서류(노인장기요양기관의 경우에는 제1호부터 제3호까지 및 제16호부터 제21호까지의 서류)만을 첨부할 수 있으며, 「영유아보육법」 제2조에 따른 어린이집은 보건복지부장관이 정하는 바에 따른다. &lt;개정 1993. 12. 27., 1998. 1. 7., 2012. 8. 7., 2015. 12. 24., 2019. 9. 27., 2020. 1. 7.&gt;<\/div><div class=\"pchip\" id=\"p161\"><span>원문 161쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=167\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1. 세입ㆍ세출결산서<\/div><div class=\"ln p\">2. 과목 전용조서<\/div><div class=\"ln p\">3. 예비비 사용조서<\/div><div class=\"ln p\">4. 재무상태표<\/div><div class=\"ln p\">5. 수지계산서<\/div><div class=\"ln p\">6. 현금 및 예금명세서<\/div><div class=\"ln p\">7. 유가증권명세서<\/div><div class=\"ln p\">8. 미수금명세서<\/div><div class=\"ln p\">9. 재고자산명세서<\/div><div class=\"ln p\">10. 그 밖의 유동자산명세서(제6호부터 제9호까지의 유동자산 외의 유동자산을 말한다)<\/div><div class=\"ln p\">11. 고정자산(토지ㆍ건물ㆍ차량운반구ㆍ비품ㆍ전화가입권)명세서<\/div><div class=\"ln p\">12. 부채명세서(차입금ㆍ미지급금을 포함한다)<\/div><div class=\"ln p\">13. 각종 충당금 명세서<\/div><div class=\"ln p\">14. 기본재산수입명세서(법인만 해당한다)<\/div><div class=\"ln p\">15. 사업수입명세서<\/div><div class=\"ln p\">16. 정부보조금명세서<\/div><div class=\"ln p\">17. 후원금수입 및 사용결과보고서(전산파일을 포함한다)<\/div><div class=\"ln p\">18. 후원금 전용계좌의 입출금내역<\/div><div class=\"ln p\">19. 인건비명세서<\/div><div class=\"ln p\">20. 사업비명세서<\/div><div class=\"ln p\">21. 그 밖의 비용명세서(인건비 및 사업비를 제외한 비용을 말한다)<\/div><div class=\"ln p\">22. 감사보고서<\/div><div class=\"ln p\">23. 법인세 신고서(수익사업이 있는 경우만 해당한다)<\/div><div class=\"ln p\">② 제1항제1호부터 제3호까지의 서류는 별지 제5호서식ㆍ별지 제5호의2서식부터 별지 제5호의4서식까지ㆍ별지 제6호서식 및 별지 제7호서식에 따르고, 제1항제4호 및 제5호의 서류는 별지 제2호서식 및 별지 제3호서식에 따르며, 제6호부터 제17호까지의 서류는 별지 제8호서식부터 별지 제19호서식까지에 따르고, 제19호부터 제22호까지의 서류는 별지 제20호서식부터 별지 제23호서식까지에 따른다. 다만, 노인장기요양기관의 장이 첨부해야 하는 제1항제19호의 인건비명세서는 별지 제4호의2서식에 따른다. &lt;개정 2005. 7. 15., 2012. 8. 7., 2018. 3. 30., 2020. 1. 7.&gt;<\/div><div class=\"pchip\" id=\"p162\"><span>원문 162쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=168\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[제목개정 2020. 1. 7.]<\/div><div class=\"ln p\">[시행일] 제20조제2항 단서의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.<\/div><div class=\"ln p\">1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일<\/div><div class=\"ln p\">4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일<\/div><div class=\"ln p\">제3장 회계<\/div><div class=\"ln p\">제1절 총칙<\/div><div class=\"ln p\">제21조(수입 및 지출사무의 관리) ① 법인의 대표이사와 시설의 장은 법인과 시설의 수입 및 지출에 관한 사무를 관리한다.<\/div><div class=\"ln p\">② 법인의 대표이사와 시설의 장은 수입 및 지출원인행위에 관한 사무를 각각 소속직원에게 위임할 수 있다.<\/div><div class=\"ln p\">제22조(수입과 지출의 집행기관) ① 법인과 시설에는 수입과 지출의 현금출납업무를 담당하게 하기 위하여 각각 수입원과 지출원을 둔다. 다만, 법인 또는 시설의 규모가 소규모인 경우에는 수입원과 지출원을 동일인으로 할 수 있다.<\/div><div class=\"ln p\">② 제1항의 수입원과 지출원은 각각 그 법인의 대표이사와 시설의 장이 임면한다.<\/div><div class=\"pchip\" id=\"p163\"><span>원문 163쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=169\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제23조(회계의 방법) 회계는 단식부기에 의한다. 다만, 법인회계와 수익사업회계에 있어서 복식부기의 필요가 있는 경우에는 복식부기에 의한다.<\/div><div class=\"ln p\">[전문개정 1993. 12. 27.]<\/div><div class=\"ln p\">제24조(장부의 종류) ① 법인 및 시설에는 다음의 회계장부를 둔다. &lt;개정 1998. 1. 7.&gt;<\/div><div class=\"ln p\">1. 현금출납부<\/div><div class=\"ln p\">2. 총계정원장<\/div><div class=\"ln p\">3. 삭제 &lt;2012. 8. 7.&gt;<\/div><div class=\"ln p\">4. 재산대장<\/div><div class=\"ln p\">5. 비품관리대장<\/div><div class=\"ln p\">6. 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">7. 삭제 &lt;1998. 1. 7.&gt;<\/div><div class=\"ln p\">8. 삭제 &lt;1998. 1. 7.&gt;<\/div><div class=\"ln p\">9. 삭제 &lt;1998. 1. 7.&gt;<\/div><div class=\"ln p\">10. 삭제 &lt;1998. 1. 7.&gt;<\/div><div class=\"ln p\">11. 삭제 &lt;1998. 1. 7.&gt;<\/div><div class=\"ln p\">12. 삭제 &lt;1998. 1. 7.&gt;<\/div><div class=\"ln p\">② 노인장기요양기관의 장이 제10조에 따른 예산을 기한 내에 제출하지 않은 경우에는 제1항제1호 및 제2호에 따른 회계장부(해당 회계연도 1월부터 6월까지의 회계장부를 말한다)를 해당 회계연도 8월 15일까지 시장ㆍ군수ㆍ구청장에게 정보시스템을 사용하여 제출해야 한다. &lt;신설 2018. 3. 30., 2020. 1. 7.&gt;<\/div><div class=\"ln p\">③ 노인장기요양기관의 장이 제19조에 따른 결산보고서를 기한 내에 제출하지 않은 경우에는 제1항제1호 및 제2호에 따른 회계장부(해당 회계연도의 다음 연도 1월부터 6월까지의 회계장부를 말한다)를 해당 회계연도의 다음 연도 8월 15일까지 시장ㆍ군수ㆍ구청장에게 정보시스템을 사용하여 제출해야 한다. &lt;신설 2020. 1. 7.&gt;<\/div><div class=\"ln p\">④ 제1항제1호부터 제5호까지의 규정에 따른 회계장부는 별지 제24호서식, 별지 제24호의2서식, 별지 제25호서식, 별지 제25호의2서식 및 별지 제26호서식부터 별지 제28호서식까지에 따른다. &lt;개정 2009. 2. 5., 2018. 3. 30., 2020. 1. 7.&gt;<\/div><div class=\"ln p\">[시행일] 제24조제2항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.<\/div><div class=\"ln p\">1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"pchip\" id=\"p164\"><span>원문 164쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=170\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일<\/div><div class=\"ln p\">4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일<\/div><div class=\"ln p\">제2절 수입<\/div><div class=\"ln p\">제25조(수입금의 수납) ① 모든 수입금의 수납은 이를 금융기관에 취급시키는 경우를 제외하고는 수입원이 아니면 수납하지 못한다.<\/div><div class=\"ln p\">② 수입원이 수납한 수입금은 그 다음날까지 금융기관에 예입하여야 한다. &lt;개정 1998. 1. 7.&gt;<\/div><div class=\"ln p\">③ 제1항 및 제2항의 규정에 의한 수입금에 대한 금융기관의 거래통장은 제6조의 규정에 의한 회계별로 구분될 수 있도록 보관ㆍ관리하여야 한다. &lt;신설 1998. 1. 7.&gt;<\/div><div class=\"ln p\">제26조(과년도 수입과 반납금 여입) ① 출납이 완결한 연도에 속하는 수입 기타 예산외의 수입은 모두 현년도의 세입에 편입하여야 한다.<\/div><div class=\"ln p\">② 지출된 세출의 반납금은 각각 지출한 세출의 당해과목에 다시 넣을 수 있다. &lt;개정 2019. 9. 27.&gt;<\/div><div class=\"ln p\">제27조(과오납의 반환) 과오납된 수입금은 수입한 세입에서 직접 반환한다.<\/div><div class=\"ln p\">제3절 지출<\/div><div class=\"ln p\">제28조(지출의 원칙) ① 지출은 제21조의 규정에 의한 지출사무를 관리하는 자 및 그 위임을 받아 지출명령이 있는 것에 한하여 지출원이 행한다.<\/div><div class=\"ln p\">② 제1항의 지출명령은 예산의 범위안에서 하여야 한다.<\/div><div class=\"pchip\" id=\"p165\"><span>원문 165쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=171\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제29조(지출의 방법) ① 지출은 상용의 경비 또는 소액의 경비지출을 제외하고는 예금통장에 의하거나 「전자문서 및 전자거래 기본법」 제2조제5호에 따른 전자거래로 행하여야 한다. 다만, 시설에 지원되는 국가 또는 지방자치단체의 보조금 지출은 보조금 결제 전용카드나 전용계좌를 이용하여야 한다. &lt;개정 2009. 2. 5., 2012. 8. 7., 2012. 8. 31., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">② 제1항에도 불구하고 지출원은 상용의 경비 또는 소액의 경비를 지출할 수 있으며, 이를 위하여 100만원 이하의 현금을 보관할 수 있다. &lt;개정 2009. 2. 5., 2012. 8. 7.&gt;<\/div><div class=\"ln p\">③ 제1항 및 제2항에 따른 상용의 경비 또는 소액의 경비지출의 범위는 시ㆍ도지사가 정할 수 있다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">제30조(지출의 특례) ① 선금지급할 수 있는 경비의 범위는 다음과 같다. &lt;개정 2009. 2. 5., 2019. 9. 27.&gt;<\/div><div class=\"ln p\">1. 외국에서 직접 구입하는 기계, 도서, 표본 또는 실험용재료의 대가<\/div><div class=\"ln p\">2. 정기간행물의 대가<\/div><div class=\"ln p\">3. 토지 또는 가옥의 임대료와 용선료<\/div><div class=\"ln p\">4. 운 임<\/div><div class=\"ln p\">5. 소속직원중 특별한 사정이 있는 자에 대하여 지급하는 급여의 일부<\/div><div class=\"ln p\">6. 관공서(「공공기관의 운영에 관한 법률」에 따른 공공기관 및 특별법에 의하여 설립된 특수법인을 포함한다)에 대하여 지급하는 경비<\/div><div class=\"ln p\">7. 외국에서 연구 또는 조사에 종사하는 자에 대하여 지급하는 경비<\/div><div class=\"ln p\">8. 보조금<\/div><div class=\"ln p\">9. 사례금<\/div><div class=\"ln p\">10. 계약금액이 1천만원이상인 공사나 제조 또는 물건의 매입을 하는 경우에 계약금액의 100분의 50을 초과하지 아니하는 금액<\/div><div class=\"ln p\">② 추산지급할 수 있는 경비의 범위는 다음과 같다. &lt;개정 2009. 2. 5., 2019. 9. 27.&gt;<\/div><div class=\"ln p\">1. 여비 및 판공비<\/div><div class=\"ln p\">2. 관공서(「공공기관의 운영에 관한 법률」에 따른 공공기관 및 특별법에 의하여 설립된 특수법인을 포함한다)에 대하여 지급하는 경비<\/div><div class=\"ln p\">3. 보조금<\/div><div class=\"ln p\">4. 소송비용<\/div><div class=\"ln p\">제4절 계약<\/div><div class=\"pchip\" id=\"p166\"><span>원문 166쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=172\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제30조의2(계약의 원칙) 계약에 관한 사항은 「지방자치단체를 당사자로 하는 계약에 관한 법률」, 같은 법 시행령 및 같은 법 시행규칙을 준용한다. 다만, 국가ㆍ지방자치단체ㆍ법인 외의 자가 설치ㆍ운영하는 시설의 경우에는 그러하지 아니하다. &lt;개정 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">[전문개정 2009. 2. 5.]<\/div><div class=\"ln p\">제31조(계약담당자) ① 계약에 관한 사무는 각각 그 법인의 대표이사와 시설의 장이 처리한다.<\/div><div class=\"ln p\">② 법인의 대표이사와 시설의 장은 계약체결에 관한 사무를 소속직원에게 위임할 수 있다.<\/div><div class=\"ln p\">제32조 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">제33조 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">제34조 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">제35조 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">제36조 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">제37조 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">제37조의2 삭제 &lt;2009. 2. 5.&gt;<\/div><div class=\"ln p\">제4장 물품<\/div><div class=\"ln p\">제38조(물품의 관리자와 출납원) ① 법인의 대표이사와 시설의 장은 그 소관에 속하는 물품(현금 및 유가증권을 제외한 동산을 말한다. 이하 같다)을 관리한다. &lt;개정 1998. 1. 7.&gt;<\/div><div class=\"ln p\">② 법인의 대표이사와 시설의 장은 그 소관에 속하는 물품관리에 관한 사무를 소속직원에게 위임할 수 있다.<\/div><div class=\"pchip\" id=\"p167\"><span>원문 167쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=173\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">③ 법인의 대표이사와 시설의 장(제2항의 규정에 의하여 위임을 받은 자를 포함한다. 이하 “물품관리자”라 한다)은 물품의 출납보관을 위하여 소속직원중에서 물품출납원을 지정하여야 한다.<\/div><div class=\"ln p\">제39조(물품의 관리의무) 물품관리자 및 물품출납원은 선량한 관리자의 주의로써 사무에 종사하여야 한다.<\/div><div class=\"ln p\">제40조(물품의 관리) ① 물품관리자는 물품을 출납하게 하고자 할 때에는 물품출납원에게 출납하여야 할 물품의 분류를 명백히 하여 그 출납을 명령하여야 한다.<\/div><div class=\"ln p\">② 물품출납원은 제1항의 규정에 의한 명령이 없이는 물품을 출납할 수 없다.<\/div><div class=\"ln p\">제40조의2(재물조사) 법인의 대표이사와 시설의 장은 연 1회 그 관리에 속하는 물품에 대하여 정기적으로 재물조사를 실시하여야 하며, 필요하다고 인정하는 때에는 정기재물조사외에 수시로 재물조사를 할 수 있다.<\/div><div class=\"ln p\">[본조신설 1998. 1. 7.]<\/div><div class=\"ln p\">제41조(불용품의 처리) ① 법인과 시설의 물품관리자는 물품중 그 사용이 불가능하거나 수리하여 다시 사용할 수 없게 된 물품이 있을 때에는 그 물품에 대하여 불용의 결정을 하여야 한다.<\/div><div class=\"ln p\">② 제1항의 규정에 의한 불용품을 매각한 경우 그 대금은 당해법인 또는 시설의 세입예산에 편입시켜야 한다.<\/div><div class=\"ln p\">제4장의2 후원금의 관리 &lt;신설 1998. 1. 7.&gt;<\/div><div class=\"ln p\">제41조의2(후원금의 범위등) ① 법인의 대표이사와 시설의 장은 「사회복지사업법」 제45조에 따른 후원금의 수입ㆍ지출 내용과 관리에 명확성이 확보되도록 하여야 한다. 시설거주자가 받은 개인결연후원금을 당해인이 정신질환 기타 이에 준하는 사유로 관리능력이 없어 시설의 장이 이를 관리하게 되는 경우에도 또한 같다. &lt;개정 1999. 3. 11., 2012. 8. 7.&gt;<\/div><div class=\"ln p\">② 삭제 &lt;1999. 3. 11.&gt;<\/div><div class=\"ln p\">[본조신설 1998. 1. 7.]<\/div><div class=\"pchip\" id=\"p168\"><span>원문 168쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=174\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제41조의3 삭제 &lt;1999. 3. 11.&gt;<\/div><div class=\"ln p\">제41조의4(후원금의 영수증 발급 등) ① 법인의 대표이사와 시설의 장은 후원금을 받은 때에는 「소득세법 시행규칙」 제101조제20호의2에 따른 기부금영수증 서식 또는 「법인세법 시행규칙」 제82조제7항제3호의3에 따른 기부금영수증 서식에 따라 후원금 영수증을 발급하여야 하며, 영수증 발급목록을 별도의 장부로 작성ㆍ비치하여야 한다. &lt;개정 2009. 2. 5., 2012. 8. 7.&gt;<\/div><div class=\"ln p\">② 법인의 대표이사와 시설의 장은 금융기관 또는 체신관서의 계좌입금을 통하여 후원금을 받은 때에는 법인명의의 후원금전용계좌나 시설의 명칭이 부기된 시설장 명의의 계좌(이하 “후원금전용계좌등”이라 한다)를 사용하여야 한다. 이 경우 후원자가 영수증 발급을 원하는 경우를 제외하고는 제1항에 따른 영수증의 발급을 생략할 수 있다. &lt;개정 2009. 2. 5.&gt;<\/div><div class=\"ln p\">③ 법인의 대표이사 및 시설의 장은 후원금을 받을 때에는 각각의 법인 및 시설별로 후원금전용계좌등을 구분하여 사용하여야 하며, 미리 후원자에게 후원금전용계좌등의 구분에 관한 사항을 안내하여야 한다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">④ 모든 후원금의 수입 및 지출은 후원금전용계좌등을 통하여 처리하여야 한다. 다만, 물품 형태의 후원금은 그러하지 아니하다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">[전문개정 2005. 7. 15.]<\/div><div class=\"ln p\">[제목개정 2009. 2. 5.]<\/div><div class=\"ln p\">제41조의5(후원금의 수입 및 사용내용통보) 법인의 대표이사와 시설의 장은 연 1회이상 해당 후원금의 수입 및 사용내용을 후원금을 낸 법인ㆍ단체 또는 개인에게 통보하여야 한다. 이 경우 법인이 발행하는 정기간행물 또는 홍보지등을 이용하여 일괄 통보할 수 있다.<\/div><div class=\"ln p\">[본조신설 1998. 1. 7.]<\/div><div class=\"ln p\">제41조의6(후원금의 수입ㆍ사용결과 보고 및 공개) ① 법인의 대표이사와 시설의 장은 제19조 및 제20조에 따른 결산보고서를 제출할 때에 별지 제19호서식에 따른 후원금수입 및 사용결과보고서(전산파일을 포함한다)를 관할 시장ㆍ군수ㆍ구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. &lt;개정 2005. 7. 15., 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">② 시장ㆍ군수ㆍ구청장은 제1항에 따라 제출받은 후원금수입 및 사용결과보고서를 제출받은 날부터 20일 이내에 인터넷 등을 통하여 3개월 동안 공개하여야 하며, 법인의 대표이사 및 시설의 장은 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 같은 기간 동안 공개하여야 한다. 다만, 후원자의 성명(법인 등의 경우는 그 명칭)은 공개하지 아니한다. &lt;신설 2005. 7. 15., 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"pchip\" id=\"p169\"><span>원문 169쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=175\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">③ 제2항에 따른 공개는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하는 것으로 갈음할 수 있다. &lt;신설 2015. 12. 24.&gt;<\/div><div class=\"ln p\">[본조신설 1998. 1. 7.]<\/div><div class=\"ln p\">[제목개정 2005. 7. 15.]<\/div><div class=\"ln p\">제41조의7(후원금의 용도외 사용금지) ① 법인의 대표이사와 시설의 장은 후원금을 후원자가 지정한 사용용도외의 용도로 사용하지 못한다.<\/div><div class=\"ln p\">② 보건복지부장관은 후원자가 사용용도를 지정하지 아니한 후원금에 대하여 그 사용기준을 정할 수 있다. &lt;신설 2012. 8. 7.&gt;<\/div><div class=\"ln p\">③ 후원금의 수입 및 지출은 제10조의 규정에 의한 예산의 편성 및 확정절차에 따라 세입ㆍ세출예산에 편성하여 사용하여야 한다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">[본조신설 1998. 1. 7.]<\/div><div class=\"ln p\">제5장 감사<\/div><div class=\"ln p\">제42조(감사) ① 법인의 감사는 당해법인과 시설에 대하여 매년 1회이상 감사를 실시하여야 한다.<\/div><div class=\"ln p\">② 법인의 대표이사는 시설의 장과 수입원 및 지출원이 사망하거나 경질된 때에는 그 관장에 속하는 수입, 지출, 재산, 물품 및 현금등의 관리상황을 감사로 하여금 감사하게 하여야 한다.<\/div><div class=\"ln p\">③ 제2항에 따른 감사를 실시할 때에는 전임자가 참관해야 하며, 전임자가 참관할 수 없으면 관계 직원 중에서 전임자의 전임자나 법인의 대표이사가 지정한 사람이 참관해야 한다. &lt;개정 2019. 9. 27.&gt;<\/div><div class=\"ln p\">④ 감사는 제1항 내지 제3항의 규정에 의하여 감사를 한 때는 감사보고서를 작성하여 당해법인의 이사회에 보고하여야 하며, 재산상황 또는 업무집행에 관하여 부정 또는 불비한 점이 발견된 때에는 시장ㆍ군수ㆍ구청장에게 보고하여야 한다.<\/div><div class=\"ln p\">⑤ 제4항의 감사보고서에는 감사가 서명 또는 날인하여야 한다. &lt;개정 1998. 1. 7.&gt;<\/div><div class=\"pchip\" id=\"p170\"><span>원문 170쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=176\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제42조의2(회계감사) ① 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장은 법인 및 시설이 다음 각 호의 어느 하나에 해당하는 경우 회계감사를 실시할 수 있다.<\/div><div class=\"ln p\">1. 「사회복지사업법」 제40조제1항제4호에 따른 회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 경우<\/div><div class=\"ln p\">2. 「사회복지사업법」 제42조제3항제1호에 따라 거짓이나 그 밖의 부정한 방법으로 보조금을 받은 경우<\/div><div class=\"ln p\">3. 「사회복지사업법」 제42조제3항제2호에 따라 사업 목적 외의 용도에 보조금을 사용한 경우<\/div><div class=\"ln p\">4. 「사회복지사업법」 또는 「사회복지사업법」에 따른 명령을 위반한 경우<\/div><div class=\"ln p\">5. 제42조제4항에 따라 감사가 시장ㆍ군수ㆍ구청장에게 보고한 경우<\/div><div class=\"ln p\">② 제1항에서 규정한 사항 외에 공인회계사 또는 감사인의 추천 등 회계감사의 실시와 관련하여 필요한 사항은 해당 지방자치단체의 조례로 정한다.<\/div><div class=\"ln p\">[본조신설 2019. 6. 12.]<\/div><div class=\"ln p\">제6장 보칙<\/div><div class=\"ln p\">제43조(사무의 인계ㆍ인수) ① 회계사무를 담당하는 직원이 교체된 때에는 당해사무의 인계ㆍ인수는 발령일로부터 5일이내에 행하여져야 한다. &lt;개정 2012. 8. 7.&gt;<\/div><div class=\"ln p\">② 인계자는 인계할 장부와 증빙서류등의 목록을 각각 3부씩 작성하여 인계ㆍ인수자가 각각 서명 또는 날인한 후 각각 1부씩 보관하고, 1부는 이를 예금잔고증명과 함께 인계ㆍ인수보고서에 첨부하여 법인의 대표이사 및 시설의 장에게 제출하여야 한다. 이 경우 법인이 설치ㆍ운영하는 시설에 있어서는 시설의 장을 거쳐 제출하여야 한다. &lt;개정 2012. 8. 7., 2015. 12. 24.&gt;<\/div><div class=\"ln p\">제44조(시행세칙) 이 규칙의 시행을 위하여 필요한 세부사항은 보건복지부장관이 정한다. &lt;개정 1998. 1. 7., 2008. 3. 3., 2010. 3. 19.&gt;<\/div><div class=\"ln p\">제45조 삭제 &lt;2018. 12. 28.&gt;<\/div><div class=\"ln p\">부  칙 &lt;제813호, 1988. 2. 8.&gt;<\/div><div class=\"ln p\">① (시행일) 이 규칙은 1988년 6월 1일부터 시행한다.<\/div><div class=\"ln p\">② (정관변경에 관한 경과조치) 법인의 정관중 재무 및 회계에 관한 규정은 이 규칙 시행일로부터 6월이내에 이 규칙에 맞게 변경하여 정관변경허가를 받아야 한다.<\/div><div class=\"pchip\" id=\"p171\"><span>원문 171쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=177\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">부  칙 &lt;제922호, 1993. 12. 27.&gt;<\/div><div class=\"ln p\">이 규칙은 1994년 1월 1일부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제57호, 1998. 1. 7.&gt;<\/div><div class=\"ln p\">이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제98호, 1999. 3. 11.&gt;<\/div><div class=\"ln p\">이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제323호, 2005. 7. 15.&gt;<\/div><div class=\"ln p\">① (시행일) 이 규칙은 공포 후 2월이 경과한 날부터 시행한다. 다만, 제41조의4의 개정규정은 2006년 1월 1일부터 시행한다.<\/div><div class=\"ln p\">② (후원금수입및사용결과보고에 관한 적용례) 제41조의6의 개정규정과 별지 제19호서식은 2006년 상반기 보고분부터 적용한다.<\/div><div class=\"ln p\">③ (서식에 관한 경과조치) 이 규칙 시행당시 종전의 규정에 의한 서식은 2005년 12월 31일까지 이 규칙에 의한 서식과 함께 사용할 수 있다.<\/div><div class=\"ln p\">부  칙 &lt;제1호, 2008. 3. 3.&gt;(보건복지가족부와 그 소속기관 직제 시행규칙)<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조 생략<\/div><div class=\"pchip\" id=\"p172\"><span>원문 172쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=178\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제3조(다른 법령의 개정) ① 부터 ㊵ 까지 생략<\/div><div class=\"ln p\">㊶ 사회복지법인 재무ㆍ회계 규칙 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제44조 중 “보건복지부장관”을 “보건복지가족부장관”으로 한다.<\/div><div class=\"ln p\">㊷ 부터 &lt;94&gt; 까지 생략<\/div><div class=\"ln p\">부  칙 &lt;제91호, 2009. 2. 5.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조(계약에 관한 적용례) 제30조의2, 제32조부터 제37조까지 및 제37조의2의 개정규정은 이 규칙 시행 후 최초로 계약을 체결하는 경우부터 적용한다.<\/div><div class=\"ln p\">부  칙 &lt;제1호, 2010. 3. 19.&gt;(보건복지부와 그 소속기관 직제 시행규칙)<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 공포한 날부터 시행한다. &lt;단서 생략&gt;<\/div><div class=\"ln p\">제2조 생략<\/div><div class=\"ln p\">제3조(다른 법령의 개정) ① 부터 ㉝ 까지 생략<\/div><div class=\"ln p\">㉞ 사회복지법인 재무ㆍ회계 규칙 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제10조제2항제4호 및 제44조 중 “보건복지가족부장관”을 각각 “보건복지부장관”으로 한다.<\/div><div class=\"ln p\">㉟ 부터 &lt;84&gt; 까지 생략<\/div><div class=\"ln p\">부  칙 &lt;제152호, 2012. 8. 7.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 공포한 날부터 시행한다. 다만, 제6조의2의 개정규정은 2013년 1월 1일부터 시행한다.<\/div><div class=\"ln p\">제2조(후원금 수입 및 사용결과 보고에 관한 적용례) 별지 제19호서식의 개정규정은 2013년도 후원금에 대한 보고를 하는 것부터 적용한다.<\/div><div class=\"ln p\">부  칙 &lt;제269호, 2012. 8. 31.&gt;(전자문서 및 전자거래 기본법 시행규칙)<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 2012년 9월 2일부터 시행한다.<\/div><div class=\"ln p\">제2조 생략<\/div><div class=\"ln p\">제3조(다른 법령의 개정) ① 및 ② 생략<\/div><div class=\"ln p\">③ 사회복지법인 및 사회복지시설 재무ㆍ회계 규칙 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제29조제1항 본문 중“「전자거래기본법」”을 “「전자문서 및 전자거래 기본법」”으로 한다.<\/div><div class=\"ln p\">④ 생략<\/div><div class=\"ln p\">제4조 생략<\/div><div class=\"ln p\">부  칙 &lt;제283호, 2015. 1. 5.&gt;<\/div><div class=\"ln p\">(규제 재검토기한 설정 등 규제정비를 위한 감염병의 예방 및 관리에 관한 법률 시행규칙 등 일부개정령)<\/div><div class=\"ln p\">이 규칙은 공포일로부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제377호, 2015. 12. 24.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조(출납기한에 관한 적용례) 제5조의 개정규정은 2015년 회계연도의 출납기한부터 적용한다.<\/div><div class=\"ln p\">제3조(어린이집의 회계연도에 관한 특례) 제3조 단서의 개정규정에도 불구하고 어린이집의 회계연도에 관하여는 2016년 1월 및 2월은 2015년도 회계연도에 포함한다.<\/div><div class=\"pchip\" id=\"p173\"><span>원문 173쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=179\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">부  칙 &lt;제480호, 2017. 2. 14.&gt;<\/div><div class=\"ln p\">이 규칙은 2017년 3월 1일부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제565호, 2018. 3. 30.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 공포한 날부터 시행한다. 다만, 제6조의2제4항, 제11조제2항 단서, 제20조제2항 단서 및 제24조제2항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.<\/div><div class=\"ln p\">1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일<\/div><div class=\"ln p\">3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일<\/div><div class=\"ln p\">4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일<\/div><div class=\"ln p\">제2조(예산과목 구분 및 임직원 보수 일람표에 관한 적용례) 별표 9, 별표 10 및 별지 제4호의2서식의 개정규정은 다음 각 호의 구분에 따른 때부터 적용한다.<\/div><div class=\"ln p\">1. 부칙 제1조제1호 및 제2호의 기관: 2019년도 예산을 편성할 때<\/div><div class=\"ln p\">2. 부칙 제1조제3호 및 제4호의 기관: 2020년도 예산을 편성할 때<\/div><div class=\"ln p\">제3조(경과조치) ① 부칙 제1조제1호 및 제2호의 기관은 다음 각 호의 구분에 따라 사무를 처리한다.<\/div><div class=\"ln p\">1. 2018년도 세입예산과목은 종전의 별표 3에 따른다.<\/div><div class=\"ln p\">2. 2018년도 세출예산과목은 종전의 별표 4에 따른다.<\/div><div class=\"ln p\">3. 2018년도 결산보고 시의 임직원 보수 일람표는 별지 제4호서식에 따른다.<\/div><div class=\"ln p\">② 부칙 제1조제3호 및 제4호의 기관은 다음 각 호의 구분에 따라 사무를 처리한다.<\/div><div class=\"pchip\" id=\"p174\"><span>원문 174쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=180\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1. 2019년도 세입예산과목은 종전의 별표 3에 따른다.<\/div><div class=\"ln p\">2. 2019년도 세출예산과목은 종전의 별표 4에 따른다.<\/div><div class=\"ln p\">3. 2019년도 결산보고 시의 임직원 보수 일람표는 별지 제4호서식에 따른다.<\/div><div class=\"ln p\">③ 종전의 별표 4에 따라 편성된 운영충당적립금(911목) 및 시설환경 개선준비금(1011목)은 다음 각 호의 구분에 따른 날부터 각각 별표 10의 개정규정에 따라 편성된 운영충당적립금(911목) 및 시설환경 개선준비금(912목)으로 본다.<\/div><div class=\"ln p\">1. 부칙 제1조제1호 및 제2호의 기관: 2019년 1월 1일<\/div><div class=\"ln p\">2. 부칙 제1조제3호 및 제4호의 기관: 2020년 1월 1일<\/div><div class=\"ln p\">부  칙 &lt;제606호, 2018. 12. 28.&gt;<\/div><div class=\"ln p\">(행정규제기본법에 따른 일몰규제 정비를 위한 31개 법령의 일부개정에 관한 보건복지부령)<\/div><div class=\"ln p\">이 규칙은 2019년 1월 1일부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제642호, 2019. 6. 12.&gt;<\/div><div class=\"ln p\">이 규칙은 2019년 6월 12일부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제672호, 2019. 9. 27.&gt;<\/div><div class=\"ln p\">(어려운 법령용어 정비를 위한 48개 법령의 일부개정에 관한 보건복지부령)<\/div><div class=\"ln p\">이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제701호, 2020. 1. 7.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조(결산보고서 제출에 관한 적용례) 제20조제1항 각 호 외의 부분 단서의 개정규정은 2020년 결산보고서를 제출하는 경우부터 적용한다.<\/div><div class=\"ln p\">부  칙 &lt;제724호, 2020. 5. 6.&gt;<\/div><div class=\"ln p\">이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제831호, 2021. 9. 30.&gt;<\/div><div class=\"ln p\">이 규칙은 공포한 날부터 시행한다.<\/div><div class=\"pchip\" id=\"p175\"><span>원문 175쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=181\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[별표 1] &lt;개정 2012.8.7&gt;<\/di ] &lt;개정 2005.7.15&gt;<\/div><div class=\"ln p\">총 계 정 원 장 (시설용)<\/div><div class=\"ln p\">계정과목 :<\/div><table class=\"htbl\"><tr><td>계정명<\/td><td>연월일<\/td><td>적  요<\/td><td>수 입<\/td><td>지 출<\/td><td>차인잔액<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td colspan=\"6\">210㎜×297㎜(일반용지 60g/㎡(재활용품))<\/td><\/tr><\/table><div class=\"pchip\" id=\"p230\"><span>원문 230쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=236\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[별지 제26호서식]<\/div><div class=\"pchip\" id=\"p231\"><span>원문 231쪽 <span class=\"approx\">(약)<\/span><\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=237\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">총 계 정 원 장 보 조 부<\/div><table class=\"htbl\"><tr><td rowspan=\"2\">연월일<\/td><td rowspan=\"2\">적  요<\/td><td colspan=\"3\">수  입<\/td><td colspan=\"3\">지  출<\/td><td colspan=\"3\">잔  액<\/td><\/tr><tr><td>계<\/td><td>현금<\/td><td>예금<\/td><td>계<\/td><td>현금<\/td><td>예금<\/td><td>계<\/td><td>현금<\/td><td>예금<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td colspan=\"2\">3106-85일<br>87.5.29 승인<\/td><td colspan=\"9\">210㎜×297㎜<br>(인쇄용지(특급) 70g/㎡)<\/td><\/tr><\/table>", "pages": [{"p": 151, "t": "2026년 사회복지법인 관리안내･Ministry of Health & Welfare"}, {"p": 153, "t": "「사회복지법인 및 사회복지시설 재무･회계규칙」(全文)\n붙 임\n「사회복지법인 및 사회복지시설 재무･회계 규칙」\n제    정 1988. 2. 8. 보건사회부령     제813호\n일부개정 1993.12.27. 보건사회부령     제922호\n일부개정 1998. 1. 7. 보건복지부령     제 57호\n일부개정 1999. 3.11. 보건복지부령     제 98호\n일부개정 2005. 7.15. 보건복지부령     제323호\n타법개정 2008. 3. 3. 보건복지가족부령 제  1호\n일부개정 2009. 2. 5. 보건복지가족부령 제 91호\n타법개정 2010. 3.19. 보건복지부령     제  1호\n일부개정 2012. 8. 7. 보건복지부령     제152호\n타법개정 2012. 8.31. 보건복지부령     제269호\n타법개정 2015. 1. 5. 보건복지부령     제283호\n일부개정 2015.12.24. 보건복지부령     제377호\n일부개정 2017. 2.14. 보건복지부령     제480호\n일부개정 2018. 3.30. 보건복지부령     제565호\n타법개정 2018.12.28. 보건복지부령     제606호\n일부개정 2019. 6.12. 보건복지부령     제642호\n타법개정 2019. 9.27. 보건복지부령     제672호\n일부개정 2020. 1. 7. 보건복지부령     제701호\n일부개정 2020. 5. 6. 보건복지부령     제724호\n일부개정 2021. 9.30. 보건복지부령     제831호\n일부개정 2022.12.28. 보건복지부령     제928호\n제1장 총칙\n제1조(목적) 이 규칙은 「사회복지사업법」 제23조제4항, 제34조제4항, 제45조제2항 및 제51조제2항에 따라 사회복지법인 및 사회복지시설의 재무ㆍ회계, 후원금관리 및 회계감사에 관한 사항을 규정하여 재무ㆍ회계, 후원금관리 및 회계감사의 명확성ㆍ공정성ㆍ투명성을 기함으로써 사회복지법인 및 사회복지시설의 합리적인 운영에 기여함을 목적으로 한다. <개정 2012. 8. 7., 2019. 6. 12.>\n[전문개정 2005. 7. 15.]\n제2조(재무ㆍ회계운영의 기본원칙) 사회복지법인(이하 “법인”이라 한다) 및 사회복지시설(법인이 설치ㆍ운영하는 사회복지시설을 포함하며, 이하 “시설”이라 한다)의 재무ㆍ회계는 그 설립목적에 따라 건전하게 운영되어야 한다. <개정 2012. 8. 7.>"}, {"p": 154, "t": "제2조의2(다른 법령과의 관계) 법인 및 시설의 재무 및 회계 처리에 관하여 다른 법령에 특별한 규정이 있는 경우를 제외하고는 이 규칙이 정하는 바에 따른다.\n[본조신설 2012. 8. 7.]\n제3조(회계연도) 법인 및 시설의 회계연도는 정부의 회계연도에 따른다. 다만, 「영유아보육법」 제2조에 따른 어린이집의 회계연도는 매년 3월 1일에 시작하여 다음 연도 2월 말일에 종료한다. <개정 2012. 8. 7., 2015. 12. 24.>\n제4조(회계연도 소속구분) 법인 및 시설의 수입 및 지출의 발생과 자산 및 부채의 증감ㆍ변동에 관하여는 그 원인이 되는 사실이 발생한 날을 기준으로 하여 연도소속을 구분한다. 다만, 그 사실이 발생한 날을 정할 수 없는 경우에는 그 사실을 확인한 날을 기준으로 하여 연도소속을 구분한다. <개정 2012. 8. 7.>\n제5조(출납기한) 1회계연도에 속하는 법인 및 시설의 세입ㆍ세출의 출납은 회계 연도가 끝나는 날까지 완결하여야 한다. <개정 1993. 12. 27., 2012. 8. 7., 2015. 12. 24.>\n[제목개정 1998. 1. 7.]\n제6조(회계의 구분) ① 이 규칙에서의 회계는 법인의 업무전반에 관한 회계(이하 “법인회계”라 한다), 시설의 운영에 관한 회계(이하 “시설회계”라 한다) 및 법인이 수행하는 수익사업에 관한 회계(이하 “수익사업회계”라 한다)로 구분한다.\n② 법인의 회계는 법인회계, 해당 법인이 설치ㆍ운영하는 시설의 시설회계 및 수익사업회계로 구분하여야 하며, 시설의 회계는 해당 시설의 시설회계로 한다.\n[전문개정 2012. 8. 7.]\n제6조의2(정보통신매체에 의한 재무ㆍ회계처리) ① 법인 및 시설의 재무ㆍ회계는 컴퓨터 회계프로그램으로 처리할 수 있다. <개정 2012. 8. 7.>\n② 보건복지부장관은 법인 및 시설의 재무ㆍ회계업무의 효율성 및 투명성을 높이기 위하여 「사회복지사업법」 제6조의2제2항에 따른 정보시스템으로서 법인 및 시설의 재무회계를 처리하기 위한 정보시스템을 구축ㆍ운영할 수 있다. <신설 2012. 8. 7.>\n③ 보건복지부장관, 시ㆍ도지사, 시장(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」 제11조제2항에 따른 행정시장을 포함한다. 이하 같다)ㆍ군수ㆍ구청장(자치구의 구청장을 말한다. 이하 같다)은 법인 또는 시설에 대하여 제2항에 따른 시스템을 사용할 것을 권장할 수 있다. <신설 2012. 8. 7., 2015. 12. 24., 2018. 3. 30.>"}, {"p": 155, "t": "④ 「사회복지사업법」 제42조에 따른 보조금을 받는 법인 및 시설과 보조금을 받지 아니하는 시설로서 「노인복지법」 제31조에 따른 노인복지시설 중 「노인장기요양보험법」 제31조에 따라 장기요양기관으로 지정받은 시설(이하 “노인장기요양기관”이라 한다)은 제1항에 따른 컴퓨터 회계프로그램 중 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템 또는 제2항에 따른 정보시스템을 사용하여 재무ㆍ회계를 처리하여야 한다. 다만, 보건복지부장관이 정하는 법인 및 시설은 그러하지 아니하다. <신설 2012. 8. 7., 2018. 3. 30.>\n⑤ 제1항에 따른 컴퓨터 회계프로그램 또는 제2항에 따른 시스템에 의하여 전자장부를 사용하는 경우에는 제24조에 따른 회계장부를 둔 것으로 본다. <개정 2012. 8. 7.>\n[본조신설 2005. 7. 15.]\n[시행일] 제6조의2제4항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일\n제2장 예산과 결산\n제1절 예산\n제7조(세입ㆍ세출의 정의) 1회계연도의 모든 수입을 세입으로 하고, 모든 지출을 세출로 한다."}, {"p": 156, "t": "제8조(예산총계주의원칙) 세입과 세출은 모두 예산에 계상하여야 한다.\n[전문개정 1998. 1. 7.]\n제9조(예산편성지침) ① 법인의 대표이사는 제2조의 취지에 따라 매 회계연도 개시 1월전까지 그 법인과 해당 법인이 설치ㆍ운영하는 시설의 예산편성 지침을 정하여야 한다. <개정 1998. 1. 7., 2012. 8. 7.>\n② 법인 또는 시설의 소재지를 관할하는 시장ㆍ군수ㆍ구청장은 특히 필요하다고 인정되는 사항에 관하여는 예산편성지침을 정하여 매 회계연도 개시 2월전까지 법인 및 시설에 통보할 수 있다. <개정 1998. 1. 7., 2012. 8. 7., 2015. 12. 24.>\n[제목개정 2012. 8. 7.]\n제10조(예산의 편성 및 결정절차) ① 법인의 대표이사 및 시설의 장은 예산을 편성하여 각각 법인 이사회의 의결 및 「사회복지사업법」 제36조에 따른 운영위원회 또는 「영유아보육법」 제25조에 따른 어린이집운영위원회(이하 “시설운영위원회”라 한다)에의 보고를 거쳐 확정한다. 다만, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐 확정한다. <신설 2012. 8. 7.>\n② 법인의 대표이사 및 시설의 장은 제1항에 따라 확정한 예산을 매 회계연도 개시 5일전까지 관할 시장ㆍ군수ㆍ구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. <개정 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.>\n③ 제1항에 따라 예산을 편성할 경우 법인회계와 시설회계의 예산은 별표 1부터 별표 4까지에 따른 세입ㆍ세출예산과목 구분에 따라 편성해야 한다. 다만, 다음 각 호의 시설은 각 호에서 정하는 바에 따라 편성한다. <개정 2009. 2. 5., 2010. 3. 19., 2012. 8. 7., 2018. 3. 30., 2022. 12. 28.>\n1. 다음 각 목의 시설: 별표 5 및 별표 6에 따른 세입ㆍ세출예산과목 구분에 따라 편성\n가. 「사회복지사업법」 제34조의5에 따른 사회복지관\n나. 「노인복지법」 제36조제1항제1호에 따른 노인복지관\n다. 「장애인복지법」 제58조제1항제2호에 따른 장애인 지역사회재활시설\n라. 「아동복지법」 제44조의2에 따른 다함께돌봄센터\n마. 「아동복지법」 제52조제1항제8호에 따른 지역아동센터\n바. 그 밖에 보건복지부장관이 정하여 고시하는 시설\n2. 「영유아보육법」 제2조에 따른 어린이집: 별표 7 및 별표 8에 따른 세입ㆍ세출예산과목 구분에 따라 편성"}, {"p": 157, "t": "3. 노인장기요양기관: 별표 9의 세입예산과목 구분 및 별표 10의 세출예산과목 구분에 따라 편성하되, 세출예산을 편성하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성\n4. 삭제 <2012. 8. 7.>\n④ 시장ㆍ군수ㆍ구청장은 제2항에 따라 예산을 제출받은 때에는 20일 이내에 법인과 시설의 회계별 세입ㆍ세출명세서를 시(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」 제10조제2항에 따른 행정시를 포함한다. 이하 같다)ㆍ군ㆍ구(자치구를 말한다. 이하 같다)의 게시판과 인터넷 홈페이지에 20일 이상 공고하고, 법인의 대표이사 및 시설의 장으로 하여금 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고하도록 하여야 한다. <개정 2009. 2. 5., 2012. 8. 7., 2018. 3. 30.>\n⑤ 제4항에 따른 공고는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하거나 「영유아보육법」 제49조의2제1항에 따라 공시하는 것으로 갈음할 수 있다. <개정 2015. 12. 24.>\n[전문개정 1998. 1. 7.]\n제11조(예산에 첨부하여야 할 서류) ① 예산에는 다음 각 호의 서류가 첨부되어야 한다. 다만, 단식부기로 회계를 처리하는 경우에는 제1호ㆍ제2호ㆍ제5호 및 제6호의 서류만을 첨부할 수 있고, 국가ㆍ지방자치단체ㆍ법인 외의 자가 설치ㆍ운영하는 시설로서 거주자 정원 또는 일일평균 이용자가 20명 이하인 시설(이하 “소규모 시설”이라 한다)은 제2호, 제5호(노인장기요양기관의 경우만 해당한다) 및 제6호의 서류만을 첨부할 수 있으며, 「영유아보육법」 제2조에 따른 어린이집은 보건복지부장관이 정하는 바에 따른다. <개정 1993. 12. 27., 2012. 8. 7., 2018. 3. 30., 2019. 9. 27., 2020. 1. 7.>\n1. 예산총칙\n2. 세입ㆍ세출명세서\n3. 추정재무상태표\n4. 추정수지계산서\n5. 임직원 보수 일람표\n6. 예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록 사본\n② 제1항제2호부터 제5호까지의 서류는 별지 제1호서식부터 별지 제4호서식까지에 따른다. 다만, 노인장기요양기관의 장이 첨부해야 하는 제1항제5호의 임직원 보수 일람표는 별지 제4호의2서식에 따른다. <개정 2018. 3. 30., 2020. 1. 7.>"}, {"p": 158, "t": "[시행일] 제11조제2항 단서의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일\n제12조(준예산) 회계연도 개시전까지 법인 및 시설의 예산이 성립되지 아니한 때에는 법인의 대표이사 및 시설의 장은 시장ㆍ군수ㆍ구청장에게 그 사유를 보고하고 예산이 성립될 때까지 다음의 경비를 전년도 예산에 준하여 집행할 수 있다. <개정 2012. 8. 7.>\n1. 임ㆍ직원의 보수\n2. 법인 및 시설운영에 직접 사용되는 필수적인 경비\n3. 법령상 지급의무가 있는 경비\n제13조(추가경정예산) ① 법인의 대표이사 및 시설의 장은 예산성립후에 생긴 사유로 인하여 이미 성립된 예산에 변경을 가할 필요가 있을 때에는 제10조 및 제11조의 규정에 의한 절차에 준하여 추가경정예산을 편성ㆍ확정할 수 있다. 이 경우 노인장기요양기관의 장은 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 한다. <개정 2012. 8. 7., 2018. 3. 30.>\n② 법인의 대표이사 및 시설의 장은 추가경정예산이 확정된 날로부터 7일이내에 이를 시장ㆍ군수ㆍ구청장에게 제출하여야 한다. <개정 2012. 8. 7.>"}, {"p": 159, "t": "제14조(예비비) 법인의 대표이사 및 시설의 장은 예측할 수 없는 예산외의 지출 또는 예산의 초과지출에 충당하기 위하여 예비비를 세출예산에 계상할 수 있다. <개정 2012. 8. 7.>\n[전문개정 1999. 3. 11.]\n제15조(예산의 목적외 사용금지) 법인회계 및 시설회계의 예산은 세출예산이 정한 목적외에 이를 사용하지 못한다.\n제16조(예산의 전용) ① 법인의 대표이사 및 시설의 장은 관ㆍ항ㆍ목간의 예산을 전용할 수 있다. 다만, 법인 및 시설(소규모 시설은 제외한다)의 관간 전용 또는 동일 관내의 항간 전용을 하려면 이사회의 의결 또는 시설운영위원회에의 보고를 거쳐야 하되, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐야 한다. <개정 1998. 1. 7., 2012. 8. 7.>\n② 제1항에도 불구하고 예산총칙에서 전용을 제한하고 있거나 이사회 및 시설 예산심의과정에서 삭감한 관ㆍ항ㆍ목으로는 전용하여서는 아니 되며, 노인장기요양기관의 장은 예산을 전용하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 한다. <신설 2012. 8. 7., 2018. 3. 30.>\n③ 법인의 대표이사 및 시설의 장은 제1항에 따라 관ㆍ항 간 예산을 전용한 경우에는 관할 시장ㆍ군수ㆍ구청장에게 제19조 및 제20조에 따른 결산보고서를 제출할 때에 과목 전용조서를 첨부하여야 한다. <개정 2012. 8. 7.>\n제17조(세출예산의 이월) 법인의 대표이사 및 시설의 장은 법인회계와 시설회계의 세출예산중 경비의 성질상 당해회계연도안에 지출을 마치지 못할 것으로 예측되는 경비와 연도내에 지출원인행위를 하고 불가피한 사유로 인하여 연도내에 지출하지 못한 경비를 각각 이사회의 의결 및 시설운영위원회에의 보고를 거쳐 다음 연도에 이월하여 사용할 수 있다. 다만, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 사전 보고한 후 법인 이사회의 의결을 거쳐야 한다. <개정 1998. 1. 7., 2012. 8. 7.>\n제18조(특정목적사업 예산) ① 법인의 대표이사 및 시설의 장은 완성에 수년을 요하는 공사나 제조 그밖의 특수한 사업을 위하여 2회계연도 이상에 걸쳐서 그 재원을 적립할 필요가 있는 때에는 회계연도마다 일정액을 예산에 계상하여 특정목적사업을 위한 적립금으로 적립할 수 있다. <개정 2012. 8. 7., 2017. 2. 14.>"}, {"p": 160, "t": "② 적립금의 적립 및 사용 계획(변경된 계획을 포함한다)은 시장ㆍ군수ㆍ구청장에게 사전에 보고하여야 한다. <신설 2012. 8. 7.>\n③ 적립금은 그 적립목적에만 사용해야 한다. 다만, 노인장기요양기관의 경우 「재난 및 안전관리 기본법」 제14조제1항에 따른 대규모 재난으로 인하여 인건비 지급이 어려운 경우로서 보건복지부장관이 정하는 기준에 해당하는 때에는 관할 시장ㆍ군수ㆍ구청장의 승인을 받아 한시적으로 인건비로 사용할 수 있다. <개정 2021. 9. 30.>\n④ 시장ㆍ군수ㆍ구청장은 법인 및 시설의 재정 상태 등을 고려하여 적립금의 적립 여부, 규모 및 적립기간 등에 관하여 필요한 조치를 할 수 있다. <신설 2012. 8. 7.>\n제2절 결산\n제19조(결산서의 작성 제출) ① 법인의 대표이사 및 시설의 장은 법인회계와 시설회계의 세입ㆍ세출 결산보고서를 작성하여 각각 이사회의 의결 및 시설운영위원회에의 보고를 거친 후 다음 연도 3월 31일까지(「영유아보육법」 제2조에 따른 어린이집의 경우에는 5월 31일까지를 말한다) 시장ㆍ군수ㆍ구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. 다만, 법인이 설치ㆍ운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐 제출하여야 한다. <개정 2012. 8. 7., 2015. 12. 24.>\n② 시장ㆍ군수ㆍ구청장은 제1항에 따라 결산보고서를 제출받은 때에는 20일 이내에 법인 및 시설의 세입ㆍ세출결산서를 시ㆍ군ㆍ구의 게시판과 인터넷 홈페이지에 20일 이상 공고하고, 법인의 대표이사 및 시설의 장으로 하여금 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고하도록 하여야 한다. <신설 1998. 1. 7., 2009. 2. 5., 2012. 8. 7.>\n1. 삭제 <2012. 8. 7.>\n2. 삭제 <2012. 8. 7.>\n③ 제2항에 따른 공고는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하거나 「영유아보육법」 제49조의2제1항에 따라 공시하는 것으로 갈음할 수 있다. <개정 2015. 12. 24.>\n제20조(결산보고서에 첨부해야 할 서류) ① 결산보고서에는 다음 각 호의 서류가 첨부되어야 한다. 다만, 단식부기로 회계를 처리하는 경우에는 제1호부터 제3호까지 및 제14호부터 제23호까지의 서류만을 첨부할 수 있고, 소규모 시설의 경우에는 제1호 및 제17호의 서류(노인장기요양기관의 경우에는 제1호부터 제3호까지 및 제16호부터 제21호까지의 서류)만을 첨부할 수 있으며, 「영유아보육법」 제2조에 따른 어린이집은 보건복지부장관이 정하는 바에 따른다. <개정 1993. 12. 27., 1998. 1. 7., 2012. 8. 7., 2015. 12. 24., 2019. 9. 27., 2020. 1. 7.>"}, {"p": 161, "t": "1. 세입ㆍ세출결산서\n2. 과목 전용조서\n3. 예비비 사용조서\n4. 재무상태표\n5. 수지계산서\n6. 현금 및 예금명세서\n7. 유가증권명세서\n8. 미수금명세서\n9. 재고자산명세서\n10. 그 밖의 유동자산명세서(제6호부터 제9호까지의 유동자산 외의 유동자산을 말한다)\n11. 고정자산(토지ㆍ건물ㆍ차량운반구ㆍ비품ㆍ전화가입권)명세서\n12. 부채명세서(차입금ㆍ미지급금을 포함한다)\n13. 각종 충당금 명세서\n14. 기본재산수입명세서(법인만 해당한다)\n15. 사업수입명세서\n16. 정부보조금명세서\n17. 후원금수입 및 사용결과보고서(전산파일을 포함한다)\n18. 후원금 전용계좌의 입출금내역\n19. 인건비명세서\n20. 사업비명세서\n21. 그 밖의 비용명세서(인건비 및 사업비를 제외한 비용을 말한다)\n22. 감사보고서\n23. 법인세 신고서(수익사업이 있는 경우만 해당한다)\n② 제1항제1호부터 제3호까지의 서류는 별지 제5호서식ㆍ별지 제5호의2서식부터 별지 제5호의4서식까지ㆍ별지 제6호서식 및 별지 제7호서식에 따르고, 제1항제4호 및 제5호의 서류는 별지 제2호서식 및 별지 제3호서식에 따르며, 제6호부터 제17호까지의 서류는 별지 제8호서식부터 별지 제19호서식까지에 따르고, 제19호부터 제22호까지의 서류는 별지 제20호서식부터 별지 제23호서식까지에 따른다. 다만, 노인장기요양기관의 장이 첨부해야 하는 제1항제19호의 인건비명세서는 별지 제4호의2서식에 따른다. <개정 2005. 7. 15., 2012. 8. 7., 2018. 3. 30., 2020. 1. 7.>"}, {"p": 162, "t": "[제목개정 2020. 1. 7.]\n[시행일] 제20조제2항 단서의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일\n제3장 회계\n제1절 총칙\n제21조(수입 및 지출사무의 관리) ① 법인의 대표이사와 시설의 장은 법인과 시설의 수입 및 지출에 관한 사무를 관리한다.\n② 법인의 대표이사와 시설의 장은 수입 및 지출원인행위에 관한 사무를 각각 소속직원에게 위임할 수 있다.\n제22조(수입과 지출의 집행기관) ① 법인과 시설에는 수입과 지출의 현금출납업무를 담당하게 하기 위하여 각각 수입원과 지출원을 둔다. 다만, 법인 또는 시설의 규모가 소규모인 경우에는 수입원과 지출원을 동일인으로 할 수 있다.\n② 제1항의 수입원과 지출원은 각각 그 법인의 대표이사와 시설의 장이 임면한다."}, {"p": 163, "t": "제23조(회계의 방법) 회계는 단식부기에 의한다. 다만, 법인회계와 수익사업회계에 있어서 복식부기의 필요가 있는 경우에는 복식부기에 의한다.\n[전문개정 1993. 12. 27.]\n제24조(장부의 종류) ① 법인 및 시설에는 다음의 회계장부를 둔다. <개정 1998. 1. 7.>\n1. 현금출납부\n2. 총계정원장\n3. 삭제 <2012. 8. 7.>\n4. 재산대장\n5. 비품관리대장\n6. 삭제 <2009. 2. 5.>\n7. 삭제 <1998. 1. 7.>\n8. 삭제 <1998. 1. 7.>\n9. 삭제 <1998. 1. 7.>\n10. 삭제 <1998. 1. 7.>\n11. 삭제 <1998. 1. 7.>\n12. 삭제 <1998. 1. 7.>\n② 노인장기요양기관의 장이 제10조에 따른 예산을 기한 내에 제출하지 않은 경우에는 제1항제1호 및 제2호에 따른 회계장부(해당 회계연도 1월부터 6월까지의 회계장부를 말한다)를 해당 회계연도 8월 15일까지 시장ㆍ군수ㆍ구청장에게 정보시스템을 사용하여 제출해야 한다. <신설 2018. 3. 30., 2020. 1. 7.>\n③ 노인장기요양기관의 장이 제19조에 따른 결산보고서를 기한 내에 제출하지 않은 경우에는 제1항제1호 및 제2호에 따른 회계장부(해당 회계연도의 다음 연도 1월부터 6월까지의 회계장부를 말한다)를 해당 회계연도의 다음 연도 8월 15일까지 시장ㆍ군수ㆍ구청장에게 정보시스템을 사용하여 제출해야 한다. <신설 2020. 1. 7.>\n④ 제1항제1호부터 제5호까지의 규정에 따른 회계장부는 별지 제24호서식, 별지 제24호의2서식, 별지 제25호서식, 별지 제25호의2서식 및 별지 제26호서식부터 별지 제28호서식까지에 따른다. <개정 2009. 2. 5., 2018. 3. 30., 2020. 1. 7.>\n[시행일] 제24조제2항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일"}, {"p": 164, "t": "2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일\n제2절 수입\n제25조(수입금의 수납) ① 모든 수입금의 수납은 이를 금융기관에 취급시키는 경우를 제외하고는 수입원이 아니면 수납하지 못한다.\n② 수입원이 수납한 수입금은 그 다음날까지 금융기관에 예입하여야 한다. <개정 1998. 1. 7.>\n③ 제1항 및 제2항의 규정에 의한 수입금에 대한 금융기관의 거래통장은 제6조의 규정에 의한 회계별로 구분될 수 있도록 보관ㆍ관리하여야 한다. <신설 1998. 1. 7.>\n제26조(과년도 수입과 반납금 여입) ① 출납이 완결한 연도에 속하는 수입 기타 예산외의 수입은 모두 현년도의 세입에 편입하여야 한다.\n② 지출된 세출의 반납금은 각각 지출한 세출의 당해과목에 다시 넣을 수 있다. <개정 2019. 9. 27.>\n제27조(과오납의 반환) 과오납된 수입금은 수입한 세입에서 직접 반환한다.\n제3절 지출\n제28조(지출의 원칙) ① 지출은 제21조의 규정에 의한 지출사무를 관리하는 자 및 그 위임을 받아 지출명령이 있는 것에 한하여 지출원이 행한다.\n② 제1항의 지출명령은 예산의 범위안에서 하여야 한다."}, {"p": 165, "t": "제29조(지출의 방법) ① 지출은 상용의 경비 또는 소액의 경비지출을 제외하고는 예금통장에 의하거나 「전자문서 및 전자거래 기본법」 제2조제5호에 따른 전자거래로 행하여야 한다. 다만, 시설에 지원되는 국가 또는 지방자치단체의 보조금 지출은 보조금 결제 전용카드나 전용계좌를 이용하여야 한다. <개정 2009. 2. 5., 2012. 8. 7., 2012. 8. 31., 2015. 12. 24.>\n② 제1항에도 불구하고 지출원은 상용의 경비 또는 소액의 경비를 지출할 수 있으며, 이를 위하여 100만원 이하의 현금을 보관할 수 있다. <개정 2009. 2. 5., 2012. 8. 7.>\n③ 제1항 및 제2항에 따른 상용의 경비 또는 소액의 경비지출의 범위는 시ㆍ도지사가 정할 수 있다. <신설 2012. 8. 7.>\n제30조(지출의 특례) ① 선금지급할 수 있는 경비의 범위는 다음과 같다. <개정 2009. 2. 5., 2019. 9. 27.>\n1. 외국에서 직접 구입하는 기계, 도서, 표본 또는 실험용재료의 대가\n2. 정기간행물의 대가\n3. 토지 또는 가옥의 임대료와 용선료\n4. 운 임\n5. 소속직원중 특별한 사정이 있는 자에 대하여 지급하는 급여의 일부\n6. 관공서(「공공기관의 운영에 관한 법률」에 따른 공공기관 및 특별법에 의하여 설립된 특수법인을 포함한다)에 대하여 지급하는 경비\n7. 외국에서 연구 또는 조사에 종사하는 자에 대하여 지급하는 경비\n8. 보조금\n9. 사례금\n10. 계약금액이 1천만원이상인 공사나 제조 또는 물건의 매입을 하는 경우에 계약금액의 100분의 50을 초과하지 아니하는 금액\n② 추산지급할 수 있는 경비의 범위는 다음과 같다. <개정 2009. 2. 5., 2019. 9. 27.>\n1. 여비 및 판공비\n2. 관공서(「공공기관의 운영에 관한 법률」에 따른 공공기관 및 특별법에 의하여 설립된 특수법인을 포함한다)에 대하여 지급하는 경비\n3. 보조금\n4. 소송비용\n제4절 계약"}, {"p": 166, "t": "제30조의2(계약의 원칙) 계약에 관한 사항은 「지방자치단체를 당사자로 하는 계약에 관한 법률」, 같은 법 시행령 및 같은 법 시행규칙을 준용한다. 다만, 국가ㆍ지방자치단체ㆍ법인 외의 자가 설치ㆍ운영하는 시설의 경우에는 그러하지 아니하다. <개정 2012. 8. 7., 2015. 12. 24.>\n[전문개정 2009. 2. 5.]\n제31조(계약담당자) ① 계약에 관한 사무는 각각 그 법인의 대표이사와 시설의 장이 처리한다.\n② 법인의 대표이사와 시설의 장은 계약체결에 관한 사무를 소속직원에게 위임할 수 있다.\n제32조 삭제 <2009. 2. 5.>\n제33조 삭제 <2009. 2. 5.>\n제34조 삭제 <2009. 2. 5.>\n제35조 삭제 <2009. 2. 5.>\n제36조 삭제 <2009. 2. 5.>\n제37조 삭제 <2009. 2. 5.>\n제37조의2 삭제 <2009. 2. 5.>\n제4장 물품\n제38조(물품의 관리자와 출납원) ① 법인의 대표이사와 시설의 장은 그 소관에 속하는 물품(현금 및 유가증권을 제외한 동산을 말한다. 이하 같다)을 관리한다. <개정 1998. 1. 7.>\n② 법인의 대표이사와 시설의 장은 그 소관에 속하는 물품관리에 관한 사무를 소속직원에게 위임할 수 있다."}, {"p": 167, "t": "③ 법인의 대표이사와 시설의 장(제2항의 규정에 의하여 위임을 받은 자를 포함한다. 이하 “물품관리자”라 한다)은 물품의 출납보관을 위하여 소속직원중에서 물품출납원을 지정하여야 한다.\n제39조(물품의 관리의무) 물품관리자 및 물품출납원은 선량한 관리자의 주의로써 사무에 종사하여야 한다.\n제40조(물품의 관리) ① 물품관리자는 물품을 출납하게 하고자 할 때에는 물품출납원에게 출납하여야 할 물품의 분류를 명백히 하여 그 출납을 명령하여야 한다.\n② 물품출납원은 제1항의 규정에 의한 명령이 없이는 물품을 출납할 수 없다.\n제40조의2(재물조사) 법인의 대표이사와 시설의 장은 연 1회 그 관리에 속하는 물품에 대하여 정기적으로 재물조사를 실시하여야 하며, 필요하다고 인정하는 때에는 정기재물조사외에 수시로 재물조사를 할 수 있다.\n[본조신설 1998. 1. 7.]\n제41조(불용품의 처리) ① 법인과 시설의 물품관리자는 물품중 그 사용이 불가능하거나 수리하여 다시 사용할 수 없게 된 물품이 있을 때에는 그 물품에 대하여 불용의 결정을 하여야 한다.\n② 제1항의 규정에 의한 불용품을 매각한 경우 그 대금은 당해법인 또는 시설의 세입예산에 편입시켜야 한다.\n제4장의2 후원금의 관리 <신설 1998. 1. 7.>\n제41조의2(후원금의 범위등) ① 법인의 대표이사와 시설의 장은 「사회복지사업법」 제45조에 따른 후원금의 수입ㆍ지출 내용과 관리에 명확성이 확보되도록 하여야 한다. 시설거주자가 받은 개인결연후원금을 당해인이 정신질환 기타 이에 준하는 사유로 관리능력이 없어 시설의 장이 이를 관리하게 되는 경우에도 또한 같다. <개정 1999. 3. 11., 2012. 8. 7.>\n② 삭제 <1999. 3. 11.>\n[본조신설 1998. 1. 7.]"}, {"p": 168, "t": "제41조의3 삭제 <1999. 3. 11.>\n제41조의4(후원금의 영수증 발급 등) ① 법인의 대표이사와 시설의 장은 후원금을 받은 때에는 「소득세법 시행규칙」 제101조제20호의2에 따른 기부금영수증 서식 또는 「법인세법 시행규칙」 제82조제7항제3호의3에 따른 기부금영수증 서식에 따라 후원금 영수증을 발급하여야 하며, 영수증 발급목록을 별도의 장부로 작성ㆍ비치하여야 한다. <개정 2009. 2. 5., 2012. 8. 7.>\n② 법인의 대표이사와 시설의 장은 금융기관 또는 체신관서의 계좌입금을 통하여 후원금을 받은 때에는 법인명의의 후원금전용계좌나 시설의 명칭이 부기된 시설장 명의의 계좌(이하 “후원금전용계좌등”이라 한다)를 사용하여야 한다. 이 경우 후원자가 영수증 발급을 원하는 경우를 제외하고는 제1항에 따른 영수증의 발급을 생략할 수 있다. <개정 2009. 2. 5.>\n③ 법인의 대표이사 및 시설의 장은 후원금을 받을 때에는 각각의 법인 및 시설별로 후원금전용계좌등을 구분하여 사용하여야 하며, 미리 후원자에게 후원금전용계좌등의 구분에 관한 사항을 안내하여야 한다. <신설 2012. 8. 7.>\n④ 모든 후원금의 수입 및 지출은 후원금전용계좌등을 통하여 처리하여야 한다. 다만, 물품 형태의 후원금은 그러하지 아니하다. <신설 2012. 8. 7.>\n[전문개정 2005. 7. 15.]\n[제목개정 2009. 2. 5.]\n제41조의5(후원금의 수입 및 사용내용통보) 법인의 대표이사와 시설의 장은 연 1회이상 해당 후원금의 수입 및 사용내용을 후원금을 낸 법인ㆍ단체 또는 개인에게 통보하여야 한다. 이 경우 법인이 발행하는 정기간행물 또는 홍보지등을 이용하여 일괄 통보할 수 있다.\n[본조신설 1998. 1. 7.]\n제41조의6(후원금의 수입ㆍ사용결과 보고 및 공개) ① 법인의 대표이사와 시설의 장은 제19조 및 제20조에 따른 결산보고서를 제출할 때에 별지 제19호서식에 따른 후원금수입 및 사용결과보고서(전산파일을 포함한다)를 관할 시장ㆍ군수ㆍ구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. <개정 2005. 7. 15., 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.>\n② 시장ㆍ군수ㆍ구청장은 제1항에 따라 제출받은 후원금수입 및 사용결과보고서를 제출받은 날부터 20일 이내에 인터넷 등을 통하여 3개월 동안 공개하여야 하며, 법인의 대표이사 및 시설의 장은 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 같은 기간 동안 공개하여야 한다. 다만, 후원자의 성명(법인 등의 경우는 그 명칭)은 공개하지 아니한다. <신설 2005. 7. 15., 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.>"}, {"p": 169, "t": "③ 제2항에 따른 공개는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하는 것으로 갈음할 수 있다. <신설 2015. 12. 24.>\n[본조신설 1998. 1. 7.]\n[제목개정 2005. 7. 15.]\n제41조의7(후원금의 용도외 사용금지) ① 법인의 대표이사와 시설의 장은 후원금을 후원자가 지정한 사용용도외의 용도로 사용하지 못한다.\n② 보건복지부장관은 후원자가 사용용도를 지정하지 아니한 후원금에 대하여 그 사용기준을 정할 수 있다. <신설 2012. 8. 7.>\n③ 후원금의 수입 및 지출은 제10조의 규정에 의한 예산의 편성 및 확정절차에 따라 세입ㆍ세출예산에 편성하여 사용하여야 한다. <개정 2012. 8. 7.>\n[본조신설 1998. 1. 7.]\n제5장 감사\n제42조(감사) ① 법인의 감사는 당해법인과 시설에 대하여 매년 1회이상 감사를 실시하여야 한다.\n② 법인의 대표이사는 시설의 장과 수입원 및 지출원이 사망하거나 경질된 때에는 그 관장에 속하는 수입, 지출, 재산, 물품 및 현금등의 관리상황을 감사로 하여금 감사하게 하여야 한다.\n③ 제2항에 따른 감사를 실시할 때에는 전임자가 참관해야 하며, 전임자가 참관할 수 없으면 관계 직원 중에서 전임자의 전임자나 법인의 대표이사가 지정한 사람이 참관해야 한다. <개정 2019. 9. 27.>\n④ 감사는 제1항 내지 제3항의 규정에 의하여 감사를 한 때는 감사보고서를 작성하여 당해법인의 이사회에 보고하여야 하며, 재산상황 또는 업무집행에 관하여 부정 또는 불비한 점이 발견된 때에는 시장ㆍ군수ㆍ구청장에게 보고하여야 한다.\n⑤ 제4항의 감사보고서에는 감사가 서명 또는 날인하여야 한다. <개정 1998. 1. 7.>"}, {"p": 170, "t": "제42조의2(회계감사) ① 시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장은 법인 및 시설이 다음 각 호의 어느 하나에 해당하는 경우 회계감사를 실시할 수 있다.\n1. 「사회복지사업법」 제40조제1항제4호에 따른 회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 경우\n2. 「사회복지사업법」 제42조제3항제1호에 따라 거짓이나 그 밖의 부정한 방법으로 보조금을 받은 경우\n3. 「사회복지사업법」 제42조제3항제2호에 따라 사업 목적 외의 용도에 보조금을 사용한 경우\n4. 「사회복지사업법」 또는 「사회복지사업법」에 따른 명령을 위반한 경우\n5. 제42조제4항에 따라 감사가 시장ㆍ군수ㆍ구청장에게 보고한 경우\n② 제1항에서 규정한 사항 외에 공인회계사 또는 감사인의 추천 등 회계감사의 실시와 관련하여 필요한 사항은 해당 지방자치단체의 조례로 정한다.\n[본조신설 2019. 6. 12.]\n제6장 보칙\n제43조(사무의 인계ㆍ인수) ① 회계사무를 담당하는 직원이 교체된 때에는 당해사무의 인계ㆍ인수는 발령일로부터 5일이내에 행하여져야 한다. <개정 2012. 8. 7.>\n② 인계자는 인계할 장부와 증빙서류등의 목록을 각각 3부씩 작성하여 인계ㆍ인수자가 각각 서명 또는 날인한 후 각각 1부씩 보관하고, 1부는 이를 예금잔고증명과 함께 인계ㆍ인수보고서에 첨부하여 법인의 대표이사 및 시설의 장에게 제출하여야 한다. 이 경우 법인이 설치ㆍ운영하는 시설에 있어서는 시설의 장을 거쳐 제출하여야 한다. <개정 2012. 8. 7., 2015. 12. 24.>\n제44조(시행세칙) 이 규칙의 시행을 위하여 필요한 세부사항은 보건복지부장관이 정한다. <개정 1998. 1. 7., 2008. 3. 3., 2010. 3. 19.>\n제45조 삭제 <2018. 12. 28.>\n부  칙 <제813호, 1988. 2. 8.>\n① (시행일) 이 규칙은 1988년 6월 1일부터 시행한다.\n② (정관변경에 관한 경과조치) 법인의 정관중 재무 및 회계에 관한 규정은 이 규칙 시행일로부터 6월이내에 이 규칙에 맞게 변경하여 정관변경허가를 받아야 한다."}, {"p": 171, "t": "부  칙 <제922호, 1993. 12. 27.>\n이 규칙은 1994년 1월 1일부터 시행한다.\n부  칙 <제57호, 1998. 1. 7.>\n이 규칙은 공포한 날부터 시행한다.\n부  칙 <제98호, 1999. 3. 11.>\n이 규칙은 공포한 날부터 시행한다.\n부  칙 <제323호, 2005. 7. 15.>\n① (시행일) 이 규칙은 공포 후 2월이 경과한 날부터 시행한다. 다만, 제41조의4의 개정규정은 2006년 1월 1일부터 시행한다.\n② (후원금수입및사용결과보고에 관한 적용례) 제41조의6의 개정규정과 별지 제19호서식은 2006년 상반기 보고분부터 적용한다.\n③ (서식에 관한 경과조치) 이 규칙 시행당시 종전의 규정에 의한 서식은 2005년 12월 31일까지 이 규칙에 의한 서식과 함께 사용할 수 있다.\n부  칙 <제1호, 2008. 3. 3.>(보건복지가족부와 그 소속기관 직제 시행규칙)\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다.\n제2조 생략"}, {"p": 172, "t": "제3조(다른 법령의 개정) ① 부터 ㊵ 까지 생략\n㊶ 사회복지법인 재무ㆍ회계 규칙 일부를 다음과 같이 개정한다.\n제44조 중 “보건복지부장관”을 “보건복지가족부장관”으로 한다.\n㊷ 부터 <94> 까지 생략\n부  칙 <제91호, 2009. 2. 5.>\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다.\n제2조(계약에 관한 적용례) 제30조의2, 제32조부터 제37조까지 및 제37조의2의 개정규정은 이 규칙 시행 후 최초로 계약을 체결하는 경우부터 적용한다.\n부  칙 <제1호, 2010. 3. 19.>(보건복지부와 그 소속기관 직제 시행규칙)\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다. <단서 생략>\n제2조 생략\n제3조(다른 법령의 개정) ① 부터 ㉝ 까지 생략\n㉞ 사회복지법인 재무ㆍ회계 규칙 일부를 다음과 같이 개정한다.\n제10조제2항제4호 및 제44조 중 “보건복지가족부장관”을 각각 “보건복지부장관”으로 한다.\n㉟ 부터 <84> 까지 생략\n부  칙 <제152호, 2012. 8. 7.>\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다. 다만, 제6조의2의 개정규정은 2013년 1월 1일부터 시행한다.\n제2조(후원금 수입 및 사용결과 보고에 관한 적용례) 별지 제19호서식의 개정규정은 2013년도 후원금에 대한 보고를 하는 것부터 적용한다.\n부  칙 <제269호, 2012. 8. 31.>(전자문서 및 전자거래 기본법 시행규칙)\n제1조(시행일) 이 규칙은 2012년 9월 2일부터 시행한다.\n제2조 생략\n제3조(다른 법령의 개정) ① 및 ② 생략\n③ 사회복지법인 및 사회복지시설 재무ㆍ회계 규칙 일부를 다음과 같이 개정한다.\n제29조제1항 본문 중“「전자거래기본법」”을 “「전자문서 및 전자거래 기본법」”으로 한다.\n④ 생략\n제4조 생략\n부  칙 <제283호, 2015. 1. 5.>\n(규제 재검토기한 설정 등 규제정비를 위한 감염병의 예방 및 관리에 관한 법률 시행규칙 등 일부개정령)\n이 규칙은 공포일로부터 시행한다.\n부  칙 <제377호, 2015. 12. 24.>\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다.\n제2조(출납기한에 관한 적용례) 제5조의 개정규정은 2015년 회계연도의 출납기한부터 적용한다.\n제3조(어린이집의 회계연도에 관한 특례) 제3조 단서의 개정규정에도 불구하고 어린이집의 회계연도에 관하여는 2016년 1월 및 2월은 2015년도 회계연도에 포함한다."}, {"p": 173, "t": "부  칙 <제480호, 2017. 2. 14.>\n이 규칙은 2017년 3월 1일부터 시행한다.\n부  칙 <제565호, 2018. 3. 30.>\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다. 다만, 제6조의2제4항, 제11조제2항 단서, 제20조제2항 단서 및 제24조제2항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호ㆍ제3호의 서비스를 제공하는 노인장기요양기관(이하 “주ㆍ야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호ㆍ제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주ㆍ야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일\n제2조(예산과목 구분 및 임직원 보수 일람표에 관한 적용례) 별표 9, 별표 10 및 별지 제4호의2서식의 개정규정은 다음 각 호의 구분에 따른 때부터 적용한다.\n1. 부칙 제1조제1호 및 제2호의 기관: 2019년도 예산을 편성할 때\n2. 부칙 제1조제3호 및 제4호의 기관: 2020년도 예산을 편성할 때\n제3조(경과조치) ① 부칙 제1조제1호 및 제2호의 기관은 다음 각 호의 구분에 따라 사무를 처리한다.\n1. 2018년도 세입예산과목은 종전의 별표 3에 따른다.\n2. 2018년도 세출예산과목은 종전의 별표 4에 따른다.\n3. 2018년도 결산보고 시의 임직원 보수 일람표는 별지 제4호서식에 따른다.\n② 부칙 제1조제3호 및 제4호의 기관은 다음 각 호의 구분에 따라 사무를 처리한다."}, {"p": 174, "t": "1. 2019년도 세입예산과목은 종전의 별표 3에 따른다.\n2. 2019년도 세출예산과목은 종전의 별표 4에 따른다.\n3. 2019년도 결산보고 시의 임직원 보수 일람표는 별지 제4호서식에 따른다.\n③ 종전의 별표 4에 따라 편성된 운영충당적립금(911목) 및 시설환경 개선준비금(1011목)은 다음 각 호의 구분에 따른 날부터 각각 별표 10의 개정규정에 따라 편성된 운영충당적립금(911목) 및 시설환경 개선준비금(912목)으로 본다.\n1. 부칙 제1조제1호 및 제2호의 기관: 2019년 1월 1일\n2. 부칙 제1조제3호 및 제4호의 기관: 2020년 1월 1일\n부  칙 <제606호, 2018. 12. 28.>\n(행정규제기본법에 따른 일몰규제 정비를 위한 31개 법령의 일부개정에 관한 보건복지부령)\n이 규칙은 2019년 1월 1일부터 시행한다.\n부  칙 <제642호, 2019. 6. 12.>\n이 규칙은 2019년 6월 12일부터 시행한다.\n부  칙 <제672호, 2019. 9. 27.>\n(어려운 법령용어 정비를 위한 48개 법령의 일부개정에 관한 보건복지부령)\n이 규칙은 공포한 날부터 시행한다.\n부  칙 <제701호, 2020. 1. 7.>\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다.\n제2조(결산보고서 제출에 관한 적용례) 제20조제1항 각 호 외의 부분 단서의 개정규정은 2020년 결산보고서를 제출하는 경우부터 적용한다.\n부  칙 <제724호, 2020. 5. 6.>\n이 규칙은 공포한 날부터 시행한다.\n부  칙 <제831호, 2021. 9. 30.>\n이 규칙은 공포한 날부터 시행한다."}, {"p": 175, "t": "[별표 1] <개정 2012.8.7>\n법인회계 세입예산과목구분 (제10조제3항 본문 관련)\n과  목 | 내  역\n관 | 항 | 목\n01 | 재산수입 | 11 | 기본재산수입 | 111 | 임대료수입 | 부동산 임대수입\n112 | 배당 및 이자수입 | 소유주식배당수입, 예금이자수입\n113 | 재산매각수입 | 부동산매각수입\n114 | 기타수입 | 불용재산매각 등 그 밖의 재산수입\n02 | 사업수입 | 21 | 사업수입 | 211 | ○○사업수입 | 법인의 자체사업으로 얻어지는 수입 ※ 법인의 수익사업은 수익사업회계로 처리\n03 | 과년도수입 | 31 | 과년도수입 | 311 | 과년도수입 | 전년도에 세입조정된 수입으로서 금년도에 수입으로 확정된 것\n04 | 보조금수입 | 41 | 보조금수입 | 411 | 국고보조금 | 국가로부터 받은 경상보조금 및 자본 보조금\n412 | 시･도 보조금 | 시･도로부터 받은 경상보조금 및 자본 보조금\n413 | 시･군･구보조금 | 시･군･구로부터 받은 경상보조금 및 자본보조금\n414 | 기타 보조금 | 그 밖에 국가, 지방자치단체 및 사회 복지사업 기금 등에서 공모사업 선정으로 받은 보조금\n05 | 후원금수입 | 51 | 후원금수입 | 511 | 지정후원금 | 국내외 민간단체 및 개인으로부터 후원 명목 으로 받은 기부금･결연후원금･위문금･찬조금 중 후원목적이 지정된 수입\n과  목 | 내  역\n512 | 비지정후원금 | 국내외 민간단체 및 개인으로부터 후원 명목 으로 받은 기부금･결연후원금･위문금･찬조 n1. 민간단체 보조금품 | 국내 민간단체로부터 받은 보조금\n2. 외원단체 보조금품 | 외국 민간원조단체로부터 받은 보조금품\n3. 결연후원금품 | 아동･노인 등 시설거주자에 대한 결연후원금품\n4. 법인임원 후원금품 | 법인 임원으로부터 받은 후원금품 및 찬조금품\n5. 지역사회 후원금품 | 지역사회로부터 받은 위문금품 및 후원금품\n6. 후원회 지원금품 | 법인의 후원회로부터 받은 지원금품\n7. 자선모금품 | 자선바자회 등으로부터 얻어지는 수입금품\n8. 기타 후원금품 | 행정기관의 시설위문금 등 후원금품"}, {"p": 221, "t": "(뒤쪽)\n\n○ 후원자 구분\n후원자 구분 | 내용 | 모금자기관 여부 | 기부금단체 여부\n1. 개인 | 개인 | 입력(Y/N) | 입력안함\n2. 영리법인 | 기업 | 입력(Y/N) | 입력안함\n3. 비영리법인 | 공익법인 등(종교법인, 학교법인, 의료법인, 사회복지법인, 기타*) ➝ 비영리법인구분란에 기재 * 기타인 경우 그 내용을 기타내용에 기재 | 입력(Y/N) | 입력(Y/N)\n4. 민간단체 | 비영리단체, 외국민간원조단체, 민간단체 기타 | 입력(Y/N) | 입력(Y/N)\n5. 국가기관 | 입법기관･사법기관･행정기관(중앙행정기관 및 그 소속 기관, 지방자치단체) | 입력안함 | 입력안함\n6. 공공기관 | 공기업, 준정부기관, 그 밖의 공공기관 | 입력안함 | 입력안함\n7. 소관법인 | 해당 시설을 설치･운영하는 법인 * 법인의 후원금이 전출금 형태로 시설에 전달 | 입력안함 | 입력안함\n*모금자 기관：「기부금품 모집 및 사용에 관한 법률」 제4조에 따라 기부금품 모집을 목적으로 행정안전부장관 또는 특별시장･광역시장･도지사･특별자치도지사에게 등록한 모금자(기관) **기부금단체：「소득세법 시행령」･「소득세법 시행규칙」에 따른 기부금대상 민간단체, 「법인세법 시행령」･「법인세법 시행규칙」에 따른 지정기부금단체 등\n○ 후원받은 순서대로 계속 기록하여야 합니다.\n(뒤쪽)\n○ 수입명세서의 내역란은 후원자의 후원용도･취지 등을 구체적으로 기재하여야 합니다.\n"}, {"p": 222, "t": "[별지 제20호서식]\n인 건 비 명 세 서\n구  분 | 금  액 | 산 출 내 역 | 비  고\n |  |  | \n3106-80일 87.5.29 승인 | 190㎜×268㎜ (신문용지 54g/㎡)"}, {"p": 223, "t": "[별지 제21호서식]\n사 업 비 명 세 서\n구  분 | 내  역 | 금  액 | 산 출 내 역 | 비  고\n |  |  |  | \n3106-81일 87.5.29 승인 | 190㎜×268㎜ (신문용지 54g/㎡)"}, {"p": 224, "t": "[별지 제22호서식]\n(           ) 비 용 명 세 서\n구  분 | 내  역 | 금  액 | 산 출 내 역 | 비  고\n |  |  |  | \n3106-82일 87.5.29 승인 | 190㎜×268㎜ (신문용지 54g/㎡)"}, {"p": 225, "t": "[별지 제23호서식] <개정 2009.2.5>\n감 사 보 고 서\n본인 등은 사회복지법인재무･회계규칙 제20조제1항의 규정에 따라 사회복지 법인 ○○○의        .   .   .부터       .   .   .로 종결되는 회계연도의 업무집행 내용과 ○○회계에 속하는 수입과 지출에 관한 제반 증빙서류와 장부를 일반적인 감사기준에 따라 감사를 실시하였습니다.\n업무집행내용과 결산서의 각항은(다음에 지적된 사항을 제외하고는) 정확하였으며, 그 회계처리는 적정하였습니다."}, {"p": 227, "t": "(다  음)\n년       월       일\n사회복지법인              ○○○\n감사              (서명 또는 인)\n감사              (서명 또는 인)\n사회복지법인 ○○○대표이사  귀하\n31313-19211일 97.12.6 승인\n210㎜×297㎜ (일반용지 60g/㎡)"}, {"p": 228, "t": "[별지 제25호서식] <개정 2005.7.15>\n총 계 정 원 장 (법인용)\n계정과목 :\n계정명 | 연월일 | 적  요 | 수 입 | 지 출 | 차인잔액\n |  |  |  |  | \n210㎜×297㎜(일반용지 60g/㎡(재활용품))"}, {"p": 229, "t": "[별지 제25호의2서식] <개정 2005.7.15>\n총 계 정 원 장 (시설용)\n계정과목 :\n계정명 | 연월일 | 적  요 | 수 입 | 지 출 | 차인잔액\n |  |  |  |  | \n210㎜×297㎜(일반용지 60g/㎡(재활용품))"}, {"p": 230, "t": "[별지 제26호서식]"}, {"p": 231, "t": "총 계 정 원 장 보 조 부\n연월일 | 적  요 | 수  입 | 지  출 | 잔  액\n계 | 현금 | 예금 | 계 | 현금 | 예금 | 계 | 현금 | 예금\n |  |  |  |  |  |  |  |  |  | \n3106-85일 87.5.29 승인 | 210㎜×297㎜ (인쇄용지(특급) 70g/㎡)"}]}]}, {"no": 8, "title": "사회복지법인 Q&A 모음", "start": 239, "end": 256, "sections": [{"title": "사회복지법인 Q&A", "start": 239, "end": 256, "html": "<div class=\"pchip\" id=\"p239\"><span>원문 239쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=245\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2026년 사회복지법인 관리안내･Ministry of Health &amp; Welfare<\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>사회복지법인 Q&amp;A 모음<\/div><div class=\"pchip\" id=\"p241\"><span>원문 241쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=247\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">법인의 기본재산 출연 규모<\/div><div class=\"ln p\">사회복지법인 설립시 기본재산 출연 규모<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>사회복지시설의 설치･운영을 목적으로 하는 법인은 당해 법인이 설치･운영하고자 하는 시설을 갖출 수 있는 목적사업용 기본재산을 갖추어야 하고, 사회복지사업을 지원하는 것을 목적으로 하는 법인은 법인의 운영경비의 전액을 충당할 수 있는 기본재산을 갖추어야 하는 바,<br>시설법인은 시설을 설치할 수 있는 부동산과 건축물을 구입･설치할 수 있는 정도의 재산(현금 또는 유가증권 등) 또는 시설로 사용할 수 있는 부동산을 소유하여야 할 것이며, 그 시설의 운영에 소요되는 경비를 충당할 수 있는 재산(일정한 수익을 얻을 수 있는 부동산 또는 현금)을 소유하여야 할 것임. 특히 시설 운영경비는 종사자 인건비, 시설운영비 등으로 기본재산을 지출하는 것이 아니라 기본재산에서 발생되는 수익에 의하여 운영되어야 할 것이며, 기본재산은 시설 운영에 따라 잠식되어서는 아니됨<br>시설의 설치운영을 목적으로 하지 아니하는 법인의 경우에는 법인의 설립목적사업을 수행하기 위하여 매년 소요되는 사업비용의 전액을 충당할 수 있는 기본재산의 출연이 필요함<br>이와 같이 사회복지법인은 법인이 하고자 하는 목적사업의 종류･규모 및 운영방법에 따라 개별적으로 정해져야 하며 일반적인 출연재산의 규모를 제한하고 있지는 아니함<\/td><td><\/td><\/tr><tr>
