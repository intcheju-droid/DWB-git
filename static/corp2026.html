한 개별필지에 대한 지가확인서(교환의 경우에는 쌍방의 재산에 관한 것이어야 한다)<\/div><div class=\"ln p\">3. 총회 또는 이사회 회의록 사본<\/div><div class=\"ln p\">4. 교환재산 또는 처분대금의 처리에 관한 사항을 기재한 서류(교환 또는 매도의 경우에 한한다)<\/div><div class=\"ln p\">② 삭제 &lt;1995. 7. 6.&gt;<\/div><div class=\"ln p\">③ 법 제11조제3항제1호에 따라 기본재산의 담보에 관한 허가를 받으려는 경우에는 그 허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출하여야 한다. &lt;개정 2011. 8. 19., 2016. 11. 29.&gt;<\/div><div class=\"ln p\">1. 담보에 제공할 재산목록<\/div><div class=\"ln p\">2. 피담보채권액<\/div><div class=\"ln p\">3. 담보권자<\/div><div class=\"ln p\">4. 상환방법 및 상환계획<\/div><div class=\"ln p\">5. 총회 또는 이사회 회의록 사본<\/div><div class=\"ln p\">④ 법 제11조제3항제1호에 따라 기본재산의 용도변경에 관한 허가를 받으려는 경우 또는 기본재산에 대한 의무를 부담하거나 권리를 포기하려는 경우에는 허가신청서에 그 사유를 적어야 한다. &lt;개정 2011. 8. 19., 2016. 11. 29.&gt;<\/div><div class=\"pchip\" id=\"p283\"><span>원문 283쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=289\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제18조(장기차입에 대한 허가) ① 공익법인이 법 제11조제3항제2호에 따라 주무관청의 허가를 받아야 할 장기차입은 차입하려는 금액을 포함한 장기차입금의 총액이 기본재산 총액에서 차입 당시의 부채 총액을 공제한 금액의 100분의 5에 상당하는 금액 이상인 경우로 한다. &lt;개정 1995. 7. 6., 2011. 8. 19., 2016. 11. 29.&gt;<\/div><div class=\"ln p\">② 공익법인이 해당 연도의 예산으로 상환할 단기차입을 행한 경우에는 예산수입ㆍ지출을 명확히 하여 해당 연도 안에 반드시 상환할 수 있도록 해야 한다. &lt;개정 2021. 1. 5.&gt;<\/div><div class=\"ln p\">제18조의2(기본재산의 보통재산으로의 편입) ① 법 제11조제3항제3호에서 “기본재산의 운용수익이 감소하거나 기부금 또는 그 밖의 수입금이 감소하는 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 사유를 말한다.<\/div><div class=\"ln p\">1. 기본재산의 운용수익이 감소한 경우<\/div><div class=\"ln p\">2. 기부금 등 무상으로 취득한 재산이 감소한 경우<\/div><div class=\"ln p\">3. 회비수입이 감소한 경우<\/div><div class=\"ln p\">4. 법 제4조제3항에 따른 수익사업의 수익이 감소한 경우<\/div><div class=\"ln p\">5. 그 밖에 제1호부터 제4호까지에 준하는 사유로 보통재산이 고갈된 경우<\/div><div class=\"ln p\">② 공익법인은 법 제11조제3항제3호에 따라 기본재산을 보통재산으로 편입하려는 경우에는 그 허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. &lt;개정 2020. 12. 1., 2021. 1. 5.&gt;<\/div><div class=\"ln p\">1. 기본재산명세서 및 편입재산명세서<\/div><div class=\"ln p\">2. 기본재산의 평가액을 소명할 수 있는 자료(기본재산이 부동산인 경우에는 감정평가법인등이 작성한 감정평가서 또는 시장ㆍ군수 또는 구청장이 「부동산 가격공시에 관한 법률」 제8조에 따라 표준지의 공시지가를 기준으로 하여 산정한 개별필지에 대한 지가확인서를 포함한다)<\/div><div class=\"ln p\">3. 보통재산 편입 이후 2 사업연도분의 사업계획서 및 수입ㆍ지출예산서<\/div><div class=\"ln p\">4. 제1항 각 호의 사유로 정관에서 정한 목적사업의 수행이 현저히 곤란함을 소명할 수 있는 자료<\/div><div class=\"ln p\">5. 총회 또는 이사회 회의록 사본<\/div><div class=\"ln p\">[본조신설 2016. 11. 29.]<\/div><div class=\"ln p\">[종전 제18조의2는 제18조의3으로 이동 &lt;2016. 11. 29.&gt;]<\/div><div class=\"ln p\">제18조의3(기본재산의 처분 등의 신고) ① 법 제11조제4항제1호에서 “매도ㆍ교환 또는 용도변경 등 대통령령으로 정하는 경우”란 기본재산을 매도ㆍ교환 또는 용도변경하거나 담보로 제공(이하 “매도등”이라 한다)하는 경우를 말한다. &lt;개정 2016. 11. 29.&gt;<\/div><div class=\"pchip\" id=\"p284\"><span>원문 284쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=290\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">② 법 제11조제4항에 따라 신고함으로써 매도등을 할 수 있거나 보통재산으로 편입할 수 있는 기본재산의 범위는 「상속세 및 증여세법」 제61조부터 제66조까지의 규정을 준용하여 평가한 기본재산의 가액을 기준으로 한다. 이 경우 「상속세 및 증여세법」 제63조제1항제1호가목 중 “평가기준일 이전ㆍ이후 각 2개월”은 각각 “매도등을 한 날 또는 편입신고를 한 날의 직전 거래일부터 이전 2개월”로 본다. &lt;개정 2016. 11. 29.&gt;<\/div><div class=\"ln p\">③ 「상속세 및 증여세법」 제16조제2항에 따른 성실공익법인(이하 “성실공익법인”이라 한다)이 법 제11조제4항제1호 및 이 조 제1항에 따라 기본재산의 매도등을 한 경우에는 그 매도등을 한 날부터 3주일 이내에 그 신고서에 다음 각 호의 서류를 첨부하여 주무관청에 제출하여야 하며, 같은 기간 내에 주무관청에 법 제11조제2항에 따른 정관변경 허가를 신청하여야 한다. &lt;개정 2016. 11. 29.&gt;<\/div><div class=\"ln p\">1. 기본재산명세서 및 매도등을 한 재산의 명세서(제2항에 따른 평가액을 소명할 수 있는 자료를 각각 포함한다)<\/div><div class=\"ln p\">2. 총회 또는 이사회 회의록 사본<\/div><div class=\"ln p\">3. 성실공익법인에 해당함을 소명할 수 있는 자료<\/div><div class=\"ln p\">④ 성실공익법인이 법 제11조제4항제2호에 따라 기본재산을 보통재산으로 편입하려는 경우에는 그 신고서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. &lt;신설 2016. 11. 29., 2021. 1. 5.&gt;<\/div><div class=\"ln p\">1. 기본재산명세서 및 편입재산명세서(제2항에 따른 평가액을 소명할 수 있는 자료를 각각 포함한다)<\/div><div class=\"ln p\">2. 보통재산 편입 이후 2 사업연도분의 사업계획서 및 수입ㆍ지출예산서<\/div><div class=\"ln p\">3. 제18조의2제1항 각 호의 사유로 정관에서 정한 목적사업의 수행이 현저히 곤란함을 소명할 수 있는 자료<\/div><div class=\"ln p\">4. 총회 또는 이사회 회의록 사본<\/div><div class=\"ln p\">5. 직전 편입이 있은 날부터 최소 3년이 경과하였음을 소명할 수 있는 자료. 다만, 최초 편입인 경우는 제외한다.<\/div><div class=\"ln p\">6. 성실공익법인에 해당함을 소명할 수 있는 자료<\/div><div class=\"ln p\">⑤ 법 제11조제4항제2호에 따라 기본재산을 보통재산으로 편입한 성실공익법인은 편입을 한 날부터 3주일 이내에 주무관청에 법 제11조제2항에 따른 정관변경 허가를 신청하여야 한다. &lt;신설 2016. 11. 29.&gt;<\/div><div class=\"ln p\">⑥ 제3항 또는 제4항에 따른 신고서를 제출받은 주무관청은 지체 없이 제3항 또는 제4항 각 호의 서류를 검토하여야 하며, 필요한 경우 공익법인에게 보정(補正)을 요구할 수 있다. 이 경우 성실공익법인은 보정을 요구받은 날부터 1주일 이내에 이를 보정하여야 한다. &lt;개정 2016. 11. 29.&gt;<\/div><div class=\"pchip\" id=\"p285\"><span>원문 285쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=291\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[본조신설 2011. 8. 19.]<\/div><div class=\"ln p\">[제목개정 2016. 11. 29.]<\/div><div class=\"ln p\">[제18조의2에서 이동 &lt;2016. 11. 29.&gt;]<\/div><div class=\"ln p\">제19조(사업계획등의 제출) ① 공익법인이 법 제12조제2항의 규정에 의하여 제출하는 사업계획 및 예산은 당해 사업의 회계연도 개시 1월전까지 행하여야 하며, 다음 각호의 서류를 첨부하여야 한다.<\/div><div class=\"ln p\">1. 추정대차대조표 및 그 부속명세서<\/div><div class=\"ln p\">2. 추정손익계산서 및 그 부속명세서<\/div><div class=\"ln p\">② 공익법인이 법 제12조제2항에 따라 제출하는 사업실적 및 결산은 해당 사업의 회계연도 종료후 3개월 이내에 행하여야 하며, 다음 각호의 서류를 첨부하여야 한다. &lt;개정 2011. 8. 19.&gt;<\/div><div class=\"ln p\">1. 대차대조표 및 그 부속명세서<\/div><div class=\"ln p\">2. 손익계산서 및 그 부속명세서<\/div><div class=\"ln p\">3. 공인회계사의 감사증명서. 다만, 주무관청이 필요하다고 인정하여 첨부하게 한 경우에 한한다.<\/div><div class=\"ln p\">③ 성실공익법인은 제2항 각 호의 서류와 함께 다음 각 호의 서류를 제출하여야 한다. &lt;신설 2011. 8. 19.&gt;<\/div><div class=\"ln p\">1. 「상속세 및 증여세법」 제48조제2항제3호에 따른 운용소득 사용내역(해당 회계연도의 사용내역을 말한다)<\/div><div class=\"ln p\">2. 「상속세 및 증여세법」 제50조제3항에 따른 회계감사 자료<\/div><div class=\"ln p\">3. 「상속세 및 증여세법」 제50조의2에 따른 전용계좌 사용내역(해당 회계연도의 사용내역을 말한다)<\/div><div class=\"ln p\">4. 기본재산의 목록<\/div><div class=\"ln p\">제20조(재산관리) 공익법인은 그 목적사업을 달성하기 위하여 그 재산을 성실히 관리하여야 한다.<\/div><div class=\"ln p\">제21조(예산편성요강) ① 공익법인의 예산은 제23조의 규정에 의한 회계별 및 계정과목별로 구분하여 추정대차대조표와 추정손익계산서 및 그 부속명세서로 편성한다.<\/div><div class=\"ln p\">② 제1항의 추정대차대조표는 당해 연도말 현재에 추정되는 재정상태를 표시하되, 전년도말 현재와의 비교증감을 표시하여야 한다.<\/div><div class=\"pchip\" id=\"p286\"><span>원문 286쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=292\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">③ 제1항의 추정손익계산서에는 당해 연도에 발행할 것으로 추정되는 모든 수익과 비용을 계상하되, 전년도의 수익과 비용을 비교ㆍ표시하여야 한다.<\/div><div class=\"ln p\">④ 추정대차대조표와 추정손익계산서의 부속명세서에는 각각 그 추정의 근거를 명백히 하여야 한다.<\/div><div class=\"ln p\">제22조(회계원칙) ① 공익법인의 회계는 이 영에 특별한 규정이 있는 경우를 제외하고는 그 사업의 경영성과와 수입ㆍ지출상태를 정확하게 파악하기 위하여 모든 회계거래를 발생의 사실에 의하여 기업회계의 원칙에 따라 처리한다. &lt;개정 2021. 1. 5.&gt;<\/div><div class=\"ln p\">② 공익법인의 회계조직은 재무제표규칙을 준용한다.<\/div><div class=\"ln p\">제23조(회계의 구분) ① 공익법인의 회계는 법인의 목적사업 경영에 따른 회계(이하 “목적사업회계”라 한다)와 수익사업경영에 따른 회계(이하 “수익사업회계”라 한다)로 구분한다.<\/div><div class=\"ln p\">② 제1항의 경우에 「법인세법」에 따른 법인세 과세대상이 되는 수익과 이에 대응하는 비용은 수익사업회계로 처리하고, 그 밖의 수익과 비용은 목적사업회계로 처리한다. &lt;개정 2014. 12. 9.&gt;<\/div><div class=\"ln p\">③ 제2항의 경우에 목적사업회계와 수익사업회계로 구분하기 곤란한 비용은 공동비용의 배분계산에 관한 법인세에 관한 법령의 규정을 준용하여 배분한다.<\/div><div class=\"ln p\">제24조(재산의 평가) 공익법인의 모든 재산의 평가는 취득당시의 시가에 의한다. 다만, 재평가를 실시한 재산은 재평가액으로 한다.<\/div><div class=\"ln p\">제25조(잔여재산의 귀속) ①공익법인은 그 정관에 당해 공익법인이 해산한 경우에 법 제13조의 규정에 의하여 잔여재산이 귀속될 주체를 국가 또는 지방자치단체로 명시하여야 한다.<\/div><div class=\"ln p\">②공익법인의 청산인은 해산후 민법 제94조의 규정에 의한 신고와 함께 잔여재산이 귀속할 국가 또는 지방자치단체에 잔여재산의 목록을 제출하고, 지체없이 권리 이전절차를 취한 후 재산을 인도하여야 한다.<\/div><div class=\"ln p\">③제2항의 규정에 의하여 국가 또는 지방자치단체에 귀속한 재산은 주무관청 또는 지방자치단체의 장(당해 법인의 주무관청이 교육부장관인 경우에는 교육감)이 관리하되, 공익사업에 사용하거나 이를 유사한 목적을 가진 공익법인에게 증여하거나 무상대부한다. 이 경우 주무관청은 재정경제부장관과 협의하여야 한다. &lt;개정 1991. 2. 1., 1994. 12. 23., 1995. 7. 6., 2001. 1. 29., 2008. 2. 29., 2013. 3. 23., 2025. 12. 30.&gt;<\/div><div class=\"pchip\" id=\"p287\"><span>원문 287쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=293\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제26조 삭제 &lt;2011. 8. 19.&gt;<\/div><div class=\"ln p\">제26조의2 삭제 &lt;1997. 12. 31.&gt;<\/div><div class=\"ln p\">제27조(법인사무의 감사) ① 주무관청이 법 제17조의 규정에 의한 감사를 행함에 있어서는 공익법인에게 관계서류ㆍ장부 기타 참고 자료의 제출을 명하거나 소속공무원으로 하여금 법인의 사무 및 재산상황을 검사하게 할 수 있다.<\/div><div class=\"ln p\">② 제1항의 규정에 의하여 법인사무를 감사하는 공무원은 그 자격을 증명하는 증서를 휴대하고 이를 관계인에게 제시하여야 한다.<\/div><div class=\"ln p\">③ 법 제17조제2항에 따라 주무관청은 직전 회계연도 종료일을 기준으로 대차대조표상 총자산가액(부동산인 경우 「상속세 및 증여세법」 제60조, 제61조 및 제66조에 따라 평가한 가액이 대차대조표상의 가액보다 크면 그 평가한 가액을 말한다)의 합계액이 100억원 이상인 공익법인에 대하여 「주식회사 등의 외부감사에 관한 법률」 제2조제7호에 따른 감사인(이하 “감사인”이라 한다)의 회계감사를 받게 할 수 있다. &lt;개정 2012. 7. 24., 2018. 10. 30.&gt;<\/div><div class=\"ln p\">④ 주무관청은 「상속세 및 증여세법」 제50조제3항에 따른 감사인의 회계감사와 별도로 회계감사를 받게 할 필요가 없다고 인정되는 경우에는 그 회계감사로 제3항에 따른 감사를 갈음할 수 있다. &lt;신설 2012. 7. 24.&gt;<\/div><div class=\"ln p\">⑤ 제3항에 따라 감사를 실시한 감사인은 감사를 종료한 후 지체 없이 감사결과에 대한 보고서를 작성하여 주무관청에 제출하여야 한다. &lt;신설 2012. 7. 24.&gt;<\/div><div class=\"ln p\">제27조의2(고유식별정보의 처리) 주무관청은 다음 각 호의 사무를 수행하기 위하여 불가피한 경우 「개인정보 보호법 시행령」 제19조제1호 또는 제4호에 따른 주민등록번호 또는 외국인등록번호가 포함된 자료를 처리할 수 있다. &lt;개정 2016. 11. 29.&gt;<\/div><div class=\"ln p\">1. 법 제4조제1항 및 제2항에 따른 법인 설립허가에 관한 사무<\/div><div class=\"ln p\">2. 법 제5조제2항에 따른 임원 취임 승인에 관한 사무<\/div><div class=\"ln p\">3. 법 제5조제5항ㆍ제8항 및 이 영 제12조에 따른 이사회의 구성 및 감사의 자격과 관련한 특수관계자에 관한 사무<\/div><div class=\"ln p\">4. 법 제5조제8항에 따른 감사 추천에 관한 사무<\/div><div class=\"ln p\">5. 법 제11조제3항 또는 제4항에 따른 기본재산 매도 등 또는 보통재산으로의 편입의 허가ㆍ신고에 관한 사무<\/div><div class=\"ln p\">6. 법 제13조에 따른 잔여재산 귀속에 관한 사무<\/div><div class=\"pchip\" id=\"p288\"><span>원문 288쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=294\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">7. 법 제14조에 따른 법인 감독에 관한 사무<\/div><div class=\"ln p\">8. 법 제16조에 따른 법인 설립허가 취소에 관한 사무<\/div><div class=\"ln p\">9. 법 제17조에 따른 법인 감사 등에 관한 사무<\/div><div class=\"ln p\">10. 제10조에 따른 법인 정관변경의 허가에 관한 사무<\/div><div class=\"ln p\">[본조신설 2014. 12. 9.]<\/div><div class=\"ln p\">제28조(준용) 이 영에 규정된 사항 이외에 법의 시행을 위하여 필요한 사항은 주무관청이 정하되, 따로 정한 사항이 없는 때에는 성질에 반하지 아니하는 한 공익법인 이외의 비영리법인에 관한 규정을 준용한다.<\/div><div class=\"ln p\">부  칙 &lt;제8059호, 1976. 4. 1.&gt;<\/div><div class=\"ln p\">① (시행일) 이 영은 1976년 4월 1일부터 시행한다.<\/div><div class=\"ln p\">② (이 영의 적용대상이 될 공익법인에 대한 주무관청의 통지) 주무관청은 이 영 시행후 3월 이내에 민법 제32조의 규정에 의하여 설립된 그 소관 법인중 법 및 이 영의 적용대상이 될 공익법인을 확인하고 그 뜻을 당해 공익법인에 통지하여야 한다.<\/div><div class=\"ln p\">③ (경과조치) 이 영 시행당시의 공익법인은 이 영 시행후 3월 이내에 주무관청으로부터 그 감사중 1인을 추천하지 아니한다는 뜻의 통지를 받지 아니하는 한 이 영 시행후 6월 이내에 제13조의 규정에 의하여 감사중 1인을 추천의뢰하여야 한다.<\/div><div class=\"ln p\">④ (수익사업에 대한 경과조치) 이 영 시행당시의 공익법인중 수익사업을 경영하고 있는 법인은 이 영 시행후 6월 이내에 제11조의 규정에 의하여 주무관청에 수익사업의 승인신청을 하여야 한다. 다만, 종전의 규정에 의하여 주무관청으로부터 수익사업의 승인을 받은 법인은 그러하지 아니하다.<\/div><div class=\"ln p\">⑤ (상근직원에 대한 경과조치) 이 영 시행당시의 공익법인중 상근직원을 두고 있는 법인은 이 영 시행후 6월 이내에 제14조의 규정에 의하여 주무관청에 상근직원의 정수승인신청을 하여야 한다.<\/div><div class=\"ln p\">⑥ (경과조치) 이 영 시행당시의 공익법인은 이 영 시행후 6월 이내에 이 영이 정하는 필요한 조치와 정관의 변경허가신청을 하여야 한다.<\/div><div class=\"ln p\">부  칙 &lt;제13282호, 1991. 2. 1.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조 내지 제4조 생략<\/div><div class=\"ln p\">제5조(다른 법령의 개정) ① 내지 ㉓생략<\/div><div class=\"pchip\" id=\"p289\"><span>원문 289쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=295\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">㉔공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.<\/div><div class=\"ln p\">제25조제3항중 “문교부장관”을 “교육부장관”으로 한다.<\/div><div class=\"ln p\">㉕ 내지 &lt;148&gt;생략<\/div><div class=\"ln p\">부  칙 &lt;제13377호, 1991. 5. 31.&gt;<\/div><div class=\"ln p\">이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제14008호, 1993. 11. 20.&gt;<\/div><div class=\"ln p\">① (시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">② (경과조치) 이 영 시행당시 종전의 규정에 의하여 기본재산의 매도ㆍ증여ㆍ임대 또는 교환에 관한 허가를 받기 위하여 신청서를 제출한 것에 대하여는 제17조제1항제2호 및 동조제2항의 개정규정에 불구하고 종전의 규정에 의한다.<\/div><div class=\"ln p\">부  칙 &lt;제14438호, 1994. 12. 23.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조 내지 제4조 생략<\/div><div class=\"ln p\">제5조(다른법령의 개정) ① 내지 &lt;148&gt;생략<\/div><div class=\"ln p\">&lt;149&gt;공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.<\/div><div class=\"ln p\">제6조제2항, 제25조제3항중 “재무부장관”을 “재정경제원장관”으로 한다.<\/div><div class=\"ln p\">&lt;150&gt; 내지 &lt;327&gt;생략<\/div><div class=\"ln p\">부  칙 &lt;제14712호, 1995. 7. 6.&gt;<\/div><div class=\"ln p\">① (시행일) 이 영은 공포한 날부터 시행한다. 다만, 제27조제3항의 개정규정은 1996년 1월 1일부터 시행한다.<\/div><div class=\"ln p\">② (기본재산의 감정평가에 관한 경과조치) 이 영 시행당시 종전의 규정에 의하여 기본재산의 매도등에 관한 주무관청의 허가를 신청한 것에 대하여는 제17조제1항제2호 및 제2항의 개정규정에 불구하고 종전의 규정에 의한다.<\/div><div class=\"ln p\">③ (장기차입의 승인신청에 관한 경과조치) 이 영 시행당시 종전의 규정에 의하여 장기차입에 관한 주무관청의 허가를 신청한 것에 대하여는 제18조제1항의 개정규정에 불구하고 종전의 규정에 의한다.<\/div><div class=\"ln p\">부  칙 &lt;제15598호, 1997. 12. 31.&gt;<\/div><div class=\"ln p\">이 영은 1998년 1월 1일부터 시행한다.<\/div><div class=\"pchip\" id=\"p290\"><span>원문 290쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=296\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">부  칙 &lt;제15971호, 1998. 12. 31.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 1999년 1월 1일부터 시행한다.&lt;단서생략&gt;<\/div><div class=\"ln p\">제2조 내지 제5조 생략<\/div><div class=\"ln p\">제6조(다른 법령의 개정) 공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.<\/div><div class=\"ln p\">제6조 제2항중 “설립허가”를 “설립허가(정관상의 목적사업을 효율적으로 수행하기 위하여 또는 정관상의 목적사업에 새로운 사업을 추가하기 위하여 재산을 추가출연하고자 하는 경우의 정관변경허가를 포함한다)”로 한다.<\/div><div class=\"ln p\">부  칙 &lt;제17115호, 2001. 1. 29.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조 내지 제4조 생략<\/div><div class=\"ln p\">제5조(다른 법령의 개정) ① 내지 ⑧생략<\/div><div class=\"ln p\">⑨공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.<\/div><div class=\"ln p\">제25조제3항 전단중 “교육부장관”을 “교육인적자원부장관”으로 한다.<\/div><div class=\"ln p\">⑩ 내지 &lt;152&gt;생략<\/div><div class=\"ln p\">부  칙 &lt;제18312호, 2004. 3. 17.&gt;<\/div><div class=\"ln p\">이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제19507호, 2006. 6. 12.&gt;<\/div><div class=\"ln p\">이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제20171호, 2007. 7. 18.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조(다른 법령의 개정) ①부터 ④까지 생략<\/div><div class=\"ln p\">⑤ 공익법인의설립ㆍ운영에관한법률시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제7조제2항 본문, 제8조 단서 및 제9조 단서 중 “「전자정부 구현을 위한 행정업무 등의 전자화촉진에 관한 법률」”을 각각 “「전자정부법」”으로 한다.<\/div><div class=\"ln p\">⑥부터 ⑯까지 생략<\/div><div class=\"ln p\">제3조 생략<\/div><div class=\"pchip\" id=\"p291\"><span>원문 291쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=297\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">부  칙 &lt;제20674호, 2008. 2. 29.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조 생략<\/div><div class=\"ln p\">제3조(다른 법령의 개정) ① 및 ② 생략<\/div><div class=\"ln p\">③ 공익법인의설립ㆍ운영에관한법률시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제6조제2항 중 “재정경제원장관”을 “기획재정부장관”으로 한다.<\/div><div class=\"ln p\">제25조제3항 전단 중 “교육인적자원부장관”을 “교육과학기술부장관”으로 하고, 같은 항 후단 중 “재정경제원장관”을 “기획재정부장관”으로 한다.<\/div><div class=\"ln p\">④부터 ⑭까지 생략<\/div><div class=\"ln p\">부  칙 &lt;제22151호, 2010. 5. 4.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 2010년 5월 5일부터 시행한다.<\/div><div class=\"ln p\">제2조 및 제3조 생략<\/div><div class=\"ln p\">제4조(다른 법령의 개정) ①부터 ⑳까지 생략<\/div><div class=\"ln p\">㉑ 공익법인의설립ㆍ운영에관한법률시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제7조제2항 본문, 제8조 단서 및 제9조 단서 중 “「전자정부법」 제21조제1항”을 각각 “「전자정부법」 제36조제1항”으로 한다.<\/div><div class=\"ln p\">㉒부터 &lt;192&gt;까지 생략<\/div><div class=\"ln p\">부  칙 &lt;제22467호, 2010. 11. 2.&gt;<\/div><div class=\"ln p\">이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제23078호, 2011. 8. 19.&gt;<\/div><div class=\"ln p\">이 영은 2011년 9월 8일부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제23976호, 2012. 7. 24.&gt;<\/div><div class=\"ln p\">이 영은 2013년 1월 1일부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제24158호, 2012. 11. 6.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조(특수관계자의 범위에 관한 경과조치) 이 영 시행 당시 종전의 규정에 따라 선임되어 임기 중에 있는 공익법인의 임원에 적용되는 특수관계자의 범위에 관하여는 제12조제1항제2호의 개정규정에도 불구하고 해당 임기가 끝날 때까지는 종전의 규정에 따른다.<\/div><div class=\"pchip\" id=\"p292\"><span>원문 292쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=298\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">부  칙 &lt;제24415호, 2013. 3. 23.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조 생략<\/div><div class=\"ln p\">제3조(다른 법령의 개정) ① 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제25조제3항 전단 중 “교육과학기술부장관”을 “교육부장관”으로 한다.<\/div><div class=\"ln p\">②부터 ⑯까지 생략<\/div><div class=\"ln p\">부  칙 &lt;제25821호, 2014. 12. 9.&gt;<\/div><div class=\"ln p\">이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제27471호, 2016. 8. 31.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 2016년 9월 1일부터 시행한다.<\/div><div class=\"ln p\">제2조(다른 법령의 개정) ①부터 ④까지 생략<\/div><div class=\"ln p\">⑤ 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제17조제1항제2호 중 “같은 법 제9조”를 “「부동산 가격공시에 관한 법률」 제8조”로 한다.<\/div><div class=\"ln p\">⑥부터 ㊲까지 생략<\/div><div class=\"ln p\">제3조 생략<\/div><div class=\"ln p\">부  칙 &lt;제27472호, 2016. 8. 31.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 2016년 9월 1일부터 시행한다.<\/div><div class=\"ln p\">제2조부터 제5조까지 생략<\/div><div class=\"ln p\">제6조(다른 법령의 개정) ①부터 ⑪까지 생략<\/div><div class=\"ln p\">⑫ 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제17조제1항제2호 중 “「부동산 가격공시 및 감정평가에 관한 법률」 제28조”를 “「감정평가 및 감정평가사에 관한 법률」 제29조”로 한다.<\/div><div class=\"ln p\">⑬부터 &lt;92&gt;까지 생략<\/div><div class=\"ln p\">제7조 생략<\/div><div class=\"ln p\">부  칙 &lt;제27615호, 2016. 11. 29.&gt;<\/div><div class=\"ln p\">이 영은 2016년 11월 30일부터 시행한다.<\/div><div class=\"pchip\" id=\"p293\"><span>원문 293쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=299\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">부  칙 &lt;제29269호, 2018. 10. 30.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 2018년 11월 1일부터 시행한다.<\/div><div class=\"ln p\">제2조부터 제9조까지 생략<\/div><div class=\"ln p\">제10조(다른 법령의 개정) ① 및 ② 생략<\/div><div class=\"ln p\">③ 공익법인 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제27조제3항 중 “「주식회사의 외부감사에 관한 법률」 제3조”를 “「주식회사 등의 외부감사에 관한 법률」 제2조제7호”로 한다.<\/div><div class=\"ln p\">④부터 &lt;51&gt;까지 생략<\/div><div class=\"ln p\">제11조 생략<\/div><div class=\"ln p\">부  칙 &lt;제31196호, 2020. 12. 1.&gt;<\/div><div class=\"ln p\">이 영은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">부  칙 &lt;제31380호, 2021. 1. 5.&gt;<\/div><div class=\"ln p\">이 영은 공포한 날부터 시행한다. &lt;단서 생략&gt;<\/div><div class=\"ln p\">부  칙 &lt;제35947호, 2025. 12. 30.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 영은 2026년 1월 2일부터 시행한다. 다만, 부칙 제6조에 따라 개정되는 대통령령 중 이 영 시행 전에 공포되었으나 시행일이 도래하지 않은 대통령령을 개정한 부분은 각각 해당 대통령령의 시행일부터 시행한다.<\/div><div class=\"ln p\">제2조 부터 제5조까지 생략<\/div><div class=\"ln p\">제6조(다른 법령의 개정) ①부터 &lt;101&gt;까지 생략<\/div><div class=\"ln p\">&lt;102&gt; 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제6조제2항 및 제25조제3항 후단 중 “기획재정부장관”을 각각 “재정경제부장관”으로 한다.<\/div><div class=\"ln p\">&lt;103&gt;부터 &lt;313&gt;까지 생략<\/div>", "pages": [{"p": 276, "t": "「공익법인의 설립･운영에 관한 법률 시행령」\n[시행 2026. 1. 2.] [대통령령 제35947호, 2025. 12. 30., 타법개정]\n법무부(법무심의관실) 02-2110-3164\n제1조(목적) 이 영은 「공익법인의 설립ㆍ운영에 관한 법률」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다. <개정 2011. 8. 19.>\n제2조(정의) ① 「공익법인의 설립ㆍ운영에 관한 법률」(이하 “법”이라 한다) 제2조에서 “사회일반의 이익에 공여하기 위하여 학자금ㆍ장학금 또는 연구비의 보조나 지급, 학술ㆍ자선에 관한 사업을 목적으로 하는 법인”이라 함은 다음의 사업을 목적으로 하는 법인을 말한다. <개정 2011. 8. 19.>\n1. 학자금ㆍ장학금 기타 명칭에 관계없이 학생등의 장학을 목적으로 금전을 지급하거나 지원하는 사업ㆍ금전에 갈음한 물건ㆍ용역 또는 시설을 설치ㆍ운영 또는 제공하거나 지원하는 사업을 포함한다.\n2. 연구비ㆍ연구조성비ㆍ장려금 기타 명칭에 관계없이 학문ㆍ과학기술의 연구ㆍ조사ㆍ개발ㆍ보급을 목적으로 금전을 지급하거나 지원하는 사업ㆍ금전에 갈음한 물건ㆍ용역 또는 시설을 제공하는 사업을 포함한다.\n3. 학문 또는 과학기술의 연구ㆍ조사ㆍ개발ㆍ보급을 목적으로 하는 사업 및 이들 사업을 지원하는 도서관ㆍ박물관ㆍ과학관 기타 이와 유사한 시설을 설치ㆍ운영하는 사업\n4. 불행ㆍ재해 기타 사정으로 자활할 수 없는 자를 돕기 위한 모든 자선사업\n5. 제1호 내지 제4호에 해당하는 사업의 유공자에 대한 시상을 행하는 사업\n② 제1항의 법인에는 제1항 각호의 사업과 그 이외의 사업을 함께 수행하는 법인을 포함한다.\n제3조(정관에 기재할 사항) ① 공익법인의 정관에는 법 제3조제1항에 규정된 사항 이외에 다음 각호의 사항을 기재하여야 한다.\n1. 사업에 관한 사항\n2. 사단법인인 경우에는 사원 및 사원총회에 관한 사항\n3. 기타 공익법인의 운영에 관한 기본적 사항\n② 제1항제1호의 사업은 구체적으로 명확하게 정하여야 한다."}, {"p": 277, "t": "제4조(설립허가신청) ① 공익법인의 설립허가를 받으려는 자(이하 “설립발기인”이라 한다)는 법인설립허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. <개정 1995. 7. 6., 2021. 1. 5.>\n1. 설립발기인의 성명ㆍ주소ㆍ약력(설립발기인이 법인인 경우에는 그 명칭, 주된 사무소의 소재지, 대표자의 성명ㆍ주소ㆍ정관 및 최근의 사업활동)을 기재한 서류 1부\n2. 설립취지서 1부\n3. 정관 1부\n4. 재단법인인 경우에는 출연재산의 종류ㆍ수량ㆍ금액 및 권리관계를 명확하게 기재한 재산목록(기본재산과 보통재산으로 구분하여 기재하여야 한다) 및 기부신청서 1부, 사단법인인 경우에는 회비징수예정명세서 또는 기부신청서 1부\n5. 삭제 <1991. 5. 31.>\n6. 부동산ㆍ예금ㆍ유가증권등 주된 재산에 관한 등기소ㆍ금융기관등의 증명서 1부\n7. 사업개시예정일 및 사업개시이후 2 사업연도분의 사업계획서 및 수입ㆍ지출예산서 1부\n8. 사단법인인 경우에는 창립총회회의록 및 사원이 될 자의 성명 및 주소를 기재한 사원명부(사원명부를 작성하기 곤란한 때에는 사원의 총수를 기재한 서류) 각 1부\n9. 삭제 <1991. 5. 31.>\n② 공익법인의 사업이 2이상의 주무관청의 소관에 속하는 경우에는 그 주된 사업을 주관하는 주무관청에 법인설립허가를 신청하여야 한다.\n제5조(설립허가) ① 주무관청은 법인설립허가신청의 내용이 다음 각호의 기준에 적합한 경우에 한하여 이를 허가한다.\n1. 목적사업이 구체적이며 실현가능하다고 인정되는 경우\n2. 재단법인에 있어서는 출연재산의 수입, 사단법인에 있어서는 회비ㆍ기부금등으로 조성하는 재원의 수입으로 목적사업을 원활히 달성할 수 있다고 인정되는 경우\n3. 목적사업이 적극적으로 공익을 유지ㆍ증진하는 것이라고 인정되는 경우\n② 제4조제2항의 경우에는 법인설립허가신청을 받은 주무관청은 다른 주무관청과 협의하여 그 설립허가를 하여야 한다.\n제6조(설립허가시에 붙일 조건) ①주무관청이 공익법인의 설립허가를 함에 있어서는 다음 각호의 조건을 붙일 수 있다.\n1. 사단법인의 경우에 회비에 의하여 경비에 충당할 비율과 회비징수방법 기타 회비징수에 관하여 필요한 사항"}, {"p": 278, "t": "2. 수혜자의 출생지ㆍ출신학교ㆍ직업ㆍ근무처 기타 사회적 지위나 당해 법인과의 특수관계등에 의하여 수혜자의 범위를 제한할 수 없다는 뜻\n3. 목적사업의 무상성 기타 목적사업의 운영에 관한 사항\n4. 기타 목적사업의 원활한 달성을 위하여 필요한 사항\n②주무관청은 공익법인의 설립허가(정관상의 목적사업을 효율적으로 수행하기 위하여 또는 정관상의 목적사업에 새로운 사업을 추가하기 위하여 재산을 추가출연하고자 하는 경우의 정관변경허가를 포함한다)를 함에 있어서 제1항제2호의 조건을 반드시 붙이되, 주무관청이 수혜자의 범위를 특히 한정할 필요가 있다고 인정되는 때에는 그 한정할 범위에 관하여 미리 재정경제부장관(행정권한의위임및위탁에관한규정에 의하여 공익법인의 설립허가에 관한 권한이 지방자치단체의 장등에게 위임된 경우에는 설립이 허가되는 공익법인의 주된 사무소의 소재지를 관할하는 세무서장을 말한다)과 합의하여야 한다. <개정 1994. 12. 23., 1995. 7. 6., 1998. 12. 31., 2008. 2. 29., 2025. 12. 30.>\n제7조(임원취임승인신청) ① 공익법인이 법 제5조제2항의 규정에 의하여 임원취임승인을 신청할 때에는 임원취임승인신청서(전자문서로 된 신청서를 포함한다)에 다음 각호의 서류(전자문서를 포함한다)를 첨부하여 주무관청에 제출하여야 한다. 다만, 제3호 및 제5호의 서류는 주무관청이 보안상 필요하다고 인정하는 경우에 한하여 제출하고, 연임되는 임원에 대한 취임의 승인을 신청하는 경우에는 제2호ㆍ제3호ㆍ제5호 및 제7호의 서류는 이를 제출하지 아니한다. <개정 1991. 5. 31., 1993. 11. 20., 1995. 7. 6., 2004. 3. 17., 2006. 6. 12., 2010. 11. 2.>\n1. 임원의 선임을 결의한 총회 또는 이사회의 회의록 사본 1부\n2. 이력서 1부\n3. 임원으로 취임하려는 사람의 가족관계기록사항에 관한 증명서\n4. 취임승낙서 1부\n5. 민간인 신원진술서 4부\n6. 삭제 <2006. 6. 12.>\n7. 제12조의 규정에 의한 당해 임원의 특수관계부존재각서\n② 삭제 <2010. 11. 2.>\n제8조(재산이전의 보고) 공익법인(재단법인에 한한다)의 설립허가를 받은 자는 그 허가를 받은 후 지체없이 출연재산을 법인에 이전하고 3개월 내에 그 이전을 증명하는 금융기관의 증명서(부동산등기부 등본으로 확인할 수 없는 경우로 한정한다)를 재산이전보고서(전자문서로 된 보고서를 포함한다)에 첨부하여 주무관청에 제출하여야 한다. 이 경우 주무관청은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 부동산등기부 등본을 확인하여야 한다. <개정 2004. 3. 17., 2007. 7. 18., 2010. 5. 4., 2010. 11. 2.>"}, {"p": 279, "t": "제9조(설립등기등의 보고) 공익법인은 민법 제49조 내지 제52조의 규정에 의하여 법인설립등기등을 한 때에는 등기를 완료한 날로부터 7일 이내에 등기보고서를 주무관청에 제출하여야 한다. 이 경우 주무관청은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서를 확인하여야 한다. <개정 1995. 7. 6., 2004. 3. 17., 2007. 7. 18., 2010. 5. 4., 2010. 11. 2.>\n제10조(정관변경허가신청) 공익법인이 민법 제42조제2항, 동법 제45조제3항, 동법 제46조의 규정에 의하여 정관변경의 허가를 받고자 할 때에는 정관변경허가신청서에 다음 각호의 서류를 첨부하여 주무관청에 제출하여야 한다. <개정 1995. 7. 6.>\n1. 정관변경이유서 1부\n2. 정관개정안 1부\n3. 정관변경에 관한 총회 또는 이사회 회의록\n4. 정관변경의 원인이 되는 사실을 증명할 수 있는 서류\n제11조(수익사업의 승인신청) ① 공익법인이 법 제4조제3항의 규정에 의하여 수익사업경영의 승인을 신청하는 경우에는 수익사업승인신청서에 다음 각호의 서류를 첨부하여 주무관청에 제출하여야 한다. <개정 1995. 7. 6.>\n1. 사업계획서 1부\n2. 추정손익계산서 및 부속명세서 1부\n3. 사업에 종사할 임원명부 1부\n4. 행정관청의 허가를 요하는 사업인 경우에는 당해 사업에 대하여 허가를 받은 사실을 증명하는 서류 1부\n② 공익법인이 승인을 받은 수익사업을 변경하고자 할 때에는 제1항에 준하여 주무관청의 승인을 얻어야 한다.\n제12조(특수관계자의 범위) ① 법 제5조제5항에서 “대통령령으로 정하는 특별한 관계가 있는 자”(이하 “특수관계자”라 한다)란 다음 각 호의 어느 하나에 해당하는 자를 말한다. 다만, 국가 또는 지방자치단체가 공익사업(「상속세 및 증여세법」 제16조제1항에 따른 종교ㆍ자선ㆍ학술 또는 그 밖의 공익을 목적으로 하는 사업을 말한다. 이하 같다)에 출연하는 경우에는 국가ㆍ지방자치단체 및 그 소속 공무원, 그 밖에 국가ㆍ지방자치단체와 고용관계에 있는 자는 다음 각 호의 어느 하나에 해당하더라도 특수관계자로 보지 아니한다. <개정 1995. 7. 6., 2012. 11. 6., 2014. 12. 9.>"}, {"p": 280, "t": "1. 출연자(출연자가 「민법」 제32조에 따라 설립된 법인인 경우에는 해당 법인에 대한 출연자를, 출연자가 그 밖의 법인인 경우에는 해당 법인을 출자에 의하여 사실상 지배하고 있는 자를 포함한다). 다만, 재산출연일 현재 해당 공익법인의 총출연재산가액의 100분의 1에 해당하는 금액과 2천만원 중 적은 금액을 출연한 자는 제외한다.\n2. 제1호에 따른 출연자(이하 “출연자”라 한다) 또는 이사와 다음 각 목의 관계에 있는 사람\n가. 6촌 이내의 혈족\n나. 4촌 이내의 인척\n다. 배우자(사실혼 관계에 있는 사람을 포함한다)\n라. 친생자(親生子)로서 다른 사람에게 친양자(親養子)로 입양된 사람과 그 배우자ㆍ직계비속(直系卑屬)\n3. 출연자 또는 이사의 사용인 기타 고용관계에 있는 자(출연자 또는 이사가 출자에 의하여 사실상 지배하고 있는 법인의 사용인 기타 고용관계에 있는 자를 포함한다)\n4. 출연자 또는 이사의 금전 기타의 재산에 의하여 생계를 유지하는 자와 생계를 함께 하는 자\n5. 당해 출연자가 재산을 출연한 다른 공익사업을 영위하는 법인의 이사\n② 제1항제1호 및 제3호에서 “출자에 의하여 사실상 지배한다”고 함은 다음 각호의 1에 해당함을 말한다. <개정 1995. 7. 6.>\n1. 법인의 발행주식총액 또는 출자총액의 100분의 30이상을 출자자 1인과 그와 제1항제2호ㆍ제4호 및 사용인 기타 고용관계에 있는 자(이하 “지배주주”라 한다)들이 소유하고 있는 경우\n2. 법인의 발행주식총액 또는 출자총액의 100분의 50이상을 제1호의 법인과 그의 지배주주가 소유하고 있는 경우\n3. 법인의 발행주식총액 또는 출자총액의 100분의 50이상을 제1호의 법인과 그의 지배주주 및 제2호의 법인이 소유하고 있는 경우\n③ 특수관계가 없는 이사가 재임중 특수관계자에 해당되어 특수관계자가 이사현원의 5분의 1을 초과하게 된 때에는 2월 이내에 특수관계자가 이사현원의 5분의 1이 초과되지 아니하도록 이사를 개임하여야 한다. <개정 1995. 7. 6.>"}, {"p": 281, "t": "제13조(주무관청의 감사추천) ① 주무관청은 법 제5조제8항의 규정에 의하여 공익법인의 감사 1인을 추천하고자 할 때에는 설립허가시에 그 뜻을 통지하여야 한다.\n② 주무관청이 제1항의 규정에 의한 감사의 추천을 행함에 있어서는 공익법인에게 후보를 선정하여 추천을 의뢰하게 할 수 있다. 이 경우 주무관청은 추천의뢰된 자 중에 적격자가 없다고 인정되는 때에는 재추천 의뢰를 요구하거나 직권에 의하여 추천할 수 있다.\n③ 주무관청으로부터 감사 1인을 추천한다는 뜻을 통지받은 날로부터 2월내에 추천의뢰가 없는 경우 또는 주무관청의 추천에 의하여 임명된 감사가 임기만료 기타의 사유로 결원이 된 때에도 제2항과 같다.\n④ 주무관청은 공익법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 발견된 때에는 종전에 그 법인의 감사중 1인을 주무관청이 추천하지 아니한 경우에도 새로이 법 제5조제8항의 규정에 의하여 감사 1인을 추천할 수 있다. 이 경우에는 당해 공익법인의 감사중 이사회에서 지명한 자 1인은 주무관청에서 추천한 감사에 대한 취임승인이 있은 날의 전일에 퇴직된 것으로 본다.\n제14조(상근직원의 정수 승인신청) 공익법인이 법 제5조제9항의 규정에 의하여 상근직원의 정수에 대한 승인을 얻고자 할 때에는 승인신청서에 기구도표와 부문별 또는 개인별 관장업무를 명시한 설명서를 첨부하여 주무관청에 제출하여야 한다.\n제15조(이사회의 소집승인 신청) 법 제8조제4항의 규정에 의하여 이사회의 소집승인을 얻고자 할 때에는 그 승인신청서에 다음 각호의 서류를 첨부하여 주무관청에 제출하여야 한다.\n1. 이사회의 소집이 불가능한 사유와 이를 증명하는 서류\n2. 재적이사 과반수의 찬동을 증명하는 서류\n3. 이사회를 소집하지 못함으로 인하여 예상되는 손해의 구체적인 사실을 증명하는 서류\n제16조(재산의 구분) ① 공익법인의 재산중 다음 각호의 1에 해당하는 재산은 기본재산으로 한다.\n1. 설립시 기본재산으로 출연한 재산\n2. 기부에 의하거나 기타 무상으로 취득한 재산. 다만, 기부목적에 비추어 기본재산으로 하기 곤란하여 주무관청의 승인을 얻은 것은 예외로 한다."}, {"p": 282, "t": "3. 보통재산중 총회 또는 이사회에서 기본재산으로 편입할 것을 의결한 재산\n4. 세계잉여금중 적립금\n② 보통재산은 기본재산 이외의 모든 재산으로 한다.\n③ 주무관청은 공익법인의 보통재산이 과다하다고 인정할 때에는 그 일부를 기본재산으로 편입하게 할 수 있다.\n제17조(기본재산의 처분) ① 법 제11조제3항제1호에 따라 기본재산의 매도ㆍ증여ㆍ임대 또는 교환에 관한 허가를 받으려는 경우에는 그 허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. <개정 1993. 11. 20., 1995. 7. 6., 2011. 8. 19., 2016. 8. 31., 2016. 11. 29., 2020. 12. 1.>\n1. 처분재산명세서\n2. 「감정평가 및 감정평가사에 관한 법률」 제2조제4호에 따른 감정평가법인등(이하 “감정평가법인등”이라 한다)이 작성한 감정평가서 또는 시장ㆍ군수 또는 구청장(자치구의 구청장을 말한다. 이하 같다)이 「부동산 가격공시에 관한 법률」 제8조에 따라 표준지의 공시지가를 기준으로 하여 산정한 개별필지에 대한 지가확인서(교환의 경우에는 쌍방의 재산에 관한 것이어야 한다)\n3. 총회 또는 이사회 회의록 사본\n4. 교환재산 또는 처분대금의 처리에 관한 사항을 기재한 서류(교환 또는 매도의 경우에 한한다)\n② 삭제 <1995. 7. 6.>\n③ 법 제11조제3항제1호에 따라 기본재산의 담보에 관한 허가를 받으려는 경우에는 그 허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출하여야 한다. <개정 2011. 8. 19., 2016. 11. 29.>\n1. 담보에 제공할 재산목록\n2. 피담보채권액\n3. 담보권자\n4. 상환방법 및 상환계획\n5. 총회 또는 이사회 회의록 사본\n④ 법 제11조제3항제1호에 따라 기본재산의 용도변경에 관한 허가를 받으려는 경우 또는 기본재산에 대한 의무를 부담하거나 권리를 포기하려는 경우에는 허가신청서에 그 사유를 적어야 한다. <개정 2011. 8. 19., 2016. 11. 29.>"}, {"p": 283, "t": "제18조(장기차입에 대한 허가) ① 공익법인이 법 제11조제3항제2호에 따라 주무관청의 허가를 받아야 할 장기차입은 차입하려는 금액을 포함한 장기차입금의 총액이 기본재산 총액에서 차입 당시의 부채 총액을 공제한 금액의 100분의 5에 상당하는 금액 이상인 경우로 한다. <개정 1995. 7. 6., 2011. 8. 19., 2016. 11. 29.>\n② 공익법인이 해당 연도의 예산으로 상환할 단기차입을 행한 경우에는 예산수입ㆍ지출을 명확히 하여 해당 연도 안에 반드시 상환할 수 있도록 해야 한다. <개정 2021. 1. 5.>\n제18조의2(기본재산의 보통재산으로의 편입) ① 법 제11조제3항제3호에서 “기본재산의 운용수익이 감소하거나 기부금 또는 그 밖의 수입금이 감소하는 등 대통령령으로 정하는 사유”란 다음 각 호의 어느 하나에 해당하는 사유를 말한다.\n1. 기본재산의 운용수익이 감소한 경우\n2. 기부금 등 무상으로 취득한 재산이 감소한 경우\n3. 회비수입이 감소한 경우\n4. 법 제4조제3항에 따른 수익사업의 수익이 감소한 경우\n5. 그 밖에 제1호부터 제4호까지에 준하는 사유로 보통재산이 고갈된 경우\n② 공익법인은 법 제11조제3항제3호에 따라 기본재산을 보통재산으로 편입하려는 경우에는 그 허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. <개정 2020. 12. 1., 2021. 1. 5.>\n1. 기본재산명세서 및 편입재산명세서\n2. 기본재산의 평가액을 소명할 수 있는 자료(기본재산이 부동산인 경우에는 감정평가법인등이 작성한 감정평가서 또는 시장ㆍ군수 또는 구청장이 「부동산 가격공시에 관한 법률」 제8조에 따라 표준지의 공시지가를 기준으로 하여 산정한 개별필지에 대한 지가확인서를 포함한다)\n3. 보통재산 편입 이후 2 사업연도분의 사업계획서 및 수입ㆍ지출예산서\n4. 제1항 각 호의 사유로 정관에서 정한 목적사업의 수행이 현저히 곤란함을 소명할 수 있는 자료\n5. 총회 또는 이사회 회의록 사본\n[본조신설 2016. 11. 29.]\n[종전 제18조의2는 제18조의3으로 이동 <2016. 11. 29.>]\n제18조의3(기본재산의 처분 등의 신고) ① 법 제11조제4항제1호에서 “매도ㆍ교환 또는 용도변경 등 대통령령으로 정하는 경우”란 기본재산을 매도ㆍ교환 또는 용도변경하거나 담보로 제공(이하 “매도등”이라 한다)하는 경우를 말한다. <개정 2016. 11. 29.>"}, {"p": 284, "t": "② 법 제11조제4항에 따라 신고함으로써 매도등을 할 수 있거나 보통재산으로 편입할 수 있는 기본재산의 범위는 「상속세 및 증여세법」 제61조부터 제66조까지의 규정을 준용하여 평가한 기본재산의 가액을 기준으로 한다. 이 경우 「상속세 및 증여세법」 제63조제1항제1호가목 중 “평가기준일 이전ㆍ이후 각 2개월”은 각각 “매도등을 한 날 또는 편입신고를 한 날의 직전 거래일부터 이전 2개월”로 본다. <개정 2016. 11. 29.>\n③ 「상속세 및 증여세법」 제16조제2항에 따른 성실공익법인(이하 “성실공익법인”이라 한다)이 법 제11조제4항제1호 및 이 조 제1항에 따라 기본재산의 매도등을 한 경우에는 그 매도등을 한 날부터 3주일 이내에 그 신고서에 다음 각 호의 서류를 첨부하여 주무관청에 제출하여야 하며, 같은 기간 내에 주무관청에 법 제11조제2항에 따른 정관변경 허가를 신청하여야 한다. <개정 2016. 11. 29.>\n1. 기본재산명세서 및 매도등을 한 재산의 명세서(제2항에 따른 평가액을 소명할 수 있는 자료를 각각 포함한다)\n2. 총회 또는 이사회 회의록 사본\n3. 성실공익법인에 해당함을 소명할 수 있는 자료\n④ 성실공익법인이 법 제11조제4항제2호에 따라 기본재산을 보통재산으로 편입하려는 경우에는 그 신고서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. <신설 2016. 11. 29., 2021. 1. 5.>\n1. 기본재산명세서 및 편입재산명세서(제2항에 따른 평가액을 소명할 수 있는 자료를 각각 포함한다)\n2. 보통재산 편입 이후 2 사업연도분의 사업계획서 및 수입ㆍ지출예산서\n3. 제18조의2제1항 각 호의 사유로 정관에서 정한 목적사업의 수행이 현저히 곤란함을 소명할 수 있는 자료\n4. 총회 또는 이사회 회의록 사본\n5. 직전 편입이 있은 날부터 최소 3년이 경과하였음을 소명할 수 있는 자료. 다만, 최초 편입인 경우는 제외한다.\n6. 성실공익법인에 해당함을 소명할 수 있는 자료\n⑤ 법 제11조제4항제2호에 따라 기본재산을 보통재산으로 편입한 성실공익법인은 편입을 한 날부터 3주일 이내에 주무관청에 법 제11조제2항에 따른 정관변경 허가를 신청하여야 한다. <신설 2016. 11. 29.>\n⑥ 제3항 또는 제4항에 따른 신고서를 제출받은 주무관청은 지체 없이 제3항 또는 제4항 각 호의 서류를 검토하여야 하며, 필요한 경우 공익법인에게 보정(補正)을 요구할 수 있다. 이 경우 성실공익법인은 보정을 요구받은 날부터 1주일 이내에 이를 보정하여야 한다. <개정 2016. 11. 29.>"}, {"p": 285, "t": "[본조신설 2011. 8. 19.]\n[제목개정 2016. 11. 29.]\n[제18조의2에서 이동 <2016. 11. 29.>]\n제19조(사업계획등의 제출) ① 공익법인이 법 제12조제2항의 규정에 의하여 제출하는 사업계획 및 예산은 당해 사업의 회계연도 개시 1월전까지 행하여야 하며, 다음 각호의 서류를 첨부하여야 한다.\n1. 추정대차대조표 및 그 부속명세서\n2. 추정손익계산서 및 그 부속명세서\n② 공익법인이 법 제12조제2항에 따라 제출하는 사업실적 및 결산은 해당 사업의 회계연도 종료후 3개월 이내에 행하여야 하며, 다음 각호의 서류를 첨부하여야 한다. <개정 2011. 8. 19.>\n1. 대차대조표 및 그 부속명세서\n2. 손익계산서 및 그 부속명세서\n3. 공인회계사의 감사증명서. 다만, 주무관청이 필요하다고 인정하여 첨부하게 한 경우에 한한다.\n③ 성실공익법인은 제2항 각 호의 서류와 함께 다음 각 호의 서류를 제출하여야 한다. <신설 2011. 8. 19.>\n1. 「상속세 및 증여세법」 제48조제2항제3호에 따른 운용소득 사용내역(해당 회계연도의 사용내역을 말한다)\n2. 「상속세 및 증여세법」 제50조제3항에 따른 회계감사 자료\n3. 「상속세 및 증여세법」 제50조의2에 따른 전용계좌 사용내역(해당 회계연도의 사용내역을 말한다)\n4. 기본재산의 목록\n제20조(재산관리) 공익법인은 그 목적사업을 달성하기 위하여 그 재산을 성실히 관리하여야 한다.\n제21조(예산편성요강) ① 공익법인의 예산은 제23조의 규정에 의한 회계별 및 계정과목별로 구분하여 추정대차대조표와 추정손익계산서 및 그 부속명세서로 편성한다.\n② 제1항의 추정대차대조표는 당해 연도말 현재에 추정되는 재정상태를 표시하되, 전년도말 현재와의 비교증감을 표시하여야 한다."}, {"p": 286, "t": "③ 제1항의 추정손익계산서에는 당해 연도에 발행할 것으로 추정되는 모든 수익과 비용을 계상하되, 전년도의 수익과 비용을 비교ㆍ표시하여야 한다.\n④ 추정대차대조표와 추정손익계산서의 부속명세서에는 각각 그 추정의 근거를 명백히 하여야 한다.\n제22조(회계원칙) ① 공익법인의 회계는 이 영에 특별한 규정이 있는 경우를 제외하고는 그 사업의 경영성과와 수입ㆍ지출상태를 정확하게 파악하기 위하여 모든 회계거래를 발생의 사실에 의하여 기업회계의 원칙에 따라 처리한다. <개정 2021. 1. 5.>\n② 공익법인의 회계조직은 재무제표규칙을 준용한다.\n제23조(회계의 구분) ① 공익법인의 회계는 법인의 목적사업 경영에 따른 회계(이하 “목적사업회계”라 한다)와 수익사업경영에 따른 회계(이하 “수익사업회계”라 한다)로 구분한다.\n② 제1항의 경우에 「법인세법」에 따른 법인세 과세대상이 되는 수익과 이에 대응하는 비용은 수익사업회계로 처리하고, 그 밖의 수익과 비용은 목적사업회계로 처리한다. <개정 2014. 12. 9.>\n③ 제2항의 경우에 목적사업회계와 수익사업회계로 구분하기 곤란한 비용은 공동비용의 배분계산에 관한 법인세에 관한 법령의 규정을 준용하여 배분한다.\n제24조(재산의 평가) 공익법인의 모든 재산의 평가는 취득당시의 시가에 의한다. 다만, 재평가를 실시한 재산은 재평가액으로 한다.\n제25조(잔여재산의 귀속) ①공익법인은 그 정관에 당해 공익법인이 해산한 경우에 법 제13조의 규정에 의하여 잔여재산이 귀속될 주체를 국가 또는 지방자치단체로 명시하여야 한다.\n②공익법인의 청산인은 해산후 민법 제94조의 규정에 의한 신고와 함께 잔여재산이 귀속할 국가 또는 지방자치단체에 잔여재산의 목록을 제출하고, 지체없이 권리 이전절차를 취한 후 재산을 인도하여야 한다.\n③제2항의 규정에 의하여 국가 또는 지방자치단체에 귀속한 재산은 주무관청 또는 지방자치단체의 장(당해 법인의 주무관청이 교육부장관인 경우에는 교육감)이 관리하되, 공익사업에 사용하거나 이를 유사한 목적을 가진 공익법인에게 증여하거나 무상대부한다. 이 경우 주무관청은 재정경제부장관과 협의하여야 한다. <개정 1991. 2. 1., 1994. 12. 23., 1995. 7. 6., 2001. 1. 29., 2008. 2. 29., 2013. 3. 23., 2025. 12. 30.>"}, {"p": 287, "t": "제26조 삭제 <2011. 8. 19.>\n제26조의2 삭제 <1997. 12. 31.>\n제27조(법인사무의 감사) ① 주무관청이 법 제17조의 규정에 의한 감사를 행함에 있어서는 공익법인에게 관계서류ㆍ장부 기타 참고 자료의 제출을 명하거나 소속공무원으로 하여금 법인의 사무 및 재산상황을 검사하게 할 수 있다.\n② 제1항의 규정에 의하여 법인사무를 감사하는 공무원은 그 자격을 증명하는 증서를 휴대하고 이를 관계인에게 제시하여야 한다.\n③ 법 제17조제2항에 따라 주무관청은 직전 회계연도 종료일을 기준으로 대차대조표상 총자산가액(부동산인 경우 「상속세 및 증여세법」 제60조, 제61조 및 제66조에 따라 평가한 가액이 대차대조표상의 가액보다 크면 그 평가한 가액을 말한다)의 합계액이 100억원 이상인 공익법인에 대하여 「주식회사 등의 외부감사에 관한 법률」 제2조제7호에 따른 감사인(이하 “감사인”이라 한다)의 회계감사를 받게 할 수 있다. <개정 2012. 7. 24., 2018. 10. 30.>\n④ 주무관청은 「상속세 및 증여세법」 제50조제3항에 따른 감사인의 회계감사와 별도로 회계감사를 받게 할 필요가 없다고 인정되는 경우에는 그 회계감사로 제3항에 따른 감사를 갈음할 수 있다. <신설 2012. 7. 24.>\n⑤ 제3항에 따라 감사를 실시한 감사인은 감사를 종료한 후 지체 없이 감사결과에 대한 보고서를 작성하여 주무관청에 제출하여야 한다. <신설 2012. 7. 24.>\n제27조의2(고유식별정보의 처리) 주무관청은 다음 각 호의 사무를 수행하기 위하여 불가피한 경우 「개인정보 보호법 시행령」 제19조제1호 또는 제4호에 따른 주민등록번호 또는 외국인등록번호가 포함된 자료를 처리할 수 있다. <개정 2016. 11. 29.>\n1. 법 제4조제1항 및 제2항에 따른 법인 설립허가에 관한 사무\n2. 법 제5조제2항에 따른 임원 취임 승인에 관한 사무\n3. 법 제5조제5항ㆍ제8항 및 이 영 제12조에 따른 이사회의 구성 및 감사의 자격과 관련한 특수관계자에 관한 사무\n4. 법 제5조제8항에 따른 감사 추천에 관한 사무\n5. 법 제11조제3항 또는 제4항에 따른 기본재산 매도 등 또는 보통재산으로의 편입의 허가ㆍ신고에 관한 사무\n6. 법 제13조에 따른 잔여재산 귀속에 관한 사무"}, {"p": 288, "t": "7. 법 제14조에 따른 법인 감독에 관한 사무\n8. 법 제16조에 따른 법인 설립허가 취소에 관한 사무\n9. 법 제17조에 따른 법인 감사 등에 관한 사무\n10. 제10조에 따른 법인 정관변경의 허가에 관한 사무\n[본조신설 2014. 12. 9.]\n제28조(준용) 이 영에 규정된 사항 이외에 법의 시행을 위하여 필요한 사항은 주무관청이 정하되, 따로 정한 사항이 없는 때에는 성질에 반하지 아니하는 한 공익법인 이외의 비영리법인에 관한 규정을 준용한다.\n부  칙 <제8059호, 1976. 4. 1.>\n① (시행일) 이 영은 1976년 4월 1일부터 시행한다.\n② (이 영의 적용대상이 될 공익법인에 대한 주무관청의 통지) 주무관청은 이 영 시행후 3월 이내에 민법 제32조의 규정에 의하여 설립된 그 소관 법인중 법 및 이 영의 적용대상이 될 공익법인을 확인하고 그 뜻을 당해 공익법인에 통지하여야 한다.\n③ (경과조치) 이 영 시행당시의 공익법인은 이 영 시행후 3월 이내에 주무관청으로부터 그 감사중 1인을 추천하지 아니한다는 뜻의 통지를 받지 아니하는 한 이 영 시행후 6월 이내에 제13조의 규정에 의하여 감사중 1인을 추천의뢰하여야 한다.\n④ (수익사업에 대한 경과조치) 이 영 시행당시의 공익법인중 수익사업을 경영하고 있는 법인은 이 영 시행후 6월 이내에 제11조의 규정에 의하여 주무관청에 수익사업의 승인신청을 하여야 한다. 다만, 종전의 규정에 의하여 주무관청으로부터 수익사업의 승인을 받은 법인은 그러하지 아니하다.\n⑤ (상근직원에 대한 경과조치) 이 영 시행당시의 공익법인중 상근직원을 두고 있는 법인은 이 영 시행후 6월 이내에 제14조의 규정에 의하여 주무관청에 상근직원의 정수승인신청을 하여야 한다.\n⑥ (경과조치) 이 영 시행당시의 공익법인은 이 영 시행후 6월 이내에 이 영이 정하는 필요한 조치와 정관의 변경허가신청을 하여야 한다.\n부  칙 <제13282호, 1991. 2. 1.>\n제1조(시행일) 이 영은 공포한 날부터 시행한다.\n제2조 내지 제4조 생략\n제5조(다른 법령의 개정) ① 내지 ㉓생략"}, {"p": 289, "t": "㉔공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.\n제25조제3항중 “문교부장관”을 “교육부장관”으로 한다.\n㉕ 내지 <148>생략\n부  칙 <제13377호, 1991. 5. 31.>\n이 영은 공포한 날부터 시행한다.\n부  칙 <제14008호, 1993. 11. 20.>\n① (시행일) 이 영은 공포한 날부터 시행한다.\n② (경과조치) 이 영 시행당시 종전의 규정에 의하여 기본재산의 매도ㆍ증여ㆍ임대 또는 교환에 관한 허가를 받기 위하여 신청서를 제출한 것에 대하여는 제17조제1항제2호 및 동조제2항의 개정규정에 불구하고 종전의 규정에 의한다.\n부  칙 <제14438호, 1994. 12. 23.>\n제1조(시행일) 이 영은 공포한 날부터 시행한다.\n제2조 내지 제4조 생략\n제5조(다른법령의 개정) ① 내지 <148>생략\n<149>공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.\n제6조제2항, 제25조제3항중 “재무부장관”을 “재정경제원장관”으로 한다.\n<150> 내지 <327>생략\n부  칙 <제14712호, 1995. 7. 6.>\n① (시행일) 이 영은 공포한 날부터 시행한다. 다만, 제27조제3항의 개정규정은 1996년 1월 1일부터 시행한다.\n② (기본재산의 감정평가에 관한 경과조치) 이 영 시행당시 종전의 규정에 의하여 기본재산의 매도등에 관한 주무관청의 허가를 신청한 것에 대하여는 제17조제1항제2호 및 제2항의 개정규정에 불구하고 종전의 규정에 의한다.\n③ (장기차입의 승인신청에 관한 경과조치) 이 영 시행당시 종전의 규정에 의하여 장기차입에 관한 주무관청의 허가를 신청한 것에 대하여는 제18조제1항의 개정규정에 불구하고 종전의 규정에 의한다.\n부  칙 <제15598호, 1997. 12. 31.>\n이 영은 1998년 1월 1일부터 시행한다."}, {"p": 290, "t": "부  칙 <제15971호, 1998. 12. 31.>\n제1조(시행일) 이 영은 1999년 1월 1일부터 시행한다.<단서생략>\n제2조 내지 제5조 생략\n제6조(다른 법령의 개정) 공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.\n제6조 제2항중 “설립허가”를 “설립허가(정관상의 목적사업을 효율적으로 수행하기 위하여 또는 정관상의 목적사업에 새로운 사업을 추가하기 위하여 재산을 추가출연하고자 하는 경우의 정관변경허가를 포함한다)”로 한다.\n부  칙 <제17115호, 2001. 1. 29.>\n제1조(시행일) 이 영은 공포한 날부터 시행한다.\n제2조 내지 제4조 생략\n제5조(다른 법령의 개정) ① 내지 ⑧생략\n⑨공익법인의설립ㆍ운영에관한법률시행령중 다음과 같이 개정한다.\n제25조제3항 전단중 “교육부장관”을 “교육인적자원부장관”으로 한다.\n⑩ 내지 <152>생략\n부  칙 <제18312호, 2004. 3. 17.>\n이 영은 공포한 날부터 시행한다.\n부  칙 <제19507호, 2006. 6. 12.>\n이 영은 공포한 날부터 시행한다.\n부  칙 <제20171호, 2007. 7. 18.>\n제1조(시행일) 이 영은 공포한 날부터 시행한다.\n제2조(다른 법령의 개정) ①부터 ④까지 생략\n⑤ 공익법인의설립ㆍ운영에관한법률시행령 일부를 다음과 같이 개정한다.\n제7조제2항 본문, 제8조 단서 및 제9조 단서 중 “「전자정부 구현을 위한 행정업무 등의 전자화촉진에 관한 법률」”을 각각 “「전자정부법」”으로 한다.\n⑥부터 ⑯까지 생략\n제3조 생략"}, {"p": 291, "t": "부  칙 <제20674호, 2008. 2. 29.>\n제1조(시행일) 이 영은 공포한 날부터 시행한다.\n제2조 생략\n제3조(다른 법령의 개정) ① 및 ② 생략\n③ 공익법인의설립ㆍ운영에관한법률시행령 일부를 다음과 같이 개정한다.\n제6조제2항 중 “재정경제원장관”을 “기획재정부장관”으로 한다.\n제25조제3항 전단 중 “교육인적자원부장관”을 “교육과학기술부장관”으로 하고, 같은 항 후단 중 “재정경제원장관”을 “기획재정부장관”으로 한다.\n④부터 ⑭까지 생략\n부  칙 <제22151호, 2010. 5. 4.>\n제1조(시행일) 이 영은 2010년 5월 5일부터 시행한다.\n제2조 및 제3조 생략\n제4조(다른 법령의 개정) ①부터 ⑳까지 생략\n㉑ 공익법인의설립ㆍ운영에관한법률시행령 일부를 다음과 같이 개정한다.\n제7조제2항 본문, 제8조 단서 및 제9조 단서 중 “「전자정부법」 제21조제1항”을 각각 “「전자정부법」 제36조제1항”으로 한다.\n㉒부터 <192>까지 생략\n부  칙 <제22467호, 2010. 11. 2.>\n이 영은 공포한 날부터 시행한다.\n부  칙 <제23078호, 2011. 8. 19.>\n이 영은 2011년 9월 8일부터 시행한다.\n부  칙 <제23976호, 2012. 7. 24.>\n이 영은 2013년 1월 1일부터 시행한다.\n부  칙 <제24158호, 2012. 11. 6.>\n제1조(시행일) 이 영은 공포한 날부터 시행한다.\n제2조(특수관계자의 범위에 관한 경과조치) 이 영 시행 당시 종전의 규정에 따라 선임되어 임기 중에 있는 공익법인의 임원에 적용되는 특수관계자의 범위에 관하여는 제12조제1항제2호의 개정규정에도 불구하고 해당 임기가 끝날 때까지는 종전의 규정에 따른다."}, {"p": 292, "t": "부  칙 <제24415호, 2013. 3. 23.>\n제1조(시행일) 이 영은 공포한 날부터 시행한다.\n제2조 생략\n제3조(다른 법령의 개정) ① 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.\n제25조제3항 전단 중 “교육과학기술부장관”을 “교육부장관”으로 한다.\n②부터 ⑯까지 생략\n부  칙 <제25821호, 2014. 12. 9.>\n이 영은 공포한 날부터 시행한다.\n부  칙 <제27471호, 2016. 8. 31.>\n제1조(시행일) 이 영은 2016년 9월 1일부터 시행한다.\n제2조(다른 법령의 개정) ①부터 ④까지 생략\n⑤ 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.\n제17조제1항제2호 중 “같은 법 제9조”를 “「부동산 가격공시에 관한 법률」 제8조”로 한다.\n⑥부터 ㊲까지 생략\n제3조 생략\n부  칙 <제27472호, 2016. 8. 31.>\n제1조(시행일) 이 영은 2016년 9월 1일부터 시행한다.\n제2조부터 제5조까지 생략\n제6조(다른 법령의 개정) ①부터 ⑪까지 생략\n⑫ 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.\n제17조제1항제2호 중 “「부동산 가격공시 및 감정평가에 관한 법률」 제28조”를 “「감정평가 및 감정평가사에 관한 법률」 제29조”로 한다.\n⑬부터 <92>까지 생략\n제7조 생략\n부  칙 <제27615호, 2016. 11. 29.>\n이 영은 2016년 11월 30일부터 시행한다."}, {"p": 293, "t": "부  칙 <제29269호, 2018. 10. 30.>\n제1조(시행일) 이 영은 2018년 11월 1일부터 시행한다.\n제2조부터 제9조까지 생략\n제10조(다른 법령의 개정) ① 및 ② 생략\n③ 공익법인 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.\n제27조제3항 중 “「주식회사의 외부감사에 관한 법률」 제3조”를 “「주식회사 등의 외부감사에 관한 법률」 제2조제7호”로 한다.\n④부터 <51>까지 생략\n제11조 생략\n부  칙 <제31196호, 2020. 12. 1.>\n이 영은 공포한 날부터 시행한다.\n부  칙 <제31380호, 2021. 1. 5.>\n이 영은 공포한 날부터 시행한다. <단서 생략>\n부  칙 <제35947호, 2025. 12. 30.>\n제1조(시행일) 이 영은 2026년 1월 2일부터 시행한다. 다만, 부칙 제6조에 따라 개정되는 대통령령 중 이 영 시행 전에 공포되었으나 시행일이 도래하지 않은 대통령령을 개정한 부분은 각각 해당 대통령령의 시행일부터 시행한다.\n제2조 부터 제5조까지 생략\n제6조(다른 법령의 개정) ①부터 <101>까지 생략\n<102> 공익법인의 설립ㆍ운영에 관한 법률 시행령 일부를 다음과 같이 개정한다.\n제6조제2항 및 제25조제3항 후단 중 “기획재정부장관”을 각각 “재정경제부장관”으로 한다.\n<103>부터 <313>까지 생략"}]}]}]}</script>
<script>
const CFG  = JSON.parse(document.getElementById('guide-cfg').textContent);
const DATA = JSON.parse(document.getElementById('guide-data').textContent);
const CHANGES    = CFG.changes    || [];
const HIGHLIGHTS = CFG.highlights || [];
const UNIT = CFG.unitLabel || '장';   // 대분류 호칭(장/부/편)

/* ── state ── */
let S = {view:'home', ch:DATA.chapters[0].no, sec:0, sub:-1, terms:[], fs:1, hc:false};
const LSKEY='dash-pref-'+(CFG.slug||'doc');
try{ const sv=localStorage.getItem(LSKEY); if(sv){const o=JSON.parse(sv); S.fs=o.fs??1; S.hc=!!o.hc;} }catch(e){}

const FS=[[15,12],[17,13.5],[19,15.5],[22,18]];
function applyPref(){
  const f=FS[S.fs]||FS[1];
  document.documentElement.style.setProperty('--fs',f[0]+'px');
  document.documentElement.style.setProperty('--fs-pre',f[1]+'px');
  document.body.classList.toggle('hc',S.hc);
  document.getElementById('hcBtn').setAttribute('aria-pressed',String(S.hc));
  try{localStorage.setItem(LSKEY,JSON.stringify({fs:S.fs,hc:S.hc}));}catch(e){}
}
document.getElementById('fPlus').onclick=()=>{S.fs=Math.min(3,S.fs+1);applyPref();};
document.getElementById('fMinus').onclick=()=>{S.fs=Math.max(0,S.fs-1);applyPref();};
document.getElementById('hcBtn').onclick=()=>{S.hc=!S.hc;applyPref();};

/* ── helpers ── */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rxesc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hilite(t,terms){
  let h=esc(t);
  if(terms.length){
    const rx=new RegExp('('+terms.map(rxesc).join('|')+')','gi');
    h=h.replace(rx,'<mark>$1</mark>');
  }
  return h;
}
function chapter(no){return DATA.chapters.find(c=>c.no===no);}
function pagesOf(sec,subIdx){
  if(sec.subs&&sec.subs.length){
    if(subIdx>=0) return sec.subs[subIdx].pages;
    return sec.subs.flatMap(s=>s.pages);
  }
  return sec.pages||[];
}
function findLoc(p){
  for(const c of DATA.chapters) for(let i=0;i<c.sections.length;i++){
    const s=c.sections[i];
    if(p>=s.start&&p<=s.end){
      if(s.subs&&s.subs.length){
        for(let j=0;j<s.subs.length;j++) if(p>=s.subs[j].start&&p<=s.subs[j].end) return {ch:c.no,sec:i,sub:j};
      }
      return {ch:c.no,sec:i,sub:-1};
    }
  }
  return null;
}

/* ── search index ── */
const INDEX=[];
for(const c of DATA.chapters) for(let i=0;i<c.sections.length;i++){
  const s=c.sections[i];
  const push=(pg,subIdx,subT)=>INDEX.push({ch:c.no,chT:c.title,sec:i,secT:s.title,sub:subIdx,subT,p:pg.p,t:pg.t,low:pg.t.toLowerCase()});
  if(s.subs&&s.subs.length) s.subs.forEach((sb,j)=>sb.pages.forEach(pg=>push(pg,j,sb.title)));
  else (s.pages||[]).forEach(pg=>push(pg,-1,null));
}

/* ── tabs ── */
const TABS=[['home','홈']];
if(CHANGES.length) TABS.push(['changes',CFG.changesTab||'개정사항']);
TABS.push(['browse',CFG.browseTab||'목차별 열람']);
(CFG.quickTabs||[]).forEach((qt,i)=>TABS.push(['quick'+i,qt.label]));

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>
    `<button class="tab ${S.view===k||(S.view==='reader'&&k==='browse')||(S.view==='search'&&k==='home')?'on':''}" data-v="${k}">${l}</button>`).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(v==='browse'){go({view:'reader',ch:S.view==='reader'?S.ch:DATA.chapters[0].no,sec:S.view==='reader'?S.sec:0,sub:-1});}
    else if(v.startsWith('quick')){const qt=CFG.quickTabs[+v.slice(5)];go({view:'reader',ch:qt.ch,sec:qt.sec||0,sub:-1});}
    else go({view:v});
  });
}

function go(patch){
  S={...S,...patch};
  if(!('terms' in patch)) S.terms=[];
  render();
  window.scrollTo({top:0});
}

/* ── views ── */
function vHome(){
  const totSec=DATA.chapters.reduce((a,c)=>a+c.sections.length,0);
  const tiles=[
    `<div class="stat" role="listitem"><div class="n">${DATA.chapters.length}개 ${UNIT}</div><div class="l">${CFG.chapterTileLabel||'대분류'}</div></div>`,
    `<div class="stat" role="listitem"><div class="n">${totSec}개 절</div><div class="l">${CFG.sectionTileLabel||'세부 항목'}</div></div>`,
    `<div class="stat" role="listitem"><div class="n">${DATA.totalPages}쪽</div><div class="l">원문 전체 수록</div></div>`,
  ];
  if(CHANGES.length) tiles.push(`<div class="stat" role="listitem"><div class="n">${CHANGES.length}개</div><div class="l">${CFG.changesTileLabel||'개정 항목'}</div></div>`);
  return `
  <div class="stats" role="list">${tiles.join('')}</div>
  ${HIGHLIGHTS.length?`
  <div class="h2">${CFG.highlightsTitle||'주요 내용 하이라이트'} <span class="cnt">— 카드를 누르면 원문으로 이동</span></div>
  <div class="hl-grid">
    ${HIGHLIGHTS.map(h=>`<div class="hl" data-p="${h.p}" tabindex="0" role="button">
      <div class="t">${h.t}</div><div class="d">${h.d}</div><div class="p">원문 ${h.p}쪽 →</div></div>`).join('')}
  </div>`:''}
  <div class="h2">${CFG.browseTitle||'목차별 열람'} <span class="cnt">— ${UNIT}을 누르면 절 단위 원문 열람</span></div>
  <div class="ch-grid">
    ${DATA.chapters.map(c=>`<div class="chcard" data-ch="${c.no}" tabindex="0" role="button">
      <span class="no">제${c.no}${UNIT}</span>
      <h3>${c.title}</h3>
      <div class="pg">원문 ${c.start}~${c.end}쪽 · ${c.sections.length}개 절</div>
      <ul>${c.sections.slice(0,4).map(s=>`<li>${s.title}</li>`).join('')}${c.sections.length>4?`<li>… 외 ${c.sections.length-4}개 절</li>`:''}</ul>
    </div>`).join('')}
  </div>`;
}

function vChanges(){
  const src=CFG.changesSource||{};
  const srcPages=src.ch?pagesOf(chapter(src.ch).sections[src.sec||0],-1):[];
  return `
  <div class="h2">${CFG.changesTitle||'개정사항 색인'} <span class="cnt">— ${CHANGES.length}개 항목</span></div>
  ${CFG.changesNote?`<div class="notice">${CFG.changesNote}</div>`:''}
  <div style="overflow-x:auto"><table class="chgtable">
    <thead><tr><th>구분</th><th>항목</th><th>주요 내용</th><th style="white-space:nowrap">바로가기</th></tr></thead>
    <tbody>${CHANGES.map(c=>`<tr>
      <td class="code">${c.code||''}</td>
      <td class="nm">${c.name}</td>
      <td style="font-size:.92em">${c.note||''}</td>
      <td style="white-space:nowrap">
        ${c.p1?`<button class="gobtn" data-goto-p="${c.p1}">원문 ${c.p1}${c.p2>c.p1?'~'+c.p2:''}쪽</button><br>`:''}
        ${c.ch?`<button class="gobtn" data-goto-sec="${c.ch}:${c.sec||0}">본문 제${c.ch}${UNIT}</button>`:''}
      </td></tr>`).join('')}
    </tbody></table></div>
  ${(()=>{ if(!CFG.changesSource)return '';
    const ss=chapter(CFG.changesSource.ch).sections[CFG.changesSource.sec||0];
    if(ss&&ss.html) return `<div class="h2">${CFG.changesSourceTitle||'개정 대조표 원문 전체'}</div><div class="pageblock"><div class="pagebody">${ss.html}</div></div>`;
    return srcPages.length?`<div class="h2">${CFG.changesSourceTitle||'개정 대조표 원문 전체'}</div>${readerPages(srcPages,[])}`:''; })()}`;
}

function sideTree(){
  return `<div class="side" aria-label="목차">${DATA.chapters.map(c=>{
    const open=c.no===S.ch;
    return `<button class="chh" data-ch="${c.no}"><span>제${c.no}${UNIT} ${c.title}</span><span class="ar">${open?'▾':'▸'}</span></button>
    ${open?`<div class="secs">${c.sections.map((s,i)=>{
      const on=i===S.sec;
      let html=`<button class="sec ${on&&S.sub<0?'on':''}" data-sec="${c.no}:${i}">${s.title} <span style="opacity:.65;font-size:.85em">p.${s.start}</span></button>`;
      if(on&&s.subs&&s.subs.length){
        html+=s.subs.map((sb,j)=>`<button class="sec sub ${S.sub===j?'on':''}" data-sub="${c.no}:${i}:${j}">${sb.title}</button>`).join('');
      }
      return html;
    }).join('')}</div>`:''}`;
  }).join('')}</div>`;
}

function pdfLink(p){
  if(!CFG.pdfUrl) return '';
  const n=p+(CFG.pdfOffset||0);
  return ` <a class="pdflink" href="${CFG.pdfUrl}#page=${n}" target="_blank" rel="noopener" `+
    `title="원문 PDF를 새 탭에서 엽니다. PC 브라우저에서는 해당 쪽으로 바로 이동합니다(휴대폰은 1쪽부터 열릴 수 있음).">원문 PDF ↗</a>`;
}
/* 공문서 위계(1. → 가. → ○ → － → ※) 인식 렌더링.
   넓은 공백이 있는 줄(표)은 고정폭 pre로 묶어 열 정렬을 보존한다. */
function renderBody(t,terms){
  const lines=t.split('\n'), out=[]; let mono=[];
  const ROMAN=/^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩⅪⅫ]\s*\.?\s+\S/;
  /* 1차 분류: b=빈 줄, t=표(넓은 공백), o=일반 텍스트 */
  const kind=lines.map(l=>{
    const s=l.trim();
    if(!s) return 'b';
    if(ROMAN.test(s)&&s.length<70) return 'o';           // 절 대제목은 표로 취급 안 함
    return /\S\s{5,}\S/.test(s)?'t':'o';
  });
  /* 표 사이에 낀 일반 줄은 표에 병합(행 대응 유지) */
  const near=(i,dir)=>{let j=i+dir,st=0;while(j>=0&&j<lines.length&&st<2){if(kind[j]==='t')return true;if(kind[j]==='o')return false;j+=dir;st++;}return false;};
  for(let i=0;i<lines.length;i++) if(kind[i]==='o'&&near(i,-1)&&near(i,1)) kind[i]='t';
  const flushMono=()=>{ if(mono.length){out.push('<pre>'+mono.map(l=>hilite(l,terms)).join('\n')+'</pre>');mono=[];} };
  const pushGap=()=>{ if(out.length&&!out[out.length-1].startsWith('<div class="gap"')) out.push('<div class="gap"></div>'); };
  for(let i=0;i<lines.length;i++){
    const l=lines[i], s=l.trim();
    if(kind[i]==='b'){ flushMono(); pushGap(); continue; }
    if(kind[i]==='t'){ mono.push(l); continue; }
    flushMono();
    const ind=Math.min(Math.floor((l.length-l.trimStart().length)/2),14);
    // 배지 숫자 단독줄 + 다음 줄 제목 → 합쳐서 번호 제목으로
    if(/^\d{1,2}$/.test(s)){
      let j=i+1; while(j<lines.length&&!lines[j].trim())j++;
      const nx=j<lines.length?lines[j].trim():'';
      if(nx&&nx.length<60&&!/\S\s{5,}\S/.test(nx)&&!/^\d/.test(nx)){
        out.push(`<div class="ln h2"><span class="badge">${s}</span>${hilite(nx,terms)}</div>`);
        i=j; continue;
      }
    }
    let cls='p', html=hilite(s,terms);
    const mNum=s.match(/^(\d{1,2})\s+(\S.*)$/);
    if(ROMAN.test(s)){ cls='h1'; html=hilite(s.replace(/\s+/g,' '),terms); }
    else if(mNum&&s.length<55&&!/^\d+\s*[.,)]/.test(s)&&!/^\d+\s+\d/.test(s)){
      cls='h2'; html=`<span class="badge">${mNum[1]}</span>${hilite(mNum[2],terms)}`;
    }
    else if(/^[가-힣]\.\s/.test(s)) cls='h3';
    else if(/^\d{1,2}\)\s/.test(s)) cls='h4';
    else if(/^○/.test(s)) cls='b1';
    else if(/^[※＊]/.test(s)) cls='note';
    out.push(`<div class="ln ${cls}" style="--ind:${cls==='p'?ind:0}">${html}</div>`);
  }
  flushMono();
  return out.join('');
}
function readerPages(pages,terms){
  return pages.map(pg=>`<div class="pageblock" id="p${pg.p}">
    <div class="pagehead"><span>원문 ${pg.p}쪽${pdfLink(pg.p)}</span><span>${DATA.title}</span></div>
    <div class="pagebody">${renderBody(pg.t,terms)}</div></div>`).join('');
}

/* 하이브리드 모드: 사전 조판된 HTML의 텍스트 노드에만 검색어 형광 적용 */
function markTerms(html,terms){
  if(!terms.length) return html;
  const rx=new RegExp('('+terms.map(rxesc).join('|')+')','gi');
  return html.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(rx,'<mark>$1</mark>')+'<');
}
function vReader(){
  const c=chapter(S.ch), s=c.sections[S.sec];
  if(S.sub>=0&&(!s.subs||S.sub>=s.subs.length)) S.sub=-1;  // 장 이동 시 이전 세부항목 인덱스 방어
  const pages=pagesOf(s,S.sub);
  const subT=(S.sub>=0&&s.subs)?s.subs[S.sub].title:null;
  const flat=[]; DATA.chapters.forEach(cc=>cc.sections.forEach((ss,i)=>flat.push([cc.no,i,`제${cc.no}${UNIT} · ${ss.title}`])));
  const cur=flat.findIndex(f=>f[0]===S.ch&&f[1]===S.sec);
  const prev=flat[cur-1],next=flat[cur+1];
  return `<div class="reader">
    ${sideTree()}
    <div class="content">
      <div class="crumb">제${c.no}${UNIT} ${c.title} ${subT?'· '+s.title:''}</div>
      <h2 class="title">${subT||s.title}</h2>
      <div class="range">원문 ${s.html?s.start+'~'+s.end:(pages.length?pages[0].p+'~'+pages[pages.length-1].p:'-')}쪽 ${s.html?'':'· '+pages.length+'쪽 분량'} ${s.subs&&s.subs.length&&S.sub<0?'· 세부항목 '+s.subs.length+'개(왼쪽 목차에서 선택)':''}</div>
      ${s.html?`<div class="pageblock"><div class="pagebody">${markTerms(s.html,S.terms)}</div></div>`:readerPages(pages,S.terms)}
      <div class="secnav">
        <button ${prev?'':'disabled style="visibility:hidden"'} data-nav="${prev?prev[0]+':'+prev[1]:''}">← ${prev?prev[2]:''}</button>
        <button ${next?'':'disabled style="visibility:hidden"'} data-nav="${next?next[0]+':'+next[1]:''}">${next?next[2]:''} →</button>
      </div>
    </div></div>`;
}

function vSearch(){
  const terms=S.terms;
  if(!terms.length) return '<p>검색어를 입력하세요.</p>';
  const hits=[];
  for(const e of INDEX){
    if(terms.every(t=>e.low.includes(t.toLowerCase()))) hits.push(e);
    if(hits.length>=300) break;
  }
  const shown=hits.slice(0,200);
  return `
  <div class="h2">검색 결과</div>
  <div class="rescount">"<b>${esc(terms.join(' '))}</b>" — ${hits.length>=300?'300건 이상':hits.length+'건'} (쪽 단위${hits.length>200?', 상위 200건 표시':''})</div>
  ${shown.length? shown.map(e=>{
    const pos=e.low.indexOf(terms[0].toLowerCase());
    const a=Math.max(0,pos-70), b=Math.min(e.t.length,pos+130);
    const snip=(a>0?'… ':'')+e.t.slice(a,b).replace(/\s+/g,' ')+(b<e.t.length?' …':'');
    return `<div class="sr" data-jump="${e.p}" tabindex="0" role="button">
      <div class="loc">제${e.ch}${UNIT} ${e.chT} › ${e.secT}${e.subT?' › '+e.subT:''} · 원문 ${e.p}쪽</div>
      <div class="snip">${hilite(snip,terms)}</div></div>`;
  }).join('') : '<p>일치하는 내용이 없습니다. 단어를 줄이거나 다른 표현으로 검색해 보세요.</p>'}`;
}

/* ── render & events ── */
function render(){
  renderTabs();
  const m=document.getElementById('main');
  if(S.view==='home')m.innerHTML=vHome();
  else if(S.view==='changes')m.innerHTML=vChanges();
  else if(S.view==='reader')m.innerHTML=vReader();
  else if(S.view==='search')m.innerHTML=vSearch();
  bind(m);
}
function jumpToPage(p,terms){
  const loc=findLoc(p);
  if(!loc)return;
  S={...S,view:'reader',ch:loc.ch,sec:loc.sec,sub:loc.sub,terms:terms||[]};
  render();
  requestAnimationFrame(()=>{
    const el=document.getElementById('p'+p);
    if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-70);}
  });
}
function bind(m){
  m.querySelectorAll('[data-ch]').forEach(el=>{
    el.onclick=()=>go({view:'reader',ch:+el.dataset.ch,sec:0,sub:-1});
  });
  m.querySelectorAll('.chcard').forEach(el=>{
    el.onkeydown=e=>{if(e.key==='Enter')el.click();};
  });
  m.querySelectorAll('[data-sec]').forEach(el=>el.onclick=()=>{const[a,b]=el.dataset.sec.split(':');go({view:'reader',ch:+a,sec:+b,sub:-1});});
  m.querySelectorAll('[data-sub]').forEach(el=>el.onclick=()=>{const[a,b,c]=el.dataset.sub.split(':');go({view:'reader',ch:+a,sec:+b,sub:+c});});
  m.querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>{const[a,b]=el.dataset.nav.split(':');go({view:'reader',ch:+a,sec:+b,sub:-1});});
  m.querySelectorAll('[data-p],[data-jump]').forEach(el=>{
    const p=+(el.dataset.p||el.dataset.jump);
    el.onclick=()=>jumpToPage(p, el.dataset.jump?S.terms:[]);
    el.onkeydown=e=>{if(e.key==='Enter')el.click();};
  });
  m.querySelectorAll('[data-goto-p]').forEach(el=>el.onclick=()=>jumpToPage(+el.dataset.gotoP,[]));
  m.querySelectorAll('[data-goto-sec]').forEach(el=>el.onclick=()=>{const[a,b]=el.dataset.gotoSec.split(':');go({view:'reader',ch:+a,sec:+b,sub:-1});});
}
function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q)return;
  S.terms=q.split(/\s+/).filter(Boolean).slice(0,5);
  S.view='search';
  render();window.scrollTo({top:0});
}
document.getElementById('qbtn').onclick=doSearch;
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

applyPref();
render();
</script>
</body>
</html>
