le><div class=\"pchip\" id=\"p70\"><span>원문 70쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=76\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">지도･감독기관은 지도･감독에 전문적 지식이나 자문이 필요한 경우 관계자에게 촉탁할 수 있음<\/div><div class=\"ln p\">-촉탁 받은 자는 출입권한증명서(시행규칙 별지 제23호)를 소지하고 관계공무원과 동행함<\/div><div class=\"ln p\">법인의 주된 사무소의 소재지와 시설의 소재지가 동일한 시도 또는 시･군･구에 있지 아니한 경우 당해 시설의 업무는 시설 소재지의 시･도지사 또는 시･군･구청장이 지도･감독하되, 별도의 행정협약을 체결한 경우 협약에 따름<\/div><div class=\"ln p\">-필요한 경우 법인의 업무에 대하여 법인의 주된 사무소 소재지의 시･도지사 또는 시･군･구청장에게 협조를 요청<\/div><div class=\"ln p\">상기 검사･질문 또는 회계감사를 하는 관계 공무원 등은 그 권한을 표시하는 증표*를 지니고 이를 관계인에게 보여주어야 함<\/div><div class=\"ln p\">* 법 제51조제1항에 따른 지도･감독: 지도･감독 공무원증(시행규칙 별지 제22호)<\/div><div class=\"ln p\">* 법 제51조제2항에 따른 회계감사: 회계감사 권한 증명서(시행규칙 별지 제22호의2)<\/div><div class=\"pchip\" id=\"p71\"><span>원문 71쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=77\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">시･군･구청장(위임기관)<\/div><div class=\"ln p\">시･도지사는 법인 관련업무의 일부를 조례･규칙 등 자치법규로 시･군･구청장에게 위임가능<\/div><div class=\"ln p\">-단, 포괄적 위임, 법인설립허가･취소(시행령 제8조 참고), 해산법인의 청산사무는 위임대상사무가 아니며,<\/div><div class=\"ln p\">-기본재산 처분허가, 임원의 해임명령, 주사무소이전 등 중요사항에 대한 정관변경인가 등의 중요사항에 대해서는 위임하지 않는 것을 원칙으로 함<\/div><div class=\"ln p\">감사 및 지도감독<\/div><table class=\"htbl\"><tr><td>종 류<\/td><td>대상<\/td><td>주      기<\/td><td>실시기관<\/td><\/tr><tr><td rowspan=\"2\">정기지도감독<br>‑ 조직운영 전반<br>‑ 회계감사<\/td><td>법인<\/td><td>최소 매3년마다 1회<\/td><td rowspan=\"2\">시･도지사(위임기관) 또는 시･군･구청장<\/td><\/tr><tr><td>시설<\/td><td>연 1회 이상<\/td><\/tr><tr><td>수시 지도점검<\/td><td>시설<\/td><td>필요시(입퇴소 실태, 생활실태)<\/td><td>시･군･구청장<\/td><\/tr><tr><td>특별지도감독<\/td><td>법인<br>시설<\/td><td>진정, 투서, 언론보도, 비리발생, 인권침해, 행정처분이나 지적사항 미이행 등 주무관청이 지도감독 필요성이 있다고 판단한 경우<\/td><td>보건복지부장관<br>시･도지사<br>시･군･구청장<\/td><\/tr><\/table><div class=\"ln p\">처분 관련 정보의 공표(법 제51조, 영 제24조의2)<\/div><div class=\"ln p\">-다음의 사항에 따라 법인의 설립허가를 취소한 경우<\/div><div class=\"ln p\">① 거짓이나 그 밖의 부정한 방법으로 설립허가를 받은 경우<\/div><div class=\"ln p\">② 목적사업 외의 사업을 한 경우<\/div><div class=\"ln p\">③ 법인 운영시설에서 반복적 또는 집단적 성폭력범죄가 발생한 경우<\/div><div class=\"ln p\">-다음의 사항에 따라 시설의 장의 교체를 명하거나 시설의 폐쇄를 명령한 경우<\/div><div class=\"ln p\">① 회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 경우<\/div><div class=\"ln p\">② 신고를 하지 아니하고 시설을 설치･운영한 경우<\/div><div class=\"ln p\">③지도･감독에 필요한 보고나 자료제출을 하지 않거나 거짓으로 한 경우<\/div><div class=\"ln p\">④지도･감독･회계감사에 필요한 검사･질문･회계감사를 거부･방해하거나 기피하였을 때<\/div><div class=\"ln p\">⑤ 시설에서 성폭력범죄 또는 학대관련범죄가 발생한 경우<\/div><div class=\"pchip\" id=\"p72\"><span>원문 72쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=78\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">-해당 관청의 인터넷 홈페이지(6개월 이내)와 신문(필요한 경우)에 게재<\/div><div class=\"ln p\">&lt;예시&gt; 공  고 「사회복지사업법」 제   조제   항에 따라 사회복지법인 ○○○(또는 □□원)의 행정처분사항을 다음과 같이 공고합니다. 1. 법인명：사회복지법인 ○○○(소재지：             ) 2. 처분의 내용：법인설립허가 취소 3. 처분일：20  .    .    . 4. 처분의 사유：거짓이나 그 밖의 부정한 방법으로 설립허가를 받음 5. 근거법령：「사회복지사업법」 제26조제1항제1호<\/div><div class=\"ln p\">처분결과 관리<\/div><div class=\"ln p\">-지자체는 사회복지법인･시설에 행정처분을 부과하는 경우, 향후 동일한 위반행위 발생 시 처분 차수 등에 대한 확인을 위해 그 이력을 사회보장정보시스템(행복이음)에 입력하여 철저히 관리할 것<\/div><div class=\"ln p\">법인설립허가 취소통보<\/div><div class=\"ln p\">-법인설립허가 취소 처분과 동시에 법인은 해산되고 청산절차에 들어가게 되므로, 사회복지법인의 설립허가를 취소한 경우 관할 등기소에 취소사실을 통보<\/div><div class=\"ln note\">※관할 등기소에서는 「주무관청의 설립허가취소에 따른 법인등기 사무처리요령」 예규에 따라 해당 법인의 인감증명서 발급과 등기업무를 중지함<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>「주무관청의 설립허가취소에 따른 법인등기 사무처리요령」<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">「주무관청의 설립허가취소에 따른 법인등기 사무처리요령」 [시행 2014.1.1.] [대법원등기예규 제1506호, 2013.12.24, 전부개정]<br>제1조(목적) 이 예규는 주무관청으로부터 사단법인이나 재단법인의 설립허가 취소 통보를 받은 경우(사단법인이나 재단법인에 관한 규정을 준용하는 경우를 포함한다) 등기관의 법인등기 사무처리절차를 정함을 목적으로 한다.<br>제2조(직권해산등기 여부) 사단법인 또는 재단법인은 주무관청의 설립허가 취소에 의해 당연히 해산되고, 이사 등이 「민법」 제82조 등에 따라 청산인이 되지만 그 법인에 대한 해산등기 및 청산인 선임등기는 청산인이 신청하여야 하므로 이러한 등기를 등기관이 직권으로 하여서는 아니된다.<br>제3조(등기관의 처리) ① 주무관청으로부터 설립허가 취소 통보를 받은 경우 등기관은 전산시스템의 부전지 기능을 이용하여 설립허가취소 사실, 설립허가취소 연월일, 취소기관, 문서번호 또는 관보번호 등을 입력하여 해산된 법인임을 알 수 있도록 하여야 한다.<br>② 설립허가가 취소된 법인에 대하여는 인감증명서를 발급하여서는 아니된다.<br>제4조(등기의 제한) 설립허가가 취소된 법인에 대하여는 해산등기 및 청산인 선임등기 이외의 등기는 수리하여서는 아니된다.<br>부  칙  &lt;제1506호, 2013.12.24&gt;<br>이 예규는 2014년 1월 1일부터 시행한다.<\/td><\/tr><\/table><div class=\"pchip\" id=\"p73\"><span>원문 73쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=79\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">법인의 비치서류<\/div><div class=\"ln p\">법인은 다음 각 호의 서류 및 장부를 비치해야 함<\/div><div class=\"ln p\">-정관(영구)<\/div><div class=\"ln p\">-임원명부 및 이력서(영구)<\/div><div class=\"ln p\">-재산목록(영구)<\/div><div class=\"ln p\">➝기본재산과 보통재산 구분<\/div><div class=\"ln p\">-총회 또는 이사회 회의록(영구)<\/div><div class=\"ln p\">-사업계획서, 사업실적서 및 예･결산서(10년)<\/div><div class=\"ln p\">➝추정손익계산서 및 추정재무상태표와 그 부속명세서 첨부<\/div><div class=\"ln p\">-현금 및 물품의 출납대장(10년)<\/div><div class=\"ln p\">-보조금을 받는 경우 보조금관리대장(영구)<\/div><div class=\"ln p\">-주무관청 등 관계기관과의 서류 및 자산･회계 증빙서류(10년)<\/div><div class=\"ln note\">※ 지자체 또는 법인에서 서류의 보존기간이 규정되어 있는 문서관리규정 등 관련 규정이 있는 경우에는 별도 적용 가능<\/div><div class=\"ln note\">※ 다만, 주무관청이 법인사무의 지도 및 감독을 위하여 법인에게 관계 서류의 제출을 명하거나 소속 공무원으로 하여금 법인의 사무 및 재산상황을 검사하게 할 수 있으므로 비치서류 관리에 철저를 기할 것(사회복지사업법 제51조)<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">벌칙규정<\/div><div class=\"ln p\">「사회복지사업법」 제53조∼제58조 및 시행령 과태료의 부과기준 참고<\/div><div class=\"ln p\">「민법」 제97조 등기관련 과태료 부과기준 참고<\/div><div class=\"pchip\" id=\"p74\"><span>원문 74쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=80\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">종사자 채용 및 결격사유 조회<\/div><div class=\"ln p\">종사자 채용 시 준수사항(법 제35조의3, '19.6.12. 이후 종사자 채용시 적용)<\/div><div class=\"ln p\">-사회복지법인에서 해당 법인 또는 운영 중인 시설의 종사자를 채용할 때 정당한 사유 없이 채용광고의 내용을 종사자가 되려는 사람에게 불리하게 변경하여 채용하여서는 안됨<\/div><div class=\"ln p\">-종사자를 채용한 후에 정당한 사유 없이 채용광고에서 제시한 근로조건을 종사자에게 불리하게 변경하여 적용하여서는 안됨<\/div><div class=\"ln note\">※종사자 채용 시 준수사항 위반 시, 법 제58조에 따라 500만원 이하의 과태료 처분<\/div><div class=\"ln p\">종사자 결격사유 조회<\/div><div class=\"ln p\">-「사회복지사업법」 제19조, 제35조, 제35조의2 등에 따른 임원 및 시설의 장 및 종사자 등에 대한 결격사유 조회는 「형의 실효 등에 관한 법률」 제6조(범죄경력조회․수사경력조회 및 회보의 제한 등) 각 호에 따라 최소한의 범위에서 가능<\/div><div class=\"ln p\">-기존 직원에 대한 범죄 관련 수사 등으로 인해 평소의 근무상태에 변화가 초래되거나 기타 다른 사유로 인해 기존 근무를 계속 유지할 수 없는 사정이 발생하는 등의 경우가 아닌 아무 이유 없이 범죄경력 조회가 이루어지는 것은 개인정보 침해 및 경찰청 범죄경력 조회의 과중한 업무 부담을 초래할 수 있으므로 단지 점검 목적의 이유로 범죄경력 조회 지양(법무부 등 관련기관 요청사항)<\/div><table class=\"htbl\"><tr><td>조회 주체<\/td><td>목  적<\/td><\/tr><tr><td>설치･운영자<\/td><td>종사자에 대한 결격사유 확인 및 고용의 합법성 확인(제3자에게 제출 불가)<\/td><\/tr><tr><td>지자체장<\/td><td>종사자에 대한 결격사유 확인 및 고용의 합법성 확인(제3자에게 제출 불가)<\/td><\/tr><\/table><div class=\"ln p\">사회복지법인 업무의 전자화<\/div><div class=\"ln p\">1. 사회서비스정보시스템의 활용<\/div><div class=\"ln p\">2. 사회복지법인 온라인 보고<\/div><div class=\"ln p\">제Ⅳ장<\/div>", "pages": [{"p": 69, "t": "5\n법인의 관리･감독\n가\n법원(法院)\n법인의 해산과 청산의 감독은 법원이 담당(「민법」 제84조, 제95조)\n나\n시･도지사(법 제51조, 재무회계규칙 제42조)\n법인설립허가, 법인정관변경인가, 기본재산 처분허가 등 법인 업무전반에 대한 모든 사항은 시･도지사 권한사항임\n※ 시･도지사는 법인 업무 전반에 대하여 시군구에 검토의견을 요청할 수 있음.\n시･도지사는 자체지도･감사계획에 의거 사회복지사업을 운영하는 법인(법인운영시설 포함)에 대한 소관업무에 관하여 지도･감독을 실시하며\n-필요한 경우 그 업무에 관하여 보고 또는 관계서류의 제출을 명하거나 소속 공무원으로 하여금 법인의 사무소 또는 시설에 출입하여 검사 또는 질문하게 할 수 있음(지도･감독공무원증)\n시･도지사 또는 시장･군수･구청장은 사회복지법인과 사회복지시설에 대하여 지방의회의 추천을 받아 「공인회계사법」 제7조에 따라 등록한 공인회계사 또는 「주식회사 등의 외부감사에 관한 법률」 제2조제7호에 따른 감사인을 선임하여 회계감사를 실시할 수 있음(2019.6.12.시행)\n-이 경우 공인회계사 또는 감사인의 추천, 회계감사의 대상 및 그 밖에 필요한 사항은 보건복지부령*으로 정하는 기준에 따라 정한 지방자치단체의 조례에 따름\n |  | \n | * 「사회복지법인 및 사회복지시설 재무회계규칙」 제42조의2(’19.9.27.시행) ①시･도지사 또는 시장･군수･구청장은 법인 및 시설이 다음 각 호의 어느 하나에 해당하는 경우 회계감사를 실시할 수 있다. 1. 「사회복지사업법」 제40조제1항제4호에 따른 회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 경우 2. 「사회복지사업법」 제42조제3항제1호에 따라 거짓이나 그 밖의 부정한 방법으로 보조금을 받은 경우 3. 「사회복지사업법」 제42조제3항제2호에 따라 사업 목적 외의 용도에 보조금을 사용한 경우 4. 「사회복지사업법」 또는 「사회복지사업법」에 따른 명령을 위반한 경우 5. 제42조제4항에 따라 감사가 시장･군수･구청장에게 보고한 경우 ② 제1항에서 규정한 사항 외에 공인회계사 또는 감사인의 추천 등 회계감사의 실시와 관련하여 필요한 사항은 해당 지방자치단체의 조례로 정한다. | \n |  | "}, {"p": 70, "t": "지도･감독기관은 지도･감독에 전문적 지식이나 자문이 필요한 경우 관계자에게 촉탁할 수 있음\n-촉탁 받은 자는 출입권한증명서(시행규칙 별지 제23호)를 소지하고 관계공무원과 동행함\n법인의 주된 사무소의 소재지와 시설의 소재지가 동일한 시도 또는 시･군･구에 있지 아니한 경우 당해 시설의 업무는 시설 소재지의 시･도지사 또는 시･군･구청장이 지도･감독하되, 별도의 행정협약을 체결한 경우 협약에 따름\n-필요한 경우 법인의 업무에 대하여 법인의 주된 사무소 소재지의 시･도지사 또는 시･군･구청장에게 협조를 요청\n상기 검사･질문 또는 회계감사를 하는 관계 공무원 등은 그 권한을 표시하는 증표*를 지니고 이를 관계인에게 보여주어야 함\n* 법 제51조제1항에 따른 지도･감독: 지도･감독 공무원증(시행규칙 별지 제22호)\n* 법 제51조제2항에 따른 회계감사: 회계감사 권한 증명서(시행규칙 별지 제22호의2)"}, {"p": 71, "t": "다\n시･군･구청장(위임기관)\n시･도지사는 법인 관련업무의 일부를 조례･규칙 등 자치법규로 시･군･구청장에게 위임가능\n-단, 포괄적 위임, 법인설립허가･취소(시행령 제8조 참고), 해산법인의 청산사무는 위임대상사무가 아니며,\n-기본재산 처분허가, 임원의 해임명령, 주사무소이전 등 중요사항에 대한 정관변경인가 등의 중요사항에 대해서는 위임하지 않는 것을 원칙으로 함\n감사 및 지도감독\n종 류 | 대상 | 주      기 | 실시기관\n정기지도감독 ‑ 조직운영 전반 ‑ 회계감사 | 법인 | 최소 매3년마다 1회 | 시･도지사(위임기관) 또는 시･군･구청장\n시설 | 연 1회 이상\n수시 지도점검 | 시설 | 필요시(입퇴소 실태, 생활실태) | 시･군･구청장\n특별지도감독 | 법인 시설 | 진정, 투서, 언론보도, 비리발생, 인권침해, 행정처분이나 지적사항 미이행 등 주무관청이 지도감독 필요성이 있다고 판단한 경우 | 보건복지부장관 시･도지사 시･군･구청장\n처분 관련 정보의 공표(법 제51조, 영 제24조의2)\n-다음의 사항에 따라 법인의 설립허가를 취소한 경우\n① 거짓이나 그 밖의 부정한 방법으로 설립허가를 받은 경우\n② 목적사업 외의 사업을 한 경우\n③ 법인 운영시설에서 반복적 또는 집단적 성폭력범죄가 발생한 경우\n-다음의 사항에 따라 시설의 장의 교체를 명하거나 시설의 폐쇄를 명령한 경우\n① 회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 경우\n② 신고를 하지 아니하고 시설을 설치･운영한 경우\n③지도･감독에 필요한 보고나 자료제출을 하지 않거나 거짓으로 한 경우\n④지도･감독･회계감사에 필요한 검사･질문･회계감사를 거부･방해하거나 기피하였을 때\n⑤ 시설에서 성폭력범죄 또는 학대관련범죄가 발생한 경우"}, {"p": 72, "t": "-해당 관청의 인터넷 홈페이지(6개월 이내)와 신문(필요한 경우)에 게재\n<예시> 공  고 「사회복지사업법」 제   조제   항에 따라 사회복지법인 ○○○(또는 □□원)의 행정처분사항을 다음과 같이 공고합니다. 1. 법인명：사회복지법인 ○○○(소재지：             ) 2. 처분의 내용：법인설립허가 취소 3. 처분일：20  .    .    . 4. 처분의 사유：거짓이나 그 밖의 부정한 방법으로 설립허가를 받음 5. 근거법령：「사회복지사업법」 제26조제1항제1호\n처분결과 관리\n-지자체는 사회복지법인･시설에 행정처분을 부과하는 경우, 향후 동일한 위반행위 발생 시 처분 차수 등에 대한 확인을 위해 그 이력을 사회보장정보시스템(행복이음)에 입력하여 철저히 관리할 것\n법인설립허가 취소통보\n-법인설립허가 취소 처분과 동시에 법인은 해산되고 청산절차에 들어가게 되므로, 사회복지법인의 설립허가를 취소한 경우 관할 등기소에 취소사실을 통보\n※관할 등기소에서는 「주무관청의 설립허가취소에 따른 법인등기 사무처리요령」 예규에 따라 해당 법인의 인감증명서 발급과 등기업무를 중지함\n참고 | 「주무관청의 설립허가취소에 따른 법인등기 사무처리요령」\n |  | \n |  | 「주무관청의 설립허가취소에 따른 법인등기 사무처리요령」 [시행 2014.1.1.] [대법원등기예규 제1506호, 2013.12.24, 전부개정] 제1조(목적) 이 예규는 주무관청으로부터 사단법인이나 재단법인의 설립허가 취소 통보를 받은 경우(사단법인이나 재단법인에 관한 규정을 준용하는 경우를 포함한다) 등기관의 법인등기 사무처리절차를 정함을 목적으로 한다. 제2조(직권해산등기 여부) 사단법인 또는 재단법인은 주무관청의 설립허가 취소에 의해 당연히 해산되고, 이사 등이 「민법」 제82조 등에 따라 청산인이 되지만 그 법인에 대한 해산등기 및 청산인 선임등기는 청산인이 신청하여야 하므로 이러한 등기를 등기관이 직권으로 하여서는 아니된다. 제3조(등기관의 처리) ① 주무관청으로부터 설립허가 취소 통보를 받은 경우 등기관은 전산시스템의 부전지 기능을 이용하여 설립허가취소 사실, 설립허가취소 연월일, 취소기관, 문서번호 또는 관보번호 등을 입력하여 해산된 법인임을 알 수 있도록 하여야 한다. ② 설립허가가 취소된 법인에 대하여는 인감증명서를 발급하여서는 아니된다. 제4조(등기의 제한) 설립허가가 취소된 법인에 대하여는 해산등기 및 청산인 선임등기 이외의 등기는 수리하여서는 아니된다. 부  칙  <제1506호, 2013.12.24> 이 예규는 2014년 1월 1일부터 시행한다."}, {"p": 73, "t": "라\n법인의 비치서류\n법인은 다음 각 호의 서류 및 장부를 비치해야 함\n-정관(영구)\n-임원명부 및 이력서(영구)\n-재산목록(영구)\n➝기본재산과 보통재산 구분\n-총회 또는 이사회 회의록(영구)\n-사업계획서, 사업실적서 및 예･결산서(10년)\n➝추정손익계산서 및 추정재무상태표와 그 부속명세서 첨부\n-현금 및 물품의 출납대장(10년)\n-보조금을 받는 경우 보조금관리대장(영구)\n-주무관청 등 관계기관과의 서류 및 자산･회계 증빙서류(10년)\n※ 지자체 또는 법인에서 서류의 보존기간이 규정되어 있는 문서관리규정 등 관련 규정이 있는 경우에는 별도 적용 가능\n※ 다만, 주무관청이 법인사무의 지도 및 감독을 위하여 법인에게 관계 서류의 제출을 명하거나 소속 공무원으로 하여금 법인의 사무 및 재산상황을 검사하게 할 수 있으므로 비치서류 관리에 철저를 기할 것(사회복지사업법 제51조)\n마\n벌칙규정\n「사회복지사업법」 제53조∼제58조 및 시행령 과태료의 부과기준 참고\n「민법」 제97조 등기관련 과태료 부과기준 참고"}, {"p": 74, "t": "바\n종사자 채용 및 결격사유 조회\n종사자 채용 시 준수사항(법 제35조의3, '19.6.12. 이후 종사자 채용시 적용)\n-사회복지법인에서 해당 법인 또는 운영 중인 시설의 종사자를 채용할 때 정당한 사유 없이 채용광고의 내용을 종사자가 되려는 사람에게 불리하게 변경하여 채용하여서는 안됨\n-종사자를 채용한 후에 정당한 사유 없이 채용광고에서 제시한 근로조건을 종사자에게 불리하게 변경하여 적용하여서는 안됨\n※종사자 채용 시 준수사항 위반 시, 법 제58조에 따라 500만원 이하의 과태료 처분\n종사자 결격사유 조회\n-「사회복지사업법」 제19조, 제35조, 제35조의2 등에 따른 임원 및 시설의 장 및 종사자 등에 대한 결격사유 조회는 「형의 실효 등에 관한 법률」 제6조(범죄경력조회․수사경력조회 및 회보의 제한 등) 각 호에 따라 최소한의 범위에서 가능\n-기존 직원에 대한 범죄 관련 수사 등으로 인해 평소의 근무상태에 변화가 초래되거나 기타 다른 사유로 인해 기존 근무를 계속 유지할 수 없는 사정이 발생하는 등의 경우가 아닌 아무 이유 없이 범죄경력 조회가 이루어지는 것은 개인정보 침해 및 경찰청 범죄경력 조회의 과중한 업무 부담을 초래할 수 있으므로 단지 점검 목적의 이유로 범죄경력 조회 지양(법무부 등 관련기관 요청사항)\n조회 주체 | 목  적\n설치･운영자 | 종사자에 대한 결격사유 확인 및 고용의 합법성 확인(제3자에게 제출 불가)\n지자체장 | 종사자에 대한 결격사유 확인 및 고용의 합법성 확인(제3자에게 제출 불가)\n사회복지법인 업무의 전자화\n1. 사회서비스정보시스템의 활용\n2. 사회복지법인 온라인 보고\n제Ⅳ장"}]}]}, {"no": 5, "title": "사회복지법인 업무의 전자화", "start": 75, "end": 80, "sections": [{"title": "1. 사회서비스정보시스템의 활용", "start": 77, "end": 78, "html": "<div class=\"pchip\" id=\"p77\"><span>원문 77쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=83\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>사회서비스정보시스템의 활용<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회서비스정보시스템(희망이음) 개요<\/div><div class=\"ln h4\">1) 운영목적<\/div><div class=\"ln p\">사회복지시설･법인의 회계, 인사, 서비스 관리 등 정보화 기반 지원<\/div><div class=\"ln h4\">2) 운영근거<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>「사회복지사업법」 제6조의2(사회복지업무의 전자화) ② 보건복지부장관은 사회복지업무에 필요한 각종 자료 또는 정보의 효율적 처리와 기록･관리 업무의 전자화를 위하여 정보시스템을 구축･운영할 수 있다.<br>「사회복지법인 및 사회복지시설 재무･회계 규칙」 제6조의2(정보통신매체에 의한 재무･회계처리)  ② 보건복지부장관은 법인 및 시설의 재무･회계업무의 효율성 및 투명성을 높이기 위하여 「사회복지사업법」 제6조의2제2항에 따른 정보시스템으로서 법인 및 시설의 재무회계를 처리하기 위한 정보시스템을 구축･운영할 수 있다.<br>③ 보건복지부장관, 시･도지사, 시장･군수･구청장은 법인 또는 시설에 대하여 제2항에 따른 시스템을 사용할 것을 권장할 수 있다.<br>④ 「사회복지사업법」 제42조에 따른 보조금을 받는 법인 및 시설은 제1항에 따른 컴퓨터 회계프로그램 중 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템 또는 제2항에 따른 정보시스템을 사용하여 재무･회계를 처리하여야 한다. 다만, 보건복지부장관이 정하는 법인 및 시설은 그러하지 아니하다.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln p\">나<\/div><div class=\"ln p\">주요기능<\/div><div class=\"ln p\">(시설 업무지원) 사회복지시설･법인 운영(회계, 인사/급여, 후원관리) 및 시군구 보고(예･결산, 보조금 교부･정산, 입･퇴소, 종사자) 온라인 처리<\/div><div class=\"ln p\">(지자체 시설･법인 관리) 사회복지시설 보조금 모니터링, 시설평가, 안전점검, 지역아동 실태조사 등 지원, 사회복지시설･법인의 온라인보고 처리<\/div><div class=\"ln p\">(대국민 정보제공) 복지시설 기본정보(시설구분, 대상자, 위치, 연락처), 후원대상시설검색 등 정보 제공<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">사용대상<\/div><div class=\"pchip\" id=\"p78\"><span>원문 78쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=84\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">「사회복지시설 관리안내」 지침에서 규정한 사회복지시설(노인, 장애인, 아동 등) 중 보건복지부 소관의 사회복지시설 및 사회복지법인(사회복지시설을 설치･운영하는 법인 또는 국가나 지방자치단체로부터 보조금을 받는 법인)<\/div><div class=\"ln note\">※「2025 사회복지시설 관리안내」 “Ⅰ. 사회복지시설 현황 &gt; 2. 사회복지시설의 종류 &gt; [보건복지부 소관 사회복지시설의 세부 분류] 참조<\/div>", "pages": [{"p": 77, "t": "1\n사회서비스정보시스템의 활용\n가\n사회서비스정보시스템(희망이음) 개요\n1) 운영목적\n사회복지시설･법인의 회계, 인사, 서비스 관리 등 정보화 기반 지원\n2) 운영근거\n |  | \n | 「사회복지사업법」 제6조의2(사회복지업무의 전자화) ② 보건복지부장관은 사회복지업무에 필요한 각종 자료 또는 정보의 효율적 처리와 기록･관리 업무의 전자화를 위하여 정보시스템을 구축･운영할 수 있다. 「사회복지법인 및 사회복지시설 재무･회계 규칙」 제6조의2(정보통신매체에 의한 재무･회계처리)  ② 보건복지부장관은 법인 및 시설의 재무･회계업무의 효율성 및 투명성을 높이기 위하여 「사회복지사업법」 제6조의2제2항에 따른 정보시스템으로서 법인 및 시설의 재무회계를 처리하기 위한 정보시스템을 구축･운영할 수 있다. ③ 보건복지부장관, 시･도지사, 시장･군수･구청장은 법인 또는 시설에 대하여 제2항에 따른 시스템을 사용할 것을 권장할 수 있다. ④ 「사회복지사업법」 제42조에 따른 보조금을 받는 법인 및 시설은 제1항에 따른 컴퓨터 회계프로그램 중 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템 또는 제2항에 따른 정보시스템을 사용하여 재무･회계를 처리하여야 한다. 다만, 보건복지부장관이 정하는 법인 및 시설은 그러하지 아니하다. | \n |  | \n나\n주요기능\n(시설 업무지원) 사회복지시설･법인 운영(회계, 인사/급여, 후원관리) 및 시군구 보고(예･결산, 보조금 교부･정산, 입･퇴소, 종사자) 온라인 처리\n(지자체 시설･법인 관리) 사회복지시설 보조금 모니터링, 시설평가, 안전점검, 지역아동 실태조사 등 지원, 사회복지시설･법인의 온라인보고 처리\n(대국민 정보제공) 복지시설 기본정보(시설구분, 대상자, 위치, 연락처), 후원대상시설검색 등 정보 제공\n다\n사용대상"}, {"p": 78, "t": "「사회복지시설 관리안내」 지침에서 규정한 사회복지시설(노인, 장애인, 아동 등) 중 보건복지부 소관의 사회복지시설 및 사회복지법인(사회복지시설을 설치･운영하는 법인 또는 국가나 지방자치단체로부터 보조금을 받는 법인)\n※「2025 사회복지시설 관리안내」 “Ⅰ. 사회복지시설 현황 > 2. 사회복지시설의 종류 > [보건복지부 소관 사회복지시설의 세부 분류] 참조"}]}, {"title": "2. 사회복지법인 온라인 보고", "start": 79, "end": 80, "html": "<div class=\"pchip\" id=\"p79\"><span>원문 79쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=85\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회복지법인 온라인 보고<\/div><div class=\"ln p\">가 ss=\"ln p\">&lt;붙임 1&gt; 법제처 해석 – ‘사회복지사업’의 범위<\/div><div class=\"ln p\">&lt;붙임 2&gt; 사회복지법인 설립허가신청서<\/div><div class=\"ln p\">&lt;붙임 3&gt; 설립취지서<\/div><div class=\"ln p\">&lt;붙임 4&gt; 발기인 총회 회의록<\/div><div class=\"ln p\">&lt;붙임 5&gt; 설립 발기인명단<\/div><div class=\"ln p\">&lt;붙임 6&gt; 사회복지법인 정관<\/div><div class=\"ln p\">&lt;붙임 7&gt; 기본재산목록<\/div><div class=\"ln p\">&lt;붙임 8&gt; 설립시 임원명단<\/div><div class=\"ln p\">&lt;붙임 9&gt; 법인이 사용할 인장<\/div><div class=\"ln p\">&lt;붙임 10&gt; 재산출연증서(기부승낙서)<\/div><div class=\"ln p\">&lt;붙임 11&gt; 임원 취임승낙서<\/div><div class=\"ln p\">&lt;붙임 12&gt; 임원의 이력서<\/div><div class=\"ln p\">&lt;붙임 13&gt; 특수관계 부존재 각서<\/div><div class=\"ln p\">&lt;붙임 14&gt; 결격사유 부존재 각서<\/div><div class=\"ln p\">&lt;붙임 15&gt; 사회복지법인 설립허가증<\/div><div class=\"ln p\">&lt;붙임 16&gt; 사회복지법인 임원임면보고서<\/div><div class=\"ln p\">&lt;붙임 17&gt; 사회복지법인 정관변경인가 신청서<\/div><div class=\"ln p\">&lt;붙임 18&gt; 기본재산처분 허가 신청서<\/div><div class=\"ln p\">&lt;붙임 19&gt; 장기차입 허가 신청서<\/div><div class=\"ln p\">&lt;붙임 20&gt; 사회복지법인 합병허가 신청서<\/div><div class=\"ln p\">&lt;붙임 1：법제처 해석 – ‘사회복지사업’의 범위&gt;<\/div><table class=\"htbl\"><tr><td>보건복지부-사회복지사업의 범위<br>(「사회복지사업법」 제2조 등 관련)<br>〔15-0247, 2015.6.23., 보건복지부〕<br><table class=\"htbl\"><tr><td><\/td><td>질의요지<\/td><td><\/td><\/tr><\/table><br>「사회복지사업법」에 따른 사회복지사업은 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정되는지?<br>민원인이 「사회복지사업법」에 따른 사회복지사업이 같은 법 제2조제1호 각 목의 법률에 따른 각종 복지사업과 이와 관련된 자원봉사활동 및 복지시설 운영 등을 목적으로 하는 사업으로만 한정되는지에 대하여 보건복지부에 질의하였고, 보건복지부 내부에 견해 대립이 있어 법제처에 질의한 사안임.<br>「사회복지사업법」에 따른 사회복지사업은 원칙적으로 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정됩니다.<br>「사회복지사업법」 제2조제1호 각 목 외의 부분에서는 사회복지사업을 각 목의 법률에 따른 보호･선도(善導) 또는 복지에 관한 사업과 사회복지상담, 직업지원, 무료 숙박, 지역사회복지, 의료복지, 재가복지(在家福祉), 사회복지관 운영, 정신질환자 및 한센병력자의 사회복귀에 관한 사업 등 각종 복지사업과 이와 관련된 자원봉사활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업으로 규정하면서, 각 목에서는 「국민기초생활 보장법」, 「아동복지법」, 「노인복지법」 등 25개의 법률을 열거하고 있는바,<br>이 사안은 「사회복지사업법」에 따른 사회복지사업이 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정되는지, 아니면 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 외에 같은 호 각 목 외의 부분에 나열된 복지사업도 포함하는지에 관한 것이라 하겠습니다.<br>먼저, 「사회복지사업법」은 사회복지를 필요로 하는 사람에 대하여 인간의 존엄성과 인간다운 생활을 할 권리를 보장하기 위하여 사회복지사업에 관한 기본적 사항을 규정하고 있는 법률로서(제1조), ‘인간다운 생활을 할 권리’와 같은 이른바 사회적 기본권을 구체화하는 입법을 함에 있어서는 입법자에게 광범위한 형성의 자유가 주어진다고 할 것이므로(헌법재판소 1999. 4. 29. 선고 97헌마333결정례 참조), 사회복지사업의 구체적인 내용은 「사회복지사업법」의 입법목적, 정부의 재정능력, 전체적인 경제수준 및 사회보장수준 등 다양한 요소를 고려하여 입법정책적으로 형성되는 것이라 하겠습니다.<br>그리고, 1970년 1월 1일 법률 제2191호로 「사회복지사업법」이 제정될 당시에는 사회복지사업에 대한 정의규정에 3개의 법률만 열거되어 있던 것이 그 후 개정 과정에서 점차 확대되어 현행 「사회복지사업법」의 정의규정에는 25개의 법률이 열거되고 있는바, 이와 같은 입법연혁을 통해 사회복지사업에 관한 개별 법률이 제･개정될 때마다 복지수요의 변화와 국가의 재정능력 등을 종합적으로 고려하여 「사회복지사업법」에 따른 사회복지사업의 범위를 제한적으로 추가해 온 것을 알 수 있습니다.<br>또한, 「사회복지사업법」에 따른 사회복지사업에 포함될 경우 해당 사회복지사업을 하는 자는 국가보조금의 지원 대상이 되는(제42조) 동시에 소관 업무에 관하여 관할 행정청의 지도･감독 대상이 되는(제51조)등 각종 혜택과 그에 따른 의무를 부여받게 되고, 이에 상응하여 국가와 지방자치단체 등도 각종 예산지원 및 지도･감독 의무를 부담하게 되는바, 이와 같은 권리와 의무에 관한 사항은 그 적용대상을 명확히 하여 일선 기관이 당면할 수 있는 혼란을 방지하고 집행의 일관성을 확보할 필요가 있으므로, 법령에 그 범위가 명확하게 규정되어 있어야 할 것입니다.<br>아울러, 「사회복지사업법」 제1조에서는 이 법이 사회복지사업에 관한 기본적 사항을 규정하고 있음을 밝히고 있고, 같은 법 제3조제1항에서는 사회복지사업의 내용 및 절차 등에 관하여 제2조제1호 각 목의 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다고 규정하고 있으며, 같은 조 제2항에서는 제2조제1호 각 목의 법률을 개정하는 경우에는 이 법에 부합하도록 하여야 한다고 규정하고 있는바, 이에 비추어 보면 「사회복지사업법」은 같은 법 제2조제1호 각 목에 열거된 법률에 따른 복지사업 등을 규율하는 사회복지에 관한 기본법적 지위에 있다고 할 것입니다(법제처 2014. 11. 14. 회신 14-0556 해석례 참조). 따라서, 사회통념상 사회복지사업으로 인정되는 사업이라고 하더라도 그 사업의 근거가 되는 법률이 「사회복지사업법」 제2조제1호 각 목에 열거되지 않은 경우라면, 해당 사업은 「사회복지사업법」에 따른 사회복지사업이라 할 수 없을 것입니다.<br>다만, 「사회복지사업법」에 따른 사회복지사업을 제2조제1호 각 목에 열거된 법률에 따라 실시되는 복지사업으로 한정할 경우, “한센병력자의 사회복귀에 관한 사업”과 같이 「사회복지사업법」 제2조제1호 각 목 외의 부분에는 나열되어 있지만, 같은 호 각 목에서는 이와 관련된 개별 법률을 규정하고 있지 않은 사업의 경우에는 「사회복지사업법」에 따른 사회복지사업으로 볼 수 없는 문제가 발생할 수 있습니다. 그러나 이는 현행 법률 중에서는 한센병력자의 사회복귀에 관하여 규정하고 있는 법률이 없어 그 근거 법률을 각 목에 규정하지 못함으로 인해 예외적으로 「사회복지사업법」 제2조제1호 각 목 외의 부분에 직접 해당 사업의 내용을 규정함으로써, 해당 사업을 이 법에 따른 사회복지사업으로 포함시킨 것으로 이해하여야 할 것입니다.<br>이상과 같은 점을 종합해 볼 때, 「사회복지사업법」에 따른 사회복지사업은 원칙적으로 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정된다고 할 것입니다.<\/td><\/tr><\/table>", "pages": [{"p": 83, "t": "<붙임 1> 법제처 해석 – ‘사회복지사업’의 범위\n<붙임 2> 사회복지법인 설립허가신청서\n<붙임 3> 설립취지서\n<붙임 4> 발기인 총회 회의록\n<붙임 5> 설립 발기인명단\n<붙임 6> 사회복지법인 정관\n<붙임 7> 기본재산목록\n<붙임 8> 설립시 임원명단\n<붙임 9> 법인이 사용할 인장\n<붙임 10> 재산출연증서(기부승낙서)\n<붙임 11> 임원 취임승낙서\n<붙임 12> 임원의 이력서\n<붙임 13> 특수관계 부존재 각서\n<붙임 14> 결격사유 부존재 각서\n<붙임 15> 사회복지법인 설립허가증\n<붙임 16> 사회복지법인 임원임면보고서\n<붙임 17> 사회복지법인 정관변경인가 신청서\n<붙임 18> 기본재산처분 허가 신청서\n<붙임 19> 장기차입 허가 신청서\n<붙임 20> 사회복지법인 합병허가 신청서\n<붙임 1：법제처 해석 – ‘사회복지사업’의 범위>\n보건복지부-사회복지사업의 범위 (「사회복지사업법」 제2조 등 관련) 〔15-0247, 2015.6.23., 보건복지부〕  | 질의요지 |  「사회복지사업법」에 따른 사회복지사업은 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정되는지? 민원인이 「사회복지사업법」에 따른 사회복지사업이 같은 법 제2조제1호 각 목의 법률에 따른 각종 복지사업과 이와 관련된 자원봉사활동 및 복지시설 운영 등을 목적으로 하는 사업으로만 한정되는지에 대하여 보건복지부에 질의하였고, 보건복지부 내부에 견해 대립이 있어 법제처에 질의한 사안임. 「사회복지사업법」에 따른 사회복지사업은 원칙적으로 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정됩니다. 「사회복지사업법」 제2조제1호 각 목 외의 부분에서는 사회복지사업을 각 목의 법률에 따른 보호･선도(善導) 또는 복지에 관한 사업과 사회복지상담, 직업지원, 무료 숙박, 지역사회복지, 의료복지, 재가복지(在家福祉), 사회복지관 운영, 정신질환자 및 한센병력자의 사회복귀에 관한 사업 등 각종 복지사업과 이와 관련된 자원봉사활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업으로 규정하면서, 각 목에서는 「국민기초생활 보장법」, 「아동복지법」, 「노인복지법」 등 25개의 법률을 열거하고 있는바, 이 사안은 「사회복지사업법」에 따른 사회복지사업이 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정되는지, 아니면 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 외에 같은 호 각 목 외의 부분에 나열된 복지사업도 포함하는지에 관한 것이라 하겠습니다. 먼저, 「사회복지사업법」은 사회복지를 필요로 하는 사람에 대하여 인간의 존엄성과 인간다운 생활을 할 권리를 보장하기 위하여 사회복지사업에 관한 기본적 사항을 규정하고 있는 법률로서(제1조), ‘인간다운 생활을 할 권리’와 같은 이른바 사회적 기본권을 구체화하는 입법을 함에 있어서는 입법자에게 광범위한 형성의 자유가 주어진다고 할 것이므로(헌법재판소 1999. 4. 29. 선고 97헌마333결정례 참조), 사회복지사업의 구체적인 내용은 「사회복지사업법」의 입법목적, 정부의 재정능력, 전체적인 경제수준 및 사회보장수준 등 다양한 요소를 고려하여 입법정책적으로 형성되는 것이라 하겠습니다. 그리고, 1970년 1월 1일 법률 제2191호로 「사회복지사업법」이 제정될 당시에는 사회복지사업에 대한 정의규정에 3개의 법률만 열거되어 있던 것이 그 후 개정 과정에서 점차 확대되어 현행 「사회복지사업법」의 정의규정에는 25개의 법률이 열거되고 있는바, 이와 같은 입법연혁을 통해 사회복지사업에 관한 개별 법률이 제･개정될 때마다 복지수요의 변화와 국가의 재정능력 등을 종합적으로 고려하여 「사회복지사업법」에 따른 사회복지사업의 범위를 제한적으로 추가해 온 것을 알 수 있습니다. 또한, 「사회복지사업법」에 따른 사회복지사업에 포함될 경우 해당 사회복지사업을 하는 자는 국가보조금의 지원 대상이 되는(제42조) 동시에 소관 업무에 관하여 관할 행정청의 지도･감독 대상이 되는(제51조)등 각종 혜택과 그에 따른 의무를 부여받게 되고, 이에 상응하여 국가와 지방자치단체 등도 각종 예산지원 및 지도･감독 의무를 부담하게 되는바, 이와 같은 권리와 의무에 관한 사항은 그 적용대상을 명확히 하여 일선 기관이 당면할 수 있는 혼란을 방지하고 집행의 일관성을 확보할 필요가 있으므로, 법령에 그 범위가 명확하게 규정되어 있어야 할 것입니다. 아울러, 「사회복지사업법」 제1조에서는 이 법이 사회복지사업에 관한 기본적 사항을 규정하고 있음을 밝히고 있고, 같은 법 제3조제1항에서는 사회복지사업의 내용 및 절차 등에 관하여 제2조제1호 각 목의 법률에 특별한 규정이 있는 경우를 제외하고는 이 법에서 정하는 바에 따른다고 규정하고 있으며, 같은 조 제2항에서는 제2조제1호 각 목의 법률을 개정하는 경우에는 이 법에 부합하도록 하여야 한다고 규정하고 있는바, 이에 비추어 보면 「사회복지사업법」은 같은 법 제2조제1호 각 목에 열거된 법률에 따른 복지사업 등을 규율하는 사회복지에 관한 기본법적 지위에 있다고 할 것입니다(법제처 2014. 11. 14. 회신 14-0556 해석례 참조). 따라서, 사회통념상 사회복지사업으로 인정되는 사업이라고 하더라도 그 사업의 근거가 되는 법률이 「사회복지사업법」 제2조제1호 각 목에 열거되지 않은 경우라면, 해당 사업은 「사회복지사업법」에 따른 사회복지사업이라 할 수 없을 것입니다. 다만, 「사회복지사업법」에 따른 사회복지사업을 제2조제1호 각 목에 열거된 법률에 따라 실시되는 복지사업으로 한정할 경우, “한센병력자의 사회복귀에 관한 사업”과 같이 「사회복지사업법」 제2조제1호 각 목 외의 부분에는 나열되어 있지만, 같은 호 각 목에서는 이와 관련된 개별 법률을 규정하고 있지 않은 사업의 경우에는 「사회복지사업법」에 따른 사회복지사업으로 볼 수 없는 문제가 발생할 수 있습니다. 그러나 이는 현행 법률 중에서는 한센병력자의 사회복귀에 관하여 규정하고 있는 법률이 없어 그 근거 법률을 각 목에 규정하지 못함으로 인해 예외적으로 「사회복지사업법」 제2조제1호 각 목 외의 부분에 직접 해당 사업의 내용을 규정함으로써, 해당 사업을 이 법에 따른 사회복지사업으로 포함시킨 것으로 이해하여야 할 것입니다. 이상과 같은 점을 종합해 볼 때, 「사회복지사업법」에 따른 사회복지사업은 원칙적으로 같은 법 제2조제1호 각 목의 법률에 따른 복지사업과 이와 관련된 사업 등으로 한정된다고 할 것입니다."}]}, {"title": "붙임 2. 사회복지법인 설립허가신청서", "start": 86, "end": 87, "html": "<div class=\"pchip\" id=\"p86\"><span>원문 86쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=92\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">&lt;붙임 2：사회복지법인 설립허가신청서&gt;<\/div><div class=\"ln p\">■사회복지사업법 시행규칙〔별지 제7호 서식〕<\/div><table class=\"htbl\"><tr><td colspan=\"13\">사회복지법인 설립허가 신청서<\/td><\/tr><tr><td colspan=\"10\"><\/td><td colspan=\"3\">(앞쪽)<\/td><\/tr><tr><td colspan=\"3\">접수번호<\/td><td colspan=\"3\">접수일<\/td><td colspan=\"4\">허가일<\/td><td>처리기간<\/td><td colspan=\"2\">17일<\/td><\/tr><tr><td colspan=\"13\">`<\/td><\/tr><tr><td rowspan=\"2\">신청인<br>(대표자)<\/td><td colspan=\"8\">성명<\/td><td colspan=\"4 기인 전원이 참석하여 발기인대표 ○○○의 사회로 개회를 선언하다. ‑발기인대표법인설립취지와 목적사업을 설명하고 정관 안건 상정 ‑ ○○○\n※ 의제별로 구체적인 토의사항을 발표자 순서대로 기록정리함. ‑이상으로 가칭 “사회복지법인 ❍❍❍❍”의 설립 발기인총회를 모두 마치겠습니다. 위 결의를 명확히 하기 위하여 회의록을 작성하여 발기인 전원이 다음에 기명하고 인감날인 한다. 20○○년  ○○월  ○○일 가칭 사회복지법인  ❍❍❍❍❍❍ 발 기 인  ❍❍❍    인 발 기 인  ❍❍❍    인 발 기 인  ❍❍❍    인"}]}, {"title": "붙임 5. 설립 발기인명단", "start": 90, "end": 90, "html": "<div class=\"pchip\" id=\"p90\"><span>원문 90쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=96\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">&lt;붙임 5：설립 발기인명단&gt;<\/div><div class=\"ln p\">설립 발기인 명단(예시)<\/div><table class=\"htbl\"><tr><td>연번<\/td><td>직위<\/td><td>성명<\/td><td>생년월일<\/td><td>주소<\/td><td>약력<br>(간략히)<\/td><td>비고<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><table class=\"htbl\"><tr><td>연번<\/td><td>직위<\/td><td>성명<\/td><td>생년월일<\/td><td>주소<\/td><td>약력<br>(간략히)<\/td><td>비고<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><t 까지 구체적으로 기입한다. 제4조(목적사업의 종류) ① 이 법인은 제1조의 목적을 달성하기 위하여 다음의 사업을 수행한다. 1. 「국민기초생활보장법」 제○○조의 ○○사업 2. 「노인복지법」 제○○조의 노인의료복지지설 중 무료노인요양시설 운영 3. 「아동복지법」 제○○조의 아동양육시설 (비고) 1) 각종시설 운영사업은 관계 법령에서 정하는 시설명칭(유형)을 사용한다. 제2장 자산 및 회계 제1절 자  산 제5조(자산구분) ① 이 법인의 자산은 기본재산과 보통재산으로 구분하되, 기본재산은 목적사업용 기본재산과 수익용 기본재산으로 구분하여 관리한다. ② 기본재산은 다음 각 호의 재산으로 하며, 평가가액에 변동이 있을 때에는 지체 없이 정관 변경의 절차를 밟아야 한다. 1. 설립당시 기본재산으로 출연한 재산 2. 부동산 3. 이사회의 결의에 의하여 기본재산으로 편입된 재산 ③ 기본재산의 목록과 평가가액은 ‘별지 1’과 같다. ④ 기본재산 이외의 모든 재산은 보통재산으로 한다. (비고) 1) 설립당초의 기본재산은 반드시 별표의 기본재산 목록에 등재되어야 한다. 2)시설운영을 목적으로 하지 않고 일정한 출연재산에서 얻어지는 과실로서 보호대상자에 대한 단순한 지원 등 사회복지사업을 지원하는 것을 목적으로 하는 경우에는 기본재산을 목적사업용과 수익용으로 구분하지 아니한다. 3) 기본재산의 목록은 정관의 일부로서 간인 필요 4) 기본재산 재평가를 실시한 경우 정관에 반영 제6조(자산의 관리) ① 기본재산을 매도･증여･교환･임대･담보제공 또는 용도변경하거나 그 밖의 권리의 포기, 의무의 부담 등의 처분을 하고자 하는 때에는 이사회의 의결을 거쳐 주무관청의 사전허가를 얻어야 한다. ② 법인이 매수･기부채납･후원 등의 방법으로 재산을 취득한 때에는 지체 없이 이를 법인의 재산으로 편입조치 하여야 한다. ③ 제2항의 재산을 취득한 경우 법인은 그 취득사유, 취득재산의 종류･수량 및 가액을 매년 3월말까지 전년도의 재산취득상황을 주무관청에게 보고하여야 한다. ④ 법인이 보건복지부령이 정하는 금액이상을 장기차입 하고자 하는 때에는 주무관청의 허가를 받아야 한다. ⑤ 기본재산과 보통재산의 운영과 관리에 관하여는 법령과 이 정관에 따로 정한 경우를 제외하고는 별도의 규정이 정하는 바에 의한다. 제7조(경비와 유지방법) 이 법인의 운영비는 기본재산에서 발생하는 과실, 수익사업의 수익금, 기부금과 그 밖의 수입으로 충당한다. 제2절 회  계 제8조(회계의 구분 등) 이 법인의 회계는 법인에 속하는 법인회계와 시설운영에 속하는 시설회계, 수익사업에 속하는 수익사업회계로 구분한다. 제9조(회계의 처리) 이 법인의 회계처리는 「사회복지사업법」 및 관련 법령에서 따로 정한 경우를 제외하고는 별도의 규정이 정하는 바에 따른다. 제10조(회계연도) 이 법인의 회계연도는 정부의 회계연도에 따른다. 제11조(사업계획 및 예산) 이 법인의 매 회계연도의 사업계획 및 예산은 대표이사가 매 회계연도 개시 5일전 까지 이사회의 의결을 거쳐 확정한 후 「사회복지법인 및 사회복지시설 재무･회계규칙」(보건복지부령)이 정하는 서류를 첨부하여 주무관청에 제출하여야 한다. 제12조(사업실적 및 결산) 이 법인의 매 회계연도의 사업실적 및 결산은 회계연도가 끝난 후 1월 이내에 대표이사가 작성하여 감사의 감사를 거친 후 이사회의 의결을 거쳐 「사회복지법인 및 사회복지시설 재무･회계규칙」(보건복지부령)이 정하는 서류를 첨부하여 3월 31일까지 주무관청에 제출하여야 한다. 제13조(잉여금의 처리) 이 법인의 매회계년도 결산 잉여금은 차입금 상환 또는 다음 회계연도에 이월 사용하는 것을 원칙으로 하되, 이사회의 결의에 의하여 특정한 사업을 위한 기금으로 적립할 수 있다. 제14조(예산외의 채무부담) 수지예산으로서 정한 것 이외의 의무부담 또는 권리의 포기는 이사회의 의결을 거쳐야 한다. 제3장 임  원 제15조(임원의 종류와 정수) 이 법인은 다음의 임원을 둔다. 1. 대표이사 1인 2. 상임이사 1인 3. 이사 7인(대표이사 및 상임이사 포함) 4. 감사 2인 (비고) 1) 대표이사의 명칭은 회장 등의 명칭을 붙이는 것도 가능하다. 2)상임이사의 직이 필요한 때에는 상임이사를 두되, 필요가 없는 때에는 두지 아니하여도 된다. 3)이사의 정수는 7인 이상 감사는 2인 이상으로 하고, 업무의 심의에 적정한 수를 확정적으로 기재하되, 약간인 또는 7인 이상 10인 이하 등으로 표기하지 않아야 한다. 제16조(임원의 선임) ① 대표이사, 이사 및 감사는 이사회에서 선출한다. ②상임이사는 대표이사가 선임된 이사 중에서 지명하여 이사회의 의결을 거쳐 선임한다. ③이사정수의 1/3(소수점 이하는 버림) 이상은 시･도사회보장위원회 또는 지역사회보장협의체에서 추천을 받아 이사회의 의결을 거처 선임한다. ④이사를 임면하는 경우에는 보건복지부령이 정하는 바에 의하여 지체없이 이를 주무관청에 보고하여야 한다. (비고) 1) 대표이사는 선임된 이사 중에서 호선하여도 가능하다.2) 상임이사가 없는 때에는 제2항은 필요없다.3) 상임이사의 선임방법은 달리하여도 된다. 제17조(임원선임의 제한) ① 이 법인은 이사 상호간의 관계에 있어서 「사회복지사업법」 제18조제3항의 규정에 의한 “특별한 관계에 있는 자”가 이사현원의 5분의 1을 초과할 수 없다. ②감사는 감사 상호간 또는 이사와의 관계에 있어서 「사회복지사업법」 제18조제3항의 규정에 의한 “특별한 관계에 있는 자”가 아니어야 한다. 제18조(임원의 임기 등) ① 이 법인의 대표이사 및 이사의 임기는 3년으로 하고 감사의 임기는 2년으로 하되, 연임할 수 있다. ②임원중 결원이 생긴 때에는 2월 이내에 보충하여야 하며, 임기가 만료되는 임원의 후임자는 임기만료 1월 이전에 선임하여야 한다. (비고) 1) 임원의 법정임기를 초과하여 종신직으로 하는 것 등은 불가하다. 제19조(임원의 결격사유) ① 「사회복지사업법」 제19조 각호의 하나에 해당하는 자는 법인의 임원이 될 수 없다. ② 법인의 임원이 제1항의 사유에 해당할 때에는 그 직을 상실한다. 제20조(임원의 해임) ① 이 법인은 그의 임원에 대하여 「사회복지사업법」 제22조의 규정에 의한 시･도지사의 해임명령을 받은 때에는 지체없이 해임하여야 한다. ②이 법인은 그의 임원이 다음 각 호의 1에 해당할 때에는 이사회의 의결을 거쳐 해임할 수 있다. 1. 법령, 법인의 정관 또는 규정에 위반한 때 2. 고의 또는 중대한 과실로 법인에 상당한 손해를 끼친 때 3.직무태만･품위손상 기타 사유로 인하여 임원으로서 적당하지 아니하다고 인정되는 때 4. 기타 임원으로서의 능력이나 자질이 현저히 부족하다고 판단되는 때 제21조(임원의 직무) ① 대표이사는 이 법인을 대표하고, 제반 사무를 총괄하여 이사회의 의장이 된다. ② 이사는 이사회를 구성하고, 이사회의 권한에 속하는 사항을 심의･의결한다. ③대표이사 유고시에는 대표이사가 지명하는 이사가 대표이사의 직무를 대행한다. 다만, 대표이사가 직무대행자를 지명하지 못한 경우에는 나머지 이사 중에서 연장자 순으로 그 직무를 대행한다. ④ 감사는 다음의 직무를 행한다. 1. 이 법인의 재산상황과 회계를 감사하는 일 2. 이사회의 운영과 그 업무에 관한 사항을 감사하는 일 3.제1호 및 제2호의 감사결과 부정 또는 불비한 점이 있음을 발견하는 때에는 이를 이사회와 주무관청에 보고하는 일 4. 제3호의 보고를 하기 위하여 필요한 때에는 이사회의 소집을 요구하는 일 5.이사회의 회의록에 기명날인하는 일 6. 그 밖에 이사회 운영과 그 업무에 관한 사항에 대하여 이사회에 참석하여 의견을 진술하는 일 제22조(대표권의 제한) 이 법인의 대표이사이외의 이사는 이 법인을 대표하지 않는다. 제23조(임원의 대우) 이 법인의 상임이사를 제외한 임원은 명예직으로 하되, 예산의 범위 안에서 임원의 활동에 필요한 실비를 지급할 수 있다. 제24조(겸직금지) ① 이사는 이 법인의 시설장을 제외한 직원을 겸할 수 없다. ② 감사는 이 법인의 이사, 시설장 또는 직원을 겸할 수 없다. 제4장 이 사 회 제25조(이사회 구성) ① 이 법인에 대표이사 및 이사로 구성되는 이사회를 둔다. ② 감사는 이사회에 출석하여 발언할 수 있다. 제26조(의결사항) 이사회는 다음 사항을 심의･의결한다. 1. 정관의 변경에 관한사항 2. 제규정의 제정 및 개정에 관한 사항 3. 법인 합병 및 해산에 관한 사항 4. 임원임면에 관한 사항 5. 사업계획･실적 및 예산･결산에 관한 사항 6. 재산의 취득, 처분 및 관리에 관한 사항 7. 법인이 설치한 시설의 장의 임면에 관한 사항 8. 법인이 설치한 시설의 운영에 관한 사항 9. 수익사업에 관한 사항 10. 그밖에 법령이나 이 정관에 의하여 이사회의 권한에 속하는 사항 (비고) 1) 법인특성에 따라서 의결사항의 변동이 있을 수 있다.2) 지원법인의 경우에는 7, 8호는 해당되지 않는다. 제27조(이사회의 소집 등) ① 이사회는 정기이사회와 임시이사회로 구분한다. ②정기이사회는 매년 1월중에 개최하고, 임시이사회는 대표이사가 필요하다고 인정하는 때 또는 재적이사의 과반수가 회의의 목적을 제시하여 소집을 요구할 때와 감사가 소집을 요구할 때에 소집한다. ③이사회를 소집하고자 하는 때에는 대표이사가 회의목적을 명시하여 회의개최 7일 전까지 각 임원에게 서면 또는 전자적 방법으로 통지하여야 한다. ④대표이사는 재적이사 과반수가 회의안건을 명시하여 소집을 요구한 때와 감사가 소집을 요구한 때로부터 20일 이내에 이사회를 소집하여야 한다. 제28조(의결정족수 등) ① 이사회의 의사(議事)는 정관에 특별한 규정이 없으면 재적이사 과반수의 찬성으로 의결한다. ② 이사회의 의사는 대리인이나 서면결의에 의할 수 없다. (비고) 재적이사 과반수의 출석으로 개의하고, 출석이사 과반수의 찬성으로 의결하는 것도 가능하다. 제29조(의결제척사유) 대표이사 또는 이사가 다음 각 호의 1에 해당하는 때에는 그 의결에 참여하지 못한다. 1. 임원선임 및 해임에 있어서 자신에 관한 사항 2.금전 및 재산의 수수를 수반하는 사항으로서 임원자신이 법인과 직접 관계되는 사항 제30조(이사회 회의록) ① 이사회의 의사에 관하여는 회의록을 작성하여야 한다. ② 회의록에는 의사의 경과, 요령 및 결과를 기재하고, 참석임원 전원(의장 포함)과 감사가 날인하여야 한다. ③ 회의록은 회의일부터 10일 이내에 법인 홈페이지와 주무관청에서 지정하는 인터넷 홈페이지에 3개월간 공개하며, 법인 사무실에도 비치하여야 한다. (비고) 날인은 반드시 인감일 필요는 없으며, 기명란에 자필 서명 후 일반 날인 또는 기명란에 기명 후 날인 부분에 자필 서명도 가능(p.35 참고) 제5장 수익사업 제31조(수익사업의 종류) ① 이 법인은 「사회복지사업법」 제28조의 규정에 의하여 법인의 목적사업 수행에 지장이 없는 범위 안에서 각 사업마다 이사회의 의결 및 정관변경 인가를 거쳐 다음 각 호의 수익사업을 할 수 있다. 1. 부동산임대업 2. 간행물발행사업 ②제1항의 수익사업을 경영하기 위하여 대표이사는 이사회의 의결을 거쳐 관리자 또는 책임자를 임명한다. 제32조 (수익의 처분 및 관리) 수익사업에서 얻어지는 순수익은 법인 목적사업에 충당하거나, 이사회의 결의에 의거 특정한 기금으로 적립할 수 있다. 제6장 사무조직 및 운영 제33조(사무국) ① 이 법인의 업무를 처리하기 위하여 법인사무국을 둔다. ② 사무국의 조직과 운영에 관하여는 별도의 규정으로 정한다. 제34조(상근임직원) ① 법인사무국 및 시설에는 필요한 상근임직원을 둔다. ② 상근임직원의 임용･복무･보수 등에 관하여는 별도의 규정으로 정한다. ③ 제2항의 규정에는 종사자의 정년을 규정한 인사규정이 반드시 포함되어야 한다. ④ 제2항의 규정은 주무관청에 보고하여야 한다. 제7장 정관변경 및 해산 제35조(정관변경) 이 법인의 정관을 변경하고자 하는 때에는 재적이사 3분의 2이상의 의결을 거쳐 주무관청의 인가를 받아야 한다. 제36조(해산 및 합병) 이 법인을 해산하거나 다른 법인과 합병하고자 하는 때에는 재적이사 4분의 3 이상의 의결을 거쳐 주무관청의 허가를 받아야 한다. 제37조(잔여재산의 귀속) 이 법인이 해산하는 때의 청산 후 잔여재산은 주무관청의 허가를 받아 국가 또는 지방자치단체에 귀속한다. 제8장 공고방법 제38조(공고의 방법) ① 이 법인의 법령과 정관 및 이사회의 의결에 의하여 공고하여야 할 사항은 관할 지방자치단체 홈페이지 및 법인 홈페이지 등에 게시한다. ② 제1항의 공고기간은 7일 이상으로 한다. 제9장 보  칙 제39조(준용규정) 이 정관에 규정하지 아니한 사항에 대하여는 「사회복지사업법」, 「공익법인의 설립･운영에 관한 법률」 및 「민법」과 그 밖의 관계법규를 준용한다. 제40조(운영규정) 이 정관시행에 관하여 필요한 사항은 별도의 운영규정으로 정한다. 제41조(규정의 제･개정) ① 이 법인의 운영과 관련된 규정의 제･개정에 대하여는 이사회의 의결을 거쳐야 한다. ② 제1항의 내용 중 규정의 여부는 이사회에서 결정한다. 부    칙 ① (시행일) 이 정관은 주무관청의 인가를 받은 날부터 시행한다. ② (설립당시의 임원선임에 대한 경과조치) 이 법인 설립당시 발기인총회에서 선임된 임원은 이 정관에 의하여 선임된 것으로 본다. ③ (설립당시의 임원 등) 이 법인 설립당시의 임원 및 법인이 사용할 인장은 각각 ‘별지 2’ 및 ‘별지 3’과 같다. (비고) 부칙으로 정한 사항이 5개항 이상일 경에는 각각 조문으로 표기한다.<\/div>", "pages": [{"p": 91, "t": "<붙임 6：사회복지법인 정관>\n사회복지법인 정관(예시)\n제1장 총  칙 제1조(목적) 이 법인은  ･････법의 규정에 의한 ･････을 수행함으로써 ････････함을 목적으로 한다.(비고) 1) 당해 법인의 특성에 따라 목적을 개괄적으로 기재한다. 제2조(명칭) 이 법인의 명칭은 “사회복지법인” ○○○회･원･단(이하 “법인 회･원･단” 이라 한다) 이라 칭한다. (비고)사회복지법인의 명칭은 법인과 거래하는 제3자에게 혼란을 주지 않고, 향후 등기시 문제의 소지를 일으키지 않도록 다른 법인과 유사하거나 동일한 명칭을 사용하는 것을 지양하여야 함 ※ 동일명칭 확인방법 : 대법원 인터넷 등기소 → 등기열람/발급 → 법인 → 상호찾기 제3조(사무소 등의 소재지) ① 이 법인의 주된 사무소는 ○○시･도 ○○○시･군･구 ○○○로 ○○ (○○동, ○○○) 에 둔다.② 이 법인은 민법 제50조의 규정에 의하여 다음과 같은 분사무소(지부)를 둔다. 1. ○○○분사무소：○○시･도 ○○○시･군･구 ○○○로 ○○ (○○동, ○○○) 2.○○(사회복지시설)：○○시･도 ○○○시･군･구 ○○로 ○○ (○○동, ○○○) (비고) 1) 분사무소가 없는 경우에는 제2항은 필요하지 않다. ※ 사회복지시설도 법인의 목적사업을 직접 수행하는 곳이므로 특별한 사정이 없는한 분사무소로 기재함이 적절 2) 사무소의 소재지는 도로명 주소까지 구체적으로 기입한다. 제4조(목적사업의 종류) ① 이 법인은 제1조의 목적을 달성하기 위하여 다음의 사업을 수행한다. 1. 「국민기초생활보장법」 제○○조의 ○○사업 2. 「노인복지법」 제○○조의 노인의료복지지설 중 무료노인요양시설 운영 3. 「아동복지법」 제○○조의 아동양육시설 (비고) 1) 각종시설 운영사업은 관계 법령에서 정하는 시설명칭(유형)을 사용한다. 제2장 자산 및 회계 제1절 자  산 제5조(자산구분) ① 이 법인의 자산은 기본재산과 보통재산으로 구분하되, 기본재산은 목적사업용 기본재산과 수익용 기본재산으로 구분하여 관리한다. ② 기본재산은 다음 각 호의 재산으로 하며, 평가가액에 변동이 있을 때에는 지체 없이 정관 변경의 절차를 밟아야 한다. 1. 설립당시 기본재산으로 출연한 재산 2. 부동산 3. 이사회의 결의에 의하여 기본재산으로 편입된 재산 ③ 기본재산의 목록과 평가가액은 ‘별지 1’과 같다. ④ 기본재산 이외의 모든 재산은 보통재산으로 한다. (비고) 1) 설립당초의 기본재산은 반드시 별표의 기본재산 목록에 등재되어야 한다. 2)시설운영을 목적으로 하지 않고 일정한 출연재산에서 얻어지는 과실로서 보호대상자에 대한 단순한 지원 등 사회복지사업을 지원하는 것을 목적으로 하는 경우에는 기본재산을 목적사업용과 수익용으로 구분하지 아니한다. 3) 기본재산의 목록은 정관의 일부로서 간인 필요 4) 기본재산 재평가를 실시한 경우 정관에 반영 제6조(자산의 관리) ① 기본재산을 매도･증여･교환･임대･담보제공 또는 용도변경하거나 그 밖의 권리의 포기, 의무의 부담 등의 처분을 하고자 하는 때에는 이사회의 의결을 거쳐 주무관청의 사전허가를 얻어야 한다. ② 법인이 매수･기부채납･후원 등의 방법으로 재산을 취득한 때에는 지체 없이 이를 법인의 재산으로 편입조치 하여야 한다. ③ 제2항의 재산을 취득한 경우 법인은 그 취득사유, 취득재산의 종류･수량 및 가액을 매년 3월말까지 전년도의 재산취득상황을 주무관청에게 보고하여야 한다. ④ 법인이 보건복지부령이 정하는 금액이상을 장기차입 하고자 하는 때에는 주무관청의 허가를 받아야 한다. ⑤ 기본재산과 보통재산의 운영과 관리에 관하여는 법령과 이 정관에 따로 정한 경우를 제외하고는 별도의 규정이 정하는 바에 의한다. 제7조(경비와 유지방법) 이 법인의 운영비는 기본재산에서 발생하는 과실, 수익사업의 수익금, 기부금과 그 밖의 수입으로 충당한다. 제2절 회  계 제8조(회계의 구분 등) 이 법인의 회계는 법인에 속하는 법인회계와 시설운영에 속하는 시설회계, 수익사업에 속하는 수익사업회계로 구분한다. 제9조(회계의 처리) 이 법인의 회계처리는 「사회복지사업법」 및 관련 법령에서 따로 정한 경우를 제외하고는 별도의 규정이 정하는 바에 따른다. 제10조(회계연도) 이 법인의 회계연도는 정부의 회계연도에 따른다. 제11조(사업계획 및 예산) 이 법인의 매 회계연도의 사업계획 및 예산은 대표이사가 매 회계연도 개시 5일전 까지 이사회의 의결을 거쳐 확정한 후 「사회복지법인 및 사회복지시설 재무･회계규칙」(보건복지부령)이 정하는 서류를 첨부하여 주무관청에 제출하여야 한다. 제12조(사업실적 및 결산) 이 법인의 매 회계연도의 사업실적 및 결산은 회계연도가 끝난 후 1월 이내에 대표이사가 작성하여 감사의 감사를 거친 후 이사회의 의결을 거쳐 「사회복지법인 및 사회복지시설 재무･회계규칙」(보건복지부령)이 정하는 서류를 첨부하여 3월 31일까지 주무관청에 제출하여야 한다. 제13조(잉여금의 처리) 이 법인의 매회계년도 결산 잉여금은 차입금 상환 또는 다음 회계연도에 이월 사용하는 것을 원칙으로 하되, 이사회의 결의에 의하여 특정한 사업을 위한 기금으로 적립할 수 있다. 제14조(예산외의 채무부담) 수지예산으로서 정한 것 이외의 의무부담 또는 권리의 포기는 이사회의 의결을 거쳐야 한다. 제3장 임  원 제15조(임원의 종류와 정수) 이 법인은 다음의 임원을 둔다. 1. 대표이사 1인 2. 상임이사 1인 3. 이사 7인(대표이사 및 상임이사 포함) 4. 감사 2인 (비고) 1) 대표이사의 명칭은 회장 등의 명칭을 붙이는 것도 가능하다. 2)상임이사의 직이 필요한 때에는 상임이사를 두되, 필요가 없는 때에는 두지 아니하여도 된다. 3)이사의 정수는 7인 이상 감사는 2인 이상으로 하고, 업무의 심의에 적정한 수를 확정적으로 기재하되, 약간인 또는 7인 이상 10인 이하 등으로 표기하지 않아야 한다. 제16조(임원의 선임) ① 대표이사, 이사 및 감사는 이사회에서 선출한다. ②상임이사는 대표이사가 선임된 이사 중에서 지명하여 이사회의 의결을 거쳐 선임한다. ③이사정수의 1/3(소수점 이하는 버림) 이상은 시･도사회보장위원회 또는 지역사회보장협의체에서 추천을 받아 이사회의 의결을 거처 선임한다. ④이사를 임면하는 경우에는 보건복지부령이 정하는 바에 의하여 지체없이 이를 주무관청에 보고하여야 한다. (비고) 1) 대표이사는 선임된 이사 중에서 호선하여도 가능하다.2) 상임이사가 없는 때에는 제2항은 필요없다.3) 상임이사의 선임방법은 달리하여도 된다. 제17조(임원선임의 제한) ① 이 법인은 이사 상호간의 관계에 있어서 「사회복지사업법」 제18조제3항의 규정에 의한 “특별한 관계에 있는 자”가 이사현원의 5분의 1을 초과할 수 없다. ②감사는 감사 상호간 또는 이사와의 관계에 있어서 「사회복지사업법」 제18조제3항의 규정에 의한 “특별한 관계에 있는 자”가 아니어야 한다. 제18조(임원의 임기 등) ① 이 법인의 대표이사 및 이사의 임기는 3년으로 하고 감사의 임기는 2년으로 하되, 연임할 수 있다. ②임원중 결원이 생긴 때에는 2월 이내에 보충하여야 하며, 임기가 만료되는 임원의 후임자는 임기만료 1월 이전에 선임하여야 한다. (비고) 1) 임원의 법정임기를 초과하여 종신직으로 하는 것 등은 불가하다. 제19조(임원의 결격사유) ① 「사회복지사업법」 제19조 각호의 하나에 해당하는 자는 법인의 임원이 될 수 없다. ② 법인의 임원이 제1항의 사유에 해당할 때에는 그 직을 상실한다. 제20조(임원의 해임) ① 이 법인은 그의 임원에 대하여 「사회복지사업법」 제22조의 규정에 의한 시･도지사의 해임명령을 받은 때에는 지체없이 해임하여야 한다. ②이 법인은 그의 임원이 다음 각 호의 1에 해당할 때에는 이사회의 의결을 거쳐 해임할 수 있다. 1. 법령, 법인의 정관 또는 규정에 위반한 때 2. 고의 또는 중대한 과실로 법인에 상당한 손해를 끼친 때 3.직무태만･품위손상 기타 사유로 인하여 임원으로서 적당하지 아니하다고 인정되는 때 4. 기타 임원으로서의 능력이나 자질이 현저히 부족하다고 판단되는 때 제21조(임원의 직무) ① 대표이사는 이 법인을 대표하고, 제반 사무를 총괄하여 이사회의 의장이 된다. ② 이사는 이사회를 구성하고, 이사회의 권한에 속하는 사항을 심의･의결한다. ③대표이사 유고시에는 대표이사가 지명하는 이사가 대표이사의 직무를 대행한다. 다만, 대표이사가 직무대행자를 지명하지 못한 경우에는 나머지 이사 중에서 연장자 순으로 그 직무를 대행한다. ④ 감사는 다음의 직무를 행한다. 1. 이 법인의 재산상황과 회계를 감사하는 일 2. 이사회의 운영과 그 업무에 관한 사항을 감사하는 일 3.제1호 및 제2호의 감사결과 부정 또는 불비한 점이 있음을 발견하는 때에는 이를 이사회와 주무관청에 보고하는 일 4. 제3호의 보고를 하기 위하여 필요한 때에는 이사회의 소집을 요구하는 일 5.이사회의 회의록에 기명날인하는 일 6. 그 밖에 이사회 운영과 그 업무에 관한 사항에 대하여 이사회에 참석하여 의견을 진술하는 일 제22조(대표권의 제한) 이 법인의 대표이사이외의 이사는 이 법인을 대표하지 않는다. 제23조(임원의 대우) 이 법인의 상임이사를 제외한 임원은 명예직으로 하되, 예산의 범위 안에서 임원의 활동에 필요한 실비를 지급할 수 있다. 제24조(겸직금지) ① 이사는 이 법인의 시설장을 제외한 직원을 겸할 수 없다. ② 감사는 이 법인의 이사, 시설장 또는 직원을 겸할 수 없다. 제4장 이 사 회 제25조(이사회 구성) ① 이 법인에 대표이사 및 이사로 구성되는 이사회를 둔다. ② 감사는 이사회에 출석하여 발언할 수 있다. 제26조(의결사항) 이사회는 다음 사항을 심의･의결한다. 1. 정관의 변경에 관한사항 2. 제규정의 제정 및 개정에 관한 사항 3. 법인 합병 및 해산에 관한 사항 4. 임원임면에 관한 사항 5. 사업계획･실적 및 예산･결산에 관한 사항 6. 재산의 취득, 처분 및 관리에 관한 사항 7. 법인이 설치한 시설의 장의 임면에 관한 사항 8. 법인이 설치한 시설의 운영에 관한 사항 9. 수익사업에 관한 사항 10. 그밖에 법령이나 이 정관에 의하여 이사회의 권한에 속하는 사항 (비고) 1) 법인특성에 따라서 의결사항의 변동이 있을 수 있다.2) 지원법인의 경우에는 7, 8호는 해당되지 않는다. 제27조(이사회의 소집 등) ① 이사회는 정기이사회와 임시이사회로 구분한다. ②정기이사회는 매년 1월중에 개최하고, 임시이사회는 대표이사가 필요하다고 인정하는 때 또는 재적이사의 과반수가 회의의 목적을 제시하여 소집을 요구할 때와 감사가 소집을 요구할 때에 소집한다. ③이사회를 소집하고자 하는 때에는 대표이사가 회의목적을 명시하여 회의개최 7일 전까지 각 임원에게 서면 또는 전자적 방법으로 통지하여야 한다. ④대표이사는 재적이사 과반수가 회의안건을 명시하여 소집을 요구한 때와 감사가 소집을 요구한 때로부터 20일 이내에 이사회를 소집하여야 한다. 제28조(의결정족수 등) ① 이사회의 의사(議事)는 정관에 특별한 규정이 없으면 재적이사 과반수의 찬성으로 의결한다. ② 이사회의 의사는 대리인이나 서면결의에 의할 수 없다. (비고) 재적이사 과반수의 출석으로 개의하고, 출석이사 과반수의 찬성으로 의결하는 것도 가능하다. 제29조(의결제척사유) 대표이사 또는 이사가 다음 각 호의 1에 해당하는 때에는 그 의결에 참여하지 못한다. 1. 임원선임 및 해임에 있어서 자신에 관한 사항 2.금전 및 재산의 수수를 수반하는 사항으로서 임원자신이 법인과 직접 관계되는 사항 제30조(이사회 회의록) ① 이사회의 의사에 관하여는 회의록을 작성하여야 한다. ② 회의록에는 의사의 경과, 요령 및 결과를 기재하고, 참석임원 전원(의장 포함)과 감사가 날인하여야 한다. ③ 회의록은 회의일부터 10일 이내에 법인 홈페이지와 주무관청에서 지정하는 인터넷 홈페이지에 3개월간 공개하며, 법인 사무실에도 비치하여야 한다. (비고) 날인은 반드시 인감일 필요는 없으며, 기명란에 자필 서명 후 일반 날인 또는 기명란에 기명 후 날인 부분에 자필 서명도 가능(p.35 참고) 제5장 수익사업 제31조(수익사업의 종류) ① 이 법인은 「사회복지사업법」 제28조의 규정에 의하여 법인의 목적사업 수행에 지장이 없는 범위 안에서 각 사업마다 이사회의 의결 및 정관변경 인가를 거쳐 다음 각 호의 수익사업을 할 수 있다. 1. 부동산임대업 2. 간행물발행사업 ②제1항의 수익사업을 경영하기 위하여 대표이사는 이사회의 의결을 거쳐 관리자 또는 책임자를 임명한다. 제32조 (수익의 처분 및 관리) 수익사업에서 얻어지는 순수익은 법인 목적사업에 충당하거나, 이사회의 결의에 의거 특정한 기금으로 적립할 수 있다. 제6장 사무조직 및 운영 제33조(사무국) ① 이 법인의 업무를 처리하기 위하여 법인사무국을 둔다. ② 사무국의 조직과 운영에 관하여는 별도의 규정으로 정한다. 제34조(상근임직원) ① 법인사무국 및 시설에는 필요한 상근임직원을 둔다. ② 상근임직원의 임용･복무･보수 등에 관하여는 별도의 규정으로 정한다. ③ 제2항의 규정에는 종사자의 정년을 규정한 인사규정이 반드시 포함되어야 한다. ④ 제2항의 규정은 주무관청에 보고하여야 한다. 제7장 정관변경 및 해산 제35조(정관변경) 이 법인의 정관을 변경하고자 하는 때에는 재적이사 3분의 2이상의 의결을 거쳐 주무관청의 인가를 받아야 한다. 제36조(해산 및 합병) 이 법인을 해산하거나 다른 법인과 합병하고자 하는 때에는 재적이사 4분의 3 이상의 의결을 거쳐 주무관청의 허가를 받아야 한다. 제37조(잔여재산의 귀속) 이 법인이 해산하는 때의 청산 후 잔여재산은 주무관청의 허가를 받아 국가 또는 지방자치단체에 귀속한다. 제8장 공고방법 제38조(공고의 방법) ① 이 법인의 법령과 정관 및 이사회의 의결에 의하여 공고하여야 할 사항은 관할 지방자치단체 홈페이지 및 법인 홈페이지 등에 게시한다. ② 제1항의 공고기간은 7일 이상으로 한다. 제9장 보  칙 제39조(준용규정) 이 정관에 규정하지 아니한 사항에 대하여는 「사회복지사업법」, 「공익법인의 설립･운영에 관한 법률」 및 「민법」과 그 밖의 관계법규를 준용한다. 제40조(운영규정) 이 정관시행에 관하여 필요한 사항은 별도의 운영규정으로 정한다. 제41조(규정의 제･개정) ① 이 법인의 운영과 관련된 규정의 제･개정에 대하여는 이사회의 의결을 거쳐야 한다. ② 제1항의 내용 중 규정의 여부는 이사회에서 결정한다. 부    칙 ① (시행일) 이 정관은 주무관청의 인가를 받은 날부터 시행한다. ② (설립당시의 임원선임에 대한 경과조치) 이 법인 설립당시 발기인총회에서 선임된 임원은 이 정관에 의하여 선임된 것으로 본다. ③ (설립당시의 임원 등) 이 법인 설립당시의 임원 및 법인이 사용할 인장은 각각 ‘별지 2’ 및 ‘별지 3’과 같다. (비고) 부칙으로 정한 사항이 5개항 이상일 경에는 각각 조문으로 표기한다."}]}, {"title": "붙임 7. 기본재산목록", "start": 100, "end": 101, "html": "<div class=\"pchip\" id=\"p100\"><sp d><td colspan=\"4\"><\/td><\/tr><tr><td colspan=\"13\">년     월     일<\/td><\/tr><tr><td colspan=\"8\">보고인       사회복지법인 대표이사<\/td><td colspan=\"5\">(서명 또는 인)<\/td><\/tr><tr><td colspan=\"4\">시･도지사<\/td><td colspan=\"9\">귀하<\/td><\/tr><tr><td colspan=\"13\"><\/td><\/tr><tr><td>첨부서류<\/td><td colspan=\"11\">1. 해당 임원의 선임 또는 해임을 결의한 이사회의 회의록 사본 1부<br>2. 임원의 취임승낙서 및 이력서 각 1부<br>3. 「사회복지사업법」 제18조제2항 각 호의 어느 하나에 해당하는 기관으로부터 받은 이사추천서 1부<br>4. 임원 상호간의 관계에 있어 법 제18조제3항에 저촉되지 아니함을 입증하는 각서 1부<br>5. 「사회복지사업법」 제19조제1항 각 호의 어느 하나에 해당하지 않음을 입증하는 각서 1부<\/td><td>수수료<br>없음<\/td><\/tr><tr><td colspan=\"13\"><\/td><\/tr><tr><td colspan=\"13\">유의사항<\/td><\/tr><tr><td colspan=\"13\">※ 특별한 관계에 있는 사람의 범위<br>1. 특별한 관계에 있는 사람<br>가. 출연자<br>나. 출연자 또는 이사와의 관계가 다음 각 목의 어느 하나에 해당하는 사람<br>1) 6촌 이내의 혈족<br>2) 4촌 이내의 인척<br>3) 배우자(사실상 혼인관계에 있는 사람을 포함한다)<br>4) 친생자(親生子)로서 다른 사람에게 친양자(親養子) 입양된 사람 및 그 배우자와 직계비속<br>다.출연자 또는 이사의 사용인 그 밖에 고용관계에 있는 자(출연자 또는 이사가 출자에 의하여 사실상 지배하고 있는 법인의 사용인 그 밖에 고용관계에 있는 자를 포함한다)<br>라. 출연자 또는 이사의 금전 그 밖의 재산에 의하여 생계를 유지하는 자 및 그와 생계를 함께 하는 자<br>마. 출연자 또는 이사가 재산을 출연한 다른 법인의 이사<br>2. 제1호다목의 출자에 의하여 사실상 지배하고 있는 법인<br>가.법인의 발행주식총액 또는 출자총액의 100분의 30 이상을 출자자 1인과 그와 제1호나목･라목 및 사용인 그 밖에 고용관계에 있는 자(이하 이 호에서 \"지배주주\"라 한다)가 소유하고 있는 경우<br>나. 법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 가목의 법인과 그의 지배주주가 소유하고 있는 경우<br>다.법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 가목의 법인과 그의 지배주주 및 나목의 법인이 소유하고 있는 경우<br>※ 출연자 등과의 특별관계 여부임원이 특별한 관계에 있는 자의 범위에 해당하는 경우 그 관계를 기재합니다.<\/td><\/tr><tr><td colspan=\"13\">210㎜×297㎜[백상지 80g/㎡]<\/td><\/tr><\/table>", "pages": [{"p": 112, "t": "<붙임 16：사회복지법인 임원임면보고서>\n■사회복지사업법 시행규칙〔별지 제10호 서식〕\n | \n법인임원 임면보고서\n\n보고자 | 법인명 | 대표자 성명\n소재지 | 전화번호\n\n임원선임 또는 해임내용 | 직위 | 임기 | 성명 | 생년월일 | 주소 | 출연자 등과의 특별한 관계 여부\n |  |  |  |  | \n |  |  |  |  | \n |  |  |  |  | \n |  |  |  |  | \n |  |  |  |  | \n「사회복지사업법」 제18조 및 같은 법 시행규칙 제10조에 따라 사회복지법인 임원의 선임(해임)을 보고합니다.\n | \n년     월     일\n보고인       사회복지법인 대표이사 | (서명 또는 인)\n시･도지사 | 귀하\n\n첨부서류 | 1. 해당 임원의 선임 또는 해임을 결의한 이사회의 회의록 사본 1부 2. 임원의 취임승낙서 및 이력서 각 1부 3. 「사회복지사업법」 제18조제2항 각 호의 어느 하나에 해당하는 기관으로부터 받은 이사추천서 1부 4. 임원 상호간의 관계에 있어 법 제18조제3항에 저촉되지 아니함을 입증하는 각서 1부 5. 「사회복지사업법」 제19조제1항 각 호의 어느 하나에 해당하지 않음을 입증하는 각서 1부 | 수수료 없음\n\n유의사항\n※ 특별한 관계에 있는 사람의 범위 1. 특별한 관계에 있는 사람 가. 출연자 나. 출연자 또는 이사와의 관계가 다음 각 목의 어느 하나에 해당하는 사람 1) 6촌 이내의 혈족 2) 4촌 이내의 인척 3) 배우자(사실상 혼인관계에 있는 사람을 포함한다) 4) 친생자(親生子)로서 다른 사람에게 친양자(親養子) 입양된 사람 및 그 배우자와 직계비속 다.출연자 또는 이사의 사용인 그 밖에 고용관계에 있는 자(출연자 또는 이사가 출자에 의하여 사실상 지배하고 있는 법인의 사용인 그 밖에 고용관계에 있는 자를 포함한다) 라. 출연자 또는 이사의 금전 그 밖의 재산에 의하여 생계를 유지하는 자 및 그와 생계를 함께 하는 자 마. 출연자 또는 이사가 재산을 출연한 다른 법인의 이사 2. 제1호다목의 출자에 의하여 사실상 지배하고 있는 법인 가.법인의 발행주식총액 또는 출자총액의 100분의 30 이상을 출자자 1인과 그와 제1호나목･라목 및 사용인 그 밖에 고용관계에 있는 자(이하 이 호에서 \"지배주주\"라 한다)가 소유하고 있는 경우 나. 법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 가목의 법인과 그의 지배주주가 소유하고 있는 경우 다.법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 가목의 법인과 그의 지배주주 및 나목의 법인이 소유하고 있는 경우 ※ 출연자 등과의 특별관계 여부임원이 특별한 관계에 있는 자의 범위에 해당하는 경우 그 관계를 기재합니다.\n210㎜×297㎜[백상지 80g/㎡]"}]}, {"title": "붙임 17. 사회복지법인 정관변경인가 신청서", "start": 113, "end": 114, "html": "<div class=\"pchip\" id=\"p113\"><span>원문 113쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=119\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">&lt;붙임 17：사회복지법인 정관변경인가 신청서&gt;<\/div><div class=\"ln p\">■사회복지사업법 시행규칙〔별지 제9호 서식〕<\/div><table class=\"htbl\"><tr><td colspan=\"8\"><\/td><td colspan=\"5\"><\/td><\/tr><tr><td colspan=\"13\">사회복지법인 정관변경인가 신청서<\/td><\/tr><tr><td colspan=\"10\"><\/td><td colspan=\"3\">(앞쪽)<\/td><\/tr><tr><td colspan=\"3\">접수번호<\/td><td colspan=\"4\">접수일<\/td><td colspan=\"2\">인가일<\/td><td colspan=\"2\">처리기간<\/td><td colspan=\"2\">5일<\/td><\/tr><tr><td colspan=\"13\">`<\/td><\/tr><tr><td colspan=\"2\" rowspan=\"2\">신청인<br>(대표자)<\/td><td colspan=\"7\">법인명<\/td><td colspan=\"4\">대표자 성명<\/td><\/tr><tr><td colspan=\"7\">주소<\/td><td colspan=\"4\">전화번호<\/td><\/tr><tr><td colspan=\"13\"><\/td><\/tr><tr><td colspan=\"2\" rowspan=\"2\">변경내용<br>및 사유<\/td><td colspan=\"4\">변경전의 정관 조문<\/td><td colspan=\"3\">변경후의 정관 조문<\/td><td colspan=\"4\">변경사유<\/td><\/tr><tr><td colspan=\"4\"><\/td><td colspan=\"3\"><\/td><td colspan=\"4\"><\/td><\/tr><tr><td colspan=\"13\">「사회복지사업법」 제17조 및 같은 법 시행규칙 제8조에 따라 사회복지법인 정관변경인가를 신청합니다.<\/td><\/tr><tr><td colspan=\"13\">년     월     일<\/td><\/tr><tr><td colspan=\"5\">신청인<\/td><td colspan=\"8\">(서명 또는 인)<\/td><\/tr><tr><td colspan=\"4\">시･도지사<\/td><td colspan=\"9\">귀하<\/td><\/tr><tr><td colspan=\"13\"><\/td><\/tr><tr><td>신청인<br>제출서류<\/td><td colspan=\"11\">1. 정관의 변경을 결의한 이사회 회의록 사본 1부<br>2. 정관변경안 1부<br>3. 사업계획서 및 예산서 각 1부<br>4.재산의 소유를 증명할 수 있는 서류 각 1부(사업변동이 있는 경우에만 해당하며, 행정정보의 공동이용을 통하여 소유권에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음합니다)<br>5.재산의 평가조서 1부(감정평가업자의 감정평가서를 첨부하되, 개별공시지가 확인서로 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음합니다)<br>6.재산의 수익조서 1부(사업의 변동이 있는 경우에만 해당하며, 수익용 기본재산을 갖춘 경우에 한하며, 공인된 감정평가기관의 수익증명 또는 수익을 증명할 수 있는 기관의 증빙서류를 첨부하여야 합니다)<\/td><td rowspan=\"2\">수수료<br>없음<\/td><\/tr><tr><td>담당 공무원<br>확인사항<\/td><td colspan=\"11\">1. 건물 등기사항증명서<br>2. 토지 등기사항증명서<br>3. 개별공시지가 확인서<\/td><\/tr><tr><td colspan=\"13\">210㎜×297㎜[백상지 80g/㎡]<\/td><\/tr><\/table><table class=\"htbl\"><tr><td colspan=\"15\"><\/td><\/tr><tr><td colspan=\"15\">(뒤쪽)<\/td><\/tr><tr><td colspan=\"15\"><\/td><\/tr><tr><td colspan=\"15\">처리 절차<\/td><\/tr><tr><td colspan=\"12\"><\/td><td colspan=\"3\"><\/td><\/tr><tr><td colspan=\"15\">이 신청서는 아래와 같이 처리됩니다.<\/td><\/tr><tr><td colspan=\"4\" rowspan=\"2\">신청인<\/td><td colspan=\"5\">경유기관<\/td><td colspan=\"6\">처리기관<\/td><\/tr><tr><td colspan=\"5\">시･군･구(2일)<\/td><td colspan=\"6\">시･도(5일)<\/td><\/tr><tr><td colspan=\"4\"><\/td><td colspan=\"5\"><\/td><td colspan=\"6\"><\/td><\/tr><tr><td rowspan=\"2\"><\/td><td rowspan=\"2\">사회복지법인 정관변경인가 신청서 작성･제출<\/td><td colspan=\"2\"><\/td><td><\/td><td rowspan=\"2\">▶<\/td><td rowspan=\"2\">접수<\/td><td colspan=\"2\"><\/td><td><\/td><td rowspan=\"2\">▶<\/td><td colspan=\"3\" rowspan=\"2\">접수<\/td><td rowspan=\"2\"><\/td><\/tr><tr><td colspan=\"2\"><\/td><td><\/td><td colspan=\"2\"><\/td><td><\/t
