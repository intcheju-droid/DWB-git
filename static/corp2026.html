 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 7년이 지나지 아니한 사람<br>* 1의7과 관련하여 “그 직무”에 사회복지사업과 관련 없는 직무까지 포함되는 것은 아님(법제처 해석 19-0491)<br>1의8.제1호의5부터 제1호의7까지의 규정에도 불구하고 「성폭력범죄의 처벌 등에 관한 특례법」 제2조의 성폭력범죄* 또는 「아동･청소년의 성보호에 관한 법률」 제2조제2호의 아동･청소년대상 성범죄를 저지른 사람으로서 형 또는 치료감호를 선고받고 확정된 후 그 형 또는 치료감호의 전부 또는 일부의 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 유예･면제된 날부터 10년이 지나지 아니한 사람)<br>1의9.제1호의5부터 제1호의8까지의 규정에도 불구하고 「아동복지법」 제3조제7호의2에 따른 아동학대관련범죄를 저지른 사람으로서 다음 각 목의 어느 하나에 해당하는 사람<br>가.금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 10년이 지나지 아니한 사람<br>나.금고 이상의 형의 집행유예를 선고받고 그 집행유예가 확정된 날부터 10년이 지나지 아니한 사람<br>다.벌금형을 선고받고 그 형이 확정된 날부터 5년이 지나지 아니한 사람<br>2. 제22조에 따른 해임명령에 따라 해임된 날부터 5년이 지나지 아니한 사람<br>2의2.제26조에 따라 설립허가가 취소된 사회복지법인의 임원이었던 사람(그 허가의 취소사유 발생에 관하여 직접적인 또는 이에 상응하는 책임이 있는 자로서 대통령령*으로 정하는 사람으로 한정한다)으로서 그 설립허가가 취소된 날부터 5년이 지나지 아니한 사람(2018.10.25.시행)<br>2의3.제40조에 따라 시설의 장에서 해임된 사람으로서 해임된 날부터 5년이 지나지 아니한 사람(ʼ18.10.25.시행)<br>2의4. 제40조에 따라 폐쇄명령을 받고 3년이 지나지 아니한 사람(’18.10.25.시행)<br>3.사회복지분야의 6급 이상 공무원으로 재직하다 퇴직한 지 3년이 경과하지 아니한 사람 중에서 퇴직 전 5년 동안 소속하였던 기초자치단체가 관할하는 법인의 임원이 되고자 하는 사람<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p41\"><span>원문 41쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=47\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">4) 임원의 보충(법 제20조) 및 임시이사 선임･해임(법 제22조의3, 제22조의4, 규칙 제11조)<\/div><div class=\"ln p\">가) 임원의 보충 및 임시이사 선임<\/div><div class=\"ln p\">-임원 중 결원이 생긴 때에는 2월이내에 이를 보충하여야 하고(법 제20조), 다음의 경우에 해당하여 법인의 정상적인 운영이 어렵다고 판단되는 경우 시･도지사는 지체 없이 이해관계인의 청구 또는 직권으로 임시이사를 선임하여야 함(법 제22조의3제1항제1호 및 제2호, ’19.7.16. 시행)<\/div><div class=\"ln p\">①제20조에 따른 기간 내(임원 중에 결원이 발생한 후 2개월 이내)에 결원된 이사를 보충하지 아니하거나 보충할 수 없는 것이 명백한 경우(제1호)<\/div><div class=\"pchip\" id=\"p42\"><span>원문 42쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=48\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">②제22조제3항에 따른 기간 내(법인이 시･도지사로부터 임원 해임명령을 받고 2개월 이내)에 임원의 해임에 관한 사항을 의결하기 위한 이사회를 소집하지 아니하거나 소집할 수 없는 것이 명백한 경우(제2호)<\/div><div class=\"ln note\">※(참고) 개정 전 임시이사 선임 사유 : “법 제20조에 따른 기간 내에 결원된 이사를 보충하지 아니하여 법인의 정상적인 운영이 어렵다고 판단되는 경우”<\/div><div class=\"ln p\">- 임시이사는 상기 사유가 해소될 때까지 재임함<\/div><div class=\"ln p\">-시도지사는 임시이사가 선임되었음에도 불구하고 해당 법인이 정당한 사유 없이 이사회 소집을 기피할 경우 이사회 소집을 권고할 수 있음<\/div><div class=\"ln p\">-이해관계인이 임시이사 선임을 청구하고자 하는 때에는 청구사유와 이해관계인임을 증명하는 서류를 관할 시･도지사에게 제출하여야 함<\/div><div class=\"ln p\">-법 제22조의3제1항제2호에 따라 임시이사를 선임하는 경우 법 제22조의2제1항 단서에 따라 직무집행이 정지된 이사는 자신의 해임명령 이행을 위한 이사회와 관련해서는 이사로 보지 않으며, 이 경우 해당 임시이사가 직무집행이 정지된 이사의 지위를 대신함(법 제22조의3제5항 ’19.7.16. 시행)<\/div><div class=\"ln p\">나) 임시이사의 해임<\/div><div class=\"ln p\">-시･도지사는 다음 각 호의 어느 하나에 해당하는 경우 이해관계인의 청구 또는 직권으로 임시이사를 해임할 수 있음. 이 경우 제2호부터 제4호까지의 규정에 따라 임시이사를 해임하는 때에는 지체 없이 그 후임자를 선임하여야 함.<\/div><div class=\"ln p\">① 임시이사 선임사유가 해소된 경우<\/div><div class=\"ln p\">②임시이사가 제19조제1항제1호 및 제1호의2부터 제1호의8까지의 어느 하나에 해당하는 경우<\/div><div class=\"ln p\">③ 임시이사가 직무를 태만히 하여 법인의 정상화가 어려운 경우<\/div><div class=\"ln p\">④임시이사가 제22조제1항 각 호의 어느 하나에 해당하는 경우<\/div><div class=\"ln p\">- 법인은 상기 사유로 해임된 임시이사를 이사로 선임할 수 없음<\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>임시이사 선임 요청이 가능한 “이해관계인”의 범위<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">&lt;대법원 2007.5.10. 선고, 2006다85747. 판결 / 대법원 1976.12.10. 자, 76마394 결정&gt;<br>임시이사를 신청할 수 있는 이해관계인에는, 임시이사가 선임되는 것에 관하여 법률상의 이해관계가 있는 자로서 그 법인의 이사, 사원, 채권자 등이 이에 속하고, 위 법인의 이사에는 법인의 정당한 최후의 이사였다가 퇴임한 자이거나 비록 그 선임결의의 효력이 다투어지더라도 신청 당시에 법인의 등기부상 이사로서 법인의 업무처리를 담당해 온 자 등은 포함한다.<\/td><\/tr><\/table><div class=\"pchip\" id=\"p43\"><span>원문 43쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=49\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">5) 임원의 겸직금지(법 제21조)<\/div><div class=\"ln p\">이사는 법인이 설치한 사회복지시설의 장을 제외한 해당 시설의 직원을 겸할 수 없음<\/div><div class=\"ln p\">감사는 법인의 이사, 법인이 설치한 사회복지시설의 장 또는 그 직원을 겸할 수 없음<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>지방의회 의원 겸직금지<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">지자체의 보조금을 교부받는 사회복지법인은 공공단체이므로 「지방자치법」 제43조제5항에 따라 지방의회 의원은 사회복지법인의 관리인인 임원이 될 수 없음(행정안전부 선거의회과-2163(2018.7.4.)<\/td><\/tr><\/table><div class=\"ln h4\">6) 임원의 해임명령(법 제22조, 영 제10조의3)<\/div><div class=\"ln p\">시･도지사는 아래의 경우 법인에 대하여 그 임원의 해임을 명할 수 있음<\/div><div class=\"ln p\">① 시･도지사의 명령을 정당한 이유없이 이행하지 아니한 때<\/div><div class=\"ln p\">② 회계부정이나 현저한 불법행위 기타 부당행위 등이 발견되었을 때<\/div><div class=\"ln p\">③법인의 업무에 관하여 시･도지사에게 보고할 사항에 대해 고의로 보고를 지연하거나 허위보고를 한때<\/div><div class=\"ln p\">④외부추천이사 선임과 관련된 사항을 위반하거나, 특별한 관계에 있는 사람을 규정을 초과하여 선임하거나, 감사의 선임과 관련된 사항을 위반하여 선임된 사람<\/div><div class=\"ln p\">⑤ 임원의 겸직근무 의무를 위반한 사람<\/div><div class=\"ln p\">⑥ 직무집행 정지명령을 이행하지 아니한 사람<\/div><div class=\"ln p\">⑦기타 「사회복지사업법」 또는 「사회복지사업법」에 의한 명령을 위반하였을 때<\/div><div class=\"ln note\">※조사 및 감사결과 사회복지법인의 비리가 밝혀져 정상적인 업무수행이 곤란하다고 판단할 경우 법인감사 부실을 이유로 감사사임을 요구하고, 즉시 감사추천(공익법인법 시행령 제13조제4항 준용)<\/div><div class=\"ln p\">해임명령은 시･도지사가 해당 법인에게 그 사유를 들어 시정을 요구한 날부터 15일이 경과하여도 이에 응하지 아니한 경우에 한함.<\/div><div class=\"ln p\">-다만, 다음의 어느 하나에 해당하는 경우는 시정요구 없이 임원의 해임을 명할 수 있음<\/div><div class=\"ln p\">1. 시정을 요구하여도 기한 내에 시정할 수 없는 것이 물리적으로 명백한 경우<\/div><div class=\"ln p\">2.임원이 해당 사회복지법인 또는 사회복지법인이 운영하는 사회복지시설의 재산･보조금에 대하여 회계부정, 횡령 또는 절취를 하거나 그 업무와 관련하여 뇌물수수 또는 배임(背任)행위를 한 경우<\/div><div class=\"pchip\" id=\"p44\"><span>원문 44쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=50\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">해임명령을 받은 법인은 2개월 이내에 임원의 해임에 관한 사항을 의결하기 위한 이사회를 소집하여야 함(법 제22조제3항, ’19.7.16. 시행)<\/div><div class=\"ln p\">「사회복지사업법」 제22조에 따른 해임명령 통보 대상<\/div><div class=\"ln p\">-임원의 해임은 「사회복지사업법」 제32조에 따라 준용되는 「공익법인의 설립･운영에 관한 법률」 제7조제1항제4호에 따라 해당 사회복지법인의 이사회 권한에 속하는 사안임<\/div><div class=\"ln p\">-따라서 임원에 대한 해임명령을 해당 명령을 이행할 수 있는 사회복지법인을 대상으로 통보하여야 함<\/div><div class=\"ln p\">-해임명령대상인 임원에 대해서는 해당 사회복지법인에 대해 본인을 해임토록 명령을 하였다는 사실을 통보하는 것은 가능<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>법인의 임원과 관련한 질의･응답 사례<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">Q：A법인의 이사로 등기되어 있는 甲이 B법인의 이사를 겸임할 수 있는지 여부<br>A：甲이 A. B법인에서 모두 상근이사(정기적으로 보수를 받는 이사)가 아니고, B법인의 출연자 및 임원상호간에 있어 특별한 관계에 있는 자에 해당되지 않을 경우 겸임도 가능하다고 사료<br>Q：A법인의 이사로 등기되어 있는 甲이  A법인 및 A법인이 설치한 시설과 전혀 관계없는 B법인의 직원 및 C시설의 장 또는 종사자로 근무가 가능한지 여부<br>A：甲이 A법인에서 상근이사가 아니고 B법인의 직원 및 C시설의 장 또는 종사자로 근무하는데 결격사유가 없는 경우 근무가 가능하다고 사료<br>Q：A법인의 감사로 등기되어 있는 甲이 A법인 및 A법인이 설치한 시설과 전혀 관계없는 B법인의 직원 및 C시설의 장 또는 종사자로 근무가 가능한지 여부<br>A：B법인 및 C시설이 甲이 감사로 등기되어 있는 A법인의 이사들과 관계가 없고 甲이 B법인의 직원 및 C시설의 장으로 근무하는데 결격사유가 없다면 가능<br>Q：출연자가 이사장인 A법인의 이사 甲이 A법인에서 설치한 시설의 시설장을 겸직하는 경우 출연자와 甲은 고용관계로 특수관계자로 봐야 하는지 여부<br>A：甲은 A법인에 의하여 시설장에 선임된 사람일 뿐 출연자와 고용관계로 볼 수 없으며, A법인의 이사의 지위도 함께 갖고 있으므로 동일법인 내에서는 특수관계자로 볼 수 없음<br>Q：특수관계자가 없는 A법인 이사회에 이사 甲의 부인이 신임이사로 취임할 때 A법인 이사회 특수관계자의 수<br>A：특수관계에 관한 규정으로 2명이 됨(이사의 현원이 7명인 경우, 특수관계인의 수는 1/5인 1명이므로, 이를 초과하는 이사 甲의 부인은 취임불가)<br>Q：임시이사로 선임받은 자가 임시이사 선임사유가 해소되어 해임받은 경우라면 사회복지사업법 제19조(임원의 결격사유) 제1항제2호을 적용해야 하는지 여부<br>A：법 제19조제1항제2호의 사유는 법 제22조에 따른 해임명령에 한정되므로, 임시이사 선임사유 해소에 따른 해임의 경우에는 법 제19조제1항제2호의 적용을 받지 않음<\/td><\/tr><\/table><div class=\"pchip\" id=\"p45\"><span>원문 45쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=51\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">7) 임원의 직무집행정지(법 제22조의2)<\/div><div class=\"ln p\">시･도지사는 법 제22조에 따른 해임명령을 하기 위하여 같은 조 제1항 각 호의 사실여부에 대한 조사나 감사가 진행 중인 경우 및 해임명령 기간 중인 경우 해당 임원의 직무집행을 정지시킬 수 있음<\/div><div class=\"ln p\">-다만, 법 제18조제2항･제3항 또는 제7항을 위반하여 선임된 사람에 해당하여 해임명령을 받은 경우에는 해당 임원의 직무집행을 정지시켜야 함(법 제22조의2제1항단서, ’19.7.16. 시행)<\/div><div class=\"ln p\">「사회복지사업법」 제22조의2에 따른 직무집행 정지명령 통보 대상<\/div><div class=\"ln p\">-시･도지사가 직권으로 임원의 직무집행을 정지시키는 것이므로, 해당 임원에 대해서 직무집행을 정지하라는 명령을 내려야 함<\/div><div class=\"ln p\">-직무집행이 정지된 임원은 관련 사무처리가 불가능하고, 이사회 참석 등도 불가능 하므로, 해당 사회복지법인에 대해서 특정 임원의 직무집행이 정지되었다는 사실을 반드시 통보하여야 할 것임<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>상근임직원 관리 유의사항<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">상근임직원의 정원(공익법인법 제5조제9항 및 공익법인법 시행령 제14조)과 보수에 관한 사항은 별도 규정을 제정할 수 있는 근거를 정관에 명시하고 그 규정은 주무관청에 보고하여야 함<br>※ 주무관청은 세입세출예산계획 등을 통해 상근임직원의 정원과 보수수준을 확인함<\/td><\/tr><\/table><div class=\"ln p\">사회복지법인의 관리<\/div><div class=\"ln p\">1. 법인의 등기 관리<\/div><div class=\"ln p\">2. 정관변경의 인가<\/div><div class=\"ln p\">3. 기본재산 처분허가 등<\/div><div class=\"ln p\">4. 법인의 소멸(합병포함)<\/div><div class=\"ln p\">5. 법인의 관리･감독<\/div><div class=\"ln p\">제Ⅲ장<\/div>", "pages": [{"p": 25, "t": "3\n사회복지법인의 기관\n사회복지법인은 임원으로서 이사(理事)와 감사(監事)를 두고, 법인의 의사결정기관인 이사회(理事會)를 반드시 두어야 함\n가\n이사회(理事會)\n1) 이사회의 구성(법 제18조, 영 제8조의2 및 제9조, 공익법인법 제6조)\n이사회는 이사로써 구성되며(감사는 제외) 이사장은 정관이 정하는 바에 따라 이사 중에서 호선(공익법인법 제6조)\n이사는 7인 이상 두어야 하며(외국인 이사는 이사 현원의 1/2 미만이어야 함) 이사회의 구성에 있어 시행령 제9조에 의한 “특별한 관계에 있는 자”는 이사 현원의 1/5를 초과할 수 없음\n※ 이사 정수는 법인의 정관에서 그 인원수를 확정하여 기재하도록 할 것(외부추천이사 비율 등의 판단 기준이 됨)예) 잘못된 예 7~15명, 잘된 예 7명\n참고 | 특별한 관계에 있는 자의 범위(「사회복지사업법 시행령」 제9조)\n |  | \n |  | 1. 출연자 2. 출연자 또는 이사와의 관계가 다음 각목의 어느 하나에 해당하는 사람 가. 6촌 이내의 혈족 나. 4촌 이내의 인척 다. 배우자(사실상 혼인관계에 있는 사람을 포함한다) 라.친생자(親生子)로서 다른 사람에게 친양자(親養子)로 입양된 사람 및 그 배우자와 직계비속 3.출연자 또는 이사의 사용인 그 밖에 고용관계에 있는 자(출연자 또는 이사가 ʻʻ출자에 의하여 사실상 지배하고 있는 법인ʼʼ의 사용인 그 밖에 고용관계에 있는 자를 포함) 4.출연자 또는 이사의 금전 그 밖의 재산에 의하여 생계를 유지하는 자 및 그와 생계를 함께 하는 자 5. 출연자 또는 이사가 재산을 출연한 다른 법인의 이사 ▶3의 ʻʻ출자에 의하여 사실상 지배하고 있는 법인ʼʼ의 의미 가.법인의 발행주식 총액 또는 출자총액의 100분의 30 이상을 출자자 1인과 그와 상기 ʻʻ2ʼʼ, ʻʻ4ʼʼ 및 사용인 그 밖에 고용관계에 있는 자(이하 ʻʻ지배주주ʼʼ)가 소유하고 있는 경우 나.법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 ʻʻ가ʼʼ의 법인과 그의 지배주주가 소유하고 있는 경우 다.법인의 발행주식총액 또는 출자총액의 100분의 50 이상을 ʻʻ가ʼʼ의 법인과 그의 지배주주 및 ʻʻ나ʼʼ의 법인이 소유하고 있는 경우"}, {"p": 26, "t": "이사 정수의 1/3(소수점 이하는 버림) 이상을 ‘시･도 사회보장위원회 또는 지역사회보장협의체’(근거법령 : 「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」)에서 3배수 추천한 사람 중에서 선임\n※ 설립허가 후 법인등기 이전까지 외부추천이사의 선임을 완료해야 함\n※각 지자체의 사회복지법인 관리 담당자는 사회복지법인 이사가 교체될 때 외부추천이사제의 적용 여부를 반드시 확인할 것\n2) 외부추천이사의 구성\n추천기관의 후보군 구성(법 제18조제8항, ’18.4.25.시행)\n- 추천기관인 시･도사회보장위원회 또는 지역사회보장협의체는 이사를 추천하기 위하여 매년 다음 중 어느 하나에 해당하는 사람으로 이사 후보군을 구성하여 공고하여야 함\n |  | \n | ① 사회복지 또는 보건의료에 관한 학식과 경험이 풍부한 사람 ② 사회복지를 필요로 하는 사람의 이익 등을 대표하는 사람 ③ 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체에서 추천한 사람 ④ 「사회복지공동모금회법」 제14조에 따른 사회복지공동모금지회에서 추천한 사람 | \n |  | \n※사회복지법인의 대표자, 사회복지사업을 하는 비영리법인 또는 단체의 대표자, 「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」 제41조에 따른 지역사회보장협의체의 대표자는 후보군에서 제외(최종추천자에도 포함될 수 없음) (근거：기존 「사회복지사업법」 제18조제2항, 개정 「사회복지사업법」 제18조제8항(’18.4.25.시행))\n추천기관의 후보군 공고(법 제18조제8항, ’18.4.25.시행)\n- 사회복지법인을 관리･감독하는 시･도 및 시･군･구에서는 사회복지법인 법령을 벗어나지 않는 범위 내에서 외부추천이사 후보군 공고방법에 대한 자체적인 세부 지침을 정할 것"}, {"p": 27, "t": "참고 | 추천기관의 업무처리지침 마련 시 고려사항\n |  | \n |  | 사회복지법인을 관리･감독하는 시･도 및 시･군･구에서는 사회복지법인 외부추천이사제가 원활하게 운영될 수 있도록 법령을 벗어나지 않는 범위 내에서 자체적인 세부 지침(후보군 구성 및 공고방법, 법인의 추천 요청 기준, 요청 방법, 추천기관의 추천업무 처리 지침, 추천 방법 등)을 정할 것 세부 지침을 정할 경우 관할 법인 및 시･도사회보장위원회 또는 지역사회보장협의체 등과 협의하되, 추천기관의 업무처리지침은 다음 사항 등을 참고 후보군 구성 및 공고：추천기관은 공개모집이나 타 기관 추천 등을 통해 후보군을 작성･관리･업데이트 하고, 특히, 후보군은 분야별(예：아동복지분야, 노인복지분야, 장애인복지분야, 시설운영분야, 지원사업분야, 기타분야 등)로 구분하여 매년 공고 ※ 외부추천이사는 관할 시･도뿐만 아니라 다른 시･도 거주자도 가능하며, 타 법인의 일반이사 또는 외부추천이사도 추천될 수 있음(특수관계자 제외) 이사 추천 수요 예비조사：추천기관은 반기별 또는 분기별로 해당 지역에 있는 법인을 대상으로 추천 수요를 사전에 조사(법인명, 법인 사업의 종류･내용, 추천필요 인원, 추천요청 예상 시기 등) 정식 추천：수요조사 이후 법인이 공식적으로 추천 요청을 해올 경우, 후보군에서 적절한 사람을 선정하여 추천･통보 ※지역사회보장협의체의 경우 대표협의체를 통한 이사추천후보자명단이 확정되었을 경우, 업무의 효율성을 고려하여 실무협의체가 중심이 되어 추천 가능(법인 이사추천위원회 등) 수요조사 이외에 추천 요청하는 경우(예측치 못한 선임사유 발생의 경우 또는 수요조사에 비해 추천 인원이 증가하는 경우 등)：추천 요청을 받은 후 가장 가까운 정기회의를 통해 추천자 결정･통보. 또는 정기회의가 요청 후 30일 이내에 없는 경우에는 서면 회의를 통해 추천을 진행하는 방안 검토 ※ 실질적인 추천방법 및 절차는 위의 내용을 참고하여 지자체 여건에 맞게 업무처리지침으로 정함\n법인의 추천 요청\n-법인은 추천 이사 선임 사유가 발생한 날부터 15일 이내에 법인의 주사무소가 소재하는 지역의 시･도사회보장위원회 또는 지역사회보장협의체 중 한 기관에 이사 추천을 요청하는 것이 원칙으로 함\n※선임 사유란 전임 이사의 임기 만료, 전임 이사의 사임, 전임 이사의 해임, 이사 증원에 따른 신규 선임 등 법인이 외부추천이사를 선임해야 하는 모든 경우를 의미\n※다만, 선임 사유가 사전에 예측할 수 있는 경우(전임 이사의 임기 만료)에는 원활한 추천을 위해 임기 만료 3개월 전부터 추천을 요청할 수 있도록 함(영 제8조의2제1항 단서)"}, {"p": 28, "t": "-어느 기관에 추천을 요청할 것인지는 법인이 자체적으로 결정할 사항이나, 법인을 지도･감독하는 지자체에서는 행정업무 분담 차원에서 일정한 기준*을 정할 수 있음\n*예시：법인의 주사무소에 소재하는 지역사회보장협의체에 우선 요청하는 것을 원칙으로 함\n- 법인이 이사 추천을 요청할 때는 서면(공문)으로 하되 공문에는 법인명, 주요 사업, 선임 대상 이사 수 등을 반드시 명기하고 법인의 설립 취지, 목적 사업의 내용, 이사가 갖추어야 할 사항 등 추천에 참고할 수 있는 자료를 첨부하도록 함(영 제8조의2 제1항)\n※이사가 갖추어야 할 사항으로는 사회복지사업 관련 경력자, 아동복지분야 전문가, 노인복지분야 전문가 등 법인 측에서 이사의 자질로 요구하는 사항을 상세히 설명\n※추천 요청에 관한 별도의 서식은 없으며, 추천기관에서 업무처리 편의에 따라 별도의 양식을 정할 수 있음. 별도로 정하는 양식이 없는 경우 아래 예시 참조\n-법인이 추천을 요청하는 단계에서 이사회 의결을 거쳐 요청할 것인지는 법인의 정관에서 자율적으로 정하도록 함\n※ 다만, 추천받은 사람 중 이사를 선임할 때는 반드시 이사회 의결을 거쳐야 함\n추천 이사의 선임\n- 법인은 그 배수로 추천받은 자 중에서 법인의 이사로 선임\n- 추천받은 이사가 「사회복지사업법」 제19조의 결격사유에 해당하거나, 취임 승낙을 하지 않는 경우 등 선임이 불가능한 경우에 한하여 추천 재요청을 허용하되, 이 경우에는 추천기관과 협의\n※ 재요청 절차는 법령상 추천 요청 절차에 준하여 하도록 함\n※ 추천기관은 재추천 요청에 대비하여 후순위자를 내정해 둘 수 있음\n참고 | 외부추천이사를 선임하지 않거나 교체하지 않는 경우 조치 방향(예시)\n |  | \n |  | 현원이 5명인 법인이 외부추천이사를 선임하지 않은 경우 -법인 이사회 정수(7명) 부족으로 이사회 개최 불가(제18조제1항), 의결사항 불승인, 임시이사선임(제22조의3제1항) 기존이사 임기만료시 외부추천이사로 교체하지 않은 경우 - 시정요구(제22조제2항), 기존이사 해임명령(제22조제1항제4호), 직무집행정지(제22조의2제1항)\n- 관련 분야의 전문가가 아니라는 사유 등 법인이 원하지 않은 후보라는 사유로 재추천을 요청할 수 없으며, 추천기관도 이를 허용해서는 안됨\n※특히 노골적으로 후보자의 취임 미승낙을 유도하기 위해 과도한 선임절차 등을 두는 경우, 이는 사실상의 선임거부행위로 「사회복지사업법」 제18조제2항 위반으로 간주"}, {"p": 29, "t": "- 추천 이사 선임 절차는 다른 이사 선임 절차와 동일(취임승낙서, 이력서, 특수관계부존재각서 등을 받고 이사회 의결을 통해 선임)\n-법 제20조에 따라 결원 이사는 2개월 이내에 보충하여야 하므로, 기간 내 추천 이사를 선임할 수 있도록 조치\n-추천 이사를 선임한 후에는 시･도지사에 법인 임원 임면보고를 해야 하고, 보고 시에는 다음의 서류를 반드시 첨부(규칙 제10조)\n① 선임을 결의한 이사회 회의록 사본, ② 임원의 취임승낙서, ③ 이력서,④ 추천기관으로부터 받은 추천서 ⑤ 특수관계부존재각서, ⑥ 결격사유 부존재 각서(’19.6.12.시행)\n추천 이사의 임기만료\n-임기가 만료된 외부추천이사가 해당 법인의 선임이사로 추천절차 없이 연임하는 경우에는 더 이상 외부추천이사가 아니므로 새로운 외부추천이사를 선임하여야 함\n-임기가 만료된 외부추천이사가 외부추천이사로 연임하기 위해서는 반드시 최초 선임 시와 동일한 추천절차를 거쳐야 함\n※ 추천절차 없이 외부추천이사를 연임시키는 경우, 「사회복지사업법」 제18조제2항 위반"}, {"p": 30, "t": "<추천 요청 공문 양식(예시)> ※ 다음 양식은 법령 사항이 아니며, 지자체별･법인별 특성에 맞게 변경하여 사용 가능 수신자 ○○○ 지역사회보장협의체 (또는 △△△ 사회보장위원회) 제목：사회복지법인 ○○○ 이사 추천 요청 ------------------------------------------------------------------- 「사회복지사업법」 제18조제2항 및 동법 시행령 제8조의2 등에 따라 다음과 같이 이사의 추천을 요청하오니, 적임자를 추천하여 주시기 바랍니다. 1. 법 인 명：사회복지법인 ○○○ 2. 주요사업：아동복지시설(○○○, △△, □□□) 운영 등 3. 선임하여야 하는 이사 수：2명 (3배수이므로 6명 추천 요청) ※ 정관상 정수： 4. 기타：○○○ 붙임：법인의 설립취지 설명서 1부법인의 목적사업 설명서 1부추천 요청 이사의 자격요건 설명서 1부.  끝. 사회복지법인 ○○○             (법인직인) 사회복지법인 ○○○ 대표이사 (직인) ------------------------------------------------------------------- 담당자：                              결재자 : 연락처："}, {"p": 31, "t": "3) 이사회의 기능(공익법인법 제7조)\n법인의 예산, 결산, 차입금 및 재산의 취득･처분과 관리에 관한 사항\n정관의 변경에 관한 사항\n법인의 합병･해산에 관한 사항\n임원의 임면에 관한 사항\n수익사업에 관한 사항\n기타 법령이나 정관에 의하여 그 권한에 속하는 사항\n4) 이사회의 소집(공익법인법 제8조)\n이사회의 소집권자\n-원칙：이사회는 이사장이 소집하고 그 의장이 됨\n-예외：이사장이 궐위되거나 이를 기피함으로써 7일 이상 이사회의 소집이 불가능한 때에는 재적이사 과반수의 찬동으로 시･도지사의 승인을 받아 이를 소집할 수 있음\n➝ 궐위 또는 기피시에는 정관이 정하는 이사가 이사회를 주재\n※시･도지사의 승인을 얻고자 할 때에는 승인신청서에 ① 이사회의 소집이 불가능한 사유와 이를 증명하는 서류, ② 재적이사 과반수의 찬동을 증명하는 서류, ③ 이사회를 소집하지 못함으로 인해 예상되는 손해의 구체적인 사실을 증명하는 서류를 첨부하여 시･도지사에 제출\n※이사회 소집에 대한 시･도지사의 승인은 이사장의 궐위나 기피가 명백하고 법인운영에 긴급한 이사회 의결이 필요한 안건이 있는 경우에 한함\n이사회 소집이 가능한 경우\n① 이사장이 필요하다고 인정한 때(직권소집)\n② 재적이사 과반수 이상이 회의의 목적을 제시하여 소집을 요구할 때\n③법인의 감사가 법인의 업무와 재산상황을 감사한 결과, 불법 또는 부당한 점이 있음을 발견하여 이를 이사회에 보고하기 위해 이사회의 소집을 요구할 때\n➝ ②, ③의 경우 소집요구일로부터 20일 이내에 이사회를 소집\n※이사회를 소집할 때에는 적어도 회의 7일전에 회의의 목적을 명시하여 각 이사 및 감사에게 통지하여야 함. 다만, 이사 전원이 집회하고 또 그 전원이 이사회의 소집을 요구할 때에는 그러하지 아니함"}, {"p": 32, "t": "궐위, 사임, 해임 등으로 인해 이사의 정원이 7명 미만일 경우에는 법 제18조제1항을 위반하는 이사회가 되므로 이사회 개최나 의결의 효력이 없음\n-임시이사를 통해 정관 상 정수를 충족시킨 후 개최\n* 사임, 해임, 임기만료된 이사는 이사로서의 자격이 없음. 이러한 경우 정수에 결원이 발생됨\n5) 의결정족수(공익법인법 제9조)\n이사회의 의사는 정관에 특별한 규정이 없는 한 재적이사 과반수의 찬성으로 의결\n표결 및 발언권 등에 있어 각 이사는 평등한 의결권을 가지며, 이사회의 의사는 서면결의에 의할 수 없음\n※법인의 의사는 이사회를 통하여 결정되며, 이사회의 의사는 이사회 소집 후 정관에 의한 의결에 의해 결정됨\n이사회의 의결은 대한민국 국민인 이사가 출석이사의 과반수가 되어야 함\n이사의 의결권은 대리하여 행사할 수 없음\n※「사회복지사업법」에서는 이사회의 결의와 관하여 특별한 규정을 두고 있지 않아 「사회복지사업법」 제32조에 따라 「공익법인의 설립･운영에 관한 법률」이 준용됨\n-「공익법인의 설립･운영에 관한 법률」 제9조제3항은 이사회의 의사는 서면결의에 의할 수 없다고 규정함. 따라서 이사 본인이 직접 서면결의를 하는 것도 금지하는 취지에 비추어 보면, 이사 대리인의 선임을 통하여 의사를 표시하는 방법으로 결의하는 것은 더욱 허용되기 어려울 것이므로 대리인을 선임하여 표결권을 행사하는 것은 허용되지 않음 (2022 실무자를 위한 비영리･공익 법인 관리･감독 업무 편람 p.329.)\n참고 | 사회복지법인 온라인 이사회 운영 관련\n |  | \n |  | 「공익법인법」 제9조제3항에 따라 법령상 서면결의를 금지하는 목적은 이사들의 충분한 토론과 의견교환을 보장하려는 것으로서, -한 장소에 모이는 행위가 아니더라도 ① 이사회 출석을 요하는 자가 동시 참여, ② 참여자가 누구인지 확인 가능, ③참여자 상호 간 의견교환이 가능할 것의 요건을 모두 충족하는 경우, - 개인식별이 가능한* 원격 통신 수단(영상회의 등)을 통해 온라인 이사회가 상시적으로 허용(법무부 유권해석, ’20.12월) * (변경 전) 대면으로 이사회 개최 → (변경 후) 출석 및 결의가 이사의 동일성을 확인할 수 있는 경우 비대면으로 이사회 진행 가능 ※이 경우, 법인은 주무관청의 지도･감독 및 분쟁소지 해소를 위해 영상회의를 녹화하여 보관할 것"}, {"p": 33, "t": "판례 | 이사회 소집 관련 참조 판례\n |  | \n |  | <대법원 1994.9.23 선고 94다35084 판결> 사회복지법인의 이사회가 특정 이사에게 적법한 소집통지를 하지 아니하여 그 이사가 출석하지 아니한 채 개최되었다면 그 이사회결의는 무효 <대법원 2005.5.18 선고 2004마916 판결> 사회복지법인의 정관에 이사회의 소집통지시 ʻ회의의 목적사항ʼ을 명시하도록 정하고 있음에도, 일부 이사가 참석하지 않은 상태에서 소집통지서에 회의의 목적사항으로 명시한 바 없는 안건에 관하여 이사회가 결의하였다면, 적어도 그 안건과 관련하여서는 불출석한 이사에 대하여는 정관에서 규정한 바대로의 적법한 소집통지가 없었던 것과 다를 바 없으므로 그 결의 역시 무효 <대법원 2008.7.10. 선고 2007다78159 판결> 사회복지법인 이사회 소집통지 당시에 명시되지 아니한 이사해임안건이 이사회에 상정된 경우, 당해 이사를 포함한 재적이사 전원이 출석하였다는 사정만으로 소집절차 위반의 하자가 치유될 수 없음\n6) 이사회 회의록의 작성 및 공개(법 제25조, 영 제10조의4, 제10조의5)\n이사회는 다음의 사항을 회의록에 기재함\n-개의, 회의 중지 및 산회 일시, 안건, 의사, 출석한 임원의 성명, 표결수, 그 밖에 대표이사가 작성할 필요가 있다고 인정하는 사항\n회의록 작성이 어려운 경우, 우선 안건별로 회의조서를 작성하고 조속한 시일 내에 회의록을 작성할 수 있다.\n출석임원 전원이 회의록 및 회의조서 마지막 장에 날인함\n-회의록 및 회의조서가 2매 이상인 경우에는 출석임원 전원이 간인(間印)함\n-마지막 장의 날인 방법은 다음 방법 중 하나를 선택하여 날인\n① 인감, ② 기명란에 자필 서명 후 일반 날인, ③ 기명란에 기명 후 날인 부분에 자필 서명\n※ ②의 경우 간인은 자필서명 또는 일반날인으로 가능\n※ 법인의 감사 전원은 이사회 참석여부와 무관하게 이사회 회의록에 기명날인하여야 함(「공익법인법」 제10조제1항제2호)\n참고 | 자필 서명의 진정성 확인 방법\n |  | \n |  | 자필 서명의 진정성 확인을 위해 「본인서명사실 확인 등에 관한 법률」 제2조제3호에 따른 확인서를 통해 자필 서명의 진정성 확인 가능 재산출연증서, 임원 취임승낙서, 특수관계 부존재 각서, 결격사유 부존재 각서, 모든 회의록 및 회의조서 등에 기재한 자필 서명 전부 해당 단, 재산출연 시 또는 임원 취임 시 확인서를 원본으로 제출했고 이후 확인서 내용이 변경되지 않은 경우 해당 원본 또는 사본으로 제출 및 확인 가능"}, {"p": 34, "t": "회의록의 공개\n-공개기간：회의일부터 10일 이내에 게시하여 게시일로부터 3개월간 공개\n-공개장소:사회복지법인의 인터넷 홈페이지(전부 공개되는 카페나 블로그도 가능)와 관할 시･도지사가 지정하는 인터넷 홈페이지(예:시･도 홈페이지 또는 관련 협의회, 단체 홈페이지 등)에 각각 공개\n-공개기간 이후에도 회의록 공개를 청구할 수 있는 자(공개청구)：① 해당 사회복지법인의 종사자, ② 해당 사회복지법인이 설치･운영하는 시설의 종사자, ③ 해당 사회복지법인의 서비스 이용자 또는 법인이 설치･운영하는 시설의 이용자, ④ 해당 사회복지법인이 설치･운영하는 시설의 거주자 또는 거주자의 보호자\n※보조금을 받는 사회복지법인은 「공공기관의 정보공개에 관한 법률」상 공공기관에 해당하므로, 위 규정과 관계없이 누구든 정보(회의록)공개를 청구할 수 있음 (「공공기관의 정보공개에 관한 법률」 제2조, 제5조, 같은 법 시행령 제2조제5호)\n※공개청구를 받은 경우, 비공개 사항에 해당하지 않으면 10일 이내에 공개. 단, 공개청구의 내용이 공개 사항과 비공개 사항이 섞여 있는 경우에는 분리하여 공개가 가능한 사항만 공개\n회의록의 비공개사항(「공공기관의 정보공개에 관한 법률」 제9조제1항제4호부터 제8호 준용)\n①진행중인 재판에 관련된 정보와 범죄의 예방, 수사, 공소의 제기 및 유지, 형의 집행, 교정, 보안처분에 관한 사항으로서 공개될 경우 그 직무수행을 현저히 곤란하게 하거나 형사피고인의 공정한 재판을 받을 권리를 침해한다고 인정할 만한 상당한 이유가 있는 정보\n②감사･감독･검사･시험･규제･입찰계약･기술개발･인사관리･의사결정과정 또는 내부검토과정에 있는 사항 등으로서 공개될 경우 업무의 공정한 수행이나 연구･개발에 현저한 지장을 초래한다고 인정할 만한 상당한 이유가 있는 정보\n③당해 정보에 포함되어 있는 이름･주민등록번호 등 개인에 관한 사항으로서 공개될 경우 개인의 사생활의 비밀 또는 자유를 침해할 우려가 있다고 인정되는 정보. 다만, 다음에 열거한 개인에 관한 정보는 제외한다.\n가. 법령이 정하는 바에 따라 열람할 수 있는 정보\n나.사회복지법인이 공표를 목적으로 작성하거나 취득한 정보로서 개인의 사생활의 비밀과 자유를 부당하게 침해하지 않는 정보\n다.사회복지법인이 작성하거나 취득한 정보로서 공개하는 것이 공익 또는 개인의 권리구제를 위하여 필요하다고 인정되는 정보"}, {"p": 35, "t": "라. 직무를 수행한 사회복지법인 임직원의 성명･직위\n마.공개하는 것이 공익을 위하여 필요한 경우로써 법령에 의하여 국가 또는 지방자치단체가 업무의 일부를 위탁 또는 위촉한 개인의 성명･직업\n④법인･단체 또는 개인(이하 “법인등”이라 한다)의 경영･영업상 비밀에 관한 사항으로서 공개될 경우 법인등의 정당한 이익을 현저히 해할 우려가 있다고 인정되는 정보. 다만, 다음에 열거한 정보를 제외한다.\n가.사업활동에 의하여 발생하는 위해로부터 사람의 생명･신체 또는 건강을 보호하기 위하여 공개할 필요가 있는 정보\n나.위법･부당한 사업활동으로부터 국민의 재산 또는 생활을 보호하기 위하여 공개할 필요가 있는 정보\n⑤공개될 경우 부동산 투기･매점매석 등으로 특정인에게 이익 또는 불이익을 줄 우려가 있다고 인정되는 정보\n나\n이사(理事)"}, {"p": 36, "t": "1) 이사의 의의\n이사는 법인을 대표하고 법인의 업무를 집행하는 필수기관임(「민법」 제58･59조)\n이사의 정수는 대표이사를 포함한 7인 이상이고, 임기는 3년(연임가능, 제18조)\n※이사의 수는 정관으로 정하며, 상한은 없으나 의사결정의 효율성 등을 감안하여 15인 이하(공익법인법 제5조 참조)로 규정하도록 지도\n2) 이사의 직무\n이사는 선량한 관리자의 주의로 충실하게 그 직무를 행해야하며, 이사가 그 임무를 게을리 한 때에는 법인에 대하여 연대하여 손해배상의 책임이 있음(「민법」 제61･65조)\n가) 법인의 대표(대외적 권한)\n-이사는 법인의 사무에 관하여 각자 법인을 대표하므로(「민법」 제59조) 이사의 행위는 대외적으로 법인의 행위로서 인정됨(대표하는 사무에는 제한이 없음)\n➝이사의 대표권에 대한 제한 가능(「민법」 제59조) 제한은 반드시 정관에 기재하여야 하며 정관에 기재하지 않은 대표권의 제한은 무효임(「민법」 제41조)\n※정관에 기재한 경우에도 이를 등기하여야만 제3자에 대항할 수 있으므로(「민법」 제60조) 제･개정된 정관은 최대한 빠른 시일 내에 반드시 등기하도록 지도\n➝법인과 이사의 이익이 상반하는 사항에 관하여는 이사는 대표권이 없으며 이 경우 이해관계인 또는 검사의 청구에 의하여 법원이 선임하는 특별대리인이 법인을 대표(「민법」 제64조)\n※일정 사항에 대해 일부 이사와 법인의 이익이 상반되는 경우에는 동 사항의 결정에 있어 해당 이사를 의사결정과정에서 배제한 후 나머지 이사들이 법인을 대표하도록 하고 특별대리인의 선임은 해당 이사를 배제하였을 경우 정족수 부족 등으로 이사회 성립이 불가능할 경우에만 예외적으로 실시할 것\n나) 법인의 업무집행(대내적 권한)\n➝이사는 법인의 모든 내부적 사무를 집행할 권한이 있으며, 정관에 다른 규정이 없으면 법인의 사무집행은 이사의 과반수로써 결정함(「민법」 제58조)\n다\n감사(監事)"}, {"p": 37, "t": "1) 감사의 의의 및 자격\n감사는 법인의 재산이나 업무집행상태의 적정 여부를 조사･감독하는 기관으로 필수기관임\n감사의 정수는 2인 이상이어야 하며 그 임기는 2년으로 연임할 수 있음(법 제18조)\n감사는 이사와 시행령 제9조의 “특별한 관계에 있는 자”가 아니어야 하며 감사 중 1명은 법률 또는 회계에 관한 지식이 있는 사람 중에서 선임하여야 함\n※ 참고：특별한 관계에 있는 자의 범위(「사회복지사업법 시행령」 제9조) ➩ p.27 참고\n감사 선임 당시 법인(법인이 설치･운영하는 사회복지시설을 포함함)의 직전 3회계연도의 세입 금액*(기본재산 및 출연금 제외) 평균이 30억 원 이상인 법인은 감사 중 1명을 시･도지사의 추천을 받아 「주식회사 등의 외부감사에 관한 법률」에 따른 감사인에 속한 사람(이하 ‘전문가 감사’)으로 선임해야 함(법 제18조제7항, 영 제10조)\n* 사회복지법인의 회계에 속한 법인회계, 시설회계, 수익사업 회계 상 세입의 총합\n-법인은 전문가 감사를 선임해야 하는 경우 법인의 주사무소가 소재하는 시･도지사에 추천을 요청하고, 요청을 받은 시･도지사는 감사를 추천하여야 함\n※시･도지사는 법인에 적합한 감사를 추천할 수도 있고 법인에 감사 선임 후보자 명단을 제공하는 방법으로도 추천을 수행할 수 있음\n※시･도지사는 감사 추천시 법인측과 충분히 논의하여 적임자를 추천할 수 있도록 유의하고, 필요시 한국공인회계사회 등에 협조 요청 (한국공인회계사회에서 비상임 감사 추천 또는 추천 대상자 명단 제공 가능)\n- 시도지사의 추천을 받아 선임한 외부감사의 임기가 만료된 외부감사를 연임하기 위해서는 반드시 최초 선임시와 동일한 추천절차를 거쳐야 함\n-「공인회계사법」 제23조에 따른 회계법인에 속한 공인회계사 또는 「공인회계사법」 제41조에 따라 설립된 한국공인회계사회에 총리령으로 정하는 바에 따라 등록을 한 감사반에 속한 공인회계사를 감사로 선임하여야 함\n-직전 3회계연도는 전임 감사의 임기 만료 또는 사임･해임 등으로 감사를 선임해야 할 때, 그 시점을 기준으로 직전 3년을 의미"}, {"p": 38, "t": "참고 | 전문가 감사 선임과 관련한 세입 계산 방법\n |  | \n |  | 감사를 2월에 선임하는 등의 사유로 직전년도 결산 보고가 완료되지 않은 경우, 직전년도의 세입은 추정치로 계산할 것 (예) ʼ18년 2월에 감사선임 시, 최근 3개년도(ʼ15, ʼ16, ʼ17년)의 세입 금액 평균을 산출\n-세입 금액은 「사회복지법인 및 사회복지시설 재무･회계규칙」에 따른 세입 결산서상 세입 총액(기본재산 및 출연금 제외)을 기준으로 함\n2) 감사의 직무(공익법인법 제10조)\n가) 대내적 직무\n①법인의 업무와 재산상황을 감사하는 일 및 이사에 대하여 이에 필요한 자료의 제출 또는 의견을 요구하고 이사회에서 발언하는 일\n② 이사회의 회의록에 기명 날인하는 일\n※ 법인의 감사 전원은 이사회 참석여부와 무관하게 이사회 회의록에 기명날인하여야 함\n③ 법인의 업무와 재산상황에 대하여 이사에게 의견을 진술하는 일\n④법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때 이를 이사회에 보고하는 일\n⑤ ④의 보고를 하기 위하여 필요한 때에는 이사회의 소집을 요구하는 일\n※ ①, ④의 직무수행을 위해 이사회 소집 시 반드시 감사에게도 사전에 이사회 소집목적, 날짜, 시간, 장소를 통보해야 함\n나) 대외적 직무\n①법인의 직무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때에는 지체없이 시도지사에 이를 보고하여야 함\n②이사가 법인의 목적범위외의 행위를 하거나 기타 이 법 또는 이 법에 의한 명령이나 정관에 위반하는 행위를 하여 법인에게 현저한 손해를 발생하게 할 우려가 있는 때에는 그 이사에 대하여 직무행위를 유지(留止)할 것을 법원에 청구할 수 있음"}, {"p": 39, "t": "라\n임원의 임면(任免)\n이사의 임면방법은 정관의 필요적 기재사항이며(법 제17조) 따라서 정관에 의하여 정하여짐\n1) 임원의 임면보고(법 제18조, 규칙 제10조)\n공익법인법 제5조는 임원 취임시 주무관청의 승인을 받도록 되어 있으나 「사회복지사업법」에서는 이를 보고로 갈음하고 있음\n법인은 임원을 임면하는 경우 법인임원임면보고서(붙임 16)에 아래의 서류를 첨부하여 관할 시･도지사에게 제출하여야 함\n-당해 임원의 선임(연임) 또는 해임을 결의한 이사회 회의록 사본 1부\n-취임승낙서, 이력서 각 1부\n-기관으로부터 받은 이사추천서 1부(외부추천이사에 한함)\n-특수관계부존재 각서 1부\n-결격사유부존재 각서 1부(’19.6.12.시행)\n이사의 성명･주소는 등기사항이며(「민법」 제49조) 이를 등기하지 않으면 이사의 선임･해임･퇴임을 가지고 제3자에게 대항할 수 없음(「민법」 제54조)\n2) 임원선임 관련 금품 등 수수 금지(법 제18조의2, 법 제54조제1호의2, ʼ18.4.25.시행)\n임원의 선임과 관련하여 금품, 향응 또는 그 밖의 재산상 이익을 주고받거나 주고받을 것을 약속하는 경우, 법 제54조제1호의4에 따라 1년 이하의 징역 또는 1천만원 이하의 벌금에 해당\n※주무관청에서는 임원의 임면보고를 받을 시, 변경되는 임원이 「사회복지사업법」 제18조 등에서 규정하고 있는 바를 충족하는 자인지, 그 임원을 선임한 이사회가 정상적으로 개최된 이사회인지 여부 등에 대하여 면밀하게 검토\n‑검토결과 문제의 소지가 있는 경우, 해당 사회복지법인에 소명을 요구하고, 필요한 경우 해당 임원에 대한 직무집행정지 또는 해임명령 등 검토\n※시･도에서 법인의 임원 임면보고를 받거나, 임시이사를 선임하는 경우에는 본 지침 <사회복지법인 Q&A 모음>의 ‘11. 법인 임원의 결격사유 조회 관련’을 참고하기 바람"}, {"p": 40, "t": "3) 임원의 결격사유(법 제19조)\n |  | \n | 1. 미성년자 1의2. 피성년후견인 또는 피한정후견인 1의3. 파산선고를 받고 복권되지 아니한 사람 1의4. 법원의 판결에 따라 자격이 상실되거나 정지된 사람 1의5.금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 3년이 지나지 아니한 사람 1의6. 금고 이상의 형의 집행유예를 선고받고 그 유예기간 중에 있는 사람 1의7.제1호의5 및 제1호의6에도 불구하고 사회복지사업 또는 그 직무와 관련하여 「아동복지법」 제71조, 「보조금 관리에 관한 법률」 제40조부터 제42조까지, 「지방재정법」 제97조, 「영유아보육법」 제54조제2항제1호, 「장애아동 복지지원법」 제39조제1항제1호 또는 「형법」 제28장･제40장(제360조는 제외한다)의 죄를 범하거나 이 법을 위반하여 다음 각 목의 어느 하나에 해당하는 사람 가. 100만원 이상의 벌금형을 선고받고 그 형이 확정된 후 5년이 지나지 아니한 사람 나. 형의 집행유예를 선고받고 그 형이 확정된 후 7년이 지나지 아니한 사람 다.징역형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 7년이 지나지 아니한 사람 * 1의7과 관련하여 “그 직무”에 사회복지사업과 관련 없는 직무까지 포함되는 것은 아님(법제처 해석 19-0491) 1의8.제1호의5부터 제1호의7까지의 규정에도 불구하고 「성폭력범죄의 처벌 등에 관한 특례법」 제2조의 성폭력범죄* 또는 「아동･청소년의 성보호에 관한 법률」 제2조제2호의 아동･청소년대상 성범죄를 저지른 사람으로서 형 또는 치료감호를 선고받고 확정된 후 그 형 또는 치료감호의 전부 또는 일부의 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 유예･면제된 날부터 10년이 지나지 아니한 사람) 1의9.제1호의5부터 제1호의8까지의 규정에도 불구하고 「아동복지법」 제3조제7호의2에 따른 아동학대관련범죄를 저지른 사람으로서 다음 각 목의 어느 하나에 해당하는 사람 가.금고 이상의 실형을 선고받고 그 집행이 끝나거나(집행이 끝난 것으로 보는 경우를 포함한다) 집행이 면제된 날부터 10년이 지나지 아니한 사람 나.금고 이상의 형의 집행유예를 선고받고 그 집행유예가 확정된 날부터 10년이 지나지 아니한 사람 다.벌금형을 선고받고 그 형이 확정된 날부터 5년이 지나지 아니한 사람 2. 제22조에 따른 해임명령에 따라 해임된 날부터 5년이 지나지 아니한 사람 2의2.제26조에 따라 설립허가가 취소된 사회복지법인의 임원이었던 사람(그 허가의 취소사유 발생에 관하여 직접적인 또는 이에 상응하는 책임이 있는 자로서 대통령령*으로 정하는 사람으로 한정한다)으로서 그 설립허가가 취소된 날부터 5년이 지나지 아니한 사람(2018.10.25.시행) 2의3.제40조에 따라 시설의 장에서 해임된 사람으로서 해임된 날부터 5년이 지나지 아니한 사람(ʼ18.10.25.시행) 2의4. 제40조에 따라 폐쇄명령을 받고 3년이 지나지 아니한 사람(’18.10.25.시행) 3.사회복지분야의 6급 이상 공무원으로 재직하다 퇴직한 지 3년이 경과하지 아니한 사람 중에서 퇴직 전 5년 동안 소속하였던 기초자치단체가 관할하는 법인의 임원이 되고자 하는 사람 | \n |  | "}, {"p": 41, "t": "4) 임원의 보충(법 제20조) 및 임시이사 선임･해임(법 제22조의3, 제22조의4, 규칙 제11조)\n가) 임원의 보충 및 임시이사 선임\n-임원 중 결원이 생긴 때에는 2월이내에 이를 보충하여야 하고(법 제20조), 다음의 경우에 해당하여 법인의 정상적인 운영이 어렵다고 판단되는 경우 시･도지사는 지체 없이 이해관계인의 청구 또는 직권으로 임시이사를 선임하여야 함(법 제22조의3제1항제1호 및 제2호, ’19.7.16. 시행)\n①제20조에 따른 기간 내(임원 중에 결원이 발생한 후 2개월 이내)에 결원된 이사를 보충하지 아니하거나 보충할 수 없는 것이 명백한 경우(제1호)"}, {"p": 42, "t": "②제22조제3항에 따른 기간 내(법인이 시･도지사로부터 임원 해임명령을 받고 2개월 이내)에 임원의 해임에 관한 사항을 의결하기 위한 이사회를 소집하지 아니하거나 소집할 수 없는 것이 명백한 경우(제2호)\n※(참고) 개정 전 임시이사 선임 사유 : “법 제20조에 따른 기간 내에 결원된 이사를 보충하지 아니하여 법인의 정상적인 운영이 어렵다고 판단되는 경우”\n- 임시이사는 상기 사유가 해소될 때까지 재임함\n-시도지사는 임시이사가 선임되었음에도 불구하고 해당 법인이 정당한 사유 없이 이사회 소집을 기피할 경우 이사회 소집을 권고할 수 있음\n-이해관계인이 임시이사 선임을 청구하고자 하는 때에는 청구사유와 이해관계인임을 증명하는 서류를 관할 시･도지사에게 제출하여야 함\n-법 제22조의3제1항제2호에 따라 임시이사를 선임하는 경우 법 제22조의2제1항 단서에 따라 직무집행이 정지된 이사는 자신의 해임명령 이행을 위한 이사회와 관련해서는 이사로 보지 않으며, 이 경우 해당 임시이사가 직무집행이 정지된 이사의 지위를 대신함(법 제22조의3제5항 ’19.7.16. 시행)\n나) 임시이사의 해임\n-시･도지사는 다음 각 호의 어느 하나에 해당하는 경우 이해관계인의 청구 또는 직권으로 임시이사를 해임할 수 있음. 이 경우 제2호부터 제4호까지의 규정에 따라 임시이사를 해임하는 때에는 지체 없이 그 후임자를 선임하여야 함.\n① 임시이사 선임사유가 해소된 경우\n②임시이사가 제19조제1항제1호 및 제1호의2부터 제1호의8까지의 어느 하나에 해당하는 경우\n③ 임시이사가 직무를 태만히 하여 법인의 정상화가 어려운 경우\n④임시이사가 제22조제1항 각 호의 어느 하나에 해당하는 경우\n- 법인은 상기 사유로 해임된 임시이사를 이사로 선임할 수 없음\n판례 | 임시이사 선임 요청이 가능한 “이해관계인”의 범위\n |  | \n |  | <대법원 2007.5.10. 선고, 2006다85747. 판결 / 대법원 1976.12.10. 자, 76마394 결정> 임시이사를 신청할 수 있는 이해관계인에는, 임시이사가 선임되는 것에 관하여 법률상의 이해관계가 있는 자로서 그 법인의 이사, 사원, 채권자 등이 이에 속하고, 위 법인의 이사에는 법인의 정당한 최후의 이사였다가 퇴임한 자이거나 비록 그 선임결의의 효력이 다투어지더라도 신청 당시에 법인의 등기부상 이사로서 법인의 업무처리를 담당해 온 자 등은 포함한다."}, {"p": 43, "t": "5) 임원의 겸직금지(법 제21조)\n이사는 법인이 설치한 사회복지시설의 장을 제외한 해당 시설의 직원을 겸할 수 없음\n감사는 법인의 이사, 법인이 설치한 사회복지시설의 장 또는 그 직원을 겸할 수 없음\n참고 | 지방의회 의원 겸직금지\n |  | \n |  | 지자체의 보조금을 교부받는 사회복지법인은 공공단체이므로 「지방자치법」 제43조제5항에 따라 지방의회 의원은 사회복지법인의 관리인인 임원이 될 수 없음(행정안전부 선거의회과-2163(2018.7.4.)\n6) 임원의 해임명령(법 제22조, 영 제10조의3)\n시･도지사는 아래의 경우 법인에 대하여 그 임원의 해임을 명할 수 있음\n① 시･도지사의 명령을 정당한 이유없이 이행하지 아니한 때\n② 회계부정이나 현저한 불법행위 기타 부당행위 등이 발견되었을 때\n③법인의 업무에 관하여 시･도지사에게 보고할 사항에 대해 고의로 보고를 지연하거나 허위보고를 한때\n④외부추천이사 선임과 관련된 사항을 위반하거나, 특별한 관계에 있는 사람을 규정을 초과하여 선임하거나, 감사의 선임과 관련된 사항을 위반하여 선임된 사람\n⑤ 임원의 겸직근무 의무를 위반한 사람\n⑥ 직무집행 정지명령을 이행하지 아니한 사람\n⑦기타 「사회복지사업법」 또는 「사회복지사업법」에 의한 명령을 위반하였을 때\n※조사 및 감사결과 사회복지법인의 비리가 밝혀져 정상적인 업무수행이 곤란하다고 판단할 경우 법인감사 부실을 이유로 감사사임을 요구하고, 즉시 감사추천(공익법인법 시행령 제13조제4항 준용)\n해임명령은 시･도지사가 해당 법인에게 그 사유를 들어 시정을 요구한 날부터 15일이 경과하여도 이에 응하지 아니한 경우에 한함.\n-다만, 다음의 어느 하나에 해당하는 경우는 시정요구 없이 임원의 해임을 명할 수 있음\n1. 시정을 요구하여도 기한 내에 시정할 수 없는 것이 물리적으로 명백한 경우\n2.임원이 해당 사회복지법인 또는 사회복지법인이 운영하는 사회복지시설의 재산･보조금에 대하여 회계부정, 횡령 또는 절취를 하거나 그 업무와 관련하여 뇌물수수 또는 배임(背任)행위를 한 경우"}, {"p": 44, "t": "해임명령을 받은 법인은 2개월 이내에 임원의 해임에 관한 사항을 의결하기 위한 이사회를 소집하여야 함(법 제22조제3항, ’19.7.16. 시행)\n「사회복지사업법」 제22조에 따른 해임명령 통보 대상\n-임원의 해임은 「사회복지사업법」 제32조에 따라 준용되는 「공익법인의 설립･운영에 관한 법률」 제7조제1항제4호에 따라 해당 사회복지법인의 이사회 권한에 속하는 사안임\n-따라서 임원에 대한 해임명령을 해당 명령을 이행할 수 있는 사회복지법인을 대상으로 통보하여야 함\n-해임명령대상인 임원에 대해서는 해당 사회복지법인에 대해 본인을 해임토록 명령을 하였다는 사실을 통보하는 것은 가능\n참고 | 법인의 임원과 관련한 질의･응답 사례\n |  | \n |  | Q：A법인의 이사로 등기되어 있는 甲이 B법인의 이사를 겸임할 수 있는지 여부 A：甲이 A. B법인에서 모두 상근이사(정기적으로 보수를 받는 이사)가 아니고, B법인의 출연자 및 임원상호간에 있어 특별한 관계에 있는 자에 해당되지 않을 경우 겸임도 가능하다고 사료 Q：A법인의 이사로 등기되어 있는 甲이  A법인 및 A법인이 설치한 시설과 전혀 관계없는 B법인의 직원 및 C시설의 장 또는 종사자로 근무가 가능한지 여부 A：甲이 A법인에서 상근이사가 아니고 B법인의 직원 및 C시설의 장 또는 종사자로 근무하는데 결격사유가 없는 경우 근무가 가능하다고 사료 Q：A법인의 감사로 등기되어 있는 甲이 A법인 및 A법인이 설치한 시설과 전혀 관계없는 B법인의 직원 및 C시설의 장 또는 종사자로 근무가 가능한지 여부 A：B법인 및 C시설이 甲이 감사로 등기되어 있는 A법인의 이사들과 관계가 없고 甲이 B법인의 직원 및 C시설의 장으로 근무하는데 결격사유가 없다면 가능 Q：출연자가 이사장인 A법인의 이사 甲이 A법인에서 설치한 시설의 시설장을 겸직하는 경우 출연자와 甲은 고용관계로 특수관계자로 봐야 하는지 여부 A：甲은 A법인에 의하여 시설장에 선임된 사람일 뿐 출연자와 고용관계로 볼 수 없으며, A법인의 이사의 지위도 함께 갖고 있으므로 동일법인 내에서는 특수관계자로 볼 수 없음 Q：특수관계자가 없는 A법인 이사회에 이사 甲의 부인이 신임이사로 취임할 때 A법인 이사회 특수관계자의 수 A：특수관계에 관한 규정으로 2명이 됨(이사의 현원이 7명인 경우, 특수관계인의 수는 1/5인 1명이므로, 이를 초과하는 이사 甲의 부인은 취임불가) Q：임시이사로 선임받은 자가 임시이사 선임사유가 해소되어 해임받은 경우라면 사회복지사업법 제19조(임원의 결격사유) 제1항제2호을 적용해야 하는지 여부 A：법 제19조제1항제2호의 사유는 법 제22조에 따른 해임명령에 한정되므로, 임시이사 선임사유 해소에 따른 해임의 경우에는 법 제19조제1항제2호의 적용을 받지 않음"}, {"p": 45, "t": "7) 임원의 직무집행정지(법 제22조의2)\n시･도지사는 법 제22조에 따른 해임명령을 하기 위하여 같은 조 제1항 각 호의 사실여부에 대한 조사나 감사가 진행 중인 경우 및 해임명령 기간 중인 경우 해당 임원의 직무집행을 정지시킬 수 있음\n-다만, 법 제18조제2항･제3항 또는 제7항을 위반하여 선임된 사람에 해당하여 해임명령을 받은 경우에는 해당 임원의 직무집행을 정지시켜야 함(법 제22조의2제1항단서, ’19.7.16. 시행)\n「사회복지사업법」 제22조의2에 따른 직무집행 정지명령 통보 대상\n-시･도지사가 직권으로 임원의 직무집행을 정지시키는 것이므로, 해당 임원에 대해서 직무집행을 정지하라는 명령을 내려야 함\n-직무집행이 정지된 임원은 관련 사무처리가 불가능하고, 이사회 참석 등도 불가능 하므로, 해당 사회복지법인에 대해서 특정 임원의 직무집행이 정지되었다는 사실을 반드시 통보하여야 할 것임\n참고 | 상근임직원 관리 유의사항\n |  | \n |  | 상근임직원의 정원(공익법인법 제5조제9항 및 공익법인법 시행령 제14조)과 보수에 관한 사항은 별도 규정을 제정할 수 있는 근거를 정관에 명시하고 그 규정은 주무관청에 보고하여야 함 ※ 주무관청은 세입세출예산계획 등을 통해 상근임직원의 정원과 보수수준을 확인함\n사회복지법인의 관리\n1. 법인의 등기 관리\n2. 정관변경의 인가\n3. 기본재산 처분허가 등\n4. 법인의 소멸(합병포함)\n5. 법인의 관리･감독\n제Ⅲ장"}]}]}, {"no": 4, "title": "사회복지법인의 관리", "start": 47, "end": 74, "sections": [{"title": "1. 법인의 등기 관리", "start": 49, "end": 50, "html": "<div class=\"pchip\" id=\"p49\"><span>원문 49쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=55\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>법인의 등기 관리<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">설립등기<\/div><div class=\"ln h1\">Ⅱ. 사회복지법인의 설립(p.26) 참조<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">사무소 관련 등기<\/div><div class=\"ln h4\">1) 분사무소 설치의 등기(「민법」 제50조)<\/div><div class=\"ln p\">새로운 분사무소 설치 시 주사무소 소재지에서 3주내에 분사무소 소재지와 설치 연월일을 등기하여야 함<\/div><div class=\"ln note\">※ 다만, ‵25.1.31. 전에 분사무소 설치의 등기를 하는 경우, 2024년 사회복지법인 관리안내(p.53)에 따라 등기해야 함<\/div><div class=\"ln p\">분사무소는 사업수행의 장소일 뿐 별도의 법인격이 있는 것은 아님에 유의<\/div><div class=\"ln p\">- 분사무소에서 처리하는 사무도 해당 사회복지법인의 명의로 진행해야함<\/div><div class=\"ln p\">주의<\/div><div class=\"ln h4\">2) 사무소 이전의 등기(「민법」 제51조)<\/div><div class=\"ln p\">주사무소 이전시 예전 소재지 또는 새로운 소재지에서 3주내에 새로운 소재지와 이전 연월일을 등기하여야 함<\/div><div class=\"ln p\">분사무소 이전시 주사무소 소재지에서 3주내에 새로운 분사무소 소재지와 이전 연월일을 등기하여야 함<\/div><div class=\"ln note\">※ 다만, ‵25.1.31. 전에 사무소 이전의 등기를 하는 경우, 2024년 사회복지법인 관리안내(p.53)에 따라 등기해야 함<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">변경등기(「민법」 제52조)<\/div><div class=\"ln p\">설립등기의 등기사항에 변경이 있는 때에는 3주내에 소재지 등기소에 변경등기를 해야 함<\/div><div class=\"pchip\" id=\"p50\"><span>원문 50쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=56\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">직무집행정지 등 가처분 등기(「민법」 제52조의 2)<\/div><div class=\"ln p\">이사의 직무집행을 정지하거나 직무대행자를 선임하는 가처분을 하거나 그 가처분을 변경･취소하는 경우에는 주사무소가 있는 곳의 등기소에서 이를 등기하여야 함<\/div><div class=\"ln note\">※ 다만, ‵25.1.31. 전에 직무집행정지 등 가처분 등기를 하는 경우, 2024년 사회복지법인 관리안내(p.54)에 따라 등기해야 함<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">해산등기(「민법」 제85조)<\/div><div class=\"ln p\">청산인은 법인이 파산으로 해산한 경우가 아니면 취임 후 3주내에 ① 해산의 사유 ② 해산 연월일, ③ 청산인의 성명 및 주소 ④ 청산인의 대표권을 제한한 경우에는 그 제한을 주사무소 소재지에서 등기하여야 함<\/div><div class=\"ln note\">※ 상기 등기사항에 변경이 생긴 경우에도 3주내에 변경등기를 해야 함<\/div><div class=\"ln note\">※ 다만, ‵25.1.31. 전에 해산등기를 하는 경우, 2024년 사회복지법인 관리안내(p.54)에 따라 등기해야 함<\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">등기의 효력<\/div><div class=\"ln p\">설립등기는 법인의 성립요건이며(「민법」 제33조), 설립등기이외의 등기사항은 제3자에 대한 대항요건임(「민법」 제54조)<\/div><div class=\"ln p\">사<\/div><div class=\"ln p\">등기기간의 계산<\/div><div class=\"ln p\">시･도지사의 허가를 요하는 등기사항은 그 허가서가 도착한 날로부터 등기의 기간을 기산(「민법」 제53조)<\/div><div class=\"ln p\">아<\/div><div class=\"ln p\">설립등기 등의 보고<\/div><div class=\"ln p\">법인은 설립등기, 분사무소설치의 등기, 사무소이전의 등기, 변경등기 등을 한 때에는 등기를 완료한 날로부터 7일 이내에 등기보고서에 등기부등본 1부를 첨부하여 시도지사에 제출할 것<\/div><div class=\"ln note\">※「전자정부법」 제38조제1항의 규정에 의한 행정정보공동이용을 통하여 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음<\/div>", "pages": [{"p": 49, "t": "1\n법인의 등기 관리\n가\n설립등기\nⅡ. 사회복지법인의 설립(p.26) 참조\n나\n사무소 관련 등기\n1) 분사무소 설치의 등기(「민법」 제50조)\n새로운 분사무소 설치 시 주사무소 소재지에서 3주내에 분사무소 소재지와 설치 연월일을 등기하여야 함\n※ 다만, ‵25.1.31. 전에 분사무소 설치의 등기를 하는 경우, 2024년 사회복지법인 관리안내(p.53)에 따라 등기해야 함\n분사무소는 사업수행의 장소일 뿐 별도의 법인격이 있는 것은 아님에 유의\n- 분사무소에서 처리하는 사무도 해당 사회복지법인의 명의로 진행해야함\n주의\n2) 사무소 이전의 등기(「민법」 제51조)\n주사무소 이전시 예전 소재지 또는 새로운 소재지에서 3주내에 새로운 소재지와 이전 연월일을 등기하여야 함\n분사무소 이전시 주사무소 소재지에서 3주내에 새로운 분사무소 소재지와 이전 연월일을 등기하여야 함\n※ 다만, ‵25.1.31. 전에 사무소 이전의 등기를 하는 경우, 2024년 사회복지법인 관리안내(p.53)에 따라 등기해야 함\n다\n변경등기(「민법」 제52조)\n설립등기의 등기사항에 변경이 있는 때에는 3주내에 소재지 등기소에 변경등기를 해야 함"}, {"p": 50, "t": "라\n직무집행정지 등 가처분 등기(「민법」 제52조의 2)\n이사의 직무집행을 정지하거나 직무대행자를 선임하는 가처분을 하거나 그 가처분을 변경･취소하는 경우에는 주사무소가 있는 곳의 등기소에서 이를 등기하여야 함\n※ 다만, ‵25.1.31. 전에 직무집행정지 등 가처분 등기를 하는 경우, 2024년 사회복지법인 관리안내(p.54)에 따라 등기해야 함\n마\n해산등기(「민법」 제85조)\n청산인은 법인이 파산으로 해산한 경우가 아니면 취임 후 3주내에 ① 해산의 사유 ② 해산 연월일, ③ 청산인의 성명 및 주소 ④ 청산인의 대표권을 제한한 경우에는 그 제한을 주사무소 소재지에서 등기하여야 함\n※ 상기 등기사항에 변경이 생긴 경우에도 3주내에 변경등기를 해야 함\n※ 다만, ‵25.1.31. 전에 해산등기를 하는 경우, 2024년 사회복지법인 관리안내(p.54)에 따라 등기해야 함\n바\n등기의 효력\n설립등기는 법인의 성립요건이며(「민법」 제33조), 설립등기이외의 등기사항은 제3자에 대한 대항요건임(「민법」 제54조)\n사\n등기기간의 계산\n시･도지사의 허가를 요하는 등기사항은 그 허가서가 도착한 날로부터 등기의 기간을 기산(「민법」 제53조)\n아\n설립등기 등의 보고\n법인은 설립등기, 분사무소설치의 등기, 사무소이전의 등기, 변경등기 등을 한 때에는 등기를 완료한 날로부터 7일 이내에 등기보고서에 등기부등본 1부를 첨부하여 시도지사에 제출할 것\n※「전자정부법」 제38조제1항의 규정에 의한 행정정보공동이용을 통하여 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음"}]}, {"title": "2. 정관변경의 인가", "start": 51, "end": 52, "html": "<div class=\"pchip\" id=\"p51\"><span>원문 51쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=57\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>정관변경의 인가<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">정관변경 인가신청(법 제17조, 규칙 제8조)<\/div><div class=\"ln p\">법인이 정관을 변경하고자 하는 때에는 정관변경인가신청서(붙임 17)에 아래의 서류를 첨부하여 시･도지사(시･군･구)에 제출한 후 정관변경에 대한 인가를 받아야 함<\/div><div class=\"ln p\">-정관의 변경을 결의한 이사회 회의록 사본 1부<\/div><div class=\"ln p\">-정관변경안 1부<\/div><div class=\"ln p\">-사업변경계획서, 예산서 및 재산의 소유를 증명할 수 있는 서류(사업의 변동이 있는 경우에 한함) 각 1부<\/div><div class=\"ln p\">-재산의 평가조서 및 재산수익조서(사업의 변동이 있는 경우에 한함) 각 1부<\/div><div class=\"ln note\">※정관 중 공고 및 그 방법에 관한 사항을 변경하고자 하는 경우에는 시･도지사의 인가를 받지 않아도 됨(규칙 제9조)<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">정관변경 인가시 검토사항<\/div><div class=\"ln h4\">1) 정관변경의 적법성과 타당성<\/div><div class=\"ln p\">정관변경절차가 관계법령, 정관 등에 적합한지 여부 등을 검토하고 이사회 회의록에 정관변경의 구체적 내용이 논의되었는지 여부와 참석자 전원 및 감사의 날인 여부를 확인<\/div><div class=\"ln p\">-날인은 반드시 인감일 필요는 없으며, 기명란에 자필 서명 후 일반 날인 또는 기명란에 기명 후 날인 부분에 자필 서명도 가능<\/div><div class=\"ln p\">사업변경시, 변경된 사업이 설립자의 법인설립의도, 정관상 법인목적, 비영리 사회복지사업의 특성 등과 부합되는지 여부도 엄격하게 심사할 것<\/div><div class=\"pchip\" id=\"p52\"><span>원문 52쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=58\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">2) 정관변경에 따른 재원확보<\/div><div class=\"ln p\">정관변경으로 사업의 변경이 있을 때에는 확실한 재원조달방법이 있는지를 확인(先 재원확보, 後 정관변경 인가)<\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>정관변경 시 조건 부가<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">&lt;대법원 2002.9.24. 선고 2000두5661 판결&gt;<br>「사회복지사업법」 제12조 및 제25조의 규정에 사회복지법인의 설립이나 설립 후 정관변경의 허가에 관한 구체적인 기준이 정하여져 있지 아니한 점 등에 비추어 보면, 사회복지법인의 정관변경을 허가할 것인지의 여부는 주무관청의 정책적 판단에 따른 재량에 맡겨져 있다고 할 것이고, 주무관청이 정관변경허가를 함에 있어서는 비례의 원칙 및 평등의 원칙에 적합하고 행정처분의 본질적 효력을 해하지 않는 한도 내에서 부관을 붙일 수 있다.<\/td><\/tr><\/table><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>정관변경 시 임원명단 작성 요령<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">정관 별지의 임원명단은 설립 시 임원명단으로 작성되어야 하며, 이는 설립 시 임원명단으로 작성되어야 출연자와의 관계 확인이 가능하며, 현행 임원 명단은 법인의 등기부등본으로 확인 가능<\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td>Q&amp;A<\/td><td><\/td><td>정관변경 시 원본 당위제출 필요성<\/td><td><\/td><\/tr><tr><td><\/td><td colspan=\"3\" rowspan=\"2\">Q: 법인 정관 변경시 인장이 변경되지 않은 경우에도 반드시 정관의 원본을 제출해야 하나요?<br>A: 인장 변경이 없이 다른 사유로 정관 개정을 할 경우 해당 페이지는 사본 제출(첨부) 가능합니다.<\/td><td rowspan=\"2\"><\/td><\/tr><tr><td><\/td><\/tr><tr><td><\/td><td colspan=\"3\"><\/td><td><\/td><\/tr><\/table>", "pages": [{"p": 51, "t": "2\n정관변경의 인가\n가\n정관변경 인가신청(법 제17조, 규칙 제8조)\n법인이 정관을 변경하고자 하는 때에는 정관변경인가신청서(붙임 17)에 아래의 서류를 첨부하여 시･도지사(시･군･구)에 제출한 후 정관변경에 대한 인가를 받아야 함\n-정관의 변경을 결의한 이사회 회의록 사본 1부\n-정관변경안 1부\n-사업변경계획서, 예산서 및 재산의 소유를 증명할 수 있는 서류(사업의 변동이 있는 경우에 한함) 각 1부\n-재산의 평가조서 및 재산수익조서(사업의 변동이 있는 경우에 한함) 각 1부\n※정관 중 공고 및 그 방법에 관한 사항을 변경하고자 하는 경우에는 시･도지사의 인가를 받지 않아도 됨(규칙 제9조)\n나\n정관변경 인가시 검토사항\n1) 정관변경의 적법성과 타당성\n정관변경절차가 관계법령, 정관 등에 적합한지 여부 등을 검토하고 이사회 회의록에 정관변경의 구체적 내용이 논의되었는지 여부와 참석자 전원 및 감사의 날인 여부를 확인\n-날인은 반드시 인감일 필요는 없으며, 기명란에 자필 서명 후 일반 날인 또는 기명란에 기명 후 날인 부분에 자필 서명도 가능\n사업변경시, 변경된 사업이 설립자의 법인설립의도, 정관상 법인목적, 비영리 사회복지사업의 특성 등과 부합되는지 여부도 엄격하게 심사할 것"}, {"p": 52, "t": "2) 정관변경에 따른 재원확보\n정관변경으로 사업의 변경이 있을 때에는 확실한 재원조달방법이 있는지를 확인(先 재원확보, 後 정관변경 인가)\n판례 | 정관변경 시 조건 부가\n |  | \n |  | <대법원 2002.9.24. 선고 2000두5661 판결> 「사회복지사업법」 제12조 및 제25조의 규정에 사회복지법인의 설립이나 설립 후 정관변경의 허가에 관한 구체적인 기준이 정하여져 있지 아니한 점 등에 비추어 보면, 사회복지법인의 정관변경을 허가할 것인지의 여부는 주무관청의 정책적 판단에 따른 재량에 맡겨져 있다고 할 것이고, 주무관청이 정관변경허가를 함에 있어서는 비례의 원칙 및 평등의 원칙에 적합하고 행정처분의 본질적 효력을 해하지 않는 한도 내에서 부관을 붙일 수 있다.\n참고 | 정관변경 시 임원명단 작성 요령\n |  | \n |  | 정관 별지의 임원명단은 설립 시 임원명단으로 작성되어야 하며, 이는 설립 시 임원명단으로 작성되어야 출연자와의 관계 확인이 가능하며, 현행 임원 명단은 법인의 등기부등본으로 확인 가능\n | Q&A |  | 정관변경 시 원본 당위제출 필요성 | \n | Q: 법인 정관 변경시 인장이 변경되지 않은 경우에도 반드시 정관의 원본을 제출해야 하나요? A: 인장 변경이 없이 다른 사유로 정관 개정을 할 경우 해당 페이지는 사본 제출(첨부) 가능합니다. | \n\n |  | "}]}, {"title": "3. 기본재산 처분허가 등", "start": 53, "end": 61, "html": "<div class=\"pchip\" id=\"p53\"><span>원문 53쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=59\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>기본재산 처분허가 등<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">기본재산 처분허가(법 제23조, 규칙 제14조)<\/div><div class=\"ln h4\">1) 기본재산 처분허가 신청<\/div><div class=\"ln p\">기본재산의 매도, 증여, 교환, 임대, 담보제공 또는 용도변경하고자 할 때에는 반드시 시도지사의 처분허가를 받아야 함<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>처분허가 대상 정의<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">매도 : 재산권을 상대방에게 이전하고, 그 대금을 지급받는 것(「민법」 제563조 등)<br>증여 : 무상으로 재산을 상대방에게 수여하는 것(「민법」 제554조)<br>* 다만, 사인증여, 상속은 자연인의 사망을 전제로 한 행위이므로 사회복지법인에서는 발생할 수 없음<br>교환 : 금전 이외의 재산권을 상호이전하는 것(「민법」 제596조)<br>임대 : 차임을 지급받고 목적물을 사용･수익하게 하는 것(「민법」 제618조)<br>*다만, 「사회복지사업법」 제23조제3항제1호의 “임대”는 기본재산에 영향을 미치는 유･무상의 임대행위 자체로, 차임의 지급 약정없이 무상으로 목적물을 사용･수익하게 하는 무상임대는 기본재산 처분허가 대상임<br>담보제공 : 채무불이행 시 채무의 변제를 위한 보증행위로서, 채권자의 채권 확보를 보장하기 위해 그 재산에 제한물권 등을 설정하는 행위<br>용도변경 : 기본재산의 본래 용도를 변경하는 행위<\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>‑도시계획 등으로 인해 의도치 않게 법인 기본재산 유형이 변경되는 경우에도 일반적인 기본재산처분 허가를 받아야 함<br>‑기본재산처분으로 인하여 발생한 현금 등은 반드시 정관변경 후 기본재산으로 편입(도시계획 보상금 수령, 처분액 차이로 인한 이익금 등)하고 법인의 목적을 수행하기 위하여 사용할 경우 주무관청의 허가를 받아야 함.<br>※보상금의 이자 역시 기본재산 처분에 대한 반대급부로서 발생한 것이므로 지체없이 보상금과 관련된 과실(果實)을 즉시 정관상 기본재산으로 편입 하도록 기본재산 처분시 허가조건에 기재. 다만, 기본재산으로 편입한 이후에 발생한 이자는 “보통재산”으로 구분 가능.<br>‑기본재산 압류에 대한 임의･강제 경매 시 기본재산처분허가를 받아야 소유권 이전 가능<br>‑청산･파산절차 진행 중, 채무변제를 위한 기본재산처분시에도 반드시 처분허가를 받아야만 함<br>‑기본재산이 현금인 경우 금융상품에 가입하기 위하여는 반드시 주무관청의 허가 필요. 특히, 안정적인 수익창출이 아닌 방식으로서 「예금자보호법」에 따라 예금이 보장되지 않거나 원금의 손실이 발생할 수 있는 금융상품에 가입하는 경우 주무관청은 허가에 있어 신중을 기해야 함<br>‑기본재산을 등가 또는 등가 이상의 다른 재산과 교환하는 경우 단순히 감정평가서상 평가금액에만 의존하지 말고 기본재산의 용도, 취득재산의 법인목적에 대한 적합성 등을 종합적으로 고려하여 판단하여야 함<br>‑기본재산이 국가 등으로부터 보조금을 지원받아 취득한 재산으로 「보조금 관리에 관한 법률」 제35조제1항에 따른 ʻʻ중요재산ʼʼ인 경우, 「사회복지사업법」 제23조제3항에 따른 기본재산 처분허가와 별개로, 「보조금 관리에 관한 법률」 제35조제3항에 따라 해당 보조금을 교부한 시･도로부터 중요재산의 양도, 교환, 대여 및 담보 제공행위 등에 관한 승인이 필요함<br>*「보조금 관리에 관한 법률」 제35조제3항에 따라 중앙관서의 장(보건복지부장관)의 승인사항이나 「행정권한의 위임 및 위탁에 관한 규정」 제36조제3항제5호에 따라 시･도지사에 위임됨<br>*법인 관할 시･도와 보조금을 교부한 지자체가 다를 경우 법인 관할 시･도에서는 중요재산에 대한 기본재산 처분허가시, 보조금을 교부한 지자체의 의견을 들어 처리<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p54\"><span>원문 54쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=60\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>용도변경 해석 관련<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">&lt;대법원 2006.11.23., 선고, 2005도5511도 판결&gt;<br>처분의 제한 대상으로서 ‘용도변경’은 ‘매도･증여･교환･임대･담보제공이 아닌 방법으로 사회복지법인의 기본재산을 처분하는 행위, 즉 기본재산의 현상에 변동을 일으키는 행위 중 위와 같은 입법목적을 침해할 우려가 있는 행위’라고 충분히 해석할 수 있다고 할 것<\/td><\/tr><\/table><div class=\"ln p\">처분허가 신청 시 기본재산처분허가신청서(붙임 18)에 아래의 서류를 첨부하여 시･도지사에게 제출하여야 하며, 이 경우 시･도지사는 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 개별공시지가 확인서를 확인하여야 함<\/div><div class=\"ln p\">-기본재산 처분이유서 1부<\/div><div class=\"ln p\">-기본재산의 처분을 결의한 이사회회의록 사본 1부(집합건물의 개별 호실 임대의 경우 전체 건물의 임대에 관해 결의한 이사회 회의록으로 갈음)<\/div><div class=\"ln p\">-처분하는 기본재산의 명세서 1부<\/div><div class=\"ln p\">-처분하는 기본재산의 감정평가서(교환의 경우에는 취득하는 재산의 감정평가서를 포함하며, 개별공시지가서 확인서로 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음)<\/div><div class=\"ln note\">※감정평가：당해 토지와 유사한 이용가치를 지닌다고 인정되는 표준지의 공시지가를 기준으로 하여야 한다. 다만, 적정한 실거래가가 있는 경우에는 이를 기준으로 할 수 있다. 담보권의 설정･경매 등은 당해 토지의 임대료･조성비용 등을 고려하여 감정평가를 할 수 있다(「감정평가 및 감정평가사에 관한 법률」 제3조)<\/div><div class=\"pchip\" id=\"p55\"><span>원문 55쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=61\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※개별공시지가：당해 토지와 유사한 이용가치를 지닌다고 인정되는 하나 또는 둘 이상의 표준지의 공시지가를 기준으로 토지가격비준표를 사용하여 사용한 지가(「부동산 가격공시에 관한 법률」 제10조제4항)<\/div><div class=\"ln note\">※ 감정평가서와 개별공시지가의 유효기간은 1년임<\/div><div class=\"ln note\">※ 건물멸실로 인한 기본재산 처분허가 신청시 감정평가서 제출을 제외할 수 있음<\/div><div class=\"ln p\">시･도지사의 기본재산 처분허가를 받은 이후 기본재산을 처분하고, 처분이 완료되면 즉시 정관을 변경하고 인가를 받을 것<\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>기본재산 처분 관련 참조 판례<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">&lt;대법원 2002.6.28. 선고 2000도20090 판결&gt;<br>「사회복지사업법」 제32조에 의하여 사회복지법인에 관하여 준용되는 「공익법인의설립･운영에관한법률」 제1조, 제6조, 제7조, 그 밖에 위 각 법의 여러 규정을 아울러 살펴보면, 「공익법인의설립･운영에관한법률」 제7조에서 공익법인의 재산의 처분에 관한 사항 등을 이사회에서 심의결정한다고 한 것은 공익법인의 특수성을 고려하여 그 재산의 원활한 관리 및 유지 보호와 재정의 적정을 기함으로써 공익법인의 건전한 발달을 도모하고 공익법인으로 하여금 그 본래의 목적사업에 충실하게 하려는 데 그 목적이 있다 할 것이므로, 사회복지법인의 대표자가 이사회의 의결 없이 사회복지법인의 재산을 처분한 경우에 그 처분행위는 효력이 없다.<br>&lt;대법원 2006.11.23. 선고 2005도5511 판결&gt;<br>사회복지법인의 기본재산을 용도변경 하는 경우 감독관청의 허가를 받도록 규정한 입법취지 및 용도변경이 용이한 현금의 특성상 인정되는 그 사용 용처의 적정성 여부에 대한 사전심사의 필요성 등에 비추어 볼 때 사회복지법인의 운영이나 기본재산의 처분과 관련된 용처에 기본재산을 사용하는 경우에도 감독관청의 허가를 받아야 할 필요가 있다고 할 것이므로 감독관청의 허가 없이 사회복지법인의 기본재산을 처분한 대가로 수령한 보상금을 사용한 행위는 사회상규에 위배되지 않는 정당행위라고 볼 수 없다.<br>&lt;대법원 2007.6.18. 자 2005마1193 결정&gt;<br>「사회복지사업법」 제23조제3항제1호의 규정에 의하면 사회복지법인이 기본재산을 매도하기 위하여는 보건복지부장관의 허가를 받아야 하고, 이는 경매절차에 의한 매각의 경우에도 마찬가지라 할 것인바.(이하 생략)<\/td><\/tr><\/table><div class=\"ln h4\">2) 기본재산 처분허가 시 검토사항<\/div><div class=\"ln p\">가) 처분의 적정성 검토<\/div><div class=\"ln p\">-사회복지법인에 출연된 재산 즉 기본재산은 바로 법인의 실체인 동시에 법인의 목적을 수행하기 위한 가장 기본적인 수단이므로 이를 처분한다는 것은 법인의 실체가 없어진다는 것을 의미하며 나아가서는 법인이 그 목적을 수행할 수 없게 된다는 것을 의미하므로,<\/div><div class=\"pchip\" id=\"p56\"><span>원문 56쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=62\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">-기본재산 처분신청 시 해당 기본재산의 성격, 총 기본재산에서 차지하는 비중, 처분시 목적사업 수행가능성, 처분의 의도, 처분 후 사용용도 등에 대해 종합적이고 엄격한 심사를 수행한 후 신중하게 허가여부를 결정할 것<\/div><div class=\"ln p\">-법인의 기부받은 기본재산(부동산)에 대한 처분허가 검토 시, 아래의 요건에 모두 부합하는 경우에는 처분허가를 적극 검토하고, 허가 시에는 처분의 사용 용도에 맞게 사용되었는지를 확인할 수 있도록 처분 완료보고 등 허가조건을 부가할 것<\/div><div class=\"ln note\">※지침 시행일(’23.1.1.) 이전 3년 내에 기부받은 기본재산부터 적용<\/div><div class=\"ln p\">① ’20.1.1. 이후 기본재산에 편입된 부동산에 대한 처분허가 신청인지 확인(부동산 관련 등기부등본 확인)<\/div><div class=\"ln p\">② 기부자와 기부받은 법인이 처분에 대해 합의한 사실을 증빙할 수 있는 서류<\/div><div class=\"ln p\">③ 처분사유서 포함사항 확인(처분 의도, 구체적인 처분 사용 용도, 처분의 목적이 목적사업에 직접 사용하기 위한 것인지, 기부받은 재산이 현 상태에서는 목적사업에 직접 활용이 곤란한지 등)<\/div><div class=\"ln p\">나) 처분재산의 구체적 내용 확인<\/div><div class=\"ln p\">-처분재산목록은 2월 이내 발행된 등기부등본 등 관련 증빙서로 확인하고 처분재산의 현재 소유권 등을 확인<\/div><div class=\"ln p\">-등기부등본의 경우, 표제부(재산의 표시), 갑구(소유권, 가압류, 가처분 등 사항), 을구(저당권, 지상권, 전세권 등의 제한물건 설정사항)의 내용을 정밀 확인<\/div><div class=\"ln p\">➩ 처분허가 전에 기본재산을 기처분했는지 여부도 검토할 것<\/div><div class=\"ln p\">➩「지방자치단체를 당사자로 하는 계약에 관한 법률」에 따른 절차를 준수토록 지도할 것(재무회계규칙 제30조의2)<\/div><div class=\"ln p\">다) 이사회 결의의 적법성 검토 등<\/div><div class=\"ln p\">-이사회 소집의 적법성 확인(통보여부 등)과 이사회 회의록에 처분의 구체적 내용이 포함되고 참석이사 전원 및 감사의 날인 등 결의의 성립 등에 흠이 없는지 등을 확인<\/div><div class=\"ln p\">- 날인은 반드시 인감일 필요는 없으며, 기명란에 자필 서명 후 일반 날인 또는 기명란에 기명 후 날인 부분에 자필 서명도 가능<\/div><div class=\"pchip\" id=\"p57\"><span>원문 57쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=63\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) 처분허가 시 허가조건 부가<\/div><div class=\"ln p\">처분허가 시 기본재산 목록 변경에 따른 정관 변경 절차를 즉시 이행하도록 허가조건을 부가<\/div><div class=\"ln p\">- 기부받은 기본재산(부동산) 처분허가 시 처분의 사용 용도에 맞게 사용되었는지를 확인할 수 있도록 처분 완료보고 등 허가조건을 부가할 것<\/div><div class=\"ln h4\">4) 기본재산 처분허가의 예외<\/div><div class=\"ln p\">기본재산에 관한 임대계약을 기존 계약조건과 동일한 조건으로 갱신하는 경우는 기본재산 처분허가 사유에 해당하지 않음(법 제23조 단서 및 시행규칙 제14조)<\/div><div class=\"ln p\">-여기서 “기존 계약조건과 동일한 조건으로 갱신하는 경우”란 다른 조건의 변동없이 단순히 임대계약의 기간을 갱신하는 경우를 말함<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>기본재산 처분허가가 필요한 임대계약 사례<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">▲종전의 임차인이 아닌 다른 임차인에게 다시 임대하는 경우, ▲임대료 또는 임대기간을 종전 임대계약과는 다르게 정하여 종전의 임차인에게 다시 임대하는 경우 등은 기본재산 처분허가가 필요한 갱신임(법제처 해석례 [17-0694, 2018.2.14., 민원인] 참고)<\/td><\/tr><\/table><div class=\"ln p\">한시적으로 2025년 1월 1일부터 2026년 12월 31일까지의 기간 동안, 기본재산에 관한 임대계약을 기존 계약조건보다 차임 또는 보증금을 증액하여 갱신하는 경우는 기본재산 처분허가 사유에 해당하지 않음(법 제23조 단서 및 시행규칙 제14조)<\/div><table class=\"htbl\"><tr><td><\/td><td>Q&amp;A<\/td><td><\/td><td>기본재산 처분허가사유 해당 여부<\/td><td><\/td><\/tr><tr><td><\/td><td colspan=\"3\" rowspan=\"2\">Q: 기본재산이 현금인 경우 금융상품 가입을 위해 주무관청의 허가를 받은 후 만기가 도래하여 원금 변경없이 재가입하는 경우에도 기본재산 처분 허가 사유에 해당하는지?<br>A: 원금 변경없이 재가입하는 경우에는 기본재산 처분 허가 사유에 해당하지 않으며, 정관의 기본재산 목록 소재지에 정기예금 등으로 기재 가능<\/td><td rowspan=\"2\"><\/td><\/tr><tr><td><\/td><\/tr><tr><td><\/td><td colspan=\"3\"><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p58\"><span>원문 58쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=64\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">장기차입허가(법 제23조, 규칙 제15조)<\/div><div class=\"ln h4\">1) 장기차입허가 신청<\/div><div class=\"ln p\">사회복지법인이 기본재산을 담보로 장기차입하고자 하는 금액을 포함한 장기차입금의 총액이 기본재산 총액에서 차입당시의 부채총액을 공제한 금액의 100분의 5에 상당하는 금액이상을 장기차입하고자 할때에는 시･도지사의 허가를 받아야 함<\/div><div class=\"ln note\">※ 장기차입금이란 1년 이상 차입하는 부채를 의미<\/div><div class=\"ln p\">➩ (신규 장기차입금+기존 장기차입금) ≥ (기본재산총액-차입당시 부채총액)×5/100<\/div><div class=\"ln note\">※1년 이내 단기차입금의 만기를 연장하여 1년 이상 차입하는 경우에도 연장시점부터 장기차입금으로 간주하여 허가를 받아야 함<\/div><div class=\"ln p\">예)ⅰ)기본재산 10억, 부채총액 1억인 A법인이 시･도지사 허가없이 차입할 수 있는 장기차입금의 한도는 4,500만원 미만임<\/div><div class=\"ln p\">ⅱ)상기 A법인이 4,400만원을 장기차입한 후(시･도지사 허가를 받지 않아도 됨), 다시 110만원을 장기차입하려 할 경우에는 장기차입금의 총액이 4,500만원 이상이므로 반드시 시･도지사 허가를 받아야 함<\/div><div class=\"ln p\">상기의 금액 이상을 장기차입하고자 할 때에는 장기차입허가신청서(붙임 18)에 아래의 서류를 첨부하여 시･도지사에 제출하여야 함<\/div><div class=\"ln p\">-이사회회의록 사본 1부<\/div><div class=\"ln p\">-차입목적 또는 사유서(차입용도 포함) 1부<\/div><div class=\"ln p\">-상환계획서 1부<\/div><div class=\"ln h4\">2) 장기차입 허가시 참고사항<\/div><div class=\"ln p\">차입허가시 차입의 의도, 차입후 법인의 정상운영여부, 차입금의 사용처 등을 면밀히 검토하고, 특히 차입금의 상환이 가능한지 여부를 엄격하게 심사할 것<\/div><div class=\"ln note\">※ 장기차입허가시 차입에 대한 근거(담보제공)에 대해서는 별도로 기본재산처분허가 병행<\/div><div class=\"ln note\">※ 장기차입 허가에 대한 심사시, 종전의 차입금액 규모를 명확히 파악할 것<\/div><div class=\"pchip\" id=\"p59\"><span>원문 59쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=65\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">재산의 취득과 정관변경(법 제24조, 규칙 제16조)<\/div><div class=\"ln h4\">1) 재산의 취득<\/div><div class=\"ln p\">법인이 매수, 기부채납, 후원 등의 방법으로 재산을 취득한 때에는 지체 없이 이를 법인의 재산에 편입조치하고, 매년 3월말까지 전년도의 재산취득상황을 아래의 서류와 함께 시도지사에게 보고<\/div><div class=\"ln p\">-재산 취득사유서 1부<\/div><div class=\"ln p\">-취득한 재산의 종류, 수량 및 금액을 기재한 서류 1부<\/div><div class=\"ln p\">-취득한 재산의 등기부등본 또는 금융기관의 증명서 등 증빙서류 1부<\/div><div class=\"ln h4\">2) 정관의 변경<\/div><div class=\"ln p\">상기의 사유 등으로 법인의 재산이 증가하는 경우에도 재산이 감소했을 경우와 마찬가지로 지체 없이 정관을 변경하여 시도지사의 인가를 받아야 함<\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>기본재산 처분허가와는 별개로 정관변경허가도 필요하다는 판례<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">&lt;대법원 1969.7.22선고 67다568판결, 대법원 1978.7.25선고  78다783판결&gt;<br>기본재산을 감소하는 경우는 물론 이를 증가시키는 경우에도 반드시 그 정관의 기재사항에 변경을 초래한다 할 것이므로 이 두 경우에는 모두 정관의 변경이라 할 것이고 따라서 이러한 변경에는 주무관청의 인가를 받아야만 그 효력이 발생한다.<\/td><\/tr><\/table><div class=\"pchip\" id=\"p60\"><span>원문 60쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=66\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>사회복지법인의 농지소유 가능여부<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">농지소유의 원칙 : 「농지법」 제6조제1항에 따라 농업경영을 하는 자만 농지소유 가능<br>예외<br>-「농지법」 제6조제2항제2호 및 같은 법 시행규칙 제5조(별표2) 및 제6조에 따라 사회복지법인이 실습지로 농지를 취득하려는 경우 소관 중앙행정기관의 장(소관 사무에 관한 권한을 위임받은 자*를 포함)의 추천을 거쳐 농지소재지를 관할하는 시･도지사의 농지취득인정을 받는 경우 취득 가능<br><table class=\"htbl\"><tr><td>* 사회복지법인 관련 사무는 주무관청인 시･도지사가 수행하는 고유사무이며, 「행정권한의 위임 및 위탁에 관한 규정」 제34조의 농지취득추천권한의 시･도지사 위임규정이 삭제(’10.1.6.시행)됨에 따라, 시･도지사는 상기 규정 중 ‘소관 사무에 관한 권한을 위임받은 자’에 해당하지 않음<br>-이에, 사회복지법인 소관 중앙행정기관의 장인 보건복지부장관에게 추천권한이 있으므로 보건복지부에서는 사회복지법인의 주무관청인 시･도지사로부터 의견을 받아 종합검토 후 추천여부를 결정<\/td><\/tr><\/table><br>-「농지법」(법률 제8352호, 2007.4.11.) 부칙 제4조에 따라 1996.1.1. 당시 농지를 소유하고 있던 자는 계속 소유 가능<br><table class=\"htbl\"><tr><td colspan=\"3\">법령해석례<\/td><td>농지를 소유할 수 있는 사회복지법인의 범위[15-0756, 2016. 3. 23., 민원인]<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">【질의요지】<br>「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치하지 아니한 같은 조 제3호에 따른 사회복지법인으로서 사회복지시설을 설치한 자로부터 그 사회복지시설을 위탁받아 운영하는 사회복지법인이 「농지법」 제6조제2항제2호에 따라 농지를 소유할 수 있는 사회복지법인에 해당하는지?<br>【회답】<br>「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치하지 아니한 같은 조 제3호에 따른 사회복지법인으로서 사회복지시설을 설치한 자로부터 그 사회복지시설을 위탁받아 운영하는 사회복지법인은 「농지법」 제6조제2항제2호에 따라 농지를 소유할 수 있는 사회복지법인에 해당하지 않습니다.<\/td><\/tr><\/table><\/td><\/tr><\/table><div class=\"pchip\" id=\"p61\"><span>원문 61쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=67\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">수익사업(법 제28조)<\/div><div class=\"ln p\">법인은 목적사업의 경비에 충당하기 위하여 수익사업을 할 수 있음<\/div><div class=\"ln p\">-수익사업은 법인의 설립목적 수행에 지장이 없어야 함<\/div><div class=\"ln p\">-수익사업의 범위 및 종류는 비영리법인의 본질을 위배할 수 없음<\/div><div class=\"ln p\">-법인 설립목적 달성을 위한 법인내 인적, 물적 상황 등 제반여건을 충분히 고려하여 판단하여야 함<\/div><div class=\"ln p\">수익사업에서 발생한 수익은 법인 또는 법인이 설치한 사회복지시설의 운영에 한하여 사용하여야 함<\/div><div class=\"ln p\">-수익사업에 관한 회계는 법인회계나 시설의 시설회계와 구분하여야 함(재무회계규칙 제6조제2항)<\/div><div class=\"ln p\">수익사업은 정관에 명시하여야 하며(법 제17조제1항제8호), 수익사업의 수행을 위한 정관변경인가 요청이 있을 시에는 다음의 서류 등을 종합검토하여 인가여부 결정<\/div><div class=\"ln p\">-사업계획서 1부<\/div><div class=\"ln p\">-추정손익계산서 및 부속명세서 1부<\/div><div class=\"ln p\">-사업에 종사할 임원명부 1부<\/div><div class=\"ln p\">-해당 수익사업에 대한 허가사실증명원 1부(행정관청의 허가가 필요한 사업인 경우)<\/div><div class=\"ln p\">수익사업은 승인사항이 아니며, 정관변경인가 사항임에 유의<\/div><table class=\"htbl\"><tr><td colspan=\"3\">판례<\/td><td>수익사업으로 볼 수 있는 “수익”의 범위<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">&lt;서울행법 2002. 8. 2., 선고, 2001구16605, 판결：항소&gt;<br>그 사업이 수익사업에 해당하려면 적어도 그 사업 자체가 수익성을 가진 것이거나 수익을 목적으로 영위한 것이어야 하고, 수입금액이 적다는 이유만으로 그 사업의 수익성을 부정할 것은 아니지만, 그렇다고 하여 대가가 수수된다는 사정만으로 바로 그 사업에 수익성이 있어서 그 사업이 수익사업에 해당한다고 단정할 것은 아니며, 가사 대가가 수수된다고 하더라도, 그 대가가 객관적으로 보아 채산성(이는 ‘경영상, 수지나 손익을 따지거나 셈하여 이익이 나는 정도’라는 뜻이다.)을 고려함이 없이 책정된 것으로서 실비변상의 수준에 불과하고, 그리하여 당초부터 그 사업에서 이익이 생길 여지가 없다면, 그 사업은 수익성이 결여된 것으로서 수익사업에 해당하지 아니한다고 보아야 할 것<\/td><\/tr><\/table>", "pages": [{"p": 53, "t": "3\n기본재산 처분허가 등\n가\n기본재산 처분허가(법 제23조, 규칙 제14조)\n1) 기본재산 처분허가 신청\n기본재산의 매도, 증여, 교환, 임대, 담보제공 또는 용도변경하고자 할 때에는 반드시 시도지사의 처분허가를 받아야 함\n참고 | 처분허가 대상 정의\n |  | \n |  | 매도 : 재산권을 상대방에게 이전하고, 그 대금을 지급받는 것(「민법」 제563조 등) 증여 : 무상으로 재산을 상대방에게 수여하는 것(「민법」 제554조) * 다만, 사인증여, 상속은 자연인의 사망을 전제로 한 행위이므로 사회복지법인에서는 발생할 수 없음 교환 : 금전 이외의 재산권을 상호이전하는 것(「민법」 제596조) 임대 : 차임을 지급받고 목적물을 사용･수익하게 하는 것(「민법」 제618조) *다만, 「사회복지사업법」 제23조제3항제1호의 “임대”는 기본재산에 영향을 미치는 유･무상의 임대행위 자체로, 차임의 지급 약정없이 무상으로 목적물을 사용･수익하게 하는 무상임대는 기본재산 처분허가 대상임 담보제공 : 채무불이행 시 채무의 변제를 위한 보증행위로서, 채권자의 채권 확보를 보장하기 위해 그 재산에 제한물권 등을 설정하는 행위 용도변경 : 기본재산의 본래 용도를 변경하는 행위\n |  | \n | ‑도시계획 등으로 인해 의도치 않게 법인 기본재산 유형이 변경되는 경우에도 일반적인 기본재산처분 허가를 받아야 함 ‑기본재산처분으로 인하여 발생한 현금 등은 반드시 정관변경 후 기본재산으로 편입(도시계획 보상금 수령, 처분액 차이로 인한 이익금 등)하고 법인의 목적을 수행하기 위하여 사용할 경우 주무관청의 허가를 받아야 함. ※보상금의 이자 역시 기본재산 처분에 대한 반대급부로서 발생한 것이므로 지체없이 보상금과 관련된 과실(果實)을 즉시 정관상 기본재산으로 편입 하도록 기본재산 처분시 허가조건에 기재. 다만, 기본재산으로 편입한 이후에 발생한 이자는 “보통재산”으로 구분 가능. ‑기본재산 압류에 대한 임의･강제 경매 시 기본재산처분허가를 받아야 소유권 이전 가능 ‑청산･파산절차 진행 중, 채무변제를 위한 기본재산처분시에도 반드시 처분허가를 받아야만 함 ‑기본재산이 현금인 경우 금융상품에 가입하기 위하여는 반드시 주무관청의 허가 필요. 특히, 안정적인 수익창출이 아닌 방식으로서 「예금자보호법」에 따라 예금이 보장되지 않거나 원금의 손실이 발생할 수 있는 금융상품에 가입하는 경우 주무관청은 허가에 있어 신중을 기해야 함 ‑기본재산을 등가 또는 등가 이상의 다른 재산과 교환하는 경우 단순히 감정평가서상 평가금액에만 의존하지 말고 기본재산의 용도, 취득재산의 법인목적에 대한 적합성 등을 종합적으로 고려하여 판단하여야 함 ‑기본재산이 국가 등으로부터 보조금을 지원받아 취득한 재산으로 「보조금 관리에 관한 법률」 제35조제1항에 따른 ʻʻ중요재산ʼʼ인 경우, 「사회복지사업법」 제23조제3항에 따른 기본재산 처분허가와 별개로, 「보조금 관리에 관한 법률」 제35조제3항에 따라 해당 보조금을 교부한 시･도로부터 중요재산의 양도, 교환, 대여 및 담보 제공행위 등에 관한 승인이 필요함 *「보조금 관리에 관한 법률」 제35조제3항에 따라 중앙관서의 장(보건복지부장관)의 승인사항이나 「행정권한의 위임 및 위탁에 관한 규정」 제36조제3항제5호에 따라 시･도지사에 위임됨 *법인 관할 시･도와 보조금을 교부한 지자체가 다를 경우 법인 관할 시･도에서는 중요재산에 대한 기본재산 처분허가시, 보조금을 교부한 지자체의 의견을 들어 처리 | \n |  | "}, {"p": 54, "t": "판례 | 용도변경 해석 관련\n |  | \n |  | <대법원 2006.11.23., 선고, 2005도5511도 판결> 처분의 제한 대상으로서 ‘용도변경’은 ‘매도･증여･교환･임대･담보제공이 아닌 방법으로 사회복지법인의 기본재산을 처분하는 행위, 즉 기본재산의 현상에 변동을 일으키는 행위 중 위와 같은 입법목적을 침해할 우려가 있는 행위’라고 충분히 해석할 수 있다고 할 것\n처분허가 신청 시 기본재산처분허가신청서(붙임 18)에 아래의 서류를 첨부하여 시･도지사에게 제출하여야 하며, 이 경우 시･도지사는 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 개별공시지가 확인서를 확인하여야 함\n-기본재산 처분이유서 1부\n-기본재산의 처분을 결의한 이사회회의록 사본 1부(집합건물의 개별 호실 임대의 경우 전체 건물의 임대에 관해 결의한 이사회 회의록으로 갈음)\n-처분하는 기본재산의 명세서 1부\n-처분하는 기본재산의 감정평가서(교환의 경우에는 취득하는 재산의 감정평가서를 포함하며, 개별공시지가서 확인서로 첨부서류에 대한 정보를 확인할 수 있는 경우에는 그 확인으로 첨부서류를 갈음)\n※감정평가：당해 토지와 유사한 이용가치를 지닌다고 인정되는 표준지의 공시지가를 기준으로 하여야 한다. 다만, 적정한 실거래가가 있는 경우에는 이를 기준으로 할 수 있다. 담보권의 설정･경매 등은 당해 토지의 임대료･조성비용 등을 고려하여 감정평가를 할 수 있다(「감정평가 및 감정평가사에 관한 법률」 제3조)"}, {"p": 55, "t": "※개별공시지가：당해 토지와 유사한 이용가치를 지닌다고 인정되는 하나 또는 둘 이상의 표준지의 공시지가를 기준으로 토지가격비준표를 사용하여 사용한 지가(「부동산 가격공시에 관한 법률」 제10조제4항)\n※ 감정평가서와 개별공시지가의 유효기간은 1년임\n※ 건물멸실로 인한 기본재산 처분허가 신청시 감정평가서 제출을 제외할 수 있음\n시･도지사의 기본재산 처분허가를 받은 이후 기본재산을 처분하고, 처분이 완료되면 즉시 정관을 변경하고 인가를 받을 것\n판례 | 기본재산 처분 관련 참조 판례\n |  | \n |  | <대법원 2002.6.28. 선고 2000도20090 판결> 「사회복지사업법」 제32조에 의하여 사회복지법인에 관하여 준용되는 「공익법인의설립･운영에관한법률」 제1조, 제6조, 제7조, 그 밖에 위 각 법의 여러 규정을 아울러 살펴보면, 「공익법인의설립･운영에관한법률」 제7조에서 공익법인의 재산의 처분에 관한 사항 등을 이사회에서 심의결정한다고 한 것은 공익법인의 특수성을 고려하여 그 재산의 원활한 관리 및 유지 보호와 재정의 적정을 기함으로써 공익법인의 건전한 발달을 도모하고 공익법인으로 하여금 그 본래의 목적사업에 충실하게 하려는 데 그 목적이 있다 할 것이므로, 사회복지법인의 대표자가 이사회의 의결 없이 사회복지법인의 재산을 처분한 경우에 그 처분행위는 효력이 없다. <대법원 2006.11.23. 선고 2005도5511 판결> 사회복지법인의 기본재산을 용도변경 하는 경우 감독관청의 허가를 받도록 규정한 입법취지 및 용도변경이 용이한 현금의 특성상 인정되는 그 사용 용처의 적정성 여부에 대한 사전심사의 필요성 등에 비추어 볼 때 사회복지법인의 운영이나 기본재산의 처분과 관련된 용처에 기본재산을 사용하는 경우에도 감독관청의 허가를 받아야 할 필요가 있다고 할 것이므로 감독관청의 허가 없이 사회복지법인의 기본재산을 처분한 대가로 수령한 보상금을 사용한 행위는 사회상규에 위배되지 않는 정당행위라고 볼 수 없다. <대법원 2007.6.18. 자 2005마1193 결정> 「사회복지사업법」 제23조제3항제1호의 규정에 의하면 사회복지법인이 기본재산을 매도하기 위하여는 보건복지부장관의 허가를 받아야 하고, 이는 경매절차에 의한 매각의 경우에도 마찬가지라 할 것인바.(이하 생략)\n2) 기본재산 처분허가 시 검토사항\n가) 처분의 적정성 검토\n-사회복지법인에 출연된 재산 즉 기본재산은 바로 법인의 실체인 동시에 법인의 목적을 수행하기 위한 가장 기본적인 수단이므로 이를 처분한다는 것은 법인의 실체가 없어진다는 것을 의미하며 나아가서는 법인이 그 목적을 수행할 수 없게 된다는 것을 의미하므로,"}, {"p": 56, "t": "-기본재산 처분신청 시 해당 기본재산의 성격, 총 기본재산에서 차지하는 비중, 처분시 목적사업 수행가능성, 처분의 의도, 처분 후 사용용도 등에 대해 종합적이고 엄격한 심사를 수행한 후 신중하게 허가여부를 결정할 것\n-법인의 기부받은 기본재산(부동산)에 대한 처분허가 검토 시, 아래의 요건에 모두 부합하는 경우에는 처분허가를 적극 검토하고, 허가 시에는 처분의 사용 용도에 맞게 사용되었는지를 확인할 수 있도록 처분 완료보고 등 허가조건을 부가할 것\n※지침 시행일(’23.1.1.) 이전 3년 내에 기부받은 기본재산부터 적용\n① ’20.1.1. 이후 기본재산에 편입된 부동산에 대한 처분허가 신청인지 확인(부동산 관련 등기부등본 확인)\n② 기부자와 기부받은 법인이 처분에 대해 합의한 사실을 증빙할 수 있는 서류\n③ 처분사유서 포함사항 확인(처분 의도, 구체적인 처분 사용 용도, 처분의 목적이 목적사업에 직접 사용하기 위한 것인지, 기부받은 재산이 현 상태에서는 목적사업에 직접 활용이 곤란한지 등)\n나) 처분재산의 구체적 내용 확인\n-처분재산목록은 2월 이내 발행된 등기부등본 등 관련 증빙서로 확인하고 처분재산의 현재 소유권 등을 확인\n-등기부등본의 경우, 표제부(재산의 표시), 갑구(소유권, 가압류, 가처분 등 사항), 을구(저당권, 지상권, 전세권 등의 제한물건 설정사항)의 내용을 정밀 확인\n➩ 처분허가 전에 기본재산을 기처분했는지 여부도 검토할 것\n➩「지방자치단체를 당사자로 하는 계약에 관한 법률」에 따른 절차를 준수토록 지도할 것(재무회계규칙 제30조의2)\n다) 이사회 결의의 적법성 검토 등\n-이사회 소집의 적법성 확인(통보여부 등)과 이사회 회의록에 처분의 구체적 내용이 포함되고 참석이사 전원 및 감사의 날인 등 결의의 성립 등에 흠이 없는지 등을 확인\n- 날인은 반드시 인감일 필요는 없으며, 기명란에 자필 서명 후 일반 날인 또는 기명란에 기명 후 날인 부분에 자필 서명도 가능"}, {"p": 57, "t": "3) 처분허가 시 허가조건 부가\n처분허가 시 기본재산 목록 변경에 따른 정관 변경 절차를 즉시 이행하도록 허가조건을 부가\n- 기부받은 기본재산(부동산) 처분허가 시 처분의 사용 용도에 맞게 사용되었는지를 확인할 수 있도록 처분 완료보고 등 허가조건을 부가할 것\n4) 기본재산 처분허가의 예외\n기본재산에 관한 임대계약을 기존 계약조건과 동일한 조건으로 갱신하는 경우는 기본재산 처분허가 사유에 해당하지 않음(법 제23조 단서 및 시행규칙 제14조)\n-여기서 “기존 계약조건과 동일한 조건으로 갱신하는 경우”란 다른 조건의 변동없이 단순히 임대계약의 기간을 갱신하는 경우를 말함\n참고 | 기본재산 처분허가가 필요한 임대계약 사례\n |  | \n |  | ▲종전의 임차인이 아닌 다른 임차인에게 다시 임대하는 경우, ▲임대료 또는 임대기간을 종전 임대계약과는 다르게 정하여 종전의 임차인에게 다시 임대하는 경우 등은 기본재산 처분허가가 필요한 갱신임(법제처 해석례 [17-0694, 2018.2.14., 민원인] 참고)\n한시적으로 2025년 1월 1일부터 2026년 12월 31일까지의 기간 동안, 기본재산에 관한 임대계약을 기존 계약조건보다 차임 또는 보증금을 증액하여 갱신하는 경우는 기본재산 처분허가 사유에 해당하지 않음(법 제23조 단서 및 시행규칙 제14조)\n | Q&A |  | 기본재산 처분허가사유 해당 여부 | \n | Q: 기본재산이 현금인 경우 금융상품 가입을 위해 주무관청의 허가를 받은 후 만기가 도래하여 원금 변경없이 재가입하는 경우에도 기본재산 처분 허가 사유에 해당하는지? A: 원금 변경없이 재가입하는 경우에는 기본재산 처분 허가 사유에 해당하지 않으며, 정관의 기본재산 목록 소재지에 정기예금 등으로 기재 가능 | \n\n |  | "}, {"p": 58, "t": "나\n장기차입허가(법 제23조, 규칙 제15조)\n1) 장기차입허가 신청\n사회복지법인이 기본재산을 담보로 장기차입하고자 하는 금액을 포함한 장기차입금의 총액이 기본재산 총액에서 차입당시의 부채총액을 공제한 금액의 100분의 5에 상당하는 금액이상을 장기차입하고자 할때에는 시･도지사의 허가를 받아야 함\n※ 장기차입금이란 1년 이상 차입하는 부채를 의미\n➩ (신규 장기차입금+기존 장기차입금) ≥ (기본재산총액-차입당시 부채총액)×5/100\n※1년 이내 단기차입금의 만기를 연장하여 1년 이상 차입하는 경우에도 연장시점부터 장기차입금으로 간주하여 허가를 받아야 함\n예)ⅰ)기본재산 10억, 부채총액 1억인 A법인이 시･도지사 허가없이 차입할 수 있는 장기차입금의 한도는 4,500만원 미만임\nⅱ)상기 A법인이 4,400만원을 장기차입한 후(시･도지사 허가를 받지 않아도 됨), 다시 110만원을 장기차입하려 할 경우에는 장기차입금의 총액이 4,500만원 이상이므로 반드시 시･도지사 허가를 받아야 함\n상기의 금액 이상을 장기차입하고자 할 때에는 장기차입허가신청서(붙임 18)에 아래의 서류를 첨부하여 시･도지사에 제출하여야 함\n-이사회회의록 사본 1부\n-차입목적 또는 사유서(차입용도 포함) 1부\n-상환계획서 1부\n2) 장기차입 허가시 참고사항\n차입허가시 차입의 의도, 차입후 법인의 정상운영여부, 차입금의 사용처 등을 면밀히 검토하고, 특히 차입금의 상환이 가능한지 여부를 엄격하게 심사할 것\n※ 장기차입허가시 차입에 대한 근거(담보제공)에 대해서는 별도로 기본재산처분허가 병행\n※ 장기차입 허가에 대한 심사시, 종전의 차입금액 규모를 명확히 파악할 것"}, {"p": 59, "t": "다\n재산의 취득과 정관변경(법 제24조, 규칙 제16조)\n1) 재산의 취득\n법인이 매수, 기부채납, 후원 등의 방법으로 재산을 취득한 때에는 지체 없이 이를 법인의 재산에 편입조치하고, 매년 3월말까지 전년도의 재산취득상황을 아래의 서류와 함께 시도지사에게 보고\n-재산 취득사유서 1부\n-취득한 재산의 종류, 수량 및 금액을 기재한 서류 1부\n-취득한 재산의 등기부등본 또는 금융기관의 증명서 등 증빙서류 1부\n2) 정관의 변경\n상기의 사유 등으로 법인의 재산이 증가하는 경우에도 재산이 감소했을 경우와 마찬가지로 지체 없이 정관을 변경하여 시도지사의 인가를 받아야 함\n판례 | 기본재산 처분허가와는 별개로 정관변경허가도 필요하다는 판례\n |  | \n |  | <대법원 1969.7.22선고 67다568판결, 대법원 1978.7.25선고  78다783판결> 기본재산을 감소하는 경우는 물론 이를 증가시키는 경우에도 반드시 그 정관의 기재사항에 변경을 초래한다 할 것이므로 이 두 경우에는 모두 정관의 변경이라 할 것이고 따라서 이러한 변경에는 주무관청의 인가를 받아야만 그 효력이 발생한다."}, {"p": 60, "t": "참고 | 사회복지법인의 농지소유 가능여부\n |  | \n |  | 농지소유의 원칙 : 「농지법」 제6조제1항에 따라 농업경영을 하는 자만 농지소유 가능 예외 -「농지법」 제6조제2항제2호 및 같은 법 시행규칙 제5조(별표2) 및 제6조에 따라 사회복지법인이 실습지로 농지를 취득하려는 경우 소관 중앙행정기관의 장(소관 사무에 관한 권한을 위임받은 자*를 포함)의 추천을 거쳐 농지소재지를 관할하는 시･도지사의 농지취득인정을 받는 경우 취득 가능 * 사회복지법인 관련 사무는 주무관청인 시･도지사가 수행하는 고유사무이며, 「행정권한의 위임 및 위탁에 관한 규정」 제34조의 농지취득추천권한의 시･도지사 위임규정이 삭제(’10.1.6.시행)됨에 따라, 시･도지사는 상기 규정 중 ‘소관 사무에 관한 권한을 위임받은 자’에 해당하지 않음 -이에, 사회복지법인 소관 중앙행정기관의 장인 보건복지부장관에게 추천권한이 있으므로 보건복지부에서는 사회복지법인의 주무관청인 시･도지사로부터 의견을 받아 종합검토 후 추천여부를 결정 -「농지법」(법률 제8352호, 2007.4.11.) 부칙 제4조에 따라 1996.1.1. 당시 농지를 소유하고 있던 자는 계속 소유 가능 법령해석례 | 농지를 소유할 수 있는 사회복지법인의 범위[15-0756, 2016. 3. 23., 민원인]\n |  | \n |  | 【질의요지】 「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치하지 아니한 같은 조 제3호에 따른 사회복지법인으로서 사회복지시설을 설치한 자로부터 그 사회복지시설을 위탁받아 운영하는 사회복지법인이 「농지법」 제6조제2항제2호에 따라 농지를 소유할 수 있는 사회복지법인에 해당하는지? 【회답】 「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치하지 아니한 같은 조 제3호에 따른 사회복지법인으로서 사회복지시설을 설치한 자로부터 그 사회복지시설을 위탁받아 운영하는 사회복지법인은 「농지법」 제6조제2항제2호에 따라 농지를 소유할 수 있는 사회복지법인에 해당하지 않습니다."}, {"p": 61, "t": "라\n수익사업(법 제28조)\n법인은 목적사업의 경비에 충당하기 위하여 수익사업을 할 수 있음\n-수익사업은 법인의 설립목적 수행에 지장이 없어야 함\n-수익사업의 범위 및 종류는 비영리법인의 본질을 위배할 수 없음\n-법인 설립목적 달성을 위한 법인내 인적, 물적 상황 등 제반여건을 충분히 고려하여 판단하여야 함\n수익사업에서 발생한 수익은 법인 또는 법인이 설치한 사회복지시설의 운영에 한하여 사용하여야 함\n-수익사업에 관한 회계는 법인회계나 시설의 시설회계와 구분하여야 함(재무회계규칙 제6조제2항)\n수익사업은 정관에 명시하여야 하며(법 제17조제1항제8호), 수익사업의 수행을 위한 정관변경인가 요청이 있을 시에는 다음의 서류 등을 종합검토하여 인가여부 결정\n-사업계획서 1부\n-추정손익계산서 및 부속명세서 1부\n-사업에 종사할 임원명부 1부\n-해당 수익사업에 대한 허가사실증명원 1부(행정관청의 허가가 필요한 사업인 경우)\n수익사업은 승인사항이 아니며, 정관변경인가 사항임에 유의\n판례 | 수익사업으로 볼 수 있는 “수익”의 범위\n |  | \n |  | <서울행법 2002. 8. 2., 선고, 2001구16605, 판결：항소> 그 사업이 수익사업에 해당하려면 적어도 그 사업 자체가 수익성을 가진 것이거나 수익을 목적으로 영위한 것이어야 하고, 수입금액이 적다는 이유만으로 그 사업의 수익성을 부정할 것은 아니지만, 그렇다고 하여 대가가 수수된다는 사정만으로 바로 그 사업에 수익성이 있어서 그 사업이 수익사업에 해당한다고 단정할 것은 아니며, 가사 대가가 수수된다고 하더라도, 그 대가가 객관적으로 보아 채산성(이는 ‘경영상, 수지나 손익을 따지거나 셈하여 이익이 나는 정도’라는 뜻이다.)을 고려함이 없이 책정된 것으로서 실비변상의 수준에 불과하고, 그리하여 당초부터 그 사업에서 이익이 생길 여지가 없다면, 그 사업은 수익성이 결여된 것으로서 수익사업에 해당하지 아니한다고 보아야 할 것"}]}, {"title": "4. 법인의 소멸(합병포함)", "start": 62, "end": 68, "html": "<div class=\"pchip\" id=\"p62\"><span>원문 62쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=68\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>법인의 소멸(합병포함)<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">법인소멸의 의의<\/div><div class=\"ln p\">1)법인의 소멸은 해산과 청산의 절차로 행해지는데 주의해야 할 점은 해산으로 법인의 권리능력이 곧 전적으로 소멸하지 않으며 청산의 종결로 법인은 완전히 소멸<\/div><div class=\"ln p\">➩ 先 해산, 後 청산<\/div><div class=\"ln note\">※해산이라 함은 법인이 본래의 적극적 활동을 정지하고 청산절차에 들어가는 것을 말하며, 청산은 해산한 법인의 재산관계를 정리하는 절차<\/div><div class=\"ln p\">2)해산 후 법인의 권리능력이 곧바로 소멸되는 것이 아니라 청산이 종결될 때까지 법인은 제한된 범위에서 권리능력을 가지며, 해산 후 청산종결까지 존속하는 법인을 청산법인(淸算法人)이라고 함<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">법인해산(解散)의 사유(「민법」 제77조)<\/div><div class=\"ln h4\">1) 존재기간의 만료 기타 정관에 정한 해산사유의 발생<\/div><div class=\"ln h4\">2) 파산(「민법」 제79조)<\/div><div class=\"ln p\">법인이 채무를 변제할 수 없는 상태, 즉 채무초과(부채 〉자산)가 된 때에는 이사는 지체없이 파산을 신청해야 함<\/div><div class=\"ln note\">※법인의 파산원인은 단순한 채무초과로써 충분(「채무자 회생 및 파산에 관한 법률」 제306조)하며 자연인과 같이 채무변재능력 등은 고려하지 않음<\/div><div class=\"ln p\">➩법인은 채무초과상태 즉시 파산절차에 돌입하므로 법인의 채무가 자산을 초과하지 않도록 시도 및 시･군･구 담당자는 최소 1년에 1회 정도 법인의 재무상태를 점검할 것<\/div><div class=\"pchip\" id=\"p63\"><span>원문 63쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=69\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) 설립허가의 취소(법 제26조)<\/div><div class=\"ln p\">필요적 설립허가 취소사유(반드시 취소해야 함)<\/div><div class=\"ln p\">-거짓이나 그 밖의 부정한 방법으로 설립허가를 받았을 때<\/div><div class=\"ln p\">-법인 설립 후 기본재산을 출연하지 아니한 때<\/div><div class=\"ln p\">임의적 설립허가 취소사유<\/div><div class=\"ln p\">-설립허가 조건에 위반한 때<\/div><div class=\"ln p\">➝ 공익법인법 제4조, 공익법인법 시행령 제6조에 따른 허가조건 참고(p.25 참고)<\/div><div class=\"ln p\">-목적달성이 불가능하게 된 때<\/div><div class=\"ln p\">➝시설폐쇄, 기본재산 소멸, 이사회 소멸 등으로 정관상 목적사업 수행이 사실상 불가능할 때<\/div><div class=\"ln p\">-목적사업외의 사업을 한 때<\/div><div class=\"ln p\">➝정관변경 인가 없이 수익사업을 수행하는 경우, 사회복지사업 이외의 사업을 수행하는 경우, 지원법인이 정관변경 인가 없이 시설을 운영하는 경우 등<\/div><div class=\"ln p\">-정당한 사유없이 설립허가를 받은 날부터 6월이내에 목적사업을 개시하지 아니하거나 1년 이상 사업실적이 없을 때<\/div><div class=\"ln p\">-법인이 운영하는 시설에서 반복적 또는 집단적 성폭력 범죄 및 학대관련범죄가 발생한 때<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>취소사유 적용 시점<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">※기존 「사회복지사업법」 제26조제1항제6호에서는 설립허가 취소사유로 “법인이 운영하는 시설에서 반복적 또는 집단적 성폭력범죄가 발생한 때”를 규정하였으나, 개정 법령에서는 학대관련범죄를 추가<br>→ 시행일(’19.7.16.) 후 최초로 사회복지법인이 운영하는 시설에서 반복적 또는 집단적인 학대관련범죄가 발생한 경우부터 적용<\/td><\/tr><\/table><div class=\"ln p\">- 법인이 운영하는 시설에서 중대하고 반복적인 회계부정이나 불법행위가 발생한 때(법 제26조제1항 6의2호 신설(’23.8.16.), 시행(’24.2.17.))<\/div><div class=\"ln p\">-대표이사를 포함한 이사 7명과 감사 2명 이상을 선임하지 아니한 때<\/div><div class=\"ln p\">-외부추천이사 선임과 관련된 사항을 위반하여 이사를 선임한 때<\/div><div class=\"ln p\">-임원의 해임명령을 이행하지 아니한 때<\/div><div class=\"ln p\">-기타 「사회복지사업법」 또는 「사회복지사업법」에 의한 명령이나 정관에 위반한 때<\/div><div class=\"pchip\" id=\"p64\"><span>원문 64쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=70\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">➝법인운영에 중대한 사항에 대한 법, 명령, 정관 위반, 동일한 사항을 3회 이상 지속적으로 위반하는 경우, 시정명령을 3회 이상 지속적으로 거부하는 등 정상적 법인운영이 어려울 경우<\/div><div class=\"ln note\">※법 제26조에 따르면 동법 제1항 각호에 따른 허가취소 사유가 발생한 경우, 다른 방법으로 감독목적을 달성할 수 없거나 시정을 명한 후 6월 이내에 법인이 이를 이행하지 아니한 경우에 한하도록 규정하고 있으나, 거짓 등으로 설립허가를 받았거나 및 기본재산을 미출연한 경우는 시정명령 없이 설립허가 취소함<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">청산(淸算)<\/div><div class=\"ln h4\">1) 청산의 의의<\/div><div class=\"ln p\">청산이란 해산한 법인이 처리되지 않고 남은 사무를 처리하고 재산을 정리하여 완전히 소멸할 때까지의 절차<\/div><div class=\"ln p\">청산은 ① 파산으로 해산하는 경우의 청산과 ② 파산이외의 원인에 의해 해산하는 경우의 청산이 있음<\/div><div class=\"ln p\">①파산으로 해산 ➝ 「채무자 회생 및 파산에 관한 법률」이 정하는 절차에 따라 청산<\/div><div class=\"ln p\">② 파산이외의 원인에 의한 해산 ➝ 「민법」이 규정하는 청산절차<\/div><div class=\"ln note\">※청산절차는 그 어느 것이나 모두 제3자의 이해관계에 중대한 영향을 미치기 때문에 이에 관한 규정은 강행규정임. 따라서, 정관에서 다른 규정을 하고 있더라도 그것은 효력이 없음<\/div><div class=\"ln h4\">2) 청산법인<\/div><div class=\"ln p\">가)청산법인은 청산의 목적범위 내에서만 권리를 행사하고 의무를 부담(「민법」 제81조)<\/div><div class=\"ln p\">나) 청산법인의 기관<\/div><div class=\"ln p\">법인이 해산하면 이사는 그 지위를 당연히 상실하며 이사에 갈음하여 청산인이 청산법인의 집행기관이 됨<\/div><div class=\"ln p\">청산인은 청산법인의 능력의 범위내에서 내부의 사무를 집행하고 외부에 대하여 청산법인을 대표<\/div><div class=\"pchip\" id=\"p65\"><span>원문 65쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=71\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">이사를 제외한 기타의 기관에는 변동이 없으며 계속하여 청산법인의 기관으로서 종전과 마찬가지의 권한을 가짐<\/div><div class=\"ln p\">예) 법인의 감사는 계속하여 청산법인의 직무를 감독<\/div><div class=\"ln p\">다) 청산인<\/div><div class=\"ln p\">청산인의 자격(「민법」 제82조, 제83조)<\/div><div class=\"ln p\">-정관에서 정한자<\/div><div class=\"ln p\">-정관에서 정하지 않으면 이사회의 의결로 선임<\/div><div class=\"ln p\">-이사회가 선임하지 않은 경우에는 대표이사<\/div><div class=\"ln p\">-위에 해당하는 자가 없거나 청산인의 결원으로 인하여 손해가 생길 염려가 있는 때에는 법원이 직권 또는 이해관계인이나 검사의 청구에 의해 청산인을 선임<\/div><div class=\"ln p\">➝중요한 사유가 있는 때에는 법인은 직권 또는 이해관계인이나 검사의 청구에 의하여 청산인 해임가능(「민법」 제84조)<\/div><div class=\"ln p\">청산인의 직무<\/div><div class=\"ln p\">① 해산의 등기와 신고(「민법」 제85조, 제86조)<\/div><div class=\"ln p\">∙청산인은 파산의 경우를 제외하고는 취임후 3주내에 해산의 사유 및 년월일, 청산인의 성명 및 주소와 청산인의 대표권을 제한한 때에는 그 제한을 주된 사무소 및 분사무소 소재지에 등기하여야 함<\/div><div class=\"ln p\">∙해산등기사항에 변경이 생기면 기존 정관변경절차와 동일하게(「민법」 제52조) 3주내 변경등기를 해야 함<\/div><div class=\"ln p\">∙청산인은 취임 후 3주내에 상기사항 시･도지사에 신고하고, 해산등기사항에 변경이 생겨 변경등기를 한 경우에도 3주내에 시･도지사에 신고할 것<\/div><table class=\"htbl\"><tr><td colspan=\"3\">참고<\/td><td>파산에 의한 청산<\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\"><\/td><\/tr><tr><td><\/td><td><\/td><td colspan=\"2\">파산에 의한 청산에 있어서는 등기는 법원이 직권으로 등기소에 촉탁하고(「채무자 회생 및 파산에 관한 법률」 제23조), 주무관청에 법원이 통지하므로(「채무자 회생 및 파산에 관한 법률」 제314조) 청산법인은 등기신청이나 신고할 필요가 없음<\/td><\/tr><\/table><div class=\"ln p\">② 현존사무의 종결(「민법」 제87조)<\/div><div class=\"pchip\" id=\"p66\"><span>원문 66쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=72\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">③ 채권의 추심(「민법」 제87조)<\/div><div class=\"ln p\">∙회수할 수 있는 채권은 적극적으로 추심하여 회수하고, 변제기가 아직 닥쳐오지 않은 채권이나, 조건부 채권과 같이 즉시로 추심할 수 없는 채권은 적당한 방법으로 환가할 것<\/div><div class=\"ln p\">④ 채무의 변제(「민법」 제87조)<\/div><div class=\"ln p\">a) 채권신고의 독촉(「민법」 제88조, 제89조)<\/div><div class=\"ln p\">∙청산인은 취임한 날로부터 2개월내에 3회 이상 공고로 일반채권자에 대해 일정한 기간내에 그의 채권을 신고할 것을 최고하여야 함(단 신고기간은 2개월 이상으로 정함)<\/div><div class=\"ln p\">∙상기 공고에는 채권자가 기간내에 신고하지 않으면 청산으로부터 제외된다는 것을 표시하여야 하며 공고는 법원의 등기사항의 공고와 동일한 방법으로 행해야 함<\/div><div class=\"ln p\">∙청산인이 알고 있는 채권자에 대하여는 개별적으로 채권을 신고할 것을 최고하여야 함(개별통보 할 것)<\/div><div class=\"ln p\">b) 변제(「민법」 제89조, 제90조, 제91조, 제92조)<\/div><div class=\"ln p\">∙청산인은 상기 채권신고기간내에는 채권자에게 변제하지 못하나 이로 인해 채권자에 대한 지연손해배상책임 의무를 면하지 못함<\/div><div class=\"ln p\">∙청산중의 법인은 아직 변제기가 닥쳐오지 않은 채권에 대해서도 변제할 수 있음. 단, 조건있는 채권, 존속기간의 명확하지 않은 채권 기타 가액이 명확하지 않은 채권에 관하여는 법원이 선임한 감정인의 평가에 의하여 변제<\/div><div class=\"ln p\">∙채권신고기간 내에 신고하지 않은 채권자는 청산에서 제외되고 법인의 채무를 완제한 후 귀속권리자에게 인도하지 않은 재산에 대해서만 변제를 청구할 수 있음<\/div><div class=\"ln p\">∙청산인이 알고 있는 채권자에 대해서는 신고하지 않았더라도 청산에서 제외하지 못하며 꼭 변제해야 함 만일, 채권자가 변제를 수령하지 않으면 공탁하여야 함(「민법」 487조)<\/div><div class=\"ln p\">⑤ 잔여재산의 처리(법 제27조, 영 제10조의6)<\/div><div class=\"ln p\">∙해산한 법인의 잔여재산은 정관이 정하는 바에 의하여 국가 또는 지방자치단체에 귀속됨<\/div><div class=\"pchip\" id=\"p67\"><span>원문 67쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=73\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">∙국가 또는 지자체에 귀속된 재산은 ⅰ) 사회복지사업에 사용하거나 ⅱ) 유사한 목적을 가진 법인에게 무상으로 대부하거나 무상으로 사용･수익하게 할 수 있음<\/div><div class=\"ln note\">※해산한 법인의 이사 본인 및 그와 “특별한 관계에 있는 자” 가 이사로 있는 법인에 대하여는 무상으로 대부･사용･수익하게 할 수 없음<\/div><div class=\"ln p\">⑥ 파산신청(「민법」 제93조)<\/div><div class=\"ln p\">∙청산절차를 밟고 있는 도중에 법인의 재산이 그 채무를 완제하기에 부족하다는 것이 분명하게 된 때(즉 채무초과 상태)에는 청산인이 지체없이 파산신고를 신청하고 이를 공고해야 함<\/div><div class=\"ln p\">∙법인의 파산으로 파산관재인이 정해지면 청산인은 파산관재인에게 사무를 인계하여야 하며, 인계함으로써 그 임무가 종료<\/div><div class=\"ln p\">⑦ 청산종결의 등기와 신고(「민법」 제94조)<\/div><div class=\"ln p\">∙청산이 종결한 때에는 청산인은 3주내 이를 등기하고 주무관청에 신고하여야 함<\/div><div class=\"ln note\">※청산･파산절차 진행 중, 채무변제를 위한 기본재산처분시에도 반드시 기본재산처분허가를 받아야만 함<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">법인의 합병(법 제30조, 영 제11조, 규칙 제19조)<\/div><div class=\"ln p\">2개 이상 법인이 합병하고자 할 때에는 합병되는 형태에 따라 법인합병허가신청서(붙임 20)에 아래의 서류를 첨부하여 시･도지사의 허가를 받아야 함(시･도가 다른 경우에는 보건복지부장관 허가)<\/div><div class=\"ln p\">법인 합병시 합병 후 존속하는 법인 또는 합병에 의해 설립된 법인은 합병에 의해 소멸된 법인의 지위를 승계하고, 합병후 신설법인 설립시에는 관계 법인이 각각 5인씩 지명하는 설립위원이 정관을 작성하는 등 법인설립업무를 공동처리<\/div><div class=\"ln h4\">1) 합병 후 존속(A+B=A)<\/div><div class=\"ln p\">-A법인이 B법인을 흡수하는 형태의 합병시 아래의 서류를 구비하여 A법인의 주사무소가 위치하는 시･도지사의 허가를 받을 것<\/div><div class=\"ln note\">※ 법인합병허가신청서에 첨부해야 할 서류<\/div><div class=\"ln p\">∙관계법인의 합병결의서, 정관, 재산목록 및 재무상태표 각 1부<\/div><div class=\"ln p\">∙정관변경안 1부<\/div><div class=\"ln p\">∙사업계획서, 예산서 및 재산의 소유를 증명할 수 있는 서류 각 1부<\/div><div class=\"ln p\">∙재산의 평가조서 및 재산수익 조서 각 1부<\/div><div class=\"pchip\" id=\"p68\"><span>원문 68쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=74\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">-B법인의 사무소를 존속하고자 하는 경우에는 분사무소 설치절차와 동일하게 처리할 것<\/div><div class=\"ln p\">-B법인이 시설법인일 경우<\/div><div class=\"ln p\">① B법인을 흡수한 A법인이 더 이상 시설운영이 불가능할 경우A법인은 법 제38조 및 규칙 제26조에 의거 시설폐지 3개월 전까지 시설폐지신고서를 관할 시･군･구청장에게 제출하고 시설거주자에 대한 전원 및 귀가조치를 관할 시･군･구청장과 협의하여 시행해야 함<\/div><div class=\"ln p\">②B법인을 흡수한 A법인이 계속 시설을 운영하고자 하는 경우시설운영자가 B법인에서 A법인으로 바뀌었기 때문에 운영자변경에 대해 관한 시･군･구청에 변경신고를 하고 계속 운영<\/div><div class=\"ln h4\">2) 합병 후 신설법인 설립(A+B=C)<\/div><div class=\"ln p\">-A법인과 B법인이 합병하여 신규 C법인을 설립하는 경우에는 아래의 서류를 완비하여 C법인의 주사무소가 위치할 시･도지사의 허가를 받을 것(나머지 사항은 “1) 합병 후 존속”과 동일)<\/div><div class=\"ln note\">※ 법인합병허가신청서에 첨부해야 할 서류<\/div><div class=\"ln p\">∙합병취지서, 재산목록 및 재무상태표 1부<\/div><div class=\"ln p\">∙합병 당해 연도 및 다음 연도의 사업계획서 및 예산서 각 1부<\/div><div class=\"ln p\">∙규칙 제7조제2항제2호부터 제9호까지의 서류 각 1부<\/div><div class=\"ln note\">※A법인과 B법인의 주사무소가 다른 시도일 경우 보건복지부장관에게 허가를 받고, 보건복지부장관은 허가 후 C법인의 주사무소가 위치할 시･도지사에게 통보<\/div>", "pages": [{"p": 62, "t": "4\n법인의 소멸(합병포함)\n가\n법인소멸의 의의\n1)법인의 소멸은 해산과 청산의 절차로 행해지는데 주의해야 할 점은 해산으로 법인의 권리능력이 곧 전적으로 소멸하지 않으며 청산의 종결로 법인은 완전히 소멸\n➩ 先 해산, 後 청산\n※해산이라 함은 법인이 본래의 적극적 활동을 정지하고 청산절차에 들어가는 것을 말하며, 청산은 해산한 법인의 재산관계를 정리하는 절차\n2)해산 후 법인의 권리능력이 곧바로 소멸되는 것이 아니라 청산이 종결될 때까지 법인은 제한된 범위에서 권리능력을 가지며, 해산 후 청산종결까지 존속하는 법인을 청산법인(淸算法人)이라고 함\n나\n법인해산(解散)의 사유(「민법」 제77조)\n1) 존재기간의 만료 기타 정관에 정한 해산사유의 발생\n2) 파산(「민법」 제79조)\n법인이 채무를 변제할 수 없는 상태, 즉 채무초과(부채 〉자산)가 된 때에는 이사는 지체없이 파산을 신청해야 함\n※법인의 파산원인은 단순한 채무초과로써 충분(「채무자 회생 및 파산에 관한 법률」 제306조)하며 자연인과 같이 채무변재능력 등은 고려하지 않음\n➩법인은 채무초과상태 즉시 파산절차에 돌입하므로 법인의 채무가 자산을 초과하지 않도록 시도 및 시･군･구 담당자는 최소 1년에 1회 정도 법인의 재무상태를 점검할 것"}, {"p": 63, "t": "3) 설립허가의 취소(법 제26조)\n필요적 설립허가 취소사유(반드시 취소해야 함)\n-거짓이나 그 밖의 부정한 방법으로 설립허가를 받았을 때\n-법인 설립 후 기본재산을 출연하지 아니한 때\n임의적 설립허가 취소사유\n-설립허가 조건에 위반한 때\n➝ 공익법인법 제4조, 공익법인법 시행령 제6조에 따른 허가조건 참고(p.25 참고)\n-목적달성이 불가능하게 된 때\n➝시설폐쇄, 기본재산 소멸, 이사회 소멸 등으로 정관상 목적사업 수행이 사실상 불가능할 때\n-목적사업외의 사업을 한 때\n➝정관변경 인가 없이 수익사업을 수행하는 경우, 사회복지사업 이외의 사업을 수행하는 경우, 지원법인이 정관변경 인가 없이 시설을 운영하는 경우 등\n-정당한 사유없이 설립허가를 받은 날부터 6월이내에 목적사업을 개시하지 아니하거나 1년 이상 사업실적이 없을 때\n-법인이 운영하는 시설에서 반복적 또는 집단적 성폭력 범죄 및 학대관련범죄가 발생한 때\n참고 | 취소사유 적용 시점\n |  | \n |  | ※기존 「사회복지사업법」 제26조제1항제6호에서는 설립허가 취소사유로 “법인이 운영하는 시설에서 반복적 또는 집단적 성폭력범죄가 발생한 때”를 규정하였으나, 개정 법령에서는 학대관련범죄를 추가 → 시행일(’19.7.16.) 후 최초로 사회복지법인이 운영하는 시설에서 반복적 또는 집단적인 학대관련범죄가 발생한 경우부터 적용\n- 법인이 운영하는 시설에서 중대하고 반복적인 회계부정이나 불법행위가 발생한 때(법 제26조제1항 6의2호 신설(’23.8.16.), 시행(’24.2.17.))\n-대표이사를 포함한 이사 7명과 감사 2명 이상을 선임하지 아니한 때\n-외부추천이사 선임과 관련된 사항을 위반하여 이사를 선임한 때\n-임원의 해임명령을 이행하지 아니한 때\n-기타 「사회복지사업법」 또는 「사회복지사업법」에 의한 명령이나 정관에 위반한 때"}, {"p": 64, "t": "➝법인운영에 중대한 사항에 대한 법, 명령, 정관 위반, 동일한 사항을 3회 이상 지속적으로 위반하는 경우, 시정명령을 3회 이상 지속적으로 거부하는 등 정상적 법인운영이 어려울 경우\n※법 제26조에 따르면 동법 제1항 각호에 따른 허가취소 사유가 발생한 경우, 다른 방법으로 감독목적을 달성할 수 없거나 시정을 명한 후 6월 이내에 법인이 이를 이행하지 아니한 경우에 한하도록 규정하고 있으나, 거짓 등으로 설립허가를 받았거나 및 기본재산을 미출연한 경우는 시정명령 없이 설립허가 취소함\n다\n청산(淸算)\n1) 청산의 의의\n청산이란 해산한 법인이 처리되지 않고 남은 사무를 처리하고 재산을 정리하여 완전히 소멸할 때까지의 절차\n청산은 ① 파산으로 해산하는 경우의 청산과 ② 파산이외의 원인에 의해 해산하는 경우의 청산이 있음\n①파산으로 해산 ➝ 「채무자 회생 및 파산에 관한 법률」이 정하는 절차에 따라 청산\n② 파산이외의 원인에 의한 해산 ➝ 「민법」이 규정하는 청산절차\n※청산절차는 그 어느 것이나 모두 제3자의 이해관계에 중대한 영향을 미치기 때문에 이에 관한 규정은 강행규정임. 따라서, 정관에서 다른 규정을 하고 있더라도 그것은 효력이 없음\n2) 청산법인\n가)청산법인은 청산의 목적범위 내에서만 권리를 행사하고 의무를 부담(「민법」 제81조)\n나) 청산법인의 기관\n법인이 해산하면 이사는 그 지위를 당연히 상실하며 이사에 갈음하여 청산인이 청산법인의 집행기관이 됨\n청산인은 청산법인의 능력의 범위내에서 내부의 사무를 집행하고 외부에 대하여 청산법인을 대표"}, {"p": 65, "t": "이사를 제외한 기타의 기관에는 변동이 없으며 계속하여 청산법인의 기관으로서 종전과 마찬가지의 권한을 가짐\n예) 법인의 감사는 계속하여 청산법인의 직무를 감독\n다) 청산인\n청산인의 자격(「민법」 제82조, 제83조)\n-정관에서 정한자\n-정관에서 정하지 않으면 이사회의 의결로 선임\n-이사회가 선임하지 않은 경우에는 대표이사\n-위에 해당하는 자가 없거나 청산인의 결원으로 인하여 손해가 생길 염려가 있는 때에는 법원이 직권 또는 이해관계인이나 검사의 청구에 의해 청산인을 선임\n➝중요한 사유가 있는 때에는 법인은 직권 또는 이해관계인이나 검사의 청구에 의하여 청산인 해임가능(「민법」 제84조)\n청산인의 직무\n① 해산의 등기와 신고(「민법」 제85조, 제86조)\n∙청산인은 파산의 경우를 제외하고는 취임후 3주내에 해산의 사유 및 년월일, 청산인의 성명 및 주소와 청산인의 대표권을 제한한 때에는 그 제한을 주된 사무소 및 분사무소 소재지에 등기하여야 함\n∙해산등기사항에 변경이 생기면 기존 정관변경절차와 동일하게(「민법」 제52조) 3주내 변경등기를 해야 함\n∙청산인은 취임 후 3주내에 상기사항 시･도지사에 신고하고, 해산등기사항에 변경이 생겨 변경등기를 한 경우에도 3주내에 시･도지사에 신고할 것\n참고 | 파산에 의한 청산\n |  | \n |  | 파산에 의한 청산에 있어서는 등기는 법원이 직권으로 등기소에 촉탁하고(「채무자 회생 및 파산에 관한 법률」 제23조), 주무관청에 법원이 통지하므로(「채무자 회생 및 파산에 관한 법률」 제314조) 청산법인은 등기신청이나 신고할 필요가 없음\n② 현존사무의 종결(「민법」 제87조)"}, {"p": 66, "t": "③ 채권의 추심(「민법」 제87조)\n∙회수할 수 있는 채권은 적극적으로 추심하여 회수하고, 변제기가 아직 닥쳐오지 않은 채권이나, 조건부 채권과 같이 즉시로 추심할 수 없는 채권은 적당한 방법으로 환가할 것\n④ 채무의 변제(「민법」 제87조)\na) 채권신고의 독촉(「민법」 제88조, 제89조)\n∙청산인은 취임한 날로부터 2개월내에 3회 이상 공고로 일반채권자에 대해 일정한 기간내에 그의 채권을 신고할 것을 최고하여야 함(단 신고기간은 2개월 이상으로 정함)\n∙상기 공고에는 채권자가 기간내에 신고하지 않으면 청산으로부터 제외된다는 것을 표시하여야 하며 공고는 법원의 등기사항의 공고와 동일한 방법으로 행해야 함\n∙청산인이 알고 있는 채권자에 대하여는 개별적으로 채권을 신고할 것을 최고하여야 함(개별통보 할 것)\nb) 변제(「민법」 제89조, 제90조, 제91조, 제92조)\n∙청산인은 상기 채권신고기간내에는 채권자에게 변제하지 못하나 이로 인해 채권자에 대한 지연손해배상책임 의무를 면하지 못함\n∙청산중의 법인은 아직 변제기가 닥쳐오지 않은 채권에 대해서도 변제할 수 있음. 단, 조건있는 채권, 존속기간의 명확하지 않은 채권 기타 가액이 명확하지 않은 채권에 관하여는 법원이 선임한 감정인의 평가에 의하여 변제\n∙채권신고기간 내에 신고하지 않은 채권자는 청산에서 제외되고 법인의 채무를 완제한 후 귀속권리자에게 인도하지 않은 재산에 대해서만 변제를 청구할 수 있음\n∙청산인이 알고 있는 채권자에 대해서는 신고하지 않았더라도 청산에서 제외하지 못하며 꼭 변제해야 함 만일, 채권자가 변제를 수령하지 않으면 공탁하여야 함(「민법」 487조)\n⑤ 잔여재산의 처리(법 제27조, 영 제10조의6)\n∙해산한 법인의 잔여재산은 정관이 정하는 바에 의하여 국가 또는 지방자치단체에 귀속됨"}, {"p": 67, "t": "∙국가 또는 지자체에 귀속된 재산은 ⅰ) 사회복지사업에 사용하거나 ⅱ) 유사한 목적을 가진 법인에게 무상으로 대부하거나 무상으로 사용･수익하게 할 수 있음\n※해산한 법인의 이사 본인 및 그와 “특별한 관계에 있는 자” 가 이사로 있는 법인에 대하여는 무상으로 대부･사용･수익하게 할 수 없음\n⑥ 파산신청(「민법」 제93조)\n∙청산절차를 밟고 있는 도중에 법인의 재산이 그 채무를 완제하기에 부족하다는 것이 분명하게 된 때(즉 채무초과 상태)에는 청산인이 지체없이 파산신고를 신청하고 이를 공고해야 함\n∙법인의 파산으로 파산관재인이 정해지면 청산인은 파산관재인에게 사무를 인계하여야 하며, 인계함으로써 그 임무가 종료\n⑦ 청산종결의 등기와 신고(「민법」 제94조)\n∙청산이 종결한 때에는 청산인은 3주내 이를 등기하고 주무관청에 신고하여야 함\n※청산･파산절차 진행 중, 채무변제를 위한 기본재산처분시에도 반드시 기본재산처분허가를 받아야만 함\n라\n법인의 합병(법 제30조, 영 제11조, 규칙 제19조)\n2개 이상 법인이 합병하고자 할 때에는 합병되는 형태에 따라 법인합병허가신청서(붙임 20)에 아래의 서류를 첨부하여 시･도지사의 허가를 받아야 함(시･도가 다른 경우에는 보건복지부장관 허가)\n법인 합병시 합병 후 존속하는 법인 또는 합병에 의해 설립된 법인은 합병에 의해 소멸된 법인의 지위를 승계하고, 합병후 신설법인 설립시에는 관계 법인이 각각 5인씩 지명하는 설립위원이 정관을 작성하는 등 법인설립업무를 공동처리\n1) 합병 후 존속(A+B=A)\n-A법인이 B법인을 흡수하는 형태의 합병시 아래의 서류를 구비하여 A법인의 주사무소가 위치하는 시･도지사의 허가를 받을 것\n※ 법인합병허가신청서에 첨부해야 할 서류\n∙관계법인의 합병결의서, 정관, 재산목록 및 재무상태표 각 1부\n∙정관변경안 1부\n∙사업계획서, 예산서 및 재산의 소유를 증명할 수 있는 서류 각 1부\n∙재산의 평가조서 및 재산수익 조서 각 1부"}, {"p": 68, "t": "-B법인의 사무소를 존속하고자 하는 경우에는 분사무소 설치절차와 동일하게 처리할 것\n-B법인이 시설법인일 경우\n① B법인을 흡수한 A법인이 더 이상 시설운영이 불가능할 경우A법인은 법 제38조 및 규칙 제26조에 의거 시설폐지 3개월 전까지 시설폐지신고서를 관할 시･군･구청장에게 제출하고 시설거주자에 대한 전원 및 귀가조치를 관할 시･군･구청장과 협의하여 시행해야 함\n②B법인을 흡수한 A법인이 계속 시설을 운영하고자 하는 경우시설운영자가 B법인에서 A법인으로 바뀌었기 때문에 운영자변경에 대해 관한 시･군･구청에 변경신고를 하고 계속 운영\n2) 합병 후 신설법인 설립(A+B=C)\n-A법인과 B법인이 합병하여 신규 C법인을 설립하는 경우에는 아래의 서류를 완비하여 C법인의 주사무소가 위치할 시･도지사의 허가를 받을 것(나머지 사항은 “1) 합병 후 존속”과 동일)\n※ 법인합병허가신청서에 첨부해야 할 서류\n∙합병취지서, 재산목록 및 재무상태표 1부\n∙합병 당해 연도 및 다음 연도의 사업계획서 및 예산서 각 1부\n∙규칙 제7조제2항제2호부터 제9호까지의 서류 각 1부\n※A법인과 B법인의 주사무소가 다른 시도일 경우 보건복지부장관에게 허가를 받고, 보건복지부장관은 허가 후 C법인의 주사무소가 위치할 시･도지사에게 통보"}]}, {"title": "5. 법인의 관리·감독", "start": 69, "end": 74, "html": "<div class=\"pchip\" id=\"p69\"><span>원문 69쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=75\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">5<\/span>법인의 관리･감독<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">법원(法院)<\/div><div class=\"ln p\">법인의 해산과 청산의 감독은 법원이 담당(「민법」 제84조, 제95조)<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">시･도지사(법 제51조, 재무회계규칙 제42조)<\/div><div class=\"ln p\">법인설립허가, 법인정관변경인가, 기본재산 처분허가 등 법인 업무전반에 대한 모든 사항은 시･도지사 권한사항임<\/div><div class=\"ln note\">※ 시･도지사는 법인 업무 전반에 대하여 시군구에 검토의견을 요청할 수 있음.<\/div><div class=\"ln p\">시･도지사는 자체지도･감사계획에 의거 사회복지사업을 운영하는 법인(법인운영시설 포함)에 대한 소관업무에 관하여 지도･감독을 실시하며<\/div><div class=\"ln p\">-필요한 경우 그 업무에 관하여 보고 또는 관계서류의 제출을 명하거나 소속 공무원으로 하여금 법인의 사무소 또는 시설에 출입하여 검사 또는 질문하게 할 수 있음(지도･감독공무원증)<\/div><div class=\"ln p\">시･도지사 또는 시장･군수･구청장은 사회복지법인과 사회복지시설에 대하여 지방의회의 추천을 받아 「공인회계사법」 제7조에 따라 등록한 공인회계사 또는 「주식회사 등의 외부감사에 관한 법률」 제2조제7호에 따른 감사인을 선임하여 회계감사를 실시할 수 있음(2019.6.12.시행)<\/div><div class=\"ln p\">-이 경우 공인회계사 또는 감사인의 추천, 회계감사의 대상 및 그 밖에 필요한 사항은 보건복지부령*으로 정하는 기준에 따라 정한 지방자치단체의 조례에 따름<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>* 「사회복지법인 및 사회복지시설 재무회계규칙」 제42조의2(’19.9.27.시행)<br>①시･도지사 또는 시장･군수･구청장은 법인 및 시설이 다음 각 호의 어느 하나에 해당하는 경우 회계감사를 실시할 수 있다.<br>1. 「사회복지사업법」 제40조제1항제4호에 따른 회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 경우<br>2. 「사회복지사업법」 제42조제3항제1호에 따라 거짓이나 그 밖의 부정한 방법으로 보조금을 받은 경우<br>3. 「사회복지사업법」 제42조제3항제2호에 따라 사업 목적 외의 용도에 보조금을 사용한 경우<br>4. 「사회복지사업법」 또는 「사회복지사업법」에 따른 명령을 위반한 경우<br>5. 제42조제4항에 따라 감사가 시장･군수･구청장에게 보고한 경우<br>② 제1항에서 규정한 사항 외에 공인회계사 또는 감사인의 추천 등 회계감사의 실시와 관련하여 필요한 사항은 해당 지방자치단체의 조례로 정한다.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/tab
