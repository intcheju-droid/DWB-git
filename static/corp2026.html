<td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p242\"><span>원문 242쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=248\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회복지법인의 의료기관 설치･운영 여부<\/div><div class=\"ln p\">「의료법」 상 비영리법인은 의료기관을 설립할 수 있는데, 사회복지법인이 의료기관 설립이 가능한지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>우리 부에서는 사회복지법인의 의료기관 설립은 엄격하게 제한하고 있음. 물론 「의료법」 제33조제2항에 의거하여 비영리법인인 사회복지법인은 의료기관을 설치･운영할 수 있으나, 사회복지법인은 「사회복지사업법」 제2조에 규정한 사업을 행하기 위하여 설립되는 법인으로 의료사업은 사회복지사업의 종류에 해당하지 않음.<br>※다만, 사회복지법인은 “의료복지”는 행할 수 있으며 그 범위는<br>‑「국민기초생활보장법」 제7조1항3호에 의한 수급자에 대하여 의료급여를 행하는 사업<br>‑「노인복지법」 제34조에 의한 노인의료복지시설을 운영하는 사업<br>‑「장애인복지법」 제58조제1항제2호 중 장애인의료재활시설을 운영하는 사업은 가능<br>특히, 신설 사회복지법인이 법인의 목적사업으로 “의료시설”을 운영하는 것으로 정관을 만든 사례와, 기존 설립 허가 받은 법인이 의료시설을 설치하는 것으로 정관 변경을 요구하는 경우는 엄격하게 금지되고 있으며 기존에 의료시설을 설립할 수 있도록 허가된 법인의 경우에도 정관변경을 요구하고 있음.<br>※ 관련 시달 공문<br>‑보건복지부 복정65010-201(2000.6.8) “의료기관을 운영하는 사회복지법인에 대한 지도･감독 철저”<br>‑보건복지부 복정65115-470(2001.10.4) “의료기관운영 사회복지법인 관리방안 통보”<br>그리고 사회복지법인의 의료기관 운영을 금지하는 지침 시달 이전에 허가받은 법인의 경우에도<br>‑“본인부담금 감면 또는 면제, 무료병원운영, 00세이상 노인 무료진료” 등 본인부담금 면제를 표방하는 내용이 법인정관에 규정된 경우는 정관을 개정하고 삭제하도록 조치하였으며<br>‑기 설치한 법인은 재무회계규칙에 따라 예산･결산서를 제출하게 하는 등 법인 관리에 철저를 기하고 있음.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p243\"><span>원문 243쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=249\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>사회복지법인 설립 전 출연재산의 사전 조건<\/div><div class=\"ln p\">사회복지시설법인 설립허가와 관련하여 시설을 신축하고자 하는 기본재산 토지가 군사보호구역일 경우, 시설 신축이 가능하도록 사전에 군과 협의를 득하여야만 법인 설립 허가를 해줄 수 있는지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>사회복지 시설법인은 그 설립 목적이 사회복지시설을 설치 운영하는 것이기에, 목적사업 시행 가능 여부가 확인되지 않은 상태에서는 법인 설립을 허가할 수 없음.<br>※「사회복지사업법 시행규칙」 제13조 및 「사회복지법인 관리안내」의 재산의 출연 조항 참조<br>법인설립 신청자가 시설을 설치하고자 하는 지역이 군사보호구역인 경우, 군 당국의 허가가 있어야 시설 입지가 가능하기에, 법인설립 신청자가 군 당국과 사전에 시설 설립에 대한 합의가 이루어졌음을 서면으로 증명하지 않으면, 목적사업 실현 가능 여부가 확인되지 않은 것이기에 법인 설립을 허가할 수 없습니다.<br>※동 사항은 상수도보호구역, 개발제한구역, 농지전용지역 등 법률에 따라 허가･승인 등이 필요한 경우에도 동일하게 적용<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p244\"><span>원문 244쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=250\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>지원법인의 시설위탁운영 가능여부<\/div><div class=\"ln p\">사회복지법인 중 시설을 직접 운영하지 아니하는 지원법인이 시설을 위탁 운영할 수 있는지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>사회복지사업에 대한 지원을 목적사업으로 하는 지원법인을 설립한 후 사회복지시설 등의 위탁운영까지 목적사업의 범위를 확대코자 하는 경우에는 정관 변경 등을 통하여 사회복지시설 등을 위탁받아 운영할 수 있음<br>다만, 이 경우 해당법인은 지원법인으로서의 기본재산외에 사회복지시설의 위탁운영에 필요한 기본재산(연간 운영비 등 충당재원)을 갖추고 있어야 하며, 사회복지지원사업에 대한 성실한 실적, 재정･인력･조직 등의 안정성, 공신력 등 시설을 수탁받을 수 있는 요건을 필요로 할 것임.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p245\"><span>원문 245쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=251\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">5<\/span>법인의 기본재산 처분관련<\/div><div class=\"ln p\">사회복지법인 기본재산 처분과 관련하여 법인 관할 행정기관의 사전 허가없는 처분은 무효인지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>사회복지법인의 부채를 반환받기 위하여 법인의 기본재산에 대한 강제경매를 실시하여 채권자에게 소유권이전등기가 이루어졌음에도 법인관할 행정관청의 사회복지법인 기본재산 처분에 대한 허가가 없었기에 원인무효라 하는 것은 채권자의 재산권을 침해하는 것으로 위헌이라는 의견이 있어 헌법소원 행위가 있었으나,<br>국가 또는 지방자치단체는 사회복지를 증진할 책임이 있고 사회복지사업의 운영 또는 지원이 공동체 다수의 이익과 밀접한 관련이 있는바, 사적 거래의 안전 및 개인의 재산권 보장보다 사회복지법인의 재정 건전화에 대한 요구가 더 중요한 가치이기에 이는 자의적인 차별이나 침해라고 볼 수 없으며<br>사회복지법인에 대한 채권자의 기본재산 강제경매의 경우에도 사회복지법인의 기본재산이 아닌 그 밖의 보통재산을 대상으로 경매절차를 이행하거나, 「파산법」 등의 특별절차를 통하여 채권을 변재 받을 수 있기에 헌법상 재산권 또는 평등권을 위배하지 아니하다고 할 수 있음.<br>※동 사항은 [2004헌바10 「사회복지사업법」 제23조제2항의 위헌소원]에 대한 헌법 재판소의 판결 내용임<br>즉 사회복지법인의 기본재산은 법원의 경매처분이 있다 할지라도, 관할행정관청의 허가 없이는 원인무효행위이며, 행정관청이 이를 허가하는 경우에는 기본재산의 잠식으로 인하여 법인의 목적사업 달성이 불가능하게 되면 법인 해산의 사유가 되며, 기본재산 잠식을 이유로 관련 이사의 해임을 명할 수도 있음.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p246\"><span>원문 246쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=252\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">6<\/span>정부 지원대상자의 기본재산 인정 여부<\/div><table class=\"htbl\"><tr><td><\/td><\/tr><tr><td>정부의 지원을 받아 시설을 설치하기로 결정된 자가 정부예산지원 확정 내역을 가지고 법인설립 신청시 기본재산의 소유를 증명할 수 있는 서류로 제출하는 경우 인정여부<\/td><\/tr><tr><td><\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>「사회복지사업법 시행령」 제8조, 같은 법 시행규칙 제7조에 따르면 법인설립허가를 받고자 하는 자는 설립 허가신청서에 재산출연증서와 함께 그 재산이 출연자 소유임을 증명할 수 있는 서류(부동산의 경우에는 등기부등본)를 제출하도록 규정하고 있는 바, 시설(건물)건립에 필요한 정부의 예산지원을 전제하는 것만으로는 기본재산의 소유를 증명할 수 있는 서류로 인정할 수 없음.<br>참조로 시설 운영을 위한 수익용 기본재산을 마련하지 아니하고, 후원금 및 기부금 등의 재원을 통하여 시설 운영비를 조달하려는 법인 설립의 경우도 후원금 및 기부금은 후원단체(또는 후원인) 및 기부자의 상황과 여건에 의하여 그 수입이 유동적이며, 수입의 유동성으로 인하여 법인 및 시설이 목적사업을 달성하지 못하는 경우에는 법인의 해산 사유가 되기에 후원금 또는 기부금은 법인 및 시설의 목적사업 운영비 조달 방법으로 인정하지 않고 있음.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p247\"><span>원문 247쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=253\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">7<\/span>기본재산의 용도변경<\/div><div class=\"ln p\">사회복지법인의 목적사업용 기본재산을 수익사업용 기본재산으로 변경 하고자 하는 경우 허가가 가능한지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>사회복지법인은 비영리 공익법인으로서 원칙적으로 영리목적의 수익사업은 행할 수 없고, 예외적으로 법인의 목적사업의 원활한 수행을 위해 부수적으로 수익사업을 행할 수 있음<br>이에 법인이 목적사업용 기본재산을 법인의 목적사업(시설 설치 등)에 직접 사용되거나 직접 사용될 계획이 있는지 여부와 총 기본재산에서 차지하는 비중, 목적사업용 기본재산을 수익사업용 재산으로 처분 시 법인 목적사업 수행가능여부, 해당 기본재산 처분의 의도, 처분 후 수익금의 사용용도, 현재 법인의 재정여건 등에 대해 종합적이고 엄격한 심사를 수행한 후 신중하게 허가여부를 결정하여야 할 것임<br>또한, 기본재산의 변경에 따른 이사회 소집의 적법성 확인(이사에 대한 소집통보 여부, 정관상 절차 준수여부 등)과 이사회 회의록을 검토하여 동 사항이 이사들 간 충분히 논의되었는지 여부와 참석이사 전원 및 감사의 인감 날인 등 절차적 타당성도 아울러 검토하여야 할 것임<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p248\"><span>원문 248쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=254\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">8<\/span>채무가 있는 재산의 기본재산 편입 가능 여부<\/div><table class=\"htbl\"><tr><td><\/td><\/tr><tr><td>사회복지법인이 채무를 부담하는 조건으로 기본재산을 추가로 증여 받는 경우 기본재산으로 편입이 가능한지 여부<\/td><\/tr><tr><td><\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>사회복지법인은 「사회복지사업법」 제23조 및 같은 법 시행규칙 제14조에 의거하여 매도, 증여, 교환(대체), 임대, 담보제공 또는 용도변경과 기본재산에 관한 의무부담 및 권리 포기 시 관할행정기관의 처분허가를 받아야 함.<br>이에 법인은 증여를 받는 경우 무상증여를 받는 것이 원칙이나, 채무를 부담하는 조건으로 증여를 받는 경우 동 증여재산의 수익성, 매도가능성 및 매도할 때 부과되는 제세공과금 등을 감안한 실질적인 순 자산 가치를 세밀하게 판단하여 실질적인 재산의 증가가 있는 경우라면 기본재산의 목록과 가액변경에 따른 기본재산 취득허가 및 정관변경을 할 수 있을 것임<br>다만, 부동산의 경우는 「사회복지사업법」 제23조제2항 및 같은 법 시행규칙 제12조제1항제1호에 따라 당연히 기본재산이 되므로 기본재산 취득허가 절차는 불필요함<br>※만일 제한물권 등이 설정되어 있는 부동산을 취득한 경우로서 제한물권 등으로 인해 그 부동산의 재산적 가치가 현저하게 낮은 것으로 평가되거나 법인에 의무만 부과되는 경우라고 판단된다면 주무관청은 해당 사회복지법인에 대하여 해당 부동산을 즉시 매각토록 지도･감독하고, 필요한 경우 배임 등의 혐의에 대해 수사의뢰 등의 조치를 할 필요가 있음<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p249\"><span>원문 249쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=255\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">9<\/span>목적사업 불이행 법인의 행정처분<\/div><table class=\"htbl\"><tr><td><\/td><\/tr><tr><td>설립 허가받은 사회복지법인이 목적사업의 일부는 이행하고 있으나 일부는 이행하지 아니하는 경우 행정처분이 가능한지 여부<\/td><\/tr><tr><td><\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>사회복지법인은 설립 허가 시 법인이 정관으로 정한 목적사업을 실시할 능력이 있는지를 확인한 후 해당 목적사업을 시행할 수 있다고 판단되어질 때 설립허가가 이루어짐.<br>설립허가 이후 법인이 목적사업의 전부 또는 일부를 정당한 사유없이 이행하지 않았을 경우 「사회복지사업법」 제26조제1항 제2호, 제3호, 제5호에 의거하여 법인의 설립 취소까지 행할 수 있음.<br>만약 목적사업을 이행하지 아니하는 사유가 법인의 능력 부족 등에 기인한 고의성이 없는 경우에는 정관의 변경을 통하여 실시가 가능한 사업 이외의 목적사업은 삭제하도록 하여야 할 것이며, 능력이 있음에도 불구하고 고의적으로 목적사업을 이행하지 아니하는 경우에는 「행정절차법」에 의거하여 시정명령을 내리고 이후에도 시정하지 아니하면 청문회를 거쳐 소명의 기회를 준 후 이행을 촉구하나 충분한 기회를 주었음에도 불구하고 이행하지 아니하는 경우 「사회복지사업법」 제26조에 의거하여 법인설립 허가취소를 하여야 할 것임.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p250\"><span>원문 250쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=256\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">10<\/span>법인 예산의 성립 시점<\/div><table class=\"htbl\"><tr><td><\/td><\/tr><tr><td>법인 재무회계 규칙상 매 회계년도에 편성한 세입 세출 예산(안)은 관할 시･군･구에 보고 사항인지, 승인 사항인지 여부<\/td><\/tr><tr><td><\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>재무회계규칙 제10조(예산의 편성 및 결정절차)에 의하면 예산은 “이사회의 의결을 거쳐 확정” 되고 시･군･구청장에게 제출하도록 되어 있으니 법률적으로 법인 예산은 행정청의 승인사항은 아님.<br>다만, 동 규칙 제9조에 시･군･구청장이 특히 필요하다고 인정되는 사항에 관하여 예산편성 요령을 정하여 법인에 통보할 수 있으며, 법인 및 시설이 시･군･구의 정당한 요청에 대하여 이행하지 아니하여 발생한 회계 및 시설운영과 관련한 부당행위는 시행규칙 제26조2에 의거하여 행정처분을 행할 수 있음.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p251\"><span>원문 251쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=257\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">11<\/span>법인 임원의 결격사유 조회관련<\/div><div class=\"ln p\">사회복지법인 임원의 결격사유에 대해 전국 시･도 또는 시･군･구에 모두 조회를 해야 하는지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>법인에서 임원을 임명하는 경우(법 제18조제6항)<br>-법인에서 임원 임명 시 임원 결격사유 해당여부에 대한 입증책임은 해당 법인과 해당 법인에 임원으로 임명되는 자에 있음<br>-해당 시･도 및 시･군･구는 신규로 임명되는 임원에 대해 신원조회 등을 통해 법인임원으로 적합한지 여부를 판단하고 이를 승인해야할 법적의무는 없으며, 당해 법인으로부터 신규 임원임명에 대한 보고를 받음으로써 그 법적 의무를 다하는 것임<br>-때문에 시･도 및 시･군･구에서는 법인에서 신규임원임명 보고 시 시행규칙 제10조의 법인임원임면보고서와 구비서류 완비여부만 확인하기 바람<br>※시･도 및 시･군･구는 신규임원 임명시에, 임원결격사유에 해당하는 자를 법인에서 고의 또는 과실로 임명하는 경우, 임원결격사유에 해당하는 자가 자신의 결격사유를 고의 또는 과실로 감추고 임원으로 임명되는 경우 등 결격자가 법인의 임원으로 임명된 경우에는 그로 인해 발생하는 모든 민형사상 책임은 해당 법인 및 결격사유가 있는 임원에게 있음을 통보하고 이에 대한 각서를 받을 것<br>시･도에서 임시이사를 선임하는 경우(법 제22조의3)<br>-법인에서 임원의 결원이 생겼음에도 2월 이내 보충하지 않아 해당 법인 주사무소 소재지 시･도지사가 이해관계인의 청구 또는 직권으로 임시이사를 선임하였을 경우에는 해당 시･도 및 시･군･구에게 임원결격사유(법 제19조제1항제2호)에 대한 입증책임이 있음<br>-다만, 상기사항(임시이사의 선임)에 해당할 경우에도 해당 시･도 및 시･군･구는 타 시･도 및 시･군･구에 조회하지 말고 임시이사로 선임되는 자에게 결격사유를 설명한 후 결격사유가 없다는 각서를 받은 후 선임하도록 할 것<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p252\"><span>원문 252쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=258\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">12<\/span>임원의 겸직금지 관련<\/div><div class=\"ln p\">법인의 임원은 타 법인의 임원 또는 타 시설의 장 등을 겸직할 수 없는 지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>법인의 이사는 법 제18조제2항 및 시행령 제9조의 특별한 관계가 있는 자의 범위에 해당하지 않는 한 타 법인의 이사로 겸직이 가능함<br>-때문에, 법인이사의 신규임명보고 시 시행규칙 제10조에 의해 특별한 관계에 있는 자의 범위에 해당하지 않는다는 각서를 받기 때문에 추가적으로 시･도 및 시･군･구에 신원조회가 필요 없음<br>법 제21조제2항은 법인의 감사는 당해 법인의 이사, 당해 법인이 설치한 시설장 또는 그 직원으로 겸할 수 없다는 의미임<br>-이를 모든 법인의 이사, 모든 시설의 시설장 또는 그 직원으로 부당하게 확대 해석할 경우 헌법상 직업선택의 자유를 심각하게 침해할 우려가 있으므로, 시･도 및 시･군･구는 신규감사의 임용시 당해 법인의 이사, 법인이 설치한 시설장 또는 그 직원에 해당하는지 여부만 판단할 것<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p253\"><span>원문 253쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=259\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">13<\/span>법인 주사무소 이전<\/div><div class=\"ln p\">사회복지법인이 타 시･도로 주사무소 이전 가능 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>법 제17조제2항에 의거 관할 주무관청의 정관변경 인가 시 주사무소 이전 가능<br>-단, 법인의 주사무소가 타 시･도로 이전될 시에는 이전하고자 하는 시･도와 반드시 협의 후 주사무소 변경을 위한 정관변경의 인가 여부를 결정할 것<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln h2\"><span class=\"badge\">14<\/span>법인의 수익용 기본재산의 용도변경<\/div><div class=\"ln p\">사회복지법인이 수익용 기본재산 처분 금액을 고유목적사업준비금으로 용도 변경이 가능한지 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>법인이 수익용 기본재산을 처분한 금액 중 일부를 고유목적사업준비금으로 용도변경하고자 하는 경우에는 시행규칙 제14조(기본재산의 처분) 제1항에 별지 제11호 서식의 기본재산처분허가신청서에 관련 서류를 첨부하여 주무관청에 허가를 받아야 함<br>-주무관청은 기본재산처분허가 신청 시 관련 서류의 적정성 여부, 사업계획의 적정성 여부를 면밀히 검토할 것<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p254\"><span>원문 254쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=260\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">15<\/span>기본재산처분허가 신청권자<\/div><div class=\"ln p\">채권자가 주무관청에 사회복지법인 기본재산처분허가를 요구하는 경우 처분 허가 가능 여부<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>법 제23조 및 시행규칙 제14조에 따르면 기본재산처분허가신청은 법인에게 있음으로 채권자는 주무관청에 대하여 처분허가신청절차를 이행할 것을 청구할 권한이 없음.<br>&lt;참조판례, 대법원 1998.8.21. 선고 98다19202, 19219판결&gt;<br>-재단법인이 정관의 변경을 초래하는 기본재산의 처분을 위하여 주무관청의 허가를 신청할 것인지 여부는 특별한 사정이 없는 한 재단법인의 의사에 맡겨져 있다고 할 것이므로, 채무자인 재단법인에 다른 재산이 없어 기본재산을 처분하지 않고는 채무의 변제가 불가능하다고 하더라도, 재단법인으로부터 기본재산을 양수한 자도 아니고 금전채권자들에 불과한 자에게는 강제이행청구권의 실질적인 실현을 위하여 필요하다는 사유만으로 기본재산의 처분을 희망하지도 않는 재단법인을 상대로 주무관청에 대하여 기본재산에 대한 처분허가신청절차를 이행할 것을 청구할 권한이 없다.<br>청산･파산 절차가 진행 중인 경우는 청산인 또는 파산관재인이 신청할 수 있음<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p255\"><span>원문 255쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=261\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">16<\/span>사회복지법인의 해산관련<\/div><div class=\"ln p\">(’12.12, 법무부 법무심의관실)<\/div><div class=\"ln p\">(질의1) 민법상 법인 해산신고는 수리를 요하는 신고인지 아니면 자기 완결적 신고인지 여부 (질의2)위 해산신고가 수리를 요하는 신고가 아니라 하더라도 청산인 선임을 둘러싼 소송이 진행 중인 상황에서 법인 해산신고 수리를 보류할 수 있는지 여부 (질의3)A도로부터 설립허가가 취소된 사회복지법인 청산법인이 민법에 의거 하여 법인청산절차를 진행하는 과정에서 채권의 추심, 변제 등을 위한 기본재산 및 잔여재산을 처리하는 업무를 A도에서 수행하여야 하는지, A도의 사무처리위임규칙에 따라 사회복지 법인의 기본재산처분하가권이 위임된 B군에서 수행하여야 하는지<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>가. 질의 1에 대하여<br>-신고란 특정한 사실관계와 법률관계의 존부 및 그 내용을 행정청에 통보하면 그것으로 종료하는 것이므로 행정청의 별도의 의사표시를 요하지 않으며, 「행정절차법」 제40조에서도 신고가 자기완결적인 행위임을 규정하고 있음<br>-신고가 수리를 요하는 경우도 있지만 이는 관련 법령의 취지를 종합할 때 행정청에 인･허가적 의미를 가지는 사항에 관한 법령의 요건에 관한 심사의무가 있는 경우로 제한되고, 「민법」 제86조의 해산신고는 이와 같이 특정행위나 시설설치 등에 대한 인･허가적인 의미를 가지는 사항에 해당한다고 보기는 어려우므로, 수리를 요하는 신고로 볼 필요는 없을 것으로 판단됨<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p256\"><span>원문 256쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=262\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>나. 질의 2에 대하여<br>-법인은 해산 시 파산의 경우를 제외하고는 해산등기를 하여야 하고(「민법」 제85조제1항), 등기를 해태하면 과태료가 부과될 뿐 아니라(「민법」 제97조제1호), 해산등기를 하지 아니하면 제3자에게 해산사실을 대항할 수 없어 대외적으로 해산의 효력을 주장할 수 없게 됨<br>-해산등기사항은 해산의 사유 및 연월일, 청산인에 관한 사항(성명, 주소, 대표권제한)이고, 해산신고는 이러한 해산등기사항을 주무관청에 신고하는 것으로서, 해산에 관한 어떠한 사법적 효력을 전제로 하는 것이 아니라 해산등기사실 및 관련 내용을 주무관청에 알리는 것에 불과하고 해산등기사항에 관한 어떠한 요건심사를 전제로 하는 것이 아님<br>-질의사안과 같이 청산인과 관련한 소송이 있을 경우, 후에 청산인이 변경되면 이는 변경등기를 하게 될 것이고(「민법」 제85조제2항), 그러한 변경가능성을 이유로 신고자체를 수리거절할 필요는 없을 것으로 판단됨<br>-또한 이사자격 등과 관련한 취소소송이 진행 중인 때에도 해당 이사의 임기는 진행된다거나, 무효 등을 다투는 해당 결의에 의하여 선임된 이사도 회사대표로서의 자격을 인정한 판결 등에 비추어 볼 때, 청산인에 대한 해임청구소송이 진행 중이라고 하여도 신고를 유보할 사항은 아니라고 판단됨<br>다. 질의 3에 대하여<br>-청산은 법인격이 해소되어 향후 소멸되기 전에 채권채무 관계를 정리하는 것이라 할 것이므로, 법인 존속 중에 하는 기본재산의 처분과는 다른 문제라 할 것임<br>-즉 해산･청산은 설립허가와 같은 위치에서 논의되어야 할 사항이라고 할 것인바, 해당 위임사무규칙에서는 설립이나 해산(청산) 등에 대해서는 위임하고 있지 않는 것으로 보이므로, 설립허가청에서 해산(청산)에 관한 업무를 담당하는 것이 적절하다고 판단됨<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table>", "pages": [{"p": 239, "t": "2026년 사회복지법인 관리안내･Ministry of Health & Welfare\n사회복지법인 Q&A 모음"}, {"p": 241, "t": "1\n법인의 기본재산 출연 규모\n사회복지법인 설립시 기본재산 출연 규모\n |  | \n | 사회복지시설의 설치･운영을 목적으로 하는 법인은 당해 법인이 설치･운영하고자 하는 시설을 갖출 수 있는 목적사업용 기본재산을 갖추어야 하고, 사회복지사업을 지원하는 것을 목적으로 하는 법인은 법인의 운영경비의 전액을 충당할 수 있는 기본재산을 갖추어야 하는 바, 시설법인은 시설을 설치할 수 있는 부동산과 건축물을 구입･설치할 수 있는 정도의 재산(현금 또는 유가증권 등) 또는 시설로 사용할 수 있는 부동산을 소유하여야 할 것이며, 그 시설의 운영에 소요되는 경비를 충당할 수 있는 재산(일정한 수익을 얻을 수 있는 부동산 또는 현금)을 소유하여야 할 것임. 특히 시설 운영경비는 종사자 인건비, 시설운영비 등으로 기본재산을 지출하는 것이 아니라 기본재산에서 발생되는 수익에 의하여 운영되어야 할 것이며, 기본재산은 시설 운영에 따라 잠식되어서는 아니됨 시설의 설치운영을 목적으로 하지 아니하는 법인의 경우에는 법인의 설립목적사업을 수행하기 위하여 매년 소요되는 사업비용의 전액을 충당할 수 있는 기본재산의 출연이 필요함 이와 같이 사회복지법인은 법인이 하고자 하는 목적사업의 종류･규모 및 운영방법에 따라 개별적으로 정해져야 하며 일반적인 출연재산의 규모를 제한하고 있지는 아니함 | \n |  | "}, {"p": 242, "t": "2\n사회복지법인의 의료기관 설치･운영 여부\n「의료법」 상 비영리법인은 의료기관을 설립할 수 있는데, 사회복지법인이 의료기관 설립이 가능한지 여부\n |  | \n | 우리 부에서는 사회복지법인의 의료기관 설립은 엄격하게 제한하고 있음. 물론 「의료법」 제33조제2항에 의거하여 비영리법인인 사회복지법인은 의료기관을 설치･운영할 수 있으나, 사회복지법인은 「사회복지사업법」 제2조에 규정한 사업을 행하기 위하여 설립되는 법인으로 의료사업은 사회복지사업의 종류에 해당하지 않음. ※다만, 사회복지법인은 “의료복지”는 행할 수 있으며 그 범위는 ‑「국민기초생활보장법」 제7조1항3호에 의한 수급자에 대하여 의료급여를 행하는 사업 ‑「노인복지법」 제34조에 의한 노인의료복지시설을 운영하는 사업 ‑「장애인복지법」 제58조제1항제2호 중 장애인의료재활시설을 운영하는 사업은 가능 특히, 신설 사회복지법인이 법인의 목적사업으로 “의료시설”을 운영하는 것으로 정관을 만든 사례와, 기존 설립 허가 받은 법인이 의료시설을 설치하는 것으로 정관 변경을 요구하는 경우는 엄격하게 금지되고 있으며 기존에 의료시설을 설립할 수 있도록 허가된 법인의 경우에도 정관변경을 요구하고 있음. ※ 관련 시달 공문 ‑보건복지부 복정65010-201(2000.6.8) “의료기관을 운영하는 사회복지법인에 대한 지도･감독 철저” ‑보건복지부 복정65115-470(2001.10.4) “의료기관운영 사회복지법인 관리방안 통보” 그리고 사회복지법인의 의료기관 운영을 금지하는 지침 시달 이전에 허가받은 법인의 경우에도 ‑“본인부담금 감면 또는 면제, 무료병원운영, 00세이상 노인 무료진료” 등 본인부담금 면제를 표방하는 내용이 법인정관에 규정된 경우는 정관을 개정하고 삭제하도록 조치하였으며 ‑기 설치한 법인은 재무회계규칙에 따라 예산･결산서를 제출하게 하는 등 법인 관리에 철저를 기하고 있음. | \n |  | "}, {"p": 243, "t": "3\n사회복지법인 설립 전 출연재산의 사전 조건\n사회복지시설법인 설립허가와 관련하여 시설을 신축하고자 하는 기본재산 토지가 군사보호구역일 경우, 시설 신축이 가능하도록 사전에 군과 협의를 득하여야만 법인 설립 허가를 해줄 수 있는지 여부\n |  | \n | 사회복지 시설법인은 그 설립 목적이 사회복지시설을 설치 운영하는 것이기에, 목적사업 시행 가능 여부가 확인되지 않은 상태에서는 법인 설립을 허가할 수 없음. ※「사회복지사업법 시행규칙」 제13조 및 「사회복지법인 관리안내」의 재산의 출연 조항 참조 법인설립 신청자가 시설을 설치하고자 하는 지역이 군사보호구역인 경우, 군 당국의 허가가 있어야 시설 입지가 가능하기에, 법인설립 신청자가 군 당국과 사전에 시설 설립에 대한 합의가 이루어졌음을 서면으로 증명하지 않으면, 목적사업 실현 가능 여부가 확인되지 않은 것이기에 법인 설립을 허가할 수 없습니다. ※동 사항은 상수도보호구역, 개발제한구역, 농지전용지역 등 법률에 따라 허가･승인 등이 필요한 경우에도 동일하게 적용 | \n |  | "}, {"p": 244, "t": "4\n지원법인의 시설위탁운영 가능여부\n사회복지법인 중 시설을 직접 운영하지 아니하는 지원법인이 시설을 위탁 운영할 수 있는지 여부\n |  | \n | 사회복지사업에 대한 지원을 목적사업으로 하는 지원법인을 설립한 후 사회복지시설 등의 위탁운영까지 목적사업의 범위를 확대코자 하는 경우에는 정관 변경 등을 통하여 사회복지시설 등을 위탁받아 운영할 수 있음 다만, 이 경우 해당법인은 지원법인으로서의 기본재산외에 사회복지시설의 위탁운영에 필요한 기본재산(연간 운영비 등 충당재원)을 갖추고 있어야 하며, 사회복지지원사업에 대한 성실한 실적, 재정･인력･조직 등의 안정성, 공신력 등 시설을 수탁받을 수 있는 요건을 필요로 할 것임. | \n |  | "}, {"p": 245, "t": "5\n법인의 기본재산 처분관련\n사회복지법인 기본재산 처분과 관련하여 법인 관할 행정기관의 사전 허가없는 처분은 무효인지 여부\n |  | \n | 사회복지법인의 부채를 반환받기 위하여 법인의 기본재산에 대한 강제경매를 실시하여 채권자에게 소유권이전등기가 이루어졌음에도 법인관할 행정관청의 사회복지법인 기본재산 처분에 대한 허가가 없었기에 원인무효라 하는 것은 채권자의 재산권을 침해하는 것으로 위헌이라는 의견이 있어 헌법소원 행위가 있었으나, 국가 또는 지방자치단체는 사회복지를 증진할 책임이 있고 사회복지사업의 운영 또는 지원이 공동체 다수의 이익과 밀접한 관련이 있는바, 사적 거래의 안전 및 개인의 재산권 보장보다 사회복지법인의 재정 건전화에 대한 요구가 더 중요한 가치이기에 이는 자의적인 차별이나 침해라고 볼 수 없으며 사회복지법인에 대한 채권자의 기본재산 강제경매의 경우에도 사회복지법인의 기본재산이 아닌 그 밖의 보통재산을 대상으로 경매절차를 이행하거나, 「파산법」 등의 특별절차를 통하여 채권을 변재 받을 수 있기에 헌법상 재산권 또는 평등권을 위배하지 아니하다고 할 수 있음. ※동 사항은 [2004헌바10 「사회복지사업법」 제23조제2항의 위헌소원]에 대한 헌법 재판소의 판결 내용임 즉 사회복지법인의 기본재산은 법원의 경매처분이 있다 할지라도, 관할행정관청의 허가 없이는 원인무효행위이며, 행정관청이 이를 허가하는 경우에는 기본재산의 잠식으로 인하여 법인의 목적사업 달성이 불가능하게 되면 법인 해산의 사유가 되며, 기본재산 잠식을 이유로 관련 이사의 해임을 명할 수도 있음. | \n |  | "}, {"p": 246, "t": "6\n정부 지원대상자의 기본재산 인정 여부\n\n정부의 지원을 받아 시설을 설치하기로 결정된 자가 정부예산지원 확정 내역을 가지고 법인설립 신청시 기본재산의 소유를 증명할 수 있는 서류로 제출하는 경우 인정여부\n\n |  | \n | 「사회복지사업법 시행령」 제8조, 같은 법 시행규칙 제7조에 따르면 법인설립허가를 받고자 하는 자는 설립 허가신청서에 재산출연증서와 함께 그 재산이 출연자 소유임을 증명할 수 있는 서류(부동산의 경우에는 등기부등본)를 제출하도록 규정하고 있는 바, 시설(건물)건립에 필요한 정부의 예산지원을 전제하는 것만으로는 기본재산의 소유를 증명할 수 있는 서류로 인정할 수 없음. 참조로 시설 운영을 위한 수익용 기본재산을 마련하지 아니하고, 후원금 및 기부금 등의 재원을 통하여 시설 운영비를 조달하려는 법인 설립의 경우도 후원금 및 기부금은 후원단체(또는 후원인) 및 기부자의 상황과 여건에 의하여 그 수입이 유동적이며, 수입의 유동성으로 인하여 법인 및 시설이 목적사업을 달성하지 못하는 경우에는 법인의 해산 사유가 되기에 후원금 또는 기부금은 법인 및 시설의 목적사업 운영비 조달 방법으로 인정하지 않고 있음. | \n |  | "}, {"p": 247, "t": "7\n기본재산의 용도변경\n사회복지법인의 목적사업용 기본재산을 수익사업용 기본재산으로 변경 하고자 하는 경우 허가가 가능한지 여부\n |  | \n | 사회복지법인은 비영리 공익법인으로서 원칙적으로 영리목적의 수익사업은 행할 수 없고, 예외적으로 법인의 목적사업의 원활한 수행을 위해 부수적으로 수익사업을 행할 수 있음 이에 법인이 목적사업용 기본재산을 법인의 목적사업(시설 설치 등)에 직접 사용되거나 직접 사용될 계획이 있는지 여부와 총 기본재산에서 차지하는 비중, 목적사업용 기본재산을 수익사업용 재산으로 처분 시 법인 목적사업 수행가능여부, 해당 기본재산 처분의 의도, 처분 후 수익금의 사용용도, 현재 법인의 재정여건 등에 대해 종합적이고 엄격한 심사를 수행한 후 신중하게 허가여부를 결정하여야 할 것임 또한, 기본재산의 변경에 따른 이사회 소집의 적법성 확인(이사에 대한 소집통보 여부, 정관상 절차 준수여부 등)과 이사회 회의록을 검토하여 동 사항이 이사들 간 충분히 논의되었는지 여부와 참석이사 전원 및 감사의 인감 날인 등 절차적 타당성도 아울러 검토하여야 할 것임 | \n |  | "}, {"p": 248, "t": "8\n채무가 있는 재산의 기본재산 편입 가능 여부\n\n사회복지법인이 채무를 부담하는 조건으로 기본재산을 추가로 증여 받는 경우 기본재산으로 편입이 가능한지 여부\n\n |  | \n | 사회복지법인은 「사회복지사업법」 제23조 및 같은 법 시행규칙 제14조에 의거하여 매도, 증여, 교환(대체), 임대, 담보제공 또는 용도변경과 기본재산에 관한 의무부담 및 권리 포기 시 관할행정기관의 처분허가를 받아야 함. 이에 법인은 증여를 받는 경우 무상증여를 받는 것이 원칙이나, 채무를 부담하는 조건으로 증여를 받는 경우 동 증여재산의 수익성, 매도가능성 및 매도할 때 부과되는 제세공과금 등을 감안한 실질적인 순 자산 가치를 세밀하게 판단하여 실질적인 재산의 증가가 있는 경우라면 기본재산의 목록과 가액변경에 따른 기본재산 취득허가 및 정관변경을 할 수 있을 것임 다만, 부동산의 경우는 「사회복지사업법」 제23조제2항 및 같은 법 시행규칙 제12조제1항제1호에 따라 당연히 기본재산이 되므로 기본재산 취득허가 절차는 불필요함 ※만일 제한물권 등이 설정되어 있는 부동산을 취득한 경우로서 제한물권 등으로 인해 그 부동산의 재산적 가치가 현저하게 낮은 것으로 평가되거나 법인에 의무만 부과되는 경우라고 판단된다면 주무관청은 해당 사회복지법인에 대하여 해당 부동산을 즉시 매각토록 지도･감독하고, 필요한 경우 배임 등의 혐의에 대해 수사의뢰 등의 조치를 할 필요가 있음 | \n |  | "}, {"p": 249, "t": "9\n목적사업 불이행 법인의 행정처분\n\n설립 허가받은 사회복지법인이 목적사업의 일부는 이행하고 있으나 일부는 이행하지 아니하는 경우 행정처분이 가능한지 여부\n\n |  | \n | 사회복지법인은 설립 허가 시 법인이 정관으로 정한 목적사업을 실시할 능력이 있는지를 확인한 후 해당 목적사업을 시행할 수 있다고 판단되어질 때 설립허가가 이루어짐. 설립허가 이후 법인이 목적사업의 전부 또는 일부를 정당한 사유없이 이행하지 않았을 경우 「사회복지사업법」 제26조제1항 제2호, 제3호, 제5호에 의거하여 법인의 설립 취소까지 행할 수 있음. 만약 목적사업을 이행하지 아니하는 사유가 법인의 능력 부족 등에 기인한 고의성이 없는 경우에는 정관의 변경을 통하여 실시가 가능한 사업 이외의 목적사업은 삭제하도록 하여야 할 것이며, 능력이 있음에도 불구하고 고의적으로 목적사업을 이행하지 아니하는 경우에는 「행정절차법」에 의거하여 시정명령을 내리고 이후에도 시정하지 아니하면 청문회를 거쳐 소명의 기회를 준 후 이행을 촉구하나 충분한 기회를 주었음에도 불구하고 이행하지 아니하는 경우 「사회복지사업법」 제26조에 의거하여 법인설립 허가취소를 하여야 할 것임. | \n |  | "}, {"p": 250, "t": "10\n법인 예산의 성립 시점\n\n법인 재무회계 규칙상 매 회계년도에 편성한 세입 세출 예산(안)은 관할 시･군･구에 보고 사항인지, 승인 사항인지 여부\n\n |  | \n | 재무회계규칙 제10조(예산의 편성 및 결정절차)에 의하면 예산은 “이사회의 의결을 거쳐 확정” 되고 시･군･구청장에게 제출하도록 되어 있으니 법률적으로 법인 예산은 행정청의 승인사항은 아님. 다만, 동 규칙 제9조에 시･군･구청장이 특히 필요하다고 인정되는 사항에 관하여 예산편성 요령을 정하여 법인에 통보할 수 있으며, 법인 및 시설이 시･군･구의 정당한 요청에 대하여 이행하지 아니하여 발생한 회계 및 시설운영과 관련한 부당행위는 시행규칙 제26조2에 의거하여 행정처분을 행할 수 있음. | \n |  | "}, {"p": 251, "t": "11\n법인 임원의 결격사유 조회관련\n사회복지법인 임원의 결격사유에 대해 전국 시･도 또는 시･군･구에 모두 조회를 해야 하는지 여부\n |  | \n | 법인에서 임원을 임명하는 경우(법 제18조제6항) -법인에서 임원 임명 시 임원 결격사유 해당여부에 대한 입증책임은 해당 법인과 해당 법인에 임원으로 임명되는 자에 있음 -해당 시･도 및 시･군･구는 신규로 임명되는 임원에 대해 신원조회 등을 통해 법인임원으로 적합한지 여부를 판단하고 이를 승인해야할 법적의무는 없으며, 당해 법인으로부터 신규 임원임명에 대한 보고를 받음으로써 그 법적 의무를 다하는 것임 -때문에 시･도 및 시･군･구에서는 법인에서 신규임원임명 보고 시 시행규칙 제10조의 법인임원임면보고서와 구비서류 완비여부만 확인하기 바람 ※시･도 및 시･군･구는 신규임원 임명시에, 임원결격사유에 해당하는 자를 법인에서 고의 또는 과실로 임명하는 경우, 임원결격사유에 해당하는 자가 자신의 결격사유를 고의 또는 과실로 감추고 임원으로 임명되는 경우 등 결격자가 법인의 임원으로 임명된 경우에는 그로 인해 발생하는 모든 민형사상 책임은 해당 법인 및 결격사유가 있는 임원에게 있음을 통보하고 이에 대한 각서를 받을 것 시･도에서 임시이사를 선임하는 경우(법 제22조의3) -법인에서 임원의 결원이 생겼음에도 2월 이내 보충하지 않아 해당 법인 주사무소 소재지 시･도지사가 이해관계인의 청구 또는 직권으로 임시이사를 선임하였을 경우에는 해당 시･도 및 시･군･구에게 임원결격사유(법 제19조제1항제2호)에 대한 입증책임이 있음 -다만, 상기사항(임시이사의 선임)에 해당할 경우에도 해당 시･도 및 시･군･구는 타 시･도 및 시･군･구에 조회하지 말고 임시이사로 선임되는 자에게 결격사유를 설명한 후 결격사유가 없다는 각서를 받은 후 선임하도록 할 것 | \n |  | "}, {"p": 252, "t": "12\n임원의 겸직금지 관련\n법인의 임원은 타 법인의 임원 또는 타 시설의 장 등을 겸직할 수 없는 지 여부\n |  | \n | 법인의 이사는 법 제18조제2항 및 시행령 제9조의 특별한 관계가 있는 자의 범위에 해당하지 않는 한 타 법인의 이사로 겸직이 가능함 -때문에, 법인이사의 신규임명보고 시 시행규칙 제10조에 의해 특별한 관계에 있는 자의 범위에 해당하지 않는다는 각서를 받기 때문에 추가적으로 시･도 및 시･군･구에 신원조회가 필요 없음 법 제21조제2항은 법인의 감사는 당해 법인의 이사, 당해 법인이 설치한 시설장 또는 그 직원으로 겸할 수 없다는 의미임 -이를 모든 법인의 이사, 모든 시설의 시설장 또는 그 직원으로 부당하게 확대 해석할 경우 헌법상 직업선택의 자유를 심각하게 침해할 우려가 있으므로, 시･도 및 시･군･구는 신규감사의 임용시 당해 법인의 이사, 법인이 설치한 시설장 또는 그 직원에 해당하는지 여부만 판단할 것 | \n |  | "}, {"p": 253, "t": "13\n법인 주사무소 이전\n사회복지법인이 타 시･도로 주사무소 이전 가능 여부\n |  | \n | 법 제17조제2항에 의거 관할 주무관청의 정관변경 인가 시 주사무소 이전 가능 -단, 법인의 주사무소가 타 시･도로 이전될 시에는 이전하고자 하는 시･도와 반드시 협의 후 주사무소 변경을 위한 정관변경의 인가 여부를 결정할 것 | \n |  | \n14\n법인의 수익용 기본재산의 용도변경\n사회복지법인이 수익용 기본재산 처분 금액을 고유목적사업준비금으로 용도 변경이 가능한지 여부\n |  | \n | 법인이 수익용 기본재산을 처분한 금액 중 일부를 고유목적사업준비금으로 용도변경하고자 하는 경우에는 시행규칙 제14조(기본재산의 처분) 제1항에 별지 제11호 서식의 기본재산처분허가신청서에 관련 서류를 첨부하여 주무관청에 허가를 받아야 함 -주무관청은 기본재산처분허가 신청 시 관련 서류의 적정성 여부, 사업계획의 적정성 여부를 면밀히 검토할 것 | \n |  | "}, {"p": 254, "t": "15\n기본재산처분허가 신청권자\n채권자가 주무관청에 사회복지법인 기본재산처분허가를 요구하는 경우 처분 허가 가능 여부\n |  | \n | 법 제23조 및 시행규칙 제14조에 따르면 기본재산처분허가신청은 법인에게 있음으로 채권자는 주무관청에 대하여 처분허가신청절차를 이행할 것을 청구할 권한이 없음. <참조판례, 대법원 1998.8.21. 선고 98다19202, 19219판결> -재단법인이 정관의 변경을 초래하는 기본재산의 처분을 위하여 주무관청의 허가를 신청할 것인지 여부는 특별한 사정이 없는 한 재단법인의 의사에 맡겨져 있다고 할 것이므로, 채무자인 재단법인에 다른 재산이 없어 기본재산을 처분하지 않고는 채무의 변제가 불가능하다고 하더라도, 재단법인으로부터 기본재산을 양수한 자도 아니고 금전채권자들에 불과한 자에게는 강제이행청구권의 실질적인 실현을 위하여 필요하다는 사유만으로 기본재산의 처분을 희망하지도 않는 재단법인을 상대로 주무관청에 대하여 기본재산에 대한 처분허가신청절차를 이행할 것을 청구할 권한이 없다. 청산･파산 절차가 진행 중인 경우는 청산인 또는 파산관재인이 신청할 수 있음 | \n |  | "}, {"p": 255, "t": "16\n사회복지법인의 해산관련\n(’12.12, 법무부 법무심의관실)\n(질의1) 민법상 법인 해산신고는 수리를 요하는 신고인지 아니면 자기 완결적 신고인지 여부 (질의2)위 해산신고가 수리를 요하는 신고가 아니라 하더라도 청산인 선임을 둘러싼 소송이 진행 중인 상황에서 법인 해산신고 수리를 보류할 수 있는지 여부 (질의3)A도로부터 설립허가가 취소된 사회복지법인 청산법인이 민법에 의거 하여 법인청산절차를 진행하는 과정에서 채권의 추심, 변제 등을 위한 기본재산 및 잔여재산을 처리하는 업무를 A도에서 수행하여야 하는지, A도의 사무처리위임규칙에 따라 사회복지 법인의 기본재산처분하가권이 위임된 B군에서 수행하여야 하는지\n |  | \n | 가. 질의 1에 대하여 -신고란 특정한 사실관계와 법률관계의 존부 및 그 내용을 행정청에 통보하면 그것으로 종료하는 것이므로 행정청의 별도의 의사표시를 요하지 않으며, 「행정절차법」 제40조에서도 신고가 자기완결적인 행위임을 규정하고 있음 -신고가 수리를 요하는 경우도 있지만 이는 관련 법령의 취지를 종합할 때 행정청에 인･허가적 의미를 가지는 사항에 관한 법령의 요건에 관한 심사의무가 있는 경우로 제한되고, 「민법」 제86조의 해산신고는 이와 같이 특정행위나 시설설치 등에 대한 인･허가적인 의미를 가지는 사항에 해당한다고 보기는 어려우므로, 수리를 요하는 신고로 볼 필요는 없을 것으로 판단됨 | \n |  | "}, {"p": 256, "t": " |  | \n | 나. 질의 2에 대하여 -법인은 해산 시 파산의 경우를 제외하고는 해산등기를 하여야 하고(「민법」 제85조제1항), 등기를 해태하면 과태료가 부과될 뿐 아니라(「민법」 제97조제1호), 해산등기를 하지 아니하면 제3자에게 해산사실을 대항할 수 없어 대외적으로 해산의 효력을 주장할 수 없게 됨 -해산등기사항은 해산의 사유 및 연월일, 청산인에 관한 사항(성명, 주소, 대표권제한)이고, 해산신고는 이러한 해산등기사항을 주무관청에 신고하는 것으로서, 해산에 관한 어떠한 사법적 효력을 전제로 하는 것이 아니라 해산등기사실 및 관련 내용을 주무관청에 알리는 것에 불과하고 해산등기사항에 관한 어떠한 요건심사를 전제로 하는 것이 아님 -질의사안과 같이 청산인과 관련한 소송이 있을 경우, 후에 청산인이 변경되면 이는 변경등기를 하게 될 것이고(「민법」 제85조제2항), 그러한 변경가능성을 이유로 신고자체를 수리거절할 필요는 없을 것으로 판단됨 -또한 이사자격 등과 관련한 취소소송이 진행 중인 때에도 해당 이사의 임기는 진행된다거나, 무효 등을 다투는 해당 결의에 의하여 선임된 이사도 회사대표로서의 자격을 인정한 판결 등에 비추어 볼 때, 청산인에 대한 해임청구소송이 진행 중이라고 하여도 신고를 유보할 사항은 아니라고 판단됨 다. 질의 3에 대하여 -청산은 법인격이 해소되어 향후 소멸되기 전에 채권채무 관계를 정리하는 것이라 할 것이므로, 법인 존속 중에 하는 기본재산의 처분과는 다른 문제라 할 것임 -즉 해산･청산은 설립허가와 같은 위치에서 논의되어야 할 사항이라고 할 것인바, 해당 위임사무규칙에서는 설립이나 해산(청산) 등에 대해서는 위임하고 있지 않는 것으로 보이므로, 설립허가청에서 해산(청산)에 관한 업무를 담당하는 것이 적절하다고 판단됨 | \n |  | "}]}]}, {"no": 9, "title": "관계법령", "start": 257, "end": 293, "sections": [{"title": "1. 「민법」", "start": 259, "end": 268, "html": "<div class=\"pchip\" id=\"p259\"><span>원문 259쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=265\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[시행 2026. 1. 1.] [법률 제20432호, 2024. 9. 20., 일부개정]<\/div><div class=\"ln p\">법무부(법무심의관실) 02-2110-3164<\/div><div class=\"ln p\">제3장 법인<\/div><div class=\"ln p\">제1절 총칙<\/div><div class=\"ln p\">제31조(법인성립의 준칙) 법인은 법률의 규정에 의함이 아니면 성립하지 못한다.<\/div><div class=\"ln p\">제32조(비영리법인의 설립과 허가) 학술, 종교, 자선, 기예, 사교 기타 영리아닌 사업을 목적으로 하는 사단 또는 재단은 주무관청의 허가를 얻어 이를 법인으로 할 수 있다.<\/div><div class=\"ln p\">제33조(법인설립의 등기) 법인은 그 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다.<\/div><div class=\"ln p\">제34조(법인의 권리능력) 법인은 법률의 규정에 좇아 정관으로 정한 목적의 범위내에서 권리와 의무의 주체가 된다.<\/div><div class=\"ln p\">제35조(법인의 불법행위능력) ①법인은 이사 기타 대표자가 그 직무에 관하여 타인에게 가한 손해를 배상할 책임이 있다. 이사 기타 대표자는 이로 인하여 자기의 손해배상책임을 면하지 못한다.<\/div><div class=\"ln p\">②법인의 목적범위외의 행위로 인하여 타인에게 손해를 가한 때에는 그 사항의 의결에 찬성하거나 그 의결을 집행한 사원, 이사 및 기타 대표자가 연대하여 배상하여야 한다.<\/div><div class=\"ln p\">제36조(법인의 주소) 법인의 주소는 그 주된 사무소의 소재지에 있는 것으로 한다.<\/div><div class=\"ln p\">제37조(법인의 사무의 검사, 감독) 법인의 사무는 주무관청이 검사, 감독한다.<\/div><div class=\"pchip\" id=\"p260\"><span>원문 260쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=266\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제38조(법인의 설립허가의 취소) 법인이 목적 이외의 사업을 하거나 설립허가의 조건에 위반하거나 기타 공익을 해하는 행위를 한 때에는 주무관청은 그 허가를 취소할 수 있다.<\/div><div class=\"ln p\">제39조(영리법인) ①영리를 목적으로 하는 사단은 상사회사설립의 조건에 좇아 이를 법인으로 할 수 있다.<\/div><div class=\"ln p\">②전항의 사단법인에는 모두 상사회사에 관한 규정을 준용한다.<\/div><div class=\"ln p\">제2절 설립<\/div><div class=\"ln p\">제40조(사단법인의 정관) 사단법인의 설립자는 다음 각호의 사항을 기재한 정관을 작성하여 기명날인하여야 한다.<\/div><div class=\"ln p\">1. 목적<\/div><div class=\"ln p\">2. 명칭<\/div><div class=\"ln p\">3. 사무소의 소재지<\/div><div class=\"ln p\">4. 자산에 관한 규정<\/div><div class=\"ln p\">5. 이사의 임면에 관한 규정<\/div><div class=\"ln p\">6. 사원자격의 득실에 관한 규정<\/div><div class=\"ln p\">7. 존립시기나 해산사유를 정하는 때에는 그 시기 또는 사유<\/div><div class=\"ln p\">제41조(이사의 대표권에 대한 제한) 이사의 대표권에 대한 제한은 이를 정관에 기재하지 아니하면 그 효력이 없다.<\/div><div class=\"ln p\">제42조(사단법인의 정관의 변경) ①사단법인의 정관은 총사원 3분의 2 이상의 동의가 있는 때에 한하여 이를 변경할 수 있다. 그러나 정수에 관하여 정관에 다른 규정이 있는 때에는 그 규정에 의한다.<\/div><div class=\"ln p\">②정관의 변경은 주무관청의 허가를 얻지 아니하면 그 효력이 없다.<\/div><div class=\"ln p\">제43조(재단법인의 정관) 재단법인의 설립자는 일정한 재산을 출연하고 제40조제1호 내지 제5호의 사항을 기재한 정관을 작성하여 기명날인하여야 한다.<\/div><div class=\"ln p\">제44조(재단법인의 정관의 보충) 재단법인의 설립자가 그 명칭, 사무소소재지 또는 이사임면의 방법을 정하지 아니하고 사망한 때에는 이해관계인 또는 검사의 청구에 의하여 법원이 이를 정한다.<\/div><div class=\"pchip\" id=\"p261\"><span>원문 261쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=267\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제45조(재단법인의 정관변경) ①재단법인의 정관은 그 변경방법을 정관에 정한 때에 한하여 변경할 수 있다.<\/div><div class=\"ln p\">②재단법인의 목적달성 또는 그 재산의 보전을 위하여 적당한 때에는 전항의 규정에 불구하고 명칭 또는 사무소의 소재지를 변경할 수 있다.<\/div><div class=\"ln p\">③제42조제2항의 규정은 전2항의 경우에 준용한다.<\/div><div class=\"ln p\">제46조(재단법인의 목적 기타의 변경) 재단법인의 목적을 달성할 수 없는 때에는 설립자나 이사는 주무관청의 허가를 얻어 설립의 취지를 참작하여 그 목적 기타 정관의 규정을 변경할 수 있다.<\/div><div class=\"ln p\">제47조(증여, 유증에 관한 규정의 준용) ①생전처분으로 재단법인을 설립하는 때에는 증여에 관한 규정을 준용한다.<\/div><div class=\"ln p\">②유언으로 재단법인을 설립하는 때에는 유증에 관한 규정을 준용한다.<\/div><div class=\"ln p\">제48조(출연재산의 귀속시기) ①생전처분으로 재단법인을 설립하는 때에는 출연재산은 법인이 성립된 때로부터 법인의 재산이 된다.<\/div><div class=\"ln p\">②유언으로 재단법인을 설립하는 때에는 출연재산은 유언의 효력이 발생한 때로부터 법인에 귀속한 것으로 본다.<\/div><div class=\"ln p\">제49조(법인의 등기사항) ①법인설립의 허가가 있는 때에는 3주간내에 주된 사무소소재지에서 설립등기를 하여야 한다.<\/div><div class=\"ln p\">②전항의 등기사항은 다음과 같다.<\/div><div class=\"ln p\">1. 목적<\/div><div class=\"ln p\">2. 명칭<\/div><div class=\"ln p\">3. 사무소<\/div><div class=\"ln p\">4. 설립허가의 연월일<\/div><div class=\"ln p\">5. 존립시기나 해산이유를 정한 때에는 그 시기 또는 사유<\/div><div class=\"ln p\">6. 자산의 총액<\/div><div class=\"ln p\">7. 출자의 방법을 정한 때에는 그 방법<\/div><div class=\"pchip\" id=\"p262\"><span>원문 262쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=268\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">8. 이사의 성명, 주소<\/div><div class=\"ln p\">9. 이사의 대표권을 제한한 때에는 그 제한<\/div><div class=\"ln p\">제50조[분사무소(分事務所) 설치의 등기]법인이 분사무소를 설치한 경우에는 주사무소(主事務所)의 소재지에서 3주일 내에 분사무소 소재지와 설치 연월일을 등기하여야 한다.<\/div><div class=\"ln p\">[전문개정 2024. 9. 20.]<\/div><div class=\"ln p\">제51조(사무소 이전의 등기) ① 법인이 주사무소를 이전한 경우에는 종전 소재지 또는 새 소재지에서 3주일 내에 새 소재지와 이전 연월일을 등기하여야 한다.<\/div><div class=\"ln p\">② 법인이 분사무소를 이전한 경우에는 주사무소 소재지에서 3주일 내에 새 소재지와 이전 연월일을 등기하여야 한다.<\/div><div class=\"ln p\">[전문개정 2024. 9. 20.]<\/div><div class=\"ln p\">제52조(변경등기) 제49조제2항의 사항 중에 변경이 있는 때에는 3주간내에 변경등기를 하여야 한다.<\/div><div class=\"ln p\">제52조의2(직무집행정지 등 가처분의 등기) 이사의 직무집행을 정지하거나 직무대행자를 선임하는 가처분을 하거나 그 가처분을 변경ㆍ취소하는 경우에는 주사무소가 있는 곳의 등기소에서 이를 등기하여야 한다. &lt;개정 2024. 9. 20.&gt;<\/div><div class=\"ln p\">[본조신설 2001. 12. 29.]<\/div><div class=\"ln p\">제53조(등기기간의 기산) 전3조의 규정에 의하여 등기할 사항으로 관청의 허가를 요하는 것은 그 허가서가 도착한 날로부터 등기의 기간을 기산한다.<\/div><div class=\"ln p\">제54조(설립등기 이외의 등기의 효력과 등기사항의 공고) ①설립등기 이외의 본절의 등기사항은 그 등기후가 아니면 제삼자에게 대항하지 못한다.<\/div><div class=\"ln p\">②등기한 사항은 법원이 지체없이 공고하여야 한다.<\/div><div class=\"ln p\">제55조(재산목록과 사원명부) ①법인은 성립한 때 및 매년 3월내에 재산목록을 작성하여 사무소에 비치하여야 한다. 사업연도를 정한 법인은 성립한 때 및 그 연도말에 이를 작성하여야 한다.<\/div><div class=\"ln p\">②사단법인은 사원명부를 비치하고 사원의 변경이 있는 때에는 이를 기재하여야 한다.<\/div><div class=\"pchip\" id=\"p263\"><span>원문 263쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=269\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제56조(사원권의 양도, 상속금지) 사단법인의 사원의 지위는 양도 또는 상속할 수 없다.<\/div><div class=\"ln p\">제3절 기관<\/div><div class=\"ln p\">제57조(이사) 법인은 이사를 두어야 한다.<\/div><div class=\"ln p\">제58조(이사의 사무집행) ①이사는 법인의 사무를 집행한다.<\/div><div class=\"ln p\">②이사가 수인인 경우에는 정관에 다른 규정이 없으면 법인의 사무집행은 이사의 과반수로써 결정한다.<\/div><div class=\"ln p\">제59조(이사의 대표권) ①이사는 법인의 사무에 관하여 각자 법인을 대표한다. 그러나 정관에 규정한 취지에 위반할 수 없고 특히 사단법인은 총회의 의결에 의하여야 한다.<\/div><div class=\"ln p\">②법인의 대표에 관하여는 대리에 관한 규정을 준용한다.<\/div><div class=\"ln p\">제60조(이사의 대표권에 대한 제한의 대항요건) 이사의 대표권에 대한 제한은 등기하지 아니하면 제삼자에게 대항하지 못한다.<\/div><div class=\"ln p\">제60조의2(직무대행자의 권한) ①제52조의2의 직무대행자는 가처분명령에 다른 정함이 있는 경우 외에는 법인의 통상사무에 속하지 아니한 행위를 하지 못한다. 다만, 법원의 허가를 얻은 경우에는 그러하지 아니하다.<\/div><div class=\"ln p\">②직무대행자가 제1항의 규정에 위반한 행위를 한 경우에도 법인은 선의의 제3자에 대하여 책임을 진다.<\/div><div class=\"ln p\">[본조신설 2001. 12. 29.]<\/div><div class=\"ln p\">제61조(이사의 주의의무) 이사는 선량한 관리자의 주의로 그 직무를 행하여야 한다.<\/div><div class=\"ln p\">제62조(이사의 대리인 선임) 이사는 정관 또는 총회의 결의로 금지하지 아니한 사항에 한하여 타인으로 하여금 특정한 행위를 대리하게 할 수 있다.<\/div><div class=\"ln p\">제63조(임시이사의 선임) 이사가 없거나 결원이 있는 경우에 이로 인하여 손해가 생길 염려 있는 때에는 법원은 이해관계인이나 검사의 청구에 의하여 임시이사를 선임하여야 한다.<\/div><div class=\"pchip\" id=\"p264\"><span>원문 264쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=270\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제64조(특별대리인의 선임) 법인과 이사의 이익이 상반하는 사항에 관하여는 이사는 대표권이 없다. 이 경우에는 전조의 규정에 의하여 특별대리인을 선임하여야 한다.<\/div><div class=\"ln p\">제65조(이사의 임무해태) 이사가 그 임무를 해태한 때에는 그 이사는 법인에 대하여 연대하여 손해배상의 책임이 있다.<\/div><div class=\"ln p\">제66조(감사) 법인은 정관 또는 총회의 결의로 감사를 둘 수 있다.<\/div><div class=\"ln p\">제67조(감사의 직무) 감사의 직무는 다음과 같다.<\/div><div class=\"ln p\">1. 법인의 재산상황을 감사하는 일<\/div><div class=\"ln p\">2. 이사의 업무집행의 상황을 감사하는 일<\/div><div class=\"ln p\">3. 재산상황 또는 업무집행에 관하여 부정, 불비한 것이 있음을 발견한 때에는 이를 총회 또는 주무관청에 보고하는 일<\/div><div class=\"ln p\">4. 전호의 보고를 하기 위하여 필요있는 때에는 총회를 소집하는 일<\/div><div class=\"ln p\">제68조(총회의 권한) 사단법인의 사무는 정관으로 이사 또는 기타 임원에게 위임한 사항외에는 총회의 결의에 의하여야 한다.<\/div><div class=\"ln p\">제69조(통상총회) 사단법인의 이사는 매년 1회 이상 통상총회를 소집하여야 한다.<\/div><div class=\"ln p\">제70조(임시총회) ①사단법인의 이사는 필요하다고 인정한 때에는 임시총회를 소집할 수 있다.<\/div><div class=\"ln p\">②총사원의 5분의 1 이상으로부터 회의의 목적사항을 제시하여 청구한 때에는 이사는 임시총회를 소집하여야 한다. 이 정수는 정관으로 증감할 수 있다.<\/div><div class=\"ln p\">③전항의 청구있는 후 2주간내에 이사가 총회소집의 절차를 밟지 아니한 때에는 청구한 사원은 법원의 허가를 얻어 이를 소집할 수 있다.<\/div><div class=\"ln p\">제71조(총회의 소집) 총회의 소집은 1주간전에 그 회의의 목적사항을 기재한 통지를 발하고 기타 정관에 정한 방법에 의하여야 한다.<\/div><div class=\"ln p\">제72조(총회의 결의사항) 총회는 전조의 규정에 의하여 통지한 사항에 관하여서만 결의할 수 있다. 그러나 정관에 다른 규정이 있는 때에는 그 규정에 의한다.<\/div><div class=\"pchip\" id=\"p265\"><span>원문 265쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=271\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제73조(사원의 결의권) ①각 사원의 결의권은 평등으로 한다.<\/div><div class=\"ln p\">②사원은 서면이나 대리인으로 결의권을 행사할 수 있다.<\/div><div class=\"ln p\">③전2항의 규정은 정관에 다른 규정이 있는 때에는 적용하지 아니한다.<\/div><div class=\"ln p\">제74조(사원이 결의권없는 경우) 사단법인과 어느 사원과의 관계사항을 의결하는 경우에는 그 사원은 결의권이 없다.<\/div><div class=\"ln p\">제75조(총회의 결의방법) ①총회의 결의는 본법 또는 정관에 다른 규정이 없으면 사원 과반수의 출석과 출석사원의 결의권의 과반수로써 한다.<\/div><div class=\"ln p\">②제73조제2항의 경우에는 당해사원은 출석한 것으로 한다.<\/div><div class=\"ln p\">제76조(총회의 의사록) ①총회의 의사에 관하여는 의사록을 작성하여야 한다.<\/div><div class=\"ln p\">②의사록에는 의사의 경과, 요령 및 결과를 기재하고 의장 및 출석한 이사가 기명날인하여야 한다.<\/div><div class=\"ln p\">③이사는 의사록을 주된 사무소에 비치하여야 한다.<\/div><div class=\"ln p\">제4절 해산<\/div><div class=\"ln p\">제77조(해산사유) ①법인은 존립기간의 만료, 법인의 목적의 달성 또는 달성의 불능 기타 정관에 정한 해산사유의 발생, 파산 또는 설립허가의 취소로 해산한다.<\/div><div class=\"ln p\">②사단법인은 사원이 없게 되거나 총회의 결의로도 해산한다.<\/div><div class=\"ln p\">제78조(사단법인의 해산결의) 사단법인은 총사원 4분의 3 이상의 동의가 없으면 해산을 결의하지 못한다. 그러나 정관에 다른 규정이 있는 때에는 그 규정에 의한다.<\/div><div class=\"ln p\">제79조(파산신청) 법인이 채무를 완제하지 못하게 된 때에는 이사는 지체없이 파산신청을 하여야 한다.<\/div><div class=\"ln p\">제80조(잔여재산의 귀속) ①해산한 법인의 재산은 정관으로 지정한 자에게 귀속한다.<\/div><div class=\"ln p\">②정관으로 귀속권리자를 지정하지 아니하거나 이를 지정하는 방법을 정하지 아니한 때에는 이사 또는 청산인은 주무관청의 허가를 얻어 그 법인의 목적에 유사한 목적을 위하여 그 재산을 처분할 수 있다. 그러나 사단법인에 있어서는 총회의 결의가 있어야 한다.<\/div><div class=\"pchip\" id=\"p266\"><span>원문 266쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=272\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">③전2항의 규정에 의하여 처분되지 아니한 재산은 국고에 귀속한다.<\/div><div class=\"ln p\">제81조(청산법인) 해산한 법인은 청산의 목적범위내에서만 권리가 있고 의무를 부담한다.<\/div><div class=\"ln p\">제82조(청산인) 법인이 해산한 때에는 파산의 경우를 제하고는 이사가 청산인이 된다. 그러나 정관 또는 총회의 결의로 달리 정한 바가 있으면 그에 의한다.<\/div><div class=\"ln p\">제83조(법원에 의한 청산인의 선임) 전조의 규정에 의하여 청산인이 될 자가 없거나 청산인의 결원으로 인하여 손해가 생길 염려가 있는 때에는 법원은 직권 또는 이해관계인이나 검사의 청구에 의하여 청산인을 선임할 수 있다.<\/div><div class=\"ln p\">제84조(법원에 의한 청산인의 해임) 중요한 사유가 있는 때에는 법원은 직권 또는 이해관계인이나 검사의 청구에 의하여 청산인을 해임할 수 있다.<\/div><div class=\"ln p\">제85조(해산등기) ① 청산인은 법인이 파산으로 해산한 경우가 아니면 취임 후 3주일 내에 다음 각 호의 사항을 주사무소 소재지에서 등기하여야 한다.<\/div><div class=\"ln p\">1. 해산 사유와 해산 연월일<\/div><div class=\"ln p\">2. 청산인의 성명과 주소<\/div><div class=\"ln p\">3. 청산인의 대표권을 제한한 경우에는 그 제한<\/div><div class=\"ln p\">② 제1항의 등기에 관하여는 제52조를 준용한다.<\/div><div class=\"ln p\">[전문개정 2024. 9. 20.]<\/div><div class=\"ln p\">제86조(해산신고) ①청산인은 파산의 경우를 제하고는 그 취임후 3주간내에 전조제1항의 사항을 주무관청에 신고하여야 한다.<\/div><div class=\"ln p\">②청산중에 취임한 청산인은 그 성명 및 주소를 신고하면 된다.<\/div><div class=\"ln p\">제87조(청산인의 직무) ①청산인의 직무는 다음과 같다.<\/div><div class=\"ln p\">1. 현존사무의 종결<\/div><div class=\"ln p\">2. 채권의 추심 및 채무의 변제<\/div><div class=\"ln p\">3. 잔여재산의 인도<\/div><div class=\"ln p\">②청산인은 전항의 직무를 행하기 위하여 필요한 모든 행위를 할 수 있다.<\/div><div class=\"pchip\" id=\"p267\"><span>원문 267쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=273\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제88조(채권신고의 공고) ①청산인은 취임한 날로부터 2월내에 3회 이상의 공고로 채권자에 대하여 일정한 기간내에 그 채권을 신고할 것을 최고하여야 한다. 그 기간은 2월 이상이어야 한다.<\/div><div class=\"ln p\">②전항의 공고에는 채권자가 기간내에 신고하지 아니하면 청산으로부터 제외될 것을 표시하여야 한다.<\/div><div class=\"ln p\">③제1항의 공고는 법원의 등기사항의 공고와 동일한 방법으로 하여야 한다.<\/div><div class=\"ln p\">제89조(채권신고의 최고) 청산인은 알고 있는 채권자에게 대하여는 각각 그 채권신고를 최고하여야 한다. 알고 있는 채권자는 청산으로부터 제외하지 못한다.<\/div><div class=\"ln p\">제90조(채권신고기간내의 변제금지) 청산인은 제88조제1항의 채권신고기간내에는 채권자에 대하여 변제하지 못한다. 그러나 법인은 채권자에 대한 지연손해배상의 의무를 면하지 못한다.<\/div><div class=\"ln p\">제91조(채권변제의 특례) ①청산 중의 법인은 변제기에 이르지 아니한 채권에 대하여도 변제할 수 있다.<\/div><div class=\"ln p\">②전항의 경우에는 조건있는 채권, 존속기간의 불확정한 채권 기타 가액의 불확정한 채권에 관하여는 법원이 선임한 감정인의 평가에 의하여 변제하여야 한다.<\/div><div class=\"ln p\">제92조(청산으로부터 제외된 채권) 청산으로부터 제외된 채권자는 법인의 채무를 완제한 후 귀속권리자에게 인도하지 아니한 재산에 대하여서만 변제를 청구할 수 있다.<\/div><div class=\"ln p\">제93조(청산중의 파산) ①청산중 법인의 재산이 그 채무를 완제하기에 부족한 것이 분명하게 된 때에는 청산인은 지체없이 파산선고를 신청하고 이를 공고하여야 한다.<\/div><div class=\"ln p\">②청산인은 파산관재인에게 그 사무를 인계함으로써 그 임무가 종료한다.<\/div><div class=\"ln p\">③제88조제3항의 규정은 제1항의 공고에 준용한다.<\/div><div class=\"ln p\">제94조(청산종결의 등기와 신고) 청산이 종결한 때에는 청산인은 3주간내에 이를 등기하고 주무관청에 신고하여야 한다.<\/div><div class=\"ln p\">제95조(해산, 청산의 검사, 감독) 법인의 해산 및 청산은 법원이 검사, 감독한다.<\/div><div class=\"pchip\" id=\"p268\"><span>원문 268쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=274\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제96조(준용규정) 제58조제2항, 제59조 내지 제62조, 제64조, 제65조 및 제70조의 규정은 청산인에 이를 준용한다.<\/div><div class=\"ln p\">제5절 벌칙<\/div><div class=\"ln p\">제97조(벌칙) 법인의 이사, 감사 또는 청산인은 다음 각호의 경우에는 500만원 이하의 과태료에 처한다. &lt;개정 2007. 12. 21.&gt;<\/div><div class=\"ln p\">1. 본장에 규정한 등기를 해태한 때<\/div><div class=\"ln p\">2. 제55조의 규정에 위반하거나 재산목록 또는 사원명부에 부정기재를 한 때<\/div><div class=\"ln p\">3. 제37조, 제95조에 규정한 검사, 감독을 방해한 때<\/div><div class=\"ln p\">4. 주무관청 또는 총회에 대하여 사실아닌 신고를 하거나 사실을 은폐한 때<\/div><div class=\"ln p\">5. 제76조와 제90조의 규정에 위반한 때<\/div><div class=\"ln p\">6. 제79조, 제93조의 규정에 위반하여 파산선고의 신청을 해태한 때<\/div><div class=\"ln p\">7. 제88조, 제93조에 정한 공고를 해태하거나 부정한 공고를 한 때<\/div><div class=\"ln p\">부  칙 &lt;제20432호, 2024. 9. 20.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 법은 2025년 1월 31일부터 시행한다. 다만, 제1004조의2의 개정규정 및 부칙 제4조는 2026년 1월 1일부터 시행한다.<\/div><div class=\"ln p\">제2조(상속권 상실 선고에 관한 적용례) 제1004조의2의 개정규정은 2024년 4월 25일 이후 상속이 개시되는 경우로서 같은 개정규정 시행 전에 같은 조 제1항 또는 제3항 각 호에 해당하는 행위가 있었던 경우에 대해서도 적용한다.<\/div><div class=\"ln p\">제3조(상속권 상실 선고에 관한 특례) 2024년 4월 25일 이후 제1004조의2의 개정규정의 시행일인 2026년 1월 1일 전에 상속이 개시된 경우로서 제1004조의2제3항 각 호의 사유가 있는 사람이 상속인이 되었음을 같은 개정규정 시행 전에 안 공동상속인은 같은 조 제3항 각 호 외의 부분에도 불구하고 같은 개정규정 시행일부터 6개월 이내에 상속권 상실 청구를 할 수 있다. 같은 조 제4항에 따라 상속인이 될 사람 또한 같다.<\/div><div class=\"ln p\">제4조(다른 법률의 개정) 가사소송법 일부를 다음과 같이 개정한다.<\/div><div class=\"ln p\">제2조제1항제1호나목에 15)를 다음과 같이 신설한다.<\/div><div class=\"ln h4\">15) 상속권 상실 선고<\/div><div class=\"ln p\">제2조제1항제2호가목에 29)를 다음과 같이 신설한다.<\/div><div class=\"ln h4\">29) 「민법」 제1004조의2제7항에 따른 상속재산의 보존 및 관리를 위한 처분<\/div>", "pages": [{"p": 259, "t": "[시행 2026. 1. 1.] [법률 제20432호, 2024. 9. 20., 일부개정]\n법무부(법무심의관실) 02-2110-3164\n제3장 법인\n제1절 총칙\n제31조(법인성립의 준칙) 법인은 법률의 규정에 의함이 아니면 성립하지 못한다.\n제32조(비영리법인의 설립과 허가) 학술, 종교, 자선, 기예, 사교 기타 영리아닌 사업을 목적으로 하는 사단 또는 재단은 주무관청의 허가를 얻어 이를 법인으로 할 수 있다.\n제33조(법인설립의 등기) 법인은 그 주된 사무소의 소재지에서 설립등기를 함으로써 성립한다.\n제34조(법인의 권리능력) 법인은 법률의 규정에 좇아 정관으로 정한 목적의 범위내에서 권리와 의무의 주체가 된다.\n제35조(법인의 불법행위능력) ①법인은 이사 기타 대표자가 그 직무에 관하여 타인에게 가한 손해를 배상할 책임이 있다. 이사 기타 대표자는 이로 인하여 자기의 손해배상책임을 면하지 못한다.\n②법인의 목적범위외의 행위로 인하여 타인에게 손해를 가한 때에는 그 사항의 의결에 찬성하거나 그 의결을 집행한 사원, 이사 및 기타 대표자가 연대하여 배상하여야 한다.\n제36조(법인의 주소) 법인의 주소는 그 주된 사무소의 소재지에 있는 것으로 한다.\n제37조(법인의 사무의 검사, 감독) 법인의 사무는 주무관청이 검사, 감독한다."}, {"p": 260, "t": "제38조(법인의 설립허가의 취소) 법인이 목적 이외의 사업을 하거나 설립허가의 조건에 위반하거나 기타 공익을 해하는 행위를 한 때에는 주무관청은 그 허가를 취소할 수 있다.\n제39조(영리법인) ①영리를 목적으로 하는 사단은 상사회사설립의 조건에 좇아 이를 법인으로 할 수 있다.\n②전항의 사단법인에는 모두 상사회사에 관한 규정을 준용한다.\n제2절 설립\n제40조(사단법인의 정관) 사단법인의 설립자는 다음 각호의 사항을 기재한 정관을 작성하여 기명날인하여야 한다.\n1. 목적\n2. 명칭\n3. 사무소의 소재지\n4. 자산에 관한 규정\n5. 이사의 임면에 관한 규정\n6. 사원자격의 득실에 관한 규정\n7. 존립시기나 해산사유를 정하는 때에는 그 시기 또는 사유\n제41조(이사의 대표권에 대한 제한) 이사의 대표권에 대한 제한은 이를 정관에 기재하지 아니하면 그 효력이 없다.\n제42조(사단법인의 정관의 변경) ①사단법인의 정관은 총사원 3분의 2 이상의 동의가 있는 때에 한하여 이를 변경할 수 있다. 그러나 정수에 관하여 정관에 다른 규정이 있는 때에는 그 규정에 의한다.\n②정관의 변경은 주무관청의 허가를 얻지 아니하면 그 효력이 없다.\n제43조(재단법인의 정관) 재단법인의 설립자는 일정한 재산을 출연하고 제40조제1호 내지 제5호의 사항을 기재한 정관을 작성하여 기명날인하여야 한다.\n제44조(재단법인의 정관의 보충) 재단법인의 설립자가 그 명칭, 사무소소재지 또는 이사임면의 방법을 정하지 아니하고 사망한 때에는 이해관계인 또는 검사의 청구에 의하여 법원이 이를 정한다."}, {"p": 261, "t": "제45조(재단법인의 정관변경) ①재단법인의 정관은 그 변경방법을 정관에 정한 때에 한하여 변경할 수 있다.\n②재단법인의 목적달성 또는 그 재산의 보전을 위하여 적당한 때에는 전항의 규정에 불구하고 명칭 또는 사무소의 소재지를 변경할 수 있다.\n③제42조제2항의 규정은 전2항의 경우에 준용한다.\n제46조(재단법인의 목적 기타의 변경) 재단법인의 목적을 달성할 수 없는 때에는 설립자나 이사는 주무관청의 허가를 얻어 설립의 취지를 참작하여 그 목적 기타 정관의 규정을 변경할 수 있다.\n제47조(증여, 유증에 관한 규정의 준용) ①생전처분으로 재단법인을 설립하는 때에는 증여에 관한 규정을 준용한다.\n②유언으로 재단법인을 설립하는 때에는 유증에 관한 규정을 준용한다.\n제48조(출연재산의 귀속시기) ①생전처분으로 재단법인을 설립하는 때에는 출연재산은 법인이 성립된 때로부터 법인의 재산이 된다.\n②유언으로 재단법인을 설립하는 때에는 출연재산은 유언의 효력이 발생한 때로부터 법인에 귀속한 것으로 본다.\n제49조(법인의 등기사항) ①법인설립의 허가가 있는 때에는 3주간내에 주된 사무소소재지에서 설립등기를 하여야 한다.\n②전항의 등기사항은 다음과 같다.\n1. 목적\n2. 명칭\n3. 사무소\n4. 설립허가의 연월일\n5. 존립시기나 해산이유를 정한 때에는 그 시기 또는 사유\n6. 자산의 총액\n7. 출자의 방법을 정한 때에는 그 방법"}, {"p": 262, "t": "8. 이사의 성명, 주소\n9. 이사의 대표권을 제한한 때에는 그 제한\n제50조[분사무소(分事務所) 설치의 등기]법인이 분사무소를 설치한 경우에는 주사무소(主事務所)의 소재지에서 3주일 내에 분사무소 소재지와 설치 연월일을 등기하여야 한다.\n[전문개정 2024. 9. 20.]\n제51조(사무소 이전의 등기) ① 법인이 주사무소를 이전한 경우에는 종전 소재지 또는 새 소재지에서 3주일 내에 새 소재지와 이전 연월일을 등기하여야 한다.\n② 법인이 분사무소를 이전한 경우에는 주사무소 소재지에서 3주일 내에 새 소재지와 이전 연월일을 등기하여야 한다.\n[전문개정 2024. 9. 20.]\n제52조(변경등기) 제49조제2항의 사항 중에 변경이 있는 때에는 3주간내에 변경등기를 하여야 한다.\n제52조의2(직무집행정지 등 가처분의 등기) 이사의 직무집행을 정지하거나 직무대행자를 선임하는 가처분을 하거나 그 가처분을 변경ㆍ취소하는 경우에는 주사무소가 있는 곳의 등기소에서 이를 등기하여야 한다. <개정 2024. 9. 20.>\n[본조신설 2001. 12. 29.]\n제53조(등기기간의 기산) 전3조의 규정에 의하여 등기할 사항으로 관청의 허가를 요하는 것은 그 허가서가 도착한 날로부터 등기의 기간을 기산한다.\n제54조(설립등기 이외의 등기의 효력과 등기사항의 공고) ①설립등기 이외의 본절의 등기사항은 그 등기후가 아니면 제삼자에게 대항하지 못한다.\n②등기한 사항은 법원이 지체없이 공고하여야 한다.\n제55조(재산목록과 사원명부) ①법인은 성립한 때 및 매년 3월내에 재산목록을 작성하여 사무소에 비치하여야 한다. 사업연도를 정한 법인은 성립한 때 및 그 연도말에 이를 작성하여야 한다.\n②사단법인은 사원명부를 비치하고 사원의 변경이 있는 때에는 이를 기재하여야 한다."}, {"p": 263, "t": "제56조(사원권의 양도, 상속금지) 사단법인의 사원의 지위는 양도 또는 상속할 수 없다.\n제3절 기관\n제57조(이사) 법인은 이사를 두어야 한다.\n제58조(이사의 사무집행) ①이사는 법인의 사무를 집행한다.\n②이사가 수인인 경우에는 정관에 다른 규정이 없으면 법인의 사무집행은 이사의 과반수로써 결정한다.\n제59조(이사의 대표권) ①이사는 법인의 사무에 관하여 각자 법인을 대표한다. 그러나 정관에 규정한 취지에 위반할 수 없고 특히 사단법인은 총회의 의결에 의하여야 한다.\n②법인의 대표에 관하여는 대리에 관한 규정을 준용한다.\n제60조(이사의 대표권에 대한 제한의 대항요건) 이사의 대표권에 대한 제한은 등기하지 아니하면 제삼자에게 대항하지 못한다.\n제60조의2(직무대행자의 권한) ①제52조의2의 직무대행자는 가처분명령에 다른 정함이 있는 경우 외에는 법인의 통상사무에 속하지 아니한 행위를 하지 못한다. 다만, 법원의 허가를 얻은 경우에는 그러하지 아니하다.\n②직무대행자가 제1항의 규정에 위반한 행위를 한 경우에도 법인은 선의의 제3자에 대하여 책임을 진다.\n[본조신설 2001. 12. 29.]\n제61조(이사의 주의의무) 이사는 선량한 관리자의 주의로 그 직무를 행하여야 한다.\n제62조(이사의 대리인 선임) 이사는 정관 또는 총회의 결의로 금지하지 아니한 사항에 한하여 타인으로 하여금 특정한 행위를 대리하게 할 수 있다.\n제63조(임시이사의 선임) 이사가 없거나 결원이 있는 경우에 이로 인하여 손해가 생길 염려 있는 때에는 법원은 이해관계인이나 검사의 청구에 의하여 임시이사를 선임하여야 한다."}, {"p": 264, "t": "제64조(특별대리인의 선임) 법인과 이사의 이익이 상반하는 사항에 관하여는 이사는 대표권이 없다. 이 경우에는 전조의 규정에 의하여 특별대리인을 선임하여야 한다.\n제65조(이사의 임무해태) 이사가 그 임무를 해태한 때에는 그 이사는 법인에 대하여 연대하여 손해배상의 책임이 있다.\n제66조(감사) 법인은 정관 또는 총회의 결의로 감사를 둘 수 있다.\n제67조(감사의 직무) 감사의 직무는 다음과 같다.\n1. 법인의 재산상황을 감사하는 일\n2. 이사의 업무집행의 상황을 감사하는 일\n3. 재산상황 또는 업무집행에 관하여 부정, 불비한 것이 있음을 발견한 때에는 이를 총회 또는 주무관청에 보고하는 일\n4. 전호의 보고를 하기 위하여 필요있는 때에는 총회를 소집하는 일\n제68조(총회의 권한) 사단법인의 사무는 정관으로 이사 또는 기타 임원에게 위임한 사항외에는 총회의 결의에 의하여야 한다.\n제69조(통상총회) 사단법인의 이사는 매년 1회 이상 통상총회를 소집하여야 한다.\n제70조(임시총회) ①사단법인의 이사는 필요하다고 인정한 때에는 임시총회를 소집할 수 있다.\n②총사원의 5분의 1 이상으로부터 회의의 목적사항을 제시하여 청구한 때에는 이사는 임시총회를 소집하여야 한다. 이 정수는 정관으로 증감할 수 있다.\n③전항의 청구있는 후 2주간내에 이사가 총회소집의 절차를 밟지 아니한 때에는 청구한 사원은 법원의 허가를 얻어 이를 소집할 수 있다.\n제71조(총회의 소집) 총회의 소집은 1주간전에 그 회의의 목적사항을 기재한 통지를 발하고 기타 정관에 정한 방법에 의하여야 한다.\n제72조(총회의 결의사항) 총회는 전조의 규정에 의하여 통지한 사항에 관하여서만 결의할 수 있다. 그러나 정관에 다른 규정이 있는 때에는 그 규정에 의한다."}, {"p": 265, "t": "제73조(사원의 결의권) ①각 사원의 결의권은 평등으로 한다.\n②사원은 서면이나 대리인으로 결의권을 행사할 수 있다.\n③전2항의 규정은 정관에 다른 규정이 있는 때에는 적용하지 아니한다.\n제74조(사원이 결의권없는 경우) 사단법인과 어느 사원과의 관계사항을 의결하는 경우에는 그 사원은 결의권이 없다.\n제75조(총회의 결의방법) ①총회의 결의는 본법 또는 정관에 다른 규정이 없으면 사원 과반수의 출석과 출석사원의 결의권의 과반수로써 한다.\n②제73조제2항의 경우에는 당해사원은 출석한 것으로 한다.\n제76조(총회의 의사록) ①총회의 의사에 관하여는 의사록을 작성하여야 한다.\n②의사록에는 의사의 경과, 요령 및 결과를 기재하고 의장 및 출석한 이사가 기명날인하여야 한다.\n③이사는 의사록을 주된 사무소에 비치하여야 한다.\n제4절 해산\n제77조(해산사유) ①법인은 존립기간의 만료, 법인의 목적의 달성 또는 달성의 불능 기타 정관에 정한 해산사유의 발생, 파산 또는 설립허가의 취소로 해산한다.\n②사단법인은 사원이 없게 되거나 총회의 결의로도 해산한다.\n제78조(사단법인의 해산결의) 사단법인은 총사원 4분의 3 이상의 동의가 없으면 해산을 결의하지 못한다. 그러나 정관에 다른 규정이 있는 때에는 그 규정에 의한다.\n제79조(파산신청) 법인이 채무를 완제하지 못하게 된 때에는 이사는 지체없이 파산신청을 하여야 한다.\n제80조(잔여재산의 귀속) ①해산한 법인의 재산은 정관으로 지정한 자에게 귀속한다.\n②정관으로 귀속권리자를 지정하지 아니하거나 이를 지정하는 방법을 정하지 아니한 때에는 이사 또는 청산인은 주무관청의 허가를 얻어 그 법인의 목적에 유사한 목적을 위하여 그 재산을 처분할 수 있다. 그러나 사단법인에 있어서는 총회의 결의가 있어야 한다."}, {"p": 266, "t": "③전2항의 규정에 의하여 처분되지 아니한 재산은 국고에 귀속한다.\n제81조(청산법인) 해산한 법인은 청산의 목적범위내에서만 권리가 있고 의무를 부담한다.\n제82조(청산인) 법인이 해산한 때에는 파산의 경우를 제하고는 이사가 청산인이 된다. 그러나 정관 또는 총회의 결의로 달리 정한 바가 있으면 그에 의한다.\n제83조(법원에 의한 청산인의 선임) 전조의 규정에 의하여 청산인이 될 자가 없거나 청산인의 결원으로 인하여 손해가 생길 염려가 있는 때에는 법원은 직권 또는 이해관계인이나 검사의 청구에 의하여 청산인을 선임할 수 있다.\n제84조(법원에 의한 청산인의 해임) 중요한 사유가 있는 때에는 법원은 직권 또는 이해관계인이나 검사의 청구에 의하여 청산인을 해임할 수 있다.\n제85조(해산등기) ① 청산인은 법인이 파산으로 해산한 경우가 아니면 취임 후 3주일 내에 다음 각 호의 사항을 주사무소 소재지에서 등기하여야 한다.\n1. 해산 사유와 해산 연월일\n2. 청산인의 성명과 주소\n3. 청산인의 대표권을 제한한 경우에는 그 제한\n② 제1항의 등기에 관하여는 제52조를 준용한다.\n[전문개정 2024. 9. 20.]\n제86조(해산신고) ①청산인은 파산의 경우를 제하고는 그 취임후 3주간내에 전조제1항의 사항을 주무관청에 신고하여야 한다.\n②청산중에 취임한 청산인은 그 성명 및 주소를 신고하면 된다.\n제87조(청산인의 직무) ①청산인의 직무는 다음과 같다.\n1. 현존사무의 종결\n2. 채권의 추심 및 채무의 변제\n3. 잔여재산의 인도\n②청산인은 전항의 직무를 행하기 위하여 필요한 모든 행위를 할 수 있다."}, {"p": 267, "t": "제88조(채권신고의 공고) ①청산인은 취임한 날로부터 2월내에 3회 이상의 공고로 채권자에 대하여 일정한 기간내에 그 채권을 신고할 것을 최고하여야 한다. 그 기간은 2월 이상이어야 한다.\n②전항의 공고에는 채권자가 기간내에 신고하지 아니하면 청산으로부터 제외될 것을 표시하여야 한다.\n③제1항의 공고는 법원의 등기사항의 공고와 동일한 방법으로 하여야 한다.\n제89조(채권신고의 최고) 청산인은 알고 있는 채권자에게 대하여는 각각 그 채권신고를 최고하여야 한다. 알고 있는 채권자는 청산으로부터 제외하지 못한다.\n제90조(채권신고기간내의 변제금지) 청산인은 제88조제1항의 채권신고기간내에는 채권자에 대하여 변제하지 못한다. 그러나 법인은 채권자에 대한 지연손해배상의 의무를 면하지 못한다.\n제91조(채권변제의 특례) ①청산 중의 법인은 변제기에 이르지 아니한 채권에 대하여도 변제할 수 있다.\n②전항의 경우에는 조건있는 채권, 존속기간의 불확정한 채권 기타 가액의 불확정한 채권에 관하여는 법원이 선임한 감정인의 평가에 의하여 변제하여야 한다.\n제92조(청산으로부터 제외된 채권) 청산으로부터 제외된 채권자는 법인의 채무를 완제한 후 귀속권리자에게 인도하지 아니한 재산에 대하여서만 변제를 청구할 수 있다.\n제93조(청산중의 파산) ①청산중 법인의 재산이 그 채무를 완제하기에 부족한 것이 분명하게 된 때에는 청산인은 지체없이 파산선고를 신청하고 이를 공고하여야 한다.\n②청산인은 파산관재인에게 그 사무를 인계함으로써 그 임무가 종료한다.\n③제88조제3항의 규정은 제1항의 공고에 준용한다.\n제94조(청산종결의 등기와 신고) 청산이 종결한 때에는 청산인은 3주간내에 이를 등기하고 주무관청에 신고하여야 한다.\n제95조(해산, 청산의 검사, 감독) 법인의 해산 및 청산은 법원이 검사, 감독한다."}, {"p": 268, "t": "제96조(준용규정) 제58조제2항, 제59조 내지 제62조, 제64조, 제65조 및 제70조의 규정은 청산인에 이를 준용한다.\n제5절 벌칙\n제97조(벌칙) 법인의 이사, 감사 또는 청산인은 다음 각호의 경우에는 500만원 이하의 과태료에 처한다. <개정 2007. 12. 21.>\n1. 본장에 규정한 등기를 해태한 때\n2. 제55조의 규정에 위반하거나 재산목록 또는 사원명부에 부정기재를 한 때\n3. 제37조, 제95조에 규정한 검사, 감독을 방해한 때\n4. 주무관청 또는 총회에 대하여 사실아닌 신고를 하거나 사실을 은폐한 때\n5. 제76조와 제90조의 규정에 위반한 때\n6. 제79조, 제93조의 규정에 위반하여 파산선고의 신청을 해태한 때\n7. 제88조, 제93조에 정한 공고를 해태하거나 부정한 공고를 한 때\n부  칙 <제20432호, 2024. 9. 20.>\n제1조(시행일) 이 법은 2025년 1월 31일부터 시행한다. 다만, 제1004조의2의 개정규정 및 부칙 제4조는 2026년 1월 1일부터 시행한다.\n제2조(상속권 상실 선고에 관한 적용례) 제1004조의2의 개정규정은 2024년 4월 25일 이후 상속이 개시되는 경우로서 같은 개정규정 시행 전에 같은 조 제1항 또는 제3항 각 호에 해당하는 행위가 있었던 경우에 대해서도 적용한다.\n제3조(상속권 상실 선고에 관한 특례) 2024년 4월 25일 이후 제1004조의2의 개정규정의 시행일인 2026년 1월 1일 전에 상속이 개시된 경우로서 제1004조의2제3항 각 호의 사유가 있는 사람이 상속인이 되었음을 같은 개정규정 시행 전에 안 공동상속인은 같은 조 제3항 각 호 외의 부분에도 불구하고 같은 개정규정 시행일부터 6개월 이내에 상속권 상실 청구를 할 수 있다. 같은 조 제4항에 따라 상속인이 될 사람 또한 같다.\n제4조(다른 법률의 개정) 가사소송법 일부를 다음과 같이 개정한다.\n제2조제1항제1호나목에 15)를 다음과 같이 신설한다.\n15) 상속권 상실 선고\n제2조제1항제2호가목에 29)를 다음과 같이 신설한다.\n29) 「민법」 제1004조의2제7항에 따른 상속재산의 보존 및 관리를 위한 처분"}]}, {"title": "2. 「공익법인의 설립·운영에 관한 법률」", "start": 269, "end": 275, "html": "<div class=\"pchip\" id=\"p269\"><span>원문 269쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=275\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">「공익법인의 설립･운영에 관한 법률」<\/div><div class=\"ln p\">[시행 2017. 12. 12.] [법률 제15149호, 2017. 12. 12., 일부개정]<\/div><div class=\"ln p\">법무부(법무심의관실), 02-2110-3164<\/div><div class=\"ln p\">제1조(목적) 이 법은 법인의 설립･운영 등에 관한 「민법」의 규정을 보완하여 법인으로 하여금 그 공익성을 유지하며 건전한 활동을 할 수 있도록 함을 목적으로 한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제2조(적용 범위) 이 법은 재단법인이나 사단법인으로서 사회 일반의 이익에 이바지하기 위하여 학자금･장학금 또는 연구비의 보조나 지급, 학술, 자선(慈善)에 관한 사업을 목적으로 하는 법인(이하 “공익법인”이라 한다)에 대하여 적용한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제3조(정관의 준칙 등) ① 공익법인은 정관에 다음 사항을 적어야 한다.<\/div><div class=\"ln p\">1. 목적<\/div><div class=\"ln p\">2. 명칭<\/div><div class=\"ln p\">3. 사무소의 소재지<\/div><div class=\"ln p\">4. 설립 당시의 자산의 종류･상태 및 평가액<\/div><div class=\"ln p\">5. 자산의 관리방법과 회계에 관한 사항<\/div><div class=\"ln p\">6. 이사 및 감사의 정수(定數)･임기 및 그 임면(任免)에 관한 사항<\/div><div class=\"ln p\">7. 이사의 결의권 행사 및 대표권에 관한 사항<\/div><div class=\"ln p\">8. 정관의 변경에 관한 사항<\/div><div class=\"ln p\">9. 공고 및 공고 방법에 관한 사항<\/div><div class=\"ln p\">10. 존립시기와 해산사유를 정한 경우에는 그 시기와 사유 및 잔여재산의 처리방법<\/div><div class=\"ln p\">11. 업무감사와 회계검사에 관한 사항<\/div><div class=\"ln p\">②제1항에 따른 정관의 기재 사항과 그 밖에 필요한 사항에 관하여는 대통령령으로 정한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14.]<\/div><div class=\"pchip\" id=\"p270\"><span>원문 270쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=276\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제4조(설립허가 기준) ① 주무 관청은 「민법」 제32조에 따라 공익법인의 설립허가신청을 받으면 관계 사실을 조사하여 재단법인은 출연재산의 수입, 사단법인은 회비･기부금 등으로 조성되는 재원(財源)의 수입(이하 각 “기본재산”이라 한다)으로 목적사업을 원활히 수행할 수 있다고 인정되는 경우에만 설립허가를 한다.<\/div><div class=\"ln p\">②주무 관청은 공익법인의 설립허가를 할 때 대통령령으로 정하는 바에 따라 회비 징수, 수혜(受惠) 대상에 관한 사항, 그 밖에 필요한 조건을 붙일 수 있다.<\/div><div class=\"ln p\">③공익법인은 목적 달성을 위하여 수익사업을 하려면 정관으로 정하는 바에 따라 사업마다 주무 관청의 승인을 받아야 한다. 이를 변경하려는 경우에도 또한 같다.<\/div><div class=\"ln p\">[전문개정 2008.3.14.]<\/div><div class=\"ln p\">제5조(임원 등) ①공익법인에는 5명 이상 15명 이하의 이사와 2명의 감사를 두되, 주무 관청의 승인을 받아 그 수를 증감할 수 있다.<\/div><div class=\"ln p\">② 임원은 주무 관청의 승인을 받아 취임한다.<\/div><div class=\"ln p\">③이사와 감사의 임기는 정관으로 정하되, 이사는 4년, 감사는 2년을 초과할 수 없다. 다만, 연임할 수 있다.<\/div><div class=\"ln p\">④이사의 과반수는 대한민국 국민이어야 한다.<\/div><div class=\"ln p\">⑤이사회를 구성할 때 대통령령으로 정하는 특별한 관계가 있는 자의 수는 이사 현원(現員)의 5분의 1을 초과할 수 없다.<\/div><div class=\"ln p\">⑥ 다음 각 호의 어느 하나에 해당하는 자는 공익법인의 임원이 될 수 없다.&lt;개정 2017. 12. 12.&gt;<\/div><div class=\"ln p\">1. 미성년자<\/div><div class=\"ln p\">2. 피성년후견인 또는 피한정후견인<\/div><div class=\"ln p\">3. 파산선고를 받은 자로서 복권되지 아니한 자<\/div><div class=\"ln p\">4.금고 이상의 형을 받고 집행이 종료되거나 집행을 받지 아니하기로 확정된 후 3년이 지나지 아니한 자<\/div><div class=\"ln p\">5. 제14조제2항에 따라 임원 취임승인이 취소된 후 2년이 지나지 아니한 자<\/div><div class=\"ln p\">⑦ 이사나 감사 중에 결원이 생기면 2개월 내에 보충하여야 한다.<\/div><div class=\"ln p\">⑧감사는 이사와 제5항에 따른 특별한 관계가 있는 자가 아니어야 하며 그 중 1명은 대통령령으로 정하는 바에 따라 법률과 회계에 관한 지식과 경험이 있는 자 중에서 주무 관청이 추천할 수 있다.<\/div><div class=\"ln p\">⑨공익법인은 주무 관청의 승인을 받아 상근임직원의 수를 정하고 상근임직원에게는 보수를 지급한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14.]<\/div><div class=\"pchip\" id=\"p271\"><span>원문 271쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=277\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제6조(이사회) ① 공익법인에 이사회를 둔다.<\/div><div class=\"ln p\">② 이사회는 이사로 구성한다.<\/div><div class=\"ln p\">③ 이사장은 정관으로 정하는 바에 따라 이사 중에서 호선(互選)한다.<\/div><div class=\"ln p\">④ 이사장은 이사회를 소집하며, 이사회의 의장이 된다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제7조(이사회의 기능) ① 이사회는 다음 사항을 심의 결정한다.<\/div><div class=\"ln p\">1. 공익법인의 예산, 결산, 차입금 및 재산의 취득･처분과 관리에 관한 사항<\/div><div class=\"ln p\">2. 정관의 변경에 관한 사항<\/div><div class=\"ln p\">3. 공익법인의 해산에 관한 사항<\/div><div class=\"ln p\">4. 임원의 임면에 관한 사항<\/div><div class=\"ln p\">5. 수익사업에 관한 사항<\/div><div class=\"ln p\">6. 그 밖에 법령이나 정관에 따라 그 권한에 속하는 사항<\/div><div class=\"ln p\">②이사장이나 이사가 공익법인과 이해관계가 상반될 때에는 그 사항에 관한 의결에 참여하지 못한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제8조(이사회의 소집) ①이사장은 필요하다고 인정할 때에는 이사회를 소집할 수 있다.<\/div><div class=\"ln p\">②이사장은 다음 각 호의 어느 하나에 해당하는 소집요구가 있을 때에는 그 소집요구일부터 20일 이내에 이사회를 소집하여야 한다.<\/div><div class=\"ln p\">1. 재적이사의 과반수가 회의의 목적을 제시하여 소집을 요구할 때<\/div><div class=\"ln p\">2. 제10조제1항제5호에 따라 감사가 소집을 요구할 때<\/div><div class=\"ln p\">③이사회를 소집할 때에는 적어도 회의 7일 전에 회의의 목적을 구체적으로 밝혀 각 이사에게 알려야 한다. 다만, 이사 전원이 모이고 또 그 전원이 이사회의 소집을 요구할 때에는 그러하지 아니하다.<\/div><div class=\"ln p\">④이사회를 소집하여야 할 경우에 그 소집권자가 궐위(闕位)되거나 이사회 소집을 기피하여 7일 이상 이사회 소집이 불가능한 경우에는 재적이사 과반수의 찬동으로 감독청의 승인을 받아 이사회를 소집할 수 있다. 이 경우 정관으로 정하는 이사가 이사회를 주재한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제9조(의결정족수 등) ①이사회의 의사(議事)는 정관에 특별한 규정이 없으면 재적이사 과반수의 찬성으로 의결한다.<\/div><div class=\"pchip\" id=\"p272\"><span>원문 272쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=278\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">② 이사는 평등한 의결권을 가진다.<\/div><div class=\"ln p\">③ 이사회의 의사는 서면결의에 의하여 처리할 수 없다.<\/div><div class=\"ln p\">④ 이사회의 의결은 대한민국 국민인 이사가 출석이사의 과반수가 되어야 한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제10조(감사의 직무) ① 감사는 다음 각 호의 직무를 수행한다.<\/div><div class=\"ln p\">1.공익법인의 업무와 재산상황을 감사하는 일 및 이사에 대하여 감사에 필요한 자료의 제출 또는 의견을 요구하고 이사회에서 발언하는 일<\/div><div class=\"ln p\">2. 이사회의 회의록에 기명날인하는 일<\/div><div class=\"ln p\">3. 공익법인의 업무와 재산상황에 대하여 이사에게 의견을 진술하는 일<\/div><div class=\"ln p\">4.공익법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때에 이를 이사회에 보고하는 일<\/div><div class=\"ln p\">5. 제4호의 보고를 하기 위하여 필요하면 이사회의 소집을 요구하는 일<\/div><div class=\"ln p\">②감사는 공익법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때에는 지체 없이 주무 관청에 보고하여야 한다.<\/div><div class=\"ln p\">③감사는 이사가 공익법인의 목적범위 외의 행위를 하거나 그 밖에 이 법 또는 이 법에 따른 명령이나 정관을 위반하는 행위를 하여 공익법인에 현저한 손해를 발생하게 할 우려가 있을 때에는 그 이사에 대하여 직무집행을 유지(留止)할 것을 법원에 청구할 수 있다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제11조(재산) ① 공익법인의 재산은 대통령령으로 정하는 바에 따라 기본재산과 보통재산으로 구분한다.<\/div><div class=\"ln p\">②기본재산은 그 목록과 평가액을 정관에 적어야 하며, 평가액에 변동이 있을 때에는 지체 없이 정관 변경 절차를 밟아야 한다.<\/div><div class=\"ln p\">③공익법인은 기본재산에 관하여 다음 각 호의 어느 하나에 해당하는 경우에는 주무 관청의 허가를 받아야 한다. &lt;개정 2016.5.29.&gt;<\/div><div class=\"ln p\">1. 매도･증여･임대･교환 또는 용도변경하거나 담보로 제공하려는 경우<\/div><div class=\"ln p\">2. 대통령령으로 정하는 일정 금액 이상을 장기차입(長期借入)하려는 경우<\/div><div class=\"ln p\">3.기본재산의 운용수익이 감소하거나 기부금 또는 그 밖의 수입금이 감소하는 등 대통령령으로 정하는 사유로 정관에서 정한 목적사업의 수행이 현저히 곤란하여 기본재산을 보통재산으로 편입하려는 경우<\/div><div class=\"pchip\" id=\"p273\"><span>원문 273쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=279\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">④제3항에도 불구하고 「상속세 및 증여세법」 제16조제2항에 따른 성실공익법인이 기본재산에 관하여 다음 각 호의 어느 하나에 해당하는 경우에는 주무 관청에 대한 신고로 갈음할 수 있다. &lt;신설 2016.5.29.&gt;<\/div><div class=\"ln p\">1.기본재산의 100분의 20 범위에서 기본재산의 증식을 목적으로 하는 매도･교환 또는 용도변경 등 대통령령으로 정하는 경우<\/div><div class=\"ln p\">2.제3항제3호에 해당하여 기본재산을 100분의 10 범위에서 보통재산으로 편입하려는 경우. 이 경우 직전 편입이 있은 날부터 최소 3년이 경과하여야 한다.<\/div><div class=\"ln p\">⑤공익법인은 목적사업을 수행하기 위하여 그 재산을 선량한 관리자의 주의를 다하여 관리하여야 한다. &lt;개정 2016.5.29.&gt;<\/div><div class=\"ln p\">[전문개정 2008.3.14.]<\/div><div class=\"ln p\">제12조(예산 및 결산 등) ① 공익법인의 회계연도는 정부의 회계연도에 따른다.<\/div><div class=\"ln p\">②공익법인은 주무 관청에 대하여 대통령령으로 정하는 바에 따라 매 회계연도가 시작되기 전에 다음 해에 실시할 사업계획 및 예산을 제출하고 매 회계연도가 끝난 후에 사업실적과 결산을 보고하여야 한다. 이 경우 결산보고에는 대통령령으로 정하는 바에 따라 공인회계사의 감사증명서를 첨부하게 할 수 있다.<\/div><div class=\"ln p\">③공익법인은 결산상 잉여금을 기본재산에 전입하거나 다음 해에 이월하여 목적사업에 사용하여야 한다.<\/div><div class=\"ln p\">④ 공익법인의 재산관리, 예산편성, 회계 등에 관한 사항은 대통령령으로 정한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제13조(잔여재산의 귀속) ① 해산한 공익법인의 남은 재산은 정관으로 정하는 바에 따라 국가나 지방자치단체에 귀속된다.<\/div><div class=\"ln p\">②제1항에 따라 국가나 지방자치단체에 귀속된 재산은 공익사업에 사용하거나 이를 유사한 목적을 가진 공익법인에 증여하거나 무상대부(無償貸付)한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제14조(감독) ① 주무 관청은 공익법인의 업무를 감독한다.<\/div><div class=\"ln p\">②주무 관청은 다음 각 호의 어느 하나에 해당하는 사유가 있으면 그 사유의 시정을 요구한 날부터 1개월이 지나도 이에 응하지 아니한 경우에 이사의 취임승인을 취소할 수 있다.<\/div><div class=\"ln p\">1. 이 법 또는 정관을 위반한 경우<\/div><div class=\"pchip\" id=\"p274\"><span>원문 274쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=280\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2.임원 간의 분쟁, 회계부정, 재산의 부당한 손실, 현저한 부당행위 등으로 해당 공익법인의 설립목적을 달성하지 못할 우려를 발생시킨 경우<\/div><div class=\"ln p\">3. 목적사업 외의 사업을 수행하거나 수행하려 한 경우<\/div><div class=\"ln p\">③주무 관청은 수익사업을 하는 공익법인에 다음 각 호의 사유가 있다고 인정되면 그 공익법인에 대하여 그 사업의 시정이나 정지를 명할 수 있다.<\/div><div class=\"ln p\">1. 수익을 목적사업 외의 용도에 사용할 때<\/div><div class=\"ln p\">2. 해당 사업을 계속하는 것이 공익법인의 목적에 위배된다고 인정될 때<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제15조(조세 감면 등) 공익법인에 출연(出捐)하거나 기부한 재산에 대한 상속세･증여세･소득세･법인세 및 지방세는 「조세특례제한법」으로 정하는 바에 따라 감면할 수 있다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제16조(설립허가의 취소) ①설립허가를 한 주무 관청은 공익법인에 다음 각 호의 어느 하나에 해당하는 사유가 있다고 인정될 때에는 그 공익법인에 대한 설립허가를 취소할 수 있다. 다만, 공익법인의 목적사업이 둘 이상인 경우에는 그 일부의 목적사업에 해당 사유가 있을 때에도 또한 같다.<\/div><div class=\"ln p\">1. 거짓이나 그 밖의 부정한 방법으로 설립허가를 받은 경우<\/div><div class=\"ln p\">2. 설립허가 조건을 위반한 경우<\/div><div class=\"ln p\">3. 목적 달성이 불가능하게 된 경우<\/div><div class=\"ln p\">4. 목적사업 외의 사업을 한 경우<\/div><div class=\"ln p\">5. 이 법 또는 이 법에 따른 명령이나 정관을 위반한 경우<\/div><div class=\"ln p\">6. 공익을 해치는 행위를 한 경우<\/div><div class=\"ln p\">7.정당한 사유 없이 설립허가를 받은 날부터 6개월 이내에 목적사업을 시작하지 아니하거나 1년 이상 사업실적이 없을 때<\/div><div class=\"ln p\">②제1항에 따른 공익법인의 설립허가취소는 다른 방법으로는 감독목적을 달성할 수 없거나 감독청이 시정을 명령한 후 1년이 지나도 이에 응하지 아니한 경우에 한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제16조의2(청문) 주무 관청은 제16조에 따라 공익법인의 설립허가를 취소하려는 경우에는 청문을 하여야 한다.<\/div><div class=\"ln p\">[전문개정 2008.3.14.]<\/div><div class=\"pchip\" id=\"p275\"><span>원문 275쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=281\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제17조(감사 등) ①주무 관청은 감독상 필요하면 공익법인에 대하여 그 업무보고서의 제출을 명하거나 업무재산관리 및 회계를 감사하여 그 적정을 기하고, 목적사업을 원활히 수행하도록 지도하여야 한다.<\/div><div class=\"ln p\">②주무 관청은 공익법인의 효율적 감독을 위하여 필요하면 대통령령으로 정하는 바에 따라 공인회계사나 그 밖에 관계 전문기관으로 하여금 제1항에 따른 감사를 하게 할 수 있다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제18조(권한의 위임) 주무 관청은 이 법에 정한 권한의 일부를 대통령령으로 정하는 바에 따라 하급관청이나 지방자치단체에 위임할 수 있다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제19조(벌칙) ① 제4조제3항이나 제11조제3항･제4항 또는 제12조제3항을 위반하면 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. &lt;개정 2014.1.7., 2016.5.29.&gt;<\/div><div class=\"ln p\">②다음 각 호의 어느 하나에 해당하면 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. &lt;개정 2014.1.7.&gt;<\/div><div class=\"ln p\">1. 제14조제3항에 따른 명령을 위반한 경우<\/div><div class=\"ln p\">2. 제12조제2항을 위반하거나 거짓으로 보고한 경우<\/div><div class=\"ln p\">3. 제17조에 따른 감사를 거부하거나 기피한 경우<\/div><div class=\"ln p\">4. 감사가 정당한 사유 없이 직무 수행을 거부하거나 직무를 유기한 경우<\/div><div class=\"ln p\">③이사나 감사가 제1항 및 제2항의 죄를 범하였을 때에는 그 행위자를 벌할 뿐만 아니라 그 공익법인에도 제1항 및 제2항의 벌금형을 부과한다. 다만, 법인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 때와 주무관청이 추천한 감사의 행위에 대하여는 그러하지 아니하다.<\/div><div class=\"ln p\">[전문개정 2008.3.14]<\/div><div class=\"ln p\">제20조 삭제 &lt;2008.3.14&gt;<\/div><div class=\"ln p\">부  칙 &lt;법률 제15149호, 2017. 12. 12.&gt;<\/div><div class=\"ln p\">제1조(시행일) 이 법은 공포한 날부터 시행한다.<\/div><div class=\"ln p\">제2조(금치산자 등의 결격사유에 관한 경과조치) 제5조제6항제2호의 개정규정에도 불구하고 이 법 시행 당시 법률 제10429호 민법 일부개정법률 부칙 제2조에 따라 금치산 또는 한정치산 선고의 효력이 유지되는 사람에 대하여는 종전의 규정에 따른다.<\/div>", "pages": [{"p": 269, "t": "「공익법인의 설립･운영에 관한 법률」\n[시행 2017. 12. 12.] [법률 제15149호, 2017. 12. 12., 일부개정]\n법무부(법무심의관실), 02-2110-3164\n제1조(목적) 이 법은 법인의 설립･운영 등에 관한 「민법」의 규정을 보완하여 법인으로 하여금 그 공익성을 유지하며 건전한 활동을 할 수 있도록 함을 목적으로 한다.\n[전문개정 2008.3.14]\n제2조(적용 범위) 이 법은 재단법인이나 사단법인으로서 사회 일반의 이익에 이바지하기 위하여 학자금･장학금 또는 연구비의 보조나 지급, 학술, 자선(慈善)에 관한 사업을 목적으로 하는 법인(이하 “공익법인”이라 한다)에 대하여 적용한다.\n[전문개정 2008.3.14]\n제3조(정관의 준칙 등) ① 공익법인은 정관에 다음 사항을 적어야 한다.\n1. 목적\n2. 명칭\n3. 사무소의 소재지\n4. 설립 당시의 자산의 종류･상태 및 평가액\n5. 자산의 관리방법과 회계에 관한 사항\n6. 이사 및 감사의 정수(定數)･임기 및 그 임면(任免)에 관한 사항\n7. 이사의 결의권 행사 및 대표권에 관한 사항\n8. 정관의 변경에 관한 사항\n9. 공고 및 공고 방법에 관한 사항\n10. 존립시기와 해산사유를 정한 경우에는 그 시기와 사유 및 잔여재산의 처리방법\n11. 업무감사와 회계검사에 관한 사항\n②제1항에 따른 정관의 기재 사항과 그 밖에 필요한 사항에 관하여는 대통령령으로 정한다.\n[전문개정 2008.3.14.]"}, {"p": 270, "t": "제4조(설립허가 기준) ① 주무 관청은 「민법」 제32조에 따라 공익법인의 설립허가신청을 받으면 관계 사실을 조사하여 재단법인은 출연재산의 수입, 사단법인은 회비･기부금 등으로 조성되는 재원(財源)의 수입(이하 각 “기본재산”이라 한다)으로 목적사업을 원활히 수행할 수 있다고 인정되는 경우에만 설립허가를 한다.\n②주무 관청은 공익법인의 설립허가를 할 때 대통령령으로 정하는 바에 따라 회비 징수, 수혜(受惠) 대상에 관한 사항, 그 밖에 필요한 조건을 붙일 수 있다.\n③공익법인은 목적 달성을 위하여 수익사업을 하려면 정관으로 정하는 바에 따라 사업마다 주무 관청의 승인을 받아야 한다. 이를 변경하려는 경우에도 또한 같다.\n[전문개정 2008.3.14.]\n제5조(임원 등) ①공익법인에는 5명 이상 15명 이하의 이사와 2명의 감사를 두되, 주무 관청의 승인을 받아 그 수를 증감할 수 있다.\n② 임원은 주무 관청의 승인을 받아 취임한다.\n③이사와 감사의 임기는 정관으로 정하되, 이사는 4년, 감사는 2년을 초과할 수 없다. 다만, 연임할 수 있다.\n④이사의 과반수는 대한민국 국민이어야 한다.\n⑤이사회를 구성할 때 대통령령으로 정하는 특별한 관계가 있는 자의 수는 이사 현원(現員)의 5분의 1을 초과할 수 없다.\n⑥ 다음 각 호의 어느 하나에 해당하는 자는 공익법인의 임원이 될 수 없다.<개정 2017. 12. 12.>\n1. 미성년자\n2. 피성년후견인 또는 피한정후견인\n3. 파산선고를 받은 자로서 복권되지 아니한 자\n4.금고 이상의 형을 받고 집행이 종료되거나 집행을 받지 아니하기로 확정된 후 3년이 지나지 아니한 자\n5. 제14조제2항에 따라 임원 취임승인이 취소된 후 2년이 지나지 아니한 자\n⑦ 이사나 감사 중에 결원이 생기면 2개월 내에 보충하여야 한다.\n⑧감사는 이사와 제5항에 따른 특별한 관계가 있는 자가 아니어야 하며 그 중 1명은 대통령령으로 정하는 바에 따라 법률과 회계에 관한 지식과 경험이 있는 자 중에서 주무 관청이 추천할 수 있다.\n⑨공익법인은 주무 관청의 승인을 받아 상근임직원의 수를 정하고 상근임직원에게는 보수를 지급한다.\n[전문개정 2008.3.14.]"}, {"p": 271, "t": "제6조(이사회) ① 공익법인에 이사회를 둔다.\n② 이사회는 이사로 구성한다.\n③ 이사장은 정관으로 정하는 바에 따라 이사 중에서 호선(互選)한다.\n④ 이사장은 이사회를 소집하며, 이사회의 의장이 된다.\n[전문개정 2008.3.14]\n제7조(이사회의 기능) ① 이사회는 다음 사항을 심의 결정한다.\n1. 공익법인의 예산, 결산, 차입금 및 재산의 취득･처분과 관리에 관한 사항\n2. 정관의 변경에 관한 사항\n3. 공익법인의 해산에 관한 사항\n4. 임원의 임면에 관한 사항\n5. 수익사업에 관한 사항\n6. 그 밖에 법령이나 정관에 따라 그 권한에 속하는 사항\n②이사장이나 이사가 공익법인과 이해관계가 상반될 때에는 그 사항에 관한 의결에 참여하지 못한다.\n[전문개정 2008.3.14]\n제8조(이사회의 소집) ①이사장은 필요하다고 인정할 때에는 이사회를 소집할 수 있다.\n②이사장은 다음 각 호의 어느 하나에 해당하는 소집요구가 있을 때에는 그 소집요구일부터 20일 이내에 이사회를 소집하여야 한다.\n1. 재적이사의 과반수가 회의의 목적을 제시하여 소집을 요구할 때\n2. 제10조제1항제5호에 따라 감사가 소집을 요구할 때\n③이사회를 소집할 때에는 적어도 회의 7일 전에 회의의 목적을 구체적으로 밝혀 각 이사에게 알려야 한다. 다만, 이사 전원이 모이고 또 그 전원이 이사회의 소집을 요구할 때에는 그러하지 아니하다.\n④이사회를 소집하여야 할 경우에 그 소집권자가 궐위(闕位)되거나 이사회 소집을 기피하여 7일 이상 이사회 소집이 불가능한 경우에는 재적이사 과반수의 찬동으로 감독청의 승인을 받아 이사회를 소집할 수 있다. 이 경우 정관으로 정하는 이사가 이사회를 주재한다.\n[전문개정 2008.3.14]\n제9조(의결정족수 등) ①이사회의 의사(議事)는 정관에 특별한 규정이 없으면 재적이사 과반수의 찬성으로 의결한다."}, {"p": 272, "t": "② 이사는 평등한 의결권을 가진다.\n③ 이사회의 의사는 서면결의에 의하여 처리할 수 없다.\n④ 이사회의 의결은 대한민국 국민인 이사가 출석이사의 과반수가 되어야 한다.\n[전문개정 2008.3.14]\n제10조(감사의 직무) ① 감사는 다음 각 호의 직무를 수행한다.\n1.공익법인의 업무와 재산상황을 감사하는 일 및 이사에 대하여 감사에 필요한 자료의 제출 또는 의견을 요구하고 이사회에서 발언하는 일\n2. 이사회의 회의록에 기명날인하는 일\n3. 공익법인의 업무와 재산상황에 대하여 이사에게 의견을 진술하는 일\n4.공익법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때에 이를 이사회에 보고하는 일\n5. 제4호의 보고를 하기 위하여 필요하면 이사회의 소집을 요구하는 일\n②감사는 공익법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 있음을 발견한 때에는 지체 없이 주무 관청에 보고하여야 한다.\n③감사는 이사가 공익법인의 목적범위 외의 행위를 하거나 그 밖에 이 법 또는 이 법에 따른 명령이나 정관을 위반하는 행위를 하여 공익법인에 현저한 손해를 발생하게 할 우려가 있을 때에는 그 이사에 대하여 직무집행을 유지(留止)할 것을 법원에 청구할 수 있다.\n[전문개정 2008.3.14]\n제11조(재산) ① 공익법인의 재산은 대통령령으로 정하는 바에 따라 기본재산과 보통재산으로 구분한다.\n②기본재산은 그 목록과 평가액을 정관에 적어야 하며, 평가액에 변동이 있을 때에는 지체 없이 정관 변경 절차를 밟아야 한다.\n③공익법인은 기본재산에 관하여 다음 각 호의 어느 하나에 해당하는 경우에는 주무 관청의 허가를 받아야 한다. <개정 2016.5.29.>\n1. 매도･증여･임대･교환 또는 용도변경하거나 담보로 제공하려는 경우\n2. 대통령령으로 정하는 일정 금액 이상을 장기차입(長期借入)하려는 경우\n3.기본재산의 운용수익이 감소하거나 기부금 또는 그 밖의 수입금이 감소하는 등 대통령령으로 정하는 사유로 정관에서 정한 목적사업의 수행이 현저히 곤란하여 기본재산을 보통재산으로 편입하려는 경우"}, {"p": 273, "t": "④제3항에도 불구하고 「상속세 및 증여세법」 제16조제2항에 따른 성실공익법인이 기본재산에 관하여 다음 각 호의 어느 하나에 해당하는 경우에는 주무 관청에 대한 신고로 갈음할 수 있다. <신설 2016.5.29.>\n1.기본재산의 100분의 20 범위에서 기본재산의 증식을 목적으로 하는 매도･교환 또는 용도변경 등 대통령령으로 정하는 경우\n2.제3항제3호에 해당하여 기본재산을 100분의 10 범위에서 보통재산으로 편입하려는 경우. 이 경우 직전 편입이 있은 날부터 최소 3년이 경과하여야 한다.\n⑤공익법인은 목적사업을 수행하기 위하여 그 재산을 선량한 관리자의 주의를 다하여 관리하여야 한다. <개정 2016.5.29.>\n[전문개정 2008.3.14.]\n제12조(예산 및 결산 등) ① 공익법인의 회계연도는 정부의 회계연도에 따른다.\n②공익법인은 주무 관청에 대하여 대통령령으로 정하는 바에 따라 매 회계연도가 시작되기 전에 다음 해에 실시할 사업계획 및 예산을 제출하고 매 회계연도가 끝난 후에 사업실적과 결산을 보고하여야 한다. 이 경우 결산보고에는 대통령령으로 정하는 바에 따라 공인회계사의 감사증명서를 첨부하게 할 수 있다.\n③공익법인은 결산상 잉여금을 기본재산에 전입하거나 다음 해에 이월하여 목적사업에 사용하여야 한다.\n④ 공익법인의 재산관리, 예산편성, 회계 등에 관한 사항은 대통령령으로 정한다.\n[전문개정 2008.3.14]\n제13조(잔여재산의 귀속) ① 해산한 공익법인의 남은 재산은 정관으로 정하는 바에 따라 국가나 지방자치단체에 귀속된다.\n②제1항에 따라 국가나 지방자치단체에 귀속된 재산은 공익사업에 사용하거나 이를 유사한 목적을 가진 공익법인에 증여하거나 무상대부(無償貸付)한다.\n[전문개정 2008.3.14]\n제14조(감독) ① 주무 관청은 공익법인의 업무를 감독한다.\n②주무 관청은 다음 각 호의 어느 하나에 해당하는 사유가 있으면 그 사유의 시정을 요구한 날부터 1개월이 지나도 이에 응하지 아니한 경우에 이사의 취임승인을 취소할 수 있다.\n1. 이 법 또는 정관을 위반한 경우"}, {"p": 274, "t": "2.임원 간의 분쟁, 회계부정, 재산의 부당한 손실, 현저한 부당행위 등으로 해당 공익법인의 설립목적을 달성하지 못할 우려를 발생시킨 경우\n3. 목적사업 외의 사업을 수행하거나 수행하려 한 경우\n③주무 관청은 수익사업을 하는 공익법인에 다음 각 호의 사유가 있다고 인정되면 그 공익법인에 대하여 그 사업의 시정이나 정지를 명할 수 있다.\n1. 수익을 목적사업 외의 용도에 사용할 때\n2. 해당 사업을 계속하는 것이 공익법인의 목적에 위배된다고 인정될 때\n[전문개정 2008.3.14]\n제15조(조세 감면 등) 공익법인에 출연(出捐)하거나 기부한 재산에 대한 상속세･증여세･소득세･법인세 및 지방세는 「조세특례제한법」으로 정하는 바에 따라 감면할 수 있다.\n[전문개정 2008.3.14]\n제16조(설립허가의 취소) ①설립허가를 한 주무 관청은 공익법인에 다음 각 호의 어느 하나에 해당하는 사유가 있다고 인정될 때에는 그 공익법인에 대한 설립허가를 취소할 수 있다. 다만, 공익법인의 목적사업이 둘 이상인 경우에는 그 일부의 목적사업에 해당 사유가 있을 때에도 또한 같다.\n1. 거짓이나 그 밖의 부정한 방법으로 설립허가를 받은 경우\n2. 설립허가 조건을 위반한 경우\n3. 목적 달성이 불가능하게 된 경우\n4. 목적사업 외의 사업을 한 경우\n5. 이 법 또는 이 법에 따른 명령이나 정관을 위반한 경우\n6. 공익을 해치는 행위를 한 경우\n7.정당한 사유 없이 설립허가를 받은 날부터 6개월 이내에 목적사업을 시작하지 아니하거나 1년 이상 사업실적이 없을 때\n②제1항에 따른 공익법인의 설립허가취소는 다른 방법으로는 감독목적을 달성할 수 없거나 감독청이 시정을 명령한 후 1년이 지나도 이에 응하지 아니한 경우에 한다.\n[전문개정 2008.3.14]\n제16조의2(청문) 주무 관청은 제16조에 따라 공익법인의 설립허가를 취소하려는 경우에는 청문을 하여야 한다.\n[전문개정 2008.3.14.]"}, {"p": 275, "t": "제17조(감사 등) ①주무 관청은 감독상 필요하면 공익법인에 대하여 그 업무보고서의 제출을 명하거나 업무재산관리 및 회계를 감사하여 그 적정을 기하고, 목적사업을 원활히 수행하도록 지도하여야 한다.\n②주무 관청은 공익법인의 효율적 감독을 위하여 필요하면 대통령령으로 정하는 바에 따라 공인회계사나 그 밖에 관계 전문기관으로 하여금 제1항에 따른 감사를 하게 할 수 있다.\n[전문개정 2008.3.14]\n제18조(권한의 위임) 주무 관청은 이 법에 정한 권한의 일부를 대통령령으로 정하는 바에 따라 하급관청이나 지방자치단체에 위임할 수 있다.\n[전문개정 2008.3.14]\n제19조(벌칙) ① 제4조제3항이나 제11조제3항･제4항 또는 제12조제3항을 위반하면 3년 이하의 징역 또는 3천만원 이하의 벌금에 처한다. <개정 2014.1.7., 2016.5.29.>\n②다음 각 호의 어느 하나에 해당하면 1년 이하의 징역 또는 1천만원 이하의 벌금에 처한다. <개정 2014.1.7.>\n1. 제14조제3항에 따른 명령을 위반한 경우\n2. 제12조제2항을 위반하거나 거짓으로 보고한 경우\n3. 제17조에 따른 감사를 거부하거나 기피한 경우\n4. 감사가 정당한 사유 없이 직무 수행을 거부하거나 직무를 유기한 경우\n③이사나 감사가 제1항 및 제2항의 죄를 범하였을 때에는 그 행위자를 벌할 뿐만 아니라 그 공익법인에도 제1항 및 제2항의 벌금형을 부과한다. 다만, 법인이 그 위반행위를 방지하기 위하여 해당 업무에 관하여 상당한 주의와 감독을 게을리하지 아니한 때와 주무관청이 추천한 감사의 행위에 대하여는 그러하지 아니하다.\n[전문개정 2008.3.14]\n제20조 삭제 <2008.3.14>\n부  칙 <법률 제15149호, 2017. 12. 12.>\n제1조(시행일) 이 법은 공포한 날부터 시행한다.\n제2조(금치산자 등의 결격사유에 관한 경과조치) 제5조제6항제2호의 개정규정에도 불구하고 이 법 시행 당시 법률 제10429호 민법 일부개정법률 부칙 제2조에 따라 금치산 또는 한정치산 선고의 효력이 유지되는 사람에 대하여는 종전의 규정에 따른다."}]}, {"title": "3. 「공익법인의 설립·운영에 관한 법률 시행령」", "start": 276, "end": 293, "html": "<div class=\"pchip\" id=\"p276\"><span>원문 276쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=282\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">「공익법인의 설립･운영에 관한 법률 시행령」<\/div><div class=\"ln p\">[시행 2026. 1. 2.] [대통령령 제35947호, 2025. 12. 30., 타법개정]<\/div><div class=\"ln p\">법무부(법무심의관실) 02-2110-3164<\/div><div class=\"ln p\">제1조(목적) 이 영은 「공익법인의 설립ㆍ운영에 관한 법률」에서 위임된 사항과 그 시행에 필요한 사항을 규정함을 목적으로 한다. &lt;개정 2011. 8. 19.&gt;<\/div><div class=\"ln p\">제2조(정의) ① 「공익법인의 설립ㆍ운영에 관한 법률」(이하 “법”이라 한다) 제2조에서 “사회일반의 이익에 공여하기 위하여 학자금ㆍ장학금 또는 연구비의 보조나 지급, 학술ㆍ자선에 관한 사업을 목적으로 하는 법인”이라 함은 다음의 사업을 목적으로 하는 법인을 말한다. &lt;개정 2011. 8. 19.&gt;<\/div><div class=\"ln p\">1. 학자금ㆍ장학금 기타 명칭에 관계없이 학생등의 장학을 목적으로 금전을 지급하거나 지원하는 사업ㆍ금전에 갈음한 물건ㆍ용역 또는 시설을 설치ㆍ운영 또는 제공하거나 지원하는 사업을 포함한다.<\/div><div class=\"ln p\">2. 연구비ㆍ연구조성비ㆍ장려금 기타 명칭에 관계없이 학문ㆍ과학기술의 연구ㆍ조사ㆍ개발ㆍ보급을 목적으로 금전을 지급하거나 지원하는 사업ㆍ금전에 갈음한 물건ㆍ용역 또는 시설을 제공하는 사업을 포함한다.<\/div><div class=\"ln p\">3. 학문 또는 과학기술의 연구ㆍ조사ㆍ개발ㆍ보급을 목적으로 하는 사업 및 이들 사업을 지원하는 도서관ㆍ박물관ㆍ과학관 기타 이와 유사한 시설을 설치ㆍ운영하는 사업<\/div><div class=\"ln p\">4. 불행ㆍ재해 기타 사정으로 자활할 수 없는 자를 돕기 위한 모든 자선사업<\/div><div class=\"ln p\">5. 제1호 내지 제4호에 해당하는 사업의 유공자에 대한 시상을 행하는 사업<\/div><div class=\"ln p\">② 제1항의 법인에는 제1항 각호의 사업과 그 이외의 사업을 함께 수행하는 법인을 포함한다.<\/div><div class=\"ln p\">제3조(정관에 기재할 사항) ① 공익법인의 정관에는 법 제3조제1항에 규정된 사항 이외에 다음 각호의 사항을 기재하여야 한다.<\/div><div class=\"ln p\">1. 사업에 관한 사항<\/div><div class=\"ln p\">2. 사단법인인 경우에는 사원 및 사원총회에 관한 사항<\/div><div class=\"ln p\">3. 기타 공익법인의 운영에 관한 기본적 사항<\/div><div class=\"ln p\">② 제1항제1호의 사업은 구체적으로 명확하게 정하여야 한다.<\/div><div class=\"pchip\" id=\"p277\"><span>원문 277쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=283\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제4조(설립허가신청) ① 공익법인의 설립허가를 받으려는 자(이하 “설립발기인”이라 한다)는 법인설립허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. &lt;개정 1995. 7. 6., 2021. 1. 5.&gt;<\/div><div class=\"ln p\">1. 설립발기인의 성명ㆍ주소ㆍ약력(설립발기인이 법인인 경우에는 그 명칭, 주된 사무소의 소재지, 대표자의 성명ㆍ주소ㆍ정관 및 최근의 사업활동)을 기재한 서류 1부<\/div><div class=\"ln p\">2. 설립취지서 1부<\/div><div class=\"ln p\">3. 정관 1부<\/div><div class=\"ln p\">4. 재단법인인 경우에는 출연재산의 종류ㆍ수량ㆍ금액 및 권리관계를 명확하게 기재한 재산목록(기본재산과 보통재산으로 구분하여 기재하여야 한다) 및 기부신청서 1부, 사단법인인 경우에는 회비징수예정명세서 또는 기부신청서 1부<\/div><div class=\"ln p\">5. 삭제 &lt;1991. 5. 31.&gt;<\/div><div class=\"ln p\">6. 부동산ㆍ예금ㆍ유가증권등 주된 재산에 관한 등기소ㆍ금융기관등의 증명서 1부<\/div><div class=\"ln p\">7. 사업개시예정일 및 사업개시이후 2 사업연도분의 사업계획서 및 수입ㆍ지출예산서 1부<\/div><div class=\"ln p\">8. 사단법인인 경우에는 창립총회회의록 및 사원이 될 자의 성명 및 주소를 기재한 사원명부(사원명부를 작성하기 곤란한 때에는 사원의 총수를 기재한 서류) 각 1부<\/div><div class=\"ln p\">9. 삭제 &lt;1991. 5. 31.&gt;<\/div><div class=\"ln p\">② 공익법인의 사업이 2이상의 주무관청의 소관에 속하는 경우에는 그 주된 사업을 주관하는 주무관청에 법인설립허가를 신청하여야 한다.<\/div><div class=\"ln p\">제5조(설립허가) ① 주무관청은 법인설립허가신청의 내용이 다음 각호의 기준에 적합한 경우에 한하여 이를 허가한다.<\/div><div class=\"ln p\">1. 목적사업이 구체적이며 실현가능하다고 인정되는 경우<\/div><div class=\"ln p\">2. 재단법인에 있어서는 출연재산의 수입, 사단법인에 있어서는 회비ㆍ기부금등으로 조성하는 재원의 수입으로 목적사업을 원활히 달성할 수 있다고 인정되는 경우<\/div><div class=\"ln p\">3. 목적사업이 적극적으로 공익을 유지ㆍ증진하는 것이라고 인정되는 경우<\/div><div class=\"ln p\">② 제4조제2항의 경우에는 법인설립허가신청을 받은 주무관청은 다른 주무관청과 협의하여 그 설립허가를 하여야 한다.<\/div><div class=\"ln p\">제6조(설립허가시에 붙일 조건) ①주무관청이 공익법인의 설립허가를 함에 있어서는 다음 각호의 조건을 붙일 수 있다.<\/div><div class=\"ln p\">1. 사단법인의 경우에 회비에 의하여 경비에 충당할 비율과 회비징수방법 기타 회비징수에 관하여 필요한 사항<\/div><div class=\"pchip\" id=\"p278\"><span>원문 278쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=284\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2. 수혜자의 출생지ㆍ출신학교ㆍ직업ㆍ근무처 기타 사회적 지위나 당해 법인과의 특수관계등에 의하여 수혜자의 범위를 제한할 수 없다는 뜻<\/div><div class=\"ln p\">3. 목적사업의 무상성 기타 목적사업의 운영에 관한 사항<\/div><div class=\"ln p\">4. 기타 목적사업의 원활한 달성을 위하여 필요한 사항<\/div><div class=\"ln p\">②주무관청은 공익법인의 설립허가(정관상의 목적사업을 효율적으로 수행하기 위하여 또는 정관상의 목적사업에 새로운 사업을 추가하기 위하여 재산을 추가출연하고자 하는 경우의 정관변경허가를 포함한다)를 함에 있어서 제1항제2호의 조건을 반드시 붙이되, 주무관청이 수혜자의 범위를 특히 한정할 필요가 있다고 인정되는 때에는 그 한정할 범위에 관하여 미리 재정경제부장관(행정권한의위임및위탁에관한규정에 의하여 공익법인의 설립허가에 관한 권한이 지방자치단체의 장등에게 위임된 경우에는 설립이 허가되는 공익법인의 주된 사무소의 소재지를 관할하는 세무서장을 말한다)과 합의하여야 한다. &lt;개정 1994. 12. 23., 1995. 7. 6., 1998. 12. 31., 2008. 2. 29., 2025. 12. 30.&gt;<\/div><div class=\"ln p\">제7조(임원취임승인신청) ① 공익법인이 법 제5조제2항의 규정에 의하여 임원취임승인을 신청할 때에는 임원취임승인신청서(전자문서로 된 신청서를 포함한다)에 다음 각호의 서류(전자문서를 포함한다)를 첨부하여 주무관청에 제출하여야 한다. 다만, 제3호 및 제5호의 서류는 주무관청이 보안상 필요하다고 인정하는 경우에 한하여 제출하고, 연임되는 임원에 대한 취임의 승인을 신청하는 경우에는 제2호ㆍ제3호ㆍ제5호 및 제7호의 서류는 이를 제출하지 아니한다. &lt;개정 1991. 5. 31., 1993. 11. 20., 1995. 7. 6., 2004. 3. 17., 2006. 6. 12., 2010. 11. 2.&gt;<\/div><div class=\"ln p\">1. 임원의 선임을 결의한 총회 또는 이사회의 회의록 사본 1부<\/div><div class=\"ln p\">2. 이력서 1부<\/div><div class=\"ln p\">3. 임원으로 취임하려는 사람의 가족관계기록사항에 관한 증명서<\/div><div class=\"ln p\">4. 취임승낙서 1부<\/div><div class=\"ln p\">5. 민간인 신원진술서 4부<\/div><div class=\"ln p\">6. 삭제 &lt;2006. 6. 12.&gt;<\/div><div class=\"ln p\">7. 제12조의 규정에 의한 당해 임원의 특수관계부존재각서<\/div><div class=\"ln p\">② 삭제 &lt;2010. 11. 2.&gt;<\/div><div class=\"ln p\">제8조(재산이전의 보고) 공익법인(재단법인에 한한다)의 설립허가를 받은 자는 그 허가를 받은 후 지체없이 출연재산을 법인에 이전하고 3개월 내에 그 이전을 증명하는 금융기관의 증명서(부동산등기부 등본으로 확인할 수 없는 경우로 한정한다)를 재산이전보고서(전자문서로 된 보고서를 포함한다)에 첨부하여 주무관청에 제출하여야 한다. 이 경우 주무관청은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 부동산등기부 등본을 확인하여야 한다. &lt;개정 2004. 3. 17., 2007. 7. 18., 2010. 5. 4., 2010. 11. 2.&gt;<\/div><div class=\"pchip\" id=\"p279\"><span>원문 279쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=285\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제9조(설립등기등의 보고) 공익법인은 민법 제49조 내지 제52조의 규정에 의하여 법인설립등기등을 한 때에는 등기를 완료한 날로부터 7일 이내에 등기보고서를 주무관청에 제출하여야 한다. 이 경우 주무관청은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항증명서를 확인하여야 한다. &lt;개정 1995. 7. 6., 2004. 3. 17., 2007. 7. 18., 2010. 5. 4., 2010. 11. 2.&gt;<\/div><div class=\"ln p\">제10조(정관변경허가신청) 공익법인이 민법 제42조제2항, 동법 제45조제3항, 동법 제46조의 규정에 의하여 정관변경의 허가를 받고자 할 때에는 정관변경허가신청서에 다음 각호의 서류를 첨부하여 주무관청에 제출하여야 한다. &lt;개정 1995. 7. 6.&gt;<\/div><div class=\"ln p\">1. 정관변경이유서 1부<\/div><div class=\"ln p\">2. 정관개정안 1부<\/div><div class=\"ln p\">3. 정관변경에 관한 총회 또는 이사회 회의록<\/div><div class=\"ln p\">4. 정관변경의 원인이 되는 사실을 증명할 수 있는 서류<\/div><div class=\"ln p\">제11조(수익사업의 승인신청) ① 공익법인이 법 제4조제3항의 규정에 의하여 수익사업경영의 승인을 신청하는 경우에는 수익사업승인신청서에 다음 각호의 서류를 첨부하여 주무관청에 제출하여야 한다. &lt;개정 1995. 7. 6.&gt;<\/div><div class=\"ln p\">1. 사업계획서 1부<\/div><div class=\"ln p\">2. 추정손익계산서 및 부속명세서 1부<\/div><div class=\"ln p\">3. 사업에 종사할 임원명부 1부<\/div><div class=\"ln p\">4. 행정관청의 허가를 요하는 사업인 경우에는 당해 사업에 대하여 허가를 받은 사실을 증명하는 서류 1부<\/div><div class=\"ln p\">② 공익법인이 승인을 받은 수익사업을 변경하고자 할 때에는 제1항에 준하여 주무관청의 승인을 얻어야 한다.<\/div><div class=\"ln p\">제12조(특수관계자의 범위) ① 법 제5조제5항에서 “대통령령으로 정하는 특별한 관계가 있는 자”(이하 “특수관계자”라 한다)란 다음 각 호의 어느 하나에 해당하는 자를 말한다. 다만, 국가 또는 지방자치단체가 공익사업(「상속세 및 증여세법」 제16조제1항에 따른 종교ㆍ자선ㆍ학술 또는 그 밖의 공익을 목적으로 하는 사업을 말한다. 이하 같다)에 출연하는 경우에는 국가ㆍ지방자치단체 및 그 소속 공무원, 그 밖에 국가ㆍ지방자치단체와 고용관계에 있는 자는 다음 각 호의 어느 하나에 해당하더라도 특수관계자로 보지 아니한다. &lt;개정 1995. 7. 6., 2012. 11. 6., 2014. 12. 9.&gt;<\/div><div class=\"pchip\" id=\"p280\"><span>원문 280쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=286\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1. 출연자(출연자가 「민법」 제32조에 따라 설립된 법인인 경우에는 해당 법인에 대한 출연자를, 출연자가 그 밖의 법인인 경우에는 해당 법인을 출자에 의하여 사실상 지배하고 있는 자를 포함한다). 다만, 재산출연일 현재 해당 공익법인의 총출연재산가액의 100분의 1에 해당하는 금액과 2천만원 중 적은 금액을 출연한 자는 제외한다.<\/div><div class=\"ln p\">2. 제1호에 따른 출연자(이하 “출연자”라 한다) 또는 이사와 다음 각 목의 관계에 있는 사람<\/div><div class=\"ln h3\">가. 6촌 이내의 혈족<\/div><div class=\"ln h3\">나. 4촌 이내의 인척<\/div><div class=\"ln h3\">다. 배우자(사실혼 관계에 있는 사람을 포함한다)<\/div><div class=\"ln h3\">라. 친생자(親生子)로서 다른 사람에게 친양자(親養子)로 입양된 사람과 그 배우자ㆍ직계비속(直系卑屬)<\/div><div class=\"ln p\">3. 출연자 또는 이사의 사용인 기타 고용관계에 있는 자(출연자 또는 이사가 출자에 의하여 사실상 지배하고 있는 법인의 사용인 기타 고용관계에 있는 자를 포함한다)<\/div><div class=\"ln p\">4. 출연자 또는 이사의 금전 기타의 재산에 의하여 생계를 유지하는 자와 생계를 함께 하는 자<\/div><div class=\"ln p\">5. 당해 출연자가 재산을 출연한 다른 공익사업을 영위하는 법인의 이사<\/div><div class=\"ln p\">② 제1항제1호 및 제3호에서 “출자에 의하여 사실상 지배한다”고 함은 다음 각호의 1에 해당함을 말한다. &lt;개정 1995. 7. 6.&gt;<\/div><div class=\"ln p\">1. 법인의 발행주식총액 또는 출자총액의 100분의 30이상을 출자자 1인과 그와 제1항제2호ㆍ제4호 및 사용인 기타 고용관계에 있는 자(이하 “지배주주”라 한다)들이 소유하고 있는 경우<\/div><div class=\"ln p\">2. 법인의 발행주식총액 또는 출자총액의 100분의 50이상을 제1호의 법인과 그의 지배주주가 소유하고 있는 경우<\/div><div class=\"ln p\">3. 법인의 발행주식총액 또는 출자총액의 100분의 50이상을 제1호의 법인과 그의 지배주주 및 제2호의 법인이 소유하고 있는 경우<\/div><div class=\"ln p\">③ 특수관계가 없는 이사가 재임중 특수관계자에 해당되어 특수관계자가 이사현원의 5분의 1을 초과하게 된 때에는 2월 이내에 특수관계자가 이사현원의 5분의 1이 초과되지 아니하도록 이사를 개임하여야 한다. &lt;개정 1995. 7. 6.&gt;<\/div><div class=\"pchip\" id=\"p281\"><span>원문 281쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=287\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제13조(주무관청의 감사추천) ① 주무관청은 법 제5조제8항의 규정에 의하여 공익법인의 감사 1인을 추천하고자 할 때에는 설립허가시에 그 뜻을 통지하여야 한다.<\/div><div class=\"ln p\">② 주무관청이 제1항의 규정에 의한 감사의 추천을 행함에 있어서는 공익법인에게 후보를 선정하여 추천을 의뢰하게 할 수 있다. 이 경우 주무관청은 추천의뢰된 자 중에 적격자가 없다고 인정되는 때에는 재추천 의뢰를 요구하거나 직권에 의하여 추천할 수 있다.<\/div><div class=\"ln p\">③ 주무관청으로부터 감사 1인을 추천한다는 뜻을 통지받은 날로부터 2월내에 추천의뢰가 없는 경우 또는 주무관청의 추천에 의하여 임명된 감사가 임기만료 기타의 사유로 결원이 된 때에도 제2항과 같다.<\/div><div class=\"ln p\">④ 주무관청은 공익법인의 업무와 재산상황을 감사한 결과 불법 또는 부당한 점이 발견된 때에는 종전에 그 법인의 감사중 1인을 주무관청이 추천하지 아니한 경우에도 새로이 법 제5조제8항의 규정에 의하여 감사 1인을 추천할 수 있다. 이 경우에는 당해 공익법인의 감사중 이사회에서 지명한 자 1인은 주무관청에서 추천한 감사에 대한 취임승인이 있은 날의 전일에 퇴직된 것으로 본다.<\/div><div class=\"ln p\">제14조(상근직원의 정수 승인신청) 공익법인이 법 제5조제9항의 규정에 의하여 상근직원의 정수에 대한 승인을 얻고자 할 때에는 승인신청서에 기구도표와 부문별 또는 개인별 관장업무를 명시한 설명서를 첨부하여 주무관청에 제출하여야 한다.<\/div><div class=\"ln p\">제15조(이사회의 소집승인 신청) 법 제8조제4항의 규정에 의하여 이사회의 소집승인을 얻고자 할 때에는 그 승인신청서에 다음 각호의 서류를 첨부하여 주무관청에 제출하여야 한다.<\/div><div class=\"ln p\">1. 이사회의 소집이 불가능한 사유와 이를 증명하는 서류<\/div><div class=\"ln p\">2. 재적이사 과반수의 찬동을 증명하는 서류<\/div><div class=\"ln p\">3. 이사회를 소집하지 못함으로 인하여 예상되는 손해의 구체적인 사실을 증명하는 서류<\/div><div class=\"ln p\">제16조(재산의 구분) ① 공익법인의 재산중 다음 각호의 1에 해당하는 재산은 기본재산으로 한다.<\/div><div class=\"ln p\">1. 설립시 기본재산으로 출연한 재산<\/div><div class=\"ln p\">2. 기부에 의하거나 기타 무상으로 취득한 재산. 다만, 기부목적에 비추어 기본재산으로 하기 곤란하여 주무관청의 승인을 얻은 것은 예외로 한다.<\/div><div class=\"pchip\" id=\"p282\"><span>원문 282쪽<\/span> <a class=\"pdflink\" href=\"corp2026.pdf#page=288\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">3. 보통재산중 총회 또는 이사회에서 기본재산으로 편입할 것을 의결한 재산<\/div><div class=\"ln p\">4. 세계잉여금중 적립금<\/div><div class=\"ln p\">② 보통재산은 기본재산 이외의 모든 재산으로 한다.<\/div><div class=\"ln p\">③ 주무관청은 공익법인의 보통재산이 과다하다고 인정할 때에는 그 일부를 기본재산으로 편입하게 할 수 있다.<\/div><div class=\"ln p\">제17조(기본재산의 처분) ① 법 제11조제3항제1호에 따라 기본재산의 매도ㆍ증여ㆍ임대 또는 교환에 관한 허가를 받으려는 경우에는 그 허가신청서에 다음 각 호의 서류를 첨부하여 주무관청에 제출해야 한다. &lt;개정 1993. 11. 20., 1995. 7. 6., 2011. 8. 19., 2016. 8. 31., 2016. 11. 29., 2020. 12. 1.&gt;<\/div><div class=\"ln p\">1. 처분재산명세서<\/div><div class=\"ln p\">2. 「감정평가 및 감정평가사에 관한 법률」 제2조제4호에 따른 감정평가법인등(이하 “감정평가법인등”이라 한다)이 작성한 감정평가서 또는 시장ㆍ군수 또는 구청장(자치구의 구청장을 말한다. 이하 같다)이 「부동산 가격공시에 관한 법률」 제8조에 따라 표준지의 공시지가를 기준으로 하여 산정
