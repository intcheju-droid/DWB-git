따라 사회복지 법인 ○○○의        .   .   .부터       .   .   .로 종결되는 회계연도의 업무집행 내용과 ○○회계에 속하는 수입과 지출에 관한 제반 증빙서류와 장부를 일반적인 감사기준에 따라 감사를 실시하였습니다."}, {"p": 225, "t": "업무집행내용과 결산서의 각항은(다음에 지적된 사항을 제외하고는) 정확하였으며, 그 회계처리는 적정하였습니다.\n(다  음)\n년       월       일\n사회복지법인              ○○○\n감사              (서명 또는 인)\n감사              (서명 또는 인)\n사회복지법인 ○○○대표이사  귀하\n31313-19211일 97.12.6 승인\n210㎜×297㎜ (일반용지 60g/㎡)"}, {"p": 227, "t": "[별지 제25호서식] <개정 2005.7.15>\n총 계 정 원 장 (법인용)\n계정과목 :\n계정명 | 연월일 | 적  요 | 수 입 | 지 출 | 차인잔액\n |  |  |  |  | \n210㎜×297㎜(일반용지 60g/㎡(재활용품))"}, {"p": 228, "t": "[별지 제25호의2서식] <개정 2005.7.15>\n총 계 정 원 장 (시설용)\n계정과목 :\n계정명 | 연월일 | 적  요 | 수 입 | 지 출 | 차인잔액\n |  |  |  |  | \n210㎜×297㎜(일반용지 60g/㎡(재활용품))"}, {"p": 229, "t": "[별지 제26호서식]\n총 계 정 원 장 보 조 부\n연월일 | 적  요 | 수  입 | 지  출 | 잔  액\n계 | 현금 | 예금 | 계 | 현금 | 예금 | 계 | 현금 | 예금\n |  |  |  |  |  |  |  |  |  | \n3106-85일 87.5.29 승인 | 210㎜×297㎜ (인쇄용지(특급) 70g/㎡)"}, {"p": 231, "t": "부   록"}]}]}, {"no": 6, "title": "부록", "start": 233, "end": 256, "sections": [{"title": "1. ○○시설 운영위원회 운영규정(안)(예시)", "start": 234, "end": 238, "html": "<div class=\"pchip\" id=\"p234\"><span>원문 234쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=246\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1. ○○시설 운영위원회 운영규정(안) (예시)[별표 1] 시설운영위원회 회의록(예시)[별표 2] 시설운영위원회 정책건의사항(예시)<\/div><div class=\"ln p\">2. 사회복지시설 위탁 운영기준(안) (예시)[별표 1] 위탁 심의자료의 구성(예시)[별표 2] 수탁자 선정 심의기준 및 배점(예시)<\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>3. 사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)<\/div><div class=\"ln b1\">○○시설 운영위원회 운영규정(안)(예시)<\/div><div class=\"ln note\">※각 시설은 동 예시를 참조하여 시설별로 운영위원회 구성 및 운영 등에 관하여 필요한 사항을 법령을 벗어나지 않는 범위 내에서 작성하여 운영토록 지도<\/div><div class=\"ln p\">제1조(목적) 이 규정은 사회복지시설 운영의 체계적･종합적 발전방향을 모색하기 위한 시설운영위원회(이하 “위원회”라 한다)의 구성과 운영에 필요한 사항을 정함을 목적으로 한다.<\/div><div class=\"ln p\">제2조(위원회의 기능) ① 위원회는 사회복지시설 운영과 관련한 다음 각호의 사항을 심의한다.<\/div><div class=\"ln p\">1.시설운영계획의 수립･평가에 관한 사항<\/div><div class=\"ln p\">2.사회복지프로그램의 개발･평가에 관한 사항<\/div><div class=\"ln p\">3.시설종사자의 근무환경 개선에 관한 사항<\/div><div class=\"ln p\">4.시설거주자의 생활환경 개선 및 고충처리 등에 관한 사항<\/div><div class=\"ln p\">5.시설 종사자와 거주자의 인권보호 및 권익증진에 관한 사항<\/div><div class=\"ln p\">6.시설과 지역사회와의 협력에 관한 사항<\/div><div class=\"ln p\">7.그 밖에 시설의 장이 운영위원회의 회의에 부치는 사항<\/div><div class=\"ln p\">② 위원회는 해당 시설장으로부터 다음 각 호의 사항을 보고 받는다.<\/div><div class=\"ln p\">1.시설의 회계 및 예산･결산에 관한 사항<\/div><div class=\"ln p\">2.후원금 조성 및 집행에 관한 사항<\/div><div class=\"ln p\">3.그 밖에 시설운영과 관련된 사건･사고에 관한 사항<\/div><div class=\"ln p\">제3조(위원회의 구성) ① 위원회는 위원장을 포함하여 5명 이상 15명 이하의 위원으로 구성한다.<\/div><div class=\"ln p\">②위원회의 위원은 다음 각 호의 어느 하나에 해당하는 사람 중에서 관할 시장･군수･구청장이 임명하거나 위촉한다.<\/div><div class=\"ln p\">1.시설의 장<\/div><div class=\"pchip\" id=\"p235\"><span>원문 235쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=247\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2.시설 거주자 대표<\/div><div class=\"ln p\">3.시설 거주자의 보호자 대표<\/div><div class=\"ln p\">4.시설 종사자의 대표<\/div><div class=\"ln p\">5.해당 시･군･구 소속의 사회복지업무를 담당하는 공무원<\/div><div class=\"ln p\">6.후원자 대표 또는 지역주민<\/div><div class=\"ln p\">7.공익단체에서 추천한 사람<\/div><div class=\"ln p\">8.그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이 풍부한 자<\/div><div class=\"ln p\">③ 위원회의 위원장은 위원 중에서 호선한다.<\/div><div class=\"ln p\">④ 위원의 임기는 3년으로 하되, 보궐된 위원의 임기는 전임자 임기의 남은 기간으로 한다.<\/div><div class=\"ln p\">⑤ 위원회에는 부위원장 1인과 간사 1인을 두되 위원장이 임명한다.<\/div><div class=\"ln p\">제4조(위원장 등의 임무) ① 위원장은 위원회를 대표하고, 위원회의 임무를 총괄한다.<\/div><div class=\"ln p\">② 부위원장은 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 그 직무를 대행한다.<\/div><div class=\"ln p\">③ 간사위원은 위원장을 보좌하고 위원회 운영에 대한 행정적 지원 등을 담당한다.<\/div><div class=\"ln p\">제5조(회의) ① 위원장은 회의를 소집하고 그 의장이 된다.<\/div><div class=\"ln p\">② 위원회의 회의는 다음의 경우에 소집한다.<\/div><div class=\"ln p\">1.정기회의<\/div><div class=\"ln p\">2.위원장의 소집요구가 있는 경우<\/div><div class=\"ln p\">3.재적위원 3분의 1 이상의 소집요구가 있는 경우<\/div><div class=\"ln p\">③ 위원회는 재적위원 과반수의 출석과 출석위원 과반수의 찬성으로 의결한다.<\/div><div class=\"ln p\">제6조(자문위원회) ① 위원장은 사회복지시설 운영과 관련된 전문적인 사항에 관하여 자문을 구하기 위하여 5인 이내의 전문가로 구성된 자문위원회를 둘 수 있다.<\/div><div class=\"ln p\">② 자문위원회의 위원은 회의에 참석하여 의장의 요청에 따라 안건에 대해 발언할 수 있으며, 의결에는 참여할 수 없다.<\/div><div class=\"ln p\">제7조(의견의 청취 등) 위원회는 필요한 경우 관계공무원･관계전문가 또는 관계기관･단체 등에 조사･연구를 의뢰하거나 공청회･세미나 등의 개최를 통하여 관련기관･단체･관계 전문가의 의견을 들을 수 있다.<\/div><div class=\"pchip\" id=\"p236\"><span>원문 236쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=248\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제8조(회의공개의 제한) 회의는 시설생활자, 시설종사자 등에게 공개를 원칙으로 한다. 다만, 위원장이 개인정보보호 등 불가피한 사유가 있다고 판단될 때에는 그 회의의 공개를 제한할 수 있다. 이 경우 비공개 사유는 공개해야 한다.<\/div><div class=\"ln p\">제9조(수당 등) 위원장, 부위원장, 위원, 기타 관계공무원 또는 관계전문가에 대해서는 시설예산의 범위 안에서 수당･여비 기타 필요한 경비를 지급할 수 있다. 다만, 공무원이 그 소관업무와 관련하여 위원회에 출석하는 경우에는 그러하지 아니하다.<\/div><div class=\"ln p\">제10조(운영규정의 개정) ① 위원회는 재적위원 과반수 발의로 운영규정 개정안을 발의할 수 있다.<\/div><div class=\"ln p\">② 위원회는 재적위원 3분의 2 이상이 찬성으로 운영규정을 개정할 수 있다.<\/div><div class=\"ln p\">③ 개정된 운영규칙은 특별한 규정이 없는 한 위원회의 의결 즉시 시행된다.<\/div><div class=\"ln p\">제11조(운영세칙) 이 규정에 규정된 것 외에 위원회의 운영에 관하여 필요한 사항은 위원회의 의결을 거쳐 위원장이 정한다.<\/div><div class=\"ln p\">부    칙<\/div><div class=\"ln p\">① (시행일) 이 규정은 의결한 날부터 시행한다.<\/div><div class=\"ln p\">[별표 1]<\/div><div class=\"pchip\" id=\"p237\"><span>원문 237쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=249\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">시설운영위원회 회의록(예시)<\/div><table class=\"htbl\"><tr><td colspan=\"4\">○○ 시설운영위원회 제  차 정기(수시) 회의<\/td><\/tr><tr><td>일 시<\/td><td><\/td><td>장 소<\/td><td><\/td><\/tr><tr><td>참석자<\/td><td colspan=\"3\"><\/td><\/tr><tr><td>회의내용<\/td><td colspan=\"3\"><\/td><\/tr><tr><td>정책건의<\/td><td colspan=\"3\"><\/td><\/tr><\/table><div class=\"ln p\">[별표 2]<\/div><div class=\"pchip\" id=\"p238\"><span>원문 238쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=250\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">시설운영위원회 정책건의사항(예시)<\/div><table class=\"htbl\"><tr><td colspan=\"2\">○○시･도 ○○ 시･군･구 시설정책 건의사항<\/td><\/tr><tr><td>운영위원회<br>정책건의<\/td><td><\/td><\/tr><tr><td>시･군･구<br>정책건의<\/td><td><\/td><\/tr><tr><td>시･도<br>정책건의<\/td><td><\/td><\/tr><\/table>", "pages": [{"p": 234, "t": "1. ○○시설 운영위원회 운영규정(안) (예시)[별표 1] 시설운영위원회 회의록(예시)[별표 2] 시설운영위원회 정책건의사항(예시)\n2. 사회복지시설 위탁 운영기준(안) (예시)[별표 1] 위탁 심의자료의 구성(예시)[별표 2] 수탁자 선정 심의기준 및 배점(예시)\n3. 사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)\n1\n○○시설 운영위원회 운영규정(안)(예시)\n※각 시설은 동 예시를 참조하여 시설별로 운영위원회 구성 및 운영 등에 관하여 필요한 사항을 법령을 벗어나지 않는 범위 내에서 작성하여 운영토록 지도\n제1조(목적) 이 규정은 사회복지시설 운영의 체계적･종합적 발전방향을 모색하기 위한 시설운영위원회(이하 “위원회”라 한다)의 구성과 운영에 필요한 사항을 정함을 목적으로 한다.\n제2조(위원회의 기능) ① 위원회는 사회복지시설 운영과 관련한 다음 각호의 사항을 심의한다.\n1.시설운영계획의 수립･평가에 관한 사항\n2.사회복지프로그램의 개발･평가에 관한 사항\n3.시설종사자의 근무환경 개선에 관한 사항\n4.시설거주자의 생활환경 개선 및 고충처리 등에 관한 사항\n5.시설 종사자와 거주자의 인권보호 및 권익증진에 관한 사항\n6.시설과 지역사회와의 협력에 관한 사항\n7.그 밖에 시설의 장이 운영위원회의 회의에 부치는 사항\n② 위원회는 해당 시설장으로부터 다음 각 호의 사항을 보고 받는다.\n1.시설의 회계 및 예산･결산에 관한 사항\n2.후원금 조성 및 집행에 관한 사항\n3.그 밖에 시설운영과 관련된 사건･사고에 관한 사항\n제3조(위원회의 구성) ① 위원회는 위원장을 포함하여 5명 이상 15명 이하의 위원으로 구성한다.\n②위원회의 위원은 다음 각 호의 어느 하나에 해당하는 사람 중에서 관할 시장･군수･구청장이 임명하거나 위촉한다.\n1.시설의 장"}, {"p": 235, "t": "2.시설 거주자 대표\n3.시설 거주자의 보호자 대표\n4.시설 종사자의 대표\n5.해당 시･군･구 소속의 사회복지업무를 담당하는 공무원\n6.후원자 대표 또는 지역주민\n7.공익단체에서 추천한 사람\n8.그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이 풍부한 자\n③ 위원회의 위원장은 위원 중에서 호선한다.\n④ 위원의 임기는 3년으로 하되, 보궐된 위원의 임기는 전임자 임기의 남은 기간으로 한다.\n⑤ 위원회에는 부위원장 1인과 간사 1인을 두되 위원장이 임명한다.\n제4조(위원장 등의 임무) ① 위원장은 위원회를 대표하고, 위원회의 임무를 총괄한다.\n② 부위원장은 위원장이 부득이한 사유로 직무를 수행할 수 없을 때에는 그 직무를 대행한다.\n③ 간사위원은 위원장을 보좌하고 위원회 운영에 대한 행정적 지원 등을 담당한다.\n제5조(회의) ① 위원장은 회의를 소집하고 그 의장이 된다.\n② 위원회의 회의는 다음의 경우에 소집한다.\n1.정기회의\n2.위원장의 소집요구가 있는 경우\n3.재적위원 3분의 1 이상의 소집요구가 있는 경우\n③ 위원회는 재적위원 과반수의 출석과 출석위원 과반수의 찬성으로 의결한다.\n제6조(자문위원회) ① 위원장은 사회복지시설 운영과 관련된 전문적인 사항에 관하여 자문을 구하기 위하여 5인 이내의 전문가로 구성된 자문위원회를 둘 수 있다.\n② 자문위원회의 위원은 회의에 참석하여 의장의 요청에 따라 안건에 대해 발언할 수 있으며, 의결에는 참여할 수 없다.\n제7조(의견의 청취 등) 위원회는 필요한 경우 관계공무원･관계전문가 또는 관계기관･단체 등에 조사･연구를 의뢰하거나 공청회･세미나 등의 개최를 통하여 관련기관･단체･관계 전문가의 의견을 들을 수 있다."}, {"p": 236, "t": "제8조(회의공개의 제한) 회의는 시설생활자, 시설종사자 등에게 공개를 원칙으로 한다. 다만, 위원장이 개인정보보호 등 불가피한 사유가 있다고 판단될 때에는 그 회의의 공개를 제한할 수 있다. 이 경우 비공개 사유는 공개해야 한다.\n제9조(수당 등) 위원장, 부위원장, 위원, 기타 관계공무원 또는 관계전문가에 대해서는 시설예산의 범위 안에서 수당･여비 기타 필요한 경비를 지급할 수 있다. 다만, 공무원이 그 소관업무와 관련하여 위원회에 출석하는 경우에는 그러하지 아니하다.\n제10조(운영규정의 개정) ① 위원회는 재적위원 과반수 발의로 운영규정 개정안을 발의할 수 있다.\n② 위원회는 재적위원 3분의 2 이상이 찬성으로 운영규정을 개정할 수 있다.\n③ 개정된 운영규칙은 특별한 규정이 없는 한 위원회의 의결 즉시 시행된다.\n제11조(운영세칙) 이 규정에 규정된 것 외에 위원회의 운영에 관하여 필요한 사항은 위원회의 의결을 거쳐 위원장이 정한다.\n부    칙\n① (시행일) 이 규정은 의결한 날부터 시행한다.\n[별표 1]"}, {"p": 237, "t": "시설운영위원회 회의록(예시)\n○○ 시설운영위원회 제  차 정기(수시) 회의\n일 시 |  | 장 소 | \n참석자 | \n회의내용 | \n정책건의 | \n[별표 2]"}, {"p": 238, "t": "시설운영위원회 정책건의사항(예시)\n○○시･도 ○○ 시･군･구 시설정책 건의사항\n운영위원회 정책건의 | \n시･군･구 정책건의 | \n시･도 정책건의 | "}]}, {"title": "2. 사회복지시설 위탁 운영기준(안)(예시)", "start": 239, "end": 243, "html": "<div class=\"pchip\" id=\"p239\"><span>원문 239쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=251\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회복지시설 위탁 운영기준(안) (예시)<\/div><div class=\"ln note\">※동 운영기준(안)은 예시이므로, 위탁기관은 이를 참고하여 관계법령을 벗어나지 않는 범위 내에서 조례 등으로 별도의 운영기준을 마련･운영할 것<\/div><div class=\"ln p\">제1조(목적) 이 기준은 사회복지사업법시행규칙 제21조의 규정에 의하여 ○○지방자치 단체가 설치한 사회복지시설을 사회복지법인 또는 비영리법인으로 하여금 위탁 운영하도록 하는 것에 관한 기본적인 사항을 정함으로써 위탁과정과 위탁 선정심의의 공정성 및 투명성을 증진시켜 적정한 법인이 수탁 운영토록 하여 지역사회주민의 복지증진에 기여함을 목적으로 한다.<\/div><div class=\"ln p\">제2조(정의) 이 기준에서 사용하는 용어의 정의는 다음과 같다.<\/div><div class=\"ln p\">①“위탁기관”이라 함은 사회복지시설을 위탁하고자 하는 ○○지방자치단체를 말한다.<\/div><div class=\"ln p\">②“수탁자”라 함은 이 기준에 의해 위탁기관으로부터 사회복지시설의 운영을 위탁 받은 법인을 말한다.<\/div><div class=\"ln p\">③“재위탁”이라 함은 위탁기간이 만료되어 계약기간을 갱신함에 있어 위탁기간 만료전의 수탁자에게 계속 위탁하는 경우를 말한다.<\/div><div class=\"ln p\">제3조(원칙) 이 기준에 의한 사회복지시설의 위탁과 재위탁을 하는 기관 및 수탁자는 사회복지서비스를 필요로 하는 사람의 인권과 복지를 보장하기 위하여 다음 각 호의 원칙을 준수해야 한다.<\/div><div class=\"ln p\">① 공개성의 원칙위탁기관은 수탁자를 선정하고자 하는 때에는 공개로 모집하여야 한다. 단, 「사회복지사업법 시행규칙」 제21조제1항 단서에 따라 공개모집 예외에 해당하는 경우는 제외한다.<\/div><div class=\"ln p\">② 전문성의 원칙위탁기관은 수탁자를 선정하기 위한 심사절차에서 반드시 사회복지에 관한 전문성의 기준을 일차적 기준으로 하여야 한다.<\/div><div class=\"ln p\">③ 중립성의 원칙위탁기관 및 해당 기관의 공무원은 위탁과정과 선정에 있어서 정치적, 종교적, 기타 이해관계에서 벗어나 중립성을 유지하여야 한다.<\/div><div class=\"pchip\" id=\"p240\"><span>원문 240쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=252\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제4조(수탁 운영자격) ① 사회복지시설은 사회복지법인, 비영리법인이 수탁 받을 수 있다. 다만, 지방자치단체가 직접 운영하는 경우에는 제외한다.<\/div><div class=\"ln p\">② 사회복지시설을 수탁받으려는 법인은 법인의 정관상 목적사업으로 수탁받고자 하는 시설과 관련된 사업내용이 규정되어 있고, 수탁운영에 필요한 전담인력 및 조직, 예산 등을 갖추어야 한다.<\/div><div class=\"ln p\">제5조(수탁자선정심의위원회) ① 사회복지사업법시행규칙 제21조의 규정에 의한 수탁자 선정심의위원회(이하 “선정위원회”라 한다)를 다음과 같이 구성한다.<\/div><div class=\"ln p\">② 선정위원회는 위원장과 다음 각 호의 자를 포함하여 9인 이내로 구성하며, 위원장은 위원 중에서 위탁기관의 장이 지명한다.<\/div><div class=\"ln p\">1.사회복지업무를 담당하는 공무원<\/div><div class=\"ln p\">2.사회복지에 관한 학식과 경험이 풍부한 자<\/div><div class=\"ln p\">3.공익단체(비영리민간단체지원법 제2조의 규정에 의한 비영리민간단체를 말한다) 에서 추천한 자<\/div><div class=\"ln p\">4.기타 법률전문가 등 선정위원회 참여가 필요하다고 위탁기관의 장이 인정하는 자  단, 위원구성과 관련하여 수탁자와 특수관계자(친･인척 등) 및 분명한 이해관계가 있다고 판단되는 자는 제외하여야 한다.<\/div><div class=\"ln p\">③ 선정위원회는 각종 위탁신청서류의 심사를 통해 수탁자를 선정해야 하며, 필요한 경우에는 면접심사 및 현장확인과 관련 자료의 제출을 요구할 수 있다.<\/div><div class=\"ln p\">④선정위원회는 재적위원 과반수의 출석으로 개의하고 출석위원 과반수의 찬성으로 의결한다.<\/div><div class=\"ln p\">⑤위탁기관의 공무원이 아닌 위원에 대해서는 관련 규정이 정하는 바에 따라 수당과 여비를 지급할 수 있다.<\/div><div class=\"ln p\">제6조(수탁자의 선정기준) ① 위탁기관은 수탁자를 선정할 때에는 공개모집으로 수탁자를 선정하되, 수탁자의 재정적 능력, 공신력, 사업수행능력, 지역간 균형분포 및 시설 평가결과(평가를 한 경우에 한한다) 등을 종합적으로 고려하여 선정위원회의 심의를 거쳐 선정하여야 한다. 「사회복지사업법 시행규칙」 제21조제1항 단서에 따라 공개모집을 하지 않고 수탁자 선정 및 심의를 진행할 때에는 공개모집 예외 사유의 적절성 등을 추가적으로 고려하여야 한다.<\/div><div class=\"ln p\">②전 항의 심사에 필요한 서류는 별표 1의 목록을 따른다. 단, 위탁기관이 필요 하다고 인정하는 때에는 추가로 서류 제출을 요구할 수 있다.<\/div><div class=\"ln p\">③ 심사의 기준과 배점은 별표 2의 기준에 따른다.<\/div><div class=\"pchip\" id=\"p241\"><span>원문 241쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=253\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제7조(수탁자의 선정) 제6조의 선정기준에 의거하여 최고점수와 최저점수를 제외한 위원들의 점수를 평균하여 최고 점수를 획득한 법인을 수탁 법인으로 선정한다. 단, 동일점수를 획득한 경우에는 위원들의 표결에 의해 결정하고 그 결과를 즉시 공개 하여야 한다.<\/div><div class=\"ln p\">제8조(계약의 체결) ① 위탁기관은 수탁 법인이 선정된 때에는 위탁에 관한 계약을 체결하여야 한다.<\/div><div class=\"ln p\">② 위탁기관은 수탁 법인과 위탁에 관한 계약을 체결하는 때에는 계약내용에 위탁의 목적, 위탁재산, 위탁기간, 위탁사업, 수탁자의 의무 및 준수사항, 시설의 안전관리, 고용승계, 계약의 해지, 지도감독에 관한 사항과 기타 필요한 사항을 포함하여 계약을 체결한다.<\/div><div class=\"ln p\">제9조(고용승계) 위탁기간 중 또는 만료 후 새로 수탁자가 변경되어도 종전직원들의 신분은 보장한다. 단, 각종 위원회의 위원은 제외한다.<\/div><div class=\"ln p\">제10조(지도감독･감사) 위탁기관의 장은 수탁자를 지도･감독하여야 하며, 이를 통해 위탁 사무의 처분이 위법 또는 부당하다고 인정되는 경우에는 그 사무의 처분에 대해 취소, 정지 또는 시정을 명할 수 있으며, 필요에 따라 위탁기관은 감사 또는 특별감사를 행할 수 있다. 다만, 수탁자가 이 명령에 따르지 않는 경우 위탁기관은 위탁을 취소할 수 있다.<\/div><div class=\"ln p\">제11조(위탁기간) 위탁의 기간은 5년으로 하며, 위탁기간을 갱신하고자 할 경우에는 선정위원회의 심의를 거쳐 위탁기간을 갱신할 수 있다.<\/div><div class=\"ln p\">제12조(위탁평가 및 위탁기간 갱신) ① 위탁기관은 위탁기간 만료 3월 내지 6월 이전에 위탁사무에 대해 평가를 실시해야 하며, 평가 결과 사업성과, 사업의 효과성, 시설관리상태, 회계감사, 이용자 만족도 조사, 종사자의 인권과 처우문제 등에 중대한 하자가 없다고 판단할 경우에는 위탁기간을 갱신할 수 있다.<\/div><div class=\"ln p\">② 전 항의 평가는 위탁평가위원회를 구성하여 실시해야 하며 이에 대하여는 제5조 2항의 규정을 준용한다.<\/div><div class=\"ln p\">③ 위탁평가위원회에서 평가 후 위탁기간 갱신을 결정한 법인에 대해서는 위탁기간 만료 1개월전까지 위탁운영 약정계약을 체결하며 신규 위탁을 공모하지 않는다.<\/div><div class=\"ln p\">④ 제10조에 의해 위탁기간 중 신규 위탁을 행할 경우에는 제5조 내지 제6조를 준용한다.<\/div><div class=\"ln p\">[별표 1]<\/div><div class=\"pchip\" id=\"p242\"><span>원문 242쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=254\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">위탁 심의자료의 구성(예시)<\/div><div class=\"ln p\">구  성<\/div><div class=\"ln p\">내  용<\/div><div class=\"ln p\">1. 위탁신청 법인에 관한 일반적 사항<\/div><div class=\"ln h4\">1) 법인 유형 및 소재지 2) 법인 정관 3) 법인대표 및 이사 전원의 인적사항과 이력서 4) 관련 사회복지사업 수행 실적<\/div><div class=\"ln p\">2. 위탁신청의 배경과 목적<\/div><div class=\"ln p\">3. 시설운영 계획<\/div><div class=\"ln h4\">1) 조직구성 (1) 시설장 채용조건(경력 등) (2) 종사자의 확보계획 (3) 조직구성 및 업무분장 2) 사업계획 (1) 시설의 활성화를 위한 장･단기 계획 (2) 프로그램의 구성과 운영방안 3) 시설운영 (1) 시설운영의 전문성 강화 방안 (2) 시설운영의 투명성 제고 방안 (3) 재정운영계획 (4) 재정투자계획 (5) 재정확충방안<\/div><div class=\"ln p\">4. 지역사회와의 협력관계구축방안<\/div><div class=\"ln h4\">1) 지역사회에서의 공신력 제고 방안 2) 유관기관들과의 협력관계 방안 3) 지역사회 자원동원 및 활용방안<\/div><div class=\"ln p\">[별표 2]<\/div><div class=\"pchip\" id=\"p243\"><span>원문 243쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=255\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">수탁자 선정 심의기준 및 배점(예시)<\/div><table class=\"htbl\"><tr><td>심사기준<\/td><td>심사항목<\/td><td>배점<\/td><\/tr><tr><td><\/td><td><\/td><td>100점<\/td><\/tr><tr><td>1. 수탁자의 적격성<\/td><td>‒ 법인유형 및 설립목적<br>‒ 법인의 보유자산(부동산, 동산 구분)<br>‒ 법인대표 및 이사회의 적합성<br>‒ 해당 법인의 사회복지사업 운영실적<\/td><td>30점<\/td><\/tr><tr><td>2. 시설운영의 전문성 및 책임성<\/td><td>‒ 법인의 사회복지사업 전문성<br>‒ 시설장 및 종사자의 전문성<br>‒ 사업계획의 전문성 및 타당성<br>‒ 시설운영의 전문성 강화방안<br>‒ 최근 법인 재무제표<br>‒ 재정운영 및 투자계획의 타당성<br>‒ 재정확충방안의 현실성과 타당성<br>‒ 시설운영의 투명성 제고방안<br>‒ 복지부 보급 희망이음 및 사회복지시설정보시스템 사용<\/td><td>50점<\/td><\/tr><tr><td>3. 지역사회와의 협력적 관계조성 능력<\/td><td>‒ 지역사회 내 공신력 제고방안<br>‒ 유관기관과의 협력관계 구축방안<br>‒ 지역사회자원동원 방안<\/td><td>20점<\/td><\/tr><\/table><div class=\"ln note\">※ 수탁자의 적격성(30점) 중<\/div><div class=\"ln p\">‒ 시설장 및 관리자를 제외한 종사자 90% 이상 고용승계를 조건으로 위탁받을 경우 가점 부여<\/div><div class=\"ln note\">※ 시설운영의 전문성 및 책임성(50점) 중<\/div><div class=\"ln p\">‒ 시설장의 전문성에 10점 이상 배점<\/div><div class=\"ln p\">‒ 시설장을 공개모집 할 것을 조건으로 위탁 받을 경우 가점 부여<\/div><div class=\"ln p\">‒ 시설장을 공개모집하지 않고 법인이사회에서 임명 또는 시설장이 타 직위를 겸직할 경우 감점<\/div><div class=\"ln p\">‒ 사회복지시설정보시스템 및 희망이음 사용(대상자관리를 포함하여 통합 회계관리 등 전체기능 사용)<\/div><div class=\"ln note\">※선정위원회의 심의를 거쳐 위탁기간을 갱신하는 경우(규칙 제21조의2), 재위탁 심의 과정에서 해당법인에 대한 지자체의 지도점검 결과(보조금 부당･불법사용 여부 반드시 포함)를 확인할 수 있는 규정을 마련하여야 함 (국민권익위 권고사항, ʼ10.4)<\/div><div class=\"ln note\">※위탁기관에서 수탁기관 재정부담계획의 일환으로 법인전입금 규모를 심사항목에 포함하는 경우 에는, 법인 전입금의 재원 출처의 적정성을 심사하여야 함 (시설 후원금을 법인의 후원금으로 편입, 시설에서 바자회 등을 통한 사업수익금 등을 법인전입금으로 편성, 법인의 기본재산을 전입금으로 편입하는 등의 편법여부를 확인하고 이에 대한 감점기준 마련, 국민권익위 권고사항, ʼ10.4)<\/div><div class=\"ln p\">3<\/div>", "pages": [{"p": 239, "t": "2\n사회복지시설 위탁 운영기준(안) (예시)\n※동 운영기준(안)은 예시이므로, 위탁기관은 이를 참고하여 관계법령을 벗어나지 않는 범위 내에서 조례 등으로 별도의 운영기준을 마련･운영할 것\n제1조(목적) 이 기준은 사회복지사업법시행규칙 제21조의 규정에 의하여 ○○지방자치 단체가 설치한 사회복지시설을 사회복지법인 또는 비영리법인으로 하여금 위탁 운영하도록 하는 것에 관한 기본적인 사항을 정함으로써 위탁과정과 위탁 선정심의의 공정성 및 투명성을 증진시켜 적정한 법인이 수탁 운영토록 하여 지역사회주민의 복지증진에 기여함을 목적으로 한다.\n제2조(정의) 이 기준에서 사용하는 용어의 정의는 다음과 같다.\n①“위탁기관”이라 함은 사회복지시설을 위탁하고자 하는 ○○지방자치단체를 말한다.\n②“수탁자”라 함은 이 기준에 의해 위탁기관으로부터 사회복지시설의 운영을 위탁 받은 법인을 말한다.\n③“재위탁”이라 함은 위탁기간이 만료되어 계약기간을 갱신함에 있어 위탁기간 만료전의 수탁자에게 계속 위탁하는 경우를 말한다.\n제3조(원칙) 이 기준에 의한 사회복지시설의 위탁과 재위탁을 하는 기관 및 수탁자는 사회복지서비스를 필요로 하는 사람의 인권과 복지를 보장하기 위하여 다음 각 호의 원칙을 준수해야 한다.\n① 공개성의 원칙위탁기관은 수탁자를 선정하고자 하는 때에는 공개로 모집하여야 한다. 단, 「사회복지사업법 시행규칙」 제21조제1항 단서에 따라 공개모집 예외에 해당하는 경우는 제외한다.\n② 전문성의 원칙위탁기관은 수탁자를 선정하기 위한 심사절차에서 반드시 사회복지에 관한 전문성의 기준을 일차적 기준으로 하여야 한다.\n③ 중립성의 원칙위탁기관 및 해당 기관의 공무원은 위탁과정과 선정에 있어서 정치적, 종교적, 기타 이해관계에서 벗어나 중립성을 유지하여야 한다."}, {"p": 240, "t": "제4조(수탁 운영자격) ① 사회복지시설은 사회복지법인, 비영리법인이 수탁 받을 수 있다. 다만, 지방자치단체가 직접 운영하는 경우에는 제외한다.\n② 사회복지시설을 수탁받으려는 법인은 법인의 정관상 목적사업으로 수탁받고자 하는 시설과 관련된 사업내용이 규정되어 있고, 수탁운영에 필요한 전담인력 및 조직, 예산 등을 갖추어야 한다.\n제5조(수탁자선정심의위원회) ① 사회복지사업법시행규칙 제21조의 규정에 의한 수탁자 선정심의위원회(이하 “선정위원회”라 한다)를 다음과 같이 구성한다.\n② 선정위원회는 위원장과 다음 각 호의 자를 포함하여 9인 이내로 구성하며, 위원장은 위원 중에서 위탁기관의 장이 지명한다.\n1.사회복지업무를 담당하는 공무원\n2.사회복지에 관한 학식과 경험이 풍부한 자\n3.공익단체(비영리민간단체지원법 제2조의 규정에 의한 비영리민간단체를 말한다) 에서 추천한 자\n4.기타 법률전문가 등 선정위원회 참여가 필요하다고 위탁기관의 장이 인정하는 자  단, 위원구성과 관련하여 수탁자와 특수관계자(친･인척 등) 및 분명한 이해관계가 있다고 판단되는 자는 제외하여야 한다.\n③ 선정위원회는 각종 위탁신청서류의 심사를 통해 수탁자를 선정해야 하며, 필요한 경우에는 면접심사 및 현장확인과 관련 자료의 제출을 요구할 수 있다.\n④선정위원회는 재적위원 과반수의 출석으로 개의하고 출석위원 과반수의 찬성으로 의결한다.\n⑤위탁기관의 공무원이 아닌 위원에 대해서는 관련 규정이 정하는 바에 따라 수당과 여비를 지급할 수 있다.\n제6조(수탁자의 선정기준) ① 위탁기관은 수탁자를 선정할 때에는 공개모집으로 수탁자를 선정하되, 수탁자의 재정적 능력, 공신력, 사업수행능력, 지역간 균형분포 및 시설 평가결과(평가를 한 경우에 한한다) 등을 종합적으로 고려하여 선정위원회의 심의를 거쳐 선정하여야 한다. 「사회복지사업법 시행규칙」 제21조제1항 단서에 따라 공개모집을 하지 않고 수탁자 선정 및 심의를 진행할 때에는 공개모집 예외 사유의 적절성 등을 추가적으로 고려하여야 한다.\n②전 항의 심사에 필요한 서류는 별표 1의 목록을 따른다. 단, 위탁기관이 필요 하다고 인정하는 때에는 추가로 서류 제출을 요구할 수 있다.\n③ 심사의 기준과 배점은 별표 2의 기준에 따른다."}, {"p": 241, "t": "제7조(수탁자의 선정) 제6조의 선정기준에 의거하여 최고점수와 최저점수를 제외한 위원들의 점수를 평균하여 최고 점수를 획득한 법인을 수탁 법인으로 선정한다. 단, 동일점수를 획득한 경우에는 위원들의 표결에 의해 결정하고 그 결과를 즉시 공개 하여야 한다.\n제8조(계약의 체결) ① 위탁기관은 수탁 법인이 선정된 때에는 위탁에 관한 계약을 체결하여야 한다.\n② 위탁기관은 수탁 법인과 위탁에 관한 계약을 체결하는 때에는 계약내용에 위탁의 목적, 위탁재산, 위탁기간, 위탁사업, 수탁자의 의무 및 준수사항, 시설의 안전관리, 고용승계, 계약의 해지, 지도감독에 관한 사항과 기타 필요한 사항을 포함하여 계약을 체결한다.\n제9조(고용승계) 위탁기간 중 또는 만료 후 새로 수탁자가 변경되어도 종전직원들의 신분은 보장한다. 단, 각종 위원회의 위원은 제외한다.\n제10조(지도감독･감사) 위탁기관의 장은 수탁자를 지도･감독하여야 하며, 이를 통해 위탁 사무의 처분이 위법 또는 부당하다고 인정되는 경우에는 그 사무의 처분에 대해 취소, 정지 또는 시정을 명할 수 있으며, 필요에 따라 위탁기관은 감사 또는 특별감사를 행할 수 있다. 다만, 수탁자가 이 명령에 따르지 않는 경우 위탁기관은 위탁을 취소할 수 있다.\n제11조(위탁기간) 위탁의 기간은 5년으로 하며, 위탁기간을 갱신하고자 할 경우에는 선정위원회의 심의를 거쳐 위탁기간을 갱신할 수 있다.\n제12조(위탁평가 및 위탁기간 갱신) ① 위탁기관은 위탁기간 만료 3월 내지 6월 이전에 위탁사무에 대해 평가를 실시해야 하며, 평가 결과 사업성과, 사업의 효과성, 시설관리상태, 회계감사, 이용자 만족도 조사, 종사자의 인권과 처우문제 등에 중대한 하자가 없다고 판단할 경우에는 위탁기간을 갱신할 수 있다.\n② 전 항의 평가는 위탁평가위원회를 구성하여 실시해야 하며 이에 대하여는 제5조 2항의 규정을 준용한다.\n③ 위탁평가위원회에서 평가 후 위탁기간 갱신을 결정한 법인에 대해서는 위탁기간 만료 1개월전까지 위탁운영 약정계약을 체결하며 신규 위탁을 공모하지 않는다.\n④ 제10조에 의해 위탁기간 중 신규 위탁을 행할 경우에는 제5조 내지 제6조를 준용한다.\n[별표 1]"}, {"p": 242, "t": "위탁 심의자료의 구성(예시)\n구  성\n내  용\n1. 위탁신청 법인에 관한 일반적 사항\n1) 법인 유형 및 소재지 2) 법인 정관 3) 법인대표 및 이사 전원의 인적사항과 이력서 4) 관련 사회복지사업 수행 실적\n2. 위탁신청의 배경과 목적\n3. 시설운영 계획\n1) 조직구성 (1) 시설장 채용조건(경력 등) (2) 종사자의 확보계획 (3) 조직구성 및 업무분장 2) 사업계획 (1) 시설의 활성화를 위한 장･단기 계획 (2) 프로그램의 구성과 운영방안 3) 시설운영 (1) 시설운영의 전문성 강화 방안 (2) 시설운영의 투명성 제고 방안 (3) 재정운영계획 (4) 재정투자계획 (5) 재정확충방안\n4. 지역사회와의 협력관계구축방안\n1) 지역사회에서의 공신력 제고 방안 2) 유관기관들과의 협력관계 방안 3) 지역사회 자원동원 및 활용방안\n[별표 2]"}, {"p": 243, "t": "수탁자 선정 심의기준 및 배점(예시)\n심사기준 | 심사항목 | 배점\n |  | 100점\n1. 수탁자의 적격성 | ‒ 법인유형 및 설립목적 ‒ 법인의 보유자산(부동산, 동산 구분) ‒ 법인대표 및 이사회의 적합성 ‒ 해당 법인의 사회복지사업 운영실적 | 30점\n2. 시설운영의 전문성 및 책임성 | ‒ 법인의 사회복지사업 전문성 ‒ 시설장 및 종사자의 전문성 ‒ 사업계획의 전문성 및 타당성 ‒ 시설운영의 전문성 강화방안 ‒ 최근 법인 재무제표 ‒ 재정운영 및 투자계획의 타당성 ‒ 재정확충방안의 현실성과 타당성 ‒ 시설운영의 투명성 제고방안 ‒ 복지부 보급 희망이음 및 사회복지시설정보시스템 사용 | 50점\n3. 지역사회와의 협력적 관계조성 능력 | ‒ 지역사회 내 공신력 제고방안 ‒ 유관기관과의 협력관계 구축방안 ‒ 지역사회자원동원 방안 | 20점\n※ 수탁자의 적격성(30점) 중\n‒ 시설장 및 관리자를 제외한 종사자 90% 이상 고용승계를 조건으로 위탁받을 경우 가점 부여\n※ 시설운영의 전문성 및 책임성(50점) 중\n‒ 시설장의 전문성에 10점 이상 배점\n‒ 시설장을 공개모집 할 것을 조건으로 위탁 받을 경우 가점 부여\n‒ 시설장을 공개모집하지 않고 법인이사회에서 임명 또는 시설장이 타 직위를 겸직할 경우 감점\n‒ 사회복지시설정보시스템 및 희망이음 사용(대상자관리를 포함하여 통합 회계관리 등 전체기능 사용)\n※선정위원회의 심의를 거쳐 위탁기간을 갱신하는 경우(규칙 제21조의2), 재위탁 심의 과정에서 해당법인에 대한 지자체의 지도점검 결과(보조금 부당･불법사용 여부 반드시 포함)를 확인할 수 있는 규정을 마련하여야 함 (국민권익위 권고사항, ʼ10.4)\n※위탁기관에서 수탁기관 재정부담계획의 일환으로 법인전입금 규모를 심사항목에 포함하는 경우 에는, 법인 전입금의 재원 출처의 적정성을 심사하여야 함 (시설 후원금을 법인의 후원금으로 편입, 시설에서 바자회 등을 통한 사업수익금 등을 법인전입금으로 편성, 법인의 기본재산을 전입금으로 편입하는 등의 편법여부를 확인하고 이에 대한 감점기준 마련, 국민권익위 권고사항, ʼ10.4)\n3"}]}, {"title": "3. 사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)", "start": 244, "end": 256, "html": "<div class=\"pchip\" id=\"p244\"><span>원문 244쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=256\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)<\/div><div class=\"ln note\">※본 기준은 시설에 지원되는 보조금의 집행을 안내하는 규정이므로 본 기준을 근거로 「근로기준법」상 근로조건의 저하 등 타 법령을 위반할 수 없음<\/div><div class=\"ln p\">용어의 정의<\/div><div class=\"ln p\">보수：봉급과 기타 각종 수당을 합산한 금액 봉급：직무의 난이도 및 책임의 정도와 재직기간 등에 따라 직위별･호봉별로 지급되는 기본급여 수당：직무특성 및 생활여건 등에 따라 지급되는 부가급여 승급：일정한 재직기간의 경과에 의해 현재의 호봉보다 높은 호봉을 부여하는 것 보수의 일할계산：그 달의 보수를 그 달의 일수로 나누어 계산하는 것<\/div><div class=\"ln p\">1. 인건비 보조금 지급기준으로서 호봉의 획정 가이드라인<\/div><div class=\"ln h3\">가. 원칙적으로 근무년수 1년에 대해 1호봉을 인정함<\/div><div class=\"ln h3\">나. 호봉은 현 시설 근무경력에 본 지침에서 인정하는 경력을 합산하여 결정<\/div><div class=\"ln h3\">다. 시간제 근로자 등 통상적인 근무시간과 다르게 근로계약을 체결한 자에 대해서는 “4. 경력기간의 계산”을 참고하여 정상근무시간을 기준으로 실제 근무시간에 비례하도록 경력기간을 계산함<\/div><div class=\"ln p\">2. 경력인정 범위 가이드라인<\/div><div class=\"ln h3\">가. 별도 경력인정 관련<\/div><div class=\"ln note\">※아래표에서 서술한 경력에 대해 인정범위(인정율)를 별도로 규정할 수 있고, 추가적으로 지자체장이 정하는 경력에 대해 인정기준을 둘 수 있음<\/div><div class=\"ln p\">☞ 인구감소지역 소재 사회복지시설에 근무하는 경우 총 인정 경력을 가산하여 책정할 수 있음<\/div><div class=\"pchip\" id=\"p250\"><span>원문 250쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=262\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>구분<\/td><td>환산율<\/td><td>인정대상경력<\/td><\/tr><tr><td>1. 사회복지 시설･사회복지법인경력<\/td><td>100%<\/td><td>가. 사회복지시설*에 근무한 경력<br>➝법령 또는 지침이 신설 또는 개정되어 신규로 사회복지시설로 규정되는 경우, 법령에 규정된 다음연도의 1월 1일부터 근무경력을 인정함<br>예)아동공동생활가정의 경우 2004년 1월 29일에 「아동복지법」이 개정되어 사회복지시설로 규정되었으므로, 예산반영이 가능한 2005년 1월 1일부터 근무경력을 인정함<br>*사회복지시설：동 지침에서 사회복지시설의 종류로 열거한 시설을 의미<br>➝사회복지시설 설치 근거 법령 또는 개별 시설 지침에 따른 고유사업 수행 및 인적기준을 충족시키기 위해서 채용된 자에 한하며, 정규직 여부와 무관하게 동일한 경력으로 인정<br>* 위 요건 미충족시 80% 인정<br>※사회복지관 등 시설에서 위탁사업 수행인력의 경우는 고유사업 수행인력과 실질적 업무 수행의 차이가 없으므로 100% 인정(‘26.1.1.부터 적용)<br>나. 「사회복지사업법」 에 따라 설립된 사회복지법인에서 직원의 자격으로 채용되어 「사회복지사업법」 제2조의 규정에 의한 사회복지사업 관련 업무를 수행한 경력<br>➝사회복지법인의 본사무소, 사무국 등에서 사회복지시설 운영･지원, 법인･시설 회계, 인사 등 법인 운영의 사무를 직접적으로 수행하기 위해 채용된 직원<br>* 위 요건 미충족 인력 80% 인정<br>※ ㉯의 종전 근무경력을 인정하되, 80% 경력합산은 ʼ16.1.1.부터 적용, 100% 경력합산은 ‘24.1.1.부터 적용<br>다. 조건부신고시설*의 경우 2002년 이후 조건부시설로 신고한 시설에서 종사자로 근무한 경력(단, ʼ05. 7. 31까지의 근무 경력만 인정)<br>➝ 해당 시설장 및 시･군･구청장의 근무확인서 필요<br>*조건부신고시설：미신고시설 양성화 정책에 따라 ʼ02~ʼ05.7.31까지 법정신고시설 전환을 조건으로 행정처분 등을 유예한 시설로, 시･군･구에 조건부신고시설로 등록 후 유예기간 내에 요건충족을 통해 신고시설로 전환한 시설<br>라. 사회복지시설 종사자 대체인력으로 근무한 경력<br>*보건복지부 사회복지시설 종사자 대체인력사업 운영을 위해 사업 위탁기관에 채용되어 사회복지시설에서 근무한 경력<br>➝ ʼ18.1.1.부터 근무경력으로 인정하되, 경력합산은 ʼ19.1.1.부터 적용<\/td><\/tr><tr><td>2. 유사경력<\/td><td>80%<\/td><td>가.<br>①사회복지사업법 및 법 제2조제1호에 열거된 사회복지사업 관련 법률에 따른 사회복지 관련 국가 자격(면허)*증을 소지하고 법령 등에 정해진 해당 자격의 업무를 수행한 경력<br>*요양보호사, 정신건강전문요원, 사회복지사, 언어재활사, 장애인재활상담사 등<br>※ (참고 예시) 사회복지사 자격증 : 「사회복지사업법」 제11조를 근거로 하며, 같은 법 시행령 제6조 제1항 각 호*에 사회복지사 자격의 업무가 규정됨<br>* 1. 사회복지프로그램의 개발 및 운영업무  2. 시설거주자의 생활지도업무 3. 복지를 필요로 하는 사람에 대한 상담업무<br>※ (적용 예시) 사회복지사 자격을 가지고 해당 자격의 업무를 수행한 경우 장소와 관계없이(학교, 병원, 회사 등) 유사경력 인정 가능: 경력증명서 등 구체적인 근무 내용을 가지고 관할 지자체에 문의요망<br><table class=\"htbl\"><tr><td>Q&amp;A 유사경력 관련<\/td><\/tr><tr><td>Q1. 사회복지사 자격을 소지하고 학교복지사로 근무한 경우?<br>Q2.요양보호사 또는 사회복지사 자격(증)을 소지하고 노인장기요양보험법에 근거한 장기요양기관에서 근무한 경우?<br>Q3. 보육교사 자격증을 가지고 육아종합지원센터에 근무한 경우?<br>A: 해당 자격(증) 규정 업무를 수행한 경우 유사경력 인정 가능(경력증명서 등 구체적인 근무 내용을 가지고 관할 지자체에 문의요망)<\/td><\/tr><tr><td><\/td><\/tr><\/table><br>②물리(작업)치료사, 간호(조무)사, 영양사, 조리사, 안전관리 인력으로서 관련 국가 자격(면허)증을 소지하고 동종 직종*에 근무한 경력<br>*동종 직종：이전 근무지에서 종사했던 직종과 현 사회복지시설에서의 근무 직종이 동일성을 유지하는 경우가 이에 해당(예：보건소 간호사 근무 ➝ 노인의료복지시설 간호사 근무)<br>※(공통) 경력증명서에 해당 직종(사회복지사 등)으로 채용되어 근무하였음을 증명할 수 있어야 함<br>나.특수학교교사 자격증 취득 후 「장애인 등에 대한 특수교육법」 제2조제10호의 규정에 의한 특수교육기관(특수학교) 및 동법 제2조제11호에 의한 특수교육대상자의 통합교육을 실시하기 위하여 일반학교에 설치된 특수학급 또는 같은 법 제11조에 따른 특수교육지원센터에 근무한 경력<br>다.공무원 및 공무직으로서 「사회복지사업법」 제2조의 규정에 의한 사회복지사업 관련 부서에 근무한 경력(사회복지전담공무원 근무경력 등)<br>라.「아동복지법」 제48조에 의한 가정위탁지원센터에서 동법 시행령 제48조에 의한 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력)<br>마.간호(조무)사, 정신건강전문요원, 사회복지사, 응급구조사 자격(면허)증을 소지하고 보건복지부 보건복지상담센터(보건복지콜센터)에 근무한 경력<br>바.「아동복지법」 제45조에 의한 아동보호전문기관에서 동법시행령 제43조에 의한 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력)<br>사.「아동･청소년의 성보호에 관한 법률」 제47조에 의한 아동･청소년 성교육 전문기관에서 직원의 자격으로 채용되어 근무한 경력<br>아.「청소년복지 지원법」 제31조에 의한 청소년쉼터, 청소년자립지원관, 청소년치료재활센터, 청소년회복지원시설에서 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력)<br>자.「아동복지법」 제37조에 따라 지방자치단체가 취약계층 아동에 대해서 지원하는 통합서비스(드림스타트) 민간전문인력(직원)으로 채용되어 근무한 경력<br>차.&lt;삭제&gt;<br>카.「사회복지사업법」 제46조에 의한 한국사회복지사협회에서 직원의 자격으로 채용되어 근무한 경력<br>타.「식품기부활성화에 관한 법률」 제3조에 따른 기부식품제공사업장에서 사회복지사 자격증을 소지하고 근무한 경력<br>파.「자원봉사활동기본법」 제19조에 따른 자원봉사센터에서 사회복지사 자격증을 소지하고 근무한 경력<br>하.시･군･구에 설치된 통합사례관리 전담기구에 사회복지통합서비스전문요원(통합사례관리사)으로 채용되어 통합사례관리업무를 수행한 경력<br>거.「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」 제41조에 따른 지역사회보장협의체에서 사회복지사 자격증을 소지하고 직원(상근간사 등) 근무한 경력<br>※종전 「사회복지사업법」 제7조의2에 따른 지역복지협의체에서 사회복지사 자격증을 소지하고 상근간사로 근무한 경력도 동일하게 인정<br>너.「민법」 제32조에 따라 사회복지사업 관련 중앙부처의 장 또는 지방자치단체장의 허가를 받아 설립된 법인으로서 「사회복지사업법」 제2조의 사회복지사업을 수행하는 사단･재단법인에서 직원으로 상근한 경력<br>더.「사회복지사 등의 처우 및 지위향상을 위한 법률」 제4조에 따른 한국사회복지공제회에서 사회복지사 자격증을 소지하고 근무한 경력<br>러.「장애인활동 지원에 관한 법률」 제20조에 따른 활동지원기관에서 전담인력 및 활동지원사로 채용되어 근무한 경력, 「장애인고용촉진 및 직업재활법」 제19조의2에 따른 근로지원인 서비스를 제공하기 위해 근로지원인 수행기관에 근로지원인으로 채용되어 근무한 경력<br>※ 는 종전 근무경력을 인정하되, 경력합산은 전담인력은 ʼ15.1.1.부터 적용, 활동지원사는 ‘24.1.1.부터 적용, 근로지원인은 ‘25.1.1.부터 적용,<br><table class=\"htbl\"><tr><td>Q&amp;A 활동지원사의 경력 인정 관련<\/td><\/tr><tr><td>Q: 활동지원사 근무 시간이 일정하지 않으므로 근무 기관은 확인되나 근무한 시간 증명이 어려운 경우 경력 산정은?<br>A: 급여명세서 등 통해 추정된 근무시간에 비례하여 관할 지자체와 협의하여 경력 인정할 수 있음<\/td><\/tr><tr><td><\/td><\/tr><\/table><br>머.「청소년복지 지원법」 제29조에 따른 청소년상담복지센터에서 직원의 자격으로 채용되어 근무한 경력<br>버. &lt;삭제&gt;<br>서.「국민기초생활 보장법」 제15조의10에 따라 설치된 광역자활센터에 직원의 자격으로 채용되어 근무한 경력<br>어.「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제17조에 따른 정신건강전문요원(정신건강전문요원) 자격증을 소지하고, 같은 법 제15조에 의한 정신건강복지센터(정신보건센터, 정신건강증진센터)에서 근무한 경력<br>저.「노인복지법」 제23조에 따른 ‘노인일자리 및 사회활동 지원사업을 수행하는 기관에서 직원 또는 노인일자리 담당자(구 전담인력)로 채용되어 근무한 경력(노인일자리지원기관이 사회복지시설로 인정(’13.12.5.)되기전의) 근무경력))<br>처.「장애인복지법」 제59조의11에 따라 설치된 장애인권익옹호기관에서 직원의 자격으로 채용되어 근무한 경력<br>커.「장애인복지법」 제59조의13에 따라 설치된 피해장애인쉼터에서 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력)<br>터.「입양특례법」 제20조에 따라 허가된 입양기관에서 직원의 자격으로 채용되어 근무한 경력<br>퍼.「북한이탈주민법」 제15조의2에 따라 지정된 지역적응센터에서 직원의 자격으로 북한이탈주민 정착지원 업무를 담당하며 근무한 경력<br>허.「노인복지법」 제27조의2에 따른 사업을 수행하는 “독거노인･중증장애인응급 안전알림서비스 사업안내” 지침 상 사업수행기관(지역센터)에서 거점응급안전 관리요원 또는 응급관리요원으로 채용되었던 자로, 수행기관이 발행한 경력증명서상 직무가 ‘거점응급관리요원 또는 응급관리요원’으로 명시된 근무경력<br>고.「노인복지법」 제27조의2에 따라 아래와 같이 취약 독거노인에 대해 지원하는 돌봄 사업에 채용되어 근무한 경력<br><table class=\"htbl\"><tr><td>연도<\/td><td>사업명<\/td><td>직종<\/td><\/tr><tr><td>2007<\/td><td>독거노인 생활지도사 파견사업<\/td><td>서비스관리자, 독거노인생활지도사<\/td><\/tr><tr><td>2008<\/td><td>독거노인 생활관리사 파견사업<\/td><td>서비스관리자, 독거노인생활관리사<\/td><\/tr><tr><td>2009~2011<\/td><td>노인돌봄기본서비스사업<\/td><td>노인돌봄서비스관리자, 노인돌보미<\/td><\/tr><tr><td>2012<\/td><td>독거노인돌봄기본서비스사업<\/td><td>독거노인돌봄서비스관리자, 독거노인돌보미<\/td><\/tr><tr><td>2013<\/td><td>노인돌봄기본서비스사업<\/td><td>노인돌봄서비스관리자, 노인돌보미<\/td><\/tr><tr><td>2014~2019<\/td><td>노인돌봄기본서비스사업<\/td><td>서비스관리자, 독거노인생활관리사<\/td><\/tr><tr><td>2020~<\/td><td>노인맞춤돌봄서비스사업<\/td><td>전담사회복지사, 생활지원사<\/td><\/tr><\/table><br>노.「건강가정기본법」 제35조에 따라 설치된 건강가정지원센터에서 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력)<br>도.「발달장애인 권리보장 및 지원에 관한 법률」 제33조에 따라 설치된 중앙발달장애인지원센터 및 지역발달장애인지원센터에서 직원으로 채용되어 근무한 경력<br>로.｢발달장애인 권리보장 및 지원에 관한 법률｣ 제29조, 제29조의2 및 제29조의3에 근거한 발달장애인 주간활동서비스, 청소년 발달장애학생 방과후활동서비스 긴급돌봄서비스, 최중증발달장애인 통합돌봄서비스 관리책임자, 전담 관리인력, 제공인력으로  근무한 경력<br>모.「아이돌봄지원법」 제11조제1항에 따라 지정된 서비스제공기관에서 전담인력 또는 지원인력으로 채용되어 근무한 경력<br>보.「국가보훈기본법」 제19조제2항 및 「국가유공자 등 예우 및 지원에 관한 법률」 제63조의3 등에 따른 보훈재가복지서비스를 수행하기 위해 국가보훈처 및 그 소속기관에서 보훈섬김이 및 보훈복지사로 채용되어 근무한 경력<br>소.「고등교육법」 제2조에 따른 학교에서 교수 또는 강사의 자격으로 채용되어 사회복지학 전공교과목과 사회복지관련 교과목을 전담하여 강의한 경력<br>오.「국민체육진흥법」 제2조제6호에 따른 체육지도자로서 대한장애인체육회 및 대한장애인체육회 산하 지역장애인체육회(시･도 및 시･군･구장애인체육회)에서 장애인생활체육지도자로 채용되어 동종 직종에 근무한 경력<br>조.「성폭력방지법」 제18조에 따라 설치된 성폭력피해자통합지원센터(해바라기센터)에서 직원의 자격으로 채용되어 근무한 경력<br>초.「아동복지법」 제13조 및 동법 시행규칙 제4조 에 따라 「아동복지법」 제15조에 따른 아동보호서비스 업무를 수행하기 위하여 아동보호전담요원으로서 채용되어 근무한 경력<br>코.「장애인복지법」 제54조에 따라 설치된 장애인자립생활지원센터에서 직원의 자격으로 채용되어 근무한 경력<br>토.「한국보건복지인력개발원법」 제6조에 따른 업무를 수행하기 위하여 한국보건복지인력개발원에 직원의 자격으로 채용되어 근무한 경력<br>포.「장애인복지법」 제29조의2에 따른 업무를 수행하기 위하여 한국장애인개발원에 직원의 자격으로 채용되어 근무한 경력<br>호. 「장애인고용촉진 및 직업재활법」 제43조에 따른 업무를 수행하기 위하여 한국장애인고용공단에 직원의 자격으로 채용되어 근무한 경력<br>구.「협동조합 기본법」 제2조에 따라 보건복지부장관의 인가를 받아 설립된 사회적협동조합으로서 「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치･운영하거나 위탁운영하는 사회적협동조합 직원으로 상근한 경력<br>※ 사회적협동조합의 정관 또는 사업계획서, 시설 신고증 등을 통해 「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치･운영하거나 위탁운영하는지 확인 필요<br>누. 「사회서비스 지원 및 사회서비스원 설립･운영에 관한 법률」 제10조에 따른 업무를 수행하기 위하여 시･도 사회서비스원에 직원의 자격으로 채용되어 근무한 경력<br>두. 「위기 임신 및 보호출산 지원과 아동 보호에 관한 특별법」 제2조에 따른 상담기관에 직원의 자격으로 채용되어 근무한 경력<br>루. 「치매관리법」 제16조의2에 따른 광역치매센터 또는 치매관리법 제17조에 따른 치매안심센터에서 직원으로 채용되어 근무한 경력<br>무. 「사회복지사 등의 처우 및 지위 향상을 위한 법률」제3조의3에 따른 사회복지종사자 권익지원센터에서 직원의 자격으로 채용되어 근무한 경력<br>부. 「노인장기요양보험법」에 따른 장기요양기관 및 장기요양재택의료센터에서 해당 기관의 고유사업 수행인력으로 근무한 경력<\/td><\/tr><\/table><div class=\"pchip\" id=\"p251\"><span>원문 251쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=263\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">유사경력 산정 가능 시점(개정일)<\/div><div class=\"ln p\">유사경력 산정 관련, 하단의 표기 일자는 유사경력기준 개정(생성)일로 호봉획정(산정) 가능 시점*이며, 종사자의 모든 기간 근무경력에 대해 인정 가능 * 유사 경력을 포함하여 새롭게 산정되는 호봉은 ʼ△△년 1월 1일 이후에 최초로 지급되는 급여부터 반영(ʼ△△년 1일 1일 이전 급여에 대한 소급적용은 되지 않음) - ㉮의 ⓶(안전관리자) ’26.1.1. ㉱: ’07.1.1., ㉳: ʼ09.1.1, ㉴~: ʼ15.1.1. 너: (보건복지부 장관의 허가를 받은 경우) ‘15.1.1.(중앙부처의 장) ’23.1.1.,(지자체장)‘24.1.1.(전담인력)’15.1.1.(활동지원사)‘24.1.1.(근로지원인)’25.1.1.  , : ʼ16.1.1, : ʼ17.1.1., ‘18.1.1.,처~: ʼ19.1.1., ~: ʼ20.1.1.,로 (긴급돌봄서비스, 최중증발달장애인 통합돌봄서비스) ’26.1.1.: ʼ21.1.1., ~: ʼ22.1.1., ~: ʼ23.1.1. : ʼ24.1.1. ~: ʼ25.1.1.<\/div><div class=\"ln p\">Q &amp; A<\/div><div class=\"ln p\">Q: 유사경력 기준 항목 중 사회복지시설로 전환된 경우 경력 인정범위는? A: 현재 사회복지시설인 경우 시설 인정시점을 기준으로 전(80%)･후(100%)로 구분하여 경력인정 가능합니다.<\/div><div class=\"ln p\">Q &amp; A<\/div><div class=\"ln p\">Q: 복지관 등에서 위탁사업인력으로 근무한 경력을 시설 경력 가. 적용시 100% 인정되고,  유사졍력 기준 저.에 따르면 80%일 경우 어느 기준에 따르면 되나요? A: 유리한 경력인정 기준을 적용할 수 있을 것으로 사료됩니다.<\/div><div class=\"ln p\">나.군 복무 관련 경력인정 범위<\/div><div class=\"ln h4\">1) 산정원칙 및 대상경력<\/div><div class=\"ln p\">군 복무경력은 다음 각 목[가)~마)]의 어느 하나에 해당하는 사람이 병적증명서*상 실제 복무한 경력을 인정하되, 그 경력이 3년이 넘을 경우에는 3년**까지만 인정<\/div><div class=\"ln p\">*「병역법 시행규칙」 별지 제5호 서식에 따른 병적증명서를 원칙으로 하되, 주민등록표 초본 또는 각군본부 등에서 발급한 군경력증명서도 가능<\/div><div class=\"ln p\">**종전의 지침에 따라 해군(상륙병과는 제외) 또는 공군에서 의무복무를 한 경우로서 3년 1개월에서 3년 6개월까지의 기간 내에서 이미 인정받아 호봉이 계산된 사람은 그 경력을 그대로 인정<\/div><div class=\"pchip\" id=\"p252\"><span>원문 252쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=264\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가) 「제대군인지원에 관한 법률」 제2조제1호 및 제16조제3항에 따른 제대군인<\/div><div class=\"ln p\">제대군인<\/div><div class=\"ln p\">1. 「병역법」, 「군인사법」 또는 「대체역의 편입 및 복무 등에 관한 법률」에 따라 군 또는 공익 분야에서의 복무를 마치고 전역[퇴역･면역(免役) 또는 소집해제를 포함한다. 이하 같다]한 사람 2. 「병역법」 제72조제2항에 따라 병역의무기간을 마치고 퇴역(退役)한 장교･준사관 및 부사관 3. 「병역법」 제72조제2항에 따라 병역의무기간을 마치고 면역(免役)된 병 4. 「군인사법」 제41조에 따라 퇴역(退役)한 장교･준사관 및 부사관 5. 「병역법」 제23조, 제23조의2, 제33조의8, 제39조에 따라 소집해제된 상근예비역, 승선근무예비역, 예술·체육요원, 전문연구요원 및 산업기능요원 6.「병역법」 제26조제1항제1호 및 제2호에 따라 국가기관･지방자치단체･공공단체 및 사회복지시설의 공익목적에 필요한 사회복지, 보건･의료, 교육･문화, 환경･안전 등 사회서비스 업무의 지원업무 및 국가기관･지방자차단체･공공단체의 공익목적에 필요한 행정업무 등의 지원업무에 복무하고 소집해제된 사회복무요원<\/div><div class=\"ln p\">나) 「병역법」 제25조에 따라 전환복무를 한 사람<\/div><div class=\"ln p\">전환복무자<\/div><div class=\"ln p\">1. 「의무소방대설치법」 제3조제2항에 따른 의무소방원 2. 「의무경찰대 설치 및 운영에 관한 법률」 제3조에 따른 의무경찰 3. 종전 「전투경찰대설치법」 제3조제2항 및 제3항에 따른 전투경찰 4. 종전 「교정시설경비교도대설치법」 제3조에 따른 경비교도<\/div><div class=\"ln p\">다)종전 「병역법」(2013.6.4., 법률 제11849호로 개정되기 전의 것)에 따라 ①국가기관･지방자치단체･공공단체 및 사회복지시설의 공익목적에 필요한 사회복지, 보건･의료, 교육･문화, 환경･안전 등 사회서비스업무의 지원업무, ②국가기관･지방자치단체･공공단체의 공익목적에 필요한 행정업무 등의 지원업무에 복무하고 소집해제된 공익근무요원<\/div><div class=\"pchip\" id=\"p253\"><span>원문 253쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=265\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라)종전 「병역법」(1993.12.31., 법률 제4685호로 전부개정되기 전의 것)에 따라 소집되어 복무하다 소집해제된 방위병<\/div><div class=\"ln p\">학도의용군 경력 적용방법<\/div><div class=\"ln p\">학도의용군의 군복무 경력기간은 병적증명서상 기간과 무관하게 8개월 인정 :학도의용군은 병적증명서상에 실역복무기간의 입대일과 전역일이 동일하므로 해당 병적증명서와 무관하게 8개월을 인정함(「공무원보수 등의 업무지침」 준용)<\/div><div class=\"ln h4\">2) 산정예외<\/div><div class=\"ln p\">무관후보생 경력은 군 복무경력으로 인정하지 아니함(「공무원보수 등의 업무지침」 준용)<\/div><div class=\"ln p\">3. 경력기간의 계산<\/div><div class=\"ln h3\">가. 인정대상 경력기간의 계산<\/div><div class=\"ln p\">인정하는 경력이 중복된 경우에는 그 중 유리한 경력 하나만 인정<\/div><div class=\"ln p\">기간계산에 있어 임용일은 산입하고 퇴직일은 제외함<\/div><div class=\"ln note\">※단, 근무종료일이 법령 또는 계약에 의해 미리 정하여진 군복무기간의 퇴직(전역)일 또는 계약직의 계약기간 만료일은 근무경력에 산입함<\/div><div class=\"ln p\">시간제 근로자 등 통상적인 근무시간과 다르게 근로계약을 체결한 자에 대해서는 정상근무시간을 기준으로 실제 근무시간에 비례하도록 계산함<\/div><div class=\"ln p\">경력기간은 년･월･일까지 계산하되, 민법상 역(曆)에 의한 방법에 의해 계산함 (「민법」 제160조 참조) (12월을 1년으로, 30일을 1월로 계산함)<\/div><div class=\"ln p\">▹「민법」 제160조(曆에 의한 계산)<\/div><div class=\"ln p\">① 기간을 週, 月 또는 年으로 정한 때에는 曆에 의하여 계산한다.<\/div><div class=\"ln p\">②週, 月 또는 年의 처음으로부터 기간을 기산하지 아니한 때에는 최후의 週, 月 또는 年에서 그 기산일에 해당한 날의 전일로 기간이 만료한다.<\/div><div class=\"ln p\">③月 또는 年으로 정한 경우에 최종의 月에 해당일이 없는 때에는 그 月의 말일로 기간이 만료한다.<\/div><div class=\"ln p\">ʼ03년 1월 5일에 사회복지시설에 임용된 종사자가 ʼ04년 3월 9일에 퇴직하였을 경우<\/div><div class=\"pchip\" id=\"p254\"><span>원문 254쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=266\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">△ 임용일 산입(2003년 1월 5일), 퇴직일 제외(2004년 3월 9일)<\/div><div class=\"ln p\">△기산일 전일에 해당하는 날로 만료 시 1월로 계산하되(예：1.5∼2.4) 기산일 전일에 해당하는 일자가 없는 경우에는 그달의 말일까지를 1월로 계산(예：1.31∼2.28)<\/div><div class=\"ln p\">△2월의 경우, 실제일수가 28일이나 월력에 의해 1월로 계산<\/div><div class=\"ln p\">△상기 계산방법에 의해 경력을 계산하면 근무경력은 1년 2월 4일임<\/div><div class=\"ln p\">➝ ʼ03.1.5∼ʼ04.1.4：1년<\/div><div class=\"ln p\">➝ ʼ04.1.5∼ʼ04.3.4：2월<\/div><div class=\"ln p\">➝ ʼ04.3.5∼ʼ04.3.8：4일<\/div><div class=\"ln p\">예시<\/div><div class=\"ln h3\">나. 경력환산율을 적용한 경력기간 계산방법<\/div><div class=\"ln p\">환산율 적용후의 경력기간은 연･월･일 단위까지 산출<\/div><div class=\"ln p\">환산율이 10할(100%)인 경우에는 경력기간을 그대로 인정하고, 환산율이 10할미만인 경우에는 연･월･일 단위로 각각 환산율을 적용하되, 소수점 이하는 절사<\/div><div class=\"ln p\">예) ʼ93년 11월 15일에서 ʼ95년 12월 31일까지 의료기관에 근무한 간호사의 근무경력<\/div><div class=\"ln p\">△ 의료법에 의한 의료기관에 근무한 간호사 근무경력：80% 인정<\/div><div class=\"ln p\">△ 경력인정：1년 8월 13일<\/div><div class=\"ln p\">➝ ʼ93.11.15∼ʼ95.11.14：2년×0.8=1.6년=1년 7.2월=1년 7월 6일(30일×0.2)<\/div><div class=\"ln p\">➝ ʼ95.11.15∼ʼ95.12.14：1월×0.8=0.8월=24일(30일×0.8)<\/div><div class=\"ln p\">➝ ʼ95.12.15∼ʼ95.12.31：17일×0.8=13.6일=13일(소수점 이하 절사)<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">4. 경력의 증명 및 전력조회<\/div><div class=\"ln h3\">가. 경력의 증명<\/div><div class=\"ln p\">경력의 증명은 권한 있는 자(시설장, 시･군･구청장 등)가 발행한 경력증명서에 의함<\/div><div class=\"ln p\">‒희망이음을 통해 조회되는 경력은 시･군･구 보고를 거친 경력이므로, 경력증명서 발급 및 전력조회를 다시 거칠 필요없음<\/div><div class=\"ln p\">종사자 본인이 경력증명을 거부한 경우, 보조금 지급을 거부할 수 있음<\/div><div class=\"ln note\">※경력을 증명할 수 있는 서류가 없거나 종사자 본인의 경력확인서약서, 불충분한 경우에는 재직기간을 객관적으로 증명할 수 있는 내부증빙자료(임용장, 승진발령기록 등) 또는 외부증빙자료(국민건강보험공단 자료, 금융기관 보수입금내역, 세무서 근로소득납세증명 등)을 통해 경력인정<\/div><div class=\"ln h3\">나. 전력조회<\/div><div class=\"pchip\" id=\"p255\"><span>원문 255쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=267\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">전력조회는 종사자를 채용한 기관에서 경력증명서 등을 발급한 기관을 대상으로 하는 것이 원칙이나, 종사자가 원하지 않는 경우에는 보조금을 지급하는 소관 지자체에서 대신하여 전력조회 실시할 수 있음<\/div><div class=\"ln p\">전력조회 시 정상적 근로계약 여부, 담당업무, 경력기간 등 경력인정과 관련된 사항을 확인<\/div><div class=\"ln p\">‒공무원 경력과 군경력은 경력증명서 내용이 불확실하거나 복무기간 등에 의문이 있을 경우 해당관청에 조회실시<\/div><div class=\"ln p\">‒사회복지시설 근무경력과 기타유사경력(8할 인정경력)은 보조금 지급과 관련된 것이므로 반드시 실시하되, 임용일로부터 3월 이내에 완료토록 함<\/div><div class=\"ln note\">※ 근무 기관 및 직무의 확인이 가능한 경우 전력 조회가 필수 사항은 아님<\/div><div class=\"ln p\">5. 경과조치<\/div><div class=\"ln p\">‒2004년 1월 1일 이전에 종전의 지침에 의해 근무경력을 인정받고 있던 자에 대해서는 종전의 인정받던 근무경력을 계속 적용함<\/div><div class=\"ln note\">※단, 2004년 1월 1일 이후 신규채용자에 대해서는 본 지침상 기준을 적용<\/div><div class=\"ln p\">6. 기타 참고사항<\/div><div class=\"ln p\">가.시설종사자가 지역 간 또는 시설 간 이직하는 경우에도 호봉산정 등에서 불이익을 받지 않도록 공통적으로 적용되는 경력은 인정될 수 있도록 관심요망<\/div><div class=\"ln p\">나.본 지침 상 근무경력은 종사자 호봉산정을 위한 것으로 다른 법령에 규정되어 있는 “근무(종사)한 경력”에 해당하지 않음<\/div><div class=\"ln note\">※ 개별법령 상 “근무(종사)한 경력”은 해당 시설 담당부서에 문의할 것<\/div><div class=\"ln p\">아동복지법령상 종사자 자격기준으로 “아동복지와 관련된 사회복지사업에 3년 이상 종사한 경력”의 해석은 본 지침이 아닌 보건복지부 아동복지과 지침 또는 유권해석에 의함<\/div><div class=\"ln p\">예시<\/div>", "pages": [{"p": 244, "t": "사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)\n※본 기준은 시설에 지원되는 보조금의 집행을 안내하는 규정이므로 본 기준을 근거로 「근로기준법」상 근로조건의 저하 등 타 법령을 위반할 수 없음\n용어의 정의\n보수：봉급과 기타 각종 수당을 합산한 금액 봉급：직무의 난이도 및 책임의 정도와 재직기간 등에 따라 직위별･호봉별로 지급되는 기본급여 수당：직무특성 및 생활여건 등에 따라 지급되는 부가급여 승급：일정한 재직기간의 경과에 의해 현재의 호봉보다 높은 호봉을 부여하는 것 보수의 일할계산：그 달의 보수를 그 달의 일수로 나누어 계산하는 것\n1. 인건비 보조금 지급기준으로서 호봉의 획정 가이드라인\n가. 원칙적으로 근무년수 1년에 대해 1호봉을 인정함\n나. 호봉은 현 시설 근무경력에 본 지침에서 인정하는 경력을 합산하여 결정\n다. 시간제 근로자 등 통상적인 근무시간과 다르게 근로계약을 체결한 자에 대해서는 “4. 경력기간의 계산”을 참고하여 정상근무시간을 기준으로 실제 근무시간에 비례하도록 경력기간을 계산함\n2. 경력인정 범위 가이드라인\n가. 별도 경력인정 관련\n※아래표에서 서술한 경력에 대해 인정범위(인정율)를 별도로 규정할 수 있고, 추가적으로 지자체장이 정하는 경력에 대해 인정기준을 둘 수 있음\n☞ 인구감소지역 소재 사회복지시설에 근무하는 경우 총 인정 경력을 가산하여 책정할 수 있음"}, {"p": 250, "t": "구분 | 환산율 | 인정대상경력\n1. 사회복지 시설･사회복지법인경력 | 100% | 가. 사회복지시설*에 근무한 경력 ➝법령 또는 지침이 신설 또는 개정되어 신규로 사회복지시설로 규정되는 경우, 법령에 규정된 다음연도의 1월 1일부터 근무경력을 인정함 예)아동공동생활가정의 경우 2004년 1월 29일에 「아동복지법」이 개정되어 사회복지시설로 규정되었으므로, 예산반영이 가능한 2005년 1월 1일부터 근무경력을 인정함 *사회복지시설：동 지침에서 사회복지시설의 종류로 열거한 시설을 의미 ➝사회복지시설 설치 근거 법령 또는 개별 시설 지침에 따른 고유사업 수행 및 인적기준을 충족시키기 위해서 채용된 자에 한하며, 정규직 여부와 무관하게 동일한 경력으로 인정 * 위 요건 미충족시 80% 인정 ※사회복지관 등 시설에서 위탁사업 수행인력의 경우는 고유사업 수행인력과 실질적 업무 수행의 차이가 없으므로 100% 인정(‘26.1.1.부터 적용) 나. 「사회복지사업법」 에 따라 설립된 사회복지법인에서 직원의 자격으로 채용되어 「사회복지사업법」 제2조의 규정에 의한 사회복지사업 관련 업무를 수행한 경력 ➝사회복지법인의 본사무소, 사무국 등에서 사회복지시설 운영･지원, 법인･시설 회계, 인사 등 법인 운영의 사무를 직접적으로 수행하기 위해 채용된 직원 * 위 요건 미충족 인력 80% 인정 ※ ㉯의 종전 근무경력을 인정하되, 80% 경력합산은 ʼ16.1.1.부터 적용, 100% 경력합산은 ‘24.1.1.부터 적용 다. 조건부신고시설*의 경우 2002년 이후 조건부시설로 신고한 시설에서 종사자로 근무한 경력(단, ʼ05. 7. 31까지의 근무 경력만 인정) ➝ 해당 시설장 및 시･군･구청장의 근무확인서 필요 *조건부신고시설：미신고시설 양성화 정책에 따라 ʼ02~ʼ05.7.31까지 법정신고시설 전환을 조건으로 행정처분 등을 유예한 시설로, 시･군･구에 조건부신고시설로 등록 후 유예기간 내에 요건충족을 통해 신고시설로 전환한 시설 라. 사회복지시설 종사자 대체인력으로 근무한 경력 *보건복지부 사회복지시설 종사자 대체인력사업 운영을 위해 사업 위탁기관에 채용되어 사회복지시설에서 근무한 경력 ➝ ʼ18.1.1.부터 근무경력으로 인정하되, 경력합산은 ʼ19.1.1.부터 적용\n2. 유사경력 | 80% | 가. ①사회복지사업법 및 법 제2조제1호에 열거된 사회복지사업 관련 법률에 따른 사회복지 관련 국가 자격(면허)*증을 소지하고 법령 등에 정해진 해당 자격의 업무를 수행한 경력 *요양보호사, 정신건강전문요원, 사회복지사, 언어재활사, 장애인재활상담사 등 ※ (참고 예시) 사회복지사 자격증 : 「사회복지사업법」 제11조를 근거로 하며, 같은 법 시행령 제6조 제1항 각 호*에 사회복지사 자격의 업무가 규정됨 * 1. 사회복지프로그램의 개발 및 운영업무  2. 시설거주자의 생활지도업무 3. 복지를 필요로 하는 사람에 대한 상담업무 ※ (적용 예시) 사회복지사 자격을 가지고 해당 자격의 업무를 수행한 경우 장소와 관계없이(학교, 병원, 회사 등) 유사경력 인정 가능: 경력증명서 등 구체적인 근무 내용을 가지고 관할 지자체에 문의요망 Q&A 유사경력 관련\nQ1. 사회복지사 자격을 소지하고 학교복지사로 근무한 경우? Q2.요양보호사 또는 사회복지사 자격(증)을 소지하고 노인장기요양보험법에 근거한 장기요양기관에서 근무한 경우? Q3. 보육교사 자격증을 가지고 육아종합지원센터에 근무한 경우? A: 해당 자격(증) 규정 업무를 수행한 경우 유사경력 인정 가능(경력증명서 등 구체적인 근무 내용을 가지고 관할 지자체에 문의요망)\n ②물리(작업)치료사, 간호(조무)사, 영양사, 조리사, 안전관리 인력으로서 관련 국가 자격(면허)증을 소지하고 동종 직종*에 근무한 경력 *동종 직종：이전 근무지에서 종사했던 직종과 현 사회복지시설에서의 근무 직종이 동일성을 유지하는 경우가 이에 해당(예：보건소 간호사 근무 ➝ 노인의료복지시설 간호사 근무) ※(공통) 경력증명서에 해당 직종(사회복지사 등)으로 채용되어 근무하였음을 증명할 수 있어야 함 나.특수학교교사 자격증 취득 후 「장애인 등에 대한 특수교육법」 제2조제10호의 규정에 의한 특수교육기관(특수학교) 및 동법 제2조제11호에 의한 특수교육대상자의 통합교육을 실시하기 위하여 일반학교에 설치된 특수학급 또는 같은 법 제11조에 따른 특수교육지원센터에 근무한 경력 다.공무원 및 공무직으로서 「사회복지사업법」 제2조의 규정에 의한 사회복지사업 관련 부서에 근무한 경력(사회복지전담공무원 근무경력 등) 라.「아동복지법」 제48조에 의한 가정위탁지원센터에서 동법 시행령 제48조에 의한 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력) 마.간호(조무)사, 정신건강전문요원, 사회복지사, 응급구조사 자격(면허)증을 소지하고 보건복지부 보건복지상담센터(보건복지콜센터)에 근무한 경력 바.「아동복지법」 제45조에 의한 아동보호전문기관에서 동법시행령 제43조에 의한 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력) 사.「아동･청소년의 성보호에 관한 법률」 제47조에 의한 아동･청소년 성교육 전문기관에서 직원의 자격으로 채용되어 근무한 경력 아.「청소년복지 지원법」 제31조에 의한 청소년쉼터, 청소년자립지원관, 청소년치료재활센터, 청소년회복지원시설에서 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력) 자.「아동복지법」 제37조에 따라 지방자치단체가 취약계층 아동에 대해서 지원하는 통합서비스(드림스타트) 민간전문인력(직원)으로 채용되어 근무한 경력 차.<삭제> 카.「사회복지사업법」 제46조에 의한 한국사회복지사협회에서 직원의 자격으로 채용되어 근무한 경력 타.「식품기부활성화에 관한 법률」 제3조에 따른 기부식품제공사업장에서 사회복지사 자격증을 소지하고 근무한 경력 파.「자원봉사활동기본법」 제19조에 따른 자원봉사센터에서 사회복지사 자격증을 소지하고 근무한 경력 하.시･군･구에 설치된 통합사례관리 전담기구에 사회복지통합서비스전문요원(통합사례관리사)으로 채용되어 통합사례관리업무를 수행한 경력 거.「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」 제41조에 따른 지역사회보장협의체에서 사회복지사 자격증을 소지하고 직원(상근간사 등) 근무한 경력 ※종전 「사회복지사업법」 제7조의2에 따른 지역복지협의체에서 사회복지사 자격증을 소지하고 상근간사로 근무한 경력도 동일하게 인정 너.「민법」 제32조에 따라 사회복지사업 관련 중앙부처의 장 또는 지방자치단체장의 허가를 받아 설립된 법인으로서 「사회복지사업법」 제2조의 사회복지사업을 수행하는 사단･재단법인에서 직원으로 상근한 경력 더.「사회복지사 등의 처우 및 지위향상을 위한 법률」 제4조에 따른 한국사회복지공제회에서 사회복지사 자격증을 소지하고 근무한 경력 러.「장애인활동 지원에 관한 법률」 제20조에 따른 활동지원기관에서 전담인력 및 활동지원사로 채용되어 근무한 경력, 「장애인고용촉진 및 직업재활법」 제19조의2에 따른 근로지원인 서비스를 제공하기 위해 근로지원인 수행기관에 근로지원인으로 채용되어 근무한 경력 ※ 는 종전 근무경력을 인정하되, 경력합산은 전담인력은 ʼ15.1.1.부터 적용, 활동지원사는 ‘24.1.1.부터 적용, 근로지원인은 ‘25.1.1.부터 적용, Q&A 활동지원사의 경력 인정 관련\nQ: 활동지원사 근무 시간이 일정하지 않으므로 근무 기관은 확인되나 근무한 시간 증명이 어려운 경우 경력 산정은? A: 급여명세서 등 통해 추정된 근무시간에 비례하여 관할 지자체와 협의하여 경력 인정할 수 있음\n 머.「청소년복지 지원법」 제29조에 따른 청소년상담복지센터에서 직원의 자격으로 채용되어 근무한 경력 버. <삭제> 서.「국민기초생활 보장법」 제15조의10에 따라 설치된 광역자활센터에 직원의 자격으로 채용되어 근무한 경력 어.「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제17조에 따른 정신건강전문요원(정신건강전문요원) 자격증을 소지하고, 같은 법 제15조에 의한 정신건강복지센터(정신보건센터, 정신건강증진센터)에서 근무한 경력 저.「노인복지법」 제23조에 따른 ‘노인일자리 및 사회활동 지원사업을 수행하는 기관에서 직원 또는 노인일자리 담당자(구 전담인력)로 채용되어 근무한 경력(노인일자리지원기관이 사회복지시설로 인정(’13.12.5.)되기전의) 근무경력)) 처.「장애인복지법」 제59조의11에 따라 설치된 장애인권익옹호기관에서 직원의 자격으로 채용되어 근무한 경력 커.「장애인복지법」 제59조의13에 따라 설치된 피해장애인쉼터에서 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력) 터.「입양특례법」 제20조에 따라 허가된 입양기관에서 직원의 자격으로 채용되어 근무한 경력 퍼.「북한이탈주민법」 제15조의2에 따라 지정된 지역적응센터에서 직원의 자격으로 북한이탈주민 정착지원 업무를 담당하며 근무한 경력 허.「노인복지법」 제27조의2에 따른 사업을 수행하는 “독거노인･중증장애인응급 안전알림서비스 사업안내” 지침 상 사업수행기관(지역센터)에서 거점응급안전 관리요원 또는 응급관리요원으로 채용되었던 자로, 수행기관이 발행한 경력증명서상 직무가 ‘거점응급관리요원 또는 응급관리요원’으로 명시된 근무경력 고.「노인복지법」 제27조의2에 따라 아래와 같이 취약 독거노인에 대해 지원하는 돌봄 사업에 채용되어 근무한 경력 연도 | 사업명 | 직종\n2007 | 독거노인 생활지도사 파견사업 | 서비스관리자, 독거노인생활지도사\n2008 | 독거노인 생활관리사 파견사업 | 서비스관리자, 독거노인생활관리사\n2009~2011 | 노인돌봄기본서비스사업 | 노인돌봄서비스관리자, 노인돌보미\n2012 | 독거노인돌봄기본서비스사업 | 독거노인돌봄서비스관리자, 독거노인돌보미\n2013 | 노인돌봄기본서비스사업 | 노인돌봄서비스관리자, 노인돌보미\n2014~2019 | 노인돌봄기본서비스사업 | 서비스관리자, 독거노인생활관리사\n2020~ | 노인맞춤돌봄서비스사업 | 전담사회복지사, 생활지원사 노.「건강가정기본법」 제35조에 따라 설치된 건강가정지원센터에서 직원의 자격으로 채용되어 근무한 경력(사회복지시설로 인정되기 전의 근무경력) 도.「발달장애인 권리보장 및 지원에 관한 법률」 제33조에 따라 설치된 중앙발달장애인지원센터 및 지역발달장애인지원센터에서 직원으로 채용되어 근무한 경력 로.｢발달장애인 권리보장 및 지원에 관한 법률｣ 제29조, 제29조의2 및 제29조의3에 근거한 발달장애인 주간활동서비스, 청소년 발달장애학생 방과후활동서비스 긴급돌봄서비스, 최중증발달장애인 통합돌봄서비스 관리책임자, 전담 관리인력, 제공인력으로  근무한 경력 모.「아이돌봄지원법」 제11조제1항에 따라 지정된 서비스제공기관에서 전담인력 또는 지원인력으로 채용되어 근무한 경력 보.「국가보훈기본법」 제19조제2항 및 「국가유공자 등 예우 및 지원에 관한 법률」 제63조의3 등에 따른 보훈재가복지서비스를 수행하기 위해 국가보훈처 및 그 소속기관에서 보훈섬김이 및 보훈복지사로 채용되어 근무한 경력 소.「고등교육법」 제2조에 따른 학교에서 교수 또는 강사의 자격으로 채용되어 사회복지학 전공교과목과 사회복지관련 교과목을 전담하여 강의한 경력 오.「국민체육진흥법」 제2조제6호에 따른 체육지도자로서 대한장애인체육회 및 대한장애인체육회 산하 지역장애인체육회(시･도 및 시･군･구장애인체육회)에서 장애인생활체육지도자로 채용되어 동종 직종에 근무한 경력 조.「성폭력방지법」 제18조에 따라 설치된 성폭력피해자통합지원센터(해바라기센터)에서 직원의 자격으로 채용되어 근무한 경력 초.「아동복지법」 제13조 및 동법 시행규칙 제4조 에 따라 「아동복지법」 제15조에 따른 아동보호서비스 업무를 수행하기 위하여 아동보호전담요원으로서 채용되어 근무한 경력 코.「장애인복지법」 제54조에 따라 설치된 장애인자립생활지원센터에서 직원의 자격으로 채용되어 근무한 경력 토.「한국보건복지인력개발원법」 제6조에 따른 업무를 수행하기 위하여 한국보건복지인력개발원에 직원의 자격으로 채용되어 근무한 경력 포.「장애인복지법」 제29조의2에 따른 업무를 수행하기 위하여 한국장애인개발원에 직원의 자격으로 채용되어 근무한 경력 호. 「장애인고용촉진 및 직업재활법」 제43조에 따른 업무를 수행하기 위하여 한국장애인고용공단에 직원의 자격으로 채용되어 근무한 경력 구.「협동조합 기본법」 제2조에 따라 보건복지부장관의 인가를 받아 설립된 사회적협동조합으로서 「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치･운영하거나 위탁운영하는 사회적협동조합 직원으로 상근한 경력 ※ 사회적협동조합의 정관 또는 사업계획서, 시설 신고증 등을 통해 「사회복지사업법」 제2조제4호에 따른 사회복지시설을 설치･운영하거나 위탁운영하는지 확인 필요 누. 「사회서비스 지원 및 사회서비스원 설립･운영에 관한 법률」 제10조에 따른 업무를 수행하기 위하여 시･도 사회서비스원에 직원의 자격으로 채용되어 근무한 경력 두. 「위기 임신 및 보호출산 지원과 아동 보호에 관한 특별법」 제2조에 따른 상담기관에 직원의 자격으로 채용되어 근무한 경력 루. 「치매관리법」 제16조의2에 따른 광역치매센터 또는 치매관리법 제17조에 따른 치매안심센터에서 직원으로 채용되어 근무한 경력 무. 「사회복지사 등의 처우 및 지위 향상을 위한 법률」제3조의3에 따른 사회복지종사자 권익지원센터에서 직원의 자격으로 채용되어 근무한 경력 부. 「노인장기요양보험법」에 따른 장기요양기관 및 장기요양재택의료센터에서 해당 기관의 고유사업 수행인력으로 근무한 경력"}, {"p": 251, "t": "유사경력 산정 가능 시점(개정일)\n유사경력 산정 관련, 하단의 표기 일자는 유사경력기준 개정(생성)일로 호봉획정(산정) 가능 시점*이며, 종사자의 모든 기간 근무경력에 대해 인정 가능 * 유사 경력을 포함하여 새롭게 산정되는 호봉은 ʼ△△년 1월 1일 이후에 최초로 지급되는 급여부터 반영(ʼ△△년 1일 1일 이전 급여에 대한 소급적용은 되지 않음) - ㉮의 ⓶(안전관리자) ’26.1.1. ㉱: ’07.1.1., ㉳: ʼ09.1.1, ㉴~: ʼ15.1.1. 너: (보건복지부 장관의 허가를 받은 경우) ‘15.1.1.(중앙부처의 장) ’23.1.1.,(지자체장)‘24.1.1.(전담인력)’15.1.1.(활동지원사)‘24.1.1.(근로지원인)’25.1.1.  , : ʼ16.1.1, : ʼ17.1.1., ‘18.1.1.,처~: ʼ19.1.1., ~: ʼ20.1.1.,로 (긴급돌봄서비스, 최중증발달장애인 통합돌봄서비스) ’26.1.1.: ʼ21.1.1., ~: ʼ22.1.1., ~: ʼ23.1.1. : ʼ24.1.1. ~: ʼ25.1.1.\nQ & A\nQ: 유사경력 기준 항목 중 사회복지시설로 전환된 경우 경력 인정범위는? A: 현재 사회복지시설인 경우 시설 인정시점을 기준으로 전(80%)･후(100%)로 구분하여 경력인정 가능합니다.\nQ & A\nQ: 복지관 등에서 위탁사업인력으로 근무한 경력을 시설 경력 가. 적용시 100% 인정되고,  유사졍력 기준 저.에 따르면 80%일 경우 어느 기준에 따르면 되나요? A: 유리한 경력인정 기준을 적용할 수 있을 것으로 사료됩니다.\n나.군 복무 관련 경력인정 범위\n1) 산정원칙 및 대상경력\n군 복무경력은 다음 각 목[가)~마)]의 어느 하나에 해당하는 사람이 병적증명서*상 실제 복무한 경력을 인정하되, 그 경력이 3년이 넘을 경우에는 3년**까지만 인정\n*「병역법 시행규칙」 별지 제5호 서식에 따른 병적증명서를 원칙으로 하되, 주민등록표 초본 또는 각군본부 등에서 발급한 군경력증명서도 가능\n**종전의 지침에 따라 해군(상륙병과는 제외) 또는 공군에서 의무복무를 한 경우로서 3년 1개월에서 3년 6개월까지의 기간 내에서 이미 인정받아 호봉이 계산된 사람은 그 경력을 그대로 인정"}, {"p": 252, "t": "가) 「제대군인지원에 관한 법률」 제2조제1호 및 제16조제3항에 따른 제대군인\n제대군인\n1. 「병역법」, 「군인사법」 또는 「대체역의 편입 및 복무 등에 관한 법률」에 따라 군 또는 공익 분야에서의 복무를 마치고 전역[퇴역･면역(免役) 또는 소집해제를 포함한다. 이하 같다]한 사람 2. 「병역법」 제72조제2항에 따라 병역의무기간을 마치고 퇴역(退役)한 장교･준사관 및 부사관 3. 「병역법」 제72조제2항에 따라 병역의무기간을 마치고 면역(免役)된 병 4. 「군인사법」 제41조에 따라 퇴역(退役)한 장교･준사관 및 부사관 5. 「병역법」 제23조, 제23조의2, 제33조의8, 제39조에 따라 소집해제된 상근예비역, 승선근무예비역, 예술·체육요원, 전문연구요원 및 산업기능요원 6.「병역법」 제26조제1항제1호 및 제2호에 따라 국가기관･지방자치단체･공공단체 및 사회복지시설의 공익목적에 필요한 사회복지, 보건･의료, 교육･문화, 환경･안전 등 사회서비스 업무의 지원업무 및 국가기관･지방자차단체･공공단체의 공익목적에 필요한 행정업무 등의 지원업무에 복무하고 소집해제된 사회복무요원\n나) 「병역법」 제25조에 따라 전환복무를 한 사람\n전환복무자\n1. 「의무소방대설치법」 제3조제2항에 따른 의무소방원 2. 「의무경찰대 설치 및 운영에 관한 법률」 제3조에 따른 의무경찰 3. 종전 「전투경찰대설치법」 제3조제2항 및 제3항에 따른 전투경찰 4. 종전 「교정시설경비교도대설치법」 제3조에 따른 경비교도\n다)종전 「병역법」(2013.6.4., 법률 제11849호로 개정되기 전의 것)에 따라 ①국가기관･지방자치단체･공공단체 및 사회복지시설의 공익목적에 필요한 사회복지, 보건･의료, 교육･문화, 환경･안전 등 사회서비스업무의 지원업무, ②국가기관･지방자치단체･공공단체의 공익목적에 필요한 행정업무 등의 지원업무에 복무하고 소집해제된 공익근무요원"}, {"p": 253, "t": "라)종전 「병역법」(1993.12.31., 법률 제4685호로 전부개정되기 전의 것)에 따라 소집되어 복무하다 소집해제된 방위병\n학도의용군 경력 적용방법\n학도의용군의 군복무 경력기간은 병적증명서상 기간과 무관하게 8개월 인정 :학도의용군은 병적증명서상에 실역복무기간의 입대일과 전역일이 동일하므로 해당 병적증명서와 무관하게 8개월을 인정함(「공무원보수 등의 업무지침」 준용)\n2) 산정예외\n무관후보생 경력은 군 복무경력으로 인정하지 아니함(「공무원보수 등의 업무지침」 준용)\n3. 경력기간의 계산\n가. 인정대상 경력기간의 계산\n인정하는 경력이 중복된 경우에는 그 중 유리한 경력 하나만 인정\n기간계산에 있어 임용일은 산입하고 퇴직일은 제외함\n※단, 근무종료일이 법령 또는 계약에 의해 미리 정하여진 군복무기간의 퇴직(전역)일 또는 계약직의 계약기간 만료일은 근무경력에 산입함\n시간제 근로자 등 통상적인 근무시간과 다르게 근로계약을 체결한 자에 대해서는 정상근무시간을 기준으로 실제 근무시간에 비례하도록 계산함\n경력기간은 년･월･일까지 계산하되, 민법상 역(曆)에 의한 방법에 의해 계산함 (「민법」 제160조 참조) (12월을 1년으로, 30일을 1월로 계산함)\n▹「민법」 제160조(曆에 의한 계산)\n① 기간을 週, 月 또는 年으로 정한 때에는 曆에 의하여 계산한다.\n②週, 月 또는 年의 처음으로부터 기간을 기산하지 아니한 때에는 최후의 週, 月 또는 年에서 그 기산일에 해당한 날의 전일로 기간이 만료한다.\n③月 또는 年으로 정한 경우에 최종의 月에 해당일이 없는 때에는 그 月의 말일로 기간이 만료한다.\nʼ03년 1월 5일에 사회복지시설에 임용된 종사자가 ʼ04년 3월 9일에 퇴직하였을 경우"}, {"p": 254, "t": "△ 임용일 산입(2003년 1월 5일), 퇴직일 제외(2004년 3월 9일)\n△기산일 전일에 해당하는 날로 만료 시 1월로 계산하되(예：1.5∼2.4) 기산일 전일에 해당하는 일자가 없는 경우에는 그달의 말일까지를 1월로 계산(예：1.31∼2.28)\n△2월의 경우, 실제일수가 28일이나 월력에 의해 1월로 계산\n△상기 계산방법에 의해 경력을 계산하면 근무경력은 1년 2월 4일임\n➝ ʼ03.1.5∼ʼ04.1.4：1년\n➝ ʼ04.1.5∼ʼ04.3.4：2월\n➝ ʼ04.3.5∼ʼ04.3.8：4일\n예시\n나. 경력환산율을 적용한 경력기간 계산방법\n환산율 적용후의 경력기간은 연･월･일 단위까지 산출\n환산율이 10할(100%)인 경우에는 경력기간을 그대로 인정하고, 환산율이 10할미만인 경우에는 연･월･일 단위로 각각 환산율을 적용하되, 소수점 이하는 절사\n예) ʼ93년 11월 15일에서 ʼ95년 12월 31일까지 의료기관에 근무한 간호사의 근무경력\n△ 의료법에 의한 의료기관에 근무한 간호사 근무경력：80% 인정\n△ 경력인정：1년 8월 13일\n➝ ʼ93.11.15∼ʼ95.11.14：2년×0.8=1.6년=1년 7.2월=1년 7월 6일(30일×0.2)\n➝ ʼ95.11.15∼ʼ95.12.14：1월×0.8=0.8월=24일(30일×0.8)\n➝ ʼ95.12.15∼ʼ95.12.31：17일×0.8=13.6일=13일(소수점 이하 절사)\n예시\n4. 경력의 증명 및 전력조회\n가. 경력의 증명\n경력의 증명은 권한 있는 자(시설장, 시･군･구청장 등)가 발행한 경력증명서에 의함\n‒희망이음을 통해 조회되는 경력은 시･군･구 보고를 거친 경력이므로, 경력증명서 발급 및 전력조회를 다시 거칠 필요없음\n종사자 본인이 경력증명을 거부한 경우, 보조금 지급을 거부할 수 있음\n※경력을 증명할 수 있는 서류가 없거나 종사자 본인의 경력확인서약서, 불충분한 경우에는 재직기간을 객관적으로 증명할 수 있는 내부증빙자료(임용장, 승진발령기록 등) 또는 외부증빙자료(국민건강보험공단 자료, 금융기관 보수입금내역, 세무서 근로소득납세증명 등)을 통해 경력인정\n나. 전력조회"}, {"p": 255, "t": "전력조회는 종사자를 채용한 기관에서 경력증명서 등을 발급한 기관을 대상으로 하는 것이 원칙이나, 종사자가 원하지 않는 경우에는 보조금을 지급하는 소관 지자체에서 대신하여 전력조회 실시할 수 있음\n전력조회 시 정상적 근로계약 여부, 담당업무, 경력기간 등 경력인정과 관련된 사항을 확인\n‒공무원 경력과 군경력은 경력증명서 내용이 불확실하거나 복무기간 등에 의문이 있을 경우 해당관청에 조회실시\n‒사회복지시설 근무경력과 기타유사경력(8할 인정경력)은 보조금 지급과 관련된 것이므로 반드시 실시하되, 임용일로부터 3월 이내에 완료토록 함\n※ 근무 기관 및 직무의 확인이 가능한 경우 전력 조회가 필수 사항은 아님\n5. 경과조치\n‒2004년 1월 1일 이전에 종전의 지침에 의해 근무경력을 인정받고 있던 자에 대해서는 종전의 인정받던 근무경력을 계속 적용함\n※단, 2004년 1월 1일 이후 신규채용자에 대해서는 본 지침상 기준을 적용\n6. 기타 참고사항\n가.시설종사자가 지역 간 또는 시설 간 이직하는 경우에도 호봉산정 등에서 불이익을 받지 않도록 공통적으로 적용되는 경력은 인정될 수 있도록 관심요망\n나.본 지침 상 근무경력은 종사자 호봉산정을 위한 것으로 다른 법령에 규정되어 있는 “근무(종사)한 경력”에 해당하지 않음\n※ 개별법령 상 “근무(종사)한 경력”은 해당 시설 담당부서에 문의할 것\n아동복지법령상 종사자 자격기준으로 “아동복지와 관련된 사회복지사업에 3년 이상 종사한 경력”의 해석은 본 지침이 아닌 보건복지부 아동복지과 지침 또는 유권해석에 의함\n예시"}]}]}, {"no": 7, "title": "사회복지시설 종사자 인건비 가이드라인", "start": 257, "end": 273, "sections": [{"title": "1. 법적 근거", "start": 258, "end": 258, "html": "<div class=\"pchip\" id=\"p258\"><span>원문 258쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=270\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">「사회복지사 등 처우 및 지위 향상을 위한 법률」제3조<\/div><div class=\"ln p\">제3조(사회복지사 등의 처우개선과 신분보장) ① 국가와 지방자치단체는 사회복지사 등의 처우를 개선하고 복지를 증진함과 아울러 그 지위 향상을 위하여 적극적으로 노력하여야 한다.<\/div><div class=\"ln p\">② 국가와 지방자치단체는 사회복지사 등의 보수가 사회복지전담공무원의 보수수준에 도달하도록 노력하여야 한다.<\/div><div class=\"ln p\">③ 국가는 사회복지사 등의 적정 인건비에 관한 기준을 마련하여야 하며, 지방자치단체는 해당 기준을 준수하기 위하여 노력하여야 한다.  &lt;신설 2018. 12. 11.&gt;<\/div><div class=\"ln p\">④ 보건복지부장관과 지방자치단체의 장은 사회복지사 등의 보수 수준 및 지급실태, 제3항에 따른 기준의 지방자치단체별 준수율 등에 관하여 3년마다 조사ㆍ공표하여야 한다.  &lt;개정 2018. 12. 11.&gt;<\/div><div class=\"ln p\">⑤ 사회복지사 등은 사회복지법인 등의 운영과 관련된 위법ㆍ부당 행위 및 그 밖의 비리 사실 등을 관계 행정기관과 수사기관에 신고하는 행위로 인하여 징계 조치 등 신분상 불이익이나 근무조건상 차별을 받지 아니한다.  &lt;개정 2018. 12. 11.&gt;<\/div><div class=\"ln p\">[시행일 : 2019. 12. 12.] 제3조<\/div><div class=\"ln p\">「사회복지사 등 처우 및 지위 향상을 위한 법률」 시행령 제4조<\/div><div class=\"ln p\">제4조(보수수준에 관한 권고기준) 보건복지부장관은 실태조사 결과에 따른 사회복지사 등의 보수수준과 「사회보장급여의 이용제공 및 수급권자 발굴에 관한 법률」 제43조에 따른 사회복지 전담공무원의 보수수준을 비교하여 사회복지사 등의 보수수준에 관한 권고기준을 정할 수 있다.<\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>적용 대상<\/div><div class=\"ln p\">「사회복지사업법」제2조에 따라 사회복지사업을 행할 목적으로 설립된 사회복지시설 (별표9 참조)<\/div><div class=\"ln p\">- 국고지원시설과 지방이양시설 모두 포함하되, 「영유아보육법」에 따른 ‘어린이집’, 「노인장기요양보험법」을 적용받는 ‘노인의료복지시설’과 ‘재가노인복지시설’은 제외<\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>적용 원칙<\/div><div class=\"ln p\">동 인건비 지급기준을 우선 적용하되, 기본급 및 수당 기준 등은 개별 시설유형과 지방자치단체 예산사정 등에 따라 별도로 마련 가능<\/div><div class=\"ln p\">- 호봉제 미적용 등 인건비 기준을 달리 적용하는 시설의 경우는 종사자 수, 이용자 수 등 시설의 규모에 따라 시설장 및 종사자의 인건비 지급기준을 시설별‧지자체별 개별지침에 명시하여 적용 가능<\/div><div class=\"ln p\">｢근로기준법｣ 규정에 따른 연장, 야간, 휴일 근로수당, 퇴직금, 기타 4대보험 등의 경우 근로기준법 및 개별법령을 준수<\/div><div class=\"ln p\">→법정근로시간 과다 초과, 연장·야간 및 휴일근로 수당 등 미지급 등에 따른 노사분쟁이 발생하지 않도록 유의<\/div><div class=\"ln p\">종사자 보수 수준 관리<\/div><div class=\"ln p\">- 지방자치단체는 월별로 종사자의 정확한 기본급 및 수당을 파악하고, 시설에서 종사자 입·퇴사 보고 등을 위해 사용 중인 「사회서비스정보시스템」 내 급여 및 회계 기능사용 조치 후 확인<\/div><div class=\"ln p\">* 사회서비스정보시스템 ‘인사회계’ → ‘급여관리’ → ‘급여현황’ → ‘급여대장’ 기능을 활용하고 상세 매뉴얼은 시스템 홈페이지(www.ssis.go.kr) 참조<\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>기타 사항<\/div><div class=\"ln p\">보수 인상 및 보수체계 변경<\/div><div class=\"ln p\">- 본 기준은 권고 기준이므로 질 높은 복지서비스 제공을 위해 개별 시설 담당부서와 지방자치단체는 이를 참고하여 기준 이상이 되도록 노력할 것<\/div><div class=\"ln p\">보수 기준 적용 직위의 분류 (예시 참조)<\/div><div class=\"ln p\">- 시설 관련 개별법령이 정한 종사자 배치기준에 의해 사회복지시설에 근무하고 있는 자의 인건비를 보조하기 위한 기준으로 종사자 직위를 분류함<\/div><div class=\"ln p\">- 시설별 지침 및 지방자치단체의 지침에서 직위별 대상자 범위에 포함되지 않은 종사자의 직위 분류 및 보수 등을 정할 경우 그에 따름<\/div><div class=\"ln p\">- 직위의 분류에 있어 생활복지사, 생활지도원 등은 시설종사자 인건비를 보조하기 위한 직위이며, 개별법령상 생활복지사 등 자격은 해당 법령에 의해서만 인정<\/div><div class=\"ln p\">아동복지시설의 직업훈련교사는 직위의 분류에 있어 생활복지사에 해당하나 ｢아동복지법｣상의 생활복지사에는 해당하지 않음<\/div><div class=\"ln p\">→｢아동복지법｣상 생활복지사는 ①사회복지사 2급자격 이상 소지자, ②유치원, 초등학교, 중등학교 교사 자격 소지자, ③보육교사 1급 자격소지자만이 가능<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">(직위분류 예시 : 생활시설 중심)<\/div><table class=\"htbl\"><tr><td>직  위<\/td><td>노 인<\/td><td>장애인<\/td><td>아 동<\/td><td>정 신<\/td><td>노숙인<\/td><\/tr><tr><td>원장<\/td><td colspan=\"5\">시설장<\/td><\/tr><tr><td>사무국장<\/td><td>사무국장, 총무<\/td><td>사무국장, 총무<\/td><td>사무국장<\/td><td>사무국장,<br>정신건강전문요원<\/td><td>총무<br>상담부장<br>정신건강전문요원<\/td><\/tr><tr><td>과장 및<br>생활복지사<\/td><td>과장<br>생활복지사<br>상담지도원<br>간호사<br>영양사<br>물리치료사<\/td><td>과장<br>사회재활교사<br>간호사, 영양사<br>물리치료사<br>작업치료사<br>청능치료사<br>언어치료사<br>보행훈련사<br>상담평가요원<\/td><td>과장<br>생활복지사<br>상담지도원<br>간호사, 영양사<br>직업훈련교사<br>임상심리상담원<br>자립지원전담요원<\/td><td>과장<br>생활복지사<br>간호사<br>영양사<br>작업지도원<\/td><td>생활복지사<br>상담지도원<br>간호사<br>영양사<br>물리치료사<br>직업훈련교사<\/td><\/tr><tr><td>생활지도원<\/td><td colspan=\"5\">생활지도원, 보육사, 간호조무사, 사무원<\/td><\/tr><tr><td>관리직<\/td><td colspan=\"5\">관리인, 경비원<\/td><\/tr><tr><td>기능직<\/td><td colspan=\"5\">조리원, 위생원<\/td><\/tr><\/table><div class=\"ln note\">※ 직위분류 예시에 포함되지 않은 시설유형 및 직위는 개별 사업지침을 참고하여 적용<\/div><div class=\"ln note\">※ 소규모시설로서 위 예시에 적합하지 않은 시설은 개별 사업지침에서 별도 체계 적용 가능<\/div><div class=\"ln p\">붙임 1. 2026년 사회복지시설 종사자 보수 체계<\/div>", "pages": [{"p": 258, "t": "「사회복지사 등 처우 및 지위 향상을 위한 법률」제3조\n제3조(사회복지사 등의 처우개선과 신분보장) ① 국가와 지방자치단체는 사회복지사 등의 처우를 개선하고 복지를 증진함과 아울러 그 지위 향상을 위하여 적극적으로 노력하여야 한다.\n② 국가와 지방자치단체는 사회복지사 등의 보수가 사회복지전담공무원의 보수수준에 도달하도록 노력하여야 한다.\n③ 국가는 사회복지사 등의 적정 인건비에 관한 기준을 마련하여야 하며, 지방자치단체는 해당 기준을 준수하기 위하여 노력하여야 한다.  <신설 2018. 12. 11.>\n④ 보건복지부장관과 지방자치단체의 장은 사회복지사 등의 보수 수준 및 지급실태, 제3항에 따른 기준의 지방자치단체별 준수율 등에 관하여 3년마다 조사ㆍ공표하여야 한다.  <개정 2018. 12. 11.>\n⑤ 사회복지사 등은 사회복지법인 등의 운영과 관련된 위법ㆍ부당 행위 및 그 밖의 비리 사실 등을 관계 행정기관과 수사기관에 신고하는 행위로 인하여 징계 조치 등 신분상 불이익이나 근무조건상 차별을 받지 아니한다.  <개정 2018. 12. 11.>\n[시행일 : 2019. 12. 12.] 제3조\n「사회복지사 등 처우 및 지위 향상을 위한 법률」 시행령 제4조\n제4조(보수수준에 관한 권고기준) 보건복지부장관은 실태조사 결과에 따른 사회복지사 등의 보수수준과 「사회보장급여의 이용제공 및 수급권자 발굴에 관한 법률」 제43조에 따른 사회복지 전담공무원의 보수수준을 비교하여 사회복지사 등의 보수수준에 관한 권고기준을 정할 수 있다.\n2\n적용 대상\n「사회복지사업법」제2조에 따라 사회복지사업을 행할 목적으로 설립된 사회복지시설 (별표9 참조)\n- 국고지원시설과 지방이양시설 모두 포함하되, 「영유아보육법」에 따른 ‘어린이집’, 「노인장기요양보험법」을 적용받는 ‘노인의료복지시설’과 ‘재가노인복지시설’은 제외\n3\n적용 원칙\n동 인건비 지급기준을 우선 적용하되, 기본급 및 수당 기준 등은 개별 시설유형과 지방자치단체 예산사정 등에 따라 별도로 마련 가능\n- 호봉제 미적용 등 인건비 기준을 달리 적용하는 시설의 경우는 종사자 수, 이용자 수 등 시설의 규모에 따라 시설장 및 종사자의 인건비 지급기준을 시설별‧지자체별 개별지침에 명시하여 적용 가능\n｢근로기준법｣ 규정에 따른 연장, 야간, 휴일 근로수당, 퇴직금, 기타 4대보험 등의 경우 근로기준법 및 개별법령을 준수\n→법정근로시간 과다 초과, 연장·야간 및 휴일근로 수당 등 미지급 등에 따른 노사분쟁이 발생하지 않도록 유의\n종사자 보수 수준 관리\n- 지방자치단체는 월별로 종사자의 정확한 기본급 및 수당을 파악하고, 시설에서 종사자 입·퇴사 보고 등을 위해 사용 중인 「사회서비스정보시스템」 내 급여 및 회계 기능사용 조치 후 확인\n* 사회서비스정보시스템 ‘인사회계’ → ‘급여관리’ → ‘급여현황’ → ‘급여대장’ 기능을 활용하고 상세 매뉴얼은 시스템 홈페이지(www.ssis.go.kr) 참조\n4\n기타 사항\n보수 인상 및 보수체계 변경\n- 본 기준은 권고 기준이므로 질 높은 복지서비스 제공을 위해 개별 시설 담당부서와 지방자치단체는 이를 참고하여 기준 이상이 되도록 노력할 것\n보수 기준 적용 직위의 분류 (예시 참조)\n- 시설 관련 개별법령이 정한 종사자 배치기준에 의해 사회복지시설에 근무하고 있는 자의 인건비를 보조하기 위한 기준으로 종사자 직위를 분류함\n- 시설별 지침 및 지방자치단체의 지침에서 직위별 대상자 범위에 포함되지 않은 종사자의 직위 분류 및 보수 등을 정할 경우 그에 따름\n- 직위의 분류에 있어 생활복지사, 생활지도원 등은 시설종사자 인건비를 보조하기 위한 직위이며, 개별법령상 생활복지사 등 자격은 해당 법령에 의해서만 인정\n아동복지시설의 직업훈련교사는 직위의 분류에 있어 생활복지사에 해당하나 ｢아동복지법｣상의 생활복지사에는 해당하지 않음\n→｢아동복지법｣상 생활복지사는 ①사회복지사 2급자격 이상 소지자, ②유치원, 초등학교, 중등학교 교사 자격 소지자, ③보육교사 1급 자격소지자만이 가능\n예시\n(직위분류 예시 : 생활시설 중심)\n직  위 | 노 인 | 장애인 | 아 동 | 정 신 | 노숙인\n원장 | 시설장\n사무국장 | 사무국장, 총무 | 사무국장, 총무 | 사무국장 | 사무국장, 정신건강전문요원 | 총무 상담부장 정신건강전문요원\n과장 및 생활복지사 | 과장 생활복지사 상담지도원 간호사 영양사 물리치료사 | 과장 사회재활교사 간호사, 영양사 물리치료사 작업치료사 청능치료사 언어치료사 보행훈련사 상담평가요원 | 과장 생활복지사 상담지도원 간호사, 영양사 직업훈련교사 임상심리상담원 자립지원전담요원 | 과장 생활복지사 간호사 영양사 작업지도원 | 생활복지사 상담지도원 간호사 영양사 물리치료사 직업훈련교사\n생활지도원 | 생활지도원, 보육사, 간호조무사, 사무원\n관리직 | 관리인, 경비원\n기능직 | 조리원, 위생원\n※ 직위분류 예시에 포함되지 않은 시설유형 및 직위는 개별 사업지침을 참고하여 적용\n※ 소규모시설로서 위 예시에 적합하지 않은 시설은 개별 사업지침에서 별도 체계 적용 가능\n붙임 1. 2026년 사회복지시설 종사자 보수 체계"}]}, {"title": "2. 적용 대상", "start": 259, "end": 259, "html": "", "pages": []}, {"title": "3. 적용 원칙", "start": 260, "end": 260, "html": "", "pages": []}, {"title": "4. 기타 사항", "start": 261, "end": 262, "html": "", "pages": []}, {"title": "5. 2026년도 사회복지시설 종사자 보수 체계", "start": 263, "end": 273, "html": "<div class=\"pchip\" id=\"p263\"><span>원문 263쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=275\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">5<\/span>붙임 2. 2026년 사회복지시설 종사자 인건비 권고기준 (별표1~9)<\/div><div class=\"ln p\">2026년도 사회복지시설 종사자 보수 체계<\/div><div class=\"ln p\">제1장 총 칙<\/div><div class=\"ln p\">제1조(목적) 이 보수지급 기준은 ｢사회복지사업법｣ 제2조 및 ｢노인복지법｣, ｢장애인복지법｣, ｢아동복지법｣ 등 개별 법령의거 설치된 사회복지시설에 근무하는 종사자의 보수에 관하여 필요한 사항을 규정, 권장함으로 종사자의 장기근속을 유도하고 전문성을 높이고 사회복지 증진에 기여함을 목적으로 한다.<\/div><div class=\"ln p\">제2조(용어의 정의) 이 기준에서 사용하는 용어의 정의는 다음과 같다.<\/div><div class=\"ln p\">1. “보수”라 함은 기본급과 기타 각종 수당을 합산한 금액을 말한다.<\/div><div class=\"ln p\">2. “기본급”이라 함은 직무의 곤란성 및 책임의 정도와 재직기간 등에 따라 직급별, 호봉별로 지급되는 기본급여를 말한다.<\/div><div class=\"ln p\">3. “수당”이라 함은 직무여건 및 생활여건 등에 따라 지급되는 부가급여를 말한다.<\/div><div class=\"ln p\">4. “직종”이라 함은 직무의 전문성 및 성격에 따라 사회복지직(장애인복지관은 이하 “일반직”이라 한다.), 사무직, 의료직, 관리직, 기타 등으로 구분하는 것을 말한다.<\/div><div class=\"ln p\">5. “직위”이라 함은 1명의 종사자에게 부여할 수 있는 직무와 책임을 말한다.<\/div><div class=\"ln p\">6. “직급”이란 직무의 종류·곤란성과 책임도가 상당히 유사한 직위의 군을 말한다.<\/div><div class=\"ln p\">7. “승진”이라 함은 현재의 직급 또는 직책 보다 상위의 직급 또는 직책에 임명하는 것을 말한다.<\/div><div class=\"ln p\">8. “승급”이라 함은 일정한 재직기간의 경과에 의하여 현재의 호봉보다 높은 호봉을 부여하는 것을 말한다.<\/div><div class=\"ln p\">9. “보수의 일할계산”이라 함은 그 달의 보수를 그 달의 일수로 나누어 계산하는 것을 말한다.<\/div><div class=\"ln p\">제3조(적용범위) 사회복지시설 종사자의 보수는 이 기준을 따른다. 단, 별도의 인건비 지급기준 등을 적용받는 종사자는 해당 기준에 의한다.<\/div><div class=\"ln p\">제2장 기 본 급<\/div><div class=\"ln p\">제4조(기본급)<\/div><div class=\"ln p\">1. 사회복지시설 종사자의 월 기본급은 별표1부터 별표4까지의 기본급 권고 기준표를 참고로 하여 지방자치단체 실정에 맞게 지급할 수 있다.<\/div><div class=\"pchip\" id=\"p264\"><span>원문 264쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=276\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2. 전항의 규정에 의한 종사자의 월 기본급 중 별표1부터 별표4까지의 기준표에 규정된 최고 호봉을 초과하는 경우는 최고 호봉을 적용하고, 당해연도 직위별·호봉별 인상분은 포함하여 지급한다.<\/div><div class=\"ln p\">3. 전항의 규정에 의한 기본급 외에 종사자의 처우개선 등을 위하여 필요하다고 인정되는 경우 또는 최고 호봉을 초과하는 경우 지방자치단체장 및 운영법인 등은 자체부담에 의거 별도로 추가액을 확보하여 지급할 수 있다.<\/div><div class=\"ln p\">제3장 호봉 획정 및 승급<\/div><div class=\"ln p\">제5조(호봉획정 및 승급시행권자) 호봉획정 및 승급은 임용권자가 시행하고, 사회복지시설을 관할하는 지방자치단체장이 해당 사회복지시설 종사자의 재직 관련 서류 등을 통해 확인하여야 한다.<\/div><div class=\"pchip\" id=\"p265\"><span>원문 265쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=277\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제6조(인정경력) 대상 경력은 사회복지시설 근무경력, 유사경력, 군복무근무경력 등을 말하며, 경력인정의 범위 및 환산율은 ｢사회복지시설 관리안내｣ 중 호봉의 획정 및 승급과 각 시설 유형별 개별지침을 참조하여 준용한다.<\/div><div class=\"ln p\">제7조(초임호봉의 획정 및 경력년수 산정)<\/div><div class=\"ln p\">1. 종사자를 신규 채용하는 경우에는 초임호봉을 획정한다.<\/div><div class=\"ln p\">2. 초임호봉은 1호봉으로 하되, 제6조에 정하여진 근무경력이 있는 경우에는 경력별 근무기간 1년을 각각 1호봉씩으로 하여 초임호봉을 정한다.<\/div><div class=\"ln p\">3. 초임호봉의 획정에 반영되지 아니한 1년 미만의 잔여기간이 있을 때는 그 기간을 다음 승급 기간에 산입한다.<\/div><div class=\"ln p\">제8조(승급 및 승진)<\/div><div class=\"ln p\">1. 호봉 간의 승급에 필요한 기간은 1년으로 하며, 호봉은 매달 1일자로 승급한다. 호봉 승급 산정일 기준, 제7조 제3호에 따른 잔여기간을 포함하여 승급에 필요한 기간을 충족한 경우에는 승급한다.<\/div><div class=\"ln p\">2. 승진에 관한 사항은 사회복지직의 경우는 &lt;별표6&gt; 직위별 승진 최소 소요연한에 따라, 사회복지직 외의 직종은 &lt;별표7&gt; 직급별 승진 최소 소요연한에 따라, 기관장의 인사권에 의하여 승진한다. 단, 장애인복지관 일반직(기능직, 고용직 제외)의 승진 최소소요연한은 개별지침 등 별도기준을 적용한다.<\/div><div class=\"ln p\">3. 사회복지직의 선임사회복지사로의 승진 및 사회복지직 외 직종의 3급으로의 승진(단, 의료직의 경우 최초 3급을 부여받은 자의 2급 승진 포함)에 필요한 최소 소요 연한을 충족하는 경우 당연승진을 적용하도록 노력하여야 하며, 별도 기준이 있는 경우 이를 우선 적용한다.<\/div><div class=\"ln p\">4. 승진에 필요한 “직위 및 직급별 최소 소요연한”이라함은 사회복지직 및 사무직, 의료직, 관리직, 기타 직종 등 모든 직종에 적용되고, 해당 직위에서의 실 근무경력을 말하며, 동일 유형의 시설 또는 동일 법인 내 시설 근무경력을 적용한다. 이 때 동일 유형이란 &lt;별표9&gt;의 세부 종류에 표기된 시설의 세부 유형을 의미한다.<\/div><div class=\"ln p\">제9조(승급의 제한) 다음 각 호에 해당하는 자는 해당 기간 동안 승급시킬 수 없다.<\/div><div class=\"ln p\">1. 징계처분, 직위해제, 또는 휴직(「남녀고용평등과 일·가정 양립지원에 관한 법률」상의 육아휴직과 업무상 질병으로 인한 휴직은 제외한다.) 중에 있는 자.<\/div><div class=\"ln p\">2. 징계처분이 종료된 날로부터 일정 기간(정직：18월, 감봉：12월, 근신 또는 견책：6월)이 경과되지 아니한 자.<\/div><div class=\"ln p\">제4장 보수의 지급<\/div><div class=\"ln p\">제10조(보수의 지급방법) 보수는 본인에게 직접 현금 또는 요구불 예금으로 지급하되, 출장 기타 부득이한 사유로 인하여 본인에게 직접 지급할 수 없을 때는 본인이 지정하는 자에게 지급할 수 있다.<\/div><div class=\"ln p\">1. 보수는 사회서비스정보시스템의 종사자 급여 및 회계 관리를 이용하여 인건비 지급 항목 및 재원별로 급여 대장 및 급여명세서를 입력하는 것을 권장한다.<\/div><div class=\"ln p\">제11조(보수계산) 보수는 특별한 규정이 있는 경우를 제외하고는 신규 채용 등의 경우에 있어서 발령일을 기준으로 그 월액을 일할 계산하여 지급한다.<\/div><div class=\"ln p\">제12조(보수지급일) 보수는 매월 운영법인에서 따로 정하는 날에 지급할 수 있으며 다만, 지급일이 공휴일인 경우에는 그 전일에 지급한다.<\/div><div class=\"ln p\">제5장 수  당<\/div><div class=\"ln p\">제13조(수당의 지급) 사회복지시설 종사자의 수당은 &lt;별표8&gt;의 기준표를 참고로 하여 지방자치단체 실정에 맞게 지급할 수 있다.<\/div><div class=\"ln p\">1. (명절휴가비) 재직 중인 종사자에게 매년 명절(설, 추석)이 속하는 달에 월 봉급액의 60%를 명절휴가비로 지급한다.<\/div><div class=\"ln p\">2. (가족수당) 부양가족 1인당 월 2만원(배우자 4만원, 첫째자녀 5만원, 둘째자녀 8만원, 셋째 이후 자녀 12만원)의 가족수당을 지급한다. 부양가족의 수는 4명 이내로 하되, 자녀의 경우에는 4명을 초과하더라도 가족수당을 지급한다.<\/div><div class=\"ln p\">3. (시간외근무수당) 시간외근무에 대해서는 다음 각호에 따라 가산 지급한다.<\/div><div class=\"ln h3\">가. (연장근로 수당) 통상임금의 100분의 50 이상을 가산하여 지급한다.<\/div><div class=\"ln h3\">나. (야간근로 수당) 오후 10시부터 다음 날 오전 6시 사이의 근로에 대해서는 통상임금의 100분의 50 이상을 가산하여 지급한다.<\/div><div class=\"ln h3\">다. (휴일근로 수당) 8시간 이내의 휴일근로에 대해서는 통상임금의 100분의 50 이상을, 8시간을 초과한 휴일근로에 대해서는 통상임금의 100분의 100 이상을 가산하여 지급한다.<\/div><div class=\"pchip\" id=\"p266\"><span>원문 266쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=278\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">4. 제1항에서 제3항까지의 규정에 의한 수당 이외에 해당 사회복지시설의 수행사업과 운영의 특수성을 감안하여 운영법인 및 지방자치단체의 결정에 따라 자체부담 또는 정부보조금으로 별도의 수당규정을 신설하여 지급할 수 있다.<\/div><div class=\"ln p\">제6장 퇴직금<\/div><div class=\"ln p\">제14조(퇴직금) 사회복지시설 종사자의 퇴직금에 대해서는 ｢근로자퇴직급여 보장법｣에 따른다.<\/div><div class=\"pchip\" id=\"p267\"><span>원문 267쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=279\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">제7장 유급병가<\/div><div class=\"ln p\">제15조(유급병가)<\/div><div class=\"ln p\">1. 지방자치단체의 장 또는 운영법인·시설 등의 장은 사회복지시설 종사자가 다음 각 호의 어느 하나에 해당할 경우에는 자율적으로 정하는 범위에서 유급병가를 허가할 수 있다. 다만, ‘자율적으로 정하는 범위’는 최소 연 30일 이상이 될 것을 권고한다.<\/div><div class=\"ln h3\">가. 질병이나 부상으로 인하여 직무를 수행할 수 없을 때<\/div><div class=\"ln h3\">나. 감염병에 걸려 그 종사자의 출근이 다른 종사자의 건강에 영향을 미칠 우려가 있을 때<\/div><div class=\"ln p\">2. 병가 일수가 연간 6일을 초과하는 경우에는 의사의 진단서를 첨부하여야 한다.<\/div><div class=\"ln p\">3. 2025년 12월을 기준으로 지자체·시설별로 운영중인 유급병가제도가 있는 경우, 본 조항을 이유로 유급병가의 기간·조건 등을 종사자에게 불리하게 변경하지 않도록 하며, 구체적인 내용은 지자체·시설별 개별 지침 등을 마련하여 운영할 수 있다.<\/div><div class=\"ln p\">제8장  보  칙<\/div><div class=\"ln p\">제16조(종사자 처우수준 향상) 2026년 사회복지시설 종사자의 보수수준이 2025년에 비해 낮아지지 않도록 한다.<\/div><div class=\"ln p\">별표 1. 2026년 사회복지시설(생활시설, 이용시설) 종사자 기본급 권고 기준<\/div><div class=\"ln p\">(단위: 원/월)<\/div><table class=\"htbl\"><tr><td rowspan=\"3\">직위<br>(호봉)<\/td><td>생활시설<\/td><td>원장<\/td><td>-<\/td><td>사무국장<\/td><td>과장, 생활복지사<\/td><td>선임 생활지도원<\/td><td>생활지도원<\/td><td>-<\/td><td>관리직<\/td><td>기능직<\/td><\/tr><tr <\/td><td>3,701,100<\/td><\/tr><tr><td>29호봉<\/td><td>4,215,400<\/td><td>3,907,700<\/td><td>3,824,700<\/td><td>3,739,500<\/td><\/tr><tr><td>30호봉<\/td><td>4,277,300<\/td><td>3,944,400<\/td><td>3,848,100<\/td><td>3,773,500<\/td><\/tr><tr><td>31호봉<\/td><td>4,321,900<\/td><td>3,985,500<\/td><td>3,887,700<\/td><td>3,799,800<\/td><\/tr><\/table><div class=\"ln note\">※ 관리직 : 노무, 운전기사, 조리사(원), 취사원, 고용직(청소, 취사 및 세탁 등 해당 업무가 가능한 자). 장애인복지관의 기능직, 고용직은 관리직을 준용하여 적용<\/div><div class=\"ln p\">별표 5. 사회복지이용시설(사회, 노인, 장애인) 종사자 기본급 지급 기준 (기타직종)<\/div><table class=\"htbl\"><tr><td>해당직종<\/td><td>봉급적용<\/td><td>비고<\/td><\/tr><tr><td>조리사, 취사원<\/td><td>별표4를 적용하는 것보다 더 나은 기준을 운용하는 경우 기관별 근무조건 및 근무 형태에 따라 자율 적용<\/td><td rowspan=\"2\">전년도 대비 타 직종과의 형평성 고려하여 임금 인상<\/td><\/tr><tr><td>기능교사, 사서 등<\/td><td>기관별 근무조건 및 근무 형태에 따라 자율 적용<\/td><\/tr><tr><td>보육교사<\/td><td colspan=\"2\">별도의 예산지원 사업에 투입된 보육교사(예, 방과후 학교 등)의 경우는 해당 사업예산 지원단가에 준하여 지급하며, 그 외의 경우는 국ㆍ공립 어린이집 보육교사 급여 기준에 따라 지급.<\/td><\/tr><\/table><div class=\"ln p\">별표 6. 사회복지이용시설(사회복지직)의 직위별 승진 최소 소요 연한<\/div><table class=\"htbl\"><tr><td>직위<\/td><td>선임사회복지사<\/td><td>과장<\/td><td>부장·사무국장<\/td><\/tr><tr><td>연한<\/td><td>사회복지사로<br>만3년(4년차) 이상<\/td><td>선임사회복지사로<br>만5년(6년차) 이상<\/td><td>과장으로<br>만7년(8년차) 이상<\/td><\/tr><\/table><div class=\"ln h4\">1) 승진에 필요한 “최소 소요연한”은 해당 직위에서의 실 근무경력을 말하며, 동일 유형의 시설 또는 동일 법인 내 시설 근무경력을 적용<\/div><div class=\"ln h4\">2) 2013년 12월 31일 이전 기준(해당 직종에서의 실 근무경력)에 의해 승진한 경우 종전 자격 유지<\/div><div class=\"ln h4\">3) 사회복지사로 만3년(4년차)의 “최소 소요연한”을 충족하는 경우, 당연 승진을 적용하여 선임사회복지사로 보하도록 노력하여야 함.<\/div><div class=\"ln h4\">4) 장애인 복지관 일반직의 승진 최소 소요 연한은 개별 지침 등 별도 기준을 적용<\/div><div class=\"ln h4\">5) 생활시설 선임생활지도원은 만3년(4년차) 이상인 생활지도원 중에서 법인 및 시설의 제반여건 등을 감안하여 선정<\/div><div class=\"ln p\">별표 7. 사회복지이용시설(사회복지외 직종)의 직급별 승진 최소 소요 연한<\/div><table class=\"htbl\"><tr><td>직급<\/td><td>3급<\/td><td>2급<\/td><td>1급<\/td><\/tr><tr><td>연한<\/td><td>4급으로 만3년(4년차) 이상<\/td><td>3급으로 만5년(6년차) 이상<\/td><td>2급으로 만7년(8년차) 이상<\/td><\/tr><\/table><div class=\"ln h4\">1) 승진에 필요한 “최소 소요연한”은 해당 직위에서의 실 근무경력을 말하며, 동일 유형의 시설 또는 동일 법인 내 시설 근무경력을 적용 동일 법인 내 시설 근무경력을 적용<\/div><div class=\"ln h4\">2) 2013년 12월 31일 이전 기준(해당 직종에서의 실 근무경력)에 의해 승진한 경우 종전 자격 유지<\/div><div class=\"ln h4\">3) 4급으로 만3년(4년차)의 “최소 소요연한”을 충족하는 경우, 당연 승진을 적용하여 3급으로 보하도록 노력하여야 함.<\/div><div class=\"ln h4\">4) 본 &lt;별표7&gt;의 직급별 승진 최소 소요연한은 관리직, 사무직, 의료직, 타 직종 등에 각각 적용하며 개별 지침상 별도 기준이 있는 경우 이를 적용<\/div><div class=\"ln p\">별표 8. 사회복지시설 종사자 수당 기준<\/div><div class=\"pchip\" id=\"p272\"><span>원문 272쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=284\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>수당의 종류<\/td><td>지급대상<\/td><td>지급액<\/td><td>지급회수 및 지급일<\/td><\/tr><tr><td>명절휴가비<\/td><td>재직 중인 종사자<br>(육아휴직,병가휴직 등 장기휴직 제외)<\/td><td>기본급의 120%<\/td><td>기본급의 60%씩 연 2회, 설과 추석이 속한 달의 보수지급일<br>(또는 설과 추석 전 15일 이내에 시설의 장이 정한 날)<\/td><\/tr><tr><td>가족수당<\/td><td>부양가족이 있는 종사자<\/td><td>- 배우자 : 월 40,000원<br>- 배우자 및 자녀를 제외한 부양가족(직계존속·비속 등) : 1명당 월 20,000원<br>- 자녀 : 첫째 월 50,000원, 둘째 월 80,000원, 셋째 이후 자녀 월 120,000원<\/td><td>매월 급여 지급일에 지급<br>(이외 세부기준은 공무원 보수 등의 업무지침 준용)<\/td><\/tr><tr><td>시간외<br>근무수당<\/td><td>규정된 근무시간 외 연장·야간·휴일 근로를 한 종사자<\/td><td>(연장근로) 통상임금의 50% 이상 가산<br>(야간근로) 통상임금의 50% 이상 가산<br>(8시간 이내 휴일근로) 통상임금의 50% 이상 가산<br>(8시간 초과 휴일근로) 통상임금의 100% 이상 가산<br>* 연장·휴일 및 야간근로 시간당 월 통상임금의 1/209 기준으로 산정<\/td><td>시간외근무를 한 다음달 보수 지급일<br>(단, 12월은 당월에 지급)<\/td><\/tr><\/table><div class=\"ln note\">※ 2009년부터 공무원의 ‘정근수당’, ‘정액급식비’, ‘직급보조비’를 포함하여 사회복지시설 종사자의 호봉별 기본급표 작성<\/div><div class=\"pchip\" id=\"p273\"><span>원문 273쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=285\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※ 위 권고 수당 중 명절휴가비가 통상임금에 포함됨. 이외 별도 지급 수당이 있는 경우 수당의 성격에 따라 통상임금 산정범위 별도 판단 필요<\/div><div class=\"ln p\">별표 9. 적용가능 사회복지시설의 종류<\/div><table class=\"htbl\"><tr><td rowspan=\"2\">소관부처<\/td><td rowspan=\"2\">시설종류< 설<\/td><td>◦자활지원센터<br>◦성매매피해상담소<\/td><td>｢성매매방지 및 피해자 보호 등에 관한 법률｣<\/td><\/tr><tr><td>성폭력피해보호시설<\/td><td>◦성폭력피해자보호시설<\/td><td>◦성폭력피해상담소<br>◦지역디지털성범죄피해자지원센터<\/td><td>｢성폭력방지 및 피해자 보호 등에 관한 법률｣<\/td><\/tr><tr><td>가정폭력보호시설<\/td><td>◦가정폭력피해자보호시설<\/td><td>◦가정폭력상담소<br>◦긴급전화센터<\/td><td>｢가정폭력방지 및<br>피해자 보호 등에 관한 법률｣<\/td><\/tr><tr><td>한부모가족복지시설<\/td><td>◦출산지원시설<br>◦양육지원시설<br>◦생활지원시설<br>◦일시지원복지시설<\/td><td>◦한부모가족복지상담소<\/td><td>｢한부모가족지원법｣<\/td><\/tr><tr><td>다문화가족지원센터<\/td><td><\/td><td>◦다문화가족지원센터<\/td><td>｢다문화가족지원법｣<\/td><\/tr><tr><td>건강가정지원센터<\/td><td><\/td><td>◦건강가정지원센터<\/td><td>｢건강가정기본법｣<\/td><\/tr><tr><td>청소년복지시설<\/td><td>◦청소년쉼터<br>◦청소년자립지원관<br>◦청소년치료재활센터<br>◦청소년회복지원시설<\/td><td><\/td><td>｢청소년복지 지원법｣<\/td><\/tr><tr><td>통일부<\/td><td>북한이탈주민지원시설<\/td><td><\/td><td>◦북한이탈주민지역적응센터<\/td><td>｢북한이탈주민의 보호 및 정착지원에 관한 법률｣<\/td><\/tr><\/table>", "pages": [{"p": 263, "t": "붙임 2. 2026년 사회복지시설 종사자 인건비 권고기준 (별표1~9)\n5\n2026년도 사회복지시설 종사자 보수 체계\n제1장 총 칙\n제1조(목적) 이 보수지급 기준은 ｢사회복지사업법｣ 제2조 및 ｢노인복지법｣, ｢장애인복지법｣, ｢아동복지법｣ 등 개별 법령의거 설치된 사회복지시설에 근무하는 종사자의 보수에 관하여 필요한 사항을 규정, 권장함으로 종사자의 장기근속을 유도하고 전문성을 높이고 사회복지 증진에 기여함을 목적으로 한다.\n제2조(용어의 정의) 이 기준에서 사용하는 용어의 정의는 다음과 같다.\n1. “보수”라 함은 기본급과 기타 각종 수당을 합산한 금액을 말한다.\n2. “기본급”이라 함은 직무의 곤란성 및 책임의 정도와 재직기간 등에 따라 직급별, 호봉별로 지급되는 기본급여를 말한다.\n3. “수당”이라 함은 직무여건 및 생활여건 등에 따라 지급되는 부가급여를 말한다.\n4. “직종”이라 함은 직무의 전문성 및 성격에 따라 사회복지직(장애인복지관은 이하 “일반직”이라 한다.), 사무직, 의료직, 관리직, 기타 등으로 구분하는 것을 말한다.\n5. “직위”이라 함은 1명의 종사자에게 부여할 수 있는 직무와 책임을 말한다.\n6. “직급”이란 직무의 종류·곤란성과 책임도가 상당히 유사한 직위의 군을 말한다.\n7. “승진”이라 함은 현재의 직급 또는 직책 보다 상위의 직급 또는 직책에 임명하는 것을 말한다.\n8. “승급”이라 함은 일정한 재직기간의 경과에 의하여 현재의 호봉보다 높은 호봉을 부여하는 것을 말한다.\n9. “보수의 일할계산”이라 함은 그 달의 보수를 그 달의 일수로 나누어 계산하는 것을 말한다.\n제3조(적용범위) 사회복지시설 종사자의 보수는 이 기준을 따른다. 단, 별도의 인건비 지급기준 등을 적용받는 종사자는 해당 기준에 의한다.\n제2장 기 본 급\n제4조(기본급)\n1. 사회복지시설 종사자의 월 기본급은 별표1부터 별표4까지의 기본급 권고 기준표를 참고로 하여 지방자치단체 실정에 맞게 지급할 수 있다."}, {"p": 264, "t": "2. 전항의 규정에 의한 종사자의 월 기본급 중 별표1부터 별표4까지의 기준표에 규정된 최고 호봉을 초과하는 경우는 최고 호봉을 적용하고, 당해연도 직위별·호봉별 인상분은 포함하여 지급한다.\n3. 전항의 규정에 의한 기본급 외에 종사자의 처우개선 등을 위하여 필요하다고 인정되는 경우 또는 최고 호봉을 초과하는 경우 지방자치단체장 및 운영법인 등은 자체부담에 의거 별도로 추가액을 확보하여 지급할 수 있다.\n제3장 호봉 획정 및 승급\n제5조(호봉획정 및 승급시행권자) 호봉획정 및 승급은 임용권자가 시행하고, 사회복지시설을 관할하는 지방자치단체장이 해당 사회복지시설 종사자의 재직 관련 서류 등을 통해 확인하여야 한다."}, {"p": 265, "t": "제6조(인정경력) 대상 경력은 사회복지시설 근무경력, 유사경력, 군복무근무경력 등을 말하며, 경력인정의 범위 및 환산율은 ｢사회복지시설 관리안내｣ 중 호봉의 획정 및 승급과 각 시설 유형별 개별지침을 참조하여 준용한다.\n제7조(초임호봉의 획정 및 경력년수 산정)\n1. 종사자를 신규 채용하는 경우에는 초임호봉을 획정한다.\n2. 초임호봉은 1호봉으로 하되, 제6조에 정하여진 근무경력이 있는 경우에는 경력별 근무기간 1년을 각각 1호봉씩으로 하여 초임호봉을 정한다.\n3. 초임호봉의 획정에 반영되지 아니한 1년 미만의 잔여기간이 있을 때는 그 기간을 다음 승급 기간에 산입한다.\n제8조(승급 및 승진)\n1. 호봉 간의 승급에 필요한 기간은 1년으로 하며, 호봉은 매달 1일자로 승급한다. 호봉 승급 산정일 기준, 제7조 제3호에 따른 잔여기간을 포함하여 승급에 필요한 기간을 충족한 경우에는 승급한다.\n2. 승진에 관한 사항은 사회복지직의 경우는 <별표6> 직위별 승진 최소 소요연한에 따라, 사회복지직 외의 직종은 <별표7> 직급별 승진 최소 소요연한에 따라, 기관장의 인사권에 의하여 승진한다. 단, 장애인복지관 일반직(기능직, 고용직 제외)의 승진 최소소요연한은 개별지침 등 별도기준을 적용한다.\n3. 사회복지직의 선임사회복지사로의 승진 및 사회복지직 외 직종의 3급으로의 승진(단, 의료직의 경우 최초 3급을 부여받은 자의 2급 승진 포함)에 필요한 최소 소요 연한을 충족하는 경우 당연승진을 적용하도록 노력하여야 하며, 별도 기준이 있는 경우 이를 우선 적용한다.\n4. 승진에 필요한 “직위 및 직급별 최소 소요연한”이라함은 사회복지직 및 사무직, 의료직, 관리직, 기타 직종 등 모든 직종에 적용되고, 해당 직위에서의 실 근무경력을 말하며, 동일 유형의 시설 또는 동일 법인 내 시설 근무경력을 적용한다. 이 때 동일 유형이란 <별표9>의 세부 종류에 표기된 시설의 세부 유형을 의미한다.\n제9조(승급의 제한) 다음 각 호에 해당하는 자는 해당 기간 동안 승급시킬 수 없다.\n1. 징계처분, 직위해제, 또는 휴직(「남녀고용평등과 일·가정 양립지원에 관한 법률」상의 육아휴직과 업무상 질병으로 인한 휴직은 제외한다.) 중에 있는 자.\n2. 징계처분이 종료된 날로부터 일정 기간(정직：18월, 감봉：12월, 근신 또는 견책：6월)이 경과되지 아니한 자.\n제4장 보수의 지급\n제10조(보수의 지급방법) 보수는 본인에게 직접 현금 또는 요구불 예금으로 지급하되, 출장 기타 부득이한 사유로 인하여 본인에게 직접 지급할 수 없을 때는 본인이 지정하는 자에게 지급할 수 있다.\n1. 보수는 사회서비스정보시스템의 종사자 급여 및 회계 관리를 이용하여 인건비 지급 항목 및 재원별로 급여 대장 및 급여명세서를 입력하는 것을 권장한다.\n제11조(보수계산) 보수는 특별한 규정이 있는 경우를 제외하고는 신규 채용 등의 경우에 있어서 발령일을 기준으로 그 월액을 일할 계산하여 지급한다.\n제12조(보수지급일) 보수는 매월 운영법인에서 따로 정하는 날에 지급할 수 있으며 다만, 지급일이 공휴일인 경우에는 그 전일에 지급한다.\n제5장 수  당\n제13조(수당의 지급) 사회복지시설 종사자의 수당은 <별표8>의 기준표를 참고로 하여 지방자치단체 실정에 맞게 지급할 수 있다.\n1. (명절휴가비) 재직 중인 종사자에게 매년 명절(설, 추석)이 속하는 달에 월 봉급액의 60%를 명절휴가비로 지급한다.\n2. (가족수당) 부양가족 1인당 월 2만원(배우자 4만원, 첫째자녀 5만원, 둘째자녀 8만원, 셋째 이후 자녀 12만원)의 가족수당을 지급한다. 부양가족의 수는 4명 이내로 하되, 자녀의 경우에는 4명을 초과하더라도 가족수당을 지급한다.\n3. (시간외근무수당) 시간외근무에 대해서는 다음 각호에 따라 가산 지급한다.\n가. (연장근로 수당) 통상임금의 100분의 50 이상을 가산하여 지급한다.\n나. (야간근로 수당) 오후 10시부터 다음 날 오전 6시 사이의 근로에 대해서는 통상임금의 100분의 50 이상을 가산하여 지급한다.\n다. (휴일근로 수당) 8시간 이내의 휴일근로에 대해서는 통상임금의 100분의 50 이상을, 8시간을 초과한 휴일근로에 대해서는 통상임금의 100분의 100 이상을 가산하여 지급한다."}, {"p": 266, "t": "4. 제1항에서 제3항까지의 규정에 의한 수당 이외에 해당 사회복지시설의 수행사업과 운영의 특수성을 감안하여 운영법인 및 지방자치단체의 결정에 따라 자체부담 또는 정부보조금으로 별도의 수당규정을 신설하여 지급할 수 있다.\n제6장 퇴직금\n제14조(퇴직금) 사회복지시설 종사자의 퇴직금에 대해서는 ｢근로자퇴직급여 보장법｣에 따른다."}, {"p": 267, "t": "제7장 유급병가\n제15조(유급병가)\n1. 지방자치단체의 장 또는 운영법인·시설 등의 장은 사회복지시설 종사자가 다음 각 호의 어느 하나에 해당할 경우에는 자율적으로 정하는 범위에서 유급병가를 허가할 수 있다. 다만, ‘자율적으로 정하는 범위’는 최소 연 30일 이상이 될 것을 권고한다.\n가. 질병이나 부상으로 인하여 직무를 수행할 수 없을 때\n나. 감염병에 걸려 그 종사자의 출근이 다른 종사자의 건강에 영향을 미칠 우려가 있을 때\n2. 병가 일수가 연간 6일을 초과하는 경우에는 의사의 진단서를 첨부하여야 한다.\n3. 2025년 12월을 기준으로 지자체·시설별로 운영중인 유급병가제도가 있는 경우, 본 조항을 이유로 유급병가의 기간·조건 등을 종사자에게 불리하게 변경하지 않도록 하며, 구체적인 내용은 지자체·시설별 개별 지침 등을 마련하여 운영할 수 있다.\n제8장  보  칙\n제16조(종사자 처우수준 향상) 2026년 사회복지시설 종사자의 보수수준이 2025년에 비해 낮아지지 않도록 한다.\n별표 1. 2026년 사회복지시설(생활시설, 이용시설) 종사자 기본급 권고 기준\n(단위: 원/월)\n직위 (호봉) | 생활시설 | 원장 | - | 사무국장 | 과장, 생활복지사 | 선임 생활지도원 | 생활지도원 | - | 관리직 | 기능직\n(사회,노인) 이용시설_사회복지직 | 관장 | - | 부장 | 과장 | 선임 사회복지사 | 사회복지사 | - | - | -\n(장애인)이용시설_일반직 | 관장 | 사무국장 | 1급 | 2급 | 3급 | 4급 | 5급 | - | -\n1호봉 | 2,980,600 | 2,814,200 | 2,683,200 | 2,477,200 | 2,360,100 | 2,281,800 | 2,232,300 | 2,225,400 | 2,197,000\n2호봉 | 3,082,400 | 2,906,400 | 2,769,600 | 2,538,600 | 2,416,400 | 2,324,300 | 2,296,400 | 2,264,500 | 2,222,100\n3호봉 | 3,186,800 | 3,011,200 | 2,870,500 | 2,606,200 | 2,485,000 | 2,366,500 | 2,335,000 | 2,308,600 | 2,261,100\n4호봉 | 3,305,300 | 3,113,700 | 2,973,900 | 2,712,200 | 2,553,200 | 2,411,500 | 2,380,400 | 2,351,200 | 2,302,700\n5호봉 | 3,440,900 | 3,230,900 | 3,095,900 | 2,824,500 | 2,621,900 | 2,475,400 | 2,439,000 | 2,399,600 | 2,343,500\n6호봉 | 3,582,800 | 3,358,400 | 3,221,100 | 2,940,500 | 2,717,800 | 2,538,700 | 2,509,400 | 2,440
