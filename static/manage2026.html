n사회복지시설에 대한 지도･감독 내실화\n국가청렴위원회 권고사항(ʼ06.12월)으로 각 지자체의 정기감사 또는 수시점검 시 반영토록 할 것\n‒비리 취약분야 지도･점검 강화\n•회계(보조금, 후원금, 수익사업), 계약(공사, 구매), 자산관리(부동산, 장비 등) 등 취약업무와 사회서비스정보시스템(희망이음) 및 별도 전산시스템의 회계, 후원, 시군구 보고 등 활용도를 점검 항목으로 설정\n‒합동점검반 편성･운영\n•시설공사, 설비구축 등 전문성이 필요한 분야와 회계, 계약 등 비리행위 관련 점검 시에는 특성을 감안, 관련부서와 감사부서 관계자를 포함하는 등 합동 점검을 실시\n국민권익위원회 권고(ʼ10.4월) 사항을 반영하여 지도･점검의 실효성을 강화할 것\n‒‘시민명예감사관’을 구성하여 시설 점검 시 합동점검 실시\n‒점검분야별로 구체적 매뉴얼을 마련하고 시설장･직원 등의 위반행위에 대한 처벌 등 교육 실시\n※시･도별로 시･군･구 담당자와 상의, 구체적 점검매뉴얼 및 체크 리스트 마련\n‒분기별 정산보고 시 시설 현금출납부 등을, 결산보고 시 법인 감사보고서를 제출받아 지도･점검 시 상세자료로 활용\n‒회계분야 전문성을 감안하여 감사담당 부서에서 시설 결산보고서 회계검사 실시\n‒시설 재정운영에 심각한 문제가 있거나 전문가 검사가 필요하다고 판단되는 경우 추가 외부회계검사 의뢰\n※\n예시\n보조금 수령 및 집행내역, 후원금 접수 및 사용현황 등\n‒회계검사 결과를 해당시설 보조금 지급, 재위탁 심사 시 반영\n※\n예시\n우수시설 인센티브 제공, 미흡시설 보조금 삭감 등 평가결과 반영"}, {"p": 61, "t": "공무원의 사회복지법인･시설 재취업 공무원과 사적 접촉 방지 법령 신설 안내 (2021 국민권익위 사회복지지설 위탁운영 제도개선 권고반영)\n공직자의 이해충돌방지법\n제15조(퇴직자 사적 접촉 신고) ① 공직자는 직무관련자인 소속 기관의 퇴직자(공직자가 아니게 된 날부터 2년이 지나지 아니한 사람만 해당한다)와 사적 접촉(골프, 여행, 사행성 오락을 같이 하는 행위를 말한다)을 하는 경우 소속기관장에게 신고하여야 한다. 다만, 사회상규에 따라 허용되는 경우에는 그러하지 아니하다. (2022.5.19.시행)\n감사 및 지도감독\n종 류 | 대상 | 주      기 | 실시기관\n∙정기지도감독 ‑조직운영 전반 ‑회계감사 | 법인 | 최소 매 3년마다 1회 | 시･도지사(위임기관) 또는 시･군･구청장\n시설 | 연 1회 이상\n∙수시 지도점검 | 시설 | 필요시(입퇴소 실태, 생활실태) | 시･군･구청장\n∙특별지도감독 | 법인 시설 | 진정, 투서, 언론보도, 비리발생, 인권침해, 행정처분이나 지적사항 미이행 등 주무관청이 지도감독 필요성이 있다고 판단한 경우 | 보건복지부장관 시･도지사 시･군･구청장\n※ 시･도지사 또는 시･군･구청장은 정기지도감독, 수시 지도점검, 특별지도감독 등 감사 및 지도감독 결과를 사회보장정보시스템(행복이음)에 입력･관리\n나\n미신고시설 상시 관리･감독\n1)업무체계\n보건복지부 각 시설 담당부서와 시･도 및 시･군･구의 시설담당 부서는 미신고시설과 관련한 상시관리 및 보고체계 유지\n‒시･도 및 시･군･구 시설담당부서에서는 기초생활보장 담당부서 등 관련부서와 공조체계를 구축할 것\n※「미신고시설 양성화 정책」 추진과정에서 조사된 미신고시설은 법정신고시설로 전환하도록 최대한 독려하고 고의적으로 거부 또는 회피하는 시설은 관련 법에 따라 행정조치"}, {"p": 62, "t": "2)기초생활보장수급자 DB 검색을 통한 미신고시설 조사\n조사방법\n‒보장기관(시･군･구)은 기초생활보장수급자 확인조사 시 중점 관리대상가구에 아래의 경우를 포함하여 정기･수시조사에 포함하여 감독강화할 것\n중점 관리대상가구\n해당 지자체 시설담당부서에서 관리하는 미신고시설 복지행정시스템상 기초생활보장 수급자의 주소지 검색하여, 동일 주소지에 동일 보장가구원이 아닌 자가 5인* 이상 거주하는 가구 *주민들의 제보나 여러 정황으로 조사가 필요한 가구에 대하여는 5인 미만 가구라 하더라도 중점 관리대상가구에 포함하여 관리할 것\n조사결과 조치사항\n‒(기초생활보장 담당자) 동일 보장가구원이 아닌 자가 5인 이상 함께 거주하는 것을 발견 시, 해당 지자체 시설담당 공무원에게 통보\n‒(시설담당자) 해당 지자체 시설담당 공무원은 현장확인후 미신고시설 등 불법 시설일 경우, 수급자에게 불법시설임을 고지하고, 보장시설 안내 및 입소를 유도하되, 단, 자립생활이 가능한 경우에는 자립지원 관련 서비스 등을 적극 연계\n‒(행정처분 등) 미신고불법시설에 대하여 폐쇄조치(법 제40조제1항제5호)를 명할 수 있으며, 신고를 하지 아니하고 시설을 설치･운영한 자는 1년 이하의 징역 또는 1천만 원 이하의 벌금 부과대상임(법 제54조제3호)\n3)공공조직을 통한 후원 또는 지원 시 신고시설 여부 확인\n시･군･구, 공동모금회 등 공공적인 조직을 통한 후원･지원 시 다수인이 거주하는 시설의 경우 신고 여부를 확인\n‒확인 결과 미신고시설인 경우 후원, 지원 일체 금지 및 행정처분 실시"}, {"p": 63, "t": "참고: 사회복지시설 담당 관련 교육 안내\n※ ’24년도 교육일정은 교육기관에서 추후 안내 예정 한국보건복지인재원 구분 | 교육대상 | 교육과정명 | 교육내용\n집합 | 지자체 담당공무원 (6~9급) | 2년차 이하 신규자 | 사회복지법인 및 시설관리기본과정 | 정책 방향 및 관련 법제 관련 종사자 운영 실태 사례 재무회계규칙 이해 및 적용\n2년차 이상 경력자 | 사회복지법인 및 시설관리심화과정 | 정책 방향 및 관련 법제 이사회 관리 및 시설 재산 관리 재무관리 및 회계시스템 이해 현지조사점검 및 관리\n사회복지 법인및시설 종사자 | 회계업무 담당자 | 사회복지법인 및 시설재정관리과정 | 재무회계규칙 세입세출관리 후원금관리 등\n안전업무 담당자 | 사회복지시설 안전관리심화과정 | 사회복지시설 위기상황 행동 요령 사회복지시설 안전관리 이해 실제활동 등 안전 업무 전반\n사회복지시설 종사자 및 담당공무원 | 사회복지시설종사자 디지털역량강화기본과정 | 디지털 사회복지 기술 필요성 및 동향 디지털 사회복지 실천사례\n사회복지시설종사자 디지털역량강화심화과정 | 디지털 운용 기술 접목 디지털 사회복지 실천 역량 강화\n이러닝 | 공통 | 사회복지시설 종사자의인권 | 시설종사자 인권 현황 탐색 시설종사자 인권 향상 방안 모색\n사회복지시설 안전관리, 이것만 알면 끝! | 안전관리 제도의 이해 사회복지시설 화재 대처 방법 안전관리계획을 위한 소방계획서 작성\n장애인거주시설 안전관리 | 장애인거주시설 피난매뉴얼의 이해 장애인거주시설 안전관리 계획과 시나리오 만들기\n디지털사회복지 동향 및 사례읽기 (사회복지시설) | 디지털 사회복지 기술 필요성 디지털 사회복지 실천사례 ※ 교육계획 및 운영 상황에 따라 교육과정 내용은 변경될 수 있음 ※ 교육문의; 한국보건복지인재원(집합: 043-710-9044 / 이러닝: 1600-8810) 한국사회복지협의회 교육대상 | 교육과정분야 | 교육내용\n사회복지 시설종사자 | 조직운영 담당자 | 사회복지 조직운영과정 | 사회복지 정책 및 트렌드 이해 사회복지조직 운영기획 및 성과관리 지역조직화 및 자원개발관리\n사회복지 서비스 담당자 | 사회복지프로그램 운영과정 | 사회복지프로그램 트렌드 이해 사회복지프로그램 기획, 모니터링 및 평가\n사회복지사례관리과정 | 사회복지사례관리 이해와 평가 사회복지사례관리 슈퍼비전 사회복지면담\n인사노무 담당자 | 사회복지 인사･노무관리과정 | 노동관계법령 및 제도 이해 사회복지 인사 기획･관리 취업규칙, 휴일 제도 관리, 임금 계산 방법 등\n예산･ 회계업무 담당자 | 사회복지 예산･재무관리과정 | 사회복지시설 재무회계 규칙 이해 예산편성, 세입･세출관리, 후원금 관리 근로소득 및 연말정산 작성 등\n안전업무 담당자(지자체 담당 공무원 포함) | 사회복지시설 안전 및 유지관리 관련 교육 | 시설물 안전관리 전기·가스·화재 등 재난예방 교육 ※ 국토안전관리원에서 총괄 운영(소규모 취약시설 안전관리 시스템)\n공통 | 디지털 역량강화 기본과정 | 디지털 사회복지 기술 필요성 및 동향 디지털 기기 사용 권리 침해 및 대응방법 사회복지 디지털 리터러시 교육\n스마트워크 디지털 역량강화 과정 | 사회복지 현장 디지털 기기 도입･활용 사례 디지털 사회복지서비스, 홍보 직무 등 디지털 플랫폼 활용 실습 교육\n디지털 생활 역량강화 과정 | 보이스피싱 예방, 키오스크 활용, 스마트폰 유용한 앱 활용 실습 교육\n사회복지 디지털 교육 강사 육성 과정 | 디지털 역량 전수 디지털 교수법 교육\n의무교육 | 4대 의무교육(개인정보, 인권, 성희롱, 소방안전), 노인학대 예방 및 신고자의무 교육 등 ※ 교육계획 및 운영 상황에 따라 교육과정 내용은 변경될 수 있음 ※ 교육문의: 한국사회복지협의회(02-2077-3944)\n"}]}, {"title": "9. 사회복지시설 평가", "start": 65, "end": 68, "html": "<div class=\"pchip\" id=\"p65\"><span>원문 65쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=77\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">9<\/span>사회복지시설 평가<\/div><div class=\"ln note\">※「사회복지사업법 시행규칙」 제27조의2 제4항의 규정에 따라 평가의 방법 기타 평가에 관하여 필요한 사항을 정하기 위함. 노인요양시설, 지역아동센터 등의 평가는 개별법이나 지침에 따름<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">추진경위<\/div><div class=\"ln p\">「사회복지사업법」 제43조의2제1항 및 동법 시행규칙 제27조의2제1항의 규정에 따라 3년마다 사회복지시설 평가 의무화<\/div><div class=\"ln p\">사회복지시설 평가를 전문기관에 위탁할 수 있는 법적 근거 마련(2004년 「사회복지사업법 시행령」 개정)<\/div><div class=\"ln p\">2025∼2027 사회복지시설 평가<\/div><table class=\"htbl\"><tr><td>평가년도<\/td><td>평가대상시설<\/td><\/tr><tr><td>2025<\/td><td>아동생활시설, 장애인거주시설, 장애인직업재활시설, 장애인단기거주시설<\/td><\/tr><tr><td>2026<\/td><td>장애인복지관, 정신요양시설, 정신재활시설, 노숙인생활시설, 장애인공동생활가정, 아동공동생활가정 및 학대피해아동쉼터, 정신재활공동생활가정<\/td><\/tr><tr><td>2027<\/td><td>사회복지관, 노인복지관, 양로시설<\/td><\/tr><\/table><div class=\"ln note\">※연도별 평가대상 시설은 변경될 수 있음<\/div><div class=\"ln p\">추진주체별 역할<\/div><div class=\"ln p\">보건복지부(중앙)<\/div><div class=\"ln p\">시･도(지방)<\/div><div class=\"ln p\">사회복지시설 평가 정책 총괄 및 제도 개선 사회복지시설 평가 계획 수립 평가대상시설 확정 사회복지시설 평가 및 사후관리 평가지표 개발 및 확정 평가결과 분석･공개･활용<\/div><div class=\"ln p\">평가대상시설 확인 및 시설통보 현장평가위원 추천(학계, 공무원, 현장) 현장평가 예산 확보･지급(평가위원 수당 등) 행정처분사항 확인 등 평가업무 관련 시･도 해당사항 추진 ※ 복지부와 협의･연계 평가결과 활용<\/div><div class=\"pchip\" id=\"p66\"><span>원문 66쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=78\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">시설평가 실시<\/div><div class=\"ln p\">2026년도 평가대상시설 유형<\/div><div class=\"ln p\">‒장애인복지관, 정신요양시설, 정신재활시설, 노숙인생활시설, 장애인공동생활가정, 아동공동생활가정 및 학대피해아동쉼터, 정신재활공동생활가정<\/div><div class=\"ln p\">평가대상시설 선정 기준<\/div><div class=\"ln p\">‒2023년 1월 1일 이전 최초 설치된 3년 이상 운영시설<\/div><div class=\"ln note\">※평가는 법적 의무사항으로 운영주체, 보조금 지원여부 등은 대상시설 선정과 관계없음<\/div><div class=\"ln p\">‒운영기간이 3년 미만이나 시설 및 지자체에서 평가를 요구하는 경우<\/div><div class=\"ln note\">※평가의 실효성을 위해 최소 1년 이상 운영한 경우에만 해당하며 복지부와 협의 필요<\/div><div class=\"ln p\">평가대상시설 선정 절차<\/div><table class=\"htbl\"><tr><td>대상시설 추출<\/td><td rowspan=\"3\">⇨<\/td><td>대상시설<br>확인요청<\/td><td rowspan=\"3\">⇨<\/td><td>대상시설 회신<\/td><td rowspan=\"3\">⇨<\/td><td>대상시설 검토<\/td><td rowspan=\"3\">⇨<\/td><td>대상시설 확정<\/td><td rowspan=\"3\">⇨<\/td><td>평가대상 통보<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>복지부<\/td><td>복지부<br>￫ 지자체<\/td><td>지자체<br>￫ 복지부<\/td><td>복지부<\/td><td>복지부<br>￫ 지자체<\/td><td>지자체<br>￫ 시설<\/td><\/tr><\/table><div class=\"ln p\">평가대상시설 제외 기준<\/div><div class=\"ln p\">‒2023년 1월 1일 이후 최초 설치된 3년 미만 신규시설<\/div><div class=\"ln note\">※운영주체 변경 등으로 신고번호가 ʼ23년 이후로 변경된 시설은 제외대상이 아니며, 시설신고번호와 설립일자는 참고용으로 실제 운영기간을 확인하여 대상선정<\/div><div class=\"ln p\">‒평가실시 전 폐지 또는 타 유형 변경으로 평가가 불가능한 경우<\/div><div class=\"ln p\">‒천재지변, 화재로 인한 자료소실 등으로 평가 수행이 불가능한 경우 (증빙첨부필수)<\/div><div class=\"ln p\">‒평가대상기간 3년 중 2년 이상 휴지 시설(증빙첨부필수)<\/div><div class=\"ln p\">평가제외 신청 방법<\/div><div class=\"ln p\">‒평가대상시설의 폐지, 휴지, 천재지변 등의 사유로 평가가 불가능한 경우 소관 시･도에서 보건복지부로 제외 요청 공문 발송(증빙첨부필수)<\/div><div class=\"ln p\">평가대상기간：2023년 1월 1일 ∼ 2025년 12월 31일<\/div><div class=\"ln p\">‒2년 미만 휴지시설은 휴지기간에 따라 평가대상 기간이 다르게 적용<\/div><div class=\"ln p\">‒법인 등 운영주체가 변경된 시설은 평가대상기간 3년 적용<\/div><div class=\"ln p\">평가항목<\/div><div class=\"pchip\" id=\"p67\"><span>원문 67쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=79\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">‒시설유형 및 규모에 따라 4~5개 평가영역으로 구성<\/div><table class=\"htbl\"><tr><td>구분<\/td><td>A영역<\/td><td>B영역<\/td><td>C영역<\/td><td>D영역<\/td><td>E영역<\/td><\/tr><tr><td>일반시설<\/td><td>조직운영<\/td><td>재정 및 인적자원 관리<\/td><td>프로그램<br>및 서비스<\/td><td>이용자의 권리<\/td><td>이용자의 변화<\/td><\/tr><tr><td>공동생활가정<\/td><td>조직운영<\/td><td>이용자의 권리<\/td><td>프로그램<br>및 서비스<\/td><td>시설운영 전반<\/td><td>-<\/td><\/tr><\/table><div class=\"ln p\">평가절차<\/div><table class=\"htbl\"><tr><td>자체평가<\/td><td rowspan=\"3\">⇨<\/td><td>현장평가<\/td><td rowspan=\"3\">⇨<\/td><td>확인평가<\/td><td rowspan=\"3\">⇨<\/td><td>평가결과 공개<\/td><td rowspan=\"3\">⇨<\/td><td>우수･미흡시설 사후관리<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>시설<\/td><td>지자체<\/td><td>복지부<\/td><td>복지부<\/td><td>복지부<\/td><\/tr><\/table><div class=\"ln note\">※ 사회복지시설 평가는 자체평가에서 평가결과 통보까지 희망이음으로 진행<\/div><div class=\"ln note\">※ 평가 결과분석 및 이의신청 등에 따라 추가 확인이 필요한 경우 확인평가 실시<\/div><div class=\"ln p\">평가결과 및 공개<\/div><div class=\"ln p\">- 평가결과는 보건복지부 누리집(http://www.mohw.go.kr)에 공개<\/div><div class=\"ln p\">‒평가지표 영역별로 환산점수에 따라 등급을 부여하고, 이를 종합하여 최종 등급 부여<\/div><div class=\"ln p\">‒사회복지사업법 및 개별법에 따라, 행정처분을 받은 경우 소관 지자체를 통해 확인 후 점수 반영(감점)됨<\/div><div class=\"ln note\">※ 평가결과 공개 시 행정처분으로 인한 감점 영역과 평가 거부시설 명단 공개<\/div><div class=\"ln p\">- 시설 대표자‧종사자가 시설 이용자 대상으로 성범죄‧학대 등의 범죄를 저질러 ‘금고 이상의 형’을 선고받은 경우, 해당 시설은 평가결과를 F등급으로 처리<\/div><div class=\"ln p\">‒ 평가기간 중에 이용자 인권침해 관련 문제로 언론보도, 수사․조사․ 후속조치(운영주체 변경 등)가 진행 중이거나, 행정처분 받은 시설은 평가결과(등급) 공개가 보류(비공개)될 수 있음<\/div><div class=\"ln note\">※ 평가결과 공개보류 대상시설은 평가결과를 제외한 시설명 및 보류사실만 공개<\/div><div class=\"pchip\" id=\"p68\"><span>원문 68쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=80\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">평가결과 사후관리<\/div><div class=\"ln p\">평가결과 우수시설에 인센티브를 지원하여 동기를 부여하고, 운영개선이 필요한 미흡시설에는 컨설팅 지원 등 사후관리를 통한 서비스 품질수준 제고(ʼ09년~)<\/div><div class=\"ln p\">대상시설 및 지원 내용<\/div><table class=\"htbl\"><tr><td>평가우수시설<br>및 개선시설<\/td><td>금전적 인센티브<br><table class=\"htbl\"><tr><td>구분<\/td><td>우수시설<\/td><td>개선시설<\/td><\/tr><tr><td>대상<\/td><td>총점기준 상위 5% 내외<\/td><td>이전 평가대비 개선점수 기준상위 3% 내외<\/td><\/tr><tr><td>지원내용<\/td><td>시설당 7,000천원<\/td><td>시설당 3,500천원<\/td><\/tr><\/table><br>*소규모 시설(공동생활가정, 장애인단기거주시설)과 평가대상기간 예외 적용 시설은 시설 규모 등을 고려하여 금액 차등적용<br>비금전적 인센티브 : ‘사회복지의 날’ 포상 추천<\/td><\/tr><tr><td>평가미흡시설<\/td><td>영역별 C등급 이하시설 대상 역량강화교육 제공<br>운영개선이 필요한 품질관리 대상(D, F등급) 맞춤형 컨설팅 제공<br>평가우수시설 방문 기회 제공 및 품질관리 지원<br>*컨설팅참여인력：우수평가시설 관계자, 관련학계전문가 등<\/td><\/tr><\/table><div class=\"ln p\">인센티브 제외 사유<\/div><div class=\"ln p\">‒평가대상 기간부터 지급 기준일까지 사회복지사업법 및 개별법령 위반으로 과태료 또는 행정처분 받은 시설<\/div><div class=\"ln p\">‒수사 중이거나 형사처벌 받은 시설<\/div><div class=\"ln p\">‒부도덕한 행위 등으로 사회적 물의를 야기하거나, 언론보도 또는 소송･민원 제기 등의 논란이 있어 우수시설 인센티브 지급이 부적절하다고 판단되는 시설<\/div><div class=\"ln p\">‒전체 및 영역별 미흡시설(D, F등급)<\/div><div class=\"ln p\">시･도 및 시･군･구 협조 사항<\/div><div class=\"ln p\">‒각 지자체는 평가결과를 시설 지도･감독 등에 반영하여 업무추진<\/div><div class=\"ln note\">※ 특히, 전체 및 영역별 미흡시설(D, F등급)에 대해서는 중점적인 지도․감독 실시<\/div><div class=\"ln p\">‒미흡시설 품질관리를 위한 방문 컨설팅에는 지자체 시설 담당 공무원이 직접 참여<\/div><div class=\"ln p\">‒연속 평가결과 미흡시설 및 평가거부 시설 소관 지자체는 지자체 차원의 개선계획을 수립･이행한 결과를 보건복지부(시설 담당과)에 보고<\/div>", "pages": [{"p": 65, "t": "9\n사회복지시설 평가\n※「사회복지사업법 시행규칙」 제27조의2 제4항의 규정에 따라 평가의 방법 기타 평가에 관하여 필요한 사항을 정하기 위함. 노인요양시설, 지역아동센터 등의 평가는 개별법이나 지침에 따름\n가\n추진경위\n「사회복지사업법」 제43조의2제1항 및 동법 시행규칙 제27조의2제1항의 규정에 따라 3년마다 사회복지시설 평가 의무화\n사회복지시설 평가를 전문기관에 위탁할 수 있는 법적 근거 마련(2004년 「사회복지사업법 시행령」 개정)\n2025∼2027 사회복지시설 평가\n평가년도 | 평가대상시설\n2025 | 아동생활시설, 장애인거주시설, 장애인직업재활시설, 장애인단기거주시설\n2026 | 장애인복지관, 정신요양시설, 정신재활시설, 노숙인생활시설, 장애인공동생활가정, 아동공동생활가정 및 학대피해아동쉼터, 정신재활공동생활가정\n2027 | 사회복지관, 노인복지관, 양로시설\n※연도별 평가대상 시설은 변경될 수 있음\n추진주체별 역할\n보건복지부(중앙)\n시･도(지방)\n사회복지시설 평가 정책 총괄 및 제도 개선 사회복지시설 평가 계획 수립 평가대상시설 확정 사회복지시설 평가 및 사후관리 평가지표 개발 및 확정 평가결과 분석･공개･활용\n평가대상시설 확인 및 시설통보 현장평가위원 추천(학계, 공무원, 현장) 현장평가 예산 확보･지급(평가위원 수당 등) 행정처분사항 확인 등 평가업무 관련 시･도 해당사항 추진 ※ 복지부와 협의･연계 평가결과 활용"}, {"p": 66, "t": "나\n시설평가 실시\n2026년도 평가대상시설 유형\n‒장애인복지관, 정신요양시설, 정신재활시설, 노숙인생활시설, 장애인공동생활가정, 아동공동생활가정 및 학대피해아동쉼터, 정신재활공동생활가정\n평가대상시설 선정 기준\n‒2023년 1월 1일 이전 최초 설치된 3년 이상 운영시설\n※평가는 법적 의무사항으로 운영주체, 보조금 지원여부 등은 대상시설 선정과 관계없음\n‒운영기간이 3년 미만이나 시설 및 지자체에서 평가를 요구하는 경우\n※평가의 실효성을 위해 최소 1년 이상 운영한 경우에만 해당하며 복지부와 협의 필요\n평가대상시설 선정 절차\n대상시설 추출 | ⇨ | 대상시설 확인요청 | ⇨ | 대상시설 회신 | ⇨ | 대상시설 검토 | ⇨ | 대상시설 확정 | ⇨ | 평가대상 통보\n |  |  |  |  | \n복지부 | 복지부 ￫ 지자체 | 지자체 ￫ 복지부 | 복지부 | 복지부 ￫ 지자체 | 지자체 ￫ 시설\n평가대상시설 제외 기준\n‒2023년 1월 1일 이후 최초 설치된 3년 미만 신규시설\n※운영주체 변경 등으로 신고번호가 ʼ23년 이후로 변경된 시설은 제외대상이 아니며, 시설신고번호와 설립일자는 참고용으로 실제 운영기간을 확인하여 대상선정\n‒평가실시 전 폐지 또는 타 유형 변경으로 평가가 불가능한 경우\n‒천재지변, 화재로 인한 자료소실 등으로 평가 수행이 불가능한 경우 (증빙첨부필수)\n‒평가대상기간 3년 중 2년 이상 휴지 시설(증빙첨부필수)\n평가제외 신청 방법\n‒평가대상시설의 폐지, 휴지, 천재지변 등의 사유로 평가가 불가능한 경우 소관 시･도에서 보건복지부로 제외 요청 공문 발송(증빙첨부필수)\n평가대상기간：2023년 1월 1일 ∼ 2025년 12월 31일\n‒2년 미만 휴지시설은 휴지기간에 따라 평가대상 기간이 다르게 적용\n‒법인 등 운영주체가 변경된 시설은 평가대상기간 3년 적용\n평가항목"}, {"p": 67, "t": "‒시설유형 및 규모에 따라 4~5개 평가영역으로 구성\n구분 | A영역 | B영역 | C영역 | D영역 | E영역\n일반시설 | 조직운영 | 재정 및 인적자원 관리 | 프로그램 및 서비스 | 이용자의 권리 | 이용자의 변화\n공동생활가정 | 조직운영 | 이용자의 권리 | 프로그램 및 서비스 | 시설운영 전반 | -\n평가절차\n자체평가 | ⇨ | 현장평가 | ⇨ | 확인평가 | ⇨ | 평가결과 공개 | ⇨ | 우수･미흡시설 사후관리\n |  |  |  | \n시설 | 지자체 | 복지부 | 복지부 | 복지부\n※ 사회복지시설 평가는 자체평가에서 평가결과 통보까지 희망이음으로 진행\n※ 평가 결과분석 및 이의신청 등에 따라 추가 확인이 필요한 경우 확인평가 실시\n평가결과 및 공개\n- 평가결과는 보건복지부 누리집(http://www.mohw.go.kr)에 공개\n‒평가지표 영역별로 환산점수에 따라 등급을 부여하고, 이를 종합하여 최종 등급 부여\n‒사회복지사업법 및 개별법에 따라, 행정처분을 받은 경우 소관 지자체를 통해 확인 후 점수 반영(감점)됨\n※ 평가결과 공개 시 행정처분으로 인한 감점 영역과 평가 거부시설 명단 공개\n- 시설 대표자‧종사자가 시설 이용자 대상으로 성범죄‧학대 등의 범죄를 저질러 ‘금고 이상의 형’을 선고받은 경우, 해당 시설은 평가결과를 F등급으로 처리\n‒ 평가기간 중에 이용자 인권침해 관련 문제로 언론보도, 수사․조사․ 후속조치(운영주체 변경 등)가 진행 중이거나, 행정처분 받은 시설은 평가결과(등급) 공개가 보류(비공개)될 수 있음\n※ 평가결과 공개보류 대상시설은 평가결과를 제외한 시설명 및 보류사실만 공개"}, {"p": 68, "t": "다\n평가결과 사후관리\n평가결과 우수시설에 인센티브를 지원하여 동기를 부여하고, 운영개선이 필요한 미흡시설에는 컨설팅 지원 등 사후관리를 통한 서비스 품질수준 제고(ʼ09년~)\n대상시설 및 지원 내용\n평가우수시설 및 개선시설 | 금전적 인센티브 구분 | 우수시설 | 개선시설\n대상 | 총점기준 상위 5% 내외 | 이전 평가대비 개선점수 기준상위 3% 내외\n지원내용 | 시설당 7,000천원 | 시설당 3,500천원 *소규모 시설(공동생활가정, 장애인단기거주시설)과 평가대상기간 예외 적용 시설은 시설 규모 등을 고려하여 금액 차등적용 비금전적 인센티브 : ‘사회복지의 날’ 포상 추천\n평가미흡시설 | 영역별 C등급 이하시설 대상 역량강화교육 제공 운영개선이 필요한 품질관리 대상(D, F등급) 맞춤형 컨설팅 제공 평가우수시설 방문 기회 제공 및 품질관리 지원 *컨설팅참여인력：우수평가시설 관계자, 관련학계전문가 등\n인센티브 제외 사유\n‒평가대상 기간부터 지급 기준일까지 사회복지사업법 및 개별법령 위반으로 과태료 또는 행정처분 받은 시설\n‒수사 중이거나 형사처벌 받은 시설\n‒부도덕한 행위 등으로 사회적 물의를 야기하거나, 언론보도 또는 소송･민원 제기 등의 논란이 있어 우수시설 인센티브 지급이 부적절하다고 판단되는 시설\n‒전체 및 영역별 미흡시설(D, F등급)\n시･도 및 시･군･구 협조 사항\n‒각 지자체는 평가결과를 시설 지도･감독 등에 반영하여 업무추진\n※ 특히, 전체 및 영역별 미흡시설(D, F등급)에 대해서는 중점적인 지도․감독 실시\n‒미흡시설 품질관리를 위한 방문 컨설팅에는 지자체 시설 담당 공무원이 직접 참여\n‒연속 평가결과 미흡시설 및 평가거부 시설 소관 지자체는 지자체 차원의 개선계획을 수립･이행한 결과를 보건복지부(시설 담당과)에 보고"}]}, {"title": "10. 사회복무제도", "start": 69, "end": 76, "html": "<div class=\"pchip\" id=\"p69\"><span>원문 69쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=81\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">10<\/span>사회복무제도<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회복무제도의 의의<\/div><div class=\"ln p\">사회복무요원 지원 취지<\/div><div class=\"ln p\">‒사회복지시설에 대한 사회복무요원 지원취지는 노인, 장애인 등 사회취약 계층의 사회서비스 수요에 대응하여 필요한 인력을 지원함으로써 ‘사회복지시설의 인력난을 경감’하고 ‘사회서비스의 질을 개선’하는 데 있음<\/div><div class=\"ln p\">사회복무요원 지원 원칙<\/div><div class=\"ln p\">1.노동시장 중립성의 원칙사회복지시설에 대한 사회복무요원 지원으로 사회복지 분야의 고용시장을 잠식하지 않아야 함. 이는 사회복지시설 등에 사회복무요원을 지원하기 위하여 2007년 2월 보건복지부, 국방부 등 6개 부처 합동으로 발표한 ‘비전2030 인적자원 활용 「2+5」 전략’에 있는 기본원칙으로 사회복무요원 지원으로 인해 고용 인력이 감축되지 않아야 할 뿐만 아니라, 신규 고용을 대체할 목적으로 사회복무요원을 활용해서도 안 된다는 원칙임.<\/div><div class=\"ln p\">2.공익성의 원칙사회복무요원은 공공의 이익을 위하여 지원되어야 함. 그러므로 사익을 추구하는 개인 또는 법인에게 지원해줄 수 없고 공공기관이나 공익성을 추구하는 시설이라도 영리목적 분야에 지원할 수 없음.<\/div><div class=\"ln p\">3.필요성의 원칙공익성에 부합하더라도 사회복무요원 지원이 불가피한 경우에 한하여 지원할 수 있음. 단순하게 ‘있어도 그만 없어도 그만인 기관’이 지원요청을 할 경우 지원을 하여서는 안 됨.<\/div><div class=\"ln p\">4.병역의 숭고성의 원칙병역은 국가에 대한 무한한 자기희생과 충성심의 발로에서 비롯되는 숭고한 국민의 의무임. 그러므로 병역을 단순히 ‘값싼 노동력 제공원’으로 인식하여 사회복무요원을 단순 노무(노역)에 종사 시키거나, 제품생산, 판매 등 영리성 업무에 복무하게 하여서는 안 됨.<\/div><div class=\"pchip\" id=\"p70\"><span>원문 70쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=82\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">보건복지분야 사회복무요원<\/div><div class=\"ln p\">보건복지분야 사회복무요원의 정의<\/div><div class=\"ln p\">‒국가기관, 지방자치단체, 공공단체 및 사회복지시설의 공익목적 수행에 필요한 사회복지, 보건･의료 등의 사회서비스업무 및 행정업무 등의 지원을 위하여 소집되어 공익분야에 복무하는 병역자원<\/div><div class=\"ln p\">보건복지분야 사회복무요원 복무분야 및 업무<\/div><table class=\"htbl\"><tr><td>구 분<\/td><td>복무분야<\/td><td>주요업무<\/td><\/tr><tr><td>사회복지시설<br>운영지원<\/td><td>사회복지시설<\/td><td>노인･장애인 등의 활동･목욕･취식 등 신체활동 지원, 정서 및 프로그램 운영지원, 가사 및 생활지원<\/td><\/tr><tr><td>지방자치단체 사회복지업무지원<\/td><td>지방자치단체<\/td><td>저소득층 물품전달, 시설 운영, 기탁처 관리 등 사회복지 담당업무 지원<\/td><\/tr><tr><td>국민건강 보호･증진 업무지원<\/td><td>국립검역소, 보건(지)소<\/td><td>방역･소독･식품위생 등 주민건강을 위한 보건위생 지원<\/td><\/tr><tr><td>환자 구호업무 지원<\/td><td>국공립병원, 지방의료원 등<\/td><td>의료물품 및 환자 이송, 약품 관리 등 환자 및 의료활동 지원<\/td><\/tr><\/table><div class=\"ln p\">보건복지분야 사회복무요원 인력경비 부담 주체<\/div><div class=\"ln p\">‒’22년부터 사회복지시설 및 지자체에 배치되는 보건복지분야 사회복무요원의 보수 등 인력경비는 지방이양(규모 2,346억, 5년간 보전)<\/div><div class=\"ln note\">※ 국회 재정분권특별위원회 당･정･청 전체회의에서 ’2단계 재정분권 추진방향‘ 확정(‘21.7월)<\/div><table class=\"htbl\"><tr><td rowspan=\"2\">경비내역<\/td><td colspan=\"4\">복무기관<\/td><\/tr><tr><td>공공단체<\/td><td>복지시설<\/td><td>지자체<\/td><td>국가기관<\/td><\/tr><tr><td>봉급<\/td><td rowspan=\"4\">공공단체 자부담<\/td><td rowspan=\"3\">’22년부터<br>지방이양<\/td><td rowspan=\"3\">’22년부터<br>지방이양<\/td><td rowspan=\"4\">국비<\/td><\/tr><tr><td>교통비<\/td><\/tr><tr><td>피복비<\/td><\/tr><tr><td>중식비<\/td><td>지방비<\/td><td>지방비<\/td><\/tr><\/table><div class=\"pchip\" id=\"p71\"><span>원문 71쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=83\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">보건복지분야 사회복무요원 인력경비(지방이양) 지급 시 유의사항<\/div><div class=\"ln p\">‒보건복지분야 사회복무요원은 「병역법」 제31조제5항에 근거하여 동법 제26조제1항제1호에 따른 사회서비스업무의 지원업무를 수행하는 사회복무요원 중 「지방자치단체 기금관리기본법 시행령」 별표 118에 해당하는 보건복지부 소관 사회복무요원에 한함<\/div><div class=\"ln p\">‒복무분야가 ‘사회복지시설 운영 지원’, ‘지방자치단체 사회복지 업무 지원’ 등 사회복지업무와 ‘방역･식품위생 등 국민건강 보호･증진 업무 지원’, ‘응급구조･환자이동 등 환자구호 업무 지원’ 등 보건의료 업무 근무자에게만 지방이양된 예산에서 인력경비 지급<\/div><div class=\"ln p\">일부 지방자치단체 사회복무요원의 보수 지연 및 착오 지급(복무분야, 계급착오 등)되는 사례가 발생하고 있으므로 지방자치단체에서는 보건복지분야 사회복무요원의 보수지급일 (익월 10일, 12월은 당월지급)에 보수가 지급될 수 있도록 보수 집행 필요.<\/div><div class=\"ln p\">주의<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">보건복지분야 사회복무요원 직무교육<\/div><div class=\"ln p\">보건복지분야 사회복무요원 직무교육 정의<\/div><div class=\"ln p\">‒사회복무요원에 대한 특화･전문교육으로 사회복지시설 등 근무 기관에서 담당 직무를 효과적으로 수행 할 수 있는 직무능력배양<\/div><div class=\"ln p\">•사회복지시설 등 근무기관에 대한 경험과 수요자(노인･장애인 등 서비스 대상자)에 대한 이해가 부족하여 이에 대한 교육이 필수<\/div><div class=\"ln p\">•사회복무요원 교육 흐름도：군사교육(3주/국방부) ➝ 복무기본교육(1주/병무청) ➝ 직무교육(기본직무교육 8일, 심화직무교육 3일/보건복지부･한국보건복지인재원) 순으로 실시<\/div><div class=\"ln p\">보건복지분야 사회복무요원 직무교육 관련 법률<\/div><div class=\"ln p\">‒(근거법률) 병역법 제33조의2에 의한 법정의무교육<\/div><div class=\"ln p\">직무교육 운영기관<\/div><div class=\"ln p\">‒한국보건복지인재원 지역사회복무교육본부에 위탁 실시(1부 6센터)<\/div><div class=\"ln p\">‒(근거법률) 한국보건복지인재원법 제6조에 의한 위탁 가능<\/div><div class=\"pchip\" id=\"p72\"><span>원문 72쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=84\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">한국보건복지인재원 지역사회복무교육본부 현황<\/div><table class=\"htbl\"><tr><td>구 분<\/td><td>교육 관할지역<\/td><td>소재지<\/td><td>비고<\/td><\/tr><tr><td>지역교육기획부<\/td><td>전국<\/td><td>충북 청주시<\/td><td><\/td><\/tr><tr><td>서울교육센터<\/td><td>서울, 경기북부, 강원<\/td><td>서울 종로구<\/td><td><\/td><\/tr><tr><td>부산교육센터<\/td><td>부산, 울산, 경남<\/td><td>부산 동구<\/td><td><\/td><\/tr><tr><td>대구교육센터<\/td><td>대구, 경북<\/td><td>대구 동구<\/td><td><\/td><\/tr><tr><td>경인교육센터<\/td><td>인천, 경기남부<\/td><td>경기 수원시<\/td><td><\/td><\/tr><tr><td>광주교육센터<\/td><td>광주, 전북, 전남, 제주<\/td><td>광주 서구<\/td><td><\/td><\/tr><tr><td>대전교육센터<\/td><td>대전, 충북, 충남, 세종<\/td><td>대전 중구<\/td><td><\/td><\/tr><\/table><div class=\"ln p\">직무교육 과정(비합숙교육, 교육여비 지급)<\/div><div class=\"ln p\">‒기본직무교육：8일, 47시간<\/div><table class=\"htbl\"><tr><td>구 분<\/td><td>사회복지과정<\/td><td>사회복지공무원보조과정<\/td><td>보건의료과정<\/td><\/tr><tr><td>교육대상<\/td><td>사회복지시설 배치 사회복무요원<\/td><td>시･군･구청, 읍･면사무소 및 동주민센터 배치 사회복무요원<\/td><td>보건소 및 의료원 등 배치 사회복무요원<\/td><\/tr><tr><td>활동유형<\/td><td>사회복지시설 입소 노인･<br>장애인 등 신체활동 지원･<br>정서･프로그램･생활지원<\/td><td>지방자치단체<br>사회복지 담당업무 지원<\/td><td>주민건강을 위한<br>보건위생지원･환자 및<br>의료활동 지원<\/td><\/tr><tr><td>주요<br>교과목<\/td><td>노인, 장애인 체험 및이해 등 16개 과목<\/td><td>복지업무이해 및<br>공공기관 갈등이해,<br>민원응대 등 17개 과목<\/td><td>보건의료서비스 이해,<br>건강생활실천 및<br>감염병이해 등 16개 과목<\/td><\/tr><\/table><div class=\"ln p\">‒심화직무교육：3일, 17시간<\/div><table class=\"htbl\"><tr><td>구 분<\/td><td>일반심화과정<\/td><td>아동심화과정<\/td><\/tr><tr><td>교육대상<\/td><td>기본직무교육 수료생 중 복무기간이 1년 전･후 노인･장애인･노숙인시설, 종합복지관 근무 사회복무요원<\/td><td>기본직무교육 수료생 중 복무기간이 1년 전･후 아동이용시설 근무 사회복무요원<\/td><\/tr><tr><td>활동유형<\/td><td>사회복지시설 입소 노인･장애인 등 신체활동 지원･정서･프로그램･생활지원<\/td><td>아동 학습보조 등 지원활동<br>정서･프로그램･생활지원<\/td><\/tr><tr><td>주요 교과목<\/td><td>인권 및 개인정보 심층이해, 활동지원 기술 및<br>프로그램 운영 심층이해 등 7개 교과목<\/td><td>아동권리와 개인정보 심층이해, 아동놀이 및 아동행동이해, 지도방법 등 7개 교과목<\/td><\/tr><\/table><div class=\"ln note\">※ ’26년 기본･심화 직무교육 세부내용은 변경될 수 있음<\/div><div class=\"pchip\" id=\"p73\"><span>원문 73쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=85\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복무요원 직무교육통지서 교부 시 지자체 등 복무기관 협조사항<\/div><div class=\"ln p\">‒법적근거：「병역법」 제33조의2 및 「병역법 시행령」 제67조 및 제68조, 한국보건복지인재원 「사회복무요원 교육운영규정」<\/div><div class=\"ln p\">‒통지서 교부절차<\/div><div class=\"ln p\">①한국보건복지인재원 권역별 지역교육센터에서 복무기관의 장에게 「직무교육 통지서」 발송<\/div><div class=\"ln note\">※복무기관의 장：국가기관, 지방자치단체의 장 또는 공공단체의 장(병역법 시행령 제48조). 단, 사회복지시설은 복무기관이 아닌 근무기관으로 근무기관장은 복무기관의 장이 아님.<\/div><div class=\"ln p\">②복무기관의 장은 소속 사회복무요원에게 직무교육통지서 교부(교육일 14일 전까지)<\/div><div class=\"ln p\">③복무기관의 장은 「직무교육 통지서 교부결과」를 교육 시작일 전까지 해당 권역별 지역교육센터로 회신<\/div><div class=\"ln p\">‒직무교육 기일연기 사유 발생 시 「사회복무요원 교육기일 연기신청서」와 증빙 서류를 교육 시작일 전까지 복무기관에서 해당  권역별 지역교육센터에 제출<\/div><div class=\"ln p\">교육 기일연기 신청사유(「병역법」 시행령 제68조)<\/div><div class=\"ln p\">제68조(교육 통지서의 교부 및 교육일 연기 등) ① 병무청장, 지방병무청장 또는 관계 중앙행정기관의 장은 법 제33조의2에 따른 교육의 대상자에 대하여 교육 통지서를 교육일 14일 전까지 다음 각 호의 어느 하나의 방법으로 교육 통지서를 보내야 한다. 1. 직접 교부 또는 복무기관의 장을 통한 교부 2. 우편송달 3. 제3조의2제2항 각 호의 방법에 따른 전자송달(미리 교육 대상자에게 전자송달에 대한 동의를 받은 경우로 한정한다) ② 병무청장, 지방병무청장 또는 관계 중앙행정기관의 장은 제1항에 따른 교육 통지서를 받은 사람이 다음 각 호의 어느 하나에 해당하는 경우에는 그 사유가 없어질 때까지 신청에 따라 교육일을 연기할 수 있다. 1. 질병이나 심신장애로 교육을 충실하게 이행하는 것이 어려운 경우 2.본인의 직계존속･직계비속, 배우자, 형제자매 또는 가족 중 세대를 같이하는 사람이 위독하거나 사망하여 본인이 아니면 간호 또는 장례 등 가사(家事)의 정리가 어려운 경우 3. 천재지변이나 그 밖의 재난을 당하여 본인이 아니면 이를 처리하기 어려운 경우 4. 그 밖에 부득이한 사유로 교육을 받기 어려운 경우<\/div><div class=\"pchip\" id=\"p74\"><span>원문 74쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=86\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">직무교육 결과 관련 복무기관 조치사항<\/div><div class=\"ln p\">‒한국보건복지인재원 지역교육센터에서 직무교육 실시결과(직무교육 수료자 및 미수료자 명부)를 복무기관에 발송<\/div><div class=\"ln p\">‒「직무교육 수료자 및 미수료자 명부」 접수 시 조치사항<\/div><div class=\"ln p\">•「병역법 시행령」 제64조의2에 의거하여 복무기관의 장은 보충역 복무기록표에 직무교육 실시 여부 등 복무와 관련된 사항을 기재･정리<\/div><div class=\"ln p\">•미수료자 중 무단 지각, 결석 등 교육을 태만하게 하여 경고처리 및 퇴교된 사회복무요원에 대하여 5일 연장 복무 조치(「병역법」 제33조 및 「병역법 시행령」 제65조의6제5호에 근거)<\/div><div class=\"ln p\">•미수료자 중 질병 치료 등의 사유로 유급된 사회복무요원은 제재 없음.<\/div><div class=\"ln note\">※단, 퇴교･유급된 사회복무요원은 재교육 대상임.<\/div><div class=\"ln p\">‒직무교육 중 병원 진료 등의 사유로 결강 및 결석한 시간에 대하여 공무상 질병･부상인 경우와 공무 외 질병･부상인 경우를 구분하여 본인 연가일수에서 공제 또는 복무기간에 산입하는 등의 후속 조치<\/div><div class=\"ln note\">※「직무교육 수료자 및 미수료자 명부」에 직무교육 결석, 결강 시간을 기재하여 통보<\/div><div class=\"ln note\">※기타 자세한 사항은 병무청 훈령(「사회복무요원 복무관리 규정」) 참조<\/div><div class=\"ln p\">‒직무교육 중 모범교육생으로 선정된 사회복무요원에게는 사기진작 등을 위하여 특별휴가 등 조치 협조<\/div><div class=\"ln p\">•관련근거：「병역법 시행령」 제59조제1항제5호<\/div><div class=\"ln p\">•휴가기간：연 5일 이내로 기관 실정을 고려하여 시행<\/div><div class=\"ln p\">직무교육 기간 중 교육여비 지급 안내<\/div><div class=\"ln p\">‒보건복지분야 사회복무요원 직무교육 기간 중에는 관련규정에 의한 운임, 일비, 숙박비, 식비 등의 교육여비를 지급 중임(공공단체는 자부담).<\/div><div class=\"ln p\">•운임, 숙박비：해당자에 한하여 지급<\/div><div class=\"ln p\">•일비, 식비：전 교육생 지급<\/div><div class=\"ln note\">※세부 지급내역은 한국보건복지인재원 내부 기준에 의함(병무청 관할 지역 기준)<\/div><div class=\"ln p\">‒이에 시･군･구청 등 복무기관에서는 직무교육 기간 중에는 소속 사회복무요원에게 별도의 중식비, 교통비 등이 중복 지급되지 않도록 유의<\/div><div class=\"pchip\" id=\"p75\"><span>원문 75쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=87\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">사회복무요원의 배정<\/div><div class=\"ln p\">사회복무요원 배정 기본 방향<\/div><div class=\"ln p\">‒사회복지분야 우선 배정, 자격･전공, 희망 등 고려<\/div><div class=\"ln p\">‒부실 복무기관 배정 제한 및 근무 부적격 분야 배정 제외<\/div><div class=\"ln p\">사회복무요원 배정분야 및 우선순위<\/div><div class=\"ln p\">‒(분야별) ①사회복지 ②보건･의료 ③교육･문화 ④환경･안전 ⑤행정업무<\/div><div class=\"ln p\">‒(기관별) ①사회복지시설 ②국가기관 ③지방자치단체 ④공공단체<\/div><div class=\"ln note\">※매년, 배정 우선순위는 12월말 확정 후, 1월에 병무청에서 고시되는 사항으로 변경될 수 있음<\/div><div class=\"ln p\">사회복무요원 신청･배정 절차<\/div><table class=\"htbl\"><tr><td>단 계<\/td><td>업 무 개 요<\/td><td>비 고<\/td><\/tr><tr><td>수요 조사<\/td><td>(1~2월) 다음해 사회복무요원 배정을 위한 수요조사 실시<\/td><td>지방병무청<\/td><\/tr><tr><td>배정 요청<\/td><td>(2월 말까지) 복무기관의 장이 지방병무청장에 그 다음 해의 필요인원 배정 요청<br>‒ 사회복지시설의 필요인원은 시장(구가 설치되지 아니한 시의 시장을 말한다)･군수･구청장이 배정 요청<\/td><td>복무기관<\/td><\/tr><tr><td>배정인원 결정<\/td><td>(3월 31일까지) 지방병무청에서 복무기관별 배정인원 결정<\/td><td>지방병무청<\/td><\/tr><tr><td>복무기관 통보<\/td><td>(4월 20일까지) 지방병무청에서 배정결과 복무기관 통보<\/td><td>지방병무청<\/td><\/tr><\/table><div class=\"ln p\">사회복무요원 배정신청 시 유의사항<\/div><div class=\"ln p\">‒시･군･구청 등 복무기관에서는 관내 보건･복지시설에 반드시 수요조사를 실시하여 적극적 배정 요청<\/div><div class=\"ln p\">‒수요조사 제출 시 다음 사항을 명시하여 신청<\/div><div class=\"ln p\">•시설종류, 시설유형(이용/생활), 유/무료 시설구분<\/div><div class=\"pchip\" id=\"p76\"><span>원문 76쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=88\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>사회복무요원 관련 교육 지원 안내(한국보건복지인재원)<\/td><\/tr><tr><td>※ ’26년도 교육일정은 교육기관에서 추후 안내 예정<br>보건복지분야 사회복무요원 소통향상교육(담당자편)<br>‒교육내용: 사회복무요원 근무기관 담당자의 사회복무요원 직무 이해,  보건복지분야 근무기관 담당자의 역할과 올바른 의사소통법 등<br>‒교육대상: 보건복지분야 사회복무요원 복무 및 근무기관 담당자<br>‒교육기관: 한국보건복지인재원(6개 지역교육센터)<br>사회복무요원 직무소양교육(이러닝 교육)<br>‒주요내용: 사회복무요원의 직무 이해 및 근무기관에서 직무수행 관련 교육 시 필요한 콘텐츠<br>‒교육대상: 사회복무요원 복무 및 근무기관 담당자, 사회복무요원 등 전 국민<br>‒교육방법: 이러닝 교육(웹, 모바일 기능)을 통한 상시학습<br>‒교육기관: 한국보건복지인재원 사회복무요원 교육지원플랫폼(https://sos.kohi.or.kr)<br>보건복지분야 사회복무요원 진로탐색교육<br>‒교육내용: 보건복지분야 직업 및 직무 이해, 직업 경로설계 등<br>* 사회복무 경험을 활용한 보건복지분야 진로 연계 교육 지원<br>‒교육대상: 소집해제 5개월 전인 사회복무요원 중 희망자<br>‒교육기관: 한국보건복지인재원(6개 지역교육센터)<br><table class=\"htbl\"><tr><td>6개 지역별 센터<\/td><td>교육 관할지역<\/td><td>소재지<\/td><\/tr><tr><td>서울교육센터<\/td><td>서울, 경기북부, 강원<\/td><td>서울 종로구<\/td><\/tr><tr><td>부산교육센터<\/td><td>부산, 울산, 경남<\/td><td>부산 동구<\/td><\/tr><tr><td>대구교육센터<\/td><td>대구, 경북<\/td><td>대구 동구<\/td><\/tr><tr><td>경인교육센터<\/td><td>인천, 경기남부<\/td><td>경기 수원시<\/td><\/tr><tr><td>광주교육센터<\/td><td>광주, 전북, 전남, 제주<\/td><td>광주 서구<\/td><\/tr><tr><td>대전교육센터<\/td><td>대전, 충북, 충남, 세종<\/td><td>대전 중구<\/td><\/tr><\/table><\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"ln p\">11<\/div>", "pages": [{"p": 69, "t": "10\n사회복무제도\n가\n사회복무제도의 의의\n사회복무요원 지원 취지\n‒사회복지시설에 대한 사회복무요원 지원취지는 노인, 장애인 등 사회취약 계층의 사회서비스 수요에 대응하여 필요한 인력을 지원함으로써 ‘사회복지시설의 인력난을 경감’하고 ‘사회서비스의 질을 개선’하는 데 있음\n사회복무요원 지원 원칙\n1.노동시장 중립성의 원칙사회복지시설에 대한 사회복무요원 지원으로 사회복지 분야의 고용시장을 잠식하지 않아야 함. 이는 사회복지시설 등에 사회복무요원을 지원하기 위하여 2007년 2월 보건복지부, 국방부 등 6개 부처 합동으로 발표한 ‘비전2030 인적자원 활용 「2+5」 전략’에 있는 기본원칙으로 사회복무요원 지원으로 인해 고용 인력이 감축되지 않아야 할 뿐만 아니라, 신규 고용을 대체할 목적으로 사회복무요원을 활용해서도 안 된다는 원칙임.\n2.공익성의 원칙사회복무요원은 공공의 이익을 위하여 지원되어야 함. 그러므로 사익을 추구하는 개인 또는 법인에게 지원해줄 수 없고 공공기관이나 공익성을 추구하는 시설이라도 영리목적 분야에 지원할 수 없음.\n3.필요성의 원칙공익성에 부합하더라도 사회복무요원 지원이 불가피한 경우에 한하여 지원할 수 있음. 단순하게 ‘있어도 그만 없어도 그만인 기관’이 지원요청을 할 경우 지원을 하여서는 안 됨.\n4.병역의 숭고성의 원칙병역은 국가에 대한 무한한 자기희생과 충성심의 발로에서 비롯되는 숭고한 국민의 의무임. 그러므로 병역을 단순히 ‘값싼 노동력 제공원’으로 인식하여 사회복무요원을 단순 노무(노역)에 종사 시키거나, 제품생산, 판매 등 영리성 업무에 복무하게 하여서는 안 됨."}, {"p": 70, "t": "나\n보건복지분야 사회복무요원\n보건복지분야 사회복무요원의 정의\n‒국가기관, 지방자치단체, 공공단체 및 사회복지시설의 공익목적 수행에 필요한 사회복지, 보건･의료 등의 사회서비스업무 및 행정업무 등의 지원을 위하여 소집되어 공익분야에 복무하는 병역자원\n보건복지분야 사회복무요원 복무분야 및 업무\n구 분 | 복무분야 | 주요업무\n사회복지시설 운영지원 | 사회복지시설 | 노인･장애인 등의 활동･목욕･취식 등 신체활동 지원, 정서 및 프로그램 운영지원, 가사 및 생활지원\n지방자치단체 사회복지업무지원 | 지방자치단체 | 저소득층 물품전달, 시설 운영, 기탁처 관리 등 사회복지 담당업무 지원\n국민건강 보호･증진 업무지원 | 국립검역소, 보건(지)소 | 방역･소독･식품위생 등 주민건강을 위한 보건위생 지원\n환자 구호업무 지원 | 국공립병원, 지방의료원 등 | 의료물품 및 환자 이송, 약품 관리 등 환자 및 의료활동 지원\n보건복지분야 사회복무요원 인력경비 부담 주체\n‒’22년부터 사회복지시설 및 지자체에 배치되는 보건복지분야 사회복무요원의 보수 등 인력경비는 지방이양(규모 2,346억, 5년간 보전)\n※ 국회 재정분권특별위원회 당･정･청 전체회의에서 ’2단계 재정분권 추진방향‘ 확정(‘21.7월)\n경비내역 | 복무기관\n공공단체 | 복지시설 | 지자체 | 국가기관\n봉급 | 공공단체 자부담 | ’22년부터 지방이양 | ’22년부터 지방이양 | 국비\n교통비\n피복비\n중식비 | 지방비 | 지방비"}, {"p": 71, "t": "보건복지분야 사회복무요원 인력경비(지방이양) 지급 시 유의사항\n‒보건복지분야 사회복무요원은 「병역법」 제31조제5항에 근거하여 동법 제26조제1항제1호에 따른 사회서비스업무의 지원업무를 수행하는 사회복무요원 중 「지방자치단체 기금관리기본법 시행령」 별표 118에 해당하는 보건복지부 소관 사회복무요원에 한함\n‒복무분야가 ‘사회복지시설 운영 지원’, ‘지방자치단체 사회복지 업무 지원’ 등 사회복지업무와 ‘방역･식품위생 등 국민건강 보호･증진 업무 지원’, ‘응급구조･환자이동 등 환자구호 업무 지원’ 등 보건의료 업무 근무자에게만 지방이양된 예산에서 인력경비 지급\n일부 지방자치단체 사회복무요원의 보수 지연 및 착오 지급(복무분야, 계급착오 등)되는 사례가 발생하고 있으므로 지방자치단체에서는 보건복지분야 사회복무요원의 보수지급일 (익월 10일, 12월은 당월지급)에 보수가 지급될 수 있도록 보수 집행 필요.\n주의\n다\n보건복지분야 사회복무요원 직무교육\n보건복지분야 사회복무요원 직무교육 정의\n‒사회복무요원에 대한 특화･전문교육으로 사회복지시설 등 근무 기관에서 담당 직무를 효과적으로 수행 할 수 있는 직무능력배양\n•사회복지시설 등 근무기관에 대한 경험과 수요자(노인･장애인 등 서비스 대상자)에 대한 이해가 부족하여 이에 대한 교육이 필수\n•사회복무요원 교육 흐름도：군사교육(3주/국방부) ➝ 복무기본교육(1주/병무청) ➝ 직무교육(기본직무교육 8일, 심화직무교육 3일/보건복지부･한국보건복지인재원) 순으로 실시\n보건복지분야 사회복무요원 직무교육 관련 법률\n‒(근거법률) 병역법 제33조의2에 의한 법정의무교육\n직무교육 운영기관\n‒한국보건복지인재원 지역사회복무교육본부에 위탁 실시(1부 6센터)\n‒(근거법률) 한국보건복지인재원법 제6조에 의한 위탁 가능"}, {"p": 72, "t": "한국보건복지인재원 지역사회복무교육본부 현황\n구 분 | 교육 관할지역 | 소재지 | 비고\n지역교육기획부 | 전국 | 충북 청주시 | \n서울교육센터 | 서울, 경기북부, 강원 | 서울 종로구 | \n부산교육센터 | 부산, 울산, 경남 | 부산 동구 | \n대구교육센터 | 대구, 경북 | 대구 동구 | \n경인교육센터 | 인천, 경기남부 | 경기 수원시 | \n광주교육센터 | 광주, 전북, 전남, 제주 | 광주 서구 | \n대전교육센터 | 대전, 충북, 충남, 세종 | 대전 중구 | \n직무교육 과정(비합숙교육, 교육여비 지급)\n‒기본직무교육：8일, 47시간\n구 분 | 사회복지과정 | 사회복지공무원보조과정 | 보건의료과정\n교육대상 | 사회복지시설 배치 사회복무요원 | 시･군･구청, 읍･면사무소 및 동주민센터 배치 사회복무요원 | 보건소 및 의료원 등 배치 사회복무요원\n활동유형 | 사회복지시설 입소 노인･ 장애인 등 신체활동 지원･ 정서･프로그램･생활지원 | 지방자치단체 사회복지 담당업무 지원 | 주민건강을 위한 보건위생지원･환자 및 의료활동 지원\n주요 교과목 | 노인, 장애인 체험 및이해 등 16개 과목 | 복지업무이해 및 공공기관 갈등이해, 민원응대 등 17개 과목 | 보건의료서비스 이해, 건강생활실천 및 감염병이해 등 16개 과목\n‒심화직무교육：3일, 17시간\n구 분 | 일반심화과정 | 아동심화과정\n교육대상 | 기본직무교육 수료생 중 복무기간이 1년 전･후 노인･장애인･노숙인시설, 종합복지관 근무 사회복무요원 | 기본직무교육 수료생 중 복무기간이 1년 전･후 아동이용시설 근무 사회복무요원\n활동유형 | 사회복지시설 입소 노인･장애인 등 신체활동 지원･정서･프로그램･생활지원 | 아동 학습보조 등 지원활동 정서･프로그램･생활지원\n주요 교과목 | 인권 및 개인정보 심층이해, 활동지원 기술 및 프로그램 운영 심층이해 등 7개 교과목 | 아동권리와 개인정보 심층이해, 아동놀이 및 아동행동이해, 지도방법 등 7개 교과목\n※ ’26년 기본･심화 직무교육 세부내용은 변경될 수 있음"}, {"p": 73, "t": "사회복무요원 직무교육통지서 교부 시 지자체 등 복무기관 협조사항\n‒법적근거：「병역법」 제33조의2 및 「병역법 시행령」 제67조 및 제68조, 한국보건복지인재원 「사회복무요원 교육운영규정」\n‒통지서 교부절차\n①한국보건복지인재원 권역별 지역교육센터에서 복무기관의 장에게 「직무교육 통지서」 발송\n※복무기관의 장：국가기관, 지방자치단체의 장 또는 공공단체의 장(병역법 시행령 제48조). 단, 사회복지시설은 복무기관이 아닌 근무기관으로 근무기관장은 복무기관의 장이 아님.\n②복무기관의 장은 소속 사회복무요원에게 직무교육통지서 교부(교육일 14일 전까지)\n③복무기관의 장은 「직무교육 통지서 교부결과」를 교육 시작일 전까지 해당 권역별 지역교육센터로 회신\n‒직무교육 기일연기 사유 발생 시 「사회복무요원 교육기일 연기신청서」와 증빙 서류를 교육 시작일 전까지 복무기관에서 해당  권역별 지역교육센터에 제출\n교육 기일연기 신청사유(「병역법」 시행령 제68조)\n제68조(교육 통지서의 교부 및 교육일 연기 등) ① 병무청장, 지방병무청장 또는 관계 중앙행정기관의 장은 법 제33조의2에 따른 교육의 대상자에 대하여 교육 통지서를 교육일 14일 전까지 다음 각 호의 어느 하나의 방법으로 교육 통지서를 보내야 한다. 1. 직접 교부 또는 복무기관의 장을 통한 교부 2. 우편송달 3. 제3조의2제2항 각 호의 방법에 따른 전자송달(미리 교육 대상자에게 전자송달에 대한 동의를 받은 경우로 한정한다) ② 병무청장, 지방병무청장 또는 관계 중앙행정기관의 장은 제1항에 따른 교육 통지서를 받은 사람이 다음 각 호의 어느 하나에 해당하는 경우에는 그 사유가 없어질 때까지 신청에 따라 교육일을 연기할 수 있다. 1. 질병이나 심신장애로 교육을 충실하게 이행하는 것이 어려운 경우 2.본인의 직계존속･직계비속, 배우자, 형제자매 또는 가족 중 세대를 같이하는 사람이 위독하거나 사망하여 본인이 아니면 간호 또는 장례 등 가사(家事)의 정리가 어려운 경우 3. 천재지변이나 그 밖의 재난을 당하여 본인이 아니면 이를 처리하기 어려운 경우 4. 그 밖에 부득이한 사유로 교육을 받기 어려운 경우"}, {"p": 74, "t": "직무교육 결과 관련 복무기관 조치사항\n‒한국보건복지인재원 지역교육센터에서 직무교육 실시결과(직무교육 수료자 및 미수료자 명부)를 복무기관에 발송\n‒「직무교육 수료자 및 미수료자 명부」 접수 시 조치사항\n•「병역법 시행령」 제64조의2에 의거하여 복무기관의 장은 보충역 복무기록표에 직무교육 실시 여부 등 복무와 관련된 사항을 기재･정리\n•미수료자 중 무단 지각, 결석 등 교육을 태만하게 하여 경고처리 및 퇴교된 사회복무요원에 대하여 5일 연장 복무 조치(「병역법」 제33조 및 「병역법 시행령」 제65조의6제5호에 근거)\n•미수료자 중 질병 치료 등의 사유로 유급된 사회복무요원은 제재 없음.\n※단, 퇴교･유급된 사회복무요원은 재교육 대상임.\n‒직무교육 중 병원 진료 등의 사유로 결강 및 결석한 시간에 대하여 공무상 질병･부상인 경우와 공무 외 질병･부상인 경우를 구분하여 본인 연가일수에서 공제 또는 복무기간에 산입하는 등의 후속 조치\n※「직무교육 수료자 및 미수료자 명부」에 직무교육 결석, 결강 시간을 기재하여 통보\n※기타 자세한 사항은 병무청 훈령(「사회복무요원 복무관리 규정」) 참조\n‒직무교육 중 모범교육생으로 선정된 사회복무요원에게는 사기진작 등을 위하여 특별휴가 등 조치 협조\n•관련근거：「병역법 시행령」 제59조제1항제5호\n•휴가기간：연 5일 이내로 기관 실정을 고려하여 시행\n직무교육 기간 중 교육여비 지급 안내\n‒보건복지분야 사회복무요원 직무교육 기간 중에는 관련규정에 의한 운임, 일비, 숙박비, 식비 등의 교육여비를 지급 중임(공공단체는 자부담).\n•운임, 숙박비：해당자에 한하여 지급\n•일비, 식비：전 교육생 지급\n※세부 지급내역은 한국보건복지인재원 내부 기준에 의함(병무청 관할 지역 기준)\n‒이에 시･군･구청 등 복무기관에서는 직무교육 기간 중에는 소속 사회복무요원에게 별도의 중식비, 교통비 등이 중복 지급되지 않도록 유의"}, {"p": 75, "t": "라\n사회복무요원의 배정\n사회복무요원 배정 기본 방향\n‒사회복지분야 우선 배정, 자격･전공, 희망 등 고려\n‒부실 복무기관 배정 제한 및 근무 부적격 분야 배정 제외\n사회복무요원 배정분야 및 우선순위\n‒(분야별) ①사회복지 ②보건･의료 ③교육･문화 ④환경･안전 ⑤행정업무\n‒(기관별) ①사회복지시설 ②국가기관 ③지방자치단체 ④공공단체\n※매년, 배정 우선순위는 12월말 확정 후, 1월에 병무청에서 고시되는 사항으로 변경될 수 있음\n사회복무요원 신청･배정 절차\n단 계 | 업 무 개 요 | 비 고\n수요 조사 | (1~2월) 다음해 사회복무요원 배정을 위한 수요조사 실시 | 지방병무청\n배정 요청 | (2월 말까지) 복무기관의 장이 지방병무청장에 그 다음 해의 필요인원 배정 요청 ‒ 사회복지시설의 필요인원은 시장(구가 설치되지 아니한 시의 시장을 말한다)･군수･구청장이 배정 요청 | 복무기관\n배정인원 결정 | (3월 31일까지) 지방병무청에서 복무기관별 배정인원 결정 | 지방병무청\n복무기관 통보 | (4월 20일까지) 지방병무청에서 배정결과 복무기관 통보 | 지방병무청\n사회복무요원 배정신청 시 유의사항\n‒시･군･구청 등 복무기관에서는 관내 보건･복지시설에 반드시 수요조사를 실시하여 적극적 배정 요청\n‒수요조사 제출 시 다음 사항을 명시하여 신청\n•시설종류, 시설유형(이용/생활), 유/무료 시설구분"}, {"p": 76, "t": "사회복무요원 관련 교육 지원 안내(한국보건복지인재원)\n※ ’26년도 교육일정은 교육기관에서 추후 안내 예정 보건복지분야 사회복무요원 소통향상교육(담당자편) ‒교육내용: 사회복무요원 근무기관 담당자의 사회복무요원 직무 이해,  보건복지분야 근무기관 담당자의 역할과 올바른 의사소통법 등 ‒교육대상: 보건복지분야 사회복무요원 복무 및 근무기관 담당자 ‒교육기관: 한국보건복지인재원(6개 지역교육센터) 사회복무요원 직무소양교육(이러닝 교육) ‒주요내용: 사회복무요원의 직무 이해 및 근무기관에서 직무수행 관련 교육 시 필요한 콘텐츠 ‒교육대상: 사회복무요원 복무 및 근무기관 담당자, 사회복무요원 등 전 국민 ‒교육방법: 이러닝 교육(웹, 모바일 기능)을 통한 상시학습 ‒교육기관: 한국보건복지인재원 사회복무요원 교육지원플랫폼(https://sos.kohi.or.kr) 보건복지분야 사회복무요원 진로탐색교육 ‒교육내용: 보건복지분야 직업 및 직무 이해, 직업 경로설계 등 * 사회복무 경험을 활용한 보건복지분야 진로 연계 교육 지원 ‒교육대상: 소집해제 5개월 전인 사회복무요원 중 희망자 ‒교육기관: 한국보건복지인재원(6개 지역교육센터) 6개 지역별 센터 | 교육 관할지역 | 소재지\n서울교육센터 | 서울, 경기북부, 강원 | 서울 종로구\n부산교육센터 | 부산, 울산, 경남 | 부산 동구\n대구교육센터 | 대구, 경북 | 대구 동구\n경인교육센터 | 인천, 경기남부 | 경기 수원시\n광주교육센터 | 광주, 전북, 전남, 제주 | 광주 서구\n대전교육센터 | 대전, 충북, 충남, 세종 | 대전 중구\n\n11"}]}, {"title": "11. 사회복지시설장 등의 실종아동등 발견 시 신고 및 신상카드 제출 의무", "start": 77, "end": 86, "html": "<div class=\"pchip\" id=\"p77\"><span>원문 77쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=89\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설장 등의 실종아동등 발견 시 신고 및 신상카드 제출 의무<\/div><div class=\"ln p\">*근거 : 「실종아동등의 보호 및 지원에 관한 법률」<\/div><div class=\"ln p\">실종아동등 관련 의무<\/div><div class=\"ln p\">(실종아동･장애인･치매환자 신고의무) 보호시설의 장 또는 그 종사자 등은 실종아동･장애인･치매환자를 발견 시 지체 없이 경찰청에 신고하여야 한다. (신상카드 작성･제출의무) 보호시설의 장 또는 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조제5호에 따른 정신의료기관의 장이 보호자가 확인되지 아니한 아동과 장애인, 치매환자를 보호하게 된 때에는 「실종아동 등의 보호 및 지원에 관한 법률 시행규칙」 별지 제2호 서식인 신상카드(별첨)를 작성하여 지방자치단체와 실종아동전문기관에 각각 제출하여야 한다. ※ 신고전화 : 경찰청 실종아동찾기센터 국번없이 182<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">실종아동등의 보호 및 지원 사업 개요<\/div><div class=\"ln h4\">1) 실종아동등의 정의<\/div><div class=\"ln p\">약취･유인･유기･사고 또는 가출하거나 길을 잃는 등의 사유로 인하여 보호자로부터 이탈된 아래의 대상자<\/div><div class=\"ln p\">‒실종당시 18세 미만 아동<\/div><div class=\"ln p\">‒「장애인복지법」 제2조의 장애인 중 지적장애인･자폐성장애인･정신장애인(연령제한 없음)<\/div><div class=\"ln p\">‒「치매관리법」 제2조제2호의 치매환자<\/div><div class=\"pchip\" id=\"p78\"><span>원문 78쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=90\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">2) 실종아동등 신고의무자<\/div><div class=\"ln p\">보호시설의 장 또는 그 종사자<\/div><div class=\"ln p\">「아동복지법」 제13조에 따른 아동복지전담공무원<\/div><div class=\"ln p\">「청소년 보호법」 제35조에 따른 청소년 보호･재활센터의 장 또는 그 종사자<\/div><div class=\"ln p\">「사회복지사업법」 제14조에 따른 사회복지전담공무원<\/div><div class=\"ln p\">「의료법」 제3조에 따른 의료기관의 장 또는 의료인<\/div><div class=\"ln p\">업무･고용 등의 관계로 아동 등을 보호･감독하는 자<\/div><div class=\"ln p\">☞누구든지 정당한 사유 없이 실종아동등을 경찰관서의 장에게 신고하지 아니하고 보호할 경우 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처함(실종아동법 제7조 위반)<\/div><div class=\"ln h4\">3) 실종아동등 신상카드 제출 의무자<\/div><div class=\"ln p\">보호시설의 장 또는 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조제5호에 따른 정신의료기관의 장<\/div><div class=\"ln p\">☞신상카드 미제출 시 200만 원 이하의 과태료 처함(실종아동법 제6조 위반)<\/div><div class=\"ln h4\">4) 실종아동등에 대한 유전자 검사 실시<\/div><div class=\"ln p\">유전자검사 대상자<\/div><div class=\"ln p\">‒보호시설의 입소자나 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조제5호에 따른 정신의료기관의 입원환자 중 보호자가 확인되지 아니한 아동 등<\/div><div class=\"ln p\">‒실종아동 등을 찾고자 하는 가족<\/div><div class=\"ln p\">‒그 밖에 보호시설의 입소자였던 무연고 아동<\/div><div class=\"ln p\">유전자검사 대상자의 유전자정보를 채취하여 실종아동등의 가족을 찾기 위해 활용<\/div><div class=\"pchip\" id=\"p79\"><span>원문 79쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=91\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">실종아동등 지원 사업의 업무 체계<\/div><div class=\"ln h4\">1) 관련기관별 협력 체계<\/div><table class=\"htbl\"><tr><td>보건복지부<br>(실종아동전문기관)<\/td><td>경찰청<br>(실종아동찾기센터, 국번없이 182)<\/td><td>지방자치단체<\/td><td>보호시설 또는<br>정신의료 기관 등<\/td><td>다중이용<br>시설의 장<\/td><\/tr><tr><td>정책 수립 및 시행<br>무연고 아동 등 신상카드 DB구축<br>실태조사 및 연구<br>실종예방 교육 및홍보<br>실종아동 등의 가족 지원<br>실종아동 등 조기 발견 지침 고시<br>기타 필요 사항<\/td><td>실종 신고 접수<br>수색 및 수사<br>유전자검사대상물채취<br>관계장소 출입･ 조사<br>위반사항 과태료 부과･징수<br>실종아동 등 조기 발견지침 준수에 대한 교육･훈련 사항 지도･감독<\/td><td>경찰관서에 실종 아동 등 발견 신고<br>※경찰청 실종아동 찾기센터(www.safe182.go.kr)<br>신상카드 작성･ 제출여부 지도･ 감독<br>관계장소 출입･ 조사<br>위반사항 과태료 부과･징수<\/td><td>경찰관서에 실종 아동 등 발견 신고<br>※경찰청 실종아동 찾기센터(www.safe182.go.kr)<br>신상카드 작성 제출<\/td><td>실종아동 등이 신고되는 경우 실종아동 등 조기 발견 지침에 따라 즉시 경보 발령, 수색, 출입구 감시 등의 조치<br>시설･장소의 종사자에게 실종 아동 등 조기발견 지침에 관한 교육･ 훈련 연1회 실시<br>경찰관서에 교육 실적 보고<\/td><\/tr><\/table><div class=\"ln note\">※ 실종자 가족지원사업, 실종예방사업, 신상카드 D/B 구축･운영 등은 실종아동전문기관에서 위탁 수행<\/div><div class=\"ln h4\">2) 지방자치단체 공무원의 역할<\/div><div class=\"ln p\">실종아동 등의 보호조치 및 지도･감독 의무<\/div><div class=\"ln p\">‒실종아동 등을 보호 조치할 때에는 아동 등의 신상을 기록한 신고접수서를 작성하여 경찰청에 신고해야 함<\/div><div class=\"ln p\">‒실종아동 신고 의무 및 신상카드 제출의무에 관한 사항을 지도･감독해야 함<\/div><div class=\"ln p\">‒미신고 보호행위 신고접수：정당한 사유 없이 실종아동 등을 경찰관서장에게 신고하지 아니하고 보호할 수 없음<\/div><div class=\"ln note\">※위반 시 5년 이하의 징역 또는 5천만 원 이하의 벌금<\/div><div class=\"ln p\">무연고 아동･장애인 발견 시 일시보호센터 우선보호 조치<\/div><div class=\"ln p\">‒실종아동･장애인 발생 시 지정된 일시보호센터로 이송 조치<\/div><div class=\"pchip\" id=\"p80\"><span>원문 80쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=92\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">‒다만, 발생장소와 일시보호센터간 거리가 멀거나, 발견시간이 늦어 일시 보호 센터로 이동하기가 곤란한 경우 등 불가피한 상황이 발생하면 인근 보호시설로 보호조치 가능(1일 보호 기준)<\/div><div class=\"ln p\">‒이 경우 인근보호시설은 일시보호센터에 유선으로 즉시 통보하고 최대한 빠른 시일내에 일시보호센터로 이송 조치<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">신상카드 제출대상인 무연고 아동･장애인 관련 지침(ʼ09.9.29시행)<\/div><div class=\"ln h4\">1) “보호자가 확인되지 아니한(무연고)” 아동등이란<\/div><div class=\"ln p\">“보호자가 확인되지 아니한(무연고)” 아동등의 구체적 범위 및 기준은 다음 표와 같으며, 이들은 실종아동법상 신상카드 제출 및 유전자 채취의 대상이 됨<\/div><div class=\"ln h4\">2) 사회복지시설 등의 보호자가 확인되지 아니한 아동등의 정의 및 범위<\/div><div class=\"ln p\">시설구분<\/div><div class=\"ln p\">보호자가 확인되지 아니한(무연고) 아동･장애인의 정의 및 범위<\/div><div class=\"ln p\">아동복지시설 및 장애인 복지시설<\/div><div class=\"ln p\">가족관계등록부(구 호적)가 없는 아동 및 장애인 연고자를 알 수 없어 새로 성과 본을 창설(호적취득)한 아동 및 장애인 ‒단독으로 새로 성과 본을 창설한 아동 및 장애인 ‒시설장 등을 보호자로 새로 성과 본을 창설한 아동 및 장애인 ‒다만, 후견인 및 가정법원의 판결에 의해 입양된 아동중 친권포기각서가 있는 경우는 연고자로 인정 가족관계등록부(호적)은 있지만 시설입소 후 호적상의 보호자가 시설종사자 등과 직접면담 등 단 한 번의 방문도 없는 아동 및 장애인 ‒다만, 가족 연락두절 및 기피, 부양회피의 경우는 가족이 있다는 것이 확인된 것이므로 연고자로 관리 ※ 호적상의 보호자：부모, (외)조부모, (외)삼촌, 이모, 고모 일시아동보호시설 등 타 시설에서 전원시 구체적인 보호자 정보가 없는 아동 및 장애인<\/div><div class=\"ln p\">정신병원 등 정신보건시설 및 노숙인 시설<\/div><div class=\"ln p\">행려환자로서 관리번호 부여받은 실종아동 등 (정신보건시설) 시･군･구청장 또는 시･도지사가 보호자인 실종아동 등 시설입소 또는 병원 입원 후 새롭게 성과 본을 창설(호적취득)한 실종아동 등 시설입소 또는 병원입원 후 호적상의 보호자가 시설종사자 등과 직접면담 등단 한 번의 방문도 없는 실종아동 등 ‒다만, 가족 연락두절 및 기피, 부양회피의 경우는 가족이 있다는 것이 확인된 것이므로 연고자로 관리 ※ 호적상의 보호자：부모, (외)조부모, (외)삼촌, 이모, 고모<\/div><div class=\"pchip\" id=\"p81\"><span>원문 81쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=93\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) “실종아동법상” 보호시설의 역할<\/div><div class=\"ln p\">실종아동 등의 신고<\/div><div class=\"ln p\">‒실종아동등임을 알게 된 때 경찰관서에 신고해야 함<\/div><div class=\"ln note\">※ 신고전화 : 경찰청 실종아동찾기센터 국번없이 182<\/div><div class=\"ln note\">※ 미신고 보호행위 금지(실종아동법 제7조 위반) : 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처함<\/div><div class=\"ln p\">신상카드 작성 및 제출<\/div><div class=\"ln p\">‒보호자가 확인되지 아니한 아동 등이 입소한 경우 실종아동 등의 신상카드를 작성하여 지방자치단체와 실종아동전문기관에 각각 제출<\/div><div class=\"ln note\">※신고의무 및 신상카드 미제출 시 200만 원 이하의 과태료 처함(실종아동법 제19조제2항)<\/div><div class=\"ln p\">실종아동등 변동사항 보고<\/div><div class=\"ln p\">‒보호 중인 실종아동등의 전원 및 퇴소 시 그 변동사항을 지방자치단체 및 실종아동전문기관에 보고<\/div><div class=\"ln p\">경찰관서에서 보호시설 실종아동등에 대한 DNA 채취 시 적극 협조<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">신상카드 제출 방법<\/div><div class=\"ln h4\">1) 지방자치단체 제출방법<\/div><div class=\"ln p\">①사회서비스정보시스템(희망이음)(www.ssis.go.kr) 접속<\/div><div class=\"ln p\">②로그인 화면에서 공인인증서 로그인<\/div><div class=\"ln p\">*시스템사용 신청은 사회서비스정보시스템(희망이음)에서 회원가입하여 아이디, 비밀번호 로그인 후 사회서비스정보시스템 사용신청 화면에서 사용신청하여 기관장의 승인<\/div><div class=\"ln p\">③“대상자관리‒대상자기본정보관리‒대상자기본정보”에서 신규버튼 클릭 후 가족(연고)을 ‘무’로 선택하고 인적사항 입력 후 저장<\/div><div class=\"ln p\">④“대상자관리‒대상자기본정보관리‒실종정보”에서 대상자 목록을 조회하여 대상자를 선택하고 신규 버튼을 클릭하여 실종자 정보와 하단의 신상카드 추가정보 입력 후 저장(출력버튼 클릭하여 신상카드 출력)<\/div><div class=\"pchip\" id=\"p82\"><span>원문 82쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=94\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※ 사회서비스정보시스템(희망이음) 개선 중이므로 개선완료시까지 공문으로 제출&lt;아동학대대응과-3591(2022.5.2.) 참조&gt;<\/div><div class=\"ln h4\">1) 지방자치단체 제출방법<\/div><div class=\"ln p\">① 신상카드(실종아동법 시행규칙 별지 제2호 서식)를 작성하여 공문으로 제출<\/div><div class=\"ln p\">② 보호중인 무연고 아동･장애인･치매환자의 보호현황(전원, 퇴소) 변동사항 발생 시 지방자치단체의 장에게 변동사항을 공문으로 제출<\/div><div class=\"ln h4\">2) 실종전문기관 제출방법<\/div><div class=\"ln p\">가) 홈페이지 직접 입력<\/div><div class=\"ln p\">①실종아동전문기관 홈페이지(www.missingchild.or.kr) 접속<\/div><div class=\"ln p\">②로그인&lt;회원이 아닌 경우, 회원가입 (기관회원 – 신상 카드 담당자)&gt;<\/div><div class=\"ln p\">③‘홈페이지&gt;신상카드&gt;제출하기’에서 신상카드 입력<\/div><div class=\"ln p\">나) 실종아동 등 전원･퇴소 등 변동시<\/div><div class=\"ln p\">-보호중인 무연고 아동･장애인･치매환자의 보호현황(전원, 퇴소) 변동사항 발생 시 제출(입력)한 신상카드 정보 변경<\/div><div class=\"ln p\">①실종아동전문기관 홈페이지(www.missingchild.or.kr) 접속<\/div><div class=\"ln p\">②‘홈페이지&gt;로그인&gt;신상카드&gt;제출하기’에서 기존 입력했던 신상카드 목록 확인<\/div><div class=\"ln p\">③해당 실종아동등 클릭하여 ‘보호아동등 조치사항’에 변동사항 추가 입력(전원, 퇴소 등) 후 저장<\/div><div class=\"pchip\" id=\"p83\"><span>원문 83쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=95\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td colspan=\"17\">[별지 제2호 서식] &lt;개정 2008.7.31&gt;<\/td><td colspan=\"15\">(앞쪽)<\/td><\/tr><tr><td colspan=\"32\">신   상   카   드<\/td><\/tr><tr><td rowspan=\"10\">인적<br>사항<br>및<br>기본<br>사항<\/td><td colspan=\"3\">성  명<\/td><td colspan=\"2\"><\/td><td colspan=\"2\">성별<\/td><td colspan=\"3\">번호<br>(   )<\/td><td colspan=\"4\">1.남 2.여<\/td><td colspan=\"7\">주민등록번호<\/td><td colspan=\"8\">(당시    세, 추정/확실)<\/td><td colspan=\"2\" rowspan=\"3\">사진 부착<br>(3㎝×4㎝)<\/td><\/tr><tr><td colspan=\"3\">발견일자<\/td><td colspan=\"6\">년   월   일<\/td><td colspan=\"5\">발견지역<br>(주소)<\/td><td colspan=\"15\"><\/td><\/tr><tr><td colspan=\"2\">발견 장소<\/td><td>번호<br>(   )<\/td><td colspan=\"26\">1. 아파트 2. 빌라 3. 주택가 4. 놀이터 5. 학교(유치원 등) 6. 타인의 집 7. 학원 8. 상가(시장)<br>9. 터미널･역 10. 종교시설(교회･성당･절 등) 11. 공원 12. 산 13. 버스정류장 14. 병원<br>15. 노상 16. PC방･오락실 17. 자가 18. 회사 19. 기타(           )<\/td><\/tr><tr><td colspan=\"3\" rowspan=\"2\">보호장소<\/td><td colspan=\"8\">시설(기관)명 ><tr><td colspan=\"3\"><\/td><td colspan=\"2\"><\/td><td colspan=\"2\"><\/td><td colspan=\"4\"><\/td><td colspan=\"2\"><\/td><\/tr><tr><td rowspan=\"5\">작<br>성<br>자<\/td><td rowspan=\"5\">작성일<\/td><td colspan=\"5\" rowspan=\"5\">년      월     일<\/td><td colspan=\"2\" rowspan=\"4\">작 성 자<\/td><td colspan=\"6\">성명：                     (서명 또는 날인)<\/td><\/tr><\/table><table class=\"htbl\"><tr><td colspan=\"15\">(뒤쪽)<\/td><\/tr><tr><td colspan=\"6\">소속：<\/td><\/tr><tr><td colspan=\"6\">직급：<\/td><\/tr><tr><td colspan=\"6\">연락처：<\/td><\/tr><tr><td colspan=\"2\">관할경찰서명<\/td><td colspan=\"6\"><\/td><\/tr><\/table><div class=\"ln p\">2026년<\/div><div class=\"pchip\" id=\"p85\"><span>원문 85쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=97\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설 관리안내<\/div>", "pages": [{"p": 77, "t": "사회복지시설장 등의 실종아동등 발견 시 신고 및 신상카드 제출 의무\n*근거 : 「실종아동등의 보호 및 지원에 관한 법률」\n실종아동등 관련 의무\n(실종아동･장애인･치매환자 신고의무) 보호시설의 장 또는 그 종사자 등은 실종아동･장애인･치매환자를 발견 시 지체 없이 경찰청에 신고하여야 한다. (신상카드 작성･제출의무) 보호시설의 장 또는 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조제5호에 따른 정신의료기관의 장이 보호자가 확인되지 아니한 아동과 장애인, 치매환자를 보호하게 된 때에는 「실종아동 등의 보호 및 지원에 관한 법률 시행규칙」 별지 제2호 서식인 신상카드(별첨)를 작성하여 지방자치단체와 실종아동전문기관에 각각 제출하여야 한다. ※ 신고전화 : 경찰청 실종아동찾기센터 국번없이 182\n가\n실종아동등의 보호 및 지원 사업 개요\n1) 실종아동등의 정의\n약취･유인･유기･사고 또는 가출하거나 길을 잃는 등의 사유로 인하여 보호자로부터 이탈된 아래의 대상자\n‒실종당시 18세 미만 아동\n‒「장애인복지법」 제2조의 장애인 중 지적장애인･자폐성장애인･정신장애인(연령제한 없음)\n‒「치매관리법」 제2조제2호의 치매환자"}, {"p": 78, "t": "2) 실종아동등 신고의무자\n보호시설의 장 또는 그 종사자\n「아동복지법」 제13조에 따른 아동복지전담공무원\n「청소년 보호법」 제35조에 따른 청소년 보호･재활센터의 장 또는 그 종사자\n「사회복지사업법」 제14조에 따른 사회복지전담공무원\n「의료법」 제3조에 따른 의료기관의 장 또는 의료인\n업무･고용 등의 관계로 아동 등을 보호･감독하는 자\n☞누구든지 정당한 사유 없이 실종아동등을 경찰관서의 장에게 신고하지 아니하고 보호할 경우 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처함(실종아동법 제7조 위반)\n3) 실종아동등 신상카드 제출 의무자\n보호시설의 장 또는 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조제5호에 따른 정신의료기관의 장\n☞신상카드 미제출 시 200만 원 이하의 과태료 처함(실종아동법 제6조 위반)\n4) 실종아동등에 대한 유전자 검사 실시\n유전자검사 대상자\n‒보호시설의 입소자나 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 제3조제5호에 따른 정신의료기관의 입원환자 중 보호자가 확인되지 아니한 아동 등\n‒실종아동 등을 찾고자 하는 가족\n‒그 밖에 보호시설의 입소자였던 무연고 아동\n유전자검사 대상자의 유전자정보를 채취하여 실종아동등의 가족을 찾기 위해 활용"}, {"p": 79, "t": "나\n실종아동등 지원 사업의 업무 체계\n1) 관련기관별 협력 체계\n보건복지부 (실종아동전문기관) | 경찰청 (실종아동찾기센터, 국번없이 182) | 지방자치단체 | 보호시설 또는 정신의료 기관 등 | 다중이용 시설의 장\n정책 수립 및 시행 무연고 아동 등 신상카드 DB구축 실태조사 및 연구 실종예방 교육 및홍보 실종아동 등의 가족 지원 실종아동 등 조기 발견 지침 고시 기타 필요 사항 | 실종 신고 접수 수색 및 수사 유전자검사대상물채취 관계장소 출입･ 조사 위반사항 과태료 부과･징수 실종아동 등 조기 발견지침 준수에 대한 교육･훈련 사항 지도･감독 | 경찰관서에 실종 아동 등 발견 신고 ※경찰청 실종아동 찾기센터(www.safe182.go.kr) 신상카드 작성･ 제출여부 지도･ 감독 관계장소 출입･ 조사 위반사항 과태료 부과･징수 | 경찰관서에 실종 아동 등 발견 신고 ※경찰청 실종아동 찾기센터(www.safe182.go.kr) 신상카드 작성 제출 | 실종아동 등이 신고되는 경우 실종아동 등 조기 발견 지침에 따라 즉시 경보 발령, 수색, 출입구 감시 등의 조치 시설･장소의 종사자에게 실종 아동 등 조기발견 지침에 관한 교육･ 훈련 연1회 실시 경찰관서에 교육 실적 보고\n※ 실종자 가족지원사업, 실종예방사업, 신상카드 D/B 구축･운영 등은 실종아동전문기관에서 위탁 수행\n2) 지방자치단체 공무원의 역할\n실종아동 등의 보호조치 및 지도･감독 의무\n‒실종아동 등을 보호 조치할 때에는 아동 등의 신상을 기록한 신고접수서를 작성하여 경찰청에 신고해야 함\n‒실종아동 신고 의무 및 신상카드 제출의무에 관한 사항을 지도･감독해야 함\n‒미신고 보호행위 신고접수：정당한 사유 없이 실종아동 등을 경찰관서장에게 신고하지 아니하고 보호할 수 없음\n※위반 시 5년 이하의 징역 또는 5천만 원 이하의 벌금\n무연고 아동･장애인 발견 시 일시보호센터 우선보호 조치\n‒실종아동･장애인 발생 시 지정된 일시보호센터로 이송 조치"}, {"p": 80, "t": "‒다만, 발생장소와 일시보호센터간 거리가 멀거나, 발견시간이 늦어 일시 보호 센터로 이동하기가 곤란한 경우 등 불가피한 상황이 발생하면 인근 보호시설로 보호조치 가능(1일 보호 기준)\n‒이 경우 인근보호시설은 일시보호센터에 유선으로 즉시 통보하고 최대한 빠른 시일내에 일시보호센터로 이송 조치\n다\n신상카드 제출대상인 무연고 아동･장애인 관련 지침(ʼ09.9.29시행)\n1) “보호자가 확인되지 아니한(무연고)” 아동등이란\n“보호자가 확인되지 아니한(무연고)” 아동등의 구체적 범위 및 기준은 다음 표와 같으며, 이들은 실종아동법상 신상카드 제출 및 유전자 채취의 대상이 됨\n2) 사회복지시설 등의 보호자가 확인되지 아니한 아동등의 정의 및 범위\n시설구분\n보호자가 확인되지 아니한(무연고) 아동･장애인의 정의 및 범위\n아동복지시설 및 장애인 복지시설\n가족관계등록부(구 호적)가 없는 아동 및 장애인 연고자를 알 수 없어 새로 성과 본을 창설(호적취득)한 아동 및 장애인 ‒단독으로 새로 성과 본을 창설한 아동 및 장애인 ‒시설장 등을 보호자로 새로 성과 본을 창설한 아동 및 장애인 ‒다만, 후견인 및 가정법원의 판결에 의해 입양된 아동중 친권포기각서가 있는 경우는 연고자로 인정 가족관계등록부(호적)은 있지만 시설입소 후 호적상의 보호자가 시설종사자 등과 직접면담 등 단 한 번의 방문도 없는 아동 및 장애인 ‒다만, 가족 연락두절 및 기피, 부양회피의 경우는 가족이 있다는 것이 확인된 것이므로 연고자로 관리 ※ 호적상의 보호자：부모, (외)조부모, (외)삼촌, 이모, 고모 일시아동보호시설 등 타 시설에서 전원시 구체적인 보호자 정보가 없는 아동 및 장애인\n정신병원 등 정신보건시설 및 노숙인 시설\n행려환자로서 관리번호 부여받은 실종아동 등 (정신보건시설) 시･군･구청장 또는 시･도지사가 보호자인 실종아동 등 시설입소 또는 병원 입원 후 새롭게 성과 본을 창설(호적취득)한 실종아동 등 시설입소 또는 병원입원 후 호적상의 보호자가 시설종사자 등과 직접면담 등단 한 번의 방문도 없는 실종아동 등 ‒다만, 가족 연락두절 및 기피, 부양회피의 경우는 가족이 있다는 것이 확인된 것이므로 연고자로 관리 ※ 호적상의 보호자：부모, (외)조부모, (외)삼촌, 이모, 고모"}, {"p": 81, "t": "3) “실종아동법상” 보호시설의 역할\n실종아동 등의 신고\n‒실종아동등임을 알게 된 때 경찰관서에 신고해야 함\n※ 신고전화 : 경찰청 실종아동찾기센터 국번없이 182\n※ 미신고 보호행위 금지(실종아동법 제7조 위반) : 5년 이하의 징역 또는 5천만 원 이하의 벌금에 처함\n신상카드 작성 및 제출\n‒보호자가 확인되지 아니한 아동 등이 입소한 경우 실종아동 등의 신상카드를 작성하여 지방자치단체와 실종아동전문기관에 각각 제출\n※신고의무 및 신상카드 미제출 시 200만 원 이하의 과태료 처함(실종아동법 제19조제2항)\n실종아동등 변동사항 보고\n‒보호 중인 실종아동등의 전원 및 퇴소 시 그 변동사항을 지방자치단체 및 실종아동전문기관에 보고\n경찰관서에서 보호시설 실종아동등에 대한 DNA 채취 시 적극 협조\n라\n신상카드 제출 방법\n1) 지방자치단체 제출방법\n①사회서비스정보시스템(희망이음)(www.ssis.go.kr) 접속\n②로그인 화면에서 공인인증서 로그인\n*시스템사용 신청은 사회서비스정보시스템(희망이음)에서 회원가입하여 아이디, 비밀번호 로그인 후 사회서비스정보시스템 사용신청 화면에서 사용신청하여 기관장의 승인\n③“대상자관리‒대상자기본정보관리‒대상자기본정보”에서 신규버튼 클릭 후 가족(연고)을 ‘무’로 선택하고 인적사항 입력 후 저장\n④“대상자관리‒대상자기본정보관리‒실종정보”에서 대상자 목록을 조회하여 대상자를 선택하고 신규 버튼을 클릭하여 실종자 정보와 하단의 신상카드 추가정보 입력 후 저장(출력버튼 클릭하여 신상카드 출력)"}, {"p": 82, "t": "※ 사회서비스정보시스템(희망이음) 개선 중이므로 개선완료시까지 공문으로 제출<아동학대대응과-3591(2022.5.2.) 참조>\n1) 지방자치단체 제출방법\n① 신상카드(실종아동법 시행규칙 별지 제2호 서식)를 작성하여 공문으로 제출\n② 보호중인 무연고 아동･장애인･치매환자의 보호현황(전원, 퇴소) 변동사항 발생 시 지방자치단체의 장에게 변동사항을 공문으로 제출\n2) 실종전문기관 제출방법\n가) 홈페이지 직접 입력\n①실종아동전문기관 홈페이지(www.missingchild.or.kr) 접속\n②로그인<회원이 아닌 경우, 회원가입 (기관회원 – 신상 카드 담당자)>\n③‘홈페이지>신상카드>제출하기’에서 신상카드 입력\n나) 실종아동 등 전원･퇴소 등 변동시\n-보호중인 무연고 아동･장애인･치매환자의 보호현황(전원, 퇴소) 변동사항 발생 시 제출(입력)한 신상카드 정보 변경\n①실종아동전문기관 홈페이지(www.missingchild.or.kr) 접속\n②‘홈페이지>로그인>신상카드>제출하기’에서 기존 입력했던 신상카드 목록 확인\n③해당 실종아동등 클릭하여 ‘보호아동등 조치사항’에 변동사항 추가 입력(전원, 퇴소 등) 후 저장"}, {"p": 83, "t": "[별지 제2호 서식] <개정 2008.7.31> | (앞쪽)\n신   상   카   드\n인적 사항 및 기본 사항 | 성  명 |  | 성별 | 번호 (   ) | 1.남 2.여 | 주민등록번호 | (당시    세, 추정/확실) | 사진 부착 (3㎝×4㎝)\n발견일자 | 년   월   일 | 발견지역 (주소) | \n발견 장소 | 번호 (   ) | 1. 아파트 2. 빌라 3. 주택가 4. 놀이터 5. 학교(유치원 등) 6. 타인의 집 7. 학원 8. 상가(시장) 9. 터미널･역 10. 종교시설(교회･성당･절 등) 11. 공원 12. \/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=100\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1. 사회복지시설 업무의 전자화<\/div><div class=\"ln p\">2. 사회서비스정보시스템(희망이음)의 활용<\/div><div class=\"ln p\">3. 사회복지시설 온라인 보고<\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>4. 기타사항<\/div><div class=\"ln p\">사회복지시설 업무의 전자화<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">목 적<\/div><div class=\"ln p\">사회복지시설의 회계, 인사, 후원금, 서비스 이력관리 등 정보화기반 지원으로 시설의 업무처리 지원 및 회계 투명성 제고<\/div><div class=\"ln p\">차세대 사회보장정보시스템(행복이음)구축과 함께 온라인 보고 등 사회복지시설 업무를 전자적으로 수행할 수 있도록 업무처리절차 제시<\/div><div class=\"ln p\">시설담당 공무원이 사회복지시설의 신고･변동관리, 온라인 보고정보의 시설보조금, 각종 복지급여 지급의 전자적 처리 등 업무에 쉽게 적용하도록 체계화<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">적용시기<\/div><div class=\"ln p\">2010년 1월 4일부터<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">적용대상 시설<\/div><div class=\"ln p\">노인, 장애인, 지역자활센터, 노숙인 등, 아동, 사회복지관 등 복지부 소관 사회복지시설<\/div><div class=\"ln p\">‒사회복지 사업관련 다음 법률에 의해 신고(지정)한 사회복지시설 중 보건복지부 소관의 시설<\/div><div class=\"ln p\">•「사회복지사업법」<\/div><div class=\"ln p\">• 「노인복지법」<\/div><div class=\"ln p\">• 「아동복지법」<\/div><div class=\"ln p\">• 「장애인복지법」<\/div><div class=\"pchip\" id=\"p89\"><span>원문 89쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=101\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">• 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」<\/div><div class=\"ln p\">• 「국민기초생활보장법」<\/div><div class=\"ln p\">• 「농어촌주민의 보건복지증진을 위한 특별법」<\/div><div class=\"ln p\">• 「노숙인 등의 복지 및 자립지원에 관한 법률」<\/div><div class=\"ln p\">한부모가족, 성매매, 성폭력, 가정폭력시설 등 성평등가족부 소관시설은 성평등가족부의 별도 지침에 따라 적용<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">용어의 정의<\/div><div class=\"ln p\">차세대 사회보장정보시스템(행복이음)：「사회보장기본법」 제37조 규정에 의거 사회보장 수급권자 선정 및 급여 관리 등에 관한 정보를 통합･연계하여 처리･기록 및 관리하는 시스템<\/div><div class=\"ln p\">사회복지시설정보시스템：「사회복지사업법」 제6조의2 규정에 의해 사회복지법인 및 시설업무의 전자화를 위하여 구축한 사회복지시설 통합업무관리시스템<\/div><div class=\"ln p\">‒ 통합회계관리：회계, 예산, 세무, 인사, 급여, 자산 등 관리<\/div><div class=\"ln note\">※ ’25년1월 사회서비스정보시스템(희망이음) 인사회계기능(ERP)으로 기능 이관: 희망이음 〉인사회계<\/div><div class=\"ln p\">사회서비스정보시스템(희망이음) : 「사회보장급여법」 제24조의2 규정에 의해 사회서비스 제공기관의 업무를 전자화하고 업무 수행에 필요한 정보를 통합･연계하여 처리･기록 및 관리하는 정보시스템<\/div><div class=\"ln p\">‒ 통합회계관리：회계, 예산, 세무, 인사, 급여, 자산 등 관리<\/div><div class=\"ln p\">‒ 통합고객관리：후원자, 후원금 관리<\/div><div class=\"ln p\">‒온라인 보고：행복이음으로 시설 수급자 생계급여, 운영비 등 보조금 신청･정산, 입소자･종사자, 예･결산 등을 보고<\/div><div class=\"ln p\">‒ 서비스 제공관리 : 시설 유형별 사회복지서비스 제공이력 관리<\/div><div class=\"ln p\">‒ 민관협력 : 공공과 민간의 보건복지 자원 공유, 대상자 정보 공유<\/div><div class=\"ln p\">행정업무지원시스템 : 사회서비스정보시스템(희망이음)을 통해 수집･관리되고 있는 시설현황, 종사자, 평가자료 등의 정보를 활용하여 담당 공무원의 정책추진 지원 및 관리 역량 확대를 위한 기반 마련<\/div><div class=\"ln p\">‒ 시설현황, 생활인 및 종사자 현황 조회<\/div><div class=\"pchip\" id=\"p90\"><span>원문 90쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=102\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">‒ 예산집계 및 집계현황<\/div><div class=\"ln p\">‒ 회계정보<\/div><div class=\"ln p\">‒ 시설평가 및 안전점검 관리<\/div><div class=\"ln p\">‒ 보조금 카드 발급현황 및 이상결제 모니터링<\/div><div class=\"ln note\">※ ’22년 행복이음 구축에 따라 행정업무지원시스템은 행복이음으로 기능이 이관: 행복이음 〉시설법인, 행복이음 〉기관관리감독<\/div><div class=\"ln p\">민간개발정보시스템：사회복지시설 등이 민간업체가 개발･보급한 상용S/W를 구입하거나 자체개발하여 사용하는 정보시스템으로, 동 시스템 사용시설은 사회서비스정보시스템(희망이음)의 표준연계모듈을 통해 연계하여 행복이음으로 온라인 보고업무를 처리<\/div><div class=\"ln note\">※ 표준연계모듈：사회서비스정보시스템(희망이음)과 민간개발정보시스템을 연계하여 온라인보고 정보를 원활히 전송할 수 있도록 한 연계 표준<\/div>", "pages": [{"p": 88, "t": "1. 사회복지시설 업무의 전자화\n2. 사회서비스정보시스템(희망이음)의 활용\n3. 사회복지시설 온라인 보고\n4. 기타사항\n1\n사회복지시설 업무의 전자화\n가\n목 적\n사회복지시설의 회계, 인사, 후원금, 서비스 이력관리 등 정보화기반 지원으로 시설의 업무처리 지원 및 회계 투명성 제고\n차세대 사회보장정보시스템(행복이음)구축과 함께 온라인 보고 등 사회복지시설 업무를 전자적으로 수행할 수 있도록 업무처리절차 제시\n시설담당 공무원이 사회복지시설의 신고･변동관리, 온라인 보고정보의 시설보조금, 각종 복지급여 지급의 전자적 처리 등 업무에 쉽게 적용하도록 체계화\n나\n적용시기\n2010년 1월 4일부터\n다\n적용대상 시설\n노인, 장애인, 지역자활센터, 노숙인 등, 아동, 사회복지관 등 복지부 소관 사회복지시설\n‒사회복지 사업관련 다음 법률에 의해 신고(지정)한 사회복지시설 중 보건복지부 소관의 시설\n•「사회복지사업법」\n• 「노인복지법」\n• 「아동복지법」\n• 「장애인복지법」"}, {"p": 89, "t": "• 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」\n• 「국민기초생활보장법」\n• 「농어촌주민의 보건복지증진을 위한 특별법」\n• 「노숙인 등의 복지 및 자립지원에 관한 법률」\n한부모가족, 성매매, 성폭력, 가정폭력시설 등 성평등가족부 소관시설은 성평등가족부의 별도 지침에 따라 적용\n라\n용어의 정의\n차세대 사회보장정보시스템(행복이음)：「사회보장기본법」 제37조 규정에 의거 사회보장 수급권자 선정 및 급여 관리 등에 관한 정보를 통합･연계하여 처리･기록 및 관리하는 시스템\n사회복지시설정보시스템：「사회복지사업법」 제6조의2 규정에 의해 사회복지법인 및 시설업무의 전자화를 위하여 구축한 사회복지시설 통합업무관리시스템\n‒ 통합회계관리：회계, 예산, 세무, 인사, 급여, 자산 등 관리\n※ ’25년1월 사회서비스정보시스템(희망이음) 인사회계기능(ERP)으로 기능 이관: 희망이음 〉인사회계\n사회서비스정보시스템(희망이음) : 「사회보장급여법」 제24조의2 규정에 의해 사회서비스 제공기관의 업무를 전자화하고 업무 수행에 필요한 정보를 통합･연계하여 처리･기록 및 관리하는 정보시스템\n‒ 통합회계관리：회계, 예산, 세무, 인사, 급여, 자산 등 관리\n‒ 통합고객관리：후원자, 후원금 관리\n‒온라인 보고：행복이음으로 시설 수급자 생계급여, 운영비 등 보조금 신청･정산, 입소자･종사자, 예･결산 등을 보고\n‒ 서비스 제공관리 : 시설 유형별 사회복지서비스 제공이력 관리\n‒ 민관협력 : 공공과 민간의 보건복지 자원 공유, 대상자 정보 공유\n행정업무지원시스템 : 사회서비스정보시스템(희망이음)을 통해 수집･관리되고 있는 시설현황, 종사자, 평가자료 등의 정보를 활용하여 담당 공무원의 정책추진 지원 및 관리 역량 확대를 위한 기반 마련\n‒ 시설현황, 생활인 및 종사자 현황 조회"}, {"p": 90, "t": "‒ 예산집계 및 집계현황\n‒ 회계정보\n‒ 시설평가 및 안전점검 관리\n‒ 보조금 카드 발급현황 및 이상결제 모니터링\n※ ’22년 행복이음 구축에 따라 행정업무지원시스템은 행복이음으로 기능이 이관: 행복이음 〉시설법인, 행복이음 〉기관관리감독\n민간개발정보시스템：사회복지시설 등이 민간업체가 개발･보급한 상용S/W를 구입하거나 자체개발하여 사용하는 정보시스템으로, 동 시스템 사용시설은 사회서비스정보시스템(희망이음)의 표준연계모듈을 통해 연계하여 행복이음으로 온라인 보고업무를 처리\n※ 표준연계모듈：사회서비스정보시스템(희망이음)과 민간개발정보시스템을 연계하여 온라인보고 정보를 원활히 전송할 수 있도록 한 연계 표준"}]}, {"title": "2. 사회서비스정보시스템(희망이음)의 활용", "start": 91, "end": 94, "html": "<div class=\"pchip\" id=\"p91\"><span>원문 91쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=103\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회서비스정보시스템(희망이음)의 활용<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회서비스정보시스템(희망이음) 개요<\/div><div class=\"ln p\">1)추진배경 및 목적<\/div><div class=\"ln p\">사회복지시설 정보화 기반 조성, 회계의 투명성 제고, 시설관리 업무의 간소화 및 표준화, 사회복지정책 기초 자료 확보 등을 목적으로 함<\/div><div class=\"ln p\">2)추진경과<\/div><div class=\"ln p\">ʼ05년∼：장애인, 노인, 아동, 사회복지관 등 순차적으로 사회복지시설 운영의 전자화 추진으로 ‘사회복지시설정보시스템’ 구축<\/div><div class=\"ln p\">ʼ08년：새올복지행정시스템과 사회복지시설정보시스템간 연계시스템이 구축되어 보조금 신청 및 보고를 온라인으로 수행<\/div><div class=\"ln p\">ʼ10. 1월：행복이음으로 보조금 신청 및 보고 등 연계시스템 변경<\/div><div class=\"ln note\">※(10월) 시설 생계급여, (11월) 시설 운영비 및 사업비 등 행복이음으로 전산지급 의무화<\/div><div class=\"ln p\">ʼ12. 6월：보조금 전용카드제도 전국 시행 확대<\/div><div class=\"ln p\">ʼ12. 8월：후원금의 수입명세･사용결과보고서 보고 의무화<\/div><div class=\"ln note\">※「사회복지법인 및 사회복지시설 재무･회계 규칙」 제20조(결산보고서에 첨부하여야 할 서류)<\/div><div class=\"ln p\">ʼ13년 ∼ ʼ14년：‘사회복지시설정보시스템’ 고도화 사업<\/div><div class=\"ln p\">ʼ15년 ∼ ʼ17년：시설평가, 안전점검, 사회복지법인‒시설 통합관리 기능개선<\/div><div class=\"ln p\">’22년 9월 : 사회서비스정보시스템(희망이음)으로 전면 개편<\/div><div class=\"ln h4\">3) 운영 기관<\/div><div class=\"ln p\">한국사회보장정보원<\/div><div class=\"ln note\">※사회서비스정보시스템 홈페이지(https://www.ssis.go.kr) 참조<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">주요기능<\/div><div class=\"pchip\" id=\"p92\"><span>원문 92쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=104\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">통합회계관리<\/div><div class=\"ln p\">‒회계 관리, 예산관리, 세무관리, 인사관리, 급여관리, 자산(비품, 소모품)관리<\/div><div class=\"ln p\">통합고객관리<\/div><div class=\"ln p\">‒후원자, 후원금 관리<\/div><div class=\"ln p\">‒후원약속사항(기탁서) 등록, 수입사용 내역 관리 및 공시<\/div><div class=\"ln p\">온라인 보고<\/div><div class=\"ln p\">‒행복이음으로 시설 수급자 생계급여, 운영비 등 보조금 신청･정산, 입소자･종사자, 예･결산, 후원금, 운영위원회 결과, 지도점검 조치결과 등을 보고 및 신청<\/div><div class=\"ln p\">‒지자체 공지사항, 질의응답 등 지역사회 내의 의사소통정보 연계<\/div><div class=\"ln p\">시설 유형별 사회복지서비스 이력관리<\/div><div class=\"ln p\">‒사업 및 프로그램 관리, 온라인을 통한 신청 지원<\/div><div class=\"ln p\">‒기관별 맞춤형 서식을 활용한 각종 입소자 및 이용자 관리, 수혜서비스 제공기록 관리, 사례관리, 각종 일지 관리 등<\/div><div class=\"ln p\">민관 정보공유 및 협업<\/div><div class=\"ln p\">‒지역사회 내 공공과 민간의 보건복지 자원 공유<\/div><div class=\"ln p\">‒복지 대상자 정보 공유<\/div><table class=\"htbl\"><tr><td>구 분<\/td><td>노인생활/재가<\/td><td>노인<br>복지관<\/td><td>아동<br>생활<\/td><td>지역<br>아동<\/td><td>장애인<br>생활<\/td><td>장애인<br>직업재활<\/td><td>사회<br>복지관<\/td><td>지역<br>자활<\/td><td>한부모가족<\/td><td>노숙인<\/td><td>정신<br>보건<\/td><\/tr><tr><td>대상자관리<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><\/tr><tr><td>사업관리<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>X<\/td><td>O<\/td><td>O<\/td><\/tr><tr><td>서비스/프로그램 관리<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><\/tr><tr><td>상담 및 사례관리<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><\/tr><tr><td>일지 및 회의관리<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><\/tr><tr><td>현황 및 통계<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><\/tr><tr><td>급식관리<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>O<\/td><td>X<\/td><td>X<\/td><td>O<\/td><td>O<\/td><\/tr><\/table><div class=\"pchip\" id=\"p93\"><span>원문 93쪽 <span class=\"approx\">(약)<\/span><\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=105\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설 보조금 전용카드 사용내역 모니터링<\/div><div class=\"ln p\">‒사회복지시설의 보조금 전용카드 지출결의 내역 열람 및 모니터링<\/div><div class=\"ln p\">•광역자치단체별 보조금 전용카드제 도입, 보조금 전용카드 사용내역 연계 등 모니터링<\/div><div class=\"ln p\">중앙부처 및 지자체 시설 관리업무 지원<\/div><div class=\"ln p\">‒희망이음 수집 정보를 기반으로 보건복지부, 지자체 담당 공무원에게 통계(시설, 입소자, 종사자 현황 등) 및 정책 기초자료 제공<\/div><div class=\"ln p\">유관기관(단체) 정보연계<\/div><div class=\"ln p\">‒지자체 복지시설 관리(시설생계급여, 보조사업, 종사자 등)를 위한 사회보장정보시스템 연계<\/div><div class=\"ln p\">‒실종자의 조기발견 및 복귀를 위한 무연고 입소자에 대한 경찰청 연계<\/div><div class=\"ln p\">‒복지시설 요금감면(통신요금, 가스요금 등) 절차 간소화를 위한 자격정보 연계<\/div><div class=\"ln p\">‒지자체 복지행정시스템과 연계<\/div><div class=\"ln p\">시설 이용(희망)자 대상 정보제공<\/div><div class=\"ln p\">‒복지시설 기본정보(유형, 소재지, 연락처 등), 평가, 제공서비스 등 정보제공<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">사용대상<\/div><div class=\"pchip\" id=\"p94\"><span>원문 94쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=106\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">본 안내책자에서 규정한 사회복지시설(노인, 장애인, 아동 등) 중 보건복지부 소관의 사회복지시설 및 사회복지법인(사회복지시설을 설치･운영하는 법인 또는 국가나 지방자치단체로부터 보조금을 받는 법인)<\/div><div class=\"ln note\">※「Ⅰ. 사회복지시설 현황 &gt; 2. 사회복지시설의 종류 &gt; [보건복지부 소관 사회복지시설의 세부분류]」 참조(p.4)<\/div><div class=\"ln p\">다만, 어린이집, 경로당, 노인교실 등은 대상 시설에서 제외<\/div><div class=\"ln p\">또한, 법 38조에 따라 시설 폐지 신고를 한 경우 폐지 신고가 수리된 즉시 사회서비스정보시스템 사용 대상에서 제외되므로 폐지 신고 수리 전까지 회계처리, 보조금 정산 등의 업무 처리를 마무리하여야 함<\/div><div class=\"ln note\">※ 다만, 시설 폐쇄 명령 등으로 시설이 폐지되는 등 불가피하게 시설 폐지 이후에도 회계 처리, 결산 보고, 보조금 정산, 입소자 퇴소 보고, 종사자 퇴사 보고 등의 조치를 위해 사회서비스정보시스템(희망이음)을 사용해야 하는 경우 희망이음을 통해 시스템 접근권한 연장을 신청하면, 지자체에서 행복이음을 통해 시스템 접근권한 연장 신청 승인 또는 반려 처리(최대 2회까지 각 30일한도 내에서 연장)<\/div>", "pages": [{"p": 91, "t": "2\n사회서비스정보시스템(희망이음)의 활용\n가\n사회서비스정보시스템(희망이음) 개요\n1)추진배경 및 목적\n사회복지시설 정보화 기반 조성, 회계의 투명성 제고, 시설관리 업무의 간소화 및 표준화, 사회복지정책 기초 자료 확보 등을 목적으로 함\n2)추진경과\nʼ05년∼：장애인, 노인, 아동, 사회복지관 등 순차적으로 사회복지시설 운영의 전자화 추진으로 ‘사회복지시설정보시스템’ 구축\nʼ08년：새올복지행정시스템과 사회복지시설정보시스템간 연계시스템이 구축되어 보조금 신청 및 보고를 온라인으로 수행\nʼ10. 1월：행복이음으로 보조금 신청 및 보고 등 연계시스템 변경\n※(10월) 시설 생계급여, (11월) 시설 운영비 및 사업비 등 행복이음으로 전산지급 의무화\nʼ12. 6월：보조금 전용카드제도 전국 시행 확대\nʼ12. 8월：후원금의 수입명세･사용결과보고서 보고 의무화\n※「사회복지법인 및 사회복지시설 재무･회계 규칙」 제20조(결산보고서에 첨부하여야 할 서류)\nʼ13년 ∼ ʼ14년：‘사회복지시설정보시스템’ 고도화 사업\nʼ15년 ∼ ʼ17년：시설평가, 안전점검, 사회복지법인‒시설 통합관리 기능개선\n’22년 9월 : 사회서비스정보시스템(희망이음)으로 전면 개편\n3) 운영 기관\n한국사회보장정보원\n※사회서비스정보시스템 홈페이지(https://www.ssis.go.kr) 참조\n나\n주요기능"}, {"p": 92, "t": "통합회계관리\n‒회계 관리, 예산관리, 세무관리, 인사관리, 급여관리, 자산(비품, 소모품)관리\n통합고객관리\n‒후원자, 후원금 관리\n‒후원약속사항(기탁서) 등록, 수입사용 내역 관리 및 공시\n온라인 보고\n‒행복이음으로 시설 수급자 생계급여, 운영비 등 보조금 신청･정산, 입소자･종사자, 예･결산, 후원금, 운영위원회 결과, 지도점검 조치결과 등을 보고 및 신청\n‒지자체 공지사항, 질의응답 등 지역사회 내의 의사소통정보 연계\n시설 유형별 사회복지서비스 이력관리\n‒사업 및 프로그램 관리, 온라인을 통한 신청 지원\n‒기관별 맞춤형 서식을 활용한 각종 입소자 및 이용자 관리, 수혜서비스 제공기록 관리, 사례관리, 각종 일지 관리 등\n민관 정보공유 및 협업\n‒지역사회 내 공공과 민간의 보건복지 자원 공유\n‒복지 대상자 정보 공유\n구 분 | 노인생활/재가 | 노인 복지관 | 아동 생활 | 지역 아동 | 장애인 생활 | 장애인 직업재활 | 사회 복지관 | 지역 자활 | 한부모가족 | 노숙인 | 정신 보건\n대상자관리 | O | O | O | O | O | O | O | O | O | O | O\n사업관리 | O | O | O | O | O | O | O | O | X | O | O\n서비스/프로그램 관리 | O | O | O | O | O | O | O | O | O | O | O\n상담 및 사례관리 | O | O | O | O | O | O | O | O | O | O | O\n일지 및 회의관리 | O | O | O | O | O | O | O | O | O | O | O\n현황 및 통계 | O | O | O | O | O | O | O | O | O | O | O\n급식관리 | O | O | O | O | O | O | O | X | X | O | O"}, {"p": 93, "t": "사회복지시설 보조금 전용카드 사용내역 모니터링\n‒사회복지시설의 보조금 전용카드 지출결의 내역 열람 및 모니터링\n•광역자치단체별 보조금 전용카드제 도입, 보조금 전용카드 사용내역 연계 등 모니터링\n중앙부처 및 지자체 시설 관리업무 지원\n‒희망이음 수집 정보를 기반으로 보건복지부, 지자체 담당 공무원에게 통계(시설, 입소자, 종사자 현황 등) 및 정책 기초자료 제공\n유관기관(단체) 정보연계\n‒지자체 복지시설 관리(시설생계급여, 보조사업, 종사자 등)를 위한 사회보장정보시스템 연계\n‒실종자의 조기발견 및 복귀를 위한 무연고 입소자에 대한 경찰청 연계\n‒복지시설 요금감면(통신요금, 가스요금 등) 절차 간소화를 위한 자격정보 연계\n‒지자체 복지행정시스템과 연계\n시설 이용(희망)자 대상 정보제공\n‒복지시설 기본정보(유형, 소재지, 연락처 등), 평가, 제공서비스 등 정보제공\n다\n사용대상"}, {"p": 94, "t": "본 안내책자에서 규정한 사회복지시설(노인, 장애인, 아동 등) 중 보건복지부 소관의 사회복지시설 및 사회복지법인(사회복지시설을 설치･운영하는 법인 또는 국가나 지방자치단체로부터 보조금을 받는 법인)\n※「Ⅰ. 사회복지시설 현황 > 2. 사회복지시설의 종류 > [보건복지부 소관 사회복지시설의 세부분류]」 참조(p.4)\n다만, 어린이집, 경로당, 노인교실 등은 대상 시설에서 제외\n또한, 법 38조에 따라 시설 폐지 신고를 한 경우 폐지 신고가 수리된 즉시 사회서비스정보시스템 사용 대상에서 제외되므로 폐지 신고 수리 전까지 회계처리, 보조금 정산 등의 업무 처리를 마무리하여야 함\n※ 다만, 시설 폐쇄 명령 등으로 시설이 폐지되는 등 불가피하게 시설 폐지 이후에도 회계 처리, 결산 보고, 보조금 정산, 입소자 퇴소 보고, 종사자 퇴사 보고 등의 조치를 위해 사회서비스정보시스템(희망이음)을 사용해야 하는 경우 희망이음을 통해 시스템 접근권한 연장을 신청하면, 지자체에서 행복이음을 통해 시스템 접근권한 연장 신청 승인 또는 반려 처리(최대 2회까지 각 30일한도 내에서 연장)"}]}, {"title": "3. 사회복지시설 온라인 보고", "start": 95, "end": 107, "html": "<div class=\"pchip\" id=\"p95\"><span>원문 95쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=107\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>사회복지시설 온라인 보고<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">온라인 보고 개요<\/div><div class=\"ln h4\">1) 추진배경 및 목적<\/div><div class=\"ln p\">ʼ08년부터 사회복지시설 업무의 효율화 및 시설회계의 투명성 제고를 위해 새올복지행정시스템(시･군･구용)과 사회복지시설정보시스템(사회복지시설용 간 연계시스템이 구축되어 보조금 신청 및 보고 등을 온라인으로 수행하였으며,<\/div><div class=\"ln p\">ʼ10년 1월 행복이음이 구축됨에 따라, 사회복지시설은 사회복지시설정보시스템 ➩ 행복이음으로 보조금 신청 및 보고를 하고 지자체 공무원은 이 정보를 기준으로 보조금 신청 교부 등 각종 업무를 처리함<\/div><div class=\"ln p\">’22년 차세대 행복이음 구축에 따라 희망이음 ➩ 행복이음으로 보조금 신청 등 보고 업무를 수행<\/div><div class=\"ln p\">☞ 희망이음을 통해 복지대상자 관리와 보조금 신청･시설수급자 현황 등을 온라인으로 보고하여 자료관리의 정확성 제고<\/div><div class=\"ln h4\">2) 추진방침<\/div><div class=\"ln p\">사회서비스정보시스템(희망이음)의 사용대상 시설은 온라인으로 보조금 신청 및 보고를 의무적으로 실시하고 시설업무 담당 공무원은 보고된 정보를 기준으로 보조금 신청 교부 등 각종 업무를 처리<\/div><div class=\"ln p\">이를 위해 사회서비스정보시스템(희망이음)의 관리정보(입소자 및 이용자 명부, 종사자 명부 등)를 기반으로 자동으로 생성되는 보고 정보를 활용하여 각종 보고서를 작성하고 수기(서면)보고는 폐지<\/div><div class=\"ln p\">또한 ʼ10년 10월 시군구 온라인 보고 의무화 정책 시행에 따라 사회복지시설 수급자 생계급여 등 보조금은 원칙적으로 온라인 교부신청 시에만 교부<\/div><div class=\"ln p\">☞다만, 시･도별로 시설유형 및 시･도 여건에 따른 서면보고가 불가피한 시설의 경우 보건복지부의 사전승인 필요<\/div><div class=\"pchip\" id=\"p96\"><span>원문 96쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=108\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">3) 지방자치단체의 역할<\/div><div class=\"ln p\">자치단체장은 사회복지법인 및 사회복지시설이 사회서비스정보시스템(희망이음)을 사용 하도록 독려하여 동 시스템의 확산 및 정착 추진<\/div><div class=\"ln p\">‒새로 개설되는 사회복지법인･시설의 경우 사회복지시설 신고단계에서 사회서비스정보시스템(희망이음)을 사용하도록 추진<\/div><div class=\"ln p\">‒기존시설의 경우에도 온라인보고에 어려움을 겪거나, 사회서비스정보시스템(희망이음)을 통해 회계, 후원금, 이력관리, 온라인보고 등의 업무를 처리하고자 하는 경우 적극 지원<\/div><div class=\"ln note\">※한국사회보장정보원이 시･도 사회복지협의회를 통해 진행하는 시스템 사용자교육이 원활히 추진될 수 있도록 조치<\/div><div class=\"ln note\">※보조금 청구, 정산보고, 입소자 및 종사자 보고, 후원금 수입 및 사용결과보고는 희망이음을 통해서만 하는 것을 원칙으로 함, 이를 보조금 교부 조건으로 명시, 수탁시설의 경우 위탁계약에 명시<\/div><div class=\"ln p\">희망이음의 표준화된 양식 및 보고문서 활용<\/div><div class=\"ln note\">※희망이음의 양식 및 보고 문서를 표준으로 사용함으로써 지자체별로 별도 존재하던 비표준 문서 유통을 사전에 차단<\/div><div class=\"ln h4\">4) 온라인 보고 범위 및 절차<\/div><div class=\"ln p\">주요 보고 서식<\/div><div class=\"pchip\" id=\"p97\"><span>원문 97쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=109\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>적용대상<\/td><td colspan=\"2\">제출서 유형<\/td><td>보 고 대 상 문 서<\/td><td>보고주기<\/td><\/tr><tr><td rowspan=\"18\">사회복지<br>시설공통<\/td><td rowspan=\"5\">보조금 보고<\/td><td rowspan=\"2\">보조금<br>교부신청<\/td><td>운영비<br>‒보조금교부신청서, 보조금교부청구서, 예산신청내역서, 인건비 산출내역서, 개인별시간외근무내역서, 이용아동 명부 (지역아동센터의 경우)<\/td><td>월/분기/반기/년<\/td><\/tr><tr><td>생계비<br>‒ 생계급여산출명단<br>※시설생계급여 신청시 교부신청서류 중 금액이 표기된 보조금 교부 신청서, 보조금교부청구서, 예산신청내역서, 생계급여산출 내역서를 제외하고 생계급여산출명단만 제출<\/td><td>월<\/td><\/tr><tr><td>보조금<br>정산보고<\/td><td>보조금정산보고서, 보조금정산내역서(명부 포함), 총계정원장<\/td><td>월/분기/반기/년<\/td><\/tr><tr><td>기능보강<br>보조금 교부신청<\/td><td>기능보강사업 보조금교부신청서, 기능보강사업보조금교부 청구서, 기능보강사업 예산신청내역서<\/td><td>월/분기/반기/년<\/td><\/tr><tr><td>기능보강 보조금 정산보고<\/td><td>기능보강사업 정산보고서, 기능보강사업정산내역서, 구입장비세부 목록<\/td><td>월/분기/반기/년<\/td><\/tr><tr><td rowspan=\"3\">입소자보고<\/td><td>입소자입퇴소<br>발생보고<\/td><td>입소자입퇴소발생보고, 입소자사망발생보고<\/td><td>발생즉시<\/td><\/tr><tr><td>입소자등록정보<br>변경보고<\/td><td>입소자등록정보변경보고<\/td><td>발생즉시<\/td><\/tr><tr><td>병원입퇴원보고<\/td><td>병원입퇴원보고<\/td><td>발생즉시<\/td><\/tr><tr><td>이용자 보고<\/td><td>이용자 보고<\/td><td>이용자 이용/종료 발생보고<\/td><td>발생즉시<br>(필요시)<\/td><\/tr><tr><td rowspan=\"3\">종사자보고<\/td><td>종사자입퇴사<br>발생보고<\/td><td>종사자입퇴사발생보고, 자격증보고<\/td><td>발생즉시<\/td><\/tr><tr><td>종사자 등록정보 변경보고<\/td><td>종사자 등록정보 변경보고<\/td><td>발생즉시<\/td><\/tr><tr><td>종사자 수당 신청<\/td><td>종사자 수당 신청<\/td><td>월<\/td><\/tr><\/table><table class=\"htbl\"><tr><td>적용대상<\/td><td colspan=\"2\">제출서 유형<\/td><td>보 고 대 상 문 서<\/td><td>보고주기<\/td><\/tr><tr><td colspan=\"2\">복지시설 변경보고<\/td><td>복지시설 변경보고(명칭, 소재지 등)<\/td><td>발생즉시<\/td><\/tr><tr><td colspan=\"2\">시설 휴(폐)업/재개 보고<\/td><td>시설 휴(폐)업/재개 신고서<\/td><td>발생즉시<\/td><\/tr><tr><td colspan=\"2\">예산서<\/td><td>예산총괄표, 예산서내역, 사업계획서(파일첨부)<\/td><td>년<\/td><\/tr><tr><td colspan=\"2\">추경 예산서<\/td><td>추경예산총괄표, 추경예산서내역, 수정사업계획서(파일첨부)<\/td><td>년<\/td><\/tr><tr><td colspan=\"2\">세입･세출<br>결산 보고<\/td><td>결산총괄표, 세입결산서, 세출결산서, 사업수입명세서, 정부보조금 명세서, 후원금품 수입사용내역서 등<\/td><td>년<\/td><\/tr><tr><td colspan=\"2\">비정형 업무보고<\/td><td>비정형 업무보고(파일첨부)<\/td><td>수시<\/td><\/tr><tr><td rowspan=\"4\">장기요양<\/td><td colspan=\"2\">장기요양 인력변경 보고<\/td><td>변경신고서, 인력변경현황<\/td><td rowspan=\"4\">발생<br>즉시<\/td><\/tr><tr><td colspan=\"2\">특별회계 적립사용 계획 보고<\/td><td>적립사용계획서<\/td><\/tr><tr><td colspan=\"2\">시설 설치 전 차입금 보고<\/td><td>설치 전 차입금 상세내역<\/td><\/tr><tr><td colspan=\"2\">시설 설치 후 차입금 보고<\/td><td>설치 후 차입금 상세내역<\/td><\/tr><\/table><div class=\"pchip\" id=\"p98\"><span>원문 98쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=110\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">온라인 보고 범위<\/div><table class=\"htbl\"><tr><td rowspan=\"2\">시설유형<\/td><td colspan=\"5\">보고문서 범위<\/td><\/tr><tr><td>보조금 신청/정산<\/td><td>종사자<\/td><td>입소자<\/td><td>후원금<\/td><td>예/결산<\/td><\/tr><tr><td>보조금 지급시설<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>○<\/td><\/tr><tr><td>보조금 미지급시설<\/td><td>×<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>○<\/td><\/tr><tr><td>지자체 설치시설(위탁운영)<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>○<\/td><td>○<\/td><\/tr><\/table><div class=\"ln note\">※시･도에서 직접 보조금을 지급하는 시설의 경우 온라인보고 여부 및 보고절차 등을 자체 판단하여 시행<\/div><div class=\"ln p\">온라인보고 절차<\/div><div class=\"ln p\">‒지자체는 보조금 지급시설에 대하여 보조사업 정보를 희망이음으로 전송<\/div><div class=\"ln p\">‒사회복지시설은 희망이음에서 보고문서(보조금 신청, 종사자 보고, 입소자 보고, 후원금품 보고 등) 작성 및 행복이음으로 보고문서 전송<\/div><div class=\"ln p\">‒지자체는 행복이음을 통해 보고문서 접수 및 승인･반려 처리<\/div><div class=\"ln p\">‒지자체 및 사회복지시설간 보고문서 처리 결과 공유<\/div><div class=\"ln p\">온라인보고 개념도<\/div><div class=\"pchip\" id=\"p99\"><span>원문 99쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=111\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">주요 온라인보고 세부 절차<\/div><div class=\"ln h4\">1) 생활시설 입소자 보고<\/div><div class=\"ln p\">생활시설에서는 입소자에 대한 신변변화가 발생 시 온라인보고를 통해 즉시 보고<\/div><div class=\"ln p\">‒보고대상：입･퇴소 발생보고 / 사망 발생보고 / 입소자정보 변경보고<\/div><div class=\"ln p\">온라인보고는 입소 시 전입신고, 사망 시 사망신고 등과는 별도로 보고함<\/div><div class=\"ln note\">※입･퇴소 관련 보고 시에는 전체 입소자는 반드시 주민등록변경(전입, 전출) 신고가 선행되어 있어야 하며, 주민등록변경일자를 기준으로 입･퇴소일자를 보고하도록 함<\/div><div class=\"ln p\">보고된 정보를 자치단체에서 확정하면 수급자의 자격과 생계비 등 급여가 자동으로 확정 및 생성됨<\/div><div class=\"ln p\">‒시스템에서 타 시설 중복 등록 여부 등 부적정 수급을 방지하기 위해 제공되는 기능을 확인하고 확정함<\/div><div class=\"ln p\">‒보조금 신청 시 입소자의 생계비는 입소보고가 된 생활인에 대하여 자동 생성 되며, 중복지급, 사망자 대상 부적정 지급 등을 방지하기 위해서는 반드시 온라인을 통해 입소자 보고를 하여야 함<\/div><div class=\"ln p\">입소자의 입･퇴소일자 등이 변경되는 경우 입소자정보변경보고를 수행함<\/div><div class=\"ln p\">입･퇴소자 보고 처리절차<\/div><div class=\"pchip\" id=\"p100\"><span>원문 100쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=112\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">2) 종사자 보고<\/div><div class=\"ln p\">모든 사회복지시설에서는 종사자에 대한 입･퇴사 발생 시 온라인보고를 통해 보고<\/div><div class=\"ln p\">‒보고대상：입･퇴사 발생보고 / 종사자등록정보변경보고<\/div><div class=\"ln note\">※보조금 지급 대상이 되는 종사자 뿐만 아니라, 모든 종사자에 대한 정보 시스템 입력 권고<\/div><div class=\"ln p\">보고된 정보를 자치단체에서 확정하면 해당 시설 종사자로 자동 등록<\/div><div class=\"ln p\">‒시스템에서 타 시설 중복 등록 여부 등 종사자의 인건비 이중 수급을 방지하기 위해 제공되는 기능을 확인하고 확정함<\/div><div class=\"ln p\">‒보조금 신청 시 종사자의 인건비는 입사보고가 된 종사자에 대하여 자동생성 되며, 중복지급 등을 방지하기 위해서는 반드시 온라인을 통해 종사자 보고를 하여야 함<\/div><div class=\"ln p\">종사자의 입･퇴사일자, 직종 등이 변경되는 경우 종사자등록정보변경보고를 수행함<\/div><div class=\"ln p\">종사자 보고 처리절차<\/div><div class=\"ln p\">종사자 처우개선을 위해 지자체에서 직접 수당을 지급(지자체➝종사자)하는 경우 종사자 수당신청 보고를 활용<\/div><div class=\"ln note\">※시설을 통해 종사자 수당 등을 지원하는 경우(지자체➝시설➝종사자) 반드시 3.보조금 교부신청 정산보고를 사용하여 시설회계에 포함될 수 있도록 함<\/div><div class=\"pchip\" id=\"p102\"><span>원문 102쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=114\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>순번<\/td><td>항 목<\/td><td>수행주체<\/td><td>시스템<\/td><td>처리내용<\/td><\/tr><tr><td>1<\/td><td>종사자<br>입･퇴사 보고<\/td><td>시설<\/td><td>희망이음<\/td><td>입･퇴사 발생 시 보고<br>*종사자 보고 후 시･군･구 승인이 완료된 종사자에 한하여 종사자수당 신청 가능<\/td><\/tr><tr><td>2<\/td><td>전자결재 및 승인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>전자결재 완료 후 승인처리<\/td><\/tr><tr><td>3<\/td><td>종사자수당 신청<\/td><td>시설<\/td><td>희망이음<\/td><td>종사자수당 신청 기능을 활용하여 온라인 보고<\/td><\/tr><tr><td>4<\/td><td>전자결재 및 승인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>전자결재 완료 후 승인 처리<\/td><\/tr><tr><td>5<\/td><td>급여자료 생성<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>종사자수당 신청 건에 대한 급여자료 확인 및 출력<\/td><\/tr><tr><td>6<\/td><td>지출품의 및 지급<\/td><td>시･군･구<\/td><td>e호조<\/td><td>행복이음에서 출력한 급여자료를 첨부하여 지출품의<\/td><\/tr><\/table><div class=\"ln h4\">3) 보조금 교부신청 및 정산<\/div><div class=\"ln p\">사회복지시설의 보조금교부신청 대상 정보는 연초 또는 해당 사업이 확정되는 시점에 지자체에서 보조사업 정보를 등록<\/div><div class=\"ln p\">‒보조사업 정보 주요내용：사업년도, 사업코드, 사업명, 사업분류, 사업비(보조금 총액), 대상시설, 신청주기, 정산주기 등<\/div><div class=\"ln p\">‒지자체에서 보조사업정보를 해당 사회복지시설에 배정하지 않을 경우 사회복지 시설에서 보조금 신청이 불가함<\/div><div class=\"ln p\">사회복지시설에서는 지자체에서 배정한 보조사업(생계급여, 운영비, 사업비 등)에 따라 보조금 교부신청을 온라인으로 시행<\/div><div class=\"ln p\">‒입소자 생계급여 처리절차<\/div><div class=\"ln p\">•생계급여 예상액 및 지급액은 행복이음에서 자동 생성되고 시설에서는 생계급여 대상자명단만 제출<\/div><table class=\"htbl\"><tr><td>순번<\/td><td>항 목<\/td><td>수행주체<\/td><td>시스템<\/td><td>처리내용<\/td><\/tr><tr><td>1<\/td><td>입 소 자<br>입･퇴소 보고<\/td><td>시설<\/td><td>희망이음<\/td><td>입･퇴소 발생 시 보고<br>*입소자 보고 후 시군구 승인이 완료된 입소자에 한하여 생계급여 신청 가능<\/td><\/tr><tr><td>2<\/td><td>전자결재 및 승인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>전자결재 완료 후 승인처리<\/td><\/tr><tr><td>3<\/td><td>보조사업 등록 확인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>보조사업 정보 확인 및 배정<\/td><\/tr><tr><td>4<\/td><td>생계급여신청<\/td><td>시설<\/td><td>희망이음<\/td><td>시･군･구에서 배정한 보조사업에 대하여 보조금신청기능을 활용하여 온라인보고<br>※생계급여 산출대상 명단첨부(전월미지급대상자는 “시설생계급여미지급신청”으로 신청가능)<\/td><\/tr><tr><td>5<\/td><td>전자결재 및 승인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>전자결재 완료 후 보고문서 승인 처리<\/td><\/tr><tr><td>6<\/td><td>예상액 생성확인, 확정<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>생계급여에 대한 개인별 급여 예상액 확인, 확정<br>* 승인 완료된 보고문서의 입소자 기준<\/td><\/tr><tr><td>7<\/td><td>e‒호조 연계<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>확정된 생계급여 정보를 e‒호조로 전송<\/td><\/tr><tr><td>8<\/td><td>지출품의 및 지급<\/td><td>시･군･구<\/td><td>e‒호조<\/td><td>행복이음에서 전송한 보조금 정보를 활용하여 지출품의<\/td><\/tr><tr><td>9<\/td><td>생계급여산출내역<br>연계<\/td><td>시설<\/td><td>희망이음<\/td><td>행복이음의 생계급여 산출내역을 사회서비스정보시스템(희망이음)으로 연계하여 시설에서 정산보고 시 활용<\/td><\/tr><\/table><div class=\"ln p\">‒운영비(인건비), 사업비, 기능보강사업비 등 처리 절차<\/div><table class=\"htbl\"><tr><td>순번<\/td><td>항 목<\/td><td>수행주체<\/td><td>시스템<\/td><td>처리내용<\/td><\/tr><tr><td>1<\/td><td>(인건비 신청 시)<br>종사자 입퇴사 보고<\/td><td>시설<\/td><td>희망이음<\/td><td>입퇴사 발생 시 보고<br>*종사자 보고 후 시군구 승인이 완료된 종사자에 한하여 인건비 신청 가능<\/td><\/tr><tr><td>2<\/td><td>전자결재 및 승인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>전자결재 완료 후 승인처리<\/td><\/tr><tr><td>3<\/td><td>보조사업 등록 확인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>보조사업 정보 확인 및 배정<\/td><\/tr><tr><td>4<\/td><td>보조금 신청<\/td><td>시설<\/td><td>희망이음<\/td><td>시･군･구에서 배정한 보조사업에 대하여 보조금 신청 기능을 활용하여 온라인 보고<br>※ 주기별 2회 이상 신청가능<\/td><\/tr><tr><td>5<\/td><td>전자결재 및 승인<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>전자결재 완료 후 승인 처리<\/td><\/tr><tr><td>6<\/td><td>e‒호조 연계<\/td><td>시･군･구<\/td><td>행복이음<\/td><td>동일사업별 보조금신청건을 지급단위로 일괄 결재 후 보조금 정보를 e‒호조로 전송<\/td><\/tr><tr><td>7<\/td><td>지출품의 및 지급<\/td><td>시･군･구<\/td><td>e‒호조<\/td><td>행복이음에서 전송한 보조금 정보를 활용하여 지출품의<\/td><\/tr><\/table><div class=\"pchip\" id=\"p103\"><span>원문 103쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=115\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설은 신청한 보조금에 대한 정산내역을 온라인으로 보고<\/div><div class=\"ln p\">보조금 신청 및 정산 절차<\/div><div class=\"ln h4\">4) 민간서비스 연계 및 민간 서비스 이용 대상자 보고<\/div><div class=\"ln p\">사회복지관 등 사회복지시설은 지역사회 민관협력 강화를 위해 복지서비스 대상자 및 자원 정보를 지자체와 공유<\/div><div class=\"ln p\">‒공공‒민간에서 각각 지원 중인 대상자 수혜이력 및 사례관리 이력 공유, 상호의뢰 체계 마련으로 지원누락 및 중복지원 방지<\/div><div class=\"ln p\">‒공공‒민간의 자원정보 공유 및 자원 공동 활용으로 지역사회 전체 복지 자원의 효율적 활용 제고<\/div><div class=\"ln p\">지자체 및 시설에서는 연계된 정보를 활용하여 복지 대상자의 서비스 연계 및 자원배분에 활용<\/div><div class=\"ln p\">연계 개념도<\/div><div class=\"pchip\" id=\"p104\"><span>원문 104쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=116\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※표준서비스：표준분류체계(대분류：10종, 중분류：47분류) 적용<\/div><div class=\"ln note\">※상세분류표는 희망복지지원단 업무안내 복지자원 표준분류체계 참조<\/div><div class=\"ln h4\">5) 후원금(품) 수입/사용보고<\/div><div class=\"ln p\">사회복지시설은 희망이음을 이용하여 후원금(품)에 대한 수입/사용 내역을 입력<\/div><div class=\"ln p\">대표이사와 시설장은 결산보고서를 제출할 때에 후원금 수입 및 사용결과 보고서를 희망이음을 통해 행복이음으로 보고<\/div><div class=\"ln p\">후원금(품) 수입/사용보고 절차<\/div><div class=\"pchip\" id=\"p105\"><span>원문 105쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=117\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">6) 비정형업무 보고<\/div><div class=\"ln p\">정형화된 온라인 보고 외의 공문서 유통 관리가 필요한 경우 비정형 업무보고를 통해 사회복지시설로부터 문서 수신<\/div><div class=\"ln note\">※정형화된 온라인보고가 있음에도 편의상의 이유로 비정형업무 보고를 사용하는 사례 발생, 통계 데이터 누락 등 부작용 방지를 위해 가급적 사용 제한<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">차세대 사회보장정보시스템(행복이음) 시설 관련 업무<\/div><div class=\"ln h4\">1) 차세대 사회보장정보시스템(행복이음) 시설 관련 주요업무<\/div><div class=\"ln p\">법인설립/변경에 대한 인･허가 관리(시･도 업무)<\/div><div class=\"ln p\">사회복지시설 설치/폐지에 대한 신고처리<\/div><div class=\"ln p\">사회복지시설 입소자 입･퇴소 관리<\/div><div class=\"ln p\">사회복지시설 종사자 입･퇴사 관리<\/div><div class=\"ln p\">사회복지시설 보조금 사업정보 관리<\/div><div class=\"ln p\">사회복지시설 보조금 관리<\/div><div class=\"ln p\">비정형 보고관리 및 시설공지관리<\/div><div class=\"ln note\">※상세 업무처리 내용은 행복이음 시설 및 법인 업무 매뉴얼 참조<\/div><div class=\"ln h4\">2) 법인설립, 변경에 대한 인･허가 관리(시･도)<\/div><div class=\"ln p\">비영리법인에 대한 대장 및 해산신고 등에 대한 관리<\/div><div class=\"ln p\">사회복지법인, 재단사단법인의 설립허가, 합병허가, 정관변경, 기본재산처분허가 등에 대한 관리<\/div><div class=\"ln h4\">3) 사회복지시설 설치･폐지에 대한 신고처리<\/div><div class=\"ln p\">사회복지시설 설치 및 대장 관리：사회복지시설의 설치신고, 비용수납신고, 변경 신고, 휴지･폐지･재개신고 등에 대한 관리<\/div><div class=\"ln note\">※사회복지시설의 신규 설치 시 해당 자치단체에서는 온라인보고를 위한 사회서비스정보시스템(희망이음) 가입에 대한 독려<\/div><div class=\"pchip\" id=\"p106\"><span>원문 106쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=118\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">기타복지기관* 지정/신청 및 대장 관리<\/div><div class=\"ln p\">‒장기요양기관, 청소년수련시설, 청소년이용권장시설 등의 지정신청, 변경신고, 휴폐업 등에 대한 관리<\/div><div class=\"ln p\">*기타 복지기관：「사회복지사업법」 및 개별법령 상 사회복지시설로 분류되지 않은 복지시설(예：정신보건센터, 중독관리통합지원센터, 노인전문병원 등)<\/div><div class=\"ln p\">‒(기관유형 정비) 행복이음에서 기관의 유형에 맞지 않게 분류한 경우 기관유형을 재분류<\/div><div class=\"ln p\">시설분류 등록 시 유의사항<\/div><div class=\"ln p\">‒시설 등록 시 시설분류를 정확히 입력하여야 시설유형별 보조금 지급기준, 시설수급자의 생계비 지급기준 등의 변화에 따라 정확한 복지급여가 산정됨<\/div><div class=\"ln p\">‒시설분류는 본 관리안내책자의 “I.사회복지시설 현황”의 시설유형을 참조하며, 각 사업별 관련지침 및 관련법령*에 따라 정확하게 등록하여야 함<\/div><div class=\"ln p\">*관련법령：「사회복지사업법」 및 「노인복지법」 등 사회복지시설관련 개별법령의 사회복지시설 참조<\/div><div class=\"ln h4\">4) 사회복지시설 입소자 입･퇴소 관리<\/div><div class=\"ln p\">사회복지시설 중 생활시설에서 온라인을 통해 보고하는 입소자에 대한 입･퇴소 정보 관리<\/div><div class=\"ln p\">입･퇴소자에 대한 주민등록 변경여부 확인 후 필요 시 통합조사 요청 및 시설 수급자 정보 관리<\/div><div class=\"ln p\">온라인보고 된 입소자 입･퇴소 보고 정보 중 보장기관에서 최종 승인된 정보를 기준으로 입소자 대장이 자동 관리되며, 생계비 산정 및 정산 시 기준정보로 활용<\/div><div class=\"ln h4\">5) 사회복지시설 종사자 입･퇴사 관리<\/div><div class=\"ln p\">사회복지시설에서 온라인을 통해 보고하는 종사자에 대한 입･퇴사 정보, 호봉 승급정보 등에 대한 관리<\/div><div class=\"ln p\">온라인보고 된 종사자 입･퇴사 보고 정보 중 자치단체에서 최종 승인된 정보를 기준으로 종사자 대장이 자동 관리되며, 인건비 산정 및 정산 시 기준정보로 활용<\/div><div class=\"pchip\" id=\"p107\"><span>원문 107쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=119\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">6) 사회복지시설 보조금 사업정보 관리<\/div><div class=\"ln p\">시설운영비, 보조사업비 및 기능보강사업비 등 국고 및 지방비를 지원하
