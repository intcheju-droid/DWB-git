시설운영위원회 및 법인이사회를 거쳐 주무관청에 제출 ‒위의 계획에는 60세 초과 종사자 및 신규 채용 인력 2인의 인건비를 60세 초과 종사자의 기존 인건비 100% 내에서 지급하되, 60세 초과자의 인건비는 기존 인건비의 50%를 초과할 수 없음 ‒청년 인력에 대해서는 인건비 지급 가이드라인 적용 ※①, ②에 따른 절차를 거치는 경우라 하더라도 65세를 초과하는 경우에는 인건비 보조금을 지원할 수 없음\n➩위 지급 상한기준은 종사자의 신분을 보장하기 위한 제도가 아니라 정부예산의 지급 기준이므로, 업무수행 능력이 없거나 종사자가 비리를 자행할 경우 등 「근로기준법」상 해고사유가 발생할 경우 시설에서 근로계약, 취업규칙 등에 의거 적절한 조치를 취할 수 있음\n※(정년제 권고) 사회복지시설은 근로계약, 취업규칙 등에 따라 시설장 및 종사자의 정년을 정할 수 있으므로, 시설 사유화의식 탈피 및 조직쇄신 차원에서 정년제 실시를 권고함\n※촉탁의사는 시설 종사자가 아니므로 보조금 인건비 지급상한제 및 인건비 가이드라인 적용대상에서 제외함\n사회복지시설의 인건비 지급상한기준\n지급상한기준년 설립자 및 설립자 직계가족 1세대 | 생년월일 | ~1955년 | 1956년 | 1957년~\n지급상한년 | ~2025년 | 2026년 | 2027년~\n설립자 및 직계가족 1세대가 아닌 시설장 | 생년월일 | ~1960년 | 1961년 | 1962년~\n지급상한년 | ~2025년 | 2026년 | 2027년~\n시설종사자 | 생년월일 | ~1965년 | 1966년 | 1967년~\n지급상한년 | ~2025년 | 2026년 | 2027년~ 지급상한기준일(지급상한일자는 해당 종사자(시설장 포함)의 출생일을 기준으로 함) -1월에서 6월 사이 지급상한일자 : 6월 30일 -7월에서 12월 사이 지급상한일자 : 12월 31일\n\n1년 미만 근속 근로자*의 퇴직급여･퇴직적립금의 관리\n＊근로계약 기간이 1년 이상이면서 근속기간이 1년 미만인 근로자 (인건비 국고보조 대상 근로자) 근속기간이 1년 미만인 자가 퇴직한 경우 해당 근로자의 퇴직급여･퇴직적립금 중 국고 및 지방자치단체 보조금은 회계연도 종료 후 3월 이내에 반환해야 함 (인건비 국고보조 대상이 아닌 근로자) 근속기간이 1년 미만인 자가 퇴직한 경우 해당 근로자의 퇴직급여･퇴직적립금을 반환하지 않고 퇴직 후 3월 이내에 퇴직급여･퇴직적립금 목으로 여입 후 타 목으로 재편성해야 함 ※2021년 정부합동감사 제도개선 과제"}, {"p": 30, "t": "2)시설운영비 지출 원칙\n지출은 지출사무를 관리하는 자(대표이사, 시설장) 및 그 위임을 받아 지출명령이 있는 것에 한하여 지출원이 행함\n지출은 예금통장 또는 「전자거래기본법」에 의한 전자거래*로 집행하며, 특히 보조금의 경우 2011년 7월부터 시･도별로 도입한 보조금 전용카드로 집행할 것\n‒상용경비 또는 소액의 경비 지출이라도 1만 원 이상 지출 시 카드를 사용하거나 현금영수증을 발급받아 지출하도록 지도요망\n*국세청에서 변경된 현금영수증 발급제도에 따라 ʼ08.7.1.이후부터 현금영수증 발급이 가능한 곳(가맹점) 에서는 1원 이상 집행 시 현금영수증 발급 가능\n*지역특성상 신용카드 사용이나 현금영수증 발급 등이 현실적으로 어렵다고 시･군･구청장이 인정하는 경우 간이 영수증 또는 현금지출이 가능하며, 이 경우에도 그 확인이 가능한 증빙서류 구비\n*농어촌지역이나 카드 미가맹점에 대해서는 5만원 이상 집행 시 온라인(on‒line)입금 활용\n국세청 ‘사업자용 현금영수증카드’ 사용 안내\n‘사업자용 현금영수증카드’：사업자가 사업과 관련 있는 물품 등을 현금으로 구입할 때 신속･편리하게 현금영수증을 발급받을 수 있도록 제작･보급하는 카드 * 신청문의：현금영수증홈페이지(www.hometax.go.kr) 또는 현금영수증상담센터(☎ 126)\n각 시･도는 자체적으로 마련한 「사회복지시설 보조금 전용카드 사용지침」 등에 따라 보조금 전용카드에 클린카드 기능을 추가하여 관리할 것[관련안내：보건복지부 사회서비스자원과‒5071(2011.11.9)호 및 사회서비스자원과‒1535(2012.3.29)호]\n‒또한 각 지자체는 보조금 집행의 투명성이 제고될 수 있도록 주기적인 모니터링 방안 등 그 밖의 필요한 사항을 수립하여 지도･감독하기 바람\n‒모니터링을 통해 위법･부당 사용사례가 적발된 경우, 감사 등을 실시하여 환수 및 징계조치 하는 등 엄정하게 처분할 것\n보조금 전용카드란?\n①시설 보조금을 지출하기 위해 보조금 전용계좌와 연결된 체크카드 ②사회서비스정보시스템(희망이음)에 발급 및 거래내역 전송 ③클린카드 기능 탑재 *보조금 전용계좌 및 전용카드는 광역자치단체별로 계약한 금융사를 통해 발급받아야 함"}, {"p": 31, "t": "사회복지시설 보조금 전용카드 사용제한 업종(클린카드 기능)\n분 류 | 보조금 사용제한 업종\n유흥업종 | 룸싸롱, 유흥주점, 단란주점, 나이트클럽, 주점으로 등록된 호프집, 맥주홀, 칵테일바, 주류판매점, 카페, 카바레\n위생업종 | 피부미용실, 안마시술소, 발마사지 등 대인서비스, 스포츠마사지, 네일아트, 지압원\n레저업종 | 실내･외 골프장, 노래방, 사교춤, 전화방, 비디오방, 골프연습장, 골프용품, 스크린골프, 당구장, PC방, 기원\n사행업종 | 카지노, 복권방, 오락실\n기타업종 | 성인용품점, 총포류 판매 ※각 시･도는 상기 제한업종 외의 추가사항은 시설특성 등을 고려하여 지자체 판단 하에 확대추진할 수 있으며,이 경우 시･도별 「사회복지시설 보조금 전용카드 사용지침」에 반영하여 운영할 것\n\n‒시설 운영비 지출을 보조금 전용카드 등으로 집행함에 따라 발생하는 포인트 또는 마일리지 등은 다시 시설운영에 사용하도록 조치(개인적으로 사용 금지)\n*보조금 전용카드에서 발생한 포인트 등은 보조금에서 파생된 수익이므로 해당 보조금의 용도와 부합되는 용도로만 사용해야 함\n사회복지시설과 관련한 보조금은 「국가재정법」, 「보조금 관리에 관한 법률」, 「지방재정법」, 「사회복지사업법」 및 개별 보조사업 근거법령, 「사회복지법인 및 사회복지시설 재무･ 회계규칙」 기타 관련 지침에 위배되지 않도록 신청･교부 및 사용하여야 함.\n수령한 보조금은 시설회계 중 보조금 수입으로 처리\n< 고용노동부 고용서비스지원과-1730, 2009.7.8. > 보육시설 또는 복지관의 실질적인 운영을 위하여 지방자치단체장 또는 수탁업체가 시설의 원장을 임명하여 동 원장으로 하여금 종사자에 대한 임명 및 복무관리를 하도록 하고, 원장명의로 사업자 등록을 하여 대외적으로 대표권을 행사하도록 하고 있다면 동 원장은 고용보험의 피보험자가 되는 근로자에 해당되지 않는 것으로 판단됨 다만, 지방자치단체에서 자체 또는 위탁운영하고 있는 경우 원장과 수탁업체 대표 또는 지방자치단체장과의 별도의 근로계약서를 작성하는 등 실질적인 중간관리자의 성격이라면 고용보험 피보험자격을 취득 할 수 있다고 판단됨\n유의사항\n사회복지법인의 경우 법인회계에서 우선 수입 처리한 후 시설전출금으로 세출하고, 이를 시설회계에서 법인전입금으로 처리하는 경우가 있으나, -법인회계나 시설회계가 사회복지법인의 회계 중의 일부이므로, 시설회계에서 곧바로 처리하는 것이 정상적인 처리 절차"}, {"p": 32, "t": "각 지자체는 시설 후원금 및 사업수익금에 대해서도 클린카드를 도입하거나 시･도별로 기 도입 운영 중인 보조금전용카드와의 연계방안 등을 강구･시행하는 등 시설 후원금 및 사업수익금의 적정한 관리에 필요한 대책을 마련 시행하기 바람\n※후원금과 사업수익금을 클린카드 적용을 받는 보조금이 아니라는 이유로 노래방 등에서 유흥목적으로 사용하거나 업무와 직접적 관련이 없는 심야(23시 이후)시간대에 사용하는 등 부적정한 예산집행 사례 적발\n기타사항：지자체는 보조금 집행의 투명성 강화를 위하여 국민권익위원회가 권고 (ʼ10.4.19.)한 ‘보조금 통장 단일화’* 여부를 자체적으로 검토･시행함\n*지자체의 정책적 판단에 따라 사업유형에 따른 복수의 보조금통장 사용도 가능\n라\n시설 생활자에 대한 인권보호 강화\n시설 조치여부 시･군･구 점검사항\n‒시설 생활자에게 인권침해사실 진정권에 대한 고지 여부\n‒시설 내에 진정함 설치 유무\n‒시설 생활자가 작성한 진정서의 인권위원회 송부 여부\n‒방문조사 시 협조 상태 등"}, {"p": 33, "t": "사회복지시설 인권보호관련 「국가인권위원회법」 관련규정\n진정함의 설치·운용(동법 시행령 제7조) ‒시설 내 진정함 설치의무, 용지･필기도구 및 봉함용 봉투(위원회서 정한 규격) 비치 ‒진정함 설치 시 설치장소를 위원회에 통보, 생활자가 직접 진정서를 진정함에 넣도록 함 ‒시설 소속 직원은 매일 지정된 시간에 진정함 확인 후 진정서 등을 지체없이 위원회로 송부 위원회가 보낸 서면의 열람금지(동법 시행령 제8조) 진정서의 자유로운 작성 및 제출(동법 시행령 제9조) ‒진정서 작성의사를 표명 시 방해금지 및 작성된 진정서의 열람･압수 폐기 금지 ‒생활자 징벌중(징벌조사 중 포함)이라도 진정서 또는 서면 등의 자유로운 작성･제출 보장 시설의 방문조사(동법 제24조) ‒위원회는 필요 시 시설의 방문･조사가 가능하며 이때 시설장은 필요한 편의를 제공 ‒방문조사 시 시설 직원 및 시설 생활자와 면담･구술･서면의견 진술 가능 ‒시설 직원은 면담장소에 입회할 수 있으나 녹음하거나 녹취하지 못함 시설생활자의 진정권 보장(동법 제31조) ‒시설생활자가 진정하고자 하는 경우 시설 직원은 즉시 진정서 작성에 필요한 편의를 제공 ‒시설생활자가 진정하기를 원하는 경우, 그 뜻을 즉시 위원회에 통보 ‒진정서는 즉시 위원회에 송부하고 위원회로부터 접수증명원을 발급받아 이를 진정인에게 교부 ‒진정인과 위원 등과의 면담에는 시설 직원이 참여하거나 그 내용을 청취 또는 녹취하지 못함 ‒시설직원 등은 시설생활자가 작성한 진정서 또는 서면을 열람하지 못함\n※  사회복지시설 담당 사업부서(중앙부처, 지자체)는 시설종사자 인권보호를 위한 조치 및 가이드라인 마련할 것\n마\n인권침해 등 문제시설에 대한 관리강화 등\n인권침해 등으로 정상적 운영이 불가능한 시설은 시･군･구청장이 1회 적발만으로 시설폐쇄를 명하도록 함(시행규칙 제26조의2 <별표 4>)\n※인권침해로 인한 생활자 사망, 붕괴위험의 절박성 등 시설의 정상적 운영이 불가능함이 중대하고도 명백해야 하며, 시설폐쇄가 청문 등의 사유로 지연될 경우 먼저 생활자를 전원조치 한 후 시설폐쇄를 추진\n시행규칙 제26조의2 <별표 4>\n라.위반행위가 4종 이상 또는 시설거주자에 대한 학대･성폭력 등 중대한 불법행위로 인하여 시설의 정상적인 운영이 불가능하다고 인정되는 때에는 제2호의 개별기준에 불구하고 1차 위반 시에 시설의 폐쇄를 명할 수 있다.\n시･군･구는 시설운영위원회를 활성화하고 시설과 지역사회가 상호 협력체계를 구축하는 등 민주적이고 투명한 시설운영을 통해 인권유린 문제가 발생되지 않도록 지속적인 지도･감독 실시\n시･군･구는 시행규칙 제25조에 따른 비치서류 등 법령준수 현황을 수시로 관리 감독하기 바람\n사회복지시설에 비치해야 할 서류(시행규칙 제25조)\n-법인의 정관, 법인설립허가증 사본(사회복지법인 등 법인이 설치한 시설에 한함) -사회복지시설 신고증(국공립시설임은 국공립시설임을 알리는 안내문), 시설의 건축물관리대장 -시설거주자･퇴소자 명부 및 상담기록부 -시설의 운영계획서 및 예산결산서, 후원금품대장 -시설의 장과 종사자의 명부 ※개별법령에서 해당시설에 비치해야 할 서류를 규정하고 있을 경우 개별법령의 비치서류가 우선 ☞시설에 위의 서류를 비치하지 않을 경우 300만원 이하 과태료에 처함(법 제58조)"}, {"p": 34, "t": "바\n사회복지시설의 통합 설치･운영 및 시설 서비스 최저기준 시행\n1) 시설의 통합 설치･운영 등(법 제34조의2)\n사회복지시설의 설치･운영과 관련하여, 지역특성과 시설분포의 실태를 고려하여 「사회복지사업법」 및 동법 제2조제1호 각 목의 법률에 따른 시설을 통합하여 하나의 시설로 설치･운영하거나 하나의 시설에서 둘 이상의 사회복지사업을 통합하여 수행할 수 있음\n국가 또는 지방자치단체 외의 자는 통합하여 설치･운영하고자 하는 각각의 시설이나 사업에 관하여 해당관계 법령에 따라 신고하거나 허가 등을 받아야 함\n시설의 통합 설치･운영 등에 따른 시설 및 인력 기준(시행규칙 제22조 관련)\n1.하나의 시설에서 둘 이상의 사회복지사업을 통합하여 수행하는 경우 가.시설 및 설비기준：시설 거주자 또는 이용자의 불편을 초래하지 않는 범위에서 상호 중복되는 시설･설비를 공동으로 사용할 수 있다. 나. 인력기준：사업에 지장이 없는 범위에서 인력을 겸직하여 운영할 수 있다.\n2)시설 서비스 최저기준(법 제43조)\n대상시설은 「사회복지사업법」 제2조제1호 각 목의 법률에 따른 사회복지시설 및 사회복지관이며, 시설의 규모, 제공하는 서비스의 특성, 이용자 등을 고려하여 보건복지부장관이 제외할 수 있음\n시설 서비스 적용 대상시설의 범위, 시설별 서비스 최저기준의 내용 및 적용 시기는 각 시설 담당 사업부서에서 정해 공개하도록 함\n사회복지시설의 운영자는 보건복지부 장관이 정하는 시설의 서비스 최저기준 이상으로 서비스 수준을 유지하여야 함\n시설의 서비스 최저기준(시행규칙 제27조)\n제27조(시설의 서비스 최저기준) ① 법 제43조제1항에 따른 서비스 최저기준에는 다음 각 호의 사항이 포함되어야 한다. 1. 시설 이용자의 인권 2. 시설의 환경 3. 시설의 운영 4. 시설의 안전관리 5. 시설의 인력관리 6. 지역사회 연계 7. 서비스의 과정 및 결과 8. 그 밖에 서비스 최저기준 유지에 필요한 사항"}, {"p": 35, "t": "사\n국고보조금통합관리시스템(e나라도움)의 도입\n1) 추진배경\n2014.12.4. 정부합동으로 국고보조금부정수급 종합대책을 마련하여 국고 보조금 개혁 방안을 추진\n종합대책의 후속 조치로 국고보조금통합관리시스템(e나라도움)을 구축하고, 2017. 1월부터 일부 개통(2017.7월 전체 개통)하여 모든 민간보조사업자가 보조금의 교부신청, 집행 등 업무처리에 의무적으로 사용하도록 강화\n2)e나라도움 구축 목표\n중복･부정수급 방지\n‒보조금 정보 통합관리로 사업유사중복 검증, 수급자격 및 지출증빙 검증, 부정징후 모니터링, 가격 검증 등 실현\n업무 효율화\n‒전자증빙 기반의 실시간 지급 관리, 업무 표준화, 온라인 정산 등을 통해 업무 효율성 제고\n대국민 서비스 제고\n‒수혜가능한 보조사업 정보 조회(대국민 맞춤형 서비스), 보조금 운영 현황 및 성과공개 서비스 개선, 투명성 제고\n3)사회복지시설의 e나라도움 사용\n(대상시설) 국고보조사업으로 보조금을 지원받는 사회복지시설\n※ 국비 매칭없이 지방비로만 지원되는 보조사업은 e나라도움 사용대상 아님\n(사용시기) 2018년부터\n(사용방법) 사회서비스정보시스템(희망이음)을 통해 보조사업에 대한 회계처리(시스템 간 정보연계로 추가업무 최소화)"}, {"p": 36, "t": "(주요변경사항)\n집행 방식 | 변경 내용\n보조금 전용카드 | 변경 없음\n전용카드 외 | 개인(종사자) 대상 지출 | 개인별 집행내역 등록\n사업자 대상 지출 | 전자세금계산서 연계\n4) e나라도움 사용문의\n홈페이지(www.gosims.go.kr), 콜센터(1670-9595)\n아\n기타 사항\n1)시설(법인포함) 관련 문제발생 시 신속한 보고\n지방자치단체(시･도 및 시･군･구)는 시설 안전사고, (법인포함)관련 비리, 민원 발생 등으로 언론보도 등이 발생했을 경우 복지부 각 시설담당부서 및 사회서비스 자원과에 동시에 보고\n※보고내용은 사건･사고 개요, 시설(법인) 현황, 주요내용, 조치경과 및 향후계획 등임\n2)종사자 복무규정 등 제규정 제정\n각 시설별로 종사자 복무규정 등 제규정을 제정하여 운영할 것\n3)사회복지법인이 분사무소를 설치하여 주사무소 소재지가 아닌 타 자치단체에 시설을 운영하고자 하면 법인 관할 행정관청은 설치하고자 하는 지자체와 사전에 협의할 것\n4)개별 시설법 및 지침에서 별도 규정하는 경우를 제외하고는, 사회복지시설 내 생활인들의 금융재산을 보관 및 관리할 시 현금보관증이나 차용증을 작성하게 하고, 유형별 시설특성 등을 감안하여 생활인들의 금융재산을 보호할 수 있는 대책을 강구하여 시행할 것(2013.12.18. 국가인권위원회 권고사항)"}, {"p": 37, "t": "5)사회복지시설 기부식품 관리\n학교 등 집단급식소를 통해 기부식품을 제공받는 사회복지시설의 장은 이용자에 급식 제공 시 시설에서 제공되는 기본 급식을 제공하는 것을 원칙으로 하여야 하며, 예비식 제공 시 이용자에 이를 반드시 사전에 고지하여야 함\n조리되지 않은 불용 식재료 모집을 원칙으로 하며, 불가피하게 조리식품 수령 시 교차오염 등 예방을 위해 위생관리에 철저히 주의할 것"}, {"p": 38, "t": "[참고] 기부식품등 제공사업 안내 지침\n식품위생법 시행규칙 [별표 1] 식품등의 위생적인 취급에 관한 기준 1. 식품등을 취급하는 원료보관실･제조가공실･조리실･포장실 등의 내부는 항상 청결하게 관리하여야 한다. 2. 식품등의 원료 및 제품 중 부패･변질이 되기 쉬운 것은 냉동･냉장시설에 보관･관리하여야 한다. 3. 식품등의 보관･운반･진열시에는 식품등의 기준 및 규격이 정하고 있는 보존 및 유통기준에 적합하도록 관리하여야 하고, 이 경우 냉동･냉장시설 및 운반시설은 항상 정상적으로 작동시켜야 한다. 4. 식품등의 제조･가공･조리 또는 포장에 직접 종사하는 사람은 위생모를 착용하는 등 개인위생관리를 철저히 하여야 한다. 5. 제조･가공(수입품을 포함한다)하여 최소판매 단위로 포장(위생상 위해가 발생할 우려가 없도록 포장되고, 제품의 용기･포장에 법 제10조에 적합한 표시가 되어 있는 것을 말한다)된 식품 또는 식품첨가물을 허가를 받지 아니하거나 신고를 하지 아니하고 판매의 목적으로 포장을 뜯어 분할하여 판매하여서는 아니 된다. 다만, 컵라면, 일회용 다류, 그 밖의 음식류에 뜨거운 물을 부어주거나, 호빵 등을 따뜻하게 데워 판매하기 위하여 분할하는 경우는 제외한다. 6. 식품등의 제조･가공･조리에 직접 사용되는 기계･기구 및 음식기는 사용 후에 세척･살균하는 등 항상 청결하게 유지･관리하여야 하며, 어류･육류･채소류를 취급하는 칼･도마는 각각 구분하여 사용하여야 한다. 7. 소비기한이 경과된 식품 등을 판매하거나 판매의 목적으로 진열･보관하여서는 아니된다. 학교 등 집단급식소 예비식 기부시 위생관리 기준 1. 집단급식소 - 급식 예비식 수령 전 급식소의 조리식품 보관상태 확인 구분 | 주요 내용\n조리식품 | • 당일 조리하여 배식대에 제공되지 않은 식품에 한함 • 조리된 식품은 특성의 따라 냉장 5℃이하, 온장 60℃이상으로 보관되어야 하며, 실온에 보관된 식품은 폐기 • 온장 유지 식품을 냉장으로 기부하려는 경우에는 신속히 5℃이하로 식혀 냉장보관 후 제공\n보관용기 | • 보관용기(식품에 접촉하는 용기)는 식품용 용기를 사용 • 교차오염 예방을 위하여 뚜껑 있는 용기 등을 사용하여 밀폐 보관 2. 시설 및 개인이용자 - 급식 예비식 제공 전 주의사항 안내 구분 | 주요 내용\n시설 | • 이용자에게 제공하기 전까지 조리식품의 냉장.온장 온도 유지 • 냉장 유지 식품을 가열하여 제공하는 경우에는 충분히 재가열 후 제공 • 수령한 식품은 당일 이용자에 제공\n개인(소포장) | • 취식 전까지 냉장 보관하도록 하며, 수령 후 2시간 이내에 섭취 3. 기부식품등 제공사업장 - 급식 예비식 운반 및 소포장 시 기준 준수 구분 | 주요 내용\n설비 | 운반 | • 냉장.온장 식품을 운반 할 때에는 냉장 5℃ 이하, 온장 60℃ 이상 유지 • 냉장.온장 식품을 운반 할 때에는 일정한 온도 관리를 위해 해당 온도가 유지 가능한 설비를 이용  * 냉장탑차, 차량용 냉.온장고 등 • 아이스박스 등 온도계가 설치되어 있지 않은 장비를 사용 할 경우 예비식 운반 전 온도계를 사용하여 내부 온도가 유지되는지 확인\n보관 | • 배분 전 또는 소포장 전후 식품을 보관할 때에는 일정한 온도를 유지할 수 있는 충분한 용량의 냉.온장 설비 구비 (단, 당일 수령 제품은 당일 이용자에 배분)\n용기 | • 운반 및 소포장 용기(식품에 접촉하는 용기)는 식품용 용기를 사용 • 교차오염 예방을 위하여 뚜껑 있는 용기 등을 사용하여 밀폐 보관 • 일회용 용기를 사용할 때에는 밀폐용기를 사용하거나, 용기를 밀폐할 수 있는 포장설비 등 구비 • 다회용 용기를 사용할 때에는 용기를 세척할 수 있는 별도의 세척시설 구비\n시설 | 포장실 | • 외부 오염물질을 차단할 수 있도록 분리된 별도의 공간 • 식품 취급(소포장, 소분, 관능검사 등) 이외 다른 용도로 함께 사용될 경우고정된 벽체, 별도의 출입구 등을 설치하여 공간을 분리\n개인 위생 | 건강 진단 | • 소포장에 참여하는 모든 인력(전담인력, 보조인력, 단기봉사자 등)은 매년 1회 건강진단 실시\n복장 | • 위생복, 위생모, 마스크, 위생장갑은 반드시 착용 • 위생복 등은 주기적으로 세척˙교체관리 하여 청결을 유지해야 하며, 별도의 공간에 위생적으로 보관\n"}]}, {"title": "3. 사회복지시설 종사자 관리", "start": 39, "end": 47, "html": "<div class=\"pchip\" id=\"p39\"><span>원문 39쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=51\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>사회복지시설 종사자 관리<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">공개모집(시행일 2005. 1. 1.)<\/div><div class=\"ln p\">정부에서 인건비를 지원하는 시설(국가나 지자체로부터 수탁받은 시설 포함)의 시설장 및 종사자 신규채용은 직위와 관계없이 공개모집을 원칙으로 함<\/div><div class=\"ln note\">※ [감사원 위임 감사(2004.12), 권익위 제도개선 권고(2010.4)] 반영 : 일부 사회복지시설에서 동 시설을 운영하는 법인의 임원, 운영자 개인 또는 시설장과 특별한 관계(배우자, 자녀, 친인척 등)에 있는 자들이 다수 재임하면서 법인 및 시설운영의 투명성을 저해하고 있다는 지적<\/div><div class=\"ln p\">공개모집이란 자격을 갖춘 누구에게나 응모기회를 제공하여, 경쟁을 통해 능력 있는 자를 임용하는 제도로, 특정인을 채용하기 위한 법인 및 시설 채용내규, 응모자격을 특정인으로 제한 등은 공개모집에 위배됨<\/div><div class=\"ln p\">‒법인 또는 시설에서 독자적 또는 공동으로 채용 시 해당 법인 및 시설 홈페이지 외 지자체 홈페이지, 워크넷, 복지넷, 희망이음* 중 2곳 이상의 사이트에 채용 관련 사항을 15일 이상 공고한 후 법인 및 시설 내규 등에 의해 채용<\/div><div class=\"ln note\">※시설운영위원회를 신규직원 선발과정에 활용하는 방안을 모색할 것<\/div><div class=\"ln note\">※긴급한 업무처리 등 불가피한 사유가 있는 경우 공고기간을 자체사정에 따라 7일 이상 15일 이하로 단축 가능<\/div><div class=\"ln note\">※특히, 시설 재무･회계담당자는 법인임원이나 시설장과 독립적인 자로 선발하여 법인 및 시설운영의 투명성 제고<\/div><div class=\"pchip\" id=\"p40\"><span>원문 40쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=52\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">공개모집 원칙의 예외<\/div><div class=\"ln p\">①다음 각 목의 어느 하나에 해당 경우에는 아래 조건을 모두 충족하는 전제 하에 공개모집 원칙을 완화하여 적용할 수 있음<\/div><div class=\"ln p\">전제사항<\/div><div class=\"ln p\">㉮ 종전에 공개모집 절차에 따라 채용된 사람일 것 ㉯ 동일한 설치･운영자와 근로･고용계약이 체결되어 있을 것 ㉰ 해당 시설을 운영하는 법인의 임원, 운영자 개인 또는 시설장과 특별한 관계가 없을 것 ㉱ 해당 직위와 관련하여 법령에 따른 자격기준을 충족시킬 것<\/div><div class=\"ln p\">가.동일한 시설 내에서 승진, 인사이동 등으로 보직이 변경되는 경우<\/div><div class=\"ln p\">*채용 당시 ①에서 제시된 전제 조건을 모두 충족하여 채용된 기간제근로자 등이 정규직 전환이 필요한 경우에도 시설 내에서 보직이 변경되는 경우로 적용 가능<\/div><div class=\"ln p\">나.동일한 설치･운영자*가 각각 설치･운영하는 시설 간 인사 이동<\/div><div class=\"ln note\">※ 다만, 시설장으로 근무 중인 성직자(聖職者)가 소속 종교 단체의 인사발령으로 타 시설의 시설장으로 인사 이동하는 경우, 해당 종교 단체*를 「동일한 설치･운영자」로 볼 수 있음(ʼ21.1.1.부터 시행) * 법인을 구성하여 시설 운영하는 경우 제외(단, 종교 단체의 인사발령 문서 등 내부 의사결정 사항이 명확히 확인되어야 함.)<\/div><div class=\"ln p\">다.설치･운영자가 법인인 경우로서 해당 법인의 사무국*에 근무하다, 그 법인이 설치･운영하는 시설로 인사이동을 하는 경우<\/div><div class=\"ln p\">*법인 정관 또는 하위 규정에 따른 사무국 조직 및 정원 등 관련 규정이 있는 경우<\/div><div class=\"ln p\">라.법령에 따라 사회복지시설이 통합되는 경우나 시설 위･수탁 계약에 따라 종전 종사자의 고용관계를 승계하는 경우<\/div><div class=\"ln p\">마.출산 또는 육아를 위해 휴직한 사람을 대체하기 위해서 고용된 경우* 해당 대체근로 계약 기간을 연장하고자 하는 경우<\/div><div class=\"ln p\">*대체근무자로 최초로 고용되는 경우에는 공개채용을 하여야 함<\/div><div class=\"pchip\" id=\"p41\"><span>원문 41쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=53\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">②①의【전제사항】㉰에서 명시하고 있는 특별한 관계에 있는 사람의 범위는 다음과 같음<\/div><div class=\"ln p\">시설 설치･운영자인 법인의 임원, 운영자 개인 또는 시설장과의 관계가 다음 어느 하나에 해당하는 사람<\/div><div class=\"ln h3\">가. 6촌 이내의 혈족<\/div><div class=\"ln h3\">나. 4촌 이내의 인척<\/div><div class=\"ln h3\">다. 배우자(사실상 혼인관계에 있는 사람을 포함한다)<\/div><div class=\"ln p\">법인의 임원, 운영자 개인 또는 시설장의 금전 그 밖의 재산에 의하여 생계를 유지하거나, 그와 생계를 함께 하는 사람<\/div><div class=\"ln p\">③①의 가, 나, 다목에 따른 인사이동으로 인해 발생한 공석(空席)은 가, 나, 다목에 따라 충원(充員)되지 않을 시 공개모집 절차로 충원할 것<\/div><div class=\"ln p\">④공개모집 원칙의 예외를 적용할 경우 시설의 설치･운영자는 그 시설장･종사자 등과의 근로계약관계에 있어서 관계법령의 위반이 없도록 각별히 주의할 것<\/div><div class=\"ln p\">⑤「ʼ18년 사회복지시설 관리안내」에서 예외로 인정하고 있었던 종교･학교법인 소속 시설에 대한 각 법인 관계자의 임명 건은 ʼ19년 1월1일 이전의 건에 한하여 인정<\/div><div class=\"ln p\">⑥공개모집 원칙 시행(2005.1.1.) 이전에 채용된 종사자의 경우, 법령에 따른 자격기준을 갖춤과 동시에 전제사항의 ㉯~㉱를 충족한다면 공개모집 원칙의 예외 적용이 가능함<\/div><div class=\"pchip\" id=\"p42\"><span>원문 42쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=54\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">종사자 채용계약 시 준수사항<\/div><div class=\"ln p\">사회복지사업법 제35조의3<\/div><div class=\"ln p\">‒사회복지법인과 사회복지시설을 설치･운영하는 자는 해당 법인 또는 시설의 종사자를 채용할 때 정당한 사유 없이 채용광고의 내용을 종사자가 되려는 사람에게 불리하게 변경하여 채용할 수 없음<\/div><div class=\"ln p\">‒사회복지법인과 사회복지시설을 설치･운영하는 자는 종사자를 채용한 후에 정당한 사유 없이 채용광고에서 제시한 근로조건을 종사자에게 불리하게 변경하여 적용할 수 없음<\/div><div class=\"ln p\">*제35조의3제1항 및 제2항을 위반하여 근로조건을 변경･적용한 경우 500만원 이하의 과태료 부과 대상이 됨<\/div><div class=\"ln p\">종사자 채용조건 변경 시 과태료 부과 안내<\/div><div class=\"ln p\">종사자 채용조건 변경 시 과태료를 부과하는 「사회복지사업법」 제35조의3이 신설･시행(2019.6.12.)됨에 따라, 2019.6.12.부터 최초로 종사자를 채용하는 경우부터 적용됨 -채용광고와 달리 종사자에게 근로조건 등을 불리하게 적용하는 경우에 500만원 이하의 과태료가 부과되는 점에 유의<\/div><div class=\"ln p\">“사회복지사”인 종사자의 임면보고<\/div><div class=\"ln p\">‒사회복지법인 또는 사회복지시설에서 사회복지사 자격을 가진 종사자를 임면한 경우에는 그 임면이 있는 달 말일까지 희망이음(사회서비스정보시스템 포함)또는 서면으로 해당 사실을 시장･군수･구청장 에게 보고할 것<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">종사자 등 결격사유 조회 시 유의사항<\/div><div class=\"ln p\">사회복지법인, 사회복지시설의 설치･운영자 및 지자체장은 「사회복지사업법」 제19조, 제35조, 제35조의2 등에 따른 임원 및 시설의 장 및 종사자 등에 대한 결격사유 조회를 「형의 실효 등에 관한 법률」 제6조(범죄경력조회･수사경력조회 및 회보의 제한 등) 각 호에 따라 최소한의 범위에서 할 수 있다.<\/div><div class=\"pchip\" id=\"p43\"><span>원문 43쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=55\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">‒기존 직원에 대한 범죄 관련 수사 등으로 인해 평소의 근무상태에 변화가 초래되거나 기타 다른 사유로 인해 기존 근무를 계속 유지할 수 없는 사정이 발생하는 등의 경우가 아닌 아무 이유 없이 범죄경력 조회가 이루어지는 것은 개인정보 침해 및 경찰청 범죄경력 조회의 과중한 업무 부담을 초래할 수 있으므로 단지 점검 목적의 이유로 범죄경력 조회 지양(법무부 등 관련기관 요청사항)<\/div><table class=\"htbl\"><tr><td>조회 주체<\/td><td>목  적<\/td><td colspan=\"2\">제출 서류<\/td><\/tr><tr><td>본인<\/td><td>본인 스스로 확인<\/td><td>1. 조회 의뢰서(지문 및 수사자료표 등에 관한 규칙 제4호 서식)<\/td><td rowspan=\"3\">2.조회의뢰자 신분증명서(주민등록증 또는 운전 면허증 등) 사본 1부<br>3.사회복지법인 및 시설임을 증명할 수 있는 서류 사본 1부<br>*사회복지법인 설립허가증, 사회복지시설 신고증, 사회복지시설 위수탁계약서 등 관련 법령과 운영자 명의를 확인할 수 있는 서류<\/td><\/tr><tr><td>설치･운영자<\/td><td>종사자에 대한 결격사유 확인 및 고용의 합법성 확인<\/td><td rowspan=\"2\">1.조회 의뢰서(지문 및 수사자료표 등에 관한 규칙 제3호 서식)<\/td><\/tr><tr><td>지자체장<\/td><td>종사자에 대한 결격사유 확인 및 고용의 합법성 확인<\/td><\/tr><tr><td colspan=\"4\">* 위 요청서 서식은 경찰청 범죄경력회보서발급시스템(crims.police.go.kr)-‘신청서식 안내’에서 다운로드 가능<br>※ 조회 결과를 누설하거나 법령에 규정된 용도 외에 사용할 목적으로 조회 결과를 취득･사용하였을 경우 형사처벌될 수 있음에 유의 (「형실효법」 제10조제2항･제3항)<\/td><\/tr><\/table><div class=\"ln p\">관련 근거 및 참고 자료<\/div><div class=\"ln p\">법무부 형사기획과-5895(’20.7.29) - 경찰청은 죄명과 「형실효법」 제2조제5호 각 목의 선고 또는 처분을 기준으로 범죄경력을 회보함. 경찰청에서 범죄경력을 회보하였다는 사실만으로 대상자가 결격사유에 해당한다고 단정할 수 없으며, 결격사유 기간 경과 판단의 기준이 되는 집행종료･면제 등의 정보, 죄명으로 구분되지 않는 범죄 정보 등을 관계 기관에 확인하여 결격사유 해당 여부를 최종적으로 판단해야 함 법무부 형사기획과-6278(’10.10.28.) -법령에 임명･고용 등의 자격제한 규정이 있는 한 해당 임명･고용 등의 주체가 국가나 공공기관이 아니어도 형실효법 6조 1항 9호에 따른 회보가 가능하다고 할 것임 ※ 다만, 「사회복지사업법」 제35조(시설의 장), 제35조의2(종사자)에 따른 결격사유는  사회복지시설에 한하여 조회 가능(동 지침 5~6쪽 참고)<\/div><div class=\"pchip\" id=\"p44\"><span>원문 44쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=56\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">「근로기준법」 등 적용 관련<\/div><div class=\"ln p\">(원칙) 사회복지시설에도 「근로기준법」 등 관계법령에 의한 근로기준을 적용하여 시설종사자의 기본적 생활을 보장 및 향상시키며 사회복지시설 관리의 효율성･민주성을 기할 것<\/div><div class=\"ln p\">➩세부적인 사항은 고용노동부 고객상담센터(1350)으로 문의하고, 유권해석이 필요한 경우 “지방노동관서 근로개선지도과”에 문의할 것<\/div><div class=\"ln p\">(비정규직 문제) 비정규직 차별 문제의 시정을 위해 관계법령 등 준수<\/div><div class=\"ln p\">「기간제 및 단시간근로자 보호 등에 관한 법률」<\/div><div class=\"ln p\">제3조(적용범위) ①이 법은 상시 5인 이상의 근로자를 사용하는 모든 사업 또는 사업장에 적용한다. 다만, 동거의 친족만을 사용하는 사업 또는 사업장과 가사사용인에 대하여는 적용하지 아니한다. ②상시 4인 이하의 근로자를 사용하는 사업 또는 사업장에 대하여는 대통령령으로 정하는 바에 따라 이 법의 일부 규정을 적용할 수 있다. ③국가 및 지방자치단체의 기관에 대하여는 상시 사용하는 근로자의 수와 관계없이 이 법을 적용한다. 제5조(기간의 정함이 없는 근로자로의 전환) 사용자는 기간의 정함이 없는 근로계약을 체결하고자 하는 경우에는 당해 사업 또는 사업장의 동종 또는 유사한 업무에 종사하는 기간제근로자를 우선적으로 고용하도록 노력하여야 한다. 제7조(통상근로자로의 전환 등) ①사용자는 통상근로자를 채용하고자 하는 경우에는 당해 사업 또는 사업장의 동종 또는 유사한 업무에 종사하는 단시간근로자를 우선적으로 고용하도록 노력하여야 한다.<\/div><div class=\"ln p\">(4대 보험 가입) 관련 법상 4대 보험(국민연금, 건강보험, 고용보험, 산재보험) 가입 대상을 확인하여 관련 법령에 위반되지 않도록 할 것<\/div><div class=\"ln p\">두루누리 사회보험료 지원사업 안내<\/div><div class=\"ln p\">근로자 수가 10명 미만인 사업장에 고용된 근로자 중 월평균보수가 230만원(’22년 기준) 미만인 신규 가입 근로자와 그 사업주에 대하여 신규 가입 근로자 및 사업주가 부담하는 고용보험과 국민연금 보험료의 80%를 최대 36개월까지 지원<\/div><div class=\"pchip\" id=\"p45\"><span>원문 45쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=57\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>사회복지시설 종사자 대체인력지원사업 안내<\/td><\/tr><tr><td>(개요) 사회복지시설 종사자(돌봄, 조리직)의 업무공백 방지 및 휴가권 보장을 위하여 휴가, 교육 등으로 업무공백이 발생할 경우 시도 대체인력지원센터에서 해당 사회복지시설에 대체인력을 지원<br>(지원대상) 사회복지사업법 제2조제4호에 따른 사회복지시설<br>* 영유아보육법에 따른 어린이집, 노인장기요양보험법에 따른 장기요양기관 제외<br>* 노인･장애인･아동복지시설은 반드시 지원 대상시설에 포함하고 그 외 시설의 경우 지자체 지역특성 및 사업운영 여건 등에 따라 조정 운영<br>(지원사유) 연차휴가, 교육, 병가, 공가(건강검진, 예비군훈련 등), 경조사 등 한시적 결원 발생한 경우<br>(지원기간) 동일종사자에 대해 1일 연속 7일 이내(1회 연장 가능)<br>* 지역별 상황 및 특성을 고려하여 지자체별 지침으로 정한 경우 동일종사자에 대해 최대 60일 이내 연속지원 가능<br>(지원업무) 사회복지시설의 돌봄서비스 및 조리업무 대체 수행<br>(지원신청) 사회서비스정보시스템(http://www.ssis.go.kr)에서 온라인으로 신청 세부사항은 각 시도 대체인력지원센터에 문의<br>(시·도대체인력지원센터)서울특별시사회복지협의회(서울),부산광역시 사회복지사협회(부산), 경상북도사회복지협의회(경북), 제주 특별자치도사회복지사협회(제주), 이외 13개 시·도는 각 시·도 사회서비스원에서 위탁 운영<br><table class=\"htbl\"><tr><td><\/td><td rowspan=\"2\">&lt;대체인력 파견 절차&gt;<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><\/tr><tr><td colspan=\"3\"><\/td><\/tr><\/table><\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"ln p\">채용절차의 공정화에 관한 법률」 제4조의3(출신지역 등 개인정보 요구 금지)<\/div><div class=\"ln p\">구인자는 구직자에 대하여 그 직무의 수행에 필요하지 아니한 다음 각 호의 정보를 기초심사자료에 기재하도록 요구하거나 입증자료로 수집하여서는 아니 된다. 1. 구직자 본인의 용모･키･체중 등의 신체적 조건 2. 구직자 본인의 출신지역･혼인여부･재산 3. 구직자 본인의 직계 존비속 및 형제자매의 학력･직업･재산 ※ 정당한 사유 없이 단순히 장애가 있다는 사실만으로 서류심사 등에서 탈락시키거나(국가인권위원회 13진정0889400), 종교행사에 참석을 강요하고, 적극적으로 참석하지 않았다거나 비협조적이라는 이유로 근로계약을 종료하는 경우(국가인권위원회 16진정0999900 등 참조)도 장애나 종교를 이유로 한 차별행위가 됨<\/div><div class=\"pchip\" id=\"p46\"><span>원문 46쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=58\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">사회복지시설 종사자 권익보호<\/div><div class=\"ln p\">(공익신고자보호법) 공익을 침해하는 행위*를 신고한 사람 등을 보호하고 지원함으로써 국민생활의 안정과 투명하고 깨끗한 사회풍토 확립에 이바지하기 위한 법<\/div><div class=\"ln p\">* 공익을 침해하는 행위란, 국민의 건강과 안전, 환경, 소비자의 이익, 공정한 경쟁 및 이에 준하는 공공의 이익을 침해하는 행위로서 ｢공익신고자 보호법｣ 별표에 규정된 법률(사회복지사업법 포함)의 벌칙에 해당하는 행위 등을 의미(공익신고자보호법 제2조 제1호)<\/div><div class=\"ln p\">「공익신고자보호법」상 공익신고의 요건<\/div><div class=\"ln p\">(접수기관) 법령에 명시된 공익신고 기관에 신고(제2조 제2호) - (법 제6조) ①공익침해행위를 하는 사람이나 기관 등의 대표자 또는 사용자, ②공익침해행위에 대한 지도·감독·조사권한을 가진 행정기관이나 감독기관, ③수사기관, ④국민권익위원회 - (시행령 제5조) ⑤국회의원, ⑥공익침해행위와 관련된 법률에 따라 설치된 공사·공단 등 공공단체 (내용·목적) 신고 내용이 거짓임을 알았거나 알 수 있었음에도 신고한 경우가 아닐 것, 금품·근로관계상 특혜 등 부당한 목적으로 신고한 경우가 아닐 것<\/div><div class=\"ln p\">「공익신고자보호법」상 공익신고자 보호<\/div><div class=\"ln p\">(비밀보장) 신고자 및 협조자의 동의없이 인적사항 또는 신고자·협조자임을 미루어 알 수 있는 사실을 공개·보도할 수 없음(제12조) (불이익조치 금지) 신고를 방해하거나 취소를 강요할 수 없으며, 신고를 이유로 신분상·행정적·경제적 불이익 조치를 취할 수 없음(제15조) (책임감면) 직무상 비밀준수 의무 면제, 신고와 관련한 신고자 및 협조자의 형벌·징계·행정처분 감경 또는 면제 가능(제14조) (신변보호) 신고를 이유로 신고자 등이 중대한 위해를 입었거나 그 우려가 명백한 경우 국민권익위원회에 신변보호 요청 가능(제13조)<\/div><div class=\"ln p\">(사회복지종사자 권익지원센터) ｢사회복지사 등의 처우 및 지위향상을 위한 법률｣ 제3조의3에 근거, 사회복지종사자들의 권익을 보호하고 지원하기 위해 사회복지종사자 권익지원센터 운영 중(’24.9월~)<\/div><div class=\"ln p\">* 직장내 괴롭힘, 이용자 관계 등 관련, ｢안전한 일터 만들기 가이드북｣ 발간<\/div><div class=\"ln p\">☞ 권익침해 상담 등 이용 : (전화)1800-7252, (홈페이지) https://welfarerights.or.kr, (이메일) rights7252@welfarerights.or.kr<\/div><div class=\"ln note\">※ 상담을 통해 알게 된 모든 내용은 외부에 공개되지 않으며, 비밀이 철저히 보장됩니다.<\/div><div class=\"pchip\" id=\"p47\"><span>원문 47쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=59\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지종사자 권익지원센터 개요<\/div><div class=\"ln p\">주요사업 - (상담 및 권익지원) 노무·법률·심리 전문가 연계해 문제 해결을 위한 실질적인 상담을 지원 - (교육) 권익 침해 문제에 예방·대응할 수 있는 노무 지식, 위기 대응 기술 등을 포함한 교육 제공 - (조사ㆍ연구) 사회복지 현장에서 발생하는 권익 침해 문제를 분석하고, 이를 바탕으로 정책 및 제도 개선 연구 수행 상담내용 - (폭력 피해) 상사/동료/이용자 등으로부터 발생하는 언어·신체·정서적 폭력, 위협적 행동, 성희롱·성폭력, 스토킹 등 - (직장 내 괴롭힘) 부당업무 강요, 따돌림, 업무배제, 종교 및 후원금 강요 등 - (노무 문제) 부당해고(징계 등), 급여 및 수당 미지급, 초과 근로, 휴가 제재 등<\/div>", "pages": [{"p": 39, "t": "3\n사회복지시설 종사자 관리\n가\n공개모집(시행일 2005. 1. 1.)\n정부에서 인건비를 지원하는 시설(국가나 지자체로부터 수탁받은 시설 포함)의 시설장 및 종사자 신규채용은 직위와 관계없이 공개모집을 원칙으로 함\n※ [감사원 위임 감사(2004.12), 권익위 제도개선 권고(2010.4)] 반영 : 일부 사회복지시설에서 동 시설을 운영하는 법인의 임원, 운영자 개인 또는 시설장과 특별한 관계(배우자, 자녀, 친인척 등)에 있는 자들이 다수 재임하면서 법인 및 시설운영의 투명성을 저해하고 있다는 지적\n공개모집이란 자격을 갖춘 누구에게나 응모기회를 제공하여, 경쟁을 통해 능력 있는 자를 임용하는 제도로, 특정인을 채용하기 위한 법인 및 시설 채용내규, 응모자격을 특정인으로 제한 등은 공개모집에 위배됨\n‒법인 또는 시설에서 독자적 또는 공동으로 채용 시 해당 법인 및 시설 홈페이지 외 지자체 홈페이지, 워크넷, 복지넷, 희망이음* 중 2곳 이상의 사이트에 채용 관련 사항을 15일 이상 공고한 후 법인 및 시설 내규 등에 의해 채용\n※시설운영위원회를 신규직원 선발과정에 활용하는 방안을 모색할 것\n※긴급한 업무처리 등 불가피한 사유가 있는 경우 공고기간을 자체사정에 따라 7일 이상 15일 이하로 단축 가능\n※특히, 시설 재무･회계담당자는 법인임원이나 시설장과 독립적인 자로 선발하여 법인 및 시설운영의 투명성 제고"}, {"p": 40, "t": "나\n공개모집 원칙의 예외\n①다음 각 목의 어느 하나에 해당 경우에는 아래 조건을 모두 충족하는 전제 하에 공개모집 원칙을 완화하여 적용할 수 있음\n전제사항\n㉮ 종전에 공개모집 절차에 따라 채용된 사람일 것 ㉯ 동일한 설치･운영자와 근로･고용계약이 체결되어 있을 것 ㉰ 해당 시설을 운영하는 법인의 임원, 운영자 개인 또는 시설장과 특별한 관계가 없을 것 ㉱ 해당 직위와 관련하여 법령에 따른 자격기준을 충족시킬 것\n가.동일한 시설 내에서 승진, 인사이동 등으로 보직이 변경되는 경우\n*채용 당시 ①에서 제시된 전제 조건을 모두 충족하여 채용된 기간제근로자 등이 정규직 전환이 필요한 경우에도 시설 내에서 보직이 변경되는 경우로 적용 가능\n나.동일한 설치･운영자*가 각각 설치･운영하는 시설 간 인사 이동\n※ 다만, 시설장으로 근무 중인 성직자(聖職者)가 소속 종교 단체의 인사발령으로 타 시설의 시설장으로 인사 이동하는 경우, 해당 종교 단체*를 「동일한 설치･운영자」로 볼 수 있음(ʼ21.1.1.부터 시행) * 법인을 구성하여 시설 운영하는 경우 제외(단, 종교 단체의 인사발령 문서 등 내부 의사결정 사항이 명확히 확인되어야 함.)\n다.설치･운영자가 법인인 경우로서 해당 법인의 사무국*에 근무하다, 그 법인이 설치･운영하는 시설로 인사이동을 하는 경우\n*법인 정관 또는 하위 규정에 따른 사무국 조직 및 정원 등 관련 규정이 있는 경우\n라.법령에 따라 사회복지시설이 통합되는 경우나 시설 위･수탁 계약에 따라 종전 종사자의 고용관계를 승계하는 경우\n마.출산 또는 육아를 위해 휴직한 사람을 대체하기 위해서 고용된 경우* 해당 대체근로 계약 기간을 연장하고자 하는 경우\n*대체근무자로 최초로 고용되는 경우에는 공개채용을 하여야 함"}, {"p": 41, "t": "②①의【전제사항】㉰에서 명시하고 있는 특별한 관계에 있는 사람의 범위는 다음과 같음\n시설 설치･운영자인 법인의 임원, 운영자 개인 또는 시설장과의 관계가 다음 어느 하나에 해당하는 사람\n가. 6촌 이내의 혈족\n나. 4촌 이내의 인척\n다. 배우자(사실상 혼인관계에 있는 사람을 포함한다)\n법인의 임원, 운영자 개인 또는 시설장의 금전 그 밖의 재산에 의하여 생계를 유지하거나, 그와 생계를 함께 하는 사람\n③①의 가, 나, 다목에 따른 인사이동으로 인해 발생한 공석(空席)은 가, 나, 다목에 따라 충원(充員)되지 않을 시 공개모집 절차로 충원할 것\n④공개모집 원칙의 예외를 적용할 경우 시설의 설치･운영자는 그 시설장･종사자 등과의 근로계약관계에 있어서 관계법령의 위반이 없도록 각별히 주의할 것\n⑤「ʼ18년 사회복지시설 관리안내」에서 예외로 인정하고 있었던 종교･학교법인 소속 시설에 대한 각 법인 관계자의 임명 건은 ʼ19년 1월1일 이전의 건에 한하여 인정\n⑥공개모집 원칙 시행(2005.1.1.) 이전에 채용된 종사자의 경우, 법령에 따른 자격기준을 갖춤과 동시에 전제사항의 ㉯~㉱를 충족한다면 공개모집 원칙의 예외 적용이 가능함"}, {"p": 42, "t": "다\n종사자 채용계약 시 준수사항\n사회복지사업법 제35조의3\n‒사회복지법인과 사회복지시설을 설치･운영하는 자는 해당 법인 또는 시설의 종사자를 채용할 때 정당한 사유 없이 채용광고의 내용을 종사자가 되려는 사람에게 불리하게 변경하여 채용할 수 없음\n‒사회복지법인과 사회복지시설을 설치･운영하는 자는 종사자를 채용한 후에 정당한 사유 없이 채용광고에서 제시한 근로조건을 종사자에게 불리하게 변경하여 적용할 수 없음\n*제35조의3제1항 및 제2항을 위반하여 근로조건을 변경･적용한 경우 500만원 이하의 과태료 부과 대상이 됨\n종사자 채용조건 변경 시 과태료 부과 안내\n종사자 채용조건 변경 시 과태료를 부과하는 「사회복지사업법」 제35조의3이 신설･시행(2019.6.12.)됨에 따라, 2019.6.12.부터 최초로 종사자를 채용하는 경우부터 적용됨 -채용광고와 달리 종사자에게 근로조건 등을 불리하게 적용하는 경우에 500만원 이하의 과태료가 부과되는 점에 유의\n“사회복지사”인 종사자의 임면보고\n‒사회복지법인 또는 사회복지시설에서 사회복지사 자격을 가진 종사자를 임면한 경우에는 그 임면이 있는 달 말일까지 희망이음(사회서비스정보시스템 포함)또는 서면으로 해당 사실을 시장･군수･구청장 에게 보고할 것\n라\n종사자 등 결격사유 조회 시 유의사항\n사회복지법인, 사회복지시설의 설치･운영자 및 지자체장은 「사회복지사업법」 제19조, 제35조, 제35조의2 등에 따른 임원 및 시설의 장 및 종사자 등에 대한 결격사유 조회를 「형의 실효 등에 관한 법률」 제6조(범죄경력조회･수사경력조회 및 회보의 제한 등) 각 호에 따라 최소한의 범위에서 할 수 있다."}, {"p": 43, "t": "‒기존 직원에 대한 범죄 관련 수사 등으로 인해 평소의 근무상태에 변화가 초래되거나 기타 다른 사유로 인해 기존 근무를 계속 유지할 수 없는 사정이 발생하는 등의 경우가 아닌 아무 이유 없이 범죄경력 조회가 이루어지는 것은 개인정보 침해 및 경찰청 범죄경력 조회의 과중한 업무 부담을 초래할 수 있으므로 단지 점검 목적의 이유로 범죄경력 조회 지양(법무부 등 관련기관 요청사항)\n조회 주체 | 목  적 | 제출 서류\n본인 | 본인 스스로 확인 | 1. 조회 의뢰서(지문 및 수사자료표 등에 관한 규칙 제4호 서식) | 2.조회의뢰자 신분증명서(주민등록증 또는 운전 면허증 등) 사본 1부 3.사회복지법인 및 시설임을 증명할 수 있는 서류 사본 1부 *사회복지법인 설립허가증, 사회복지시설 신고증, 사회복지시설 위수탁계약서 등 관련 법령과 운영자 명의를 확인할 수 있는 서류\n설치･운영자 | 종사자에 대한 결격사유 확인 및 고용의 합법성 확인 | 1.조회 의뢰서(지문 및 수사자료표 등에 관한 규칙 제3호 서식)\n지자체장 | 종사자에 대한 결격사유 확인 및 고용의 합법성 확인\n* 위 요청서 서식은 경찰청 범죄경력회보서발급시스템(crims.police.go.kr)-‘신청서식 안내’에서 다운로드 가능 ※ 조회 결과를 누설하거나 법령에 규정된 용도 외에 사용할 목적으로 조회 결과를 취득･사용하였을 경우 형사처벌될 수 있음에 유의 (「형실효법」 제10조제2항･제3항)\n관련 근거 및 참고 자료\n법무부 형사기획과-5895(’20.7.29) - 경찰청은 죄명과 「형실효법」 제2조제5호 각 목의 선고 또는 처분을 기준으로 범죄경력을 회보함. 경찰청에서 범죄경력을 회보하였다는 사실만으로 대상자가 결격사유에 해당한다고 단정할 수 없으며, 결격사유 기간 경과 판단의 기준이 되는 집행종료･면제 등의 정보, 죄명으로 구분되지 않는 범죄 정보 등을 관계 기관에 확인하여 결격사유 해당 여부를 최종적으로 판단해야 함 법무부 형사기획과-6278(’10.10.28.) -법령에 임명･고용 등의 자격제한 규정이 있는 한 해당 임명･고용 등의 주체가 국가나 공공기관이 아니어도 형실효법 6조 1항 9호에 따른 회보가 가능하다고 할 것임 ※ 다만, 「사회복지사업법」 제35조(시설의 장), 제35조의2(종사자)에 따른 결격사유는  사회복지시설에 한하여 조회 가능(동 지침 5~6쪽 참고)"}, {"p": 44, "t": "마\n「근로기준법」 등 적용 관련\n(원칙) 사회복지시설에도 「근로기준법」 등 관계법령에 의한 근로기준을 적용하여 시설종사자의 기본적 생활을 보장 및 향상시키며 사회복지시설 관리의 효율성･민주성을 기할 것\n➩세부적인 사항은 고용노동부 고객상담센터(1350)으로 문의하고, 유권해석이 필요한 경우 “지방노동관서 근로개선지도과”에 문의할 것\n(비정규직 문제) 비정규직 차별 문제의 시정을 위해 관계법령 등 준수\n「기간제 및 단시간근로자 보호 등에 관한 법률」\n제3조(적용범위) ①이 법은 상시 5인 이상의 근로자를 사용하는 모든 사업 또는 사업장에 적용한다. 다만, 동거의 친족만을 사용하는 사업 또는 사업장과 가사사용인에 대하여는 적용하지 아니한다. ②상시 4인 이하의 근로자를 사용하는 사업 또는 사업장에 대하여는 대통령령으로 정하는 바에 따라 이 법의 일부 규정을 적용할 수 있다. ③국가 및 지방자치단체의 기관에 대하여는 상시 사용하는 근로자의 수와 관계없이 이 법을 적용한다. 제5조(기간의 정함이 없는 근로자로의 전환) 사용자는 기간의 정함이 없는 근로계약을 체결하고자 하는 경우에는 당해 사업 또는 사업장의 동종 또는 유사한 업무에 종사하는 기간제근로자를 우선적으로 고용하도록 노력하여야 한다. 제7조(통상근로자로의 전환 등) ①사용자는 통상근로자를 채용하고자 하는 경우에는 당해 사업 또는 사업장의 동종 또는 유사한 업무에 종사하는 단시간근로자를 우선적으로 고용하도록 노력하여야 한다.\n(4대 보험 가입) 관련 법상 4대 보험(국민연금, 건강보험, 고용보험, 산재보험) 가입 대상을 확인하여 관련 법령에 위반되지 않도록 할 것\n두루누리 사회보험료 지원사업 안내\n근로자 수가 10명 미만인 사업장에 고용된 근로자 중 월평균보수가 230만원(’22년 기준) 미만인 신규 가입 근로자와 그 사업주에 대하여 신규 가입 근로자 및 사업주가 부담하는 고용보험과 국민연금 보험료의 80%를 최대 36개월까지 지원"}, {"p": 45, "t": "사회복지시설 종사자 대체인력지원사업 안내\n(개요) 사회복지시설 종사자(돌봄, 조리직)의 업무공백 방지 및 휴가권 보장을 위하여 휴가, 교육 등으로 업무공백이 발생할 경우 시도 대체인력지원센터에서 해당 사회복지시설에 대체인력을 지원 (지원대상) 사회복지사업법 제2조제4호에 따른 사회복지시설 * 영유아보육법에 따른 어린이집, 노인장기요양보험법에 따른 장기요양기관 제외 * 노인･장애인･아동복지시설은 반드시 지원 대상시설에 포함하고 그 외 시설의 경우 지자체 지역특성 및 사업운영 여건 등에 따라 조정 운영 (지원사유) 연차휴가, 교육, 병가, 공가(건강검진, 예비군훈련 등), 경조사 등 한시적 결원 발생한 경우 (지원기간) 동일종사자에 대해 1일 연속 7일 이내(1회 연장 가능) * 지역별 상황 및 특성을 고려하여 지자체별 지침으로 정한 경우 동일종사자에 대해 최대 60일 이내 연속지원 가능 (지원업무) 사회복지시설의 돌봄서비스 및 조리업무 대체 수행 (지원신청) 사회서비스정보시스템(http://www.ssis.go.kr)에서 온라인으로 신청 세부사항은 각 시도 대체인력지원센터에 문의 (시·도대체인력지원센터)서울특별시사회복지협의회(서울),부산광역시 사회복지사협회(부산), 경상북도사회복지협의회(경북), 제주 특별자치도사회복지사협회(제주), 이외 13개 시·도는 각 시·도 사회서비스원에서 위탁 운영  | <대체인력 파견 절차> | \n | \n\n\n채용절차의 공정화에 관한 법률」 제4조의3(출신지역 등 개인정보 요구 금지)\n구인자는 구직자에 대하여 그 직무의 수행에 필요하지 아니한 다음 각 호의 정보를 기초심사자료에 기재하도록 요구하거나 입증자료로 수집하여서는 아니 된다. 1. 구직자 본인의 용모･키･체중 등의 신체적 조건 2. 구직자 본인의 출신지역･혼인여부･재산 3. 구직자 본인의 직계 존비속 및 형제자매의 학력･직업･재산 ※ 정당한 사유 없이 단순히 장애가 있다는 사실만으로 서류심사 등에서 탈락시키거나(국가인권위원회 13진정0889400), 종교행사에 참석을 강요하고, 적극적으로 참석하지 않았다거나 비협조적이라는 이유로 근로계약을 종료하는 경우(국가인권위원회 16진정0999900 등 참조)도 장애나 종교를 이유로 한 차별행위가 됨"}, {"p": 46, "t": "바\n사회복지시설 종사자 권익보호\n(공익신고자보호법) 공익을 침해하는 행위*를 신고한 사람 등을 보호하고 지원함으로써 국민생활의 안정과 투명하고 깨끗한 사회풍토 확립에 이바지하기 위한 법\n* 공익을 침해하는 행위란, 국민의 건강과 안전, 환경, 소비자의 이익, 공정한 경쟁 및 이에 준하는 공공의 이익을 침해하는 행위로서 ｢공익신고자 보호법｣ 별표에 규정된 법률(사회복지사업법 포함)의 벌칙에 해당하는 행위 등을 의미(공익신고자보호법 제2조 제1호)\n「공익신고자보호법」상 공익신고의 요건\n(접수기관) 법령에 명시된 공익신고 기관에 신고(제2조 제2호) - (법 제6조) ①공익침해행위를 하는 사람이나 기관 등의 대표자 또는 사용자, ②공익침해행위에 대한 지도·감독·조사권한을 가진 행정기관이나 감독기관, ③수사기관, ④국민권익위원회 - (시행령 제5조) ⑤국회의원, ⑥공익침해행위와 관련된 법률에 따라 설치된 공사·공단 등 공공단체 (내용·목적) 신고 내용이 거짓임을 알았거나 알 수 있었음에도 신고한 경우가 아닐 것, 금품·근로관계상 특혜 등 부당한 목적으로 신고한 경우가 아닐 것\n「공익신고자보호법」상 공익신고자 보호\n(비밀보장) 신고자 및 협조자의 동의없이 인적사항 또는 신고자·협조자임을 미루어 알 수 있는 사실을 공개·보도할 수 없음(제12조) (불이익조치 금지) 신고를 방해하거나 취소를 강요할 수 없으며, 신고를 이유로 신분상·행정적·경제적 불이익 조치를 취할 수 없음(제15조) (책임감면) 직무상 비밀준수 의무 면제, 신고와 관련한 신고자 및 협조자의 형벌·징계·행정처분 감경 또는 면제 가능(제14조) (신변보호) 신고를 이유로 신고자 등이 중대한 위해를 입었거나 그 우려가 명백한 경우 국민권익위원회에 신변보호 요청 가능(제13조)\n(사회복지종사자 권익지원센터) ｢사회복지사 등의 처우 및 지위향상을 위한 법률｣ 제3조의3에 근거, 사회복지종사자들의 권익을 보호하고 지원하기 위해 사회복지종사자 권익지원센터 운영 중(’24.9월~)\n* 직장내 괴롭힘, 이용자 관계 등 관련, ｢안전한 일터 만들기 가이드북｣ 발간\n☞ 권익침해 상담 등 이용 : (전화)1800-7252, (홈페이지) https://welfarerights.or.kr, (이메일) rights7252@welfarerights.or.kr\n※ 상담을 통해 알게 된 모든 내용은 외부에 공개되지 않으며, 비밀이 철저히 보장됩니다."}, {"p": 47, "t": "사회복지종사자 권익지원센터 개요\n주요사업 - (상담 및 권익지원) 노무·법률·심리 전문가 연계해 문제 해결을 위한 실질적인 상담을 지원 - (교육) 권익 침해 문제에 예방·대응할 수 있는 노무 지식, 위기 대응 기술 등을 포함한 교육 제공 - (조사ㆍ연구) 사회복지 현장에서 발생하는 권익 침해 문제를 분석하고, 이를 바탕으로 정책 및 제도 개선 연구 수행 상담내용 - (폭력 피해) 상사/동료/이용자 등으로부터 발생하는 언어·신체·정서적 폭력, 위협적 행동, 성희롱·성폭력, 스토킹 등 - (직장 내 괴롭힘) 부당업무 강요, 따돌림, 업무배제, 종교 및 후원금 강요 등 - (노무 문제) 부당해고(징계 등), 급여 및 수당 미지급, 초과 근로, 휴가 제재 등"}]}, {"title": "4. 사회복지시설 인건비 보조금 지급기준", "start": 48, "end": 48, "html": "<div class=\"pchip\" id=\"p48\"><span>원문 48쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=60\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>사회복지시설 인건비 보조금 지급기준<\/div><div class=\"ln p\">1)목적<\/div><div class=\"ln p\">사회복지시설 종사자의 인건비 보조금 지급기준으로써 호봉획정 등 보수관련 업무처리의 기본적인 기준을 정함으로써 종사자 보수업무의 정확성과 통일성을 기하고자 함<\/div><div class=\"ln p\">2)적용범위<\/div><div class=\"ln p\">사회복지시설 및 그 종사자(이하 시설장 포함)<\/div><div class=\"ln p\">3)적용의 원칙<\/div><div class=\"ln p\">개별시설 담당부서 및 지방자치단체 예산사정에 따라 별도의 호봉획정 관련 지침을 마련할 것<\/div><div class=\"ln p\">‒지침 마련 시 ‘부록 3. 사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)’을 참고<\/div><div class=\"ln note\">※「사회복지사 등의 처우 및 지위 향상을 위한 법률」에 따라 국가와 지방자치단체는 사회복지사 등의 보수가 사회복지전담공무원의 보수수준에 도달하도록 노력하여야 하는 바, 각 지자체별 조례 제정 등을 통해 처우 개선을 추진할 것<\/div><div class=\"ln note\">※다만, 국고보조시설의 경우에는 부록 3의 기준 보다 하향된 기준으로 하여 개별담당부서 또는 지자체의 별도기준을 둘 수 없음<\/div><div class=\"ln p\">부록 3에 의한 기준과 복지부 개별시설 담당부서 지침 또는 각 지방자치단체의 기준이 충돌할 경우 후자의 기준이 우선<\/div>", "pages": [{"p": 48, "t": "4\n사회복지시설 인건비 보조금 지급기준\n1)목적\n사회복지시설 종사자의 인건비 보조금 지급기준으로써 호봉획정 등 보수관련 업무처리의 기본적인 기준을 정함으로써 종사자 보수업무의 정확성과 통일성을 기하고자 함\n2)적용범위\n사회복지시설 및 그 종사자(이하 시설장 포함)\n3)적용의 원칙\n개별시설 담당부서 및 지방자치단체 예산사정에 따라 별도의 호봉획정 관련 지침을 마련할 것\n‒지침 마련 시 ‘부록 3. 사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)’을 참고\n※「사회복지사 등의 처우 및 지위 향상을 위한 법률」에 따라 국가와 지방자치단체는 사회복지사 등의 보수가 사회복지전담공무원의 보수수준에 도달하도록 노력하여야 하는 바, 각 지자체별 조례 제정 등을 통해 처우 개선을 추진할 것\n※다만, 국고보조시설의 경우에는 부록 3의 기준 보다 하향된 기준으로 하여 개별담당부서 또는 지자체의 별도기준을 둘 수 없음\n부록 3에 의한 기준과 복지부 개별시설 담당부서 지침 또는 각 지방자치단체의 기준이 충돌할 경우 후자의 기준이 우선"}]}, {"title": "5. 사회복지시설 휴지·재개·자진폐지(법 제38조 관련)", "start": 49, "end": 51, "html": "<div class=\"pchip\" id=\"p49\"><span>원문 49쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=61\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">5<\/span>사회복지시설 휴지･재개･자진폐지(법 제38조 관련)<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">시설의 휴지<\/div><div class=\"ln p\">시설의 운영을 휴지하고자 하는 때에는 휴지 3개월 전까지 시장･군수･구청장에게 신고하여야 함<\/div><div class=\"ln p\">구비서류(시행규칙 제26조제1항)<\/div><div class=\"ln p\">‒시설의 휴지사유서(법인의 경우 휴지를 결의한 이사회의 회의록 사본) 1부<\/div><div class=\"ln p\">‒시설거주자에 대한 조치계획서(시설 거주자 자립 지원 또는 전원조치 등 포함) 1부<\/div><div class=\"ln p\">‒시설 이용자가 납부한 시설 이용료 및 사용료의 반환조치계획서 1부<\/div><div class=\"ln p\">‒보조금･후원금의 사용 결과 보고서와 이를 재원으로 조성한 잔여재산 반환조치 계획서 1부<\/div><div class=\"ln p\">‒시설의 재산에 관한 사용 또는 처분계획서 1부<\/div><div class=\"pchip\" id=\"p50\"><span>원문 50쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=62\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">시･군･구 추가조치사항<\/div><div class=\"ln p\">‒시설거주자에 대한 조치계획서의 타당성과 이행여부 확인<\/div><div class=\"ln p\">‒시설거주자의 사용료 반환여부 확인, 보조금･후원금품 등 사용실태 확인<\/div><div class=\"ln p\">‒전원조치 등 시설거주자의 권익을 보호하기 위한 추가 조치 시행<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">시설의 재개<\/div><div class=\"ln p\">시설의 운영을 재개하고자 하는 때에는 재개 3개월 전까지 시장･군수･구청장에게 신고하여야 함<\/div><div class=\"ln p\">구비서류(시행규칙 제26조제1항)<\/div><div class=\"ln p\">‒시설의 재개사유서(법인의 경우 재개를 결의한 이사회 회의록 사본) 1부<\/div><div class=\"ln p\">‒시설 운영 중단 사유의 해소 조치 보고서 1부<\/div><div class=\"ln p\">‒향후 안정적 운영을 위한 시설의 운영계획서 1부<\/div><div class=\"ln p\">시･군･구 추가조치사항<\/div><div class=\"ln p\">‒운영 중단 사유 해소 여부 및 향후 안정적 운영계획 수립의 타당성과 이행여부 확인<\/div><div class=\"ln p\">‒기타 시설거주자의 권익을 보호하기 위한 추가 조치 시행<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">시설의 폐지신고<\/div><div class=\"ln p\">시설을 폐지하고자 하는 때에는 폐지 3개월 전까지 시장･군수･구청장에게 신고하여야 함<\/div><div class=\"ln p\">구비서류(시행규칙 제26조제1항)<\/div><div class=\"ln p\">‒시설의 폐지사유서(법인의 경우 폐지를 결의한 이사회의 회의록 사본) 1부<\/div><div class=\"ln p\">‒시설거주자에 대한 조치계획서(시설 거주자 자립 지원 또는 전원조치 등 포함) 1부<\/div><div class=\"ln p\">‒시설 이용자가 납부한 시설 이용료 및 사용료의 반환조치계획서 1부<\/div><div class=\"ln p\">‒보조금･후원금의 사용 결과 보고서와 이를 재원으로 조성한 잔여재산 반환조치계획서 1부<\/div><div class=\"ln p\">‒시설의 재산에 관한 사용 또는 처분계획서 1부<\/div><div class=\"ln p\">‒사회복지시설 신고증 1부<\/div><div class=\"ln p\">시･군･구 추가 조치사항：시설의 휴지 때와 동일<\/div><div class=\"ln note\">※시설의 휴지, 자진폐지 시 시설거주자의 권익보호를 기피 또는 거부하는 자에게는 1년 이하 징역 또는 1천만 원 이하 벌금에 처하고, 신고하고 지체 없이 시설을 운영하지 않은 자, 신고하지 않고 시설을 휴지, 재개, 자진폐지하는 경우 300만 원 이하 과태료에 처함<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">지자체 조치사항<\/div><div class=\"ln p\">시설 휴지･재개･폐지 시 지자체 조치 사항(법 제38조제3항)<\/div><div class=\"ln p\">‒시설 거주자가 자립을 원하는 경우 자립을 할 수 있도록 지원하고 그 이행을 확인하는 조치<\/div><div class=\"ln p\">‒시설 거주자가 다른 시설을 선택할 수 있도록 하고 그 이행을 확인하는 조치<\/div><div class=\"pchip\" id=\"p51\"><span>원문 51쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=63\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">‒시설거주가가 이용료･사용료 등의 비용을 부담하는 경우 납부한 비용 중 사용하지 아니한 금액을 반환하게 하고 그 이행을 확인하는 조치<\/div><div class=\"ln p\">‒보조금･후원금 등의 사용 실태 확인과 이를 재원으로 조성한 재산 중 남은 재산의 회수조치<\/div><div class=\"ln p\">‒그 밖에 시설 거주자의 권익 보호를 위하여 필요하다고 인정되는 조치<\/div><div class=\"ln note\">※ 법 38조에 따라, 시설 폐지 신고를 한 경우 폐지 신고가 수리된 즉시 사회서비스정보시스템 및 사회복지시설정보시스템 사용 대상에서 제외되므로 폐지 신고 수리 전까지 결산보고, 보조금 정산, 입소자 퇴소보고, 종사자 퇴소보고 등의 업무 처리의 완료 여부 확인 후 처리하여야 함<\/div>", "pages": [{"p": 49, "t": "5\n사회복지시설 휴지･재개･자진폐지(법 제38조 관련)\n가\n시설의 휴지\n시설의 운영을 휴지하고자 하는 때에는 휴지 3개월 전까지 시장･군수･구청장에게 신고하여야 함\n구비서류(시행규칙 제26조제1항)\n‒시설의 휴지사유서(법인의 경우 휴지를 결의한 이사회의 회의록 사본) 1부\n‒시설거주자에 대한 조치계획서(시설 거주자 자립 지원 또는 전원조치 등 포함) 1부\n‒시설 이용자가 납부한 시설 이용료 및 사용료의 반환조치계획서 1부\n‒보조금･후원금의 사용 결과 보고서와 이를 재원으로 조성한 잔여재산 반환조치 계획서 1부\n‒시설의 재산에 관한 사용 또는 처분계획서 1부"}, {"p": 50, "t": "시･군･구 추가조치사항\n‒시설거주자에 대한 조치계획서의 타당성과 이행여부 확인\n‒시설거주자의 사용료 반환여부 확인, 보조금･후원금품 등 사용실태 확인\n‒전원조치 등 시설거주자의 권익을 보호하기 위한 추가 조치 시행\n나\n시설의 재개\n시설의 운영을 재개하고자 하는 때에는 재개 3개월 전까지 시장･군수･구청장에게 신고하여야 함\n구비서류(시행규칙 제26조제1항)\n‒시설의 재개사유서(법인의 경우 재개를 결의한 이사회 회의록 사본) 1부\n‒시설 운영 중단 사유의 해소 조치 보고서 1부\n‒향후 안정적 운영을 위한 시설의 운영계획서 1부\n시･군･구 추가조치사항\n‒운영 중단 사유 해소 여부 및 향후 안정적 운영계획 수립의 타당성과 이행여부 확인\n‒기타 시설거주자의 권익을 보호하기 위한 추가 조치 시행\n다\n시설의 폐지신고\n시설을 폐지하고자 하는 때에는 폐지 3개월 전까지 시장･군수･구청장에게 신고하여야 함\n구비서류(시행규칙 제26조제1항)\n‒시설의 폐지사유서(법인의 경우 폐지를 결의한 이사회의 회의록 사본) 1부\n‒시설거주자에 대한 조치계획서(시설 거주자 자립 지원 또는 전원조치 등 포함) 1부\n‒시설 이용자가 납부한 시설 이용료 및 사용료의 반환조치계획서 1부\n‒보조금･후원금의 사용 결과 보고서와 이를 재원으로 조성한 잔여재산 반환조치계획서 1부\n‒시설의 재산에 관한 사용 또는 처분계획서 1부\n‒사회복지시설 신고증 1부\n시･군･구 추가 조치사항：시설의 휴지 때와 동일\n※시설의 휴지, 자진폐지 시 시설거주자의 권익보호를 기피 또는 거부하는 자에게는 1년 이하 징역 또는 1천만 원 이하 벌금에 처하고, 신고하고 지체 없이 시설을 운영하지 않은 자, 신고하지 않고 시설을 휴지, 재개, 자진폐지하는 경우 300만 원 이하 과태료에 처함\n라\n지자체 조치사항\n시설 휴지･재개･폐지 시 지자체 조치 사항(법 제38조제3항)\n‒시설 거주자가 자립을 원하는 경우 자립을 할 수 있도록 지원하고 그 이행을 확인하는 조치\n‒시설 거주자가 다른 시설을 선택할 수 있도록 하고 그 이행을 확인하는 조치"}, {"p": 51, "t": "‒시설거주가가 이용료･사용료 등의 비용을 부담하는 경우 납부한 비용 중 사용하지 아니한 금액을 반환하게 하고 그 이행을 확인하는 조치\n‒보조금･후원금 등의 사용 실태 확인과 이를 재원으로 조성한 재산 중 남은 재산의 회수조치\n‒그 밖에 시설 거주자의 권익 보호를 위하여 필요하다고 인정되는 조치\n※ 법 38조에 따라, 시설 폐지 신고를 한 경우 폐지 신고가 수리된 즉시 사회서비스정보시스템 및 사회복지시설정보시스템 사용 대상에서 제외되므로 폐지 신고 수리 전까지 결산보고, 보조금 정산, 입소자 퇴소보고, 종사자 퇴소보고 등의 업무 처리의 완료 여부 확인 후 처리하여야 함"}]}, {"title": "6. 상속인이 없는 재산처리(법 제45조의2 관련)", "start": 52, "end": 52, "html": "<div class=\"pchip\" id=\"p52\"><span>원문 52쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=64\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">6<\/span>상속인이 없는 재산처리(법 제45조의2 관련)<\/div><div class=\"ln p\">사회복지시설에서 생활 중 사망한 무연고자가 남긴 금품에 대한 처리 절차를 규정하는 조항이 사회복지사업법 등에 신설 됨<\/div><div class=\"ln p\">‒사회복지시설을 설치･운영하는 자는 시설에 입소 중인 사람이 사망하고 그 상속인의 존부가 분명하지 아니한 때에는 「민법」 제1053조부터 제1059조까지의 규정에 따라 사망한 사람의 재산을 처리*<\/div><div class=\"ln p\">*「민법」에 따른 재산관리인 선임청구를 하고 그 이후의 절차 전반에 대하여 법원 등의 요청에 따라 필요한 조치 등을 하는 것<\/div><div class=\"ln p\">사망한 사람의 잔여재산이 500만원 이하인 경우에는 관할 시장･군수･구청장에게 잔여재산 목록을 작성하여 보고하는 것으로 그 재산의 처리를 갈음할 수 있음<\/div><div class=\"ln p\">‒시장･군수･구청장은 제2조제4호의 사회복지시설별 소관 법률*에서 정하는 절차에 따라 사망인의 재산을 처리할 수 있음<\/div><div class=\"ln p\">*「노숙인 등의 복지 및 자립지원에 관한 법률」, 「노인복지법」, 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」, 「장애인복지법」에 해당 조문 신설<\/div><div class=\"ln p\">상속인이 없는 재산처리 관련 참고<\/div><div class=\"ln p\">상속인 없는 재산의 처리방법 등은 「민법」 및 사회복지시설별 소관 법률, 「무연고 사망자 유류금품 처리 간소화 및 법률지원서비스」 지침 참고 ‣ 보건복지부 홈페이지(정보&gt;법인/시설/단체 탭)에서 다운로드 가능 사망한 무연고자의 상속재산이 500만원이 초과하는 경우 상속재산 관리인의 선임 및 재산처리절차를 지원하기 위해 대한변호사협회와 업무협약을 체결해 사회복지시설 무연고 사망자 유류금 신속처리 법률지원단을 운영하고 있음(문의: 대한변호사협회 인권팀(02-3476-4000(내선 10번)) ☞ 상속재산 관리인 선임 및 재산처리절차에 필요한 비용(상담･출장비, 인지･송달료, 보수예납금 등)은 운영비로 지출할 수 있음<\/div>", "pages": [{"p": 52, "t": "6\n상속인이 없는 재산처리(법 제45조의2 관련)\n사회복지시설에서 생활 중 사망한 무연고자가 남긴 금품에 대한 처리 절차를 규정하는 조항이 사회복지사업법 등에 신설 됨\n‒사회복지시설을 설치･운영하는 자는 시설에 입소 중인 사람이 사망하고 그 상속인의 존부가 분명하지 아니한 때에는 「민법」 제1053조부터 제1059조까지의 규정에 따라 사망한 사람의 재산을 처리*\n*「민법」에 따른 재산관리인 선임청구를 하고 그 이후의 절차 전반에 대하여 법원 등의 요청에 따라 필요한 조치 등을 하는 것\n사망한 사람의 잔여재산이 500만원 이하인 경우에는 관할 시장･군수･구청장에게 잔여재산 목록을 작성하여 보고하는 것으로 그 재산의 처리를 갈음할 수 있음\n‒시장･군수･구청장은 제2조제4호의 사회복지시설별 소관 법률*에서 정하는 절차에 따라 사망인의 재산을 처리할 수 있음\n*「노숙인 등의 복지 및 자립지원에 관한 법률」, 「노인복지법」, 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」, 「장애인복지법」에 해당 조문 신설\n상속인이 없는 재산처리 관련 참고\n상속인 없는 재산의 처리방법 등은 「민법」 및 사회복지시설별 소관 법률, 「무연고 사망자 유류금품 처리 간소화 및 법률지원서비스」 지침 참고 ‣ 보건복지부 홈페이지(정보>법인/시설/단체 탭)에서 다운로드 가능 사망한 무연고자의 상속재산이 500만원이 초과하는 경우 상속재산 관리인의 선임 및 재산처리절차를 지원하기 위해 대한변호사협회와 업무협약을 체결해 사회복지시설 무연고 사망자 유류금 신속처리 법률지원단을 운영하고 있음(문의: 대한변호사협회 인권팀(02-3476-4000(내선 10번)) ☞ 상속재산 관리인 선임 및 재산처리절차에 필요한 비용(상담･출장비, 인지･송달료, 보수예납금 등)은 운영비로 지출할 수 있음"}]}, {"title": "7. 사회복지시설에 대한 행정처분(시행규칙 제26조의2 관련)", "start": 53, "end": 59, "html": "<div class=\"pchip\" id=\"p53\"><span>원문 53쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=65\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">7<\/span>사회복지시설에 대한 행정처분(시행규칙 제26조의2 관련)<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">행정처분의 요건<\/div><div class=\"ln p\">시설이 설치기준에 미달될 때<\/div><div class=\"ln p\">사회복지법인 또는 비영리법인이 설치 운영하는 시설의 경우, 그 사회복지법인 또는 비영리법인의 설립허가가 취소된 때<\/div><div class=\"ln p\">설치목적의 달성 기타의 사유로 계속하여 운영될 필요가 없다고 인정될 때<\/div><div class=\"ln p\">회계부정이나 불법행위 기타 부당행위 등이 발견된 때<\/div><div class=\"ln p\">법 제34조제2항에 따른 신고를 하지 아니하고 시설을 설치･운영한 때<\/div><div class=\"ln p\">법 제36조제1항에 따른 운영위원회를 설치 또는 운영하지 아니한 때<\/div><div class=\"ln p\">정당한 이유 없이 법 제51조제1항에 따른 보고 또는 자료제출을 하지 아니하거나 거짓으로 한 때<\/div><div class=\"ln p\">정당한 이유 없이 법 제51조제1항 및 제2항에 따른 검사･질문을 거부･방해하거나 기피한 때<\/div><div class=\"ln p\">시설에서 「성폭력범죄의 처벌 등에 관한 특례법」 제2조제1항제3호부터 제5호까지의 성폭력범죄, 「아동･청소년의 성보호에 관한 법률」 제2조제3호의 아동･청소년대상 성폭력범죄, 「아동복지법」 제3조제7호의2의 아동학대관련범죄, 「노인복지법」 제1조의2제5호의 노인학대관련범죄 및 「장애인복지법」 제2조제4항의 장애인학대 관련범죄가 발생한 때<\/div><div class=\"ln p\">1년 이상 시설이 휴지상태에 있어 시장･군수･구청장이 재개를 권고하였음에도 불구하고 재개하지 아니한 때<\/div><div class=\"pchip\" id=\"p54\"><span>원문 54쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=66\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">행정처분의 주체 및 종류<\/div><div class=\"ln p\">보건복지부장관, 시･도지사, 시장･군수･구청장은 상기 행정처분의 요건에 해당할 경우 시설의 개선, 사업의 정지, 시설의 장의 교체를 명하거나, 시설의 폐쇄를 명할 수 있음<\/div><div class=\"ln p\">‒행정처분 시, 「행정절차법*」에 따라 절차상 하자가 없도록 집행<\/div><div class=\"ln p\">* 처분의 사전 통지, 의견 청취, 처분의 이유 제시, 불복절차의 고지 등 법령 준수<\/div><div class=\"ln p\">‒사회복지사의 자격취소, 사회복지법인의 설립허가 취소, 시설의 폐쇄 처분을 하려면 반드시 청문을 실시해야 함<\/div><div class=\"ln p\">「사회복지사업법」 제40조에 따른 행정처분 통보 대상<\/div><div class=\"ln p\">‒「사회복지사업법」 제40조에 따라 행정처분의 대상이 되는 위반행위는 사회복지시설의 설치･운영에 직접 관련된 사안이고,<\/div><div class=\"ln p\">‒이에 따른 처분명령(시설개선, 사업정지, 시설장 교체, 시설폐쇄)도 해당 시설 설치･운영자만이 스스로 이행할 수 있는 것이므로 해당 시설의 설치･운영자를 그 처분 당사자로 하여 통보하여야 함<\/div><div class=\"ln p\">‒다만, 제36조에 따른 시설운영위원회 관련 사항은 설치의무자인 시설장에게,제51조에 따른 의무 미이행의 경우는 해당 미이행자에게도 함께 통보해야 함<\/div><div class=\"ln p\">「사회복지사업법」 제58조에 따른 과태료 처분 통보 대상(예시)<\/div><div class=\"ln p\">‒과태료 처분 대상이 되는 조문의 수범자(受範者)인 사회복지법인, 시설의 설치･운영자 또는 시설장에 대해서 각각 시행해야 함<\/div><div class=\"pchip\" id=\"p55\"><span>원문 55쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=67\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>과태료 대상 조문<\/td><td>위반사항<\/td><td>수범자(受範者) 및 과태료 대상<\/td><\/tr><tr><td>제11조의4<\/td><td>사회복지사 유사명칭 사용<\/td><td>유사명칭 사용자(구분 없음)<\/td><\/tr><tr><td>제13조제2항 단서<\/td><td>사회복지사 보수교육 미이수<\/td><td>보수교육 미이수 사회복지사<\/td><\/tr><tr><td>제13조제3항<\/td><td>보수교육 이수를 이유로 불리한 처분을 한 경우<\/td><td>사회복지법인 시설 설치･운영자<\/td><\/tr><tr><td>제18조제6항<\/td><td>임원임면보고를 하지 않은 경우<\/td><td>사회복지법인<\/td><\/tr><tr><td>제24조<\/td><td>재산취득보고를 하지 않은 경우<\/td><td>사회복지법인<\/td><\/tr><tr><td>제31조<\/td><td>사회복지법인 명칭 부당사용<\/td><td>명칭을 부당 사용자(구분 없음)<\/td><\/tr><tr><td>제34조의3<\/td><td>책임보험 미가입<\/td><td>시설 운영자(수탁자도 포함)<\/td><\/tr><tr><td>제34조의4<\/td><td>안전점검 미실시<\/td><td>시설장<\/td><\/tr><tr><td>제37조<\/td><td>서류비치 의무 위반<\/td><td>시설장<\/td><\/tr><tr><td>제38조제1항･제2항<\/td><td>시설 운영 미개시 시설 휴지･재개･폐지 미신고<\/td><td>시설 운영자(수탁자도 포함)<\/td><\/tr><tr><td>제45조<\/td><td>후원금 처리 위반<\/td><td>사회복지법인 대표이사 시설장<\/td><\/tr><tr><td>제35조의3제1항･제2항(2019.6.12.시행)<\/td><td>채용 시 준수사항 위반<\/td><td>사회복지법인 시설 설치･운영자<\/td><\/tr><\/table><div class=\"ln p\">‒개인에 대한 과태료는 그 개인이 자기 소유의 금전에서 납부하고, 사회복지법인에 대한 과태료는 해당 법인의 법인회계에서 납부하여야 함*<\/div><div class=\"ln p\">*법인이 과태료를 납부한 경우 과태료 납부에 책임이 있는 자에게 구상권 행사 등 민사상 손해배상 청구가능<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">행정처분의 기준(시행규칙 제26조의2 [별표 4])<\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>1. 일반기준<br>가.위반행위의 횟수에 따른 행정처분의 기준은 최근 3년간(2. 개별기준 제9호의 위반행위의 경우에는 5년간) 같은 위반행위로 행정처분을 받은 경우에 적용한다. 이 경우 기간의 계산은 위반행위에 대하여 행정처분을 받은 날과 그 처분 후 다시 같은 위반행위를 하여 적발된 날을 기준으로 한다.<br>나.가목에 따라 가중된 행정처분을 하는 경우 가중처분의 적용 차수는 그 위반행위 전 행정처분 차수(가목에 따른 기간 내에 행정처분이 둘 이상 있었던 경우에는 높은 차수를 말한다)의 다음 차수로 한다.<br>다.동시에 2종 이상의 위반행위가 있는 경우에는 가장 중한 위반행위에 대한 처분기준을 적용한다.<br>라.위반행위가 4종 이상 또는 시설거주자에 대한 학대･성폭력 등 중대한 불법행위로 인하여 시설의 정상적인 운영이 불가능하다고 인정되는 때에는 제2호의 개별 기준에 불구하고 1차 위반시에 시설의 폐쇄를 명할 수 있다.<br>마.위반행위가 “2. 개별기준”에 의한 시설장 교체 또는 시설폐쇄 명령의 사유에 해당된다 하더라도 그 위반의 정도가 경미하거나 기타 상당한 사유가 있다고 인정되는 경우에는 각각 1회에 한하여 시설장 교체에 갈음하여 개선명령을, 시설폐쇄에 갈음하여 시설장 교체명령을 발할 수 있다. 이 경우 해당 처분은 차수의 산정에 산입하지 아니한다.<\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td>2. 개별기준<br><table class=\"htbl\"><tr><td rowspan=\"2\">위 반 행 위<\/td><td rowspan=\"2\">근거법령<\/td><td colspan=\"3\">행정처분기준<\/td><\/tr><tr><td>1차 위반<\/td><td>2차 위반<\/td><td>3차 위반<br>이상<\/td><\/tr><tr><td>1.사회복지시설이 설치기준에 미달하게 된 때<\/td><td>법 제40조<br>제1항제1호<\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설폐쇄<\/td><\/tr><tr><td>2.사회복지법인 또는 비영리법인이 설치･운영하는 시설의 경우 그 사회복지법인 또는 비영리법인의 설립허가가 취소된 때<\/td><td>법 제40조<br>제1항제2호<\/td><td>시설폐쇄<\/td><td>‒<\/td><td>‒<\/td><\/tr><tr><td>3.설치목적의 달성 기타의 사유로 계속하여 운영될 필요가 없다고 인정할 때<\/td><td>법 제40조<br>제1항제3호<\/td><td>시설폐쇄<\/td><td>‒<\/td><td>‒<\/td><\/tr><tr><td>4.회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 때<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>가.국가나 지방자치단체의 보조금 또는 후원금을 사용용도 외의 용도로 사용한 때<\/td><td>법 제40조<br>제1항제4호<\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설장 교체<\/td><\/tr><tr><td>나.회계장부를 기재하지 아니하거나 허위로 기재한 때<\/td><td>법 제40조<br>제1항제4호<\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설장 교체<\/td><\/tr><tr><td>다.기타 회계 및 시설운영과 관련한 부당행위가 발생된 때<\/td><td>법 제40조<br>제1항제4호<\/td><td>개선명령<\/td><td>개선명령<\/td><td>시설장 교체<\/td><\/tr><tr><td>라.시설 거주자에 대한 부당한 체벌, 폭행, 학대 등 인권침해가 발생한 경우<\/td><td>법 제40조<br>제1항제4호<\/td><td>개선명령<\/td><td>시설장교체<\/td><td>시설폐쇄<\/td><\/tr><tr><td>마.사회복지법인의 대표자･임직원 또는 사회복지시설의 장･종사자가 법 제6조의2제2항에 따른 정보시스템을 통하여 처리되는 정보에 대하여 「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」 제31조 또는 「개인정보 보호법」 제59조를 위반한 경우<\/td><td>법 제40조<br>제1항제4호<\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설장 교체<\/td><\/tr><tr><td>5.법 제34조제2항에 따른 신고를 하지 아니하고 시설을 설치･운영한 때<\/td><td>법 제40조<br>제1항제5호<\/td><td>개선명령<\/td><td>시설폐쇄<\/td><td>‒<\/td><\/tr><tr><td>6.법 제36조제1항에 따른 운영위원회를 설치하지 아니하거나 운영하지 아니하였을 때<\/td><td>법 제40조<br>제1항제6호<\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설장 교체<\/td><\/tr><\/table><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p58\"><span>원문 58쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=70\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><table class=\"htbl\"><tr><td rowspan=\"2\">위 반 행 위<\/td><td rowspan=\"2\">근거법령<\/td><td colspan=\"3\">행정처분기준<\/td><\/tr><tr><td>1차 위반<\/td><td>2차 위반<\/td><td>3차 위반<br>이상<\/td><\/tr><tr><td>7.정당한 이유없이 법 제51조제1항에 따른 보고 또는 자료 제출을 하지 아니하거나 거짓으로 하였을 때<\/td><td>법 제40조<br>제1항제7호<\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설장 교체<\/td><\/tr><tr><td>8.정당한 이유없이 법 제51조제1항 및 제2항에 따른 검사･질문･회계감사를 거부･방해하거나 기피했을 때<\/td><td>법 제40조<br>제1항제8호<\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설장 교체<\/td><\/tr><tr><td>9.시설에서 「성폭력범죄의 처벌 등에 관한 특례법」 제2조제1항제3호부터 제5호까지의 성폭력범죄, 「아동･청소년의 성보호에 관한 법률」 제2조제3호의 아동･청소년 대상 성폭력범죄, 「아동복지법」 제3조제7호의2의 아동학대관련범죄 및 「노인복지법」 제1조의2제5호의 노인학대관련범죄 및 「장애인복지법」제2조제4항의 장애인학대관련범죄(이하 “범죄”라 한다)가 발생한 경우로서 다음 각 목의 어느 하나에 해당하는 경우<\/td><td>법 제40조<br>제1항제9호<\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>가.시설의 장 또는 종사자에 의하여 시설 거주자･이용자에 대한 범죄가 발생한 경우로서 이 호 나목 및 다목에 해당하는 경우를 제외한 경우<\/td><td><\/td><td>시설폐쇄<\/td><td><\/td><td><\/td><\/tr><tr><td>나.시설의 장에 의하여 시설 거주자･이용자에 대한 범죄가 발생한 경우로서 「형법」 제300조 또는 「성폭력범죄의 처벌 등에 관한 특례법」 제11조부터 제15조까지(제15조의 경우 같은 법 제14조에 관련된 부분만 해당한다)의 범죄가 발생한 경우<\/td><td><\/td><td>시설장 교체<\/td><td>시설폐쇄<\/td><td><\/td><\/tr><tr><td>다.종사자에 의하여 시설 거주자･이용자에 대한 범죄가 발생한 경우로서 「형법」 제300조 또는 「성폭력범죄의 처벌 등에 관한 특례법」 제11조부터 제15조까지(제15조의 경우 같은 법 제14조에 관련된 부분만 해당한다)의 범죄가 발생한 경우<\/td><td><\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설폐쇄<\/td><\/tr><\/table><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><table class=\"htbl\"><tr><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><table class=\"htbl\"><tr><td rowspan=\"2\">위 반 행 위<\/td><td rowspan=\"2\">근거법령<\/td><td colspan=\"3\">행정처분기준<\/td><\/tr><tr><td>1차 위반<\/td><td>2차 위반<\/td><td>3차 위반<br>이상<\/td><\/tr><tr><td>라.시설 거주자･이용자 간의 성폭력 범죄가 발생한 경우<\/td><td><\/td><td>개선명령<\/td><td>시설장 교체<\/td><td>시설폐쇄<\/td><\/tr><tr><td>10.1년 이상 시설이 휴지상태에 있어 시장･군수･구청장이 재개를 권고하였음에도 불구하고 재개하지 아니한 경우<\/td><td>법 제40조<br>제1항제10호<\/td><td>개선명령<br>(6개월 내 재개)<\/td><td>시설폐쇄<\/td><td><\/td><\/tr><\/table><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln p\">라<\/div><div class=\"ln p\">시･군･구 추가조치사항<\/div><div class=\"ln p\">보건복지부장관, 시･도지사 또는 시장･군수･구청장이 시설을 폐쇄하고자 할 때에는 시설 설치･운영자 및 시설장 등을 참석시켜 청문을 하여야 함<\/div><div class=\"ln note\">※「행정절차법」상 처분 및 청문(의견청취)절차 참조<\/div><div class=\"ln p\">시장･군수･구청장은 시설의 폐쇄 시 시설거주자의 권익보호 등을 위해 전원조치 등 시설의 휴지, 자진폐지 시와 동일한 조치를 취해야 함<\/div><div class=\"ln note\">※시설폐지 시 시설거주자 권익 보호조치를 기피 또는 거부한 자 및 정당한 이유 없이 시설의 개선, 사업정지, 시설장 교체, 시설폐쇄 명령을 위반할 경우 1년 이하 징역 또는 1천만원 이하의 벌금에 처함(법 제54조)<\/div><div class=\"ln note\">※개별법령에 행정처분의 요건, 기준 등이 규정되어 있을 경우 우선 적용<\/div><div class=\"pchip\" id=\"p59\"><span>원문 59쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=71\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">처분결과의 공표(법 제51조제6항)<\/div><div class=\"ln p\">「사회복지사업법」 제51조에 따라 보건복지부장관 또는 시･도지사 및 시장･ 군수･ 구청장이 지도･감독을 실시하고 제40조에 따른 행정처분 등을 한 경우 해당 관청은 처분 대상인 시설의 명칭, 처분사유, 처분내용 등 처분과 관련된 정보를 공표할 수 있음<\/div><div class=\"ln note\">※「사회복지사업법」 개정(법률 제14923호, 2017.10.24.)에 따라 시행일인 2018.4.25.부터 시장･군수･구청장도 처분과 관련된 정보를 공표할 수 있음<\/div><div class=\"ln p\">공표 사항<\/div><div class=\"ln p\">‒사회복지법인 또는 사회복지시설에 대한 행정처분 결과의 공표라는 내용의 표제<\/div><div class=\"ln p\">‒사회복지법인 또는 사회복지시설의 명칭, 소재지<\/div><div class=\"ln p\">‒처분의 사유와 근거법령<\/div><div class=\"ln p\">‒처분의 내용, 처분일<\/div><div class=\"ln p\">공표 방법：해당 관청의 인터넷 홈페이지(6개월 이내), 신문(필요한 경우)<\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">처분결과의 관리<\/div><div class=\"ln p\">시장, 군수, 구청장은 행정처분을 하는 경우 그 이력을 사회보장정보시스템(행복이음)에 등록하여야 함<\/div>", "pages": [{"p": 53, "t": "7\n사회복지시설에 대한 행정처분(시행규칙 제26조의2 관련)\n가\n행정처분의 요건\n시설이 설치기준에 미달될 때\n사회복지법인 또는 비영리법인이 설치 운영하는 시설의 경우, 그 사회복지법인 또는 비영리법인의 설립허가가 취소된 때\n설치목적의 달성 기타의 사유로 계속하여 운영될 필요가 없다고 인정될 때\n회계부정이나 불법행위 기타 부당행위 등이 발견된 때\n법 제34조제2항에 따른 신고를 하지 아니하고 시설을 설치･운영한 때\n법 제36조제1항에 따른 운영위원회를 설치 또는 운영하지 아니한 때\n정당한 이유 없이 법 제51조제1항에 따른 보고 또는 자료제출을 하지 아니하거나 거짓으로 한 때\n정당한 이유 없이 법 제51조제1항 및 제2항에 따른 검사･질문을 거부･방해하거나 기피한 때\n시설에서 「성폭력범죄의 처벌 등에 관한 특례법」 제2조제1항제3호부터 제5호까지의 성폭력범죄, 「아동･청소년의 성보호에 관한 법률」 제2조제3호의 아동･청소년대상 성폭력범죄, 「아동복지법」 제3조제7호의2의 아동학대관련범죄, 「노인복지법」 제1조의2제5호의 노인학대관련범죄 및 「장애인복지법」 제2조제4항의 장애인학대 관련범죄가 발생한 때\n1년 이상 시설이 휴지상태에 있어 시장･군수･구청장이 재개를 권고하였음에도 불구하고 재개하지 아니한 때"}, {"p": 54, "t": "나\n행정처분의 주체 및 종류\n보건복지부장관, 시･도지사, 시장･군수･구청장은 상기 행정처분의 요건에 해당할 경우 시설의 개선, 사업의 정지, 시설의 장의 교체를 명하거나, 시설의 폐쇄를 명할 수 있음\n‒행정처분 시, 「행정절차법*」에 따라 절차상 하자가 없도록 집행\n* 처분의 사전 통지, 의견 청취, 처분의 이유 제시, 불복절차의 고지 등 법령 준수\n‒사회복지사의 자격취소, 사회복지법인의 설립허가 취소, 시설의 폐쇄 처분을 하려면 반드시 청문을 실시해야 함\n「사회복지사업법」 제40조에 따른 행정처분 통보 대상\n‒「사회복지사업법」 제40조에 따라 행정처분의 대상이 되는 위반행위는 사회복지시설의 설치･운영에 직접 관련된 사안이고,\n‒이에 따른 처분명령(시설개선, 사업정지, 시설장 교체, 시설폐쇄)도 해당 시설 설치･운영자만이 스스로 이행할 수 있는 것이므로 해당 시설의 설치･운영자를 그 처분 당사자로 하여 통보하여야 함\n‒다만, 제36조에 따른 시설운영위원회 관련 사항은 설치의무자인 시설장에게,제51조에 따른 의무 미이행의 경우는 해당 미이행자에게도 함께 통보해야 함\n「사회복지사업법」 제58조에 따른 과태료 처분 통보 대상(예시)\n‒과태료 처분 대상이 되는 조문의 수범자(受範者)인 사회복지법인, 시설의 설치･운영자 또는 시설장에 대해서 각각 시행해야 함"}, {"p": 55, "t": "과태료 대상 조문 | 위반사항 | 수범자(受範者) 및 과태료 대상\n제11조의4 | 사회복지사 유사명칭 사용 | 유사명칭 사용자(구분 없음)\n제13조제2항 단서 | 사회복지사 보수교육 미이수 | 보수교육 미이수 사회복지사\n제13조제3항 | 보수교육 이수를 이유로 불리한 처분을 한 경우 | 사회복지법인 시설 설치･운영자\n제18조제6항 | 임원임면보고를 하지 않은 경우 | 사회복지법인\n제24조 | 재산취득보고를 하지 않은 경우 | 사회복지법인\n제31조 | 사회복지법인 명칭 부당사용 | 명칭을 부당 사용자(구분 없음)\n제34조의3 | 책임보험 미가입 | 시설 운영자(수탁자도 포함)\n제34조의4 | 안전점검 미실시 | 시설장\n제37조 | 서류비치 의무 위반 | 시설장\n제38조제1항･제2항 | 시설 운영 미개시 시설 휴지･재개･폐지 미신고 | 시설 운영자(수탁자도 포함)\n제45조 | 후원금 처리 위반 | 사회복지법인 대표이사 시설장\n제35조의3제1항･제2항(2019.6.12.시행) | 채용 시 준수사항 위반 | 사회복지법인 시설 설치･운영자\n‒개인에 대한 과태료는 그 개인이 자기 소유의 금전에서 납부하고, 사회복지법인에 대한 과태료는 해당 법인의 법인회계에서 납부하여야 함*\n*법인이 과태료를 납부한 경우 과태료 납부에 책임이 있는 자에게 구상권 행사 등 민사상 손해배상 청구가능\n다\n행정처분의 기준(시행규칙 제26조의2 [별표 4])\n |  | \n | 1. 일반기준 가.위반행위의 횟수에 따른 행정처분의 기준은 최근 3년간(2. 개별기준 제9호의 위반행위의 경우에는 5년간) 같은 위반행위로 행정처분을 받은 경우에 적용한다. 이 경우 기간의 계산은 위반행위에 대하여 행정처분을 받은 날과 그 처분 후 다시 같은 위반행위를 하여 적발된 날을 기준으로 한다. 나.가목에 따라 가중된 행정처분을 하는 경우 가중처분의 적용 차수는 그 위반행위 전 행정처분 차수(가목에 따른 기간 내에 행정처분이 둘 이상 있었던 경우에는 높은 차수를 말한다)의 다음 차수로 한다. 다.동시에 2종 이상의 위반행위가 있는 경우에는 가장 중한 위반행위에 대한 처분기준을 적용한다. 라.위반행위가 4종 이상 또는 시설거주자에 대한 학대･성폭력 등 중대한 불법행위로 인하여 시설의 정상적인 운영이 불가능하다고 인정되는 때에는 제2호의 개별 기준에 불구하고 1차 위반시에 시설의 폐쇄를 명할 수 있다. 마.위반행위가 “2. 개별기준”에 의한 시설장 교체 또는 시설폐쇄 명령의 사유에 해당된다 하더라도 그 위반의 정도가 경미하거나 기타 상당한 사유가 있다고 인정되는 경우에는 각각 1회에 한하여 시설장 교체에 갈음하여 개선명령을, 시설폐쇄에 갈음하여 시설장 교체명령을 발할 수 있다. 이 경우 해당 처분은 차수의 산정에 산입하지 아니한다. | \n |  | \n |  | \n | 2. 개별기준 위 반 행 위 | 근거법령 | 행정처분기준\n1차 위반 | 2차 위반 | 3차 위반 이상\n1.사회복지시설이 설치기준에 미달하게 된 때 | 법 제40조 제1항제1호 | 개선명령 | 시설장 교체 | 시설폐쇄\n2.사회복지법인 또는 비영리법인이 설치･운영하는 시설의 경우 그 사회복지법인 또는 비영리법인의 설립허가가 취소된 때 | 법 제40조 제1항제2호 | 시설폐쇄 | ‒ | ‒\n3.설치목적의 달성 기타의 사유로 계속하여 운영될 필요가 없다고 인정할 때 | 법 제40조 제1항제3호 | 시설폐쇄 | ‒ | ‒\n4.회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 때 |  |  |  | \n가.국가나 지방자치단체의 보조금 또는 후원금을 사용용도 외의 용도로 사용한 때 | 법 제40조 제1항제4호 | 개선명령 | 시설장 교체 | 시설장 교체\n나.회계장부를 기재하지 아니하거나 허위로 기재한 때 | 법 제40조 제1항제4호 | 개선명령 | 시설장 교체 | 시설장 교체\n다.기타 회계 및 시설운영과 관련한 부당행위가 발생된 때 | 법 제40조 제1항제4호 | 개선명령 | 개선명령 | 시설장 교체\n라.시설 거주자에 대한 부당한 체벌, 폭행, 학대 등 인권침해가 발생한 경우 | 법 제40조 제1항제4호 | 개선명령 | 시설장교체 | 시설폐쇄\n마.사회복지법인의 대표자･임직원 또는 사회복지시설의 장･종사자가 법 제6조의2제2항에 따른 정보시스템을 통하여 처리되는 정보에 대하여 「사회보장급여의 이용･제공 및 수급권자 발굴에 관한 법률」 제31조 또는 「개인정보 보호법」 제59조를 위반한 경우 | 법 제40조 제1항제4호 | 개선명령 | 시설장 교체 | 시설장 교체\n5.법 제34조제2항에 따른 신고를 하지 아니하고 시설을 설치･운영한 때 | 법 제40조 제1항제5호 | 개선명령 | 시설폐쇄 | ‒\n6.법 제36조제1항에 따른 운영위원회를 설치하지 아니하거나 운영하지 아니하였을 때 | 법 제40조 제1항제6호 | 개선명령 | 시설장 교체 | 시설장 교체 | \n |  | "}, {"p": 58, "t": " |  | \n | 위 반 행 위 | 근거법령 | 행정처분기준\n1차 위반 | 2차 위반 | 3차 위반 이상\n7.정당한 이유없이 법 제51조제1항에 따른 보고 또는 자료 제출을 하지 아니하거나 거짓으로 하였을 때 | 법 제40조 제1항제7호 | 개선명령 | 시설장 교체 | 시설장 교체\n8.정당한 이유없이 법 제51조제1항 및 제2항에 따른 검사･질문･회계감사를 거부･방해하거나 기피했을 때 | 법 제40조 제1항제8호 | 개선명령 | 시설장 교체 | 시설장 교체\n9.시설에서 「성폭력범죄의 처벌 등에 관한 특례법」 제2조제1항제3호부터 제5호까지의 성폭력범죄, 「아동･청소년의 성보호에 관한 법률」 제2조제3호의 아동･청소년 대상 성폭력범죄, 「아동복지법」 제3조제7호의2의 아동학대관련범죄 및 「노인복지법」 제1조의2제5호의 노인학대관련범죄 및 「장애인복지법」제2조제4항의 장애인학대관련범죄(이하 “범죄”라 한다)가 발생한 경우로서 다음 각 목의 어느 하나에 해당하는 경우 | 법 제40조 제1항제9호 |  |  | \n가.시설의 장 또는 종사자에 의하여 시설 거주자･이용자에 대한 범죄가 발생한 경우로서 이 호 나목 및 다목에 해당하는 경우를 제외한 경우 |  | 시설폐쇄 |  | \n나.시설의 장에 의하여 시설 거주자･이용자에 대한 범죄가 발생한 경우로서 「형법」 제300조 또는 「성폭력범죄의 처벌 등에 관한 특례법」 제11조부터 제15조까지(제15조의 경우 같은 법 제14조에 관련된 부분만 해당한다)의 범죄가 발생한 경우 |  | 시설장 교체 | 시설폐쇄 | \n다.종사자에 의하여 시설 거주자･이용자에 대한 범죄가 발생한 경우로서 「형법」 제300조 또는 「성폭력범죄의 처벌 등에 관한 특례법」 제11조부터 제15조까지(제15조의 경우 같은 법 제14조에 관련된 부분만 해당한다)의 범죄가 발생한 경우 |  | 개선명령 | 시설장 교체 | 시설폐쇄 | \n |  | \n |  | \n | 위 반 행 위 | 근거법령 | 행정처분기준\n1차 위반 | 2차 위반 | 3차 위반 이상\n라.시설 거주자･이용자 간의 성폭력 범죄가 발생한 경우 |  | 개선명령 | 시설장 교체 | 시설폐쇄\n10.1년 이상 시설이 휴지상태에 있어 시장･군수･구청장이 재개를 권고하였음에도 불구하고 재개하지 아니한 경우 | 법 제40조 제1항제10호 | 개선명령 (6개월 내 재개) | 시설폐쇄 |  | \n |  | \n라\n시･군･구 추가조치사항\n보건복지부장관, 시･도지사 또는 시장･군수･구청장이 시설을 폐쇄하고자 할 때에는 시설 설치･운영자 및 시설장 등을 참석시켜 청문을 하여야 함\n※「행정절차법」상 처분 및 청문(의견청취)절차 참조\n시장･군수･구청장은 시설의 폐쇄 시 시설거주자의 권익보호 등을 위해 전원조치 등 시설의 휴지, 자진폐지 시와 동일한 조치를 취해야 함\n※시설폐지 시 시설거주자 권익 보호조치를 기피 또는 거부한 자 및 정당한 이유 없이 시설의 개선, 사업정지, 시설장 교체, 시설폐쇄 명령을 위반할 경우 1년 이하 징역 또는 1천만원 이하의 벌금에 처함(법 제54조)\n※개별법령에 행정처분의 요건, 기준 등이 규정되어 있을 경우 우선 적용"}, {"p": 59, "t": "마\n처분결과의 공표(법 제51조제6항)\n「사회복지사업법」 제51조에 따라 보건복지부장관 또는 시･도지사 및 시장･ 군수･ 구청장이 지도･감독을 실시하고 제40조에 따른 행정처분 등을 한 경우 해당 관청은 처분 대상인 시설의 명칭, 처분사유, 처분내용 등 처분과 관련된 정보를 공표할 수 있음\n※「사회복지사업법」 개정(법률 제14923호, 2017.10.24.)에 따라 시행일인 2018.4.25.부터 시장･군수･구청장도 처분과 관련된 정보를 공표할 수 있음\n공표 사항\n‒사회복지법인 또는 사회복지시설에 대한 행정처분 결과의 공표라는 내용의 표제\n‒사회복지법인 또는 사회복지시설의 명칭, 소재지\n‒처분의 사유와 근거법령\n‒처분의 내용, 처분일\n공표 방법：해당 관청의 인터넷 홈페이지(6개월 이내), 신문(필요한 경우)\n바\n처분결과의 관리\n시장, 군수, 구청장은 행정처분을 하는 경우 그 이력을 사회보장정보시스템(행복이음)에 등록하여야 함"}]}, {"title": "8. 사회복지시설 지도·감독", "start": 60, "end": 64, "html": "<div class=\"pchip\" id=\"p60\"><span>원문 60쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=72\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">8<\/span>사회복지시설 지도･감독<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회복지시설에 대한 지도･감독 내실화<\/div><div class=\"ln p\">국가청렴위원회 권고사항(ʼ06.12월)으로 각 지자체의 정기감사 또는 수시점검 시 반영토록 할 것<\/div><div class=\"ln p\">‒비리 취약분야 지도･점검 강화<\/div><div class=\"ln p\">•회계(보조금, 후원금, 수익사업), 계약(공사, 구매), 자산관리(부동산, 장비 등) 등 취약업무와 사회서비스정보시스템(희망이음) 및 별도 전산시스템의 회계, 후원, 시군구 보고 등 활용도를 점검 항목으로 설정<\/div><div class=\"ln p\">‒합동점검반 편성･운영<\/div><div class=\"ln p\">•시설공사, 설비구축 등 전문성이 필요한 분야와 회계, 계약 등 비리행위 관련 점검 시에는 특성을 감안, 관련부서와 감사부서 관계자를 포함하는 등 합동 점검을 실시<\/div><div class=\"ln p\">국민권익위원회 권고(ʼ10.4월) 사항을 반영하여 지도･점검의 실효성을 강화할 것<\/div><div class=\"ln p\">‒‘시민명예감사관’을 구성하여 시설 점검 시 합동점검 실시<\/div><div class=\"ln p\">‒점검분야별로 구체적 매뉴얼을 마련하고 시설장･직원 등의 위반행위에 대한 처벌 등 교육 실시<\/div><div class=\"ln note\">※시･도별로 시･군･구 담당자와 상의, 구체적 점검매뉴얼 및 체크 리스트 마련<\/div><div class=\"ln p\">‒분기별 정산보고 시 시설 현금출납부 등을, 결산보고 시 법인 감사보고서를 제출받아 지도･점검 시 상세자료로 활용<\/div><div class=\"ln p\">‒회계분야 전문성을 감안하여 감사담당 부서에서 시설 결산보고서 회계검사 실시<\/div><div class=\"ln p\">‒시설 재정운영에 심각한 문제가 있거나 전문가 검사가 필요하다고 판단되는 경우 추가 외부회계검사 의뢰<\/div><div class=\"ln note\">※<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">보조금 수령 및 집행내역, 후원금 접수 및 사용현황 등<\/div><div class=\"ln p\">‒회계검사 결과를 해당시설 보조금 지급, 재위탁 심사 시 반영<\/div><div class=\"ln note\">※<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">우수시설 인센티브 제공, 미흡시설 보조금 삭감 등 평가결과 반영<\/div><div class=\"pchip\" id=\"p61\"><span>원문 61쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=73\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">공무원의 사회복지법인･시설 재취업 공무원과 사적 접촉 방지 법령 신설 안내 (2021 국민권익위 사회복지지설 위탁운영 제도개선 권고반영)<\/div><div class=\"ln p\">공직자의 이해충돌방지법<\/div><div class=\"ln p\">제15조(퇴직자 사적 접촉 신고) ① 공직자는 직무관련자인 소속 기관의 퇴직자(공직자가 아니게 된 날부터 2년이 지나지 아니한 사람만 해당한다)와 사적 접촉(골프, 여행, 사행성 오락을 같이 하는 행위를 말한다)을 하는 경우 소속기관장에게 신고하여야 한다. 다만, 사회상규에 따라 허용되는 경우에는 그러하지 아니하다. (2022.5.19.시행)<\/div><div class=\"ln p\">감사 및 지도감독<\/div><table class=\"htbl\"><tr><td>종 류<\/td><td>대상<\/td><td>주      기<\/td><td>실시기관<\/td><\/tr><tr><td rowspan=\"2\">∙정기지도감독<br>‑조직운영 전반<br>‑회계감사<\/td><td>법인<\/td><td>최소 매 3년마다 1회<\/td><td rowspan=\"2\">시･도지사(위임기관) 또는 시･군･구청장<\/td><\/tr><tr><td>시설<\/td><td>연 1회 이상<\/td><\/tr><tr><td>∙수시 지도점검<\/td><td>시설<\/td><td>필요시(입퇴소 실태, 생활실태)<\/td><td>시･군･구청장<\/td><\/tr><tr><td>∙특별지도감독<\/td><td>법인<br>시설<\/td><td>진정, 투서, 언론보도, 비리발생, 인권침해, 행정처분이나 지적사항 미이행 등 주무관청이 지도감독 필요성이 있다고 판단한 경우<\/td><td>보건복지부장관<br>시･도지사<br>시･군･구청장<\/td><\/tr><\/table><div class=\"ln note\">※ 시･도지사 또는 시･군･구청장은 정기지도감독, 수시 지도점검, 특별지도감독 등 감사 및 지도감독 결과를 사회보장정보시스템(행복이음)에 입력･관리<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">미신고시설 상시 관리･감독<\/div><div class=\"ln p\">1)업무체계<\/div><div class=\"ln p\">보건복지부 각 시설 담당부서와 시･도 및 시･군･구의 시설담당 부서는 미신고시설과 관련한 상시관리 및 보고체계 유지<\/div><div class=\"ln p\">‒시･도 및 시･군･구 시설담당부서에서는 기초생활보장 담당부서 등 관련부서와 공조체계를 구축할 것<\/div><div class=\"ln note\">※「미신고시설 양성화 정책」 추진과정에서 조사된 미신고시설은 법정신고시설로 전환하도록 최대한 독려하고 고의적으로 거부 또는 회피하는 시설은 관련 법에 따라 행정조치<\/div><div class=\"pchip\" id=\"p62\"><span>원문 62쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=74\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2)기초생활보장수급자 DB 검색을 통한 미신고시설 조사<\/div><div class=\"ln p\">조사방법<\/div><div class=\"ln p\">‒보장기관(시･군･구)은 기초생활보장수급자 확인조사 시 중점 관리대상가구에 아래의 경우를 포함하여 정기･수시조사에 포함하여 감독강화할 것<\/div><div class=\"ln p\">중점 관리대상가구<\/div><div class=\"ln p\">해당 지자체 시설담당부서에서 관리하는 미신고시설 복지행정시스템상 기초생활보장 수급자의 주소지 검색하여, 동일 주소지에 동일 보장가구원이 아닌 자가 5인* 이상 거주하는 가구 *주민들의 제보나 여러 정황으로 조사가 필요한 가구에 대하여는 5인 미만 가구라 하더라도 중점 관리대상가구에 포함하여 관리할 것<\/div><div class=\"ln p\">조사결과 조치사항<\/div><div class=\"ln p\">‒(기초생활보장 담당자) 동일 보장가구원이 아닌 자가 5인 이상 함께 거주하는 것을 발견 시, 해당 지자체 시설담당 공무원에게 통보<\/div><div class=\"ln p\">‒(시설담당자) 해당 지자체 시설담당 공무원은 현장확인후 미신고시설 등 불법 시설일 경우, 수급자에게 불법시설임을 고지하고, 보장시설 안내 및 입소를 유도하되, 단, 자립생활이 가능한 경우에는 자립지원 관련 서비스 등을 적극 연계<\/div><div class=\"ln p\">‒(행정처분 등) 미신고불법시설에 대하여 폐쇄조치(법 제40조제1항제5호)를 명할 수 있으며, 신고를 하지 아니하고 시설을 설치･운영한 자는 1년 이하의 징역 또는 1천만 원 이하의 벌금 부과대상임(법 제54조제3호)<\/div><div class=\"ln p\">3)공공조직을 통한 후원 또는 지원 시 신고시설 여부 확인<\/div><div class=\"ln p\">시･군･구, 공동모금회 등 공공적인 조직을 통한 후원･지원 시 다수인이 거주하는 시설의 경우 신고 여부를 확인<\/div><div class=\"ln p\">‒확인 결과 미신고시설인 경우 후원, 지원 일체 금지 및 행정처분 실시<\/div><div class=\"pchip\" id=\"p63\"><span>원문 63쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=75\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>참고: 사회복지시설 담당 관련 교육 안내<\/td><\/tr><tr><td>※ ’24년도 교육일정은 교육기관에서 추후 안내 예정<br>한국보건복지인재원<br><table class=\"htbl\"><tr><td>구분<\/td><td colspan=\"2\">교육대상<\/td><td>교육과정명<\/td><td>교육내용<\/td><\/tr><tr><td rowspan=\"6\">집합<\/td><td rowspan=\"2\">지자체<br>담당공무원<br>(6~9급)<\/td><td>2년차 이하 신규자<\/td><td>사회복지법인 및 시설관리기본과정<\/td><td>정책 방향 및 관련 법제<br>관련 종사자 운영 실태 사례<br>재무회계규칙 이해 및 적용<\/td><\/tr><tr><td>2년차 이상 경력자<\/td><td>사회복지법인 및 시설관리심화과정<\/td><td>정책 방향 및 관련 법제<br>이사회 관리 및 시설 재산 관리<br>재무관리 및 회계시스템 이해<br>현지조사점검 및 관리<\/td><\/tr><tr><td rowspan=\"2\">사회복지<br>법인및시설<br>종사자<\/td><td>회계업무<br>담당자<\/td><td>사회복지법인 및 시설재정관리과정<\/td><td>재무회계규칙<br>세입세출관리<br>후원금관리 등<\/td><\/tr><tr><td>안전업무<br>담당자<\/td><td>사회복지시설<br>안전관리심화과정<\/td><td>사회복지시설 위기상황 행동 요령<br>사회복지시설 안전관리 이해<br>실제활동 등 안전 업무 전반<\/td><\/tr><tr><td colspan=\"2\" rowspan=\"2\">사회복지시설 종사자 및 담당공무원<\/td><td>사회복지시설종사자<br>디지털역량강화기본과정<\/td><td>디지털 사회복지 기술 필요성 및 동향<br>디지털 사회복지 실천사례<\/td><\/tr><tr><td>사회복지시설종사자<br>디지털역량강화심화과정<\/td><td>디지털 운용 기술 접목<br>디지털 사회복지 실천 역량 강화<\/td><\/tr><tr><td rowspan=\"4\">이러닝<\/td><td colspan=\"2\" rowspan=\"4\">공통<\/td><td>
