<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 사회복지시설 관리안내 대시보드</title>
<meta name="description" content="보건복지부 「2026 사회복지시설 관리안내」 원문 기반 · 전체 7개 장 273쪽 · 본문·표는 한글(HWPX) 원본에서 추출">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#12867c; --accent-deep:#0a5c56; --accent-soft:#e6f4f2; --accent-line:#b8ded9;
  --ink:#1d2823; --ink-2:#4c5a53; --ink-3:#7b897f;
  --bg:#f4f7f5; --card:#ffffff; --line:#dde5df;
  --chg:#b45309; --chg-soft:#fdf3e3;
  --mark:#ffe9a8;
  --fs:17px; --fs-pre:13.5px;
  --radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR",-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;
  font-size:var(--fs); line-height:1.65;
}
body.hc{
  --accent:#ffd400; --accent-deep:#ffd400; --accent-soft:#1a1a1a; --accent-line:#666;
  --ink:#ffffff; --ink-2:#f0f0f0; --ink-3:#cccccc;
  --bg:#000000; --card:#0d0d0d; --line:#555;
  --chg:#ffbf47; --chg-soft:#1f1503;
  --mark:#8a6d00;
}
body.hc a{color:#ffd400}
a{color:var(--accent-deep)}
button{font-family:inherit}

header{
  background:linear-gradient(135deg,var(--accent-deep),var(--accent));
  color:#fff; padding:26px 20px 20px;
}
body.hc header{background:#000;border-bottom:3px solid #ffd400;color:#fff}
.hwrap{max-width:1180px;margin:0 auto}
.htop{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between}
.htitle h1{margin:0;font-size:1.5em;font-weight:900;letter-spacing:-.01em}
.htitle .sub{margin-top:4px;font-size:.82em;opacity:.92}
.hctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hbtn{
  background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.55);color:#fff;
  border-radius:9px;padding:7px 13px;font-size:.85em;font-weight:700;cursor:pointer;
}
.hbtn:hover{background:rgba(255,255,255,.3)}
body.hc .hbtn{background:#000;border-color:#ffd400;color:#ffd400}
.searchrow{max-width:1180px;margin:18px auto 0;display:flex;gap:10px}
#q{
  flex:1;padding:13px 18px;border-radius:12px;border:none;font-size:1em;
  font-family:inherit;box-shadow:0 3px 14px rgba(0,0,0,.18);
}
body.hc #q{border:2px solid #ffd400;background:#111;color:#fff}
#qbtn{border:none;border-radius:12px;padding:0 26px;font-weight:900;font-size:1em;cursor:pointer;background:#fff;color:var(--accent-deep)}
body.hc #qbtn{background:#ffd400;color:#000}

nav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px}
.tab{
  border:none;background:none;padding:14px 18px;font-size:.95em;font-weight:700;color:var(--ink-2);
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
}
.tab.on{color:var(--accent-deep);border-bottom-color:var(--accent)}
body.hc .tab.on{color:#ffd400;border-bottom-color:#ffd400}

main{max-width:1180px;margin:0 auto;padding:26px 16px 70px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.stat .n{font-size:1.7em;font-weight:900;color:var(--accent-deep);line-height:1.2}
.stat .l{font-size:.8em;color:var(--ink-2);margin-top:2px}

.h2{font-size:1.15em;font-weight:900;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--accent)}
.h2 .cnt{font-size:.75em;font-weight:700;color:var(--ink-3)}

.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.hl{
  background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chg);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s;
}
.hl:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.hl .t{font-weight:700;font-size:.95em}
.hl .d{font-size:.82em;color:var(--ink-2);margin-top:5px}
.hl .p{font-size:.75em;color:var(--chg);font-weight:700;margin-top:7px}

.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.chcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;cursor:pointer;transition:transform .12s,box-shadow .15s;position:relative;overflow:hidden;
}
.chcard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.14)}
.chcard .no{
  display:inline-block;background:var(--accent-soft);color:var(--accent-deep);
  font-weight:900;font-size:.75em;border-radius:7px;padding:3px 10px;
}
body.hc .chcard .no{background:#000;border:1px solid #ffd400;color:#ffd400}
.chcard h3{margin:10px 0 4px;font-size:1.06em;font-weight:900;letter-spacing:-.01em}
.chcard .pg{font-size:.76em;color:var(--ink-3);font-weight:600}
.chcard ul{margin:10px 0 0;padding:0;list-style:none;font-size:.8em;color:var(--ink-2)}
.chcard li{padding:2.5px 0;border-top:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chcard li:first-child{border-top:none}

.chgtable{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:.9em}
.chgtable th{background:var(--accent-soft);color:var(--accent-deep);text-align:left;padding:11px 14px;font-size:.85em}
body.hc .chgtable th{background:#1a1a1a;color:#ffd400}
.chgtable td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.chgtable .code{font-weight:900;color:var(--chg);white-space:nowrap}
.chgtable .nm{font-weight:700}
.gobtn{
  display:inline-block;border:1.5px solid var(--accent-line);background:var(--accent-soft);
  color:var(--accent-deep);border-radius:8px;padding:3px 10px;font-size:.82em;font-weight:700;
  cursor:pointer;margin:2px 4px 2px 0;text-decoration:none;
}
body.hc .gobtn{background:#000;color:#ffd400;border-color:#ffd400}
.notice{
  background:var(--chg-soft);border:1px solid #ecd9b0;border-radius:12px;
  padding:13px 17px;font-size:.86em;color:var(--ink-2);margin:14px 0 22px;
}
body.hc .notice{border-color:#ffbf47}

.reader{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.side{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px;position:sticky;top:64px;max-height:calc(100vh - 90px);overflow-y:auto;
}
.side .chh{
  width:100%;text-align:left;border:none;background:none;padding:10px 10px;font-weight:900;
  font-size:.93em;color:var(--ink);cursor:pointer;border-radius:9px;display:flex;justify-content:space-between;gap:6px;
}
.side .chh:hover{background:var(--accent-soft)}
.side .chh .ar{color:var(--ink-3);font-weight:400}
.side .secs{padding-left:6px}
.side .sec{
  width:100%;text-align:left;border:none;background:none;padding:7px 10px;font-size:.84em;
  color:var(--ink-2);cursor:pointer;border-radius:8px;display:block;line-height:1.4;
}
.side .sec:hover{background:var(--accent-soft)}
.side .sec.on{background:var(--accent);color:#fff;font-weight:700}
body.hc .side .sec.on{background:#ffd400;color:#000}
.side .sub{padding-left:26px;font-size:.8em}
.content{min-width:0}
.crumb{font-size:.82em;color:var(--ink-3);margin-bottom:6px}
.content h2.title{margin:0 0 4px;font-size:1.3em;font-weight:900;letter-spacing:-.01em}
.content .range{font-size:.83em;color:var(--ink-2);margin-bottom:16px}
.pageblock{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.pagehead{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--accent-soft);padding:6px 14px;font-size:.78em;font-weight:900;color:var(--accent-deep);
}
body.hc .pagehead{background:#1a1a1a;color:#ffd400}
.pdflink{
  margin-left:10px;font-weight:700;font-size:.95em;color:var(--accent-deep);
  text-decoration:none;border-bottom:1.5px solid var(--accent-line);
}
.pdflink:hover{border-bottom-color:var(--accent-deep)}
body.hc .pdflink{color:#ffd400;border-bottom-color:#ffd400}
.pageblock pre{
  margin:6px 0;padding:12px 14px;white-space:pre;overflow-x:auto;
  font-family:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  font-size:var(--fs-pre);line-height:1.62;color:var(--ink);
  background:color-mix(in srgb,var(--bg) 55%,var(--card));border-radius:8px;
}
.pagebody{padding:14px 18px}
.ln{line-height:1.72;margin:1px 0;padding-left:calc(var(--ind,0)*.52em);word-break:keep-all;overflow-wrap:break-word}
.ln.h1{
  font-size:1.16em;font-weight:900;color:var(--accent-deep);margin:16px 0 10px;
  background:var(--accent-soft);border-radius:10px;padding:9px 14px;
}
body.hc .ln.h1{background:#1a1a1a;color:#ffd400}
.ln.h2{font-size:1.07em;font-weight:900;margin:16px 0 6px;padding-left:0}
.badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:1.55em;height:1.55em;border-radius:50%;background:var(--accent);
  color:#fff;font-size:.82em;font-weight:900;margin-right:.45em;vertical-align:.05em;
}
body.hc .badge{background:#ffd400;color:#000}
.ln.h3{font-weight:800;margin:11px 0 3px}
.ln.h4{font-weight:700;margin:7px 0 2px}
.ln.b1{margin-top:6px}
.ln.note{
  color:var(--ink-2);font-size:.88em;background:var(--chg-soft);
  border-radius:8px;padding:5px 10px;margin:5px 0;
}
.gap{height:.5em}

/* ── 하이브리드(HWPX) 모드: 진짜 표·쪽 칩 ── */
.htbl{border-collapse:collapse;margin:10px 0;font-size:.9em;width:100%;line-height:1.55}
.htbl td{border:1px solid var(--line);padding:6px 10px;vertical-align:top;word-break:keep-all}
.htbl tr:first-child td{background:var(--accent-soft);font-weight:700;color:var(--accent-deep)}
body.hc .htbl tr:first-child td{background:#1a1a1a;color:#ffd400}
.tblwrap{overflow-x:auto}
.pchip{
  display:flex;align-items:center;gap:10px;margin:20px 0 10px;
  font-size:.76em;font-weight:900;color:var(--accent-deep);
}
.pchip::before,.pchip::after{content:"";height:1px;background:var(--line);flex:0 0 24px}
.pchip::after{flex:1}
.pchip .approx{font-weight:400;color:var(--ink-3)}
body.hc .pchip{color:#ffd400}
mark{background:var(--mark);border-radius:3px;padding:0 2px}
body.hc mark{color:#fff}
.secnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.secnav button{
  border:1.5px solid var(--accent-line);background:var(--card);color:var(--accent-deep);
  border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:.9em;max-width:48%;
}
.secnav button:hover{background:var(--accent-soft)}
body.hc .secnav button{color:#ffd400;border-color:#ffd400}

.sr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 17px;margin-bottom:11px;cursor:pointer}
.sr:hover{box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sr .loc{font-size:.78em;font-weight:900;color:var(--accent-deep)}
.sr .snip{font-size:.87em;color:var(--ink-2);margin-top:5px;line-height:1.6}
.rescount{font-size:.9em;color:var(--ink-2);margin:4px 0 16px}

footer{border-top:1px solid var(--line);background:var(--card);padding:22px 16px 34px;margin-top:30px}
.fwrap{max-width:1180px;margin:0 auto;font-size:.8em;color:var(--ink-3);line-height:1.8}

@media(max-width:840px){
  .reader{grid-template-columns:1fr}
  .side{position:static;max-height:260px}
  .htitle h1{font-size:1.2em}
}
@media print{header,nav,.side,.secnav,footer{display:none}}
</style>
</head>

"ln p\">‒「사회복지사업법」은 사회복지사업에 관한 기본법으로 「노인복지법」, 「아동복지법」 등 개별 법령에 별도의 규정이 있을 경우 개별 법령 우선 적용<\/div><div class=\"ln p\">사회복지시설 인정 기준<\/div><div class=\"ln p\">「사회복지사업법」 제2조제1호에 규정된 개별법령*에 의한 “보호･선도 또는 복지에 관한 사업”과 “사회복지상담･직업지원･무료 숙박･지역사회복지･의료복지･재가복지･사회복지관 운영･정신질환자 및 한센병력자 사회복귀에 관한 사업” 등 각종 복지사업과 이와 관련된 “자원봉사활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업”을 말함 ① 「국민기초생활보장법」 ② 「아동복지법」 ③ 「노인복지법」 ④ 「장애인복지법」 ⑤ 「한부모가족지원법」 ⑥ 「영유아보육법」 ⑦ 「성매매방지 및 피해자보호 등에 관한 법률」 ⑧ 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 ⑨ 「성폭력 방지 및 피해자 보호 등에 관한 법률」 ⑩ 「입양특례법」 ⑪ 「일제하 일본군위안부 피해자에 대한 생활안정지원 및 기념사업 등에 관한 법률」 ⑫ 「사회복지공동모금회법」 ⑬ 「장애인･노인･임산부 등의 편의증진보장에 관한 법률」 ⑭ 「가정폭력방지 및 피해자보호 등에 관한 법률」 ⑮ 「농어촌주민의 보건복지증진을 위한 특별법」  「식품등 기부 활성화에 관한 법률」  「의료급여법」  「기초연금법」  「긴급복지지원법」  「다문화가족지원법」  「장애인연금법」  「장애인활동 지원에 관한 법률」  「노숙인 등의 복지 및 자립지원에 관한 법률」  「보호관찰 등에 관한 법률」  「장애아동복지지원법」  「발달장애인 권리보장 및 지원에 관한 법률」  「청소년복지 지원법」  「스토킹방지 및 피해자보호 등에 관한 법률」, (29) 그 밖의 대통령령으로 정하는 법률 *「건강가정기본법」, 「노인 일자리 및 사회활동 지원에 관한 법률」, 북한이탈주민의 보호 및 정착지원에 관한 법률」, 「자살예방 및 생명존중문화 조성을 위한 법률」, 「장애인･노인 등을 위한 보조기기 지원 및 활용촉진에 관한 법률」, 「치매관리법」<\/div><div class=\"pchip\" id=\"p3\"><span>원문 3쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=15\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">적용대상 사회복지시설<\/div><div class=\"ln p\">사회복지시설 여부는 시설운영자가 주관적으로 판단하는 것이 아니라 실질적으로 사회복지사업을 행하는지에 따라 판단<\/div><div class=\"ln p\">사회복지시설의 범위(미신고시설 판단 기준)<\/div><div class=\"ln p\">*시설 운영자가 사회복지사업을 목적으로 하지 않는다고 주장하더라도 아래의 경우는 시설명칭, 운영주체에 상관없이 사회복지시설로 분류(특히 생활시설의 경우 미신고시설 관리대책과 관련하여 다음 내용을 참고할 것) ㉠「사회복지사업법」 제2조의 개별법상 요보호대상자 중 거주 또는 종교 등을 선택할 수 있는 의사능력이 없거나 부족한 자를 보호하는 경우(가족의 의뢰에 의한 경우에도 해당) 〔대표적인 예〕 ‒「장애인복지법」의 지적장애인, 정신장애인, 발달장애인, 뇌병변장애인 등 ‒「노인복지법」의 치매노인, 자신의 의사를 표출할 수 없는 중증노인 등 ‒「아동복지법」의 요보호아동 전체 ‒ 「정신건강복지법」의 정신질환자 ㉡시설이 주장하는 목적(종교활동 등)과 달리 사회복지 개별법상 요보호대상자가 본인 또는 가족의 보호요청에 의해 동 시설에서 거주하고 있는 경우 ※생활자 본인의 의사와 관계없는 시설장의 일방적인 종교목적 주장은 수용 곤란 ㉢ 사회복지시설임을 외부에 표방하여 운영하는 경우 ‒외부 간판, 소식지, 홍보, 외부활동 등을 통해 사회복지시설임을 명시하거나 표방하는 경우 ‒ 거주 및 보호를 목적으로 생활인을 모집하는 경우 ‒ 보호하고 있는 생활인을 근거로 후원금품을 모집하는 경우 ➩ 동 기준에 따라 사회복지시설로 분류되는 경우 개별 법률에 따른 시설 신고･인가 등이 필요한 대상임 ‒ 신고･인가 등 없이 운영할 경우 벌칙이 적용됨을 유의<\/div>", "pages": [{"p": 2, "t": "사회복지시설 공통적용사항9 1. 사회복지시설 설치관련 참고사항10 2. 사회복지시설 운영관련 참고사항19 3. 사회복지시설 종사자 관리40 4. 사회복지시설 인건비 보조금 지급기준50 5. 사회복지시설 휴지･재개･자진폐지(법 제38조 관련)51 6. 상속인이 없는 재산처리(법 제45조의2 관련)54 7. 사회복지시설에 대한 행정처분(시행규칙 제26조의2 관련)55 8. 사회복지시설 지도･감독62 9. 사회복지시설 평가67 10. 사회복무제도72 11. 사회복지시설장 등의 실종아동등 발견 시 신고 및 신상카드 제출 의무81\n | \n | 사회복지시설 업무의 전자화 시책92 1. 사회복지시설 업무의 전자화93 2. 사회서비스정보시스템(희망이음)의 활용96 3. 사회복지시설 온라인 보고100 4. 기타사항113\n사회복지시설의 안전관리122 1. 보험가입여부 확인123 2. 시설안전점검 실시125 3. 안전관리 인력 확보129 4. 안전관리 교육･훈련130 5. 건축물 및 소방관계 법령 준수 여부 확인131 6. 재난･안전 관련 주체별 주요 임무132\n사회복지법인 및 사회복지시설 재무･회계규칙134 1. 총 칙135 2. 예 산138 3. 결 산146 4. 회 계148 5. 물 품151 6. 후원금의 관리152 7. 감사의 실시162 [붙임] 사회복지법인 및 사회복지시설 재무･회계규칙163\n부 록239 1. ○○시설 운영위원회 운영규정(안) (예시)240 [별표 1] 시설운영위원회 회의록(예시)243 [별표 2] 시설운영위원회 정책건의사항(예시)244 2. 사회복지시설 위탁 운영기준(안) (예시)245 [별표 1] 위탁 심의자료의 구성(예시)248 [별표 2] 수탁자 선정 심의기준 및 배점(예시)249 3. 사회복지시설 인건비 보조금 지급기준 참조사항(가이드라인)250\n사회복지시설 종사자 인건비 가이드라인263 1. 법적 근거264 2. 적용 대상265 3. 적용 원칙266 4. 기타 사항267 5. 2026년도 사회복지시설 종사자 보수 체계269\n1. 사회복지시설의 정의 등\n2. 사회복지시설의 종류\n사회복지시설 현황\n1\n사회복지시설의 정의 등\n가\n사회복지시설의 법률상 정의\n사회복지시설이란 법 제2조에 따른 “사회복지사업”을 할 목적으로 설치된 시설을 의미함\n‒「사회복지사업법」은 사회복지사업에 관한 기본법으로 「노인복지법」, 「아동복지법」 등 개별 법령에 별도의 규정이 있을 경우 개별 법령 우선 적용\n사회복지시설 인정 기준\n「사회복지사업법」 제2조제1호에 규정된 개별법령*에 의한 “보호･선도 또는 복지에 관한 사업”과 “사회복지상담･직업지원･무료 숙박･지역사회복지･의료복지･재가복지･사회복지관 운영･정신질환자 및 한센병력자 사회복귀에 관한 사업” 등 각종 복지사업과 이와 관련된 “자원봉사활동 및 복지시설의 운영 또는 지원을 목적으로 하는 사업”을 말함 ① 「국민기초생활보장법」 ② 「아동복지법」 ③ 「노인복지법」 ④ 「장애인복지법」 ⑤ 「한부모가족지원법」 ⑥ 「영유아보육법」 ⑦ 「성매매방지 및 피해자보호 등에 관한 법률」 ⑧ 「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」 ⑨ 「성폭력 방지 및 피해자 보호 등에 관한 법률」 ⑩ 「입양특례법」 ⑪ 「일제하 일본군위안부 피해자에 대한 생활안정지원 및 기념사업 등에 관한 법률」 ⑫ 「사회복지공동모금회법」 ⑬ 「장애인･노인･임산부 등의 편의증진보장에 관한 법률」 ⑭ 「가정폭력방지 및 피해자보호 등에 관한 법률」 ⑮ 「농어촌주민의 보건복지증진을 위한 특별법」  「식품등 기부 활성화에 관한 법률」  「의료급여법」  「기초연금법」  「긴급복지지원법」  「다문화가족지원법」  「장애인연금법」  「장애인활동 지원에 관한 법률」  「노숙인 등의 복지 및 자립지원에 관한 법률」  「보호관찰 등에 관한 법률」  「장애아동복지지원법」  「발달장애인 권리보장 및 지원에 관한 법률」  「청소년복지 지원법」  「스토킹방지 및 피해자보호 등에 관한 법률」, (29) 그 밖의 대통령령으로 정하는 법률 *「건강가정기본법」, 「노인 일자리 및 사회활동 지원에 관한 법률」, 북한이탈주민의 보호 및 정착지원에 관한 법률」, 「자살예방 및 생명존중문화 조성을 위한 법률」, 「장애인･노인 등을 위한 보조기기 지원 및 활용촉진에 관한 법률」, 「치매관리법」"}, {"p": 3, "t": "나\n적용대상 사회복지시설\n사회복지시설 여부는 시설운영자가 주관적으로 판단하는 것이 아니라 실질적으로 사회복지사업을 행하는지에 따라 판단\n사회복지시설의 범위(미신고시설 판단 기준)\n*시설 운영자가 사회복지사업을 목적으로 하지 않는다고 주장하더라도 아래의 경우는 시설명칭, 운영주체에 상관없이 사회복지시설로 분류(특히 생활시설의 경우 미신고시설 관리대책과 관련하여 다음 내용을 참고할 것) ㉠「사회복지사업법」 제2조의 개별법상 요보호대상자 중 거주 또는 종교 등을 선택할 수 있는 의사능력이 없거나 부족한 자를 보호하는 경우(가족의 의뢰에 의한 경우에도 해당) 〔대표적인 예〕 ‒「장애인복지법」의 지적장애인, 정신장애인, 발달장애인, 뇌병변장애인 등 ‒「노인복지법」의 치매노인, 자신의 의사를 표출할 수 없는 중증노인 등 ‒「아동복지법」의 요보호아동 전체 ‒ 「정신건강복지법」의 정신질환자 ㉡시설이 주장하는 목적(종교활동 등)과 달리 사회복지 개별법상 요보호대상자가 본인 또는 가족의 보호요청에 의해 동 시설에서 거주하고 있는 경우 ※생활자 본인의 의사와 관계없는 시설장의 일방적인 종교목적 주장은 수용 곤란 ㉢ 사회복지시설임을 외부에 표방하여 운영하는 경우 ‒외부 간판, 소식지, 홍보, 외부활동 등을 통해 사회복지시설임을 명시하거나 표방하는 경우 ‒ 거주 및 보호를 목적으로 생활인을 모집하는 경우 ‒ 보호하고 있는 생활인을 근거로 후원금품을 모집하는 경우 ➩ 동 기준에 따라 사회복지시설로 분류되는 경우 개별 법률에 따른 시설 신고･인가 등이 필요한 대상임 ‒ 신고･인가 등 없이 운영할 경우 벌칙이 적용됨을 유의"}]}, {"title": "2. 사회복지시설의 종류", "start": 4, "end": 8, "html": "<div class=\"pchip\" id=\"p4\"><span>원문 4쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=16\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회복지시설의 종류<\/div><table class=\"htbl\"><tr><td rowspan=\"2\">소관<br>부처<\/td><td rowspan=\"2\">시설종류<\/td><td colspan=\"2\">세부종류<\/td><td rowspan=\"2\">관련법<\/td><\/tr><tr><td>생활시설<\/td><td>이용시설<\/td><\/tr><tr><td rowspan=\"11\">보건<br>복지부<\/td><td>노인복지시설<\/td><td>◦노인주거복지시설<br>◦노인의료복지시설<br>◦학대피해노인전용쉼터<\/td><td>◦재가노인복지시설<br>◦노인여가복지시설<br>◦노인보호전문기관<br>◦노인일자리지원기관<\/td><td>「노인복지법」<\/td><\/tr><tr><td>복합노인복지시설<\/td><td colspan=\"2\">◦농어촌에 지역에 한해 「노인복지법」 제31조 노인 복지시설을 종합적으로 배치한 복합노인복지시설을 설치･운영 가능<\/td><td>「농어촌주민의 보건복지<br>증진을 위한 특별법」<\/td><\/tr><tr><td>아동복지시설<\/td><td>◦아동양육시설< 역주민 | 이용 | ◦사회복지관 | 지역복지과 | 「사회복지사업법」\n청년 | 이용 | ◦청년미래센터 | 청년정책팀 | ｢가족돌봄 등 위기아동ㆍ청년 지원에 관한 법률｣\n기타시설 | 이용 | ◦지역자활센터 | 자활정책과 | 「국민기초생활보장법\n◦기부식품등지원센터 | 사회서비스자원과 | ｢식품등 기부 활성화에 관한 법률｣"}]}]}, {"no": 2, "title": "사회복지시설 공통적용사항", "start": 9, "end": 86, "sections": [{"title": "1. 사회복지시설 설치관련 참고사항", "start": 10, "end": 18, "html": "<div class=\"pchip\" id=\"p10\"><span>원문 10쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=22\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1. 사회복지시설 설치관련 참고사항<\/div><div class=\"ln p\">2. 사회복지시설 운영관련 참고사항<\/div><div class=\"ln p\">3. 사회복지시설 종사자 관리<\/div><div class=\"ln p\">4. 사회복지시설 인건비 보조금 지급기준<\/div><div class=\"ln p\">5. 사회복지시설 휴지･재개･자진폐지(법 제38조 관련)<\/div><div class=\"ln p\">6. 상속인이 없는 재산처리(법 제45조의2 관련)<\/div><div class=\"ln p\">7. 사회복지시설에 대한 행정처분(시행규칙 제26조의2 관련)<\/div><div class=\"ln p\">8. 사회복지시설 지도･감독<\/div><div class=\"ln p\">9. 사회복지시설 평가<\/div><div class=\"ln p\">10. 사회복무제도<\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>11. 사회복지시설장 등의 실종아동등 발견 시 신고 및 신상카드 제출 의무<\/div><div class=\"ln p\">사회복지시설 설치관련 참고사항<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회복지시설 신고제도<\/div><div class=\"ln p\">1)국가 또는 지방자치단체 외의 자가 시설을 설치･운영하고자 하는 때에는 시장･군수･구청장에게 신고하여야 함(법 제34조)<\/div><table class=\"htbl\"><tr><td>신고하지 않고 사회복지시설을 설치･운영할 경우<\/td><\/tr><tr><td>1년 이하 징역 또는 1천만 원 이하 벌금(법 제54조제3호)에 과하는 조항을 엄격하게 적용하고 해당 시설은 폐쇄 조치하여 미신고 사회복지시설이 발생하지 않도록 관심 요망<\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"ln p\">2)시･군･구 담당자는 각 개별법령의 신고기준을 참고하여 신고 가능 여부를 확인하되, 중증 장애인시설, 치매노인시설 등의 경우 시설설비 및 종사자 요건을 엄격하게 적용하여 시설생활자의 인권 및 안전에 만전을 기할 것<\/div><div class=\"ln note\">※미신고시설복지시설로서 신고하지 않고 요보호 대상자를 수용･보호하는 불법시설로 행정처분 및 형사처벌 대상<\/div><div class=\"ln h4\">3) 개별법령에 허가 및 지정 등을 요구하는 경우 개별법령이 우선 적용<\/div><div class=\"ln p\">완화된 개인운영신고시설 운영기준 적용 종료 안내<\/div><div class=\"ln p\">「미신고시설 양성화 정책」에 따라 ʼ05.8.1.~ʼ09.12.31.까지 완화된 신고요건을 적용(시･군･구 신고)한 시설이며, 개별 시설지침에 별도의 명시가 있는 경우를 제외하고는 원칙적으로 ʼ09. 12. 31.자로 개인운영신고 시설의 완화된 기준 적용이 종료되었으므로 동 기한 종료 이후로는 사회복지시설 설치 및 운영기준과 동일하게 적용해야 함<\/div><div class=\"pchip\" id=\"p11\"><span>원문 11쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=23\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설 인정 기준<\/div><div class=\"ln p\">｢사회복지사업법｣ 상 해당 사업의 근거 규정 필요 - ｢사회복지사업법｣의 사회복지사업 정의(제2조제1호 각 목)에 해당되는 법률이 시설 운영 사업의 근거 규정이 되어야 함 해당 시설이 운영하는 사업이 복지사업의 성격에 부합해야 함 * 단순 기념, 교육, 문화사업 등 취약 계층 보호･지원과 거리가 있는 사업은 배제 필요 해당 시설의 설치, 운영에 대해 개별 법령상 근거 필요 * 법령에 근거 없는 시설을 부처 지침 등으로 설치할 경우 인정이 어려우며 사회복지시설 인정시 보조금 지급 등 소관 부처의 예산 확보 계획도 필요 시설 운영시 사회복지사업법에 따른 의무사항 준수 필요 * 기 운영 중인 시설은 사회복지시설로 전환시 운영자의 동의 필요 시설 설치 근거법령 등에 설치·운영의 인적·물적 기준 규정 필요<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">사회복지시설 설치 가능한 자<\/div><div class=\"ln p\">국가 또는 지방자치단체, 사회복지법인 또는 비영리법인, 개인 등은 결격사유가 없는 한 누구나 사회복지시설을 설치･운영할 수 있음<\/div><div class=\"ln p\">-결격사항 및 자격기준 등은 「사회복지사업법」 및 시설 근거 법령의 관련규정 등을 확인할 것<\/div><div class=\"ln note\">※결격사유 예) 「사회복지사업법」 제34조의 규정에 의해 제40조에 따라 폐쇄명령을 받고 3년이 경과되지 아니한 자, 제19조제1항제1호 및 제1호의2부터 제1호의8까지의 어느 하나에 해당하는 개인 또는 그 개인이 임원인 법인<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">신고접수시 구비서류(시행규칙 제20조 참조)<\/div><div class=\"ln p\">법인의 정관 1부(법인에 한함)<\/div><div class=\"ln p\">‒법인 정관에 사회복지시설 운영과 관련된 목적사업이 있을 경우에 신고를 접수하고, 관련 조항이 없을 경우 지체 없이 상당기간을 정하여 정관변경 등 보완을 요구하고, 기간 내에 보완하지 않을 경우 반려(「행정절차법」 제40조 참조)<\/div><div class=\"pchip\" id=\"p12\"><span>원문 12쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=24\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">시설운영에 필요한 재산목록<\/div><div class=\"ln p\">‒운영하고자 하는 시설규모와 비교하여 시설운영이 현실적으로 가능한지 여부를 판단 하고 부적합 판단 시, 시설생활자 수를 적정수준으로 유지하여 신고하도록 지도<\/div><div class=\"ln p\">사업계획서 1부<\/div><div class=\"ln p\">‒실질적인 사회복지사업이 이루어지도록 사업계획의 구체적 기입유도<\/div><div class=\"ln p\">예산서 1부<\/div><div class=\"ln p\">‒수입과 지출에 관한 세부내역을 받되, 「사회복지법인 및 사회복지시설 재무･회계규칙」 제10조제3항의 별표1~별표10을 참고하여 작성<\/div><div class=\"ln p\">시설의 평면도 및 건물의 배치도 등<\/div><div class=\"ln note\">※시장･군수･구청장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항 증명서(법인인 경우만 해당)･건물 등기부 등본 및 토지 등기부 등본 확인<\/div><div class=\"ln p\">☞ (공통) 개별 법령에 구비서류에 관하여 규정되어 있을 경우 해당 법령이 우선함<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">사회복지시설 신고증 발급번호 체계화<\/div><div class=\"ln p\">시설 소재지, 시설종류, 신고연월일, 동일일자(시설종류별) 신고순을 인식할 수 있도록 번호 부여<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">경기과천‒장애인‒20060715‒01<\/div><div class=\"ln p\">이미 신고한 시설(법인시설 포함)에 대해서도 위 기준에 따라 일괄적으로 신고번호를 재부여하고 필요 시 신고증을 재교부<\/div><div class=\"ln p\">시설은 시설 내부에 사회복지시설 신고증을 게시하도록 하고, 시설 외부 간판에도 신고증 번호를 표방함으로써 합법적으로 신고된 시설인지 여부를 일반 국민 누구나 쉽게 확인할 수 있도록 조치 권고<\/div><div class=\"ln p\">‒다만, 여성폭력관련시설(성폭력, 가정폭력, 성매매) 및 아동복지시설 중 「아동복지법」 제53조의2에 따라 학대피해아동쉼터로 지정된 공동생활가정의 경우 피해자 보호 및 2차 피해방지를 위하여 외부게시 대상에서 제외하며, 그 외 시설의 경우 공개를 통해 얻는 공익과 침해되는 사익을 비교 형량하여 해당시설 생활자의 보호 실익이 신고증 번호 공개를 통해 얻는 공익보다 크다고 판단되는 경우 해당 시설유형의 지침 등을 통하여 예외로 할 수 있음<\/div><div class=\"pchip\" id=\"p13\"><span>원문 13쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=25\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln note\">※국가나 지방자치단체가 설치･운영하는 사회복지시설은 법 제34조에 따른 신고 의무대상에서 제외되므로, 국공립시설(위탁시설 포함)임을 알리는 안내문을 게시할 것을 권고함<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">사회복지시설 고유번호증 또는 사업자등록증 별도 발급<\/div><div class=\"ln p\">사회복지시설을 설치･운영하거나 국공립 사회복지시설을 위탁 받아 운영할 경우 「부가가치세법」, 「법인세법」 등 관련 법령에 따라 각 시설별로 별도의 고유번호증 또는 사업자등록증을 발급받도록 할 것<\/div><div class=\"ln note\">※법인이 설치･운영(수탁 포함)하는 시설의 경우 “법인명(단체명)”에 법인명칭을 기재하거나 법인명칭과 시설명칭을 병기하는 형태 등으로 고유번호증(사업자등록증) 발급을 세무관서에 신청할 수 있음(권고사항)<\/div><div class=\"ln p\">고유번호증 또는 사업자등록증 신청 및 발급 절차에 대해서는 국세청(☎ 126) 또는 관할 세무서에 문의바람<\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">사회복지시설 민간위탁(시행규칙 제21조, 제21조의2 참조)<\/div><div class=\"ln p\">위탁대상시설：국가 또는 지방자치단체가 설치한 시설(국가･지자체 외의 자(법인･개인 등)가 설치한 시설은 위･수탁 불가)<\/div><div class=\"ln note\">※국･공립 시설과 달리 법령상 위･수탁 근거가 없음에 유의<\/div><div class=\"ln p\">수탁자의 자격：사회복지법인 또는 비영리법인<\/div><div class=\"ln note\">※시설운영의 안정성, 영속성, 공공성 등 차원에서 사회복지법인 또는 비영리법인에 그 자격을 제한하고 있으나, 개별 법령에 기타 단체 및 개인에게 위탁할 수 있는 근거 규정이 있을 경우(「영유아보육법」 제24조 등 개별 법령에 법인이외 개인도 위탁이 가능한 경우 등 시설별 특성이 있으므로 위탁 시 해당 개별 법령을 반드시 숙지할 것)에는 그에 따름<\/div><div class=\"ln note\">※사회적협동조합은 「협동조합 기본법」 제4조제2항에서 비영리법인임을 명시하고 있는바 수탁대상에서 제외하지 않도록 유의(2017 사회적경제 활성화 방안 관련 기획재정부 요청사항)<\/div><div class=\"pchip\" id=\"p14\"><span>원문 14쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=26\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">위탁방법 및 선정기준<\/div><div class=\"ln p\">‒위탁방법：법령상 특별한 규정이 있는 경우를 제외하고는 반드시 공개모집에 의해 수탁자를 선정<\/div><div class=\"ln note\">※공개모집 결과 신청법인이 없거나 수탁자 선정심의위원회 심의결과에 따라 수탁자를 선정하지 않을 경우, 다시 공개모집 절차를 진행하되, 이에 대한 세부기준은 반드시 지자체 조례로 규정할 것(필요 시 공개모집 관련 일반 사항은 「지방자치단체의 계약에 관한 법률」 준용 가능) (2021 국민권익위 사회복지시설 위탁운영 제도개선 권고 반영)<\/div><div class=\"ln p\">‒선정기준의 설정<\/div><div class=\"ln note\">※수탁자 선정심의 및 배점기준은 조례 또는 공고문을 통해 선정 전에 공개하여야 함 (2021 국민권익위 사회복지시설 위탁운영 제도개선 권고 반영)<\/div><div class=\"ln p\">•선정주체：위탁기관의 장(※ 선정기준은 수탁자선정심의위원회의 의결을 받을 것)<\/div><div class=\"ln p\">•선정기준에 포함되어야 할 사항<\/div><div class=\"ln p\">➝필수사항：수탁자의 재정능력, 공신력, 사업수행능력, 지역 간 균형분포, 시설에 대한 평가결과(평가한 경우에 한함), 법인의 정관(수탁하고자하는 시설과 관련된 사업내용이 포함되어있는지 여부)<\/div><div class=\"ln p\">➝임의사항：그 외 위탁기관의 장이 필요하다고 인정하는 사항<\/div><div class=\"ln p\">위탁계약 체결시 필수 포함사항 (「사회복지사업법 시행규칙 제21조의2」 참고)<\/div><div class=\"ln p\">제21조의2(시설의 위탁) ①국가나 지방자치단체는 법 제34조제5항에 따라 시설을 위탁하여 운영하고자 하는 때에는 다음 각 호의 내용이 포함된 계약을 체결해야 한다. 1. 수탁자의 명칭, 주소 및 대표자의 이름 2. 위탁계약기간 3. 위탁대상시설 및 업무내용 4. 수탁자의 의무 및 준수 사항 5. 시설의 안전관리에 관한 사항 5의2. 시설종사자의 고용승계에 관한 사항 6. 계약의 해지에 관한 사항 7. 기타 시설의 운영에 필요하다고 인정되는 사항 ※ 임원의 자격(결격사유 등) 확인 필요, 시설 위･수탁시 종사자 고용승계가 원칙임<\/div><div class=\"ln note\">※수탁신청법인이 수탁신청일 기준으로 최근 3년간 「사회복지사업법」, 사회복지사업 근거 법률 (「사회복지사업법」 제2조제1호 각 목의 법률)에 따른 행정처분(시설장 교체 또는 업무(사업) 정지 이상)이나 벌칙을 받은 경우 수탁 심사 시 반영할 것(2017 사회적경제 활성화 방안 관련 기획재정부 요청사항)<\/div><div class=\"pchip\" id=\"p15\"><span>원문 15쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=27\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">수탁자선정심의위원회의 구성<\/div><div class=\"ln p\">‒공개모집한 수탁자는 반드시 심의위원회를 구성하여 선정할 것<\/div><div class=\"ln note\">※수탁자선정심의위원회의 심의･의결은 서면이 아닌 실제 출석을 통해 실시할 것(단, 참여자를 확인할 수 있는 경우 원격영상회의와 같은 전자적 방법을 활용하여 심의 가능)<\/div><div class=\"ln p\">☞ 다음의 요건을 모두 충족하는 경우, 원격영상회의와 같은 전자적 방법을 활용하여 심의 가능<\/div><div class=\"ln p\">① 수탁자선정심의위원회 출석을 요하는 사람들이 동시에 모두 참여할 수 있는 방식이어야 함<\/div><div class=\"ln p\">② 참여자가 누구인지 확인할 수 있어야 함(수탁자선정심의위원회 위원임을 확인)<\/div><div class=\"ln p\">③ 일방적인 의사전달이 아닌 참여자 상호 간 의견교환이 가능하여야 함<\/div><div class=\"ln p\">‒위원의 구성<\/div><div class=\"ln p\">•위탁기관의 장이 임명 또는 위촉한 9인 이내의 위원(위원장 1인 포함)<\/div><div class=\"ln p\">*위원장은 위탁기관의 장이 위원 중 1인을 지명<\/div><div class=\"ln p\">‒위원의 자격은 시행규칙 제21조제4항1호부터 제4호까지를 참고하되, 가능한 한 민간위원을 과반수 이상으로 할 것<\/div><div class=\"ln p\">‒위원회 운영에 관하여 필요한 사항은 법령을 벗어나지 않는 범위 내에서 위탁기관의 장이 정하여 운영할 것<\/div><div class=\"ln p\">위탁계약의 체결 및 갱신 등<\/div><div class=\"ln p\">‒계약의 체결：위탁 시에는 시행규칙 제21조의2 제1항 제1호부터 제7호까지의 사항*을 포함한 계약서를 체결해야 함<\/div><div class=\"ln p\">*수탁자의 명칭, 주소 및 대표자의 이름, 위탁계약기간, 위탁대상시설 및 업무내용, 수탁자의 의무 및 준수 사항(수탁자 선정 심의 시 심의내용 및 이행계획을 포함할 것), 시설의 안전관리에 관한 사항, 시설종사자의 고용승계에 관한 사항, 계약의 해지에 관한 사항, 기타 시설의 운영에 필요하다고 인정되는 사항(2021 국민권익위 사회복지시설 위탁운영 제도개선 권고 반영)<\/div><div class=\"ln p\">‒계약기간：5년으로 함<\/div><div class=\"ln p\">위탁계약 체결시 주의사항<\/div><div class=\"ln p\">법 제34조제2항 각 호의 어느 하나에 해당되어 시설의 설치･운영 신고를 할 수 없는 자와는 위탁계약을 체결하지 말 것 시행규칙 제21조의2제1항제6호에 따른 계약해지에 관한 사항 작성 시 다음의 사항을 포함할 것 ① 수탁자가 시행규칙 제21조의2제3항 각 호의 어느 하나에 해당될 때 위탁계약이 해지됨 ②수탁자가 법 제34조제2항 각 호의 어느 하나에 해당될 때 위탁계약이 해지됨(단, 수탁 받은 법인이 「사회복지사업법」 제19조제1항에 해당하는 임원을 지체없이 교체한 경우는 예외로 한다) ③ 위탁계약기간 중에 시설에서 위법･부당한 행위가 발생한 경우 계약 해지 가능<\/div><div class=\"pchip\" id=\"p16\"><span>원문 16쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=28\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">‒지방자치단체는 관계법령의 규정을 벗어나지 않는 범위 내에서 사회복지시설 위탁심사 세부기준을 조례 등 자치법규에 규정(국민권익위원회 권고사항*, ʼ10.4.) 하여야 하며, 위탁계약 체결 시 시행규칙 제21조의2(시설의 위탁)에서 정하는 내용을 포함하여야 함<\/div><div class=\"ln p\">*국민권익위원회 등의 권고사항(ʼ10.4.)은 보건복지부 사회서비스자원과‒2700(ʼ10.10.4)호 문서로 안내함<\/div><div class=\"ln p\">‒다만, 수탁신청법인으로 하여금 과도한 재정부담을 요구하는 경우에는 여타 수탁에 필요한 역량(전문성 등)을 갖추고 있을 경우에도 불구하고 그 요구되는 재정을 부담할 수 없어 수탁자로 선정되지 못하는 사례가 발생할 수 있으므로, 재정부담 능력과 타 심사기준을 합리적으로 형량하여 수탁자를 선정할 것<\/div><div class=\"ln note\">※기본적으로 비영리법인(사회복지법인 포함)은 영리를 목적으로 하지 아니하므로 과도한 재정을 부담하기 어려운 현실을 고려해 과도한 법인전입금을 별도로 요구하지 않도록 권고<\/div><div class=\"ln p\">‒계약기간이 종료된 경우 원칙적으로 재공모하되, 위탁자가 필요하다고 인정하는 경우 선정위원회의 심의를 거쳐 계약기간 갱신 가능<\/div><div class=\"ln note\">※ 갱신된 계약기간도 5년으로 권장<\/div><div class=\"ln p\">‒2016년 8월 4일 이전에 체결된 위탁계약의 경우 그 계약기간은 종전의 규정에 따라 해당 위탁계약에서 정한 기간으로 함<\/div><div class=\"ln p\">‒지자체에서 조례 등으로 위탁 계약기간을 정한 경우 반드시 시행규칙 제21조의2 제2항의 개정 규정에 위반되지 않도록 관련 사항을 정비할 것<\/div><div class=\"ln p\">실적 등 확인 관련 유의사항<\/div><div class=\"ln p\">사회복지시설 수탁자 선정에 있어 신청자에게 ‘종전의 지도･감독사항과 관련된 이력’ 및 ‘운영실적’ 등을 제출토록 하는 것은 해당 신청자가 시설 위탁운영에 적정한지 여부를 객관적이고 공정하게 심사하기 위한 기본자료로 활용하기 위함임 ‒따라서 수탁자 모집공고 시 공고일 현재 확인 가능하거나 확정된 지도감독결과 및 운영실적 등의 자료가 누락되는 일이 없도록 해당 실적자료 등의 기간 선정에 있어 적정을 기하기 바람 ʼ12년 12월 ○○군이 위탁공고를 하면서 비리나 운영실적 등 자료작성 대상기간을 ʼ12년 해당 연도를 제외하고 그 이전의 3개년(ʼ09~ʼ11년)에 대해서만 심사한 결과, ʼ12년에 시설운영 부실로 지적받은 기관이 수탁자로 선정되어 공정성 논란 발생<\/div><div class=\"pchip\" id=\"p17\"><span>원문 17쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=29\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사<\/div><div class=\"ln p\">사회복지시설 민간위탁 공개모집 예외(시행규칙 제21조 단서)<\/div><div class=\"ln h4\">1) 사회복지사업법 시행규칙 개정(ʼ20.1.3. 공포, 시행) 사유<\/div><div class=\"ln p\">종전에는 국가나 지방자치단체가 설치한 사회복지시설을 위탁하여 운영하려는 경우 예외 없이 공개모집의 방법으로 위탁받을 법인을 선정하였으나, 앞으로는 국가나 지방자치단체가 사회복지사업을 할 목적으로 직접 설립한 비영리법인에 위탁하려는 경우에는 공개모집을 하지 않을 수 있도록 하여 사회복지시설 운영에 있어서의 공공성을 높이려는 것임<\/div><div class=\"ln p\">시행규칙 제21조(시설의 위탁기준 및 방법) ① 법 제34조제5항에 따라 국가 또는 지방자치단체가 설치한 시설을 위탁하여 운영하려는 경우에는 공개모집에 따라 수탁하는 법인(이하 “수탁자”라 한다)을 선정해야 한다. 다만, 국가 또는 지방자치단체가 사회복지사업을 할 목적으로 설립한 비영리법인에 위탁하여 운영하려는 경우로서 보건복지부장관이 정하는 경우에는 공개모집을 하지 않을 수 있다.<\/div><div class=\"ln h4\">2) 사회복지사업법 시행규칙 제21조제1항의 보건복지부장관이 정하는 경우라 함은 다음 3가지 요건 및 절차를 필요로 함<\/div><div class=\"ln p\">수탁자의 자격: 국가 또는 지방자치단체가 사회복지사업을 할 목적으로 설립한 비영리법인으로서<\/div><div class=\"ln p\">①“국･공립 사회복지시설 수탁 운영” 등 수탁받을 수 있는 근거가 정관상 목적사업으로 규정되어 있고, 수탁 운영에 필요한 전담인력, 조직, 예산 등을 갖추어야 함<\/div><div class=\"ln p\">②기초 지방자치단체가 설립한 비영리법인은 수탁 운영에 필요한 사항을 갖추어 광역 지방자치단체와 협의하여야 함<\/div><div class=\"ln note\">※수탁자 제한 사유: 공개모집을 통해 사회복지시설을 수탁받아 운영할 수 있는 민간기관과의 형평성을 고려하여 수탁자를 광역지방자치단체에서 설립한 법인으로 한정. 다만, 기초지방자치단체에서 설립한 법인이 우선 위탁받을 경우에는 광역지방자치단체와 협의하도록 함<\/div><div class=\"ln p\">공개모집 예외 사유<\/div><div class=\"ln p\">①신규* 국･공립 사회복지시설<\/div><div class=\"ln p\">*사회복지사업법 시행규칙 개정 시행일(ʼ20.1.3.)이후 설치되는 국･공립시설<\/div><div class=\"ln p\">②「사회복지사업법」 제43조의2에 따른 시설평가 및 관계 법령에 따른 시설평가 결과, 2회 연속으로 최하위 등급을 받은 시설<\/div><div class=\"pchip\" id=\"p18\"><span>원문 18쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=30\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">③시설 거주자에 대한 인권침해 및 성폭력범죄 등 중대한 불법행위*가 발생하여 기존 수탁자와 위탁계약 유지(계약 갱신 포함)가 어렵다고 판단되는 시설<\/div><div class=\"ln p\">*「사회복지사업법」 시행규칙 제26조의2에 따른 별표4 행정처분의 기준에 따라 시설거주자에 대한 부당한 체벌, 폭행, 학대 등 인권침해가 발생한 경우(2. 개별기준 4.라) 및 시설에서 성폭력 범죄가 발생한 경우(2. 개별기준 9.)<\/div><div class=\"ln p\">④취약지 소재 시설 등 공익적 이유로 우선 위탁이 필요하다고 판단되는 시설<\/div><div class=\"ln note\">※  공개모집 예외 사유 적용 시, 위 수탁자의 자격 요건 충족이 전제되어야 함<\/div><div class=\"ln p\">공개모집 예외 절차<\/div><div class=\"ln p\">①국･공립 사회복지시설을 우선 위탁하고자 하는 경우에는 사전에 수탁법인을 설립한 지방자치단체 및 수탁 법인과 협의를 거쳐야 함<\/div><div class=\"ln p\">②공개모집 예외의 경우에도 시설의 수탁자 선정은 「사회복지사업법」 시행규칙 제21조제2항에 따라 “수탁자선정심의위원회” 심의를 거쳐야 함<\/div>", "pages": [{"p": 10, "t": "1. 사회복지시설 설치관련 참고사항\n2. 사회복지시설 운영관련 참고사항\n3. 사회복지시설 종사자 관리\n4. 사회복지시설 인건비 보조금 지급기준\n5. 사회복지시설 휴지･재개･자진폐지(법 제38조 관련)\n6. 상속인이 없는 재산처리(법 제45조의2 관련)\n7. 사회복지시설에 대한 행정처분(시행규칙 제26조의2 관련)\n8. 사회복지시설 지도･감독\n9. 사회복지시설 평가\n10. 사회복무제도\n11. 사회복지시설장 등의 실종아동등 발견 시 신고 및 신상카드 제출 의무\n1\n사회복지시설 설치관련 참고사항\n가\n사회복지시설 신고제도\n1)국가 또는 지방자치단체 외의 자가 시설을 설치･운영하고자 하는 때에는 시장･군수･구청장에게 신고하여야 함(법 제34조)\n신고하지 않고 사회복지시설을 설치･운영할 경우\n1년 이하 징역 또는 1천만 원 이하 벌금(법 제54조제3호)에 과하는 조항을 엄격하게 적용하고 해당 시설은 폐쇄 조치하여 미신고 사회복지시설이 발생하지 않도록 관심 요망\n\n2)시･군･구 담당자는 각 개별법령의 신고기준을 참고하여 신고 가능 여부를 확인하되, 중증 장애인시설, 치매노인시설 등의 경우 시설설비 및 종사자 요건을 엄격하게 적용하여 시설생활자의 인권 및 안전에 만전을 기할 것\n※미신고시설복지시설로서 신고하지 않고 요보호 대상자를 수용･보호하는 불법시설로 행정처분 및 형사처벌 대상\n3) 개별법령에 허가 및 지정 등을 요구하는 경우 개별법령이 우선 적용\n완화된 개인운영신고시설 운영기준 적용 종료 안내\n「미신고시설 양성화 정책」에 따라 ʼ05.8.1.~ʼ09.12.31.까지 완화된 신고요건을 적용(시･군･구 신고)한 시설이며, 개별 시설지침에 별도의 명시가 있는 경우를 제외하고는 원칙적으로 ʼ09. 12. 31.자로 개인운영신고 시설의 완화된 기준 적용이 종료되었으므로 동 기한 종료 이후로는 사회복지시설 설치 및 운영기준과 동일하게 적용해야 함"}, {"p": 11, "t": "사회복지시설 인정 기준\n｢사회복지사업법｣ 상 해당 사업의 근거 규정 필요 - ｢사회복지사업법｣의 사회복지사업 정의(제2조제1호 각 목)에 해당되는 법률이 시설 운영 사업의 근거 규정이 되어야 함 해당 시설이 운영하는 사업이 복지사업의 성격에 부합해야 함 * 단순 기념, 교육, 문화사업 등 취약 계층 보호･지원과 거리가 있는 사업은 배제 필요 해당 시설의 설치, 운영에 대해 개별 법령상 근거 필요 * 법령에 근거 없는 시설을 부처 지침 등으로 설치할 경우 인정이 어려우며 사회복지시설 인정시 보조금 지급 등 소관 부처의 예산 확보 계획도 필요 시설 운영시 사회복지사업법에 따른 의무사항 준수 필요 * 기 운영 중인 시설은 사회복지시설로 전환시 운영자의 동의 필요 시설 설치 근거법령 등에 설치·운영의 인적·물적 기준 규정 필요\n나\n사회복지시설 설치 가능한 자\n국가 또는 지방자치단체, 사회복지법인 또는 비영리법인, 개인 등은 결격사유가 없는 한 누구나 사회복지시설을 설치･운영할 수 있음\n-결격사항 및 자격기준 등은 「사회복지사업법」 및 시설 근거 법령의 관련규정 등을 확인할 것\n※결격사유 예) 「사회복지사업법」 제34조의 규정에 의해 제40조에 따라 폐쇄명령을 받고 3년이 경과되지 아니한 자, 제19조제1항제1호 및 제1호의2부터 제1호의8까지의 어느 하나에 해당하는 개인 또는 그 개인이 임원인 법인\n다\n신고접수시 구비서류(시행규칙 제20조 참조)\n법인의 정관 1부(법인에 한함)\n‒법인 정관에 사회복지시설 운영과 관련된 목적사업이 있을 경우에 신고를 접수하고, 관련 조항이 없을 경우 지체 없이 상당기간을 정하여 정관변경 등 보완을 요구하고, 기간 내에 보완하지 않을 경우 반려(「행정절차법」 제40조 참조)"}, {"p": 12, "t": "시설운영에 필요한 재산목록\n‒운영하고자 하는 시설규모와 비교하여 시설운영이 현실적으로 가능한지 여부를 판단 하고 부적합 판단 시, 시설생활자 수를 적정수준으로 유지하여 신고하도록 지도\n사업계획서 1부\n‒실질적인 사회복지사업이 이루어지도록 사업계획의 구체적 기입유도\n예산서 1부\n‒수입과 지출에 관한 세부내역을 받되, 「사회복지법인 및 사회복지시설 재무･회계규칙」 제10조제3항의 별표1~별표10을 참고하여 작성\n시설의 평면도 및 건물의 배치도 등\n※시장･군수･구청장은 「전자정부법」 제36조제1항에 따른 행정정보의 공동이용을 통하여 법인 등기사항 증명서(법인인 경우만 해당)･건물 등기부 등본 및 토지 등기부 등본 확인\n☞ (공통) 개별 법령에 구비서류에 관하여 규정되어 있을 경우 해당 법령이 우선함\n라\n사회복지시설 신고증 발급번호 체계화\n시설 소재지, 시설종류, 신고연월일, 동일일자(시설종류별) 신고순을 인식할 수 있도록 번호 부여\n예시\n경기과천‒장애인‒20060715‒01\n이미 신고한 시설(법인시설 포함)에 대해서도 위 기준에 따라 일괄적으로 신고번호를 재부여하고 필요 시 신고증을 재교부\n시설은 시설 내부에 사회복지시설 신고증을 게시하도록 하고, 시설 외부 간판에도 신고증 번호를 표방함으로써 합법적으로 신고된 시설인지 여부를 일반 국민 누구나 쉽게 확인할 수 있도록 조치 권고\n‒다만, 여성폭력관련시설(성폭력, 가정폭력, 성매매) 및 아동복지시설 중 「아동복지법」 제53조의2에 따라 학대피해아동쉼터로 지정된 공동생활가정의 경우 피해자 보호 및 2차 피해방지를 위하여 외부게시 대상에서 제외하며, 그 외 시설의 경우 공개를 통해 얻는 공익과 침해되는 사익을 비교 형량하여 해당시설 생활자의 보호 실익이 신고증 번호 공개를 통해 얻는 공익보다 크다고 판단되는 경우 해당 시설유형의 지침 등을 통하여 예외로 할 수 있음"}, {"p": 13, "t": "※국가나 지방자치단체가 설치･운영하는 사회복지시설은 법 제34조에 따른 신고 의무대상에서 제외되므로, 국공립시설(위탁시설 포함)임을 알리는 안내문을 게시할 것을 권고함\n마\n사회복지시설 고유번호증 또는 사업자등록증 별도 발급\n사회복지시설을 설치･운영하거나 국공립 사회복지시설을 위탁 받아 운영할 경우 「부가가치세법」, 「법인세법」 등 관련 법령에 따라 각 시설별로 별도의 고유번호증 또는 사업자등록증을 발급받도록 할 것\n※법인이 설치･운영(수탁 포함)하는 시설의 경우 “법인명(단체명)”에 법인명칭을 기재하거나 법인명칭과 시설명칭을 병기하는 형태 등으로 고유번호증(사업자등록증) 발급을 세무관서에 신청할 수 있음(권고사항)\n고유번호증 또는 사업자등록증 신청 및 발급 절차에 대해서는 국세청(☎ 126) 또는 관할 세무서에 문의바람\n바\n사회복지시설 민간위탁(시행규칙 제21조, 제21조의2 참조)\n위탁대상시설：국가 또는 지방자치단체가 설치한 시설(국가･지자체 외의 자(법인･개인 등)가 설치한 시설은 위･수탁 불가)\n※국･공립 시설과 달리 법령상 위･수탁 근거가 없음에 유의\n수탁자의 자격：사회복지법인 또는 비영리법인\n※시설운영의 안정성, 영속성, 공공성 등 차원에서 사회복지법인 또는 비영리법인에 그 자격을 제한하고 있으나, 개별 법령에 기타 단체 및 개인에게 위탁할 수 있는 근거 규정이 있을 경우(「영유아보육법」 제24조 등 개별 법령에 법인이외 개인도 위탁이 가능한 경우 등 시설별 특성이 있으므로 위탁 시 해당 개별 법령을 반드시 숙지할 것)에는 그에 따름\n※사회적협동조합은 「협동조합 기본법」 제4조제2항에서 비영리법인임을 명시하고 있는바 수탁대상에서 제외하지 않도록 유의(2017 사회적경제 활성화 방안 관련 기획재정부 요청사항)"}, {"p": 14, "t": "위탁방법 및 선정기준\n‒위탁방법：법령상 특별한 규정이 있는 경우를 제외하고는 반드시 공개모집에 의해 수탁자를 선정\n※공개모집 결과 신청법인이 없거나 수탁자 선정심의위원회 심의결과에 따라 수탁자를 선정하지 않을 경우, 다시 공개모집 절차를 진행하되, 이에 대한 세부기준은 반드시 지자체 조례로 규정할 것(필요 시 공개모집 관련 일반 사항은 「지방자치단체의 계약에 관한 법률」 준용 가능) (2021 국민권익위 사회복지시설 위탁운영 제도개선 권고 반영)\n‒선정기준의 설정\n※수탁자 선정심의 및 배점기준은 조례 또는 공고문을 통해 선정 전에 공개하여야 함 (2021 국민권익위 사회복지시설 위탁운영 제도개선 권고 반영)\n•선정주체：위탁기관의 장(※ 선정기준은 수탁자선정심의위원회의 의결을 받을 것)\n•선정기준에 포함되어야 할 사항\n➝필수사항：수탁자의 재정능력, 공신력, 사업수행능력, 지역 간 균형분포, 시설에 대한 평가결과(평가한 경우에 한함), 법인의 정관(수탁하고자하는 시설과 관련된 사업내용이 포함되어있는지 여부)\n➝임의사항：그 외 위탁기관의 장이 필요하다고 인정하는 사항\n위탁계약 체결시 필수 포함사항 (「사회복지사업법 시행규칙 제21조의2」 참고)\n제21조의2(시설의 위탁) ①국가나 지방자치단체는 법 제34조제5항에 따라 시설을 위탁하여 운영하고자 하는 때에는 다음 각 호의 내용이 포함된 계약을 체결해야 한다. 1. 수탁자의 명칭, 주소 및 대표자의 이름 2. 위탁계약기간 3. 위탁대상시설 및 업무내용 4. 수탁자의 의무 및 준수 사항 5. 시설의 안전관리에 관한 사항 5의2. 시설종사자의 고용승계에 관한 사항 6. 계약의 해지에 관한 사항 7. 기타 시설의 운영에 필요하다고 인정되는 사항 ※ 임원의 자격(결격사유 등) 확인 필요, 시설 위･수탁시 종사자 고용승계가 원칙임\n※수탁신청법인이 수탁신청일 기준으로 최근 3년간 「사회복지사업법」, 사회복지사업 근거 법률 (「사회복지사업법」 제2조제1호 각 목의 법률)에 따른 행정처분(시설장 교체 또는 업무(사업) 정지 이상)이나 벌칙을 받은 경우 수탁 심사 시 반영할 것(2017 사회적경제 활성화 방안 관련 기획재정부 요청사항)"}, {"p": 15, "t": "수탁자선정심의위원회의 구성\n‒공개모집한 수탁자는 반드시 심의위원회를 구성하여 선정할 것\n※수탁자선정심의위원회의 심의･의결은 서면이 아닌 실제 출석을 통해 실시할 것(단, 참여자를 확인할 수 있는 경우 원격영상회의와 같은 전자적 방법을 활용하여 심의 가능)\n☞ 다음의 요건을 모두 충족하는 경우, 원격영상회의와 같은 전자적 방법을 활용하여 심의 가능\n① 수탁자선정심의위원회 출석을 요하는 사람들이 동시에 모두 참여할 수 있는 방식이어야 함\n② 참여자가 누구인지 확인할 수 있어야 함(수탁자선정심의위원회 위원임을 확인)\n③ 일방적인 의사전달이 아닌 참여자 상호 간 의견교환이 가능하여야 함\n‒위원의 구성\n•위탁기관의 장이 임명 또는 위촉한 9인 이내의 위원(위원장 1인 포함)\n*위원장은 위탁기관의 장이 위원 중 1인을 지명\n‒위원의 자격은 시행규칙 제21조제4항1호부터 제4호까지를 참고하되, 가능한 한 민간위원을 과반수 이상으로 할 것\n‒위원회 운영에 관하여 필요한 사항은 법령을 벗어나지 않는 범위 내에서 위탁기관의 장이 정하여 운영할 것\n위탁계약의 체결 및 갱신 등\n‒계약의 체결：위탁 시에는 시행규칙 제21조의2 제1항 제1호부터 제7호까지의 사항*을 포함한 계약서를 체결해야 함\n*수탁자의 명칭, 주소 및 대표자의 이름, 위탁계약기간, 위탁대상시설 및 업무내용, 수탁자의 의무 및 준수 사항(수탁자 선정 심의 시 심의내용 및 이행계획을 포함할 것), 시설의 안전관리에 관한 사항, 시설종사자의 고용승계에 관한 사항, 계약의 해지에 관한 사항, 기타 시설의 운영에 필요하다고 인정되는 사항(2021 국민권익위 사회복지시설 위탁운영 제도개선 권고 반영)\n‒계약기간：5년으로 함\n위탁계약 체결시 주의사항\n법 제34조제2항 각 호의 어느 하나에 해당되어 시설의 설치･운영 신고를 할 수 없는 자와는 위탁계약을 체결하지 말 것 시행규칙 제21조의2제1항제6호에 따른 계약해지에 관한 사항 작성 시 다음의 사항을 포함할 것 ① 수탁자가 시행규칙 제21조의2제3항 각 호의 어느 하나에 해당될 때 위탁계약이 해지됨 ②수탁자가 법 제34조제2항 각 호의 어느 하나에 해당될 때 위탁계약이 해지됨(단, 수탁 받은 법인이 「사회복지사업법」 제19조제1항에 해당하는 임원을 지체없이 교체한 경우는 예외로 한다) ③ 위탁계약기간 중에 시설에서 위법･부당한 행위가 발생한 경우 계약 해지 가능"}, {"p": 16, "t": "‒지방자치단체는 관계법령의 규정을 벗어나지 않는 범위 내에서 사회복지시설 위탁심사 세부기준을 조례 등 자치법규에 규정(국민권익위원회 권고사항*, ʼ10.4.) 하여야 하며, 위탁계약 체결 시 시행규칙 제21조의2(시설의 위탁)에서 정하는 내용을 포함하여야 함\n*국민권익위원회 등의 권고사항(ʼ10.4.)은 보건복지부 사회서비스자원과‒2700(ʼ10.10.4)호 문서로 안내함\n‒다만, 수탁신청법인으로 하여금 과도한 재정부담을 요구하는 경우에는 여타 수탁에 필요한 역량(전문성 등)을 갖추고 있을 경우에도 불구하고 그 요구되는 재정을 부담할 수 없어 수탁자로 선정되지 못하는 사례가 발생할 수 있으므로, 재정부담 능력과 타 심사기준을 합리적으로 형량하여 수탁자를 선정할 것\n※기본적으로 비영리법인(사회복지법인 포함)은 영리를 목적으로 하지 아니하므로 과도한 재정을 부담하기 어려운 현실을 고려해 과도한 법인전입금을 별도로 요구하지 않도록 권고\n‒계약기간이 종료된 경우 원칙적으로 재공모하되, 위탁자가 필요하다고 인정하는 경우 선정위원회의 심의를 거쳐 계약기간 갱신 가능\n※ 갱신된 계약기간도 5년으로 권장\n‒2016년 8월 4일 이전에 체결된 위탁계약의 경우 그 계약기간은 종전의 규정에 따라 해당 위탁계약에서 정한 기간으로 함\n‒지자체에서 조례 등으로 위탁 계약기간을 정한 경우 반드시 시행규칙 제21조의2 제2항의 개정 규정에 위반되지 않도록 관련 사항을 정비할 것\n실적 등 확인 관련 유의사항\n사회복지시설 수탁자 선정에 있어 신청자에게 ‘종전의 지도･감독사항과 관련된 이력’ 및 ‘운영실적’ 등을 제출토록 하는 것은 해당 신청자가 시설 위탁운영에 적정한지 여부를 객관적이고 공정하게 심사하기 위한 기본자료로 활용하기 위함임 ‒따라서 수탁자 모집공고 시 공고일 현재 확인 가능하거나 확정된 지도감독결과 및 운영실적 등의 자료가 누락되는 일이 없도록 해당 실적자료 등의 기간 선정에 있어 적정을 기하기 바람 ʼ12년 12월 ○○군이 위탁공고를 하면서 비리나 운영실적 등 자료작성 대상기간을 ʼ12년 해당 연도를 제외하고 그 이전의 3개년(ʼ09~ʼ11년)에 대해서만 심사한 결과, ʼ12년에 시설운영 부실로 지적받은 기관이 수탁자로 선정되어 공정성 논란 발생"}, {"p": 17, "t": "사\n사회복지시설 민간위탁 공개모집 예외(시행규칙 제21조 단서)\n1) 사회복지사업법 시행규칙 개정(ʼ20.1.3. 공포, 시행) 사유\n종전에는 국가나 지방자치단체가 설치한 사회복지시설을 위탁하여 운영하려는 경우 예외 없이 공개모집의 방법으로 위탁받을 법인을 선정하였으나, 앞으로는 국가나 지방자치단체가 사회복지사업을 할 목적으로 직접 설립한 비영리법인에 위탁하려는 경우에는 공개모집을 하지 않을 수 있도록 하여 사회복지시설 운영에 있어서의 공공성을 높이려는 것임\n시행규칙 제21조(시설의 위탁기준 및 방법) ① 법 제34조제5항에 따라 국가 또는 지방자치단체가 설치한 시설을 위탁하여 운영하려는 경우에는 공개모집에 따라 수탁하는 법인(이하 “수탁자”라 한다)을 선정해야 한다. 다만, 국가 또는 지방자치단체가 사회복지사업을 할 목적으로 설립한 비영리법인에 위탁하여 운영하려는 경우로서 보건복지부장관이 정하는 경우에는 공개모집을 하지 않을 수 있다.\n2) 사회복지사업법 시행규칙 제21조제1항의 보건복지부장관이 정하는 경우라 함은 다음 3가지 요건 및 절차를 필요로 함\n수탁자의 자격: 국가 또는 지방자치단체가 사회복지사업을 할 목적으로 설립한 비영리법인으로서\n①“국･공립 사회복지시설 수탁 운영” 등 수탁받을 수 있는 근거가 정관상 목적사업으로 규정되어 있고, 수탁 운영에 필요한 전담인력, 조직, 예산 등을 갖추어야 함\n②기초 지방자치단체가 설립한 비영리법인은 수탁 운영에 필요한 사항을 갖추어 광역 지방자치단체와 협의하여야 함\n※수탁자 제한 사유: 공개모집을 통해 사회복지시설을 수탁받아 운영할 수 있는 민간기관과의 형평성을 고려하여 수탁자를 광역지방자치단체에서 설립한 법인으로 한정. 다만, 기초지방자치단체에서 설립한 법인이 우선 위탁받을 경우에는 광역지방자치단체와 협의하도록 함\n공개모집 예외 사유\n①신규* 국･공립 사회복지시설\n*사회복지사업법 시행규칙 개정 시행일(ʼ20.1.3.)이후 설치되는 국･공립시설\n②「사회복지사업법」 제43조의2에 따른 시설평가 및 관계 법령에 따른 시설평가 결과, 2회 연속으로 최하위 등급을 받은 시설"}, {"p": 18, "t": "③시설 거주자에 대한 인권침해 및 성폭력범죄 등 중대한 불법행위*가 발생하여 기존 수탁자와 위탁계약 유지(계약 갱신 포함)가 어렵다고 판단되는 시설\n*「사회복지사업법」 시행규칙 제26조의2에 따른 별표4 행정처분의 기준에 따라 시설거주자에 대한 부당한 체벌, 폭행, 학대 등 인권침해가 발생한 경우(2. 개별기준 4.라) 및 시설에서 성폭력 범죄가 발생한 경우(2. 개별기준 9.)\n④취약지 소재 시설 등 공익적 이유로 우선 위탁이 필요하다고 판단되는 시설\n※  공개모집 예외 사유 적용 시, 위 수탁자의 자격 요건 충족이 전제되어야 함\n공개모집 예외 절차\n①국･공립 사회복지시설을 우선 위탁하고자 하는 경우에는 사전에 수탁법인을 설립한 지방자치단체 및 수탁 법인과 협의를 거쳐야 함\n②공개모집 예외의 경우에도 시설의 수탁자 선정은 「사회복지사업법」 시행규칙 제21조제2항에 따라 “수탁자선정심의위원회” 심의를 거쳐야 함"}]}, {"title": "2. 사회복지시설 운영관련 참고사항", "start": 19, "end": 38, "html": "<div class=\"pchip\" id=\"p19\"><span>원문 19쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=31\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>사회복지시설 운영관련 참고사항<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회복지시설의 시설장 및 종사자의 자격 등<\/div><div class=\"ln p\">1)시설장(법 제35조 관련)<\/div><div class=\"ln p\">(자격사항) 사회복지시설의 장은 「사회복지사업법」 및 개별법령 등에 명시된 시설의 장의 결격사유에 해당되지 않아야 하고, 각 시설유형이 요구하는 자격기준을 갖춘 자여야 함<\/div><div class=\"ln p\">(상근의무) 사회복지시설의 장은 상근의무가 있으므로 수시로 확인 요망<\/div><div class=\"ln p\">2)종사자(법 제35조의2 관련)<\/div><div class=\"ln p\">(자격사항) 「사회복지사업법」 및 개별법령 등에 명시된 종사자의 결격사유에 해당 하지 않아야 하며, 유형별 시설에서 요구하는 자격요건 등을 갖추어야 함<\/div><div class=\"ln p\">☞ 개별 법령에서 결격사유 등을 별도로 정하는 경우를 제외하고는 「사회복지사업법」에 따름<\/div><div class=\"pchip\" id=\"p21\"><span>원문 21쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=33\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">시설장 및 종사자의 결격사유<\/div><div class=\"ln p\">■ 시설장의 경우 법 제35조제2항 1.제19조제1항제1호, 제1호의2부터 제1호의9까지 및 제2호의2부터 제2호의4까지의 어느 하나에 해당하는 사람 2.제22조에 따른 해임명령에 따라 해임된 날부터 5년이 지나지 아니한 사람 3.사회복지분야의 6급 이상 공무원으로 재직하다 퇴직한 지 3년이 경과하지 아니한 사람 중에서 퇴직 전 5년 동안 소속하였던 기초자치단체가 관할하는 시설의 장이 되고자 하는 사람 *법률 제14884호(2017.12.20. 시행) 부칙 제2조(임원의 결격사유 등에 관한 적용례)에 따라 제35조제2항제3호의 개정 규정은 이 법 시행 후 최초로 퇴직하는 공무원부터 적용함. ※이는 사회복지시설의 1차 감독기관인 시･군･구와 그 지도감독을 받는 기초지자체 관할 사회복지시설 간 업무유착 가능성을 차단하기 위해 이른바 ‘도가니 사건’을 계기로 개정한 조항인 바, 공무원이 퇴직 후 재취업을 위한 사회복지시설에 특혜를 부여하거나, 시설에 재취업 후 전 소속기관에 부당한 영향력을 행사하는 등의 부작용 등을 예방하고, 지방자치단체의 사회복지시설 지도감독권이 손상되지 않도록 하기 위한 것임 ■ 종사자의 경우 법 제35조의2제2항 1.제19조제1항제1호의7부터 제1호의9까지의 어느 하나에 해당하는 사람 2.제1호에도 불구하고 종사자로 재직하는 동안 시설이용자를 대상으로 「성폭력범죄의 처벌 등에 관한 특례법」 제2조에 따른 성폭력범죄 및 「아동･청소년의 성보호에 관한 법률」 제2조제2호에 따른 아동･청소년대상 성범죄를 저질러 금고 이상의 형 또는 치료감호를 선고받고 그 형이 확정된 사람<\/div><div class=\"pchip\" id=\"p22\"><span>원문 22쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=34\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설 장의 상근의무<\/div><div class=\"ln p\">상근의무의 정의 ‒원칙적으로 상근의무란, 휴일 기타 근무를 요하지 않은 날을 제외하고 일정한 근무계획 하에 매일 소정의 근무시간 중 상시 그 직무에 종사하여야 하는 것을 말함 공무원의 상근시간：평일 09시∼18시, 토요일 09시∼13시(주 5일 시행 전) 겸직 허용 범위 ‒공무원의 경우 영리 업무에 종사하는 것은 금지되어 있음.(「국가공무원 복무규정」 제25조) ‒비영리 업무라 하더라도 담당 직무 수행에 지장이 없는 경우에 한해서 소속기관장의 사전허가를 받아야 가능(「국가공무원 복무규정」 제26조) ‒따라서 공무원에 준하여 그 상근 관리가 이루어지는 시설장의 경우에도 영리를 목적으로 하는 업무는 당연히 그 종사가 불가능할 것이며, 영리업무에 해당하지 않는 경우라 할지라도 해당 시설의 운영에 지장이 없는 경우에 한하여 겸직이 가능할 것임 ‒참고로, 「사회복지사업법」 제35조의2에 따라 시설장의 채용 주체는 사회복지법인 등 설치･운영자이므로 시설장이 겸직을 하고자 할 때는 겸직 업무의 영리업무 해당 및 시설운영 지장 여부 등에 대해 법인 등 채용주체에 1차적인 판단을 받아 소관 지방자치단체에 보고하여야 할 것임 ‒만일 법인 등에서 판단을 잘못하여 그 겸직업무가 영리업무에 해당하거나 시설운영에 지장이 있는 경우, 「사회복지사업법」 제40조제1항제4호 등에 해당하여 행정처분(시설장 교체까지 가능) 대상이 될 것이므로, 사전에 시･군･구청장에게 겸직 가능 여부를 협의해 올 경우, 시･군･구청장은 시설장의 상근의무 및 겸직허가 제도의 취지를 종합적으로 고려하여 개별적･구체적으로 검토하여야 할 것임 ‒아울러, 「사회복지사업법」 제42조에서는 사회복지사업을 하는 자가 거짓이나 부정한 방법으로 보조금을 받거나 목적 외의 용도로 보조금을 사용했을 경우 국가나 지방자치단체가 관련 보조금의 반환을 명할 수 있도록 규정하고 있으므로, 정부(지자체 포함) 보조금을 통해 인건비를 지원받는 시설의 경우 국민의 세금이 낭비되는 일이 없도록 상근의무를 엄정하게 적용하여 시설 지도감독에 소홀함이 없도록 관리하여야 할 것임 명예직, 겸임교수, 시간강사 등 영리추구가 현저하지 않거나 영리업무에 해당하지 않은 직으로서, 겸직을 하더라도 시설의 정상적인 운영이 가능한 경우에는 겸직이 가능* ※단, 출강* 등 외출 시에는 근무상황부에 기록하도록 하며 과도한 출강 등으로 정상적인 시설 운영이 불가능할 경우에는 상근의무 위반에 해당 *참고로, 공무원의 경우 외부 강의와 관련하여 근무시간 외의 경우 업무수행에 지장을 초래하지 않는 범위 안에서 허용이 가능하지만, 근무시간 내 외부강의는 원칙적으로 금하면서, 해당 공무원의 담당 직무수행과 관련 있는 경우에 해당기관의 기능수행 및 정책수행의 목적상 필요한 경우, 기타 해당기관의 장이 필요하다고 인정하는 경우에 한하여 허용하고 있음 시설종별 협회 비상근 임원으로 선임되어 관련 업무를 수행하는 경우 겸직 가능 ※시설장의 상근 또는 타 직종 겸직과 관련하여 시설관련 개별 법령이 따로 있는 경우 위 기준보다 우선 함<\/div><div class=\"pchip\" id=\"p23\"><span>원문 23쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=35\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>사회복지시설장의 근로자성 인정 여부<\/td><\/tr><tr><td>사회복지시설의 장이 임용절차, 보수, 근로계약서와 사용자의 지휘･감독 유무 등 제반사정을 종합적으로 살펴 근로기준법상 근로자로 인정될 경우에는 고용보험에 가입됨<br>- 사회복지법인(비영리법인 포함)이 설치･운영하는 시설에 채용･임명된 사회복지시설의 장이 시설 운영과 관련하여 법인으로부터 구체적인 지휘･감독을 받는 경우 근로자성이 인정될 수 있음<br>※ 사회복지시설의 설치 주체인 개인이 시설장을 겸임하는 경우는 제외<br><table class=\"htbl\"><tr><td>&lt;근로자성 판단 기준&gt;<br>ㅇ 「근로기준법」 제2조는 근로자를 “직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람”으로 정의<br>ㅇ 「근로기준법」 상 근로자에 해당하는지 여부는 계약의 형식이 고용계약인지 도급계약인지보다 그 실질에 있어 근로자가 사업 또는 사업장에 임금을 목적으로 종속적인 관계에서 사용자에게 근로를 제공하였는지 여부에 따라 판단<\/td><\/tr><\/table><br><table class=\"htbl\"><tr><td>&lt;근로자성 판단 기준&gt;<br>ㅇ 「근로기준법」 제2조는 근로자를 “직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람”으로 정의<br>ㅇ 「근로기준법」 상 근로자에 해당하는지 여부는 계약의 형식이 고용계약인지 도급계약인지보다 그 실질에 있어 근로자가 사업 또는 사업장에 임금을 목적으로 종속적인 관계에서 사용자에게 근로를 제공하였는지 여부에 따라 판단<br>ㅇ 종속적인 관계가 있는지 여부는 ①업무 내용을 사용자가 정하고, ②취업규칙 또는 복무(인사)규정 등의 적용을 받으며, ③업무수행 과정에서 사용자가 상당한 지휘･감독을 하는지, ④사용자가 근무시간과 근무장소를 지정하고 근로자가 이에 구속을 받는지, ⑤노무제공자가 스스로 비품･원자재나 작업도구 등을 소유하거나 제3자를 고용하여 업무를 대행케 하는 등 독립하여 자신의 계산으로 사업을 영위할 수 있는지, ⑥노무 제공을 통한 이윤의 창출과 손실의 초래 등 위험을 스스로 안고 있는지, ⑦보수의 성격이 근로 자체의 대상적 성격인지, 기본급이나 고정급이 정하여졌는지 및 근로소득세의 원천징수 여부 등 보수에 관한 사항, ⑧근로 제공 관계의 계속성과 사용자에 대한 전속성의 유무와 그 정도, ⑨사회보장제도에 관한 법령에서 근로자로서 지위를 인정받는지 등의 경제적･사회적 여러 조건을 종합하여 판단(대법원 2006.12.7. 선고 2004다29736 판결 등 참조).<\/td><\/tr><\/table><br>따라서, 고용보험 가입을 위해서는 사회복지시설장은 사업장 관할 근로복지공단의 안내에 따라 근로자성을 입증할 자료를 구비･제출하여 근로자성 여부를 판단 받을 필요가 있음<br>관련 행정해석<br><table class=\"htbl\"><tr><td>&lt; 고용노동부 고용서비스지원과-1730, 2009.7.8. &gt;<br>보육시설 또는 복지관의 실질적인 운영을 위하여 지방자치단체장 또는 수탁업체가 시설의 원장을 임명하여 동 원장으로 하여금 종사자에 대한 임명 및 복무관리를 하도록 하고, 원장명의로 사업자 등록을 하여 대외적으로 대표권을 행사하도록 하고 있다면 동 원장은 고용보험의 피보험자가 되는 근로자에 해당되지 않는 것으로 판단됨<br>다만, 지방자치단체에서 자체 또는 위탁운영하고 있는 경우 원장과 수탁업체 대표 또는 지방자치단체장과의 별도의 근로계약서를 작성하는 등 실질적인 중간관리자의 성격이라면 고용보험 피보험자격을 취득 할 수 있다고 판단됨<\/td><\/tr><\/table><br><table class=\"htbl\"><tr><td>&lt; 중앙노동위원회 결정(2000.7.6, 중노위2000부해 161) &gt;<br>법인으로부터 임명된 사회복지법인 원장에 대하여 일정한 보수를 받는다고 하여 이를 당연히 근로기준법상 임금이라고 할 수 없고, 구체적이고 직접적으로 업무지휘, 감독을 받지 않은 사회복지시설장은 사용종속관계에 있는 근로자로 볼 수 없음<\/td><\/tr><\/table><br>※ [고용보험] 가입대상(고용보험법 제8조), 사용자･근로자의 정의(근로기준법 제2조)<br>※ 건강보험, 국민연금 관련 사업주 및 근로자의 구분은 별도 기준 적용<\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"pchip\" id=\"p24\"><span>원문 24쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=36\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">사회복지시설 운영위원회(법 제36조)<\/div><div class=\"ln p\">1)시설운영위원회 설치목적<\/div><div class=\"ln p\">사회복지시설 운영의 민주성･투명성 제고 및 시설이용･생활자의 권익 향상 등을 위해 사회복지 시설 운영위원회(이하 시설운영위원회)를 설치･운영함<\/div><div class=\"ln p\">2)시설운영위원회 설치 대상시설(법 제36조제1항)<\/div><div class=\"ln p\">가)모든 사회복지시설은 운영위원회 설치 필요<\/div><div class=\"ln p\">나) 예외적으로 공동운영위원회를 둘 수 있는 경우<\/div><div class=\"ln p\">사회복지 생활시설<\/div><div class=\"ln p\">‒생활자 수가 20인 미만 시설의 경우<\/div><div class=\"ln p\">•3개소 당 1개 운영위원회를 원칙으로 하되, 해당 시･군･구에 1개소만 있을 경우 해당 시설에 운영위원회 1개 운영<\/div><div class=\"ln p\">생활자 수가 20인 이상 시설<\/div><div class=\"ln p\">‒1개소 당 1개 운영위원회 운영하되, 위원 수는 시설 생활자 수를 고려하여 시장･군수･구청장이 결정<\/div><div class=\"ln p\">☞지자체장은 생활자 수가 100인 이상의 대형시설, 정신요양시설, 장애인시설 등에서 운영 위원회를 구성할 때 인권보호 강화 등의 측면에서 반드시 관계공무원을 운영위원회 위원으로 참여시킬 것<\/div><div class=\"ln p\">사회복지이용시설：시장･군수･구청장이 공동으로 운영위원회를 두는 것이 필요하다고 인정하는 경우에 3개 이내의 시설에 1개 공동위원회 가능<\/div><div class=\"ln p\">3)시설운영위원회의 구성(법 제36조제2항 및 시행규칙 제24조제1항)<\/div><div class=\"ln p\">가)위원회는 위원장 1인을 포함하여 5인 이상 15인 이하의 위원으로 구성하고, 법 제36조 제2항 각 호 중 같은 호에 해당하는 위원이 2명을 초과해서는 아니 됨<\/div><div class=\"ln p\">나)위원회의 위원은 아래에 해당하는 자 중에서 관할 시장･군수･구청장이 임명 또는 위촉<\/div><div class=\"ln p\">시설의 장<\/div><div class=\"pchip\" id=\"p25\"><span>원문 25쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=37\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">시설 거주자(이용자) 대표<\/div><div class=\"ln p\">시설 거주자(이용자)의 보호자 대표<\/div><div class=\"ln p\">시설 종사자의 대표<\/div><div class=\"ln p\">해당 시･군･구 소속의 사회복지업무를 담당하는 공무원<\/div><div class=\"ln p\">후원자 대표 또는 지역주민<\/div><div class=\"ln p\">공익단체에서 추천한 사람<\/div><div class=\"ln p\">*공익단체는 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체를 말함<\/div><div class=\"ln p\">그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이 풍부한 자<\/div><div class=\"ln note\">※① 시설장의 친인척, ② 설치･운영자인 법인의 임원 등 특수관계가 명확한 자(시설장 제외)는 위원으로 임명･위촉하지 않도록 할 것<\/div><div class=\"ln note\">※「지방자치법」 제43조제5항에 따라 지방의회의원은 지방자치단체로부터 운영비 등을 보조받는 사회복지사업을 하는 자가 설치･운영하는 사회복지시설의 운영위원회 위원이 될 수 없음에 유의할 것(법제처 해석, 17-0433)<\/div><table class=\"htbl\"><tr><td>Q: 시설 운영위원회 각 호의 위원당 몇 명까지 임명･위촉이 가능한가요?<\/td><\/tr><tr><td>A: 사회복지사업법 제36조제2항 각 호의 위원당 2명까지 가능합니다.<\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"ln p\">다)위원장은 호선, 위원의 임기는 3년으로 하되 연임할 수 있고 보궐위원의 임기는 전임자의 잔임 기간으로 함<\/div><div class=\"ln p\">4)시설운영위원회의 심의사항(법 제36조제1항)<\/div><div class=\"ln p\">가)시설운영계획의 수립･평가에 관한 사항<\/div><div class=\"ln p\">나)사회복지프로그램의 개발･평가에 관한 사항<\/div><div class=\"ln p\">다)시설종사자의 근무환경 개선에 관한 사항<\/div><div class=\"ln p\">라)시설거주자의 생활환경 개선 및 고충처리 등에 관한 사항<\/div><div class=\"ln p\">마)시설 종사자와 거주자의 인권보호 및 권익증진에 관한 사항<\/div><div class=\"pchip\" id=\"p26\"><span>원문 26쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=38\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">바)시설과 지역사회와의 협력에 관한 사항<\/div><div class=\"ln p\">사)그 밖에 시설의 장이 운영위원회의 회의에 부치는 사항<\/div><div class=\"ln p\">사회복지시설 운영위원회 심의 관련<\/div><div class=\"ln p\">☞사회복지시설 운영위원회는 심의기능을 하는 바, 의사결정의 주체가 다수인 관계로 다수의 의견을 모으는 행위의 형식으로 관련 위원회 규정에서 “의결”이라는 용어를 사용하더라도 위원회의 의결사항이 시설의 장에 대한 법적인 구속력이 있는 결정으로는 보기 어려움 ‒다만, 시설의 장은 위원회의 순기능적 측면을 감안하여 그 심의사항을 배척할만한 합리적인 이유가 없는 한 위원회의 심의결과를 존중하는 것이 바람직하며, ‒지자체는 위원회의 심의사항과 시설장의 의견이 상반되는 등 논란이 되는 사항과 위원회에서 논의된 사항 중 합리적인 사항에 대해서는 관련 법령과 지침 등을 토대로 면밀히 검토하여 시･군･구 복지정책에 반영될 수 있도록 하고, 필요할 경우 시･도 및 보건복지부 등에 정책건의<\/div><div class=\"ln p\">5)시설운영위원회 보고사항(법 제36조제3항)<\/div><div class=\"ln note\">※아래 사항 등을 운영위원회에 사전 보고하는 것으로, 이는 위원회의 심의를 요하는 것은 아님<\/div><div class=\"ln p\">시설의 회계 및 예산･결산에 관한 사항<\/div><div class=\"ln p\">후원금 조성 및 집행에 관한 사항<\/div><div class=\"ln p\">그 밖에 시설운영과 관련된 사건･사고에 관한 사항<\/div><div class=\"ln p\">☞국가감염병 확산 등 특수한 상황이 있을 경우, 서면보고로 갈음 가능<\/div><div class=\"ln p\">6)시설운영위원회 운영<\/div><div class=\"ln p\">가)회의의 개최<\/div><div class=\"ln p\">정기회의<\/div><div class=\"ln p\">‒분기별 1회 이상 정기회의 개최<\/div><div class=\"ln p\">수시회의<\/div><div class=\"ln p\">‒시설운영위원회 운영규칙에 규정한 회의개최 요건에 해당할 경우(재적위원 1/3의 요청이 있을 경우 등) 수시회의 개최<\/div><div class=\"ln p\">☞시설 운영위원회 운영에 필요한 세부 운영규칙은 법령 및 지침에 위반하지 않는 범위 내에서 시설 결정으로 제･개정 가능(단, 법령에 규정되어 있는 사항은 반드시 운영규칙에 포함 시킬 것)<\/div><div class=\"pchip\" id=\"p27\"><span>원문 27쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=39\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">회의 결과의 공개<\/div><div class=\"ln p\">‒위원회의 회의는 시설생활자, 시설종사자 등에게 공개를 원칙으로 하되, 개인 정보보호 등 불가피한 사유 시 위원장이 비공개결정을 할 수 있음(비공개사유는 공개해야 함)<\/div><div class=\"ln p\">회의는 대면심의가 원칙이며 참여자를 확인할 수 있는 원격영상회의는 허용<\/div><div class=\"ln p\">사회복지시설 운영위원회 회의 관련<\/div><div class=\"ln p\">☞시설운영위원회는 사회복지시설과 관련한 다양한 사항을 “심의”하기 위해서 설치･운영되는 것임 ‒“심의”는 “심사하고 토의함”이라는 사전적 의미가 있는 점, 위원회 회의를 정기 또는 수시로 개최하고 그 회의를 공개토록 규정하고 있는 점, ‒위원회 설치의 법률 취지가 다양한 경력을 가지고 있는 위원들이 특정사안에 대해서 서로의 의견을 교환하고 논의함으로써 시설운영의 민주성･투명성을 제고하고, 생활자 등의 권익을 향상시키기 위한 것이라는 점을 종합적으로 고려하면, 대면회의가 적절함 ☞또한, 다음의 요건을 모두 충족하는 경우, 원격영상회의와 같은 전자적 방법을 활용하여 심의 가능, 이 경우에는 주무관청의 지도･감독 및 분쟁소지 해소를 위하여 영상회의를 녹화하여 보관<\/div><div class=\"ln p\">나) 회의록의 작성 및 보고<\/div><div class=\"ln p\">위원회의 간사는 매년 1회 정기 및 수시회의의 결과를 간략하게 요약하여 정본은 위원회에 보관하고 사본 1부는 시･군･구청장에게 제출할 것<\/div><div class=\"ln p\">* 「사회복지법인 및 사회복지시설 재무회계규칙」 제10조제2항에 따른 예산 제출 시 함께 제출<\/div><div class=\"ln p\">시･군･구에 제출된 회의록 중 정책건의가 필요한 사항은 매년 1회(매년 12.1.) 시･도를 경유하여 보건복지부 사회서비스자원과 및 개별시설과로 보고<\/div><div class=\"ln p\">다) 기타 사항<\/div><div class=\"ln p\">위원회 운영에 필요한 예산은 원칙적으로 시설 운영비에서 지출<\/div><div class=\"ln p\">회의수당, 회의장소 등 위원회 운영에 세부적인 사항은 운영위원회 자율적으로 결정<\/div><div class=\"pchip\" id=\"p28\"><span>원문 28쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=40\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">시설운영의 투명성 강화<\/div><div class=\"ln h4\">1) 사회복지시설 종사자(이하 ‘시설장’ 포함) 인건비 보조금 지급 연령 상한기준(시행일：2002년 1월 1일)<\/div><div class=\"ln p\">(정부의 인건비 보조금 지급 연령 상한기준) 정부(지자체)에서 시설장 및 종사자의 인건비를 지원하는 시설에 대해서는 아래와 같이 인건비 지원기준을 정할 수 있으며, 기준을 초과하여 계속 근무하는 종사자의 인건비는 시설이 자체적으로 지급하여야 함.<\/div><table class=\"htbl\"><tr><td rowspan=\"2\">‒지급상한：<\/td><td><\/td><td rowspan=\"2\">시설장  65세(단, 2002년 1월 1일부터 현재까지 재직 중인 설립자* 및 설립자의 직계가족 1세대에 한해 만 70세)<\/td><\/tr><tr><td><\/td><\/tr><tr><td rowspan=\"2\"><\/td><td><\/td><td rowspan=\"2\">종사자 60세<br>*조리원 65세<\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"ln note\">※ 조리원과 같이 구인난이 심한 직종 및 도서 지역의 경우, 관할 지방자치단체의 자체적(재량) 판단하에 60세 초과 종사자 채용 및 인건비 지급 가능<\/div><div class=\"ln p\">*원칙적으로 설립자의 범위는 「사회복지사업법」 제34조에 따른 사회복지시설 설치･운영 신고 주체이자 동시에 시설장인 자를 의미하나, 법인 설치시설의 경우에는 설치･운영 신고 주체와 시설장이 동일할 수 없기 때문에 지자체에서는 설립자의 의미에 대해 실질적인 측면(개인재산 출연여부 및 규모 등)을 고려하여 현재 재직 중인 시설장에게 설립자 지위 인정이 가능한지 판단해야 함. 다만, 설립자의 시설 사유화 의식 탈피 및 조직쇄신 등 제도 도입 취지에 반하지 않도록 유의<\/div><div class=\"ln p\">**설립자의 배우자 및 그 자녀(또는 그 자녀의 배우자)<\/div><div class=\"ln p\">‒위 지급상한기준에 대해서는 각 지자체에서 사회통념 및 지자체 재정여건 등이 허용되는 범위 내에서 상향조정할 수 있으며, 특히 농촌 취약지 등 지역적 특성 및 종사자 직군별 업무 특수성 등을 감안하여 지자체별로 개별 특례를 마련할 수 있음.<\/div><div class=\"pchip\" id=\"p29\"><span>원문 29쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=41\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">【특례】 60세 초과 종사자에 대한 인건비 보조금 지원이 가능한 경우<\/div><div class=\"ln p\">① 공개모집 절차를 2회 이상 진행했음에도 불구하고 응시자가 없는 경우 ‒지자체 홈페이지, 워크넷, 복지넷, 희망이음* 중 2곳  이상의 사이트에 채용 관련 사항을 15일 이상 공개모집하였으나 응시자가 없는 경우 해당 결과를 주무관청에 제출 후 협의 * 60세 초과 ‘대체’ 종사자를 특례 채용하는 경우 1회 공모 후 절차에 따라 채용 가능 ‒60세를 초과한 종사자의 특례 근로계약은 1년으로 하되, 63세까지는 공모절차 없이 재계약 가능하며, 63세를 초과하여 근무하고자 하는 경우에는 위의 방식으로 공개모집 절차를 진행하여 응시자가 없는 경우 해당 결과를 주무관청에 제출 후 협의하여 65세까지 계약 연장 및 인건비 보조금 지원 가능 ※ 60세 초과 종사자를 특례 채용한 경우에는 특례 근로계약 체결 당시의 호봉을 초과할 수 없음 ② 60세 초과 종사자의 기존 인건비 내에서 청년 인력(만 29세 이하)을 채용하는 경우 ‒신규 채용 및 인력 운용 계획을 시설운영위원회 및 법인이사회를 거쳐 주무관청에 제출 ‒위의 계획에는 60세 초과 종사자 및 신규 채용 인력 2인의 인건비를 60세 초과 종사자의 기존 인건비 100% 내에서 지급하되, 60세 초과자의 인건비는 기존 인건비의 50%를 초과할 수 없음 ‒청년 인력에 대해서는 인건비 지급 가이드라인 적용 ※①, ②에 따른 절차를 거치는 경우라 하더라도 65세를 초과하는 경우에는 인건비 보조금을 지원할 수 없음<\/div><div class=\"ln p\">➩위 지급 상한기준은 종사자의 신분을 보장하기 위한 제도가 아니라 정부예산의 지급 기준이므로, 업무수행 능력이 없거나 종사자가 비리를 자행할 경우 등 「근로기준법」상 해고사유가 발생할 경우 시설에서 근로계약, 취업규칙 등에 의거 적절한 조치를 취할 수 있음<\/div><div class=\"ln note\">※(정년제 권고) 사회복지시설은 근로계약, 취업규칙 등에 따라 시설장 및 종사자의 정년을 정할 수 있으므로, 시설 사유화의식 탈피 및 조직쇄신 차원에서 정년제 실시를 권고함<\/div><div class=\"ln note\">※촉탁의사는 시설 종사자가 아니므로 보조금 인건비 지급상한제 및 인건비 가이드라인 적용대상에서 제외함<\/div><table class=\"htbl\"><tr><td>사회복지시설의 인건비 지급상한기준<\/td><\/tr><tr><td>지급상한기준년<br><table class=\"htbl\"><tr><td rowspan=\"2\">설립자 및 설립자 직계가족 1세대<\/td><td>생년월일<\/td><td>~1955년<\/td><td>1956년<\/td><td>1957년~<\/td><\/tr><tr><td>지급상한년<\/td><td>~2025년<\/td><td>2026년<\/td><td>2027년~<\/td><\/tr><tr><td rowspan=\"2\">설립자 및 직계가족 1세대가 아닌 시설장<\/td><td>생년월일<\/td><td>~1960년<\/td><td>1961년<\/td><td>1962년~<\/td><\/tr><tr><td>지급상한년<\/td><td>~2025년<\/td><td>2026년<\/td><td>2027년~<\/td><\/tr><tr><td rowspan=\"2\">시설종사자<\/td><td>생년월일<\/td><td>~1965년<\/td><td>1966년<\/td><td>1967년~<\/td><\/tr><tr><td>지급상한년<\/td><td>~2025년<\/td><td>2026년<\/td><td>2027년~<\/td><\/tr><\/table><br>지급상한기준일(지급상한일자는 해당 종사자(시설장 포함)의 출생일을 기준으로 함)<br>-1월에서 6월 사이 지급상한일자 : 6월 30일<br>-7월에서 12월 사이 지급상한일자 : 12월 31일<\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"ln p\">1년 미만 근속 근로자*의 퇴직급여･퇴직적립금의 관리<\/div><div class=\"ln note\">＊근로계약 기간이 1년 이상이면서 근속기간이 1년 미만인 근로자 (인건비 국고보조 대상 근로자) 근속기간이 1년 미만인 자가 퇴직한 경우 해당 근로자의 퇴직급여･퇴직적립금 중 국고 및 지방자치단체 보조금은 회계연도 종료 후 3월 이내에 반환해야 함 (인건비 국고보조 대상이 아닌 근로자) 근속기간이 1년 미만인 자가 퇴직한 경우 해당 근로자의 퇴직급여･퇴직적립금을 반환하지 않고 퇴직 후 3월 이내에 퇴직급여･퇴직적립금 목으로 여입 후 타 목으로 재편성해야 함 ※2021년 정부합동감사 제도개선 과제<\/div><div class=\"pchip\" id=\"p30\"><span>원문 30쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=42\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">2)시설운영비 지출 원칙<\/div><div class=\"ln p\">지출은 지출사무를 관리하는 자(대표이사, 시설장) 및 그 위임을 받아 지출명령이 있는 것에 한하여 지출원이 행함<\/div><div class=\"ln p\">지출은 예금통장 또는 「전자거래기본법」에 의한 전자거래*로 집행하며, 특히 보조금의 경우 2011년 7월부터 시･도별로 도입한 보조금 전용카드로 집행할 것<\/div><div class=\"ln p\">‒상용경비 또는 소액의 경비 지출이라도 1만 원 이상 지출 시 카드를 사용하거나 현금영수증을 발급받아 지출하도록 지도요망<\/div><div class=\"ln p\">*국세청에서 변경된 현금영수증 발급제도에 따라 ʼ08.7.1.이후부터 현금영수증 발급이 가능한 곳(가맹점) 에서는 1원 이상 집행 시 현금영수증 발급 가능<\/div><div class=\"ln p\">*지역특성상 신용카드 사용이나 현금영수증 발급 등이 현실적으로 어렵다고 시･군･구청장이 인정하는 경우 간이 영수증 또는 현금지출이 가능하며, 이 경우에도 그 확인이 가능한 증빙서류 구비<\/div><div class=\"ln p\">*농어촌지역이나 카드 미가맹점에 대해서는 5만원 이상 집행 시 온라인(on‒line)입금 활용<\/div><div class=\"ln p\">국세청 ‘사업자용 현금영수증카드’ 사용 안내<\/div><div class=\"ln p\">‘사업자용 현금영수증카드’：사업자가 사업과 관련 있는 물품 등을 현금으로 구입할 때 신속･편리하게 현금영수증을 발급받을 수 있도록 제작･보급하는 카드 * 신청문의：현금영수증홈페이지(www.hometax.go.kr) 또는 현금영수증상담센터(☎ 126)<\/div><div class=\"ln p\">각 시･도는 자체적으로 마련한 「사회복지시설 보조금 전용카드 사용지침」 등에 따라 보조금 전용카드에 클린카드 기능을 추가하여 관리할 것[관련안내：보건복지부 사회서비스자원과‒5071(2011.11.9)호 및 사회서비스자원과‒1535(2012.3.29)호]<\/div><div class=\"ln p\">‒또한 각 지자체는 보조금 집행의 투명성이 제고될 수 있도록 주기적인 모니터링 방안 등 그 밖의 필요한 사항을 수립하여 지도･감독하기 바람<\/div><div class=\"ln p\">‒모니터링을 통해 위법･부당 사용사례가 적발된 경우, 감사 등을 실시하여 환수 및 징계조치 하는 등 엄정하게 처분할 것<\/div><div class=\"ln p\">보조금 전용카드란?<\/div><div class=\"ln p\">①시설 보조금을 지출하기 위해 보조금 전용계좌와 연결된 체크카드 ②사회서비스정보시스템(희망이음)에 발급 및 거래내역 전송 ③클린카드 기능 탑재 *보조금 전용계좌 및 전용카드는 광역자치단체별로 계약한 금융사를 통해 발급받아야 함<\/div><div class=\"pchip\" id=\"p31\"><span>원문 31쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=43\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>사회복지시설 보조금 전용카드 사용제한 업종(클린카드 기능)<\/td><\/tr><tr><td><table class=\"htbl\"><tr><td>분 류<\/td><td>보조금 사용제한 업종<\/td><\/tr><tr><td>유흥업종<\/td><td>룸싸롱, 유흥주점, 단란주점, 나이트클럽, 주점으로 등록된 호프집, 맥주홀, 칵테일바, 주류판매점, 카페, 카바레<\/td><\/tr><tr><td>위생업종<\/td><td>피부미용실, 안마시술소, 발마사지 등 대인서비스, 스포츠마사지, 네일아트, 지압원<\/td><\/tr><tr><td>레저업종<\/td><td>실내･외 골프장, 노래방, 사교춤, 전화방, 비디오방, 골프연습장, 골프용품, 스크린골프, 당구장, PC방, 기원<\/td><\/tr><tr><td>사행업종<\/td><td>카지노, 복권방, 오락실<\/td><\/tr><tr><td>기타업종<\/td><td>성인용품점, 총포류 판매<\/td><\/tr><\/table><br>※각 시･도는 상기 제한업종 외의 추가사항은 시설특성 등을 고려하여 지자체 판단 하에 확대추진할 수 있으며,이 경우 시･도별 「사회복지시설 보조금 전용카드 사용지침」에 반영하여 운영할 것<\/td><\/tr><tr><td><\/td><\/tr><\/table><div class=\"ln p\">‒시설 운영비 지출을 보조금 전용카드 등으로 집행함에 따라 발생하는 포인트 또는 마일리지 등은 다시 시설운영에 사용하도록 조치(개인적으로 사용 금지)<\/div><div class=\"ln p\">*보조금 전용카드에서 발생한 포인트 등은 보조금에서 파생된 수익이므로 해당 보조금의 용도와 부합되는 용도로만 사용해야 함<\/div><div class=\"ln p\">사회복지시설과 관련한 보조금은 「국가재정법」, 「보조금 관리에 관한 법률」, 「지방재정법」, 「사회복지사업법」 및 개별 보조사업 근거법령, 「사회복지법인 및 사회복지시설 재무･ 회계규칙」 기타 관련 지침에 위배되지 않도록 신청･교부 및 사용하여야 함.<\/div><div class=\"ln p\">수령한 보조금은 시설회계 중 보조금 수입으로 처리<\/div><div class=\"ln p\">&lt; 고용노동부 고용서비스지원과-1730, 2009.7.8. &gt; 보육시설 또는 복지관의 실질적인 운영을 위하여 지방자치단체장 또는 수탁업체가 시설의 원장을 임명하여 동 원장으로 하여금 종사자에 대한 임명 및 복무관리를 하도록 하고, 원장명의로 사업자 등록을 하여 대외적으로 대표권을 행사하도록 하고 있다면 동 원장은 고용보험의 피보험자가 되는 근로자에 해당되지 않는 것으로 판단됨 다만, 지방자치단체에서 자체 또는 위탁운영하고 있는 경우 원장과 수탁업체 대표 또는 지방자치단체장과의 별도의 근로계약서를 작성하는 등 실질적인 중간관리자의 성격이라면 고용보험 피보험자격을 취득 할 수 있다고 판단됨<\/div><div class=\"ln p\">유의사항<\/div><div class=\"ln p\">사회복지법인의 경우 법인회계에서 우선 수입 처리한 후 시설전출금으로 세출하고, 이를 시설회계에서 법인전입금으로 처리하는 경우가 있으나, -법인회계나 시설회계가 사회복지법인의 회계 중의 일부이므로, 시설회계에서 곧바로 처리하는 것이 정상적인 처리 절차<\/div><div class=\"pchip\" id=\"p32\"><span>원문 32쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=44\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">각 지자체는 시설 후원금 및 사업수익금에 대해서도 클린카드를 도입하거나 시･도별로 기 도입 운영 중인 보조금전용카드와의 연계방안 등을 강구･시행하는 등 시설 후원금 및 사업수익금의 적정한 관리에 필요한 대책을 마련 시행하기 바람<\/div><div class=\"ln note\">※후원금과 사업수익금을 클린카드 적용을 받는 보조금이 아니라는 이유로 노래방 등에서 유흥목적으로 사용하거나 업무와 직접적 관련이 없는 심야(23시 이후)시간대에 사용하는 등 부적정한 예산집행 사례 적발<\/div><div class=\"ln p\">기타사항：지자체는 보조금 집행의 투명성 강화를 위하여 국민권익위원회가 권고 (ʼ10.4.19.)한 ‘보조금 통장 단일화’* 여부를 자체적으로 검토･시행함<\/div><div class=\"ln p\">*지자체의 정책적 판단에 따라 사업유형에 따른 복수의 보조금통장 사용도 가능<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">시설 생활자에 대한 인권보호 강화<\/div><div class=\"ln p\">시설 조치여부 시･군･구 점검사항<\/div><div class=\"ln p\">‒시설 생활자에게 인권침해사실 진정권에 대한 고지 여부<\/div><div class=\"ln p\">‒시설 내에 진정함 설치 유무<\/div><div class=\"ln p\">‒시설 생활자가 작성한 진정서의 인권위원회 송부 여부<\/div><div class=\"ln p\">‒방문조사 시 협조 상태 등<\/div><div class=\"pchip\" id=\"p33\"><span>원문 33쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=45\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사회복지시설 인권보호관련 「국가인권위원회법」 관련규정<\/div><div class=\"ln p\">진정함의 설치·운용(동법 시행령 제7조) ‒시설 내 진정함 설치의무, 용지･필기도구 및 봉함용 봉투(위원회서 정한 규격) 비치 ‒진정함 설치 시 설치장소를 위원회에 통보, 생활자가 직접 진정서를 진정함에 넣도록 함 ‒시설 소속 직원은 매일 지정된 시간에 진정함 확인 후 진정서 등을 지체없이 위원회로 송부 위원회가 보낸 서면의 열람금지(동법 시행령 제8조) 진정서의 자유로운 작성 및 제출(동법 시행령 제9조) ‒진정서 작성의사를 표명 시 방해금지 및 작성된 진정서의 열람･압수 폐기 금지 ‒생활자 징벌중(징벌조사 중 포함)이라도 진정서 또는 서면 등의 자유로운 작성･제출 보장 시설의 방문조사(동법 제24조) ‒위원회는 필요 시 시설의 방문･조사가 가능하며 이때 시설장은 필요한 편의를 제공 ‒방문조사 시 시설 직원 및 시설 생활자와 면담･구술･서면의견 진술 가능 ‒시설 직원은 면담장소에 입회할 수 있으나 녹음하거나 녹취하지 못함 시설생활자의 진정권 보장(동법 제31조) ‒시설생활자가 진정하고자 하는 경우 시설 직원은 즉시 진정서 작성에 필요한 편의를 제공 ‒시설생활자가 진정하기를 원하는 경우, 그 뜻을 즉시 위원회에 통보 ‒진정서는 즉시 위원회에 송부하고 위원회로부터 접수증명원을 발급받아 이를 진정인에게 교부 ‒진정인과 위원 등과의 면담에는 시설 직원이 참여하거나 그 내용을 청취 또는 녹취하지 못함 ‒시설직원 등은 시설생활자가 작성한 진정서 또는 서면을 열람하지 못함<\/div><div class=\"ln note\">※  사회복지시설 담당 사업부서(중앙부처, 지자체)는 시설종사자 인권보호를 위한 조치 및 가이드라인 마련할 것<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">인권침해 등 문제시설에 대한 관리강화 등<\/div><div class=\"ln p\">인권침해 등으로 정상적 운영이 불가능한 시설은 시･군･구청장이 1회 적발만으로 시설폐쇄를 명하도록 함(시행규칙 제26조의2 &lt;별표 4&gt;)<\/div><div class=\"ln note\">※인권침해로 인한 생활자 사망, 붕괴위험의 절박성 등 시설의 정상적 운영이 불가능함이 중대하고도 명백해야 하며, 시설폐쇄가 청문 등의 사유로 지연될 경우 먼저 생활자를 전원조치 한 후 시설폐쇄를 추진<\/div><div class=\"ln p\">시행규칙 제26조의2 &lt;별표 4&gt;<\/div><div class=\"ln p\">라.위반행위가 4종 이상 또는 시설거주자에 대한 학대･성폭력 등 중대한 불법행위로 인하여 시설의 정상적인 운영이 불가능하다고 인정되는 때에는 제2호의 개별기준에 불구하고 1차 위반 시에 시설의 폐쇄를 명할 수 있다.<\/div><div class=\"ln p\">시･군･구는 시설운영위원회를 활성화하고 시설과 지역사회가 상호 협력체계를 구축하는 등 민주적이고 투명한 시설운영을 통해 인권유린 문제가 발생되지 않도록 지속적인 지도･감독 실시<\/div><div class=\"ln p\">시･군･구는 시행규칙 제25조에 따른 비치서류 등 법령준수 현황을 수시로 관리 감독하기 바람<\/div><div class=\"ln p\">사회복지시설에 비치해야 할 서류(시행규칙 제25조)<\/div><div class=\"ln p\">-법인의 정관, 법인설립허가증 사본(사회복지법인 등 법인이 설치한 시설에 한함) -사회복지시설 신고증(국공립시설임은 국공립시설임을 알리는 안내문), 시설의 건축물관리대장 -시설거주자･퇴소자 명부 및 상담기록부 -시설의 운영계획서 및 예산결산서, 후원금품대장 -시설의 장과 종사자의 명부 ※개별법령에서 해당시설에 비치해야 할 서류를 규정하고 있을 경우 개별법령의 비치서류가 우선 ☞시설에 위의 서류를 비치하지 않을 경우 300만원 이하 과태료에 처함(법 제58조)<\/div><div class=\"pchip\" id=\"p34\"><span>원문 34쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=46\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">사회복지시설의 통합 설치･운영 및 시설 서비스 최저기준 시행<\/div><div class=\"ln h4\">1) 시설의 통합 설치･운영 등(법 제34조의2)<\/div><div class=\"ln p\">사회복지시설의 설치･운영과 관련하여, 지역특성과 시설분포의 실태를 고려하여 「사회복지사업법」 및 동법 제2조제1호 각 목의 법률에 따른 시설을 통합하여 하나의 시설로 설치･운영하거나 하나의 시설에서 둘 이상의 사회복지사업을 통합하여 수행할 수 있음<\/div><div class=\"ln p\">국가 또는 지방자치단체 외의 자는 통합하여 설치･운영하고자 하는 각각의 시설이나 사업에 관하여 해당관계 법령에 따라 신고하거나 허가 등을 받아야 함<\/div><div class=\"ln p\">시설의 통합 설치･운영 등에 따른 시설 및 인력 기준(시행규칙 제22조 관련)<\/div><div class=\"ln p\">1.하나의 시설에서 둘 이상의 사회복지사업을 통합하여 수행하는 경우 가.시설 및 설비기준：시설 거주자 또는 이용자의 불편을 초래하지 않는 범위에서 상호 중복되는 시설･설비를 공동으로 사용할 수 있다. 나. 인력기준：사업에 지장이 없는 범위에서 인력을 겸직하여 운영할 수 있다.<\/div><div class=\"ln p\">2)시설 서비스 최저기준(법 제43조)<\/div><div class=\"ln p\">대상시설은 「사회복지사업법」 제2조제1호 각 목의 법률에 따른 사회복지시설 및 사회복지관이며, 시설의 규모, 제공하는 서비스의 특성, 이용자 등을 고려하여 보건복지부장관이 제외할 수 있음<\/div><div class=\"ln p\">시설 서비스 적용 대상시설의 범위, 시설별 서비스 최저기준의 내용 및 적용 시기는 각 시설 담당 사업부서에서 정해 공개하도록 함<\/div><div class=\"ln p\">사회복지시설의 운영자는 보건복지부 장관이 정하는 시설의 서비스 최저기준 이상으로 서비스 수준을 유지하여야 함<\/div><div class=\"ln p\">시설의 서비스 최저기준(시행규칙 제27조)<\/div><div class=\"ln p\">제27조(시설의 서비스 최저기준) ① 법 제43조제1항에 따른 서비스 최저기준에는 다음 각 호의 사항이 포함되어야 한다. 1. 시설 이용자의 인권 2. 시설의 환경 3. 시설의 운영 4. 시설의 안전관리 5. 시설의 인력관리 6. 지역사회 연계 7. 서비스의 과정 및 결과 8. 그 밖에 서비스 최저기준 유지에 필요한 사항<\/div><div class=\"pchip\" id=\"p35\"><span>원문 35쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=47\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">사<\/div><div class=\"ln p\">국고보조금통합관리시스템(e나라도움)의 도입<\/div><div class=\"ln h4\">1) 추진배경<\/div><div class=\"ln p\">2014.12.4. 정부합동으로 국고보조금부정수급 종합대책을 마련하여 국고 보조금 개혁 방안을 추진<\/div><div class=\"ln p\">종합대책의 후속 조치로 국고보조금통합관리시스템(e나라도움)을 구축하고, 2017. 1월부터 일부 개통(2017.7월 전체 개통)하여 모든 민간보조사업자가 보조금의 교부신청, 집행 등 업무처리에 의무적으로 사용하도록 강화<\/div><div class=\"ln p\">2)e나라도움 구축 목표<\/div><div class=\"ln p\">중복･부정수급 방지<\/div><div class=\"ln p\">‒보조금 정보 통합관리로 사업유사중복 검증, 수급자격 및 지출증빙 검증, 부정징후 모니터링, 가격 검증 등 실현<\/div><div class=\"ln p\">업무 효율화<\/div><div class=\"ln p\">‒전자증빙 기반의 실시간 지급 관리, 업무 표준화, 온라인 정산 등을 통해 업무 효율성 제고<\/div><div class=\"ln p\">대국민 서비스 제고<\/div><div class=\"ln p\">‒수혜가능한 보조사업 정보 조회(대국민 맞춤형 서비스), 보조금 운영 현황 및 성과공개 서비스 개선, 투명성 제고<\/div><div class=\"ln p\">3)사회복지시설의 e나라도움 사용<\/div><div class=\"ln p\">(대상시설) 국고보조사업으로 보조금을 지원받는 사회복지시설<\/div><div class=\"ln note\">※ 국비 매칭없이 지방비로만 지원되는 보조사업은 e나라도움 사용대상 아님<\/div><div class=\"ln p\">(사용시기) 2018년부터<\/div><div class=\"ln p\">(사용방법) 사회서비스정보시스템(희망이음)을 통해 보조사업에 대한 회계처리(시스템 간 정보연계로 추가업무 최소화)<\/div><div class=\"pchip\" id=\"p36\"><span>원문 36쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=48\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">(주요변경사항)<\/div><table class=\"htbl\"><tr><td colspan=\"2\">집행 방식<\/td><td>변경 내용<\/td><\/tr><tr><td colspan=\"2\">보조금 전용카드<\/td><td>변경 없음<\/td><\/tr><tr><td rowspan=\"2\">전용카드 외<\/td><td>개인(종사자) 대상 지출<\/td><td>개인별 집행내역 등록<\/td><\/tr><tr><td>사업자 대상 지출<\/td><td>전자세금계산서 연계<\/td><\/tr><\/table><div class=\"ln h4\">4) e나라도움 사용문의<\/div><div class=\"ln p\">홈페이지(www.gosims.go.kr), 콜센터(1670-9595)<\/div><div class=\"ln p\">아<\/div><div class=\"ln p\">기타 사항<\/div><div class=\"ln p\">1)시설(법인포함) 관련 문제발생 시 신속한 보고<\/div><div class=\"ln p\">지방자치단체(시･도 및 시･군･구)는 시설 안전사고, (법인포함)관련 비리, 민원 발생 등으로 언론보도 등이 발생했을 경우 복지부 각 시설담당부서 및 사회서비스 자원과에 동시에 보고<\/div><div class=\"ln note\">※보고내용은 사건･사고 개요, 시설(법인) 현황, 주요내용, 조치경과 및 향후계획 등임<\/div><div class=\"ln p\">2)종사자 복무규정 등 제규정 제정<\/div><div class=\"ln p\">각 시설별로 종사자 복무규정 등 제규정을 제정하여 운영할 것<\/div><div class=\"ln p\">3)사회복지법인이 분사무소를 설치하여 주사무소 소재지가 아닌 타 자치단체에 시설을 운영하고자 하면 법인 관할 행정관청은 설치하고자 하는 지자체와 사전에 협의할 것<\/div><div class=\"ln p\">4)개별 시설법 및 지침에서 별도 규정하는 경우를 제외하고는, 사회복지시설 내 생활인들의 금융재산을 보관 및 관리할 시 현금보관증이나 차용증을 작성하게 하고, 유형별 시설특성 등을 감안하여 생활인들의 금융재산을 보호할 수 있는 대책을 강구하여 시행할 것(2013.12.18. 국가인권위원회 권고사항)<\/div><div class=\"pchip\" id=\"p37\"><span>원문 37쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=49\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">5)사회복지시설 기부식품 관리<\/div><div class=\"ln p\">학교 등 집단급식소를 통해 기부식품을 제공받는 사회복지시설의 장은 이용자에 급식 제공 시 시설에서 제공되는 기본 급식을 제공하는 것을 원칙으로 하여야 하며, 예비식 제공 시 이용자에 이를 반드시 사전에 고지하여야 함<\/div><div class=\"ln p\">조리되지 않은 불용 식재료 모집을 원칙으로 하며, 불가피하게 조리식품 수령 시 교차오염 등 예방을 위해 위생관리에 철저히 주의할 것<\/div><div class=\"pchip\" id=\"p38\"><span>원문 38쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=50\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><table class=\"htbl\"><tr><td>[참고] 기부식품등 제공사업 안내 지침<\/td><\/tr><tr><td>식품위생법 시행규칙 [별표 1] 식품등의 위생적인 취급에 관한 기준<br>1. 식품등을 취급하는 원료보관실･제조가공실･조리실･포장실 등의 내부는 항상 청결하게 관리하여야 한다.<br>2. 식품등의 원료 및 제품 중 부패･변질이 되기 쉬운 것은 냉동･냉장시설에 보관･관리하여야 한다.<br>3. 식품등의 보관･운반･진열시에는 식품등의 기준 및 규격이 정하고 있는 보존 및 유통기준에 적합하도록 관리하여야 하고, 이 경우 냉동･냉장시설 및 운반시설은 항상 정상적으로 작동시켜야 한다.<br>4. 식품등의 제조･가공･조리 또는 포장에 직접 종사하는 사람은 위생모를 착용하는 등 개인위생관리를 철저히 하여야 한다.<br>5. 제조･가공(수입품을 포함한다)하여 최소판매 단위로 포장(위생상 위해가 발생할 우려가 없도록 포장되고, 제품의 용기･포장에 법 제10조에 적합한 표시가 되어 있는 것을 말한다)된 식품 또는 식품첨가물을 허가를 받지 아니하거나 신고를 하지 아니하고 판매의 목적으로 포장을 뜯어 분할하여 판매하여서는 아니 된다. 다만, 컵라면, 일회용 다류, 그 밖의 음식류에 뜨거운 물을 부어주거나, 호빵 등을 따뜻하게 데워 판매하기 위하여 분할하는 경우는 제외한다.<br>6. 식품등의 제조･가공･조리에 직접 사용되는 기계･기구 및 음식기는 사용 후에 세척･살균하는 등 항상 청결하게 유지･관리하여야 하며, 어류･육류･채소류를 취급하는 칼･도마는 각각 구분하여 사용하여야 한다.<br>7. 소비기한이 경과된 식품 등을 판매하거나 판매의 목적으로 진열･보관하여서는 아니된다.<br>학교 등 집단급식소 예비식 기부시 위생관리 기준<br>1. 집단급식소<br>- 급식 예비식 수령 전 급식소의 조리식품 보관상태 확인<br><table class=\"htbl\"><tr><td colspan=\"2\">구분<\/td><td>주요 내용<\/td><\/tr><tr><td colspan=\"2\">조리식품<\/td><td>• 당일 조리하여 배식대에 제공되지 않은 식품에 한함<br>• 조리된 식품은 특성의 따라 냉장 5℃이하, 온장 60℃이상으로 보관되어야 하며, 실온에 보관된 식품은 폐기<br>• 온장 유지 식품을 냉장으로 기부하려는 경우에는 신속히 5℃이하로 식혀 냉장보관 후 제공<\/td><\/tr><tr><td colspan=\"2\">보관용기<\/td><td>• 보관용기(식품에 접촉하는 용기)는 식품용 용기를 사용<br>• 교차오염 예방을 위하여 뚜껑 있는 용기 등을 사용하여 밀폐 보관<\/td><\/tr><\/table><br>2. 시설 및 개인이용자<br>- 급식 예비식 제공 전 주의사항 안내<br><table class=\"htbl\"><tr><td>구분<\/td><td>주요 내용<\/td><\/tr><tr><td>시설<\/td><td>• 이용자에게 제공하기 전까지 조리식품의 냉장.온장 온도 유지<br>• 냉장 유지 식품을 가열하여 제공하는 경우에는 충분히 재가열 후 제공<br>• 수령한 식품은 당일 이용자에 제공<\/td><\/tr><tr><td>개인(소포장)<\/td><td>• 취식 전까지 냉장 보관하도록 하며, 수령 후 2시간 이내에 섭취<\/td><\/tr><\/table><br>3. 기부식품등 제공사업장<br>- 급식 예비식 운반 및 소포장 시 기준 준수<br><table class=\"htbl\"><tr><td colspan=\"2\">구분<\/td><td>주요 내용<\/td><\/tr><tr><td rowspan=\"3\">설비<\/td><td>운반<\/td><td>• 냉장.온장 식품을 운반 할 때에는 냉장 5℃ 이하, 온장 60℃ 이상 유지<br>• 냉장.온장 식품을 운반 할 때에는 일정한 온도 관리를 위해 해당 온도가 유지 가능한 설비를 이용  * 냉장탑차, 차량용 냉.온장고 등<br>• 아이스박스 등 온도계가 설치되어 있지 않은 장비를 사용 할 경우 예비식 운반 전 온도계를 사용하여 내부 온도가 유지되는지 확인<\/td><\/tr><tr><td>보관<\/td><td>• 배분 전 또는 소포장 전후 식품을 보관할 때에는 일정한 온도를 유지할 수 있는 충분한 용량의 냉.온장 설비 구비 (단, 당일 수령 제품은 당일 이용자에 배분)<\/td><\/tr><tr><td>용기<\/td><td>• 운반 및 소포장 용기(식품에 접촉하는 용기)는 식품용 용기를 사용<br>• 교차오염 예방을 위하여 뚜껑 있는 용기 등을 사용하여 밀폐 보관<br>• 일회용 용기를 사용할 때에는 밀폐용기를 사용하거나, 용기를 밀폐할 수 있는 포장설비 등 구비<br>• 다회용 용기를 사용할 때에는 용기를 세척할 수 있는 별도의 세척시설 구비<\/td><\/tr><tr><td>시설<\/td><td>포장실<\/td><td>• 외부 오염물질을 차단할 수 있도록 분리된 별도의 공간<br>• 식품 취급(소포장, 소분, 관능검사 등) 이외 다른 용도로 함께 사용될 경우고정된 벽체, 별도의 출입구 등을 설치하여 공간을 분리<\/td><\/tr><tr><td rowspan=\"2\">개인<br>위생<\/td><td>건강<br>진단<\/td><td>• 소포장에 참여하는 모든 인력(전담인력, 보조인력, 단기봉사자 등)은 매년<br>1회 건강진단 실시<\/td><\/tr><tr><td>복장<\/td><td>• 위생복, 위생모, 마스크, 위생장갑은 반드시 착용<br>• 위생복 등은 주기적으로 세척˙교체관리 하여 청결을 유지해야 하며, 별도의 공간에 위생적으로 보관<\/td><\/tr><\/table><\/td><\/tr><tr><td><\/td><\/tr><\/table>", "pages": [{"p": 19, "t": "2\n사회복지시설 운영관련 참고사항\n가\n사회복지시설의 시설장 및 종사자의 자격 등\n1)시설장(법 제35조 관련)\n(자격사항) 사회복지시설의 장은 「사회복지사업법」 및 개별법령 등에 명시된 시설의 장의 결격사유에 해당되지 않아야 하고, 각 시설유형이 요구하는 자격기준을 갖춘 자여야 함\n(상근의무) 사회복지시설의 장은 상근의무가 있으므로 수시로 확인 요망\n2)종사자(법 제35조의2 관련)\n(자격사항) 「사회복지사업법」 및 개별법령 등에 명시된 종사자의 결격사유에 해당 하지 않아야 하며, 유형별 시설에서 요구하는 자격요건 등을 갖추어야 함\n☞ 개별 법령에서 결격사유 등을 별도로 정하는 경우를 제외하고는 「사회복지사업법」에 따름"}, {"p": 21, "t": "시설장 및 종사자의 결격사유\n■ 시설장의 경우 법 제35조제2항 1.제19조제1항제1호, 제1호의2부터 제1호의9까지 및 제2호의2부터 제2호의4까지의 어느 하나에 해당하는 사람 2.제22조에 따른 해임명령에 따라 해임된 날부터 5년이 지나지 아니한 사람 3.사회복지분야의 6급 이상 공무원으로 재직하다 퇴직한 지 3년이 경과하지 아니한 사람 중에서 퇴직 전 5년 동안 소속하였던 기초자치단체가 관할하는 시설의 장이 되고자 하는 사람 *법률 제14884호(2017.12.20. 시행) 부칙 제2조(임원의 결격사유 등에 관한 적용례)에 따라 제35조제2항제3호의 개정 규정은 이 법 시행 후 최초로 퇴직하는 공무원부터 적용함. ※이는 사회복지시설의 1차 감독기관인 시･군･구와 그 지도감독을 받는 기초지자체 관할 사회복지시설 간 업무유착 가능성을 차단하기 위해 이른바 ‘도가니 사건’을 계기로 개정한 조항인 바, 공무원이 퇴직 후 재취업을 위한 사회복지시설에 특혜를 부여하거나, 시설에 재취업 후 전 소속기관에 부당한 영향력을 행사하는 등의 부작용 등을 예방하고, 지방자치단체의 사회복지시설 지도감독권이 손상되지 않도록 하기 위한 것임 ■ 종사자의 경우 법 제35조의2제2항 1.제19조제1항제1호의7부터 제1호의9까지의 어느 하나에 해당하는 사람 2.제1호에도 불구하고 종사자로 재직하는 동안 시설이용자를 대상으로 「성폭력범죄의 처벌 등에 관한 특례법」 제2조에 따른 성폭력범죄 및 「아동･청소년의 성보호에 관한 법률」 제2조제2호에 따른 아동･청소년대상 성범죄를 저질러 금고 이상의 형 또는 치료감호를 선고받고 그 형이 확정된 사람"}, {"p": 22, "t": "사회복지시설 장의 상근의무\n상근의무의 정의 ‒원칙적으로 상근의무란, 휴일 기타 근무를 요하지 않은 날을 제외하고 일정한 근무계획 하에 매일 소정의 근무시간 중 상시 그 직무에 종사하여야 하는 것을 말함 공무원의 상근시간：평일 09시∼18시, 토요일 09시∼13시(주 5일 시행 전) 겸직 허용 범위 ‒공무원의 경우 영리 업무에 종사하는 것은 금지되어 있음.(「국가공무원 복무규정」 제25조) ‒비영리 업무라 하더라도 담당 직무 수행에 지장이 없는 경우에 한해서 소속기관장의 사전허가를 받아야 가능(「국가공무원 복무규정」 제26조) ‒따라서 공무원에 준하여 그 상근 관리가 이루어지는 시설장의 경우에도 영리를 목적으로 하는 업무는 당연히 그 종사가 불가능할 것이며, 영리업무에 해당하지 않는 경우라 할지라도 해당 시설의 운영에 지장이 없는 경우에 한하여 겸직이 가능할 것임 ‒참고로, 「사회복지사업법」 제35조의2에 따라 시설장의 채용 주체는 사회복지법인 등 설치･운영자이므로 시설장이 겸직을 하고자 할 때는 겸직 업무의 영리업무 해당 및 시설운영 지장 여부 등에 대해 법인 등 채용주체에 1차적인 판단을 받아 소관 지방자치단체에 보고하여야 할 것임 ‒만일 법인 등에서 판단을 잘못하여 그 겸직업무가 영리업무에 해당하거나 시설운영에 지장이 있는 경우, 「사회복지사업법」 제40조제1항제4호 등에 해당하여 행정처분(시설장 교체까지 가능) 대상이 될 것이므로, 사전에 시･군･구청장에게 겸직 가능 여부를 협의해 올 경우, 시･군･구청장은 시설장의 상근의무 및 겸직허가 제도의 취지를 종합적으로 고려하여 개별적･구체적으로 검토하여야 할 것임 ‒아울러, 「사회복지사업법」 제42조에서는 사회복지사업을 하는 자가 거짓이나 부정한 방법으로 보조금을 받거나 목적 외의 용도로 보조금을 사용했을 경우 국가나 지방자치단체가 관련 보조금의 반환을 명할 수 있도록 규정하고 있으므로, 정부(지자체 포함) 보조금을 통해 인건비를 지원받는 시설의 경우 국민의 세금이 낭비되는 일이 없도록 상근의무를 엄정하게 적용하여 시설 지도감독에 소홀함이 없도록 관리하여야 할 것임 명예직, 겸임교수, 시간강사 등 영리추구가 현저하지 않거나 영리업무에 해당하지 않은 직으로서, 겸직을 하더라도 시설의 정상적인 운영이 가능한 경우에는 겸직이 가능* ※단, 출강* 등 외출 시에는 근무상황부에 기록하도록 하며 과도한 출강 등으로 정상적인 시설 운영이 불가능할 경우에는 상근의무 위반에 해당 *참고로, 공무원의 경우 외부 강의와 관련하여 근무시간 외의 경우 업무수행에 지장을 초래하지 않는 범위 안에서 허용이 가능하지만, 근무시간 내 외부강의는 원칙적으로 금하면서, 해당 공무원의 담당 직무수행과 관련 있는 경우에 해당기관의 기능수행 및 정책수행의 목적상 필요한 경우, 기타 해당기관의 장이 필요하다고 인정하는 경우에 한하여 허용하고 있음 시설종별 협회 비상근 임원으로 선임되어 관련 업무를 수행하는 경우 겸직 가능 ※시설장의 상근 또는 타 직종 겸직과 관련하여 시설관련 개별 법령이 따로 있는 경우 위 기준보다 우선 함"}, {"p": 23, "t": "사회복지시설장의 근로자성 인정 여부\n사회복지시설의 장이 임용절차, 보수, 근로계약서와 사용자의 지휘･감독 유무 등 제반사정을 종합적으로 살펴 근로기준법상 근로자로 인정될 경우에는 고용보험에 가입됨 - 사회복지법인(비영리법인 포함)이 설치･운영하는 시설에 채용･임명된 사회복지시설의 장이 시설 운영과 관련하여 법인으로부터 구체적인 지휘･감독을 받는 경우 근로자성이 인정될 수 있음 ※ 사회복지시설의 설치 주체인 개인이 시설장을 겸임하는 경우는 제외 <근로자성 판단 기준> ㅇ 「근로기준법」 제2조는 근로자를 “직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람”으로 정의 ㅇ 「근로기준법」 상 근로자에 해당하는지 여부는 계약의 형식이 고용계약인지 도급계약인지보다 그 실질에 있어 근로자가 사업 또는 사업장에 임금을 목적으로 종속적인 관계에서 사용자에게 근로를 제공하였는지 여부에 따라 판단 <근로자성 판단 기준> ㅇ 「근로기준법」 제2조는 근로자를 “직업의 종류와 관계없이 임금을 목적으로 사업이나 사업장에 근로를 제공하는 사람”으로 정의 ㅇ 「근로기준법」 상 근로자에 해당하는지 여부는 계약의 형식이 고용계약인지 도급계약인지보다 그 실질에 있어 근로자가 사업 또는 사업장에 임금을 목적으로 종속적인 관계에서 사용자에게 근로를 제공하였는지 여부에 따라 판단 ㅇ 종속적인 관계가 있는지 여부는 ①업무 내용을 사용자가 정하고, ②취업규칙 또는 복무(인사)규정 등의 적용을 받으며, ③업무수행 과정에서 사용자가 상당한 지휘･감독을 하는지, ④사용자가 근무시간과 근무장소를 지정하고 근로자가 이에 구속을 받는지, ⑤노무제공자가 스스로 비품･원자재나 작업도구 등을 소유하거나 제3자를 고용하여 업무를 대행케 하는 등 독립하여 자신의 계산으로 사업을 영위할 수 있는지, ⑥노무 제공을 통한 이윤의 창출과 손실의 초래 등 위험을 스스로 안고 있는지, ⑦보수의 성격이 근로 자체의 대상적 성격인지, 기본급이나 고정급이 정하여졌는지 및 근로소득세의 원천징수 여부 등 보수에 관한 사항, ⑧근로 제공 관계의 계속성과 사용자에 대한 전속성의 유무와 그 정도, ⑨사회보장제도에 관한 법령에서 근로자로서 지위를 인정받는지 등의 경제적･사회적 여러 조건을 종합하여 판단(대법원 2006.12.7. 선고 2004다29736 판결 등 참조). 따라서, 고용보험 가입을 위해서는 사회복지시설장은 사업장 관할 근로복지공단의 안내에 따라 근로자성을 입증할 자료를 구비･제출하여 근로자성 여부를 판단 받을 필요가 있음 관련 행정해석 < 고용노동부 고용서비스지원과-1730, 2009.7.8. > 보육시설 또는 복지관의 실질적인 운영을 위하여 지방자치단체장 또는 수탁업체가 시설의 원장을 임명하여 동 원장으로 하여금 종사자에 대한 임명 및 복무관리를 하도록 하고, 원장명의로 사업자 등록을 하여 대외적으로 대표권을 행사하도록 하고 있다면 동 원장은 고용보험의 피보험자가 되는 근로자에 해당되지 않는 것으로 판단됨 다만, 지방자치단체에서 자체 또는 위탁운영하고 있는 경우 원장과 수탁업체 대표 또는 지방자치단체장과의 별도의 근로계약서를 작성하는 등 실질적인 중간관리자의 성격이라면 고용보험 피보험자격을 취득 할 수 있다고 판단됨 < 중앙노동위원회 결정(2000.7.6, 중노위2000부해 161) > 법인으로부터 임명된 사회복지법인 원장에 대하여 일정한 보수를 받는다고 하여 이를 당연히 근로기준법상 임금이라고 할 수 없고, 구체적이고 직접적으로 업무지휘, 감독을 받지 않은 사회복지시설장은 사용종속관계에 있는 근로자로 볼 수 없음 ※ [고용보험] 가입대상(고용보험법 제8조), 사용자･근로자의 정의(근로기준법 제2조) ※ 건강보험, 국민연금 관련 사업주 및 근로자의 구분은 별도 기준 적용\n"}, {"p": 24, "t": "나\n사회복지시설 운영위원회(법 제36조)\n1)시설운영위원회 설치목적\n사회복지시설 운영의 민주성･투명성 제고 및 시설이용･생활자의 권익 향상 등을 위해 사회복지 시설 운영위원회(이하 시설운영위원회)를 설치･운영함\n2)시설운영위원회 설치 대상시설(법 제36조제1항)\n가)모든 사회복지시설은 운영위원회 설치 필요\n나) 예외적으로 공동운영위원회를 둘 수 있는 경우\n사회복지 생활시설\n‒생활자 수가 20인 미만 시설의 경우\n•3개소 당 1개 운영위원회를 원칙으로 하되, 해당 시･군･구에 1개소만 있을 경우 해당 시설에 운영위원회 1개 운영\n생활자 수가 20인 이상 시설\n‒1개소 당 1개 운영위원회 운영하되, 위원 수는 시설 생활자 수를 고려하여 시장･군수･구청장이 결정\n☞지자체장은 생활자 수가 100인 이상의 대형시설, 정신요양시설, 장애인시설 등에서 운영 위원회를 구성할 때 인권보호 강화 등의 측면에서 반드시 관계공무원을 운영위원회 위원으로 참여시킬 것\n사회복지이용시설：시장･군수･구청장이 공동으로 운영위원회를 두는 것이 필요하다고 인정하는 경우에 3개 이내의 시설에 1개 공동위원회 가능\n3)시설운영위원회의 구성(법 제36조제2항 및 시행규칙 제24조제1항)\n가)위원회는 위원장 1인을 포함하여 5인 이상 15인 이하의 위원으로 구성하고, 법 제36조 제2항 각 호 중 같은 호에 해당하는 위원이 2명을 초과해서는 아니 됨\n나)위원회의 위원은 아래에 해당하는 자 중에서 관할 시장･군수･구청장이 임명 또는 위촉\n시설의 장"}, {"p": 25, "t": "시설 거주자(이용자) 대표\n시설 거주자(이용자)의 보호자 대표\n시설 종사자의 대표\n해당 시･군･구 소속의 사회복지업무를 담당하는 공무원\n후원자 대표 또는 지역주민\n공익단체에서 추천한 사람\n*공익단체는 「비영리민간단체 지원법」 제2조에 따른 비영리민간단체를 말함\n그 밖에 시설의 운영 또는 사회복지에 관하여 전문적인 지식과 경험이 풍부한 자\n※① 시설장의 친인척, ② 설치･운영자인 법인의 임원 등 특수관계가 명확한 자(시설장 제외)는 위원으로 임명･위촉하지 않도록 할 것\n※「지방자치법」 제43조제5항에 따라 지방의회의원은 지방자치단체로부터 운영비 등을 보조받는 사회복지사업을 하는 자가 설치･운영하는 사회복지시설의 운영위원회 위원이 될 수 없음에 유의할 것(법제처 해석, 17-0433)\nQ: 시설 운영위원회 각 호의 위원당 몇 명까지 임명･위촉이 가능한가요?\nA: 사회복지사업법 제36조제2항 각 호의 위원당 2명까지 가능합니다.\n\n다)위원장은 호선, 위원의 임기는 3년으로 하되 연임할 수 있고 보궐위원의 임기는 전임자의 잔임 기간으로 함\n4)시설운영위원회의 심의사항(법 제36조제1항)\n가)시설운영계획의 수립･평가에 관한 사항\n나)사회복지프로그램의 개발･평가에 관한 사항\n다)시설종사자의 근무환경 개선에 관한 사항\n라)시설거주자의 생활환경 개선 및 고충처리 등에 관한 사항\n마)시설 종사자와 거주자의 인권보호 및 권익증진에 관한 사항"}, {"p": 26, "t": "바)시설과 지역사회와의 협력에 관한 사항\n사)그 밖에 시설의 장이 운영위원회의 회의에 부치는 사항\n사회복지시설 운영위원회 심의 관련\n☞사회복지시설 운영위원회는 심의기능을 하는 바, 의사결정의 주체가 다수인 관계로 다수의 의견을 모으는 행위의 형식으로 관련 위원회 규정에서 “의결”이라는 용어를 사용하더라도 위원회의 의결사항이 시설의 장에 대한 법적인 구속력이 있는 결정으로는 보기 어려움 ‒다만, 시설의 장은 위원회의 순기능적 측면을 감안하여 그 심의사항을 배척할만한 합리적인 이유가 없는 한 위원회의 심의결과를 존중하는 것이 바람직하며, ‒지자체는 위원회의 심의사항과 시설장의 의견이 상반되는 등 논란이 되는 사항과 위원회에서 논의된 사항 중 합리적인 사항에 대해서는 관련 법령과 지침 등을 토대로 면밀히 검토하여 시･군･구 복지정책에 반영될 수 있도록 하고, 필요할 경우 시･도 및 보건복지부 등에 정책건의\n5)시설운영위원회 보고사항(법 제36조제3항)\n※아래 사항 등을 운영위원회에 사전 보고하는 것으로, 이는 위원회의 심의를 요하는 것은 아님\n시설의 회계 및 예산･결산에 관한 사항\n후원금 조성 및 집행에 관한 사항\n그 밖에 시설운영과 관련된 사건･사고에 관한 사항\n☞국가감염병 확산 등 특수한 상황이 있을 경우, 서면보고로 갈음 가능\n6)시설운영위원회 운영\n가)회의의 개최\n정기회의\n‒분기별 1회 이상 정기회의 개최\n수시회의\n‒시설운영위원회 운영규칙에 규정한 회의개최 요건에 해당할 경우(재적위원 1/3의 요청이 있을 경우 등) 수시회의 개최\n☞시설 운영위원회 운영에 필요한 세부 운영규칙은 법령 및 지침에 위반하지 않는 범위 내에서 시설 결정으로 제･개정 가능(단, 법령에 규정되어 있는 사항은 반드시 운영규칙에 포함 시킬 것)"}, {"p": 27, "t": "회의 결과의 공개\n‒위원회의 회의는 시설생활자, 시설종사자 등에게 공개를 원칙으로 하되, 개인 정보보호 등 불가피한 사유 시 위원장이 비공개결정을 할 수 있음(비공개사유는 공개해야 함)\n회의는 대면심의가 원칙이며 참여자를 확인할 수 있는 원격영상회의는 허용\n사회복지시설 운영위원회 회의 관련\n☞시설운영위원회는 사회복지시설과 관련한 다양한 사항을 “심의”하기 위해서 설치･운영되는 것임 ‒“심의”는 “심사하고 토의함”이라는 사전적 의미가 있는 점, 위원회 회의를 정기 또는 수시로 개최하고 그 회의를 공개토록 규정하고 있는 점, ‒위원회 설치의 법률 취지가 다양한 경력을 가지고 있는 위원들이 특정사안에 대해서 서로의 의견을 교환하고 논의함으로써 시설운영의 민주성･투명성을 제고하고, 생활자 등의 권익을 향상시키기 위한 것이라는 점을 종합적으로 고려하면, 대면회의가 적절함 ☞또한, 다음의 요건을 모두 충족하는 경우, 원격영상회의와 같은 전자적 방법을 활용하여 심의 가능, 이 경우에는 주무관청의 지도･감독 및 분쟁소지 해소를 위하여 영상회의를 녹화하여 보관\n나) 회의록의 작성 및 보고\n위원회의 간사는 매년 1회 정기 및 수시회의의 결과를 간략하게 요약하여 정본은 위원회에 보관하고 사본 1부는 시･군･구청장에게 제출할 것\n* 「사회복지법인 및 사회복지시설 재무회계규칙」 제10조제2항에 따른 예산 제출 시 함께 제출\n시･군･구에 제출된 회의록 중 정책건의가 필요한 사항은 매년 1회(매년 12.1.) 시･도를 경유하여 보건복지부 사회서비스자원과 및 개별시설과로 보고\n다) 기타 사항\n위원회 운영에 필요한 예산은 원칙적으로 시설 운영비에서 지출\n회의수당, 회의장소 등 위원회 운영에 세부적인 사항은 운영위원회 자율적으로 결정"}, {"p": 28, "t": "다\n시설운영의 투명성 강화\n1) 사회복지시설 종사자(이하 ‘시설장’ 포함) 인건비 보조금 지급 연령 상한기준(시행일：2002년 1월 1일)\n(정부의 인건비 보조금 지급 연령 상한기준) 정부(지자체)에서 시설장 및 종사자의 인건비를 지원하는 시설에 대해서는 아래와 같이 인건비 지원기준을 정할 수 있으며, 기준을 초과하여 계속 근무하는 종사자의 인건비는 시설이 자체적으로 지급하여야 함.\n‒지급상한： |  | 시설장  65세(단, 2002년 1월 1일부터 현재까지 재직 중인 설립자* 및 설립자의 직계가족 1세대에 한해 만 70세)\n\n |  | 종사자 60세 *조리원 65세\n\n※ 조리원과 같이 구인난이 심한 직종 및 도서 지역의 경우, 관할 지방자치단체의 자체적(재량) 판단하에 60세 초과 종사자 채용 및 인건비 지급 가능\n*원칙적으로 설립자의 범위는 「사회복지사업법」 제34조에 따른 사회복지시설 설치･운영 신고 주체이자 동시에 시설장인 자를 의미하나, 법인 설치시설의 경우에는 설치･운영 신고 주체와 시설장이 동일할 수 없기 때문에 지자체에서는 설립자의 의미에 대해 실질적인 측면(개인재산 출연여부 및 규모 등)을 고려하여 현재 재직 중인 시설장에게 설립자 지위 인정이 가능한지 판단해야 함. 다만, 설립자의 시설 사유화 의식 탈피 및 조직쇄신 등 제도 도입 취지에 반하지 않도록 유의\n**설립자의 배우자 및 그 자녀(또는 그 자녀의 배우자)\n‒위 지급상한기준에 대해서는 각 지자체에서 사회통념 및 지자체 재정여건 등이 허용되는 범위 내에서 상향조정할 수 있으며, 특히 농촌 취약지 등 지역적 특성 및 종사자 직군별 업무 특수성 등을 감안하여 지자체별로 개별 특례를 마련할 수 있음."}, {"p": 29, "t": "【특례】 60세 초과 종사자에 대한 인건비 보조금 지원이 가능한 경우\n① 공개모집 절차를 2회 이상 진행했음에도 불구하고 응시자가 없는 경우 ‒지자체 홈페이지, 워크넷, 복지넷, 희망이음* 중 2곳  이상의 사이트에 채용 관련 사항을 15일 이상 공개모집하였으나 응시자가 없는 경우 해당 결과를 주무관청에 제출 후 협의 * 60세 초과 ‘대체’ 종사자를 특례 채용하는 경우 1회 공모 후 절차에 따라 채용 가능 ‒60세를 초과한 종사자의 특례 근로계약은 1년으로 하되, 63세까지는 공모절차 없이 재계약 가능하며, 63세를 초과하여 근무하고자 하는 경우에는 위의 방식으로 공개모집 절차를 진행하여 응시자가 없는 경우 해당 결과를 주무관청에 제출 후 협의하여 65세까지 계약 연장 및 인건비 보조금 지원 가능 ※ 60세 초과 종사자를 특례 채용한 경우에는 특례 근로계약 체결 당시의 호봉을 초과할 수 없음 ② 60세 초과 종사자의 기존 인건비 내에서 청년 인력(만 29세 이하)을 채용하는 경우 ‒신규 채용 및 인력 운용 계획을
