1993.12.27. | 보건사회부령 | 제922호\n일부개정 | 1998. 1. 7. | 보건복지부령 | 제57호\n일부개정 | 1999. 3.11. | 보건복지부령 | 제98호\n일부개정 | 2005. 7.15. | 보건복지부령 | 제323호\n타법개정 | 2008. 3. 3. | 보건복지가족부령 | 제1호\n일부개정 | 2009. 2. 5. | 보건복지가족부령 | 제91호\n타법개정 | 2010. 3.19. | 보건복지부령 | 제1호\n일부개정 | 2012. 8. 7. | 보건복지부령 | 제152호\n타법개정 | 2012. 8.31. | 보건복지부령 | 제269호\n일부개정 | 2012. 8. 7. | 보건복지부령 | 제152호\n타법개정 | 2015. 1. 5. | 보건복지부령 | 제283호\n일부개정 | 2015.12.24. | 보건복지부령 | 제377호\n제정 | 1988. 2. 8. | 보건사회부령 | 제813호\n일부개정 | 2017. 2.14. | 보건복지부령 | 제480호\n일부개정 | 2018. 3.30. | 보건복지부령 | 제565호\n타법개정 | 2018.12.28. | 보건복지부령 | 제606호\n일부개정 | 2019. 6.12. | 보건복지부령 | 제642호\n타법개정 | 2019. 9.27. | 보건복지부령 | 제672호\n일부개정 | 2020. 1. 7. | 보건복지부령 | 제701호\n일부개정 | 2020. 5. 6. | 보건복지부령 | 제724호\n일부개정 | 2021. 9.30. | 보건복지부령 | 제831호\n일부개정 | 2022.12.28. | 보건복지부령 | 제928호\n제1장 총칙\n제1조(목적) 이 규칙은 「사회복지사업법」 제23조제4항, 제34조제4항, 제45조제2항 및 제51조제2항에 따라 사회복지법인 및 사회복지시설의 재무･회계, 후원금관리 및 회계감사에 관한 사항을 규정하여 재무･회계, 후원금관리 및 회계감사의 명확성･공정성･투명성을 기함으로써 사회복지법인 및 사회복지시설의 합리적인 운영에 기여함을 목적으로 한다. <개정 2012. 8. 7., 2019. 6. 12.>\n[전문개정 2005. 7. 15.]\n제2조(재무･회계운영의 기본원칙) 사회복지법인(이하 “법인”이라 한다) 및 사회복지시설(법인이 설치･운영하는 사회복지시설을 포함하며, 이하 “시설”이라 한다)의 재무･회계는 그 설립목적에 따라 건전하게 운영되어야 한다. <개정 2012. 8. 7.>"}, {"p": 158, "t": "제2조의2(다른 법령과의 관계) 법인 및 시설의 재무 및 회계 처리에 관하여 다른 법령에 특별한 규정이 있는 경우를 제외하고는 이 규칙이 정하는 바에 따른다.\n[본조신설 2012. 8. 7.]\n제3조(회계연도) 법인 및 시설의 회계연도는 정부의 회계연도에 따른다. 다만, 「영유아보육법」 제2조에 따른 어린이집의 회계연도는 매년 3월 1일에 시작하여 다음 연도 2월 말일에 종료한다. <개정 2012. 8. 7., 2015. 12. 24.>\n제4조(회계연도 소속구분) 법인 및 시설의 수입 및 지출의 발생과 자산 및 부채의 증감･변동에 관하여는 그 원인이 되는 사실이 발생한 날을 기준으로 하여 연도소속을 구분한다. 다만, 그 사실이 발생한 날을 정할 수 없는 경우에는 그 사실을 확인한 날을 기준으로 하여 연도소속을 구분한다. <개정 2012. 8. 7.>\n제5조(출납기한) 1회계연도에 속하는 법인 및 시설의 세입･세출의 출납은 회계 연도가 끝나는 날까지 완결하여야 한다. <개정 1993. 12. 27., 2012. 8. 7., 2015. 12. 24.>\n[제목개정 1998. 1. 7.]\n제6조(회계의 구분) ① 이 규칙에서의 회계는 법인의 업무전반에 관한 회계(이하 “법인회계”라 한다), 시설의 운영에 관한 회계(이하 “시설회계”라 한다) 및 법인이 수행하는 수익사업에 관한 회계(이하 “수익사업회계”라 한다)로 구분한다.\n② 법인의 회계는 법인회계, 해당 법인이 설치･운영하는 시설의 시설회계 및 수익사업회계로 구분하여야 하며, 시설의 회계는 해당 시설의 시설회계로 한다.\n[전문개정 2012. 8. 7.]\n제6조의2(정보통신매체에 의한 재무･회계처리) ① 법인 및 시설의 재무･회계는 컴퓨터 회계프로그램으로 처리할 수 있다. <개정 2012. 8. 7.>\n② 보건복지부장관은 법인 및 시설의 재무･회계업무의 효율성 및 투명성을 높이기 위하여 「사회복지사업법」 제6조의2제2항에 따른 정보시스템으로서 법인 및 시설의 재무회계를 처리하기 위한 정보시스템을 구축･운영할 수 있다. <신설 2012. 8. 7.>\n③ 보건복지부장관, 시･도지사, 시장(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」 제11조제2항에 따른 행정시장을 포함한다. 이하 같다)･군수･구청장(자치구의 구청장을 말한다. 이하 같다)은 법인 또는 시설에 대하여 제2항에 따른 시스템을 사용할 것을 권장할 수 있다. <신설 2012. 8. 7., 2015. 12. 24., 2018. 3. 30.>"}, {"p": 159, "t": "④ 「사회복지사업법」 제42조에 따른 보조금을 받는 법인 및 시설과 보조금을 받지 아니하는 시설로서 「노인복지법」 제31조에 따른 노인복지시설 중 「노인장기요양보험법」 제31조에 따라 장기요양기관으로 지정받은 시설(이하 “노인장기요양기관”이라 한다)은 제1항에 따른 컴퓨터 회계프로그램 중 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템 또는 제2항에 따른 정보시스템을 사용하여 재무･회계를 처리하여야 한다. 다만, 보건복지부장관이 정하는 법인 및 시설은 그러하지 아니하다. <신설 2012. 8. 7., 2018. 3. 30.>\n⑤ 제1항에 따른 컴퓨터 회계프로그램 또는 제2항에 따른 시스템에 의하여 전자장부를 사용하는 경우에는 제24조에 따른 회계장부를 둔 것으로 본다. <개정 2012. 8. 7.>\n[본조신설 2005. 7. 15.]\n[시행일] 제6조의2제4항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호･제3호의 서비스를 제공하는 노인장기요양기관(이하 “주･야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호･제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주･야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일"}, {"p": 160, "t": "제2장 예산과 결산\n제1절 예산\n제7조(세입･세출의 정의) 1회계연도의 모든 수입을 세입으로 하고, 모든 지출을 세출로 한다.\n제8조(예산총계주의원칙) 세입과 세출은 모두 예산에 계상하여야 한다.\n[전문개정 1998. 1. 7.]\n제9조(예산편성지침) ① 법인의 대표이사는 제2조의 취지에 따라 매 회계연도 개시 1월전까지 그 법인과 해당 법인이 설치･운영하는 시설의 예산편성 지침을 정하여야 한다. <개정 1998. 1. 7., 2012. 8. 7.>\n② 법인 또는 시설의 소재지를 관할하는 시장･군수･구청장은 특히 필요하다고 인정되는 사항에 관하여는 예산편성지침을 정하여 매 회계연도 개시 2월전까지 법인 및 시설에 통보할 수 있다. <개정 1998. 1. 7., 2012. 8. 7., 2015. 12. 24.>\n[제목개정 2012. 8. 7.]\n제10조(예산의 편성 및 결정절차) ① 법인의 대표이사 및 시설의 장은 예산을 편성하여 각각 법인 이사회의 의결 및 「사회복지사업법」 제36조에 따른 운영위원회 또는 「영유아보육법」 제25조에 따른 어린이집운영위원회(이하 “시설운영위원회”라 한다)에의 보고를 거쳐 확정한다. 다만, 법인이 설치･운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐 확정한다. <신설 2012. 8. 7.>\n② 법인의 대표이사 및 시설의 장은 제1항에 따라 확정한 예산을 매 회계연도 개시 5일전까지 관할 시장･군수･구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. <개정 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.>\n③ 제1항에 따라 예산을 편성할 경우 법인회계와 시설회계의 예산은 별표 1부터 별표 4까지에 따른 세입･세출예산과목 구분에 따라 편성해야 한다. 다만, 다음 각 호의 시설은 각 호에서 정하는 바에 따라 편성한다. <개정 2009. 2. 5., 2010. 3. 19., 2012. 8. 7., 2018. 3. 30., 2022. 12. 28.>"}, {"p": 161, "t": "1. 다음 각 목의 시설: 별표 5 및 별표 6에 따른 세입･세출예산과목 구분에 따라 편성\n가. 「사회복지사업법」 제34조의5에 따른 사회복지관\n나. 「노인복지법」 제36조제1항제1호에 따른 노인복지관\n다. 「장애인복지법」 제58조제1항제2호에 따른 장애인 지역사회재활시설\n라. 「아동복지법」 제44조의2에 따른 다함께돌봄센터\n마. 「아동복지법」 제52조제1항제8호에 따른 지역아동센터\n바. 그 밖에 보건복지부장관이 정하여 고시하는 시설\n2. 「영유아보육법」 제2조에 따른 어린이집: 별표 7 및 별표 8에 따른 세입･세출예산과목 구분에 따라 편성\n3. 노인장기요양기관: 별표 9의 세입예산과목 구분 및 별표 10의 세출예산과목 구분에 따라 편성하되, 세출예산을 편성하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성\n4. 삭제 <2012. 8. 7.>\n④ 시장･군수･구청장은 제2항에 따라 예산을 제출받은 때에는 20일 이내에 법인과 시설의 회계별 세입･세출명세서를 시(「제주특별자치도 설치 및 국제자유도시 조성을 위한 특별법」 제10조제2항에 따른 행정시를 포함한다. 이하 같다)･군･구(자치구를 말한다. 이하 같다)의 게시판과 인터넷 홈페이지에 20일 이상 공고하고, 법인의 대표이사 및 시설의 장으로 하여금 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고하도록 하여야 한다. <개정 2009. 2. 5., 2012. 8. 7., 2018. 3. 30.>\n⑤ 제4항에 따른 공고는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하거나 「영유아보육법」 제49조의2제1항에 따라 공시하는 것으로 갈음할 수 있다. <개정 2015. 12. 24.>\n[전문개정 1998. 1. 7.]\n제11조(예산에 첨부하여야 할 서류) ① 예산에는 다음 각 호의 서류가 첨부되어야 한다. 다만, 단식부기로 회계를 처리하는 경우에는 제1호･제2호･제5호 및 제6호의 서류만을 첨부할 수 있고, 국가･지방자치단체･법인 외의 자가 설치･운영하는 시설로서 거주자 정원 또는 일일평균 이용자가 20명 이하인 시설(이하 “소규모 시설”이라 한다)은 제2호, 제5호(노인장기요양기관의 경우만 해당한다) 및 제6호의 서류만을 첨부할 수 있으며, 「영유아보육법」 제2조에 따른 어린이집은 보건복지부장관이 정하는 바에 따른다. <개정 1993. 12. 27., 2012. 8. 7., 2018. 3. 30., 2019. 9. 27., 2020. 1. 7.>"}, {"p": 162, "t": "1. 예산총칙\n2. 세입･세출명세서\n3. 추정재무상태표\n4. 추정수지계산서\n5. 임직원 보수 일람표\n6. 예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록 사본\n② 제1항제2호부터 제5호까지의 서류는 별지 제1호서식부터 별지 제4호서식까지에 따른다. 다만, 노인장기요양기관의 장이 첨부해야 하는 제1항제5호의 임직원 보수 일람표는 별지 제4호의2서식에 따른다. <개정 2018. 3. 30., 2020. 1. 7.>\n[시행일] 제11조제2항 단서의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호･제3호의 서비스를 제공하는 노인장기요양기관(이하 “주･야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호･제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주･야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일\n제12조(준예산) 회계연도 개시전까지 법인 및 시설의 예산이 성립되지 아니한 때에는 법인의 대표이사 및 시설의 장은 시장･군수･구청장에게 그 사유를 보고하고 예산이 성립될 때까지 다음의 경비를 전년도 예산에 준하여 집행할 수 있다. <개정 2012. 8. 7.>"}, {"p": 163, "t": "1. 임･직원의 보수\n2. 법인 및 시설운영에 직접 사용되는 필수적인 경비\n3. 법령상 지급의무가 있는 경비\n제13조(추가경정예산) ① 법인의 대표이사 및 시설의 장은 예산성립후에 생긴 사유로 인하여 이미 성립된 예산에 변경을 가할 필요가 있을 때에는 제10조 및 제11조의 규정에 의한 절차에 준하여 추가경정예산을 편성･확정할 수 있다. 이 경우 노인장기요양기관의 장은 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 한다. <개정 2012. 8. 7., 2018. 3. 30.>\n② 법인의 대표이사 및 시설의 장은 추가경정예산이 확정된 날로부터 7일이내에 이를 시장･군수･구청장에게 제출하여야 한다. <개정 2012. 8. 7.>\n제14조(예비비) 법인의 대표이사 및 시설의 장은 예측할 수 없는 예산외의 지출 또는 예산의 초과지출에 충당하기 위하여 예비비를 세출예산에 계상할 수 있다. <개정 2012. 8. 7.>\n[전문개정 1999. 3. 11.]\n제15조(예산의 목적외 사용금지) 법인회계 및 시설회계의 예산은 세출예산이 정한 목적외에 이를 사용하지 못한다.\n제16조(예산의 전용) ① 법인의 대표이사 및 시설의 장은 관･항･목간의 예산을 전용할 수 있다. 다만, 법인 및 시설(소규모 시설은 제외한다)의 관간 전용 또는 동일 관내의 항간 전용을 하려면 이사회의 의결 또는 시설운영위원회에의 보고를 거쳐야 하되, 법인이 설치･운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐야 한다. <개정 1998. 1. 7., 2012. 8. 7.>\n② 제1항에도 불구하고 예산총칙에서 전용을 제한하고 있거나 이사회 및 시설 예산심의과정에서 삭감한 관･항･목으로는 전용하여서는 아니 되며, 노인장기요양기관의 장은 예산을 전용하는 때에는 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 한다. <신설 2012. 8. 7., 2018. 3. 30.>"}, {"p": 164, "t": "③ 법인의 대표이사 및 시설의 장은 제1항에 따라 관･항 간 예산을 전용한 경우에는 관할 시장･군수･구청장에게 제19조 및 제20조에 따른 결산보고서를 제출할 때에 과목 전용조서를 첨부하여야 한다. <개정 2012. 8. 7.>\n제17조(세출예산의 이월) 법인의 대표이사 및 시설의 장은 법인회계와 시설회계의 세출예산중 경비의 성질상 당해회계연도안에 지출을 마치지 못할 것으로 예측되는 경비와 연도내에 지출원인행위를 하고 불가피한 사유로 인하여 연도내에 지출하지 못한 경비를 각각 이사회의 의결 및 시설운영위원회에의 보고를 거쳐 다음 연도에 이월하여 사용할 수 있다. 다만, 법인이 설치･운영하는 시설인 경우에는 시설운영위원회에 사전 보고한 후 법인 이사회의 의결을 거쳐야 한다. <개정 1998. 1. 7., 2012. 8. 7.>\n제18조(특정목적사업 예산) ① 법인의 대표이사 및 시설의 장은 완성에 수년을 요하는 공사나 제조 그밖의 특수한 사업을 위하여 2회계연도 이상에 걸쳐서 그 재원을 적립할 필요가 있는 때에는 회계연도마다 일정액을 예산에 계상하여 특정목적사업을 위한 적립금으로 적립할 수 있다. <개정 2012. 8. 7., 2017. 2. 14.>\n② 적립금의 적립 및 사용 계획(변경된 계획을 포함한다)은 시장･군수･구청장에게 사전에 보고하여야 한다. <신설 2012. 8. 7.>\n③ 적립금은 그 적립목적에만 사용해야 한다. 다만, 노인장기요양기관의 경우 「재난 및 안전관리 기본법」 제14조제1항에 따른 대규모 재난으로 인하여 인건비 지급이 어려운 경우로서 보건복지부장관이 정하는 기준에 해당하는 때에는 관할 시장･군수･구청장의 승인을 받아 한시적으로 인건비로 사용할 수 있다. <개정 2021. 9. 30.>\n④ 시장･군수･구청장은 법인 및 시설의 재정 상태 등을 고려하여 적립금의 적립 여부, 규모 및 적립기간 등에 관하여 필요한 조치를 할 수 있다. <신설 2012. 8. 7.>\n제2절 결산\n제19조(결산서의 작성 제출) ① 법인의 대표이사 및 시설의 장은 법인회계와 시설회계의 세입･세출 결산보고서를 작성하여 각각 이사회의 의결 및 시설운영위원회에의 보고를 거친 후 다음 연도 3월 31일까지(「영유아보육법」 제2조에 따른 어린이집의 경우에는 5월 31일까지를 말한다) 시장･군수･구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. 다만, 법인이 설치･운영하는 시설인 경우에는 시설운영위원회에 보고한 후 법인 이사회의 의결을 거쳐 제출하여야 한다. <개정 2012. 8. 7., 2015. 12. 24.>"}, {"p": 165, "t": "② 시장･군수･구청장은 제1항에 따라 결산보고서를 제출받은 때에는 20일 이내에 법인 및 시설의 세입･세출결산서를 시･군･구의 게시판과 인터넷 홈페이지에 20일 이상 공고하고, 법인의 대표이사 및 시설의 장으로 하여금 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 20일 이상 공고하도록 하여야 한다. <신설 1998. 1. 7., 2009. 2. 5., 2012. 8. 7.>\n1. 삭제 <2012. 8. 7.>\n2. 삭제 <2012. 8. 7.>\n③ 제2항에 따른 공고는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하거나 「영유아보육법」 제49조의2제1항에 따라 공시하는 것으로 갈음할 수 있다. <개정 2015. 12. 24.>\n제20조(결산보고서에 첨부해야 할 서류) ① 결산보고서에는 다음 각 호의 서류가 첨부되어야 한다. 다만, 단식부기로 회계를 처리하는 경우에는 제1호부터 제3호까지 및 제14호부터 제23호까지의 서류만을 첨부할 수 있고, 소규모 시설의 경우에는 제1호 및 제17호의 서류(노인장기요양기관의 경우에는 제1호부터 제3호까지 및 제16호부터 제21호까지의 서류)만을 첨부할 수 있으며, 「영유아보육법」 제2조에 따른 어린이집은 보건복지부장관이 정하는 바에 따른다. <개정 1993. 12. 27., 1998. 1. 7., 2012. 8. 7., 2015. 12. 24., 2019. 9. 27., 2020. 1. 7.>\n1. 세입･세출결산서\n2. 과목 전용조서\n3. 예비비 사용조서\n4. 재무상태표\n5. 수지계산서\n6. 현금 및 예금명세서\n7. 유가증권명세서\n8. 미수금명세서\n9. 재고자산명세서"}, {"p": 166, "t": "10. 그 밖의 유동자산명세서(제6호부터 제9호까지의 유동자산 외의 유동자산을 말한다)\n11. 고정자산(토지･건물･차량운반구･비품･전화가입권)명세서\n12. 부채명세서(차입금･미지급금을 포함한다)\n13. 각종 충당금 명세서\n14. 기본재산수입명세서(법인만 해당한다)\n15. 사업수입명세서\n16. 정부보조금명세서\n17. 후원금수입 및 사용결과보고서(전산파일을 포함한다)\n18. 후원금 전용계좌의 입출금내역\n19. 인건비명세서\n20. 사업비명세서\n21. 그 밖의 비용명세서(인건비 및 사업비를 제외한 비용을 말한다)\n22. 감사보고서\n23. 법인세 신고서(수익사업이 있는 경우만 해당한다)\n② 제1항제1호부터 제3호까지의 서류는 별지 제5호서식･별지 제5호의2서식부터 별지 제5호의4서식까지･별지 제6호서식 및 별지 제7호서식에 따르고, 제1항제4호 및 제5호의 서류는 별지 제2호서식 및 별지 제3호서식에 따르며, 제6호부터 제17호까지의 서류는 별지 제8호서식부터 별지 제19호서식까지에 따르고, 제19호부터 제22호까지의 서류는 별지 제20호서식부터 별지 제23호서식까지에 따른다. 다만, 노인장기요양기관의 장이 첨부해야 하는 제1항제19호의 인건비명세서는 별지 제4호의2서식에 따른다. <개정 2005. 7. 15., 2012. 8. 7., 2018. 3. 30., 2020. 1. 7.>\n[제목개정 2020. 1. 7.]\n[시행일] 제20조제2항 단서의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호･제3호의 서비스를 제공하는 노인장기요양기관(이하 “주･야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호･제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일"}, {"p": 167, "t": "3. 주･야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일\n제3장 회계\n제1절 총칙\n제21조(수입 및 지출사무의 관리) ① 법인의 대표이사와 시설의 장은 법인과 시설의 수입 및 지출에 관한 사무를 관리한다.\n② 법인의 대표이사와 시설의 장은 수입 및 지출원인행위에 관한 사무를 각각 소속직원에게 위임할 수 있다.\n제22조(수입과 지출의 집행기관) ① 법인과 시설에는 수입과 지출의 현금출납업무를 담당하게 하기 위하여 각각 수입원과 지출원을 둔다. 다만, 법인 또는 시설의 규모가 소규모인 경우에는 수입원과 지출원을 동일인으로 할 수 있다.\n② 제1항의 수입원과 지출원은 각각 그 법인의 대표이사와 시설의 장이 임면한다.\n제23조(회계의 방법) 회계는 단식부기에 의한다. 다만, 법인회계와 수익사업회계에 있어서 복식부기의 필요가 있는 경우에는 복식부기에 의한다.\n[전문개정 1993. 12. 27.]\n제24조(장부의 종류) ① 법인 및 시설에는 다음의 회계장부를 둔다. <개정 1998. 1. 7.>\n1. 현금출납부\n2. 총계정원장\n3. 삭제 <2012. 8. 7.>\n4. 재산대장\n5. 비품관리대장"}, {"p": 168, "t": "6. 삭제 <2009. 2. 5.>\n7. 삭제 <1998. 1. 7.>\n8. 삭제 <1998. 1. 7.>\n9. 삭제 <1998. 1. 7.>\n10. 삭제 <1998. 1. 7.>\n11. 삭제 <1998. 1. 7.>\n12. 삭제 <1998. 1. 7.>\n② 노인장기요양기관의 장이 제10조에 따른 예산을 기한 내에 제출하지 않은 경우에는 제1항제1호 및 제2호에 따른 회계장부(해당 회계연도 1월부터 6월까지의 회계장부를 말한다)를 해당 회계연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 한다. <신설 2018. 3. 30., 2020. 1. 7.>\n③ 노인장기요양기관의 장이 제19조에 따른 결산보고서를 기한 내에 제출하지 않은 경우에는 제1항제1호 및 제2호에 따른 회계장부(해당 회계연도의 다음 연도 1월부터 6월까지의 회계장부를 말한다)를 해당 회계연도의 다음 연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 한다. <신설 2020. 1. 7.>\n④ 제1항제1호부터 제5호까지의 규정에 따른 회계장부는 별지 제24호서식, 별지 제24호의2서식, 별지 제25호서식, 별지 제25호의2서식 및 별지 제26호서식부터 별지 제28호서식까지에 따른다. <개정 2009. 2. 5., 2018. 3. 30., 2020. 1. 7.>\n[시행일] 제24조제2항의 개정규정은 다음 각 호의 구분에 따른 날부터 시행한다.\n1. 「노인복지법」 제34조제1항에 따른 노인의료복지시설 및 같은 법 제38조제1항제2호･제3호의 서비스를 제공하는 노인장기요양기관(이하 “주･야간보호기관등”이라 한다)으로서 2018년 5월 30일 기준으로 정원이 20명을 초과하는 기관: 2018년 5월 30일\n2. 「노인복지법」 제38조제1항제1호･제4호 및 같은 법 시행규칙 제26조의2제2호의 서비스를 제공하는 노인장기요양기관(이하 “방문요양기관등”이라 한다)으로서 2017년 일일평균 이용자가 20명을 초과하거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명을 초과하는 기관: 2018년 5월 30일\n3. 주･야간보호기관등으로서 2018년 5월 30일 기준으로 정원이 20명 이하인 기관: 2019년 5월 30일\n4. 방문요양기관등으로서 2017년 일일평균 이용자가 20명 이하이거나, 2018년 1월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받고 같은 해 4월 30일까지 일일평균 이용자가 20명 이하인 기관 및 2018년 5월 1일 이후 「노인장기요양보험법」 제31조제1항에 따라 지정을 받은 기관: 2019년 5월 30일"}, {"p": 169, "t": "제2절 수입\n제25조(수입금의 수납) ① 모든 수입금의 수납은 이를 금융기관에 취급시키는 경우를 제외하고는 수입원이 아니면 수납하지 못한다.\n② 수입원이 수납한 수입금은 그 다음날까지 금융기관에 예입하여야 한다. <개정 1998. 1. 7.>\n③ 제1항 및 제2항의 규정에 의한 수입금에 대한 금융기관의 거래통장은 제6조의 규정에 의한 회계별로 구분될 수 있도록 보관･관리하여야 한다. <신설 1998. 1. 7.>\n제26조(과년도 수입과 반납금 여입) ① 출납이 완결한 연도에 속하는 수입 기타 예산외의 수입은 모두 현년도의 세입에 편입하여야 한다.\n② 지출된 세출의 반납금은 각각 지출한 세출의 당해과목에 다시 넣을 수 있다. <개정 2019. 9. 27.>\n제27조(과오납의 반환) 과오납된 수입금은 수입한 세입에서 직접 반환한다.\n제3절 지출\n제28조(지출의 원칙) ① 지출은 제21조의 규정에 의한 지출사무를 관리하는 자 및 그 위임을 받아 지출명령이 있는 것에 한하여 지출원이 행한다.\n② 제1항의 지출명령은 예산의 범위안에서 하여야 한다.\n제29조(지출의 방법) ① 지출은 상용의 경비 또는 소액의 경비지출을 제외하고는 예금통장에 의하거나 「전자문서 및 전자거래 기본법」 제2조제5호에 따른 전자거래로 행하여야 한다. 다만, 시설에 지원되는 국가 또는 지방자치단체의 보조금 지출은 보조금 결제 전용카드나 전용계좌를 이용하여야 한다. <개정 2009. 2. 5., 2012. 8. 7., 2012. 8. 31., 2015. 12. 24.>"}, {"p": 170, "t": "② 제1항에도 불구하고 지출원은 상용의 경비 또는 소액의 경비를 지출할 수 있으며, 이를 위하여 100만원 이하의 현금을 보관할 수 있다. <개정 2009. 2. 5., 2012. 8. 7.>\n③ 제1항 및 제2항에 따른 상용의 경비 또는 소액의 경비지출의 범위는 시･도지사가 정할 수 있다. <신설 2012. 8. 7.>\n제30조(지출의 특례) ① 선금지급할 수 있는 경비의 범위는 다음과 같다. <개정 2009. 2. 5., 2019. 9. 27.>\n1. 외국에서 직접 구입하는 기계, 도서, 표본 또는 실험용재료의 대가\n2. 정기간행물의 대가\n3. 토지 또는 가옥의 임대료와 용선료\n4. 운 임\n5. 소속직원중 특별한 사정이 있는 자에 대하여 지급하는 급여의 일부\n6. 관공서(「공공기관의 운영에 관한 법률」에 따른 공공기관 및 특별법에 의하여 설립된 특수법인을 포함한다)에 대하여 지급하는 경비\n7. 외국에서 연구 또는 조사에 종사하는 자에 대하여 지급하는 경비\n8. 보조금\n9. 사례금\n10. 계약금액이 1천만원 이상인 공사나 제조 또는 물건의 매입을 하는 경우에 계약금액의 100분의 50을 초과하지 아니하는 금액\n② 추산지급할 수 있는 경비의 범위는 다음과 같다. <개정 2009. 2. 5., 2019. 9. 27.>\n1. 여비 및 판공비\n2. 관공서(「공공기관의 운영에 관한 법률」에 따른 공공기관 및 특별법에 의하여 설립된 특수법인을 포함한다)에 대하여 지급하는 경비\n3. 보조금\n4. 소송비용\n제4절 계약\n제30조의2(계약의 원칙) 계약에 관한 사항은 「지방자치단체를 당사자로 하는 계약에 관한 법률」, 같은 법 시행령 및 같은 법 시행규칙을 준용한다. 다만, 국가･지방자치단체･법인 외의 자가 설치･운영하는 시설의 경우에는 그러하지 아니하다. <개정 2012. 8. 7., 2015. 12. 24.>"}, {"p": 171, "t": "[전문개정 2009. 2. 5.]\n제31조(계약담당자) ① 계약에 관한 사무는 각각 그 법인의 대표이사와 시설의 장이 처리한다.\n② 법인의 대표이사와 시설의 장은 계약체결에 관한 사무를 소속직원에게 위임할 수 있다.\n제32조 삭제 <2009. 2. 5.>\n제33조 삭제 <2009. 2. 5.>\n제34조 삭제 <2009. 2. 5.>\n제35조 삭제 <2009. 2. 5.>\n제36조 삭제 <2009. 2. 5.>\n제37조 삭제 <2009. 2. 5.>\n제37조의2 삭제 <2009. 2. 5.>\n제4장 물품\n제38조(물품의 관리자와 출납원) ① 법인의 대표이사와 시설의 장은 그 소관에 속하는 물품(현금 및 유가증권을 제외한 동산을 말한다. 이하 같다)을 관리한다. <개정 1998. 1. 7.>\n② 법인의 대표이사와 시설의 장은 그 소관에 속하는 물품관리에 관한 사무를 소속직원에게 위임할 수 있다.\n③ 법인의 대표이사와 시설의 장(제2항의 규정에 의하여 위임을 받은 자를 포함한다. 이하 “물품관리자”라 한다)은 물품의 출납보관을 위하여 소속직원중에서 물품출납원을 지정하여야 한다.\n제39조(물품의 관리의무) 물품관리자 및 물품출납원은 선량한 관리자의 주의로써 사무에 종사하여야 한다."}, {"p": 172, "t": "제40조(물품의 관리) ① 물품관리자는 물품을 출납하게 하고자 할 때에는 물품출납원에게 출납하여야 할 물품의 분류를 명백히 하여 그 출납을 명령하여야 한다.\n② 물품출납원은 제1항의 규정에 의한 명령이 없이는 물품을 출납할 수 없다.\n제40조의2(재물조사) 법인의 대표이사와 시설의 장은 연 1회 그 관리에 속하는 물품에 대하여 정기적으로 재물조사를 실시하여야 하며, 필요하다고 인정하는 때에는 정기재물조사외에 수시로 재물조사를 할 수 있다.\n[본조신설 1998. 1. 7.]\n제41조(불용품의 처리) ① 법인과 시설의 물품관리자는 물품중 그 사용이 불가능하거나 수리하여 다시 사용할 수 없게 된 물품이 있을 때에는 그 물품에 대하여 불용의 결정을 하여야 한다.\n② 제1항의 규정에 의한 불용품을 매각한 경우 그 대금은 당해법인 또는 시설의 세입예산에 편입시켜야 한다.\n제4장의2 후원금의 관리 <신설 1998. 1. 7.>\n제41조의2(후원금의 범위등) ① 법인의 대표이사와 시설의 장은 「사회복지사업법」 제45조에 따른 후원금의 수입･지출 내용과 관리에 명확성이 확보되도록 하여야 한다. 시설거주자가 받은 개인결연후원금을 당해인이 정신질환 기타 이에 준하는 사유로 관리능력이 없어 시설의 장이 이를 관리하게 되는 경우에도 또한 같다. <개정 1999. 3. 11., 2012. 8. 7.>\n② 삭제 <1999. 3. 11.>\n[본조신설 1998. 1. 7.]\n제41조의3 삭제 <1999. 3. 11.>\n제41조의4(후원금의 영수증 발급 등) ① 법인의 대표이사와 시설의 장은 후원금을 받은 때에는 「소득세법 시행규칙」 제101조제20호의2에 따른 기부금영수증 서식 또는 「법인세법 시행규칙」 제82조제7항제3호의3에 따른 기부금영수증 서식에 따라 후원금 영수증을 발급하여야 하며, 영수증 발급목록을 별도의 장부로 작성･비치하여야 한다. <개정 2009. 2. 5., 2012. 8. 7.>"}, {"p": 173, "t": "② 법인의 대표이사와 시설의 장은 금융기관 또는 체신관서의 계좌입금을 통하여 후원금을 받은 때에는 법인명의의 후원금전용계좌나 시설의 명칭이 부기된 시설장 명의의 계좌(이하 “후원금전용계좌등”이라 한다)를 사용하여야 한다. 이 경우 후원자가 영수증 발급을 원하는 경우를 제외하고는 제1항에 따른 영수증의 발급을 생략할 수 있다. <개정 2009. 2. 5.>\n③ 법인의 대표이사 및 시설의 장은 후원금을 받을 때에는 각각의 법인 및 시설별로 후원금전용계좌등을 구분하여 사용하여야 하며, 미리 후원자에게 후원금전용계좌등의 구분에 관한 사항을 안내하여야 한다. <신설 2012. 8. 7.>\n④ 모든 후원금의 수입 및 지출은 후원금전용계좌등을 통하여 처리하여야 한다. 다만, 물품 형태의 후원금은 그러하지 아니하다. <신설 2012. 8. 7.>\n[전문개정 2005. 7. 15.]\n[제목개정 2009. 2. 5.]\n제41조의5(후원금의 수입 및 사용내용통보) 법인의 대표이사와 시설의 장은 연 1회이상 해당 후원금의 수입 및 사용내용을 후원금을 낸 법인･단체 또는 개인에게 통보하여야 한다. 이 경우 법인이 발행하는 정기간행물 또는 홍보지등을 이용하여 일괄 통보할 수 있다.\n[본조신설 1998. 1. 7.]\n제41조의6(후원금의 수입･사용결과 보고 및 공개) ① 법인의 대표이사와 시설의 장은 제19조 및 제20조에 따른 결산보고서를 제출할 때에 별지 제19호서식에 따른 후원금수입 및 사용결과보고서(전산파일을 포함한다)를 관할 시장･군수･구청장에게 제출(「사회복지사업법」 제6조의2제2항에 따른 정보시스템을 활용한 제출을 포함한다)하여야 한다. <개정 2005. 7. 15., 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.>\n② 시장･군수･구청장은 제1항에 따라 제출받은 후원금수입 및 사용결과보고서를 제출받은 날부터 20일 이내에 인터넷 등을 통하여 3개월 동안 공개하여야 하며, 법인의 대표이사 및 시설의 장은 해당 법인 및 시설의 게시판과 인터넷 홈페이지에 같은 기간 동안 공개하여야 한다. 다만, 후원자의 성명(법인 등의 경우는 그 명칭)은 공개하지 아니한다. <신설 2005. 7. 15., 2009. 2. 5., 2012. 8. 7., 2015. 12. 24.>"}, {"p": 174, "t": "③ 제2항에 따른 공개는 「사회복지사업법」 제6조의2제2항에 따른 정보시스템에 게시하는 것으로 갈음할 수 있다. <신설 2015. 12. 24.>\n[본조신설 1998. 1. 7.]\n[제목개정 2005. 7. 15.]\n제41조의7(후원금의 용도외 사용금지) ① 법인의 대표이사와 시설의 장은 후원금을 후원자가 지정한 사용용도외의 용도로 사용하지 못한다.\n② 보건복지부장관은 후원자가 사용용도를 지정하지 아니한 후원금에 대하여 그 사용기준을 정할 수 있다. <신설 2012. 8. 7.>\n③ 후원금의 수입 및 지출은 제10조의 규정에 의한 예산의 편성 및 확정절차에 따라 세입･세출예산에 편성하여 사용하여야 한다. <개정 2012. 8. 7.>\n[본조신설 1998. 1. 7.]\n제5장 감사\n제42조(감사) ① 법인의 감사는 당해법인과 시설에 대하여 매년 1회이상 감사를 실시하여야 한다.\n② 법인의 대표이사는 시설의 장과 수입원 및 지출원이 사망하거나 경질된 때에는 그 관장에 속하는 수입, 지출, 재산, 물품 및 현금등의 관리상황을 감사로 하여금 감사하게 하여야 한다.\n③ 제2항에 따른 감사를 실시할 때에는 전임자가 참관해야 하며, 전임자가 참관할 수 없으면 관계 직원 중에서 전임자의 전임자나 법인의 대표이사가 지정한 사람이 참관해야 한다. <개정 2019. 9. 27.>\n④ 감사는 제1항 내지 제3항의 규정에 의하여 감사를 한 때는 감사보고서를 작성하여 당해법인의 이사회에 보고하여야 하며, 재산상황 또는 업무집행에 관하여 부정 또는 불비한 점이 발견된 때에는 시장･군수･구청장에게 보고하여야 한다.\n⑤ 제4항의 감사보고서에는 감사가 서명 또는 날인하여야 한다. <개정 1998. 1. 7.>"}, {"p": 175, "t": "제42조의2(회계감사) ① 시･도지사 또는 시장･군수･구청장은 법인 및 시설이 다음 각 호의 어느 하나에 해당하는 경우 회계감사를 실시할 수 있다.\n1. 「사회복지사업법」 제40조제1항제4호에 따른 회계부정이나 불법행위 또는 그 밖의 부당행위 등이 발견된 경우\n2. 「사회복지사업법」 제42조제3항제1호에 따라 거짓이나 그 밖의 부정한 방법으로 보조금을 받은 경우\n3. 「사회복지사업법」 제42조제3항제2호에 따라 사업 목적 외의 용도에 보조금을 사용한 경우\n4. 「사회복지사업법」 또는 「사회복지사업법」에 따른 명령을 위반한 경우\n5. 제42조제4항에 따라 감사가 시장･군수･구청장에게 보고한 경우\n② 제1항에서 규정한 사항 외에 공인회계사 또는 감사인의 추천 등 회계감사의 실시와 관련하여 필요한 사항은 해당 지방자치단체의 조례로 정한다.\n[본조신설 2019. 6. 12.]\n제6장 보칙\n제43조(사무의 인계･인수) ① 회계사무를 담당하는 직원이 교체된 때에는 당해사무의 인계･인수는 발령일로부터 5일이내에 행하여져야 한다. <개정 2012. 8. 7.>\n② 인계자는 인계할 장부와 증빙서류등의 목록을 각각 3부씩 작성하여 인계･인수자가 각각 서명 또는 날인한 후 각각 1부씩 보관하고, 1부는 이를 예금잔고증명과 함께 인계･인수보고서에 첨부하여 법인의 대표이사 및 시설의 장에게 제출하여야 한다. 이 경우 법인이 설치･운영하는 시설에 있어서는 시설의 장을 거쳐 제출하여야 한다. <개정 2012. 8. 7., 2015. 12. 24.>\n제44조(시행세칙) 이 규칙의 시행을 위하여 필요한 세부사항은 보건복지부장관이 정한다. <개정 1998. 1. 7., 2008. 3. 3., 2010. 3. 19.>\n제45조 삭제 <2018. 12. 28.>"}, {"p": 176, "t": "부      칙 <제642호, 2019. 6. 12.>\n이 규칙은 2019년 6월 12일부터 시행한다.\n부      칙 <제672호, 2019. 9. 27.>(어려운 법령용어 정비를 위한 48개 법령의 일부개정에 관한 보건복지부령)\n이 규칙은 공포한 날부터 시행한다.\n부      칙 <제701호, 2020. 1. 7.>\n제1조(시행일) 이 규칙은 공포한 날부터 시행한다.\n제2조(결산보고서 제출에 관한 적용례) 제20조제1항 각 호 외의 부분 단서의 개정규정은 2020년 결산보고서를 제출하는 경우부터 적용한다.\n부      칙 <제724호, 2020. 5. 6.>\n이 규칙은 공포한 날부터 시행한다.\n부      칙 <제831호, 2021. 9. 30.>\n이 규칙은 공포한 날부터 시행한다.\n부      칙 <제928호, 2022. 12. 28.>\n이 규칙은 2023년 1월 1일부터 시행한다."}, {"p": 177, "t": "[별표 1] <개정 2012.8.7>\n법인회계 세입예산과목구분 (제10조제3항 본문 관련)\n과  목 | 내  역\n관 | 항 | 목\n01 | 재산수입 | 11 | 기본재산수입 | 111 | 임대료수입 | 부동산 임대수입\n112 | 배당 및 이자수입 | 소유주식배당수입, 예금이자수입\n113 | 재산매각수입 | 부동산매각수입\n114 | 기타수입 | 불용재산매각 등 그 밖의 재산수입\n02 | 사업수입 | 21 | 사업수입 | 211 | ○○사업수입 | 법인의 자체사업으로 얻어지는 수입 ※ 법인의 수익사업은 수익사업회계로 처리\n03 | 과년도수입 | 31 | 과년도수입 | 311 | 과년도수입 | 전년도에 세입조정된 수입으로서 금년도에 수입으로 확정된 것\n04 | 보조금수입 | 41 | 보조금수입 | 411 | 국고보조금 | 국가로부터 받은 경상보조금 및 자본 보조금\n412 | 시･도 보조금 | 시･도로부터 받은 경상보조금 및 자본 보조금\n413 | 시･군･구보조금 | 시･군･구로부터 받은 경상보조금 및 자본보조금\n414 | 기타 보조금 | 그 밖에 국가, 지방자치단체 및 사회 복지사업 기금 등에서 공모사업 선정 으로 받은 보조금\n05 | 후원금수입 | 51 | 후원금수입 | 511 | 지정후원금 | 국내외 민간단체 및 개인으로부터 후원 명목 으로 받은 기부금･결연후원금･위문금･찬조금 중 후원목적이 지정된 수입\n과  목 | 내  역\n512 | 비지정후원금 | 국내외 민간단체 및 개인으로부터 후원 명목 으로 받은 기부금･결연후원금･위문금･찬조금 중 후원목적이 지정되지 아니한 수입과 자선행사 등으로 얻어 지는 수입\n06 | 차입금 | 61 | 차입금 | 611 | 금융기관 차입금 | 금융기관으로부터의 차입금\n612 | 기타차입금 | 개인･단체 등으로부터의 차입금\n07 | 전입금 | 71 | 전입금 | 711 | 다른 회계로부터의 전입금 | 수익사업회계 및 시설회계로부터의 전입금\n08 | 이월금 | 81 | 이월금 | 811 | 전년도이월금 | 전년도 불용액으로서 이월된 금액\n812 | 전년도이월금(후원금) | 전년도 후원금에 대한 불용액으로서 이월된 금액\n813 | ○○이월사업비 | 전년도에 종료되지 못한 ○○ 사업의 이월된 금액\n09 | 잡수입 | 91 | 잡수입 | 911 | 불용품매각대 | 비품･집기･기계･기구 등과 그 밖의 불용품의 매각대\n912 | 기타예금이자수입 | 기본재산예금 외의 예금이자 수입\n913 | 기타잡수입 | 그 밖의 재산매각수입, 변상금 및 위약금 수입 등과 다른 과목에 속하지 아니하는 수입"}, {"p": 178, "t": "[별표 2] <개정 2015.12.24.>\n법인회계 세출예산과목구분 (제10조제3항 본문 관련)\n과  목 | 내  역\n관 | 항 | 목\n01 | 사무비 | 11 | 인건비 | 111 | 급여 | 법인 임･직원에 대한 기본 봉급 (기말･정근수당 포함)\n112 | 제수당 | 법인 임･직원에 대한 상여금 및 제수당(직종･ 직급별로 일정액을 지급하는 수당과 시간외 근무수당･야간근무수당･ 휴일근무수당 등) 및 기타 수당\n113 | 일용잡급 | 일급 또는 단기간 채용하는 임시직에 대한 급여\n115 | 퇴직금 및 퇴직적립금 | 법인 임･직원퇴직급여제도에 따른 퇴직급여 및 퇴직적립금(충당금)\n116 | 사회보험 부담금 | 법인 임･직원의 사회보험(국민연금, 국민건강 보험, 고용보험, 산업재해보상보험 등)부담금\n117 | 기타후생경비 | 법인 임･직원의 건강진단비･기타 복리후생  | 의료비 | 입소자의 보건위생 및 시약대\n315 | 장의비 | 입소자중 사망자의 장의비"}, {"p": 182, "t": "과  목 | 내  역\n316 | 직업재활비 | 입소자의 직업훈련재료비\n317 | 자활사업비 | 입소자의 자활을 위한 기자재 구입비\n |  |  |  | 318 | 특별급식비 | 입소자의 간식, 우유등 생계외의 급식 제공을 위한 비용\n319 | 연료비 | 보일러 및 난방시설연료비, 취사에 필요한 연료비\n32 | 교육비 | 321 | 수업료 | 입소자중 학생에 대한 수업료\n |  | 322 | 학용품비 | 입소자중 학생에 대한 학용품비\n323 | 도서구입비 | 입소자중 학생에 대한 도서구입비, 부교재비\n324 | 교통비 | 입소자중 학생에 대한 대중교통비\n325 | 급식비 | 입소자중 학생에 대한 학교급식비\n326 | 학습지원비 | 입소자중 학생에 대한 사교육비(피아노교습, 사설학원 수강 등)\n327 | 수학여행비 | 입소자중 학생에 대한 수학여행비\n328 | 교복비 | 입소자중 학생에 대한 교복비"}, {"p": 183, "t": "과  목 | 내  역\n329 | 이미용비 | 입소자중 학생에 대한 이, 미용비\n330 | 기타교육비 | 입소자중 학생에 대한 그 밖의 교육경비(학습재료 등)\n33 | ○○사업비\n331 | 의료재활 사업비 | 입소자(재활･물리･작업･언어･청능) 치료비, 수술비용, 의수족 등 장애인 보조기기 제작수리비 또는 입소자를 위한 의료재활 프로그램 비용\n332 | 사회심리 재활사업비 | 입소자를 위한 사회심리재활 프로그램 운영비\n333 | 교육재활 사업비 | 입소자를 위한 교육프로그램운영비\n334 | 직업재활 사업비 | 입소자를 위한 직업재활프로그램 운영비\n335 ･ | ○○사업비 ･ | 의료재활, 직업재활, 교육재활 등 전문 프로그램이 아닌\n |  |  |  | ･ ･ ･ | ･ ･ ･ | 입소자를 위한 프로그램운영비 (하계캠프, 방과 후 공부방 운영 등)\n04 | 전출금 | 41 | 전출금 | 411 | 법인회계전출금 | 법인회계로의 전출금 (보건복지부장관이 정하는 경우만 해당함)\n05 | 과년도지출 | 51 | 과년도지출 | 511 | 과년도지출 | 과년도미불금 및 과년도사업비의 지출\n06 |  | 61 | 부채상환금 | 611 | 원금상환금 | 차입금원금상환금\n과  목 | 내  역\n612 | 이자지불금 | 차입금이자지급금\n07 | 잡지출 | 71 | 잡지출 | 711 | 잡지출 | 시설이 지출하는 보상금･사례금･소송경비 등\n08 | 예비비 및 기타 | 81 | 예비비 및 기타 | 811 | 예비비 | 예비비\n812 | 반환금 | 정부보조금 반환금"}, {"p": 184, "t": "[별표 5] <개정 2012.8.7>\n복지관 등 시설회계 세입예산과목구분 (제10조제3항제1호 관련)\n과  목 | 내  역\n관 | 항 | 목\n01 | 사업수입 | 11 | 사업수입 | 111 | ○○수입 | 시설에서 제공하는 각종 서비스의 이용자로 부터 받은 수입을 종류별로 목을 설정\n02 | 과년도수입 | 21 | 과년도수입 | 211 | 과년도수입 | 전년도에 세입조정된 수입으로서 금년도에 수입으로 확정된 것\n03 | 보조금수입 | 31 | 보조금수입 | 311 | 국고보조금 | 국가로부터 받은 경상보조금 및 자본보조금\n |  |  |  | 312 | 시･도 보조금 | 시･도로부터 받은 경상보조금 및 자본보조금\n |  |  |  | 313 | 시･군･구 보조금 | 시･군･구로부터 받은 경상보조금 및 자본보조금\n |  |  |  | 314 | 기타보조금 | 그 밖에 국가, 지방자치단체 및 사회복지사업 기금 등에서 공모사업 선정으로 받은 보조금\n04 | 후원금수입 | 41 | 후원금수입 | 411 | 지정후원금 | 국내외 민간단체 및 개인으로부터 후원명목 으로 받은 기부금･결연후원금･위문금･찬조금 중 후원목적이 지정된 수입\n |  |  |  | 412 | 비지정후원금 | 국내외 민간단체 및 개인으로부터 후원명목 으로 받
