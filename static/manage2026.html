는 모든 예산항목에 대해 시설별로 사업정보를 관리<\/div><div class=\"ln p\">지방재정시스템을 통해 확정된 보조금 정보를 등록하고, 소관 시설별로 배정<\/div><div class=\"ln p\">시설별 예산 배정 시 지자체 및 사업의 특성에 따라 보조금 신청 및 정산주기를 결정하고 등록 관리하여 시설 보조금 신청 및 정산의 기준정보로 활용<\/div><div class=\"ln h4\">7) 사회복지시설 보조금 관리<\/div><div class=\"ln p\">보조금 신청 및 정산정보를 온라인으로 보고받아서 관리<\/div><div class=\"ln p\">보조사업 정보를 기준으로 사회복지시설에서 온라인으로 보조금 신청정보를 접수하여 승인(승인 시 보조금 자동생성)<\/div><div class=\"ln p\">보조금 신청정보를 기준으로 사회복지시설에서 온라인으로 보조금 정산보고를 접수하여 승인(승인 시 보조금 집행 잔액 자동관리)<\/div><div class=\"ln p\">사회복지시설별 연간 예산 및 결산 관리<\/div><div class=\"ln h4\">8) 시설공지 관리<\/div><div class=\"ln p\">소관 사회복지시설(지역별, 시설유형별)을 대상으로 일괄 공지가 필요할 시에는 시설 공지관리를 활용하여 사회서비스정보시스템(희망이음)으로 정보전달<\/div><div class=\"ln h4\">9) 사회복지시설 후원금 관리<\/div><div class=\"ln p\">대표이사와 시설장은 관할 시장･군수･구청장에게 결산보고서를 제출할 때 후원금 수입 및 사용결과 보고서를 함께 제출<\/div><div class=\"ln p\">‒이 경우 반드시 전자파일로 제출하여야 하며 출력한 보고서도 추가 제출 가능<\/div><div class=\"ln p\">시장･군수･구청장은 제출받은 후원금의 수입 및 사용결과 보고서를 제출받은 날부터 20일 이내 인터넷(시･군･구 홈페이지) 등을 통하여 3개월간 공개 (사회복지시설정보시스템, 희망이음(사회서비스정보시스템) 또는 복지로를 통한 공시 시 인터넷 공개 생략 가능)<\/div><div class=\"ln p\">같은 기간 동안 법인의 대표이사 및 시설의 장도 후원금 수입 및 사용결과 보고서를 법인 및 시설의 게시판과 인터넷 홈페이지에 공개사회서비스정보시스템(희망이음) 또는 복지로를 통한 공시 시 인터넷 공개 생략 가능)<\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>기타사항<\/div>", "pages": [{"p": 95, "t": "3\n사회복지시설 온라인 보고\n가\n온라인 보고 개요\n1) 추진배경 및 목적\nʼ08년부터 사회복지시설 업무의 효율화 및 시설회계의 투명성 제고를 위해 새올복지행정시스템(시･군･구용)과 사회복지시설정보시스템(사회복지시설용 간 연계시스템이 구축되어 보조금 신청 및 보고 등을 온라인으로 수행하였으며,\nʼ10년 1월 행복이음이 구축됨에 따라, 사회복지시설은 사회복지시설정보시스템 ➩ 행복이음으로 보조금 신청 및 보고를 하고 지자체 공무원은 이 정보를 기준으로 보조금 신청 교부 등 각종 업무를 처리함\n’22년 차세대 행복이음 구축에 따라 희망이음 ➩ 행복이음으로 보조금 신청 등 보고 업무를 수행\n☞ 희망이음을 통해 복지대상자 관리와 보조금 신청･시설수급자 현황 등을 온라인으로 보고하여 자료관리의 정확성 제고\n2) 추진방침\n사회서비스정보시스템(희망이음)의 사용대상 시설은 온라인으로 보조금 신청 및 보고를 의무적으로 실시하고 시설업무 담당 공무원은 보고된 정보를 기준으로 보조금 신청 교부 등 각종 업무를 처리\n이를 위해 사회서비스정보시스템(희망이음)의 관리정보(입소자 및 이용자 명부, 종사자 명부 등)를 기반으로 자동으로 생성되는 보고 정보를 활용하여 각종 보고서를 작성하고 수기(서면)보고는 폐지\n또한 ʼ10년 10월 시군구 온라인 보고 의무화 정책 시행에 따라 사회복지시설 수급자 생계급여 등 보조금은 원칙적으로 온라인 교부신청 시에만 교부\n☞다만, 시･도별로 시설유형 및 시･도 여건에 따른 서면보고가 불가피한 시설의 경우 보건복지부의 사전승인 필요"}, {"p": 96, "t": "3) 지방자치단체의 역할\n자치단체장은 사회복지법인 및 사회복지시설이 사회서비스정보시스템(희망이음)을 사용 하도록 독려하여 동 시스템의 확산 및 정착 추진\n‒새로 개설되는 사회복지법인･시설의 경우 사회복지시설 신고단계에서 사회서비스정보시스템(희망이음)을 사용하도록 추진\n‒기존시설의 경우에도 온라인보고에 어려움을 겪거나, 사회서비스정보시스템(희망이음)을 통해 회계, 후원금, 이력관리, 온라인보고 등의 업무를 처리하고자 하는 경우 적극 지원\n※한국사회보장정보원이 시･도 사회복지협의회를 통해 진행하는 시스템 사용자교육이 원활히 추진될 수 있도록 조치\n※보조금 청구, 정산보고, 입소자 및 종사자 보고, 후원금 수입 및 사용결과보고는 희망이음을 통해서만 하는 것을 원칙으로 함, 이를 보조금 교부 조건으로 명시, 수탁시설의 경우 위탁계약에 명시\n희망이음의 표준화된 양식 및 보고문서 활용\n※희망이음의 양식 및 보고 문서를 표준으로 사용함으로써 지자체별로 별도 존재하던 비표준 문서 유통을 사전에 차단\n4) 온라인 보고 범위 및 절차\n주요 보고 서식"}, {"p": 97, "t": "적용대상 | 제출서 유형 | 보 고 대 상 문 서 | 보고주기\n사회복지 시설공통 | 보조금 보고 | 보조금 교부신청 | 운영비 ‒보조금교부신청서, 보조금교부청구서, 예산신청내역서, 인건비 산출내역서, 개인별시간외근무내역서, 이용아동 명부 (지역아동센터의 경우) | 월/분기/반기/년\n생계비 ‒ 생계급여산출명단 ※시설생계급여 신청시 교부신청서류 중 금액이 표기된 보조금 교부 신청서, 보조금교부청구서, 예산신청내역서, 생계급여산출 내역서를 제외하고 생계급여산출명단만 제출 | 월\n보조금 정산보고 | 보조금정산보고서, 보조금정산내역서(명부 포함), 총계정원장 | 월/분기/반기/년\n기능보강 보조금 교부신청 | 기능보강사업 보조금교부신청서, 기능보강사업보조금교부 청구서, 기능보강사업 예산신청내역서 | 월/분기/반기/년\n기능보강 보조금 정산보고 | 기능보강사업 정산보고서, 기능보강사업정산내역서, 구입장비세부 목록 | 월/분기/반기/년\n입소자보고 | 입소자입퇴소 발생보고 | 입소자입퇴소발생보고, 입소자사망발생보고 | 발생즉시\n입소자등록정보 변경보고 | 입소자등록정보변경보고 | 발생즉시\n병원입퇴원보고 | 병원입퇴원보고 | 발생즉시\n이용자 보고 | 이용자 보고 | 이용자 이용/종료 발생보고 | 발생즉시 (필요시)\n종사자보고 | 종사자입퇴사 발생보고 | 종사자입퇴사발생보고, 자격증보고 | 발생즉시\n종사자 등록정보 변경보고 | 종사자 등록정보 변경보고 | 발생즉시\n종사자 수당 신청 | 종사자 수당 신청 | 월\n적용대상 | 제출서 유형 | 보 고 대 상 문 서 | 보고주기\n복지시설 변경보고 | 복지시설 변경보고(명칭, 소재지 등) | 발생즉시\n시설 휴(폐)업/재개 보고 | 시설 휴(폐)업/재개 신고서 | 발생즉시\n예산서 | 예산총괄표, 예산서내역, 사업계획서(파일첨부) | 년\n추경 예산서 | 추경예산총괄표, 추경예산서내역, 수정사업계획서(파일첨부) | 년\n세입･세출 결산 보고 | 결산총괄표, 세입결산서, 세출결산서, 사업수입명세서, 정부보조금 명세서, 후원금품 수입사용내역서 등 | 년\n비정형 업무보고 | 비정형 업무보고(파일첨부) | 수시\n장기요양 | 장기요양 인력변경 보고 | 변경신고서, 인력변경현황 | 발생 즉시\n특별회계 적립사용 계획 보고 | 적립사용계획서\n시설 설치 전 차입금 보고 | 설치 전 차입금 상세내역\n시설 설치 후 차입금 보고 | 설치 후 차입금 상세내역"}, {"p": 98, "t": "온라인 보고 범위\n시설유형 | 보고문서 범위\n보조금 신청/정산 | 종사자 | 입소자 | 후원금 | 예/결산\n보조금 지급시설 | ○ | ○ | ○ | ○ | ○\n보조금 미지급시설 | × | ○ | ○ | ○ | ○\n지자체 설치시설(위탁운영) | ○ | ○ | ○ | ○ | ○\n※시･도에서 직접 보조금을 지급하는 시설의 경우 온라인보고 여부 및 보고절차 등을 자체 판단하여 시행\n온라인보고 절차\n‒지자체는 보조금 지급시설에 대하여 보조사업 정보를 희망이음으로 전송\n‒사회복지시설은 희망이음에서 보고문서(보조금 신청, 종사자 보고, 입소자 보고, 후원금품 보고 등) 작성 및 행복이음으로 보고문서 전송\n‒지자체는 행복이음을 통해 보고문서 접수 및 승인･반려 처리\n‒지자체 및 사회복지시설간 보고문서 처리 결과 공유\n온라인보고 개념도"}, {"p": 99, "t": "나\n주요 온라인보고 세부 절차\n1) 생활시설 입소자 보고\n생활시설에서는 입소자에 대한 신변변화가 발생 시 온라인보고를 통해 즉시 보고\n‒보고대상：입･퇴소 발생보고 / 사망 발생보고 / 입소자정보 변경보고\n온라인보고는 입소 시 전입신고, 사망 시 사망신고 등과는 별도로 보고함\n※입･퇴소 관련 보고 시에는 전체 입소자는 반드시 주민등록변경(전입, 전출) 신고가 선행되어 있어야 하며, 주민등록변경일자를 기준으로 입･퇴소일자를 보고하도록 함\n보고된 정보를 자치단체에서 확정하면 수급자의 자격과 생계비 등 급여가 자동으로 확정 및 생성됨\n‒시스템에서 타 시설 중복 등록 여부 등 부적정 수급을 방지하기 위해 제공되는 기능을 확인하고 확정함\n‒보조금 신청 시 입소자의 생계비는 입소보고가 된 생활인에 대하여 자동 생성 되며, 중복지급, 사망자 대상 부적정 지급 등을 방지하기 위해서는 반드시 온라인을 통해 입소자 보고를 하여야 함\n입소자의 입･퇴소일자 등이 변경되는 경우 입소자정보변경보고를 수행함\n입･퇴소자 보고 처리절차"}, {"p": 100, "t": "2) 종사자 보고\n모든 사회복지시설에서는 종사자에 대한 입･퇴사 발생 시 온라인보고를 통해 보고\n‒보고대상：입･퇴사 발생보고 / 종사자등록정보변경보고\n※보조금 지급 대상이 되는 종사자 뿐만 아니라, 모든 종사자에 대한 정보 시스템 입력 권고\n보고된 정보를 자치단체에서 확정하면 해당 시설 종사자로 자동 등록\n‒시스템에서 타 시설 중복 등록 여부 등 종사자의 인건비 이중 수급을 방지하기 위해 제공되는 기능을 확인하고 확정함\n‒보조금 신청 시 종사자의 인건비는 입사보고가 된 종사자에 대하여 자동생성 되며, 중복지급 등을 방지하기 위해서는 반드시 온라인을 통해 종사자 보고를 하여야 함\n종사자의 입･퇴사일자, 직종 등이 변경되는 경우 종사자등록정보변경보고를 수행함\n종사자 보고 처리절차\n종사자 처우개선을 위해 지자체에서 직접 수당을 지급(지자체➝종사자)하는 경우 종사자 수당신청 보고를 활용\n※시설을 통해 종사자 수당 등을 지원하는 경우(지자체➝시설➝종사자) 반드시 3.보조금 교부신청 정산보고를 사용하여 시설회계에 포함될 수 있도록 함"}, {"p": 102, "t": "순번 | 항 목 | 수행주체 | 시스템 | 처리내용\n1 | 종사자 입･퇴사 보고 | 시설 | 희망이음 | 입･퇴사 발생 시 보고 *종사자 보고 후 시･군･구 승인이 완료된 종사자에 한하여 종사자수당 신청 가능\n2 | 전자결재 및 승인 | 시･군･구 | 행복이음 | 전자결재 완료 후 승인처리\n3 | 종사자수당 신청 | 시설 | 희망이음 | 종사자수당 신청 기능을 활용하여 온라인 보고\n4 | 전자결재 및 승인 | 시･군･구 | 행복이음 | 전자결재 완료 후 승인 처리\n5 | 급여자료 생성 | 시･군･구 | 행복이음 | 종사자수당 신청 건에 대한 급여자료 확인 및 출력\n6 | 지출품의 및 지급 | 시･군･구 | e호조 | 행복이음에서 출력한 급여자료를 첨부하여 지출품의\n3) 보조금 교부신청 및 정산\n사회복지시설의 보조금교부신청 대상 정보는 연초 또는 해당 사업이 확정되는 시점에 지자체에서 보조사업 정보를 등록\n‒보조사업 정보 주요내용：사업년도, 사업코드, 사업명, 사업분류, 사업비(보조금 총액), 대상시설, 신청주기, 정산주기 등\n‒지자체에서 보조사업정보를 해당 사회복지시설에 배정하지 않을 경우 사회복지 시설에서 보조금 신청이 불가함\n사회복지시설에서는 지자체에서 배정한 보조사업(생계급여, 운영비, 사업비 등)에 따라 보조금 교부신청을 온라인으로 시행\n‒입소자 생계급여 처리절차\n•생계급여 예상액 및 지급액은 행복이음에서 자동 생성되고 시설에서는 생계급여 대상자명단만 제출\n순번 | 항 목 | 수행주체 | 시스템 | 처리내용\n1 | 입 소 자 입･퇴소 보고 | 시설 | 희망이음 | 입･퇴소 발생 시 보고 *입소자 보고 후 시군구 승인이 완료된 입소자에 한하여 생계급여 신청 가능\n2 | 전자결재 및 승인 | 시･군･구 | 행복이음 | 전자결재 완료 후 승인처리\n3 | 보조사업 등록 확인 | 시･군･구 | 행복이음 | 보조사업 정보 확인 및 배정\n4 | 생계급여신청 | 시설 | 희망이음 | 시･군･구에서 배정한 보조사업에 대하여 보조금신청기능을 활용하여 온라인보고 ※생계급여 산출대상 명단첨부(전월미지급대상자는 “시설생계급여미지급신청”으로 신청가능)\n5 | 전자결재 및 승인 | 시･군･구 | 행복이음 | 전자결재 완료 후 보고문서 승인 처리\n6 | 예상액 생성확인, 확정 | 시･군･구 | 행복이음 | 생계급여에 대한 개인별 급여 예상액 확인, 확정 * 승인 완료된 보고문서의 입소자 기준\n7 | e‒호조 연계 | 시･군･구 | 행복이음 | 확정된 생계급여 정보를 e‒호조로 전송\n8 | 지출품의 및 지급 | 시･군･구 | e‒호조 | 행복이음에서 전송한 보조금 정보를 활용하여 지출품의\n9 | 생계급여산출내역 연계 | 시설 | 희망이음 | 행복이음의 생계급여 산출내역을 사회서비스정보시스템(희망이음)으로 연계하여 시설에서 정산보고 시 활용\n‒운영비(인건비), 사업비, 기능보강사업비 등 처리 절차\n순번 | 항 목 | 수행주체 | 시스템 | 처리내용\n1 | (인건비 신청 시) 종사자 입퇴사 보고 | 시설 | 희망이음 | 입퇴사 발생 시 보고 *종사자 보고 후 시군구 승인이 완료된 종사자에 한하여 인건비 신청 가능\n2 | 전자결재 및 승인 | 시･군･구 | 행복이음 | 전자결재 완료 후 승인처리\n3 | 보조사업 등록 확인 | 시･군･구 | 행복이음 | 보조사업 정보 확인 및 배정\n4 | 보조금 신청 | 시설 | 희망이음 | 시･군･구에서 배정한 보조사업에 대하여 보조금 신청 기능을 활용하여 온라인 보고 ※ 주기별 2회 이상 신청가능\n5 | 전자결재 및 승인 | 시･군･구 | 행복이음 | 전자결재 완료 후 승인 처리\n6 | e‒호조 연계 | 시･군･구 | 행복이음 | 동일사업별 보조금신청건을 지급단위로 일괄 결재 후 보조금 정보를 e‒호조로 전송\n7 | 지출품의 및 지급 | 시･군･구 | e‒호조 | 행복이음에서 전송한 보조금 정보를 활용하여 지출품의"}, {"p": 103, "t": "사회복지시설은 신청한 보조금에 대한 정산내역을 온라인으로 보고\n보조금 신청 및 정산 절차\n4) 민간서비스 연계 및 민간 서비스 이용 대상자 보고\n사회복지관 등 사회복지시설은 지역사회 민관협력 강화를 위해 복지서비스 대상자 및 자원 정보를 지자체와 공유\n‒공공‒민간에서 각각 지원 중인 대상자 수혜이력 및 사례관리 이력 공유, 상호의뢰 체계 마련으로 지원누락 및 중복지원 방지\n‒공공‒민간의 자원정보 공유 및 자원 공동 활용으로 지역사회 전체 복지 자원의 효율적 활용 제고\n지자체 및 시설에서는 연계된 정보를 활용하여 복지 대상자의 서비스 연계 및 자원배분에 활용\n연계 개념도"}, {"p": 104, "t": "※표준서비스：표준분류체계(대분류：10종, 중분류：47분류) 적용\n※상세분류표는 희망복지지원단 업무안내 복지자원 표준분류체계 참조\n5) 후원금(품) 수입/사용보고\n사회복지시설은 희망이음을 이용하여 후원금(품)에 대한 수입/사용 내역을 입력\n대표이사와 시설장은 결산보고서를 제출할 때에 후원금 수입 및 사용결과 보고서를 희망이음을 통해 행복이음으로 보고\n후원금(품) 수입/사용보고 절차"}, {"p": 105, "t": "6) 비정형업무 보고\n정형화된 온라인 보고 외의 공문서 유통 관리가 필요한 경우 비정형 업무보고를 통해 사회복지시설로부터 문서 수신\n※정형화된 온라인보고가 있음에도 편의상의 이유로 비정형업무 보고를 사용하는 사례 발생, 통계 데이터 누락 등 부작용 방지를 위해 가급적 사용 제한\n다\n차세대 사회보장정보시스템(행복이음) 시설 관련 업무\n1) 차세대 사회보장정보시스템(행복이음) 시설 관련 주요업무\n법인설립/변경에 대한 인･허가 관리(시･도 업무)\n사회복지시설 설치/폐지에 대한 신고처리\n사회복지시설 입소자 입･퇴소 관리\n사회복지시설 종사자 입･퇴사 관리\n사회복지시설 보조금 사업정보 관리\n사회복지시설 보조금 관리\n비정형 보고관리 및 시설공지관리\n※상세 업무처리 내용은 행복이음 시설 및 법인 업무 매뉴얼 참조\n2) 법인설립, 변경에 대한 인･허가 관리(시･도)\n비영리법인에 대한 대장 및 해산신고 등에 대한 관리\n사회복지법인, 재단사단법인의 설립허가, 합병허가, 정관변경, 기본재산처분허가 등에 대한 관리\n3) 사회복지시설 설치･폐지에 대한 신고처리\n사회복지시설 설치 및 대장 관리：사회복지시설의 설치신고, 비용수납신고, 변경 신고, 휴지･폐지･재개신고 등에 대한 관리\n※사회복지시설의 신규 설치 시 해당 자치단체에서는 온라인보고를 위한 사회서비스정보시스템(희망이음) 가입에 대한 독려"}, {"p": 106, "t": "기타복지기관* 지정/신청 및 대장 관리\n‒장기요양기관, 청소년수련시설, 청소년이용권장시설 등의 지정신청, 변경신고, 휴폐업 등에 대한 관리\n*기타 복지기관：「사회복지사업법」 및 개별법령 상 사회복지시설로 분류되지 않은 복지시설(예：정신보건센터, 중독관리통합지원센터, 노인전문병원 등)\n‒(기관유형 정비) 행복이음에서 기관의 유형에 맞지 않게 분류한 경우 기관유형을 재분류\n시설분류 등록 시 유의사항\n‒시설 등록 시 시설분류를 정확히 입력하여야 시설유형별 보조금 지급기준, 시설수급자의 생계비 지급기준 등의 변화에 따라 정확한 복지급여가 산정됨\n‒시설분류는 본 관리안내책자의 “I.사회복지시설 현황”의 시설유형을 참조하며, 각 사업별 관련지침 및 관련법령*에 따라 정확하게 등록하여야 함\n*관련법령：「사회복지사업법」 및 「노인복지법」 등 사회복지시설관련 개별법령의 사회복지시설 참조\n4) 사회복지시설 입소자 입･퇴소 관리\n사회복지시설 중 생활시설에서 온라인을 통해 보고하는 입소자에 대한 입･퇴소 정보 관리\n입･퇴소자에 대한 주민등록 변경여부 확인 후 필요 시 통합조사 요청 및 시설 수급자 정보 관리\n온라인보고 된 입소자 입･퇴소 보고 정보 중 보장기관에서 최종 승인된 정보를 기준으로 입소자 대장이 자동 관리되며, 생계비 산정 및 정산 시 기준정보로 활용\n5) 사회복지시설 종사자 입･퇴사 관리\n사회복지시설에서 온라인을 통해 보고하는 종사자에 대한 입･퇴사 정보, 호봉 승급정보 등에 대한 관리\n온라인보고 된 종사자 입･퇴사 보고 정보 중 자치단체에서 최종 승인된 정보를 기준으로 종사자 대장이 자동 관리되며, 인건비 산정 및 정산 시 기준정보로 활용"}, {"p": 107, "t": "6) 사회복지시설 보조금 사업정보 관리\n시설운영비, 보조사업비 및 기능보강사업비 등 국고 및 지방비를 지원하는 모든 예산항목에 대해 시설별로 사업정보를 관리\n지방재정시스템을 통해 확정된 보조금 정보를 등록하고, 소관 시설별로 배정\n시설별 예산 배정 시 지자체 및 사업의 특성에 따라 보조금 신청 및 정산주기를 결정하고 등록 관리하여 시설 보조금 신청 및 정산의 기준정보로 활용\n7) 사회복지시설 보조금 관리\n보조금 신청 및 정산정보를 온라인으로 보고받아서 관리\n보조사업 정보를 기준으로 사회복지시설에서 온라인으로 보조금 신청정보를 접수하여 승인(승인 시 보조금 자동생성)\n보조금 신청정보를 기준으로 사회복지시설에서 온라인으로 보조금 정산보고를 접수하여 승인(승인 시 보조금 집행 잔액 자동관리)\n사회복지시설별 연간 예산 및 결산 관리\n8) 시설공지 관리\n소관 사회복지시설(지역별, 시설유형별)을 대상으로 일괄 공지가 필요할 시에는 시설 공지관리를 활용하여 사회서비스정보시스템(희망이음)으로 정보전달\n9) 사회복지시설 후원금 관리\n대표이사와 시설장은 관할 시장･군수･구청장에게 결산보고서를 제출할 때 후원금 수입 및 사용결과 보고서를 함께 제출\n‒이 경우 반드시 전자파일로 제출하여야 하며 출력한 보고서도 추가 제출 가능\n시장･군수･구청장은 제출받은 후원금의 수입 및 사용결과 보고서를 제출받은 날부터 20일 이내 인터넷(시･군･구 홈페이지) 등을 통하여 3개월간 공개 (사회복지시설정보시스템, 희망이음(사회서비스정보시스템) 또는 복지로를 통한 공시 시 인터넷 공개 생략 가능)\n같은 기간 동안 법인의 대표이사 및 시설의 장도 후원금 수입 및 사용결과 보고서를 법인 및 시설의 게시판과 인터넷 홈페이지에 공개사회서비스정보시스템(희망이음) 또는 복지로를 통한 공시 시 인터넷 공개 생략 가능)\n4\n기타사항"}]}, {"title": "4. 기타사항", "start": 108, "end": 116, "html": "<div class=\"pchip\" id=\"p108\"><span>원문 108쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=120\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">사회복지시설 관련 교육훈련<\/div><div class=\"ln p\">사회서비스정보시스템(희망이음) 관련 교육 실시<\/div><div class=\"ln p\">‒교육주최：한국사회보장정보원<\/div><div class=\"ln p\">‒교육주관：시･도 사회복지협의회<\/div><div class=\"ln p\">‒교육내용(대상)：사회서비스정보시스템(희망이음)(사회복지시설 종사자)<\/div><div class=\"ln p\">‒지자체는 사회복지시설이 사회서비스정보시스템(희망이음)의 사용 미숙으로 인해 업무상 과실을 범하지 않도록 시스템 사용자 교육에 적극 참여할 수 있도록 안내<\/div><div class=\"ln p\">‒또한 사회복지시설 관리･감독 업무의 효율성 향상을 위하여 사회복지시설통계 시스템 적극 활용<\/div><div class=\"ln p\">교육 관련 문의：한국사회보장정보원 및 시･도 사회복지협의회<\/div><div class=\"ln note\">※교육일정 등 상세정보는 한국사회보장정보원 교육홈페이지(http：//edu.ssis.or.kr) 참조<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">사회복지시설 온라인 보고관련 지도･점검 철저<\/div><div class=\"ln p\">사회복지시설 온라인 보고 점검<\/div><div class=\"ln p\">‒지자체에서는 회계(보조금, 후원금, 수익사업), 계약(공사, 구매), 자산관리(부동산, 장비 등) 등 취약업무와 사회서비스정보시스템(희망이음) 활용도 등을 중점 점검 항목으로 설정하는 등 지도･점검 내용을 보완 강화<\/div><div class=\"pchip\" id=\"p109\"><span>원문 109쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=121\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">민간개발정보시스템 사용시설에 대한 온라인 보고 점검<\/div><div class=\"ln p\">‒해당 시스템을 사용 중인 사회복지시설은 지자체 보고 정보를 정확하게 생성하기 위하여 사회서비스정보시스템(희망이음)에 연계한 기초자료의 정합성 확인에 대한 책임이 있음<\/div><div class=\"ln p\">‒따라서 보고를 받는 지자체는 항상 기초자료 데이터의 정합성의 결격여부를 확인하여,<\/div><div class=\"ln p\">‒정합성 결격여부에 대한 확인 결과 결격사유가 발생하면 해당시설이 민간 S/W 공급자 또는 자체개발책임자에게 프로그램 수정을 하도록 지도하여 정확한 기초자료 데이터 기반의 온라인 보고가 되도록 조치<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">보건복지 정보화 시책사업과 중복투자방지 노력<\/div><div class=\"ln p\">지자체에서는 우리 부 소관사항 관련 ‘사회복지 관련 정보화사업’ 추진 시 ‘행복이음’, ‘사회서비스정보시스템(희망이음)’의 정보화 시책사업과 중복투자로 예산이 낭비되지 않도록 주의 철저<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">개인정보의 보호 및 유출방지<\/div><div class=\"ln p\">◇자세한 내용은 「사회서비스정보시스템 개인정보 보호지침」 참조<\/div><div class=\"ln p\">- 사회서비스정보시스템(희망이음) 포털(http://ssis.go.kr)의 자료실 확인<\/div><div class=\"ln p\">지자체와 시설장은 사회복지시설에서 관리하고 있는 개인정보가 본래의 목적 외 타 용도로 사용되어지거나 외부로 유출되지 않도록 관리･감독 실시<\/div><div class=\"ln p\">‒사회복지서비스 제공을 위한 개인정보 수집 시, 정보주체에게 수집목적, 항목, 보유 및 이용기간, 동의 거부권리 등을 고지하고 동의를 얻거나, 사회복지사업법 및 관련 법령에 명시된 경우 수집 가능<\/div><div class=\"ln p\">‒입소/이용자, 후원자 등의 개인정보 수집에 대한 동의를 받고자 하는 경우, “「개인정보 보호법」 제15조(개인정보의 수집･이용) 제2항”에 따라 다음 각 호의 사항을 사전에 고지하고 개인정보 수집･이용 및 제3자 제공 동의서를 작성할 수 있도록 지도<\/div><div class=\"ln p\">① 개인정보의 수집･이용 목적<\/div><div class=\"pchip\" id=\"p110\"><span>원문 110쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=122\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">② 수집하려는 개인정보의 항목<\/div><div class=\"ln p\">③ 개인정보의 보유 및 이용 기간<\/div><div class=\"ln p\">④동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우 에는 그 불이익의 내용<\/div><div class=\"ln p\">‒그 외 사회복지 서비스 수혜에 따른 개인정보 유출 피해를 예방하기 위한 사전 노력 등<\/div><div class=\"ln p\">개인정보 통합관제<\/div><div class=\"ln p\">‒보건복지부 개인정보보호 지침에 따라 시스템 접근기록을 분석하여, 개인정보 유출 및 오남용 사고 사전예방<\/div><div class=\"ln note\">※의심사례 모니터링, 소명요청 및 답변, 판정, 행정조치 및 결과 등록<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">사회서비스정보시스템(희망이음) 사용의 위탁<\/div><div class=\"ln p\">◇사회복지시설에서 회계 등의 업무를 외부 업체에 위탁하여 처리하는 과정에서 외부 업체가 불가피하게 사회서비스정보시스템(희망이음)을 사용해야 하는 경우 다음 사항을 준수하여야 함<\/div><div class=\"ln p\">업무를 위탁하고자 하는 사회복지시설(이하 ‘위탁시설’)은 「개인정보 보호법」 제26조 및 「개인정보 보호법 시행령」 제28조에 따라 다음의 조치를 취해야 함<\/div><div class=\"ln note\">※자세한 내용은 「개인정보 보호법」(개인정보보호위원회 소관) 및 「개인정보 처리 위･수탁 안내서」 참조<\/div><div class=\"ln p\">희망이음 업무 처리 위･수탁을 위한 단계별 조치 사항<\/div><div class=\"ln h4\">1) 개인정보처리 위･수탁 전 조치 사항 •(위탁할 업무 범위 및 처리 범위) 위탁시설에서 사회서비스정보시스템(희망이음) 및 사회복지시설정보시스템의 사용을 위탁할 수 있는 업무는 회계･세무 등의 업무로 한정되며, 수탁자는 회계･세무 처리에 관련된 정보만 처리할 수 있음 •(수탁자의 선정) 위탁시설은 수탁자의 개인정보 보호 역량*을 종합적으로 검토하여 개인정보 위험을 최소화할 수 있는 자를 선정하는 것이 바람직함 *개인정보보호 교육 여부, 개인정보 보호 관련 내부 지침 마련 여부 등 •(위･수탁 문서 작성) 「개인정보 보호법」 제26조제1항에 의하여 개인정보 처리 위･수탁은 반드시 문서에 의하여야 하며, 문서에는 다음의 내용이 반드시 포함되어야 함 ※위･수탁 문서는 반드시 별도로 작성하여야 하는 것은 아니고, 계약서 등에 위･수탁 시 포함되어야 하는 6가지 내용이 포함되어 있다면 별도의 위･수탁 문서는 작성하지 않아도 됨 2) 개인정보처리 위･수탁 수행 중 조치 사항 •위탁시설은 위탁하는 업무의 내용, 수탁자 및 위탁기간 등을 위탁시설의 인터넷 홈페이지를 통한 지속적 게재를 통해 공개해야 함 ※다만, 인터넷 홈페이지가 없는 등 인터넷 홈페이지에 게재가 불가능한 경우, 위탁자의 사업장 등의 보기 쉬운 장소에 게시하는 방법 등 「개인정보 보호법」 및 동법 시행령에 명시된 방법으로 갈음함 •위탁시설은 수탁자에 대해 개인정보 보호 교육을 실시해야 함 ※다만, 위탁시설이 제3자인 개인정보보호교육 전문가, 전문교육기관 등을 통해 수탁자를 교육할 수 있음. 또한, 수탁자가 위탁시설과 사전에 협의하고 위탁시설이 요구하는 교육을 받은 경우 스스로 개인정보보호교육을 실시할 수 있음 •위탁시설은 수탁자가 「개인정보 보호법」 제26조제1항 각 호의 사항 및 제29조의 안전조치의무를 준수하는지 여부 등 개인정보 처리현황을 감독해야 함 •수탁자는 개인정보 처리 시 「개인정보 보호법」 제26조제7항에 의하여 개인정보처리자에게 부여된 일반적인 의무를 이행해야 함 3) 개인정보처리 위･수탁 종류 후 조치 사항 •위탁시설은 수탁자가 개인정보를 파기하였는지 확인하고 그에 대한 증빙자료를 가지고 있는 것이 바람직함 •위･수탁계약 종료 시 수탁자에게 발급된 아이디는 즉시 미 사용 처리하여야 함 •수탁자는 위･수탁 문서에 명시된 개인정보 처리 기간이 종료되면 위탁시설에게 개인정보를 반환하거나 지체없이 파기하여야 하며, 계약기간 내라도 위･수탁 문서에 명시한 개인정보 처리 목적이 사라지는 경우에는 개인정보를 위탁시설에게 반환하거나 지체 없이 파기하여야 함<\/div><div class=\"pchip\" id=\"p112\"><span>원문 112쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=124\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">위탁시설은 수탁자와 위･수탁 문서를 작성한 이후 수탁자에게 사회서비스정보시스템(희망이음)  사용신청 승인 및 아이디를 발급할 수 있음<\/div><div class=\"ln p\">‒&lt;사회서비스정보시스템(희망이음)&gt; 수탁자 또는 시스템 사용자는 희망이음 회원가입 후 ‘시스템사용신청’ 메뉴에서 시스템 사용 신청을 하여야 하며, 신청시 ‘사용자구분’에서 ‘세무/회계사’ 등 목적에 맞는 구분을 선택하여야 함<\/div><div class=\"ln p\">*<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">수탁자(업체) 정보, 시스템 사용자 이름 등 개인정보<\/div><div class=\"ln p\">지자체에서는 지도･점검 시 다음 사항에 대해 확인하여야 함<\/div><div class=\"ln p\">① 수탁자가 있는지 점검하고,<\/div><div class=\"ln p\">②수탁자가 있는 경우 위･수탁 문서 작성, 수탁자 전용 아이디 발급 여부 등 적절한 절차를 거쳐 시스템을 사용하고 있는지 확인하며,<\/div><div class=\"ln p\">③시스템 사용자가 수탁자와 근로계약을 맺고 있는 등 시스템 사용자가 개인정보 처리자로서 적합한 자격을 갖췄는지 확인하여, 개인정보 보호 준수 여부 확인<\/div><div class=\"ln p\">☞적합한 자격을 갖추지 않은 시스템 사용자가 시스템을 사용하는 경우 「개인정보 보호법」 위반 소지가 있으므로 주의할 것<\/div><div class=\"pchip\" id=\"p113\"><span>원문 113쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=125\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[별지 제2호 서식 별첨]<\/div><table class=\"htbl\"><tr><td>개인정보 수집･이용 및 제3자 제공 동의서(예시)<\/td><\/tr><tr><td>본 ◯◯시설은 시설 입소 및 이용을 위하여 아래의 개인정보 수집･이용 및 제3자 제공에 대한 내용을 자세히 읽어 보신 후 동의 여부를 결정해 주시기 바랍니다.<\/td><\/tr><tr><td>□ 개인정보 수집･이용 내역(필수사항)<br><table class=\"htbl\"><tr><td>항목<\/td><td>수집목적<\/td><td>보유기간<\/td><\/tr><tr><td>이름, 주소, 연락처<\/td><td>복지예산 집행의 투명성 향상 및 복지시설 관련 자원의 효율적 관리<\/td><td>시설폐지(발급일, 최종퇴소)후 5년<\/td><\/tr><\/table><br>□ 선택적 개인정보 수집･이용 내역(동의거부가능)<br><table class=\"htbl\"><tr><td>항목<\/td><td>수집목적<\/td><td>보유기간<\/td><\/tr><tr><td>계좌번호, 생년월일, 이메일…<\/td><td>복지예산 집행의 투명성 향상 및 복지시설 관련 자원의 효율적 관리<\/td><td>시설폐지(발급일, 최종퇴소)후 5년<\/td><\/tr><\/table><br>※위와 같이 개인정보를 수집･이용하는데 동의를 거부할 권리가 있습니다. 그러나 동의를 거부하실 경우 원활한 복지서비스 제공이 어려울 수 있음을 알려드립니다.<br>※ 위와 같이 개인정보를 수집･이용 하는데 동의하십니까?<br>□ 동의함        □ 동의하지 않음<br><table class=\"htbl\"><tr><td>※ 정보주체가 만14세 미만의 아동인 경우 위와 같이 와 같이 개인정보를 수집･이용 하는데 동의하십니까?<br>□ 동의함        □ 동의하지 않음<\/td><\/tr><\/table><\/td><\/tr><tr><td>□ 개인정보 제3자 제공 내역<br><table class=\"htbl\"><tr><td>제공받는자<\/td><td>제공 항목<\/td><td>제공 목적<\/td><td>보유기간<\/td><\/tr><tr><td>국세청<\/td><td>주민등록번호, 이름, 후원내역<\/td><td>연말정산 기부금 증명자료<\/td><td>제공일로부터 5년<\/td><\/tr><tr><td>⦙<\/td><td>⦙<\/td><td>⦙<\/td><td>⦙<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><br>※위와 같이 개인정보를 제공하는데 동의를 거부할 권리가 있습니다. 그러나 동의를 거부하실 경우 원활한 복지서비스 제공이 어려울 수 있음을 알려드립니다.<br>※ 위와 같이 개인정보를 수집･이용 하는데 동의하십니까?<br>□ 동의함        □ 동의하지 않음<br><table class=\"htbl\"><tr><td>※ 정보주체가 만14세 미만의 아동인 경우 위와 같이 와 같이 개인정보를 수집･이용 하는데 동의하십니까?<br>□ 동의함        □ 동의하지 않음<\/td><\/tr><\/table><\/td><\/tr><tr><td>□ 기타 고지 사항<br>개인정보 보호법 제15조제 1항제2호에 따라 정보주체의 동의 없이 개인정보를 수집･이용 합니다.<br><table class=\"htbl\"><tr><td>개인정보 항목<\/td><td>수집목적<\/td><td>수집근거<\/td><\/tr><tr><td>주민등록번호, 외국인등록번호, 여권번호, 민감정보(건강정보등)<\/td><td>⦁ 대상자의 건강정보를 고려한 최적의 복지서비스 제공<br>⦁ 관내 복지서비스 대상자 조사를 위한 지방자치단체 정보 제공<br>⦁ 복지대상자 신상관리<br>⦁ 관내 복지서비스 대상자 조사를 위한 지방자치단체 정보 제공<\/td><td>「사회복지사업법」 제25조2<\/td><\/tr><\/table><\/td><\/tr><tr><td>※상기 내용은 본 기관의 복지서비스 제공 관련 업무를 진행하는데 필요한 최소한의 정보에 해당하며 그 내용에 관하여 동의하지 않을 수 있으나, 그 경우 원활한 복지서비스 제공이 어려울 수 있음을 알려드립니다.<br>※아울러 본 동의서는 상기 목적 외에는 이용하지 않을 것을 약속드리며 철저히 비밀로 관리하여 타인에게 공개하거나 유출하지 않을 것임을 알려드립니다.<br>※ 위 서식은 기관의 특성에 따라 다르게 작성할 수 있습니다.<\/td><\/tr><tr><td>년   월   일<\/td><\/tr><tr><td>본인      성명                           (서명 또는 인)<\/td><\/tr><\/table><div class=\"pchip\" id=\"p114\"><span>원문 114쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=126\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">[희망이음 업무위탁계약 참고서식]<\/div><table class=\"htbl\"><tr><td>표준 개인정보 처리 위탁 계약서(예시)<\/td><\/tr><tr><td><table class=\"htbl\"><tr><td>본 표준 개인정보처리위탁 계약서는 「개인정보 보호법」제26조제1항에 따라 위탁계약에 있어 개인정보 처리에 관하여 문서로 정하여야 하는 최소한의 사항을 표준적으로 제시한 것으로서, 위탁계약이나 위탁업무의 내용 등에 따라 세부적인 내용은 달라질 수 있습니다.<br>개인정보처리업무를 위탁하거나 위탁업무에 개인정보 처리가 포함된 경우에는 본 표준 개인정보처리위탁 계약서의 내용을 위탁계약서에 첨부하거나 반영하여 사용하실 수 있습니다.<\/td><\/tr><\/table><br>OOO(이하 “위탁자”이라 한다)과 △△△(이하 “수탁자”이라 한다)는 “갑”의 개인정보 처리업무를 “을”에게 위탁함에 있어 다음과 같은 내용으로 본 업무위탁계약을 체결한다.<br>제1조 (목적) 이 계약은 “위탁자”가 개인정보처리업무를 “수탁자”에게 위탁하고, “수탁자”은 이를 승낙하여 “수탁자”의 책임아래 성실하게 업무를 완성하도록 하는데 필요한 사항을 정함을 목적으로 한다.<br>제2조 (용어의 정의) 본 계약에서 별도로 정의되지 아니한 용어는 「개인정보 보호법」, 같은 법 시행령 및 시행규칙, 「개인정보의 안전성 확보조치 기준」(개인정보보호위원회 고시 제2023-6호) 및 「표준 개인정보 보호지침」(개인정보보호위원회 고시 제2024-1호)에서 정의된 바에 따른다.<br>제3조 (위탁업무의 목적 및 범위) “수탁자”은 계약이 정하는 바에 따라 (          ) 목적으로 다음과 같은 개인정보 처리 업무를 수행한다.<br>1.<br>2.<br>제4조 (위탁업무 기간) 이 계약서에 의한 개인정보 처리업무의 기간은 다음과 같다.<br>계약 기간 :    년  월  일 ~    년  월  일<br>제5조 (재위탁 제한) ① “수탁자”는 “위탁자”의 사전 승낙을 얻은 경우를 제외하고 “위탁자”와의 계약상의 권리와 의무의 전부 또는 일부를 제3자에게 양도하거나 재위탁할 수 없다.<br>② “수탁자”가 다른 제3의 회사와 수탁계약을 할 경우에는 “수탁자”는 해당 사실을 계약 체결 7일 이전에 “위탁자”에게 통보하고 협의하여야 한다.<br>제6조 (개인정보의 안전성 확보조치) “수탁자”는 「개인정보 보호법」제23조제2항 및 제24조제3항 및 제29조, 같은 법 시행령 제21조 및 제30조, 「개인정보의 안전성 확보조치 기준」(개인정보보호위원회 고시 제2023-6호)에 따라 개인정보의 안전성 확보에 필요한 관리적･기술적 조치를 취하여야 한다.<br>제7조 (개인정보의 처리제한) ① “수탁자”는 계약기간은 물론 계약 종료 후에도 위탁업무 수행 목적 범위를 넘어 개인정보를 이용하거나 이를 제3자에게 제공 또는 누설하여서는 안 된다.<br>② “수탁자”는 계약이 해지되거나 또는 계약기간이 만료된 경우 위탁업무와 관련하여 보유하고 있는 개인정보를 「개인정보 보호법」시행령 제16조 및 「개인정보의 안전성 확보조치 기준」(개인정보보호위원회 고시 제2023-6호)에 따라 즉시 파기하거나 “위탁자”에게 반납하여야 한다.<br>③ 제2항에 따라 “수탁자”가 개인정보를 파기한 경우 지체없이 “위탁자”에게 그 결과를 통보하여야 한다.<br>제8조 (수탁자에 대한 관리･감독 등) ① “위탁자”는 “수탁자”에 대하여 다음 각 호의 사항을 관리하도록 요구할 수 있으며, “수탁자”는 특별한 사유가 없는 한 이에 응하여야 한다.<br>1. 개인정보의 처리 현황<br>2. 개인정보의 접근 또는 접속현황<br>3. 개인정보 접근 또는 접속 대상자<br>4. 목적외 이용･제공 및 재위탁 금지 준수여부<br>5. 암호화 등 안전성 확보조치 이행여부<br>6. 그 밖에 개인정보의 보호를 위하여 필요한 사항<br>② “위탁자”는 “수탁자”에 대하여 제1항 각 호의 사항에 대한 실태를 점검하여 시정을 요구할 수 있으며, “수탁자”는 특별한 사유가 없는 한 이행하여야 한다.<br>③ “위탁자”는 처리위탁으로 인하여 정보주체의 개인정보가 분실･도난･유출･변조 또는 훼손되지 아니하도록 1년에 (  )회 “수탁자”를 교육할 수 있으며, “수탁자”는 이에 응하여야 한다.<br>④ 제1항에 따른 교육의 시기와 방법 등에 대해서는 “위탁자”는 “수탁자”와 협의하여 시행한다.<br>제9조 (정보주체 권리보장) ① “수탁자”는 정보주체의 개인정보 열람, 정정･삭제, 처리 정지 요청 등에 대응하기 위한 연락처 등 민원 창구를 마련해야 한다.<br>제10조 (개인정보의 파기) ① “수탁자”는 제4조의 위탁업무기간이 종료되면 특별한 사유가 없는 한 지체 없이 개인정보를 파기하고 이를 “위탁자”에게 확인받아야 한다.<br>제11조 (손해배상) ① “수탁자” 또는 “수탁자”의 임직원 기타 “수탁자”의 수탁자가 이 계약에 의하여 위탁 또는 재위탁 받은 업무를 수행함에 있어 이 계약에 따른 의무를 위반하거나 “수탁자” 또는 “수탁자”의 임직원 기타 “수탁자”의 수탁자의 귀책사유로 인하여 이 계약이 해지되어 “위탁자” 또는 개인정보주체 기타 제3자에게 손해가 발생한 경우 “수탁자”는 그 손해를 배상하여야 한다.<br>② 제1항과 관련하여 개인정보주체 기타 제3자에게 발생한 손해에 대하여 “위탁자”가 전부 또는 일부를 배상한 때에는 “위탁자”는 이를 “위탁자”에게 구상할 수 있다.<br>본 계약의 내용을 증명하기 위하여 계약서 2부를 작성하고, “위탁자”와 “수탁자”가 서명 또는 날인한 후 각 1부씩 보관한다.<br><table class=\"htbl\"><tr><td>위탁자<br>주  소 :<br>기관(회사)명 :<br>대표자 성명 :                   (인)<\/td><td>수탁자<br>주  소 :<br>기관(회사)명 :<br>대표자 성명 :                   (인)<\/td><\/tr><\/table><\/td><\/tr><\/table>", "pages": [{"p": 108, "t": "가\n사회복지시설 관련 교육훈련\n사회서비스정보시스템(희망이음) 관련 교육 실시\n‒교육주최：한국사회보장정보원\n‒교육주관：시･도 사회복지협의회\n‒교육내용(대상)：사회서비스정보시스템(희망이음)(사회복지시설 종사자)\n‒지자체는 사회복지시설이 사회서비스정보시스템(희망이음)의 사용 미숙으로 인해 업무상 과실을 범하지 않도록 시스템 사용자 교육에 적극 참여할 수 있도록 안내\n‒또한 사회복지시설 관리･감독 업무의 효율성 향상을 위하여 사회복지시설통계 시스템 적극 활용\n교육 관련 문의：한국사회보장정보원 및 시･도 사회복지협의회\n※교육일정 등 상세정보는 한국사회보장정보원 교육홈페이지(http：//edu.ssis.or.kr) 참조\n나\n사회복지시설 온라인 보고관련 지도･점검 철저\n사회복지시설 온라인 보고 점검\n‒지자체에서는 회계(보조금, 후원금, 수익사업), 계약(공사, 구매), 자산관리(부동산, 장비 등) 등 취약업무와 사회서비스정보시스템(희망이음) 활용도 등을 중점 점검 항목으로 설정하는 등 지도･점검 내용을 보완 강화"}, {"p": 109, "t": "민간개발정보시스템 사용시설에 대한 온라인 보고 점검\n‒해당 시스템을 사용 중인 사회복지시설은 지자체 보고 정보를 정확하게 생성하기 위하여 사회서비스정보시스템(희망이음)에 연계한 기초자료의 정합성 확인에 대한 책임이 있음\n‒따라서 보고를 받는 지자체는 항상 기초자료 데이터의 정합성의 결격여부를 확인하여,\n‒정합성 결격여부에 대한 확인 결과 결격사유가 발생하면 해당시설이 민간 S/W 공급자 또는 자체개발책임자에게 프로그램 수정을 하도록 지도하여 정확한 기초자료 데이터 기반의 온라인 보고가 되도록 조치\n다\n보건복지 정보화 시책사업과 중복투자방지 노력\n지자체에서는 우리 부 소관사항 관련 ‘사회복지 관련 정보화사업’ 추진 시 ‘행복이음’, ‘사회서비스정보시스템(희망이음)’의 정보화 시책사업과 중복투자로 예산이 낭비되지 않도록 주의 철저\n라\n개인정보의 보호 및 유출방지\n◇자세한 내용은 「사회서비스정보시스템 개인정보 보호지침」 참조\n- 사회서비스정보시스템(희망이음) 포털(http://ssis.go.kr)의 자료실 확인\n지자체와 시설장은 사회복지시설에서 관리하고 있는 개인정보가 본래의 목적 외 타 용도로 사용되어지거나 외부로 유출되지 않도록 관리･감독 실시\n‒사회복지서비스 제공을 위한 개인정보 수집 시, 정보주체에게 수집목적, 항목, 보유 및 이용기간, 동의 거부권리 등을 고지하고 동의를 얻거나, 사회복지사업법 및 관련 법령에 명시된 경우 수집 가능\n‒입소/이용자, 후원자 등의 개인정보 수집에 대한 동의를 받고자 하는 경우, “「개인정보 보호법」 제15조(개인정보의 수집･이용) 제2항”에 따라 다음 각 호의 사항을 사전에 고지하고 개인정보 수집･이용 및 제3자 제공 동의서를 작성할 수 있도록 지도\n① 개인정보의 수집･이용 목적"}, {"p": 110, "t": "② 수집하려는 개인정보의 항목\n③ 개인정보의 보유 및 이용 기간\n④동의를 거부할 권리가 있다는 사실 및 동의 거부에 따른 불이익이 있는 경우 에는 그 불이익의 내용\n‒그 외 사회복지 서비스 수혜에 따른 개인정보 유출 피해를 예방하기 위한 사전 노력 등\n개인정보 통합관제\n‒보건복지부 개인정보보호 지침에 따라 시스템 접근기록을 분석하여, 개인정보 유출 및 오남용 사고 사전예방\n※의심사례 모니터링, 소명요청 및 답변, 판정, 행정조치 및 결과 등록\n마\n사회서비스정보시스템(희망이음) 사용의 위탁\n◇사회복지시설에서 회계 등의 업무를 외부 업체에 위탁하여 처리하는 과정에서 외부 업체가 불가피하게 사회서비스정보시스템(희망이음)을 사용해야 하는 경우 다음 사항을 준수하여야 함\n업무를 위탁하고자 하는 사회복지시설(이하 ‘위탁시설’)은 「개인정보 보호법」 제26조 및 「개인정보 보호법 시행령」 제28조에 따라 다음의 조치를 취해야 함\n※자세한 내용은 「개인정보 보호법」(개인정보보호위원회 소관) 및 「개인정보 처리 위･수탁 안내서」 참조\n희망이음 업무 처리 위･수탁을 위한 단계별 조치 사항\n1) 개인정보처리 위･수탁 전 조치 사항 •(위탁할 업무 범위 및 처리 범위) 위탁시설에서 사회서비스정보시스템(희망이음) 및 사회복지시설정보시스템의 사용을 위탁할 수 있는 업무는 회계･세무 등의 업무로 한정되며, 수탁자는 회계･세무 처리에 관련된 정보만 처리할 수 있음 •(수탁자의 선정) 위탁시설은 수탁자의 개인정보 보호 역량*을 종합적으로 검토하여 개인정보 위험을 최소화할 수 있는 자를 선정하는 것이 바람직함 *개인정보보호 교육 여부, 개인정보 보호 관련 내부 지침 마련 여부 등 •(위･수탁 문서 작성) 「개인정보 보호법」 제26조제1항에 의하여 개인정보 처리 위･수탁은 반드시 문서에 의하여야 하며, 문서에는 다음의 내용이 반드시 포함되어야 함 ※위･수탁 문서는 반드시 별도로 작성하여야 하는 것은 아니고, 계약서 등에 위･수탁 시 포함되어야 하는 6가지 내용이 포함되어 있다면 별도의 위･수탁 문서는 작성하지 않아도 됨 2) 개인정보처리 위･수탁 수행 중 조치 사항 •위탁시설은 위탁하는 업무의 내용, 수탁자 및 위탁기간 등을 위탁시설의 인터넷 홈페이지를 통한 지속적 게재를 통해 공개해야 함 ※다만, 인터넷 홈페이지가 없는 등 인터넷 홈페이지에 게재가 불가능한 경우, 위탁자의 사업장 등의 보기 쉬운 장소에 게시하는 방법 등 「개인정보 보호법」 및 동법 시행령에 명시된 방법으로 갈음함 •위탁시설은 수탁자에 대해 개인정보 보호 교육을 실시해야 함 ※다만, 위탁시설이 제3자인 개인정보보호교육 전문가, 전문교육기관 등을 통해 수탁자를 교육할 수 있음. 또한, 수탁자가 위탁시설과 사전에 협의하고 위탁시설이 요구하는 교육을 받은 경우 스스로 개인정보보호교육을 실시할 수 있음 •위탁시설은 수탁자가 「개인정보 보호법」 제26조제1항 각 호의 사항 및 제29조의 안전조치의무를 준수하는지 여부 등 개인정보 처리현황을 감독해야 함 •수탁자는 개인정보 처리 시 「개인정보 보호법」 제26조제7항에 의하여 개인정보처리자에게 부여된 일반적인 의무를 이행해야 함 3) 개인정보처리 위･수탁 종류 후 조치 사항 •위탁시설은 수탁자가 개인정보를 파기하였는지 확인하고 그에 대한 증빙자료를 가지고 있는 것이 바람직함 •위･수탁계약 종료 시 수탁자에게 발급된 아이디는 즉시 미 사용 처리하여야 함 •수탁자는 위･수탁 문서에 명시된 개인정보 처리 기간이 종료되면 위탁시설에게 개인정보를 반환하거나 지체없이 파기하여야 하며, 계약기간 내라도 위･수탁 문서에 명시한 개인정보 처리 목적이 사라지는 경우에는 개인정보를 위탁시설에게 반환하거나 지체 없이 파기하여야 함"}, {"p": 112, "t": "위탁시설은 수탁자와 위･수탁 문서를 작성한 이후 수탁자에게 사회서비스정보시스템(희망이음)  사용신청 승인 및 아이디를 발급할 수 있음\n‒<사회서비스정보시스템(희망이음)> 수탁자 또는 시스템 사용자는 희망이음 회원가입 후 ‘시스템사용신청’ 메뉴에서 시스템 사용 신청을 하여야 하며, 신청시 ‘사용자구분’에서 ‘세무/회계사’ 등 목적에 맞는 구분을 선택하여야 함\n*\n예시\n수탁자(업체) 정보, 시스템 사용자 이름 등 개인정보\n지자체에서는 지도･점검 시 다음 사항에 대해 확인하여야 함\n① 수탁자가 있는지 점검하고,\n②수탁자가 있는 경우 위･수탁 문서 작성, 수탁자 전용 아이디 발급 여부 등 적절한 절차를 거쳐 시스템을 사용하고 있는지 확인하며,\n③시스템 사용자가 수탁자와 근로계약을 맺고 있는 등 시스템 사용자가 개인정보 처리자로서 적합한 자격을 갖췄는지 확인하여, 개인정보 보호 준수 여부 확인\n☞적합한 자격을 갖추지 않은 시스템 사용자가 시스템을 사용하는 경우 「개인정보 보호법」 위반 소지가 있으므로 주의할 것"}, {"p": 113, "t": "[별지 제2호 서식 별첨]\n개인정보 수집･이용 및 제3자 제공 동의서(예시)\n본 ◯◯시설은 시설 입소 및 이용을 위하여 아래의 개인정보 수집･이용 및 제3자 제공에 대한 내용을 자세히 읽어 보신 후 동의 여부를 결정해 주시기 바랍니다.\n□ 개인정보 수집･이용 내역(필수사항) 항목 | 수집목적 | 보유기간\n이름, 주소, 연락처 | 복지예산 집행의 투명성 향상 및 복지시설 관련 자원의 효율적 관리 | 시설폐지(발급일, 최종퇴소)후 5년 □ 선택적 개인정보 수집･이용 내역(동의거부가능) 항목 | 수집목적 | 보유기간\n계좌번호, 생년월일, 이메일… | 복지예산 집행의 투명성 향상 및 복지시설 관련 자원의 효율적 관리 | 시설폐지(발급일, 최종퇴소)후 5년 ※위와 같이 개인정보를 수집･이용하는데 동의를 거부할 권리가 있습니다. 그러나 동의를 거부하실 경우 원활한 복지서비스 제공이 어려울 수 있음을 알려드립니다. ※ 위와 같이 개인정보를 수집･이용 하는데 동의하십니까? □ 동의함        □ 동의하지 않음 ※ 정보주체가 만14세 미만의 아동인 경우 위와 같이 와 같이 개인정보를 수집･이용 하는데 동의하십니까? □ 동의함        □ 동의하지 않음\n□ 개인정보 제3자 제공 내역 제공받는자 | 제공 항목 | 제공 목적 | 보유기간\n국세청 | 주민등록번호, 이름, 후원내역 | 연말정산 기부금 증명자료 | 제공일로부터 5년\n⦙ | ⦙ | ⦙ | ⦙\n |  |  | \n |  |  |  ※위와 같이 개인정보를 제공하는데 동의를 거부할 권리가 있습니다. 그러나 동의를 거부하실 경우 원활한 복지서비스 제공이 어려울 수 있음을 알려드립니다. ※ 위와 같이 개인정보를 수집･이용 하는데 동의하십니까? □ 동의함        □ 동의하지 않음 ※ 정보주체가 만14세 미만의 아동인 경우 위와 같이 와 같이 개인정보를 수집･이용 하는데 동의하십니까? □ 동의함        □ 동의하지 않음\n□ 기타 고지 사항 개인정보 보호법 제15조제 1항제2호에 따라 정보주체의 동의 없이 개인정보를 수집･이용 합니다. 개인정보 항목 | 수집목적 | 수집근거\n주민등록번호, 외국인등록번호, 여권번호, 민감정보(건강정보등) | ⦁ 대상자의 건강정보를 고려한 최적의 복지서비스 제공 ⦁ 관내 복지서비스 대상자 조사를 위한 지방자치단체 정보 제공 ⦁ 복지대상자 신상관리 ⦁ 관내 복지서비스 대상자 조사를 위한 지방자치단체 정보 제공 | 「사회복지사업법」 제25조2\n※상기 내용은 본 기관의 복지서비스 제공 관련 업무를 진행하는데 필요한 최소한의 정보에 해당하며 그 내용에 관하여 동의하지 않을 수 있으나, 그 경우 원활한 복지서비스 제공이 어려울 수 있음을 알려드립니다. ※아울러 본 동의서는 상기 목적 외에는 이용하지 않을 것을 약속드리며 철저히 비밀로 관리하여 타인에게 공개하거나 유출하지 않을 것임을 알려드립니다. ※ 위 서식은 기관의 특성에 따라 다르게 작성할 수 있습니다.\n년   월   일\n본인      성명                           (서명 또는 인)"}, {"p": 114, "t": "[희망이음 업무위탁계약 참고서식]\n표준 개인정보 처리 위탁 계약서(예시)\n본 표준 개인정보처리위탁 계약서는 「개인정보 보호법」제26조제1항에 따라 위탁계약에 있어 개인정보 처리에 관하여 문서로 정하여야 하는 최소한의 사항을 표준적으로 제시한 것으로서, 위탁계약이나 위탁업무의 내용 등에 따라 세부적인 내용은 달라질 수 있습니다. 개인정보처리업무를 위탁하거나 위탁업무에 개인정보 처리가 포함된 경우에는 본 표준 개인정보처리위탁 계약서의 내용을 위탁계약서에 첨부하거나 반영하여 사용하실 수 있습니다. OOO(이하 “위탁자”이라 한다)과 △△△(이하 “수탁자”이라 한다)는 “갑”의 개인정보 처리업무를 “을”에게 위탁함에 있어 다음과 같은 내용으로 본 업무위탁계약을 체결한다. 제1조 (목적) 이 계약은 “위탁자”가 개인정보처리업무를 “수탁자”에게 위탁하고, “수탁자”은 이를 승낙하여 “수탁자”의 책임아래 성실하게 업무를 완성하도록 하는데 필요한 사항을 정함을 목적으로 한다. 제2조 (용어의 정의) 본 계약에서 별도로 정의되지 아니한 용어는 「개인정보 보호법」, 같은 법 시행령 및 시행규칙, 「개인정보의 안전성 확보조치 기준」(개인정보보호위원회 고시 제2023-6호) 및 「표준 개인정보 보호지침」(개인정보보호위원회 고시 제2024-1호)에서 정의된 바에 따른다. 제3조 (위탁업무의 목적 및 범위) “수탁자”은 계약이 정하는 바에 따라 (          ) 목적으로 다음과 같은 개인정보 처리 업무를 수행한다. 1. 2. 제4조 (위탁업무 기간) 이 계약서에 의한 개인정보 처리업무의 기간은 다음과 같다. 계약 기간 :    년  월  일 ~    년  월  일 제5조 (재위탁 제한) ① “수탁자”는 “위탁자”의 사전 승낙을 얻은 경우를 제외하고 “위탁자”와의 계약상의 권리와 의무의 전부 또는 일부를 제3자에게 양도하거나 재위탁할 수 없다. ② “수탁자”가 다른 제3의 회사와 수탁계약을 할 경우에는 “수탁자”는 해당 사실을 계약 체결 7일 이전에 “위탁자”에게 통보하고 협의하여야 한다. 제6조 (개인정보의 안전성 확보조치) “수탁자”는 「개인정보 보호법」제23조제2항 및 제24조제3항 및 제29조, 같은 법 시행령 제21조 및 제30조, 「개인정보의 안전성 확보조치 기준」(개인정보보호위원회 고시 제2023-6호)에 따라 개인정보의 안전성 확보에 필요한 관리적･기술적 조치를 취하여야 한다. 제7조 (개인정보의 처리제한) ① “수탁자”는 계약기간은 물론 계약 종료 후에도 위탁업무 수행 목적 범위를 넘어 개인정보를 이용하거나 이를 제3자에게 제공 또는 누설하여서는 안 된다. ② “수탁자”는 계약이 해지되거나 또는 계약기간이 만료된 경우 위탁업무와 관련하여 보유하고 있는 개인정보를 「개인정보 보호법」시행령 제16조 및 「개인정보의 안전성 확보조치 기준」(개인정보보호위원회 고시 제2023-6호)에 따라 즉시 파기하거나 “위탁자”에게 반납하여야 한다. ③ 제2항에 따라 “수탁자”가 개인정보를 파기한 경우 지체없이 “위탁자”에게 그 결과를 통보하여야 한다. 제8조 (수탁자에 대한 관리･감독 등) ① “위탁자”는 “수탁자”에 대하여 다음 각 호의 사항을 관리하도록 요구할 수 있으며, “수탁자”는 특별한 사유가 없는 한 이에 응하여야 한다. 1. 개인정보의 처리 현황 2. 개인정보의 접근 또는 접속현황 3. 개인정보 접근 또는 접속 대상자 4. 목적외 이용･제공 및 재위탁 금지 준수여부 5. 암호화 등 안전성 확보조치 이행여부 6. 그 밖에 개인정보의 보호를 위하여 필요한 사항 ② “위탁자”는 “수탁자”에 대하여 제1항 각 호의 사항에 대한 실태를 점검하여 시정을 요구할 수 있으며, “수탁자”는 특별한 사유가 없는 한 이행하여야 한다. ③ “위탁자”는 처리위탁으로 인하여 정보주체의 개인정보가 분실･도난･유출･변조 또는 훼손되지 아니하도록 1년에 (  )회 “수탁자”를 교육할 수 있으며, “수탁자”는 이에 응하여야 한다. ④ 제1항에 따른 교육의 시기와 방법 등에 대해서는 “위탁자”는 “수탁자”와 협의하여 시행한다. 제9조 (정보주체 권리보장) ① “수탁자”는 정보주체의 개인정보 열람, 정정･삭제, 처리 정지 요청 등에 대응하기 위한 연락처 등 민원 창구를 마련해야 한다. 제10조 (개인정보의 파기) ① “수탁자”는 제4조의 위탁업무기간이 종료되면 특별한 사유가 없는 한 지체 없이 개인정보를 파기하고 이를 “위탁자”에게 확인받아야 한다. 제11조 (손해배상) ① “수탁자” 또는 “수탁자”의 임직원 기타 “수탁자”의 수탁자가 이 계약에 의하여 위탁 또는 재위탁 받은 업무를 수행함에 있어 이 계약에 따른 의무를 위반하거나 “수탁자” 또는 “수탁자”의 임직원 기타 “수탁자”의 수탁자의 귀책사유로 인하여 이 계약이 해지되어 “위탁자” 또는 개인정보주체 기타 제3자에게 손해가 발생한 경우 “수탁자”는 그 손해를 배상하여야 한다. ② 제1항과 관련하여 개인정보주체 기타 제3자에게 발생한 손해에 대하여 “위탁자”가 전부 또는 일부를 배상한 때에는 “위탁자”는 이를 “위탁자”에게 구상할 수 있다. 본 계약의 내용을 증명하기 위하여 계약서 2부를 작성하고, “위탁자”와 “수탁자”가 서명 또는 날인한 후 각 1부씩 보관한다. 위탁자 주  소 : 기관(회사)명 : 대표자 성명 :                   (인) | 수탁자 주  소 : 기관(회사)명 : 대표자 성명 :                   (인)"}]}]}, {"no": 4, "title": "사회복지시설의 안전관리", "start": 117, "end": 128, "sections": [{"title": "1. 보험가입여부 확인", "start": 118, "end": 119, "html": "<div class=\"pchip\" id=\"p118\"><span>원문 118쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=130\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1. 보험가입여부 확인<\/div><div class=\"ln p\">2. 시설안전점검 실시<\/div><div class=\"ln p\">3. 안전관리 인력 확보<\/div><div class=\"ln p\">4. 안전관리 교육･훈련<\/div><div class=\"ln p\">5. 건축물 및 소방관계 법령 준수 여부 확인<\/div><div class=\"ln h2\"><span class=\"badge\">1<\/span>6. 재난･안전 관련 주체별 주요 임무<\/div><div class=\"ln p\">보험가입여부 확인<\/div><div class=\"ln p\">사회복지시설은 화재 및 안전사고로 인한 손해배상책임의 이행을 위해 책임보험* 또는 책임공제**에 가입할 의무가 있음(「사회복지사업법」 제34조의3)<\/div><div class=\"ln p\">‒시･군･구는 사회복지시설 이용자와 생활자의 안전을 확보하기 위하여 보험에 가입하지 않는 사회복지시설에 대해 법 제58조제2항 및 시행령 제26조 [별표 5]에 따라 300만 원 이하의 과태료 처분을 할 것<\/div><div class=\"ln p\">보험가입 의무 관련 「사회복지사업법」 안내<\/div><div class=\"ln p\">*ʼ14.6.5부터 모든 사회복지시설은 아래와 같이 기존의 화재대비 손해배상책임보험 외에도 ‘화재 외의 안전사고로 인하여 생명･신체에 피해를 입은 보호대상자에 대한 손해배상 책임보험’ 또는 ‘책임공제’에 가입해야 하는 바, 각 지자체는 이에 대한 안내와 그 지도감독 등에 힘쓸 것(법규정을 동시에 충족하는 통합상품도 존재하므로, 반드시 보험이 2건 이상일 필요는 없음 ‒화재보험은 「사회복지사업법」 제34조의3제1항제1호의 “화재로 인한 손해배상책임 보험”에 해당하지 않음(*통칭 ‘영업배상책임보험(공제)’이 화재사고를 포함하여 이용자의 손해를 배상하는 책임보험(공제)에 해당함) ‒각 호를 충족하지 못한 경우는 과태료 처분 대상에 해당하므로, 보험가입 시 관련 규정이 반드시 포함될 수 있도록 유의<\/div><div class=\"ln p\">‒따라서 지자체는 시설 정기안전점검 시 각 시설의 대인･대물 책임보험 또는 책임공제 가입여부를 점검하여야 하며, 특히 화재로 인한 손해 발생 시 적정한 보상이 담보될 수 있도록 1인당 배상책임보험액의 적정성 여부를 확인해야 함<\/div><div class=\"ln p\">‒「재난 및 안전관리 기본법」 및 같은 법 시행령 제84조의2를 참조하되, 사회복지공제회 무료상담 등을 통해 시설 규모 및 생활자･이용자 수 등 시설 현황을 고려한 적절한 보험 상품을 선택할 수 있도록 지도･안내<\/div><div class=\"pchip\" id=\"p119\"><span>원문 119쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=131\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">「재난 및 안전관리 기본법」 시행령 보상한도 및 압류 금지 규정 참고<\/div><div class=\"ln p\">「재난 및 안전관리 기본법 시행령(약칭: 재난안전법 시행령)」 제84조의2(재난안전의무보험의 보상 한도 등) ① 법 제76조의2제1항제1호에서 “대통령령으로 정하는 수준의 보상 한도”란 피해자 1명당 다음 각 호의 기준을 모두 충족하는 금액의 보상 한도를 말한다. 1. 사망의 경우: 1억 5천만원 이상 2. 부상의 경우: 3천만원 이상 3. 부상에 대한 치료를 마친 후 더 이상의 치료효과를 기대할 수 없고 그 증상이 고정된 상태에서 그 부상이 원인이 되는 신체적 장해가 생긴 경우: 1억 5천만원 이상 「재난 및 안전관리 기본법」 제76조의5(재난취약시설 보험･공제의 가입 등) ⑦ 재난취약시설보험등의 보험금지급청구권 또는 공제급여청구권은 양도･압류하거나 담보로 제공할 수 없다.<\/div><div class=\"ln p\">*책임보험이라 함은 ‘피보험자가 타인의 신체나 재산에 손해를 입혀 법률상 손해배상의 책임을 지게 된 경우, 그 배상으로 말미암아 생기는 피보험자의 손해를 보상할 것으로 목적으로 하는 손해보험’을 의미함<\/div><div class=\"ln p\">**책임공제라 함은 「사회복지사 등의 처우 및 지위 향상을 위한 법률」 제4조 규정에 따라 설립한 한국사회복지공제회의 책임공제를 의미함<\/div><div class=\"ln p\">한국사회복지공제회<\/div><div class=\"ln p\">설립근거：「사회복지사 등의 처우 및 지위 향상을 위한 법률」 제4조 설립목적：사회복지사 등의 생활안정 및 복지증진 주요사업 -회원에 대한 장기저축급여 -생활안정자금 및 전세자금 대출 서비스 -사회복지시설 및 종사자 화재･배상 및 상해보험 등 보험상품(※ 공제회 책임공제보험 미가입시설도 적정 보험가입에 대한 무료상담 이용 가능) -생활안정자금 대출 서비스 문의처：☎ 02‒3775‒8899<\/div><div class=\"ln p\">시설의 지도･감독청인 시･도 및 시･군･구는 해당 사회복지시설이 의무 가입해야 하는 책임보험 또는 책임공제와 관련하여 가능한 한 소멸식 상품을 가입토록 관리해 나가되<\/div><div class=\"ln p\">‒불가피하게 해당 시설이 적립식 상품을 가입한 경우라면 시설이 그 만기 환급금 수령 후 시설운영비로 세입처리를 반드시 하도록 관리감독 강화 요망<\/div><div class=\"ln p\">*지자체 감사 시, ‘적립식’ 책임보험 상품 가입하여 만기 환급금 수령 후 부적절한 세입처리로 위법･부당행위가 적발된 건이 있었음(2013년 ○○도 특정감사 결과)<\/div><div class=\"ln p\">재난안전의무보험 종합정보시스템에 책임보험 가입여부 확인할 수 있도록 시스템 연계 예정<\/div>", "pages": [{"p": 118, "t": "1. 보험가입여부 확인\n2. 시설안전점검 실시\n3. 안전관리 인력 확보\n4. 안전관리 교육･훈련\n5. 건축물 및 소방관계 법령 준수 여부 확인\n6. 재난･안전 관련 주체별 주요 임무\n1\n보험가입여부 확인\n사회복지시설은 화재 및 안전사고로 인한 손해배상책임의 이행을 위해 책임보험* 또는 책임공제**에 가입할 의무가 있음(「사회복지사업법」 제34조의3)\n‒시･군･구는 사회복지시설 이용자와 생활자의 안전을 확보하기 위하여 보험에 가입하지 않는 사회복지시설에 대해 법 제58조제2항 및 시행령 제26조 [별표 5]에 따라 300만 원 이하의 과태료 처분을 할 것\n보험가입 의무 관련 「사회복지사업법」 안내\n*ʼ14.6.5부터 모든 사회복지시설은 아래와 같이 기존의 화재대비 손해배상책임보험 외에도 ‘화재 외의 안전사고로 인하여 생명･신체에 피해를 입은 보호대상자에 대한 손해배상 책임보험’ 또는 ‘책임공제’에 가입해야 하는 바, 각 지자체는 이에 대한 안내와 그 지도감독 등에 힘쓸 것(법규정을 동시에 충족하는 통합상품도 존재하므로, 반드시 보험이 2건 이상일 필요는 없음 ‒화재보험은 「사회복지사업법」 제34조의3제1항제1호의 “화재로 인한 손해배상책임 보험”에 해당하지 않음(*통칭 ‘영업배상책임보험(공제)’이 화재사고를 포함하여 이용자의 손해를 배상하는 책임보험(공제)에 해당함) ‒각 호를 충족하지 못한 경우는 과태료 처분 대상에 해당하므로, 보험가입 시 관련 규정이 반드시 포함될 수 있도록 유의\n‒따라서 지자체는 시설 정기안전점검 시 각 시설의 대인･대물 책임보험 또는 책임공제 가입여부를 점검하여야 하며, 특히 화재로 인한 손해 발생 시 적정한 보상이 담보될 수 있도록 1인당 배상책임보험액의 적정성 여부를 확인해야 함\n‒「재난 및 안전관리 기본법」 및 같은 법 시행령 제84조의2를 참조하되, 사회복지공제회 무료상담 등을 통해 시설 규모 및 생활자･이용자 수 등 시설 현황을 고려한 적절한 보험 상품을 선택할 수 있도록 지도･안내"}, {"p": 119, "t": "「재난 및 안전관리 기본법」 시행령 보상한도 및 압류 금지 규정 참고\n「재난 및 안전관리 기본법 시행령(약칭: 재난안전법 시행령)」 제84조의2(재난안전의무보험의 보상 한도 등) ① 법 제76조의2제1항제1호에서 “대통령령으로 정하는 수준의 보상 한도”란 피해자 1명당 다음 각 호의 기준을 모두 충족하는 금액의 보상 한도를 말한다. 1. 사망의 경우: 1억 5천만원 이상 2. 부상의 경우: 3천만원 이상 3. 부상에 대한 치료를 마친 후 더 이상의 치료효과를 기대할 수 없고 그 증상이 고정된 상태에서 그 부상이 원인이 되는 신체적 장해가 생긴 경우: 1억 5천만원 이상 「재난 및 안전관리 기본법」 제76조의5(재난취약시설 보험･공제의 가입 등) ⑦ 재난취약시설보험등의 보험금지급청구권 또는 공제급여청구권은 양도･압류하거나 담보로 제공할 수 없다.\n*책임보험이라 함은 ‘피보험자가 타인의 신체나 재산에 손해를 입혀 법률상 손해배상의 책임을 지게 된 경우, 그 배상으로 말미암아 생기는 피보험자의 손해를 보상할 것으로 목적으로 하는 손해보험’을 의미함\n**책임공제라 함은 「사회복지사 등의 처우 및 지위 향상을 위한 법률」 제4조 규정에 따라 설립한 한국사회복지공제회의 책임공제를 의미함\n한국사회복지공제회\n설립근거：「사회복지사 등의 처우 및 지위 향상을 위한 법률」 제4조 설립목적：사회복지사 등의 생활안정 및 복지증진 주요사업 -회원에 대한 장기저축급여 -생활안정자금 및 전세자금 대출 서비스 -사회복지시설 및 종사자 화재･배상 및 상해보험 등 보험상품(※ 공제회 책임공제보험 미가입시설도 적정 보험가입에 대한 무료상담 이용 가능) -생활안정자금 대출 서비스 문의처：☎ 02‒3775‒8899\n시설의 지도･감독청인 시･도 및 시･군･구는 해당 사회복지시설이 의무 가입해야 하는 책임보험 또는 책임공제와 관련하여 가능한 한 소멸식 상품을 가입토록 관리해 나가되\n‒불가피하게 해당 시설이 적립식 상품을 가입한 경우라면 시설이 그 만기 환급금 수령 후 시설운영비로 세입처리를 반드시 하도록 관리감독 강화 요망\n*지자체 감사 시, ‘적립식’ 책임보험 상품 가입하여 만기 환급금 수령 후 부적절한 세입처리로 위법･부당행위가 적발된 건이 있었음(2013년 ○○도 특정감사 결과)\n재난안전의무보험 종합정보시스템에 책임보험 가입여부 확인할 수 있도록 시스템 연계 예정"}]}, {"title": "2. 시설안전점검 실시", "start": 120, "end": 123, "html": "<div class=\"pchip\" id=\"p120\"><span>원문 120쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=132\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>시설안전점검 실시<\/div><div class=\"ln h4\">1) 사회복지시설 자체 안전점검(법 제34조의4)<\/div><table class=\"htbl\"><tr><td>정기안전점검<br>∙시설장<br>∙매반기<\/td><td>→<\/td><td>수시안전점검<br>∙시설장(점검자：안전 진단전문기관, 전문건설업자)<br>∙위해발생 우려 시<\/td><td>→<\/td><td>결과보고(정기･수시)<br>∙시설장➝지자체➝복지부<br>∙매반기<\/td><td>→<\/td><td>개･보수요구<br>∙시장･군수･구청장<br>∙필요 시<\/td><\/tr><\/table><div class=\"ln p\">(정기안전점검) 시설장은 매 반기 시설에 대해 정기안전점검을 실시하고 그 결과를 시장･군수･구청장에게 제출하여야 한다.<\/div><div class=\"ln p\">(수시안전점검) 시설장은 정기안전점검 결과 해당시설의 구조･설비의 안전도가 취약하여 위해의 우려가 있는 때에는 안전점검기관에 수시안전점검을 의뢰하여 그 결과를 시장･군수･구청장에 제출하여야 함<\/div><div class=\"ln p\">‒안전점검기관：「시설물의 안전 및 유지관리에 관한 특별법」 제28조에 따른 안전진단전문 기관 또는 「건설산업기본법」 제9조에 따른 시설물의 유지관리를 업으로 하는 전문건설업자<\/div><div class=\"ln p\">‒안전점검기준：「시설물의 안전 및 유지관리에 관한 특별법」 제21조의 규정에 의한 안전 점검 및 정밀안전진단 지침<\/div><div class=\"ln p\">☞시설안전점검을 수행하지 않을 경우 300만원 이하 과태료를 부과함(법 제58조제2항)<\/div><div class=\"ln p\">시장･군수･구청장은 안전에 필요한 경우 시설의 운영자로 하여금 시설의 보완 또는 개보수를 요구할 수 있음(요구를 받은 시설운영자는 이에 응해야 함)<\/div><div class=\"ln p\">국가 또는 지방자치단체는 예산의 범위 내에서 안전점검, 시설의 보완 및 시설의 개보수에 소요되는 비용의 전부 또는 일부를 보조 가능<\/div><div class=\"ln p\">‒지자체에서는 기능보강사업비 지원 대상 선정 시 시설 안전점검 결과 개보수 필요 시설, 노후시설 등 안전사고 발생 우려가 있는 시설을 우선적으로 지원하도록 검토할 것<\/div><div class=\"pchip\" id=\"p121\"><span>원문 121쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=133\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">2) 지자체 안전점검<\/div><div class=\"ln p\">시･도 및 시･군･구에서는 하･동절기(5월  및 11월) 등 취약시기에 보건복지부에서 통보하는 안전점검 계획에 따라 종사자 대상 교육훈련* 및 안전점검표에 따른 현지점검 실시 후 그 결과를 보건복지부에 보고<\/div><div class=\"ln p\">‒필요한 경우 시설 운영자에게 시설의 보완 또는 개보수 등을 요구하고 그 결과를 모니터링<\/div><div class=\"ln p\">*지자체 주관 집합교육(권장), 시설 자체교육, 모의훈련 등<\/div><div class=\"ln p\">건축･부대시설 안전성, 소방･가스･전기시설 관리상태, 보험가입 여부, 시설거주자 건강관리 대책 등을 점검하며, 취약시기의 특성에 따라 감염병 관리 대책*, 폭설･제설･동파･난방관리 대책 등 추가 점검<\/div><div class=\"ln p\">*코로나바이러스감염증-19 유행대비 사회복지시설 대응 지침(보건복지부 홈페이지-정보–법인/시설/단체 메뉴) 참고하여 개별 시설 사정 및 특성에 따라 적합하게 적용 바람<\/div><div class=\"ln p\">시설안전점검 실시 후 결과보고는 시스템을 통해 온라인으로 보고<\/div><div class=\"ln p\">‒사회복지시설은 사회서비스정보시스템(희망이음)으로 지자체에 보고하며, 지자체는 행복이음 시스템 안전점검 메뉴를 통해 결과 보고 및 안전점검 이력관리 수행<\/div><div class=\"ln p\">‒지자체는 점검 전 시스템 권한 요청 및 승계 처리를 완료하고, 소관 시설을 적극 독려하여 점검결과가 누락되지 않고 보고될 수 있도록 관리 철저<\/div><div class=\"ln p\">*ʼ18년부터 시설정보시스템 및 행정업무지원시스템을 활용한 안전점검 결과입력 전면 시행, ’22년 하반기부터 행정업무지원시스템 기능 행복이음으로 이관<\/div><div class=\"ln h4\">3) 민관 합동점검<\/div><div class=\"ln p\">정부･지자체･전문가 등으로 합동점검단을 구성하여 중점점검 대상시설에 대하여 안전 취약시기(하･동절기, 태풍발생 시 등)에 시설물 안전관리실태, 매뉴얼 준수여부, 안전의식, 교육･훈련 등 종합점검 실시<\/div><div class=\"ln h4\">4) 국토안전관리원 소규모 취약시설 안전점검(「시설물의 안전 및 유지관리에 관한 특별법」 제19조)<\/div><div class=\"ln p\">국토안전관리원에서 「시설물의 안전 및 유지관리에 관한 특별법」 제19조에 따라 보건복지부와 협의하여 무상으로 ‘소규모 취약시설 안전점검’*을 실시하고 있으므로, 시설장 및 시･군･구 담당자는 이를 적극 활용할 것<\/div><div class=\"ln p\">*주요 점검내용 : 시설물 기초지반 침하 및 벽면 균열 발생 여부, 시설물 주변 석축･옹벽, 비탈면의 결함 발생여부 등<\/div><div class=\"pchip\" id=\"p122\"><span>원문 122쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=134\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">안전에 취약하거나 재난의 위험이 있다고 판단되는 시설에 대해 시설장이 요청(또는 지자체 직권)하여 지자체(시･군･구➝시･도)가 보건복지부 주무부서에 신청(필요시 신청 전 지자체 현장 확인 실시)<\/div><table class=\"htbl\"><tr><td>점검대상선정 협의<br>(전년 12월~<br>1월)<\/td><td>→<\/td><td>월간점검일정 송부<br>(공단➝복지부➝지자체)<\/td><td>→<\/td><td>안전점검 실시<br>(지자체 및 시설과 일정 사전 협의)<\/td><td>→<\/td><td>개별결과보고서송부<br>(공단➝시설)<\/td><td>→<\/td><td>분기별 점검결과 송부<br>(공단➝복지부 및 시･도)<\/td><td>→<\/td><td>종합보고서 송부<br>(공단➝복지부)<\/td><\/tr><\/table><div class=\"ln p\">시설장 및 지자체는 점검결과에 따라 보수･보강 등의 조치를 적극적으로 이행하고, 조치실적이 있는 경우 「시설물의 안전 및 유지관리에 관한 특별법 시행규칙」 제16조의2 제4항에 따라 그 실적을 국토교통부장관에게 제출하여야 함<\/div><div class=\"ln p\">시･군･구는 동법 제19조제6~8항, 같은법 시행규칙 16조의3에 따라 매년 소규모 취약시설(사회복지시설)의 현황 등이 포함된 안전점검 및 관리계획을 수립하여 매년 10월 15일까지 시･도에 보고하고, 시･도는 그 내용을 확인 후 10월 31일까지 국토교통부에 제출하여야 함<\/div><div class=\"ln note\">※ 시･도 담당자는 안전점검 및 관리계획 작성 현황을 소규모 취약시설 안전점검시스템(www.sfms.or.kr)을 통해 제출<\/div><div class=\"ln note\">※소관 지자체 및 해당 시설은 각 안전점검 결과에 따라 적극적인 후속조치를 마련하고 결과를 보고하여야 함<\/div><div class=\"ln note\">※지자체에서는 후속조치 이행여부를 지속적으로 모니터링하고 개･보수 등이 시급히 필요한 시설에 대하여 우선적으로 기능보강예산을 지원할 수 있도록 적극 협조<\/div><div class=\"ln note\">※ ʼ17년 국정감사 시 점검결과 미흡시설 후속조치 미 이행 관련 지적받았음<\/div><div class=\"ln p\">소규모취약시설 자율안전점검 앱 활용 안내<\/div><div class=\"ln p\">국토안전관리원에서 시설물 관리자의 점검능력 배양 및 교육을 위한 자율안전점검 앱을 개발하여 배포 중이므로 자체안전점검 등 시설물 관리 시 이를 적극 활용할 것 *Play 스토어에서 “소규모취약시설 자율안전점검” 검색 및 설치 후 사용 가능 *사용법 등 문의사항은 국토안전관리원(055-771-4816, 4818)으로 문의<\/div><div class=\"pchip\" id=\"p123\"><span>원문 123쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=135\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">5) 시･도 사회서비스원 안전 컨설팅 제공<\/div><div class=\"ln p\">시･도 사회서비스원에서 민간 제공기관에 대하여 체계적인 안전 컨설팅을 지원함으로써 시설 이용자･생활자･종사자의 안전 확보 가능<\/div><div class=\"ln p\">안전 컨설팅 전문인력 지원을 통해 자체점검에 따른 전문성 부족문제를 개선하고 상시적이고 체계적인 안전 컨설팅 실시<\/div><div class=\"ln p\">(수행개요) 사회복지사업법 제34조의4에 의하여 하･동절기(5월 및 11월)마다 정기적으로 안전점검을 시행<\/div><div class=\"ln p\">-시설 자체점검, 지자체 확인점검, 민관합동점검의 형태로 수행<\/div><div class=\"ln p\">시설안전관리 및 소방, 건축, 가스, 전기 등 시설안전 집중 컨설팅하되 지역별･시기별(하절기/동절기) 특성을 고려하여 컨설팅 사항을 추가 또는 생략 가능<\/div><div class=\"ln p\">&lt;안전 컨설팅 항목 예시&gt;<\/div><div class=\"ln p\">주요 컨설팅 분야<\/div><div class=\"ln p\">주요 컨설팅 항목<\/div><div class=\"ln p\">1. 안전관리계획 / 안전관리자/ 안전교육<\/div><div class=\"ln p\">시설안전관리계획 수립, 안전관리자 지정, 안전교육훈련 실시 등<\/div><div class=\"ln p\">2. 책임보험 가입 여부<\/div><div class=\"ln p\">책임보험 또는 책임공제 가입 여부 및 보장 한도 등 점검<\/div><div class=\"ln p\">3. 소방/전기/가스 안전 관리<\/div><div class=\"ln p\">소화기 및 소화 설비, 자동화재탐지 설비, 피난유도등 및 피난기구, 출입통제구역, 전기/가스 안전관리, 피난로 확보, 방화문, 제연/배연설비 설치 및 작동 여부, 방염물품 사용 여부<\/div><div class=\"ln p\">4. 급식위생안전관리<\/div><div class=\"ln p\">식재료 가공시설 관리, 식수/폐기물 관리<\/div><div class=\"ln p\">5. 자연재난안전관리<\/div><div class=\"ln p\">풍수해 대비 상태(건물누수, 옹벽 균열여부, 지반침하 등) 혹서기 대비 상태(냉방시설 확보 현황, 실외기 관리상태)<\/div><div class=\"ln p\">6. 컨설팅 결과 모니터링<\/div><div class=\"ln p\">동절기 점검결과에 대한 조치여부 등 확인<\/div>", "pages": [{"p": 120, "t": "2\n시설안전점검 실시\n1) 사회복지시설 자체 안전점검(법 제34조의4)\n정기안전점검 ∙시설장 ∙매반기 | → | 수시안전점검 ∙시설장(점검자：안전 진단전문기관, 전문건설업자) ∙위해발생 우려 시 | → | 결과보고(정기･수시) ∙시설장➝지자체➝복지부 ∙매반기 | → | 개･보수요구 ∙시장･군수･구청장 ∙필요 시\n(정기안전점검) 시설장은 매 반기 시설에 대해 정기안전점검을 실시하고 그 결과를 시장･군수･구청장에게 제출하여야 한다.\n(수시안전점검) 시설장은 정기안전점검 결과 해당시설의 구조･설비의 안전도가 취약하여 위해의 우려가 있는 때에는 안전점검기관에 수시안전점검을 의뢰하여 그 결과를 시장･군수･구청장에 제출하여야 함\n‒안전점검기관：「시설물의 안전 및 유지관리에 관한 특별법」 제28조에 따른 안전진단전문 기관 또는 「건설산업기본법」 제9조에 따른 시설물의 유지관리를 업으로 하는 전문건설업자\n‒안전점검기준：「시설물의 안전 및 유지관리에 관한 특별법」 제21조의 규정에 의한 안전 점검 및 정밀안전진단 지침\n☞시설안전점검을 수행하지 않을 경우 300만원 이하 과태료를 부과함(법 제58조제2항)\n시장･군수･구청장은 안전에 필요한 경우 시설의 운영자로 하여금 시설의 보완 또는 개보수를 요구할 수 있음(요구를 받은 시설운영자는 이에 응해야 함)\n국가 또는 지방자치단체는 예산의 범위 내에서 안전점검, 시설의 보완 및 시설의 개보수에 소요되는 비용의 전부 또는 일부를 보조 가능\n‒지자체에서는 기능보강사업비 지원 대상 선정 시 시설 안전점검 결과 개보수 필요 시설, 노후시설 등 안전사고 발생 우려가 있는 시설을 우선적으로 지원하도록 검토할 것"}, {"p": 121, "t": "2) 지자체 안전점검\n시･도 및 시･군･구에서는 하･동절기(5월  및 11월) 등 취약시기에 보건복지부에서 통보하는 안전점검 계획에 따라 종사자 대상 교육훈련* 및 안전점검표에 따른 현지점검 실시 후 그 결과를 보건복지부에 보고\n‒필요한 경우 시설 운영자에게 시설의 보완 또는 개보수 등을 요구하고 그 결과를 모니터링\n*지자체 주관 집합교육(권장), 시설 자체교육, 모의훈련 등\n건축･부대시설 안전성, 소방･가스･전기시설 관리상태, 보험가입 여부, 시설거주자 건강관리 대책 등을 점검하며, 취약시기의 특성에 따라 감염병 관리 대책*, 폭설･제설･동파･난방관리 대책 등 추가 점검\n*코로나바이러스감염증-19 유행대비 사회복지시설 대응 지침(보건복지부 홈페이지-정보–법인/시설/단체 메뉴) 참고하여 개별 시설 사정 및 특성에 따라 적합하게 적용 바람\n시설안전점검 실시 후 결과보고는 시스템을 통해 온라인으로 보고\n‒사회복지시설은 사회서비스정보시스템(희망이음)으로 지자체에 보고하며, 지자체는 행복이음 시스템 안전점검 메뉴를 통해 결과 보고 및 안전점검 이력관리 수행\n‒지자체는 점검 전 시스템 권한 요청 및 승계 처리를 완료하고, 소관 시설을 적극 독려하여 점검결과가 누락되지 않고 보고될 수 있도록 관리 철저\n*ʼ18년부터 시설정보시스템 및 행정업무지원시스템을 활용한 안전점검 결과입력 전면 시행, ’22년 하반기부터 행정업무지원시스템 기능 행복이음으로 이관\n3) 민관 합동점검\n정부･지자체･전문가 등으로 합동점검단을 구성하여 중점점검 대상시설에 대하여 안전 취약시기(하･동절기, 태풍발생 시 등)에 시설물 안전관리실태, 매뉴얼 준수여부, 안전의식, 교육･훈련 등 종합점검 실시\n4) 국토안전관리원 소규모 취약시설 안전점검(「시설물의 안전 및 유지관리에 관한 특별법」 제19조)\n국토안전관리원에서 「시설물의 안전 및 유지관리에 관한 특별법」 제19조에 따라 보건복지부와 협의하여 무상으로 ‘소규모 취약시설 안전점검’*을 실시하고 있으므로, 시설장 및 시･군･구 담당자는 이를 적극 활용할 것\n*주요 점검내용 : 시설물 기초지반 침하 및 벽면 균열 발생 여부, 시설물 주변 석축･옹벽, 비탈면의 결함 발생여부 등"}, {"p": 122, "t": "안전에 취약하거나 재난의 위험이 있다고 판단되는 시설에 대해 시설장이 요청(또는 지자체 직권)하여 지자체(시･군･구➝시･도)가 보건복지부 주무부서에 신청(필요시 신청 전 지자체 현장 확인 실시)\n점검대상선정 협의 (전년 12월~ 1월) | → | 월간점검일정 송부 (공단➝복지부➝지자체) | → | 안전점검 실시 (지자체 및 시설과 일정 사전 협의) | → | 개별결과보고서송부 (공단➝시설) | → | 분기별 점검결과 송부 (공단➝복지부 및 시･도) | → | 종합보고서 송부 (공단➝복지부)\n시설장 및 지자체는 점검결과에 따라 보수･보강 등의 조치를 적극적으로 이행하고, 조치실적이 있는 경우 「시설물의 안전 및 유지관리에 관한 특별법 시행규칙」 제16조의2 제4항에 따라 그 실적을 국토교통부장관에게 제출하여야 함\n시･군･구는 동법 제19조제6~8항, 같은법 시행규칙 16조의3에 따라 매년 소규모 취약시설(사회복지시설)의 현황 등이 포함된 안전점검 및 관리계획을 수립하여 매년 10월 15일까지 시･도에 보고하고, 시･도는 그 내용을 확인 후 10월 31일까지 국토교통부에 제출하여야 함\n※ 시･도 담당자는 안전점검 및 관리계획 작성 현황을 소규모 취약시설 안전점검시스템(www.sfms.or.kr)을 통해 제출\n※소관 지자체 및 해당 시설은 각 안전점검 결과에 따라 적극적인 후속조치를 마련하고 결과를 보고하여야 함\n※지자체에서는 후속조치 이행여부를 지속적으로 모니터링하고 개･보수 등이 시급히 필요한 시설에 대하여 우선적으로 기능보강예산을 지원할 수 있도록 적극 협조\n※ ʼ17년 국정감사 시 점검결과 미흡시설 후속조치 미 이행 관련 지적받았음\n소규모취약시설 자율안전점검 앱 활용 안내\n국토안전관리원에서 시설물 관리자의 점검능력 배양 및 교육을 위한 자율안전점검 앱을 개발하여 배포 중이므로 자체안전점검 등 시설물 관리 시 이를 적극 활용할 것 *Play 스토어에서 “소규모취약시설 자율안전점검” 검색 및 설치 후 사용 가능 *사용법 등 문의사항은 국토안전관리원(055-771-4816, 4818)으로 문의"}, {"p": 123, "t": "5) 시･도 사회서비스원 안전 컨설팅 제공\n시･도 사회서비스원에서 민간 제공기관에 대하여 체계적인 안전 컨설팅을 지원함으로써 시설 이용자･생활자･종사자의 안전 확보 가능\n안전 컨설팅 전문인력 지원을 통해 자체점검에 따른 전문성 부족문제를 개선하고 상시적이고 체계적인 안전 컨설팅 실시\n(수행개요) 사회복지사업법 제34조의4에 의하여 하･동절기(5월 및 11월)마다 정기적으로 안전점검을 시행\n-시설 자체점검, 지자체 확인점검, 민관합동점검의 형태로 수행\n시설안전관리 및 소방, 건축, 가스, 전기 등 시설안전 집중 컨설팅하되 지역별･시기별(하절기/동절기) 특성을 고려하여 컨설팅 사항을 추가 또는 생략 가능\n<안전 컨설팅 항목 예시>\n주요 컨설팅 분야\n주요 컨설팅 항목\n1. 안전관리계획 / 안전관리자/ 안전교육\n시설안전관리계획 수립, 안전관리자 지정, 안전교육훈련 실시 등\n2. 책임보험 가입 여부\n책임보험 또는 책임공제 가입 여부 및 보장 한도 등 점검\n3. 소방/전기/가스 안전 관리\n소화기 및 소화 설비, 자동화재탐지 설비, 피난유도등 및 피난기구, 출입통제구역, 전기/가스 안전관리, 피난로 확보, 방화문, 제연/배연설비 설치 및 작동 여부, 방염물품 사용 여부\n4. 급식위생안전관리\n식재료 가공시설 관리, 식수/폐기물 관리\n5. 자연재난안전관리\n풍수해 대비 상태(건물누수, 옹벽 균열여부, 지반침하 등) 혹서기 대비 상태(냉방시설 확보 현황, 실외기 관리상태)\n6. 컨설팅 결과 모니터링\n동절기 점검결과에 대한 조치여부 등 확인"}]}, {"title": "3. 안전관리 인력 확보", "start": 124, "end": 124, "html": "<div class=\"pchip\" id=\"p124\"><span>원문 124쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=136\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>안전관리 인력 확보<\/div><div class=\"ln p\">안전관리책임관 지정<\/div><div class=\"ln p\">‒(대상시설) 사회복지시설은 시설장을 ‘안전관리책임관’으로 지정하여 시설장 책임 하에 안전관리 및 점검을 철저히 실시<\/div><div class=\"ln p\">‒(안전관리책임관의 임무) 안전업무 실무자를 관리하고, 안전관리 전반을 지휘･감독･지원하도록 함<\/div><div class=\"ln p\">‒시설별 안전계획서 작성을 통해 직원별 임무를 명확히 하여 안전사고를 예방하고 사고 발생 시 신속히 대응토록 교육･훈련을 반복할 것<\/div><div class=\"ln p\">소방안전관리자 선임<\/div><div class=\"ln p\">‒(대상시설) 「화재의 예방 및 안전관리에 관한 법률」(이하 「화재예방법」) 제24조제1항 및 같은 법 시행령 제25조제1항에 따라 소방안전관리자를 두어야 하는 사회복지시설은 「화재예방법 시행령」 제25조제1항의 자격을 갖춘 자를 ‘소방안전관리자’로 선임하여야 한다.<\/div><div class=\"ln p\">*소방안전관리자 선임 및 해임에 대해서는 소방본부장이나 소방서장에게 신고해야 함<\/div><div class=\"ln p\">‒(소방안전관리자의 임무) 「화재예방법」 제24조제5항에 따라 소방안전관리자는 피난계획 및 소방계획서의 작성 및 시행, 자위소방대 및 초기대응체계의 구성과 운영 및 교육, 피난시설과 방화구획 및 방화시설의 관리, 소방시설이나 그 밖의 소방 관련 시설의 관리, 소방훈련 및 교육, 화기(火氣) 취급의 감독의 임무를 수행<\/div>", "pages": [{"p": 124, "t": "3\n안전관리 인력 확보\n안전관리책임관 지정\n‒(대상시설) 사회복지시설은 시설장을 ‘안전관리책임관’으로 지정하여 시설장 책임 하에 안전관리 및 점검을 철저히 실시\n‒(안전관리책임관의 임무) 안전업무 실무자를 관리하고, 안전관리 전반을 지휘･감독･지원하도록 함\n‒시설별 안전계획서 작성을 통해 직원별 임무를 명확히 하여 안전사고를 예방하고 사고 발생 시 신속히 대응토록 교육･훈련을 반복할 것\n소방안전관리자 선임\n‒(대상시설) 「화재의 예방 및 안전관리에 관한 법률」(이하 「화재예방법」) 제24조제1항 및 같은 법 시행령 제25조제1항에 따라 소방안전관리자를 두어야 하는 사회복지시설은 「화재예방법 시행령」 제25조제1항의 자격을 갖춘 자를 ‘소방안전관리자’로 선임하여야 한다.\n*소방안전관리자 선임 및 해임에 대해서는 소방본부장이나 소방서장에게 신고해야 함\n‒(소방안전관리자의 임무) 「화재예방법」 제24조제5항에 따라 소방안전관리자는 피난계획 및 소방계획서의 작성 및 시행, 자위소방대 및 초기대응체계의 구성과 운영 및 교육, 피난시설과 방화구획 및 방화시설의 관리, 소방시설이나 그 밖의 소방 관련 시설의 관리, 소방훈련 및 교육, 화기(火氣) 취급의 감독의 임무를 수행"}]}, {"title": "4. 안전관리 교육·훈련", "start": 125, "end": 125, "html": "<div class=\"pchip\" id=\"p125\"><span>원문 125쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=137\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>안전관리 교육･훈련<\/div><div class=\"ln p\">소방훈련 및 교육실시<\/div><div class=\"ln p\">‒소방안전관리자를 선임하여야 하는 사회복지시설의 관계인(소유자, 점유자, 관리자 등)은 「화재예방법」 제37조제1항 및 같은 법 시행규칙 제36조제1항에 따라 그 장소에 근무하거나 거주하는 사람 등에게 소화･통보･피난 등의 훈련과 소방안전관리에 필요한 교육을 연 1회 이상 실시하여야 함<\/div><div class=\"ln p\">‒이 경우 피난훈련은 그 소방대상물에 출입하는 사람을 안전한 장소로 대피시키고 유도하는 훈련을 포함하여야 함<\/div><div class=\"ln note\">※「영유아보육법」 등 개별 시설관련법 교육･훈련에 관한 별도 규정이 있을 경우 별도 규정에 따름<\/div><div class=\"ln note\">※아동･노인･장애인･정신질환자 거주시설은 개별사업지침에 따라 연 2회 이상 훈련 실시<\/div><div class=\"ln note\">※피난훈련 시 사회복지시설 유형별 모의대피훈련 동영상(보건복지부 홈페이지 – 정보 – 홍보 – 영상 코너에서 조회 또는 유튜브에서 ‘모의 대피’로 검색)을 참고하여, 시설 유형에 맞는 효과적인 대피 훈련 실시<\/div><div class=\"ln p\">사회복지시설 안전관련 교육 안내<\/div><table class=\"htbl\"><tr><td>구분<\/td><td colspan=\"2\">교육대상<\/td><td>교육과정명<\/td><td>교육내용<\/td><\/tr><tr><td>집합<\/td><td>사회복지시설<br>종사자<\/td><td>안전업무<br>담당자<\/td><td>(한국보건복지인재원)사회복지시설<br>안전관리심화과정<\/td><td>사회복지시설 위기상황 행동 요령<br>사회복지시설 안전관리 이해<br>실제활동 등 안전 업무 전반<\/td><\/tr><tr><td rowspan=\"3\">이러닝<\/td><td colspan=\"2\" rowspan=\"3\">사회복지시설 종사자 및지자체 시설 담당 공무원 등<\/td><td>(한국보건복지인재원)사회복지시설 안전관리, 이것만 알면 끝!<\/td><td>안전관리 제도의 이해<br>사회복지시설 화재 대처 방법<br>안전관리계획을 위한 소방계획서 작성<\/td><\/tr><tr><td>(한국보건복지인재원)장애인거주시설 안전관리<\/td><td>장애인거주시설 피난매뉴얼의 이해<br>장애인거주시설 안전관리 계획과 시나리오 만들기<\/td><\/tr><tr><td>(국토안전관리원)사회복지시설 안전 및 유지관리 관련 교육<\/td><td>시설물 안전관리<br>전기·가스·화재 등 재난예방 교육<br>사회복지시설 책임보험 관련 교육<\/td><\/tr><\/table>", "pages": [{"p": 125, "t": "4\n안전관리 교육･훈련\n소방훈련 및 교육실시\n‒소방안전관리자를 선임하여야 하는 사회복지시설의 관계인(소유자, 점유자, 관리자 등)은 「화재예방법」 제37조제1항 및 같은 법 시행규칙 제36조제1항에 따라 그 장소에 근무하거나 거주하는 사람 등에게 소화･통보･피난 등의 훈련과 소방안전관리에 필요한 교육을 연 1회 이상 실시하여야 함\n‒이 경우 피난훈련은 그 소방대상물에 출입하는 사람을 안전한 장소로 대피시키고 유도하는 훈련을 포함하여야 함\n※「영유아보육법」 등 개별 시설관련법 교육･훈련에 관한 별도 규정이 있을 경우 별도 규정에 따름\n※아동･노인･장애인･정신질환자 거주시설은 개별사업지침에 따라 연 2회 이상 훈련 실시\n※피난훈련 시 사회복지시설 유형별 모의대피훈련 동영상(보건복지부 홈페이지 – 정보 – 홍보 – 영상 코너에서 조회 또는 유튜브에서 ‘모의 대피’로 검색)을 참고하여, 시설 유형에 맞는 효과적인 대피 훈련 실시\n사회복지시설 안전관련 교육 안내\n구분 | 교육대상 | 교육과정명 | 교육내용\n집합 | 사회복지시설 종사자 | 안전업무 담당자 | (한국보건복지인재원)사회복지시설 안전관리심화과정 | 사회복지시설 위기상황 행동 요령 사회복지시설 안전관리 이해 실제활동 등 안전 업무 전반\n이러닝 | 사회복지시설 종사자 및지자체 시설 담당 공무원 등 | (한국보건복지인재원)사회복지시설 안전관리, 이것만 알면 끝! | 안전관리 제도의 이해 사회복지시설 화재 대처 방법 안전관리계획을 위한 소방계획서 작성\n(한국보건복지인재원)장애인거주시설 안전관리 | 장애인거주시설 피난매뉴얼의 이해 장애인거주시설 안전관리 계획과 시나리오 만들기\n(국토안전관리원)사회복지시설 안전 및 유지관리 관련 교육 | 시설물 안전관리 전기·가스·화재 등 재난예방 교육 사회복지시설 책임보험 관련 교육"}]}, {"title": "5. 건축물 및 소방관계 법령 준수 여부 확인", "start": 126, "end": 126, "html": "<div class=\"pchip\" id=\"p126\"><span>원문 126쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=138\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">5<\/span>건축물 및 소방관계 법령 준수 여부 확인<\/div><div class=\"ln p\">시설 설치 신고 시 소방관계 법령 준수 여부 확인 의무(지자체)<\/div><div class=\"ln p\">‒「사회복지사업법 시행규칙」 제20조제2항 개정(ʼ15.6.26)에 따라 사회복지시설 신고서를 제출받은 시장･군수･구청장은 관할 소방서장 등에게 소방관계 법령을 준수하였는지 여부를 확인해 줄 것을 요청하여야 함<\/div><div class=\"ln note\">※ 「사회복지사업법 시행규칙」 제20조제2항<\/div><div class=\"ln p\">② 제1항에 따라 신고서를 제출받은 시장･군수･구청장은 「소방시설 설치･유지 및 안전관리에 관한 법률」 제7조제6항 전단에 따라 해당 시설의 소재지를 관할하는 소방본부장이나 소방서장에게 해당 시설이 같은 법 또는 같은 법에 따른 명령을 따르고 있는지를 확인하여 줄 것을 요청하여야 한다. &lt;개정 2015.6.26.&gt;<\/div><div class=\"ln p\">사회복지시설은 「소방시설 설치 및 관리에 관한 법률 시행령」 [별표1]에 따라 스프링클러설비, 간이스프링클러설비, 물분무 등 소화설비 또는 옥내소화전설비, 자동화재탐지설비 등을 설치해야 함<\/div><div class=\"ln p\">화재안전 성능보강<\/div><div class=\"ln p\">‒「건축물관리법」 제27조 및 28조, 같은법 시행령 제19조에 따라 보강대상 건축물의 관리자는 화재안전성능보강 계획에 따라 보강을 실시하고 그 결과를 2025년 12월 31일까지 지자체에 보고하여야 함<\/div><div class=\"ln p\">‒지자체는 보완이 필요하다고 인정되는 경우 기한을 정하여 보완을 명할 수 있음<\/div><div class=\"ln note\">※보강에 대한 지원 및 특례는 2025년 12월 31일까지 유효<\/div>", "pages": [{"p": 126, "t": "5\n건축물 및 소방관계 법령 준수 여부 확인\n시설 설치 신고 시 소방관계 법령 준수 여부 확인 의무(지자체)\n‒「사회복지사업법 시행규칙」 제20조제2항 개정(ʼ15.6.26)에 따라 사회복지시설 신고서를 제출받은 시장･군수･구청장은 관할 소방서장 등에게 소방관계 법령을 준수하였는지 여부를 확인해 줄 것을 요청하여야 함\n※ 「사회복지사업법 시행규칙」 제20조제2항\n② 제1항에 따라 신고서를 제출받은 시장･군수･구청장은 「소방시설 설치･유지 및 안전관리에 관한 법률」 제7조제6항 전단에 따라 해당 시설의 소재지를 관할하는 소방본부장이나 소방서장에게 해당 시설이 같은 법 또는 같은 법에 따른 명령을 따르고 있는지를 확인하여 줄 것을 요청하여야 한다. <개정 2015.6.26.>\n사회복지시설은 「소방시설 설치 및 관리에 관한 법률 시행령」 [별표1]에 따라 스프링클러설비, 간이스프링클러설비, 물분무 등 소화설비 또는 옥내소화전설비, 자동화재탐지설비 등을 설치해야 함\n화재안전 성능보강\n‒「건축물관리법」 제27조 및 28조, 같은법 시행령 제19조에 따라 보강대상 건축물의 관리자는 화재안전성능보강 계획에 따라 보강을 실시하고 그 결과를 2025년 12월 31일까지 지자체에 보고하여야 함\n‒지자체는 보완이 필요하다고 인정되는 경우 기한을 정하여 보완을 명할 수 있음\n※보강에 대한 지원 및 특례는 2025년 12월 31일까지 유효"}]}, {"title": "6. 재난·안전 관련 주체별 주요 임무", "start": 127, "end": 128, "html": "<div class=\"pchip\" id=\"p127\"><span>원문 127쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=139\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h2\"><span class=\"badge\">6<\/span>재난･안전 관련 주체별 주요 임무<\/div><div class=\"ln p\">보건복지부<\/div><div class=\"ln p\">전국 사회복지시설 안전관리에 대한 총괄 지도감독 시설안전사고 지도･점검 등 예방조치 시설안전사고 발생 시 조사반 파견 및 지원대책반 구성운영 대규모 재난사고 발생 시 중앙사고수습본부 설치운영(필요시)<\/div><div class=\"ln p\">시･도 및 시･군･구<\/div><div class=\"ln p\">관내 시설의 안전관리에 대한 종합계획 수립 및 총괄 지도감독 관내 시설의 안전관리에 대한 정기･수시 지도점검, 문제시설 조치 안전사고 관련 예산확보 등 재정적 지원 시설안전관리 교육 실시 및 비상연락망 구축 사고 발생시 시･도, 시･군･구 사고수습본부 설치운영(필요시) 사고수습 후 사고발생요인 분석 및 재발방지대책 수립 ※ 시･군･구는 담당공무원을 관내 시설의 시설안전담당자로 지정 운영<\/div><div class=\"ln p\">사회복지시설<\/div><div class=\"ln p\">시설자체 안전관리 계획 수립 시설자체 안전점검 실시 및 실시결과 보고 비상대비 모의훈련 실시, 비상연락망 구축 시설자체 응급조치 및 사후복구체계 구축<\/div><div class=\"ln p\">재난발생 시 연락체계<\/div>", "pages": [{"p": 127, "t": "6\n재난･안전 관련 주체별 주요 임무\n보건복지부\n전국 사회복지시설 안전관리에 대한 총괄 지도감독 시설안전사고 지도･점검 등 예방조치 시설안전사고 발생 시 조사반 파견 및 지원대책반 구성운영 대규모 재난사고 발생 시 중앙사고수습본부 설치운영(필요시)\n시･도 및 시･군･구\n관내 시설의 안전관리에 대한 종합계획 수립 및 총괄 지도감독 관내 시설의 안전관리에 대한 정기･수시 지도점검, 문제시설 조치 안전사고 관련 예산확보 등 재정적 지원 시설안전관리 교육 실시 및 비상연락망 구축 사고 발생시 시･도, 시･군･구 사고수습본부 설치운영(필요시) 사고수습 후 사고발생요인 분석 및 재발방지대책 수립 ※ 시･군･구는 담당공무원을 관내 시설의 시설안전담당자로 지정 운영\n사회복지시설\n시설자체 안전관리 계획 수립 시설자체 안전점검 실시 및 실시결과 보고 비상대비 모의훈련 실시, 비상연락망 구축 시설자체 응급조치 및 사후복구체계 구축\n재난발생 시 연락체계"}]}]}, {"no": 5, "title": "사회복지법인 및 사회복지시설 재무·회계규칙", "start": 129, "end": 232, "sections": [{"title": "1. 총칙", "start": 130, "end": 132, "html": "<div class=\"pchip\" id=\"p130\"><span>원문 130쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=142\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">본 규칙은 「사회복지사업법」 제23조제4항, 제34조제3항 및 제45조제2항의 규정에 의하여 사회복지법인과 사회복지시설의 재무･회계 및 후원금관리에 관한 사항을 규정하여 명확성･공정성･투명성을 기함으로써 사회복지법인과 시설의 합리적인 운영에 기여함을 목적으로 함.<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">적용범위<\/div><div class=\"ln p\">「사회복지사업법」의 적용을 받는 사회복지법인 및 사회복지시설(소관부처 및 정부 보조금 지급 여부와는 상관없이 모든 사회복지법인과 사회복지시설에 적용)<\/div><div class=\"ln note\">※종전까지는 사회복지법인 및 법인이 운영하는 시설에만 적용되었으나, 「사회복지사업법」 제34조제3항 등에 의해 동 규칙이 개정됨에 따라 모든 사회복지법인 및 사회복지시설로 적용대상 확대<\/div><div class=\"ln note\">※「사회복지사업법」 제34조(사회복지시설의 설치) ③ 시설을 설치･운영하는 자는 보건복지부령으로 정하는 재무･회계에 관한 기준에 따라 시설을 투명하게 운영하여야 한다. &lt;2011.8.4.신설, 2012. 8.5시행&gt;<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">다른 법령과의 관계<\/div><div class=\"ln p\">사회복지법인 및 사회복지시설의 재무･회계처리에 관하여 다른 법령에 특별한 규정이 있는 경우를 제외하고는 본 규칙에 따름.<\/div><div class=\"pchip\" id=\"p131\"><span>원문 131쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=143\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">사회복지법인 및 사회복지시설의 회계<\/div><div class=\"ln h4\">1) 사회복지법인의 회계는 다음과 같이 구분하여 관리할 것<\/div><div class=\"ln p\">법인회계：사회복지법인의 업무전반에 관한 회계<\/div><div class=\"ln p\">시설회계：사회복지법인이 설치･운영하는 사회복지시설에 관한 회계<\/div><div class=\"ln p\">수익사업회계：사회복지법인이 수행하는 수익사업에 관한 회계<\/div><div class=\"ln note\">※ 법인회계와 시설회계 구분 철저(ʼ13.10월 감사원 지적 사항)<\/div><div class=\"ln h4\">2) 시설의 회계는 해당 시설의 시설회계로 함<\/div><div class=\"ln note\">※사회복지법인 이외의 자가 시설을 설치･운영하는 경우에도 시설회계를 반드시 두어야 하고, 시설이 여러 개소인 경우 시설의 회계는 각 시설별로 구분하여 관리할 것<\/div><div class=\"ln h4\">3) 회계연도 및 회계연도 소속구분<\/div><div class=\"ln p\">법인 및 시설의 회계연도는 정부의 회계연도(1. 1~12. 31)에 의함<\/div><div class=\"ln p\">‒다만, 「영유아보육법」 제2조에 따른 어린이집의 회계연도는 매년 3월 1일에 시작하여 다음 연도 2월 말일에 종료한다.<\/div><div class=\"ln p\">수입 및 지출의 발생, 자산 및 부채의 증감에 관하여는 그 원인이 되는 사실이 발생한 날을 기준으로 하여 연도소속을 구분하되, 그 사실이 발생한 날을 정할 수 없는 경우에는 그 사실을 확인한 날을 기준으로 함<\/div><div class=\"ln h4\">4) 회계의 감독 등<\/div><div class=\"ln p\">회계부정 등 불법행위가 발견된 경우 해당 법인의 임원해임, 시설의 개선, 사업정지, 시설장교체, 시설폐쇄 등 조치<\/div><div class=\"ln note\">※「사회복지사업법」 제22조 및 제40조<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">출납기한<\/div><div class=\"pchip\" id=\"p132\"><span>원문 132쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=144\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">1회계연도에 속하는 법인 및 시설의 세입･세출의 출납은 회계연도가 끝나는 날까지 완료해야 함<\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">정보통신매체에 의한 재무･회계 처리<\/div><div class=\"ln p\">사회복지법인 및 사회복지시설의 재무･회계는 컴퓨터 프로그램으로 처리할 수 있음<\/div><div class=\"ln p\">국가나 지방자치단체로부터 보조금을 받는 사회복지법인과 사회복지시설의 경우, 사회서비스정보시스템(희망이음) 및 사회복지시설정보시스템 또는 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템을 사용하여 재무･회계를 처리하여야 함 &lt;2012.8.7 개정, 2013.1.1 시행&gt;<\/div><div class=\"ln p\">‒사회복지법인 중 지원법인과 사회복지시설 중 국가나 지방자치단체로부터 보조금을 받지 않는 경우는 위 시스템을 사용하지 않을 수 있으나, 시･도지사, 시장･군수･구청장은 법인 및 시설에 대하여 시스템 사용을 권장할 수 있으며, 사회복지법인 대표이사와 시설의 장은 이에 협력하여야 함(「사회복지사업법」 제6조의2제5항).<\/div><div class=\"ln p\">‒보조금을 받는 사회복지시설 중 어린이집, 경로당, 노인교실은 사용하지 않을 수 있음<\/div><div class=\"ln h2\"><span class=\"badge\">2<\/span>예 산<\/div>", "pages": [{"p": 130, "t": "본 규칙은 「사회복지사업법」 제23조제4항, 제34조제3항 및 제45조제2항의 규정에 의하여 사회복지법인과 사회복지시설의 재무･회계 및 후원금관리에 관한 사항을 규정하여 명확성･공정성･투명성을 기함으로써 사회복지법인과 시설의 합리적인 운영에 기여함을 목적으로 함.\n나\n적용범위\n「사회복지사업법」의 적용을 받는 사회복지법인 및 사회복지시설(소관부처 및 정부 보조금 지급 여부와는 상관없이 모든 사회복지법인과 사회복지시설에 적용)\n※종전까지는 사회복지법인 및 법인이 운영하는 시설에만 적용되었으나, 「사회복지사업법」 제34조제3항 등에 의해 동 규칙이 개정됨에 따라 모든 사회복지법인 및 사회복지시설로 적용대상 확대\n※「사회복지사업법」 제34조(사회복지시설의 설치) ③ 시설을 설치･운영하는 자는 보건복지부령으로 정하는 재무･회계에 관한 기준에 따라 시설을 투명하게 운영하여야 한다. <2011.8.4.신설, 2012. 8.5시행>\n다\n다른 법령과의 관계\n사회복지법인 및 사회복지시설의 재무･회계처리에 관하여 다른 법령에 특별한 규정이 있는 경우를 제외하고는 본 규칙에 따름."}, {"p": 131, "t": "라\n사회복지법인 및 사회복지시설의 회계\n1) 사회복지법인의 회계는 다음과 같이 구분하여 관리할 것\n법인회계：사회복지법인의 업무전반에 관한 회계\n시설회계：사회복지법인이 설치･운영하는 사회복지시설에 관한 회계\n수익사업회계：사회복지법인이 수행하는 수익사업에 관한 회계\n※ 법인회계와 시설회계 구분 철저(ʼ13.10월 감사원 지적 사항)\n2) 시설의 회계는 해당 시설의 시설회계로 함\n※사회복지법인 이외의 자가 시설을 설치･운영하는 경우에도 시설회계를 반드시 두어야 하고, 시설이 여러 개소인 경우 시설의 회계는 각 시설별로 구분하여 관리할 것\n3) 회계연도 및 회계연도 소속구분\n법인 및 시설의 회계연도는 정부의 회계연도(1. 1~12. 31)에 의함\n‒다만, 「영유아보육법」 제2조에 따른 어린이집의 회계연도는 매년 3월 1일에 시작하여 다음 연도 2월 말일에 종료한다.\n수입 및 지출의 발생, 자산 및 부채의 증감에 관하여는 그 원인이 되는 사실이 발생한 날을 기준으로 하여 연도소속을 구분하되, 그 사실이 발생한 날을 정할 수 없는 경우에는 그 사실을 확인한 날을 기준으로 함\n4) 회계의 감독 등\n회계부정 등 불법행위가 발견된 경우 해당 법인의 임원해임, 시설의 개선, 사업정지, 시설장교체, 시설폐쇄 등 조치\n※「사회복지사업법」 제22조 및 제40조\n마\n출납기한"}, {"p": 132, "t": "1회계연도에 속하는 법인 및 시설의 세입･세출의 출납은 회계연도가 끝나는 날까지 완료해야 함\n바\n정보통신매체에 의한 재무･회계 처리\n사회복지법인 및 사회복지시설의 재무･회계는 컴퓨터 프로그램으로 처리할 수 있음\n국가나 지방자치단체로부터 보조금을 받는 사회복지법인과 사회복지시설의 경우, 사회서비스정보시스템(희망이음) 및 사회복지시설정보시스템 또는 보건복지부장관이 검증한 표준연계모듈이 적용된 정보시스템을 사용하여 재무･회계를 처리하여야 함 <2012.8.7 개정, 2013.1.1 시행>\n‒사회복지법인 중 지원법인과 사회복지시설 중 국가나 지방자치단체로부터 보조금을 받지 않는 경우는 위 시스템을 사용하지 않을 수 있으나, 시･도지사, 시장･군수･구청장은 법인 및 시설에 대하여 시스템 사용을 권장할 수 있으며, 사회복지법인 대표이사와 시설의 장은 이에 협력하여야 함(「사회복지사업법」 제6조의2제5항).\n‒보조금을 받는 사회복지시설 중 어린이집, 경로당, 노인교실은 사용하지 않을 수 있음\n2\n예 산"}]}, {"title": "2. 예산", "start": 133, "end": 139, "html": "<div class=\"pchip\" id=\"p133\"><span>원문 133쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=145\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">예산의 편성<\/div><div class=\"ln h4\">1) 예산총계주의 원칙<\/div><div class=\"ln p\">1회계연도의 모든 수입은 세입으로 하고 모든 지출은 세출로 하되, 세입과 세출은 모두 예산에 계상하여야 함<\/div><div class=\"ln h4\">2) 예산편성절차<\/div><div class=\"ln note\">※ 일정에 따른 예산편성, 제출 및 공개 철저<\/div><div class=\"ln h4\">3) 예산의 편성 방법 및 제출 서류<\/div><div class=\"ln p\">별표1~별표10에 따른 세입･세출예산과목구분에 따라 편성<\/div><div class=\"ln p\">‒각 지자체는 세입 및 세출예산과목의 세부 내역에 대하여 관련 규정 등에 위배되지 않게 별도의 지침으로 정하는 것을 원칙으로 함<\/div><div class=\"ln p\">‒시설회계 세출예산(별표4) 편성시 법인회계로의 전출은 동일 법인에서 운영하는 타 시설 중 자연재해로 인한 개보수가 필요한 경우에 가능<\/div><div class=\"pchip\" id=\"p134\"><span>원문 134쪽 <span class=\"approx\">(약)<\/span><\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=146\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">&lt;비목 편성･지출 관련 참고사항&gt;<\/div><div class=\"ln note\">※법인･시설의 목적사업 운영에 필요한 비품구입비, 토지･건물･기타 자산의 취득을 위해 자산취득비 비목을 편성･지출할 수 있음<\/div><div class=\"ln p\">*건물･토지, 차량, 대구모 기계･기구, 전산장비, 사무집기류, 물건의 성질 및 형상이 변하지 않고 비교적 장기간 사용할 수 있는 물품 구입(할부금 포함)<\/div><div class=\"ln note\">※국가, 시･도, 시･군･구, 그 밖에 사회 복지사업 기금 등에서 받은 공모사업 선정으로 받은 보조금의 반환을 위해 반환금 비목을 편성･지출할 수 있음<\/div><div class=\"ln p\">주  의<\/div><div class=\"pchip\" id=\"p135\"><span>원문 135쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=147\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">재무회계규칙 [별표 2, 4, 6] 세출예산과목구분표 상 “인건비 항-기타후생경비 목”은 ‘직원의 건강진단비 및 기타복리후생에 소요되는 비용’으로, 법인(시설) 직원의 업무수행과 직접 관련하여 지급된 현물･서비스(건강검진비, 치료비 등) 성격으로 봄 따라서 명절･생일선물 구입비, 격려 만찬 회식비, 경조사비 등은 소속 직원에게 보탬이 되도록 기관 명의로 집행하는 ‘경비’를 일반적으로 의미하므로, 그 내역에 따라 “업무추진비 항-기관운영비 목”으로 편성하는 것이 적절함 다만, 직원에게 지급하는 포상금, 격려금 등은 그 세부 내역에 따라 “업무추진비 항-기관운영비 목” 또는 “운영비 항-기타운영비 목”으로 편성할 수 있으므로, 구체적인 예산편성에 대해서는 각 지자체의 지침으로 정하는 것을 원칙으로 함 ※비지정후원금은 간접비 중에서 업무추진비(기관운영비, 직책보조비, 회의비) 등으로의 사용을 금지하므로, 후원금의 부적정 사용에 주의할 것(「2024 사회복지법인･시설 현지조사 사례집」 p.144 참고)<\/div><div class=\"ln p\">예산에 첨부할 서류는 ① 예산총칙 ② 세입･세출명세서 ③ 추정재무상태표 ④ 추정수지계산서 ⑤ 임직원 보수 일람표 ⑥ 예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록<\/div><div class=\"ln p\">‒다만, 단식부기인 경우 ①, ②, ⑤, ⑥만 첨부할 수 있고, 소규모시설(국가･지자체･법인 이외의 자가 설치･운영하는 시설 중 거주자 정원이나 일평균 이용자가 20인 이하인 시설)인 경우 ②, ⑥만 첨부할 수 있음(소규모시설인 노인장기요양기관은 ②, ⑤, ⑥만 첨부할 수 있음(2020.1.7.시행))<\/div><div class=\"ln p\">‒어린이집은 보육사업안내에서 정하는 바에 따름<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">준예산의 편성<\/div><div class=\"ln p\">1)사유：회계연도 개시 전까지 법인의 예산이 성립되지 아니한 때<\/div><div class=\"ln p\">2)방법：예산 성립 시까지 일부 경비에 대해 전년도 예산에 준하여 집행 가능<\/div><div class=\"ln p\">‒임직원 보수, 법인 및 시설운영에 직접 사용되는 필수적인 경비, 법령상 지급의무가 있는 경비에 대해 집행<\/div><div class=\"ln note\">※법인의 대표이사 및 시설의 장은 준예산 편성 전에 시･군･구청장에게 사유를 보고할 것<\/div><div class=\"pchip\" id=\"p136\"><span>원문 136쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=148\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">추가경정 예산의 편성<\/div><div class=\"ln p\">1)사유：예산 성립 후에 생긴 사유로 인해 기 성립된 예산에 변경을 가할 필요가 있을 경우<\/div><div class=\"ln p\">2)방법：예산편성절차에 준하여 추가경정예산을 편성･확정<\/div><div class=\"ln p\">‒이 경우 노인장기요양기관의 장은 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함<\/div><div class=\"ln note\">※법인의 대표이사 및 시설의 장은 추경이 확정된 날로부터 7일 이내에 이를 시･군･구청장에게 제출할 것<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">예비비의 계상<\/div><div class=\"ln p\">법인의 대표이사 및 시설의 장은 예측할 수 없는 예산외의 지출 또는 예산의 초과지출에 충당하기 위하여 예비비를 세출예산에 계상할 수 있음<\/div><div class=\"ln p\">마<\/div><div class=\"ln p\">예산의 목적 외 사용금지<\/div><div class=\"ln p\">법인회계 및 시설회계의 예산은 세출예산이 정한 목적 외에 사용금지<\/div><div class=\"ln p\">바<\/div><div class=\"ln p\">예산의 전용<\/div><div class=\"ln p\">1)관간 전용 및 동일 관내 항간 전용：법인 이사회의 의결 또는 사회복지시설 운영위원회에 보고를 거쳐 전용(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 전용)<\/div><div class=\"ln p\">2)동일 항내 목간 전용：법인 대표이사 및 시설의 장이 전용 가능<\/div><div class=\"ln p\">3)전용의 제한：예산총칙에서 전용을 제한하고 있거나, 예산 심의 과정에서 삭감한 관･항･목으로는 전용하지 못함<\/div><div class=\"pchip\" id=\"p137\"><span>원문 137쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=149\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">‒노인장기요양기관의 장은 예산을 전용하는 때에는 「노인장기요양보험법」 제38조 제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함<\/div><div class=\"ln p\">4)전용에 대한 보고：관･항 전용의 경우에는 관할 시장･군수･구청장에게 과목 전용조서 제출(결산 보고시에 첨부)<\/div><div class=\"ln note\">※보조금을 받는 법인･시설의 경우, 타 법령 또는 보조금 지원 기준 등에 따라 보조금 지원 주체가 예산 전용을 제한할 수 있으므로 해당 법인 및 시설은 이에 따라야 함 (전용을 하는 경우 사전에 보조금을 지원하는 지자체와 협의할 것<\/div><div class=\"ln p\">사<\/div><div class=\"ln p\">세출예산의 이월<\/div><div class=\"ln p\">1)사유：세출예산 중 성질상 당해 회계연도 안에 지출을 마치지 못할 것으로 예측되는 경비 및 연도 내에 지출원인행위를 하고 불가피한 사유로 인하여 연도 내에 지출하지 못한 경비<\/div><div class=\"ln p\">2)방법：법인 이사회의 의결 또는 시설 운영위원회 보고를 거쳐 다음 연도에 이월 사용 가능(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 이월)<\/div><div class=\"ln p\">아<\/div><div class=\"ln p\">특정목적사업 예산<\/div><div class=\"ln p\">1)사유：완성에 수년을 요하는 공사나 제조 또는 특수한 사업을 위하여 2회계연도 이상에 걸쳐서 그 재원을 조달할 필요가 있는 경우<\/div><div class=\"ln p\">2)방법：회계연도마다 일정액을 예산에 계상하여 특정목적사업을 위한 적립금으로 적립 가능<\/div><div class=\"ln note\">※적립금은 별도의 통장으로 관리할 것<\/div><div class=\"ln p\">3)절차：적립금의 적립 및 사용계획 등을 시장･군수･구청장에 사전에 보고<\/div><div class=\"ln note\">※시･군･구에서 보고 시기, 보고 방법 등을 별도로 정하는 것을 원칙으로 하며, 별도로 규정하는 사항이 없다면 예산을 제출할 때 적립금의 적립 및 사용계획서를 제출함으로써 보고하고, 사용계획에 변동이 있을 경우에는 즉시 변동 보고를 할 것<\/div><div class=\"ln p\">장기요양기관 재무회계규칙 세부지침<\/div><div class=\"ln p\">1. 목적<\/div><div class=\"pchip\" id=\"p138\"><span>원문 138쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=150\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">장기요양기관이 재무회계규칙에 따른 세입처리를 함에 있어 국민건강보험공단으로부터 지급받은 급여비용의 성격에 따라 세목을 구분하도록 하고,<\/div><div class=\"ln p\">이를 통해 장기요양기관이 노인장기요양보험법 제38조제6항에 따른 인건비 지출비율 준수 현황을 정확하게 확인할 수 있도록 하기 위함임<\/div><div class=\"ln p\">2. 주요 내용<\/div><div class=\"ln p\">장기요양기관은 국민건강보험공단으로부터 제공받은 급여비용, 가산금 수입 상세 정보를 바탕으로 장기요양급여수입(목 611), 가산금 수입(목 612)에 세목을 신설하여 처리하여야 한다.<\/div><div class=\"ln note\">※세목신설을 위한 구체적인 장기요양급여수입, 가산금 수입 정보는 「장기요양정보시스템 종사자 인건비 지출내역 신고」 화면을 참조<\/div><div class=\"ln p\">&lt;세목 신설 예시&gt;<\/div><table class=\"htbl\"><tr><td colspan=\"2\">관<\/td><td colspan=\"2\">항<\/td><td colspan=\"2\">목<\/td><td colspan=\"2\">세목<\/td><\/tr><tr><td rowspan=\"4\">06<\/td><td rowspan=\"4\">요양급여수입<\/td><td rowspan=\"4\">61<\/td><td rowspan=\"4\">요양급여수입<\/td><td rowspan=\"2\">611<\/td><td rowspan=\"2\">장기요양 급여수입<\/td><td>6111<\/td><td>A<\/td><\/tr><tr><td>6112<\/td><td>B<\/td><\/tr><tr><td rowspan=\"2\">612<\/td><td rowspan=\"2\">가산금 수입<\/td><td>6122<\/td><td>C<\/td><\/tr><tr><td>6123<\/td><td>D<\/td><\/tr><\/table><div class=\"ln p\">&lt;장기요양정보시스템 종사자 인건비 지출내역 신고 화면 구성 및 회계입력 값 예시&gt;<\/div><table class=\"htbl\"><tr><td colspan=\"2\">① 장기요양급여비용<br>(②+③+④)<\/td><td colspan=\"2\">② 공단부담금 중 인건비 비율 반영 금액<\/td><td colspan=\"2\">③ 공단부담금 중 인건비 비율 미반영 금액<\/td><td colspan=\"2\">④ 본인부담금<\/td><\/tr><tr><td>급여<br>비용<\/td><td>가산금<\/td><td>급여<br>비용<\/td><td>가산금<\/td><td>급여<br>비용<\/td><td>가산금<\/td><td>급여<br>비용<\/td><td>가산금<\/td><\/tr><tr><td><\/td><td><\/td><td>A입력<\/td><td>C입력<\/td><td>B 입력<\/td><td>D입력<\/td><td><\/td><td><\/td><\/tr><\/table><div class=\"ln p\">3. 주의 사항<\/div><div class=\"pchip\" id=\"p139\"><span>원문 139쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=151\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">&lt;장기요양정보시스템 종사자 인건비 지출내역 신고&gt; 화면에서 제공하는 급여비용(가산금 포함) 정보는 기관의 착오청구로 인한 급여비용(가산금 포함) 변동사항을 반영함<\/div><div class=\"ln p\">장기요양기관은 착오청구로 인해 급여비용 또는 가산금 수입에 변동이 있을 경우 이를 회계상에 반영하여야 하며, 회계연도 마감 후 결산보고 시 반드시 회계연도 기간 중에 발생한 급여비용 변동사항이 정확하게 반영되어 있는지 확인해야 함<\/div><div class=\"ln note\">※직전 회계연도 기간의 급여비용 변동사항은 익년 2월말을 기준으로 최종 확정<\/div><div class=\"ln h2\"><span class=\"badge\">3<\/span>결 산<\/div>", "pages": [{"p": 133, "t": "가\n예산의 편성\n1) 예산총계주의 원칙\n1회계연도의 모든 수입은 세입으로 하고 모든 지출은 세출로 하되, 세입과 세출은 모두 예산에 계상하여야 함\n2) 예산편성절차\n※ 일정에 따른 예산편성, 제출 및 공개 철저\n3) 예산의 편성 방법 및 제출 서류\n별표1~별표10에 따른 세입･세출예산과목구분에 따라 편성\n‒각 지자체는 세입 및 세출예산과목의 세부 내역에 대하여 관련 규정 등에 위배되지 않게 별도의 지침으로 정하는 것을 원칙으로 함\n‒시설회계 세출예산(별표4) 편성시 법인회계로의 전출은 동일 법인에서 운영하는 타 시설 중 자연재해로 인한 개보수가 필요한 경우에 가능"}, {"p": 134, "t": "<비목 편성･지출 관련 참고사항>\n※법인･시설의 목적사업 운영에 필요한 비품구입비, 토지･건물･기타 자산의 취득을 위해 자산취득비 비목을 편성･지출할 수 있음\n*건물･토지, 차량, 대구모 기계･기구, 전산장비, 사무집기류, 물건의 성질 및 형상이 변하지 않고 비교적 장기간 사용할 수 있는 물품 구입(할부금 포함)\n※국가, 시･도, 시･군･구, 그 밖에 사회 복지사업 기금 등에서 받은 공모사업 선정으로 받은 보조금의 반환을 위해 반환금 비목을 편성･지출할 수 있음\n주  의"}, {"p": 135, "t": "재무회계규칙 [별표 2, 4, 6] 세출예산과목구분표 상 “인건비 항-기타후생경비 목”은 ‘직원의 건강진단비 및 기타복리후생에 소요되는 비용’으로, 법인(시설) 직원의 업무수행과 직접 관련하여 지급된 현물･서비스(건강검진비, 치료비 등) 성격으로 봄 따라서 명절･생일선물 구입비, 격려 만찬 회식비, 경조사비 등은 소속 직원에게 보탬이 되도록 기관 명의로 집행하는 ‘경비’를 일반적으로 의미하므로, 그 내역에 따라 “업무추진비 항-기관운영비 목”으로 편성하는 것이 적절함 다만, 직원에게 지급하는 포상금, 격려금 등은 그 세부 내역에 따라 “업무추진비 항-기관운영비 목” 또는 “운영비 항-기타운영비 목”으로 편성할 수 있으므로, 구체적인 예산편성에 대해서는 각 지자체의 지침으로 정하는 것을 원칙으로 함 ※비지정후원금은 간접비 중에서 업무추진비(기관운영비, 직책보조비, 회의비) 등으로의 사용을 금지하므로, 후원금의 부적정 사용에 주의할 것(「2024 사회복지법인･시설 현지조사 사례집」 p.144 참고)\n예산에 첨부할 서류는 ① 예산총칙 ② 세입･세출명세서 ③ 추정재무상태표 ④ 추정수지계산서 ⑤ 임직원 보수 일람표 ⑥ 예산을 의결한 이사회 회의록 또는 예산을 보고받은 시설운영위원회 회의록\n‒다만, 단식부기인 경우 ①, ②, ⑤, ⑥만 첨부할 수 있고, 소규모시설(국가･지자체･법인 이외의 자가 설치･운영하는 시설 중 거주자 정원이나 일평균 이용자가 20인 이하인 시설)인 경우 ②, ⑥만 첨부할 수 있음(소규모시설인 노인장기요양기관은 ②, ⑤, ⑥만 첨부할 수 있음(2020.1.7.시행))\n‒어린이집은 보육사업안내에서 정하는 바에 따름\n나\n준예산의 편성\n1)사유：회계연도 개시 전까지 법인의 예산이 성립되지 아니한 때\n2)방법：예산 성립 시까지 일부 경비에 대해 전년도 예산에 준하여 집행 가능\n‒임직원 보수, 법인 및 시설운영에 직접 사용되는 필수적인 경비, 법령상 지급의무가 있는 경비에 대해 집행\n※법인의 대표이사 및 시설의 장은 준예산 편성 전에 시･군･구청장에게 사유를 보고할 것"}, {"p": 136, "t": "다\n추가경정 예산의 편성\n1)사유：예산 성립 후에 생긴 사유로 인해 기 성립된 예산에 변경을 가할 필요가 있을 경우\n2)방법：예산편성절차에 준하여 추가경정예산을 편성･확정\n‒이 경우 노인장기요양기관의 장은 「노인장기요양보험법」 제38조제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함\n※법인의 대표이사 및 시설의 장은 추경이 확정된 날로부터 7일 이내에 이를 시･군･구청장에게 제출할 것\n라\n예비비의 계상\n법인의 대표이사 및 시설의 장은 예측할 수 없는 예산외의 지출 또는 예산의 초과지출에 충당하기 위하여 예비비를 세출예산에 계상할 수 있음\n마\n예산의 목적 외 사용금지\n법인회계 및 시설회계의 예산은 세출예산이 정한 목적 외에 사용금지\n바\n예산의 전용\n1)관간 전용 및 동일 관내 항간 전용：법인 이사회의 의결 또는 사회복지시설 운영위원회에 보고를 거쳐 전용(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 전용)\n2)동일 항내 목간 전용：법인 대표이사 및 시설의 장이 전용 가능\n3)전용의 제한：예산총칙에서 전용을 제한하고 있거나, 예산 심의 과정에서 삭감한 관･항･목으로는 전용하지 못함"}, {"p": 137, "t": "‒노인장기요양기관의 장은 예산을 전용하는 때에는 「노인장기요양보험법」 제38조 제4항에 따라 장기요양급여비용 중 그 일부를 보건복지부장관이 정하여 고시하는 비율에 따라 인건비로 편성하여야 함\n4)전용에 대한 보고：관･항 전용의 경우에는 관할 시장･군수･구청장에게 과목 전용조서 제출(결산 보고시에 첨부)\n※보조금을 받는 법인･시설의 경우, 타 법령 또는 보조금 지원 기준 등에 따라 보조금 지원 주체가 예산 전용을 제한할 수 있으므로 해당 법인 및 시설은 이에 따라야 함 (전용을 하는 경우 사전에 보조금을 지원하는 지자체와 협의할 것\n사\n세출예산의 이월\n1)사유：세출예산 중 성질상 당해 회계연도 안에 지출을 마치지 못할 것으로 예측되는 경비 및 연도 내에 지출원인행위를 하고 불가피한 사유로 인하여 연도 내에 지출하지 못한 경비\n2)방법：법인 이사회의 의결 또는 시설 운영위원회 보고를 거쳐 다음 연도에 이월 사용 가능(법인 산하 시설의 경우 운영위원회 보고 후 이사회 의결을 통해 이월)\n아\n특정목적사업 예산\n1)사유：완성에 수년을 요하는 공사나 제조 또는 특수한 사업을 위하여 2회계연도 이상에 걸쳐서 그 재원을 조달할 필요가 있는 경우\n2)방법：회계연도마다 일정액을 예산에 계상하여 특정목적사업을 위한 적립금으로 적립 가능\n※적립금은 별도의 통장으로 관리할 것\n3)절차：적립금의 적립 및 사용계획 등을 시장･군수･구청장에 사전에 보고\n※시･군･구에서 보고 시기, 보고 방법 등을 별도로 정하는 것을 원칙으로 하며, 별도로 규정하는 사항이 없다면 예산을 제출할 때 적립금의 적립 및 사용계획서를 제출함으로써 보고하고, 사용계획에 변동이 있을 경우에는 즉시 변동 보고를 할 것\n장기요양기관 재무회계규칙 세부지침\n1. 목적"}, {"p": 138, "t": "장기요양기관이 재무회계규칙에 따른 세입처리를 함에 있어 국민건강보험공단으로부터 지급받은 급여비용의 성격에 따라 세목을 구분하도록 하고,\n이를 통해 장기요양기관이 노인장기요양보험법 제38조제6항에 따른 인건비 지출비율 준수 현황을 정확하게 확인할 수 있도록 하기 위함임\n2. 주요 내용\n장기요양기관은 국민건강보험공단으로부터 제공받은 급여비용, 가산금 수입 상세 정보를 바탕으로 장기요양급여수입(목 611), 가산금 수입(목 612)에 세목을 신설하여 처리하여야 한다.\n※세목신설을 위한 구체적인 장기요양급여수입, 가산금 수입 정보는 「장기요양정보시스템 종사자 인건비 지출내역 신고」 화면을 참조\n<세목 신설 예시>\n관 | 항 | 목 | 세목\n06 | 요양급여수입 | 61 | 요양급여수입 | 611 | 장기요양 급여수입 | 6111 | A\n6112 | B\n612 | 가산금 수입 | 6122 | C\n6123 | D\n<장기요양정보시스템 종사자 인건비 지출내역 신고 화면 구성 및 회계입력 값 예시>\n① 장기요양급여비용 (②+③+④) | ② 공단부담금 중 인건비 비율 반영 금액 | ③ 공단부담금 중 인건비 비율 미반영 금액 | ④ 본인부담금\n급여 비용 | 가산금 | 급여 비용 | 가산금 | 급여 비용 | 가산금 | 급여 비용 | 가산금\n |  | A입력 | C입력 | B 입력 | D입력 |  | \n3. 주의 사항"}, {"p": 139, "t": "<장기요양정보시스템 종사자 인건비 지출내역 신고> 화면에서 제공하는 급여비용(가산금 포함) 정보는 기관의 착오청구로 인한 급여비용(가산금 포함) 변동사항을 반영함\n장기요양기관은 착오청구로 인해 급여비용 또는 가산금 수입에 변동이 있을 경우 이를 회계상에 반영하여야 하며, 회계연도 마감 후 결산보고 시 반드시 회계연도 기간 중에 발생한 급여비용 변동사항이 정확하게 반영되어 있는지 확인해야 함\n※직전 회계연도 기간의 급여비용 변동사항은 익년 2월말을 기준으로 최종 확정\n3\n결 산"}]}, {"title": "3. 결산", "start": 140, "end": 141, "html": "<div class=\"pchip\" id=\"p140\"><span>원문 140쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=152\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">결산보고절차<\/div><div class=\"ln note\">※ 일정에 따른 결산보고서 제출 및 공개업무 철저<\/div><div class=\"pchip\" id=\"p141\"><span>원문 141쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=153\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">결산보고서에 첨부하여야 할 서류<\/div><div class=\"ln h4\">1) 세입･세출 결산서<\/div><div class=\"ln h4\">2) 과목전용조서<\/div><div class=\"ln h4\">3) 예비비사용조서<\/div><div class=\"ln h4\">4) 재무상태표<\/div><div class=\"ln h4\">5) 수지계산서<\/div><div class=\"ln h4\">6) 현금 및 예금명세서<\/div><div class=\"ln h4\">7) 유가증권명세서<\/div><div class=\"ln h4\">8) 미수금 명세서<\/div><div class=\"ln h4\">9) 재고자산명세서<\/div><div class=\"ln h4\">10) 그 밖의 유동자산명세서(6~9 유동자산외의 유동자산)<\/div><div class=\"ln h4\">11) 고정자산(토지 건물 차량운반구 비품 전화가입권)명세서<\/div><div class=\"ln h4\">12) 부채명세서(차입금, 미지급금 포함)<\/div><div class=\"ln h4\">13) 각종 충당금 명세서<\/div><div class=\"ln h4\">14) 기본재산수입명세서(법인만 해당)<\/div><div class=\"ln h4\">15) 사업수입명세서<\/div><div class=\"ln h4\">16) 정부보조금명세서<\/div><div class=\"ln h4\">17) 후원금 수입명세 및 사용결과보고서(전산파일을 포함한다)<\/div><div class=\"ln h4\">18) 후원금 전용계좌의 입출금내역<\/div><div class=\"ln h4\">19) 인건비명세서<\/div><div class=\"ln h4\">20) 사업비명세서<\/div><div class=\"ln h4\">21) 그 밖의 비용명세서(인건비 및 사업비를 제외한 비용)<\/div><div class=\"ln h4\">22) 감사보고서<\/div><div class=\"ln h4\">23) 법인세 신고서(수익사업이 있는 경우만 해당함)<\/div><div class=\"ln note\">※단식부기로 회계를 처리하는 경우 1∼3, 14∼23호 서류만을 첨부할 수 있고, 소규모시설의 경우 1, 17호 서류(노인장기요양기관의 경우에는 1∼3, 16∼21호 서류) 만을 첨부할 수 있으며, 어린이집은 보육사업안내에서 별도로 정함<\/div><div class=\"ln p\">→밑줄의 장기요양기관 관련 개정사항은 2020년 결산보고서를 제출하는 경우부터 적용(2020.1.7.개정)<\/div><div class=\"ln h2\"><span class=\"badge\">4<\/span>회 계<\/div><div class=\"ln p\">가<\/div><div class=\"ln p\">회계 총칙<\/div>", "pages": [{"p": 140, "t": "가\n결산보고절차\n※ 일정에 따른 결산보고서 제출 및 공개업무 철저"}, {"p": 141, "t": "나\n결산보고서에 첨부하여야 할 서류\n1) 세입･세출 결산서\n2) 과목전용조서\n3) 예비비사용조서\n4) 재무상태표\n5) 수지계산서\n6) 현금 및 예금명세서\n7) 유가증권명세서\n8) 미수금 명세서\n9) 재고자산명세서\n10) 그 밖의 유동자산명세서(6~9 유동자산외의 유동자산)\n11) 고정자산(토지 건물 차량운반구 비품 전화가입권)명세서\n12) 부채명세서(차입금, 미지급금 포함)\n13) 각종 충당금 명세서\n14) 기본재산수입명세서(법인만 해당)\n15) 사업수입명세서\n16) 정부보조금명세서\n17) 후원금 수입명세 및 사용결과보고서(전산파일을 포함한다)\n18) 후원금 전용계좌의 입출금내역\n19) 인건비명세서\n20) 사업비명세서\n21) 그 밖의 비용명세서(인건비 및 사업비를 제외한 비용)\n22) 감사보고서\n23) 법인세 신고서(수익사업이 있는 경우만 해당함)\n※단식부기로 회계를 처리하는 경우 1∼3, 14∼23호 서류만을 첨부할 수 있고, 소규모시설의 경우 1, 17호 서류(노인장기요양기관의 경우에는 1∼3, 16∼21호 서류) 만을 첨부할 수 있으며, 어린이집은 보육사업안내에서 별도로 정함\n→밑줄의 장기요양기관 관련 개정사항은 2020년 결산보고서를 제출하는 경우부터 적용(2020.1.7.개정)\n4\n회 계\n가\n회계 총칙"}]}, {"title": "4. 회계", "start": 142, "end": 144, "html": "<div class=\"pchip\" id=\"p142\"><span>원문 142쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=154\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">1) 수입 및 지출사무 관리주체：법인의 대표이사 및 시설의 장<\/div><div class=\"ln note\">※ 법인 대표이사 및 시설장은 해당 사무를 소속직원에게 “각각” 위임가능<\/div><div class=\"ln h4\">2) 수입과 지출의 집행기관<\/div><div class=\"ln p\">법인과 시설에는 수입과 지출의 현금출납업무를 담당하기 위하여 “각각” 수입원과 지출원을 두되, 법인 또는 시설의 규모가 소규모인 경우에는 수입원과 지출원을 동일인으로 할 수 있음<\/div><div class=\"ln note\">※시･도별로 지역여건에 따라 자체적으로 수입원과 지출원을 동일인으로 할 수 있는 소규모 법인 및 시설에 대해 규정할 것<\/div><div class=\"ln p\">수입원과 지출원은 법인의 대표이사와 시설장이 임면함<\/div><div class=\"ln h4\">3) 회계의 방법：단식부기로 하되, 법인･수익사업회계는 복식부기 가능<\/div><div class=\"ln h4\">4) 법인 및 시설 비치 회계장부：① 현금출납부 ② 총계정원장 ③ 재산대장 ④ 비품관리대장<\/div><div class=\"ln note\">※컴퓨터 회계프로그램 또는 사회서비스정보시스템(희망이음) 및 사회복지시설정보시스템 등에 따라 전자장부를 사용하는 경우에는 회계장부를 둔 것으로 봄. 다만, 회계감독 등을 위해 지방자치단체에서 요청하는 경우에는 출력물 보관 필요<\/div><div class=\"ln p\">노인장기요양기관의 장이 제10조에 따른 예산을 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도 1월부터 6월까지의 회계장부)을 해당 회계연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함<\/div><div class=\"ln p\">*<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">2020년도 예산보고서를 2019.12.26.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출<\/div><div class=\"ln p\">노인장기요양기관의 장이 제19조에 따른 결산보고서를 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도의 다음연도 1월부터 6월까지의 회계장부)을 해당 회계연도의 다음연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함<\/div><div class=\"pchip\" id=\"p143\"><span>원문 143쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=155\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln p\">*<\/div><div class=\"ln p\">예시<\/div><div class=\"ln p\">2019년도 결산보고서를 2020.3.31.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출<\/div><div class=\"ln p\">나<\/div><div class=\"ln p\">수입<\/div><div class=\"ln h4\">1) 수입금의 수납 관리<\/div><div class=\"ln p\">모든 수입금의 수납은 이를 금융기관에 취급시키는 경우를 제외하고는 수입원이 아니면 수납하지 못함<\/div><div class=\"ln p\">수입원이 수납한 수입금은 그 다음날까지 금융기관에 예입해야 함<\/div><div class=\"ln p\">수입금에 대한 금융기관의 거래통장은 회계별(법인회계, 시설회계, 수익사업회계)로 구분될 수 있도록 보관･관리<\/div><div class=\"ln h4\">2) 과년도 수입, 반납금, 과오납금 처리<\/div><div class=\"ln p\">출납 완결 연도에 속하는 수입 기타 예산외 수입은 모두 현년도 예산에 편입<\/div><div class=\"ln p\">지출된 세출의 반납금은 각각 지출한 세출의 당해 과목에 다시 넣을 수 있음<\/div><div class=\"ln p\">과오납된 수입금은 수입한 세입에서 직접 반환<\/div><div class=\"ln p\">다<\/div><div class=\"ln p\">지출<\/div><div class=\"ln h4\">1) 지출의 원칙<\/div><div class=\"ln p\">지출은 지출사무를 관리하는 자(대표이사, 시설장) 및 그 위임을 받아 지출명령(예산 범위 내에서)이 있는 것에 한하여 지출원이 행함<\/div><div class=\"ln p\">지출은 상용의 경비 또는 소액의 경비지출을 제외하고는 예금통장에 의하거나 전자거래로 행함<\/div><div class=\"ln note\">※상용 경비 또는 소액의 경비 지출은 현금으로 가능하며 이를 위해 지출원은 100만원 이하의 현금을 보관할 수 있으며, 상용경비 또는 소액의 경비 지출의 범위는 시･도지사가 자체적으로 정함<\/div><div class=\"ln note\">※ 상용경비 또는 소액의 경비 지출 시에도 영수증 등 증빙 서류 관리 철저<\/div><div class=\"pchip\" id=\"p144\"><span>원문 144쪽<\/span> <a class=\"pdflink\" href=\"manage2026.pdf#page=156\" target=\"_blank\" rel=\"noopener\" title=\"원문 PDF 해당 쪽을 새 탭에서 엽니다(PC에서 정확 이동).\">원문 PDF ↗<\/a><\/div><div class=\"ln h4\">2) 지출의 특례(선금지급, 추산지급)<\/div><div class=\"ln p\">선금지급을 할 수 있는 경비의 범위<\/div><div class=\"ln p\">가)외국에서 직접 구입하는 기계, 도서, 표본 또는 실험용재료의 대가<\/div><div class=\"ln p\">나)정기간행물의 대가<\/div><div class=\"ln p\">다)토지 또는 가옥의 임대료와 용선료<\/div><div class=\"ln p\">라)운 임<\/div><div class=\"ln p\">마)소속직원중 특별한 사정이 있는 자에 대하여 지급하는 급여의 일부<\/div><div class=\"ln p\">바)관공서(정부투자기관관리기본법에 의한 정부투자기관 및 특별법에 의하여 설립된 특수법인 포함)에 대하여 지급하는 경비<\/div><div class=\"ln p\">사)외국에서 연구 또는 조사에 종사하는 자에 대하여 지급하는 경비<\/div><div class=\"ln p\">아)보조금<\/div><div class=\"ln p\">자)사례금<\/div><div class=\"ln p\">차)계약금액이 1천만원 이상인 공사나 제조 또는 물건의 매입을 하는 경우에 계약금액의 100분의 50을 초과하지 아니하는 금액<\/div><div class=\"ln p\">추산지급을 할 수 있는 경비의 범위<\/div><div class=\"ln note\">※추산지급이란 지출금액이 미확정인 채무에 대하여 지급의무가 확정되기 전에 추산(推算：짐작으로 미루어 셈함)으로 지급하는 것을 의미함<\/div><div class=\"ln p\">가)여비 및 판공비<\/div><div class=\"ln p\">나)관공서에 대하여 지급하는 경비<\/div><div class=\"ln p\">다)보조금<\/div><div class=\"ln p\">라)소송비용<\/div><div class=\"ln p\">라<\/div><div class=\"ln p\">계약<\/div><div class=\"ln p\">계약에 관한 사항은 「지방자치단체를 당사자로 하는 계약에 관한 법률」, 동법 시행령 및 동법 시행규칙을 준용하여 처리함<\/div><div class=\"ln note\">※다만, 국가･지방자치단체･사회복지법인 이외의 주체가 설치･운영하는 시설은 그러하지 아니함<\/div><div class=\"ln h2\"><span class=\"badge\">5<\/span>물 품<\/div>", "pages": [{"p": 142, "t": "1) 수입 및 지출사무 관리주체：법인의 대표이사 및 시설의 장\n※ 법인 대표이사 및 시설장은 해당 사무를 소속직원에게 “각각” 위임가능\n2) 수입과 지출의 집행기관\n법인과 시설에는 수입과 지출의 현금출납업무를 담당하기 위하여 “각각” 수입원과 지출원을 두되, 법인 또는 시설의 규모가 소규모인 경우에는 수입원과 지출원을 동일인으로 할 수 있음\n※시･도별로 지역여건에 따라 자체적으로 수입원과 지출원을 동일인으로 할 수 있는 소규모 법인 및 시설에 대해 규정할 것\n수입원과 지출원은 법인의 대표이사와 시설장이 임면함\n3) 회계의 방법：단식부기로 하되, 법인･수익사업회계는 복식부기 가능\n4) 법인 및 시설 비치 회계장부：① 현금출납부 ② 총계정원장 ③ 재산대장 ④ 비품관리대장\n※컴퓨터 회계프로그램 또는 사회서비스정보시스템(희망이음) 및 사회복지시설정보시스템 등에 따라 전자장부를 사용하는 경우에는 회계장부를 둔 것으로 봄. 다만, 회계감독 등을 위해 지방자치단체에서 요청하는 경우에는 출력물 보관 필요\n노인장기요양기관의 장이 제10조에 따른 예산을 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도 1월부터 6월까지의 회계장부)을 해당 회계연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함\n*\n예시\n2020년도 예산보고서를 2019.12.26.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출\n노인장기요양기관의 장이 제19조에 따른 결산보고서를 기한 내에 제출하지 않은 경우에는 ‘현금출납부 및 총계정원장’(해당 회계연도의 다음연도 1월부터 6월까지의 회계장부)을 해당 회계연도의 다음연도 8월 15일까지 시장･군수･구청장에게 정보시스템을 사용하여 제출해야 함"}, {"p": 143, "t": "*\n예시\n2019년도 결산보고서를 2020.3.31.까지 미 제출한 경우, 2020년도 1월부터 6월까지의 회계장부를 2020년도 8월 15일까지 제출\n나\n수입\n1) 수입금의 수납 관리\n모든 수입금의 수납은 이를 금융기관에 취급시키는 경우를 제외하고는 수입원이 아니면 수납하지 못함\n수입원이 수납한 수입금은 그 다음날까지 금융기관에 예입해야 함\n수입금에 대한 금융기관의 거래통장은 회계별(법인회계, 시설회계, 수익사업회계)로 구분될 수 있도록 보관･관리\n2) 과년도 수입, 반납금, 과오납금 처리\n출납 완결 연도에 속하는 수입 기타 예산외 수입은 모두 현년도 예산에 편입\n지출된 세출의 반납금은 각각 지출한 세출의 당해 과목에 다시 넣을 수 있음\n과오납된 수입금은 수입한 세입에서 직접 반환\n다\n지출\n1) 지출의 원칙\n지출은 지출사무를 관리하는 자(대표이사, 시설장) 및 그 위임을 받아 지출명령(예산 범위 내에서)이 있는 것에 한하여 지출원이 행함\n지출은 상용의 경비 또는 소액의 경비지출을 제외하고는
